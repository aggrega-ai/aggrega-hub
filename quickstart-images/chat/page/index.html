<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Aggrega quickstart · Chat with your agent</title>
  <link rel="icon" href="/page/favicon.ico">
  <link rel="stylesheet" href="/page/tokens.css">
  <link rel="stylesheet" href="/page/chat.css">
  <script src="/page/chat.js" defer></script>
</head>
<body data-thread-pattern="{{.ThreadPattern}}">
  <header>
    <div class="title">
      <img src="/page/wordmark-light.svg" alt="Aggrega" height="28">
      <h1>Chat with your agent</h1>
    </div>
    <p class="subtitle">{{.Subtitle}}</p>
  </header>

  <main>
    <ol id="messages" aria-live="polite"></ol>
    <p id="empty" class="hint">Say something to start. The agent keeps the conversation, so a reload continues it.</p>
  </main>

  <footer>
    <form id="ask">
      <label for="message" class="visually-hidden">Your message</label>
      <textarea id="message" rows="2" placeholder="Ask the agent something" required></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="hint">
      Conversation <code id="thread"></code>
      <button type="button" id="new" class="link">Start a new conversation</button>
    </p>
  </footer>
</body>
</html>
