<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Aggrega quickstart &middot; Your web app and its database</title>
  <link rel="icon" href="/page/favicon.ico">
  <link rel="stylesheet" href="/page/tokens.css">
  <link rel="stylesheet" href="/page/notes.css">
  <script src="/page/notes.js" defer></script>
</head>
<body>
  <header>
    <div class="title">
      <img src="/page/wordmark-light.svg" alt="Aggrega" height="28">
      <h1>Your web app and its database</h1>
    </div>
    <dl id="connection" class="subtitle">
      <dt>Database</dt>
      <dd id="database">asking the app...</dd>
      <dt>Cache</dt>
      <dd id="cache">asking the app...</dd>
    </dl>
    <p id="cache-note" class="subtitle"></p>
  </header>

  <main>
    <form id="add">
      <label for="text">Add a note</label>
      <div class="row">
        <textarea id="text" rows="2" placeholder="Write a short note" required></textarea>
        <button type="submit" id="save">Add note</button>
      </div>
    </form>
    <p id="status" class="hint" aria-live="polite"></p>

    <section>
      <div class="section-title">
        <h2>Notes</h2>
        <button type="button" id="refresh" class="link">Refresh</button>
      </div>
      <p class="hint">The most recent notes, newest first, as PostgreSQL holds them. Read a note to see where that read
        comes from.</p>
      <ol id="notes"></ol>
      <p id="empty" class="hint" hidden>No notes yet. Add one above.</p>
    </section>
  </main>
</body>
</html>
