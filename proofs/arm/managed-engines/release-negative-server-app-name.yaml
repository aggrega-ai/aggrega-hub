# A component whose name is longer than the 60 characters App Service takes for
# an app's name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-app-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server-app-name.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront-serving-every-catalog-region-the-shop-sells-goods-in:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
