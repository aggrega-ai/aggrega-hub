# core/random-password on the root_password slot, bound in the Manifest to the
# FeatureRecipe that draws a password with Terraform's random provider: a
# password the target draws, where the flexible server takes a Key Vault
# secret's reference.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-random-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-negative-random-password.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
          infra:
            storage:
              size: 20Gi
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
