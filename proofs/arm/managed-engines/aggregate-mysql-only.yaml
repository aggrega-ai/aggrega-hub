apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql-only
  version: "1.0.0"
  description: >
    A MySQL database alone, for the Releases that prove what the flexible
    server's Recipe refuses on its own.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
