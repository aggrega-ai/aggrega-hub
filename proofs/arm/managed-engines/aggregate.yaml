apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: managed-engines
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server and a chat model on Azure
    OpenAI, which the compute components of the same template reach at the
    addresses they publish.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    chat-model:
      type: core/ai-model/azure-openai
      values:
        model: gpt-4o-mini
        deployment_name: chat
