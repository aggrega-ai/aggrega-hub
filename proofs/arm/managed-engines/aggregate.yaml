apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: managed-engines
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server, a chat model on Azure
    OpenAI, and a server on App Service reading the addresses both publish, so
    the server's app settings show the expression a consumer in the same
    template receives.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    chat-model:
      type: core/ai-model/azure-openai
      values:
        model: gpt-4o-mini
        deployment_name: chat

    storefront:
      type: core/compute/server
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
                - in: CATALOG_DB_PORT
                  from: port
        chat:
          chat-model:
            target: chat-model
            inject:
              env:
                - in: CHAT_ENDPOINT
                  from: endpoint
                - in: CHAT_MODEL
                  from: model
