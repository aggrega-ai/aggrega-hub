apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-server-setting-reserved
  version: "1.0.0"
  description: >
    A server on App Service whose own inject block names a variable App
    Service reads itself.
spec:
  components:
    storefront:
      type: core/compute/server
      inject:
        env:
          - in: WEBSITES_PORT
            value: "9000"
