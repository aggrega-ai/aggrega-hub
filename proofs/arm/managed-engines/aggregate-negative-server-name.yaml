apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-server-name
  version: "1.0.0"
  description: >
    A MySQL database whose component name is shorter than the 3 characters a
    flexible server's name takes.
spec:
  components:
    db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
