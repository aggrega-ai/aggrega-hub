apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-user-unset
  version: "1.0.0"
  description: >
    A MySQL database whose values name no user, so the flexible server has no
    administrator login to create.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
