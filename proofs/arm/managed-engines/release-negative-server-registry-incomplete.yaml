# A registry_server with neither a registry_identity nor the three keys of a
# user name and password.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-registry-incomplete
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              registry_server: example.azurecr.io
