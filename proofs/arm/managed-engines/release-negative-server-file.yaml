# The component's own inject block dictating a file, which App Service cannot
# write into a container.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-file
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server-file.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
        catalog-db:
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 20Gi
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
