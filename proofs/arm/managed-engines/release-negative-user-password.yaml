# A credential attached to the user_password slot, which the Recipe does not
# create.
#
# Two refusals of this Recipe's credentials are reached by no Release, so no
# negative holds them: the root_password slot left empty, which the Component
# requires and the build halts on before the Recipe reads it; and, in the
# mapping, an attachment that publishes no Key Vault secret resource ID, since
# arm/key-vault-secret refuses a secret whose origin is no such ID before the
# Recipe reads what it publishes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-user-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
            user_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 20Gi
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
