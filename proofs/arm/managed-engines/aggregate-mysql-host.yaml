apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql-host
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server and a worker reading the
    address it publishes, so the worker's environment shows the address a
    consumer receives.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    indexer:
      type: core/compute/worker
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
                - in: CATALOG_DB_PORT
                  from: port
