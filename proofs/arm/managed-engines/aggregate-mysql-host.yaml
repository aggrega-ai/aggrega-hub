apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql-host
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server, and a server on App Service
    and a scheduled task on Container Apps reading the address it publishes,
    so the server's app settings and the task's environment show the address
    a consumer receives.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    storefront:
      type: core/compute/server
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
                - in: CATALOG_DB_PORT
                  from: port

    nightly-export:
      type: core/compute/task
      values:
        schedule: "0 3 * * *"
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
