apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-runtime-name
  version: "1.0.0"
  description: >
    A connection dictating FUNCTION_RUNTIME to a function on Azure Functions,
    the name its runtime value reaches the container under by default.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    order-events:
      type: core/compute/function
      values:
        runtime: python
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: FUNCTION_RUNTIME
                  from: host
