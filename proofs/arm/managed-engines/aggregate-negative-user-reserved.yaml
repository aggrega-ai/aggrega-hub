apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-user-reserved
  version: "1.0.0"
  description: >
    A MySQL database whose user is a login the service refuses for its
    administrator.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: admin
