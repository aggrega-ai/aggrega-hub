apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: managed-engines
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: MySQL bound to the
    flexible server, whose root_password slot holds core/referenced-secret
    bound to the FeatureRecipe that points at a Key Vault secret, the chat
    model bound to Azure OpenAI, the generic server bound to its App Service
    Recipe, the generic task bound to its Container Apps job Recipe, and the
    generic function bound to its Azure Functions Recipe. No FeatureRecipe
    here binds core/backup, which no realization on this capability offers.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql:1.0.0: arm/mysql-flexible-server:1.0.0
        core/ai-model/azure-openai:1.0.0: arm/azure-openai:1.0.0
        core/compute/server:1.1.0: arm/server-app-service:1.0.0
        core/compute/task:1.0.1: arm/task-container-apps:1.0.0
        core/compute/function:1.0.0: arm/function-azure-functions:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
