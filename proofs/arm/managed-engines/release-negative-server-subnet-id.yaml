# A virtual_network_subnet_id that is no subnet's resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-subnet-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              virtual_network_subnet_id: example-subnet
