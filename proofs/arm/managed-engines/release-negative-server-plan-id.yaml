# A service_plan_id that is no App Service plan's resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-plan-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: example-plan
