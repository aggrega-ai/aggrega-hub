apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-task-manual-trigger
  version: "1.0.0"
  description: >
    A task with no schedule carrying core/manual-trigger, which the Manifest
    binds to no FeatureRecipe for arm.
spec:
  components:
    reindex:
      type: core/compute/task
      features:
        on_demand:
          type: core/manual-trigger
