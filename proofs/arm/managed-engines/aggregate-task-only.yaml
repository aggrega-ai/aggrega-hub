apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: task-only
  version: "1.0.0"
  description: >
    A scheduled task alone, for the Releases that prove what the Container
    Apps job Recipe refuses on its own.
spec:
  components:
    nightly-export:
      type: core/compute/task
      values:
        schedule: "0 3 * * *"
