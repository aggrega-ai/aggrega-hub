# An App Service plan the Release does not name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-placement
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              location: westeurope
