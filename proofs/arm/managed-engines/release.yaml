apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: managed-engines
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and a reference the database or the model publishes resolves inside the
    # template. The database server sits in availability zone 1 and sets one
    # server parameter. The App Service app joins an integration subnet and
    # pulls its image with a user-assigned identity, which is also the one its
    # code calls Azure with; resource_group_name is written for it as the
    # Terraform sibling requires, and renders nothing here.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnets, private DNS zone, Key Vault and its secret, App Service
    # plan, managed identity and container registry stand for ones the
    # operator already has.
    azure:
      directory: main
      components:
        catalog-db:
          # The administrator's password is a Key Vault secret the operator
          # created; the template carries a Key Vault reference to it.
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 20Gi
            overrides:
              location: westeurope
              zone: "1"
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              server_configuration:
                slow_query_log:
                  name: slow_query_log
                  config: "ON"
              tags:
                environment: production

        chat-model:
          infra:
            overrides:
              location: westeurope
              custom_subdomain_name: example-chat

        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              virtual_network_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-apps
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
