apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: managed-engines
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and a reference the database or the model publishes resolves inside the
    # template. The server sits in availability zone 1 and sets one server
    # parameter.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Key Vault and its secret stand for
    # ones the operator already has.
    azure:
      directory: main
      components:
        catalog-db:
          # The administrator's password is a Key Vault secret the operator
          # created; the template carries a Key Vault reference to it.
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 20Gi
            overrides:
              location: westeurope
              zone: "1"
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              server_configuration:
                slow_query_log:
                  name: slow_query_log
                  config: "ON"
              tags:
                environment: production

        chat-model:
          infra:
            overrides:
              location: westeurope
              custom_subdomain_name: example-chat
