apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-setting-name
  version: "1.0.0"
  description: >
    A function on Azure Functions whose own inject block names a variable
    with a hyphen, which App Service does not take as an app setting name.
spec:
  components:
    order-events:
      type: core/compute/function
      values:
        runtime: python
      inject:
        env:
          - in: ORDER-REGION
            value: westeurope
