# An infra.overrides key the Container Apps job Recipe does not read: the
# replica timeout's key misspelt.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-task-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-task-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        nightly-export:
          infra:
            image: example.azurecr.io/example/nightly-export:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              replica_timeout_seconds: 2700
