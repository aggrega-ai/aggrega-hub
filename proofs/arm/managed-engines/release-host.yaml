apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-host.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The operator names the server in infra.overrides.host, so the worker's
    # CATALOG_DB_HOST carries that name in place of the expression reading
    # the module's fqdn output. The server runs with zone-redundant high
    # availability.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Key Vault and its secret, managed
    # identity, container registry, Container Apps environment and
    # example.com name stand for ones the operator already has.
    azure:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 32Gi
            ha:
              enabled: true
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              host: catalog-db.example.com

        indexer:
          infra:
            image: example.azurecr.io/example/indexer:1.0.0
            replicas: 1
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
