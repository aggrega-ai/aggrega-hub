apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-host.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The operator names the database server in infra.overrides.host, so the
    # App Service app's and the task's CATALOG_DB_HOST carry that name in
    # place of the expression reading the module's fqdn output. The task's job
    # keeps the 30 minutes it takes by default. The database server runs
    # with zone-redundant high availability. The app pulls its image with a
    # user name and a password read from Key Vault.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Key Vault and its secrets, App
    # Service plan, Container Apps environment, managed identity, container
    # registry and example.com name stand for ones the operator already has.
    azure:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-db-password
          infra:
            storage:
              size: 32Gi
            ha:
              enabled: true
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              host: catalog-db.example.com

        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            port: 8000
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              registry_server: example.azurecr.io
              registry_username: example-pull
              registry_password_secret_id: https://example-vault.vault.azure.net/secrets/registry-password
              registry_password_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity

        nightly-export:
          infra:
            image: example.azurecr.io/example/nightly-export:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
