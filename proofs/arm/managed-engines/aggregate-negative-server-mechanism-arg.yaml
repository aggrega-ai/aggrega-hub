apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-server-mechanism-arg
  version: "1.0.0"
  description: >
    A connection dictating a command-line argument to a server on App Service.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
    storefront:
      type: core/compute/server
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              arg:
                - in: --catalog-host
                  from: host
