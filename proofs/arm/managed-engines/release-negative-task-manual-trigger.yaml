# A task with no schedule carrying core/manual-trigger, which the Manifest
# binds to no FeatureRecipe for arm.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-task-manual-trigger
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-task-manual-trigger.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        reindex:
          infra:
            image: example.azurecr.io/example/reindex:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
