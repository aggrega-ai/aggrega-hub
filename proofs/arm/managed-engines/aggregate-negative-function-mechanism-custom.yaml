apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-mechanism-custom
  version: "1.0.0"
  description: >
    A connection dictating a value under a custom delivery mechanism to a
    function on Azure Functions.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    order-events:
      type: core/compute/function
      values:
        runtime: python
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              ssm_param:
                - in: /order-events/orders-host
                  from: host
