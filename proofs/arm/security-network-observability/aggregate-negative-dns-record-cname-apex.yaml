# A CNAME at the zone's apex, which holds the zone's NS and SOA record sets.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-cname-apex
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: CNAME
        records:
          - "api.example-environment.example.com"
