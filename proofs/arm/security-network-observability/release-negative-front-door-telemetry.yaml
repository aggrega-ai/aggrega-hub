# infra.overrides.enable_telemetry, where the template is the catalog's own.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com

        edge:
          infra:
            overrides:
              enable_telemetry: false
