# No infra.overrides.zone_name: the zone is the operator's, and this Recipe never creates one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-zone-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns: {}
