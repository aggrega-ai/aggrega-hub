# infra.overrides.workspace_id naming a storage account rather than a Log
# Analytics workspace.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-workspace-id-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azure:
      directory: main
      components:
        insights:
          infra:
            overrides:
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Storage/storageAccounts/examplestorage
