# A CNAME record set holding two records, where a CNAME holds one.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-cname-records
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: CNAME
        records:
          - "api.example-environment.example.com"
          - "api-2.example-environment.example.com"
