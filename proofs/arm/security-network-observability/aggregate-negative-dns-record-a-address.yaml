# An A record whose address has an octet above 255.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-a-address
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "www.example.com"
        type: A
        records:
          - "192.0.2.300"
