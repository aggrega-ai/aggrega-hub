apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: security-network-observability
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: Azure Key Vault, the
    DNS record and Azure Front Door bound to their Recipes, and the generic
    server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/security/azure-key-vault:1.0.0: arm/azure-key-vault:1.0.0
        core/network/dns-record:1.0.0: arm/dns-record-azure-dns:1.0.0
        core/network/azure-front-door:1.0.0: arm/azure-front-door:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
