# A name of 254 characters without its trailing dot, over the DNS standard's 253.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-name-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-name-length.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
