# infra.overrides.enable_telemetry true, which this Recipe never turns on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              enable_telemetry: true
