# infra.overrides.soft_delete_retention_days above 90, the longest period
# the service keeps deleted contents.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-soft-delete-retention-days
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              soft_delete_retention_days: 120
