# infra.overrides.resource_group_name, where the template creates the profile
# in the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com

        edge:
          infra:
            overrides:
              resource_group_name: example-rg
