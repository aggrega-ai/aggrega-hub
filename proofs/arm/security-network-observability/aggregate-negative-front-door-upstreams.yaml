# Front Door wired to two upstreams, where it forwards to one origin.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-front-door-upstreams
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api.example-environment.example.com

    www-dns:
      type: core/network/dns-record
      values:
        name: www.example.com
        type: CNAME
        records:
          - www.example-environment.example.com

    edge:
      type: core/network/azure-front-door
      uses:
        upstream:
          api-dns:
            target: api-dns
          www-dns:
            target: www-dns
