# The server's inject reading the sensitive connection string into a
# variable, which the server's template refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-inject
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-application-insights-inject.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        insights:
          infra:
            overrides:
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
