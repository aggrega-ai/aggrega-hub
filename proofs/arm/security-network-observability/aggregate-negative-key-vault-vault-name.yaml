# A component named with an underscore, which a vault name does not take:
# Microsoft documents a Key Vault name as letters, digits and hyphens.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-key-vault-vault-name
  version: "1.0.0"
spec:
  components:
    orders_vault:
      type: core/security/azure-key-vault
