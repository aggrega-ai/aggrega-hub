# A CNAME record whose domain name holds a space.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-name-target
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: CNAME
        records:
          - "api example-environment.example.com"
