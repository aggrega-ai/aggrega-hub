# An AAAA record whose address holds :: twice.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-aaaa-address
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "www.example.com"
        type: AAAA
        records:
          - "2001:db8::10::1"
