# infra.waf_policy_id naming an Application Gateway policy, not a Front Door
# one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-waf-policy-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com

        edge:
          infra:
            waf_policy_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/examplepolicy
