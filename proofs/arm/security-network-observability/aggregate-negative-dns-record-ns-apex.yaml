# NS records at the zone's apex, whose NS record set holds the zone's own name servers.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-ns-apex
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: NS
        records:
          - "ns1.example.net"
