apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: security-network-observability
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and the addresses the vault and the DNS record publish resolve inside
    # the template. That group holds the operator's Azure DNS zone
    # example.com, which the record set api is written into, with metadata
    # naming its environment.
    #
    # The Azure Key Vault runs on the premium tier, keeping deleted contents
    # for 30 days under purge protection. Its public network access is off,
    # so clients reach it through the operator's private endpoint, and it
    # authorizes access with Azure role-based access control, so the server
    # reads its secrets as its managed identity, under a role assignment the
    # operator makes. The module's telemetry is off. The Front Door profile
    # runs on the Premium tier, forwarding to the record's name, with the
    # operator's web application firewall policy inspecting every request.
    # The Application Insights component, of type other, stores its telemetry
    # in the operator's Log Analytics workspace, keeps half of what it is
    # sent, and ingests only telemetry authenticated with Microsoft Entra ID,
    # so the server sends as its managed identity, under the Monitoring
    # Metrics Publisher role the operator assigns it on the component. The
    # server on Container Apps runs in the operator's environment and pulls
    # its image with a user-assigned identity. Its
    # APPLICATIONINSIGHTS_CONNECTION_STRING is read, by that identity, from
    # the Key Vault secret the operator stores the component's connection
    # string in once the component exists, so the template carries a
    # reference to the secret and never the string.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, DNS zone,
    # firewall policy, Log Analytics workspace, Key Vault secret, Container
    # Apps environment, managed identity and container registry stand for
    # ones the operator already has.
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              location: westeurope
              sku_name: premium
              soft_delete_retention_days: 30
              purge_protection_enabled: true
              public_network_access_enabled: false
              enable_telemetry: false
              tags:
                environment: production

        api-dns:
          infra:
            overrides:
              zone_name: example.com
              tags:
                environment: production

        edge:
          infra:
            waf_policy_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/frontDoorWebApplicationFirewallPolicies/examplepolicy
            overrides:
              sku_name: Premium_AzureFrontDoor
              tags:
                environment: production

        insights:
          infra:
            overrides:
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace
              application_type: other
              sampling_percentage: 50
              local_authentication_enabled: false
              location: westeurope
              enable_telemetry: false
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              secrets:
                APPLICATIONINSIGHTS_CONNECTION_STRING:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/applicationinsights-connection-string
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
