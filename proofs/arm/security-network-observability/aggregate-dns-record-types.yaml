apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dns-record-types
  version: "1.0.0"
  description: >
    One DNS record of each record type the Azure DNS Recipe writes, with a
    wildcard name, a name written with its trailing dot and a text longer
    than one DNS string, so the rendered output shows each type's form.
    Every address and name is a placeholder: the addresses are in the
    documentation ranges 192.0.2.0/24 and 2001:db8::/32.
spec:
  components:
    # One name answering with two IPv4 addresses.
    web-a:
      type: core/network/dns-record
      values:
        name: "www.example.com"
        type: A
        records:
          - "192.0.2.10"
          - "192.0.2.11"

    # The same name's IPv6 address, cached for an hour.
    web-aaaa:
      type: core/network/dns-record
      values:
        name: "www.example.com."
        type: AAAA
        ttl: 3600
        records:
          - "2001:db8::10"

    # An alias name for www, its target written with the trailing dot.
    docs-cname:
      type: core/network/dns-record
      values:
        name: "docs.example.com"
        type: CNAME
        records:
          - "www.example.com."

    # The zone's mail servers, at its apex.
    mail-mx:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: MX
        records:
          - "10 mail.example.com"
          - "20 mail2.example.com."

    # A child zone delegated to another DNS service's name servers.
    child-ns:
      type: core/network/dns-record
      values:
        name: "child.example.com"
        type: NS
        records:
          - "ns1.example.net"
          - "ns2.example.net."

    # The reverse name of 192.0.2.10, in a reverse zone of its own.
    host-ptr:
      type: core/network/dns-record
      values:
        name: "10.2.0.192.in-addr.arpa"
        type: PTR
        records:
          - "www.example.com"

    # A SIP service over TCP.
    sip-srv:
      type: core/network/dns-record
      values:
        name: "_sip._tcp.example.com"
        type: SRV
        records:
          - "10 5 5060 sip.example.com"

    # The certificate authority that may issue for the zone, and where it reports.
    ca-caa:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: CAA
        records:
          - "0 issue letsencrypt.org"
          - "0 iodef \"mailto:security@example.com\""

    # A DomainKeys Identified Mail key longer than one DNS string of 255 characters.
    dkim-txt:
      type: core/network/dns-record
      values:
        name: "selector1._domainkey.example.com"
        type: TXT
        records:
          - "v=DKIM1; k=rsa; "

    # A wildcard answering for every name under apps.example.com.
    apps-wildcard:
      type: core/network/dns-record
      values:
        name: "*.apps.example.com"
        type: A
        records:
          - "192.0.2.20"
