# A CAA record whose tag is issues, a tag Azure DNS does not take.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-caa
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: CAA
        records:
          - "0 issues letsencrypt.org"
