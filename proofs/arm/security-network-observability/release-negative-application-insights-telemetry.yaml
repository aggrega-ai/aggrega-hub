# infra.overrides.enable_telemetry true, which this Recipe never turns on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azure:
      directory: main
      components:
        insights:
          infra:
            overrides:
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace
              enable_telemetry: true
