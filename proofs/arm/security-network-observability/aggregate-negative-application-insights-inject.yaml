# The server's inject reading the connection string, which the Component
# declares sensitive, into a variable.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-application-insights-inject
  version: "1.0.0"
spec:
  components:
    insights:
      type: core/observability/azure-application-insights
    api:
      type: core/compute/server
      uses:
        telemetry:
          insights:
            target: insights
            inject:
              env:
                - in: APPLICATIONINSIGHTS_CONNECTION_STRING
                  from: connection_string
