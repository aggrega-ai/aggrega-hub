# infra.overrides.sku_name as Premium, where the service spells its tiers
# Standard_AzureFrontDoor and Premium_AzureFrontDoor.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com

        edge:
          infra:
            overrides:
              sku_name: Premium
