apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dns-record-types
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-types.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    # Every record set goes into an Azure DNS zone the operator already holds,
    # example.com, or 2.0.192.in-addr.arpa for the reverse name, in one
    # template deployed to the resource group holding both zones. The
    # DomainKeys record carries metadata from infra.overrides.tags.
    #
    # The zones' names are placeholders.
    azure:
      directory: main
      components:
        web-a:
          infra:
            overrides:
              zone_name: example.com
        web-aaaa:
          infra:
            overrides:
              zone_name: example.com
        docs-cname:
          infra:
            overrides:
              zone_name: example.com
        mail-mx:
          infra:
            overrides:
              zone_name: example.com
        child-ns:
          infra:
            overrides:
              zone_name: example.com
        host-ptr:
          infra:
            overrides:
              zone_name: 2.0.192.in-addr.arpa
        sip-srv:
          infra:
            overrides:
              zone_name: example.com
        ca-caa:
          infra:
            overrides:
              zone_name: example.com
        dkim-txt:
          infra:
            overrides:
              zone_name: example.com
              tags:
                purpose: mail-signing
        apps-wildcard:
          infra:
            overrides:
              zone_name: example.com
