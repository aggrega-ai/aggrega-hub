apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: security-network-observability-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The operator names the Azure Key Vault in infra.overrides.host, so the
    # server's ORDERS_VAULT_HOST carries that name in place of the expression
    # reading the module's uri output, and ORDERS_VAULT_ENDPOINT the URI built
    # on it, and names the Front Door endpoint in infra.overrides.host, so
    # EDGE_HOST and EDGE_ENDPOINT carry that name in place of the expression
    # reading the endpoint's host name. The vault keeps this Recipe's
    # defaults, the standard tier in the resource group's region, keeping
    # deleted contents for 90 days under purge protection, with public
    # network access on. The DNS record goes into the operator's zone
    # example.com, in the resource group the template is deployed to. Front
    # Door runs on the Standard tier with no firewall policy.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, DNS zone,
    # Container Apps environment, managed identity, container registry and
    # example.com names stand for ones the operator already has.
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              host: orders-vault.example.com

        api-dns:
          infra:
            overrides:
              zone_name: example.com

        edge:
          infra:
            overrides:
              host: www.example.com

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
