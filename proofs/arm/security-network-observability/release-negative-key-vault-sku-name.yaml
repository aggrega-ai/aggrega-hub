# infra.overrides.sku_name as Premium, capitalized, where the service
# spells its tiers standard and premium.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              sku_name: Premium
