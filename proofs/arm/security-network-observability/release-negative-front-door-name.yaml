# A component whose name holds an underscore, which a Front Door endpoint's
# name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-front-door-name.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com

        public_edge: {}
