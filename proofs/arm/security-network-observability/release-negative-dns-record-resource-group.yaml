# infra.overrides.resource_group_name, which this Recipe refuses: the
# template deploys into the resource group it is deployed to, the zone's.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
