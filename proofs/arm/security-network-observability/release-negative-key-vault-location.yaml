# infra.overrides.location as a list of regions, where a vault is created
# in one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-vault:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
