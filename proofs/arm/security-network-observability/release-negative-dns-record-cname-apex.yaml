# A CNAME at the zone's apex, which holds the zone's NS and SOA record sets.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-cname-apex
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-cname-apex.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
