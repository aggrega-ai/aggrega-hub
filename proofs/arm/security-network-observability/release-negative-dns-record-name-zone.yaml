# infra.overrides.zone_name naming a zone that does not hold values.name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-name-zone
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azure:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.org
