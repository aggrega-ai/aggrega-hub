# Front Door wired to the generic server, which publishes no host.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-upstream-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-front-door-upstream-host.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azure:
      directory: main
      components:
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment

        edge: {}
