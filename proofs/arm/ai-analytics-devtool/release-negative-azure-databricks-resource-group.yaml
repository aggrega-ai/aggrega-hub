# infra.overrides.resource_group_name, which names no parameter of the
# template: it deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
