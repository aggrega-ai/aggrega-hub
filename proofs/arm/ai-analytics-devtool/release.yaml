apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-analytics-devtool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group. The
    # agent and the model are references: their Recipes declare no resource,
    # and the template carries the project endpoint below, the agent's name
    # and its version, and the model's scoring endpoint and name, as outputs,
    # and as the literals the server's variables hold. Beside the server,
    # the template deploys the Databricks workspace and the data factory.
    # The workspace is premium, with secure cluster connectivity, in the
    # network Azure Databricks creates, its managed resource group
    # databricks-rg-analytics-<resource group>, and the server's variables
    # hold expressions for its address and host name. The factory's two
    # pipelines are deployed after it, nightly after load-orders, which it
    # runs; the factory takes a user-assigned identity, as which the linked
    # service orders_sql reaches the database through a credential the
    # operator creates in the factory, and the stored procedure's name
    # [dbo].[load_orders] is written [[dbo].[load_orders] in the template,
    # so that Azure Resource Manager hands Data Factory the name itself.
    # The workflow is deployed through the Verified Module, enabled, with a
    # user-assigned identity it may call other services as; the receipt's
    # status [accepted] and its key [region] are written [[accepted] and
    # [[region], and its key Copy as [string('Copy')], so that Azure
    # Resource Manager hands Logic Apps the text itself, while the @
    # expressions reach it as written.
    # The server on Container Apps runs in the operator's environment and
    # pulls its image with a user-assigned identity, the identity it also
    # calls the Foundry project, the managed online endpoint and the
    # workspace as, under role assignments the operator makes on each and,
    # for the workspace, the identity's admission to it.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the Foundry resource and
    # project, managed online endpoint, resource group, Container Apps
    # environment, managed identities and container registry stand for ones
    # the operator already has.
    azure:
      directory: main
      components:
        support-agent:
          infra:
            endpoint: https://example-foundry.services.ai.azure.com/api/projects/example-project

        scoring-model:
          infra:
            endpoint: https://example-endpoint.westeurope.inference.ml.azure.com/score

        analytics: {}

        ingest:
          infra:
            overrides:
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-ingest

        orders:
          infra:
            overrides:
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-orders

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
