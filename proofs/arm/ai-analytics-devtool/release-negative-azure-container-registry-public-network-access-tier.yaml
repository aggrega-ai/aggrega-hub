# infra.overrides.public_network_access_enabled false on the Standard
# tier, where the service takes requests through private endpoints alone
# on Premium.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-public-network-access-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azure:
      directory: main
      components:
        images:
          infra:
            overrides:
              public_network_access_enabled: false
