# infra.overrides.location as a list: a workflow is created in one
# region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-logic-apps-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-logic-apps-only.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    azure:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
