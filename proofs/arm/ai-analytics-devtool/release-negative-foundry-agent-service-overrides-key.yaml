# An infra.overrides key, location, which this Recipe does not read: it
# reads none.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-foundry-agent-service-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-foundry-agent-service-only.yaml
  manifest: ./manifest-foundry-agent-service.yaml
  boundaries:
    azure:
      directory: main
      components:
        support-agent:
          infra:
            endpoint: https://example-foundry.services.ai.azure.com/api/projects/example-project
            overrides:
              location: westeurope
