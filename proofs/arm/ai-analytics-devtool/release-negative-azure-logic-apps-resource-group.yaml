# infra.overrides.resource_group_name: the template deploys into the
# resource group it is deployed to, which no parameter of the module
# names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-logic-apps-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-logic-apps-only.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    azure:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              resource_group_name: example-rg
