# An infra.overrides key misspelt: sku, where the Recipe reads sku_name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azure:
      directory: main
      components:
        images:
          infra:
            overrides:
              sku: Premium
