# infra.overrides.enable_telemetry, even false: the template is the
# catalog's own, with no module telemetry to turn on or off.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-data-factory-only.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azure:
      directory: main
      components:
        ingest:
          infra:
            overrides:
              enable_telemetry: false
