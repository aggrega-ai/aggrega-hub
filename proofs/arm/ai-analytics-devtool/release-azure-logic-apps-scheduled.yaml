apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: azure-logic-apps-scheduled
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-logic-apps-only.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    # A workflow placed in the region named here rather than the resource
    # group's, tagged, with two user-assigned identities the workflow may
    # authenticate as. Telemetry is off in every
    # template this Recipe writes; false is admitted and changes nothing.
    azure:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              location: northeurope
              tags:
                environment: production
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-nightly
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-reporting
              enable_telemetry: false
