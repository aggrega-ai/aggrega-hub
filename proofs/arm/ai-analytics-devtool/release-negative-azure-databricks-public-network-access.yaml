# infra.overrides.public_network_access_enabled as the string the
# vendor writes, where the key takes a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              public_network_access_enabled: Disabled
