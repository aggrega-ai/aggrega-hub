# infra.overrides.resource_group_name, which no parameter of the template
# names: the template deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azure:
      directory: main
      components:
        images:
          infra:
            overrides:
              resource_group_name: example-rg
