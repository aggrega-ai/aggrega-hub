# infra.overrides.location as a list of regions, where it names one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
