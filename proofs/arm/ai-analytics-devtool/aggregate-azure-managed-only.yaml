apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: azure-managed-only
  version: "1.0.0"
  description: >
    A model served from an Azure managed online endpoint alone, for the
    Releases that prove what the Azure managed online endpoint Recipe
    refuses on its own.
spec:
  components:
    scoring-model:
      type: core/ai-model/azure-managed
      values:
        model: scoring-v1
