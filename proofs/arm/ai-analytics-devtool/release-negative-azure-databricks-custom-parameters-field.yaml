# A custom_parameters field the Recipe does not read: storage_account_name,
# an input of the Terraform module this catalog does not offer.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-custom-parameters-field
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              custom_parameters:
                storage_account_name: exampledbstorage
