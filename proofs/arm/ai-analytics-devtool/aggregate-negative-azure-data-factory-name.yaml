apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-name
  version: "1.0.0"
  description: >
    An Azure Data Factory named by a component holding an underscore,
    which Microsoft's naming rules for Data Factory do not take in a
    factory's name.
spec:
  components:
    orders_ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
