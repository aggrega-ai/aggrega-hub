apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: azure-databricks-private-link
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    # A workspace reached through Private Link alone: its clusters run in
    # the operator's network, on two subnets delegated to Azure Databricks
    # with a network security group each, with secure cluster connectivity,
    # public network access disabled and the rule set NoAzureDatabricksRules
    # for the back-end private endpoint. The network, its subnets and their
    # network security groups, the private endpoints and the private DNS
    # zone privatelink.azuredatabricks.net are the operator's, as is the NAT
    # gateway giving the subnets their outbound path. The managed resource
    # group takes the name given here, on the 14-day trial of Premium.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the network and its subnets
    # stand for ones the operator already has.
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              sku_name: trial
              location: westeurope
              managed_resource_group_name: example-databricks-managed
              public_network_access_enabled: false
              network_security_group_rules_required: NoAzureDatabricksRules
              custom_parameters:
                virtual_network_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network
                private_subnet_name: databricks-private
                public_subnet_name: databricks-public
                private_subnet_network_security_group_association_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/databricks-private
                public_subnet_network_security_group_association_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/databricks-public
              tags:
                environment: production
