apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-pipeline-case
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipelines are named load-orders and
    Load-Orders, one name to Data Factory, which takes a pipeline's name
    without regard to case.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
          Load-Orders:
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 2
