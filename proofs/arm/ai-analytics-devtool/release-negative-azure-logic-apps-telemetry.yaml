# infra.overrides.enable_telemetry true: the module's telemetry is off in
# every template this Recipe writes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-logic-apps-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-logic-apps-only.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    azure:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              enable_telemetry: true
