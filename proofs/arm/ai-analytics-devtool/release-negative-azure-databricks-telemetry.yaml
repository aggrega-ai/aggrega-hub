# infra.overrides.enable_telemetry true, where the module's telemetry is
# always off.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              enable_telemetry: true
