# infra.overrides.sku_name premium, in lower case, where the module takes
# the tier spelt Premium.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azure:
      directory: main
      components:
        images:
          infra:
            overrides:
              sku_name: premium
