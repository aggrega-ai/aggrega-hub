# infra.overrides.host, where the registry answers at the login server
# the service gives it.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azure:
      directory: main
      components:
        images:
          infra:
            overrides:
              host: registry.example.com
