# network_security_group_rules_required NoAzureDatabricksRules in the
# network Azure Databricks creates: back-end Private Link takes the
# operator's network.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-back-end-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              network_security_group_rules_required: NoAzureDatabricksRules
