# custom_parameters.virtual_network_id naming a subnet, where it names the
# network.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-virtual-network-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azure:
      directory: main
      components:
        analytics:
          infra:
            overrides:
              custom_parameters:
                virtual_network_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/databricks-private
                private_subnet_name: databricks-private
                public_subnet_name: databricks-public
