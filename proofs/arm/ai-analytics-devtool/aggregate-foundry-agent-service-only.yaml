apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: foundry-agent-service-only
  version: "1.0.0"
  description: >
    A Foundry Agent Service agent alone, for the Releases that prove what
    the Foundry Agent Service Recipe refuses on its own.
spec:
  components:
    support-agent:
      type: core/ai-agent/foundry-agent-service
      values:
        agent_name: support-agent
