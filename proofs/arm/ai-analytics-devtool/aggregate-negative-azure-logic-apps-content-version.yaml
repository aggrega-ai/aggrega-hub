apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-logic-apps-content-version
  version: "1.0.0"
  description: >
    An Azure Logic Apps workflow whose definition names contentVersion
    2.0.0.0, which the Azure Resource Manager Recipe's template does not
    write.
spec:
  components:
    nightly:
      type: core/ai-pipeline/azure-logic-apps
      values:
        definition:
          contentVersion: "2.0.0.0"
          triggers:
            Recurrence:
              type: Recurrence
              recurrence:
                frequency: Day
                interval: 1
          actions:
            Check:
              type: Http
              runAfter: {}
              inputs:
                method: GET
                uri: https://example.com/health
              runtimeConfiguration:
                staticResult:
                  name: Check0
                  staticResultOptions: Disabled
          outputs:
            status:
              type: String
              value: "@{outputs('Check')['statusCode']}"
          staticResults:
            Check0:
              status: Succeeded
              outputs:
                statusCode: OK
                headers: {}
