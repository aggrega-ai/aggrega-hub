# infra.overrides.identity_ids naming a virtual network, where it names
# user-assigned managed identities.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-identity-ids
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-data-factory-only.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azure:
      directory: main
      components:
        ingest:
          infra:
            overrides:
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network
