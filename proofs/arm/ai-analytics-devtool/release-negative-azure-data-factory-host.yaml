# infra.overrides.host: the factory has no address for it to name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-data-factory-only.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azure:
      directory: main
      components:
        ingest:
          infra:
            overrides:
              host: ingest.example.com
