apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: Foundry Agent Service
    and the Azure managed online endpoint model bound to their reference
    Recipes, Azure Databricks and Azure Data Factory bound to their
    Recipes, and the generic server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-agent/foundry-agent-service:1.0.0: arm/foundry-agent-service:1.0.0
        core/ai-model/azure-managed:1.0.0: arm/azure-managed:1.0.0
        core/bigdata/azure-databricks:1.0.0: arm/azure-databricks:1.0.0
        core/bigdata/azure-data-factory:1.0.0: arm/azure-data-factory:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
