apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: Foundry Agent Service
    bound to its reference Recipe, and the generic server bound to its
    Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-agent/foundry-agent-service:1.0.0: arm/foundry-agent-service:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
