# More replicas than Container Apps configures of a revision.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-replicas
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azure:
      directory: main
      components:
        product:
          infra:
            replicas: 1001
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
