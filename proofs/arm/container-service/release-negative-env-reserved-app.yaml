# The component's own inject block dictating a variable Container Apps sets in every app.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-env-reserved-app
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-env-reserved-app.yaml
  manifest: negative
  boundaries:
    azure:
      directory: main
      components:
        product:
          infra:
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
