apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-job-container-apps
  version: 1.0.0
  description: >
    The placeholder product as one Azure Container Apps job, started on
    values.schedule where the Aggregate sets one and otherwise by the
    operator, written as a product Recipe on the shared Container Apps shape
    on Azure Resource Manager: Microsoft's Azure Verified Modules module
    avm/res/app/job, sourced from its registry and wrapped as one
    nested deployment that creates the job and nothing else, the
    JobParameters entry from ContainerAppParameters binding its parameters,
    and the locals that entry reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: example/compute/sample-product:1.0.0

  # The module's compiled template, as its registry publishes it at this
  # version; entity.lock pins its digests.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/app/job
    version: 0.7.2

  # What the product fixes, read by ContainerAppParameters#/mappings/JobParameters:
  # its image while infra.image is unset and the variables its own values and
  # its database connection reach it as. A run answers no probe, so none is
  # declared.
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS", "values.languages": "SAMPLE_LANGUAGES"}'
    socket_env: '{"database": {"SAMPLE_DATABASE_HOST": "host", "SAMPLE_DATABASE_PORT": "port", "SAMPLE_DATABASE_NAME": "database"}}'

  # A job serves no requests, so it publishes no address.
  provides:
    endpoint: ""

  valuesMapping:
    $import: ContainerAppParameters#/mappings/JobParameters
