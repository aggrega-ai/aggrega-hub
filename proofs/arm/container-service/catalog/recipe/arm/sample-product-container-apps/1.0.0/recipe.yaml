apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-container-apps
  version: 1.0.0
  description: >
    The placeholder product as one Azure container app, written as a product
    Recipe on the shared Container Apps shape on Azure Resource Manager:
    Microsoft's Azure Verified Modules module avm/res/app/container-app,
    sourced from its registry and wrapped as one nested deployment that
    creates the app and nothing else, the AppParameters entry from
    ContainerAppParameters binding its parameters, and the locals that entry
    reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: example/compute/sample-product:1.0.0

  # The module's compiled template, as its registry publishes it at this
  # version; entity.lock pins its digests.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/app/container-app
    version: 0.23.1

  # What the product fixes, read by ContainerAppParameters#/mappings/AppParameters:
  # its image while infra.image is unset, the port it listens on, the variables
  # its own values and its database connection reach it as, and the path it
  # answers its probes on.
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS", "values.languages": "SAMPLE_LANGUAGES"}'
    socket_env: '{"database": {"SAMPLE_DATABASE_HOST": "host", "SAMPLE_DATABASE_PORT": "port", "SAMPLE_DATABASE_NAME": "database"}}'
    probe_path: /healthz

  # The address the app's internal ingress answers at, read off the
  # nested deployment's fqdn output, which the module declares.
  provides:
    endpoint: "[format('https://{0}', reference('{{ capitalizedWords .context.instance_id }}').outputs.fqdn.value)]"

  valuesMapping:
    $import: ContainerAppParameters#/mappings/AppParameters
