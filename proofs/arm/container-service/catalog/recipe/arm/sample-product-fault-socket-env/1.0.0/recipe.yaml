apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-socket-env
  version: 1.0.0
  description: >
    A product Recipe declaring a socket table that is not one. It is reached only by the negative Release
    release-negative-fault-socket-env.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: example/compute/sample-product:1.0.0
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/app/container-app
    version: 0.23.1
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS", "values.languages": "SAMPLE_LANGUAGES"}'
    socket_env: '{"database": "SAMPLE_DATABASE_HOST"}'
  provides:
    endpoint: ""
  valuesMapping:
    $import: ContainerAppParameters#/mappings/AppParameters
