# A product Recipe declaring a probe path with no port to request it on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-fault-probe-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: ./manifest-negative-fault-probe-port.yaml
  boundaries:
    azure:
      directory: main
      components:
        product:
          infra:
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
