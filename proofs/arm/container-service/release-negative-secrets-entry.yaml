# A secret written as one string rather than its origin and identity.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-secrets-entry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azure:
      directory: main
      components:
        product:
          infra:
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              secrets:
                SAMPLE_DATABASE_PASSWORD: orders-db-password
