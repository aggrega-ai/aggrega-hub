# A connection dictating the variable the worker's concurrency is delivered as by default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-value-collision-worker
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-value-collision-worker.yaml
  manifest: ./manifest-negative-generic.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
              type: Premium_LRS
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
        jobs:
          infra:
            image: example.azurecr.io/example/jobs:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
