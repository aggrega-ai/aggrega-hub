apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mechanism-file
  version: "1.0.0"
  description: >
    A connection dictating a file.
spec:
  components:
    peer:
      type: example/compute/sample-product
    product:
      type: example/compute/sample-product
      uses:
        peers:
          peer:
            target: peer
            inject:
              file:
                - in: /etc/sample/peer
                  from: endpoint
