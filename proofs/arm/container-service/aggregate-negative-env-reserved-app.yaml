apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-reserved-app
  version: "1.0.0"
  description: >
    The component's own inject block dictating a variable Container Apps sets in every app.
spec:
  components:
    product:
      type: example/compute/sample-product
      inject:
        env:
          - in: CONTAINER_APP_NAME
            value: placeholder
