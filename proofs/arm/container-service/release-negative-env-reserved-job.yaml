# The component's own inject block dictating a variable Container Apps sets in every job.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-env-reserved-job
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-env-reserved-job.yaml
  manifest: ./manifest-negative-job.yaml
  boundaries:
    azure:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
