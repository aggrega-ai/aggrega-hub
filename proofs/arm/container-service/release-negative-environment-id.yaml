# A Container Apps environment named by its name rather than its resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-environment-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azure:
      directory: main
      components:
        product:
          infra:
            overrides:
              container_app_environment_id: example-environment
