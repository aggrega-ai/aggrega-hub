apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-database
  version: "1.0.0"
  description: >
    The placeholder product delivered its database by its Recipe's default names.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      uses:
        database:
          orders:
            target: orders-db
