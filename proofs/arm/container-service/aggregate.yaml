apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    Containers on Azure Container Apps through the shared Container Apps
    shape on Azure Resource Manager, beside the PostgreSQL database they use:
    the placeholder product as an app, as a scheduled job and as a job the
    operator starts, each delivered its database by its Recipe's default
    names.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    # The product's database connection dictates nothing, so the Recipe
    # delivers it under its own default names; its greeting reaches it as
    # SAMPLE_MESSAGE, which its own inject block names, rather than as
    # SAMPLE_GREETING, and its languages as one JSON list.
    product:
      type: example/compute/sample-product
      values:
        greeting: hello from the fixture
        workers: 3
        languages: [en, it]
      inject:
        env:
          - in: SAMPLE_MESSAGE
            value: '{{"{{"}} .values.greeting }}'
      uses:
        database:
          orders:
            target: orders-db

    # The schedule becomes the job's cron expression, which Container Apps
    # evaluates in UTC.
    nightly:
      type: example/compute/sample-product
      values:
        workers: 1
        schedule: "30 2 * * *"
      uses:
        database:
          orders:
            target: orders-db

    # With no schedule, the job's trigger is manual: the operator starts each
    # execution.
    backfill:
      type: example/compute/sample-product
      values:
        workers: 2
      uses:
        database:
          orders:
            target: orders-db
