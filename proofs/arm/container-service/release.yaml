apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: container-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One directory, so one template, deployed to one resource group: the
    # address the database publishes then resolves inside the template.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Container Apps environment, managed
    # identities, container registry and Key Vault secrets stand for ones the
    # operator already has.
    azure:
      directory: main
      components:
        # The administrator's password is a Key Vault secret the operator
        # created; the template carries a Key Vault reference to it.
        orders-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
              type: Premium_LRS
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
        # The product runs the image its Recipe holds, so infra.image is left
        # unset; it runs two replicas at 1 vCPU with 2 GiB, with an identity of
        # its own, and reads the database password from Key Vault.
        product:
          infra:
            replicas: 2
            compute:
              cpu: "1"
              memory: 2Gi
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-product
              secrets:
                SAMPLE_DATABASE_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-product
        # The nightly job pulls its image from a private registry with a managed
        # identity.
        nightly:
          infra:
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-pull
        # The backfill job pulls its image with a user name and a password read
        # from Key Vault.
        backfill:
          infra:
            compute:
              cpu: "0.5"
              memory: 1Gi
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_username: example-pull
              registry_password_secret_id: https://example-vault.vault.azure.net/secrets/registry-password
              registry_password_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-vault-reader
        # The server pulls its image from a private registry with a managed
        # identity, and runs with an identity of its own as well.
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-pull
        # The worker reads the database password from Key Vault, named under
        # its secrets, with the identity it pulls its image with.
        jobs:
          infra:
            image: example.azurecr.io/example/jobs:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-pull
              secrets:
                ORDERS_DB_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-pull
