apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative
  version: "1.0.0"
  description: >
    The type bindings of this fixture's Manifest and no name binding, for the
    negative Releases whose Aggregates hold components of their own; a
    negative Manifest extending it binds what one of them changes.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: arm/postgres-flexible-server:1.0.0
        example/compute/sample-product:1.0.0: arm/sample-product-container-apps:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
