apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-reserved-job
  version: "1.0.0"
  description: >
    The component's own inject block dictating a variable Container Apps sets in every job.
spec:
  components:
    nightly:
      type: example/compute/sample-product
      values:
        schedule: "30 2 * * *"
      inject:
        env:
          - in: CONTAINER_APP_JOB_NAME
            value: placeholder
