apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-collision
  version: "1.0.0"
  description: >
    A connection taking the default names beside the component's own inject block dictating one of them.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      inject:
        env:
          - in: SAMPLE_DATABASE_HOST
            value: placeholder
      uses:
        database:
          orders:
            target: orders-db
