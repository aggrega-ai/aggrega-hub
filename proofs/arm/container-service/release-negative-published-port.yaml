# A server publishing a port on the host.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-published-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server.yaml
  manifest: ./manifest-negative-generic.yaml
  boundaries:
    azure:
      directory: main
      components:
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            published_port: 8443
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
