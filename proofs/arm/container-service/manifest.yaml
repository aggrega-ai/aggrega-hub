apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: the generic server and
    worker bound to their Container Apps Recipes, the placeholder product to
    its app Recipe, and the nightly and backfill components of the same type,
    by name, to its job Recipe; PostgreSQL to Azure Database for PostgreSQL
    flexible server, its administrator password a Key Vault secret.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: arm/postgres-flexible-server:1.0.0
        example/compute/sample-product:1.0.0: arm/sample-product-container-apps:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
        core/compute/worker:1.0.0: arm/worker-container-apps:1.1.0
      name:
        nightly: arm/sample-product-job-container-apps:1.0.0
        backfill: arm/sample-product-job-container-apps:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
