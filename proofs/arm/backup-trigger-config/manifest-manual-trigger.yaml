apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manual-trigger
  version: "1.0.0"
  description: >
    Azure through an Azure Resource Manager template: the generic task bound
    to its Container Apps Recipe, and core/manual-trigger to its arm
    realization.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.1: arm/task-container-apps:1.0.0
    features:
      type:
        core/manual-trigger:1.0.0: arm/manual-trigger:1.0.0
