# A core/manual-trigger attachment carrying an infra key, which the Feature
# does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-manual-trigger-infra
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-manual-trigger.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    azure:
      directory: main
      components:
        reindex:
          features:
            on_demand:
              infra:
                parallelism: 2
          infra:
            image: example.azurecr.io/example/reindex:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment

        nightly-export:
          infra:
            image: example.azurecr.io/example/nightly-export:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
