apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: manual-trigger
  version: "1.0.0"
  description: >
    The generic task as an Azure Container Apps job carrying
    core/manual-trigger twice over: a reindex with no schedule, deployed
    without starting for the operator to start each run, and a nightly export
    that runs on its schedule as it would without the attachment, and can
    also be started by hand.
spec:
  components:
    # With no schedule, the attachment deploys the job with a manual trigger.
    reindex:
      type: core/compute/task
      features:
        on_demand:
          type: core/manual-trigger

    # With a schedule, the job's schedule trigger starts each run all the
    # same.
    nightly-export:
      type: core/compute/task
      values:
        schedule: "0 3 * * *"
      features:
        on_demand:
          type: core/manual-trigger
