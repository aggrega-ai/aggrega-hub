apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: manual-trigger
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-manual-trigger.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    # The reindex renders a job with a manual trigger, the nightly export one
    # with a schedule trigger. The Container Apps environment is a
    # placeholder for one the operator already has in subscription
    # 00000000-0000-0000-0000-000000000000, and the images for its own.
    azure:
      directory: main
      components:
        reindex:
          infra:
            image: example.azurecr.io/example/reindex:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment

        nightly-export:
          infra:
            image: example.azurecr.io/example/nightly-export:1.0.0
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
