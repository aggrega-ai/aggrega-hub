apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: public-ingress
  version: "1.0.0"
  description: >
    A server the internet reaches at a host name, which the operator
    publishes by attaching core/public-ingress to it in the Release; the
    developer writes nothing for it, since the server answers every path of
    its host.
spec:
  components:
    storefront:
      type: core/compute/server
