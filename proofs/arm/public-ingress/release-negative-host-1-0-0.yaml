# A core/public-ingress attachment on a server bound to the App Service
# Recipe at 1.0.0, which configures no public ingress.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-host-1-0-0
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-host-1-0-0.yaml
  boundaries:
    azure:
      directory: main
      components:
        storefront:
          features:
            public:
              type: core/public-ingress
              infra:
                host: shop.example.com
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
