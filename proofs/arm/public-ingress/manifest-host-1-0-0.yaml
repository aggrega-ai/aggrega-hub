apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: host-1-0-0
  version: "1.0.0"
  description: >
    The generic server bound to the App Service Recipe at 1.0.0, which
    configures no public ingress, and core/public-ingress to the
    FeatureRecipe that leaves it to the server's own Recipe.
spec:
  mappings:
    components:
      type:
        core/compute/server:1.1.0: arm/server-app-service:1.0.0
    features:
      type:
        core/public-ingress:1.0.0: arm/public-ingress-native:1.0.0
