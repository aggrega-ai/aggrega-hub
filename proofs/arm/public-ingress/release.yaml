apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: public-ingress
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The App Service app answers requests from the internet, on its default
    # host name and on shop.example.com, served with the operator's App
    # Service certificate, whose thumbprint the template reads when it
    # deploys. The FeatureRecipe the attachment binds renders nothing: the
    # server's own Recipe turns public network access on and writes the host
    # name binding.
    #
    # Every subscription-specific value is a placeholder: subscription
    # 00000000-0000-0000-0000-000000000000, its resource group example-rg,
    # the App Service plan and the certificate stand for ones the operator
    # already has, and the domain's DNS records are the operator's too.
    azure:
      directory: main
      components:
        storefront:
          features:
            public:
              type: core/public-ingress
              infra:
                host: shop.example.com
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              certificate_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/certificates/example-shop
