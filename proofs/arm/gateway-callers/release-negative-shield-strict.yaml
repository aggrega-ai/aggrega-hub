# A prompt shield asking for sensitivity strict, which Azure's on-or-off
# shield does not keep.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-shield-strict
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-shield-strict.yaml
  manifest: ./manifest-shield.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
            content_safety_backend_id: content-safety
