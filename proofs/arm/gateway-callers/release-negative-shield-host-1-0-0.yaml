# The prompt shield on the gateway bound to arm/azure-api-management
# 1.0.0, whose API policy writes no element an attachment delivers.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-shield-host-1-0-0
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-shield.yaml
  manifest: ./manifest-shield-host-1-0-0.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
            content_safety_backend_id: content-safety
