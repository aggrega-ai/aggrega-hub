apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: audit
  version: "1.0.0"
  description: >
    The gateway carrying core/audit-logging, which its arm FeatureRecipe
    binds to a halt naming why the request log is the instance's own setting.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        audit:
          type: core/audit-logging
