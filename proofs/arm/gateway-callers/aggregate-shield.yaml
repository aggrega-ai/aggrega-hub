apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: shield
  version: "1.0.0"
  description: >
    The gateway carrying the prompt shield.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        shield:
          type: core/prompt-injection-shield
          values:
            sensitivity: standard
