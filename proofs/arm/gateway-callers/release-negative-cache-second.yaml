# Two semantic caches on one gateway, whose policy takes one lookup.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cache-second
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cache-second.yaml
  manifest: ./manifest-cache.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
            cache_serves_vector_search: true
