apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cache-embedding-model
  version: "1.0.0"
  description: >
    A semantic cache whose embedding_model holds a double quote.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        cache:
          type: core/semantic-caching
          values:
            similarity_threshold: 0.95
            embedding_model: 'embed"dings'
            ttl_seconds: 300
            scope: key
