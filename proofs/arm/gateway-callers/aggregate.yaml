apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    The Azure API Management gateway in front of a chat model, carrying
    every policy control its arm Recipe writes: two token budgets, the
    prompt shield, a retry and a semantic cache.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        # A token quota over a day for everything the API serves, and a
        # token rate per minute for each API Management subscription.
        daily-budget:
          type: core/period-budget
          values:
            scope: gateway
            unit: total_tokens
        minute-rate:
          type: core/period-budget
          values:
            scope: caller
            unit: total_tokens
        shield:
          type: core/prompt-injection-shield
          values:
            sensitivity: standard
        retry:
          type: core/retry-policy
          values:
            max_attempts: 3
        cache:
          type: core/semantic-caching
          values:
            similarity_threshold: 0.95
            embedding_model: embeddings
            ttl_seconds: 300
            scope: key
