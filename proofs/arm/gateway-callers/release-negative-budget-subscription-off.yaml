# An API that requires no subscription key, under a token rate kept per
# API Management subscription.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-budget-subscription-off
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-budget.yaml
  manifest: ./manifest-budget.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          features:
            daily-budget:
              infra:
                limit: 1000000
                period: 1d
            minute-rate:
              infra:
                limit: 20000
                period: 1m
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
            subscription_required: false
