apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cache-end-user
  version: "1.0.0"
  description: >
    A semantic cache at its default scope, end_user.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        cache:
          type: core/semantic-caching
          values:
            similarity_threshold: 0.95
            embedding_model: embeddings
            ttl_seconds: 300
