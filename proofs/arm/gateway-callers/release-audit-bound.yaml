# core/audit-logging bound in the Manifest to its arm FeatureRecipe and
# attached to nothing. That FeatureRecipe halts on every attachment
# (release-negative-audit) and emits nothing, so this Release proves that
# the binding resolves, and builds the template it builds with no attachment.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: audit-bound
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-plain.yaml
  manifest: ./manifest-audit.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
