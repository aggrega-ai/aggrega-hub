# Two retry policies on one gateway, whose policy's backend section holds
# one element.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-retry-second
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-retry-second.yaml
  manifest: ./manifest-retry.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
