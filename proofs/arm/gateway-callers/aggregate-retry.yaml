apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: retry
  version: "1.0.0"
  description: >
    The gateway carrying a retry of three sends in all.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        retry:
          type: core/retry-policy
          values:
            max_attempts: 3
