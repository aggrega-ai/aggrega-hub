apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cache-second
  version: "1.0.0"
  description: >
    Two semantic caches on one gateway.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        cache:
          type: core/semantic-caching
          values:
            similarity_threshold: 0.95
            embedding_model: embeddings
            ttl_seconds: 300
            scope: key
        cache-again:
          type: core/semantic-caching
          values:
            similarity_threshold: 0.95
            embedding_model: embeddings
            ttl_seconds: 300
            scope: key
