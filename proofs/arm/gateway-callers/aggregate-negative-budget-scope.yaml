apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-budget-scope
  version: "1.0.0"
  description: >
    The two token budgets, the daily one kept per model.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        # A token quota over a day for everything the API serves, and a
        # token rate per minute for each API Management subscription.
        daily-budget:
          type: core/period-budget
          values:
            scope: model
            unit: total_tokens
        minute-rate:
          type: core/period-budget
          values:
            scope: caller
            unit: total_tokens
