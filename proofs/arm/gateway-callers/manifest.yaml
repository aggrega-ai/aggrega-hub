apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through an Azure Resource Manager template: the API Management
    gateway bound to the Recipe that writes the policy controls into its API
    policy, and each control to its arm FeatureRecipe.
spec:
  mappings:
    components:
      type:
        core/gateway/azure-api-management:1.0.0: arm/azure-api-management:1.1.0
    features:
      type:
        core/period-budget:1.0.0: arm/period-budget-azure-api-management:1.0.0
        core/prompt-injection-shield:1.0.0: arm/prompt-injection-shield-azure-api-management:1.0.0
        core/retry-policy:1.0.0: arm/retry-policy-azure-api-management:1.0.0
        core/semantic-caching:1.0.0: arm/semantic-caching-azure-api-management:1.0.0
