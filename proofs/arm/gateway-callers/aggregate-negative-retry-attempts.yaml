apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-retry-attempts
  version: "1.0.0"
  description: >
    A retry of 52 sends.
spec:
  components:
    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat
      features:
        retry:
          type: core/retry-policy
          values:
            max_attempts: 52
