# Every policy control on one API: the instance has backends for Azure AI
# Content Safety and for an embeddings model, and a Redis cache serving
# RediSearch as its external cache, which the Release affirms.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: gateway-callers
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One template, deployed to the resource group of the API Management
    # instance example-apim, which stands for one the operator already has.
    azure:
      directory: main
      components:
        chat-gateway:
          features:
            daily-budget:
              infra:
                limit: 1000000
                period: 1d
            minute-rate:
              infra:
                limit: 20000
                period: 1m
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
            content_safety_backend_id: content-safety
            cache_serves_vector_search: true
