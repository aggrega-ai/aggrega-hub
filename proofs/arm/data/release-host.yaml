apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-two-databases.yaml
  boundaries:
    # The operator names the database's server in infra.overrides.host, so the
    # server's ORDERS_DB_HOST carries that name in place of the expression
    # reading the module's fullyQualifiedDomainName output. The database keeps
    # the General Purpose SKU this Recipe takes by default and is zone
    # redundant; its server takes public network access, admitted by the
    # firewall rules the operator sets.
    #
    # The operator names the managed instance in infra.overrides.host too, so
    # LEDGER_DB_HOST carries that name. The instance keeps this Recipe's
    # defaults, four vCores of General Purpose on standard-series hardware
    # with 32 GiB of storage, aligned with SQL Server 2022, in the resource
    # group's region, and is zone redundant.
    #
    # The operator names the Azure DocumentDB cluster in infra.overrides.host,
    # so CATALOG_DOCS_HOST carries that name and CATALOG_DOCS_URI the address
    # built on it. The cluster keeps this Recipe's defaults, one shard on the
    # M30 tier with 32 GiB of storage, no standby and the service's newest
    # MongoDB version, and takes public network access, admitted by the
    # firewall rules the operator sets.
    #
    # The operator names the Azure AI Search service in infra.overrides.host,
    # so CATALOG_SEARCH_HOST carries that name and CATALOG_SEARCH_ENDPOINT the
    # address built on it. The service keeps this Recipe's defaults, the
    # standard tier with one replica and one partition, in the resource
    # group's region, and takes public network access.
    #
    # The operator names the Azure Cosmos DB account in infra.overrides.host,
    # so CATALOG_ITEMS_HOST carries that name and CATALOG_ITEMS_ENDPOINT the
    # address built on it. The account keeps this Recipe's defaults, 400 RU/s
    # for each container and no zone redundancy, in the resource group's
    # region, and takes public network access.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Key Vault
    # and its secrets, delegated subnet, Container Apps environment, managed
    # identity, container registry and example.com names stand for ones the
    # operator already has.
    azure:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            ha:
              enabled: true
            overrides:
              public_network_access_enabled: true
              host: orders-db.example.com

        ledger-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/ledger-db-password
          infra:
            ha:
              enabled: true
            overrides:
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
              host: ledger-db.example.com

        catalog-docs:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-docs-password
          infra:
            overrides:
              public_network_access: Enabled
              host: catalog-docs.example.com

        catalog-search:
          infra:
            overrides:
              public_network_access_enabled: true
              host: catalog-search.example.com

        catalog-items:
          infra:
            overrides:
              public_network_access_enabled: true
              host: catalog-items.example.com

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
