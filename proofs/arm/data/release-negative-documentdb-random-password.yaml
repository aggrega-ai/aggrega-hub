# core/random-password on the password slot, bound in the Manifest to the
# FeatureRecipe that draws a password with Terraform's random provider: a
# password the target draws, where the cluster takes a Key Vault secret's
# reference.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-random-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-negative-documentdb-random-password.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
