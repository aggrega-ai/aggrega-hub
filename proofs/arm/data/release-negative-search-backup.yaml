# core/backup attached to the search service, which keeps no backup of its
# own and which no FeatureRecipe on this capability binds.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          features:
            backup:
              type: core/backup
