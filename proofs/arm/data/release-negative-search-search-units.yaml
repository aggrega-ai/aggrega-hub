# Twelve replicas of four partitions, 48 search units, above the 36 a
# service is given.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-search-units
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              replica_count: 12
              partition_count: 4
