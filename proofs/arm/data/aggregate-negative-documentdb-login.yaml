apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-documentdb-login
  version: "1.0.0"
  description: >
    An Azure DocumentDB cluster whose administrator login is empty.
spec:
  components:
    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: ""
