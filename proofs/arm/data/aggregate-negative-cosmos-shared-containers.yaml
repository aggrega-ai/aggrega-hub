apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cosmos-shared-containers
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account whose database declares 26 containers, one
    more than a database sharing its throughput takes.
spec:
  components:
    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
        containers:
          c01:
