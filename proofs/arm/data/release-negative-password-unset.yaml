# Nothing attached to the password slot: the service draws no password.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-password-unset
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-db:
          infra:
            overrides:
              location: westeurope
