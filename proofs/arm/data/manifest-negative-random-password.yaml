apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative-random-password
  version: "1.0.0"
  description: >
    SQL Server bound to Azure SQL Database, with core/random-password bound to
    the FeatureRecipe that draws a password with Terraform's random provider,
    so a password drawn at apply time reaches the Azure SQL Database Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: arm/sql-server-azure-sql-database:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
