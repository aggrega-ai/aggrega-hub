# infra.overrides.host carrying a scheme, where it is a bare DNS name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-items:
          infra:
            overrides:
              host: https://catalog-items.example.com
