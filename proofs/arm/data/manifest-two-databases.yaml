apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: data-two-databases
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates, for the Aggregate holding
    two SQL Server databases and an Azure DocumentDB cluster: SQL Server
    bound to Azure SQL Database, and the ledger-db component to Azure SQL
    Managed Instance, Azure DocumentDB bound to its Recipe, each password
    slot holding core/referenced-secret bound to the FeatureRecipe that
    points at a Key Vault secret, and the generic server bound to its
    Container Apps Recipe. No FeatureRecipe here binds core/backup, which no
    realization on this capability offers.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: arm/sql-server-azure-sql-database:1.0.0
        core/datastore/azure-documentdb:1.0.0: arm/azure-documentdb:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
      name:
        ledger-db: arm/sql-server-azure-sql-managed-instance:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
