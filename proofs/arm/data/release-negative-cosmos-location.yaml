# infra.overrides.location as a list, where it names one region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-items:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
