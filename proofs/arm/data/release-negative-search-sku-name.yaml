# infra.overrides.sku_name naming a tier by its portal label, S1, rather
# than the module's value, standard.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              sku_name: S1
