apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-two-databases.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and the address the database publishes resolves inside the template.
    # The database runs on four vCores of the Business Critical tier with
    # 64 GiB of storage; its server keeps public network access disabled, so
    # clients reach it through the operator's private endpoint. The server on
    # Container Apps runs in the operator's environment, pulls its image with a
    # user-assigned identity, and reads the database password from the same
    # Key Vault secret, named under its secrets.
    #
    # The ledger database is a managed instance in the operator's delegated
    # subnet, on eight vCores of the Business Critical tier on standard-series
    # hardware with 256 GiB of storage, aligned with SQL Server 2025 and priced
    # for a SQL Server licence the operator brings; the server reads its
    # password from that instance's own Key Vault secret.
    #
    # The Azure DocumentDB cluster runs MongoDB 8.0 on two shards of the M40
    # tier, each with 256 GiB of storage and a standby; its public network
    # access stays off, and the server reads its administrator's password from
    # the cluster's own Key Vault secret. The cluster keeps the service's
    # automated backups, 35 days, since no FeatureRecipe on this capability
    # binds core/backup.
    #
    # The Azure AI Search service runs on the standard2 tier with three
    # replicas, for a read-write service level agreement, and two partitions,
    # with the semantic ranker on its standard plan; its public network access
    # stays off, and its API keys are off, so the server reaches it as its
    # managed identity, under a role assignment the operator makes.
    #
    # The Azure Cosmos DB account is zone redundant in its region and reads
    # with bounded staleness; its database shares 1000 RU/s between its two
    # containers, one keyed by tenant and one by tenant and user. Its public
    # network access stays off, and its keys are off, so the server reaches
    # it as its managed identity too. It keeps the module's continuous
    # backup, at its 30-day tier, since no FeatureRecipe on this capability
    # binds core/backup.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Key Vault
    # and its secrets, delegated subnet, Container Apps environment, managed
    # identity and container registry stand for ones the operator already has.
    azure:
      directory: main
      components:
        orders-db:
          # The administrator's password is a Key Vault secret the operator
          # created; the template carries a Key Vault reference to it.
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            storage:
              size: 64Gi
            overrides:
              location: westeurope
              sku_name: BC_Gen5_4
              enable_telemetry: false
              tags:
                environment: production

        ledger-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/ledger-db-password
          infra:
            engine_version: "2025"
            storage:
              size: 256Gi
            overrides:
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
              location: westeurope
              sku_name: BC_Gen5
              vcores: 8
              license_type: BasePrice
              tags:
                environment: production

        catalog-docs:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-docs-password
          infra:
            engine_version: "8.0"
            storage:
              size: 256Gi
            ha:
              enabled: true
            overrides:
              location: westeurope
              sku_name: M40
              shard_count: 2
              tags:
                environment: production

        catalog-search:
          infra:
            overrides:
              location: westeurope
              sku_name: standard2
              replica_count: 3
              partition_count: 2
              tags:
                environment: production

        catalog-items:
          infra:
            ha:
              enabled: true
            overrides:
              location: westeurope
              throughput: 1000
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              secrets:
                ORDERS_DB_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
                LEDGER_DB_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/ledger-db-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
                CATALOG_DOCS_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-docs-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
