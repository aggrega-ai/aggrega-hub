apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and the address the database publishes resolves inside the template.
    # The database runs on four vCores of the Business Critical tier with
    # 64 GiB of storage; its server keeps public network access disabled, so
    # clients reach it through the operator's private endpoint. The server on
    # Container Apps runs in the operator's environment, pulls its image with a
    # user-assigned identity, and reads the database password from the same
    # Key Vault secret, named under its secrets.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Key Vault
    # and its secret, Container Apps environment, managed identity and
    # container registry stand for ones the operator already has.
    azure:
      directory: main
      components:
        orders-db:
          # The administrator's password is a Key Vault secret the operator
          # created; the template carries a Key Vault reference to it.
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            storage:
              size: 64Gi
            overrides:
              location: westeurope
              sku_name: BC_Gen5_4
              enable_telemetry: false
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              secrets:
                ORDERS_DB_PASSWORD:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
