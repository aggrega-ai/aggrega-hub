# core/backup attached to the database, which no FeatureRecipe on this
# capability binds.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
            backup:
              type: core/backup
              infra:
                retention_days: 14
