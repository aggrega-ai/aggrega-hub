# infra.overrides.enable_telemetry true, which no override turns on: the
# module's telemetry is always off.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              enable_telemetry: true
