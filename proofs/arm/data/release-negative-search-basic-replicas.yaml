# Four replicas on the basic tier, which gives up to three.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-basic-replicas
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              sku_name: basic
              replica_count: 4
