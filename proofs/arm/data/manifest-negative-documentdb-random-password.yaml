apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative-documentdb-random-password
  version: "1.0.0"
  description: >
    Azure DocumentDB bound to its Recipe, with core/random-password bound to
    the FeatureRecipe that draws a password with Terraform's random provider,
    so a password drawn at apply time reaches the Azure DocumentDB Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/azure-documentdb:1.0.0: arm/azure-documentdb:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
