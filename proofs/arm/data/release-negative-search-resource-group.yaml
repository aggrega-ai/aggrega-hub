# infra.overrides.resource_group_name, which names no parameter of the
# template: it deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
