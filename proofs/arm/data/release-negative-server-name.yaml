# The component's name, which names the logical server, holds an underscore.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server-name.yaml
  manifest: ./manifest.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders_db:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
