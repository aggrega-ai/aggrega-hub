apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: data
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: SQL Server bound to Azure
    SQL Database, whose password slot holds core/referenced-secret bound to
    the FeatureRecipe that points at a Key Vault secret, and the generic
    server bound to its Container Apps Recipe. No FeatureRecipe here binds
    core/backup, which no realization on this capability offers.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: arm/sql-server-azure-sql-database:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
