apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: documentdb
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: Azure DocumentDB bound to
    its Recipe, whose password slot holds core/referenced-secret bound to the
    FeatureRecipe that points at a Key Vault secret, for the Releases that
    prove what that Recipe refuses on its own. No FeatureRecipe here binds
    core/backup, which no realization on this capability offers.
spec:
  mappings:
    components:
      type:
        core/datastore/azure-documentdb:1.0.0: arm/azure-documentdb:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
