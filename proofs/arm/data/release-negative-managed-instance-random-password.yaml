# core/random-password on the password slot, whose password Terraform draws at
# apply time, which no template can read.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-managed-instance-random-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-managed-instance-only.yaml
  manifest: ./manifest-negative-managed-instance-random-password.yaml
  boundaries:
    azure:
      directory: main
      components:
        ledger-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
