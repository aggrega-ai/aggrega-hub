apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cosmos-only
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account alone, with one container and the default
    consistency level, for the Releases that prove what the Azure Cosmos DB
    Recipe refuses on its own.
spec:
  components:
    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
        containers:
          items:
            partition_key_paths: [/tenantId]
