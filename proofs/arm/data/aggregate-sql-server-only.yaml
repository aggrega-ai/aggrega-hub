apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sql-server-only
  version: "1.0.0"
  description: >
    A SQL Server database alone, for the Releases that prove what the Azure
    SQL Database Recipe refuses on its own.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: orders
        user: orders_admin
