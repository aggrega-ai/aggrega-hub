# infra.overrides.resource_group_name, which the template does not read: it
# deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-items:
          infra:
            overrides:
              resource_group_name: example-rg
