# An infra.overrides key this Recipe does not read: replicas, where the
# key is replica_count.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              replicas: 3
