# The database named msdb, a system database every managed instance holds.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-managed-instance-database-name
  version: "1.0.0"
  description: >
    A SQL Server database named after a system database SQL Server keeps on
    every instance.
spec:
  components:
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: msdb
        user: ledger_admin
