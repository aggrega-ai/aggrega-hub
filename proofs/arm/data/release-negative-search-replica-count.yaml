# infra.overrides.replica_count above the 12 replicas a service takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-replica-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              replica_count: 13
