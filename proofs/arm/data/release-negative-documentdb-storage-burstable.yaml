# infra.storage.size of 256 GiB on the burstable M20 tier, which takes
# 32, 64 or 128 GiB.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-storage-burstable
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-docs:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-docs-password
          infra:
            storage:
              size: 256Gi
            overrides:
              sku_name: M20
