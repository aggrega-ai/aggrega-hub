# The administrator login named serveradmin, a server role SQL Server keeps.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-managed-instance-login
  version: "1.0.0"
  description: >
    A SQL Server database whose administrator login is the name of a server
    role SQL Server keeps.
spec:
  components:
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: serveradmin
