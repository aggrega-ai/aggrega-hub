apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: managed-instance
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: SQL Server bound to Azure
    SQL Managed Instance, whose password slot holds core/referenced-secret
    bound to the FeatureRecipe that points at a Key Vault secret, for the
    Releases that prove what that Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: arm/sql-server-azure-sql-managed-instance:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
