apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: data
  version: "1.0.0"
  description: >
    Two SQL Server databases, an Azure DocumentDB cluster and an Azure AI
    Search service, and a server on Container Apps reading the address, the
    port and the login each publishes, so the server's environment shows
    what a consumer receives.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: orders
        user: orders_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin

    catalog-search:
      type: core/datastore/azure-ai-search
      values:
        semantic_search: standard

    api:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
                - in: ORDERS_DB_USER
                  from: user
        ledger:
          ledger-db:
            target: ledger-db
            inject:
              env:
                - in: LEDGER_DB_HOST
                  from: host
                - in: LEDGER_DB_PORT
                  from: port
                - in: LEDGER_DB_NAME
                  from: database
                - in: LEDGER_DB_USER
                  from: user
        catalog:
          catalog-docs:
            target: catalog-docs
            inject:
              env:
                - in: CATALOG_DOCS_HOST
                  from: host
                - in: CATALOG_DOCS_PORT
                  from: port
                - in: CATALOG_DOCS_USER
                  from: user
                - in: CATALOG_DOCS_URI
                  from: endpoint
        search:
          catalog-search:
            target: catalog-search
            inject:
              env:
                - in: CATALOG_SEARCH_HOST
                  from: host
                - in: CATALOG_SEARCH_PORT
                  from: port
                - in: CATALOG_SEARCH_ENDPOINT
                  from: endpoint
