# infra.overrides.enable_telemetry true, which this Recipe never turns on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-items:
          infra:
            overrides:
              enable_telemetry: true
