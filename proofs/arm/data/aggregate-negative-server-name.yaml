# The component's name, which names the logical server, holds an underscore,
# which a server name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-server-name
  version: "1.0.0"
  description: >
    A SQL Server database whose component name is no logical server name.
spec:
  components:
    orders_db:
      type: core/datastore/sql-server
      values:
        database: orders
        user: orders_admin
