# A component name holding an underscore, which names the cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-cluster-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-documentdb-cluster-name.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog_docs:
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/catalog-docs-password
