# infra.overrides.throughput 450, which is not a step of 100.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-throughput
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-items:
          infra:
            overrides:
              throughput: 450
