# infra.overrides.location given as a list of regions, where a service
# is created in one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
