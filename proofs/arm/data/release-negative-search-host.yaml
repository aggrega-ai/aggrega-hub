# infra.overrides.host carrying a scheme, where it takes the bare DNS
# name: endpoint is https:// followed by it.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azure:
      directory: main
      components:
        catalog-search:
          infra:
            overrides:
              host: https://catalog-search.example.com
