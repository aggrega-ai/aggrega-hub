# infra.overrides.resource_group_name, which this Recipe refuses: the
# template deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-grid-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-grid-only.yaml
  manifest: ./manifest-event-grid.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-topic:
          infra:
            overrides:
              resource_group_name: example-rg
