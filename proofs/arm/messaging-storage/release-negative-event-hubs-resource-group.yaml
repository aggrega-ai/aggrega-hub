# infra.overrides.resource_group_name, which names no property of the
# template: it deploys into the resource group it is deployed to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
