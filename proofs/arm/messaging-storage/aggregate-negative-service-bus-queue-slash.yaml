# A queue whose name holds a slash.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-service-bus-queue-slash
  version: "1.0.0"
spec:
  components:
    orders-bus:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders/eu: {}
