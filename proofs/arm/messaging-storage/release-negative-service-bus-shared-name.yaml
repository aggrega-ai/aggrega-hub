# A queue named orders and a topic named Orders, which name one entity in the
# namespace, since Service Bus names are case-insensitive.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-shared-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-service-bus-shared-name.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus: {}
