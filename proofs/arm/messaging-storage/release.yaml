apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: messaging-storage
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and the address the namespace publishes resolves inside the template.
    #
    # The Azure Service Bus namespace runs on the Premium tier with two
    # messaging units. Its public network access is off, so clients reach it
    # through the operator's private endpoint, and its shared access
    # signature authentication is off, so the server reaches it as its
    # managed identity, under a role assignment the operator makes. The server
    # on Container Apps runs in the operator's environment and pulls its
    # image with a user-assigned identity.
    #
    # The Azure Event Hubs namespace runs on the Premium tier with two
    # processing units, its public network access off and its shared access
    # signature authentication off, so the second server reaches it, over
    # AMQP or Kafka, as its managed identity.
    #
    # The Azure Event Grid topic takes CloudEvents, its public network access
    # off and its access key authentication off, so the third server
    # publishes to it as its managed identity, under a role assignment the
    # operator makes. The module's telemetry is off.
    #
    # The Azure Storage account is zone-redundant, with new blobs in the Cool
    # tier, its public network access off and its Shared Key authorization
    # off, so the fourth server reaches its blob and Data Lake Storage
    # endpoints as its managed identity, under a role assignment the
    # operator makes.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Container
    # Apps environment, managed identity and container registry stand for ones
    # the operator already has.
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              location: westeurope
              sku_name: Premium
              sku_capacity: 2
              public_network_access_enabled: false
              enable_telemetry: false
              tags:
                environment: production

        orders-events:
          infra:
            overrides:
              location: westeurope
              sku_name: Premium
              sku_capacity: 2
              public_network_access_enabled: false
              tags:
                environment: production

        orders-topic:
          infra:
            overrides:
              location: westeurope
              public_network_access_enabled: false
              enable_telemetry: false
              tags:
                environment: production

        ordersdata:
          infra:
            overrides:
              location: westeurope
              sku_name: Standard_ZRS
              access_tier: Cool
              public_network_access: Disabled
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

        events-api:
          infra:
            image: example.azurecr.io/example/events-api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

        publisher-api:
          infra:
            image: example.azurecr.io/example/publisher-api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

        files-api:
          infra:
            image: example.azurecr.io/example/files-api:1.0.0
            port: 8080
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
