# A component named with a hyphen, which a storage account name does not
# take: Microsoft documents a storage account name as lowercase letters and
# digits.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-blob-storage-account-name
  version: "1.0.0"
spec:
  components:
    orders-data:
      type: core/storage/azure-blob-storage
