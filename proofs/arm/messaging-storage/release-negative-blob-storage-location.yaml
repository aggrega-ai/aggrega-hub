# infra.overrides.location as a list of regions, where an account is
# created in one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersdata:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
