apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: service-bus-only
  version: "1.0.0"
  description: >
    An Azure Service Bus namespace alone, with a queue and a topic and no
    sessions, for the Releases that prove what the Azure Service Bus Recipe
    refuses on its own.
spec:
  components:
    orders-bus:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders: {}
        topics:
          order-events:
            subscriptions:
              audit: {}
