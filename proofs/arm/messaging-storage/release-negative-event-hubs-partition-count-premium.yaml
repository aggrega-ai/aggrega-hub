# An event hub of 101 partitions on the Premium tier, which takes 100; two
# processing units keep the namespace's total within its 400.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-partition-count-premium
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-partition-count-premium.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              sku_name: Premium
              sku_capacity: 2
