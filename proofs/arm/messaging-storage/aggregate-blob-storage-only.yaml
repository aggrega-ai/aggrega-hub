apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: blob-storage-only
  version: "1.0.0"
  description: >
    An Azure Storage account alone, holding no container, with a flat
    namespace, for the Releases that prove what the Azure Blob Storage
    Recipe refuses on its own.
spec:
  components:
    ordersdata:
      type: core/storage/azure-blob-storage
