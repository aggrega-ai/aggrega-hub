# infra.overrides.location as a list of regions, where a topic is created
# in one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-grid-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-grid-only.yaml
  manifest: ./manifest-event-grid.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-topic:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
