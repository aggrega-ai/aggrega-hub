# infra.overrides.enable_telemetry, which a template of this catalog's own
# has no use for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersdata:
          infra:
            overrides:
              enable_telemetry: false
