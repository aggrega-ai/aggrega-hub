# infra.overrides.public_network_access as a boolean, where it is the
# string Enabled, Disabled or SecuredByPerimeter.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersdata:
          infra:
            overrides:
              public_network_access: false
