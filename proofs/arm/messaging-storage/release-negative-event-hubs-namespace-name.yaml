# A component whose name, which names the namespace, is seven characters long,
# where the template schema Microsoft publishes for a namespace takes 8 to
# 50.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-namespace-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-namespace-name.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersx: {}
