# A component named ordersx, which names its namespace: seven characters,
# where the template schema Microsoft publishes for a namespace takes 8 to
# 50.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-hubs-namespace-name
  version: "1.0.0"
spec:
  components:
    ordersx:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders: {}
