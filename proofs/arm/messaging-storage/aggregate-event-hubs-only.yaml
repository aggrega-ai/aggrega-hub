apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: event-hubs-only
  version: "1.0.0"
  description: >
    An Azure Event Hubs namespace alone, holding one event hub on the
    default partition count, for the Releases that prove what the Azure
    Event Hubs Recipe refuses on its own.
spec:
  components:
    orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders: {}
