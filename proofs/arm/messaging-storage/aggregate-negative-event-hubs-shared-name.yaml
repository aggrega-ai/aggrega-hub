# Two event hubs whose names differ only in case, which name one event hub,
# since Azure resource names are case-insensitive.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-hubs-shared-name
  version: "1.0.0"
spec:
  components:
    orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders: {}
          Orders: {}
