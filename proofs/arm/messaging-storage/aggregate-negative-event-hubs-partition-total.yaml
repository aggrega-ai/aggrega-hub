# Three event hubs of 100 partitions each, 300 in all, where a Premium
# namespace takes 200 for each processing unit; each event hub stays within
# the 100 an event hub on Premium takes.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-hubs-partition-total
  version: "1.0.0"
spec:
  components:
    orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          audit:
            partition_count: 100
          clickstream:
            partition_count: 100
          orders:
            partition_count: 100
