# infra.overrides.public_network_access_enabled as the string Disabled, where
# it is a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              public_network_access_enabled: Disabled
