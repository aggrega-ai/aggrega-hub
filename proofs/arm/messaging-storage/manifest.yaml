apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: messaging-storage
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: Azure Service Bus,
    Azure Event Hubs and Azure Event Grid each bound to its Recipe, and the
    generic server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/messaging/azure-service-bus:1.0.0: arm/azure-service-bus:1.0.0
        core/messaging/azure-event-hubs:1.0.0: arm/azure-event-hubs:1.0.0
        core/messaging/azure-event-grid:1.0.0: arm/azure-event-grid:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.1.0
