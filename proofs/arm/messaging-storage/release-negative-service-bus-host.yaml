# infra.overrides.host carrying a scheme, where the key takes a bare DNS
# name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              host: https://orders-bus.example.com
