apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: messaging-storage
  version: "1.0.0"
  description: >
    An Azure Service Bus namespace holding two queues, one taking messages
    by session, and two topics, one with two subscriptions, and a server on
    Container Apps reading the host name and endpoint the namespace
    publishes, so the server's environment shows what a consumer receives.
spec:
  components:
    orders-bus:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders: {}
          payments:
            requires_session: true
            max_delivery_count: 5
        topics:
          order-events:
            subscriptions:
              audit: {}
              billing:
                requires_session: true
                max_delivery_count: 3
          notifications: {}

    api:
      type: core/compute/server
      uses:
        bus:
          orders-bus:
            target: orders-bus
            inject:
              env:
                - in: ORDERS_BUS_HOST
                  from: host
                - in: ORDERS_BUS_ENDPOINT
                  from: endpoint
