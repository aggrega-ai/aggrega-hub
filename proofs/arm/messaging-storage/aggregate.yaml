apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: messaging-storage
  version: "1.0.0"
  description: >
    An Azure Service Bus namespace holding two queues, one taking messages
    by session, and two topics, one with two subscriptions, and a server on
    Container Apps reading the host name and endpoint the namespace
    publishes; an Azure Event Hubs namespace holding three event hubs,
    and a second server reading its host name, endpoint and Kafka
    bootstrap servers; and an Azure Event Grid topic taking CloudEvents,
    and a third server reading its host name and endpoint. Each server's
    environment shows what a consumer receives.
spec:
  components:
    orders-bus:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders: {}
          payments:
            requires_session: true
            max_delivery_count: 5
        topics:
          order-events:
            subscriptions:
              audit: {}
              billing:
                requires_session: true
                max_delivery_count: 3
          notifications: {}

    api:
      type: core/compute/server
      uses:
        bus:
          orders-bus:
            target: orders-bus
            inject:
              env:
                - in: ORDERS_BUS_HOST
                  from: host
                - in: ORDERS_BUS_ENDPOINT
                  from: endpoint

    orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders:
            partition_count: 4
          clickstream.v1:
            partition_count: 32
          audit: {}

    events-api:
      type: core/compute/server
      uses:
        events:
          orders-events:
            target: orders-events
            inject:
              env:
                - in: ORDERS_EVENTS_HOST
                  from: host
                - in: ORDERS_EVENTS_ENDPOINT
                  from: endpoint
                - in: ORDERS_EVENTS_BOOTSTRAP_SERVERS
                  from: bootstrap_servers

    orders-topic:
      type: core/messaging/azure-event-grid
      values:
        input_schema: CloudEventSchemaV1_0

    publisher-api:
      type: core/compute/server
      uses:
        notices:
          orders-topic:
            target: orders-topic
            inject:
              env:
                - in: ORDERS_TOPIC_HOST
                  from: host
                - in: ORDERS_TOPIC_ENDPOINT
                  from: endpoint
