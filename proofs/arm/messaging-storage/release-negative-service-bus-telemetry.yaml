# infra.overrides.enable_telemetry true, which this Recipe never turns on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              enable_telemetry: true
