# infra.overrides.host as a URL, where it is a bare DNS name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersdata:
          infra:
            overrides:
              host: https://ordersdata.example.com
