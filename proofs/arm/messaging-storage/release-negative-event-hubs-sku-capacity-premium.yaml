# Three processing units on the Premium tier, which takes 1, 2, 4, 6, 8, 10,
# 12 or 16.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-sku-capacity-premium
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              sku_name: Premium
              sku_capacity: 3
