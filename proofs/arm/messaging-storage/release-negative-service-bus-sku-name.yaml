# infra.overrides.sku_name in lower case, a spelling the module does not
# take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              sku_name: standard
