# infra.overrides.sku_capacity 3 on the Premium tier, which takes 1, 2, 4, 8
# or 16 messaging units.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-sku-capacity
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              sku_name: Premium
              sku_capacity: 3
