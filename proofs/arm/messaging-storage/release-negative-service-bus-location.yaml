# infra.overrides.location as a list of regions, where a namespace is
# created in one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-bus:
          infra:
            overrides:
              location:
                - westeurope
                - northeurope
