# infra.overrides.sku_name Basic, a tier that serves no Kafka endpoint, which
# this Recipe publishes in bootstrap_servers.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-sku-basic
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              sku_name: Basic
