# Three hundred partitions across the event hubs on one Premium processing
# unit, which takes 200.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-partition-total
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-partition-total.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azure:
      directory: main
      components:
        orders-events:
          infra:
            overrides:
              sku_name: Premium
