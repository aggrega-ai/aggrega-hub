# infra.overrides.sku_name Premium_LRS, a premium SKU, where this Recipe
# creates a standard general-purpose v2 account.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azure:
      directory: main
      components:
        ordersdata:
          infra:
            overrides:
              sku_name: Premium_LRS
