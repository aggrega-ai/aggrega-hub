apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One directory, so one template, deployed to one resource group: each
    # Recipe creates its resources in the group the template is deployed to,
    # and the API Management Recipe adds its API to an instance in that same
    # group. A reference a datastore or a model publishes then resolves inside
    # the template.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Key Vault and its secrets, managed
    # identity, container registry, Container Apps environment and API
    # Management instance stand for ones the operator already has.
    azure:
      directory: main
      components:
        orders-db:
          # The administrator's password is a Key Vault secret the operator
          # created; the template carries a Key Vault reference to it.
          features:
            password:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/orders-db-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
              type: Premium_LRS
            overrides:
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
              server_configuration:
                extensions:
                  name: azure.extensions
                  config: VECTOR

        # The worker reads the cache's access key from a Key Vault secret the
        # operator keeps it in, named under the worker's secrets.
        sessions:
          infra:
            client_tls: true
            overrides:
              location: westeurope
              default_database_access_keys_authentication_enabled: true

        chat-model:
          infra:
            overrides:
              location: westeurope
              custom_subdomain_name: example-chat

        embedding-model:
          infra:
            overrides:
              location: westeurope
              custom_subdomain_name: example-embedding

        # The backend is the chat model's resource, at the address its
        # custom subdomain gives it. The key the gateway presents to it is a
        # Key Vault secret the instance reads with its managed identity.
        chat-gateway:
          features:
            provider_key:
              type: core/referenced-secret
              infra:
                origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/chat-provider-key
          infra:
            api_management_name: example-apim
            api_path: chat
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: provider_key

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity

        jobs:
          infra:
            image: example.azurecr.io/example/jobs:1.0.0
            replicas: 1
            overrides:
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              secrets:
                SESSIONS_ACCESS_KEY:
                  origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.KeyVault/vaults/example-vault/secrets/sessions-access-key
                  identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
