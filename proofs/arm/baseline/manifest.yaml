apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through Azure Resource Manager templates: each Component type bound
    to the newest version of the catalog's Recipe realizing it there, and
    core/referenced-secret to the FeatureRecipe that points at a Key Vault
    secret. Each component of the Aggregate has a type of its own, so the type
    tier binds them all.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: arm/postgres-flexible-server:1.0.0
        core/datastore/redis:1.0.0: arm/redis-azure-managed:1.0.0
        core/ai-model/azure-openai:1.0.0: arm/azure-openai:1.0.0
        core/ai-model/azure-openai-embedding:1.0.0: arm/azure-openai-embedding:1.0.0
        core/gateway/azure-api-management:1.0.0: arm/azure-api-management:1.0.0
        core/compute/server:1.1.0: arm/server-container-apps:1.0.0
        core/compute/worker:1.0.0: arm/worker-container-apps:1.0.0
    features:
      type:
        core/referenced-secret:1.0.0: arm/key-vault-secret:1.0.0
