apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: task-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-task.yaml
  manifest: ./manifest-task.yaml
  boundaries:
    # The operator names the primary instance and the cache in
    # infra.overrides.host, so each task's ORDERS_DB_HOST and SESSIONS_HOST
    # carry those names in place of the references to the modules' outputs.
    # A name references nothing Terraform could order the tasks after, so the
    # tasks sit in a later wave of the same root configuration, and their
    # module blocks depend on the cluster's and the instance's.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network with private services access, and the service accounts and
    # images for ones the operator already has; example.com stands for the
    # operator's own domain.
    google:
      directory: main
      syncWave: 0
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              zone: europe-west1-b
              host: orders-db.example.com

        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
              host: sessions.example.com

    google-late:
      directory: main
      syncWave: 1
      components:
        nightly-report:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/nightly-report:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly-report@example-project.iam.gserviceaccount.com

        hourly-sync:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/hourly-sync:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: hourly-sync@example-project.iam.gserviceaccount.com

        reindex:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com
