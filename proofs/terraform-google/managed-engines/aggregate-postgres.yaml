apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB and a server on Cloud Run reading the
    address, the port, the database and the user it publishes, so the
    server's environment shows what a consumer of the cluster receives. The
    database is postgres, the one database an AlloyDB cluster holds.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin

    storefront:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
                - in: ORDERS_DB_USER
                  from: user
