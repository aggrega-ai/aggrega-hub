apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: function
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: PostgreSQL bound to the AlloyDB cluster
    Google's AlloyDB module provisions, Redis to the Memorystore for Redis
    instance the catalog's own module declares, the generic function to its
    Cloud Run Recipe, and core/random-password to the FeatureRecipe that draws
    the initial user's password with the random provider.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-alloydb:1.0.0
        core/datastore/redis:1.0.0: terraform/redis-memorystore:1.0.0
        core/compute/function:1.0.0: terraform/function-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
