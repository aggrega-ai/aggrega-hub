# No infra.overrides.region: the Recipe never chooses the region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-region-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              private_network: projects/example-project/global/networks/example-network
