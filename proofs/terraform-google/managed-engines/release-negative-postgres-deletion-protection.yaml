# infra.overrides.deletion_protection written as a word, not a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-deletion-protection
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              deletion_protection: "yes"
