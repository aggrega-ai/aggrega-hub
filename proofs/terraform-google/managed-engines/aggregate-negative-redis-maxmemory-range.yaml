apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redis-maxmemory-range
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis whose Aggregate sets values.maxmemory below a fifth of the instance's capacity,
    for the Release that halts on it.
spec:
  components:
    sessions:
      type: core/datastore/redis
      values:
        maxmemory: 64mb
