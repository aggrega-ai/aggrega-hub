apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: task
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB, a Redis cache on Memorystore for Redis
    and the generic task on Cloud Run reading their addresses: a nightly
    report on a schedule, reading both, an hourly sync on a schedule of its
    own, and a reindex started by hand, so each task's environment shows what
    a consumer of the cluster and of the instance receives.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin

    sessions:
      type: core/datastore/redis

    # Its timeout reaches the container as TASK_TIMEOUT, its default name,
    # for the code to honour.
    nightly-report:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"
        timeout: 45m
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port

    hourly-sync:
      type: core/compute/task
      values:
        schedule: "0 * * * *"
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host

    # With no schedule, core/manual-trigger deploys the job alone, for the
    # operator to start each run.
    reindex:
      type: core/compute/task
      features:
        on_demand:
          type: core/manual-trigger
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
