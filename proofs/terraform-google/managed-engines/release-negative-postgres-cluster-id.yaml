# A component whose name, orders_db, AlloyDB does not take for a cluster ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-cluster-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-postgres-cluster-id.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders_db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
