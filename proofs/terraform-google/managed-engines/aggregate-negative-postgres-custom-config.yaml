apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-custom-config
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB whose Aggregate sets values.custom_config, for the
    Release that halts on it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin
        custom_config: "max_connections = 500"
