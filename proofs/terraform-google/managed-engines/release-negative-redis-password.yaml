# A password on the password slot, which the service accepts none for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis-only.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
