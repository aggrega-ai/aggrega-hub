# Point-in-time recovery asked for over a retention longer than the 35 days
# AlloyDB's recovery window reaches.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-point-in-time-recovery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 36
                point_in_time_recovery: true
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
