# No infra.overrides.project_id: the Recipe never chooses the project.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-project-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis-only.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
