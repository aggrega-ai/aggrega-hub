# A function naming its network tags under a misspelt key, which this
# Recipe reads under no name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-function-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-function-only.yaml
  manifest: ./manifest-function.yaml
  boundaries:
    google:
      directory: main
      components:
        thumbnailer:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/thumbnailer:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: thumbnailer@example-project.iam.gserviceaccount.com
              network_tag:
                - thumbnailer
