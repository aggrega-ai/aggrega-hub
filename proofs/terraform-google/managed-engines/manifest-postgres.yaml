apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: PostgreSQL bound to the AlloyDB cluster
    Google's AlloyDB module provisions, core/random-password to the
    FeatureRecipe that draws the initial user's password with the random
    provider, core/backup to the cluster's own backups, core/generated-secret
    to its terraform realization, and the generic server bound to its Cloud
    Run Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-alloydb:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.2.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
