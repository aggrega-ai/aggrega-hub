apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: function
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB, a Redis cache on Memorystore for Redis
    and the generic function on Cloud Run reading their addresses: a
    thumbnailer reading both, at the Component's floor of no instance, and a
    checkout hook reading the database, kept warm, so each function's
    environment shows what a consumer of the cluster and of the instance
    receives.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin

    sessions:
      type: core/datastore/redis

    # Its runtime reaches the container as FUNCTION_RUNTIME, its default
    # name.
    thumbnailer:
      type: core/compute/function
      values:
        runtime: python3.12
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port

    checkout-hook:
      type: core/compute/function
      values:
        runtime: nodejs22
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
