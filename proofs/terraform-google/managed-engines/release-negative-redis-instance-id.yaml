# A component whose name, user_sessions, the service does not take for an
# instance ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-instance-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-redis-instance-id.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        user_sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
