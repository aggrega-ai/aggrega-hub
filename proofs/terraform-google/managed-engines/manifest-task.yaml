apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: task
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: PostgreSQL bound to the AlloyDB cluster
    Google's AlloyDB module provisions, Redis to the Memorystore for Redis
    instance the catalog's own module declares, the generic task to its Cloud
    Run Recipe, core/random-password to the FeatureRecipe that draws the
    initial user's password with the random provider, and core/manual-trigger
    to its terraform realization.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-alloydb:1.0.0
        core/datastore/redis:1.0.0: terraform/redis-memorystore:1.0.0
        core/compute/task:1.0.1: terraform/task-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.0.0
