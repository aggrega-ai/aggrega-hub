# Nothing on the password slot: neither AlloyDB nor the module draws a
# password.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-password-empty
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
