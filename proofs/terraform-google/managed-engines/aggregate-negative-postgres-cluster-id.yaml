apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-cluster-id
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB whose component name carries an
    underscore, which a cluster ID cannot, for the Release that halts on it.
spec:
  components:
    orders_db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin
