# infra.overrides.replica_count above the 5 replicas a STANDARD_HA instance
# runs.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-replica-count-range
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis-only.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 5
              tier: STANDARD_HA
              replica_count: 6
