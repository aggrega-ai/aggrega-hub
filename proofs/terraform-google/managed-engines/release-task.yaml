apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: task
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-task.yaml
  manifest: ./manifest-task.yaml
  boundaries:
    # One boundary, so the cluster, the instance and the tasks are module
    # blocks of one Terraform root configuration, and each task's
    # ORDERS_DB_HOST and SESSIONS_HOST carry the references to the modules'
    # primary_instance_ip and host outputs, which Terraform resolves when it
    # applies. The nightly report's Cloud Scheduler job reads its schedule in
    # Europe/Rome and Cloud Run stops each attempt of it after an hour; the
    # hourly sync's reads its schedule in UTC, Cloud Scheduler's default, and
    # keeps Cloud Run's 10-minute task timeout; the reindex has no scheduler
    # job.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network with private services access, and the service accounts and
    # images for ones the operator already has.
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              zone: europe-west1-b

        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1

        nightly-report:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/nightly-report:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly-report@example-project.iam.gserviceaccount.com
              time_zone: Europe/Rome
              timeout: 3600s

        hourly-sync:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/hourly-sync:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: hourly-sync@example-project.iam.gserviceaccount.com

        reindex:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com
              subnetwork: example-subnet
              network_tags:
                - reindex
              deletion_protection: false
