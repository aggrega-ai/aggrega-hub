apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-init-scripts
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB whose Aggregate sets values.init_scripts, for the
    Release that halts on it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: postgres
        user: orders_admin
        init_scripts:
          01-schema.sql: "CREATE TABLE orders (id bigint PRIMARY KEY);"
