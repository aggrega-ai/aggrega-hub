apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    # One boundary, so the cluster and the server are module blocks of one
    # Terraform root configuration and the server's ORDERS_DB_HOST carries the
    # reference to the module's primary_instance_ip output, which Terraform
    # resolves when it applies. The primary instance is highly available, a
    # read pool runs beside it, the automated backups start at 02:00 UTC on
    # Mondays and Thursdays and are kept 60 days, and point-in-time recovery
    # reaches back the 35 days AlloyDB keeps at most.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project, example-network for a VPC
    # network with private services access and example-alloydb-range for its
    # allocated IP range, and the service account and image for ones the
    # operator already has.
    google:
      directory: main
      components:
        orders-db:
          # The initial user logs in with the password the random provider
          # draws, handed to AlloyDB as a Terraform reference.
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 60
                schedule: "0 2 * * 1,4"
          infra:
            engine_version: "16"
            ha:
              enabled: true
              read_replicas: 2
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              allocated_ip_range: example-alloydb-range
              machine_cpu_count: 4
              database_flags:
                max_connections: "500"
              deletion_protection: true

        storefront:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/storefront:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: storefront@example-project.iam.gserviceaccount.com
