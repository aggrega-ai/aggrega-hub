apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redis-maxmemory-policy-version
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis whose Aggregate sets an LFU values.maxmemory_policy,
    for the Release that halts on it.
spec:
  components:
    sessions:
      type: core/datastore/redis
      values:
        maxmemory_policy: allkeys-lfu
