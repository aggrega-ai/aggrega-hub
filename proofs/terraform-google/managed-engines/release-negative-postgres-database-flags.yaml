# infra.overrides.database_flags written as Cloud SQL's list, not the map
# AlloyDB takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-database-flags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              database_flags:
                - name: max_connections
                  value: "500"
