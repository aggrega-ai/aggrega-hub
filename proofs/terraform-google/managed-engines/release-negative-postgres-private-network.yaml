# infra.overrides.private_network names the network alone, not its
# resource link.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-private-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: example-network
