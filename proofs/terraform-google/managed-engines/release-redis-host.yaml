apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redis-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    # The operator names the instance in infra.overrides.host, so the server's
    # SESSIONS_HOST carries that name in place of the reference to the
    # module's host output. A name references nothing Terraform could order
    # the server after, so the server sits in a later wave of the same root
    # configuration, and its module block depends on the instance's. The
    # instance is a Basic Tier one of 3 GiB, the tier left to its default,
    # serving plaintext on 6379.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network, and the service account and image for ones the operator
    # already has; example.com stands for the operator's own domain.
    google:
      directory: main
      syncWave: 0
      components:
        sessions:
          infra:
            engine_version: "7.0"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 3
              host: sessions.example.com

    google-late:
      directory: main
      syncWave: 1
      components:
        storefront:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/storefront:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: storefront@example-project.iam.gserviceaccount.com
