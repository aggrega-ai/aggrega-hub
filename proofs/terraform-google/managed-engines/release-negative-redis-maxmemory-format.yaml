# values.maxmemory in no unit Redis reads.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-maxmemory-format
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-redis-maxmemory-format.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
