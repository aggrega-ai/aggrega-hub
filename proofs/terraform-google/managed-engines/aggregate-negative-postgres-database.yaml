apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-database
  version: "1.0.0"
  description: >
    A PostgreSQL database on AlloyDB whose Aggregate leaves values.database
    at the Component's default, for the Release that halts on it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        user: orders_admin
