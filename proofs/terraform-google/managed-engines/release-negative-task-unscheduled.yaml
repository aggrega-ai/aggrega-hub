# A task with no schedule and no core/manual-trigger attachment, which this
# Recipe starts no run of.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-task-unscheduled
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-task-unscheduled.yaml
  manifest: ./manifest-task.yaml
  boundaries:
    google:
      directory: main
      components:
        reindex:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com
