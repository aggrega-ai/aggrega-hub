apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redis
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    # One boundary, so the instance and the server are module blocks of one
    # Terraform root configuration and the server's SESSIONS_HOST carries the
    # reference to the module's host output, which Terraform resolves when it
    # applies. The instance is a Standard Tier one of 5 GiB with read
    # replicas, and serves TLS alone, so the server reads port 6378 and the
    # redis-tls protocol.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network, and the service account and image for ones the operator
    # already has.
    google:
      directory: main
      components:
        sessions:
          infra:
            engine_version: "7.2"
            client_tls: true
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 5
              tier: STANDARD_HA
              replica_count: 3

        storefront:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/storefront:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: storefront@example-project.iam.gserviceaccount.com
