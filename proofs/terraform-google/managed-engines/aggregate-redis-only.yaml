apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: redis-only
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis alone, for the Releases that halt
    on a setting of the cache.
spec:
  components:
    sessions:
      type: core/datastore/redis
