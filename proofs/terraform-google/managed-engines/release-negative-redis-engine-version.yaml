# infra.engine_version left at the Component's default, an image tag naming a
# release the service does not run.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redis-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redis-only.yaml
  manifest: ./manifest-redis.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
