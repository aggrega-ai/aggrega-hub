apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redis-appendonly
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis whose Aggregate sets values.appendonly,
    for the Release that halts on it.
spec:
  components:
    sessions:
      type: core/datastore/redis
      values:
        appendonly: true
