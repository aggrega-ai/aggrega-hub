apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: redis
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: Redis bound to the Memorystore for Redis
    instance the catalog's own module declares, the generic server bound to
    its Cloud Run Recipe, and core/random-password to the FeatureRecipe that
    draws a password with the random provider, for the Releases that attach
    one where the instance takes none.
spec:
  mappings:
    components:
      type:
        core/datastore/redis:1.0.0: terraform/redis-memorystore:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.2.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
