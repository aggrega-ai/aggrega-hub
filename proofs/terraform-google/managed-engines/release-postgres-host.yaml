apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    # The operator names the primary instance in infra.overrides.host, so the
    # server's ORDERS_DB_HOST carries that name in place of the reference to
    # the module's primary_instance_ip output. A name references nothing
    # Terraform could order the server after, so the server sits in a later
    # wave of the same root configuration, and its module block depends on
    # the cluster's. The primary instance runs in one zone the Release names,
    # and with no core/backup attached the cluster keeps its automated
    # backups and its recovery window 7 days.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network with private services access, and the service account and
    # image for ones the operator already has; example.com stands for the
    # operator's own domain.
    google:
      directory: main
      syncWave: 0
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "17"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              zone: europe-west1-b
              host: orders-db.example.com

    google-late:
      directory: main
      syncWave: 1
      components:
        storefront:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/storefront:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: storefront@example-project.iam.gserviceaccount.com
