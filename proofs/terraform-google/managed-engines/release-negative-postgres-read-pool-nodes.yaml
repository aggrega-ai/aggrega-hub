# More read replicas than the 20 nodes a read pool takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-read-pool-nodes
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            ha:
              read_replicas: 21
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
