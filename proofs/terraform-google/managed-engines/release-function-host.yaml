apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: function-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-function.yaml
  manifest: ./manifest-function.yaml
  boundaries:
    # The operator names the primary instance and the cache in
    # infra.overrides.host, so each function's ORDERS_DB_HOST and
    # SESSIONS_HOST carry those names in place of the references to the
    # modules' outputs. A name references nothing Terraform could order the
    # functions after, so the functions sit in a later wave of the same root
    # configuration, and their module blocks depend on the cluster's and the
    # instance's.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network with private services access, and the service accounts and
    # images for ones the operator already has; example.com stands for the
    # operator's own domain.
    google:
      directory: main
      syncWave: 0
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              zone: europe-west1-b
              host: orders-db.example.com

        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1
              host: sessions.example.com

    google-late:
      directory: main
      syncWave: 1
      components:
        thumbnailer:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/thumbnailer:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: thumbnailer@example-project.iam.gserviceaccount.com

        checkout-hook:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/checkout-hook:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: checkout-hook@example-project.iam.gserviceaccount.com
