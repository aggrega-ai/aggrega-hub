apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redis-instance-id
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis whose component name carries an
    underscore, which an instance ID cannot, for the Release that halts on
    it.
spec:
  components:
    user_sessions:
      type: core/datastore/redis
