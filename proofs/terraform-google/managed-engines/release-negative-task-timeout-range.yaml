# A task timeout one second past the 168 hours Cloud Run allows a task.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-task-timeout-range
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-task-only.yaml
  manifest: ./manifest-task.yaml
  boundaries:
    google:
      directory: main
      components:
        nightly-report:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/nightly-report:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly-report@example-project.iam.gserviceaccount.com
              timeout: 604801s

        reindex:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com
