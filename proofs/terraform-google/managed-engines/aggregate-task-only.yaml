apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: task-only
  version: "1.0.0"
  description: >
    The generic task alone, as a nightly report on a schedule and a reindex
    started by hand, for the Releases that halt on a setting of a task.
spec:
  components:
    nightly-report:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"

    reindex:
      type: core/compute/task
      features:
        on_demand:
          type: core/manual-trigger
