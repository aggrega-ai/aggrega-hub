apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: function
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-function.yaml
  manifest: ./manifest-function.yaml
  boundaries:
    # One boundary, so the cluster, the instance and the functions are module
    # blocks of one Terraform root configuration, and each function's
    # ORDERS_DB_HOST and SESSIONS_HOST carry the references to the modules'
    # primary_instance_ip and host outputs, which Terraform resolves when it
    # applies. The thumbnailer keeps the Component's floor and ceiling, from
    # no instance while idle up to 5; the checkout hook keeps 2 instances
    # running and scales up to 10.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project and example-network for a VPC
    # network with private services access, and the service accounts and
    # images for ones the operator already has.
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              zone: europe-west1-b

        sessions:
          infra:
            engine_version: "7.2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              memory_size_gb: 1

        thumbnailer:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/thumbnailer:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: thumbnailer@example-project.iam.gserviceaccount.com

        checkout-hook:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/checkout-hook:1.0.0
            port: 9000
            min_replicas: 2
            max_replicas: 10
            compute:
              cpu: "2"
              memory: 1Gi
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: checkout-hook@example-project.iam.gserviceaccount.com
              subnetwork: example-subnet
              network_tags:
                - checkout-hook
              deletion_protection: false
