apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: redis
  version: "1.0.0"
  description: >
    A Redis cache on Memorystore for Redis, with a memory limit, an eviction
    policy, a database count and RDB persistence, and a server on Cloud Run
    reading the address, the port and the protocol it publishes, so the
    server's environment shows what a consumer of the instance receives.
spec:
  components:
    sessions:
      type: core/datastore/redis
      values:
        maxmemory: 3gb
        maxmemory_policy: allkeys-lru
        databases: 32
        persistence:
          enabled: true

    storefront:
      type: core/compute/server
      uses:
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
                - in: SESSIONS_PROTOCOL
                  from: protocol
