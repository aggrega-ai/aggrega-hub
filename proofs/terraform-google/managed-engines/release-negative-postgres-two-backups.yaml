# Two core/backup attachments, where a cluster keeps one backup policy.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-two-backups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    google:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
            backup_daily:
              type: core/backup
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
