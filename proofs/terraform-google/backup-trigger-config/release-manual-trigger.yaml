apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: manual-trigger
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-manual-trigger.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    # The reindex renders its Cloud Run job and no Cloud Scheduler job; the
    # nightly export renders both, its scheduler job reading the schedule in
    # UTC. Every project-specific value is a placeholder: example-project
    # stands for the operator's Google Cloud project and example-network for
    # its VPC network, and the service accounts and images for ones the
    # operator already has.
    google:
      directory: main
      components:
        reindex:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com

        nightly-export:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/nightly-export:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly-export@example-project.iam.gserviceaccount.com
