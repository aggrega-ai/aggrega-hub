# A core/manual-trigger attachment carrying an infra key, which the Feature
# does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-manual-trigger-infra
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-manual-trigger.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    google:
      directory: main
      components:
        reindex:
          features:
            on_demand:
              infra:
                time_zone: Europe/Rome
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/reindex:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com

        nightly-export:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/nightly-export:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly-export@example-project.iam.gserviceaccount.com
