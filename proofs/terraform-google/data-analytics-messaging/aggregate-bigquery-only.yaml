apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bigquery-only
  version: "1.0.0"
  description: >
    A BigQuery dataset alone, whose ID is the instance's name with its
    hyphen written as an underscore, for the Releases that prove what the
    BigQuery Recipe writes and refuses on its own.
spec:
  components:
    sales-analytics:
      type: core/bigdata/bigquery
