# Two cleanup policies with one id.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-cleanup-id-repeated
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              cleanup_policies:
                - id: tidy
                  action: DELETE
                  condition:
                    tag_state: UNTAGGED
                - id: tidy
                  action: KEEP
                  most_recent_versions:
                    keep_count: 10
