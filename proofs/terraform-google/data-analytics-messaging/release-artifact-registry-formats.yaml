apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: artifact-registry-formats
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-formats.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    # The keys the Artifact Registry Recipe requires: example-project stands
    # for the operator's Google Cloud project, and the repository is kept in
    # the europe multi-region.
    google:
      directory: main
      components:
        python-packages:
          infra:
            overrides:
              project_id: example-project
              location: europe
