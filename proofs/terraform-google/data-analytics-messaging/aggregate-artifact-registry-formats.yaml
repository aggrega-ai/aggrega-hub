apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: artifact-registry-formats
  version: "1.0.0"
  description: >
    An Artifact Registry repository of Python packages, its format written
    in lower case, which the Recipe writes in the upper case Artifact
    Registry spells its formats in.
spec:
  components:
    python-packages:
      type: core/devtool/artifact-registry
      values:
        format: python
