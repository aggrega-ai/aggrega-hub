apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bigquery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    # Every key the BigQuery Recipe reads: the dataset in the EU
    # multi-region, its tables encrypted with the operator's Cloud KMS key
    # there, each table living 90 days unless its creation names a lifetime,
    # a time travel window of three days, and storage billed by physical
    # bytes.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              location: EU
              kms_key_name: projects/example-project/locations/eu/keyRings/example-ring/cryptoKeys/example-key
              default_table_expiration_ms: 7776000000
              max_time_travel_hours: 72
              storage_billing_model: PHYSICAL
