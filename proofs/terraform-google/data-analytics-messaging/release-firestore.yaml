apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: firestore
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    # Every key the Firestore Recipe reads, set beside the edition the shared
    # Release sets: the database in europe-west1, encrypted with the
    # operator's Cloud KMS key, without delete protection, taking a daily
    # backup kept the 98 days Firestore keeps at most, with point-in-time
    # recovery on.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        sessions-store:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 98
                point_in_time_recovery: true
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              edition: STANDARD
              deletion_protection: false
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
