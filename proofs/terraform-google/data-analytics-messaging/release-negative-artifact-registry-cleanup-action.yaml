# A cleanup policy's action REMOVE, which Artifact Registry does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-cleanup-action
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              cleanup_policies:
                - id: delete-untagged
                  action: REMOVE
                  condition:
                    tag_state: UNTAGGED
