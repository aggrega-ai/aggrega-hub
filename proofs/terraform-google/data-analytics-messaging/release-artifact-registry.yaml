apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: artifact-registry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    # Every key the Artifact Registry Recipe reads: the repository in
    # europe-west1, its contents encrypted with the operator's Cloud KMS key
    # there, and three cleanup policies: untagged images older than 30 days
    # are deleted, while the ten newest images and every image tagged
    # release- something are kept.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
              cleanup_policies:
                - id: delete-untagged
                  action: DELETE
                  condition:
                    tag_state: UNTAGGED
                    older_than: 30d
                - id: keep-newest
                  action: KEEP
                  most_recent_versions:
                    keep_count: 10
                - id: keep-releases
                  action: KEEP
                  condition:
                    tag_state: TAGGED
                    tag_prefixes:
                      - release-
