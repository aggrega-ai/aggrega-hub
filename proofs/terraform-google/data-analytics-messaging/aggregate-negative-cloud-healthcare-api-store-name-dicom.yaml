apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-healthcare-api-store-name-dicom
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset holding a DICOM store whose name carries
    a slash, which no store's name takes.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        dicom_stores:
          - imaging/2026
