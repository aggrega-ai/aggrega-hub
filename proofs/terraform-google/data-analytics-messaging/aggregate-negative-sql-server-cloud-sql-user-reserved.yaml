apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sql-server-cloud-sql-user-reserved
  version: "1.0.0"
  description: >
    A SQL Server database whose login is named sqlserver, the login Cloud SQL
    creates on every SQL Server instance.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server
      values:
        user: sqlserver
