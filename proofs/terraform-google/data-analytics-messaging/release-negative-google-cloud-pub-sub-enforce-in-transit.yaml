# infra.overrides.message_storage_policy.enforce_in_transit, which the
# module does not pass to the topic.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-pub-sub-enforce-in-transit
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
              message_storage_policy:
                allowed_persistence_regions:
                  - europe-west1
                enforce_in_transit: true
