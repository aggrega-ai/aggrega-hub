apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: vertex-ai-vector-search-host
  version: "1.0.0"
  description: >
    A Vertex AI Vector Search index of 256-long vectors and a server on
    Cloud Run reading its host, port and endpoint, so the server's
    environment shows what a consumer of the index receives.
spec:
  components:
    document-vectors:
      type: core/datastore/vertex-ai-vector-search
      values:
        dimensions: 256

    indexer:
      type: core/compute/server
      uses:
        vectors:
          document-vectors:
            target: document-vectors
            inject:
              env:
                - in: VECTORS_HOST
                  from: host
                - in: VECTORS_PORT
                  from: port
                - in: VECTORS_ENDPOINT
                  from: endpoint
