# No infra.overrides.project_id.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-pub-sub-project-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
