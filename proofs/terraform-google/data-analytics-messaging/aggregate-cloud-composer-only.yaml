apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloud-composer-only
  version: "1.0.0"
  description: >
    A Cloud Composer environment alone, with the Python packages, the
    environment variables and the Airflow configuration option its DAGs
    need, one variable's value holding the characters Terraform would read
    as an interpolation, for the Releases that prove what the Cloud
    Composer Recipe writes and refuses on its own.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        pypi_packages:
          pandas: "==2.2.3"
          openpyxl: ""
        env_variables:
          REPORT_BUCKET: example-reports
          REPORT_NAME_TEMPLATE: "report-${ds}.xlsx"
        airflow_config_overrides:
          core-dags_are_paused_at_creation: "True"
