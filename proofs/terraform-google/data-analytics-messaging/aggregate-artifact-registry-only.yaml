apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: artifact-registry-only
  version: "1.0.0"
  description: >
    An Artifact Registry Docker repository alone, keeping each pushed tag on
    its image, for the Releases that prove what the Artifact Registry Recipe
    writes and refuses on its own.
spec:
  components:
    api-images:
      type: core/devtool/artifact-registry
      values:
        format: DOCKER
        immutable_tags: true
