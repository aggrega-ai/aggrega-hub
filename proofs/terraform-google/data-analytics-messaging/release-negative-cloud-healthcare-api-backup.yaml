# A core/backup attachment, which the Cloud Healthcare API keeps no backup to
# configure from.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-healthcare-api-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-healthcare-api-only.yaml
  manifest: ./manifest-cloud-healthcare-api.yaml
  boundaries:
    google:
      directory: main
      components:
        clinical-data:
          features:
            backup:
              type: core/backup
          infra:
            overrides:
              project_id: example-project
              location: eu
