apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-google-cloud-pub-sub-topic-name
  version: "1.0.0"
  description: >
    A Pub/Sub topic whose instance name, which the topic takes, begins with
    goog, which Pub/Sub refuses at the start of a topic ID.
spec:
  components:
    google-events:
      type: core/messaging/google-cloud-pub-sub
