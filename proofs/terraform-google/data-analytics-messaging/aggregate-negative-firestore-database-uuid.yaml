apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-firestore-database-uuid
  version: "1.0.0"
  description: >
    A Firestore database whose values.database has the form of a UUID, which
    Firestore refuses as a database ID.
spec:
  components:
    sessions-store:
      type: core/datastore/firestore
      values:
        database: abcdef12-3456-7890-abcd-ef1234567890
