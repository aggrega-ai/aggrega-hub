apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sql-server-interpolation
  version: "1.0.0"
  description: >
    A SQL Server database whose database name, login and collation carry the
    characters Terraform reads inside a string, a dollar sign followed by a
    brace and a double quote, for the Release that proves the SQL Server
    Recipe for Cloud SQL writes them as text.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server
      values:
        database: 'app${db}"name'
        user: 'login${who}"name'
        collation: 'Latin1${c}"collation'
