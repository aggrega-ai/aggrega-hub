apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-env-name
  version: "1.0.0"
  description: >
    A Cloud Composer environment with a variable whose name begins with a
    digit, which Cloud Composer refuses.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        env_variables:
          1ST_REPORT_HOUR: "6"
