apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-healthcare-api
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-healthcare-api-only.yaml
  manifest: ./manifest-cloud-healthcare-api.yaml
  boundaries:
    # Every key the Cloud Healthcare API Recipe reads: the dataset in the eu
    # multi-region, encrypted with the operator's Cloud KMS key there, with
    # deletion allowed.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        clinical-data:
          infra:
            overrides:
              project_id: example-project
              location: eu
              deletion_protection: false
              kms_key_name: projects/example-project/locations/eu/keyRings/example-ring/cryptoKeys/example-key
