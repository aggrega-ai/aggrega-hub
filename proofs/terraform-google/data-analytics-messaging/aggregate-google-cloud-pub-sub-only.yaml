apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: google-cloud-pub-sub-only
  version: "1.0.0"
  description: >
    A Pub/Sub topic alone, keeping each message for one day, for the
    Releases that prove what the Pub/Sub Recipe writes and refuses on its
    own.
spec:
  components:
    order-events:
      type: core/messaging/google-cloud-pub-sub
      values:
        message_retention_duration: 86400s
