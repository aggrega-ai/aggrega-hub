apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dns-record-cloud-dns-forms
  version: "1.0.0"
  description: >
    DNS record sets alone, one of each type whose record data the Cloud DNS
    Recipe rewrites in the form Cloud DNS takes it: a domain name ending in
    a dot, a quoted CAA value and TXT text in quoted strings.
spec:
  components:
    # A mail server named without its trailing dot, which the Recipe adds.
    mail-exchange:
      type: core/network/dns-record
      values:
        name: example.com.
        type: MX
        records:
          - 10 mail.example.com
          - 20 mail-backup.example.com.

    # A SIP service, its target named without its trailing dot.
    sip-service:
      type: core/network/dns-record
      values:
        name: _sip._tcp.example.com
        type: SRV
        records:
          - 10 5 5060 sip.example.com

    # The certificate authority allowed to issue for the zone, its value
    # written without quotation marks, which the Recipe adds.
    issuers:
      type: core/network/dns-record
      values:
        name: example.com
        type: CAA
        records:
          - 0 issue letsencrypt.org

    # A DKIM key longer than 255 characters, divided into quoted strings,
    # and a text holding a double quote and a letter outside ASCII, written
    # as escapes.
    mail-keys:
      type: core/network/dns-record
      values:
        name: selector1._domainkey.example.com
        type: TXT
        records:
          - "v=DKIM1; k=rsa; "
          - 'owner="Società Example"'
