apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-healthcare-api-store-name-fhir
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset holding a FHIR store whose name carries a slash, which no store's name takes.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        fhir_stores:
          records/2026:
            version: R4
