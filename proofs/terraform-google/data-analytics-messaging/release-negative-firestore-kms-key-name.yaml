# infra.overrides.kms_key_name names the key alone, not its resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              kms_key_name: example-key
