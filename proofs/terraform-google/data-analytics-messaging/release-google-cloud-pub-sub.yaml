apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: google-cloud-pub-sub
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    # Every key the Pub/Sub Recipe reads: the topic's messages encrypted
    # with the operator's Cloud KMS key and stored in European regions
    # alone.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
              message_storage_policy:
                allowed_persistence_regions:
                  - europe-west1
                  - europe-west4
