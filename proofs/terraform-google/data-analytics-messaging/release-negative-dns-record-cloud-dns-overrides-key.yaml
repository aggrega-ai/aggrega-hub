# infra.overrides.zone_name, the Azure DNS Recipes' spelling of the zone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-cloud-dns-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-cloud-dns-only.yaml
  manifest: ./manifest-dns-record-cloud-dns.yaml
  boundaries:
    google:
      directory: main
      components:
        api-address:
          infra:
            overrides:
              zone_name: example-zone
              managed_zone: example-zone
              project_id: example-project
