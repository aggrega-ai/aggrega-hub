apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server-interpolation
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-interpolation.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # The operator's strings carry a dollar sign followed by a brace and a
    # double quote as well, in the project, the network and the allocated
    # range. Each reaches the module call as text: the dollar sign is
    # written twice, which Terraform turns back into one, and the quote is
    # escaped.
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: 'example-project${p}"x'
              region: europe-west1
              private_network: 'projects/example-project/global/networks/net${n}"x'
              allocated_ip_range: 'range${r}"x'
