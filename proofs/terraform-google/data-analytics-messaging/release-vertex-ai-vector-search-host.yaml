apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: vertex-ai-vector-search-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-host.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The private endpoint peered with the operator's VPC network, whose
    # address the operator reaches by name: host publishes
    # vectors.example.com in place of the reference to the deployed index's
    # address, and endpoint that name followed by :10000, so the server's
    # VECTORS_HOST and VECTORS_ENDPOINT carry them.
    #
    # example-project stands for the operator's Google Cloud project,
    # 123456789012 for its number, and the network for one with private
    # services access the operator already has there, and the service
    # account and image for ones the operator already has.
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/123456789012/global/networks/example-network
              host: vectors.example.com

        indexer:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/indexer:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: indexer@example-project.iam.gserviceaccount.com
