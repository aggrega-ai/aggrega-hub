# A core/backup attachment naming a time of day, which Firestore's daily
# backup schedule does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-backup-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          features:
            backup:
              type: core/backup
              infra:
                schedule: "30 2 * * *"
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
