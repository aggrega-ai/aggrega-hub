# infra.engine_version names SQL Server 2016, a release Cloud SQL does not
# offer.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            engine_version: "2016"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
