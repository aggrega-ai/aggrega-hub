# A cleanup policy's condition.older_than misspelt older.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-cleanup-condition-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              cleanup_policies:
                - id: delete-old
                  action: DELETE
                  condition:
                    older: 30d
