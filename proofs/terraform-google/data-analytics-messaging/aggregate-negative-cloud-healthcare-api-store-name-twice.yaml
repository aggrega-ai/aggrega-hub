apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-healthcare-api-store-name-twice
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset whose HL7v2 stores name one store twice.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        hl7_v2_stores:
          - admissions
          - admissions
