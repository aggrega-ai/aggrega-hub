# No infra.overrides.private_network: the Recipe never chooses the network.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-private-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
