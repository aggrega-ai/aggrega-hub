# infra.overrides.kms_key_name names a key in us-central1, and the index is
# in europe-west1.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-vector-search-kms-key-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              kms_key_name: projects/example-project/locations/us-central1/keyRings/example-ring/cryptoKeys/example-key
