# infra.overrides.location written EU, in upper case, which no Artifact
# Registry location is.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: EU
