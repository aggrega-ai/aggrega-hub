apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-composer-shared-vpc
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-composer-only.yaml
  manifest: ./manifest-cloud-composer.yaml
  boundaries:
    # An environment in europe-west1 running the newest Airflow 2, in the
    # service project of a Shared VPC: attached to the host project's
    # network through a subnet of the host project in the same region.
    #
    # example-project stands for the service project and example-host-project
    # for the host project, which has shared the subnet with it.
    google:
      directory: main
      components:
        nightly-reports:
          infra:
            engine_version: "2"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-host-project/global/networks/example-network
              subnetwork: projects/example-host-project/regions/europe-west1/subnetworks/example-subnet
