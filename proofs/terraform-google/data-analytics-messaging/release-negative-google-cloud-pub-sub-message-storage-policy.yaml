# infra.overrides.message_storage_policy allowing no region, which the
# provider calls no valid configuration.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-pub-sub-message-storage-policy
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
              message_storage_policy:
                allowed_persistence_regions: []
