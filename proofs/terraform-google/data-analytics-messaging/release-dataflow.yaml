apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dataflow
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dataflow-only.yaml
  manifest: ./manifest-dataflow.yaml
  boundaries:
    # Every key the Dataflow Recipe reads: the job in europe-west1, its
    # workers running as the operator's service account on internal
    # addresses in the operator's network and subnet, keeping temporary and
    # staged files in the operator's bucket, encrypted with the operator's
    # Cloud KMS key, on two to ten n2-standard-4 machines, with Streaming
    # Engine on.
    #
    # example-project stands for the operator's Google Cloud project, and
    # the template file, the bucket, the network, the subnet, the service
    # account and the key for ones the operator already has there.
    google:
      directory: main
      components:
        clickstream-enrichment:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/clickstream-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: dataflow-worker@example-project.iam.gserviceaccount.com
              private_network: projects/example-project/global/networks/example-network
              subnetwork: projects/example-project/regions/europe-west1/subnetworks/example-subnet
              temp_location: gs://example-dataflow/temp
              staging_location: gs://example-dataflow/staging
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
              machine_type: n2-standard-4
              max_workers: 10
              num_workers: 2
              ip_configuration: WORKER_IP_PRIVATE
              enable_streaming_engine: true
