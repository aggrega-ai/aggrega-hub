# infra.overrides.kms_key_name names a version of the key, not the key.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bigquery-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              location: EU
              kms_key_name: projects/example-project/locations/eu/keyRings/example-ring/cryptoKeys/example-key/cryptoKeyVersions/1
