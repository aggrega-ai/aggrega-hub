# infra.overrides.host with a port, beside a private network.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-vector-search-host-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/123456789012/global/networks/example-network
              host: vectors.example.com:10000
