# infra.overrides.service_account written as an IAM member, with its prefix.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-composer-service-account
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-composer-only.yaml
  manifest: ./manifest-cloud-composer.yaml
  boundaries:
    google:
      directory: main
      components:
        nightly-reports:
          infra:
            engine_version: 2.10.5-build.52
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: serviceAccount:composer-env@example-project.iam.gserviceaccount.com
