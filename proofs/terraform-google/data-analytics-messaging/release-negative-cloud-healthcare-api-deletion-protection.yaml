# infra.overrides.deletion_protection written as a string.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-healthcare-api-deletion-protection
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-healthcare-api-only.yaml
  manifest: ./manifest-cloud-healthcare-api.yaml
  boundaries:
    google:
      directory: main
      components:
        clinical-data:
          infra:
            overrides:
              project_id: example-project
              location: eu
              deletion_protection: "no"
