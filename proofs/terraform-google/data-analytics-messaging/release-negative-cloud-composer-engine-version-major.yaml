# infra.engine_version names Airflow 3 by its major alone, an alias the service does not list.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-composer-engine-version-major
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-composer-only.yaml
  manifest: ./manifest-cloud-composer.yaml
  boundaries:
    google:
      directory: main
      components:
        nightly-reports:
          infra:
            engine_version: "3"
            overrides:
              project_id: example-project
              region: europe-west1
