# A core/backup attachment keeping each backup longer than the 14 weeks
# Firestore keeps one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-backup-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 120
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
