apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-google-cloud-pub-sub-retention
  version: "1.0.0"
  description: >
    A Pub/Sub topic keeping its messages five minutes, shorter than the ten
    minutes Pub/Sub keeps a topic's messages at least.
spec:
  components:
    order-events:
      type: core/messaging/google-cloud-pub-sub
      values:
        message_retention_duration: 300s
