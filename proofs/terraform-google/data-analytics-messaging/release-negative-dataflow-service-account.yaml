# No infra.overrides.service_account.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dataflow-service-account
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dataflow-only.yaml
  manifest: ./manifest-dataflow.yaml
  boundaries:
    google:
      directory: main
      components:
        clickstream-enrichment:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/clickstream-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
