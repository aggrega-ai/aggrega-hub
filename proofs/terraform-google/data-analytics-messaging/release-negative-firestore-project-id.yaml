# No infra.overrides.project_id: the Recipe never chooses the project.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-project-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              location: europe-west1
