apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-healthcare-api-store-name-hl7-v2
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset holding an HL7v2 store whose name carries a slash, which no store's name takes.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        hl7_v2_stores:
          - admissions/2026
