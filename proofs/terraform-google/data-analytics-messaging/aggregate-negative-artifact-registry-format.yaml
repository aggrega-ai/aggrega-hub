apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-artifact-registry-format
  version: "1.0.0"
  description: >
    An Artifact Registry repository of format HELM, which Artifact
    Registry's documentation does not name among its repository formats.
spec:
  components:
    chart-packages:
      type: core/devtool/artifact-registry
      values:
        format: HELM
