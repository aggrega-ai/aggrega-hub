apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sql-server
  version: "1.0.0"
  description: >
    A SQL Server database declared with the Component's defaults and a
    server on Cloud Run reading its address, port, login, database name and
    protocol, so the server's environment shows what a consumer of the
    database receives.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server

    archiver:
      type: core/compute/server
      uses:
        archive:
          archive-db:
            target: archive-db
            inject:
              env:
                - in: ARCHIVE_DB_HOST
                  from: host
                - in: ARCHIVE_DB_PORT
                  from: port
                - in: ARCHIVE_DB_USER
                  from: user
                - in: ARCHIVE_DB_NAME
                  from: database
                - in: ARCHIVE_DB_PROTOCOL
                  from: protocol
