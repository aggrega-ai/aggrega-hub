apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bigquery-dataset-id
  version: "1.0.0"
  description: >
    A BigQuery dataset whose instance name, which its ID takes while
    values.dataset_id is unset, is longer than the 1,024 characters
    BigQuery takes for a dataset's ID.
spec:
  components:
    # A YAML key of over 1,024 characters is written as an explicit key.
    ? events-
    : type: core/bigdata/bigquery
