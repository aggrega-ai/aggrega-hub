apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-pypi-name
  version: "1.0.0"
  description: >
    A Cloud Composer environment installing a Python package named with a
    capital letter, which Cloud Composer takes in lower case.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        pypi_packages:
          Pandas: "==2.2.3"
