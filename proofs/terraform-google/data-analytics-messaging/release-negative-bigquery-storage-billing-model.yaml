# infra.overrides.storage_billing_model in lower case.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bigquery-storage-billing-model
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              storage_billing_model: physical
