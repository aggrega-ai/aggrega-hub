# infra.overrides.kms_key_name names the key alone, not its resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-healthcare-api-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-healthcare-api-only.yaml
  manifest: ./manifest-cloud-healthcare-api.yaml
  boundaries:
    google:
      directory: main
      components:
        clinical-data:
          infra:
            overrides:
              project_id: example-project
              location: eu
              kms_key_name: example-key
