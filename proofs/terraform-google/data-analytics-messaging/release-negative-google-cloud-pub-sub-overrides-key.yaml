# infra.overrides.kms_key, a shortening of kms_key_name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-pub-sub-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
              kms_key: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
