apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-airflow-option
  version: "1.0.0"
  description: >
    A Cloud Composer environment overriding an Airflow option written
    with a period between its section and its name, where Cloud Composer
    takes a hyphen.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        airflow_config_overrides:
          core.parallelism: "64"
