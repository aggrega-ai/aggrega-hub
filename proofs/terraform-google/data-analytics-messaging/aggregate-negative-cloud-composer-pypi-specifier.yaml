apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-pypi-specifier
  version: "1.0.0"
  description: >
    A Cloud Composer environment installing a Python package whose
    version specifier holds a capital letter, which Cloud Composer takes
    in lower case.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        pypi_packages:
          pandas: "==3.0.0RC1"
