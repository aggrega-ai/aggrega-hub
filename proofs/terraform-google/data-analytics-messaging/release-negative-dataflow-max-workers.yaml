# infra.overrides.max_workers is 0, below the whole number of at least 1 it takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dataflow-max-workers
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dataflow-only.yaml
  manifest: ./manifest-dataflow.yaml
  boundaries:
    google:
      directory: main
      components:
        clickstream-enrichment:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/clickstream-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: dataflow-worker@example-project.iam.gserviceaccount.com
              max_workers: 0
