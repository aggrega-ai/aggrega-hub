apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dataflow-parameters-option
  version: "1.0.0"
  description: >
    A Dataflow job whose parameters name serviceAccountEmail, a launch
    option of Dataflow's own, which would set the identity its workers run
    as from the Aggregate.
spec:
  components:
    clickstream-enrichment:
      type: core/bigdata/dataflow
      values:
        parameters:
          inputSubscription: projects/example-project/subscriptions/clicks
          serviceAccountEmail: other-worker@example-project.iam.gserviceaccount.com
