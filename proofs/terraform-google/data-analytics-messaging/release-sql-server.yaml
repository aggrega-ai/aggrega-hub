apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # Every key the SQL Server Recipe for Cloud SQL reads but host, set: SQL
    # Server 2022 Enterprise in Cloud SQL Enterprise Plus edition on an N2
    # machine type, highly available, with a 100 GB SSD disk encrypted with
    # the operator's key, in a zone and an allocated range of the operator's
    # network, a database flag, labels and deletion protection off. The
    # login takes the module's drawn password, as core/generated-secret
    # says. The automated backups start at 03:15 UTC and 30 are kept, with
    # point-in-time recovery on.
    #
    # example-project stands for the operator's Google Cloud project,
    # example-network for a VPC network with private services access and
    # example-sql-range for its allocated IP range, and the key ring and key
    # for ones the operator already has.
    google:
      directory: main
      components:
        archive-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 30
                schedule: "15 3 * * *"
                point_in_time_recovery: true
          infra:
            engine_version: "2022"
            storage:
              size: 100Gi
              type: PD_SSD
            ha:
              enabled: true
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              allocated_ip_range: example-sql-range
              zone: europe-west1-b
              tier: db-perf-optimized-N-4
              edition: ENTERPRISE_PLUS
              sql_server_edition: ENTERPRISE
              database_flags:
                - name: remote access
                  value: "on"
              deletion_protection: false
              user_labels:
                team: archive
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
