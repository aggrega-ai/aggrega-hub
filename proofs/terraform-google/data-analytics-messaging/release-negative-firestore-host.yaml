# infra.overrides.host, a name of the operator's for an endpoint that answers
# under the service's name alone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              host: sessions.example.com
