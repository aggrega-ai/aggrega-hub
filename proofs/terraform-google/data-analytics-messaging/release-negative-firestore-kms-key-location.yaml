# infra.overrides.kms_key_name names a key in us-central1, and a database in
# the multi-region nam5 takes a key in the Cloud KMS multi-region us.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-kms-key-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              project_id: example-project
              location: nam5
              kms_key_name: projects/example-project/locations/us-central1/keyRings/example-ring/cryptoKeys/example-key
