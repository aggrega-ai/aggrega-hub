apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-healthcare-api-fhir-version
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset holding a FHIR store of release R5, which
    the Healthcare API serves and the google provider does not create.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        fhir_stores:
          records:
            version: R5
