# infra.overrides.kms_key, a shortening of kms_key_name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bigquery-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              kms_key: projects/example-project/locations/eu/keyRings/example-ring/cryptoKeys/example-key
