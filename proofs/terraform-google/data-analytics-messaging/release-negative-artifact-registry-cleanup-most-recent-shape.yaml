# A KEEP cleanup policy's most_recent_versions written as a number, not a map.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-cleanup-most-recent-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              cleanup_policies:
                - id: keep-latest
                  action: KEEP
                  most_recent_versions: 5
