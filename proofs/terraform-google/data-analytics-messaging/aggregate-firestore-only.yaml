apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: firestore-only
  version: "1.0.0"
  description: >
    A Firestore database alone, serving the Datastore API under an ID of its
    own, for the Releases that prove what the Firestore Recipe writes and
    refuses on its own.
spec:
  components:
    sessions-store:
      type: core/datastore/firestore
      values:
        database: sessions
        type: DATASTORE_MODE
