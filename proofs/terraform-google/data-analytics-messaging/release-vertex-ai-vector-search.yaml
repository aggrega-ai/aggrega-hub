apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: vertex-ai-vector-search
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    # Every key the Vertex AI Vector Search Recipe reads, beside the public
    # endpoint the shared Release serves: the endpoint peered with the
    # operator's VPC network, the deployed index's address drawn from one
    # range of its private services access, on 2 to 4 dedicated
    # e2-highmem-16 machines for large shards, the index built from the
    # files in a Cloud Storage directory and encrypted with the operator's
    # Cloud KMS key.
    #
    # example-project stands for the operator's Google Cloud project,
    # 123456789012 for its number, and the network, range, bucket, key ring
    # and key for ones the operator already has there.
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/123456789012/global/networks/example-network
              allocated_ip_range: example-vertex-range
              machine_type: e2-highmem-16
              min_replica_count: 2
              max_replica_count: 4
              shard_size: SHARD_SIZE_LARGE
              contents_delta_uri: gs://example-project-vectors/documents
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
