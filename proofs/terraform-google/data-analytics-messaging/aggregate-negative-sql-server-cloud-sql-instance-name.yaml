apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sql-server-cloud-sql-instance-name
  version: "1.0.0"
  description: >
    A SQL Server database whose instance ID carries an underscore, which
    Cloud SQL does not take in an instance name.
spec:
  components:
    ledger_db:
      type: core/datastore/sql-server
