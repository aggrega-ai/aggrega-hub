apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-composer
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-composer-only.yaml
  manifest: ./manifest-cloud-composer.yaml
  boundaries:
    # Every key the Cloud Composer Recipe reads: a medium environment in
    # europe-west1 running build 52 of Airflow 2.10.5, with private IP
    # networking, attached to the operator's network through a subnet
    # there, running as the operator's service account, keeping its DAGs
    # and logs in the operator's bucket, encrypted with the operator's Cloud
    # KMS key.
    #
    # example-project stands for the operator's Google Cloud project, and
    # the network, the subnet, the service account, the bucket and the key
    # for ones the operator already has there.
    google:
      directory: main
      components:
        nightly-reports:
          infra:
            engine_version: 2.10.5-build.52
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              subnetwork: projects/example-project/regions/europe-west1/subnetworks/example-subnet
              service_account: composer-env@example-project.iam.gserviceaccount.com
              bucket: example-composer
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
              environment_size: ENVIRONMENT_SIZE_MEDIUM
              enable_private_environment: true
