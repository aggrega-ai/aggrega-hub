apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-artifact-registry-immutable-tags
  version: "1.0.0"
  description: >
    A Maven repository with immutable tags, which Artifact Registry offers
    on a Docker repository alone.
spec:
  components:
    maven-packages:
      type: core/devtool/artifact-registry
      values:
        format: MAVEN
        immutable_tags: true
