apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: data-analytics-messaging
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: each data, analytics and messaging
    Component bound to its Recipe, core/backup to the service's own backup,
    core/random-password to the FeatureRecipe that draws a password with the
    random provider, and the generic server bound to its Cloud Run Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/firestore:1.0.0: terraform/firestore:1.0.0
        core/datastore/sql-server:1.0.0: terraform/sql-server-cloud-sql:1.0.0
        core/datastore/vertex-ai-vector-search:1.0.0: terraform/vertex-ai-vector-search:1.0.0
        core/datastore/cloud-healthcare-api:1.0.0: terraform/cloud-healthcare-api:1.0.0
        core/bigdata/bigquery:1.0.0: terraform/bigquery:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.2.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
        core/random-password:1.0.0: terraform/random-password:1.0.0
