# infra.overrides.private_network names a network of another project, a Shared VPC host's.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dataflow-private-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dataflow-only.yaml
  manifest: ./manifest-dataflow.yaml
  boundaries:
    google:
      directory: main
      components:
        clickstream-enrichment:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/clickstream-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: dataflow-worker@example-project.iam.gserviceaccount.com
              private_network: projects/example-host-project/global/networks/example-shared-network
