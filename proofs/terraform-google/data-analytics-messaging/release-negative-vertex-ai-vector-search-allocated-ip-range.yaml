# infra.overrides.allocated_ip_range gives the range's addresses, not its
# name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-vector-search-allocated-ip-range
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/123456789012/global/networks/example-network
              allocated_ip_range: 10.8.0.0/16
