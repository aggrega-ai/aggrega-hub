apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # The Component's defaults on the Recipe's: SQL Server 2022 Express in
    # Cloud SQL Enterprise edition on db-custom-2-3840, with a 32 GB SSD disk
    # and 7 automated backups at a time Cloud SQL chooses. host publishes the
    # name the operator gives the instance, archive-db.example.com, in place
    # of the reference to its private address, so the server's
    # ARCHIVE_DB_HOST carries that name; the login takes the password the
    # module draws, with nothing attached.
    #
    # example-project stands for the operator's Google Cloud project and
    # example-network for a VPC network with private services access, and
    # the service account and image for ones the operator already has.
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              host: archive-db.example.com

        archiver:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/archiver:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: archiver@example-project.iam.gserviceaccount.com
