# No infra.overrides.location: the Recipe never chooses where Firestore keeps
# the database.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              project_id: example-project
