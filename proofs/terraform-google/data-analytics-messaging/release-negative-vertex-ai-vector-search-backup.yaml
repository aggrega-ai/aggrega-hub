# A core/backup attachment, which Vertex AI Vector Search keeps no backup to
# configure from.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-vector-search-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    google:
      directory: main
      components:
        document-vectors:
          features:
            backup:
              type: core/backup
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
