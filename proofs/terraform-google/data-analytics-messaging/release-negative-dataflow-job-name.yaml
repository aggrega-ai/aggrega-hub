# One fault, in the Aggregate: see its description.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dataflow-job-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dataflow-job-name.yaml
  manifest: ./manifest-dataflow.yaml
  boundaries:
    google:
      directory: main
      components:
        clickstream_enrichment:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/clickstream-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: dataflow-worker@example-project.iam.gserviceaccount.com
