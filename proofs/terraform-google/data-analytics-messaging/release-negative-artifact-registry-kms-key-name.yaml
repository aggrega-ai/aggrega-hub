# infra.overrides.kms_key_name naming the key alone, not by its resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              kms_key_name: example-key
