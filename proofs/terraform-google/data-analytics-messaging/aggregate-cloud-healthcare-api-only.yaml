apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloud-healthcare-api-only
  version: "1.0.0"
  description: >
    A Cloud Healthcare API dataset alone, holding two FHIR stores of
    different releases, a DICOM store and two HL7v2 stores, for the Releases
    that prove what the Cloud Healthcare API Recipe writes and refuses on
    its own.
spec:
  components:
    clinical-data:
      type: core/datastore/cloud-healthcare-api
      values:
        fhir_stores:
          records:
            version: R4
          records.legacy:
            version: STU3
        dicom_stores:
          - imaging
        hl7_v2_stores:
          - admissions
          - lab_results
