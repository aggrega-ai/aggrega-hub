apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dns-record-cloud-dns-forms
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-cloud-dns-forms.yaml
  manifest: ./manifest-dns-record-cloud-dns.yaml
  boundaries:
    # Every key the Cloud DNS Recipe reads, for each record set: the managed
    # zone, which example-zone stands for, the operator's public zone for
    # example.com, and example-project, the operator's Google Cloud project
    # holding it.
    google:
      directory: main
      components:
        mail-exchange:
          infra:
            overrides:
              managed_zone: example-zone
              project_id: example-project

        sip-service:
          infra:
            overrides:
              managed_zone: example-zone
              project_id: example-project

        issuers:
          infra:
            overrides:
              managed_zone: example-zone
              project_id: example-project

        mail-keys:
          infra:
            overrides:
              managed_zone: example-zone
              project_id: example-project
