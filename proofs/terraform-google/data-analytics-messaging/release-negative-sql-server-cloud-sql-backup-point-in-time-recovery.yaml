# A core/backup attachment turning point-in-time recovery off on a highly
# available instance, which Cloud SQL keeps highly available only with it on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-backup-point-in-time-recovery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
              infra:
                point_in_time_recovery: false
          infra:
            ha:
              enabled: true
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
