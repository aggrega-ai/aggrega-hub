# infra.overrides.default_table_expiration_ms is half an hour.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bigquery-table-expiration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              default_table_expiration_ms: 1800000
