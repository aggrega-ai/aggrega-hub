# infra.overrides.machine_type names a machine type Vertex AI Vector Search
# does not deploy an index on.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-vector-search-machine-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-vector-search-only.yaml
  manifest: ./manifest-vertex-ai-vector-search.yaml
  boundaries:
    google:
      directory: main
      components:
        document-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              machine_type: n2-standard-8
