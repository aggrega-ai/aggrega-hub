# infra.overrides.encryption_key_name, the module's input, where the Recipe
# reads kms_key_name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              encryption_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/example-key
