# Cloud SQL Enterprise Plus edition for SQL Server 2017, which it runs for
# 2019 and later alone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-enterprise-plus-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            engine_version: "2017"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              edition: ENTERPRISE_PLUS
              sql_server_edition: ENTERPRISE
              tier: db-perf-optimized-N-4
