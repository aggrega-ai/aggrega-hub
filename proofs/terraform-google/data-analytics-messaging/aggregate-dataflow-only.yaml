apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dataflow-only
  version: "1.0.0"
  description: >
    A Dataflow job alone, enriching a stream of clicks with the parameters
    its Flex Template takes, one of whose values holds the characters
    Terraform would read as an interpolation, for the Releases that prove
    what the Dataflow Recipe writes and refuses on its own.
spec:
  components:
    clickstream-enrichment:
      type: core/bigdata/dataflow
      values:
        parameters:
          inputSubscription: projects/example-project/subscriptions/clicks
          outputTable: example-project:web_events.enriched_clicks
          deadLetterPrefix: "gs://example-dataflow/dead-letter/${window}/"
