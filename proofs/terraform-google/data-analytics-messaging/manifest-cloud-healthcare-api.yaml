apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: cloud-healthcare-api
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: the Cloud Healthcare API dataset bound
    to its Recipe and core/backup to the service's own backup, for the
    Releases that prove what that Recipe writes and refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/cloud-healthcare-api:1.0.0: terraform/cloud-healthcare-api:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
