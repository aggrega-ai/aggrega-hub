apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: firestore-multi-region
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    # The database in the multi-region nam5, encrypted with the operator's
    # Cloud KMS key in the Cloud KMS multi-region us, the location Firestore
    # takes a key in for a nam5 database.
    #
    # example-project stands for the operator's Google Cloud project, and the
    # key ring and key for ones the operator already has there.
    google:
      directory: main
      components:
        sessions-store:
          infra:
            overrides:
              project_id: example-project
              location: nam5
              kms_key_name: projects/example-project/locations/us/keyRings/example-ring/cryptoKeys/example-key
