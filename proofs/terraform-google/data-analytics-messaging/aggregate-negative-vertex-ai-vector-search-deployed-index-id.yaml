apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-vertex-ai-vector-search-deployed-index-id
  version: "1.0.0"
  description: >
    A Vertex AI Vector Search index whose instance name begins with a
    digit, so the deployed index ID made from it does not begin with the
    letter Vertex AI requires.
spec:
  components:
    2026-vectors:
      type: core/datastore/vertex-ai-vector-search
      values:
        dimensions: 256
