apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: sql-server
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: SQL Server bound to its Cloud SQL
    Recipe, core/backup to the instance's own automated backups, and the
    credentials a Release may attach to the login's password slot to their
    terraform realizations, and the generic server bound to its Cloud Run
    Recipe, for the Releases that prove what that Recipe writes and refuses
    on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: terraform/sql-server-cloud-sql:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.2.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/secret-value:1.0.0: terraform/variable-secret:1.0.0
