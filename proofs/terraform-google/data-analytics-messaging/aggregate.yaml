apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: data-analytics-messaging
  version: "1.0.0"
  description: >
    Google Cloud's data, analytics and messaging services and a server on
    Cloud Run consuming each of them, so the server's environment shows what
    a consumer of each receives.
spec:
  components:
    # The product catalog the server reads and writes as documents, in a
    # Firestore database of the instance's name serving the Firestore API.
    product-catalog:
      type: core/datastore/firestore

    # The ledger the server keeps in SQL Server on Cloud SQL, under a login
    # and a collation of its own.
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    # The embeddings of the catalog's products, 768 long and compared by
    # cosine distance, which the server upserts as products change and
    # queries for the products nearest a shopper's search.
    product-vectors:
      type: core/datastore/vertex-ai-vector-search
      values:
        dimensions: 768
        distance_measure_type: COSINE_DISTANCE
        index_update_method: STREAM_UPDATE

    # The patients' records the server reads and writes as FHIR R4
    # resources, in a Cloud Healthcare API dataset holding one FHIR store.
    patient-records:
      type: core/datastore/cloud-healthcare-api
      values:
        fhir_stores:
          patients:
            version: R4

    # The events the server records for analysis, in a BigQuery dataset
    # whose ID the server names in its queries.
    web-analytics:
      type: core/bigdata/bigquery
      values:
        dataset_id: web_events

    # The pipeline that enriches the server's events and writes them to
    # the analytics dataset, a Dataflow job whose ID the server reports
    # with its health.
    event-pipeline:
      type: core/bigdata/dataflow
      values:
        parameters:
          inputSubscription: projects/example-project/subscriptions/web-events
          outputTable: example-project:web_events.enriched

    api:
      type: core/compute/server
      uses:
        catalog:
          product-catalog:
            target: product-catalog
            inject:
              env:
                - in: CATALOG_HOST
                  from: host
                - in: CATALOG_PORT
                  from: port
                - in: CATALOG_ENDPOINT
                  from: endpoint
                - in: CATALOG_DATABASE
                  from: database
        ledger:
          ledger-db:
            target: ledger-db
            inject:
              env:
                - in: LEDGER_DB_HOST
                  from: host
                - in: LEDGER_DB_PORT
                  from: port
                - in: LEDGER_DB_USER
                  from: user
                - in: LEDGER_DB_NAME
                  from: database
                - in: LEDGER_DB_PROTOCOL
                  from: protocol
        vectors:
          product-vectors:
            target: product-vectors
            inject:
              env:
                - in: VECTORS_HOST
                  from: host
                - in: VECTORS_PORT
                  from: port
                - in: VECTORS_ENDPOINT
                  from: endpoint
                - in: VECTORS_DEPLOYED_INDEX_ID
                  from: deployed_index_id
                - in: VECTORS_INDEX_ENDPOINT
                  from: index_endpoint
                - in: VECTORS_INDEX
                  from: index
        records:
          patient-records:
            target: patient-records
            inject:
              env:
                - in: RECORDS_HOST
                  from: host
                - in: RECORDS_PORT
                  from: port
                - in: RECORDS_ENDPOINT
                  from: endpoint
        analytics:
          web-analytics:
            target: web-analytics
            inject:
              env:
                - in: ANALYTICS_DATASET
                  from: dataset_id
        pipeline:
          event-pipeline:
            target: event-pipeline
            inject:
              env:
                - in: PIPELINE_JOB_ID
                  from: job_id
