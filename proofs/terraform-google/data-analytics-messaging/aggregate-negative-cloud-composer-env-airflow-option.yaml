apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-env-airflow-option
  version: "1.0.0"
  description: >
    A Cloud Composer environment with a variable that sets an Airflow
    configuration option, which Cloud Composer refuses through a variable.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        env_variables:
          AIRFLOW__CORE__PARALLELISM: "64"
