# Two core/backup attachments, where Firestore takes one daily backup
# schedule on a database.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-firestore-two-backups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-firestore-only.yaml
  manifest: ./manifest-firestore.yaml
  boundaries:
    google:
      directory: main
      components:
        sessions-store:
          features:
            backup:
              type: core/backup
            backup-long:
              type: core/backup
              infra:
                retention_days: 30
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
