apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: vertex-ai-vector-search-only
  version: "1.0.0"
  description: >
    A Vertex AI Vector Search index alone, of 256-long vectors and the
    values' other defaults, for the Releases that prove what the Vertex AI
    Vector Search Recipe writes and refuses on its own.
spec:
  components:
    document-vectors:
      type: core/datastore/vertex-ai-vector-search
      values:
        dimensions: 256
