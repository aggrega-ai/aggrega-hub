# An N4 machine type on the default PD_SSD disk, where the N4 series takes
# Hyperdisk Balanced alone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-storage-type-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              tier: db-custom-N4-2-8192
