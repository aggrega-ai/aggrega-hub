apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-analytics-messaging
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One root configuration, so every service and the server are modules of
    # one Terraform configuration and the server's environment carries each
    # service's references to the outputs of its module, which Terraform
    # resolves when it applies.
    #
    # The Firestore database is of the ENTERPRISE edition in the eur3
    # multi-region, with the Firestore API turned on, and takes a daily
    # backup kept 14 days. The SQL Server database runs on SQL Server 2022
    # Express in Cloud SQL Enterprise edition, its login takes the password
    # the random provider draws, handed to Cloud SQL as a Terraform
    # reference, and the instance keeps 7 automated backups, with
    # point-in-time recovery on. The Vertex AI Vector Search index is served
    # from a public endpoint, on resources Vertex AI decides. The Cloud
    # Healthcare API dataset is in europe-west4, a region the Healthcare API
    # offers. The BigQuery dataset is in the EU multi-region. The Dataflow
    # job runs in europe-west1, its workers as the operator's service account
    # in the operator's subnet there. The Cloud Composer environment runs
    # build 27 of Airflow 2.11.1, in europe-west1, small, as the operator's
    # service account, keeping its DAGs in a bucket the service creates.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project, example-network for its VPC
    # network with private services access, and the service accounts, the
    # subnet, the template file and the image for ones the operator already
    # has.
    google:
      directory: main
      components:
        product-catalog:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            overrides:
              project_id: example-project
              location: eur3
              edition: ENTERPRISE

        ledger-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network

        product-vectors:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1

        patient-records:
          infra:
            overrides:
              project_id: example-project
              location: europe-west4

        web-analytics:
          infra:
            overrides:
              project_id: example-project
              location: EU

        event-pipeline:
          infra:
            container_spec_gcs_path: gs://example-dataflow/templates/event-enrichment.json
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: dataflow-worker@example-project.iam.gserviceaccount.com
              subnetwork: projects/example-project/regions/europe-west1/subnetworks/example-subnet

        report-workflows:
          infra:
            engine_version: 2.11.1-build.27
            overrides:
              project_id: example-project
              region: europe-west1
              service_account: composer-env@example-project.iam.gserviceaccount.com
              environment_size: ENVIRONMENT_SIZE_SMALL

        api:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/api:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: api@example-project.iam.gserviceaccount.com
