apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: firestore
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: the Firestore database bound to its
    Recipe and core/backup to Firestore's own scheduled backups, for the
    Releases that prove what that Recipe writes and refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/firestore:1.0.0: terraform/firestore:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
