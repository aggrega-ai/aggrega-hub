apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dns-record-cloud-dns
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-cloud-dns-only.yaml
  manifest: ./manifest-dns-record-cloud-dns.yaml
  boundaries:
    # Every key the Cloud DNS Recipe reads: the managed zone, which
    # example-zone stands for, the operator's public zone for example.com,
    # and example-project, the operator's Google Cloud project holding it.
    google:
      directory: main
      components:
        api-address:
          infra:
            overrides:
              managed_zone: example-zone
              project_id: example-project
