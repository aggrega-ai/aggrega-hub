# infra.overrides.host, a name of the operator's for an endpoint that answers
# under the service's name alone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-healthcare-api-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-healthcare-api-only.yaml
  manifest: ./manifest-cloud-healthcare-api.yaml
  boundaries:
    google:
      directory: main
      components:
        clinical-data:
          infra:
            overrides:
              project_id: example-project
              location: eu
              host: fhir.example.com
