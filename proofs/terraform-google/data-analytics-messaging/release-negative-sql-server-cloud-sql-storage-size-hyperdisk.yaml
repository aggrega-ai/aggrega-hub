# A Hyperdisk Balanced disk below the 20 GB the google provider documents
# as its least, on an N4 machine type.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-storage-size-hyperdisk
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            storage:
              size: 16Gi
              type: HYPERDISK_BALANCED
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              tier: db-custom-N4-2-8192
