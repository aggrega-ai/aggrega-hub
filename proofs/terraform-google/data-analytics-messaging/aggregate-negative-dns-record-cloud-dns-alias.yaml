apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-cloud-dns-alias
  version: "1.0.0"
  description: >
    An alias record at the zone's apex, of type ALIAS, which Cloud DNS
    offers there in Preview and the DNS record Component does not offer on
    any service.
spec:
  components:
    apex-alias:
      type: core/network/dns-record
      values:
        name: example.com
        type: ALIAS
        records:
          - ghs.googlehosted.com.
