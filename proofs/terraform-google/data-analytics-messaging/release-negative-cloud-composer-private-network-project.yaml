# infra.overrides.private_network names a network of another project than the environment's.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-composer-private-network-project
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-composer-only.yaml
  manifest: ./manifest-cloud-composer.yaml
  boundaries:
    google:
      directory: main
      components:
        nightly-reports:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-host-project/global/networks/example-shared-network
