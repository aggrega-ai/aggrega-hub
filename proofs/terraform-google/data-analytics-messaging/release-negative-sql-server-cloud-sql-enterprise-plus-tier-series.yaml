# Cloud SQL Enterprise Plus edition on a general purpose dedicated core
# machine type, which that edition does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-cloud-sql-enterprise-plus-tier-series
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    google:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              edition: ENTERPRISE_PLUS
              sql_server_edition: ENTERPRISE
              tier: db-custom-2-8192
