# A cleanup policy setting both condition and most_recent_versions.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-artifact-registry-cleanup-condition-and-most-recent
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-artifact-registry-only.yaml
  manifest: ./manifest-artifact-registry.yaml
  boundaries:
    google:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              cleanup_policies:
                - id: keep-releases
                  action: KEEP
                  condition:
                    tag_state: TAGGED
                  most_recent_versions:
                    keep_count: 10
