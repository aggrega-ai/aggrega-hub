# infra.overrides.kms_key_name naming the key alone, not by its resource
# ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-pub-sub-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-only.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
              kms_key_name: example-key
