apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: google-cloud-pub-sub-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-pub-sub-bare.yaml
  manifest: ./manifest-google-cloud-pub-sub.yaml
  boundaries:
    # The one key the Pub/Sub Recipe needs: the operator's project, written
    # as example-project here. No retention, key or storage policy is set,
    # so none is written to the topic.
    google:
      directory: main
      components:
        order-events:
          infra:
            overrides:
              project_id: example-project
