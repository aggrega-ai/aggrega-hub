# infra.overrides.max_time_travel_hours is not a multiple of 24.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bigquery-time-travel
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bigquery-only.yaml
  manifest: ./manifest-bigquery.yaml
  boundaries:
    google:
      directory: main
      components:
        sales-analytics:
          infra:
            overrides:
              project_id: example-project
              max_time_travel_hours: 100
