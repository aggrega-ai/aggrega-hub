apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-composer-env-reserved
  version: "1.0.0"
  description: >
    A Cloud Composer environment with a variable named GCS_BUCKET, a name
    a Gen 3 environment reserves for a variable of its own.
spec:
  components:
    nightly-reports:
      type: core/ai-pipeline/cloud-composer
      values:
        env_variables:
          GCS_BUCKET: example-reports
