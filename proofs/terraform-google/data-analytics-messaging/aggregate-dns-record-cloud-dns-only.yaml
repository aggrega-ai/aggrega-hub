apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dns-record-cloud-dns-only
  version: "1.0.0"
  description: >
    A DNS record set alone, two addresses for one name, for the Releases
    that prove what the Cloud DNS Recipe writes and refuses on its own.
spec:
  components:
    # Two addresses, written as given.
    api-address:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: A
        ttl: 60
        records:
          - 192.0.2.10
          - 192.0.2.11
