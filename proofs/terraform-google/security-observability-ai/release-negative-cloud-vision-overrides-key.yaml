# infra.overrides.location, which this Recipe does not read: it reads none.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-vision-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-vision-only.yaml
  manifest: ./manifest-cloud-vision.yaml
  boundaries:
    google:
      directory: main
      components:
        image-analysis:
          infra:
            endpoint: https://eu-vision.googleapis.com
            overrides:
              location: eu
