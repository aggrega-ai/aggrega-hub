# infra.overrides.region, which this Recipe does not read: Model Armor
# takes a multi-region as well as a region, so its key is location.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-model-armor-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-model-armor-only.yaml
  manifest: ./manifest-model-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        prompt-screening:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
