# infra.overrides.authorized_domains written as one domain rather than a
# list of them.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-identity-platform-authorized-domains
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-identity-platform-only.yaml
  manifest: ./manifest-identity-platform.yaml
  boundaries:
    google:
      directory: main
      components:
        shopper-sign-in:
          infra:
            overrides:
              project_id: example-project
              authorized_domains: app.example.com
