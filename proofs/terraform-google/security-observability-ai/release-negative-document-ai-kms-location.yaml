# A kms_key_name in europe-west1 for a processor in the eu multi-region,
# whose key Document AI takes in europe-west4.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-document-ai-kms-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-document-ai-only.yaml
  manifest: ./manifest-document-ai.yaml
  boundaries:
    google:
      directory: main
      components:
        document-reader:
          infra:
            overrides:
              project_id: example-project
              location: eu
              kms_key_name: projects/example-project/locations/europe-west1/keyRings/example-ring/cryptoKeys/documents
