apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: document-ai-only
  version: "1.0.0"
  description: >
    A Document AI processor alone, reading the text of the documents it is
    sent, for the Releases that prove what its Recipe builds and refuses on
    its own.
spec:
  components:
    document-reader:
      type: core/ai-tool/document-ai
      values:
        type: OCR_PROCESSOR
