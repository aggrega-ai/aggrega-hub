# No infra.overrides.key_protection_level, so the keys are created at
# SOFTWARE, which Cloud KMS does not offer their algorithm at.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-algorithm-protection-level
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-signing.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        ledger-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
