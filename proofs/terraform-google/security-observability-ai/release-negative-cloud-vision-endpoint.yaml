# No infra.endpoint: the Vision API endpoint the requests go to is left
# unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-vision-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-vision-only.yaml
  manifest: ./manifest-cloud-vision.yaml
  boundaries:
    google:
      directory: main
      components:
        image-analysis: {}
