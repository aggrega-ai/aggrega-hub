# A template with no filter, in the United States multi-region, reached at
# its endpoint there.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: model-armor-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-model-armor-bare.yaml
  manifest: ./manifest-model-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        prompt-screening:
          infra:
            overrides:
              project_id: example-project
              location: us
