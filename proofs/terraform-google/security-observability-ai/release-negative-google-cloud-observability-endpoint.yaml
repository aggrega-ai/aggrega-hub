# No infra.endpoint: the Telemetry API endpoint the telemetry is sent to is
# left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-observability-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-observability-only.yaml
  manifest: ./manifest-google-cloud-observability.yaml
  boundaries:
    google:
      directory: main
      components:
        telemetry: {}
