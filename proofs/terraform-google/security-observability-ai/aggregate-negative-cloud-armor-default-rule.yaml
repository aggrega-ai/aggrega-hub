apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloud-armor-default-rule
  version: "1.0.0"
  description: >
    Cloud Armor rules without the default rule at priority 2147483647,
    which every policy keeps.
spec:
  components:
    assets-policy:
      type: core/security/cloud-armor
      values:
        rules:
          - action: deny(403)
            priority: 1000
            match:
              expr:
                expression: origin.region_code == 'AQ'
