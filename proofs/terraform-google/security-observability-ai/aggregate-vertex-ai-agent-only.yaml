apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: vertex-ai-agent-only
  version: "1.0.0"
  description: >
    A Vertex AI agent alone, with no identifier set, for the Releases that
    prove what the Vertex AI agent Recipe publishes and refuses on its own.
spec:
  components:
    support-agent:
      type: core/ai-agent/vertex-ai
      values:
        instructions: Answer questions about orders and hand anything else to a person.
