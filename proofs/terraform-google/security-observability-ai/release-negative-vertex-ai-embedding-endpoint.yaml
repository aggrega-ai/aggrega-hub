# No infra.endpoint: the Vertex AI host the embedding model is reached at is
# left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-embedding-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-embedding-only.yaml
  manifest: ./manifest-vertex-ai-embedding.yaml
  boundaries:
    google:
      directory: main
      components:
        search-embedding: {}
