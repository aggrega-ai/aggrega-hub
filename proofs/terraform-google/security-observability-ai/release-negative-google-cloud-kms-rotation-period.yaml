# infra.overrides.key_rotation_period of one hour, shorter than the one day
# a rotation period takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-rotation-period
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-only.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        receipt-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              key_rotation_period: 3600s
