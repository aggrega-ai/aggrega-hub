# A policy with no rules of the component's: the body writes the default
# rule alone, allowing every request, as Compute Engine gives a policy
# created with none.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-armor-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-bare.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              project_id: example-project
