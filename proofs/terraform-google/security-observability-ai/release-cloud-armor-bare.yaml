# A policy with no rules of the component's: Compute Engine gives it its
# default rule when it creates it, and the body writes no rule.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-armor-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-bare.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              project_id: example-project
