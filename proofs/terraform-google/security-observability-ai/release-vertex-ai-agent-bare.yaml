apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: vertex-ai-agent-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-agent-only.yaml
  manifest: ./manifest-vertex-ai-agent.yaml
  boundaries:
    # The agent with no identifier in the Aggregate: the module's agent_id
    # output, and the agent_id it publishes, are empty.
    google:
      directory: main
      components:
        support-agent:
          infra:
            endpoint: europe-west1-aiplatform.googleapis.com
