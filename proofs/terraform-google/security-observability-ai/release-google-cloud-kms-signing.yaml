# The signing keys at the HSM protection level, their algorithm's one, with
# no rotation period, since Cloud KMS rotates no signing key, and
# prevent_destroy turned off, so Terraform may destroy their versions.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: google-cloud-kms-signing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-signing.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        ledger-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              key_protection_level: HSM
              prevent_destroy: false
