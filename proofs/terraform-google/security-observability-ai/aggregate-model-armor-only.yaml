apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: model-armor-only
  version: "1.0.0"
  description: >
    A Model Armor template alone, screening for hate speech and harassment
    and for prompt injection, for the Releases that prove what its Recipe
    builds and refuses on its own.
spec:
  components:
    prompt-screening:
      type: core/security/model-armor
      values:
        filter_config:
          rai_settings:
            rai_filters:
              - filter_type: HATE_SPEECH
                confidence_level: MEDIUM_AND_ABOVE
              - filter_type: HARASSMENT
          pi_and_jailbreak_filter_settings:
            filter_enforcement: ENABLED
            confidence_level: HIGH
