# An edge policy, which a backend bucket takes, filtering requests before
# Google's cache serves them.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloud-armor-edge
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-only.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              project_id: example-project
              type: CLOUD_ARMOR_EDGE
