apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: security-observability-ai
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One root configuration, so every service and the server are modules of
    # one Terraform configuration and the server's environment carries what
    # each service publishes. A reference's module declares no resource: the
    # endpoint it publishes is an output of that module, and the server's
    # environment carries it as the text the Release gives.
    #
    # The Telemetry API is reached at its global endpoint, and the Vision API
    # at the endpoint that keeps a request's text detection data in the
    # European Union. The Vertex AI models and the agent are reached at the
    # Vertex AI host of europe-west1, where the server runs.
    #
    # Every project-specific value is a placeholder: example-project stands
    # for the operator's Google Cloud project, example-network for its VPC
    # network, and the service account and the image for ones the operator
    # already has.
    google:
      directory: main
      components:
        telemetry:
          infra:
            endpoint: https://telemetry.googleapis.com

        image-analysis:
          infra:
            endpoint: https://eu-vision.googleapis.com

        assistant-model:
          infra:
            endpoint: europe-west1-aiplatform.googleapis.com

        search-embedding:
          infra:
            endpoint: europe-west1-aiplatform.googleapis.com

        support-agent:
          infra:
            endpoint: europe-west1-aiplatform.googleapis.com

        api:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/api:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: api@example-project.iam.gserviceaccount.com
