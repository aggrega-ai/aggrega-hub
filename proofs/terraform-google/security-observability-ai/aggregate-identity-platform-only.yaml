apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: identity-platform-only
  version: "1.0.0"
  description: >
    Identity Platform alone, where users sign in with an email address and a
    password and enrol a code sent by SMS as a second factor, for the
    Releases that prove what its Recipe builds and refuses on its own.
spec:
  components:
    shopper-sign-in:
      type: core/security/identity-platform
      values:
        sign_in:
          email:
            enabled: true
        mfa:
          state: ENABLED
          enabled_providers:
            - PHONE_SMS
