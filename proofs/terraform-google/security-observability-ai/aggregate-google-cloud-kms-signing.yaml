apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: google-cloud-kms-signing
  version: "1.0.0"
  description: >
    A Cloud KMS key ring holding signing keys on the secp256k1 curve, an
    algorithm Cloud KMS offers at the HSM protection level alone, and keys
    of a purpose Cloud KMS does not rotate.
spec:
  components:
    ledger-keys:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - ledger-signing
          - ledger-signing-standby
        purpose: ASYMMETRIC_SIGN
        algorithm: EC_SIGN_SECP256K1_SHA256
