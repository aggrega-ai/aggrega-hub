# infra.overrides.key_rotation, which this Recipe does not read: the
# rotation period is key_rotation_period.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-only.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        receipt-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              key_rotation: "2592000s"
