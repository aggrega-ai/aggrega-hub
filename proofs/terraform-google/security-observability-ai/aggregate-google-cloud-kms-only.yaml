apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: google-cloud-kms-only
  version: "1.0.0"
  description: >
    A Cloud KMS key ring alone, holding a symmetric encryption key, for the
    Releases that prove what its Recipe refuses on its own.
spec:
  components:
    receipt-keys:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - receipts
