apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-google-cloud-kms-key-ring-name
  version: "1.0.0"
  description: >
    A Cloud KMS key ring whose instance name, which the ring takes, is 64
    characters long, one more than a key ring ID takes.
spec:
  components:
    receipt-keys-for-the-orders-the-shop-keeps-in-europe-and-asia-01:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - receipts
