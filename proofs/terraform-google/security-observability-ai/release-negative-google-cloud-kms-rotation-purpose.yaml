# infra.overrides.key_rotation_period on signing keys, which Cloud KMS does
# not rotate.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-rotation-purpose
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-signing.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        ledger-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              key_protection_level: HSM
              key_rotation_period: 7776000s
