# No infra.endpoint: the Vertex AI host the agent is reached at is left
# unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-vertex-ai-agent-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-vertex-ai-agent-only.yaml
  manifest: ./manifest-vertex-ai-agent.yaml
  boundaries:
    google:
      directory: main
      components:
        support-agent: {}
