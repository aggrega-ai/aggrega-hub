# A network policy, which is regional and filters packets for network load
# balancing.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-armor-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-only.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              project_id: example-project
              type: CLOUD_ARMOR_NETWORK
