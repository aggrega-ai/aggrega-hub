# infra.overrides.project_id, which this Recipe does not read: it reads none.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-observability-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-observability-only.yaml
  manifest: ./manifest-google-cloud-observability.yaml
  boundaries:
    google:
      directory: main
      components:
        telemetry:
          infra:
            endpoint: https://telemetry.googleapis.com
            overrides:
              project_id: example-project
