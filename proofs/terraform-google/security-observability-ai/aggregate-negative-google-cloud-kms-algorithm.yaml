apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-google-cloud-kms-algorithm
  version: "1.0.0"
  description: >
    A Cloud KMS key ring whose keys compute MACs with the symmetric
    encryption algorithm, which a key of purpose MAC does not take.
spec:
  components:
    receipt-keys:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - receipts
        purpose: MAC
