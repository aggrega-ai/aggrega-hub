# The authorized domains written as the whole list: the domain the app is
# served from and the project's own sign-in domain.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: identity-platform
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-identity-platform-only.yaml
  manifest: ./manifest-identity-platform.yaml
  boundaries:
    google:
      directory: main
      components:
        shopper-sign-in:
          infra:
            overrides:
              project_id: example-project
              authorized_domains:
                - app.example.com
                - example-project.firebaseapp.com
