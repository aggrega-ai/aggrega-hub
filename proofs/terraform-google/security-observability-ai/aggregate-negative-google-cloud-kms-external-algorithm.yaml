apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-google-cloud-kms-external-algorithm
  version: "1.0.0"
  description: >
    A Cloud KMS key ring whose keys use the algorithm of a key held in an
    external key manager, which the Component admits and this Recipe does not
    create.
spec:
  components:
    receipt-keys:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - receipts
        algorithm: EXTERNAL_SYMMETRIC_ENCRYPTION
