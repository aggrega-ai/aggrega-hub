# A kms_key_name naming the key ring rather than a key in it.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-document-ai-kms-key-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-document-ai-only.yaml
  manifest: ./manifest-document-ai.yaml
  boundaries:
    google:
      directory: main
      components:
        document-reader:
          infra:
            overrides:
              project_id: example-project
              location: us
              kms_key_name: projects/example-project/locations/us-central1/keyRings/example-ring
