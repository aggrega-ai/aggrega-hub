# No infra.overrides.project_id.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-armor-project-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-only.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              type: CLOUD_ARMOR_EDGE
