# infra.overrides.kms_key, which this Recipe does not read: the key is
# kms_key_name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-document-ai-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-document-ai-only.yaml
  manifest: ./manifest-document-ai.yaml
  boundaries:
    google:
      directory: main
      components:
        document-reader:
          infra:
            overrides:
              project_id: example-project
              location: us
              kms_key: projects/example-project/locations/us-central1/keyRings/example-ring/cryptoKeys/documents
