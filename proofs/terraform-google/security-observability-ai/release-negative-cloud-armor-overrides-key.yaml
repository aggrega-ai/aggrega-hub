# infra.overrides.policy_type, which this Recipe does not read: the policy's
# type is type.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloud-armor-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloud-armor-only.yaml
  manifest: ./manifest-cloud-armor.yaml
  boundaries:
    google:
      directory: main
      components:
        assets-policy:
          infra:
            overrides:
              project_id: example-project
              policy_type: CLOUD_ARMOR_EDGE
