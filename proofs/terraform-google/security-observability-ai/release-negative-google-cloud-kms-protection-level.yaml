# infra.overrides.key_protection_level EXTERNAL, a key in an external key
# manager, which this Recipe does not create.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-protection-level
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-only.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        receipt-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              key_protection_level: EXTERNAL
