apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: security-observability-ai
  version: "1.0.0"
  description: >
    Google Cloud's security, observability and AI services and a server on
    Cloud Run consuming each of them, so the server's environment shows what
    a consumer of each receives.
spec:
  components:
    # The Telemetry API the server sends its traces, metrics and logs to
    # over OTLP, signing each request with the identity it runs as.
    telemetry:
      type: core/observability/google-cloud-observability

    # The Vision API the server sends the receipts shoppers photograph to,
    # reading back the text they show.
    image-analysis:
      type: core/ai-tool/cloud-vision

    # The model the server sends its shoppers' questions to, served by
    # Vertex AI outside the Release under its model name.
    assistant-model:
      type: core/ai-model/vertex-ai
      values:
        model: gemini-2.5-flash

    # The embedding model the server sends the product descriptions it
    # indexes to, served by Vertex AI outside the Release under its model
    # name. dimensionality records the embedding size the server asks for in
    # its own requests; no realization publishes it.
    search-embedding:
      type: core/ai-model/vertex-ai-embedding
      values:
        model: text-embedding-005
        dimensionality: 256

    # The agent the server hands its support conversations to, which lives
    # in Vertex AI outside the Release with its instructions and is
    # addressed by its identifier.
    support-agent:
      type: core/ai-agent/vertex-ai
      values:
        agent_id: example-support-agent
        instructions: Answer questions about orders and hand anything else to a person.

    # The key ring holding the key the server encrypts the receipts it
    # keeps with, through Cloud KMS, under its own identity.
    receipt-keys:
      type: core/security/google-cloud-kms
      values:
        crypto_keys:
          - receipts

    # The project's Identity Platform, where shoppers sign in with an email
    # address and a password, or with their phone number.
    shopper-sign-in:
      type: core/security/identity-platform
      values:
        sign_in:
          email:
            enabled: true
          phone_number:
            enabled: true

    api:
      type: core/compute/server
      uses:
        telemetry:
          telemetry:
            target: telemetry
            inject:
              env:
                - in: TELEMETRY_ENDPOINT
                  from: endpoint
        vision:
          image-analysis:
            target: image-analysis
            inject:
              env:
                - in: VISION_ENDPOINT
                  from: endpoint
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_NAME
                  from: model
        embedding:
          search-embedding:
            target: search-embedding
            inject:
              env:
                - in: EMBEDDING_ENDPOINT
                  from: endpoint
                - in: EMBEDDING_MODEL_NAME
                  from: model
        agent:
          support-agent:
            target: support-agent
            inject:
              env:
                - in: AGENT_ENDPOINT
                  from: endpoint
                - in: AGENT_ID
                  from: agent_id
        keys:
          receipt-keys:
            target: receipt-keys
            inject:
              env:
                - in: KMS_KEY_RING
                  from: key_ring
        # The server verifies the tokens a shopper's app sends with the
        # issuer's discovery document, and calls Identity Platform with the
        # project's API key, which the Component declares sensitive, so the
        # server reads it from a file, held in a Secret Manager secret, rather
        # than from a variable the service's readers see.
        sign-in:
          shopper-sign-in:
            target: shopper-sign-in
            inject:
              env:
                - in: OIDC_DISCOVERY_URL
                  from: oidc_discovery_url
                - in: AUTH_SUBDOMAIN
                  from: firebase_subdomain
              file:
                - in: /etc/api/identity-platform/api-key
                  from: api_key
