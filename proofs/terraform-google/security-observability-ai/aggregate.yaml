apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: security-observability-ai
  version: "1.0.0"
  description: >
    Google Cloud's security, observability and AI services and a server on
    Cloud Run consuming each of them, so the server's environment shows what
    a consumer of each receives.
spec:
  components:
    # The Telemetry API the server sends its traces, metrics and logs to
    # over OTLP, signing each request with the identity it runs as.
    telemetry:
      type: core/observability/google-cloud-observability

    # The Vision API the server sends the receipts shoppers photograph to,
    # reading back the text they show.
    image-analysis:
      type: core/ai-tool/cloud-vision

    # The model the server sends its shoppers' questions to, served by
    # Vertex AI outside the Release under its model name.
    assistant-model:
      type: core/ai-model/vertex-ai
      values:
        model: gemini-2.5-flash

    api:
      type: core/compute/server
      uses:
        telemetry:
          telemetry:
            target: telemetry
            inject:
              env:
                - in: TELEMETRY_ENDPOINT
                  from: endpoint
        vision:
          image-analysis:
            target: image-analysis
            inject:
              env:
                - in: VISION_ENDPOINT
                  from: endpoint
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_NAME
                  from: model
