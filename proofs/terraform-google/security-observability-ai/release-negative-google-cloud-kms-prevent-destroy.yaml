# infra.overrides.prevent_destroy written as a string.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-google-cloud-kms-prevent-destroy
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-google-cloud-kms-only.yaml
  manifest: ./manifest-google-cloud-kms.yaml
  boundaries:
    google:
      directory: main
      components:
        receipt-keys:
          infra:
            overrides:
              project_id: example-project
              location: europe-west1
              prevent_destroy: "yes"
