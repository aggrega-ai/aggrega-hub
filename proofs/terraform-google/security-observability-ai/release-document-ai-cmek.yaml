# The processor in the United States multi-region, encrypted with the
# operator's Cloud KMS key in us-central1, the location Document AI asks of a
# key for that multi-region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: document-ai-cmek
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-document-ai-only.yaml
  manifest: ./manifest-document-ai.yaml
  boundaries:
    google:
      directory: main
      components:
        document-reader:
          infra:
            overrides:
              project_id: example-project
              location: us
              kms_key_name: projects/example-project/locations/us-central1/keyRings/example-ring/cryptoKeys/documents
