# infra.overrides.authorised_domains, which this Recipe does not read: the
# key is authorized_domains.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-identity-platform-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-identity-platform-only.yaml
  manifest: ./manifest-identity-platform.yaml
  boundaries:
    google:
      directory: main
      components:
        shopper-sign-in:
          infra:
            overrides:
              project_id: example-project
              authorised_domains:
                - app.example.com
