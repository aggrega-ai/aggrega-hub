apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: each Component type bound to the newest
    version of the catalog's Recipe realizing it there, and core/random-password
    to the FeatureRecipe that draws a password with the random provider. No two
    components of the Aggregate share a type, so the type tier binds them all.
spec:
  mappings:
    components:
      type:
        core/storage/gcs:1.0.0: terraform/gcs:1.0.0
        core/storage/s3-object-store:1.0.0: terraform/s3-object-store-gcs:1.0.0
        core/datastore/postgres:1.0.0: terraform/postgres-cloud-sql:1.0.0
        core/datastore/mysql:1.0.0: terraform/mysql-cloud-sql:1.0.0
        core/datastore/valkey:1.0.0: terraform/valkey-memorystore:1.0.0
        core/datastore/memcached:1.0.0: terraform/memcached-memorystore:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.1.0
        core/compute/worker:1.0.0: terraform/worker-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
