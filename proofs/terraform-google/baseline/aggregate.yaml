apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    One instance of every Component the catalog realizes on Google Cloud through
    Terraform. The server and the worker each use every datastore, so every
    datastore's published entries reach a container's environment.
spec:
  components:
    assets:
      type: core/storage/gcs
      values:
        bucket: example-project-assets

    objects:
      type: core/storage/s3-object-store
      values:
        bucket: example-project-objects

    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    billing-db:
      type: core/datastore/mysql
      values:
        database: billing
        user: billing_app

    sessions:
      type: core/datastore/valkey

    fragments:
      type: core/datastore/memcached

    api:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_USER
                  from: user
                - in: ORDERS_DB_NAME
                  from: database
        billing:
          billing-db:
            target: billing-db
            inject:
              env:
                - in: BILLING_DB_HOST
                  from: host
                - in: BILLING_DB_PORT
                  from: port
                - in: BILLING_DB_USER
                  from: user
                - in: BILLING_DB_NAME
                  from: database
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        fragments:
          fragments:
            target: fragments
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port

    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_USER
                  from: user
                - in: ORDERS_DB_NAME
                  from: database
        billing:
          billing-db:
            target: billing-db
            inject:
              env:
                - in: BILLING_DB_HOST
                  from: host
                - in: BILLING_DB_PORT
                  from: port
                - in: BILLING_DB_USER
                  from: user
                - in: BILLING_DB_NAME
                  from: database
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        fragments:
          fragments:
            target: fragments
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port
