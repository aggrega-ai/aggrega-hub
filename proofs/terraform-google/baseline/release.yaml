apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary, so every component is a module block of one Terraform root
    # configuration, where each module output a neighbour reads resolves.
    #
    # Every project-specific value is a placeholder: example-project stands for
    # the operator's Google Cloud project, example-network for a VPC network
    # with private services access to Cloud SQL and Memorystore, and the
    # service account and images for ones the operator already has.
    google:
      directory: main
      components:
        assets:
          infra:
            location: europe-west1
            overrides:
              project_id: example-project
        objects:
          infra:
            region: europe-west1
            overrides:
              project_id: example-project
        orders-db:
          # The user values.user names logs in with the password the random
          # provider draws, handed to Cloud SQL as a Terraform reference.
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        billing-db:
          # Cloud SQL creates root with no password, so root_password takes a
          # drawn password; the user values.user names takes one too.
          features:
            root_password:
              type: core/random-password
            user_password:
              type: core/random-password
          infra:
            engine_version: "8.4"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        sessions:
          infra:
            engine_version: "9.1"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        fragments:
          infra:
            engine_version: "1.6.15"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        api:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: api@example-project.iam.gserviceaccount.com
        jobs:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/jobs:1.0.0
            replicas: 1
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: jobs@example-project.iam.gserviceaccount.com
