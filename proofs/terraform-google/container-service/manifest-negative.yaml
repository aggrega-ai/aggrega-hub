apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative
  version: "1.0.0"
  description: >
    The type bindings of this fixture's Manifest and no name binding, for the
    negative Releases whose Aggregates hold components of their own; a
    negative Manifest extending it binds what one of them changes.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-cloud-sql:1.0.0
        example/compute/sample-product:1.0.0: terraform/sample-product-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
