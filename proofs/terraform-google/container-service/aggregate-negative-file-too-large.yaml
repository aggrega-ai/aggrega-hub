apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-file-too-large
  version: "1.0.0"
  description: >
    A file whose content is larger than a Secret Manager secret version
    holds.
spec:
  components:
    product:
      type: example/compute/sample-product
      inject:
        file:
          - in: /etc/sample/large.txt
            value: '{{"{{"}} repeat 65537 "x" }}'
