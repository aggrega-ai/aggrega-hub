apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    Containers on Cloud Run through the shared Cloud Run shape, beside the
    PostgreSQL database they use: the generic server and worker, each handed
    its database as its inject blocks dictate, variables and files alike, and
    the placeholder product as a service and as a scheduled job, each
    delivered its database by its Recipe's default names.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    # The product's database connection dictates nothing, so the Recipe
    # delivers it under its own default names, and its greeting reaches it as
    # a file its own inject block names rather than as SAMPLE_GREETING.
    product:
      type: example/compute/sample-product
      values:
        greeting: hello from the fixture
        workers: 3
      inject:
        file:
          - in: /etc/sample/greeting.txt
            value: '{{"{{"}} .values.greeting }}'
      uses:
        database:
          orders:
            target: db

    nightly:
      type: example/compute/sample-product
      values:
        workers: 1
        schedule: "30 2 * * *"
      uses:
        database:
          orders:
            target: db

    # The server is handed its database under the names its connection
    # dictates, the database's name as a file, and the product's address,
    # which the product's Recipe reads off its service's URI.
    api:
      type: core/compute/server
      uses:
        database:
          orders:
            target: db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
              file:
                - in: /etc/api/database/name
                  from: database
        products:
          product:
            target: product
            inject:
              env:
                - in: SAMPLE_ENDPOINT
                  from: endpoint

    # The worker's concurrency reaches it as WORKER_CONCURRENCY, its default
    # name, beside what its connection dictates.
    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        database:
          orders:
            target: db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
              file:
                - in: /etc/jobs/database/user
                  from: user
