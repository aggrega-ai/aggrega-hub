apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: container-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary, so every component is a module block of one Terraform root
    # configuration, where each module output a neighbour reads resolves.
    #
    # Every project-specific value is a placeholder: example-project stands for
    # the operator's Google Cloud project, example-network for a VPC network
    # with private services access to Cloud SQL, and the service accounts and
    # images for ones the operator already has.
    google:
      directory: main
      components:
        db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        # The product runs the image its Recipe holds, so infra.image is left
        # unset, and the GPU it runs with sizes it at 4 vCPU and 16 GiB above
        # the Component's default compute.
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
        nightly:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly@example-project.iam.gserviceaccount.com
              subnetwork: example-subnet
              network_tags:
                - nightly
              deletion_protection: false
