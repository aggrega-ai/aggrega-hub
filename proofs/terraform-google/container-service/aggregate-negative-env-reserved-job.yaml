apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-reserved-job
  version: "1.0.0"
  description: >
    A variable Cloud Run sets in every job itself.
spec:
  components:
    nightly:
      type: example/compute/sample-product
      values:
        schedule: "30 2 * * *"
      inject:
        env:
          - in: CLOUD_RUN_TASK_INDEX
            value: placeholder
