# A CPU and memory pair no Cloud Run size meets.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-compute-size
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    google:
      directory: main
      components:
        db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
        nightly:
          infra:
            compute:
              cpu: "8"
              memory: 64Gi
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly@example-project.iam.gserviceaccount.com
        reindex:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: reindex@example-project.iam.gserviceaccount.com
        api:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: api@example-project.iam.gserviceaccount.com
        jobs:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/jobs:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: jobs@example-project.iam.gserviceaccount.com
