apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-reserved-worker
  version: "1.0.0"
  description: >
    The component's own block dictating a variable Cloud Run sets in every
    worker pool itself.
spec:
  components:
    jobs:
      type: core/compute/worker
      inject:
        env:
          - in: CLOUD_RUN_WORKER_POOL
            value: placeholder
