# A connection dictating a variable Cloud Run sets in every service itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-env-reserved-server
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-env-reserved-server.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        api:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/api:1.0.0
            port: 8080
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: api@example-project.iam.gserviceaccount.com
