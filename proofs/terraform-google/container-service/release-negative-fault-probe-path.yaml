# A product Recipe declaring a probe path not beginning with /.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-fault-probe-path
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: ./manifest-negative-fault-probe-path.yaml
  boundaries:
    google:
      directory: main
      components:
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
