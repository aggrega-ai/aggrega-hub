apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-collision
  version: "1.0.0"
  description: >
    The component's own block dictating a variable its connection delivers
    by default.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      inject:
        env:
          - in: SAMPLE_DB_HOST
            value: db.example.com
      uses:
        database:
          orders:
            target: db
