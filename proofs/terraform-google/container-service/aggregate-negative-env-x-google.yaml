apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-x-google
  version: "1.0.0"
  description: >
    A variable under a prefix Cloud Run refuses.
spec:
  components:
    peer:
      type: example/compute/sample-product
    product:
      type: example/compute/sample-product
      uses:
        peers:
          peer:
            target: peer
            inject:
              env:
                - in: X_GOOGLE_PEER
                  from: endpoint
