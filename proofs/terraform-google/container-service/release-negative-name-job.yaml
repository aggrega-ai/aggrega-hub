# A job whose component name Cloud Run cannot take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-job
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-job.yaml
  manifest: ./manifest-negative-name-job.yaml
  boundaries:
    google:
      directory: main
      components:
        sample-product-job-named-longer-than-sixty-two-characters-for-a-job:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: sample-product-job-named-longer-than-sixty-two-characters-for-a-job@example-project.iam.gserviceaccount.com
