apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-env-reserved-server
  version: "1.0.0"
  description: >
    A connection dictating a variable Cloud Run sets in every service
    itself.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    api:
      type: core/compute/server
      uses:
        database:
          orders:
            target: db
            inject:
              env:
                - in: PORT
                  from: port
