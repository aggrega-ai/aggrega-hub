apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-fault-socket-key
  version: "1.0.0"
  description: >
    A product Recipe delivering a key its socket's target does not publish.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      uses:
        database:
          orders:
            target: db
