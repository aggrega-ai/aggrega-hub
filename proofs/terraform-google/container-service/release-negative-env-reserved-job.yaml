# A variable Cloud Run sets in every job itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-env-reserved-job
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-env-reserved-job.yaml
  manifest: ./manifest-negative-env-reserved-job.yaml
  boundaries:
    google:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: nightly@example-project.iam.gserviceaccount.com
