apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: the generic server and worker bound to
    their Cloud Run Recipes, the placeholder product to its service Recipe,
    and the nightly component of the same type, by name, to its job Recipe;
    PostgreSQL to Cloud SQL, with core/random-password drawing its password
    with the random provider.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-cloud-sql:1.0.0
        example/compute/sample-product:1.0.0: terraform/sample-product-cloud-run:1.0.0
        core/compute/server:1.1.0: terraform/server-cloud-run:1.2.0
        core/compute/worker:1.0.0: terraform/worker-cloud-run:1.1.0
      name:
        nightly: terraform/sample-product-job-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
