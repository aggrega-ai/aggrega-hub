apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Google Cloud through Terraform: the placeholder product bound to its
    service Recipe, and the nightly component of the same type, by name, to
    its job Recipe; PostgreSQL to Cloud SQL, with core/random-password drawing
    its password with the random provider.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-cloud-sql:1.0.0
        example/compute/sample-product:1.0.0: terraform/sample-product-cloud-run:1.0.0
      name:
        nightly: terraform/sample-product-job-cloud-run:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
