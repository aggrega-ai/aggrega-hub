# A connection dictating the variable the worker's concurrency is delivered as by default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-value-collision-worker
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-value-collision-worker.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        jobs:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/jobs:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: jobs@example-project.iam.gserviceaccount.com
