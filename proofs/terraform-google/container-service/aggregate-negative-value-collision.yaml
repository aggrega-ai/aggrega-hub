apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-value-collision
  version: "1.0.0"
  description: >
    A connection dictating the variable an own value is delivered as by
    default.
spec:
  components:
    peer:
      type: example/compute/sample-product
    product:
      type: example/compute/sample-product
      values:
        workers: 2
      uses:
        peers:
          peer:
            target: peer
            inject:
              env:
                - in: SAMPLE_WORKERS
                  from: endpoint
