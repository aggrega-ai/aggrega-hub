apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-value-collision-worker
  version: "1.0.0"
  description: >
    A connection dictating the variable the worker's concurrency is
    delivered as by default.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        database:
          orders:
            target: db
            inject:
              env:
                - in: WORKER_CONCURRENCY
                  from: port
