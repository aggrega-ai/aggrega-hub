# Two connections on one socket, both taking the default names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-socket-two-connections
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-socket-two-connections.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
