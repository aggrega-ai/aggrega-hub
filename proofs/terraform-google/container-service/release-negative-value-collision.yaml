# A connection dictating the variable an own value is delivered as by default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-value-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-value-collision.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        peer:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: peer@example-project.iam.gserviceaccount.com
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
