apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-cloud-run
  version: 1.0.0
  description: >
    The placeholder product as one Cloud Run service, written as a product
    Recipe on the shared Cloud Run shape: the fixed pass-through module, the
    Service body from CloudRunModule, the ServiceArguments entry from
    CloudRunArguments, and the locals that entry reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0

  # The fixed pass-through: its config input goes to the body under service,
  # and the body comes back out as its service output.
  source: ./module

  artifacts:
    service:
      $import: CloudRunModule#/artifacts/Service

  # What the product fixes, read by CloudRunArguments#/mappings/ServiceArguments:
  # its image while infra.image is unset, the port it listens on, the variables
  # its own values and its database connection reach it as, the path it
  # answers its probes on, and the one GPU it runs with.
  locals:
    default_image: europe-west1-docker.pkg.dev/example-project/example/sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'
    probe_path: /healthz
    gpu: '{"count": 1, "type": "nvidia-l4"}'

  # The service's URI, read off the body's uri output through the
  # pass-through's service output.
  provides:
    endpoint: "${module.{{ .context.instance_id }}.service.uri}"

  valuesMapping:
    $import: CloudRunArguments#/mappings/ServiceArguments
