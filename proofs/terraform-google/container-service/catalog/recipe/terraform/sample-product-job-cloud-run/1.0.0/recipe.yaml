apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-job-cloud-run
  version: 1.0.0
  description: >
    The placeholder product as one Cloud Run job, started on values.schedule
    by Cloud Scheduler, written as a product Recipe on the shared Cloud Run
    shape: the fixed pass-through module, the Job body from CloudRunModule, the
    JobArguments entry from CloudRunArguments, and the locals that entry
    reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0

  # The fixed pass-through: its config input goes to the body under service,
  # and the body comes back out as its service output.
  source: ./module

  artifacts:
    service:
      $import: CloudRunModule#/artifacts/Job

  # What the product fixes, read by CloudRunArguments#/mappings/JobArguments:
  # its image while infra.image is unset and the variables its own values and
  # its database connection reach it as. A run answers no probe and needs no
  # GPU, so neither is declared.
  locals:
    default_image: europe-west1-docker.pkg.dev/example-project/example/sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'

  # A job serves no requests, so it publishes no address.
  provides:
    endpoint: ""

  valuesMapping:
    $import: CloudRunArguments#/mappings/JobArguments
