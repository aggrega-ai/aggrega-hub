apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-port-missing
  version: 1.0.0
  description: >
    A product service Recipe declaring no port, for a Component declaring no
    infra.port. It is reached only by the negative Release
    release-negative-fault-port-missing.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0
  source: ./module
  artifacts:
    service:
      $import: CloudRunModule#/artifacts/Service
  locals:
    default_image: europe-west1-docker.pkg.dev/example-project/example/sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'
  provides:
    endpoint: ""
  valuesMapping:
    $import: CloudRunArguments#/mappings/ServiceArguments
