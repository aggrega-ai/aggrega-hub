apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/sample-product
  version: 1.0.0
  description: >
    A placeholder product packaged as a container image, realized on Cloud Run
    in this fixture the way a product Recipe realizes one: as a service, and as
    a job started on a schedule. It has two values of its own and one socket,
    database, which its Recipes deliver to the container under names of their
    own.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Every Recipe of this Component delivers env and file entries, so the
  # component's own inject block takes both.
  inject: [env, file]

  usesSchema:
    database:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]

  schema:
    values:
      greeting:
        type: string
        default: hello
        description: The greeting the product answers with.
      workers:
        type: integer
        min: 1
        description: How many workers the product runs inside its container.
      schedule:
        type: string
        description: >
          A cron expression of five fields on which the job realization runs
          the product; the service realization does not read it.

    infra:
      image:
        type: string
        description: Container image of the product; each Recipe holds a default.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Instance count of the service realization.
      compute:
        cpu:
          type: string
          default: 100m
          description: CPU as a Kubernetes quantity, such as 100m or 0.5.
        memory:
          type: string
          default: 128Mi
          description: Memory as a Kubernetes quantity, such as 128Mi or 1Gi.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides; each Recipe documents which keys it reads.

    provides:
      endpoint:
        type: string
        description: The address the product answers requests at; empty where the realization serves none.
