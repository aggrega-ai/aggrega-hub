# A file dictated beneath another file's path.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-file-beneath
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-file-beneath.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        product:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: product@example-project.iam.gserviceaccount.com
