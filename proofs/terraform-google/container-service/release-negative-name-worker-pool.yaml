# A worker pool whose component name Cloud Run cannot take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-worker-pool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-worker-pool.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        worker-named-longer-than-a-cloud-run-worker-pool-takes:
          infra:
            image: europe-west1-docker.pkg.dev/example-project/example/jobs:1.0.0
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: worker-named-longer-than-a-cloud-run-worker-pool-takes@example-project.iam.gserviceaccount.com
