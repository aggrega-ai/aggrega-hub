apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-file-same-directory
  version: "1.0.0"
  description: >
    Two files dictated in one directory.
spec:
  components:
    product:
      type: example/compute/sample-product
      inject:
        file:
          - in: /etc/sample/a.txt
            value: placeholder
          - in: /etc/sample/b.txt
            value: placeholder
