# A service whose component name Cloud Run cannot take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-service.yaml
  manifest: negative
  boundaries:
    google:
      directory: main
      components:
        sample-product-named-longer-than-a-cloud-run-service:
          infra:
            overrides:
              project_id: example-project
              region: europe-west1
              private_network: projects/example-project/global/networks/example-network
              service_account: sample-product-named-longer-than-a-cloud-run-service@example-project.iam.gserviceaccount.com
