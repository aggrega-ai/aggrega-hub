apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary: the gateway is the only resource. The account identifier is
    # a placeholder, 32 zeros, the length of a Cloudflare account identifier.
    cloudflare:
      directory: main
      components:
        chat-gateway:
          infra:
            account_id: "00000000000000000000000000000000"
            gateway_id: example-gateway
            provider_endpoint: openai
