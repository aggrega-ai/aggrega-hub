# infra.overrides.host, which a guardrail has no address for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-guardrails-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-guardrails-only.yaml
  manifest: ./manifest-bedrock-guardrails.yaml
  boundaries:
    aws:
      directory: main
      components:
        support-guardrail:
          infra:
            overrides:
              host: guardrail.example.com
