apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-knowledge-bases-stores
  version: "1.0.0"
  description: >
    One Amazon Bedrock knowledge base for each vector store the Amazon
    Bedrock Knowledge Bases Recipe takes, for the Release that proves each
    store's configuration is written as CloudFormation takes it.
spec:
  components:
    docs-opensearch:
      type: core/datastore/bedrock-knowledge-bases
    docs-opensearch-domain:
      type: core/datastore/bedrock-knowledge-bases
    docs-pinecone:
      type: core/datastore/bedrock-knowledge-bases
    docs-aurora:
      type: core/datastore/bedrock-knowledge-bases
    docs-neptune:
      type: core/datastore/bedrock-knowledge-bases
    docs-s3-vectors:
      type: core/datastore/bedrock-knowledge-bases
    docs-mongodb:
      type: core/datastore/bedrock-knowledge-bases
