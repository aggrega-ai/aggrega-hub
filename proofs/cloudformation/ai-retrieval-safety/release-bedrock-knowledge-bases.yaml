apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bedrock-knowledge-bases
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    # Every key the Amazon Bedrock Knowledge Bases Recipe reads, set: the
    # knowledge base embeds with an Amazon Titan model into a table of an
    # Amazon Aurora PostgreSQL cluster, under the custom metadata column too,
    # and a data source reads the objects under manuals/ in the operator's
    # bucket.
    #
    # The role, the cluster, its table, the secret holding its credentials and
    # the bucket are placeholders for ones the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: RDS
                RdsConfiguration:
                  ResourceArn: arn:aws:rds:us-east-1:123456789012:cluster:example-cluster
                  CredentialsSecretArn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  DatabaseName: example_db
                  TableName: bedrock_integration.bedrock_kb
                  FieldMapping:
                    PrimaryKeyField: id
                    VectorField: embedding
                    TextField: chunks
                    MetadataField: metadata
                    CustomMetadataField: custom_metadata
              BucketARN: arn:aws:s3:::example-product-docs
              InclusionPrefixes:
                - manuals/
