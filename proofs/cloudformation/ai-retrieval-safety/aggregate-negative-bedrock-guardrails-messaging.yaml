apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-messaging
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose message for a blocked response is
    longer than the 500 characters Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here.
        blocked_outputs_messaging: "Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. Withheld. !"
        content_policy_config:
          filters_config:
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
