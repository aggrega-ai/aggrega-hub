apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-retrieval-safety
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so the knowledge base, the agent and the server are
    # parts of one stack. The knowledge base embeds with an Amazon Titan
    # model into an index of an OpenSearch Serverless collection, and names
    # no bucket, so no data source is created: its documents reach the index
    # through a data source connected in Amazon Bedrock. The agent's Recipe
    # declares no resource, and the server's environment carries the
    # knowledge base's ID and ARN as references and the agent runtime
    # endpoint composed from the stack's Region.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the knowledge base's role,
    # the collection and its index, the subnet, the security group, the ECS
    # cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        product-docs:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: OPENSEARCH_SERVERLESS
                OpensearchServerlessConfiguration:
                  CollectionArn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  VectorIndexName: product-docs-index
                  FieldMapping:
                    VectorField: embeddings
                    TextField: AMAZON_BEDROCK_TEXT_CHUNK
                    MetadataField: AMAZON_BEDROCK_METADATA

        support-agent:
          infra:
            endpoint: https://bedrock-agent-runtime.us-east-1.amazonaws.com

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
