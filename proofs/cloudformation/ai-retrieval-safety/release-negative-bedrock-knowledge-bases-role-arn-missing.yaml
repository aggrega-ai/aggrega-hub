# No infra.overrides.RoleArn: the role the knowledge base works as is left
# unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-role-arn-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: OPENSEARCH_SERVERLESS
                OpensearchServerlessConfiguration:
                  CollectionArn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  VectorIndexName: product-docs-index
                  FieldMapping:
                    VectorField: embeddings
                    TextField: AMAZON_BEDROCK_TEXT_CHUNK
                    MetadataField: AMAZON_BEDROCK_METADATA
