apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bedrock-guardrails
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-guardrails-only.yaml
  manifest: ./manifest-bedrock-guardrails.yaml
  boundaries:
    # Every key the Amazon Bedrock Guardrails Recipe reads, set: the guardrail
    # is encrypted with the operator's KMS key, a placeholder for one the
    # operator already has in AWS account 123456789012.
    aws:
      directory: main
      components:
        support-guardrail:
          infra:
            overrides:
              KmsKeyId: arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000000
