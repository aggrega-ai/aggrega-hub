# An Amazon Neptune Analytics store with a bucket, whose data source would
# build the graph with a model no key names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-neptune-bucket
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: NEPTUNE_ANALYTICS
                NeptuneAnalyticsConfiguration:
                  GraphArn: arn:aws:neptune-graph:us-east-1:123456789012:graph/g-0000000000
                  FieldMapping:
                    TextField: text
                    MetadataField: metadata
              BucketARN: arn:aws:s3:::example-product-docs
