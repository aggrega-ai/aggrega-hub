apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-retrieval-safety
  version: "1.0.0"
  description: >
    An Amazon Bedrock knowledge base, an Amazon Bedrock agent consulting it
    and a server on Amazon ECS retrieving from it, so the server's
    environment shows what a consumer of the knowledge base receives.
spec:
  components:
    # The knowledge base the agent and the server retrieve product
    # documentation from, over a vector store the operator already has.
    product-docs:
      type: core/datastore/bedrock-knowledge-bases

    # The agent the server's users talk to, configured in Amazon Bedrock
    # outside the Release, wired to the knowledge base it consults. The
    # agent's Recipe reads nothing of the connection: an agent's knowledge
    # bases are associated with it in Amazon Bedrock, so the connection
    # records the relation and leaves the rendered output as it is without
    # it.
    support-agent:
      type: core/ai-agent/bedrock
      values:
        agent_name: example-support-agent
        instruction: Answer questions about the product from its documentation and hand anything else to a person.
      uses:
        knowledge_base:
          product-docs:
            target: product-docs

    api:
      type: core/compute/server
      uses:
        knowledge:
          product-docs:
            target: product-docs
            inject:
              env:
                - in: KNOWLEDGE_BASE_ID
                  from: knowledge_base_id
                - in: KNOWLEDGE_BASE_ENDPOINT
                  from: endpoint
                - in: KNOWLEDGE_BASE_ARN
                  from: arn
