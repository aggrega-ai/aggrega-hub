apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-retrieval-safety
  version: "1.0.0"
  description: >
    An Amazon Bedrock knowledge base, an Amazon Bedrock agent consulting it,
    an Amazon Bedrock guardrail, and a server on Amazon ECS retrieving from
    the knowledge base and calling models through the guardrail, so the
    server's environment shows what a consumer of each receives.
spec:
  components:
    # The knowledge base the agent and the server retrieve product
    # documentation from, over a vector store the operator already has.
    product-docs:
      type: core/datastore/bedrock-knowledge-bases

    # The agent the server's users talk to, configured in Amazon Bedrock
    # outside the Release, wired to the knowledge base it consults. The
    # agent's Recipe reads nothing of the connection: an agent's knowledge
    # bases are associated with it in Amazon Bedrock, so the connection
    # records the relation and leaves the rendered output as it is without
    # it.
    support-agent:
      type: core/ai-agent/bedrock
      values:
        agent_name: example-support-agent
        instruction: Answer questions about the product from its documentation and hand anything else to a person.
      uses:
        knowledge_base:
          product-docs:
            target: product-docs

    # The guardrail the server names in each model call, so that Amazon
    # Bedrock filters the prompts it sends and the responses it receives.
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        content_policy_config:
          filters_config:
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
            - type: PROMPT_ATTACK
              input_strength: HIGH
              output_strength: NONE
        topic_policy_config:
          topics_config:
            - name: Investment advice
              definition: Recommendations about investing money or choosing financial products.
              type: DENY
        contextual_grounding_policy_config:
          filters_config:
            - type: GROUNDING
              threshold: 0.7
            - type: RELEVANCE
              threshold: 0.5

    api:
      type: core/compute/server
      uses:
        knowledge:
          product-docs:
            target: product-docs
            inject:
              env:
                - in: KNOWLEDGE_BASE_ID
                  from: knowledge_base_id
                - in: KNOWLEDGE_BASE_ENDPOINT
                  from: endpoint
                - in: KNOWLEDGE_BASE_ARN
                  from: arn
        guardrail:
          support-guardrail:
            target: support-guardrail
            inject:
              env:
                - in: GUARDRAIL_ID
                  from: guardrail_id
                - in: GUARDRAIL_VERSION
                  from: guardrail_version
                - in: GUARDRAIL_ARN
                  from: arn
