apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-word-text
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose blocked word is longer than the 100
    characters Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        word_policy_config:
          words_config:
            - text: restricted-phrase-restricted-phrase-restricted-phrase-restricted-phrase-restricted-phrase-restricted-
