apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-regex-lookaround
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose custom pattern holds a lookaround,
    which Amazon Bedrock does not support.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        sensitive_information_policy_config:
          regexes_config:
            - name: Order number
              pattern: (?<=ORD-)[0-9]{8}
              action: ANONYMIZE
