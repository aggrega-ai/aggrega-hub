apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-retrieval-safety
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the Amazon Bedrock knowledge base bound to
    its Recipe, the Amazon Bedrock agent to its reference Recipe and the
    generic server to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/bedrock-knowledge-bases:1.0.0: cloudformation/bedrock-knowledge-bases:1.0.0
        core/ai-agent/bedrock:1.0.0: cloudformation/bedrock-agent:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
