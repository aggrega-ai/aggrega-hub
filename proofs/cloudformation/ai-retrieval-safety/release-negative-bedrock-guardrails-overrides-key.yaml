# infra.overrides.KmsKeyArn, the resource property's own spelling, where
# this Recipe reads KmsKeyId.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-guardrails-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-guardrails-only.yaml
  manifest: ./manifest-bedrock-guardrails.yaml
  boundaries:
    aws:
      directory: main
      components:
        support-guardrail:
          infra:
            overrides:
              KmsKeyArn: arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000000
