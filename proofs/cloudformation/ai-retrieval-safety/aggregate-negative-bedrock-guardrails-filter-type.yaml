apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-filter-type
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose content filter names a category
    Amazon Bedrock does not filter.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        content_policy_config:
          filters_config:
            - type: SELF_HARM
              input_strength: HIGH
              output_strength: HIGH
