# The instance's name holds two underscores in a row, which Amazon Bedrock
# refuses in a knowledge base's name.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-knowledge-bases-name
  version: "1.0.0"
  description: >
    An Amazon Bedrock knowledge base whose instance name Amazon Bedrock
    refuses as a knowledge base's name.
spec:
  components:
    product__docs:
      type: core/datastore/bedrock-knowledge-bases
