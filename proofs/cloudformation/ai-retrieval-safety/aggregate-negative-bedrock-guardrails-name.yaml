apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-name
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose instance name is longer than the 50
    characters Amazon Bedrock takes for a guardrail's name.
spec:
  components:
    support-guardrail-for-the-product-documentation-api:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        content_policy_config:
          filters_config:
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
