apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-examples
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose denied topic gives more sample
    phrases than the five Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        topic_policy_config:
          topics_config:
            - name: Investment advice
              definition: Recommendations about investing money or choosing financial products.
              examples:
                - Example question 1
                - Example question 2
                - Example question 3
                - Example question 4
                - Example question 5
                - Example question 6
              type: DENY
