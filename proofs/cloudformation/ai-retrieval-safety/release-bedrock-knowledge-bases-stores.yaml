apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bedrock-knowledge-bases-stores
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-stores.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    # Each vector store the Recipe takes, one for each knowledge base, with
    # every field the store takes set: an OpenSearch Serverless collection, an
    # OpenSearch Service domain, a Pinecone index, an Amazon Aurora cluster, an
    # Amazon Neptune Analytics graph, an S3 vector index named by its bucket
    # and its name, and a MongoDB Atlas collection. No bucket is named, so no
    # data source is created.
    #
    # Every store, secret and role is a placeholder for one the operator
    # already has in AWS account 123456789012, or with the store's own
    # provider at example.com.
    aws:
      directory: main
      components:
        docs-opensearch:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: OPENSEARCH_SERVERLESS
                OpensearchServerlessConfiguration:
                  CollectionArn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  VectorIndexName: product-docs-index
                  FieldMapping:
                    VectorField: embeddings
                    TextField: AMAZON_BEDROCK_TEXT_CHUNK
                    MetadataField: AMAZON_BEDROCK_METADATA

        docs-opensearch-domain:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: OPENSEARCH_MANAGED_CLUSTER
                OpensearchManagedClusterConfiguration:
                  DomainArn: arn:aws:es:us-east-1:123456789012:domain/example-domain
                  DomainEndpoint: https://search-example-domain.us-east-1.es.amazonaws.com
                  VectorIndexName: product-docs-index
                  FieldMapping:
                    VectorField: embeddings
                    TextField: AMAZON_BEDROCK_TEXT_CHUNK
                    MetadataField: AMAZON_BEDROCK_METADATA

        docs-pinecone:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: PINECONE
                PineconeConfiguration:
                  ConnectionString: https://product-docs.example.com
                  CredentialsSecretArn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  Namespace: product-docs
                  FieldMapping:
                    TextField: text
                    MetadataField: metadata

        docs-aurora:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: RDS
                RdsConfiguration:
                  ResourceArn: arn:aws:rds:us-east-1:123456789012:cluster:example-cluster
                  CredentialsSecretArn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  DatabaseName: example_db
                  TableName: bedrock_integration.bedrock_kb
                  FieldMapping:
                    PrimaryKeyField: id
                    VectorField: embedding
                    TextField: chunks
                    MetadataField: metadata
                    CustomMetadataField: custom_metadata

        docs-neptune:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: NEPTUNE_ANALYTICS
                NeptuneAnalyticsConfiguration:
                  GraphArn: arn:aws:neptune-graph:us-east-1:123456789012:graph/g-0000000000
                  FieldMapping:
                    TextField: text
                    MetadataField: metadata

        docs-s3-vectors:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: S3_VECTORS
                S3VectorsConfiguration:
                  VectorBucketArn: arn:aws:s3vectors:us-east-1:123456789012:bucket/example-vectors
                  IndexName: product-docs-index

        docs-mongodb:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              EmbeddingModelArn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              StorageConfiguration:
                Type: MONGO_DB_ATLAS
                MongoDbAtlasConfiguration:
                  Endpoint: example-cluster.abcde.mongodb.net
                  CredentialsSecretArn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  DatabaseName: example_db
                  CollectionName: product_docs
                  VectorIndexName: vector_index
                  TextIndexName: text_index
                  EndpointServiceName: com.amazonaws.vpce.us-east-1.vpce-svc-00000000000000000
                  FieldMapping:
                    VectorField: embedding
                    TextField: text
                    MetadataField: metadata
