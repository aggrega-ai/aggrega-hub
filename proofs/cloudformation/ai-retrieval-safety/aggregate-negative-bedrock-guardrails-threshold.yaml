apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-threshold
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose grounding check sets a threshold
    above the 0.99 Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        contextual_grounding_policy_config:
          filters_config:
            - type: GROUNDING
              threshold: 1
