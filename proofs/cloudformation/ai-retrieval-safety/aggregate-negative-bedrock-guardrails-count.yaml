apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-count
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose content policy declares more filters
    than the six Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        content_policy_config:
          filters_config:
            - type: SEXUAL
              input_strength: HIGH
              output_strength: HIGH
            - type: VIOLENCE
              input_strength: HIGH
              output_strength: HIGH
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
            - type: INSULTS
              input_strength: HIGH
              output_strength: HIGH
            - type: MISCONDUCT
              input_strength: HIGH
              output_strength: HIGH
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
            - type: SEXUAL
              input_strength: HIGH
              output_strength: HIGH
