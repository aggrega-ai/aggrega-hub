# Every component of the stack is a reference realization, so the assembled
# stack holds no resource, and CloudFormation takes no template without one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-references-only
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-references-only.yaml
  manifest: ./manifest-references-only.yaml
  boundaries:
    aws:
      directory: main
      components:
        assistant-model:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
