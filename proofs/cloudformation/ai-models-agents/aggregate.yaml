apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-models-agents
  version: "1.0.0"
  description: >
    An Amazon Bedrock model, an Amazon Bedrock embedding model, a model
    served from an Amazon SageMaker endpoint, an Amazon Bedrock agent, an
    Amazon Lex bot and a server on Amazon ECS reading what each publishes,
    so the server's environment shows what a consumer of each receives.
spec:
  components:
    # The model the server sends its invocation requests to, served by
    # Amazon Bedrock outside the Release under its model identifier.
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0

    # The embedding model the server sends the text it indexes to, served by
    # Amazon Bedrock outside the Release under its model identifier.
    search-embedding:
      type: core/ai-model/bedrock-embedding
      values:
        model: amazon.titan-embed-text-v2:0

    # The model the server sends its scoring requests to, served from the
    # SageMaker endpoint example-endpoint, which the operator creates outside
    # the Release; the model is invoked by that endpoint's name.
    scoring-model:
      type: core/ai-model/sagemaker
      values:
        model: example-endpoint
        endpoint_name: example-endpoint

    # The agent the server sends its support conversations to, configured
    # in Amazon Bedrock outside the Release.
    support-agent:
      type: core/ai-agent/bedrock
      values:
        agent_name: example-support-agent
        instruction: Answer questions about orders and hand anything else to a person.
        action_groups:
          - order-lookup

    # The bot the server passes its users' messages to, which recognizes a
    # question about an order and a request for a person, and answers
    # anything else with Amazon Lex's fallback intent.
    support-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            intents:
              - name: CheckOrder
                sample_utterances:
                  - utterance: Where is my order
                  - utterance: Check the status of my order
              - name: TalkToPerson
                sample_utterances:
                  - utterance: I want to talk to a person

    api:
      type: core/compute/server
      uses:
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_ID
                  from: model
        embedding:
          search-embedding:
            target: search-embedding
            inject:
              env:
                - in: EMBEDDING_ENDPOINT
                  from: endpoint
                - in: EMBEDDING_MODEL_ID
                  from: model
        scoring:
          scoring-model:
            target: scoring-model
            inject:
              env:
                - in: SCORING_ENDPOINT
                  from: endpoint
                - in: SCORING_MODEL
                  from: model
        agent:
          support-agent:
            target: support-agent
            inject:
              env:
                - in: AGENT_ENDPOINT
                  from: endpoint
                - in: AGENT_NAME
                  from: agent_name
        bot:
          support-bot:
            target: support-bot
            inject:
              env:
                - in: BOT_ID
                  from: agent_id
                - in: BOT_ALIAS_ID
                  from: bot_alias_id
