apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-models-agents
  version: "1.0.0"
  description: >
    An Amazon Bedrock model and a server on Amazon ECS reading the endpoint
    and the model identifier the model publishes, so the server's
    environment shows what a consumer of the model receives.
spec:
  components:
    # The model the server sends its invocation requests to, served by
    # Amazon Bedrock outside the Release under its model identifier.
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0

    api:
      type: core/compute/server
      uses:
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_ID
                  from: model
