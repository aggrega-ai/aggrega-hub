apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-models-agents
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so the models and the server are parts of one stack.
    # Each model's Recipe declares no resource: its endpoint and identifier
    # become Outputs of the stack, and the server's environment carries them
    # as the text the Release and the Aggregate give, while the server's
    # resources give the stack the resource CloudFormation requires of
    # every template.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        assistant-model:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        search-embedding:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        scoring-model:
          infra:
            endpoint: https://runtime.sagemaker.us-east-1.amazonaws.com

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
