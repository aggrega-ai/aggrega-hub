apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-models-agents
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so the models, the agent, the bot and the server are
    # parts of one stack. Each model's and the agent's Recipe declares no
    # resource: the endpoint and the identifier or name each publishes become
    # Outputs of the stack, and the server's environment carries them as the
    # text the Release and the Aggregate give, while the server's resources
    # give the stack the resource CloudFormation requires of every template.
    # The bot's Recipe declares the bot, its version and its alias, and the
    # server's environment carries references to the bot's and the alias's
    # IDs.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the bot's role, the subnet,
    # the security group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        assistant-model:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        search-embedding:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        scoring-model:
          infra:
            endpoint: https://runtime.sagemaker.us-east-1.amazonaws.com

        support-agent:
          infra:
            endpoint: https://bedrock-agent-runtime.us-east-1.amazonaws.com

        support-bot:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-lex-role

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
