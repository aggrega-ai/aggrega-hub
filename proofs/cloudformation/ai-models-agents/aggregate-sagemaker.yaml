apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sagemaker
  version: "1.0.0"
  description: >
    A model served from an Amazon SageMaker endpoint and a server reading
    it, for the Release that proves what the Amazon SageMaker model Recipe
    refuses on its own. The server stands beside the model because
    CloudFormation takes no stack without a resource, and the model's Recipe
    declares none.
spec:
  components:
    scoring-model:
      type: core/ai-model/sagemaker
      values:
        model: example-endpoint
        endpoint_name: example-endpoint

    api:
      type: core/compute/server
      uses:
        scoring:
          scoring-model:
            target: scoring-model
            inject:
              env:
                - in: SCORING_ENDPOINT
                  from: endpoint
                - in: SCORING_MODEL
                  from: model
