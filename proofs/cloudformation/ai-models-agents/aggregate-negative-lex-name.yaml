apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-name
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose component name, which names the bot, is 101
    characters long, longer than the 100 Amazon Lex takes.
spec:
  components:
    order-bot-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
