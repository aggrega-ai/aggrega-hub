apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: sagemaker
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the Amazon SageMaker model bound to its
    reference Recipe and the server reading it to its Amazon ECS Recipe, for
    the Releases that prove what the model's Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/ai-model/sagemaker:1.0.0: cloudformation/sagemaker:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
