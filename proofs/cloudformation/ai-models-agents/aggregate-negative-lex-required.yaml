apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-required
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose locale declares no nlu_confidence_threshold,
    which Amazon Lex requires.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
