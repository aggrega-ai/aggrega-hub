# A message group holding a key besides message.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-lex-message-group-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-lex-message-group-shape.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-lex-role
