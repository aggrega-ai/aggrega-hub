apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: references-only
  version: "1.0.0"
  description: >
    Models Amazon Bedrock and Amazon SageMaker serve, with no component
    whose Recipe declares a resource, for the Release that proves a stack holding only reference
    realizations is refused.
spec:
  components:
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0

    search-embedding:
      type: core/ai-model/bedrock-embedding
      values:
        model: amazon.titan-embed-text-v2:0

    scoring-model:
      type: core/ai-model/sagemaker
      values:
        model: example-endpoint
        endpoint_name: example-endpoint
