apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: references-only
  version: "1.0.0"
  description: >
    Models Amazon Bedrock serves, with no component whose Recipe declares a
    resource, for the Release that proves a stack holding only reference
    realizations is refused.
spec:
  components:
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0
