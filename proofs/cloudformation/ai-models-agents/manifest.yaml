apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-models-agents
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the Amazon Bedrock model, the Amazon Bedrock
    embedding model, the Amazon SageMaker model and the Amazon Bedrock agent
    each bound to its reference Recipe, the Amazon Lex bot to its Recipe and
    the generic server to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-model/bedrock:1.0.0: cloudformation/bedrock:1.0.0
        core/ai-model/bedrock-embedding:1.0.0: cloudformation/bedrock-embedding:1.0.0
        core/ai-model/sagemaker:1.0.0: cloudformation/sagemaker:1.0.0
        core/ai-agent/bedrock:1.0.0: cloudformation/bedrock-agent:1.0.0
        core/ai-agent/lex:1.0.0: cloudformation/lex:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
