apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-models-agents
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the Amazon Bedrock model and embedding model
    each bound to its reference Recipe and the generic server to its Amazon
    ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-model/bedrock:1.0.0: cloudformation/bedrock:1.0.0
        core/ai-model/bedrock-embedding:1.0.0: cloudformation/bedrock-embedding:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
