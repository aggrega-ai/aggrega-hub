apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-message
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose slot's prompt is 1,001 characters long, longer
    than the 1,000 Amazon Lex takes.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            slot_types:
              - name: FlowerTypes
                slot_type_values:
                  - sample_value:
                      value: roses
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
                slots:
                  - name: FlowerType
                    slot_type_name: FlowerTypes
                    value_elicitation_setting:
                      slot_constraint: Required
                      prompt_specification:
                        message_groups_list:
                          - message:
                              plain_text_message:
                                value: 
                        max_retries: 2
