# infra.overrides.RoleArn naming the role by name, not by its ARN.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-lex-role-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-lex-only.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              RoleArn: example-lex-role
