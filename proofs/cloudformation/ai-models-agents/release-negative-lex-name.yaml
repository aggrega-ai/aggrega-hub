# A component name of 101 characters, which names the bot.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-lex-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-lex-name.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-bot-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-lex-role
