apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: lex
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-lex-only.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    # The bot alone: its resources give the stack the resource
    # CloudFormation requires of every template. The role is a placeholder
    # for one the operator already has in AWS account 123456789012.
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-lex-role
