apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-agent
  version: "1.0.0"
  description: >
    An Amazon Bedrock agent and a server reading it, for the Releases that
    prove what the Amazon Bedrock agent Recipe refuses on its own. The
    server stands beside the agent because CloudFormation takes no stack
    without a resource, and the agent's Recipe declares none.
spec:
  components:
    support-agent:
      type: core/ai-agent/bedrock
      values:
        agent_name: example-support-agent
        instruction: Answer questions about orders and hand anything else to a person.

    api:
      type: core/compute/server
      uses:
        agent:
          support-agent:
            target: support-agent
            inject:
              env:
                - in: AGENT_ENDPOINT
                  from: endpoint
                - in: AGENT_NAME
                  from: agent_name
