apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: lex-only
  version: "1.0.0"
  description: >
    An Amazon Lex bot alone, taking orders for flowers in English and in
    Italian, with every key of the bot's locales set, for the Releases that
    prove what the Amazon Lex Recipe writes and refuses on its own.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 600
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            slot_types:
              - name: FlowerTypes
                slot_type_values:
                  - sample_value:
                      value: roses
                  - sample_value:
                      value: lilies
                    synonyms:
                      - value: lily
                      - value: calla
                value_selection_setting:
                  resolution_strategy: TOP_RESOLUTION
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
                  - utterance: I want {FlowerType} for {PickupDate}
                slots:
                  - name: FlowerType
                    slot_type_name: FlowerTypes
                    value_elicitation_setting:
                      slot_constraint: Required
                      prompt_specification:
                        message_groups_list:
                          - message:
                              plain_text_message:
                                value: What type of flowers would you like?
                          - message:
                              plain_text_message:
                                value: Which flowers shall I prepare?
                        max_retries: 2
                  - name: PickupDate
                    slot_type_name: AMAZON.Date
                    value_elicitation_setting:
                      slot_constraint: Required
                      prompt_specification:
                        message_groups_list:
                          - message:
                              plain_text_message:
                                value: What day do you want the {FlowerType} picked up?
                        max_retries: 3
                  - name: Note
                    slot_type_name: AMAZON.FreeFormInput
                    value_elicitation_setting:
                      slot_constraint: Optional
          - locale_id: it_IT
            nlu_confidence_threshold: 0.5
            intents:
              - name: OrdinaFiori
                sample_utterances:
                  - utterance: Vorrei ordinare dei fiori
