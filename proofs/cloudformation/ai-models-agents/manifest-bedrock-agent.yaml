apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: bedrock-agent
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the Amazon Bedrock agent bound to its
    reference Recipe and the server reading it to its Amazon ECS Recipe,
    for the Release that proves what the agent's Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/ai-agent/bedrock:1.0.0: cloudformation/bedrock-agent:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
