apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock
  version: "1.0.0"
  description: >
    An Amazon Bedrock model and a server reading it, for the Releases that
    prove what the Amazon Bedrock model Recipe refuses on its own. The
    server stands beside the model because CloudFormation takes no stack
    without a resource, and the model's Recipe declares none.
spec:
  components:
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0

    api:
      type: core/compute/server
      uses:
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_ID
                  from: model
