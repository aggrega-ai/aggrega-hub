apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-resolution-strategy
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose slot type spells its resolution strategy in
    lower case, which Amazon Lex does not take.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            slot_types:
              - name: FlowerTypes
                slot_type_values:
                  - sample_value:
                      value: roses
                value_selection_setting:
                  resolution_strategy: top_resolution
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
