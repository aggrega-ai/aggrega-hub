apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-slot-type-value
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose slot type holds a value of 141 characters,
    longer than the 140 Amazon Lex takes.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            slot_types:
              - name: FlowerTypes
                slot_type_values:
                  - sample_value:
                      value: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
