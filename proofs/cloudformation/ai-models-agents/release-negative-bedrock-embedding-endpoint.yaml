# No infra.endpoint on the embedding model: the Amazon Bedrock runtime it is
# reached at is left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-embedding-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-embedding.yaml
  manifest: ./manifest-bedrock-embedding.yaml
  boundaries:
    aws:
      directory: main
      components:
        search-embedding: {}

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
