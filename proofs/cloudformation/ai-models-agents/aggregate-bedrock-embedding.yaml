apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-embedding
  version: "1.0.0"
  description: >
    An Amazon Bedrock embedding model and a server reading it, for the
    Releases that prove what the Amazon Bedrock embedding model Recipe
    refuses on its own. The server stands beside the model because
    CloudFormation takes no stack without a resource, and the model's Recipe
    declares none.
spec:
  components:
    search-embedding:
      type: core/ai-model/bedrock-embedding
      values:
        model: amazon.titan-embed-text-v2:0

    api:
      type: core/compute/server
      uses:
        embedding:
          search-embedding:
            target: search-embedding
            inject:
              env:
                - in: EMBEDDING_ENDPOINT
                  from: endpoint
                - in: EMBEDDING_MODEL_ID
                  from: model
