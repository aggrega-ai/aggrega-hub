# values.init_scripts, scripts run when the database is first initialised,
# which an Aurora cluster runs none of.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-init-scripts
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-postgres-init-scripts.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
