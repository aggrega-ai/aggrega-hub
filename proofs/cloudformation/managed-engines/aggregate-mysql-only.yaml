apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql-only
  version: "1.0.0"
  description: >
    A MySQL database on Amazon Aurora alone, for the Releases that halt on a
    setting of the database.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
