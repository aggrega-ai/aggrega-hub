# infra.overrides.MultiAZ, which an RDS instance reads and an Aurora cluster
# takes no setting for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-multi-az
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              MultiAZ: true
