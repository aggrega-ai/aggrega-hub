# infra.engine_version set to an image tag carrying a suffix, which spells no
# Aurora PostgreSQL version.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "16.4-bookworm"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
