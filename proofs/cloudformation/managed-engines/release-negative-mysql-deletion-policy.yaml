# infra.overrides.DeletionPolicy set to a value CloudFormation does not take:
# the policy misspelt.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-deletion-policy
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              DeletionPolicy: Snapshots
