# infra.overrides.host carrying a port, which is infra.port's to give.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-host-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              host: orders-db.example.com:5432
