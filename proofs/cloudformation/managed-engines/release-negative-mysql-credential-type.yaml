# The root_password slot filled by core/random-password, a credential Aurora
# would not read, since it generates the master user's password itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-credential-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql-random-password.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
