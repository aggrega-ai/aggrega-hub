# A core/backup attachment scheduled every six hours, where Aurora takes its
# automated backups in one daily window.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                schedule: "0 */6 * * *"
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
