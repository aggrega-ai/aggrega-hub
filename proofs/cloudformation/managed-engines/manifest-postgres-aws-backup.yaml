apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-aws-backup
  version: "1.0.0"
  description: >
    AWS through CloudFormation: PostgreSQL bound to the Aurora cluster,
    core/generated-secret to the FeatureRecipe that leaves the master
    password to Aurora, and core/backup to AWS Backup.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-aurora:1.0.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
        core/backup:1.0.0: cloudformation/backup-aws-backup:1.0.0
