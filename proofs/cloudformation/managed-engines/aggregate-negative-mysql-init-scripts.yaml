apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mysql-init-scripts
  version: "1.0.0"
  description: >
    A MySQL database on Amazon Aurora whose Aggregate sets
    values.init_scripts, for the Release that halts on it.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        init_scripts:
          01-schema.sql: "CREATE TABLE items (id bigint PRIMARY KEY);"
