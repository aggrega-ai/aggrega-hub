# infra.overrides.DBParameterGroupName, the DB parameter group an RDS instance
# reads, which this Recipe names for no instance.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-parameter-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              DBParameterGroupName: example-postgres17
