apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-random-password
  version: "1.0.0"
  description: >
    AWS through CloudFormation: PostgreSQL bound to the Aurora cluster, and
    core/random-password to the FeatureRecipe that creates a secret in the
    stack.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-aurora:1.0.0
    features:
      type:
        core/random-password:1.0.0: cloudformation/random-password:1.0.0
