# infra.engine_version spelt as an RDS for MySQL instance takes it, which
# names no Aurora MySQL version.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.4.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
