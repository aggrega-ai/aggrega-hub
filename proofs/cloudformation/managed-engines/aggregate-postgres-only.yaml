apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-only
  version: "1.0.0"
  description: >
    A PostgreSQL database on Amazon Aurora alone, for the Releases that halt
    on a setting of the database.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
