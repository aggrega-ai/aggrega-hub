# A core/backup attachment asking AWS Backup, through infra.role_arn, to back
# up the Aurora cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-aws-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres-aws-backup.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                role_arn: arn:aws:iam::123456789012:role/example-backup-role
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
