# A core/backup attachment keeping each backup for 36 days, one more than
# Aurora keeps automated backups for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 36
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
