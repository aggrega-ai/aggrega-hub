apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    AWS through CloudFormation: PostgreSQL bound to the Aurora cluster,
    core/generated-secret to the FeatureRecipe that leaves the master
    password to Aurora, core/backup to the cluster's own automated backups,
    and the generic server bound to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-aurora:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
        core/backup:1.0.0: cloudformation/backup-native:1.0.0
