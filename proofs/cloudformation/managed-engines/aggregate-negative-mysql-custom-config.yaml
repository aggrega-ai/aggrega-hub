apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mysql-custom-config
  version: "1.0.0"
  description: >
    A MySQL database on Amazon Aurora whose Aggregate sets
    values.custom_config, for the Release that halts on it.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        custom_config: "max_connections = 200"
