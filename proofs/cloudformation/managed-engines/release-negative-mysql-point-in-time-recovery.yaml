# A core/backup attachment setting infra.point_in_time_recovery to false,
# which Aurora keeps with no setting that turns it off.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-point-in-time-recovery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                point_in_time_recovery: false
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
