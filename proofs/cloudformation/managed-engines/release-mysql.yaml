apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    # One directory, so the server is a resource of the cluster's stack and its
    # CATALOG_DB_HOST carries the reference to the cluster's endpoint, which
    # CloudFormation resolves when it creates the stack. The cluster runs an
    # Aurora MySQL version in Aurora's own spelling, a reader beside its
    # writer, keeps its automated backups 14 days in a window opening at 02:30
    # UTC, and encrypts its storage with the operator's key.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the DB subnet group, the
    # security groups, the KMS key, the ECS cluster, the subnets and the
    # execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
                schedule: "30 2 * * *"
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            ha:
              enabled: true
            overrides:
              DBInstanceClass: db.r6g.large
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              StorageEncrypted: true
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000

        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
