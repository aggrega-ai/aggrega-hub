# infra.overrides.DBParameterGroupName, the DB parameter group an RDS instance
# reads, which this Recipe names for no instance.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-parameter-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              DBParameterGroupName: example-mysql84
