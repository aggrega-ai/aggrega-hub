# Two core/backup attachments, each leaving the backup to Aurora, which runs
# one automated backup on a cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-two-backups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
            backup_daily:
              type: core/backup
          infra:
            engine_version: "17.5"
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
