apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    # The operator names the cluster in infra.overrides.host, so the server's
    # CATALOG_DB_HOST carries that name in place of the reference to the
    # cluster's endpoint. A name references nothing CloudFormation could order
    # the server after, so the server sits in a later wave of the same stack,
    # and each of its resources waits on the whole first wave. The cluster
    # runs Aurora MySQL 8.4.7, keeps its automated backups for Aurora's 7
    # days with no core/backup attached, runs two readers on Aurora
    # I/O-Optimized storage, takes its settings from the operator's cluster
    # parameter group, and is retained when the stack deletes or replaces it.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the DB subnet group, the
    # security groups, the cluster parameter group, the ECS cluster, the
    # subnets and the execution role; example.com stands for the operator's
    # own domain.
    aws:
      directory: main
      syncWave: 0
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.4.mysql_aurora.8.4.7"
            storage:
              type: aurora-iopt1
            ha:
              read_replicas: 2
            overrides:
              DeletionPolicy: Retain
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              DBClusterParameterGroupName: example-aurora-mysql84
              host: catalog-db.example.com

    aws-late:
      directory: main
      syncWave: 1
      components:
        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
