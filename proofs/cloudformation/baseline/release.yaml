apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One directory, so every Component is a resource of one stack and a
    # reference a datastore publishes resolves inside it. The network, cluster,
    # roles and log groups are placeholders for ones the operator already has in
    # AWS account 123456789012.
    aws:
      directory: main
      syncWave: 0
      components:
        db-postgres:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000

        db-mysql:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.4.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000

        db-mariadb:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "11.4.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000

        cache-redis:
          infra:
            engine_version: "7.1"
            client_tls: true
            overrides:
              CacheSubnetGroupName: example-private-cache-subnets

        cache-valkey:
          infra:
            engine_version: "8.1"
            overrides:
              CacheSubnetGroupName: example-private-cache-subnets

        cache-memcached:
          infra:
            engine_version: "1.6.22"
            overrides:
              CacheSubnetGroupName: example-private-cache-subnets

        search:
          infra:
            engine_version: "2.19"
            storage:
              size: 20Gi
              type: gp3
            overrides:
              SubnetIds:
                - subnet-00000000000000000

        queue:
          infra:
            engine_version: "3.13"
            overrides:
              SubnetIds:
                - subnet-00000000000000000

        objects:
          infra:
            region: eu-west-1

        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role

        jobs:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-jobs:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role

        nightly:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-nightly:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              RoleArn: arn:aws:iam::123456789012:role/example-scheduler-role
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role

        handler:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-handler:1.0.0
            overrides:
              Role: arn:aws:iam::123456789012:role/example-lambda-role
              LogGroup: /aws/lambda/example-handler

    # The database-consuming application reads the database's host through a
    # GetAtt, and sits in a later wave of the same stack, so each of its
    # resources waits on the whole first wave as well.
    aws-late:
      directory: main
      syncWave: 1
      components:
        reader: {}
