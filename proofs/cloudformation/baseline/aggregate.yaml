apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    The Components the catalog realizes on AWS through CloudFormation: a
    PostgreSQL, a MySQL and a MariaDB database, a Redis, a Valkey and a
    Memcached cache, a search engine, a RabbitMQ broker, an S3 bucket, a
    server, a worker, a scheduled task, a function and a database-consuming
    application. Each compute Component uses datastores and the object store,
    so every connection value a datastore publishes reaches a compute
    Component's environment, and the database-consuming application takes a
    database host through its own socket.
spec:
  components:
    db-postgres:
      type: core/datastore/postgres
      values:
        database: appdb
        user: app_admin

    db-mysql:
      type: core/datastore/mysql
      values:
        database: appdb

    db-mariadb:
      type: core/datastore/mariadb
      values:
        database: appdb

    cache-redis:
      type: core/datastore/redis
      # ElastiCache takes an AUTH token only with TLS on, and the secret's
      # punctuation includes characters a token may not hold.
      features:
        password:
          type: core/random-password
          values:
            length: 32
            symbols: false

    cache-valkey:
      type: core/datastore/valkey

    cache-memcached:
      type: core/datastore/memcached

    search:
      type: core/datastore/opensearch
      # The domain's master password holds every character class.
      features:
        password:
          type: core/random-password
          values:
            length: 32
            symbols: true

    queue:
      type: core/messaging/rabbitmq
      # Amazon MQ refuses a comma, a colon and an equals sign in a password.
      features:
        password:
          type: core/random-password
          values:
            length: 24
            symbols: false

    objects:
      type: core/storage/s3-object-store
      values:
        bucket: example-objects

    api:
      type: core/compute/server
      uses:
        sessions:
          cache-redis:
            target: cache-redis
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        search:
          search:
            target: search
            inject:
              env:
                - in: SEARCH_ENDPOINT
                  from: endpoint
                - in: SEARCH_USER
                  from: user
        db:
          db-postgres:
            target: db-postgres
            inject:
              env:
                - in: DB_HOST
                  from: host
                - in: DB_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        sessions:
          cache-valkey:
            target: cache-valkey
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        queue:
          queue:
            target: queue
            inject:
              env:
                - in: QUEUE_HOST
                  from: host
                - in: QUEUE_PORT
                  from: port
        db:
          db-mysql:
            target: db-mysql
            inject:
              env:
                - in: DB_HOST
                  from: host
                - in: DB_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    nightly:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"
      uses:
        fragments:
          cache-memcached:
            target: cache-memcached
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port
        db:
          db-mariadb:
            target: db-mariadb
            inject:
              env:
                - in: DB_HOST
                  from: host
                - in: DB_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    handler:
      type: core/compute/function
      values:
        runtime: python3.12
      uses:
        fragments:
          cache-memcached:
            target: cache-memcached
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    reader:
      type: example/compute/db-reader
      uses:
        database:
          db-postgres:
            target: db-postgres
            inject:
              env:
                - in: DB_HOST
                  from: host
