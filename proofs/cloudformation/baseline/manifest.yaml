apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS through CloudFormation: each Component type bound to the newest version
    of the catalog's Recipe realizing it there, core/random-password to the
    FeatureRecipe that creates the secret in the stack, and
    core/generated-secret to the one that leaves a database's master password
    to RDS. Each component of the Aggregate has a type of its own, so the type
    tier binds them all.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
        core/datastore/mysql:1.0.0: cloudformation/mysql-rds:1.0.0
        core/datastore/mariadb:1.0.0: cloudformation/mariadb-rds:1.0.0
        core/datastore/redis:1.0.0: cloudformation/redis-elasticache:1.0.0
        core/datastore/valkey:1.0.0: cloudformation/valkey-elasticache:1.0.0
        core/datastore/memcached:1.0.0: cloudformation/memcached-elasticache:1.0.0
        core/datastore/opensearch:1.0.0: cloudformation/opensearch-service:1.0.0
        core/messaging/rabbitmq:1.0.0: cloudformation/rabbitmq-amazon-mq:1.0.0
        core/storage/s3-object-store:1.0.0: cloudformation/s3-object-store-amazon-s3:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.1.0
        core/compute/worker:1.0.0: cloudformation/worker-ecs:1.0.0
        core/compute/task:1.0.1: cloudformation/task-ecs:1.0.1
        core/compute/function:1.0.0: cloudformation/function-lambda:1.0.0
        example/compute/db-reader:1.0.0: cloudformation/db-reader:1.0.0
    features:
      type:
        core/random-password:1.0.0: cloudformation/random-password:1.0.0
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
