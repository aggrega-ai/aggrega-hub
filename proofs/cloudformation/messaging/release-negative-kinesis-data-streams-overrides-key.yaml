apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: infra.overrides.KmsKyeId is a key this Recipe does not read, a
    # misspelling of KmsKeyId.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              KmsKyeId: alias/example-stream-key
