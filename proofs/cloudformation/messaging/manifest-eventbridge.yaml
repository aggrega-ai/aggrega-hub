apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: eventbridge
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the event bus bound to its Amazon EventBridge
    Recipe, and the generic server bound to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/messaging/eventbridge:1.0.0: cloudformation/eventbridge:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
