apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-shard-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: a provisioned stream of 100001 shards, one above the largest
    # number the resource type takes.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              StreamMode: PROVISIONED
              ShardCount: 100001
