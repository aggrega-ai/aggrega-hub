# This fixture is a workspace of its own. Its catalog is this repository's
# aggrega-catalog/, so every entity it builds is the one the catalog holds
# beside it; the hub registry supplies anything that catalog does not carry.
workspace:
  catalog_dirs:
    - ../../../aggrega-catalog
default_registry: hub.aggrega.ai
