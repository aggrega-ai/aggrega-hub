apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-eventbridge-name-default
  version: "1.0.0"
  description: >
    One fault: the component default names its Amazon EventBridge event bus,
    the name of the event bus every AWS account already holds.
spec:
  components:
    default:
      type: core/messaging/eventbridge
