apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-destination
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: HttpEndpointDestinationConfiguration sets an HTTP endpoint as the
    # destination, which this Recipe's stream does not take.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role
              HttpEndpointDestinationConfiguration:
                EndpointConfiguration:
                  Url: https://example.com/ingest
