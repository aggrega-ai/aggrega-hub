apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: infra.overrides.host names a host for a data stream, which
    # Kinesis Data Streams publishes no address of.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              host: stream.example.com
