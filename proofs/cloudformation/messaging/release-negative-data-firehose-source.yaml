apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-source
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: KinesisStreamSourceConfiguration sets a Kinesis data
    # stream as the source, which this Recipe's stream does not take.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role
              KinesisStreamSourceConfiguration:
                KinesisStreamARN: arn:aws:kinesis:eu-west-1:123456789012:stream/example-stream
                RoleARN: arn:aws:iam::123456789012:role/example-firehose-source-role
