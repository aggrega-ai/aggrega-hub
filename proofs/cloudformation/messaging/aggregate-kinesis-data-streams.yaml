apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: kinesis-data-streams
  version: "1.0.0"
  description: >
    An Amazon Kinesis data stream of page views, keeping its records for seven
    days, and a server on Amazon ECS reading its ARN, so the server's
    environment shows what a producer to the stream receives.
spec:
  components:
    page-views:
      type: core/messaging/kinesis-data-streams
      values:
        retention_period_hours: 168

    analytics:
      type: core/compute/server
      uses:
        events:
          page-views:
            target: page-views
            inject:
              env:
                - in: PAGE_VIEWS_STREAM_ARN
                  from: arn
