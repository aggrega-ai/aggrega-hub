apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-eventbridge-name-length
  version: "1.0.0"
  description: >
    One fault: the component's name, 257 letters long, names its Amazon
    EventBridge event bus, and EventBridge takes an event bus name of 256
    characters at most.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/eventbridge
