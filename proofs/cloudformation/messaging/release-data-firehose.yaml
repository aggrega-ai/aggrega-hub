apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-firehose
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One directory, so the server is a resource of the stream's stack and its
    # CLICK_EVENTS_STREAM_NAME and CLICK_EVENTS_STREAM_ARN carry references to
    # the stream's name and ARN, which CloudFormation resolves when it creates
    # the stack.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the S3 bucket, the role
    # Firehose delivers under, the ECS cluster, the subnet, the security group
    # and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        click-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role

        analytics:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-analytics:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
