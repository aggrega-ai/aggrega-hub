apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sns-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sns-only.yaml
  manifest: ./manifest-sns.yaml
  boundaries:
    # One fault: infra.overrides.host names a host for a topic, which SNS
    # publishes no address of.
    aws:
      directory: main
      components:
        alerts:
          infra:
            overrides:
              host: topic.example.com
