apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sns-name-length-fifo
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-sns-name-length-fifo.yaml
  manifest: ./manifest-sns.yaml
  boundaries:
    # One fault, in the Aggregate: the component's name, 252 letters long, names
    # the FIFO topic, whose .fifo suffix brings it to 257 characters, and SNS
    # takes 256 at most.
    aws:
      directory: main
      components:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
          infra: {}
