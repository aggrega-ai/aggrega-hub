apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-direct-put-source-configuration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: DirectPutSourceConfiguration sets a throughput hint, which no key of
    # this Recipe sets.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role
              DirectPutSourceConfiguration:
                ThroughputHintInMBs: 10
