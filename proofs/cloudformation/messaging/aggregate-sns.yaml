apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sns
  version: "1.0.0"
  description: >
    An Amazon SNS FIFO topic of order updates, deduplicated by message body,
    and a server on Amazon ECS reading its ARN, so the server's environment
    shows what a publisher to the topic receives.
spec:
  components:
    order-updates:
      type: core/messaging/sns
      values:
        fifo_topic: true
        content_based_deduplication: true

    order-notifier:
      type: core/compute/server
      uses:
        notifications:
          order-updates:
            target: order-updates
            inject:
              env:
                - in: ORDER_UPDATES_TOPIC_ARN
                  from: arn
