apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-eventbridge-name-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-eventbridge-name-length.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One fault, in the Aggregate: the component's name, 257 letters long,
    # names the bus, and EventBridge takes 256 characters at most.
    aws:
      directory: main
      components:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
          infra: {}
