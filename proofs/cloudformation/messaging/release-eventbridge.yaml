apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: eventbridge
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-eventbridge.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One directory, so the server is a resource of the bus's stack and its
    # COMMERCE_EVENTS_BUS_ARN carries a reference to the bus's ARN, which
    # CloudFormation resolves when it creates the stack. The bus's events are
    # encrypted with the operator's key.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the KMS key, the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        commerce-events:
          infra:
            overrides:
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000

        checkout:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-checkout:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
