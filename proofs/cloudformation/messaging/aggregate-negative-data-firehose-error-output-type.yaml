apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-data-firehose-error-output-type
  version: "1.0.0"
  description: >
    One fault: the error prefix holds an expression but not
    !{firehose:error-output-type}, which Amazon Data Firehose requires of it.
spec:
  components:
    audit-events:
      type: core/messaging/data-firehose
      values:
        error_output_prefix: "audit-errors/!{timestamp:yyyy}/"
