apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sqs-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One fault: infra.overrides.KmsKyeId is a key this Recipe does not read, a
    # misspelling of KmsKeyId.
    aws:
      directory: main
      components:
        email-jobs:
          infra:
            overrides:
              KmsKyeId: alias/example-queue-key
