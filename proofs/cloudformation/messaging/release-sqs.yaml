apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sqs
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One directory, so the server is a resource of the queue's stack and its
    # ORDER_EVENTS_QUEUE_URL and ORDER_EVENTS_QUEUE_ARN carry references to the
    # queue's attributes, which CloudFormation resolves when it creates the
    # stack. The queue is encrypted with the operator's key.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the KMS key, the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        order-events:
          infra:
            overrides:
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000

        order-worker:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-order-worker:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
