apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-error-output-prefix-expression
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-data-firehose-error-output-prefix-expression.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault, in the Aggregate: the error prefix holds a partitionKeyFromQuery
    # expression.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role
