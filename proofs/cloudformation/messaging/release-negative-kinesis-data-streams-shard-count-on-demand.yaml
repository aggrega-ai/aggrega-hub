apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-shard-count-on-demand
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: a number of shards named for a stream whose capacity mode is
    # left at ON_DEMAND, which takes none.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              ShardCount: 2
