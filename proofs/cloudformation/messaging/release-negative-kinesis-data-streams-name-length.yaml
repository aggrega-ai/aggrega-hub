apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-name-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-kinesis-data-streams-name-length.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault, in the Aggregate: the component's name, 129 letters long,
    # names the stream, and Kinesis Data Streams takes 128 characters at most.
    aws:
      directory: main
      components:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
          infra: {}
