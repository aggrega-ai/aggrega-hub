apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-extended-s3-destination-configuration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: ExtendedS3DestinationConfiguration is the property this Recipe writes
    # itself, from BucketARN and RoleArn.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              BucketARN: arn:aws:s3:::example-firehose-bucket
              RoleArn: arn:aws:iam::123456789012:role/example-firehose-role
              ExtendedS3DestinationConfiguration:
                BucketARN: arn:aws:s3:::example-firehose-bucket
                RoleARN: arn:aws:iam::123456789012:role/example-firehose-role
