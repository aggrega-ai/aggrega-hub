apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: kinesis-data-streams-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # No override: an on-demand stream keeping its records for 24 hours, with
    # no server-side encryption.
    aws:
      directory: main
      components:
        audit-records:
          infra: {}
