apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sns-content-based-deduplication
  version: "1.0.0"
  description: >
    One fault: deduplication by message body asked of a standard topic,
    where Amazon SNS offers it on a FIFO topic alone.
spec:
  components:
    alerts:
      type: core/messaging/sns
      values:
        content_based_deduplication: true
