apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sqs-alias-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # The operator's KMS key named by an alias, a form SQS takes beside a key
    # ID and an ARN.
    aws:
      directory: main
      components:
        email-jobs:
          infra:
            overrides:
              KmsKeyId: alias/example-queue-key
