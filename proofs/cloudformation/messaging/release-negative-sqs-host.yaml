apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sqs-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One fault: infra.overrides.host names a host for a queue, which SQS
    # publishes no address of.
    aws:
      directory: main
      components:
        email-jobs:
          infra:
            overrides:
              host: queue.example.com
