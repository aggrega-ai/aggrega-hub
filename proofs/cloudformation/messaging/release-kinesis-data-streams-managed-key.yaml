apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: kinesis-data-streams-managed-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # The on-demand mode named explicitly, and the stream's records encrypted
    # under the key AWS manages for Kinesis Data Streams, named by its alias.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              StreamMode: ON_DEMAND
              KmsKeyId: alias/aws/kinesis
