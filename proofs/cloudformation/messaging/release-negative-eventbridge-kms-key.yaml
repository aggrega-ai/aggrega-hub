apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-eventbridge-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-eventbridge-only.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One fault: the KMS key named by a bare name, which is neither a key ID, an
    # alias name beginning alias/, nor an ARN.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              KmsKeyId: example-bus-key
