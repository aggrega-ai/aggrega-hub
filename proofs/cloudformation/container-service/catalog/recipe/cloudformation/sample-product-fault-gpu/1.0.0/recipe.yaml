apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-gpu
  version: 1.0.0
  description: >
    A product Recipe declaring a GPU. It is reached only by the negative
    Release release-negative-fault-gpu.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: example/compute/sample-product:1.0.0
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'
    gpu: '{"count": 1, "type": "nvidia-l4"}'
  provides:
    endpoint: ""
  artifacts:
    service:
      $import: EcsFargateFragment#/artifacts/Service
