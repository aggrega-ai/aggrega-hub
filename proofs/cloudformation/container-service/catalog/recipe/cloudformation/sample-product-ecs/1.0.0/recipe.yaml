apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-ecs
  version: 1.0.0
  description: >
    The placeholder product as one Amazon ECS service on Fargate, written as
    a product Recipe on the shared Amazon ECS fragments for CloudFormation:
    the Service fragment from EcsFargateFragment, rendered in this Recipe's
    context, and the locals that fragment reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: example/compute/sample-product:1.0.0

  # What the product fixes, read by EcsFargateFragment#/artifacts/Service: its
  # image while infra.image is unset, the port it listens on, and the
  # variables its own values and its database connection reach it as. Amazon
  # ECS on Fargate runs no probe this realization declares and gives no GPU,
  # so neither is declared.
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'

  # The service is reached through the operator's load balancer, whose
  # address this Recipe does not know, so it publishes none.
  provides:
    endpoint: ""

  artifacts:
    service:
      $import: EcsFargateFragment#/artifacts/Service
