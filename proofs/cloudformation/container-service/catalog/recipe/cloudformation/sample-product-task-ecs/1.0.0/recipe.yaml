apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-task-ecs
  version: 1.0.0
  description: >
    The placeholder product as one Amazon ECS task on Fargate, started on
    values.schedule by EventBridge Scheduler, written as a product Recipe on
    the shared Amazon ECS fragments for CloudFormation: the Task fragment
    from EcsFargateFragment, rendered in this Recipe's context, and the
    locals that fragment reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: example/compute/sample-product:1.0.0

  # What the product fixes, read by EcsFargateFragment#/artifacts/Task: its
  # image while infra.image is unset and the variables its own values and its
  # database connection reach it as. A run serves no requests, so no port is
  # declared.
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'

  # A run serves no requests, so it publishes no address.
  provides:
    endpoint: ""

  artifacts:
    service:
      $import: EcsFargateFragment#/artifacts/Task
