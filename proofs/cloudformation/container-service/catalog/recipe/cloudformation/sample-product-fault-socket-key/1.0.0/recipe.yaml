apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-socket-key
  version: 1.0.0
  description: >
    A product Recipe delivering a key its socket's target does not publish. It
    is reached only by the negative Release release-negative-fault-socket-
    key.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: example/compute/sample-product:1.0.0
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_PASSWORD": "password"}}'
  provides:
    endpoint: ""
  artifacts:
    service:
      $import: EcsFargateFragment#/artifacts/Service
