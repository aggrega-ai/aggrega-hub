apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-schedule-time-zone
  version: "1.0.0"
  description: >
    A schedule naming its time zone inside the expression.
spec:
  components:
    digest:
      type: example/compute/sample-product
      values:
        schedule: "CRON_TZ=Europe/Rome 30 2 * * *"
