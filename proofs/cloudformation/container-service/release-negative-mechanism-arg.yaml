# A connection dictating a command-line argument.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mechanism-arg
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-mechanism-arg.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        peer:
          infra:
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
        product:
          infra:
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
