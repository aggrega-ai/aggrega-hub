# A component whose name gives a logical ID longer than a CloudFormation template takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-logical-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-logical-id.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        sample-product-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
          infra:
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
