apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative
  version: "1.0.0"
  description: >
    The type bindings of this fixture's Manifest and no name binding, for the
    negative Releases whose Aggregates hold components of their own; a negative
    Manifest extending it binds what one of them changes.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
        example/compute/sample-product:1.0.0: cloudformation/sample-product-ecs:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
        core/compute/worker:1.0.0: cloudformation/worker-ecs:1.1.0
        core/compute/task:1.0.1: cloudformation/task-ecs:1.1.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
        core/manual-trigger:1.0.0: cloudformation/manual-trigger:1.0.0
