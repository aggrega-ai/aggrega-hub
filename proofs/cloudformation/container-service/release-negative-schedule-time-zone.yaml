# A schedule naming its time zone inside the expression.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-schedule-time-zone
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-schedule-time-zone.yaml
  manifest: ./manifest-negative-task.yaml
  boundaries:
    aws:
      directory: main
      components:
        digest:
          infra:
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              RoleArn: arn:aws:iam::123456789012:role/example-scheduler-role
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
