apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-collision
  version: "1.0.0"
  description: >
    A component's own inject block dictating a name its connection is delivered under by default.
spec:
  components:
    db-postgres:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      inject:
        env:
          - in: SAMPLE_DB_HOST
            value: db.example.com
      uses:
        database:
          orders:
            target: db-postgres
