apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-schedule-day
  version: "1.0.0"
  description: >
    A schedule naming a day of the week outside 0 to 6.
spec:
  components:
    digest:
      type: example/compute/sample-product
      values:
        schedule: "30 2 * * 7"
