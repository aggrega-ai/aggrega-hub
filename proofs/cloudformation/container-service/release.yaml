apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: container-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # Two stacks. The services sit in the database's stack, so each
    # reference the database publishes reaches them as an Fn::GetAtt inside
    # it, whether a connection's inject block dictates it or the product's
    # Recipe delivers it by default; the tasks sit in a stack of their own,
    # so it reaches them as an Fn::ImportValue of the export the database's
    # stack publishes, either way alike.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the cluster, subnets, security
    # groups, roles, log groups, load balancer target groups, DB subnet group
    # and images.
    aws:
      directory: main
      components:
        db-postgres:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
        # The product runs the image its Recipe holds, so infra.image is left
        # unset; it registers its port with the operator's target group and
        # writes its output to the operator's log group.
        product:
          infra:
            replicas: 2
            compute:
              cpu: "1"
              memory: 3Gi
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
                - subnet-00000000000000001
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              TaskRoleArn: arn:aws:iam::123456789012:role/example-product-task-role
              TargetGroupArn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-product/0000000000000000
              awslogs-group: /example/product
        # The server registers its port, infra.port, with the operator's target
        # group and writes its output to the operator's log group.
        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            replicas: 2
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              TargetGroupArn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-api/0000000000000001
              awslogs-group: /example/api
        jobs:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-jobs:1.0.0
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              TaskRoleArn: arn:aws:iam::123456789012:role/example-jobs-task-role
    aws-tasks:
      directory: tasks
      components:
        digest:
          infra:
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              RoleArn: arn:aws:iam::123456789012:role/example-scheduler-role
              ScheduleExpressionTimezone: Europe/Rome
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              AssignPublicIp: ENABLED
        nightly:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-nightly:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              RoleArn: arn:aws:iam::123456789012:role/example-scheduler-role
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              awslogs-group: /example/nightly
        # The backfill task renders no schedule, so it names no scheduler role;
        # the cluster and network are what the operator starts each run with.
        backfill:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-backfill:1.0.0
            compute:
              cpu: "2"
              memory: 4Gi
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              AssignPublicIp: ENABLED
