apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    Containers on Amazon ECS through the shared Amazon ECS fragments for
    CloudFormation, beside the PostgreSQL database they use: the placeholder
    product as a service and as a scheduled task, each delivered its database
    by its Recipe's default names, and the generic server, worker and tasks,
    each handed its database as its connection's inject block dictates.
spec:
  components:
    db-postgres:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    # The product's database connection dictates nothing, so the Recipe
    # delivers it under its own default names, and its greeting reaches it as
    # a variable its own inject block names rather than as SAMPLE_GREETING.
    product:
      type: example/compute/sample-product
      values:
        greeting: hello from the fixture
        workers: 3
      inject:
        env:
          - in: PRODUCT_GREETING
            value: '{{"{{"}} .values.greeting }}'
      uses:
        database:
          orders:
            target: db-postgres

    # The schedule restricts the day of the week, which becomes the
    # scheduler's own list of days.
    digest:
      type: example/compute/sample-product
      values:
        workers: 1
        schedule: "30 2 * * mon-fri"
      uses:
        database:
          orders:
            target: db-postgres

    # The server is handed its database under the names its connection
    # dictates.
    api:
      type: core/compute/server
      uses:
        database:
          orders:
            target: db-postgres
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port

    # The worker's concurrency reaches it as WORKER_CONCURRENCY, its default
    # name, beside what its connection dictates.
    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        database:
          orders:
            target: db-postgres
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host

    # The nightly task's timeout reaches it as TASK_TIMEOUT, its default name,
    # and its schedule is a descriptor the scheduler's expression spells out.
    nightly:
      type: core/compute/task
      values:
        schedule: "@daily"
        timeout: 15m
      uses:
        database:
          orders:
            target: db-postgres
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host

    # The backfill task has no schedule: core/manual-trigger deploys its task
    # definition alone, for the operator to start each run.
    backfill:
      type: core/compute/task
      features:
        manual:
          type: core/manual-trigger
      uses:
        database:
          orders:
            target: db-postgres
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
