# A component's own inject block dictating a name its connection is delivered under by default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-socket-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-socket-collision.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        db-postgres:
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
        product:
          infra:
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
