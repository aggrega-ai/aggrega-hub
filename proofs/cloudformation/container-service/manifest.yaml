apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the generic server, worker and task bound to
    their Amazon ECS Recipes, with core/manual-trigger to its FeatureRecipe;
    the placeholder product to its service Recipe, and the digest component
    of the same type, by name, to its task Recipe; PostgreSQL to Amazon RDS,
    with core/generated-secret to the FeatureRecipe that leaves its master
    password to RDS.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
        example/compute/sample-product:1.0.0: cloudformation/sample-product-ecs:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
        core/compute/worker:1.0.0: cloudformation/worker-ecs:1.1.0
        core/compute/task:1.0.1: cloudformation/task-ecs:1.1.0
      name:
        digest: cloudformation/sample-product-task-ecs:1.0.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
        core/manual-trigger:1.0.0: cloudformation/manual-trigger:1.0.0
