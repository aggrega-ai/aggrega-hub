apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the placeholder product to its service
    Recipe, and the digest component of the same type, by name, to its task
    Recipe; PostgreSQL to Amazon RDS, with core/generated-secret to the
    FeatureRecipe that leaves its master password to RDS.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
        example/compute/sample-product:1.0.0: cloudformation/sample-product-ecs:1.0.0
      name:
        digest: cloudformation/sample-product-task-ecs:1.0.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
