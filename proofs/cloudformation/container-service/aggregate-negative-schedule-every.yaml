apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-schedule-every
  version: "1.0.0"
  description: >
    A schedule repeating at an interval.
spec:
  components:
    digest:
      type: example/compute/sample-product
      values:
        schedule: "@every 1h"
