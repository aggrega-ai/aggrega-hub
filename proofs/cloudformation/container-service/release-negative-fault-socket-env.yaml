# A product Recipe declaring a socket table that maps a socket to a name rather than to a table.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-fault-socket-env
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: ./manifest-negative-fault-socket-env.yaml
  boundaries:
    aws:
      directory: main
      components:
        product:
          infra:
            overrides:
              Cluster: example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
