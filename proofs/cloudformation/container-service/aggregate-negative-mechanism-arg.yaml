apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mechanism-arg
  version: "1.0.0"
  description: >
    A connection dictating a command-line argument.
spec:
  components:
    peer:
      type: example/compute/sample-product
    product:
      type: example/compute/sample-product
      uses:
        peers:
          peer:
            target: peer
            inject:
              arg:
                - in: --peer
                  from: endpoint
