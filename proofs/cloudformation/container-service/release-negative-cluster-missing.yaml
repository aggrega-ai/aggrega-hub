# A service naming no cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cluster-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    aws:
      directory: main
      components:
        db-postgres:
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
        product:
          infra:
            overrides:
              Cluster: ""
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
        digest:
          infra:
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              RoleArn: arn:aws:iam::123456789012:role/example-scheduler-role
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
