# infra.overrides.LoggingConfiguration naming the log group by an ARN without the :* Step Functions requires.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-log-group-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role
              LoggingConfiguration:
                Level: ERROR
                Destinations:
                  - CloudWatchLogsLogGroup:
                      LogGroupArn: arn:aws:logs:eu-west-1:123456789012:log-group:/aws/vendedlogs/states/order-shaping
