# infra.overrides.LogGroupClass ESSENTIALS, the Infrequent Access class's other name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-log-group-class-essentials
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            overrides:
              LogGroupClass: ESSENTIALS
