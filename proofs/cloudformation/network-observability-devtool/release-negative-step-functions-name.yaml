# A component named in 81 characters, one more than Step Functions takes in a state machine name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-step-functions-name.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role
