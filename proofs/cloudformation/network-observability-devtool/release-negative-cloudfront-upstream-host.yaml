# The upstream is the generic server, which publishes no host.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-upstream-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cloudfront-upstream-host.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-cdn: {}

        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
