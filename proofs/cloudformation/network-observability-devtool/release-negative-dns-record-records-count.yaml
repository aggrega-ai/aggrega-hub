# 401 records in one record set, one more than Route 53 takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-records-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-records-count.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
