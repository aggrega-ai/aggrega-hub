apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: step-functions-only
  version: "1.0.0"
  description: >
    An AWS Step Functions state machine alone, an Express one whose JSONata
    definition shapes an order, for the Releases that prove what the Step
    Functions Recipes write and refuse on their own.
spec:
  components:
    order-shaping:
      type: core/ai-pipeline/step-functions
      values:
        state_machine_type: EXPRESS
        definition:
          Comment: "Shapes an order from its quantity and price."
          QueryLanguage: JSONata
          TimeoutSeconds: 60
          StartAt: Shape
          States:
            Shape:
              Type: Pass
              Output:
                order: "{% $states.input.id %}"
                total: "{% $states.input.quantity * $states.input.price %}"
              End: true
