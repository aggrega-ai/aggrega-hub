apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ecr-only
  version: "1.0.0"
  description: >
    An Amazon ECR repository alone, with tags that move and scan on push
    off, for the Releases that prove what the ECR Recipes write and refuse
    on their own.
spec:
  components:
    api-images:
      type: core/devtool/ecr
      values:
        image_tag_mutability: MUTABLE
        scan_on_push: false
