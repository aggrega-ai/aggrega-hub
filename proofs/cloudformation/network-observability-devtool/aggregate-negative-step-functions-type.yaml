apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-step-functions-type
  version: "1.0.0"
  description: >
    An AWS Step Functions state machine whose type is spelt in lower
    case, which Step Functions does not take.
spec:
  components:
    order-shaping:
      type: core/ai-pipeline/step-functions
      values:
        state_machine_type: express
        definition:
          StartAt: Shape
          States:
            Shape:
              Type: Pass
              End: true
