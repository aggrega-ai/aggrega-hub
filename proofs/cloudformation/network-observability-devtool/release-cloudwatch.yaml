apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloudwatch
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    # Every key the CloudWatch Recipe reads, set: the log group keeps each
    # event for 30 days, in the Infrequent Access class, encrypted with the
    # operator's KMS key.
    #
    # The key is a placeholder for one the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        api-logs:
          infra:
            retention_days: 30
            overrides:
              LogGroupClass: INFREQUENT_ACCESS
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
