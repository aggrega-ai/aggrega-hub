apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloudfront-upstreams
  version: "1.0.0"
  description: >
    An Amazon CloudFront distribution with two connections on its upstream
    socket.
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api-origin.example.com

    www-dns:
      type: core/network/dns-record
      values:
        name: www.example.com
        type: CNAME
        records:
          - www-origin.example.com

    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          api-dns:
            target: api-dns
          www-dns:
            target: www-dns
