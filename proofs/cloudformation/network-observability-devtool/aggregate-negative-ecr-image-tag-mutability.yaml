apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-ecr-image-tag-mutability
  version: "1.0.0"
  description: >
    An Amazon ECR repository whose tag mutability is spelt in lower case.
spec:
  components:
    api-images:
      type: core/devtool/ecr
      values:
        image_tag_mutability: immutable
