# An alias record, which the Component does not offer.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-alias
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-alias.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
