# infra.overrides.LifecyclePolicyText holding a JSON object shorter than the 100 characters Amazon ECR takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ecr-lifecycle-policy-text-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-ecr-only.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              LifecyclePolicyText: '{"rules":[]}'
