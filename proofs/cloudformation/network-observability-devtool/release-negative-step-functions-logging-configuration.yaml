# infra.overrides.LoggingConfiguration logging every event with no destination.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-logging-configuration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role
              LoggingConfiguration:
                Level: ALL
