# The upstream socket holds two connections.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-upstreams
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cloudfront-upstreams.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        www-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        api-cdn: {}
