apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: network-observability-devtool
  version: "1.0.0"
  description: >
    A DNS record naming the server's origin, an Amazon CloudFront
    distribution in front of that name, an Amazon CloudWatch Logs log group,
    and a server on Amazon ECS reading the name the record publishes, the
    address the distribution publishes and the name and ARN of the log
    group, so the server's environment shows what a consumer of each
    receives.
spec:
  components:
    # The name the distribution reaches the server at. The address the
    # record points to is known only once the load balancer in front of the
    # server exists, and the record's data is fixed in the Aggregate, so the
    # CNAME names a placeholder in example.com standing for it.
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api-origin.example.com

    # The edge clients reach the server through: the distribution's origin
    # is the name the record publishes.
    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          api-dns:
            target: api-dns

    # The log group the server's container output is written to.
    api-logs:
      type: core/observability/cloudwatch

    api:
      type: core/compute/server
      uses:
        dns:
          api-dns:
            target: api-dns
            inject:
              env:
                - in: API_PUBLIC_HOST
                  from: host
        cdn:
          api-cdn:
            target: api-cdn
            inject:
              env:
                - in: API_CDN_HOST
                  from: host
                - in: API_CDN_ENDPOINT
                  from: endpoint
        logs:
          api-logs:
            target: api-logs
            inject:
              env:
                - in: API_LOG_GROUP
                  from: log_group_name
                - in: API_LOG_GROUP_ARN
                  from: arn
