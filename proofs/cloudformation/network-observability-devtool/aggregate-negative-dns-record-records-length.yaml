# Nine TXT texts of 3700 characters, each written as a value of 3744
# characters, 33696 together.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-records-length
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: TXT
        records:
          - "part=1; "
          - "part=2; "
          - "part=3; "
          - "part=4; "
          - "part=5; "
          - "part=6; "
          - "part=7; "
          - "part=8; "
          - "part=9; "
