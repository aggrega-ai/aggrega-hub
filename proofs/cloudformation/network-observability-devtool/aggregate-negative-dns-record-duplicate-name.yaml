# Two NS entries alike once the second one's trailing dot and capitals are set
# aside.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-duplicate-name
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "child.example.com"
        type: NS
        records:
          - "ns1.example.net"
          - "NS1.Example.net."
