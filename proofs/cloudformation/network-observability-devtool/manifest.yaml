apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: network-observability-devtool
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the DNS record bound to its Route 53 Recipe,
    the distribution to its CloudFront Recipe, the log group to its
    CloudWatch Recipe and the generic server to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/network/dns-record:1.0.0: cloudformation/dns-record-route-53:1.0.0
        core/network/cloudfront:1.0.0: cloudformation/cloudfront:1.0.0
        core/observability/cloudwatch:1.0.0: cloudformation/cloudwatch:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
