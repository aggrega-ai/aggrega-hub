apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: step-functions-logging-unset
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    # An empty LoggingConfiguration, which the fragment treats as unset: the
    # state machine is written with logging level OFF and no log group.
    #
    # The role is a placeholder for one the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role
              LoggingConfiguration: {}
