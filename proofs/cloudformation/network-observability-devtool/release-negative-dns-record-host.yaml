# infra.overrides.host, while the record set is reached at values.name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
              host: api.example.com
