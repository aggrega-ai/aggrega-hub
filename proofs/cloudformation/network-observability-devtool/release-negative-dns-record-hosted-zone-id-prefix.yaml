# infra.overrides.HostedZoneId written with the /hostedzone/ prefix the Route 53
# API returns.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-hosted-zone-id-prefix
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: /hostedzone/Z00000000000000000000
