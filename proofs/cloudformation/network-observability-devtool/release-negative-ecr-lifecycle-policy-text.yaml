# infra.overrides.LifecyclePolicyText holding text that is not a JSON object.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ecr-lifecycle-policy-text
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-ecr-only.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              LifecyclePolicyText: 'rules: expire untagged images fourteen days after their push, written as YAML text rather than as a JSON object'
