# infra.waf_policy_id is a bare web ACL ID, not an ARN.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-waf-policy-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudfront-only.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        api-cdn:
          infra:
            waf_policy_id: 00000000-0000-0000-0000-000000000000
