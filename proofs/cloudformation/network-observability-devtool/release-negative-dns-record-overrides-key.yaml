# infra.overrides.HostedZoneID, a misspelling of HostedZoneId, beside the
# HostedZoneId this Recipe requires.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
              HostedZoneID: Z00000000000000000000
