# infra.overrides.RoleArn naming the role by its name, not its ARN.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-role-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              RoleArn: example-state-machine-role
