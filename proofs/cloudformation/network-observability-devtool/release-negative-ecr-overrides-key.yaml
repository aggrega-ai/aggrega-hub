# infra.overrides.KmsKeyID, a misspelling of KmsKeyId.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ecr-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-ecr-only.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              KmsKeyID: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
