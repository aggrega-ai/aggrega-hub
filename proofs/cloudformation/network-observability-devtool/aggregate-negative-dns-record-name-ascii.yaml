# A CNAME naming a domain with a letter outside ASCII, not converted to
# Punycode.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-name-ascii
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "books.example.com"
        type: CNAME
        records:
          - "bücher.example.com"
