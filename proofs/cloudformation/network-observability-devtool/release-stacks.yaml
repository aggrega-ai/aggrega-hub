apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: network-observability-devtool-stacks
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The record set, the log group and the repository in the first stack,
    # the distribution in the second, the server in the third, each deployed
    # after the one before. The distribution's origin imports the name the
    # first stack exports, and the server's environment imports the record's
    # name, the log group's name and ARN, the repository's registry, address
    # and ARN and the distribution's address, which the first two export.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone, the subnet,
    # the security group, the ECS cluster and the execution role.
    network:
      directory: network
      syncWave: 0
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        api-logs: {}

        api-images: {}

    edge:
      directory: edge
      syncWave: 1
      components:
        api-cdn: {}

    compute:
      directory: compute
      syncWave: 2
      components:
        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
