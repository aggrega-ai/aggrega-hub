apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: network-observability-devtool-stacks
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # Two stacks: the record set in the first, the server in the second,
    # deployed after it. The server's environment imports the name the first
    # stack exports.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone, the subnet,
    # the security group, the ECS cluster and the execution role.
    network:
      directory: network
      syncWave: 0
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

    compute:
      directory: compute
      syncWave: 1
      components:
        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
