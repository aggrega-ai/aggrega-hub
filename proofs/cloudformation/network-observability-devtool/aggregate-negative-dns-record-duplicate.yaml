# Two MX entries alike once the space between their fields is written as
# one.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-duplicate
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: MX
        records:
          - "10 mail.example.com"
          - "10  mail.example.com"
