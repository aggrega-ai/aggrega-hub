apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: step-functions
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    # Every key the Step Functions Recipe reads, set: the state machine runs
    # as the operator's role, adds the operator's KMS key to the encryption
    # Step Functions applies, and logs every event, without each event's
    # input and output, to the operator's log group, named by its ARN ending
    # in :*, as Step Functions takes it.
    #
    # The role, the key and the log group are placeholders for ones the
    # operator already has in AWS account 123456789012.
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              LoggingConfiguration:
                Level: ALL
                IncludeExecutionData: false
                Destinations:
                  - CloudWatchLogsLogGroup:
                      LogGroupArn: "arn:aws:logs:eu-west-1:123456789012:log-group:/aws/vendedlogs/states/order-shaping:*"
