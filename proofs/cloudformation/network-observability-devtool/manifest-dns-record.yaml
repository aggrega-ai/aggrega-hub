apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: dns-record
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the DNS record bound to its Route 53 Recipe,
    for the Releases that prove what that Recipe writes and refuses on its
    own.
spec:
  mappings:
    components:
      type:
        core/network/dns-record:1.0.0: cloudformation/dns-record-route-53:1.0.0
