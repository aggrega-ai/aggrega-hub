# A TXT text written longer than the 4000 characters Route 53 takes in one
# value.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-value-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-value-length.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
