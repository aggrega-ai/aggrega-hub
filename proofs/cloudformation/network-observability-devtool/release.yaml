apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: network-observability-devtool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One directory, so the record set, the distribution, the log group, the
    # repository, the state machine and the server are resources of one
    # stack: the distribution's origin is a reference to the record set, and
    # the server's environment carries references to the record set, the
    # distribution, the log group, the repository and the state machine,
    # which CloudFormation resolves once each exists. The record set goes into
    # the operator's hosted zone for example.com, and the operator's web ACL
    # inspects what the distribution takes. The log group keeps its events
    # without expiry, as no retention_days is set, and the server's container
    # output is written to it: awslogs-group names the group by its name,
    # which is the component's, and the reference to it in the server's
    # environment has CloudFormation create the group first. The repository's
    # images are encrypted with Amazon S3-managed keys and carry no lifecycle
    # policy, as no override is set. The state machine runs as the operator's
    # role, is encrypted with keys AWS owns alone and logs nothing, as RoleArn
    # alone is set.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone, the web ACL,
    # the state machine's role, the subnet, the security group, the ECS
    # cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        api-cdn:
          infra:
            waf_policy_id: arn:aws:wafv2:us-east-1:123456789012:global/webacl/example-web-acl/00000000-0000-0000-0000-000000000000

        api-logs: {}

        api-images: {}

        api-workflow:
          infra:
            overrides:
              RoleArn: arn:aws:iam::123456789012:role/example-state-machine-role

        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
              awslogs-group: api-logs
