# infra.retention_days 10, a period CloudWatch Logs does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-retention-days
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            retention_days: 10
