apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cloudfront
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudfront-only.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    # Every key the CloudFront Recipe reads, set: the distribution answers at
    # cdn.example.com with the operator's certificate for it, reaches the
    # name the record publishes through the operator's VPC origin, serves
    # from the edge locations of PriceClass_100, caches by the operator's
    # cache policy and is inspected by the operator's web ACL.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone, the
    # certificate in us-east-1, the VPC origin in front of the load balancer
    # the record names, the cache policy and the web ACL.
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        api-cdn:
          infra:
            waf_policy_id: arn:aws:wafv2:us-east-1:123456789012:global/webacl/example-web-acl/00000000-0000-0000-0000-000000000000
            overrides:
              host: cdn.example.com
              CustomEndpointCertificateArn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
              VpcOriginId: vo_EXAMPLE000000000000
              PriceClass: PriceClass_100
              CachePolicyId: 00000000-0000-0000-0000-000000000000
