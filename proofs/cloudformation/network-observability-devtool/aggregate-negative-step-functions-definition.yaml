apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-step-functions-definition
  version: "1.0.0"
  description: >
    An AWS Step Functions state machine whose definition starts at a
    state it does not hold.
spec:
  components:
    order-shaping:
      type: core/ai-pipeline/step-functions
      values:
        definition:
          StartAt: Begin
          States:
            Shape:
              Type: Pass
              End: true
