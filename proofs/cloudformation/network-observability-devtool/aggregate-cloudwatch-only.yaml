apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloudwatch-only
  version: "1.0.0"
  description: >
    An Amazon CloudWatch Logs log group alone, for the Releases that prove
    what the CloudWatch Recipes write and refuse on their own.
spec:
  components:
    api-logs:
      type: core/observability/cloudwatch
