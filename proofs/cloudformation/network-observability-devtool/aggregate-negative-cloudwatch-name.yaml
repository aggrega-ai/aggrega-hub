apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloudwatch-name
  version: "1.0.0"
  description: >
    An Amazon CloudWatch Logs log group whose component's name, which names
    the group, is 513 characters long, one past the 512 CloudWatch Logs
    takes.
spec:
  components:
    logs-:
      type: core/observability/cloudwatch
