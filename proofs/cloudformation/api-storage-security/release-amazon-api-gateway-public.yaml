apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: amazon-api-gateway-public
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-public.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One directory, so the API, the bucket and the server are resources of
    # one stack: the API's integration URL joins the bucket's published host
    # and port, and the server's ASSETS_HOST and ASSETS_ENDPOINT carry
    # references to the API's endpoint. No override is set on the API.
    #
    # This positive proves the composition of the integration URL only, not a
    # serving pattern: the bucket's Regional endpoint reads a request for
    # /<key> as a request for bucket <key> and refuses unsigned requests.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      components:
        assets-entry: {}

        assets:
          infra:
            region: eu-west-1

        catalog-ui:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-catalog-ui:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
