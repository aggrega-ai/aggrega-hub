apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cognito-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito-only.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # One fault: host, which a user pool does not take, since it has no address
    # of its own.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              host: auth.example.com
