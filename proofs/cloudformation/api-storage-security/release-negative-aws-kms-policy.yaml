apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-policy
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: policy written as a JSON string, where it takes the policy
    # document as a mapping.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              policy: '{"Version": "2012-10-17", "Statement": []}'
