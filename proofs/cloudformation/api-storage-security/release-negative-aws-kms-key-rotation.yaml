apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-key-rotation
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: EnableKeyRotation written as the string yes, where it takes
    # true or false.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              EnableKeyRotation: "yes"
