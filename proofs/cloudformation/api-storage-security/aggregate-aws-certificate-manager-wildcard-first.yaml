apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-certificate-manager-wildcard-first
  version: "1.0.0"
  description: >
    A certificate whose first name is the wildcard *.example.com and whose
    other name is its base name example.com, which share one validation
    record, on its own.
spec:
  components:
    scratch:
      type: core/security/aws-certificate-manager
      values:
        domain_name: "*.example.com"
        subject_alternative_names:
          - example.com
