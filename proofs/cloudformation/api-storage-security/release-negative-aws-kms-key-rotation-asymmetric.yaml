apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-key-rotation-asymmetric
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-signing.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: automatic rotation turned on for an RSA key, which KMS
    # rotates only by creating another key.
    aws:
      directory: main
      components:
        document-signing:
          infra:
            overrides:
              EnableKeyRotation: true
