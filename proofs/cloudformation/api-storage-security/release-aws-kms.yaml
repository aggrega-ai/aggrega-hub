apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-kms
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One directory, so the key, its alias and the server are resources of
    # one stack, and the server's environment carries references to the key,
    # which CloudFormation resolves when it creates the stack. The key rotates
    # yearly, takes KMS's default key policy, and is deleted 7 days after it
    # leaves the stack.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        records-encryption:
          infra:
            overrides:
              EnableKeyRotation: true
              PendingWindowInDays: 7

        records-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-records-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
