apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-hosted-zone-id-prefix
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: HostedZoneId with the /hostedzone/ prefix the Route 53 API
    # returns, which CloudFormation does not take.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              HostedZoneId: /hostedzone/Z00000000000000000000
