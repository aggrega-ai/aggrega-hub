apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-amazon-api-gateway-upstream-host
  version: "1.0.0"
  description: >
    An Amazon API Gateway HTTP API whose upstream is the generic server,
    which publishes no host.
spec:
  components:
    edge:
      type: core/gateway/amazon-api-gateway
      uses:
        upstream:
          orders-api:
            target: orders-api

    orders-api:
      type: core/compute/server
