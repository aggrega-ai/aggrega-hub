apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: amazon-api-gateway-public
  version: "1.0.0"
  description: >
    An Amazon API Gateway HTTP API forwarding every request to the host and
    port an S3-compatible object store on Amazon S3 publishes, its Regional
    endpoint, and a server on Amazon ECS reading the API's host and
    endpoint, so the integration's URL is composed from what a neighbour
    publishes.
spec:
  components:
    assets-entry:
      type: core/gateway/amazon-api-gateway
      uses:
        upstream:
          assets:
            target: assets

    assets:
      type: core/storage/s3-object-store
      values:
        bucket: example-assets

    catalog-ui:
      type: core/compute/server
      uses:
        assets:
          assets-entry:
            target: assets-entry
            inject:
              env:
                - in: ASSETS_HOST
                  from: host
                - in: ASSETS_ENDPOINT
                  from: endpoint
