apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-host-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: host is a wildcard name, which names no host a consumer can
    # reach.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              host: "*.example.com"
              CustomEndpointCertificateArn: arn:aws:acm:eu-west-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

        assets:
          infra:
            region: eu-west-1
