apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-upstream-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-amazon-api-gateway-upstream-host.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: the upstream is the generic server, which publishes no host,
    # and no VPC link is named.
    aws:
      directory: main
      components:
        edge: {}

        orders-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-orders:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
