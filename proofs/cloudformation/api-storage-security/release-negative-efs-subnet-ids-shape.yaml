apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-subnet-ids-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: SubnetIds written as one string rather than a list of subnet IDs.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              SubnetIds: subnet-0000000000000000a
              SecurityGroups:
                - sg-0000000000000000e
