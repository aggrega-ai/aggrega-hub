apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-connection-id-alone
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: ConnectionId names a VPC link, and IntegrationUri, the listener
    # behind it, is not set.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              ConnectionId: examplelink

        assets:
          infra:
            region: eu-west-1
