apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: HostedZoneID, a misspelling of HostedZoneId, which this Recipe
    # does not read, beside the HostedZoneId it requires.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000
              HostedZoneID: Z00000000000000000000
