apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-hosted-zone-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: HostedZoneId unset, so no zone receives the validation
    # records.
    aws:
      directory: main
      components:
        scratch: {}
