apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cognito
  version: "1.0.0"
  description: >
    A user pool for members, who sign in with their email address, which
    Cognito verifies by a code, and may set up an authenticator app as a
    second factor, and a members API server on Amazon ECS reading the
    pool's ID and ARN, the client's ID and the discovery URL, so the
    server's environment shows what a verifier of the pool's tokens
    receives.
spec:
  components:
    members:
      type: core/security/cognito
      values:
        username_attributes:
          - email
        auto_verified_attributes:
          - email
        mfa_configuration: OPTIONAL
        explicit_auth_flows:
          - ALLOW_USER_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH

    members-api:
      type: core/compute/server
      uses:
        identity:
          members:
            target: members
            inject:
              env:
                - in: MEMBERS_USER_POOL_ID
                  from: user_pool_id
                - in: MEMBERS_CLIENT_ID
                  from: client_id
                - in: MEMBERS_OIDC_DISCOVERY_URL
                  from: oidc_discovery_url
                - in: MEMBERS_USER_POOL_ARN
                  from: arn
