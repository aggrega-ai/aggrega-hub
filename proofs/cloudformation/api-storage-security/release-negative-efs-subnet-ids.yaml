apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-subnet-ids
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: no SubnetIds, so no subnet holds a mount target.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              SecurityGroups:
                - sg-0000000000000000e
