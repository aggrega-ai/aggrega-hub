apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: the KMS key named by a bare name, which is neither a key ID, an
    # alias name beginning alias/, nor an ARN.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              SubnetIds:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-0000000000000000e
              KmsKeyId: example-files-key
