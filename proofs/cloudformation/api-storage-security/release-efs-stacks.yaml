apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: efs-stacks
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One directory, so one stack, with the file system in the first wave and
    # the server in the second: the server resource depends on the file
    # system's mount targets, so the server starts once they exist. The
    # server's environment carries references to the file system. The file
    # system keeps Amazon EFS's defaults: general purpose, bursting
    # throughput, its file contents encrypted under aws/elasticfilesystem.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnets, the security
    # group, the ECS cluster and the execution role.
    storage:
      directory: main
      syncWave: 0
      components:
        shared-media:
          infra:
            overrides:
              SubnetIds:
                - subnet-0000000000000000a
                - subnet-0000000000000000b
              SecurityGroups:
                - sg-0000000000000000e

    compute:
      directory: main
      syncWave: 1
      components:
        media-renderer:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-media-renderer:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
