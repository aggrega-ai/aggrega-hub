apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: amazon-api-gateway-only
  version: "1.0.0"
  description: >
    An Amazon API Gateway HTTP API forwarding every request to the host and
    port an S3-compatible object store on Amazon S3 publishes, with no
    consumer.
spec:
  components:
    edge:
      type: core/gateway/amazon-api-gateway
      uses:
        upstream:
          assets:
            target: assets

    assets:
      type: core/storage/s3-object-store
      values:
        bucket: example-assets
