apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-certificate-manager
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One directory, so the certificate and the server are resources of one
    # stack, and the server's environment carries a reference to the
    # certificate, which CloudFormation resolves once ACM has issued it. The
    # validation records of both names go into the operator's hosted zone.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone serving
    # example.com, the subnet, the security group, the ECS cluster and the
    # execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        site-certificate:
          infra:
            overrides:
              HostedZoneId: Z00000000000000000000

        site-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-site-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
