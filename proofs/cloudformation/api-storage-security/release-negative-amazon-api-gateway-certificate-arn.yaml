apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-certificate-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: CustomEndpointCertificateArn names an IAM server certificate,
    # where the custom domain takes an AWS Certificate Manager certificate.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              host: api.example.com
              CustomEndpointCertificateArn: arn:aws:iam::123456789012:server-certificate/example

        assets:
          infra:
            region: eu-west-1
