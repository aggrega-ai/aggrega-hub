apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-certificate-manager-only
  version: "1.0.0"
  description: >
    A certificate for the one name api.example.com, on its own.
spec:
  components:
    scratch:
      type: core/security/aws-certificate-manager
      values:
        domain_name: api.example.com
