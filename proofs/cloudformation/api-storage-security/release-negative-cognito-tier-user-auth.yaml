apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cognito-tier-user-auth
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito-user-auth.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # One fault: the Lite feature plan, beside a client taking choice-based
    # sign-in, which needs Essentials or higher.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              UserPoolTier: LITE
