apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-aws-certificate-manager-domain-name
  version: "1.0.0"
  description: >
    One fault: a domain_name of one label, which is not a fully qualified
    domain name.
spec:
  components:
    scratch:
      type: core/security/aws-certificate-manager
      values:
        domain_name: localhost
