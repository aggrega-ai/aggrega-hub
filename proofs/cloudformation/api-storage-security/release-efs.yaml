apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: efs
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One directory, so the file system, its two mount targets and the server
    # are resources of one stack, and the server's environment carries
    # references to the file system, which CloudFormation resolves when it
    # creates the stack. The file system runs in elastic throughput and its
    # file contents are encrypted under the operator's key.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnets, in two
    # Availability Zones of one VPC, the security groups, the KMS key, the ECS
    # cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        shared-media:
          infra:
            overrides:
              SubnetIds:
                - subnet-0000000000000000a
                - subnet-0000000000000000b
              SecurityGroups:
                - sg-0000000000000000e
              ThroughputMode: elastic
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000

        media-renderer:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-media-renderer:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
