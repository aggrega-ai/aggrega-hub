apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-aws-kms-key-usage
  version: "1.0.0"
  description: >
    One fault: an HMAC key spec with key_usage unset, which takes
    ENCRYPT_DECRYPT, a usage no HMAC key takes.
spec:
  components:
    scratch:
      type: core/security/aws-kms
      values:
        key_spec: HMAC_256
