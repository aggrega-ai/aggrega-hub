apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: amazon-api-gateway-stacks
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-public.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # Two stacks: the bucket in the first, the API and the server in the
    # second, deployed after it. The API's integration URL joins the host
    # the bucket's stack exports, which the second stack imports.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the ECS cluster, the subnet,
    # the security group and the execution role.
    storage:
      directory: storage
      syncWave: 0
      components:
        assets:
          infra:
            region: eu-west-1

    edge:
      directory: edge
      syncWave: 1
      components:
        assets-entry: {}

        catalog-ui:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-catalog-ui:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
