apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-kms-stacks
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # Two stacks: the key and its alias in the first, the server in the
    # second, deployed after it. The server's environment imports what the
    # first stack exports. The key keeps KMS's defaults: no rotation, the
    # default key policy, a waiting period of 30 days before deletion.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    security:
      directory: security
      syncWave: 0
      components:
        records-encryption: {}

    compute:
      directory: compute
      syncWave: 1
      components:
        records-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-records-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
