apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-certificate-manager
  version: "1.0.0"
  description: >
    A certificate for example.com and every name one level below it, and a
    site API server on Amazon ECS reading its ARN, so the server's
    environment shows what a consumer of the certificate receives.
spec:
  components:
    site-certificate:
      type: core/security/aws-certificate-manager
      values:
        domain_name: example.com
        subject_alternative_names:
          - "*.example.com"

    site-api:
      type: core/compute/server
      uses:
        certificate:
          site-certificate:
            target: site-certificate
            inject:
              env:
                - in: SITE_CERTIFICATE_ARN
                  from: arn
