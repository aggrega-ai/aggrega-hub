apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-kms-ml-kem
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-ml-kem.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # The ML-KEM key and its alias, with KMS's defaults otherwise, in a
    # Region outside China, where KMS offers ML-KEM keys.
    aws:
      directory: main
      components:
        key-exchange: {}
