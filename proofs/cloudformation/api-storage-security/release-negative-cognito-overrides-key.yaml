apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cognito-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito-only.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # One fault: UserPoolTiers, a misspelling of UserPoolTier.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              UserPoolTiers: PLUS
