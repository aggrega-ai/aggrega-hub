apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cognito
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # One directory, so the pool, its client and the server are resources of
    # one stack, and the server's environment carries references to the pool
    # and the client, which CloudFormation resolves when it creates the
    # stack. The pool takes the Essentials feature plan, the default.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        members: {}

        members-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-members-api:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-0000000000000000a
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
