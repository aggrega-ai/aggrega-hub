apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: amazon-api-gateway
  version: "1.0.0"
  description: >
    An Amazon API Gateway HTTP API in front of an orders server on Amazon
    ECS, and a storefront server on Amazon ECS reading the API's host and
    endpoint, so the storefront's environment shows what a client of the API
    receives.
spec:
  components:
    orders-entry:
      type: core/gateway/amazon-api-gateway
      uses:
        upstream:
          orders-api:
            target: orders-api

    orders-api:
      type: core/compute/server

    storefront:
      type: core/compute/server
      uses:
        orders:
          orders-entry:
            target: orders-entry
            inject:
              env:
                - in: ORDERS_API_HOST
                  from: host
                - in: ORDERS_API_ENDPOINT
                  from: endpoint
