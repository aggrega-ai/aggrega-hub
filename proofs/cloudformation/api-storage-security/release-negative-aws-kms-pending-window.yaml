apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-pending-window
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: PendingWindowInDays 5, below the 7 days KMS waits at least
    # before deleting a key.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              PendingWindowInDays: 5
