apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: efs
  version: "1.0.0"
  description: >
    An Amazon EFS file system of shared media, and a media renderer server
    on Amazon ECS reading its ID, its mount name and its ARN, so the
    server's environment shows what a client of the file system receives.
spec:
  components:
    shared-media:
      type: core/storage/efs

    media-renderer:
      type: core/compute/server
      uses:
        media:
          shared-media:
            target: shared-media
            inject:
              env:
                - in: MEDIA_FILE_SYSTEM_ID
                  from: file_system_id
                - in: MEDIA_FILE_SYSTEM_HOST
                  from: host
                - in: MEDIA_FILE_SYSTEM_ARN
                  from: arn
