apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-amazon-api-gateway-upstreams
  version: "1.0.0"
  description: >
    An Amazon API Gateway HTTP API with two connections on its upstream
    socket.
spec:
  components:
    edge:
      type: core/gateway/amazon-api-gateway
      uses:
        upstream:
          assets:
            target: assets
          archive:
            target: archive

    assets:
      type: core/storage/s3-object-store
      values:
        bucket: example-assets

    archive:
      type: core/storage/s3-object-store
      values:
        bucket: example-archive
