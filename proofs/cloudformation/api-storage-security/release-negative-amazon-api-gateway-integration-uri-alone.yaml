apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-integration-uri-alone
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: IntegrationUri names a listener, and no VPC link is named in
    # ConnectionId.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              IntegrationUri: arn:aws:elasticloadbalancing:eu-west-1:123456789012:listener/app/example-internal/0000000000000000/0000000000000000

        assets:
          infra:
            region: eu-west-1
