apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-projection-attributes
  version: "1.0.0"
  description: >
    A DynamoDB table with an index projecting every attribute that also
    lists attributes to include.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        attribute_definitions:
          - attribute_name: id
            attribute_type: S
          - attribute_name: status
            attribute_type: S
        global_secondary_indexes:
          - index_name: by-status
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: ALL
              non_key_attributes:
                - total
