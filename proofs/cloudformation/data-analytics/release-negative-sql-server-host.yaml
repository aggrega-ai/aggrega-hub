apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.host carries a port, which a consumer would add to
    # infra.port and compose a broken connection from.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              host: archive-db.example.com:1433
