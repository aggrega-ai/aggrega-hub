apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-index-key-order
  version: "1.0.0"
  description: >
    A DynamoDB table with an index keyed by a sort key alone.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        attribute_definitions:
          - attribute_name: id
            attribute_type: S
          - attribute_name: placed_at
            attribute_type: N
        global_secondary_indexes:
          - index_name: by-time
            key_schema:
              - attribute_name: placed_at
                key_type: RANGE
            projection:
              projection_type: ALL
