apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-redshift-name.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: the component events_warehouse names the namespace and the
    # workgroup, and Amazon Redshift Serverless refuses an underscore in either
    # name.
    aws:
      directory: main
      components:
        events_warehouse:
          infra: {}
