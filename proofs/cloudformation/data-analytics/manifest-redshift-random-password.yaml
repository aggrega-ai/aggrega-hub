apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: redshift-random-password
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the warehouse bound to its Amazon Redshift
    Serverless Recipe, and core/random-password to the FeatureRecipe that
    creates a secret in the stack.
spec:
  mappings:
    components:
      type:
        core/bigdata/redshift:1.0.0: cloudformation/redshift:1.0.0
    features:
      type:
        core/random-password:1.0.0: cloudformation/random-password:1.0.0
