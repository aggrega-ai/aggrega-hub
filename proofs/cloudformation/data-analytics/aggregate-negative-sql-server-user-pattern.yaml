apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sql-server-user-pattern
  version: "1.0.0"
  description: >
    One fault: values.user is app-user, whose hyphen Amazon RDS refuses in a
    master user name of letters, digits and underscores.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server
      values:
        user: app-user
