apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-default-iam-role
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.DefaultIamRoleArn names a role
    # infra.overrides.IamRoles does not list.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              IamRoles:
                - arn:aws:iam::123456789012:role/example-redshift-loader
              DefaultIamRoleArn: arn:aws:iam::123456789012:role/example-redshift-unloader
