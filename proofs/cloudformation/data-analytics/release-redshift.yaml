apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redshift
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One directory, so the server is a resource of the warehouse's stack and
    # its WAREHOUSE_HOST carries the reference to the workgroup's address, which
    # CloudFormation resolves when it creates the stack. The workgroup starts at
    # 32 Redshift Processing Units in the operator's subnets and security group,
    # the namespace encrypts its data with the operator's key and loads data
    # with the operator's roles; Amazon Redshift keeps the administrator's
    # password.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the subnets, the security group, the KMS
    # key, the IAM roles, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        sales-warehouse:
          features:
            password:
              type: core/generated-secret
          infra:
            overrides:
              BaseCapacity: 32
              SubnetIds:
                - subnet-0000000000000000a
                - subnet-0000000000000000b
                - subnet-0000000000000000c
              SecurityGroupIds:
                - sg-00000000000000000
              PubliclyAccessible: false
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              IamRoles:
                - arn:aws:iam::123456789012:role/example-redshift-loader
                - arn:aws:iam::123456789012:role/example-redshift-unloader
              DefaultIamRoleArn: arn:aws:iam::123456789012:role/example-redshift-loader

        report-runner:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-report-runner:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
