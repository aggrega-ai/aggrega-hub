apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-capacity-on-demand
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a read capacity on a table billed on demand, the
    # Component's default billing mode, which takes none.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              ReadCapacityUnits: 5
