apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: infra.overrides.DeletionProtection, a misspelling of
    # DeletionProtectionEnabled, which the Recipe halts on by name.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              DeletionProtection: true
