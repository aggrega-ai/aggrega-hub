apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.KmsKeyId is a number rather than a key ID, ARN
    # or alias name.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              KmsKeyId: 12345
