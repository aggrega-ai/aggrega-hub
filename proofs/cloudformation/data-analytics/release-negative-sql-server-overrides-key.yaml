apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.MultiAz, a misspelling of MultiAZ, which the
    # Recipe halts on by name.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              MultiAz: true
