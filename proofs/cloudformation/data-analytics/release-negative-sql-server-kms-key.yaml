apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.KmsKeyId without StorageEncrypted true, which
    # CloudFormation requires beside it.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
