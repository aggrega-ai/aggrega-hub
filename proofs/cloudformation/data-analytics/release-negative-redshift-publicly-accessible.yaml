apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-publicly-accessible
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.PubliclyAccessible is a string rather than true
    # or false.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              PubliclyAccessible: "yes"
