apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a backup schedule, which point-in-time recovery, backing
    # the table up continuously, has no use for.
    aws:
      directory: main
      components:
        sessions:
          features:
            backup:
              type: core/backup
              infra:
                schedule: "30 2 * * *"
