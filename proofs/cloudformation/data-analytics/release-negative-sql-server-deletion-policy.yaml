apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-deletion-policy
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.DeletionPolicy is Keep, which CloudFormation
    # does not take.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              DeletionPolicy: Keep
