apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-user-pattern
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-redshift-user-pattern.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: values.user begins with a digit, and Amazon Redshift takes a
    # user name beginning with a letter.
    aws:
      directory: main
      components:
        events-warehouse:
          infra: {}
