apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: athena
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One directory, so the server is a resource of the workgroup's stack and
    # its ATHENA_WORK_GROUP carries the reference to the workgroup's name, which
    # CloudFormation resolves when it creates the stack. Query results go to a
    # prefix of the operator's bucket, encrypted with the operator's key, and
    # Athena cancels a query scanning more than 10 GB.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the bucket, the KMS key, the ECS cluster,
    # the subnet, the security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        sales-queries:
          infra:
            overrides:
              OutputLocation: s3://example-athena-results/sales/
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              BytesScannedCutoffPerQuery: 10000000000

        query-runner:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-query-runner:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
