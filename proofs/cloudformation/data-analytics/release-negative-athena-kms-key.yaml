apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.KmsKeyId is a number rather than a key ID,
    # key ARN, alias name or alias ARN.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              KmsKeyId: 12345
