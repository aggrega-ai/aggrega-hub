apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redshift-name
  version: "1.0.0"
  description: >
    One fault: the component events_warehouse names the namespace and the
    workgroup, and Amazon Redshift Serverless refuses an underscore in
    either name.
spec:
  components:
    events_warehouse:
      type: core/bigdata/redshift
