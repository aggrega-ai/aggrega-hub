apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-credential-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift-random-password.yaml
  boundaries:
    # One fault: the password slot takes core/random-password, and Amazon
    # Redshift keeps the administrator's password itself.
    aws:
      directory: main
      components:
        events-warehouse:
          features:
            password:
              type: core/random-password
          infra: {}
