apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sql-server
  version: "1.0.0"
  description: >
    A SQL Server database of ledger entries, with its own login and
    collation, and a server on Amazon ECS reading its address, port, login,
    database name and protocol, so the server's environment shows what a
    consumer of the database receives.
spec:
  components:
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    bookkeeper:
      type: core/compute/server
      uses:
        ledger:
          ledger-db:
            target: ledger-db
            inject:
              env:
                - in: LEDGER_DB_HOST
                  from: host
                - in: LEDGER_DB_PORT
                  from: port
                - in: LEDGER_DB_USER
                  from: user
                - in: LEDGER_DB_NAME
                  from: database
                - in: LEDGER_DB_PROTOCOL
                  from: protocol
