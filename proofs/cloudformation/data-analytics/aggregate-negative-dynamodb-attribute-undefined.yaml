apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-attribute-undefined
  version: "1.0.0"
  description: >
    A DynamoDB table whose sort key names an attribute no definition types.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        key_schema:
          - attribute_name: id
            key_type: HASH
          - attribute_name: placed_at
            key_type: RANGE
