apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: two KMS keys in a list, where the table takes one key named
    # by one string.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              KmsKeyId:
                - alias/example-orders
                - alias/example-sessions
