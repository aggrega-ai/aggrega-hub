apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-security-group-ids
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.SecurityGroupIds is one string rather than a
    # list.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              SecurityGroupIds: sg-00000000000000000
