apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: redshift
  version: "1.0.0"
  description: >
    AWS through CloudFormation: the warehouse bound to its Amazon Redshift
    Serverless Recipe, core/generated-secret to the password Amazon Redshift
    keeps itself, and the generic server bound to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/bigdata/redshift:1.0.0: cloudformation/redshift:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
