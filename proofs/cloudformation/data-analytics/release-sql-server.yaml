apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One directory, so the server is a resource of the database's stack and
    # its LEDGER_DB_HOST carries the reference to the instance's address,
    # which CloudFormation resolves when it creates the stack. The instance
    # runs SQL Server 2022 Standard with a standby in another Availability
    # Zone, keeps its automated backups 14 days in a window opening at 02:30
    # UTC, and encrypts its storage with the operator's key; RDS keeps its
    # master password.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the DB subnet group, the
    # security group, the parameter group, the KMS key, the ECS cluster, the
    # subnets and the execution role.
    # The subnet group's name holds spaces, which RDS takes in the name of a
    # DB subnet group.
    aws:
      directory: main
      syncWave: 0
      components:
        ledger-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
                schedule: "30 2 * * *"
          infra:
            ha:
              enabled: true
            storage:
              size: 100Gi
            overrides:
              Engine: sqlserver-se
              LicenseModel: license-included
              DBInstanceClass: db.m6i.large
              DBSubnetGroupName: example private db subnets
              VPCSecurityGroups:
                - sg-00000000000000000
              DBParameterGroupName: example-sqlserver-se-16
              StorageEncrypted: true
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000

        bookkeeper:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-bookkeeper:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
