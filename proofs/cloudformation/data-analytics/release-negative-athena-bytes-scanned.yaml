apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-bytes-scanned
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.BytesScannedCutoffPerQuery is 1000000, below
    # the 10000000 bytes the workgroup takes at least.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              BytesScannedCutoffPerQuery: 1000000
