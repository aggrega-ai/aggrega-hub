apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-glue-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue-only.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One fault: infra.overrides.host is set, and a Data Catalog database has no
    # address of its own for the name to replace.
    aws:
      directory: main
      components:
        clickstream-catalog:
          infra:
            overrides:
              host: catalog.example.com
