apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: sql-server-random-password
  version: "1.0.0"
  description: >
    AWS through CloudFormation: SQL Server bound to its Amazon RDS Recipe,
    and core/random-password to the FeatureRecipe that creates a secret in
    the stack.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: cloudformation/sql-server-rds:1.0.0
    features:
      type:
        core/random-password:1.0.0: cloudformation/random-password:1.0.0
