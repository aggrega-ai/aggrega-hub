apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # SQL Server 2025 Enterprise on its default class, on port 1533 and 200
    # GiB of gp2 storage, published under the name the operator points at
    # it, archive-db.example.com, rather than the instance's reference. The
    # stack keeps the instance when it is deleted.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            port: 1533
            engine_version: "2025"
            storage:
              size: 200Gi
              type: gp2
            overrides:
              Engine: sqlserver-ee
              DeletionPolicy: Retain
              host: archive-db.example.com
