apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-two-backups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: two core/backup attachments, where a table has one
    # point-in-time recovery setting.
    aws:
      directory: main
      components:
        sessions:
          features:
            backup:
              type: core/backup
            second-backup:
              type: core/backup
