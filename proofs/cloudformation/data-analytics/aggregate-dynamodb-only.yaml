apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dynamodb-only
  version: "1.0.0"
  description: >
    An Amazon DynamoDB table declared with the Component's defaults alone:
    named after its instance and keyed by the string attribute id.
spec:
  components:
    sessions:
      type: core/datastore/dynamodb
