apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # The Component's defaults and this Recipe's alone: SQL Server 2022
    # Express on db.t3.small, 32 GiB of gp3 storage, port 1433, no standby,
    # and the automated backups RDS keeps 7 days with nothing attached.
    aws:
      directory: main
      components:
        archive-db: {}
