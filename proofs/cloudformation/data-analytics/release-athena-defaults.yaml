apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: athena-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # No override: Athena keeps the query results in storage it manages,
    # encrypted with a key AWS owns, and a query's scan has no limit.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra: {}
