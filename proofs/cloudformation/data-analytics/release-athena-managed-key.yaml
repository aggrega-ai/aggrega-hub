apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: athena-managed-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # Athena keeps the query results in storage it manages, encrypted with the
    # operator's KMS key, a placeholder for one in AWS account 123456789012,
    # and cancels a query scanning more than the smallest limit it takes.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              BytesScannedCutoffPerQuery: 10000000
