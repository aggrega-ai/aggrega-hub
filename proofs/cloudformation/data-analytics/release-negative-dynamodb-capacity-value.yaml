apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-capacity-value
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a read capacity of 0, below the 1 capacity unit DynamoDB
    # takes at least.
    aws:
      directory: main
      components:
        sessions:
          infra:
            billing_mode: PROVISIONED
            overrides:
              ReadCapacityUnits: 0
              WriteCapacityUnits: 5
