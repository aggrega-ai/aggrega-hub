apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-point-in-time-recovery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: core/backup sets infra.point_in_time_recovery to false,
    # and Amazon RDS keeps point-in-time recovery while it keeps automated
    # backups.
    aws:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
              infra:
                point_in_time_recovery: false
