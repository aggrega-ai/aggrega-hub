apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.SubnetIDs is a key this Recipe does not read, a
    # misspelling of SubnetIds.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              SubnetIDs:
                - subnet-0000000000000000a
