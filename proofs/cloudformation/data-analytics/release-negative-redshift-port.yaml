apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.port is 5500, outside the ports Amazon Redshift
    # Serverless serves a workgroup on.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            port: 5500
