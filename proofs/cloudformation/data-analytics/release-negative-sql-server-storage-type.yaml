apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-storage-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.storage.type is io1, which takes a provisioned IOPS
    # figure this Recipe does not carry.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            storage:
              type: io1
