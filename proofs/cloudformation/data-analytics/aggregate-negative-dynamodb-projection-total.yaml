apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-projection-total
  version: "1.0.0"
  description: >
    A DynamoDB table whose indexes include 102 attributes beside their keys,
    17 in each of six, above the 100 DynamoDB takes across a table's indexes.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        attribute_definitions:
          - attribute_name: id
            attribute_type: S
          - attribute_name: status
            attribute_type: S
        global_secondary_indexes:
          - index_name: by-status-1
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a1_01, a1_02, a1_03, a1_04, a1_05, a1_06, a1_07, a1_08, a1_09, a1_10, a1_11, a1_12, a1_13, a1_14, a1_15, a1_16, a1_17]
          - index_name: by-status-2
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a2_01, a2_02, a2_03, a2_04, a2_05, a2_06, a2_07, a2_08, a2_09, a2_10, a2_11, a2_12, a2_13, a2_14, a2_15, a2_16, a2_17]
          - index_name: by-status-3
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a3_01, a3_02, a3_03, a3_04, a3_05, a3_06, a3_07, a3_08, a3_09, a3_10, a3_11, a3_12, a3_13, a3_14, a3_15, a3_16, a3_17]
          - index_name: by-status-4
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a4_01, a4_02, a4_03, a4_04, a4_05, a4_06, a4_07, a4_08, a4_09, a4_10, a4_11, a4_12, a4_13, a4_14, a4_15, a4_16, a4_17]
          - index_name: by-status-5
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a5_01, a5_02, a5_03, a5_04, a5_05, a5_06, a5_07, a5_08, a5_09, a5_10, a5_11, a5_12, a5_13, a5_14, a5_15, a5_16, a5_17]
          - index_name: by-status-6
            key_schema:
              - attribute_name: status
                key_type: HASH
            projection:
              projection_type: INCLUDE
              non_key_attributes: [a6_01, a6_02, a6_03, a6_04, a6_05, a6_06, a6_07, a6_08, a6_09, a6_10, a6_11, a6_12, a6_13, a6_14, a6_15, a6_16, a6_17]
