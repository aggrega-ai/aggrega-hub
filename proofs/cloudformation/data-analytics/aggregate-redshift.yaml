apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: redshift
  version: "1.0.0"
  description: >
    An Amazon Redshift Serverless warehouse of sales data, with its own
    database and administrator, and a server on Amazon ECS reading its
    address, port, administrator, database name and protocol, so the
    server's environment shows what a consumer of the warehouse receives.
spec:
  components:
    sales-warehouse:
      type: core/bigdata/redshift
      values:
        database: sales
        user: sales_admin

    report-runner:
      type: core/compute/server
      uses:
        warehouse:
          sales-warehouse:
            target: sales-warehouse
            inject:
              env:
                - in: WAREHOUSE_HOST
                  from: host
                - in: WAREHOUSE_PORT
                  from: port
                - in: WAREHOUSE_USER
                  from: user
                - in: WAREHOUSE_DATABASE
                  from: database
                - in: WAREHOUSE_PROTOCOL
                  from: protocol
