apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-security-groups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.VPCSecurityGroups is one string, not a list
    # of security group IDs.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              VPCSecurityGroups: sg-00000000000000000
