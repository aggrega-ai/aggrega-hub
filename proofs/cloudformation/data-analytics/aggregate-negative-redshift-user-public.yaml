apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redshift-user-public
  version: "1.0.0"
  description: >
    One fault: values.user is public, which Amazon Redshift refuses as a
    user name.
spec:
  components:
    events-warehouse:
      type: core/bigdata/redshift
      values:
        user: public
