apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-instance-class
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.DBInstanceClass is a number, not the name of a
    # DB instance class.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              DBInstanceClass: 2
