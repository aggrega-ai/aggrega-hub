apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-attribute-twice
  version: "1.0.0"
  description: >
    A DynamoDB table typing its key attribute twice.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        attribute_definitions:
          - attribute_name: id
            attribute_type: S
          - attribute_name: id
            attribute_type: N
