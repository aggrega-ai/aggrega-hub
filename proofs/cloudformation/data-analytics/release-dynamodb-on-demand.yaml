apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dynamodb-on-demand
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # The table as the Component's defaults declare it, with no infra and no
    # attachment: named sessions after its instance, keyed by the string
    # attribute id, billed on demand, encrypted with a key AWS owns and kept
    # with no point-in-time recovery.
    aws:
      directory: main
      components:
        sessions: {}
