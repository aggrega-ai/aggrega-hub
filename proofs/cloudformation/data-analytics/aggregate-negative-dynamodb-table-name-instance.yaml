apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-table-name-instance
  version: "1.0.0"
  description: >
    A DynamoDB table with no values.table_name, whose instance's name, db,
    is shorter than the 3 characters DynamoDB takes for a table's name.
spec:
  components:
    db:
      type: core/datastore/dynamodb
