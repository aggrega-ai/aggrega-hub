apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dynamodb-key-order
  version: "1.0.0"
  description: >
    A DynamoDB table whose key lists its sort key first.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        key_schema:
          - attribute_name: placed_at
            key_type: RANGE
          - attribute_name: customer_id
            key_type: HASH
        attribute_definitions:
          - attribute_name: customer_id
            attribute_type: S
          - attribute_name: placed_at
            attribute_type: N
