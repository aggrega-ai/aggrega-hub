apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: glue
  version: "1.0.0"
  description: >
    An AWS Glue Data Catalog database for sales data, and a server on Amazon
    ECS reading its name, so the server's environment shows what a consumer
    of the database receives.
spec:
  components:
    sales-catalog:
      type: core/bigdata/glue
      values:
        database: sales

    report-builder:
      type: core/compute/server
      uses:
        catalog:
          sales-catalog:
            target: sales-catalog
            inject:
              env:
                - in: GLUE_DATABASE
                  from: database
