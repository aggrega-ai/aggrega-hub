apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dynamodb
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One directory, so the server is a resource of the table's stack and its
    # ORDERS_TABLE_NAME and ORDERS_TABLE_ARN carry references to the table,
    # which CloudFormation resolves when it creates the stack. The table is
    # provisioned with 5 read and 5 write capacity units, which each index
    # takes too, keeps 14 days of point-in-time recovery, is encrypted with
    # the operator's key and is protected from deletion.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the KMS key, the ECS cluster,
    # the subnets, the security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        orders:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            billing_mode: PROVISIONED
            overrides:
              ReadCapacityUnits: 5
              WriteCapacityUnits: 5
              KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              DeletionProtectionEnabled: true

        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
