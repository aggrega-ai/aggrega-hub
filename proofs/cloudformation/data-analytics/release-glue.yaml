apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: glue
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One directory, so the server is a resource of the database's stack and
    # its GLUE_DATABASE carries the reference to the database's name, which
    # CloudFormation resolves when it creates the stack. The database's
    # location is a prefix of the operator's bucket.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the bucket, the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        sales-catalog:
          infra:
            overrides:
              LocationUri: s3://example-data-lake/sales/

        report-builder:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-report-builder:1.0.0
            overrides:
              Cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              Subnets:
                - subnet-00000000000000000
              SecurityGroups:
                - sg-00000000000000000
              ExecutionRoleArn: arn:aws:iam::123456789012:role/example-execution-role
