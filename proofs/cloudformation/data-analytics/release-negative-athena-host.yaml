apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.host is set, and Athena publishes no address of
    # a workgroup for the name to replace.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              host: queries.example.com
