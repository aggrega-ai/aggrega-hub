apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.OutputLocaton is a key this Recipe does not
    # read, a misspelling of OutputLocation.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              OutputLocaton: s3://example-athena-results/ad-hoc/
