apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: core/backup is scheduled every six hours, and Amazon RDS takes one
    # automated backup a day.
    aws:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
              infra:
                schedule: "0 */6 * * *"
