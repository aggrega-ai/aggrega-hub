apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-capacity-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a provisioned table given a write capacity and no read
    # capacity, which DynamoDB requires beside it.
    aws:
      directory: main
      components:
        sessions:
          infra:
            billing_mode: PROVISIONED
            overrides:
              WriteCapacityUnits: 5
