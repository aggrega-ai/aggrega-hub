apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-aws-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server-aws-backup.yaml
  boundaries:
    # One fault: core/backup bound to AWS Backup, whose catalog realization backs
    # up the catalog's PostgreSQL, MySQL and MariaDB instances alone, and halts
    # on a SQL Server one.
    aws:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
              infra:
                role_arn: arn:aws:iam::123456789012:role/example-backup-role
