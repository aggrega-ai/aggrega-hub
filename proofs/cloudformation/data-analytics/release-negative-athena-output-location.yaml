apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-output-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.OutputLocation names the bucket without the
    # s3:// scheme Athena reads a results location by.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              OutputLocation: example-athena-results/ad-hoc/
