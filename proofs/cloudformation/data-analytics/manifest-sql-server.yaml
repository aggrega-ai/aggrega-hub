apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: sql-server
  version: "1.0.0"
  description: >
    AWS through CloudFormation: SQL Server bound to its Amazon RDS Recipe,
    core/backup to the instance's own automated backups,
    core/generated-secret to the password RDS keeps itself, and the generic
    server bound to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: cloudformation/sql-server-rds:1.0.0
        core/compute/server:1.1.0: cloudformation/server-ecs:1.2.0
    features:
      type:
        core/backup:1.0.0: cloudformation/backup-native:1.0.0
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
