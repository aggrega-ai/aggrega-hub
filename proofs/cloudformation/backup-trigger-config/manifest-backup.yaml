apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: backup
  version: "1.0.0"
  description: >
    AWS through CloudFormation: PostgreSQL and MySQL bound to their Amazon
    RDS Recipes, RabbitMQ to its Amazon MQ Recipe, core/generated-secret to
    the FeatureRecipe that leaves the master password to RDS,
    core/random-password to the one that creates the secret in the stack,
    and core/backup 1.1.0 to the FeatureRecipe that leaves the backup to the
    instance's own automated backups.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: cloudformation/postgres-rds:1.0.0
        core/datastore/mysql:1.0.0: cloudformation/mysql-rds:1.0.0
        core/messaging/rabbitmq:1.0.0: cloudformation/rabbitmq-amazon-mq:1.0.0
    features:
      type:
        core/generated-secret:1.0.0: cloudformation/generated-secret:1.0.0
        core/random-password:1.0.0: cloudformation/random-password:1.0.0
        core/backup:1.1.0: cloudformation/backup-native:1.1.0
