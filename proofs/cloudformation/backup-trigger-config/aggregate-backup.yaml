apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: backup
  version: "1.0.0"
  description: >
    A PostgreSQL and a MySQL database on Amazon RDS, which the operator has
    backed up by each instance's own automated backups, attaching core/backup
    in the Release; the developer writes nothing for it.
spec:
  components:
    db-postgres:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    db-mysql:
      type: core/datastore/mysql
      values:
        database: ledger
