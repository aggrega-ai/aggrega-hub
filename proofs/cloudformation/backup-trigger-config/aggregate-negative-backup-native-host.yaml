apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-backup-native-host
  version: "1.0.0"
  description: >
    A RabbitMQ broker on Amazon MQ, a stateful server whose Recipe configures
    no backup of its own from core/backup.
spec:
  components:
    queue:
      type: core/messaging/rabbitmq
      # Amazon MQ refuses a comma, a colon and an equals sign in a password.
      features:
        password:
          type: core/random-password
          values:
            length: 24
            symbols: false
