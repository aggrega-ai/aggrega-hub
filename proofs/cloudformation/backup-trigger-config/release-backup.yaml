apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-backup.yaml
  manifest: ./manifest-backup.yaml
  boundaries:
    # Each instance keeps its automated backups as its core/backup 1.1.0
    # attachment says: the PostgreSQL database 14 days, in a window opening at
    # 02:30 UTC; the MySQL database 21 days, in a window RDS chooses. The
    # FeatureRecipe binding both renders nothing: the backup is written into
    # each instance by the database's own Recipe.
    #
    # The DB subnet group and security group are placeholders for ones the
    # operator already has in AWS account 123456789012.
    aws:
      directory: main
      components:
        db-postgres:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 14
                schedule: "30 2 * * *"
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000

        db-mysql:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 21
          infra:
            engine_version: "8.4.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
