# A core/backup attachment bound to the service's own automated backup that
# names a Data Protection backup vault, which that backup does not use.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-native-vault
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-backup.yaml
  manifest: ./manifest-backup.yaml
  boundaries:
    aws:
      directory: main
      components:
        db-postgres:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 14
                vault_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.DataProtection/backupVaults/example-vault
          infra:
            engine_version: "17.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000

        db-mysql:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.4.5"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              DBSubnetGroupName: example-private-db-subnets
              VPCSecurityGroups:
                - sg-00000000000000000
