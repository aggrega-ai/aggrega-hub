# A pipeline description holding a backspace, which the Recipe refuses because
# Terraform's quoted strings do not read the escape the file would carry.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-control-character
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-data-factory-control-character.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
