apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-control-character
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline description holds a backspace
    character, which the Terraform file the Recipe writes cannot spell.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            description: "load\borders"
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
