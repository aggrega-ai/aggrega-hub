# A pipeline concurrency of 51, above the 50 azurerm_data_factory_pipeline
# takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-concurrency
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-data-factory-concurrency.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
