apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: azure-container-registry-private
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    # A registry reached through private endpoints alone: Premium, the tier
    # Microsoft offers them on, with public network access disabled, in
    # North Europe, tagged. The configuration names no network rule set, so
    # the registry keeps the service's own. The private endpoint and the
    # private DNS zone privatelink.azurecr.io are the operator's, created
    # outside the Release.
    azurerm4:
      directory: azurerm4
      components:
        images:
          infra:
            overrides:
              resource_group_name: example-rg
              location: northeurope
              sku_name: Premium
              public_network_access_enabled: false
              tags:
                environment: production
                owner: platform
