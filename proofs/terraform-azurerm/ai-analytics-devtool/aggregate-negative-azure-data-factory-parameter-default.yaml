apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-parameter-default
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline takes a String parameter with
    no default value, which the azurerm provider writes with one.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            parameters:
              day:
                type: String
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
