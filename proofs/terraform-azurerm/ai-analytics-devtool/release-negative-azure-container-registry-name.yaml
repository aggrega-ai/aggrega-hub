# A registry named by a component holding a hyphen, where Azure takes
# letters and digits alone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-container-registry-name.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        build-images:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
