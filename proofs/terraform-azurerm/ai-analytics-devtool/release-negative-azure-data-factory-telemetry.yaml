# infra.overrides.enable_telemetry given as text, where the module takes a
# boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-data-factory-only.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              enable_telemetry: "off"
