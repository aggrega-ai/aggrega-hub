apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-analytics-devtool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The Terraform root for the modules that admit azurerm 4. The
    # Databricks workspace's, the data factory's and the workflow's modules
    # admit azurerm 4 alone, so the root installs azurerm 4; the agent's and
    # the model's modules declare no provider, so they sit in a root at any
    # azurerm version, and the Container Apps body admits azurerm 4 as well,
    # so the server shares it.
    # The agent and the model are references: their modules declare no
    # resource and carry the project endpoint below, the agent's name and
    # its version, and the model's scoring endpoint and name, as outputs, and
    # the server's variables hold them as literals. The workspace is premium,
    # with secure cluster connectivity, in the network Azure Databricks
    # creates, its managed resource group databricks-rg-analytics-example-rg,
    # and the server's variables hold references to its address and host
    # name. The factory's two pipelines are written beside its module,
    # nightly created after load-orders, which it runs; the factory takes a
    # user-assigned identity, as which the linked service orders_sql reaches
    # the database through a credential the operator creates in the factory.
    # The workflow is created through the azapi provider in the resource
    # group whose ID the root composes from the subscription Terraform runs
    # against, enabled, with a user-assigned identity it may call other
    # services as; its definition is passed whole, the receipt's ${id}
    # written $${id} so that Terraform hands Logic Apps the text itself.
    # The server on Container Apps pulls its image with a user-assigned
    # identity, the identity it also calls the Foundry project, the managed
    # online endpoint and the workspace as, under role assignments the
    # operator makes on each and, for the workspace, the identity's admission
    # to it.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the Foundry resource and
    # project, managed online endpoint, resource group, Container Apps
    # environment, managed identities and container registry stand for ones
    # the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        support-agent:
          infra:
            endpoint: https://example-foundry.services.ai.azure.com/api/projects/example-project

        scoring-model:
          infra:
            endpoint: https://example-endpoint.westeurope.inference.ml.azure.com/score

        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope

        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-ingest

        orders:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-orders

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
