apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-analytics-devtool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The Terraform root for the modules that admit azurerm 4. The agent's
    # module declares no provider, so it sits in a root at any azurerm
    # version, and the Container Apps body admits azurerm 4 as well, so the
    # server shares it. The agent is a reference: its module declares no
    # resource and carries the project endpoint below, the agent's name and
    # its version as outputs, and the server's variables hold them as
    # literals. The server on Container Apps pulls its image with a
    # user-assigned identity, the identity it also calls the Foundry project
    # as, under a role assignment the operator makes on the project.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the Foundry resource and
    # project, resource group, Container Apps environment, managed identity
    # and container registry stand for ones the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        support-agent:
          infra:
            endpoint: https://example-foundry.services.ai.azure.com/api/projects/example-project

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
