apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-annotation
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline carries an annotation that is
    an object, where the azurerm provider takes text.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            annotations:
              - team: data
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
