# No infra.overrides.managed_resource_group_name, beside a resource group
# whose name makes the derived managed resource group name longer than the
# 90 characters Azure takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-managed-resource-group-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
              location: westeurope
