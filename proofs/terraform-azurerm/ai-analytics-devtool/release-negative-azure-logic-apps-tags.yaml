# infra.overrides.tags holding a nested value, where the module takes a
# map from each tag name to a string.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-logic-apps-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-logic-apps-only.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        nightly:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                team:
                  name: platform
