apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-variable-type
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline holds an Array variable, which
    the azurerm provider writes as a String.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            variables:
              files:
                type: Array
                defaultValue: []
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
