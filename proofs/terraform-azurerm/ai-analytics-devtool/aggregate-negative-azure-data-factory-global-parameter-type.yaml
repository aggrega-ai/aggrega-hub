apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-global-parameter-type
  version: "1.0.0"
  description: >
    An Azure Data Factory whose global parameter is a String holding a
    list, a value of another kind than its type, which the Component
    refuses.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        global_parameters:
          environment:
            type: String
            value: [production, staging]
