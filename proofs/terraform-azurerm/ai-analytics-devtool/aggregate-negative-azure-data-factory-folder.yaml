apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-folder
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline names its folder by empty text,
    which the azurerm provider refuses.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            folder:
              name: ""
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
