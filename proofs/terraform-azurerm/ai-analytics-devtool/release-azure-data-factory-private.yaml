apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: azure-data-factory-private
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-data-factory-only.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    # A factory taken off the internet: public network access disabled, so
    # Data Factory Studio and a self-hosted integration runtime reach it
    # through private endpoints alone, which the operator creates outside
    # the Release with their private DNS zones. It is created in another
    # region than the main Release's and tagged, and the module's telemetry
    # is set off in so many words, as it is when left unset.
    #
    # The resource group stands for one the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: northeurope
              public_network_access_enabled: false
              enable_telemetry: false
              tags:
                environment: production
