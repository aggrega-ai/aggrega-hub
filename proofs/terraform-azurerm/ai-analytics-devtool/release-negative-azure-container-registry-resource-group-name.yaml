# infra.overrides.resource_group_name ending in a period, which Azure does
# not take in a resource group name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-resource-group-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        images:
          infra:
            overrides:
              resource_group_name: example-rg.
              location: westeurope
