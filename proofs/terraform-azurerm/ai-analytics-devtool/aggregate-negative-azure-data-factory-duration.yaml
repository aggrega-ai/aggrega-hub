apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-duration
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline's elapsed-time metric duration
    is a number, where the azurerm provider takes a timespan as text.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            policy:
              elapsedTimeMetric:
                duration: 600
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
