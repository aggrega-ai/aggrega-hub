apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-parameter-type
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline takes an Int parameter, which
    the azurerm provider writes as a String.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            parameters:
              days:
                type: Int
                defaultValue: 1
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
