# infra.overrides.sku_name standard, a tier on which Azure Databricks
# creates no new workspace.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: standard
