# No infra.overrides.resource_group_name: the Recipe never chooses the
# resource group the registry is created in.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-placement
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        images:
          infra:
            overrides:
              location: westeurope
