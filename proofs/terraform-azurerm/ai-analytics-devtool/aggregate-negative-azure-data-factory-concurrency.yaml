apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-concurrency
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline allows 51 runs at once, above
    the 50 the azurerm provider takes.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            concurrency: 51
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
