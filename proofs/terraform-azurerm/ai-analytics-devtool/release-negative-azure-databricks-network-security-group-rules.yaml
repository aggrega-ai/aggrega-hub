# infra.overrides.network_security_group_rules_required as
# NoAzureServiceRules, which the workspace resource's schema gives as for
# internal use only.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-network-security-group-rules
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              network_security_group_rules_required: NoAzureServiceRules
