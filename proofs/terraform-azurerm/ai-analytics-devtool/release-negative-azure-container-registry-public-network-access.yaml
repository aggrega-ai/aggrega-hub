# infra.overrides.public_network_access_enabled given as the string
# Disabled, where the Recipe reads a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        images:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Premium
              public_network_access_enabled: Disabled
