# A definition holding a backspace character, which the Terraform files
# cannot spell.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-logic-apps-control-character
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-logic-apps-control-character.yaml
  manifest: ./manifest-azure-logic-apps.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        nightly:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
