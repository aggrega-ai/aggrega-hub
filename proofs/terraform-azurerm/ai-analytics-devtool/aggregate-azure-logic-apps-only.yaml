apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: azure-logic-apps-only
  version: "1.0.0"
  description: >
    An Azure Logic Apps workflow alone, checking a health endpoint once a
    day and returning its status, with a static result for the check, for
    the Release that places it in another region and the Releases that
    prove what the Azure Logic Apps Recipe refuses on its own.
spec:
  components:
    nightly:
      type: core/ai-pipeline/azure-logic-apps
      values:
        definition:
          contentVersion: "1.0.0.0"
          triggers:
            Recurrence:
              type: Recurrence
              recurrence:
                frequency: Day
                interval: 1
          actions:
            Check:
              type: Http
              runAfter: {}
              inputs:
                method: GET
                uri: https://example.com/health
              runtimeConfiguration:
                staticResult:
                  name: Check0
                  staticResultOptions: Disabled
          outputs:
            status:
              type: String
              value: "@{outputs('Check')['statusCode']}"
          staticResults:
            Check0:
              status: Succeeded
              outputs:
                statusCode: OK
                headers: {}
