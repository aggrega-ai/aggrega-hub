# A pipeline parameter of type Int, which azurerm_data_factory_pipeline
# writes as a String.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-parameter-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-data-factory-parameter-type.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
