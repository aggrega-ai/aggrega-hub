# A global parameter whose value is empty text, which azurerm_data_factory
# refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-global-parameter-value
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-data-factory-global-parameter-value.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
