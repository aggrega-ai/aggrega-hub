# custom_parameters.private_subnet_name with no virtual_network_id for the
# subnet to belong to.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-subnet-without-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              custom_parameters:
                private_subnet_name: databricks-private
