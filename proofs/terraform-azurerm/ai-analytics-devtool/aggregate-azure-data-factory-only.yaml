apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: azure-data-factory-only
  version: "1.0.0"
  description: >
    An Azure Data Factory alone, holding one pipeline that waits a
    second, for the Release that takes it off the internet and the
    Releases that prove what the Azure Data Factory Recipe refuses on
    its own.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
