# A workspace named by a component of two characters, where Azure takes
# three to 64.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-databricks-name.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        db:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
