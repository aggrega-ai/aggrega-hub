apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    Azure through Terraform: Foundry Agent Service bound to its reference
    Recipe, whose module declares no provider, and the generic server bound
    to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-agent/foundry-agent-service:1.0.0: terraform/foundry-agent-service:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
