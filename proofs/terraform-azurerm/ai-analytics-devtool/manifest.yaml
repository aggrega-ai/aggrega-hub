apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    Azure through Terraform: Foundry Agent Service and the Azure managed
    online endpoint model bound to their reference Recipes, whose modules
    declare no provider, Azure Databricks, Azure Data Factory and Azure
    Logic Apps bound to their Recipes, and the generic server bound to its
    Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/ai-agent/foundry-agent-service:1.0.0: terraform/foundry-agent-service:1.0.0
        core/ai-model/azure-managed:1.0.0: terraform/azure-managed:1.0.0
        core/bigdata/azure-databricks:1.0.0: terraform/azure-databricks:1.0.0
        core/bigdata/azure-data-factory:1.0.0: terraform/azure-data-factory:1.0.0
        core/ai-pipeline/azure-logic-apps:1.0.0: terraform/azure-logic-apps:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
