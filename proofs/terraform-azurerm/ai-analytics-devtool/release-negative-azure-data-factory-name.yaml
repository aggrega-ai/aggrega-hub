# A factory named by the component orders_ingest, whose underscore a
# factory name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-data-factory-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-azure-data-factory-name.yaml
  manifest: ./manifest-azure-data-factory.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders_ingest:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
