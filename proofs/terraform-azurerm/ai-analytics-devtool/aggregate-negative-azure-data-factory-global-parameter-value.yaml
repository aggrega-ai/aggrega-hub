apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-global-parameter-value
  version: "1.0.0"
  description: >
    An Azure Data Factory whose global parameter is a String holding
    empty text, which the azurerm provider refuses.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        global_parameters:
          environment:
            type: String
            value: ""
