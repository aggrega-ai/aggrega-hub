# infra.overrides.managed_resource_group_name ending in a period, which
# Azure refuses in a resource group name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-managed-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              managed_resource_group_name: example-databricks-managed.
