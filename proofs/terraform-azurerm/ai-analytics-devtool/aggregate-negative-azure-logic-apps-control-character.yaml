apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-logic-apps-control-character
  version: "1.0.0"
  description: >
    An Azure Logic Apps workflow whose definition holds a backspace
    character, which the Terraform files cannot spell.
spec:
  components:
    nightly:
      type: core/ai-pipeline/azure-logic-apps
      values:
        definition:
          contentVersion: "1.0.0.0"
          triggers:
            Recurrence:
              type: Recurrence
              recurrence:
                frequency: Day
                interval: 1
          actions:
            Check:
              type: Http
              runAfter: {}
              inputs:
                method: GET
                uri: "https://example.com/health\b"
              runtimeConfiguration:
                staticResult:
                  name: Check0
                  staticResultOptions: Disabled
          outputs:
            status:
              type: String
              value: "@{outputs('Check')['statusCode']}"
          staticResults:
            Check0:
              status: Succeeded
              outputs:
                statusCode: OK
                headers: {}
