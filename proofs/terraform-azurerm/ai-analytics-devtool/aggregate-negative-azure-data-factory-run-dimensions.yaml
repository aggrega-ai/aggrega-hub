apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-data-factory-run-dimensions
  version: "1.0.0"
  description: >
    An Azure Data Factory whose pipeline emits run dimensions, which the
    azurerm provider takes no argument for.
spec:
  components:
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        pipelines:
          load-orders:
            runDimensions:
              source: orders
            activities:
              - name: Wait
                type: Wait
                typeProperties:
                  waitTimeInSeconds: 1
