# infra.overrides.location given as a list, where the registry is
# created in one region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-container-registry-placement-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-container-registry-only.yaml
  manifest: ./manifest-azure-container-registry.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        images:
          infra:
            overrides:
              resource_group_name: example-rg
              location:
                - westeurope
                - northeurope
