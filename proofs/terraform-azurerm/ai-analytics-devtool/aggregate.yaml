apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    A Foundry Agent Service agent, a model served from an Azure managed
    online endpoint, an Azure Databricks workspace, an Azure Data Factory
    with two pipelines, and a server on Container Apps reading the endpoint
    of the Foundry project the agent lives in, the agent's name and the
    version it pins, which a call to the agent needs, the scoring endpoint
    and name of the model it calls as its own, and the workspace's address
    and host name. The server's environment shows what a consumer receives;
    the factory publishes nothing, so its connection carries no variable.
spec:
  components:
    # The agent is created and versioned in the operator's Foundry project,
    # outside the Release; the Aggregate names it and pins version 3.
    support-agent:
      type: core/ai-agent/foundry-agent-service
      values:
        agent_name: support-agent
        agent_version: "3"

    # The model is deployed behind the operator's managed online endpoint,
    # outside the Release, under the name scoring-v1.
    scoring-model:
      type: core/ai-model/azure-managed
      values:
        model: scoring-v1

    # The workspace the server sends Databricks REST API and SQL calls to;
    # its clusters, jobs and notebooks are created inside it, outside the
    # Release.
    analytics:
      type: core/bigdata/azure-databricks

    # The factory the server starts pipeline runs in. load-orders runs a
    # stored procedure through the linked service orders_sql, which the
    # operator creates in the factory outside the Release before the
    # pipelines deploy; nightly runs load-orders and waits for it, so it is
    # deployed after it.
    ingest:
      type: core/bigdata/azure-data-factory
      values:
        global_parameters:
          environment:
            type: String
            value: production
        pipelines:
          load-orders:
            description: Loads the day's orders into the reporting tables.
            parameters:
              day:
                type: String
                defaultValue: "@formatDateTime(utcNow(), 'yyyy-MM-dd')"
            activities:
              - name: LoadOrders
                type: SqlServerStoredProcedure
                linkedServiceName:
                  referenceName: orders_sql
                  type: LinkedServiceReference
                typeProperties:
                  storedProcedureName: "[dbo].[load_orders]"
                  storedProcedureParameters:
                    day:
                      value: "@pipeline().parameters.day"
                      type: String
          nightly:
            description: Runs load-orders and waits for it to finish.
            concurrency: 1
            activities:
              - name: RunLoadOrders
                type: ExecutePipeline
                typeProperties:
                  pipeline:
                    referenceName: load-orders
                    type: PipelineReference
                  waitOnCompletion: true

    api:
      type: core/compute/server
      uses:
        agent:
          support-agent:
            target: support-agent
            inject:
              env:
                - in: AGENT_ENDPOINT
                  from: endpoint
                - in: AGENT_NAME
                  from: agent_name
                - in: AGENT_VERSION
                  from: agent_version
        model:
          scoring-model:
            target: scoring-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_NAME
                  from: model
        analytics:
          analytics:
            target: analytics
            inject:
              env:
                - in: DATABRICKS_HOST
                  from: endpoint
                - in: DATABRICKS_SERVER_HOSTNAME
                  from: host
        # The factory publishes nothing, so the connection injects nothing:
        # the server starts the factory's pipeline runs through Azure
        # Resource Manager as its own identity.
        ingest:
          ingest:
            target: ingest
