apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-analytics-devtool
  version: "1.0.0"
  description: >
    A Foundry Agent Service agent and a server on Container Apps reading the
    endpoint of the Foundry project the agent lives in, the agent's name and
    the version it pins, the three things a call to the agent needs. The
    server's environment shows what a consumer receives.
spec:
  components:
    # The agent is created and versioned in the operator's Foundry project,
    # outside the Release; the Aggregate names it and pins version 3.
    support-agent:
      type: core/ai-agent/foundry-agent-service
      values:
        agent_name: support-agent
        agent_version: "3"

    api:
      type: core/compute/server
      uses:
        agent:
          support-agent:
            target: support-agent
            inject:
              env:
                - in: AGENT_ENDPOINT
                  from: endpoint
                - in: AGENT_NAME
                  from: agent_name
                - in: AGENT_VERSION
                  from: agent_version
