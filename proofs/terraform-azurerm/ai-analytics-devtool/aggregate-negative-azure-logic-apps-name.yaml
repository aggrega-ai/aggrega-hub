apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-azure-logic-apps-name
  version: "1.0.0"
  description: >
    An Azure Logic Apps workflow named by a component of 81 characters,
    one more than Logic Apps takes in a Consumption workflow's name.
spec:
  components:
    nightly-health-check-workflow-that-calls-the-health-endpoint-and-reports-status-x:
      type: core/ai-pipeline/azure-logic-apps
      values:
        definition:
          contentVersion: "1.0.0.0"
          triggers:
            Recurrence:
              type: Recurrence
              recurrence:
                frequency: Day
                interval: 1
          actions:
            Check:
              type: Http
              runAfter: {}
              inputs:
                method: GET
                uri: https://example.com/health
              runtimeConfiguration:
                staticResult:
                  name: Check0
                  staticResultOptions: Disabled
          outputs:
            status:
              type: String
              value: "@{outputs('Check')['statusCode']}"
          staticResults:
            Check0:
              status: Succeeded
              outputs:
                statusCode: OK
                headers: {}
