# public_network_access_enabled false in the network Azure Databricks
# creates: Private Link takes the operator's network.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-azure-databricks-private-link-network
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-azure-databricks-only.yaml
  manifest: ./manifest-azure-databricks.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        analytics:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: false
              network_security_group_rules_required: NoAzureDatabricksRules
