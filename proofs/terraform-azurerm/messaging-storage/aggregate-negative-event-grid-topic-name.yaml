# A component named with an underscore, which a topic name does not take:
# Microsoft documents a topic name as letters, digits and hyphens.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-grid-topic-name
  version: "1.0.0"
spec:
  components:
    orders_topic:
      type: core/messaging/azure-event-grid
