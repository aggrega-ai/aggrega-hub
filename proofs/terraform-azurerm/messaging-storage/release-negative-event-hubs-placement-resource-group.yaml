# No infra.overrides.resource_group_name: this Recipe never chooses the
# operator's resource group.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              location: westeurope
