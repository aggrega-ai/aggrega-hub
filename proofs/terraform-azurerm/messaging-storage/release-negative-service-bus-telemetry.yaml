# infra.overrides.enable_telemetry as a word, where the module takes a
# boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              enable_telemetry: "yes"
