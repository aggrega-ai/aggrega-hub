# infra.overrides.access_tier Archive, an offline tier no account takes
# as its default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-access-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ordersdata:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              access_tier: Archive
