# infra.overrides.resource_group_name as a list, where it is a name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-placement-resource-group-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ordersdata:
          infra:
            overrides:
              resource_group_name:
                - example-rg
              location: westeurope
