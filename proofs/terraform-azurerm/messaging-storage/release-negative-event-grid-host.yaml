# infra.overrides.host as a URL, where it is a bare DNS name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-grid-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-grid-only.yaml
  manifest: ./manifest-event-grid.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-topic:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              host: https://orders-topic.example.com
