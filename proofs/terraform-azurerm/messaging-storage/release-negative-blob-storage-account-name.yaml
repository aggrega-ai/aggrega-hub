# A component whose name holds a hyphen, which a storage account name
# does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-account-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-blob-storage-account-name.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-data:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
