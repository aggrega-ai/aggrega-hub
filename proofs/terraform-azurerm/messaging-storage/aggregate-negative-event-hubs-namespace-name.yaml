# A component named 9orders-events, which names its namespace, and a
# namespace name beginning with a digit is one the service refuses.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-hubs-namespace-name
  version: "1.0.0"
spec:
  components:
    9orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders: {}
