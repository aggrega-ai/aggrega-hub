# A component whose name, which names the namespace, begins with a digit,
# which the service refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-namespace-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-namespace-name.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        9orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
