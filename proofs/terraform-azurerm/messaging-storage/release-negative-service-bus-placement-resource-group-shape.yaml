# infra.overrides.resource_group_name as a list, where the key names one
# resource group.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-placement-resource-group-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name:
                - example-rg
              location: westeurope
