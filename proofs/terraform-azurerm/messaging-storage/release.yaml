apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: messaging-storage
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The Service Bus module admits azurerm 4 alone, so its boundary is a
    # Terraform root of its own, apart from the bodies at azurerm 5; the
    # Container Apps body admits azurerm 4 as well, so the server shares it.
    # The namespace runs on the Premium tier with two messaging units. Its
    # public network access is off, so clients reach it through the
    # operator's private endpoint, and its shared access signature
    # authentication is off, so the server reaches it as its managed identity,
    # under a role assignment the operator makes. Nothing under
    # infra.overrides sets the module's telemetry, so it renders off. The
    # namespace, like the Event Hubs namespace, the topic and the account
    # below, carries a tag holding ${, %{ and a double quote, which reaches
    # Azure as written. The server on Container Apps pulls its image with a
    # user-assigned identity.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Container
    # Apps environment, managed identity and container registry stand for ones
    # the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Premium
              sku_capacity: 2
              public_network_access_enabled: false
              tags:
                environment: production
                note: '${not-interpolated} "quoted" %{not-directive}'

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

    # The Event Hubs body needs azurerm 5.14 or later, so its boundary is a
    # Terraform root of its own, with a server on Container Apps of its own
    # reading it. The namespace runs on the Premium tier with two processing
    # units, its public network access off and its shared access signature
    # authentication off, so the server reaches it, over AMQP or Kafka, as its
    # managed identity, under a role assignment the operator makes. The Event
    # Grid body needs azurerm 5.14 too, so its topic shares this root, with a
    # third server publishing to it. The topic takes CloudEvents, its public
    # network access off and its access key authentication off, so that
    # server publishes as its managed identity, under a role assignment the
    # operator makes. The Blob Storage body needs azurerm 5.14 too, so the
    # Azure Storage account shares this root, with a fourth server reading
    # it. The account is zone-redundant, with new blobs in the Cool tier, its
    # public network access off and its Shared Key authorization off, so that
    # server reaches its blob and Data Lake Storage endpoints as its managed
    # identity, under a role assignment the operator makes.
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Premium
              sku_capacity: 2
              public_network_access_enabled: false
              tags:
                environment: production
                note: '${not-interpolated} "quoted" %{not-directive}'

        orders-topic:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: false
              tags:
                environment: production
                note: '${not-interpolated} "quoted" %{not-directive}'

        ordersdata:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Standard_ZRS
              access_tier: Cool
              public_network_access: Disabled
              tags:
                environment: production
                note: '${not-interpolated} "quoted" %{not-directive}'

        events-api:
          infra:
            image: example.azurecr.io/example/events-api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

        publisher-api:
          infra:
            image: example.azurecr.io/example/publisher-api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

        files-api:
          infra:
            image: example.azurecr.io/example/files-api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
