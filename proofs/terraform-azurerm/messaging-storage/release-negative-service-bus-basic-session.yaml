# The Basic tier, beside an Aggregate whose queue takes messages by session,
# which that tier does not offer and the module would drop.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-basic-session
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-service-bus-basic-session.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Basic
