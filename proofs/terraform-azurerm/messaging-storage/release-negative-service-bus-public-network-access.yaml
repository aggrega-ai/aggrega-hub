# infra.overrides.public_network_access_enabled as the string Azure
# Resource Manager writes, where the key takes a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: Disabled
