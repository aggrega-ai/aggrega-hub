# A queue taking messages by session and no topic, for the Release that sets
# the Basic tier, which offers no sessions.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-service-bus-basic-session
  version: "1.0.0"
spec:
  components:
    orders-bus:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders:
            requires_session: true
