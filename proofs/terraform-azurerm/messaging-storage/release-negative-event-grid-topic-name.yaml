# A component whose name holds an underscore, which an Event Grid topic
# name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-grid-topic-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-grid-topic-name.yaml
  manifest: ./manifest-event-grid.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders_topic:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
