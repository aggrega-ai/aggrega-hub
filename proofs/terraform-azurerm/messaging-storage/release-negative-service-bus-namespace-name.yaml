# A component whose name, which names the namespace, ends in -sb, which the
# service refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-namespace-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-service-bus-namespace-name.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-sb:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
