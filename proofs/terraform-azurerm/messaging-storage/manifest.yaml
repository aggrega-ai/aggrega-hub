apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: messaging-storage
  version: "1.0.0"
  description: >
    Azure through Terraform: Azure Service Bus bound to its Recipe, whose
    module admits azurerm 4, Azure Event Hubs and Azure Event Grid each
    bound to its Recipe, whose module needs azurerm 5.14 or later, and the
    generic server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/messaging/azure-service-bus:1.0.0: terraform/azure-service-bus:1.0.0
        core/messaging/azure-event-hubs:1.0.0: terraform/azure-event-hubs:1.0.0
        core/messaging/azure-event-grid:1.0.0: terraform/azure-event-grid:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
