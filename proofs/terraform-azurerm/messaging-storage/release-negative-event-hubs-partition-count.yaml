# An event hub of 33 partitions on the Standard tier, which takes 32.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-partition-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-partition-count.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
