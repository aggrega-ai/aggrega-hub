# Two event hubs whose names differ only in case.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-shared-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-event-hubs-shared-name.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
