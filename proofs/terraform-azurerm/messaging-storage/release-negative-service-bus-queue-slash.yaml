# A queue whose name holds a slash.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-queue-slash
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-service-bus-queue-slash.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
