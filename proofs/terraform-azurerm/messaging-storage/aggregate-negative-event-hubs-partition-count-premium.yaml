# An event hub asking for 101 partitions, where an event hub on the Premium
# tier takes 100.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-event-hubs-partition-count-premium
  version: "1.0.0"
spec:
  components:
    orders-events:
      type: core/messaging/azure-event-hubs
      values:
        eventhubs:
          orders:
            partition_count: 101
