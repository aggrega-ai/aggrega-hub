# Forty-one throughput units on the Standard tier, which takes 1 to 40.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-sku-capacity-standard
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_capacity: 41
