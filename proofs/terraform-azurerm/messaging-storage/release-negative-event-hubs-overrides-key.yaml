# An infra.overrides key this Recipe does not read: public_network_access,
# where the key is public_network_access_enabled.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-event-hubs-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-event-hubs-only.yaml
  manifest: ./manifest-event-hubs.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-events:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access: Disabled
