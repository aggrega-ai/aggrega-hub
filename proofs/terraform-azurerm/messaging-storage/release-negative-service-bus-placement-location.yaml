# No infra.overrides.location, which places the namespace in the operator's
# region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-placement-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
