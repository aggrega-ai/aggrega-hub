# A component named orders-sb, which names its namespace, and a namespace
# name ending in -sb is one the service refuses.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-service-bus-namespace-name
  version: "1.0.0"
spec:
  components:
    orders-sb:
      type: core/messaging/azure-service-bus
      values:
        queues:
          orders: {}
