# The Basic tier, beside an Aggregate declaring a topic, which that tier
# does not offer and the module would drop.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-service-bus-basic-topics
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-service-bus-only.yaml
  manifest: ./manifest-service-bus.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-bus:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Basic
