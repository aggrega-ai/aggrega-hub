# infra.overrides.public_network_access_enabled, the boolean other Azure
# Recipes read, where this Recipe reads the string public_network_access.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-blob-storage-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-blob-storage-only.yaml
  manifest: ./manifest-blob-storage.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ordersdata:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: false
