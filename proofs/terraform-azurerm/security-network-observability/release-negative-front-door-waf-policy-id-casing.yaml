# infra.waf_policy_id with its fixed segments in lower case, which Azure
# Resource Manager reads and the azurerm provider refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-waf-policy-id-casing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg

        edge:
          infra:
            waf_policy_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourcegroups/example-rg/providers/Microsoft.Network/frontdoorwebapplicationfirewallpolicies/examplepolicy
            overrides:
              resource_group_name: example-rg
