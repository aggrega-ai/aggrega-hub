apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dns-record-types
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-types.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    # Every record set goes into an Azure DNS zone the operator already holds,
    # example.com, or 2.0.192.in-addr.arpa for the reverse name, both in the
    # resource group example-rg, from one Terraform root installing azurerm
    # 5.14 or later. The DomainKeys record carries metadata from
    # infra.overrides.tags.
    #
    # The resource group stands for the operator's; the zones' names are
    # placeholders.
    azurerm5:
      directory: azurerm5
      components:
        web-a:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        web-aaaa:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        docs-cname:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        mail-mx:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        child-ns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        host-ptr:
          infra:
            overrides:
              zone_name: 2.0.192.in-addr.arpa
              resource_group_name: example-rg
        sip-srv:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        ca-caa:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
        dkim-txt:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
              tags:
                purpose: mail-signing
        apps-wildcard:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
