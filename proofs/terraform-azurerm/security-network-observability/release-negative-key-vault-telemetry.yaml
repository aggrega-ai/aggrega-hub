# infra.overrides.enable_telemetry, which this Recipe does not admit: its
# module is the catalog's own, with no telemetry to turn off.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              enable_telemetry: false
