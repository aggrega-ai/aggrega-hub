# A component whose name is forty-seven characters, one more than a Front Door endpoint's name takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-name-long
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-front-door-name-long.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg

        aaaaaaaaaaaaaaaaaaaaaaa-bbbbbbbbbbbbbbbbbbbbbbb:
          infra:
            overrides:
              resource_group_name: example-rg
