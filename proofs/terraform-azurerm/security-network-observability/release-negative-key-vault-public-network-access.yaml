# infra.overrides.public_network_access_enabled as the string Disabled,
# where it is a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: Disabled
