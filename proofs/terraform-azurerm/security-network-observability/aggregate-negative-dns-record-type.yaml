# The obsolete SPF type, which the Component does not offer: SPF goes in a TXT record.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-type
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: SPF
        records:
          - "v=spf1 -all"
