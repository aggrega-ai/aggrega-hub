# No infra.overrides.resource_group_name: the zone's resource group is the operator's.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
