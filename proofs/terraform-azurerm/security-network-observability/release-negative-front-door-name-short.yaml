# A component whose name is a single character, which a Front Door endpoint's name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-name-short
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-front-door-name-short.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg

        e:
          infra:
            overrides:
              resource_group_name: example-rg
