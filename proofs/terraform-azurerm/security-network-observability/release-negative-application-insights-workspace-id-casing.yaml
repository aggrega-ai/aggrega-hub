# infra.overrides.workspace_id with its fixed segments in lower case, which
# the azurerm provider's parser does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-workspace-id-casing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        insights:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourcegroups/example-rg/providers/microsoft.operationalinsights/workspaces/example-workspace
