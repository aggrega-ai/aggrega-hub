# A component whose name is forty-seven characters, one more than a Front Door endpoint's name takes.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-front-door-name-long
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api.example-environment.example.com

    aaaaaaaaaaaaaaaaaaaaaaa-bbbbbbbbbbbbbbbbbbbbbbb:
      type: core/network/azure-front-door
      uses:
        upstream:
          api-dns:
            target: api-dns
