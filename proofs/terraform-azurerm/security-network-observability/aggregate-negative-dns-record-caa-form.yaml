# A CAA record whose flags are 256, neither 0 nor 128.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-caa-form
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: CAA
        records:
          - "256 issue letsencrypt.org"
