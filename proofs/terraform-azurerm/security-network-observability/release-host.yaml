apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: security-network-observability-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The operator names the Azure Key Vault in infra.overrides.host, so the
    # server's ORDERS_VAULT_HOST carries that name in place of the reference
    # to the module's host output, and ORDERS_VAULT_ENDPOINT the URI built on
    # it. The vault keeps this Recipe's defaults, the
    # standard tier, keeping deleted contents for 90 days under purge
    # protection, with public network access on. The DNS record goes into the
    # operator's zone example.com, in the resource group example-rg. Front
    # Door runs on the Standard tier with no firewall policy. The Application
    # Insights component keeps this Recipe's defaults, of type web, keeping
    # every item it is sent, with local authentication on; it publishes no
    # host, so it takes no infra.overrides.host.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, DNS zone,
    # Log Analytics workspace, Container Apps environment, managed identity,
    # container registry and example.com names stand for ones the operator
    # already has.
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              host: orders-vault.example.com

        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg

        edge:
          infra:
            overrides:
              resource_group_name: example-rg

        insights:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
