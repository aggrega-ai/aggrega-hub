# infra.overrides.enable_telemetry, where the module is the catalog's own.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-front-door-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-front-door-only.yaml
  manifest: ./manifest-front-door.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg

        edge:
          infra:
            overrides:
              resource_group_name: example-rg
              enable_telemetry: false
