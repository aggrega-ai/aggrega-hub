# An SRV record with no port.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-srv
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "_sip._tcp.example.com"
        type: SRV
        records:
          - "10 5 sip.example.com"
