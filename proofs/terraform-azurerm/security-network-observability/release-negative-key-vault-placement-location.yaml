# No infra.overrides.location: this Recipe never chooses the operator's
# region.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-placement-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
