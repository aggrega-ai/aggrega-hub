# An SRV record set whose name carries no service and protocol.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-srv-name
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "sip.example.com"
        type: SRV
        records:
          - "10 5 5060 sip.example.com"
