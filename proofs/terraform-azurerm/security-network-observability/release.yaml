apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: security-network-observability
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The Key Vault and DNS record bodies need azurerm 5.14 or later, so
    # their boundary is a Terraform root of its own, with a server on
    # Container Apps of its own reading them; the Container Apps body admits
    # azurerm 5 as well. The DNS record set api is written into the
    # operator's Azure DNS zone example.com, in the resource group example-rg,
    # with metadata naming its environment. The vault runs on the premium
    # tier, keeping deleted contents for 30 days under purge protection. Its
    # public network access is off, so clients reach it through the
    # operator's private endpoint, and it authorizes access with Azure
    # role-based access control, so the server reads its secrets as its
    # managed identity, under a role assignment the operator makes. The
    # server on Container Apps pulls its image with a user-assigned identity.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, DNS zone,
    # Container Apps environment, managed identity and container registry
    # stand for ones the operator already has.
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: premium
              soft_delete_retention_days: 30
              purge_protection_enabled: true
              public_network_access_enabled: false
              tags:
                environment: production

        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
