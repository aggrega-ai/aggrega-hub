apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: security-network-observability
  version: "1.0.0"
  description: >
    Azure through Terraform: Azure Key Vault and the DNS record bound to
    their Recipes, whose modules need azurerm 5.14 or later, and the generic
    server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/security/azure-key-vault:1.0.0: terraform/azure-key-vault:1.0.0
        core/network/dns-record:1.0.0: terraform/dns-record-azure-dns:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
