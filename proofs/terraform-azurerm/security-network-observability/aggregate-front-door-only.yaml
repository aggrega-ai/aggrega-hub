apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: front-door-only
  version: "1.0.0"
  description: >
    An Azure Front Door forwarding to the name a DNS record gives the
    server, for the Releases that prove what the Azure Front Door Recipe
    refuses on its own.
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api.example-environment.example.com

    edge:
      type: core/network/azure-front-door
      uses:
        upstream:
          api-dns:
            target: api-dns
