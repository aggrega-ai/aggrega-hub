# NS records under a wildcard, which Azure DNS does not take for NS.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-ns-wildcard
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-ns-wildcard.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
