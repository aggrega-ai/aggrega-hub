# infra.overrides.enable_telemetry, which a template or module of this catalog's own does not carry.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
              enable_telemetry: false
