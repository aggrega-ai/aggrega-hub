# A component whose name holds an underscore, which a Key Vault name does
# not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-vault-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-key-vault-vault-name.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders_vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
