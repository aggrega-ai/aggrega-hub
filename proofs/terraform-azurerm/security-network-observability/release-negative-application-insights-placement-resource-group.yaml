# No infra.overrides.resource_group_name: this Recipe never chooses the
# operator's resource group.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        insights:
          infra:
            overrides:
              location: westeurope
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace
