# A time to live of 0, which Azure DNS does not take.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-ttl
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: CNAME
        ttl: 0
        records:
          - "api.example-environment.example.com"
