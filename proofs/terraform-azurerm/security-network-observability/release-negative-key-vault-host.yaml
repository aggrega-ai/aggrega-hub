# infra.overrides.host as a URL, where it is a bare DNS name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              host: https://orders-vault.example.com
