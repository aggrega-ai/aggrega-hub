apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: front-door
  version: "1.0.0"
  description: >
    Azure through Terraform: Azure Front Door, the DNS record and the
    generic server bound to their Recipes, for the Releases that prove what
    the Azure Front Door Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/network/azure-front-door:1.0.0: terraform/azure-front-door:1.0.0
        core/network/dns-record:1.0.0: terraform/dns-record-azure-dns:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
