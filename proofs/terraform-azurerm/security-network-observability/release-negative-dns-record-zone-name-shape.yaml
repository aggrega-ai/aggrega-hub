# infra.overrides.zone_name written with a trailing dot, which a zone's name does not carry.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-zone-name-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com.
              resource_group_name: example-rg
