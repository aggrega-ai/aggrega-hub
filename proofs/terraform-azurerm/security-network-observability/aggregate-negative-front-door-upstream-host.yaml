# Front Door wired to the generic server, which publishes nothing across a
# connection, so no host reaches the origin.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-front-door-upstream-host
  version: "1.0.0"
spec:
  components:
    api:
      type: core/compute/server

    edge:
      type: core/network/azure-front-door
      uses:
        upstream:
          api:
            target: api
