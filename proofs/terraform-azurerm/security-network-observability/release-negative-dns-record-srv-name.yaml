# An SRV record set whose name carries no service and protocol.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-srv-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-srv-name.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
