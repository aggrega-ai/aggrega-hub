# An infra.overrides key this Recipe does not read: public_network_access,
# where the key is public_network_access_enabled.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access: Disabled
