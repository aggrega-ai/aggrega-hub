apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: security-network-observability
  version: "1.0.0"
  description: >
    An Azure Key Vault, and a server on Container Apps reading the host name
    and URI the vault publishes, the address its Key Vault client library
    calls for the secrets the server reads. The server's environment shows
    what a consumer receives.
spec:
  components:
    orders-vault:
      type: core/security/azure-key-vault

    api:
      type: core/compute/server
      uses:
        secrets:
          orders-vault:
            target: orders-vault
            inject:
              env:
                - in: ORDERS_VAULT_HOST
                  from: host
                - in: ORDERS_VAULT_ENDPOINT
                  from: endpoint
