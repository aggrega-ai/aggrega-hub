apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: security-network-observability
  version: "1.0.0"
  description: >
    An Azure Key Vault, a DNS record naming the server, an Azure Front Door
    forwarding to that name, an Application Insights component, and a server
    on Container Apps reading the host name and URI the vault publishes, the
    address its Key Vault client library calls for the secrets the server
    reads, the name the record publishes, the host name and address of the
    Front Door endpoint its clients reach it through, and the component's
    connection string, which is declared sensitive and so is delivered as a
    file held in a secret of the app rather than as a variable. The server's
    environment and files show what a consumer receives.
spec:
  components:
    orders-vault:
      type: core/security/azure-key-vault

    # The name clients reach the server at. The server's own address is the
    # name Container Apps gives the app under its environment's domain, known
    # once the app exists, and the record's data is fixed in the Aggregate, so
    # the CNAME names a placeholder in example.com standing for it.
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api.example-environment.example.com

    # The entry point clients reach the server through. Front Door forwards
    # every request to the host its upstream publishes; the generic server
    # publishes none, so the upstream is the record naming it.
    edge:
      type: core/network/azure-front-door
      uses:
        upstream:
          api-dns:
            target: api-dns

    # Where the server sends its telemetry: the component stores it in the
    # operator's Log Analytics workspace.
    insights:
      type: core/observability/azure-application-insights

    api:
      type: core/compute/server
      uses:
        secrets:
          orders-vault:
            target: orders-vault
            inject:
              env:
                - in: ORDERS_VAULT_HOST
                  from: host
                - in: ORDERS_VAULT_ENDPOINT
                  from: endpoint
        dns:
          api-dns:
            target: api-dns
            inject:
              env:
                - in: API_PUBLIC_HOST
                  from: host
        edge:
          edge:
            target: edge
            inject:
              env:
                - in: EDGE_HOST
                  from: host
                - in: EDGE_ENDPOINT
                  from: endpoint
        # The connection string is declared sensitive, so the server reads it
        # from a file, held in a secret of the app, and hands it to its
        # Application Insights SDK, rather than from a variable an app's
        # readers see.
        telemetry:
          insights:
            target: insights
            inject:
              file:
                - in: /etc/api/applicationinsights/connection-string
                  from: connection_string
