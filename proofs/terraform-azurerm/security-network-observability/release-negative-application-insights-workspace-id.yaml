# No infra.overrides.workspace_id: the component stores its telemetry in the
# operator's Log Analytics workspace, which the Release must name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-workspace-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        insights:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
