# NS records under a wildcard, which Azure DNS does not take for NS.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-ns-wildcard
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "*.example.com"
        type: NS
        records:
          - "ns1.example.net"
