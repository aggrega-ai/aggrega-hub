# NS records at the zone's apex, whose NS record set holds the zone's own name servers.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-ns-apex
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-ns-apex.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        api-dns:
          infra:
            overrides:
              zone_name: example.com
              resource_group_name: example-rg
