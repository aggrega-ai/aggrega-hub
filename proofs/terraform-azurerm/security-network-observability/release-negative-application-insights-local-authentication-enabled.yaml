# infra.overrides.local_authentication_enabled given as a word, not a
# boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-application-insights-local-authentication-enabled
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-application-insights-only.yaml
  manifest: ./manifest-application-insights.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        insights:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              workspace_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.OperationalInsights/workspaces/example-workspace
              local_authentication_enabled: disabled
