# No infra.overrides.resource_group_name: this Recipe never chooses the
# operator's resource group.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-key-vault-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-key-vault-only.yaml
  manifest: ./manifest-key-vault.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        orders-vault:
          infra:
            overrides:
              location: westeurope
