apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-collision
  version: "1.0.0"
  description: >
    A socket default the component's own inject block dictates as well.
spec:
  components:
    cache:
      type: core/datastore/redis
    product:
      type: example/compute/sample-product
      inject:
        env:
          - in: SAMPLE_CACHE_HOST
            value: placeholder
      uses:
        cache:
          sessions:
            target: cache
