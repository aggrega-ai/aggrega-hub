apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-value-collision-worker
  version: "1.0.0"
  description: >
    A worker value's default name a connection dictates as well.
spec:
  components:
    cache:
      type: core/datastore/redis
    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        cache:
          sessions:
            target: cache
            inject:
              env:
                - in: WORKER_CONCURRENCY
                  from: port
