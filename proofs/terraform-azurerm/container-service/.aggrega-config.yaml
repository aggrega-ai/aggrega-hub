# This fixture is a workspace of its own. Its catalog is first its own
# catalog/, holding a placeholder product and the Recipes realizing it on the
# shared Azure Container Apps shape as a product Recipe would, then this
# repository's aggrega-catalog/, so every other entity it builds is the one
# the catalog holds beside it; the hub registry supplies anything neither
# carries.
workspace:
  catalog_dirs:
    - ./catalog
    - ../../../aggrega-catalog
default_registry: hub.aggrega.ai
