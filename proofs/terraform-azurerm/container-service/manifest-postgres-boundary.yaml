apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-boundary
  version: "1.0.0"
  description: >
    The generic server and worker bound to their Container Apps Recipes, the
    placeholder product's job to its job Recipe by name, and PostgreSQL to the
    flexible server, whose password slot holds core/random-password bound to the
    FeatureRecipe that draws it with the random provider.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
      name:
        nightly: terraform/sample-product-job-container-apps:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
