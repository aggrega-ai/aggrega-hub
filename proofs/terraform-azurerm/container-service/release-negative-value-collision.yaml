# An own value's default name a connection dictates as well.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-value-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-value-collision.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        peer:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
        product:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
