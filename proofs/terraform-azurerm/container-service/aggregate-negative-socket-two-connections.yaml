apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-two-connections
  version: "1.0.0"
  description: >
    Two connections on one socket, both taking the default names.
spec:
  components:
    cache:
      type: core/datastore/redis
    product:
      type: example/compute/sample-product
      uses:
        cache:
          sessions:
            target: cache
          other:
            target: cache
