# An app whose component name is longer than Container Apps takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-app
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-app.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        sample-product-app-named-beyond-its-limit:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
