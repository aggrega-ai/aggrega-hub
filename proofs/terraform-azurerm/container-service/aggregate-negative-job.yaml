apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-job
  version: "1.0.0"
  description: >
    The placeholder product alone as a scheduled job, for the negative Releases
    whose fault lies in its Release.
spec:
  components:
    nightly:
      type: example/compute/sample-product
      values:
        schedule: "30 2 * * *"
