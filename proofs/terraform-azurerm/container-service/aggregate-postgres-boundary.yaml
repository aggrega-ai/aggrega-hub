apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-boundary
  version: "1.0.0"
  description: >
    The generic server and worker and the placeholder product as a scheduled
    job, beside the PostgreSQL database the server and the worker use, so one
    terraform boundary holds the Container Apps bodies and the flexible server.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    nightly:
      type: example/compute/sample-product
      values:
        workers: 1
        schedule: "30 2 * * *"

    api:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port

    jobs:
      type: core/compute/worker
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
