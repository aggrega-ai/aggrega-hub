# A product Recipe declaring socket_env with a variable name where a table belongs.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-fault-socket-env
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: ./manifest-negative-fault-socket-env.yaml
  boundaries:
    azurerm:
      directory: main
      components:
        product:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
