apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-container-apps
  version: 1.0.0
  description: >
    The placeholder product as one Azure container app, written as a product
    Recipe on the shared Container Apps shape: the fixed pass-through module,
    the App body from ContainerAppModule, the AppArguments entry from
    ContainerAppArguments, the locals that entry reads, and the azurerm
    provider configuration at the boundary's root.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0

  # The fixed pass-through: its config input goes to the body under service,
  # and the body comes back out as its service output.
  source: ./module

  artifacts:
    service:
      $import: ContainerAppModule#/artifacts/App

  # What the product fixes, read by ContainerAppArguments#/mappings/AppArguments:
  # its image while infra.image is unset, the port it listens on, the variables
  # its own values and its cache connection reach it as, and the path it
  # answers its probes on.
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"cache": {"SAMPLE_CACHE_HOST": "host", "SAMPLE_CACHE_PORT": "port", "SAMPLE_CACHE_PROTOCOL": "protocol"}}'
    probe_path: /healthz

  # The address the app's internal ingress answers at, read off the body's
  # fqdn output through the pass-through's service output.
  provides:
    endpoint: "https://${module.{{ .context.instance_id }}.service.fqdn}"

  valuesMapping:
    $import: ContainerAppArguments#/mappings/AppArguments

  # The azurerm provider refuses to plan without its features block, and the
  # body carries no provider block, so the provider is configured once at the
  # boundary's root, in the bytes every Azure Recipe of the catalog writes
  # under this name.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
