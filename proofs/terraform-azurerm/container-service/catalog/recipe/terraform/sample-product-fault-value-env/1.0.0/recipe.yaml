apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-value-env
  version: 1.0.0
  description: >
    A product Recipe declaring a value table that is not one. It is reached only by the negative Release
    release-negative-fault-value-env.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0
  source: ./module
  artifacts:
    service:
      $import: ContainerAppModule#/artifacts/App
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    container_port: "8080"
    value_env: '["values.greeting"]'
    socket_env: '{"cache": {"SAMPLE_CACHE_HOST": "host", "SAMPLE_CACHE_PORT": "port", "SAMPLE_CACHE_PROTOCOL": "protocol"}}'
  provides:
    endpoint: ""
  valuesMapping:
    $import: ContainerAppArguments#/mappings/AppArguments
