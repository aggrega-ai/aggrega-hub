apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-probe-port
  version: 1.0.0
  description: >
    A product Recipe declaring a probe path with no port to request it on. It is reached only by the negative Release
    release-negative-fault-probe-port.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0
  source: ./module
  artifacts:
    service:
      $import: ContainerAppModule#/artifacts/App
  locals:
    default_image: example.azurecr.io/example/sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"cache": {"SAMPLE_CACHE_HOST": "host", "SAMPLE_CACHE_PORT": "port", "SAMPLE_CACHE_PROTOCOL": "protocol"}}'
    probe_path: /healthz
  provides:
    endpoint: ""
  valuesMapping:
    $import: ContainerAppArguments#/mappings/AppArguments
