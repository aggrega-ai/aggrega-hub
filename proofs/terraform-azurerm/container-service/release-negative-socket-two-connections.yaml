# Two connections on one socket, both taking the default names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-socket-two-connections
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-socket-two-connections.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        cache:
          infra:
            client_tls: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
        product:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
