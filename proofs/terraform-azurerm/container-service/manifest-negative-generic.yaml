apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative-generic
  version: "1.0.0"
  description: >
    The generic server and worker bound to their Container Apps Recipes, for
    the negative Releases whose fault lies in one of them.
spec:
  extends: negative
  mappings:
    components:
      type:
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
