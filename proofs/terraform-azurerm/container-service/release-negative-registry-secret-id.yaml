# A registry password secret named by other than its Key Vault ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-registry-secret-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        product:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              registry_server: example.azurecr.io
              registry_username: example-pull
              registry_password_secret_id: registry-password
              registry_password_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-vault-reader
