apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-fault-socket-key
  version: "1.0.0"
  description: >
    A product Recipe delivering a key its socket's target does not publish.
spec:
  components:
    cache:
      type: core/datastore/redis
    product:
      type: example/compute/sample-product
      uses:
        cache:
          sessions:
            target: cache
