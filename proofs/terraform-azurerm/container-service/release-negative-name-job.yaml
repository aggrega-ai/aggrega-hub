# A job whose component name is longer than this realization takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-job
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-job.yaml
  manifest: ./manifest-negative-name-job.yaml
  boundaries:
    azurerm:
      directory: main
      components:
        nightly-run-of-the-sample-product-job:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              location: westeurope
