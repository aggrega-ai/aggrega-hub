# An app with no Container Apps environment named.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-environment-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        product:
          infra:
            overrides:
              resource_group_name: example-rg
