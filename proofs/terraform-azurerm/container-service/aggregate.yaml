apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    Containers on Azure Container Apps through the shared Container Apps
    shape, beside the Redis cache they use: the generic server and worker,
    each handed its cache as its inject blocks dictate, variables and files
    alike, and the placeholder product as an app, as a scheduled job and as a
    job the operator starts, each delivered its cache by its Recipe's
    default names.
spec:
  components:
    cache:
      type: core/datastore/redis

    # The product's cache connection dictates nothing, so the Recipe delivers
    # it under its own default names, and its greeting reaches it as a file its
    # own inject block names rather than as SAMPLE_GREETING.
    product:
      type: example/compute/sample-product
      values:
        greeting: hello from the fixture
        workers: 3
      inject:
        file:
          - in: /etc/sample/greeting.txt
            value: '{{"{{"}} .values.greeting }}'
      uses:
        cache:
          sessions:
            target: cache

    # The schedule becomes the job's cron expression, which Container Apps
    # evaluates in UTC.
    nightly:
      type: example/compute/sample-product
      values:
        workers: 1
        schedule: "30 2 * * *"
      uses:
        cache:
          sessions:
            target: cache

    # With no schedule, the job's trigger is manual: the operator starts each
    # execution.
    backfill:
      type: example/compute/sample-product
      values:
        workers: 2
      uses:
        cache:
          sessions:
            target: cache

    # The server is handed its cache under the names its connection dictates,
    # the cache's protocol as a file, and the product's address, which the
    # product's Recipe reads off its app's fqdn.
    api:
      type: core/compute/server
      uses:
        cache:
          sessions:
            target: cache
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
              file:
                - in: /etc/api/cache/protocol
                  from: protocol
        products:
          product:
            target: product
            inject:
              env:
                - in: SAMPLE_ENDPOINT
                  from: endpoint

    # The worker's concurrency reaches it as WORKER_CONCURRENCY, its default
    # name, beside what its connection dictates.
    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        cache:
          sessions:
            target: cache
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
              file:
                - in: /etc/jobs/cache/port
                  from: port
