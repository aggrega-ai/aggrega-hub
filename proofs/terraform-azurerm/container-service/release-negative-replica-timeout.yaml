# A job whose deadline is written in minutes rather than as a number of
# seconds.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-replica-timeout
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-job.yaml
  manifest: ./manifest-negative-job.yaml
  boundaries:
    azurerm:
      directory: main
      components:
        nightly:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              location: westeurope
              replica_timeout_in_seconds: 45m
