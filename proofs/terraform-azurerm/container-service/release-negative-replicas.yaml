# More replicas than the azurerm provider takes for a container app.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-replicas
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: negative
  boundaries:
    azurerm:
      directory: main
      components:
        product:
          infra:
            replicas: 301
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
