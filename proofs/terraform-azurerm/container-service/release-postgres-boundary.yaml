apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres-boundary
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-boundary.yaml
  manifest: ./manifest-postgres-boundary.yaml
  boundaries:
    # One boundary holds the Container Apps bodies, App and Job, beside the
    # PostgreSQL flexible server, whose module admits azurerm 4 alone, so the
    # root selects azurerm 4.81.0 where release.yaml selects 5.14.0.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone and Container Apps environment stand
    # for ones the operator already has.
    azurerm:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
              enable_telemetry: false
        nightly:
          infra:
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              location: westeurope
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
        jobs:
          infra:
            image: example.azurecr.io/example/jobs:1.0.0
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
