apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through Terraform: the generic server and worker bound to their
    Container Apps Recipes, the placeholder product to its app Recipe, and the
    nightly and backfill components of the same type, by name, to its job
    Recipe; Redis to Azure Managed Redis.
spec:
  mappings:
    components:
      type:
        core/datastore/redis:1.0.0: terraform/redis-azure-managed:1.0.2
        example/compute/sample-product:1.0.0: terraform/sample-product-container-apps:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
      name:
        nightly: terraform/sample-product-job-container-apps:1.0.0
        backfill: terraform/sample-product-job-container-apps:1.0.0
