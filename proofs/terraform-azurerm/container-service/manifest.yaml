apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through Terraform: the placeholder product bound to its app Recipe,
    and the nightly and backfill components of the same type, by name, to its
    job Recipe; Redis to Azure Managed Redis.
spec:
  mappings:
    components:
      type:
        core/datastore/redis:1.0.0: terraform/redis-azure-managed:1.0.2
        example/compute/sample-product:1.0.0: terraform/sample-product-container-apps:1.0.0
      name:
        nightly: terraform/sample-product-job-container-apps:1.0.0
        backfill: terraform/sample-product-job-container-apps:1.0.0
