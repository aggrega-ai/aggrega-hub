# A backup scheduled at a time, which the service chooses itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-backup-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres-backup.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                schedule: "0 3 * * *"
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
