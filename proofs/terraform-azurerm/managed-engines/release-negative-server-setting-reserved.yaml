# A variable named websites_port, which App Service reads as its own
# WEBSITES_PORT setting.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-setting-reserved
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server-setting-reserved.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
