apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mysql-custom-config
  version: "1.0.0"
  description: >
    A MySQL database whose values ask for a configuration file a flexible
    server does not read.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
        custom_config: "max_connections = 100\n"
