apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: mysql
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 5: MySQL bound to the flexible server,
    whose root_password slot holds core/random-password bound to the
    FeatureRecipe that draws it with the random provider, core/backup bound to
    the service's own automated backups, and the generic worker bound to its
    Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql:1.0.0: terraform/mysql-flexible-server:1.0.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
