# A delegated_subnet_id that is no subnet's resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-subnet-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
          infra:
            storage:
              size: 20Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: example-subnet
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
