apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-server-name
  version: "1.0.0"
  description: >
    A PostgreSQL database whose component name is one a flexible server's name
    does not take.
spec:
  components:
    Orders-DB:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
