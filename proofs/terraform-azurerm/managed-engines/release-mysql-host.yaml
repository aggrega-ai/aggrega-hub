apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-host.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    # The operator names the database server in infra.overrides.host, so the
    # App Service app's CATALOG_DB_HOST carries that name in place of the
    # reference to the module's fqdn output. The database server runs with
    # zone-redundant high availability. The app pulls its image with a user
    # name and a password read from Key Vault, and so does the function app,
    # whose ORDERS_DB_HOST carries the same name; its host reaches the storage
    # account with the one identity it is given.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, App Service plan, function plan,
    # storage account, managed identities, container registry, Key Vault and
    # its secret and example.com name stand for ones the operator already
    # has.
    azurerm5:
      directory: azurerm5
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
          infra:
            storage:
              size: 20Gi
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              host: catalog-db.example.com
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            port: 8000
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              registry_server: example.azurecr.io
              registry_username: example-pull
              registry_password_secret_id: https://example-vault.vault.azure.net/secrets/registry-password
              registry_password_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
        order-events:
          infra:
            image: example.azurecr.io/example/order-events:1.0.0
            port: 8000
            min_replicas: 1
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-functions-plan
              storage_account_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Storage/storageAccounts/examplefunctions
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-functions-identity
              registry_server: example.azurecr.io
              registry_username: example-pull
              registry_password_secret_id: https://example-vault.vault.azure.net/secrets/registry-password
              registry_password_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
