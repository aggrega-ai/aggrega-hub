# A credential of another type in the root_password slot.
#
# The mapping's refusal of a root_password attachment that publishes no module
# output is held by no negative, since no Release built from the catalog's
# entities reaches it: the credentials check admits core/random-password alone,
# bound to terraform/random-password, which publishes its module and the key the
# Feature defaults.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-versioned-password-mysql-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-versioned-password-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            storage:
              size: 20Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
