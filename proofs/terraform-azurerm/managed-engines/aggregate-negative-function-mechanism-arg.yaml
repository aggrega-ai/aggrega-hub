apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-mechanism-arg
  version: "1.0.0"
  description: >
    A connection dictating a command-line argument to a function on Azure
    Functions.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    order-events:
      type: core/compute/function
      values:
        runtime: python
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              arg:
                - in: --orders-host
                  from: host
