apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: versioned-password-mysql
  version: "1.0.0"
  description: >
    The MySQL flexible server at 1.0.1 with core/random-password and core/generated-secret bound, for the Releases that attach the root_password slot with a versioned type or with a credential of another type.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql:1.0.0: terraform/mysql-flexible-server:1.0.1
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
