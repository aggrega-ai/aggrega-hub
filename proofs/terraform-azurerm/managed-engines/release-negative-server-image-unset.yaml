# No image, which this Recipe holds no default for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-image-unset
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-server-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
