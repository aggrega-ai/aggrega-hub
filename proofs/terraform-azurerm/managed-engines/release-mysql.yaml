apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: mysql
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    # The flexible server's module declares azurerm at the catalog's Azure
    # constraint, so its boundary is a Terraform root apart from the
    # PostgreSQL flexible server's, whose module admits azurerm 4 alone; the
    # App Service app's module and the Azure OpenAI body share it. The
    # database server keeps its backups 14 days and sets one server parameter.
    # The App Service app joins an integration subnet and pulls its image with
    # a user-assigned identity, which is also the one its code calls Azure
    # with.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnets, private DNS zone, App Service plan, managed identity
    # and container registry stand for ones the operator already has.
    azurerm5:
      directory: azurerm5
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            storage:
              size: 20Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
              server_configuration:
                slow_query_log:
                  name: slow_query_log
                  config: "ON"

        chat-model:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              custom_subdomain_name: example-chat

        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              virtual_network_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-apps
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
