apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative-postgres-password
  version: "1.0.0"
  description: >
    The PostgreSQL manifest with core/generated-secret bound too, so that a
    credential of another type than the flexible server's Recipe takes can fill
    its password slot.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.1.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
        core/compute/task:1.0.1: terraform/task-container-apps:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
