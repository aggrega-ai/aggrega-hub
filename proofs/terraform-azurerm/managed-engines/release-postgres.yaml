apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    # The flexible server's module admits azurerm 4 alone, so its boundary is a
    # Terraform root of its own, apart from the bodies at azurerm 5. Nothing
    # under infra.overrides sets the module's telemetry, so it renders off.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet and private DNS zone stand for ones the operator already
    # has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
