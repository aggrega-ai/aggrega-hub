apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    # The flexible server's module admits azurerm 4 alone, so its boundary is a
    # Terraform root of its own, apart from the bodies at azurerm 5; the
    # Container Apps job body admits azurerm 4 as well, so the tasks share it.
    # Nothing under infra.overrides sets the module's telemetry, so it renders
    # off. The scheduled task pulls its image with a user-assigned identity,
    # which is also the one its code calls Azure with, and each run may last
    # an hour; the task the operator starts keeps the 30 minutes the job
    # takes by default.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Container Apps environment, managed
    # identity and container registry stand for ones the operator already
    # has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com

        nightly-report:
          infra:
            image: example.azurecr.io/example/nightly-report:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              replica_timeout_in_seconds: 3600

        reindex:
          infra:
            image: example.azurecr.io/example/reindex:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
