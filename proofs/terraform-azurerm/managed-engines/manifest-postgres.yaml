apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 4: PostgreSQL bound to the flexible
    server, whose password slot holds core/random-password bound to the
    FeatureRecipe that draws it with the random provider, the generic worker
    bound to its Container Apps Recipe, and the generic task bound to its
    Container Apps job Recipe, with core/manual-trigger bound to the
    FeatureRecipe that holds an unscheduled task until the operator starts a
    run.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.1.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
        core/compute/task:1.0.1: terraform/task-container-apps:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.0.0
