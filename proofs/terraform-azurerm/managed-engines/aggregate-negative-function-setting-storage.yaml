apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-setting-storage
  version: "1.0.0"
  description: >
    A function on Azure Functions whose own inject block names a variable
    beneath AzureWebJobsStorage, the host storage connection this Recipe sets.
spec:
  components:
    order-events:
      type: core/compute/function
      values:
        runtime: python
      inject:
        env:
          - in: AzureWebJobsStorage__blobServiceUri
            value: https://examplefunctions.blob.core.windows.net
