apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    A PostgreSQL database on an Azure flexible server, and two tasks on
    Container Apps reading the address it publishes: one on a schedule, one
    started by the operator. Each task's environment shows the reference a
    consumer on the same terraform boundary receives.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    nightly-report:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"
        timeout: 45m
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database

    reindex:
      type: core/compute/task
      features:
        on_demand:
          type: core/manual-trigger
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
