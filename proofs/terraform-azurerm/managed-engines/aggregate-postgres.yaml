apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    A PostgreSQL database on an Azure flexible server, which its consumers on
    the same terraform boundary reach at the address it publishes.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
