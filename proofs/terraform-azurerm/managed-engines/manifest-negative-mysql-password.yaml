apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: negative-mysql-password
  version: "1.0.0"
  description: >
    The MySQL manifest with core/generated-secret bound too, so that a credential
    of another type than the flexible server's Recipe takes can fill its
    password slot.
spec:
  mappings:
    components:
      type:
        core/datastore/mysql:1.0.0: terraform/mysql-flexible-server:1.0.0
        core/ai-model/azure-openai:1.0.0: terraform/azure-openai:1.0.0
        core/compute/server:1.1.0: terraform/server-app-service:1.0.0
        core/compute/function:1.0.0: terraform/function-azure-functions:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
