apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-host
  version: "1.0.0"
  description: >
    A PostgreSQL database on an Azure flexible server, and a worker and a
    scheduled task reading the address it publishes, so their environments
    show the address a consumer receives.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    reports:
      type: core/compute/worker
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port

    nightly-report:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
