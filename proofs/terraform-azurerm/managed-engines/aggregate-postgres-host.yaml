apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-host
  version: "1.0.0"
  description: >
    A PostgreSQL database on an Azure flexible server and a worker reading the
    address it publishes, so the worker's environment shows the address a
    consumer receives.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    reports:
      type: core/compute/worker
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
