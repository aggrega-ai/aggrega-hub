apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-init-scripts
  version: "1.0.0"
  description: >
    A PostgreSQL database whose values ask for initialisation scripts a
    flexible server does not run.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
        init_scripts:
          01-schema.sql: "CREATE TABLE example (id INT);"
