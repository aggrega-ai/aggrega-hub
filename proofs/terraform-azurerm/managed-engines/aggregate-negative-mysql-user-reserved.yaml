apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mysql-user-reserved
  version: "1.0.0"
  description: >
    A MySQL database whose administrator login is sa, a name the flexible
    server reserves.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: sa
