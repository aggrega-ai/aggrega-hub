# A registry password written as text, which this Recipe takes only by a
# Key Vault reference.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-function-registry-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-function-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        order-events:
          infra:
            image: example.azurecr.io/example/order-events:1.0.0
            min_replicas: 1
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-functions-plan
              storage_account_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Storage/storageAccounts/examplefunctions
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
              registry_password: placeholder
