apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: postgres-only
  version: "1.0.0"
  description: >
    A PostgreSQL database alone, for the Releases that prove what the flexible
    server's Recipe renders and refuses on its own.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
