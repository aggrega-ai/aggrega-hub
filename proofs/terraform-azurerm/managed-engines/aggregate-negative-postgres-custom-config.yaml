apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-custom-config
  version: "1.0.0"
  description: >
    A PostgreSQL database whose values ask for a configuration file a flexible
    server does not read.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
        custom_config: "max_connections = 100\n"
