# A connection dictating a command-line argument.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-function-mechanism-arg
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-function-mechanism-arg.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        catalog-db:
          features:
            root_password:
              type: core/random-password
          infra:
            storage:
              size: 20Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-mysql
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.mysql.database.azure.com
        order-events:
          infra:
            image: example.azurecr.io/example/order-events:1.0.0
            min_replicas: 1
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-functions-plan
              storage_account_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Storage/storageAccounts/examplefunctions
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-identity
