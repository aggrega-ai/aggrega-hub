# A credential of another type in the password slot.
#
# The mapping's refusal of a password attachment that publishes no module output
# is held by no negative, since no Release built from the catalog's entities
# reaches it: the credentials check admits core/random-password alone, bound to
# terraform/random-password, which publishes its module and the key the Feature
# defaults.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-password-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-negative-postgres-password.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
