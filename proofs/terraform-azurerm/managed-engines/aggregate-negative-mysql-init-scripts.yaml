apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mysql-init-scripts
  version: "1.0.0"
  description: >
    A MySQL database whose values ask for initialisation scripts a flexible
    server does not run.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
        init_scripts:
          01-schema.sql: "CREATE TABLE example (id INT);"
