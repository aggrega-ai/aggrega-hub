apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-backup
  version: "1.0.0"
  description: >
    The PostgreSQL manifest with core/backup bound to the FeatureRecipe that
    leaves a server's backup to the service, for the Releases that prove what
    the flexible server's Recipe refuses of a backup.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.1.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.1.0
        core/compute/task:1.0.1: terraform/task-container-apps:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
