apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-user-reserved
  version: "1.0.0"
  description: >
    A PostgreSQL database whose user is a login the provider refuses for the
    administrator.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: admin
