apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: function-only
  version: "1.0.0"
  description: >
    A function alone, for the Releases that prove what the Azure Functions
    Recipe refuses on its own.
spec:
  components:
    order-events:
      type: core/compute/function
      values:
        runtime: python
