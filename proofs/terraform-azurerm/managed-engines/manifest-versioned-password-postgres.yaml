apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: versioned-password-postgres
  version: "1.0.0"
  description: >
    The PostgreSQL flexible server at 1.1.1 with core/random-password and core/generated-secret bound, for the Releases that attach the password slot with a versioned type or with a credential of another type.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.1.1
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
