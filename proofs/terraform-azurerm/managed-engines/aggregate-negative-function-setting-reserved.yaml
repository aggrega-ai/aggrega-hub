apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-function-setting-reserved
  version: "1.0.0"
  description: >
    A function on Azure Functions whose own inject block names a variable
    the azurerm provider sets itself, spelt in lower case.
spec:
  components:
    order-events:
      type: core/compute/function
      values:
        runtime: python
      inject:
        env:
          - in: functions_extension_version
            value: "~4"
