apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server, a chat model on Azure
    OpenAI, and a server on App Service and a function on Azure Functions
    reading the addresses both publish, so the app settings of each show the
    reference a consumer on the same terraform boundary receives.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin

    chat-model:
      type: core/ai-model/azure-openai
      values:
        model: gpt-4o-mini
        deployment_name: chat

    storefront:
      type: core/compute/server
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
                - in: CATALOG_DB_PORT
                  from: port
                - in: CATALOG_DB_NAME
                  from: database
        chat:
          chat-model:
            target: chat-model
            inject:
              env:
                - in: CHAT_ENDPOINT
                  from: endpoint
                - in: CHAT_MODEL
                  from: model

    order-events:
      type: core/compute/function
      values:
        runtime: python
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
        chat:
          chat-model:
            target: chat-model
            inject:
              env:
                - in: CHAT_ENDPOINT
                  from: endpoint
                - in: CHAT_MODEL
                  from: model
