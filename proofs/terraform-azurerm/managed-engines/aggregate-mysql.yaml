apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql
  version: "1.0.0"
  description: >
    A MySQL database on an Azure flexible server, which its consumers on the
    same terraform boundary reach at the address it publishes.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog
        user: catalog_admin
