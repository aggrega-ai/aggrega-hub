apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-server-setting-name
  version: "1.0.0"
  description: >
    A server on App Service whose own inject block names a variable with a
    hyphen, which App Service does not take as an app setting name.
spec:
  components:
    storefront:
      type: core/compute/server
      inject:
        env:
          - in: STOREFRONT-REGION
            value: westeurope
