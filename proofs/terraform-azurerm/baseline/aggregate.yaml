apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    The Components the catalog realizes on Azure through Terraform: a PostgreSQL
    database, a Redis cache, a chat model, an embedding model, an API
    Management gateway in front of the chat model, a server and a worker. The
    server uses the database and the chat model; the worker uses the cache and
    the embedding model.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    sessions:
      type: core/datastore/redis

    chat-model:
      type: core/ai-model/azure-openai
      values:
        model: gpt-4o-mini
        deployment_name: chat

    embedding-model:
      type: core/ai-model/azure-openai-embedding
      values:
        model: text-embedding-3-small
        deployment_name: embedding

    chat-gateway:
      type: core/gateway/azure-api-management
      values:
        model: chat

    api:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_USER
                  from: user
                - in: ORDERS_DB_NAME
                  from: database
        chat:
          chat-model:
            target: chat-model
            inject:
              env:
                - in: CHAT_ENDPOINT
                  from: endpoint
                - in: CHAT_MODEL
                  from: model

    jobs:
      type: core/compute/worker
      uses:
        sessions:
          sessions:
            target: sessions
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        embedding:
          embedding-model:
            target: embedding-model
            inject:
              env:
                - in: EMBEDDING_ENDPOINT
                  from: endpoint
                - in: EMBEDDING_MODEL
                  from: model
