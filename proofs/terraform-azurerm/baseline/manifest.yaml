apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    Azure through Terraform: each Component type bound to the newest version of
    the catalog's Recipe realizing it there, and core/random-password to the
    FeatureRecipe that draws a password with the random provider. Each
    component of the Aggregate has a type of its own, so the type tier binds
    them all.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.0.0
        core/datastore/redis:1.0.0: terraform/redis-azure-managed:1.0.2
        core/ai-model/azure-openai:1.0.0: terraform/azure-openai:1.0.0
        core/ai-model/azure-openai-embedding:1.0.0: terraform/azure-openai-embedding:1.0.0
        core/gateway/azure-api-management:1.0.0: terraform/azure-api-management:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.1.0
        core/compute/worker:1.0.0: terraform/worker-container-apps:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
