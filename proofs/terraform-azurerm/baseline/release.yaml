apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # Two directories, so two Terraform roots, because one root installs one
    # azurerm: the PostgreSQL flexible server's module admits azurerm 4 alone
    # and the API Management, Azure OpenAI and Managed Redis Recipes need
    # azurerm 5. The container apps admit either, so the server sits beside the
    # database it uses and the worker beside the cache and the model it uses.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, virtual
    # network, subnet, private DNS zone, Container Apps environment and API
    # Management instance stand for ones the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
              enable_telemetry: false
        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            replicas: 2
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment

    azurerm5:
      directory: azurerm5
      components:
        sessions:
          infra:
            client_tls: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
        chat-model:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              custom_subdomain_name: example-chat
        embedding-model:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              custom_subdomain_name: example-embedding
        chat-gateway:
          infra:
            api_management_name: example-apim
            api_path: chat
            resource_group_name: example-rg
            backend_url: https://example-chat.openai.azure.com/openai/v1
            backend_authentication: managed_identity
        jobs:
          infra:
            image: example.azurecr.io/example/jobs:1.0.0
            replicas: 1
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
