# Seven replicas of six partitions, 42 search units, above the 36 a
# service is given.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-search-units
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              replica_count: 7
              partition_count: 6
