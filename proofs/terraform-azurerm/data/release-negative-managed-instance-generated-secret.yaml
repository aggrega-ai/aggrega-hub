# core/generated-secret on the password slot, which states the service keeps
# the password, which it does not.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-managed-instance-generated-secret
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-managed-instance-only.yaml
  manifest: ./manifest-managed-instance.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/generated-secret
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
