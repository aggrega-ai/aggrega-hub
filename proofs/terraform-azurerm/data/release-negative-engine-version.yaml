# SQL Server 2019, a release Azure SQL Database does not choose between: it
# runs the service's own engine.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "2019"
            overrides:
              resource_group_name: example-rg
              location: westeurope
