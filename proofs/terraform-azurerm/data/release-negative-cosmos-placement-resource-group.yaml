# No infra.overrides.resource_group_name, which places the account.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          infra:
            overrides:
              location: westeurope
