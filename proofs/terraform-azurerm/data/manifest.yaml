apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: data
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 4: SQL Server bound to Azure SQL
    Database, whose password slot holds core/random-password bound to the
    FeatureRecipe that draws it with the random provider, or
    core/generated-secret, which leaves the module to draw it; core/backup
    bound to the FeatureRecipe that leaves the backup to the service's own;
    and the generic server bound to its Container Apps Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: terraform/sql-server-azure-sql-database:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
        core/secret-value:1.0.0: terraform/variable-secret:1.0.0
