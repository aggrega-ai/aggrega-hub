# A core/backup attachment keeping a continuous backup 14 days, a tier
# the service does not keep.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-backup-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
