# A password of 12 characters, shorter than the 16 the service takes.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-managed-instance-password-length
  version: "1.0.0"
  description: >
    A SQL Server database whose administrator's password is drawn 12
    characters long.
spec:
  components:
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
      features:
        password:
          type: core/random-password
          values:
            length: 12
