# The delegated subnet named by its name rather than its resource ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-managed-instance-subnet-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-managed-instance-only.yaml
  manifest: ./manifest-managed-instance.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: example-managed-instance
