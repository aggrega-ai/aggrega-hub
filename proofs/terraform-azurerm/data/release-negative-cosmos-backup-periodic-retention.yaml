# A core/backup attachment keeping each periodic backup 31 days, past the
# 720 hours the service keeps one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-backup-periodic-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 31
                point_in_time_recovery: false
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
