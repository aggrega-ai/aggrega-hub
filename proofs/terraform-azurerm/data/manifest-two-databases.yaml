apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: data-two-databases
  version: "1.0.0"
  description: >
    Azure through Terraform, for the Aggregate holding two SQL Server
    databases: SQL Server bound to Azure SQL Database, on azurerm 4, whose
    password slot holds core/random-password bound to the FeatureRecipe that
    draws it with the random provider, or core/generated-secret, which leaves
    the module to draw it; the ledger-db component bound to Azure SQL Managed
    Instance, on azurerm 5, whose password slot holds core/random-password;
    core/backup bound to the FeatureRecipe that leaves the backup to the
    service's own; and the generic server bound to its Container Apps Recipe,
    which admits either.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: terraform/sql-server-azure-sql-database:1.0.0
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
      name:
        ledger-db: terraform/sql-server-azure-sql-managed-instance:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
