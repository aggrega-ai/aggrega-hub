# A backup time on the M30 tier, which Azure DocumentDB chooses itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-backup-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                schedule: "30 2 * * *"
                retention_days: 35
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
