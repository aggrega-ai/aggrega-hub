apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: documentdb-only
  version: "1.0.0"
  description: >
    An Azure DocumentDB cluster alone, for the Releases that prove what the
    Azure DocumentDB Recipe refuses on its own.
spec:
  components:
    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin
