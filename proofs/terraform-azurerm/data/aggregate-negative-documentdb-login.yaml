apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-documentdb-login
  version: "1.0.0"
  description: >
    An Azure DocumentDB cluster whose administrator login holds a period,
    which the module's rule for a login does not take.
spec:
  components:
    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog.admin
