# No resource group named, which this Recipe never chooses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-placement
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              location: westeurope
