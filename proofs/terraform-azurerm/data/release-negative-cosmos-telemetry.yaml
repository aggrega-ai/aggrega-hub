# infra.overrides.enable_telemetry as a string, where it is a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              enable_telemetry: "yes"
