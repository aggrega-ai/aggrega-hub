# Backups kept 14 days on the Basic tier, which keeps them 7 at most.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-basic
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            storage:
              size: 2Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Basic
