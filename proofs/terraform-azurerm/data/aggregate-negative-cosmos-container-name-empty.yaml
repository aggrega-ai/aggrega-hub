apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cosmos-container-name-empty
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account declaring a container with an empty name,
    which the service does not take.
spec:
  components:
    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
        containers:
          "":
            partition_key_paths: [/tenantId]
