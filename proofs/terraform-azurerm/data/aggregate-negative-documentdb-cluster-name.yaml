apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-documentdb-cluster-name
  version: "1.0.0"
  description: >
    An Azure DocumentDB cluster whose component name holds an underscore,
    which a cluster name does not take.
spec:
  components:
    catalog_docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin
