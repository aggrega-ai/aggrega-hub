# The administrator login named dbo, the user SQL Server keeps in every
# database.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-login
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-login.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
