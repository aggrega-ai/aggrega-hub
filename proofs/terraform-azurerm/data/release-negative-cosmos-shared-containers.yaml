# 26 containers sharing the database's throughput, one more than the
# service takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-shared-containers
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cosmos-shared-containers.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              throughput: 1000
