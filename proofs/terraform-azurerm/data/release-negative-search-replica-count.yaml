# infra.overrides.replica_count of zero, below the one replica a service
# runs.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-replica-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              replica_count: 0
