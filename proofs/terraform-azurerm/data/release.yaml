apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-two-databases.yaml
  boundaries:
    # The SQL server module admits azurerm 4 alone, so its boundary is a
    # Terraform root of its own, apart from the bodies at azurerm 5; the
    # Container Apps body admits azurerm 4 as well, so the server shares it.
    # The database runs on four vCores of the Business Critical tier with
    # 64 GiB of storage and keeps its backups 14 days; its administrator's
    # password is drawn at apply time by core/random-password. Nothing under
    # infra.overrides sets the module's telemetry, so it renders off. The
    # server on Container Apps pulls its image with a user-assigned identity.
    #
    # The Azure DocumentDB cluster shares the boundary, since its module also
    # admits azurerm 4 alone. It runs two shards on the M40 tier, each with
    # 256 GiB of storage and a standby, on MongoDB 8.0, with public network
    # access off, and keeps the service's backups the 35 days the service
    # keeps them on that tier; its administrator's password is drawn at apply
    # time by core/random-password.
    #
    # The Azure AI Search service shares the boundary too, since its module
    # also admits azurerm 4 alone. It runs on the standard2 tier with three
    # replicas, for a read-write service level agreement, and two partitions,
    # with the semantic ranker on its standard plan; its public network access
    # stays off, and its API keys are off, so the server reaches it as its
    # managed identity, under a role assignment the operator makes.
    #
    # The Azure Cosmos DB account shares the boundary too, since its module
    # also admits azurerm 4 alone. It is zone redundant in its region and
    # reads with strong consistency; each of its containers takes 400 RU/s of
    # its own. Its public network access stays off, and its keys are
    # off, so the server reaches it as its managed identity too. It keeps a
    # continuous backup at the 7-day tier, the core/backup attachment's own
    # retention.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, delegated
    # subnet, Container Apps environment, managed identity and container
    # registry stand for ones the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            storage:
              size: 64Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: BC_Gen5_4
              tags:
                environment: production

        catalog-docs:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 35
          infra:
            engine_version: "8.0"
            storage:
              size: 256Gi
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: M40
              shard_count: 2
              tags:
                environment: production

        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: standard2
              replica_count: 3
              partition_count: 2
              tags:
                environment: production

        catalog-items:
          features:
            backup:
              type: core/backup
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                environment: production

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api

    # The managed instance's body needs azurerm 5.14 or later, so its boundary
    # is a Terraform root of its own, with a server on Container Apps of its
    # own reading it. The instance runs in the operator's delegated subnet on
    # eight vCores of the Business Critical tier on standard-series hardware
    # with 256 GiB of storage, aligned with SQL Server 2025, priced for a
    # SQL Server licence the operator brings, and keeps its backups 21 days;
    # its administrator's password is drawn at apply time by
    # core/random-password.
    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 21
          infra:
            engine_version: "2025"
            storage:
              size: 256Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
              sku_name: BC_Gen5
              vcores: 8
              license_type: BasePrice
              tags:
                environment: production

        ledger-api:
          infra:
            image: example.azurecr.io/example/ledger-api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
              identity_ids:
                - /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
              registry_server: example.azurecr.io
              registry_identity: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/example-api
