# A component name holding an underscore, which no managed instance name takes.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-managed-instance-instance-name
  version: "1.0.0"
  description: >
    A SQL Server database whose component name holds an underscore, which
    names its managed instance.
spec:
  components:
    ledger_db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
