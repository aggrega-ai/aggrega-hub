# core/generated-secret on the password slot, which leaves the drawing to
# a module that draws none.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-generated-secret
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/generated-secret
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
