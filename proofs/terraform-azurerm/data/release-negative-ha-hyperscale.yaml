# Zone redundancy on a Hyperscale SKU, which needs zone-redundant backup
# storage no key of the Recipe sets.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ha-hyperscale
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: HS_Gen5_2
