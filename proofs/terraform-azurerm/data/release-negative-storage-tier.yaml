# A maximum data size of 5 GiB on Basic, whose tier takes 2 at most.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-storage-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            storage:
              size: 5Gi
            overrides:
              sku_name: Basic
              resource_group_name: example-rg
              location: westeurope
