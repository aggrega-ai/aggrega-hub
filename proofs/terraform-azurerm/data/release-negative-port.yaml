# A port other than 1433, the one Azure SQL Database serves.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            port: 1434
            overrides:
              resource_group_name: example-rg
              location: westeurope
