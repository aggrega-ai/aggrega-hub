# The semantic ranker's free plan on the free tier, where the azurerm
# provider sets no plan.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-semantic-free
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-search-semantic-free.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: free
