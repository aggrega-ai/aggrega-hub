# The component's name, which names the logical server, holds an underscore.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-server-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-server-name.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders_db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
