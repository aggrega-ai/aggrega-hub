# Three shards on the burstable M20 tier, which runs on one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-shard-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: M20
              shard_count: 3
