# core/secret-value on the password slot, whose value the configuration would
# carry as text.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-managed-instance-secret-value
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-managed-instance-only.yaml
  manifest: ./manifest-managed-instance.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/secret-value
              infra:
                origin: example-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
