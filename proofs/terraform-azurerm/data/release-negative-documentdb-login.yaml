# An administrator login holding a period, which the module does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-login
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-documentdb-login.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
