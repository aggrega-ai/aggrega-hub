# infra.overrides.host carrying a scheme, which a bare name does not.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              host: sqlserver://orders-db.example.com
