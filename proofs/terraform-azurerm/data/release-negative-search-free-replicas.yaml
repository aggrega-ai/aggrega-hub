# Three replicas on the free tier, which runs one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-free-replicas
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: free
              replica_count: 3
