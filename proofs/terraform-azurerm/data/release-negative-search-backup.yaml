# core/backup bound to terraform/backup-native, which leaves the backup to
# the service, on a search service, which keeps none of its own.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          features:
            backup:
              type: core/backup
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
