apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cosmos-partition-key-paths
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account whose container's partition key holds two
    paths, a hierarchical key.
spec:
  components:
    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
        containers:
          events:
            partition_key_paths: [/tenantId, /userId]
