# No infra.overrides.location: the service is placed in the operator's
# region, which this Recipe never chooses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-placement-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
