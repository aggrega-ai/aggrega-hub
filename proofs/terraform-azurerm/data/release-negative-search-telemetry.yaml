# infra.overrides.enable_telemetry given as a string rather than a
# boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-telemetry
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              enable_telemetry: "yes"
