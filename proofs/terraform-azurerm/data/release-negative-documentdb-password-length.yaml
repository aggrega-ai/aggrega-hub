# A password of 8 characters, shorter than the 12 the module takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-password-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-documentdb-password-length.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
