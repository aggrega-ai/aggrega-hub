apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cosmos-partition-key-path
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account whose container's partition key path does
    not begin with /.
spec:
  components:
    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
        containers:
          items:
            partition_key_paths: [tenantId]
