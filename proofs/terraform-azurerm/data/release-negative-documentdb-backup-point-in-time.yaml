# Point-in-time recovery turned off on the M30 tier, which Azure DocumentDB
# keeps for every cluster it backs up.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-backup-point-in-time
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 35
                point_in_time_recovery: false
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
