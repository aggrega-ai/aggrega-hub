# A storage type, which the SKU's service tier fixes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-storage-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            storage:
              type: Premium_LRS
            overrides:
              resource_group_name: example-rg
              location: westeurope
