apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: managed-instance
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 5: SQL Server bound to Azure SQL
    Managed Instance, with core/random-password bound to the FeatureRecipe
    that draws it with the random provider, and core/generated-secret bound
    to the FeatureRecipe that renders nothing, for the Releases that prove
    what that Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: terraform/sql-server-azure-sql-managed-instance:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
