# Two core/backup attachments setting the account's backup policy, of
# which it runs one.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-backup-two
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          features:
            backup:
              type: core/backup
            backup_long:
              type: core/backup
              infra:
                retention_days: 30
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
