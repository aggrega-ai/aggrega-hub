# A backup time, which Azure SQL Database chooses itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-schedule
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                schedule: "30 2 * * *"
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
