apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-two-databases.yaml
  boundaries:
    # The operator names the database's server in infra.overrides.host, so the
    # server's ORDERS_DB_HOST carries that name in place of the reference to
    # the module's resource output. The database keeps the General Purpose SKU
    # this Recipe takes by default, is zone redundant and keeps the service's
    # backups 7 days; its server takes public network access, admitted by the
    # firewall rules the operator sets. core/generated-secret on the password
    # slot leaves the module to draw the administrator's password, and the
    # module's telemetry is turned on.
    #
    # The operator names the Azure DocumentDB cluster in infra.overrides.host,
    # so the server's CATALOG_DOCS_HOST carries that name and CATALOG_DOCS_URI
    # the address built on it. The cluster keeps this Recipe's defaults, one
    # shard on the M30 tier with 32 GiB of storage, no standby and the
    # module's MongoDB 7.0, takes public network access, admitted by the
    # firewall rules the operator sets, and keeps the module's telemetry on.
    #
    # The operator names the Azure AI Search service in infra.overrides.host,
    # so the server's CATALOG_SEARCH_HOST carries that name and
    # CATALOG_SEARCH_ENDPOINT the address built on it. The service keeps this
    # Recipe's defaults, the standard tier with one replica and one partition,
    # takes public network access and keeps the module's telemetry on.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, delegated
    # subnet, Container Apps environment, container registry and example.com
    # names stand for ones the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: true
              enable_telemetry: true
              host: orders-db.example.com

        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access: Enabled
              enable_telemetry: true
              host: catalog-docs.example.com

        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: true
              enable_telemetry: true
              host: catalog-search.example.com

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment

    # The operator names the managed instance in infra.overrides.host too, so
    # the ledger server's LEDGER_DB_HOST carries that name in place of the
    # reference to the module's fqdn output. The instance keeps this Recipe's
    # defaults, four vCores of General Purpose on standard-series hardware
    # with 32 GiB of storage, aligned with SQL Server 2022, keeps the
    # service's backups 7 days, and is zone redundant.
    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/random-password
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
              host: ledger-db.example.com

        ledger-api:
          infra:
            image: example.azurecr.io/example/ledger-api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
