apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # The operator names the database's server in infra.overrides.host, so the
    # server's ORDERS_DB_HOST carries that name in place of the reference to
    # the module's resource output. The database keeps the General Purpose SKU
    # this Recipe takes by default, is zone redundant and keeps the service's
    # backups 7 days; its server takes public network access, admitted by the
    # firewall rules the operator sets. core/generated-secret on the password
    # slot leaves the module to draw the administrator's password, and the
    # module's telemetry is turned on.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group, Container
    # Apps environment, container registry and example.com name stand for ones
    # the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: true
              enable_telemetry: true
              host: orders-db.example.com

        api:
          infra:
            image: example.azurecr.io/example/api:1.0.0
            port: 8080
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
