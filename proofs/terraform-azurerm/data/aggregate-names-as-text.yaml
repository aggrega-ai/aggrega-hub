apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: names-as-text
  version: "1.0.0"
  description: >
    Two SQL Server databases and an Azure Cosmos DB account whose database,
    login, collation, container and partition key names hold ${, a double
    quote and, where the service takes one, %{, beside an Azure DocumentDB
    cluster and an Azure AI Search service, with no consumer reading any of
    them, so the rendered module calls show each name written as text.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: 'orders-${not-interpolated}-"quoted"'
        user: 'orders-${not-interpolated}-"quoted"-%{not-directive}'
        collation: 'Latin1_General_100_CI_AS_SC_UTF8${not-interpolated}"quoted"%{not-directive}'

    catalog-items:
      type: core/datastore/cosmos-db
      values:
        database: 'catalog-${not-interpolated}-"quoted"-%{not-directive}'
        containers:
          'items-${not-interpolated}-"quoted"-%{not-directive}':
            partition_key_paths: ['/tenant-${not-interpolated}-"quoted"-%{not-directive}']

    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin

    catalog-search:
      type: core/datastore/azure-ai-search
      values:
        semantic_search: standard

    ledger-db:
      type: core/datastore/sql-server
      values:
        database: 'ledger-${not-interpolated}-"quoted"'
        user: 'ledger-${not-interpolated}-"quoted"-%{not-directive}'
        collation: 'Latin1_General_100_CI_AS_SC_UTF8${not-interpolated}"quoted"%{not-directive}'
