# infra.overrides.partition_count of 8, which is not among the counts a
# service takes.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-partition-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              partition_count: 8
