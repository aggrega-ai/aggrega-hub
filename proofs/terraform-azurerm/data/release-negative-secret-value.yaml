# core/secret-value on the password slot, whose value the configuration would
# carry as text.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-secret-value
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/secret-value
              infra:
                origin: example-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
