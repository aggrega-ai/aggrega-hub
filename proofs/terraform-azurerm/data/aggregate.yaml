apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: data
  version: "1.0.0"
  description: >
    Two SQL Server databases, each read by a server on Container Apps of its
    own, which reads the address, the port and the database name its database
    publishes, and an Azure DocumentDB cluster the first server also reads,
    so each server's environment shows what a consumer receives.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: orders
        user: orders_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    api:
      type: core/compute/server
      uses:
        orders:
          orders-db:
            target: orders-db
            inject:
              env:
                - in: ORDERS_DB_HOST
                  from: host
                - in: ORDERS_DB_PORT
                  from: port
                - in: ORDERS_DB_NAME
                  from: database
                - in: ORDERS_DB_USER
                  from: user
        catalog:
          catalog-docs:
            target: catalog-docs
            inject:
              env:
                - in: CATALOG_DOCS_HOST
                  from: host
                - in: CATALOG_DOCS_PORT
                  from: port
                - in: CATALOG_DOCS_USER
                  from: user
                - in: CATALOG_DOCS_URI
                  from: endpoint

    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin

    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
        collation: Latin1_General_100_CI_AS_SC_UTF8

    ledger-api:
      type: core/compute/server
      uses:
        ledger:
          ledger-db:
            target: ledger-db
            inject:
              env:
                - in: LEDGER_DB_HOST
                  from: host
                - in: LEDGER_DB_PORT
                  from: port
                - in: LEDGER_DB_NAME
                  from: database
                - in: LEDGER_DB_USER
                  from: user
