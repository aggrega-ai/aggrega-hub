# infra.overrides.host carrying a port, where it takes the bare DNS
# name: the service answers on port 443.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              host: catalog-search.example.com:443
