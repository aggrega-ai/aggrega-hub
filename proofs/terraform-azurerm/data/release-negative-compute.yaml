# A memory figure, where the service sizes the database by its SKU.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-compute
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            compute:
              memory: 4Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
