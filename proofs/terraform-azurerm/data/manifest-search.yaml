apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: search
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 4: Azure AI Search bound to its
    Recipe, and core/backup bound to the FeatureRecipe that leaves the backup
    to the service's own, for the Releases that prove what that Recipe
    refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/azure-ai-search:1.0.0: terraform/azure-ai-search:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
