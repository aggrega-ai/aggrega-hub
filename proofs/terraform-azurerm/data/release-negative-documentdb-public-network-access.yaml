# infra.overrides.public_network_access in lower case, which the service
# does not spell.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access: enabled
