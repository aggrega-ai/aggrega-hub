# infra.storage.size of 100 GiB on the burstable M10 tier, which takes
# 32, 64 or 128 GiB.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-storage-burstable
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            storage:
              size: 100Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: M10
