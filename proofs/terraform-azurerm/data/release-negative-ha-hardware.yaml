# Zone redundancy on General Purpose hardware other than standard-series
# (Gen5).
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ha-hardware
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: GP_Fsv2_8
