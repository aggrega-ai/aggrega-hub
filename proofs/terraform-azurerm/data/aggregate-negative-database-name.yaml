# The database is named master, the system database every logical server
# already holds.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-database-name
  version: "1.0.0"
  description: >
    A SQL Server database named after the server's system database.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: master
        user: orders_admin
