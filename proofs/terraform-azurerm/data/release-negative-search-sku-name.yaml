# infra.overrides.sku_name naming a tier by its portal label, S2, rather
# than the module's value, standard2.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-sku-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: S2
