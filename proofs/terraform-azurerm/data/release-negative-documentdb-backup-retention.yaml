# Backups kept 14 days on the M30 tier, where Azure DocumentDB keeps them 35.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-backup-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
