# The administrator login named dbo, the user SQL Server keeps in every
# database.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-login
  version: "1.0.0"
  description: >
    A SQL Server database whose administrator login is a name SQL Server keeps
    for a principal of its own.
spec:
  components:
    orders-db:
      type: core/datastore/sql-server
      values:
        database: orders
        user: dbo
