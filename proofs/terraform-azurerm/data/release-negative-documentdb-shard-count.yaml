# infra.overrides.shard_count of none, below the one shard a cluster holds
# at least.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-shard-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              shard_count: 0
