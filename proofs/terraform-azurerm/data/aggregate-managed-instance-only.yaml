apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: managed-instance-only
  version: "1.0.0"
  description: >
    A SQL Server database alone, named ledger-db, which the Manifest binds to
    Azure SQL Managed Instance, for the Releases that prove what that Recipe
    refuses on its own.
spec:
  components:
    ledger-db:
      type: core/datastore/sql-server
      values:
        database: ledger
        user: ledger_admin
