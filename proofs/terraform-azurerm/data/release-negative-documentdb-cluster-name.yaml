# A component name holding an underscore, which names the cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-cluster-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-documentdb-cluster-name.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog_docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
