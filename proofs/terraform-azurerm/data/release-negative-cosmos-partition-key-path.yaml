# A partition key path not beginning with /.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-partition-key-path
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cosmos-partition-key-path.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
