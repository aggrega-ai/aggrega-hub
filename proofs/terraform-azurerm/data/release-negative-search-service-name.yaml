# A component name holding an underscore, which names the search service
# and which a service name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-service-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-search-service-name.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog_search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
