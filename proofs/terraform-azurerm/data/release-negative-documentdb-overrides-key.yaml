# An infra.overrides key this Recipe does not read: the boolean public
# access key the other Azure Recipes read, where this Recipe reads
# public_network_access.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: true
