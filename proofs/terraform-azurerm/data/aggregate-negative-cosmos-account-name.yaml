apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cosmos-account-name
  version: "1.0.0"
  description: >
    An Azure Cosmos DB account whose component name holds an underscore,
    which an account name does not take.
spec:
  components:
    catalog_items:
      type: core/datastore/cosmos-db
      values:
        database: catalog
