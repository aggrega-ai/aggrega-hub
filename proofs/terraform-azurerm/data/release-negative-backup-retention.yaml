# Backups kept 40 days, beyond the 35 Azure SQL Database keeps.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                retention_days: 40
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
