# infra.storage.size above the 32 TiB a shard takes at most.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-storage-range
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            storage:
              size: 40000Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
