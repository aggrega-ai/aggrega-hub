# Point-in-time recovery turned off, which Azure SQL Database keeps for every
# database.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-point-in-time
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup
              infra:
                point_in_time_recovery: false
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
