apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: documentdb
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 4: Azure DocumentDB bound to its
    Recipe, with core/random-password bound to the FeatureRecipe that draws
    it with the random provider, core/generated-secret bound to the
    FeatureRecipe that renders nothing and core/secret-value bound to the
    FeatureRecipe that reads it from a variable, for the Releases that prove
    what that Recipe refuses on its own.
spec:
  mappings:
    components:
      type:
        core/datastore/azure-documentdb:1.0.0: terraform/azure-documentdb:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/secret-value:1.0.0: terraform/variable-secret:1.0.0
