# infra.overrides.public_network_access_enabled given as the service's
# string rather than a boolean.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-public-network-access
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              public_network_access_enabled: Disabled
