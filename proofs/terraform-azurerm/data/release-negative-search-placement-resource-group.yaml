# No infra.overrides.resource_group_name: the service is placed in the
# operator's resource group, which this Recipe never chooses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-placement-resource-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              location: westeurope
