# A component name holding an underscore, which names the account and
# which an account name does not take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-account-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cosmos-account-name.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog_items:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
