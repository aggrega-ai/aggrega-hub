# infra.storage.size of 128 GiB on the Free tier, which takes at most
# 32 GiB.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-storage-free
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            storage:
              size: 128Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: Free
