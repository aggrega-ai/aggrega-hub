# An infra.overrides key this Recipe does not read: partitions, where the
# key is partition_count.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-search-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-search-only.yaml
  manifest: ./manifest-search.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              partitions: 2
