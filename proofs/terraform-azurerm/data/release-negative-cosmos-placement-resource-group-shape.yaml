# infra.overrides.resource_group_name as a list, where it names one
# resource group.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cosmos-placement-resource-group-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cosmos-only.yaml
  manifest: ./manifest-cosmos.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-items:
          infra:
            overrides:
              resource_group_name:
                - example-rg
              location: westeurope
