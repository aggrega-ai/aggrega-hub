# infra.ha.enabled on the burstable M25 tier, which keeps no standby.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-ha-tier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            ha:
              enabled: true
            overrides:
              resource_group_name: example-rg
              location: westeurope
              sku_name: M25
