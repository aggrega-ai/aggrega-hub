# No region, which this Recipe never chooses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-placement-location
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
