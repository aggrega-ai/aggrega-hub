apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: names-as-text
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-names-as-text.yaml
  manifest: ./manifest-two-databases.yaml
  boundaries:
    # Each database's name, login and collation, the Azure Cosmos DB
    # database's, container's and partition key's names, and a tag on every
    # component hold ${, a double quote and, where the service takes one, %{,
    # and each reaches its module as written. The boundaries are the shared
    # Release's: the azurerm 4 modules in one Terraform root, the managed
    # instance's body, needing azurerm 5.14 or later, in another.
    #
    # Every subscription-specific value is a placeholder: the subscription is
    # 00000000-0000-0000-0000-000000000000, and the resource group and the
    # delegated subnet stand for ones the operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                note: '${not-interpolated} "quoted" %{not-directive}'

        catalog-items:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                note: '${not-interpolated} "quoted" %{not-directive}'

        catalog-docs:
          features:
            password:
              type: core/random-password
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                note: '${not-interpolated} "quoted" %{not-directive}'

        catalog-search:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
              tags:
                note: '${not-interpolated} "quoted" %{not-directive}'

    azurerm5:
      directory: azurerm5
      components:
        ledger-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "2025"
            storage:
              size: 256Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-network/subnets/example-managed-instance
              tags:
                note: '${not-interpolated} "quoted" %{not-directive}'
