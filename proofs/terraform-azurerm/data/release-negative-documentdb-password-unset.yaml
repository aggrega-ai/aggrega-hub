# The password slot left empty, where neither the service nor the module
# draws a password.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-documentdb-password-unset
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-documentdb-only.yaml
  manifest: ./manifest-documentdb.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        catalog-docs:
          infra:
            overrides:
              resource_group_name: example-rg
              location: westeurope
