# A password of 8 characters, shorter than the 12 the module takes.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-documentdb-password-length
  version: "1.0.0"
  description: >
    An Azure DocumentDB cluster whose administrator's password is drawn 8
    characters long.
spec:
  components:
    catalog-docs:
      type: core/datastore/azure-documentdb
      values:
        user: catalog_admin
      features:
        password:
          type: core/random-password
          values:
            length: 8
