apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: shared-config
  version: "1.0.0"
  description: >
    Azure through Terraform: the generic server bound to its Container Apps
    Recipe, and core/shared-config 1.1.0 to the FeatureRecipe that writes a
    boundary's settings into the operator's App Configuration store.
spec:
  mappings:
    components:
      type:
        core/compute/server:1.1.0: terraform/server-container-apps:1.2.0
    features:
      type:
        core/shared-config:1.1.0: terraform/shared-config-app-configuration:1.0.0
