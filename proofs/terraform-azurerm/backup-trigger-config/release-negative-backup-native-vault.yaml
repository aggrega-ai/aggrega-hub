# A core/backup attachment bound to the server's own automated backup that
# names a Data Protection backup vault, which that backup does not use.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-native-vault
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-backup.yaml
  manifest: ./manifest-backup.yaml
  boundaries:
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 14
                vault_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.DataProtection/backupVaults/example-vault
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
