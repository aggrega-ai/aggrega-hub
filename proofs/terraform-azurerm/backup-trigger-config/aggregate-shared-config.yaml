apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: shared-config
  version: "1.0.0"
  description: >
    A generic server on Azure Container Apps in a boundary whose settings the
    operator shares through core/shared-config in the Release; the developer
    writes nothing for it.
spec:
  components:
    storefront:
      type: core/compute/server
