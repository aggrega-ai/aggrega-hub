apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-backup.yaml
  manifest: ./manifest-backup.yaml
  boundaries:
    # The server keeps its automated backups 14 days, taken once a day at a
    # time the service chooses. The FeatureRecipe the attachment binds renders
    # nothing: the backup is written into the server by the database's own
    # Recipe. The flexible server's module admits azurerm 4 alone, so the
    # boundary holds it alone.
    #
    # Every subscription-specific value is a placeholder: subscription
    # 00000000-0000-0000-0000-000000000000, its resource group example-rg,
    # the delegated subnet and the private DNS zone stand for ones the
    # operator already has.
    azurerm4:
      directory: azurerm4
      components:
        orders-db:
          features:
            password:
              type: core/random-password
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 14
          infra:
            engine_version: "16"
            storage:
              size: 32Gi
            overrides:
              resource_group_name: example-rg
              location: westeurope
              delegated_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/virtualNetworks/example-vnet/subnets/example-postgres
              private_dns_zone_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Network/privateDnsZones/example.postgres.database.azure.com
