apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: backup
  version: "1.0.0"
  description: >
    A PostgreSQL database on an Azure flexible server, which the operator has
    backed up by the server's own automated backups, attaching core/backup in
    the Release; the developer writes nothing for it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
