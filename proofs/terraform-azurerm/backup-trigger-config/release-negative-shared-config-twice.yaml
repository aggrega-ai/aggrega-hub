# Two core/shared-config attachments on one boundary naming the same App
# Configuration store, which would write the same key-value.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-shared-config-twice
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-shared-config.yaml
  manifest: ./manifest-shared-config.yaml
  boundaries:
    app:
      directory: main
      features:
        shared:
          type: core/shared-config:1.1.0
          infra:
            tier: production
            configuration_store_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.AppConfiguration/configurationStores/example-store
        shared_again:
          type: core/shared-config:1.1.0
          infra:
            tier: standard
            configuration_store_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.AppConfiguration/configurationStores/example-store
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
