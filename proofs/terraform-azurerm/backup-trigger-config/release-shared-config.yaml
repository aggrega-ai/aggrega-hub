apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: shared-config
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-shared-config.yaml
  manifest: ./manifest-shared-config.yaml
  boundaries:
    # The boundary writes one key-value, /app/shared-config holding
    # tier=production, into the operator's App Configuration store, beside
    # its server in one root configuration; no store is created, and nothing
    # is written into the server's environment. The key-value's body needs
    # azurerm 5.14 or later, which the Container Apps server's body admits, so
    # the two share the root configuration; the flexible server, whose module
    # admits azurerm 4 alone, is built in a Release of its own.
    #
    # Every subscription-specific value is a placeholder: subscription
    # 00000000-0000-0000-0000-000000000000, its resource group example-rg,
    # its Container Apps environment and its App Configuration store stand
    # for ones the operator already has, and the image for its own.
    app:
      directory: main
      features:
        shared:
          type: core/shared-config:1.1.0
          infra:
            tier: production
            configuration_store_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.AppConfiguration/configurationStores/example-store
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
