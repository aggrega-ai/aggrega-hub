apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: backup
  version: "1.0.0"
  description: >
    Azure through Terraform: PostgreSQL bound to its flexible server Recipe,
    core/random-password to the FeatureRecipe that draws the administrator
    password with the random provider, and core/backup 1.1.0 to the
    FeatureRecipe that leaves the backup to the server's own automated
    backups.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-flexible-server:1.1.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
        core/backup:1.1.0: terraform/backup-native:1.1.0
