apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: public-ingress
  version: "1.0.0"
  description: >
    Azure through Terraform on azurerm 5: the generic server bound to its App
    Service Recipe, and core/public-ingress to the FeatureRecipe that leaves
    the public ingress to the server's own Recipe.
spec:
  mappings:
    components:
      type:
        core/compute/server:1.1.0: terraform/server-app-service:1.1.0
    features:
      type:
        core/public-ingress:1.0.0: terraform/public-ingress-native:1.0.0
