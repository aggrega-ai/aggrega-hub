# core/caller-allowlist attached to a server on Azure Container Apps: no
# FeatureRecipe realizes it for Terraform on Azure, since Container Apps
# admits callers by address and not by who they are.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-caller-allowlist
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-container-apps.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          features:
            callers:
              type: core/caller-allowlist
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              container_app_environment_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.App/managedEnvironments/example-environment
