apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: app-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-app-service.yaml
  boundaries:
    # The App Service app with no core/public-ingress attachment: public
    # network access stays off, and the build renders the arguments the
    # Recipe's previous version renders.
    #
    # Every subscription-specific value is a placeholder.
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
