# An infra.overrides key the App Service Recipe does not read, the
# certificate key misspelt.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest-app-service.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
              certificate_ids: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/certificates/example-shop
