apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-path
  version: "1.0.0"
  description: >
    A server whose developer publishes one path prefix of it, attaching
    core/public-ingress with values.path.
spec:
  components:
    storefront:
      type: core/compute/server
      features:
        public:
          type: core/public-ingress
          values:
            path: /shop
