# A Kubernetes Secret named as the certificate on the attachment, in place
# of the App Service certificate the server's Recipe reads.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-tls-secret
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          features:
            public:
              type: core/public-ingress
              infra:
                host: shop.example.com
                tls_secret: shop-tls
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
