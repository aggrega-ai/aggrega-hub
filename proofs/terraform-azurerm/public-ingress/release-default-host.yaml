apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: default-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # Attached with no infra.host, the app answers requests from the internet
    # on its default host name alone, storefront.azurewebsites.net, with the
    # certificate App Service serves there: no custom domain is bound, and no
    # certificate is named.
    #
    # Every subscription-specific value is a placeholder.
    azurerm5:
      directory: azurerm5
      components:
        storefront:
          features:
            public:
              type: core/public-ingress
          infra:
            image: example.azurecr.io/example/storefront:1.0.0
            overrides:
              resource_group_name: example-rg
              location: westeurope
              service_plan_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.Web/serverFarms/example-plan
