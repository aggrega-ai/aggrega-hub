# No infra.overrides.subnet_group, the DB subnet group the cluster is placed
# in, which this Recipe requires.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-subnet-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              vpc_security_groups:
                - sg-00000000000000000
