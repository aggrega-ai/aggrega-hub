# infra.overrides.parameter_group, a DB parameter group for the cluster's
# instances, which this Recipe names none of.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-parameter-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
              parameter_group: example-aurora-postgresql17-instances
