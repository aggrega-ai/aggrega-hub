apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: mysql
  version: "1.0.0"
  description: >
    A MySQL database on Amazon Aurora and a server on Amazon ECS reading the
    address, the port, the database and the user it publishes, so the
    server's environment shows what a consumer of the cluster receives.
spec:
  components:
    catalog-db:
      type: core/datastore/mysql
      values:
        database: catalog

    storefront:
      type: core/compute/server
      uses:
        catalog:
          catalog-db:
            target: catalog-db
            inject:
              env:
                - in: CATALOG_DB_HOST
                  from: host
                - in: CATALOG_DB_PORT
                  from: port
                - in: CATALOG_DB_NAME
                  from: database
                - in: CATALOG_DB_USER
                  from: user
