# infra.storage.type set to an RDS volume type, which names no Aurora
# storage configuration.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-storage-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            storage:
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
