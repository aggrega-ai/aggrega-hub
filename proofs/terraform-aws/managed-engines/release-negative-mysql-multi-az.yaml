# infra.overrides.multi_az, which an Aurora DB cluster takes no setting for:
# its availability is the number of instances it runs.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-multi-az
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
              multi_az: true
