# A credential on the app_user_password slot, for an application role Aurora
# does not create.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-app-user-password
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            app_user_password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
