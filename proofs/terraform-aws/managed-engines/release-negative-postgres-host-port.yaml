# infra.overrides.host carrying a port, which a consumer would join to
# infra.port and compose a broken address from.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-host-port
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
              host: orders-db.example.com:5432
