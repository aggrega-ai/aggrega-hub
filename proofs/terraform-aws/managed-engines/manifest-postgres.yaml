apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres
  version: "1.0.0"
  description: >
    AWS through Terraform: PostgreSQL bound to the Aurora cluster the
    terraform-aws-modules Aurora module provisions, core/generated-secret to
    the FeatureRecipe that leaves the master password to Aurora, core/backup
    to the cluster's own automated backups, and the generic server bound to
    its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-aurora:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
    features:
      type:
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
