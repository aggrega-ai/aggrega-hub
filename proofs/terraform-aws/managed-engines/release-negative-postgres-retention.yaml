# A core/backup attachment keeping each backup longer than the 35 days Aurora
# keeps automated backups for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 36
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
