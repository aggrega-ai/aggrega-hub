# A core/backup attachment asking AWS Backup, through infra.role_arn, to back
# up the Aurora cluster.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-aws-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-mysql-only.yaml
  manifest: ./manifest-mysql-aws-backup.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                role_arn: arn:aws:iam::123456789012:role/example-backup-role
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
