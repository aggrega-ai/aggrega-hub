# An infra.engine_version spelt as a container image tag, which names no
# Aurora version.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "16.4-bookworm"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
