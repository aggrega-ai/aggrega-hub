# values.user, an application user beside the administrator, which Aurora
# does not create.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mysql-user
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-mysql-user.yaml
  manifest: ./manifest-mysql.yaml
  boundaries:
    aws:
      directory: main
      components:
        catalog-db:
          features:
            root_password:
              type: core/generated-secret
          infra:
            engine_version: "8.0.mysql_aurora.3.10.0"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
