apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-postgres-encoding
  version: "1.0.0"
  description: >
    A PostgreSQL database on Amazon Aurora whose Aggregate sets
    values.encoding, for the Release that halts on it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
        encoding: UTF8
