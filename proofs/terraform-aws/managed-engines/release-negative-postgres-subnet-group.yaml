# No infra.overrides.subnet_group, the DB subnet group the cluster is placed
# in, which this Recipe requires.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-subnet-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              vpc_security_groups:
                - sg-00000000000000000
