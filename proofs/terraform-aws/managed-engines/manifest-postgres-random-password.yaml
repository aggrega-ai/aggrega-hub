apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: postgres-random-password
  version: "1.0.0"
  description: >
    AWS through Terraform: PostgreSQL bound to the Aurora cluster, and
    core/random-password to the FeatureRecipe that draws a password at apply
    time.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-aurora:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
