# infra.credentials_secret naming a Kubernetes Secret, which an Aurora cluster
# reads none of.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-infra-credentials-secret
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            credentials_secret: example-db-owner
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
