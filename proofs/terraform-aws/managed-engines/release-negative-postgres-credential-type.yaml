# The password slot filled by core/random-password, a credential Aurora
# would not read, since it generates the master password itself.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-credential-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres-random-password.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/random-password
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
