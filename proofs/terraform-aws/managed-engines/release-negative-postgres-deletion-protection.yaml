# infra.overrides.deletion_protection written as a string rather than true
# or false.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-postgres-deletion-protection
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres-only.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
          infra:
            engine_version: "17.5"
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
              deletion_protection: "yes"
