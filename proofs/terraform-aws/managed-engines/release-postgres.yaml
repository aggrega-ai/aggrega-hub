apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: postgres
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-postgres.yaml
  manifest: ./manifest-postgres.yaml
  boundaries:
    # One boundary, so the cluster and the server are module blocks of one
    # Terraform root configuration and the server's ORDERS_DB_HOST carries the
    # reference to the module's cluster_endpoint output, which Terraform
    # resolves when it applies. The cluster runs a reader beside its writer,
    # keeps its automated backups 14 days in a window opening at 02:30 UTC,
    # encrypts its storage with the operator's key and is protected from
    # deletion.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the DB subnet group, the
    # security groups, the KMS key, the ECS cluster, the subnets and the
    # execution role.
    aws:
      directory: main
      components:
        orders-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
                schedule: "30 2 * * *"
          infra:
            engine_version: "17.5"
            ha:
              enabled: true
            overrides:
              instance_class: db.r6g.large
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              deletion_protection: true
              tags:
                team: orders

        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
