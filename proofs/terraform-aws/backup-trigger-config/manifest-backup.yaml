apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: backup
  version: "1.0.0"
  description: >
    AWS through Terraform: PostgreSQL bound to its Amazon RDS Recipe, Kafka
    to its Amazon MSK Recipe, and core/backup 1.1.0 to the FeatureRecipe that
    leaves the backup to the instance's own automated backups.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-rds:1.0.0
        core/messaging/kafka:1.0.0: terraform/kafka-msk:1.0.0
    features:
      type:
        core/backup:1.1.0: terraform/backup-native:1.1.0
