apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: shared-config
  version: "1.0.0"
  description: >
    AWS through Terraform: the generic server bound to its Amazon ECS
    Recipe, and core/shared-config 1.1.0 to the FeatureRecipe that writes a
    boundary's settings into Parameter Store.
spec:
  mappings:
    components:
      type:
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
    features:
      type:
        core/shared-config:1.1.0: terraform/shared-config-ssm-parameter:1.0.0
