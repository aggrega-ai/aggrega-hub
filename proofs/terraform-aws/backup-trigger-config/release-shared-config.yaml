apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: shared-config
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-shared-config.yaml
  manifest: ./manifest-shared-config.yaml
  boundaries:
    # Each boundary writes one parameter of its own beside its server, in its
    # own root configuration, through a core/shared-config 1.1.0 attachment:
    # /app/shared-config holding tier=production and /reporting/shared-config
    # holding tier=internal. Nothing is written into either server's
    # environment: a server reads its boundary's parameter by name.
    #
    # The cluster, subnets, security groups, role and images are placeholders
    # for ones the operator already has in AWS account 123456789012.
    app:
      directory: main
      features:
        shared:
          type: core/shared-config:1.1.0
          infra:
            tier: production
      components:
        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role

    reporting:
      directory: reporting
      features:
        shared:
          type: core/shared-config:1.1.0
          infra:
            tier: internal
      components:
        reports:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-reports:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
