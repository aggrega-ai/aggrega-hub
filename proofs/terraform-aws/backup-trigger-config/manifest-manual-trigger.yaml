apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manual-trigger
  version: "1.0.0"
  description: >
    AWS through Terraform: the generic task bound to its Amazon ECS Recipe,
    and core/manual-trigger to its terraform realization.
spec:
  mappings:
    components:
      type:
        core/compute/task:1.0.1: terraform/task-ecs:1.1.0
    features:
      type:
        core/manual-trigger:1.0.0: terraform/manual-trigger:1.1.0
