apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: backup
  version: "1.0.0"
  description: >
    Two PostgreSQL databases on Amazon RDS, which the operator has backed up
    by each instance's own automated backups, attaching core/backup in the
    Release; the developer writes nothing for it.
spec:
  components:
    orders-db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin

    ledger-db:
      type: core/datastore/postgres
      values:
        database: ledger
        user: ledger_admin
