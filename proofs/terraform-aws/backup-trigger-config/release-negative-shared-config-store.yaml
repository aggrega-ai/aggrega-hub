# A core/shared-config attachment bound to Parameter Store that names an
# App Configuration store, which nothing writes into.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-shared-config-store
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-shared-config-one.yaml
  manifest: ./manifest-shared-config.yaml
  boundaries:
    app:
      directory: main
      features:
        shared:
          type: core/shared-config:1.1.0
          infra:
            tier: production
            configuration_store_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.AppConfiguration/configurationStores/example-store
      components:
        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
