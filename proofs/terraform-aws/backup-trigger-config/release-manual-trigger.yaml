apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: manual-trigger
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-manual-trigger.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    # The reindex renders its task definition and no schedule, so it names no
    # scheduler role; the cluster and network are what the operator starts
    # each run with. The nightly export renders both. Every account-specific
    # value is a placeholder for one the operator already has in AWS account
    # 123456789012: the cluster, subnets, security groups, roles and images.
    aws:
      directory: main
      components:
        reindex:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-reindex:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role

        nightly-export:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-nightly-export:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              scheduler_role_arn: arn:aws:iam::123456789012:role/example-scheduler-role
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
