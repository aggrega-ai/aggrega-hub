# A core/backup attachment bound to the service's own automated backup, on an
# Amazon MSK cluster, whose Recipe configures no backup from core/backup.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-backup-native-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-backup-native-host.yaml
  manifest: ./manifest-backup.yaml
  boundaries:
    aws:
      directory: main
      components:
        events:
          features:
            backup:
              type: core/backup:1.1.0
              infra:
                retention_days: 14
          infra:
            overrides:
              subnet_ids:
                - subnet-00000000000000000
                - subnet-11111111111111111
