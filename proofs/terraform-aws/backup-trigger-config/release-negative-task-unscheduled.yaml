# A task with no schedule and no core/manual-trigger attachment, which
# nothing on AWS starts.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-task-unscheduled
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-task-unscheduled.yaml
  manifest: ./manifest-manual-trigger.yaml
  boundaries:
    aws:
      directory: main
      components:
        reindex:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-reindex:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
