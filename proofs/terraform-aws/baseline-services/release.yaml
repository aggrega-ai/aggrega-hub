apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline-services
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary, so every Component is a module block of one Terraform root
    # configuration and a reference a datastore publishes resolves in the
    # compute that uses it. The network, cluster, roles and log groups are
    # placeholders for ones the operator already has in AWS account
    # 123456789012.
    aws:
      directory: main
      components:
        cache-redis:
          infra:
            engine_version: "7.1"
            client_tls: true
            overrides:
              subnet_group: example-private-cache-subnets

        cache-valkey:
          infra:
            engine_version: "8.1"
            overrides:
              subnet_group: example-private-cache-subnets

        cache-memcached:
          infra:
            engine_version: "1.6.22"
            overrides:
              subnet_group: example-private-cache-subnets

        search:
          infra:
            engine_version: "2.19"
            storage:
              size: 20Gi
              type: gp3
            overrides:
              subnet_ids:
                - subnet-00000000000000000

        events:
          infra:
            overrides:
              subnet_ids:
                - subnet-00000000000000000
                - subnet-11111111111111111

        queue:
          infra:
            engine_version: "3.13"
            overrides:
              subnet_ids:
                - subnet-00000000000000000

        objects:
          infra:
            region: eu-west-1

        external-objects: {}

        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role

        jobs:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-jobs:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role

        nightly:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-nightly:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              scheduler_role_arn: arn:aws:iam::123456789012:role/example-scheduler-role
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role

        handler:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-handler:1.0.0
            overrides:
              lambda_role: arn:aws:iam::123456789012:role/example-lambda-role
              logging_log_group: /aws/lambda/example-handler
