apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS through Terraform: each Component type bound to the newest version of
    the catalog's Recipe realizing it there, and core/random-password to the
    FeatureRecipe that draws a password with the random provider. Each
    component of the Aggregate has a type of its own, so the type tier binds
    them all.
spec:
  mappings:
    components:
      type:
        core/datastore/redis:1.0.0: terraform/redis-elasticache:1.0.0
        core/datastore/valkey:1.0.0: terraform/valkey-elasticache:1.0.0
        core/datastore/memcached:1.0.0: terraform/memcached-elasticache:1.0.0
        core/datastore/opensearch:1.0.0: terraform/opensearch-service:1.0.0
        core/messaging/kafka:1.0.0: terraform/kafka-msk:1.0.0
        core/messaging/rabbitmq:1.0.0: terraform/rabbitmq-amazon-mq:1.0.0
        core/storage/s3-object-store:1.0.0: terraform/s3-object-store-amazon-s3:1.0.0
        example/storage/external-object-store:1.0.0: terraform/external-object-store:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.1.0
        core/compute/worker:1.0.0: terraform/worker-ecs:1.0.0
        core/compute/task:1.0.1: terraform/task-ecs:1.0.1
        core/compute/function:1.0.0: terraform/function-lambda:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
