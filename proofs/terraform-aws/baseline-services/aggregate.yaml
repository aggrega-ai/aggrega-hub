apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    One of each Component the catalog realizes on AWS through Terraform apart
    from the relational databases: a Redis, a Valkey and a Memcached cache, a
    search engine, a Kafka cluster, a RabbitMQ broker, an S3 bucket and an
    external bucket, and a server, a worker, a scheduled task and a function.
    Each compute Component uses a datastore and an object store, so every
    published entry of those reaches a container's environment.
spec:
  components:
    cache-redis:
      type: core/datastore/redis
      # ElastiCache takes an AUTH token only with TLS on, and the random
      # provider's punctuation includes characters a token may not hold.
      features:
        password:
          type: core/random-password
          values:
            length: 32
            symbols: false

    cache-valkey:
      type: core/datastore/valkey

    cache-memcached:
      type: core/datastore/memcached

    search:
      type: core/datastore/opensearch
      # The domain's master password holds a punctuation character.
      features:
        password:
          type: core/random-password
          values:
            length: 32
            symbols: true

    events:
      type: core/messaging/kafka

    queue:
      type: core/messaging/rabbitmq
      # Amazon MQ refuses a colon or an equals sign in a password.
      features:
        password:
          type: core/random-password
          values:
            length: 24
            symbols: false

    objects:
      type: core/storage/s3-object-store
      values:
        bucket: example-objects

    external-objects:
      type: example/storage/external-object-store
      values:
        bucket: example-external-objects
        access_key_id: EXAMPLEACCESSKEYID
        secret_access_key: example-placeholder-not-a-secret

    api:
      type: core/compute/server
      uses:
        sessions:
          cache-redis:
            target: cache-redis
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        search:
          search:
            target: search
            inject:
              env:
                - in: SEARCH_ENDPOINT
                  from: endpoint
                - in: SEARCH_USER
                  from: user
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint
        external-objects:
          external-objects:
            target: external-objects
            inject:
              env:
                - in: EXTERNAL_OBJECTS_BUCKET
                  from: bucket
                - in: EXTERNAL_OBJECTS_ENDPOINT
                  from: endpoint

    jobs:
      type: core/compute/worker
      values:
        concurrency: 4
      uses:
        sessions:
          cache-valkey:
            target: cache-valkey
            inject:
              env:
                - in: SESSIONS_HOST
                  from: host
                - in: SESSIONS_PORT
                  from: port
        queue:
          queue:
            target: queue
            inject:
              env:
                - in: QUEUE_HOST
                  from: host
                - in: QUEUE_PORT
                  from: port
        events:
          events:
            target: events
            inject:
              env:
                - in: EVENTS_BOOTSTRAP_SERVERS
                  from: bootstrap_servers
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    nightly:
      type: core/compute/task
      values:
        schedule: "30 2 * * *"
      uses:
        fragments:
          cache-memcached:
            target: cache-memcached
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint

    handler:
      type: core/compute/function
      values:
        runtime: python3.12
      uses:
        fragments:
          cache-memcached:
            target: cache-memcached
            inject:
              env:
                - in: FRAGMENTS_HOST
                  from: host
                - in: FRAGMENTS_PORT
                  from: port
        objects:
          objects:
            target: objects
            inject:
              env:
                - in: OBJECTS_BUCKET
                  from: bucket
                - in: OBJECTS_ENDPOINT
                  from: endpoint
