apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-task-ecs
  version: 1.0.0
  description: >
    The placeholder product as one Amazon ECS task on Fargate, started on
    values.schedule by EventBridge Scheduler, written as a product Recipe on
    the shared Amazon ECS shape: the fixed pass-through module, the Task body
    from EcsFargateModule, the TaskArguments entry from EcsFargateArguments,
    and the locals that entry reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0

  # The fixed pass-through: its config input goes to the body under service,
  # and the body comes back out as its service output.
  source: ./module

  artifacts:
    service:
      $import: EcsFargateModule#/artifacts/Task

  # What the product fixes, read by EcsFargateArguments#/mappings/TaskArguments:
  # its image while infra.image is unset and the variables its own values and
  # its database connection reach it as. A run serves no requests, so no port
  # is declared.
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'

  # A run serves no requests, so it publishes no address.
  provides:
    endpoint: ""

  valuesMapping:
    $import: EcsFargateArguments#/mappings/TaskArguments
