apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-ecs
  version: 1.0.0
  description: >
    The placeholder product as one Amazon ECS service on Fargate, written as
    a product Recipe on the shared Amazon ECS shape: the fixed pass-through
    module, the Service body from EcsFargateModule, the ServiceArguments
    entry from EcsFargateArguments, and the locals that entry reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0

  # The fixed pass-through: its config input goes to the body under service,
  # and the body comes back out as its service output.
  source: ./module

  artifacts:
    service:
      $import: EcsFargateModule#/artifacts/Service

  # What the product fixes, read by EcsFargateArguments#/mappings/ServiceArguments:
  # its image while infra.image is unset, the port it listens on, and the
  # variables its own values and its database connection reach it as. Amazon
  # ECS on Fargate runs no probe this realization declares and gives no GPU,
  # so neither is declared.
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    container_port: "8080"
    value_env: '{"values.greeting": "SAMPLE_GREETING", "values.workers": "SAMPLE_WORKERS"}'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'

  # The service is reached through the operator's load balancer, whose
  # address this Recipe does not know, so it publishes none.
  provides:
    endpoint: ""

  valuesMapping:
    $import: EcsFargateArguments#/mappings/ServiceArguments
