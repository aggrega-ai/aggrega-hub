apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sample-product-fault-value-env
  version: 1.0.0
  description: >
    A product Recipe declaring its own values' names as a list rather than an
    object. It is reached only by the negative Release release-negative-fault-
    value-env.yaml, which must halt on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/compute/sample-product:1.0.0
  source: ./module
  artifacts:
    service:
      $import: EcsFargateModule#/artifacts/Service
  locals:
    default_image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-sample-product:1.0.0
    container_port: "8080"
    value_env: '["values.greeting"]'
    socket_env: '{"database": {"SAMPLE_DB_HOST": "host", "SAMPLE_DB_PORT": "port", "SAMPLE_DB_NAME": "database"}}'
  provides:
    endpoint: ""
  valuesMapping:
    $import: EcsFargateArguments#/mappings/ServiceArguments
