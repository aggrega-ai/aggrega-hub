# A component's own inject block dictating a name its connection is delivered under by default.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-socket-collision
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-socket-collision.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        db:
          infra:
            engine_version: "16.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
        product:
          infra:
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
