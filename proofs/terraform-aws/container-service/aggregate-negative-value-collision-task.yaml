apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-value-collision-task
  version: "1.0.0"
  description: >
    A task's own inject block dictating the name its timeout is delivered under by default.
spec:
  components:
    nightly:
      type: core/compute/task
      values:
        schedule: "0 3 * * *"
        timeout: 15m
      inject:
        env:
          - in: TASK_TIMEOUT
            value: 10m
