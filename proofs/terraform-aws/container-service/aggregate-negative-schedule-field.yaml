apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-schedule-field
  version: "1.0.0"
  description: >
    A schedule whose day-of-month field is in a form the scheduler and Kubernetes do not read alike.
spec:
  components:
    digest:
      type: example/compute/sample-product
      values:
        schedule: "30 2 L * *"
