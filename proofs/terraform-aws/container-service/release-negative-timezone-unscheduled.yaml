# A task with no schedule naming a time zone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-timezone-unscheduled
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-unscheduled.yaml
  manifest: ./manifest-negative-task.yaml
  boundaries:
    aws:
      directory: main
      components:
        digest:
          infra:
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              schedule_expression_timezone: Europe/Rome
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
