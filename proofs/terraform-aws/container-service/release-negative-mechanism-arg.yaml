# A connection dictating a command-line argument.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-mechanism-arg
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-mechanism-arg.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        peer:
          infra:
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
        product:
          infra:
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
