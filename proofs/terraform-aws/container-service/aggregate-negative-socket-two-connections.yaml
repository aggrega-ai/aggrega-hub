apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-socket-two-connections
  version: "1.0.0"
  description: >
    Two connections on one socket, both delivered under the Recipe's default names.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        database: orders
        user: orders_admin
    product:
      type: example/compute/sample-product
      uses:
        database:
          orders:
            target: db
          billing:
            target: db
