apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-schedule-both-days
  version: "1.0.0"
  description: >
    A schedule restricting both the day of the month and the day of the week.
spec:
  components:
    digest:
      type: example/compute/sample-product
      values:
        schedule: "30 2 1 * 1"
