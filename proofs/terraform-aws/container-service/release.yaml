apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: container-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary, so every component is a module block of one Terraform root
    # configuration, where each module output a neighbour reads resolves.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the cluster, subnets, security
    # groups, roles, log groups, load balancer target groups, DB subnet group
    # and images.
    aws:
      directory: main
      components:
        db:
          infra:
            engine_version: "16.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
        # The product runs the image its Recipe holds, so infra.image is left
        # unset; it registers its port with the operator's target group and
        # writes its output to the operator's log group.
        product:
          infra:
            replicas: 2
            compute:
              cpu: "1"
              memory: 3Gi
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
                - subnet-00000000000000001
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              task_role_arn: arn:aws:iam::123456789012:role/example-product-task-role
              target_group_arn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-product/0000000000000000
              awslogs_group: /example/product
        digest:
          infra:
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              scheduler_role_arn: arn:aws:iam::123456789012:role/example-scheduler-role
              schedule_expression_timezone: Europe/Rome
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              assign_public_ip: true
        # The server registers its port, infra.port, with the operator's target
        # group and writes its output to the operator's log group.
        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            replicas: 2
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              target_group_arn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-api/0000000000000001
              awslogs_group: /example/api
        jobs:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-jobs:1.0.0
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              task_role_arn: arn:aws:iam::123456789012:role/example-jobs-task-role
        nightly:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-nightly:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              scheduler_role_arn: arn:aws:iam::123456789012:role/example-scheduler-role
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              awslogs_group: /example/nightly
        # The backfill task renders no schedule, so it names no scheduler role;
        # the cluster and network are what the operator starts each run with.
        backfill:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-backfill:1.0.0
            compute:
              cpu: "2"
              memory: 4Gi
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              assign_public_ip: true
