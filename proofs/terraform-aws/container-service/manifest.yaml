apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS through Terraform: the placeholder product bound to its service
    Recipe, and the digest component of the same type, by name, to its task
    Recipe; PostgreSQL to Amazon RDS.
spec:
  mappings:
    components:
      type:
        core/datastore/postgres:1.0.0: terraform/postgres-rds:1.0.0
        example/compute/sample-product:1.0.0: terraform/sample-product-ecs:1.0.0
      name:
        digest: terraform/sample-product-task-ecs:1.0.0
