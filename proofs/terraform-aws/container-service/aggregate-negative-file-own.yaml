apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-file-own
  version: "1.0.0"
  description: >
    A component's own inject block dictating a file.
spec:
  components:
    product:
      type: example/compute/sample-product
      inject:
        file:
          - in: /etc/sample/greeting.txt
            value: '{{"{{"}} .values.greeting }}'
