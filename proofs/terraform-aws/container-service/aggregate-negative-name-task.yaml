apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-name-task
  version: "1.0.0"
  description: >
    A task whose component name an EventBridge Scheduler schedule cannot take.
spec:
  components:
    sample-product-task-named-longer-than-an-eventbridge-schedule-takes:
      type: example/compute/sample-product
      values:
        schedule: "30 2 * * *"
