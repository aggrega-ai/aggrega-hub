# A service whose component name Amazon ECS cannot take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-name-service
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-name-service.yaml
  manifest: negative
  boundaries:
    aws:
      directory: main
      components:
        sample-product-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:
          infra:
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
