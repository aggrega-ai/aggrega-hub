# A product Recipe declaring a probe path.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-fault-probe-path
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-product.yaml
  manifest: ./manifest-negative-fault-probe-path.yaml
  boundaries:
    aws:
      directory: main
      components:
        product:
          infra:
            overrides:
              cluster: example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
