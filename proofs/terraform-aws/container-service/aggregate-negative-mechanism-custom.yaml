apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-mechanism-custom
  version: "1.0.0"
  description: >
    A connection dictating an entry under a delivery mechanism of its own.
spec:
  components:
    peer:
      type: example/compute/sample-product
    product:
      type: example/compute/sample-product
      uses:
        peers:
          peer:
            target: peer
            inject:
              ssm_param:
                - in: /sample/peer
                  from: endpoint
