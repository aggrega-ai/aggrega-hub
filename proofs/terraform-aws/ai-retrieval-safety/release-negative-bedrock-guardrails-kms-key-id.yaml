# infra.overrides.kms_key_id names the key by an alias's ARN.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-guardrails-kms-key-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-guardrails-only.yaml
  manifest: ./manifest-bedrock-guardrails.yaml
  boundaries:
    aws:
      directory: main
      components:
        support-guardrail:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:us-east-1:123456789012:alias/example-guardrail-key
