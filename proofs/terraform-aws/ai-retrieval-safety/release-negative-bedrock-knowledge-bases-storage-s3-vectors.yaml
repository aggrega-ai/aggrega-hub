# An S3 vector index named both by its ARN and by its name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-storage-s3-vectors
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: S3_VECTORS
                s3_vectors_configuration:
                  index_arn: arn:aws:s3vectors:us-east-1:123456789012:bucket/example-vectors/index/product-docs-index
                  index_name: product-docs-index
