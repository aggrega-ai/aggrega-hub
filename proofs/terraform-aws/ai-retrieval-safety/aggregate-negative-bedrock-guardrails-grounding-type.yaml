apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-grounding-type
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose contextual grounding check is of a type Amazon Bedrock does not have.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        contextual_grounding_policy_config:
          filters_config:
            - type: HALLUCINATION
              threshold: 0.7
