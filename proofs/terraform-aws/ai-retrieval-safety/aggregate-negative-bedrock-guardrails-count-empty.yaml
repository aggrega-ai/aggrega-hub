apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-count-empty
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose sensitive information policy declares
    an empty list of PII entities, where Amazon Bedrock takes at least one.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        sensitive_information_policy_config:
          pii_entities_config: []
