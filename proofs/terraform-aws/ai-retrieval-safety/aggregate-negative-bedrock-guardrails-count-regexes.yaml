apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-count-regexes
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose sensitive information policy declares
    more regular expressions than the thirty Amazon Bedrock takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        sensitive_information_policy_config:
          regexes_config:
            - name: Order number 01
              pattern: ORD01-[0-9]{8}
              action: ANONYMIZE
            - name: Order number 02
              pattern: ORD02-[0-9]{8}
              action: ANONYMIZE
