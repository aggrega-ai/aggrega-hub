apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-pii-type
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose personal information filter names a
    type Amazon Bedrock does not detect.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        sensitive_information_policy_config:
          pii_entities_config:
            - type: SOCIAL_SECURITY_NUMBER
              action: BLOCK
