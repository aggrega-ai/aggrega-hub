apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-retrieval-safety
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One root configuration, so the knowledge base, the agent, the
    # guardrail and the server are modules of one Terraform configuration.
    # The knowledge base embeds with an Amazon Titan model into an index of
    # an OpenSearch Serverless collection, and names no bucket, so no data
    # source is created: its documents reach the index through a data source
    # connected in Amazon Bedrock. The agent's module declares no resource.
    # The guardrail names no KMS key, so Amazon Bedrock encrypts it with a
    # key AWS manages. The server's environment carries the knowledge base's
    # ID, ARN and agent runtime endpoint and the guardrail's ID, version and
    # ARN as references to the outputs of their modules.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the knowledge base's role,
    # the collection and its index, the subnet, the security group, the ECS
    # cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: OPENSEARCH_SERVERLESS
                opensearch_serverless_configuration:
                  collection_arn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  vector_index_name: product-docs-index
                  field_mapping:
                    vector_field: embeddings
                    text_field: AMAZON_BEDROCK_TEXT_CHUNK
                    metadata_field: AMAZON_BEDROCK_METADATA

        support-agent:
          infra:
            endpoint: https://bedrock-agent-runtime.us-east-1.amazonaws.com

        support-guardrail: {}

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
