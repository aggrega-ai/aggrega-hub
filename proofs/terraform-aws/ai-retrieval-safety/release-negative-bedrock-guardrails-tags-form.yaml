# infra.overrides.tags names a tag with a character Amazon Bedrock does not
# take.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-guardrails-tags-form
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-guardrails-only.yaml
  manifest: ./manifest-bedrock-guardrails.yaml
  boundaries:
    aws:
      directory: main
      components:
        support-guardrail:
          infra:
            overrides:
              tags:
                cost#center: example
