# An Amazon Neptune Analytics store with a bucket, whose data source would
# build the graph with a model no key names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-neptune-bucket
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: NEPTUNE_ANALYTICS
                neptune_analytics_configuration:
                  graph_arn: arn:aws:neptune-graph:us-east-1:123456789012:graph/g-0000000000
                  field_mapping:
                    text_field: text
                    metadata_field: metadata
              bucket_arn: arn:aws:s3:::example-product-docs
