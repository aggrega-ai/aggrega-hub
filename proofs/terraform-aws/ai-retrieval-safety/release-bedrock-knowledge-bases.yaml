apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bedrock-knowledge-bases
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    # Every key the Amazon Bedrock Knowledge Bases Recipe reads, set: the
    # knowledge base embeds with an Amazon Titan model into a table of an
    # Amazon Aurora PostgreSQL cluster, under the custom metadata column too,
    # carries the operator's tags, and a data source reads the objects under
    # manuals/ in the operator's bucket.
    #
    # The role, the cluster, its table, the secret holding its credentials and
    # the bucket are placeholders for ones the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: RDS
                rds_configuration:
                  resource_arn: arn:aws:rds:us-east-1:123456789012:cluster:example-cluster
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  database_name: example_db
                  table_name: bedrock_integration.bedrock_kb
                  field_mapping:
                    primary_key_field: id
                    vector_field: embedding
                    text_field: chunks
                    metadata_field: metadata
                    custom_metadata_field: custom_metadata
              bucket_arn: arn:aws:s3:::example-product-docs
              inclusion_prefixes:
                - manuals/
              tags:
                team: docs
                cost-center: example
