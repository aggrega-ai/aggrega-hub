# A store of type OPENSEARCH_SERVERLESS described by an Amazon Aurora
# configuration.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-storage-configuration-object
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: OPENSEARCH_SERVERLESS
                rds_configuration:
                  resource_arn: arn:aws:rds:us-east-1:123456789012:cluster:example-cluster
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  database_name: example_db
                  table_name: bedrock_integration.bedrock_kb
                  field_mapping:
                    primary_key_field: id
                    vector_field: embedding
                    text_field: chunks
                    metadata_field: metadata
                    custom_metadata_field: custom_metadata
