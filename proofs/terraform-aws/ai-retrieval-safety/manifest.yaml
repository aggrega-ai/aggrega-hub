apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: ai-retrieval-safety
  version: "1.0.0"
  description: >
    AWS through Terraform: the Amazon Bedrock knowledge base and the Amazon
    Bedrock guardrail bound to their Recipes, the Amazon Bedrock agent to
    its reference Recipe and the generic server to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/bedrock-knowledge-bases:1.0.0: terraform/bedrock-knowledge-bases:1.0.0
        core/ai-agent/bedrock:1.0.0: terraform/bedrock-agent:1.0.0
        core/security/bedrock-guardrails:1.0.0: terraform/bedrock-guardrails:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
