apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-bedrock-guardrails-topic-definition
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail whose denied topic's definition is longer
    than the 200 characters the Classic tier takes.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        topic_policy_config:
          topics_config:
            - name: Investment advice
              definition: "Recommendations about investing money or choosing financial products, Recommendations about investing money or choosing financial products, Recommendations about investing money or choosing financial p"
              type: DENY
