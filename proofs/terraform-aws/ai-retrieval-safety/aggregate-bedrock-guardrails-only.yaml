apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-guardrails-only
  version: "1.0.0"
  description: >
    An Amazon Bedrock guardrail alone, every policy and every key of each
    policy set, for the Releases that prove what the Amazon Bedrock
    Guardrails Recipe writes and refuses on its own.
spec:
  components:
    support-guardrail:
      type: core/security/bedrock-guardrails
      values:
        blocked_input_messaging: This question cannot be answered here. Please contact support.
        blocked_outputs_messaging: The answer was withheld. Please contact support.
        content_policy_config:
          filters_config:
            - type: SEXUAL
              input_strength: HIGH
              output_strength: HIGH
            - type: VIOLENCE
              input_strength: MEDIUM
              output_strength: MEDIUM
            - type: HATE
              input_strength: HIGH
              output_strength: HIGH
            - type: INSULTS
              input_strength: MEDIUM
              output_strength: LOW
            - type: MISCONDUCT
              input_strength: HIGH
              output_strength: HIGH
            - type: PROMPT_ATTACK
              input_strength: HIGH
              output_strength: NONE
        topic_policy_config:
          topics_config:
            - name: Investment advice
              definition: Recommendations about investing money or choosing financial products.
              examples:
                - Should I buy shares in this company?
                - Which fund should I put my savings in?
              type: DENY
            - name: Legal advice
              definition: Guidance on how the law applies to a person's own situation.
              type: DENY
        word_policy_config:
          words_config:
            - text: competitor-product
            - text: internal codename
            # Text Terraform would read as an interpolation and a directive, which
            # the body writes escaped so that Amazon Bedrock receives it as written.
            - text: ${system_prompt}
            - text: "%{ if admin }"
          managed_word_lists_config:
            - type: PROFANITY
        sensitive_information_policy_config:
          pii_entities_config:
            - type: EMAIL
              action: ANONYMIZE
            - type: US_SOCIAL_SECURITY_NUMBER
              action: BLOCK
            - type: PHONE
              action: NONE
          regexes_config:
            - name: Order number
              pattern: ORD-[0-9]{8}
              action: ANONYMIZE
              description: An order number, ORD- followed by eight digits.
        contextual_grounding_policy_config:
          filters_config:
            - type: GROUNDING
              threshold: 0.75
            - type: RELEVANCE
              threshold: 0.5
