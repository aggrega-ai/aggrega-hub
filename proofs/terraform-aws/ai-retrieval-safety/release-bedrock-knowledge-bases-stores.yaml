apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bedrock-knowledge-bases-stores
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-stores.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    # Each vector store the Recipe takes, one for each knowledge base, with
    # every field the store takes set: an OpenSearch Serverless collection, an
    # OpenSearch Service domain, a Pinecone index, an Amazon Aurora cluster, a
    # Redis Enterprise Cloud database, an Amazon Neptune Analytics graph, an S3
    # vector index named by its bucket and its name, and a MongoDB Atlas
    # collection. No bucket is named, so no data source is created.
    #
    # Every store, secret and role is a placeholder for one the operator
    # already has in AWS account 123456789012, or with the store's own
    # provider at example.com.
    aws:
      directory: main
      components:
        docs-opensearch:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: OPENSEARCH_SERVERLESS
                opensearch_serverless_configuration:
                  collection_arn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  vector_index_name: product-docs-index
                  field_mapping:
                    vector_field: embeddings
                    text_field: AMAZON_BEDROCK_TEXT_CHUNK
                    metadata_field: AMAZON_BEDROCK_METADATA

        docs-opensearch-domain:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: OPENSEARCH_MANAGED_CLUSTER
                opensearch_managed_cluster_configuration:
                  domain_arn: arn:aws:es:us-east-1:123456789012:domain/example-domain
                  domain_endpoint: https://search-example-domain.us-east-1.es.amazonaws.com
                  vector_index_name: product-docs-index
                  field_mapping:
                    vector_field: embeddings
                    text_field: AMAZON_BEDROCK_TEXT_CHUNK
                    metadata_field: AMAZON_BEDROCK_METADATA

        docs-pinecone:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: PINECONE
                pinecone_configuration:
                  connection_string: https://product-docs.example.com
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  namespace: product-docs
                  field_mapping:
                    text_field: text
                    metadata_field: metadata

        docs-aurora:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: RDS
                rds_configuration:
                  resource_arn: arn:aws:rds:us-east-1:123456789012:cluster:example-cluster
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  database_name: example_db
                  table_name: bedrock_integration.bedrock_kb
                  field_mapping:
                    primary_key_field: id
                    vector_field: embedding
                    text_field: chunks
                    metadata_field: metadata
                    custom_metadata_field: custom_metadata

        docs-neptune:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: NEPTUNE_ANALYTICS
                neptune_analytics_configuration:
                  graph_arn: arn:aws:neptune-graph:us-east-1:123456789012:graph/g-0000000000
                  field_mapping:
                    text_field: text
                    metadata_field: metadata

        docs-s3-vectors:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: S3_VECTORS
                s3_vectors_configuration:
                  vector_bucket_arn: arn:aws:s3vectors:us-east-1:123456789012:bucket/example-vectors
                  index_name: product-docs-index

        docs-mongodb:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: MONGO_DB_ATLAS
                mongo_db_atlas_configuration:
                  endpoint: example-cluster.abcde.mongodb.net
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  database_name: example_db
                  collection_name: product_docs
                  vector_index_name: vector_index
                  text_index_name: text_index
                  endpoint_service_name: com.amazonaws.vpce.us-east-1.vpce-svc-00000000000000000
                  field_mapping:
                    vector_field: embedding
                    text_field: text
                    metadata_field: metadata

        docs-redis:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: REDIS_ENTERPRISE_CLOUD
                redis_enterprise_cloud_configuration:
                  endpoint: redis-00000.example.com:00000
                  credentials_secret_arn: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-store-credentials
                  vector_index_name: product-docs-index
                  field_mapping:
                    vector_field: embedding
                    text_field: text
                    metadata_field: metadata
