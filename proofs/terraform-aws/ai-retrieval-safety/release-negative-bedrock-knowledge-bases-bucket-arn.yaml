# infra.overrides.bucket_arn names a bucket with capitals and underscores,
# which no S3 bucket name holds.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-knowledge-bases-bucket-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-knowledge-bases-only.yaml
  manifest: ./manifest-bedrock-knowledge-bases.yaml
  boundaries:
    aws:
      directory: main
      components:
        product-docs:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-knowledge-base-role
              embedding_model_arn: arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0
              storage_configuration:
                type: OPENSEARCH_SERVERLESS
                opensearch_serverless_configuration:
                  collection_arn: arn:aws:aoss:us-east-1:123456789012:collection/example-collection
                  vector_index_name: product-docs-index
                  field_mapping:
                    vector_field: embeddings
                    text_field: AMAZON_BEDROCK_TEXT_CHUNK
                    metadata_field: AMAZON_BEDROCK_METADATA
              bucket_arn: arn:aws:s3:::Example_Product_Docs
