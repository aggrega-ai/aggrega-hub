# No infra.endpoint: the Amazon Bedrock runtime the embedding model is
# reached at is left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-embedding-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-embedding-only.yaml
  manifest: ./manifest-bedrock-embedding.yaml
  boundaries:
    aws:
      directory: main
      components:
        search-embedding: {}
