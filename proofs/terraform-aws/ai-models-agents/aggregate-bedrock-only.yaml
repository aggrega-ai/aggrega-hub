apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-only
  version: "1.0.0"
  description: >
    An Amazon Bedrock model alone, for the Releases that prove what the
    Amazon Bedrock model Recipe refuses on its own.
spec:
  components:
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0
