# No infra.endpoint: the Amazon SageMaker runtime the model's endpoint is
# invoked through is left unnamed.
#
# This group holds no negative for a root of reference realizations alone, as
# the cloudformation group does: a Terraform root holding only outputs is
# valid, so no halt exists to prove.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sagemaker-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sagemaker-only.yaml
  manifest: ./manifest-sagemaker.yaml
  boundaries:
    aws:
      directory: main
      components:
        scoring-model: {}
