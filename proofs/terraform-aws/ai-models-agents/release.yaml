apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ai-models-agents
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One root configuration, so the models and the server are modules of one
    # Terraform configuration. Each model's module declares no resource: its
    # endpoint and identifier are outputs of that module, and the server's
    # environment carries them as the text the Release and the Aggregate
    # give.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        assistant-model:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        search-embedding:
          infra:
            endpoint: https://bedrock-runtime.us-east-1.amazonaws.com

        scoring-model:
          infra:
            endpoint: https://runtime.sagemaker.us-east-1.amazonaws.com

        api:
          infra:
            image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/example-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:us-east-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
