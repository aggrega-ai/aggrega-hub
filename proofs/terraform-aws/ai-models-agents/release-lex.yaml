apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: lex
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-lex-only.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    # The bot alone, with every key the Terraform Recipe reads set: the bot
    # runs as the operator's role, named with a path holding ${, which reaches
    # Lex as written, and carries tags of the characters Amazon Lex takes.
    # The role is a placeholder for one the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/service-role/orders${team}/example-lex-role
              tags:
                team: orders
                contact: orders@example.com
