apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: ai-models-agents
  version: "1.0.0"
  description: >
    An Amazon Bedrock model, an Amazon Bedrock embedding model and a server
    on Amazon ECS reading the endpoint and the model identifier each
    publishes, so the server's environment shows what a consumer of each
    receives.
spec:
  components:
    # The model the server sends its invocation requests to, served by
    # Amazon Bedrock outside the Release under its model identifier.
    assistant-model:
      type: core/ai-model/bedrock
      values:
        model: amazon.nova-lite-v1:0

    # The embedding model the server sends the text it indexes to, served by
    # Amazon Bedrock outside the Release under its model identifier.
    search-embedding:
      type: core/ai-model/bedrock-embedding
      values:
        model: amazon.titan-embed-text-v2:0

    api:
      type: core/compute/server
      uses:
        model:
          assistant-model:
            target: assistant-model
            inject:
              env:
                - in: MODEL_ENDPOINT
                  from: endpoint
                - in: MODEL_ID
                  from: model
        embedding:
          search-embedding:
            target: search-embedding
            inject:
              env:
                - in: EMBEDDING_ENDPOINT
                  from: endpoint
                - in: EMBEDDING_MODEL_ID
                  from: model
