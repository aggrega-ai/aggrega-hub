# No infra.endpoint: the Amazon Bedrock runtime the model is reached at is
# left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-only.yaml
  manifest: ./manifest-bedrock.yaml
  boundaries:
    aws:
      directory: main
      components:
        assistant-model: {}
