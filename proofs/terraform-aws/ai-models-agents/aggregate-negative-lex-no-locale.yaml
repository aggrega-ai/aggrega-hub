apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-no-locale
  version: "1.0.0"
  description: >
    An Amazon Lex bot declaring no locale, so it would answer nothing.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales: []
