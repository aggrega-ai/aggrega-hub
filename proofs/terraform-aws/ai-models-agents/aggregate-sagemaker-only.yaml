apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sagemaker-only
  version: "1.0.0"
  description: >
    A model served from an Amazon SageMaker endpoint alone, for the Releases
    that prove what the Amazon SageMaker model Recipe refuses on its own.
spec:
  components:
    scoring-model:
      type: core/ai-model/sagemaker
      values:
        model: example-endpoint
        endpoint_name: example-endpoint
