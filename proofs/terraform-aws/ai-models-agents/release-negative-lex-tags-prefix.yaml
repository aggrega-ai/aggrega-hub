# infra.overrides.tags holding a tag name with the prefix aws:, which Amazon
# Lex reserves.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-lex-tags-prefix
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-lex-only.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-lex-role
              tags:
                aws:team: orders
