# No infra.endpoint: the Amazon Bedrock agent runtime the agent is reached
# at is left unnamed.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-bedrock-agent-endpoint
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-bedrock-agent-only.yaml
  manifest: ./manifest-bedrock-agent.yaml
  boundaries:
    aws:
      directory: main
      components:
        support-agent: {}
