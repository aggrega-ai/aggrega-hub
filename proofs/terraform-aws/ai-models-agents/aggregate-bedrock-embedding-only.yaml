apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-embedding-only
  version: "1.0.0"
  description: >
    An Amazon Bedrock embedding model alone, for the Releases that prove
    what the Amazon Bedrock embedding model Recipe refuses on its own.
spec:
  components:
    search-embedding:
      type: core/ai-model/bedrock-embedding
      values:
        model: amazon.titan-embed-text-v2:0
