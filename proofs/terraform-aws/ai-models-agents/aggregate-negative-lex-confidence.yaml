apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-confidence
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose locale sets a confidence threshold of 1.5, above
    the 1 Amazon Lex takes.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 1.5
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
