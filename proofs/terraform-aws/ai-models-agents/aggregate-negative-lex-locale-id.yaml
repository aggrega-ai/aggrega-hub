apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-lex-locale-id
  version: "1.0.0"
  description: >
    An Amazon Lex bot whose locale_id joins its language and region codes
    with a hyphen, where Amazon Lex writes an underscore.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 300
        bot_locales:
          - locale_id: en-US
            nlu_confidence_threshold: 0.4
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
