# infra.overrides.host, for a bot that publishes no address.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-lex-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-lex-only.yaml
  manifest: ./manifest-lex.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-bot:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-lex-role
              host: bot.example.com
