apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: bedrock-agent-only
  version: "1.0.0"
  description: >
    An Amazon Bedrock agent alone, for the Release that proves what the
    Amazon Bedrock agent Recipe refuses on its own.
spec:
  components:
    support-agent:
      type: core/ai-agent/bedrock
      values:
        agent_name: example-support-agent
        instruction: Answer questions about orders and hand anything else to a person.
