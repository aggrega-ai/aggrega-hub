apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: lex-only
  version: "1.0.0"
  description: >
    An Amazon Lex bot alone, taking orders for flowers in English and in
    Italian, with every key of the bot's locales the Terraform Recipe takes
    set, for the Releases that prove what that Recipe writes and refuses on
    its own.
spec:
  components:
    order-bot:
      type: core/ai-agent/lex
      values:
        child_directed: false
        idle_session_ttl_in_seconds: 600
        bot_locales:
          - locale_id: en_US
            nlu_confidence_threshold: 0.4
            slot_types:
              - name: FlowerTypes
                slot_type_values:
                  - sample_value:
                      value: roses
                  - sample_value:
                      value: lilies
                    synonyms:
                      - value: lily
                      - value: calla
                value_selection_setting:
                  resolution_strategy: TOP_RESOLUTION
              - name: Sizes
                slot_type_values:
                  - sample_value:
                      value: small
                  - sample_value:
                      value: large
            intents:
              - name: OrderFlowers
                sample_utterances:
                  - utterance: I would like to order some flowers
                  - utterance: I want a bouquet
              - name: CancelOrder
          - locale_id: it_IT
            nlu_confidence_threshold: 0.5
            intents:
              - name: OrdinaFiori
                sample_utterances:
                  - utterance: Vorrei ordinare dei fiori
