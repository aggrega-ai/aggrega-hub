apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-host-uppercase
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: host has an upper-case letter, which the custom domain's name
    # does not take.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              host: "API.example.com"
              custom_endpoint_certificate_arn: arn:aws:acm:eu-west-1:123456789012:certificate/00000000-0000-0000-0000-000000000000

        assets:
          infra:
            region: eu-west-1
