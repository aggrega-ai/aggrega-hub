apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: the KMS key named by an alias name rather than by an ARN, which
    # the AWS provider takes it by alone.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
              kms_key_id: alias/example-media
