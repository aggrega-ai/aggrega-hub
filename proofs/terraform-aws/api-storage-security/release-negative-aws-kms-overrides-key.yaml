apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: enable_key_rotations, a misspelling of enable_key_rotation,
    # which this Recipe does not read.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              enable_key_rotations: true
