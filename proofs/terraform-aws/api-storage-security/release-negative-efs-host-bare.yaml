apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-host-bare
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: the host given as a URL, with a scheme, rather than a bare name.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
              host: nfs://files.example.com
