apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: amazon-api-gateway-public
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-public.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One root configuration: the API's integration URL joins the bucket's
    # published host and port, and the server's ASSETS_HOST and
    # ASSETS_ENDPOINT carry references to the API module's outputs. No
    # override is set on the API.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      components:
        assets-entry: {}

        assets:
          infra:
            region: eu-west-1

        catalog-ui:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-catalog-ui:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
