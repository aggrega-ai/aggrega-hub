apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-kms-signing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-signing.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # The signing key under the operator's key policy: the account keeps
    # every KMS action on the key, as KMS's default key policy gives it, and
    # the document signer's role signs, verifies and reads the public key.
    #
    # The signer's statement also carries a policy variable, ${aws:username},
    # which the Recipe escapes so Terraform leaves it for KMS to resolve, and
    # a condition value holding %{, which reaches KMS as written.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the role.
    aws:
      directory: main
      components:
        document-signing:
          infra:
            overrides:
              policy:
                Version: "2012-10-17"
                Statement:
                  - Sid: Enable IAM User Permissions
                    Effect: Allow
                    Principal:
                      AWS: arn:aws:iam::123456789012:root
                    Action: kms:*
                    Resource: "*"
                  - Sid: Allow document signing
                    Effect: Allow
                    Principal:
                      AWS: arn:aws:iam::123456789012:role/example-document-signer
                    Action:
                      - kms:DescribeKey
                      - kms:GetPublicKey
                      - kms:Sign
                      - kms:Verify
                    Resource: "*"
                    Condition:
                      StringEquals:
                        aws:PrincipalTag/signer: ${aws:username}
                        aws:PrincipalTag/team: "%{not-directive}"
