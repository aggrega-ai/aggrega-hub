apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cognito-lite
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito-only.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # The Component's defaults on the Lite feature plan, which takes the
    # client's SRP and token refresh flows.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              user_pool_tier: LITE
