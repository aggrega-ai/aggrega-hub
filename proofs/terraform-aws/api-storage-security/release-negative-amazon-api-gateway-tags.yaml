apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: tags holds a number, where each tag's value is a string.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              tags:
                cost-center: 1234

        assets:
          infra:
            region: eu-west-1
