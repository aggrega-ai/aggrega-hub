apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-domain-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-aws-certificate-manager-domain-name.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: the Aggregate names a domain_name of one label; the Release
    # adds nothing else.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              zone_id: Z00000000000000000000
