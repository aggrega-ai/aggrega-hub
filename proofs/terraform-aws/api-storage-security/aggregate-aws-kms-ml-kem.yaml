apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-kms-ml-kem
  version: "1.0.0"
  description: >
    An ML-KEM KMS key that encapsulates and decapsulates shared secrets,
    under the alias alias/example-key-exchange, on its own.
spec:
  components:
    key-exchange:
      type: core/security/aws-kms
      values:
        key_spec: ML_KEM_768
        key_usage: ENCAPSULATE_DECAPSULATE
        alias_name: alias/example-key-exchange
