apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-zone-id-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: zone_id written as a list, where it is one zone ID.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              zone_id:
                - Z00000000000000000000
