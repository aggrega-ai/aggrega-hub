apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-kms
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One root configuration, so the key and the server are modules of one
    # Terraform configuration, and the server's environment carries
    # references to the key module's outputs, which Terraform resolves at
    # apply. The key rotates yearly, takes the account's default statement as
    # its key policy, is deleted 7 days after it is destroyed, and carries the
    # tags.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        records-encryption:
          infra:
            overrides:
              enable_key_rotation: true
              deletion_window_in_days: 7
              tags:
                team: records
                cost-center: "1234"

        records-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-records-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
