apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: throughput_mod, a misspelling of throughput_mode, which this
    # Recipe does not read.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
              throughput_mod: elastic
