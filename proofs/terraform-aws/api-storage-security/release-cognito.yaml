apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: cognito
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cognito.yaml
  manifest: ./manifest-cognito.yaml
  boundaries:
    # One root configuration, so the pool and the server are modules of one
    # Terraform configuration, and the server's environment carries
    # references to the pool module's outputs, which Terraform resolves at
    # apply. The pool takes the Essentials feature plan, the default, and
    # carries the tags.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        members:
          infra:
            overrides:
              tags:
                team: members
                cost-center: "1234"

        members-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-members-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
