apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-tags-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: tags carries Name, which the module overwrites with the
    # component's name.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
              tags:
                Name: example-media
