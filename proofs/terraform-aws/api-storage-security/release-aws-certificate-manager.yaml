apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-certificate-manager
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One root configuration, so the certificate and the server are modules
    # of one Terraform configuration, and the server's environment carries a
    # reference to the certificate module's output, which Terraform resolves
    # once ACM has issued the certificate. The validation record goes into
    # the operator's hosted zone, and the certificate carries the tags, one
    # holding ${, %{ and a double quote, which reach ACM as written.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone serving
    # example.com, the subnet, the security group, the ECS cluster and the
    # execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        site-certificate:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              tags:
                team: site
                note: '${not-interpolated} "quoted" %{not-directive}'
                cost-center: "1234"

        site-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-site-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
