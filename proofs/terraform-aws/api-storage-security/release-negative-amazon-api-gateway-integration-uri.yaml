apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-integration-uri
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: integration_uri names a target group, where a VPC link
    # integration takes a listener or an AWS Cloud Map service.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              connection_id: examplelink
              integration_uri: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-orders/0000000000000000

        assets:
          infra:
            region: eu-west-1
