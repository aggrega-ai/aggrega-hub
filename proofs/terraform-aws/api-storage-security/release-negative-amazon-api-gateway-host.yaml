apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: host names the API, and custom_endpoint_certificate_arn, the
    # certificate its custom domain presents, is not set.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              host: api.example.com

        assets:
          infra:
            region: eu-west-1
