apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-connection-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: connection_id is a list rather than the VPC link's ID.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              connection_id: [examplelink]
              integration_uri: arn:aws:elasticloadbalancing:eu-west-1:123456789012:listener/app/example-internal/0000000000000000/0000000000000000

        assets:
          infra:
            region: eu-west-1
