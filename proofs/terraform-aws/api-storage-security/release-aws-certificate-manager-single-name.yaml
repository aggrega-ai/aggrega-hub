apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: aws-certificate-manager-single-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # A certificate of one name, with no further names, on its own. The hosted
    # zone is a placeholder for the operator's zone serving example.com.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              zone_id: Z00000000000000000000
