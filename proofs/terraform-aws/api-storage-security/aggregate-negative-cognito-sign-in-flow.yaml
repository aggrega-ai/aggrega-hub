apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cognito-sign-in-flow
  version: "1.0.0"
  description: >
    One fault: the client's flows name token refresh alone, which signs no
    one in.
spec:
  components:
    scratch:
      type: core/security/cognito
      values:
        explicit_auth_flows:
          - ALLOW_REFRESH_TOKEN_AUTH
