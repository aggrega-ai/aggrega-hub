apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: tags holds a number, where each tag's value is a string.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              tags:
                cost-center: 1234
