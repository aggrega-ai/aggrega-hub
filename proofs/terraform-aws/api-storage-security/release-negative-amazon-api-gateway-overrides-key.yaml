apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-amazon-api-gateway-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway-only.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One fault: connectionid, a misspelling of connection_id, which this Recipe
    # does not read.
    aws:
      directory: main
      components:
        edge:
          infra:
            overrides:
              connectionid: examplelink

        assets:
          infra:
            region: eu-west-1
