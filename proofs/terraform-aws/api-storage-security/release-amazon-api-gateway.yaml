apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: amazon-api-gateway
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-amazon-api-gateway.yaml
  manifest: ./manifest-amazon-api-gateway.yaml
  boundaries:
    # One root configuration, so the API and both servers are modules of one
    # Terraform configuration. The API forwards through the operator's VPC
    # link to the listener of the operator's internal Application Load
    # Balancer, whose target group the orders server registers its tasks
    # with; the API answers at api.example.com through a custom domain
    # presenting the operator's certificate, and the storefront reads that
    # name. The API, its stage and its custom domain carry the tags.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the VPC link, the listener,
    # the target group, the certificate, the ECS cluster, the subnet, the
    # security group and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        orders-entry:
          infra:
            overrides:
              connection_id: examplelink
              integration_uri: arn:aws:elasticloadbalancing:eu-west-1:123456789012:listener/app/example-internal/0000000000000000/0000000000000000
              host: api.example.com
              custom_endpoint_certificate_arn: arn:aws:acm:eu-west-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
              tags:
                team: orders
                cost-center: "1234"

        orders-api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-orders:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              target_group_arn: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/example-orders/0000000000000000

        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
