apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-deletion-window-fraction
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: deletion_window_in_days 7.5, which is not a whole number of days.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              deletion_window_in_days: 7.5
