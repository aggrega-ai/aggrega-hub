apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-kms
  version: "1.0.0"
  description: >
    A KMS key encrypting records, under the alias alias/example-records, and
    a records API server on Amazon ECS reading its ID and its ARN, so the
    server's environment shows what a client of the key receives.
spec:
  components:
    records-encryption:
      type: core/security/aws-kms
      values:
        alias_name: alias/example-records

    records-api:
      type: core/compute/server
      uses:
        encryption:
          records-encryption:
            target: records-encryption
            inject:
              env:
                - in: RECORDS_KEY_ID
                  from: key_id
                - in: RECORDS_KEY_ARN
                  from: arn
