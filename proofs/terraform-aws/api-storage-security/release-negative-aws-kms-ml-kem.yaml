apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-ml-kem
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-ml-kem.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: an ML-KEM key spec, in the Aggregate, which the AWS provider
    # does not take.
    aws:
      directory: main
      components:
        key-exchange: {}
