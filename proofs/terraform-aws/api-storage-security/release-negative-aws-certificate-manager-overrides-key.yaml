apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-certificate-manager-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-certificate-manager-only.yaml
  manifest: ./manifest-aws-certificate-manager.yaml
  boundaries:
    # One fault: zone_ids, a misspelling of zone_id, which this Recipe does
    # not read, beside the zone_id it requires.
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              zone_ids: Z00000000000000000000
