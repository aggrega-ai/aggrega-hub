apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-max-io-elastic
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: the maxIO performance mode with elastic throughput, which Amazon
    # EFS does not take together.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
              performance_mode: maxIO
              throughput_mode: elastic
