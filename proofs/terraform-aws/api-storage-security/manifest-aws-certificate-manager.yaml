apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: aws-certificate-manager
  version: "1.0.0"
  description: >
    AWS through Terraform: the certificate bound to its AWS Certificate
    Manager Recipe and the generic server to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/security/aws-certificate-manager:1.0.0: terraform/aws-certificate-manager:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
