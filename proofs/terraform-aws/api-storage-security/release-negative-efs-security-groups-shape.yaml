apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-efs-security-groups-shape
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs-only.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One fault: a security group named by its name rather than by its ID.
    aws:
      directory: main
      components:
        scratch-files:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - example-nfs-clients
