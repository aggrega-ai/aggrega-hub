apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cognito-only
  version: "1.0.0"
  description: >
    A user pool with the Component's defaults: users choose a username, no
    attribute is verified, no second factor, and a client signing in by SRP
    and renewing its tokens.
spec:
  components:
    scratch:
      type: core/security/cognito
