apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: efs
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One root configuration, so the file system and the server are modules
    # of one Terraform configuration, and the server's environment carries
    # references to the file system module's outputs, which Terraform
    # resolves at apply. The file system has a mount target in each of two
    # subnets, runs in elastic throughput, its file contents are encrypted
    # under the operator's key, and it carries the tags.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnets, in two
    # Availability Zones of one VPC, the security groups, the KMS key, the ECS
    # cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        shared-media:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
                - subnet-0000000000000000b
              vpc_security_groups:
                - sg-0000000000000000e
              throughput_mode: elastic
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              tags:
                team: media
                cost-center: "1234"

        media-renderer:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-media-renderer:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
