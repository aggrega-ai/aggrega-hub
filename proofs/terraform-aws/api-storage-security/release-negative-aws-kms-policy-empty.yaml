apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-aws-kms-policy-empty
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-aws-kms-only.yaml
  manifest: ./manifest-aws-kms.yaml
  boundaries:
    # One fault: policy an empty mapping, where it takes the policy document
    aws:
      directory: main
      components:
        scratch:
          infra:
            overrides:
              policy: {}
