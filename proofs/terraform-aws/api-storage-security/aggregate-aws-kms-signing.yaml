apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aws-kms-signing
  version: "1.0.0"
  description: >
    An RSA KMS key that signs documents and verifies their signatures, with
    no alias, on its own.
spec:
  components:
    document-signing:
      type: core/security/aws-kms
      values:
        key_spec: RSA_3072
        key_usage: SIGN_VERIFY
