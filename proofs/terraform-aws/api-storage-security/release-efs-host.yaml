apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: efs-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-efs.yaml
  manifest: ./manifest-efs.yaml
  boundaries:
    # One root configuration. The file system is mounted at
    # files.example.com, a name the operator points at its mount targets
    # outside the Release, and the server's environment carries that name; it
    # runs in the maxIO performance mode with 128 MiB a second of provisioned
    # throughput, and its file contents are encrypted under the key an alias
    # of the operator's names.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the subnet, the security
    # groups, the KMS key and its alias, the ECS cluster and the execution
    # role.
    aws:
      directory: main
      syncWave: 0
      components:
        shared-media:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-0000000000000000e
                - sg-0000000000000000f
              performance_mode: maxIO
              throughput_mode: provisioned
              provisioned_throughput_in_mibps: 128
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:alias/example-media
              host: files.example.com

        media-renderer:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-media-renderer:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
