apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cognito-user-auth
  version: "1.0.0"
  description: >
    A user pool whose client signs users in by choice-based sign-in, which
    Cognito takes on the Essentials feature plan or higher.
spec:
  components:
    scratch:
      type: core/security/cognito
      values:
        explicit_auth_flows:
          - ALLOW_USER_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
