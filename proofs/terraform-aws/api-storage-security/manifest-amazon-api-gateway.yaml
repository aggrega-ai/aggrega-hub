apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: amazon-api-gateway
  version: "1.0.0"
  description: >
    AWS through Terraform: the HTTP API bound to its Amazon API Gateway
    Recipe, the generic server to its Amazon ECS Recipe and the object store
    to its Amazon S3 Recipe.
spec:
  mappings:
    components:
      type:
        core/gateway/amazon-api-gateway:1.0.0: terraform/amazon-api-gateway:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
        core/storage/s3-object-store:1.0.0: terraform/s3-object-store-amazon-s3:1.0.0
