apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-kms-key-alias
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.kms_key_id is an alias ARN beside output_location,
    # where Athena's S3 encryption configuration names the key by ID or ARN.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              output_location: s3://example-athena-results/sales/
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:alias/example
