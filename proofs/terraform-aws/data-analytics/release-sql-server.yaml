apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One boundary, so the database and the server are module blocks of one
    # Terraform root configuration and the server's LEDGER_DB_HOST carries
    # the reference to the module's address output, which Terraform resolves
    # when it applies. The instance runs SQL Server 2022 Standard with a
    # standby in another Availability Zone, keeps its automated backups 14
    # days in a window opening at 02:30 UTC, encrypts its storage with the
    # operator's key, is protected from deletion and carries tags, one
    # holding ${, %{ and a double quote, which reach RDS as written; RDS keeps
    # its master password.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the DB subnet group, the
    # security group, the parameter group, the KMS key, the ECS cluster, the
    # subnets and the execution role.
    # The subnet group's name holds spaces, which RDS takes in the name of a
    # DB subnet group.
    aws:
      directory: main
      components:
        ledger-db:
          features:
            password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
                schedule: "30 2 * * *"
          infra:
            ha:
              enabled: true
            storage:
              size: 100Gi
            overrides:
              engine: sqlserver-se
              license_model: license-included
              instance_class: db.m6i.large
              subnet_group: example private db subnets
              vpc_security_groups:
                - sg-00000000000000000
              parameter_group: example-sqlserver-se-16
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              deletion_protection: true
              tags:
                team: ledger
                note: '${not-interpolated} "quoted" %{not-directive}'

        bookkeeper:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-bookkeeper:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
