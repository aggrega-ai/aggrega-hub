apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redshift-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # The warehouse on the Component's defaults and no override: the service
    # chooses its base capacity, subnets and security group, and no credential
    # is attached.
    aws:
      directory: main
      components:
        events-warehouse:
          infra: {}
