apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: core/backup keeps each backup 36 days, more than the 35 Amazon RDS
    # keeps automated backups for.
    aws:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 36
