apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-kms-key-alias
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.kms_key_id is an alias's ARN, and Amazon
    # Redshift Serverless reports the key the namespace is encrypted with.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:alias/example-warehouse-key
