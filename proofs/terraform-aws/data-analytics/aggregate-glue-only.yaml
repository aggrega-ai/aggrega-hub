apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: glue-only
  version: "1.0.0"
  description: >
    An AWS Glue Data Catalog database for clickstream data, on its own.
spec:
  components:
    clickstream-catalog:
      type: core/bigdata/glue
      values:
        database: clickstream_events
