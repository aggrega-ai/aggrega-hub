apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.host carries a port, which a consumer would add
    # to infra.port and compose a broken connection from.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              host: warehouse.example.com:5439
