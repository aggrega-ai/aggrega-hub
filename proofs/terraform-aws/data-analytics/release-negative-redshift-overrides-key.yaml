apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.security_group_ids is a key this Recipe does
    # not read; the security groups are vpc_security_groups.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              security_group_ids:
                - sg-00000000000000000
