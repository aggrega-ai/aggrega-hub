apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.result_configuration is a key this Recipe does
    # not read: the results location is output_location.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              result_configuration:
                output_location: s3://example-athena-results/ad-hoc/
