apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-tags-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a Name tag, which the module writes on every table with the
    # table's name, overwriting any value set here.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              tags:
                Name: orders-prod
