apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redshift-user-pattern
  version: "1.0.0"
  description: >
    One fault: values.user begins with a digit, and Amazon Redshift takes a
    user name beginning with a letter.
spec:
  components:
    events-warehouse:
      type: core/bigdata/redshift
      values:
        user: 1admin
