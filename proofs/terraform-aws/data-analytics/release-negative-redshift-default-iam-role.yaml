apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-default-iam-role
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.default_iam_role_arn names a role
    # infra.overrides.iam_roles does not list.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              iam_roles:
                - arn:aws:iam::123456789012:role/example-redshift-loader
              default_iam_role_arn: arn:aws:iam::123456789012:role/example-redshift-unloader
