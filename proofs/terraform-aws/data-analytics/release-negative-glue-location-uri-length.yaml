apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-glue-location-uri-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue-only.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One fault: infra.overrides.location_uri is an Amazon S3 location of 1025
    # characters, one more than the database takes.
    aws:
      directory: main
      components:
        clickstream-catalog:
          infra:
            overrides:
              location_uri: s3://example-data-
