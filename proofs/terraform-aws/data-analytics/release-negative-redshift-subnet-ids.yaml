apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-subnet-ids
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.subnet_ids names one subnet, and a workgroup
    # takes at least two, spanning two Availability Zones.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              subnet_ids:
                - subnet-0000000000000000a
