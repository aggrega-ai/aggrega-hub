apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dynamodb
  version: "1.0.0"
  description: >
    An Amazon DynamoDB table of orders, keyed by customer and order and
    indexed by status, and a server on Amazon ECS reading the endpoint, the
    table's name and its ARN, so the server's environment shows what a
    consumer of the table receives.
spec:
  components:
    orders:
      type: core/datastore/dynamodb
      values:
        table_name: example-orders
        key_schema:
          - attribute_name: customer_id
            key_type: HASH
          - attribute_name: order_id
            key_type: RANGE
        attribute_definitions:
          - attribute_name: customer_id
            attribute_type: S
          - attribute_name: order_id
            attribute_type: S
          - attribute_name: status
            attribute_type: S
          - attribute_name: placed_at
            attribute_type: N
        global_secondary_indexes:
          - index_name: by-status
            key_schema:
              - attribute_name: status
                key_type: HASH
              - attribute_name: placed_at
                key_type: RANGE
            projection:
              projection_type: INCLUDE
              non_key_attributes:
                - total
          - index_name: by-order
            key_schema:
              - attribute_name: order_id
                key_type: HASH
            projection:
              projection_type: KEYS_ONLY

    storefront:
      type: core/compute/server
      uses:
        orders:
          orders:
            target: orders
            inject:
              env:
                - in: ORDERS_TABLE_HOST
                  from: host
                - in: ORDERS_TABLE_PORT
                  from: port
                - in: ORDERS_TABLE_ENDPOINT
                  from: endpoint
                - in: ORDERS_TABLE_NAME
                  from: table_name
                - in: ORDERS_TABLE_ARN
                  from: arn
