apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sql-server-user-reserved
  version: "1.0.0"
  description: >
    One fault: values.user is sa, a login SQL Server keeps for itself, which
    Amazon RDS refuses as a master user name.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server
      values:
        user: sa
