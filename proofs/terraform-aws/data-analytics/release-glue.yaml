apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: glue
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One boundary, so the database and the server are module blocks of one
    # Terraform root configuration and the server's GLUE_DATABASE carries the
    # reference to the module's database output, which Terraform resolves when
    # it applies. The database's location is a prefix of the operator's
    # bucket, and the database carries tags, one holding ${, %{ and a double
    # quote, which reach AWS Glue as written.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the bucket, the ECS cluster, the subnet,
    # the security group and the execution role.
    aws:
      directory: main
      components:
        sales-catalog:
          infra:
            overrides:
              location_uri: s3://example-data-lake/sales/
              tags:
                team: sales
                note: '${not-interpolated} "quoted" %{not-directive}'

        report-builder:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-report-builder:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
