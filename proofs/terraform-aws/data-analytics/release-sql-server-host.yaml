apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sql-server-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # SQL Server 2025 Enterprise on its default class, on port 1533 and 200
    # GiB of gp2 storage, published under the name the operator points at
    # it, ledger-db.example.com, rather than the module's address output, so
    # the server's LEDGER_DB_HOST carries that name.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the ECS cluster, the subnets,
    # the security group and the execution role.
    aws:
      directory: main
      components:
        ledger-db:
          infra:
            port: 1533
            engine_version: "2025"
            storage:
              size: 200Gi
              type: gp2
            overrides:
              engine: sqlserver-ee
              host: ledger-db.example.com

        bookkeeper:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-bookkeeper:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
