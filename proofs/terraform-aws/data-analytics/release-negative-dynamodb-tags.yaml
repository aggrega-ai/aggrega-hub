apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: tags written as a list, where the module takes a map from
    # each tag name to a string.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              tags:
                - orders
