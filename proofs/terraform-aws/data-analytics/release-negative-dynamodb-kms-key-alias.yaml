apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-kms-key-alias
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: the KMS key named by an alias's ARN, which DynamoDB reports
    # back as the key's own ARN.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:alias/example-table-key
