apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.kms_key_id is a bare key ID, and the AWS
    # provider takes the key by its ARN alone.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              kms_key_id: 00000000-0000-0000-0000-000000000000
