apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: redshift-random-password
  version: "1.0.0"
  description: >
    AWS through Terraform: the warehouse bound to its Amazon Redshift
    Serverless Recipe, and core/random-password to the FeatureRecipe that
    draws a password at apply.
spec:
  mappings:
    components:
      type:
        core/bigdata/redshift:1.0.0: terraform/redshift:1.0.0
    features:
      type:
        core/random-password:1.0.0: terraform/random-password:1.0.0
