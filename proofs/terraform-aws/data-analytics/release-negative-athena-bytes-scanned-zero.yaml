apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-bytes-scanned-zero
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.bytes_scanned_cutoff_per_query is 0, which the AWS
    # provider reads as no limit and this Recipe leaves to an unset key.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              bytes_scanned_cutoff_per_query: 0
