apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-engine-version-web
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.engine_version is 2025 on the Web edition, which
    # SQL Server 2025 does not offer on RDS.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            engine_version: "2025"
            overrides:
              engine: sqlserver-web
