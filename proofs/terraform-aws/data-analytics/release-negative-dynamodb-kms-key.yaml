apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: the KMS key named by its key ID, where the AWS provider takes
    # the key's ARN.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              kms_key_id: 00000000-0000-0000-0000-000000000000
