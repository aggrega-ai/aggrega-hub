apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-retention
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: a retention of 36 days, beyond the 35-day recovery period
    # point-in-time recovery keeps at most.
    aws:
      directory: main
      components:
        sessions:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 36
