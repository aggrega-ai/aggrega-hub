apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: infra.overrides.deletion_protection_enabled, the module input's
    # name, where the Recipe reads deletion_protection.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              deletion_protection_enabled: true
