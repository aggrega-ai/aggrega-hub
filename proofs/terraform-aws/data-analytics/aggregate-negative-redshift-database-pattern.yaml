apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-redshift-database-pattern
  version: "1.0.0"
  description: >
    One fault: values.database carries a hyphen, which Amazon Redshift
    refuses in a database name.
spec:
  components:
    events-warehouse:
      type: core/bigdata/redshift
      values:
        database: events-db
