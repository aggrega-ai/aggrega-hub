apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-database-pattern
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-redshift-database-pattern.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: values.database carries a hyphen, which Amazon Redshift refuses
    # in a database name.
    aws:
      directory: main
      components:
        events-warehouse:
          infra: {}
