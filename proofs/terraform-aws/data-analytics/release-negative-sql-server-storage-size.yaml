apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-storage-size
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.storage.size is 10Gi, under the 20 GiB Amazon RDS gives a
    # SQL Server instance at least.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            storage:
              size: 10Gi
