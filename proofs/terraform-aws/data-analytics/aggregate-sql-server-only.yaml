apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sql-server-only
  version: "1.0.0"
  description: >
    A SQL Server database declared with the Component's defaults alone: the
    database appdb, the login appuser and the service's own collation.
spec:
  components:
    archive-db:
      type: core/datastore/sql-server
