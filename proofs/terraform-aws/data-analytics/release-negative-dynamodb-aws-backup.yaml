apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-aws-backup
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb-aws-backup.yaml
  boundaries:
    # One fault: core/backup bound to AWS Backup, whose catalog realization
    # backs up an Amazon RDS DB instance alone, and halts on a DynamoDB table.
    aws:
      directory: main
      components:
        sessions:
          features:
            backup:
              type: core/backup
              infra:
                role_arn: arn:aws:iam::123456789012:role/example-backup-role
