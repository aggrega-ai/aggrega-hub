apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redshift
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One boundary, so the warehouse and the server are module blocks of one
    # Terraform root configuration and the server's WAREHOUSE_HOST carries the
    # reference to the module's address output, which Terraform resolves when it
    # applies. The workgroup starts at 32 Redshift Processing Units in the
    # operator's subnets and security group, the namespace encrypts its data
    # with the operator's key and loads data with the operator's roles, and
    # every resource carries tags, one holding ${, %{ and a double quote,
    # which reach Amazon Redshift Serverless as written; Amazon Redshift keeps
    # the administrator's password.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the subnets, the security group, the KMS
    # key, the IAM roles, the ECS cluster and the execution role.
    aws:
      directory: main
      components:
        sales-warehouse:
          features:
            password:
              type: core/generated-secret
          infra:
            overrides:
              base_capacity: 32
              subnet_ids:
                - subnet-0000000000000000a
                - subnet-0000000000000000b
                - subnet-0000000000000000c
              vpc_security_groups:
                - sg-00000000000000000
              publicly_accessible: false
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              iam_roles:
                - arn:aws:iam::123456789012:role/example-redshift-loader
                - arn:aws:iam::123456789012:role/example-redshift-unloader
              default_iam_role_arn: arn:aws:iam::123456789012:role/example-redshift-loader
              tags:
                team: sales
                note: '${not-interpolated} "quoted" %{not-directive}'

        report-runner:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-report-runner:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
