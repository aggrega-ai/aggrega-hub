apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-glue-location-uri
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue-only.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One fault: infra.overrides.location_uri is an HDFS path rather than an
    # Amazon S3 location in the operator's bucket.
    aws:
      directory: main
      components:
        clickstream-catalog:
          infra:
            overrides:
              location_uri: hdfs://example-namenode:8020/clickstream
