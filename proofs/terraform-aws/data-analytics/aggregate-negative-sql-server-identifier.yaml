apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sql-server-identifier
  version: "1.0.0"
  description: >
    One fault: the component archive_db names its Amazon RDS instance, and
    RDS refuses an underscore in an instance identifier.
spec:
  components:
    archive_db:
      type: core/datastore/sql-server
