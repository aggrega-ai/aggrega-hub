apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-redshift-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift-only.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # One fault: infra.overrides.tags is a list rather than a map from each tag
    # name to a string.
    aws:
      directory: main
      components:
        events-warehouse:
          infra:
            overrides:
              tags:
                - team
