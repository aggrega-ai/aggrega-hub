apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-two-backups
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: two core/backup attachments both leave the instance's backup to
    # Amazon RDS, which runs one automated backup.
    aws:
      directory: main
      components:
        archive-db:
          features:
            backup:
              type: core/backup
            archive:
              type: core/backup
