apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.kms_key_id is a key ID, and the AWS provider takes
    # the key's ARN.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              kms_key_id: 00000000-0000-0000-0000-000000000000
