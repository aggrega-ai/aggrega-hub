apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.instance_type, a key this Recipe does not read
    # (the instance is sized by instance_class), which it halts on by name.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              instance_type: db.t3.small
