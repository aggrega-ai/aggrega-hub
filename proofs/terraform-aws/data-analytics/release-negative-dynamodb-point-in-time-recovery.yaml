apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-point-in-time-recovery
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: point-in-time recovery turned off on the attachment whose
    # backup is point-in-time recovery.
    aws:
      directory: main
      components:
        sessions:
          features:
            backup:
              type: core/backup
              infra:
                point_in_time_recovery: false
