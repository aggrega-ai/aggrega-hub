apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.tags is a list, not a map from each tag name to a
    # string.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              tags:
                - team
