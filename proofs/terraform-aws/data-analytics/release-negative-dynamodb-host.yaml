apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: infra.overrides.host, which DynamoDB's endpoint cannot answer
    # under, since DynamoDB offers no custom domain.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              host: sessions.example.com
