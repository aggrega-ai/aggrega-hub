apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-engine
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.engine is sqlserver-dev-ee, a Developer edition
    # RDS runs only from a custom engine version made from the operator's own
    # installation media.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              engine: sqlserver-dev-ee
