apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-identifier
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-sql-server-identifier.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: the component archive_db names the instance, and Amazon RDS
    # refuses an underscore in an instance identifier.
    aws:
      directory: main
      components:
        archive_db:
          infra: {}
