apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: athena
  version: "1.0.0"
  description: >
    An Amazon Athena workgroup for sales reports, and a server on Amazon ECS
    reading its name, so the server's environment shows what a consumer of
    the workgroup receives.
spec:
  components:
    sales-queries:
      type: core/bigdata/athena

    query-runner:
      type: core/compute/server
      uses:
        queries:
          sales-queries:
            target: sales-queries
            inject:
              env:
                - in: ATHENA_WORK_GROUP
                  from: work_group
