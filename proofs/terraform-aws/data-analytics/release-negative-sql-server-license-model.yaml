apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-license-model
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.license_model is bring-your-own-media, which
    # launches the instance from a custom engine version this Recipe cannot
    # name.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              engine: sqlserver-se
              license_model: bring-your-own-media
