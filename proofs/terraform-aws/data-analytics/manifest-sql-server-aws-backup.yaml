apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: sql-server-aws-backup
  version: "1.0.0"
  description: >
    AWS through Terraform: SQL Server bound to its Amazon RDS Recipe,
    and core/backup to AWS Backup.
spec:
  mappings:
    components:
      type:
        core/datastore/sql-server:1.0.0: terraform/sql-server-rds:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-aws-backup:1.0.0
