apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-subnet-group
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.overrides.subnet_group holds a semicolon, which RDS
    # refuses in the name of a DB subnet group.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            overrides:
              subnet_group: example;subnets
