apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: redshift-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-redshift.yaml
  manifest: ./manifest-redshift.yaml
  boundaries:
    # The workgroup on port 8192, published under the name the operator points
    # at it, warehouse.example.com, rather than the workgroup's reference, so
    # the server's WAREHOUSE_HOST carries that name.
    aws:
      directory: main
      components:
        sales-warehouse:
          infra:
            port: 8192
            overrides:
              host: warehouse.example.com

        report-runner:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-report-runner:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
