apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-bytes-scanned
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.bytes_scanned_cutoff_per_query is 10000000,
    # which Athena's API takes and the AWS provider refuses, below its 10485760.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              bytes_scanned_cutoff_per_query: 10000000
