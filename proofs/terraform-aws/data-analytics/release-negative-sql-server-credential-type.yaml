apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-credential-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server-random-password.yaml
  boundaries:
    # One fault: the password slot is filled by core/random-password, which
    # would set nothing, since RDS generates and keeps the master password.
    aws:
      directory: main
      components:
        archive-db:
          features:
            password:
              type: core/random-password
