apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: dynamodb-aws-backup
  version: "1.0.0"
  description: >
    AWS through Terraform: DynamoDB bound to its table Recipe, and
    core/backup to AWS Backup.
spec:
  mappings:
    components:
      type:
        core/datastore/dynamodb:1.0.0: terraform/dynamodb:1.0.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-aws-backup:1.0.0
