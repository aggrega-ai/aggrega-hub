apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: dynamodb
  version: "1.0.0"
  description: >
    AWS through Terraform: DynamoDB bound to its table Recipe,
    core/backup to the table's own point-in-time recovery, and the generic
    server bound to its Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/datastore/dynamodb:1.0.0: terraform/dynamodb:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
    features:
      type:
        core/backup:1.0.0: terraform/backup-native:1.0.0
