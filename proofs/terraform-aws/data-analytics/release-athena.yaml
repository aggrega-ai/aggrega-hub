apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: athena
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One boundary, so the workgroup and the server are module blocks of one
    # Terraform root configuration and the server's ATHENA_WORK_GROUP carries
    # the reference to the module's work_group output, which Terraform resolves
    # when it applies. Query results go to a prefix of the operator's bucket,
    # encrypted with the operator's key, Athena cancels a query scanning more
    # than 10 GB, and the workgroup carries a tag.
    #
    # Every account-specific value is a placeholder for one the operator already
    # has in AWS account 123456789012: the bucket, the KMS key, the ECS cluster,
    # the subnet, the security group and the execution role.
    aws:
      directory: main
      components:
        sales-queries:
          infra:
            overrides:
              output_location: s3://example-athena-results/sales/
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              bytes_scanned_cutoff_per_query: 10000000000
              tags:
                team: sales

        query-runner:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-query-runner:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
