apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dynamodb
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One boundary, so the table and the server are module blocks of one
    # Terraform root configuration and the server's ORDERS_TABLE_NAME and
    # ORDERS_TABLE_ARN carry references to the module's outputs, which
    # Terraform resolves when it applies. The table is provisioned with 5
    # read and 5 write capacity units, which each index takes too, keeps 14
    # days of point-in-time recovery, is encrypted with the operator's key,
    # is protected from deletion and carries tags, one holding ${, %{ and a
    # double quote, which reach DynamoDB as written.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the KMS key, the ECS cluster,
    # the subnets, the security group and the execution role.
    aws:
      directory: main
      components:
        orders:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            billing_mode: PROVISIONED
            overrides:
              read_capacity: 5
              write_capacity: 5
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              deletion_protection: true
              tags:
                team: orders
                note: '${not-interpolated} "quoted" %{not-directive}'

        storefront:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-storefront:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
