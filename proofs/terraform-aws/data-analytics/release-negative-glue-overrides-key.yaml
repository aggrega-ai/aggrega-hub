apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-glue-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-glue-only.yaml
  manifest: ./manifest-glue.yaml
  boundaries:
    # One fault: infra.overrides.location_url is a key this Recipe does not
    # read, a misspelling of location_uri.
    aws:
      directory: main
      components:
        clickstream-catalog:
          infra:
            overrides:
              location_url: s3://example-data-lake/clickstream/
