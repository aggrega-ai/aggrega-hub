apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-athena-name-length
  version: "1.0.0"
  description: >
    One fault: the component's name, 129 letters long, names its Amazon
    Athena workgroup, and Athena takes a workgroup name of 128 characters at
    most.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/bigdata/athena
