apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dynamodb-deletion-protection
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dynamodb-only.yaml
  manifest: ./manifest-dynamodb.yaml
  boundaries:
    # One fault: deletion protection written as a string rather than true or
    # false.
    aws:
      directory: main
      components:
        sessions:
          infra:
            overrides:
              deletion_protection: "yes"
