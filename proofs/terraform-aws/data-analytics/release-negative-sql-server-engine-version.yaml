apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sql-server-engine-version
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sql-server-only.yaml
  manifest: ./manifest-sql-server.yaml
  boundaries:
    # One fault: infra.engine_version is 2016, a release Amazon RDS no
    # longer creates instances of.
    aws:
      directory: main
      components:
        archive-db:
          infra:
            engine_version: "2016"
