apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-athena-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-athena-only.yaml
  manifest: ./manifest-athena.yaml
  boundaries:
    # One fault: infra.overrides.tags is a list rather than a map from each tag
    # name to a string.
    aws:
      directory: main
      components:
        ad-hoc-queries:
          infra:
            overrides:
              tags:
                - team
