# A CAA record whose flags are written 00, not as the integer 0.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-caa-flags-zeros
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "example.com"
        type: CAA
        records:
          - "00 issue letsencrypt.org"
