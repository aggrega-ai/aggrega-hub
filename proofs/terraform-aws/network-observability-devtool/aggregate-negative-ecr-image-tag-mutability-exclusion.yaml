apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-ecr-image-tag-mutability-exclusion
  version: "1.0.0"
  description: >
    An Amazon ECR repository whose tags are immutable with exclusions, a
    setting whose exclusion filters the Component declares no value for.
spec:
  components:
    api-images:
      type: core/devtool/ecr
      values:
        image_tag_mutability: IMMUTABLE_WITH_EXCLUSION
