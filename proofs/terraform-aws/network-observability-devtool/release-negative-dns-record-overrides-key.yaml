# infra.overrides.zone_ids, a misspelling of zone_id, beside the zone_id
# this Recipe requires.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              zone_ids: Z00000000000000000000
