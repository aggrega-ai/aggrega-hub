# infra.overrides.host, which the log group has no address for.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            overrides:
              host: logs.example.com
