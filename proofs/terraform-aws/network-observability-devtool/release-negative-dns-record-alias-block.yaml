# infra.overrides.alias, the alias record this Recipe does not write.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-alias-block
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              alias:
                name: d111111abcdef8.cloudfront.net
                zone_id: Z2FDTNDATAQYW2
                evaluate_target_health: false
