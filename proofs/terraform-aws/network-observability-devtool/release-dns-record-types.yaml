apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: dns-record-types
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-types.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    # Every record set goes into a Route 53 hosted zone the operator already
    # holds, in one root configuration: the zone for example.com,
    # Z00000000000000000000, or the reverse zone 2.0.192.in-addr.arpa,
    # Z00000000000000000001, for the reverse name, written there with the
    # /hostedzone/ prefix the Route 53 API returns, which the AWS provider
    # removes. Both IDs are placeholders.
    aws:
      directory: main
      components:
        web-a:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        web-aaaa:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        docs-cname:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        mail-mx:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        child-ns:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        host-ptr:
          infra:
            overrides:
              zone_id: /hostedzone/Z00000000000000000001
        sip-srv:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        ca-caa:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        dkim-txt:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        site-txt:
          infra:
            overrides:
              zone_id: Z00000000000000000000
        apps-wildcard:
          infra:
            overrides:
              zone_id: Z00000000000000000000
