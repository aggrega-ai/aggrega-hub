apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloudfront-upstream-host
  version: "1.0.0"
  description: >
    An Amazon CloudFront distribution whose upstream is the generic server,
    which publishes no host.
spec:
  components:
    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          api:
            target: api

    api:
      type: core/compute/server
