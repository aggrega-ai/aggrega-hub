# infra.overrides.custom_endpoint_certificate_arn names an IAM server
# certificate, not an AWS Certificate Manager certificate.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-certificate-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudfront-only.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000

        api-cdn:
          infra:
            overrides:
              host: cdn.example.com
              custom_endpoint_certificate_arn: arn:aws:iam::123456789012:server-certificate/example
