# No infra.overrides.zone_id, while the record set goes into the operator's
# hosted zone.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-zone-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns: {}
