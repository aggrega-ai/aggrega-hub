apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dns-record-only
  version: "1.0.0"
  description: >
    A DNS record alone, for the Releases that prove what the Route 53
    Recipes refuse on their own.
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: CNAME
        records:
          - "api-origin.example.com"
