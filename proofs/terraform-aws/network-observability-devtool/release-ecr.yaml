apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: ecr
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-ecr-only.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    # Every key the ECR Recipe reads, set: the repository's images are
    # encrypted with the operator's KMS key, a lifecycle policy expires
    # untagged images 14 days after their push, and the repository carries
    # tags; the policy's description and one tag hold the characters
    # Terraform reads as the start of an interpolation and of a directive.
    #
    # The key is a placeholder for one the operator already has in AWS
    # account 123456789012.
    aws:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              repository_lifecycle_policy: '{"rules":[{"rulePriority":1,"description":"Expire untagged images 14 days after their push, ${not-interpolated} %{not-directive}","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}'
              tags:
                team: api
                note: "${not-interpolated} %{not-directive}"
