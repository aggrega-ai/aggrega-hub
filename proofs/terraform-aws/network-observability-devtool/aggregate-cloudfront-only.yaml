apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloudfront-only
  version: "1.0.0"
  description: >
    An Amazon CloudFront distribution in front of the name a DNS record
    publishes, for the Releases that prove what the CloudFront Recipes write
    and refuse on their own.
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api-origin.example.com

    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          api-dns:
            target: api-dns
