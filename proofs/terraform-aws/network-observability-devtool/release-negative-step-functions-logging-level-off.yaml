# infra.overrides.logging_configuration with level OFF, for which the module writes no logging configuration.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-logging-level-off
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-state-machine-role
              logging_configuration:
                level: "OFF"
