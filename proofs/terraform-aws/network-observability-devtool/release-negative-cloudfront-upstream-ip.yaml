# The upstream is an Amazon Redshift Serverless warehouse whose Release gives
# it an IP literal as its host.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-upstream-ip
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-cloudfront-upstream-ip.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-cdn: {}

        events-warehouse:
          infra:
            overrides:
              host: 10.0.0.10
