apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: dns-record-txt-escapes
  version: "1.0.0"
  description: >
    One TXT record whose text holds a double quote and a backslash, which
    Route 53 takes written as \" and \\.
spec:
  components:
    notes-txt:
      type: core/network/dns-record
      values:
        name: "notes.example.com"
        type: TXT
        records:
          - "say \"hello\" in C:\\path"
