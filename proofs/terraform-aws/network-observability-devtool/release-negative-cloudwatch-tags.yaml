# infra.overrides.tags holding a number, not a string.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            overrides:
              tags:
                retention: 30
