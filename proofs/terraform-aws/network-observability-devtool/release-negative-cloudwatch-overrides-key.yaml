# infra.overrides.kms_key, a misspelling of kms_key_id.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            overrides:
              kms_key: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
