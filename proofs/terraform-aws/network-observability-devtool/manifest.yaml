apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: network-observability-devtool
  version: "1.0.0"
  description: >
    AWS through Terraform: the DNS record bound to its Route 53 Recipe, the
    distribution to its CloudFront Recipe, the log group to its CloudWatch
    Recipe, the repository to its ECR Recipe and the generic server to its
    Amazon ECS Recipe.
spec:
  mappings:
    components:
      type:
        core/network/dns-record:1.0.0: terraform/dns-record-route-53:1.0.0
        core/network/cloudfront:1.0.0: terraform/cloudfront:1.0.0
        core/observability/cloudwatch:1.0.0: terraform/cloudwatch:1.0.0
        core/devtool/ecr:1.0.0: terraform/ecr:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
