apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: network-observability-devtool
  version: "1.0.0"
  description: >
    A DNS record naming the server, and a server on Amazon ECS reading the
    name the record publishes, so the server's environment shows what a
    consumer of the record receives.
spec:
  components:
    # The name clients reach the server at. The address the record points to
    # is known only once the service in front of the server exists, and the
    # record's data is fixed in the Aggregate, so the CNAME names a
    # placeholder in example.com standing for it.
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api-origin.example.com

    api:
      type: core/compute/server
      uses:
        dns:
          api-dns:
            target: api-dns
            inject:
              env:
                - in: API_PUBLIC_HOST
                  from: host
