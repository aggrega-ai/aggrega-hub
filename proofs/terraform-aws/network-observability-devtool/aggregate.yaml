apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: network-observability-devtool
  version: "1.0.0"
  description: >
    A DNS record naming the server's origin, an Amazon CloudFront
    distribution in front of that name, an Amazon CloudWatch Logs log group,
    an Amazon ECR repository, an AWS Step Functions state machine, and a
    server on Amazon ECS reading the name the record publishes, the address
    the distribution publishes, the name and ARN of the log group, the
    registry, address and ARN of the repository and the ARN of the state
    machine, so the server's environment shows what a consumer of each
    receives.
spec:
  components:
    # The name the distribution reaches the server at. The address the
    # record points to is known only once the load balancer in front of the
    # server exists, and the record's data is fixed in the Aggregate, so the
    # CNAME names a placeholder in example.com standing for it.
    api-dns:
      type: core/network/dns-record
      values:
        name: api.example.com
        type: CNAME
        records:
          - api-origin.example.com

    # The edge clients reach the server through: the distribution's origin
    # is the name the record publishes.
    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          api-dns:
            target: api-dns

    # The log group the server's container output is written to.
    api-logs:
      type: core/observability/cloudwatch

    # The repository the server's images are pushed to, with tags that stay
    # on their images and scan on push, the Component's defaults.
    api-images:
      type: core/devtool/ecr

    # The workflow the server starts an execution of, by the state
    # machine's ARN: a Standard state machine, the Component's default,
    # recording an order and ending.
    api-workflow:
      type: core/ai-pipeline/step-functions
      values:
        definition:
          Comment: Records an order and ends.
          StartAt: Record
          States:
            Record:
              Type: Pass
              Next: Done
            Done:
              Type: Succeed

    api:
      type: core/compute/server
      uses:
        dns:
          api-dns:
            target: api-dns
            inject:
              env:
                - in: API_PUBLIC_HOST
                  from: host
        cdn:
          api-cdn:
            target: api-cdn
            inject:
              env:
                - in: API_CDN_HOST
                  from: host
                - in: API_CDN_ENDPOINT
                  from: endpoint
        logs:
          api-logs:
            target: api-logs
            inject:
              env:
                - in: API_LOG_GROUP
                  from: log_group_name
                - in: API_LOG_GROUP_ARN
                  from: arn
        images:
          api-images:
            target: api-images
            inject:
              env:
                - in: API_IMAGE_REGISTRY
                  from: host
                - in: API_IMAGE_REPOSITORY
                  from: repository_uri
                - in: API_IMAGE_REPOSITORY_ARN
                  from: arn
        workflow:
          api-workflow:
            target: api-workflow
            inject:
              env:
                - in: API_WORKFLOW_ARN
                  from: arn
