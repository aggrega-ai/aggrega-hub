apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-cloudfront-upstream-ip
  version: "1.0.0"
  description: >
    An Amazon CloudFront distribution whose upstream is an Amazon Redshift
    Serverless warehouse, a managed resource whose Release gives it an IP
    literal as its host.
spec:
  components:
    api-cdn:
      type: core/network/cloudfront
      uses:
        upstream:
          events-warehouse:
            target: events-warehouse

    events-warehouse:
      type: core/bigdata/redshift
