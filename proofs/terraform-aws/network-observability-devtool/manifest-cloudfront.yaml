apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: cloudfront
  version: "1.0.0"
  description: >
    AWS through Terraform: the distribution bound to its CloudFront Recipe,
    and the DNS record, the generic server and the Amazon Redshift
    Serverless warehouse its upstream reaches in these Releases to their
    Recipes, for the Releases that prove what the CloudFront Recipe writes
    and refuses on its own.
spec:
  mappings:
    components:
      type:
        core/network/cloudfront:1.0.0: terraform/cloudfront:1.0.0
        core/network/dns-record:1.0.0: terraform/dns-record-route-53:1.0.0
        core/compute/server:1.1.0: terraform/server-ecs:1.2.0
        core/bigdata/redshift:1.0.0: terraform/redshift:1.0.0
