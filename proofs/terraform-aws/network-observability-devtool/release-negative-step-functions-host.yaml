# infra.overrides.host, for a state machine that publishes no address.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-state-machine-role
              host: workflows.example.com
