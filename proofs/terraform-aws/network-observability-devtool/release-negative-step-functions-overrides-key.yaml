# infra.overrides.kms_key, a misspelling of kms_key_id.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-state-machine-role
              kms_key: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
