# infra.overrides.host, which the registry's certificate does not name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ecr-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-ecr-only.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-images:
          infra:
            overrides:
              host: images.example.com
