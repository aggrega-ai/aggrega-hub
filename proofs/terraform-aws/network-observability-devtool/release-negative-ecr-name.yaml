# A component named with capital letters, which Amazon ECR does not take in a repository name.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-ecr-name
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-ecr-name.yaml
  manifest: ./manifest-ecr.yaml
  boundaries:
    aws:
      directory: main
      components:
        ApiImages: {}
