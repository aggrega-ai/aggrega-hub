apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: step-functions
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    # Every key the Step Functions Recipe reads, set: the state machine runs
    # as the operator's role, named under a path holding ${, which reaches
    # Step Functions as written, adds the operator's KMS key to the encryption
    # Step Functions applies, logs every event, without each event's input
    # and output, to the operator's log group, named by its name, and carries
    # the tags given, written as given.
    #
    # The role, the key and the log group are placeholders for ones the
    # operator already has in AWS account 123456789012.
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/service-role/orders${team}/example-state-machine-role
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              logging_configuration:
                level: ALL
                include_execution_data: false
              cloudwatch_log_group_name: /aws/vendedlogs/states/order-shaping
              tags:
                team: orders
                note: "${not-interpolated} %{not-a-directive}"
