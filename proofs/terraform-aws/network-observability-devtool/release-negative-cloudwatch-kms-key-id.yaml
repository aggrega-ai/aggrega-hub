# infra.overrides.kms_key_id naming an alias by its ARN, not the key.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudwatch-kms-key-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudwatch-only.yaml
  manifest: ./manifest-cloudwatch.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-logs:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:alias/example-key
