# A CAA record whose flags are 1, neither 0 nor 128.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-caa-flags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-dns-record-caa-flags.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000
