apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: network-observability-devtool
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    # One root configuration, so the record set, the distribution, the log
    # group, the repository and the server are modules of one Terraform
    # configuration: the distribution's origin is a reference to the record
    # module's output, and the server's environment carries references to
    # the record module's, the distribution module's, the log group module's
    # and the repository module's outputs, which Terraform resolves once each
    # exists. The record set goes into the operator's hosted zone for
    # example.com, and the operator's web ACL inspects what the distribution
    # takes. The log group keeps its events without expiry, as no
    # retention_days is set, and the server's container output is written to
    # it: awslogs_group names the group by its name, which is the
    # component's, and the reference to it in the server's environment has
    # Terraform create the group first. The repository's images are
    # encrypted with Amazon S3-managed keys and carry no lifecycle policy, as
    # no override is set.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the hosted zone, the web ACL,
    # the subnet, the security group, the ECS cluster and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000

        api-cdn:
          infra:
            waf_policy_id: arn:aws:wafv2:us-east-1:123456789012:global/webacl/example-web-acl/00000000-0000-0000-0000-000000000000

        api-logs: {}

        api-images: {}

        api:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-0000000000000000a
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
              awslogs_group: api-logs
