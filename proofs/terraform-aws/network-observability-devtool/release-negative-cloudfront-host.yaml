# infra.overrides.host without custom_endpoint_certificate_arn.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudfront-only.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000

        api-cdn:
          infra:
            overrides:
              host: cdn.example.com
