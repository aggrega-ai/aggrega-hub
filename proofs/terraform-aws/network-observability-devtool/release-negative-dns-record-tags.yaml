# infra.overrides.tags, which a Route 53 record set does not carry.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000
              tags:
                team: api
