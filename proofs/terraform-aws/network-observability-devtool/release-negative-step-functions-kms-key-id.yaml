# infra.overrides.kms_key_id naming the key by a name that is no key ID, alias or ARN.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-kms-key-id
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-state-machine-role
              kms_key_id: example-key
