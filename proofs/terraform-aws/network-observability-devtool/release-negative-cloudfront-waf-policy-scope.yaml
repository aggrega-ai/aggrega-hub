# infra.waf_policy_id names a web ACL of the REGIONAL scope in eu-west-1.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-cloudfront-waf-policy-scope
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cloudfront-only.yaml
  manifest: ./manifest-cloudfront.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id: Z00000000000000000000

        api-cdn:
          infra:
            waf_policy_id: arn:aws:wafv2:eu-west-1:123456789012:regional/webacl/example-web-acl/00000000-0000-0000-0000-000000000000
