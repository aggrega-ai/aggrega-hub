# No infra.overrides.role_arn, the role the state machine runs as.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-role-arn-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
