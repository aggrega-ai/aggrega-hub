# A TXT text of 3990 characters, which Route 53 takes as 16 quoted strings,
# 4037 characters with their quotation marks and the spaces between them.
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-dns-record-value-length
  version: "1.0.0"
spec:
  components:
    api-dns:
      type: core/network/dns-record
      values:
        name: "api.example.com"
        type: TXT
        records:
          - "v=example; "
