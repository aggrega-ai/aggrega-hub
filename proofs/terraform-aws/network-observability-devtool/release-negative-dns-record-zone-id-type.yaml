# infra.overrides.zone_id given as a list rather than the zone's ID.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-dns-record-zone-id-type
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-dns-record-only.yaml
  manifest: ./manifest-dns-record.yaml
  boundaries:
    aws:
      directory: main
      components:
        api-dns:
          infra:
            overrides:
              zone_id:
                - Z00000000000000000000
