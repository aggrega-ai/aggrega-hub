# infra.overrides.logging_configuration naming its destination itself, which cloudwatch_log_group_name names.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-step-functions-logging-configuration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-step-functions-only.yaml
  manifest: ./manifest-step-functions.yaml
  boundaries:
    aws:
      directory: main
      components:
        order-shaping:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-state-machine-role
              logging_configuration:
                level: ALL
                log_destination: "arn:aws:logs:eu-west-1:123456789012:log-group:/aws/vendedlogs/states/order-shaping:*"
              cloudwatch_log_group_name: /aws/vendedlogs/states/order-shaping
