apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate
  version: "1.0.0"
  description: >
    One database of each engine for every Recipe that realizes it on AWS RDS
    through Terraform: PostgreSQL, MySQL and MariaDB, each through the Recipe
    that authors its own body, the one that vendors a local module and the one
    that vendors the terraform-aws-modules RDS module, where the catalog
    publishes each.
spec:
  components:
    pg-inline:
      type: core/datastore/postgres
      values:
        database: appdb
        user: app_admin

    pg-aws-modules:
      type: core/datastore/postgres
      values:
        database: appdb
        user: app_admin

    mysql-inline:
      type: core/datastore/mysql
      values:
        database: appdb

    mysql-module:
      type: core/datastore/mysql
      values:
        database: appdb

    mysql-aws-modules:
      type: core/datastore/mysql
      values:
        database: appdb

    mariadb-inline:
      type: core/datastore/mariadb
      values:
        database: appdb

    mariadb-module:
      type: core/datastore/mariadb
      values:
        database: appdb

    mariadb-aws-modules:
      type: core/datastore/mariadb
      values:
        database: appdb
