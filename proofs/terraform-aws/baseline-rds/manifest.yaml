apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: manifest
  version: "1.0.0"
  description: >
    AWS RDS through Terraform: each database bound by its name to the Recipe it
    proves, since three Components share each engine's type and the type tier
    cannot tell the Recipes apart. core/generated-secret binds to the
    FeatureRecipe that leaves the master password to RDS, and core/backup to the
    one that leaves the backup to the instance's automated backups.
spec:
  mappings:
    components:
      name:
        pg-inline: terraform/postgres-rds:1.0.0
        pg-aws-modules: terraform/postgres-rds-terraform-aws-modules:1.0.0
        mysql-inline: terraform/mysql-rds:1.0.0
        mysql-module: terraform/mysql-rds-module:1.0.0
        mysql-aws-modules: terraform/mysql-rds-terraform-aws-modules:1.0.0
        mariadb-inline: terraform/mariadb-rds:1.0.0
        mariadb-module: terraform/mariadb-rds-module:1.0.0
        mariadb-aws-modules: terraform/mariadb-rds-terraform-aws-modules:1.0.0
    features:
      type:
        core/generated-secret:1.0.0: terraform/generated-secret:1.0.0
        core/backup:1.0.0: terraform/backup-native:1.0.0
