apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: baseline-rds
  environment: production
  version: "1.0.0"
spec:
  aggregate: aggregate
  manifest: manifest
  boundaries:
    # One boundary, so every database is a module block of one Terraform root
    # configuration. The subnet group, security group and account are
    # placeholders for ones the operator already has in AWS account
    # 123456789012.
    aws:
      directory: main
      components:
        pg-inline:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "16.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000

        pg-aws-modules:
          features:
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "16.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000

        mysql-inline:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "8.0.39"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000

        mysql-module:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "8.0.39"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets

        mysql-aws-modules:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "8.0.39"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000

        mariadb-inline:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "11.4.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000

        mariadb-module:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "11.4.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets

        mariadb-aws-modules:
          features:
            root_password:
              type: core/generated-secret
            backup:
              type: core/backup
              infra:
                retention_days: 14
          infra:
            engine_version: "11.4.4"
            storage:
              size: 100Gi
              type: gp3
            overrides:
              subnet_group: example-private-db-subnets
              vpc_security_groups:
                - sg-00000000000000000
