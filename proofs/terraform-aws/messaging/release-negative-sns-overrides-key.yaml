apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sns-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sns-only.yaml
  manifest: ./manifest-sns.yaml
  boundaries:
    # One fault: infra.overrides.kms_kye_id is a key this Recipe does not read,
    # a misspelling of kms_key_id.
    aws:
      directory: main
      components:
        alerts:
          infra:
            overrides:
              kms_kye_id: alias/example-topic-key
