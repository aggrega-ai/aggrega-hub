apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sns
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sns.yaml
  manifest: ./manifest-sns.yaml
  boundaries:
    # One boundary, so the topic and the server are module blocks of one
    # Terraform root configuration and the server's ORDER_UPDATES_TOPIC_ARN
    # carries a reference to the module's output, which Terraform resolves
    # when it applies. The topic is encrypted with the operator's key and
    # carries a tag.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the KMS key, the ECS cluster,
    # the subnet, the security group and the execution role.
    aws:
      directory: main
      components:
        order-updates:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              tags:
                team: orders

        order-notifier:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-order-notifier:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
