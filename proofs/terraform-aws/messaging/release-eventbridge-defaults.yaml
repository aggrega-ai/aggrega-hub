apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: eventbridge-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-eventbridge-only.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # No override: the bus's events are encrypted under a key AWS owns, and the
    # bus carries no tag.
    aws:
      directory: main
      components:
        audit-events:
          infra: {}
