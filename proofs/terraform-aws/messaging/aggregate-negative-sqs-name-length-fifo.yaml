apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sqs-name-length-fifo
  version: "1.0.0"
  description: >
    One fault: the component's name, 76 letters long, names its Amazon SQS
    FIFO queue, whose name ends in .fifo, and SQS takes a queue name of 80
    characters at most, the suffix counted.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/sqs
      values:
        fifo_queue: true
