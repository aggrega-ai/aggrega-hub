apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-data-firehose-name-length
  version: "1.0.0"
  description: >
    One fault: the component's name, 65 letters long, names its Amazon Data
    Firehose stream, and Firehose takes a stream name of 64 characters at
    most.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/data-firehose
