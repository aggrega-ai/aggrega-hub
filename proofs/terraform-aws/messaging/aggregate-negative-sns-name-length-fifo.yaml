apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sns-name-length-fifo
  version: "1.0.0"
  description: >
    One fault: the component's name, 252 letters long, names its Amazon SNS
    FIFO topic, whose name ends in .fifo, and SNS takes a topic name of 256
    characters at most, the suffix counted.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/sns
      values:
        fifo_topic: true
