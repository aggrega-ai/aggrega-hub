apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-role-arn
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: role_arn names the role, where Firehose takes its ARN.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: example-firehose-role
