apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-firehose-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # The bucket and the role alone: an uncompressed stream delivering under
    # Firehose's own time prefix.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
