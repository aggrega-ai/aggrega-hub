apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: kinesis-data-streams
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One boundary, so the stream and the server are module blocks of one
    # Terraform root configuration and the server's PAGE_VIEWS_STREAM_ARN
    # carries a reference to the module's output, which Terraform resolves
    # when it applies. The stream runs two provisioned shards, its records are
    # encrypted with the operator's key, and the stream carries tags, one
    # holding ${, %{ and a double quote, which reach the stream as written.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the KMS key, the ECS cluster,
    # the subnet, the security group and the execution role.
    aws:
      directory: main
      components:
        page-views:
          infra:
            overrides:
              stream_mode: PROVISIONED
              shard_count: 2
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              tags:
                team: analytics
                note: '${not-interpolated} "quoted" %{not-directive}'

        analytics:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-analytics:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
