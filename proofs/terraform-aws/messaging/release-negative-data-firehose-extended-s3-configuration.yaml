apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-extended-s3-configuration
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: extended_s3_configuration is the block this Recipe writes itself, from
    # bucket_arn and role_arn.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
              extended_s3_configuration:
                bucket_arn: arn:aws:s3:::example-firehose-bucket
                role_arn: arn:aws:iam::123456789012:role/example-firehose-role
