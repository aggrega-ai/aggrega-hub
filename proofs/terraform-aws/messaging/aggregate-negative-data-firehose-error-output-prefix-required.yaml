apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-data-firehose-error-output-prefix-required
  version: "1.0.0"
  description: >
    One fault: the prefix holds an expression and no error prefix is set,
    which Amazon Data Firehose requires beside such a prefix.
spec:
  components:
    audit-events:
      type: core/messaging/data-firehose
      values:
        prefix: "audit/!{timestamp:yyyy}/"
