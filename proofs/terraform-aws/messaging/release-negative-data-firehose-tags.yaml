apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: tags written as a list, where the stream takes a map from each
    # tag name to a string.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
              tags:
                - audit
