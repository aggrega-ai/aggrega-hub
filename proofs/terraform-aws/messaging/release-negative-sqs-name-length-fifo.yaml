apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sqs-name-length-fifo
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-sqs-name-length-fifo.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One fault, in the Aggregate: the component's name, 76 letters long, names
    # the FIFO queue, whose .fifo suffix brings it to 81 characters, and SQS
    # takes 80 at most.
    aws:
      directory: main
      components:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
          infra: {}
