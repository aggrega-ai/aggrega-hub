apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-name-length
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-data-firehose-name-length.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault, in the Aggregate: the component's name, 65 letters long,
    # names the stream, and Firehose takes 64 characters at most.
    aws:
      directory: main
      components:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
