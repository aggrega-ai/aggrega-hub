apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-overrides-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: buket_arn, a misspelling of bucket_arn, which this Recipe
    # does not read.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              buket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
