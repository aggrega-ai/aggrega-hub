apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-data-firehose-error-output-prefix-expression
  version: "1.0.0"
  description: >
    One fault: the error prefix holds a partitionKeyFromQuery expression,
    which Amazon Data Firehose does not evaluate in an error prefix.
spec:
  components:
    audit-events:
      type: core/messaging/data-firehose
      values:
        error_output_prefix: "audit-errors/!{firehose:error-output-type}/!{partitionKeyFromQuery:customer}/"
