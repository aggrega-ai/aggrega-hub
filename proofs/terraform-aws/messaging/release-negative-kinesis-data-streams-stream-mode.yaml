apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-stream-mode
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: the capacity mode written in lowercase, where the stream takes
    # ON_DEMAND or PROVISIONED.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              stream_mode: on-demand
