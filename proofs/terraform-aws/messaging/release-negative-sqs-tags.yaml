apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sqs-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One fault: tags written as a list, where the module takes a map from each
    # tag name to a string.
    aws:
      directory: main
      components:
        email-jobs:
          infra:
            overrides:
              tags:
                - orders
