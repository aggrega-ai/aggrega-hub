apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-destination
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: http_endpoint_configuration sets an HTTP endpoint as the destination, which
    # this Recipe's stream does not take.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
              http_endpoint_configuration:
                url: https://example.com/ingest
