apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-eventbridge-host
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-eventbridge-only.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One fault: infra.overrides.host names a host for an event bus, which
    # EventBridge publishes no address of.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              host: events.example.com
