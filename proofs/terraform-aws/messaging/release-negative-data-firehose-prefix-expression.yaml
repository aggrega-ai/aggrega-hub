apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-prefix-expression
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-data-firehose-prefix-expression.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault, in the Aggregate: the prefix holds !{firehose:error-output-type}.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
