apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sns-kms-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sns-only.yaml
  manifest: ./manifest-sns.yaml
  boundaries:
    # One fault: the KMS key named by a bare name, which is neither a key ID, an
    # alias name beginning alias/, nor an ARN.
    aws:
      directory: main
      components:
        alerts:
          infra:
            overrides:
              kms_key_id: example-topic-key
