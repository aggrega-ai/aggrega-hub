apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sqs-content-based-deduplication
  version: "1.0.0"
  description: >
    One fault: deduplication by message body asked of a standard queue,
    where Amazon SQS offers it on a FIFO queue alone.
spec:
  components:
    email-jobs:
      type: core/messaging/sqs
      values:
        content_based_deduplication: true
