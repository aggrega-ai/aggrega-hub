apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-bucket-arn-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: no bucket_arn, the bucket the stream delivers to.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
