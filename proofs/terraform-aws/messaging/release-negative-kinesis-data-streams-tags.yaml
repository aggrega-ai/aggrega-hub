apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-tags
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: tags written as a list, where the stream takes a map from each
    # tag name to a string.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              tags:
                - audit
