apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-eventbridge-name-default
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-negative-eventbridge-name-default.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One fault, in the Aggregate: the component default names the bus, and
    # EventBridge reserves that name for the account's default event bus.
    aws:
      directory: main
      components:
        default:
          infra: {}
