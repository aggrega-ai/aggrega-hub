apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: sqs-defaults
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # No override: SQS encrypts the queue with keys it owns, and the queue
    # carries no tag.
    aws:
      directory: main
      components:
        email-jobs:
          infra: {}
