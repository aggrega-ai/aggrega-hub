apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-sqs-name-length
  version: "1.0.0"
  description: >
    One fault: the component's name, 81 letters long, names its Amazon SQS
    standard queue, and SQS takes a queue name of 80 characters at most.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/sqs
