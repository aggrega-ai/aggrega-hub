apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-kinesis-data-streams-name-length
  version: "1.0.0"
  description: >
    One fault: the component's name, 129 letters long, names its Amazon
    Kinesis data stream, and Kinesis Data Streams takes a stream name of 128
    characters at most.
spec:
  components:
    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:
      type: core/messaging/kinesis-data-streams
