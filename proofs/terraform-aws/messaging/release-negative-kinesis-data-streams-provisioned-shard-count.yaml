apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-kinesis-data-streams-provisioned-shard-count
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-kinesis-data-streams-only.yaml
  manifest: ./manifest-kinesis-data-streams.yaml
  boundaries:
    # One fault: a provisioned stream with no number of shards.
    aws:
      directory: main
      components:
        audit-records:
          infra:
            overrides:
              stream_mode: PROVISIONED
