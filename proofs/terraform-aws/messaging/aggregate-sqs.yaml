apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: sqs
  version: "1.0.0"
  description: >
    An Amazon SQS FIFO queue of order events, deduplicated by message body,
    and a server on Amazon ECS reading its URL and ARN, so the server's
    environment shows what a consumer of the queue receives.
spec:
  components:
    order-events:
      type: core/messaging/sqs
      values:
        fifo_queue: true
        content_based_deduplication: true
        visibility_timeout: 120
        message_retention_period: 1209600
        delay_seconds: 5
        maximum_message_size: 262144
        receive_message_wait_time_seconds: 20

    order-worker:
      type: core/compute/server
      uses:
        events:
          order-events:
            target: order-events
            inject:
              env:
                - in: ORDER_EVENTS_QUEUE_URL
                  from: queue_url
                - in: ORDER_EVENTS_QUEUE_ARN
                  from: arn
