apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: eventbridge
  version: "1.0.0"
  description: >
    An Amazon EventBridge event bus of commerce events, and a server on
    Amazon ECS reading its ARN, so the server's environment shows what a
    publisher to the bus receives.
spec:
  components:
    commerce-events:
      type: core/messaging/eventbridge

    checkout:
      type: core/compute/server
      uses:
        events:
          commerce-events:
            target: commerce-events
            inject:
              env:
                - in: COMMERCE_EVENTS_BUS_ARN
                  from: arn
