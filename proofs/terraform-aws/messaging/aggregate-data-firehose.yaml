apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: data-firehose
  version: "1.0.0"
  description: >
    An Amazon Data Firehose stream of click events, delivered to S3 under a
    prefix by year and month and compressed with GZIP, and a server on Amazon
    ECS reading its name and ARN, so the server's environment shows what a
    producer to the stream receives.
spec:
  components:
    click-events:
      type: core/messaging/data-firehose
      values:
        prefix: "clicks/year=!{timestamp:yyyy}/month=!{timestamp:MM}/"
        error_output_prefix: "click-errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/"
        compression_format: GZIP

    analytics:
      type: core/compute/server
      uses:
        events:
          click-events:
            target: click-events
            inject:
              env:
                - in: CLICK_EVENTS_STREAM_NAME
                  from: delivery_stream_name
                - in: CLICK_EVENTS_STREAM_ARN
                  from: arn
