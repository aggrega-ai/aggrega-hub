apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: data-firehose
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One boundary, so the stream and the server are module blocks of one
    # Terraform root configuration and the server's CLICK_EVENTS_STREAM_NAME
    # and CLICK_EVENTS_STREAM_ARN carry references to the module's outputs,
    # which Terraform resolves when it applies. The stream carries a tag.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the S3 bucket, the role
    # Firehose delivers under, the ECS cluster, the subnet, the security group
    # and the execution role.
    aws:
      directory: main
      syncWave: 0
      components:
        click-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
              role_arn: arn:aws:iam::123456789012:role/example-firehose-role
              tags:
                team: analytics

        analytics:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-analytics:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
