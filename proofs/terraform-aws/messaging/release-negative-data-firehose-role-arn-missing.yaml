apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-data-firehose-role-arn-missing
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-data-firehose-only.yaml
  manifest: ./manifest-data-firehose.yaml
  boundaries:
    # One fault: no role_arn, the role the stream delivers under.
    aws:
      directory: main
      components:
        audit-events:
          infra:
            overrides:
              bucket_arn: arn:aws:s3:::example-firehose-bucket
