apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: negative-sqs-kms-key-alias-colon
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-sqs-only.yaml
  manifest: ./manifest-sqs.yaml
  boundaries:
    # One fault: the KMS key named by an alias name holding a colon, which the
    # pattern of KMS's CreateAlias AliasName refuses.
    aws:
      directory: main
      components:
        email-jobs:
          infra:
            overrides:
              kms_key_id: alias/example:queue-key
