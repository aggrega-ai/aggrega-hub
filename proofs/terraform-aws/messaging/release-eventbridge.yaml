apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: eventbridge
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-eventbridge.yaml
  manifest: ./manifest-eventbridge.yaml
  boundaries:
    # One boundary, so the bus and the server are module blocks of one
    # Terraform root configuration and the server's COMMERCE_EVENTS_BUS_ARN
    # carries a reference to the module's output, which Terraform resolves
    # when it applies. The bus's events are encrypted with the operator's key,
    # and the bus carries tags, one holding ${, %{ and a double quote, which
    # reach EventBridge as written.
    #
    # Every account-specific value is a placeholder for one the operator
    # already has in AWS account 123456789012: the KMS key, the ECS cluster,
    # the subnet, the security group and the execution role.
    aws:
      directory: main
      components:
        commerce-events:
          infra:
            overrides:
              kms_key_id: arn:aws:kms:eu-west-1:123456789012:key/00000000-0000-0000-0000-000000000000
              tags:
                team: commerce
                note: '${not-interpolated} "quoted" %{not-directive}'

        checkout:
          infra:
            image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-checkout:1.0.0
            overrides:
              cluster: arn:aws:ecs:eu-west-1:123456789012:cluster/example-cluster
              subnet_ids:
                - subnet-00000000000000000
              vpc_security_groups:
                - sg-00000000000000000
              execution_role_arn: arn:aws:iam::123456789012:role/example-execution-role
