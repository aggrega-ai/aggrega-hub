apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: negative-data-firehose-prefix-expression
  version: "1.0.0"
  description: >
    One fault: the prefix holds !{firehose:error-output-type}, which Amazon
    Data Firehose evaluates in the error prefix alone.
spec:
  components:
    audit-events:
      type: core/messaging/data-firehose
      values:
        prefix: "audit/!{firehose:error-output-type}/"
        error_output_prefix: "audit-errors/!{firehose:error-output-type}/"
