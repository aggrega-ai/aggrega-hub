name: Full checks

# The checks too long for every push, on GitHub-hosted runners: nightly, when
# main has moved since the last successful run of this workflow on main, and
# whenever started by hand. A red run is reported through GitHub's notification
# of a failed workflow run.
#
#   main-moved         reads the commit the last successful run of this
#                      workflow on main checked and, on a nightly run, skips
#                      every other job when main is still at that commit. A
#                      run started by hand runs every job.
#   cli                builds the aggrega binary, with the guests it embeds,
#                      from aggrega-cli's main beside this checkout, with the
#                      CLI's own build script and the Rust toolchains its guests
#                      pin. The build holds the guests to this catalog's plugin
#                      overlays, so an overlay change that breaks the CLI's
#                      build is found on this repository's own night.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-moved:
    name: Decide whether main moved since the last successful run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # lists this workflow's earlier runs on main
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Compare main with the commit the last successful run checked
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != schedule ]; then
            echo "a run started by hand runs every job"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "main is at $HEAD_SHA, the commit the last successful run checked: nothing to run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $HEAD_SHA; the last successful run checked ${last:-no commit yet}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: Build the aggrega binary from aggrega-cli main
    needs: main-moved
    if: needs.main-moved.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out aggrega-cli with its history and tags
        # The build stamps the version git describe gives the commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aggrega-ai/aggrega-cli
          ref: main
          path: aggrega-cli
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out this catalog beside it
        # The build holds the guests to the plugin overlays here and generates
        # their entities from them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aggrega-hub
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: aggrega-cli/go.mod
          cache: false

      - name: Install the Rust toolchains the guests pin
        # aggrega-cli's own installer: a pinned and verified rustup under the
        # runner's temporary directory, installing the release each guest's
        # rust-toolchain.toml names, with its targets.
        run: aggrega-cli/scripts/install-guest-rust-toolchains.sh --github-env "$RUNNER_TEMP/rust"

      - name: Build the binary and the guests it embeds
        run: aggrega-cli/scripts/build.sh
