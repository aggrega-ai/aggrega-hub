name: Checks

# The checks every push to main or to a release branch, and every pull request
# into main, runs on a GitHub-hosted runner. A newer push to the same branch or
# pull request cancels the run it supersedes.
#
#   component-recipes  refuses a Component version that no Recipe realizes while
#                      the version below it has Recipes
#                      (scripts/check-component-recipes.sh, whose --help says
#                      what it reads and what it does not). It reads the
#                      checkout and nothing else.
#
# The checks that build Releases with the aggrega binary, holding the cloud
# Recipes to the vendors' own validators, run in full-checks.yml.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-recipes:
    name: Refuse a Component version no Recipe realizes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A released section of CHANGELOG.md never carries an HTML comment, so a
      # stray marker of unreleased work fails the build here.
      - name: Changelog carries no work-in-progress marker
        run: if [ -f CHANGELOG.md ] && grep -n '<!--' CHANGELOG.md; then echo "CHANGELOG.md holds an HTML comment; a released section carries none" >&2; exit 1; fi

      - name: Refuse a Component version no Recipe realizes
        run: scripts/check-component-recipes.sh
