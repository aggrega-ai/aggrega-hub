name: Publish and sign catalog

# Differential catalog publisher. On a release tag (v*) or a manual run it publishes only the
# ENTITIES THAT CHANGED and signs each pushed reference keyless via the GitHub
# Actions OIDC identity against public Sigstore. Plugins are never published from
# here: the Plugin kind is generated and published by the CLI-tag pipeline, not
# from this repository, and the publish script already excludes it.
#
# Three jobs. The first two run side by side, and the publish job starts only
# once both have passed:
#
#   component-recipes
#                 refuses, before anything is selected, a Component version that
#                 no Recipe realizes while the version below it has Recipes
#                 (scripts/check-component-recipes.sh, whose --help says what it
#                 reads and what it does not). It reads the checkout and nothing
#                 else, on a GitHub-hosted runner.
#   registry      checks, before anything is selected, that the registry accepts
#                 the stored credential (one authenticated GET /v2/, which pushes
#                 nothing and opens no upload session), then that the tooling
#                 image the publish job runs inside exists, waiting a bounded
#                 time for it. It runs on a GitHub-hosted runner, so a wait for
#                 the image never holds the runner the CLI's own publisher needs
#                 to publish that image.
#   publish-sign  runs inside the tooling image, holds the selected entities to
#                 the published-version guard, publishes and signs them,
#                 publishes and signs the catalog snapshot of the published tree,
#                 records what it published on the published branch, and
#                 advances the publish marker.
#
# The published-version guard runs before anything is pushed, a dry run's
# included: each selected entity whose version the published branch records must
# still carry the digest recorded for it, and the committed .published-version-guard
# switch decides whether one that does not is a warning or stops the run.
#
# A real publish that succeeded records, on the published branch, every reference
# it pushed or found already published, with its version and digest, through
# scripts/record-published.sh: one commit on top of the branch as it stands,
# pushed as a fast-forward and never forced, read again and rebuilt when another
# publish recorded first. A dry run records nothing. Nothing here writes the main
# branch; the workspace's sync takes the branch's owned paths into it.
#
# The credential check runs on every run, a dry run included, so a manual dry
# run is also how to prove that the stored credential matches the registry. The
# manual-dispatch entry defaults to a dry run: once the component-recipes and
# registry jobs pass, it prints the reference set it would push and the sign
# command, publishing, signing and moving nothing.
#
# The first publish into an empty registry, including one emptied by a reinstall
# while the marker tag remains, is a manual run with mode=full and
# dry_run=false, which publishes the whole catalog and establishes the marker:
#   gh workflow run catalog-publish-sign.yml -f mode=full -f dry_run=false
# A differential run with no marker tag halts and says so; one from a marker
# left over from before the registry was emptied publishes only what changed
# after it.
#
# Settings, by name:
#   variables  CATALOG_REGISTRY   the registry to publish to, as its host
#              REGISTRY_USERNAME  the registry username
#              TOOLING_IMAGE_TAG  the tag of the tooling image the publish job
#                                 runs inside, such as stable
#              AGGREGA_RUNNER     the runner label for the publish job
#                                 (optional, a hosted runner by default)
#   secrets    REGISTRY_PASSWORD  the registry password

on:
  # A release tag publishes the catalog changed since the last publish (a real,
  # non-dry-run differential publish): a person decides when the catalog ships
  # and pushes the tag. A merge to main publishes nothing; a manual dispatch
  # below runs a dry run, a differential or a full publish on demand. The marker
  # tag this workflow moves (`catalog-published`) does not match the pattern, so
  # moving it never starts another run.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the stored registry credential, then compute and print the reference set (and the sign command) without any publish, signing, or marker move."
        required: false
        default: true
        type: boolean
      mode:
        description: "diff = publish entities changed since the marker; full = reconcile the whole catalog (also how the marker is first established)."
        required: false
        default: diff
        type: choice
        options: [diff, full]

# Keyless signing via the GitHub Actions OIDC identity. The workflow mints a
# short-lived identity token from the Actions runtime and signs against public
# Sigstore (Fulcio + Rekor); no offline key is stored. The catalog publishes to
# the public hub, so recording references in the public transparency log is
# expected, not a leak. Only the publish-sign job asks for more than reading the
# repository: id-token:write lets it mint the OIDC token, and contents:write lets
# it make the two git writes this workflow makes, both to its own repository and
# both with the job's own token: recording what it published on the published
# branch, and advancing the publish marker tag (the final two steps). Its checkout
# does not keep that token; each of the two steps is handed it, and git reads it
# from the environment, so nothing else in the job finds it on disk. Nothing else
# here writes to the repository.
permissions:
  contents: read

env:
  # Destination registry host. A repository variable the operator sets once;
  # the placeholder default names a host that never resolves, so an unset
  # variable fails the credential check, which names the variable.
  REGISTRY: ${{ vars.CATALOG_REGISTRY || 'registry.invalid' }}

jobs:
  component-recipes:
    # Runs on every run, a dry run included, so a Component version a Manifest
    # could map to no Recipe stops the run before anything is selected, pushed
    # or signed. It needs no credential and no image, and writes nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the catalog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Refuse a Component version no Recipe realizes
        run: scripts/check-component-recipes.sh

  registry:
    # A job of its own, because the publish job runs inside the tooling image and
    # the runner pulls a job's container image before any of its steps run: a
    # missing image or a refused credential would fail that job before a step
    # could say what to fix. Here each is checked by a step whose failure names
    # the setting to check. It runs on a GitHub-hosted runner, so waiting for the
    # image runs beside the CLI's publisher, which creates the image, rather than
    # holding the runner that publisher needs. It reads the repository and
    # writes nothing.
    runs-on: ubuntu-latest
    # The image wait below gives up after 30 minutes; this bounds the job even
    # if a request hangs.
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Read by registry-gate.sh from the environment, never placed on a
      # command line.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out the registry gate script
        # The gate script under .github/scripts is all this job reads from the
        # repository.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the stored registry credential
        # One GET /v2/ with the stored credential; anything but 200 fails,
        # naming the settings to check and reporting only the HTTP status. An
        # empty password or username is refused before any request.
        run: |
          .github/scripts/registry-gate.sh credential \
            --registry-url "https://$REGISTRY" \
            --registry-setting CATALOG_REGISTRY \
            --username-setting REGISTRY_USERNAME \
            --password-setting REGISTRY_PASSWORD

      - name: Wait for the tooling image
        # The publish job runs inside hub.aggrega.ai/tools/aggrega, which only
        # the CLI's release publisher creates. Release tags pushed together
        # start the publishers within seconds of each other, so on an empty
        # registry this waits for the image: a check every 30 seconds for at
        # most 30 minutes, long enough for a CLI publish started at the same
        # moment, or queued behind one other job on the runner, to reach the
        # step that pushes the image. A refused credential is not retried. On a
        # timeout the failure names the missing image and the re-run that
        # finishes the job once the CLI is published.
        id: image
        env:
          TOOLING_IMAGE_TAG: ${{ vars.TOOLING_IMAGE_TAG }}
        run: |
          .github/scripts/registry-gate.sh image \
            --registry-url https://hub.aggrega.ai \
            --repository tools/aggrega \
            --tag "$TOOLING_IMAGE_TAG" \
            --tag-setting TOOLING_IMAGE_TAG \
            --username-setting REGISTRY_USERNAME \
            --password-setting REGISTRY_PASSWORD \
            --timeout 1800 \
            --interval 30

  publish-sign:
    needs: [component-recipes, registry]
    # Configurable runner label. The default hosted runner is fine for a light
    # catalog diff; point the AGGREGA_RUNNER repository variable at a
    # self-hosted label to move heavy work off metered hosted minutes.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write

    # 🔴 NAME THE SHELL RATHER THAN LETTING IT BE CHOSEN. Every `run:` below opens
    # with `set -euo pipefail`, and `pipefail` is a bash option that dash rejects
    # outright — `Illegal option -o pipefail`, exit 2, before the first real
    # command. Inside a container job the default shell was resolving to `sh`,
    # which on Debian is dash, so every step died on its own first line. This
    # workflow runs in the same image as the documentation publisher, where that
    # was observed, and carries the same opening line in every step.
    #
    # The image was NOT the cause: bash is in the base and was verified present in
    # the published image. The shell is stated here rather than diagnosed.
    defaults:
      run:
        shell: bash

    # Run inside the published tooling image so `aggrega` is already on PATH —
    # no toolchain build here. The image must also provide git, bash and awk,
    # which the publish script uses to select, push and mark the changed
    # entities, plus curl, which the OIDC-token step uses to mint the keyless
    # signing identity from the Actions runtime.
    #
    # PIN SEAM — the tooling-image tag comes from the TOOLING_IMAGE_TAG
    # repository variable, which the operator sets once (for example, to
    # `stable`, the moving tag the publisher points at the most recently
    # published image). The registry job composes the execution image from the
    # fixed registry-and-name prefix hub.aggrega.ai/tools/aggrega and that tag,
    # and hands it to this job once the image exists; only the tag is
    # operator-set. An unset variable fails the registry job, which names the
    # variable.
    #
    # Tracking the moving `stable` tag means a newly published tooling image is
    # adopted on the next run without editing this file. The ABI-compatibility
    # gate step below is the safety net: it fails loudly when the resolved image
    # speaks a different plugin ABI than this catalog is authored against, so a
    # new image that crosses an ABI boundary cannot publish without a human
    # consciously reviewing compatibility. To pin a fixed version instead, set
    # the variable to that version tag.
    #
    # The registry is authenticated even on pull, so the image is pulled with the
    # same registry credentials used to push.
    container:
      image: ${{ needs.registry.outputs.image }} # zizmor: ignore[unpinned-images] the tooling image this release publishes, at its exact version, which the registry job waits for before this job starts
      credentials:
        username: ${{ vars.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    env:
      # Registry credentials — needed on EVERY job because the registry is
      # authenticated on push AND pull. Read via the environment (not
      # interpolated into a run script) to avoid expression injection. The
      # username feeds `aggrega login`; the password is read by login from
      # AGGREGA_REGISTRY_PASSWORD.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      AGGREGA_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Dispatch inputs surfaced as env so the run script reads them from the
      # environment rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      DISPATCH_MODE: ${{ inputs.mode }}
      # The plugin ABI version this catalog is authored against — a single
      # reviewed value. The ABI-compatibility gate step compares the pinned
      # tooling image's own abiVersion against this and fails loudly on a
      # mismatch, so a new image that crosses an ABI boundary cannot publish
      # without a human consciously reviewing compatibility. Bump this in the
      # same reviewed change that adopts a new-ABI tooling-image tag.
      EXPECTED_ABI_VERSION: v1beta1

    steps:
      - name: Check out the catalog with full history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The differential publish diffs from a marker tag to HEAD, so the
          # marker tag and the history between it and HEAD must be present.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Trust the checked-out tree
        # 🔴 git REFUSES a repository whose directory is owned by another user —
        # "detected dubious ownership in repository at '/__w/…'". The runner mounts
        # and owns the workspace as its own user while this job runs inside the
        # tooling image as root, so the two never agree; the refusal is structural,
        # not a misconfiguration. It bites hard here because the differential
        # publish diffs from a marker tag to HEAD and advances that tag — every one
        # of those is a git call.
        #
        # The checkout action registers its own exception, but only inside the
        # temporary HOME it builds for itself, which the `run:` steps below do not
        # read. This registers it where they will look.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gate on tooling-image ABI compatibility
        # Runs inside the pinned tooling image, so `aggrega version -o json`
        # reports that image's own plugin ABI. A mismatch against the ABI this
        # repository expects halts the run for a human to resolve; it is never
        # auto-adopted. This gate is the safety net when a tooling-image tag bump
        # (for example, an opened update pull request) crosses an ABI boundary,
        # and it protects the publish whether or not the update bot is wired.
        run: scripts/check-tooling-abi.sh

      - name: Authenticate to the registry
        # Only a real publish logs in. A dry run contacts the registry only to
        # check the credential, find the tooling image and pull it, none of
        # which reads a stored login.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          # login reads the password from AGGREGA_REGISTRY_PASSWORD; the username
          # comes from the environment. No secret is placed on the command line
          # or interpolated from an expression.
          aggrega login "$REGISTRY" --username "$REGISTRY_USERNAME"

      - name: Mint the Sigstore OIDC identity token
        # Keyless signing needs a short-lived OIDC identity token. Request one
        # from the Actions runtime (available because id-token:write is granted),
        # audience-scoped to sigstore, and export it as SIGSTORE_ID_TOKEN so the
        # publish script signs non-interactively — no browser, no offline key.
        # Only a real publish signs, so a dry run skips this. The request is bounded and retried: an unbounded
        # request waits forever on a stalled connection.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          token_json="$(curl -sSL --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          id_token="$(printf '%s' "$token_json" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$id_token" ] || { echo "OIDC: runtime returned no token value" >&2; exit 1; }
          echo "::add-mask::$id_token"
          echo "SIGSTORE_ID_TOKEN=$id_token" >> "$GITHUB_ENV"

      - name: Publish and sign the changed catalog entities
        run: |
          set -euo pipefail

          # A push event is always a real differential publish; a manual dispatch
          # honors its dry-run and mode inputs. Both are read from the
          # environment, never interpolated into this script.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            MODE="$DISPATCH_MODE"
          else
            DRY="false"
            MODE="diff"
          fi

          # Keyless signing: publish-diff.sh batch-signs each pushed reference
          # through `aggrega sign`, which reads the identity token from
          # SIGSTORE_ID_TOKEN (minted above) and uses the binary's public
          # Sigstore defaults for Fulcio and Rekor.
          # Every reference a real run pushes or finds already published, with
          # its version and digest, is written here for the next step to record.
          # Up to 16 pushes (and as many published-version checks before them)
          # run at once, each entity its own repository on the registry; signing
          # runs 4 at once, a lower bound because every keyless signature asks
          # the public certificate authority and transparency log. What the run
          # prints and records stays in selection order whatever the bounds.
          args=(--registry "$REGISTRY" --sign --record-out "$RUNNER_TEMP/published-rows.tsv"
            --push-jobs 16 --sign-jobs 4)
          if [ "$MODE" = "full" ]; then
            # A full reconcile re-pushes every catalog entity; --yes bypasses the
            # script's interactive confirm for non-interactive CI.
            args+=(--full --yes)
          fi
          if [ "$DRY" = "true" ]; then
            args+=(--dry-run)
          fi

          scripts/publish-diff.sh "${args[@]}"

      - name: Publish and sign the catalog snapshot
        # The whole catalog tree at the published commit, as one gzipped tar, pushed
        # to <registry>/catalog/snapshot — what `aggrega import` reads in a workspace
        # that names no catalog folder. It runs after the entities published and
        # before the record and the marker move, and scripts/publish-catalog-snapshot.sh
        # refuses a commit the publish step did not advance the local marker to, so a
        # snapshot never names an entity the registry does not hold; a failure here
        # fails the run, leaving the marker where it was. It is tagged with the commit,
        # signed keyless with the token minted above, and only then tagged latest. A
        # dry run builds it and prints the reference and digest it would push, and
        # pushes, signs and tags nothing. The registry credential is the job's own,
        # read by the script from the environment, never from a command line.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_DRY_RUN" = "true" ]; then
            scripts/publish-catalog-snapshot.sh --registry "$REGISTRY" --dry-run --sign
          else
            scripts/publish-catalog-snapshot.sh --registry "$REGISTRY" --sign
          fi

      - name: Record what was published on the published branch
        # Records every reference the publish step pushed or found already
        # published, with its version and digest, on the published branch: one
        # commit on top of the branch as the remote holds it, pushed as a
        # fast-forward with the job's own token and never forced; a branch that
        # moved meanwhile is read again and the commit rebuilt on it. It runs
        # before the marker is persisted, so a run whose record failed leaves the
        # marker where it was and the next run publishes, and records, the same
        # range again. Skipped on a dry run, which records nothing.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PUBLISHED_FROM: ${{ github.sha }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=catalogpublish.probe GIT_CONFIG_VALUE_0=read git config --get catalogpublish.probe || true)"
          if [ "$probe" != read ]; then
            echo "this image's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does" >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          scripts/record-published.sh --rows "$RUNNER_TEMP/published-rows.tsv" \
            --message "chore(catalog): record the catalog versions published from ${PUBLISHED_FROM:0:12}"

      - name: Persist the publish marker
        # MARKER SEAM: the publish script advances a local git tag (the marker it
        # diffs from) to HEAD on a fully successful real publish. Push that moved
        # tag back so the next run diffs from where this one finished; the
        # leading '+' force-updates only that one ref. Skipped on a dry run
        # (which moves nothing). A missed push is safe, not corrupting: the
        # publish is idempotent, so the next run merely re-diffs a wider range
        # and re-confirms already-published entities as no-ops.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          MARKER: catalog-published
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=catalogpublish.probe GIT_CONFIG_VALUE_0=read git config --get catalogpublish.probe || true)"
          if [ "$probe" != read ]; then
            echo "this image's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does" >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push origin "+refs/tags/${MARKER}"
