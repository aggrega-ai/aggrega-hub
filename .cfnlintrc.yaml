# cfn-lint's configuration for this catalog. scripts/vendor-validate.sh names
# this file to cfn-lint on every CloudFormation stack template it lints, and
# cfn-lint then reads no other configuration file: every error and warning it
# reports from a rule not ignored here is a finding.
#
# Each rule ignored here carries its reason in a comment beside it: what the rule
# reports, and why a template the catalog renders is right to carry it anyway. A
# rule listed without its reason is listed wrongly: give it one, or remove it.
#
# cfn-lint also reads rules to ignore from a template's own Metadata, under the
# key cfn-lint. No Recipe in this catalog renders that key, so a rule is ignored
# here or nowhere; the script does not refuse a template carrying it.
ignore_checks: []
