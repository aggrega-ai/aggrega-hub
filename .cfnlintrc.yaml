# cfn-lint's configuration for this catalog. scripts/vendor-validate.sh names
# this file to cfn-lint on every CloudFormation stack template it lints, and
# cfn-lint then reads no other configuration file: every error and warning it
# reports from a rule not ignored here is a finding. A template's own Metadata
# under the key cfn-lint is set aside from the copy cfn-lint lints, so a rule is
# ignored here or nowhere.
#
# Each rule ignored here is a line of its own under ignore_checks, - <rule>, with
# its reason in a comment beside it or on the line directly above: what the rule
# reports, and why a template the catalog renders is right to carry it anyway.
# scripts/vendor-validate.sh --all refuses an entry with no reason, and rules
# written in brackets on the ignore_checks line itself, naming each.
ignore_checks: []
