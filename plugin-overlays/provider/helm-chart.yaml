apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-chart
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries the provider-socket metadata for this rendering engine.
    #
    # workloadSchema is intentionally ABSENT: the helm-chart engine does NOT
    # support Workload synthesis — it produces an umbrella chart scaffold, not
    # rendered Kubernetes manifests. Recipes targeting this provider use sourced
    # mode (source + valuesMapping) or artifacts mode. Declaring a workloadSchema
    # here would falsely advertise synthesis this engine does not perform.
    #
    # wellKnownAnnotations documents the aggrega.ai/ boundary annotations the
    # helm-chart engine reads and the behavior applied when each is absent. This
    # is descriptive contract metadata for catalog readers and the inspect
    # surface; the compiler passes these annotations through as opaque strings.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Kubernetes namespace the sub-chart resources render into. Components grouped into one chart must agree on this value.
        defaultBehavior: No namespace field is injected; resources inherit the apply-time context namespace.
      - key: aggrega.ai/image-registry
        purpose: Registry prefix prepended to container image references.
        defaultBehavior: No prefix; images render with their authored references.
      - key: aggrega.ai/image-pull-secret
        purpose: Name of the Kubernetes imagePullSecrets entry attached to the sub-chart pod templates.
        defaultBehavior: No imagePullSecrets entry is added.
      - key: aggrega.ai/cluster-domain
        purpose: DNS suffix used for cross-namespace service discovery.
        defaultBehavior: cluster.local.
      - key: aggrega.ai/ingress-class
        purpose: IngressClass applied to rendered Ingress resources.
        defaultBehavior: The provider default is used or the field is omitted.
      - key: aggrega.ai/service-mesh
        purpose: Mesh sidecar-injection annotations applied to the sub-chart pod templates.
        defaultBehavior: No mesh annotations are added.
      - key: aggrega.ai/service-account
        purpose: ServiceAccount the sub-chart pods run under.
        defaultBehavior: default.
      - key: aggrega.ai/pod-security-standard
        purpose: Pod Security Standards level applied to the sub-chart workloads.
        defaultBehavior: No pod-security-standard level is applied.
      - key: aggrega.ai/chart-name
        purpose: Name of the assembled umbrella Helm chart.
        defaultBehavior: The leaf boundary name is used.
      - key: aggrega.ai/chart-version
        purpose: Version stamped on the assembled umbrella Helm chart.
        defaultBehavior: 0.1.0.
