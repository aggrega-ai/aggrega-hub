apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-chart
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries this plugin's provider-socket metadata.
    #
    # workloadSchema is intentionally ABSENT: the helm-chart provider does NOT
    # support Workload synthesis — it produces an umbrella chart scaffold, not
    # rendered Kubernetes manifests. Recipes targeting this provider use sourced
    # mode (source + valuesMapping) or artifacts mode. Declaring a workloadSchema
    # here would falsely advertise synthesis this provider does not perform.
    #
    # wellKnownAnnotations is this provider's support claim: the aggrega.ai/
    # annotations the helm-chart provider reads, the scope each is read at, and the
    # behavior applied when it is absent. The published support matrix is
    # rendered from these entries, so a key listed here is one an author can
    # expect to change the rendered output at the scope it names. A scope naming
    # an input kind the contract below does not render halts the load. The
    # annotation values themselves stay opaque strings the compiler passes
    # through without reading.
    #
    # This provider assembles a pristine vendored chart it does not synthesize
    # containers or pod templates into, so the node-scoped placement keys have no
    # render slot here at all — the claim is one key, and it is a boundary one:
    # chart-name is resolved once per umbrella-chart assembly through the
    # assemblyNameAnnotation contract below, not on any node's render path.
    wellKnownAnnotations:
      - key: aggrega.ai/chart-name
        purpose: Name of the assembled umbrella Helm chart.
        defaultBehavior: The leaf boundary name is used.
        scope:
          - boundary
