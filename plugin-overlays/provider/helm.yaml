apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries this plugin's provider-socket metadata:
    # how it translates the aggrega.ai/v1alpha1 Workload kind and which
    # platform-native annotations it reads. A non-empty workloadSchema declares
    # that this provider supports Workload synthesis; the host compiles it to JSON
    # Schema 2020-12 at load as a structural guardrail. It documents, for
    # catalog readers, the Workload surface the helm provider materialises.
    #
    # Helm synthesis rules the body reflects:
    #   - workload.form selects the controller: stateless (or empty) -> Deployment,
    #     stateful -> StatefulSet, daemon -> DaemonSet, task -> Job,
    #     scheduled -> CronJob (spec.schedule from the workload schedule field)
    #   - 1 Service per entry in workload.services
    #   - 1 PVC per workload.volumes.*.persistent entry
    #   - persistentTemplate volumes require form: stateful and render as
    #     StatefulSet volumeClaimTemplates
    #   - ConfigMap/Secret volumes render as volume refs (source must exist)
    #   - replicas, scheduling, podSecurityContext, serviceAccount flow to
    #     the controller spec directly
    #   - containers.*.attachments with as:env -> envFrom; as:file -> volume+mount
    #   - labels and annotations on rendered resources are not authored on the
    #     Workload. This provider stamps every object, and the pod template,
    #     with the aggrega.ai/ provenance keys for the node plus the app and
    #     app.kubernetes.io/name keys derived from the component instance, and
    #     writes the boundary path and recipe URI as object annotations. A
    #     recipe author adds keys of their own through the Recipe's
    #     outputLabels and outputComponentLabels, which reach the same surface.
    workloadSchema: |
      apiVersion:
        type: string
        description: Always aggrega.ai/v1alpha1.
      kind:
        type: string
        description: Always Workload.
      form:
        type: string
        description: Abstract controller-shape intent, one of stateless, stateful, daemon, scheduled, task. Selects the rendered controller kind (stateless or empty -> Deployment, stateful -> StatefulSet, daemon -> DaemonSet, scheduled -> CronJob, task -> Job). Defaults to stateless.
      replicas:
        type: integer
        min: 0
        description: Desired replica count on the rendered Deployment or StatefulSet. Ignored by shapes that carry no replica count (DaemonSet, Job).
      initContainers:
        type: array
        description: Containers that run to completion before the main containers start.
      containers:
        type: object
        valuesType: object
        description: Map of container name to container spec (image, command, args, variables, ports, resources, health probes, volumeMounts, securityContext). At least one entry is required.
      volumes:
        type: object
        valuesType: object
        description: "Map of volume name to volume spec. persistent renders one PVC each; persistentTemplate requires form: stateful and renders StatefulSet volumeClaimTemplates; configmap and secret render as references to an existing source."
      services:
        type: object
        valuesType: object
        description: Map of service name to service spec. Each renders a Kubernetes Service (ClusterIP, NodePort, LoadBalancer, or Headless) named <instance id>-<service name>, so names stay unique across instances.
      scheduling:
        type: object
        description: Kubernetes scheduling constraints (nodeSelector, affinity, tolerations, topologySpreadConstraints) applied to the pod template.
      podSecurityContext:
        type: object
        description: Pod-level security context (runAsUser, runAsGroup, fsGroup, supplementalGroups).
      serviceAccount:
        type: string
        description: Name of the ServiceAccount the rendered pods run under.
    # wellKnownAnnotations is this provider's support claim: the aggrega.ai/
    # annotations the helm provider reads, the scope each is read at, and the
    # behavior applied when it is absent. The published support matrix is
    # rendered from these entries, so a key listed here is one an author can
    # expect to change the rendered output at the scope it names. A scope naming
    # an input kind the contract below does not render halts the load. The
    # annotation values themselves stay opaque strings the compiler passes
    # through without reading.
    #
    # namespace reaches both render paths — the sourced path applies it to the
    # loaded chart, the synthesis path writes it onto the resources it builds.
    # The other three have a render slot only where this provider builds the pod
    # itself, so they are synthesis-scoped: inside a vendored chart there is no
    # slot for them that does not require reading the chart's own values
    # interface.
    #
    # kubernetes-version is sourced-scoped: it sets the version a chart rendered
    # from source reads as .Capabilities.KubeVersion, read the way
    # helm template --kube-version reads its flag. A Workload this provider
    # synthesizes reads no cluster version.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Kubernetes namespace the boundary's resources render into.
        defaultBehavior: No namespace field is injected; resources inherit the apply-time context namespace.
        scope:
          - sourced
          - synthesized
      - key: aggrega.ai/image-registry
        purpose: Registry prefix prepended to container image references.
        defaultBehavior: No prefix; images render with their authored references.
        scope:
          - synthesized
      - key: aggrega.ai/image-pull-secret
        purpose: Name of the Kubernetes imagePullSecrets entry attached to the pod template.
        defaultBehavior: No imagePullSecrets entry is added.
        scope:
          - synthesized
      - key: aggrega.ai/service-account
        purpose: ServiceAccount the rendered pods run under.
        defaultBehavior: default.
        scope:
          - synthesized
      - key: aggrega.ai/kubernetes-version
        purpose: Kubernetes version of the cluster the component deploys to, which a chart rendered from source reads as .Capabilities.KubeVersion.
        defaultBehavior: The version the stock helm template of the same helm release renders for, that of the Kubernetes client library the provider is built with.
        scope:
          - sourced
