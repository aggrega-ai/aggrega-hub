apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: compose
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries this plugin's provider-socket metadata:
    # how it translates the aggrega.ai/v1beta1 Workload kind and which
    # platform-native annotations it reads. A non-empty workloadSchema declares
    # that this provider supports Workload synthesis; the host compiles it to JSON
    # Schema 2020-12 at load as a structural guardrail. It documents, for
    # catalog readers, the Workload surface the compose provider materialises.
    #
    # Compose synthesis rules the body reflects:
    #   - workload.form: stateless and stateful render as services (stateful adds
    #     the named volume); daemon, scheduled, and task have no compose mapping
    #     and halt loudly
    #   - Each Workload -> one service entry in docker-compose.yaml
    #   - containers -> compose service (multi-container -> sidecars via
    #     additional services sharing the network namespace)
    #   - volumes.*.persistent -> named volume + service mount
    #   - volumes.*.configmap / .secret -> bind mount of rendered file
    #   - services (K8s) -> NodePort/LoadBalancer/Loopback ports published
    #   - replicas -> deploy.replicas (swarm mode) or ignored in plain compose
    #   - probes -> healthcheck block (http/tcp mapped to curl/nc, exec direct)
    #   - labels on emitted services are not authored on the Workload. This
    #     provider stamps every service's labels map with the aggrega.ai/
    #     provenance keys for the node, including the boundary path and the
    #     recipe URI. A recipe author adds keys of their own through the
    #     Recipe's outputLabels and outputComponentLabels, which reach the same
    #     labels map.
    workloadSchema: |
      apiVersion:
        type: string
        description: Always aggrega.ai/v1beta1.
      kind:
        type: string
        description: Always Workload.
      form:
        type: string
        description: Abstract controller-shape intent, one of stateless, stateful, daemon, scheduled, task. compose renders stateless and stateful as services (stateful adds the named volume); daemon, scheduled, and task have no compose mapping and halt loudly. Defaults to stateless.
      replicas:
        type: integer
        min: 0
        description: Desired replica count. Mapped to deploy.replicas under swarm mode; ignored by plain compose when greater than one.
      initContainers:
        type: array
        description: Containers that run to completion before the main containers start; emitted as depends_on service-completion ordering.
      containers:
        type: object
        valuesType: object
        description: Map of container name to container spec. The first container becomes the compose service; additional containers become sidecar services sharing the network namespace.
      volumes:
        type: object
        valuesType: object
        description: "Map of volume name to volume spec. persistent and persistentTemplate (which requires form: stateful) render as named volumes with service mounts; configmap and secret render as bind mounts of the rendered file."
      services:
        type: object
        valuesType: object
        description: Map of service name to service spec. NodePort and LoadBalancer ports are published on the compose service, Loopback ports on the host's loopback address only; ClusterIP and Headless ports stay on the compose network and are not published.
      scheduling:
        type: object
        description: Kubernetes scheduling constraints. Ignored by compose except where a native analog exists; a warning is emitted.
      podSecurityContext:
        type: object
        description: Pod-level security context. Best-effort mapping to compose user and security options where an analog exists.
      serviceAccount:
        type: string
        description: Name of the ServiceAccount. No compose analog; documented for parity and ignored by the compose provider.
    # wellKnownAnnotations is this provider's support claim: the aggrega.ai/
    # annotations the compose provider reads, the scope each is read at, and the
    # behavior applied when it is absent. The published support matrix is
    # rendered from these entries, so a key listed here is one an author can
    # expect to change the rendered output at the scope it names. A scope naming
    # an input kind the contract does not render halts the load. The annotation
    # values themselves stay opaque strings the compiler passes through without
    # reading.
    #
    # namespace names the network every emitted service attaches to, which
    # this provider sets on both render paths; unset, boundaries written into
    # one compose file share that file's network. image-registry has a render
    # slot only where this provider builds the service itself, so it is
    # synthesis-scoped.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Docker network name the boundary's services attach to.
        defaultBehavior: The sanitised path of the compose file is used as the network name, so boundaries written into one compose file share one network.
        scope:
          - sourced
          - synthesized
      - key: aggrega.ai/image-registry
        purpose: Registry prefix prepended to container image references.
        defaultBehavior: No prefix; images render with their authored references.
        scope:
          - synthesized
