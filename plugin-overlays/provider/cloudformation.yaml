apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: cloudformation
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries this plugin's provider-socket metadata.
    # The cloudformation provider synthesizes no Workload, so it declares no
    # workloadSchema.
    #
    # wellKnownAnnotations is this provider's support claim: the aggrega.ai/
    # annotations the cloudformation provider reads, the scope each is read at, and
    # the behavior applied when it is absent. The published support matrix is
    # rendered from these entries. A scope naming an input kind the contract does
    # not render halts the load; the annotation values themselves stay opaque
    # strings the compiler passes through without reading or validating.
    #
    # All three are boundary-scoped: each is read at the moment a reference
    # crosses from one stack to another, to shape that reference, and the value
    # is read at the crossing however each endpoint node was rendered. Input kind
    # is therefore not a meaningful axis for them.
    wellKnownAnnotations:
      - key: aggrega.ai/aws-account
        purpose: The AWS account the stack (boundary) deploys into. A cross-boundary reference reads it to decide whether a peer stack sits in the same account.
        defaultBehavior: The peer is treated as same-account, and a cross-stack reference resolves through a same-account stack-export import rather than a cross-account stack-output read.
        scope:
          - boundary
      - key: aggrega.ai/aws-region
        purpose: The AWS region the stack (boundary) deploys into. A cross-boundary reference reads it to decide whether a peer stack sits in the same region.
        defaultBehavior: The peer is treated as same-region, and a cross-stack reference resolves through a same-region stack-export import.
        scope:
          - boundary
      - key: aggrega.ai/aws-assume-role-arn
        purpose: The IAM role ARN a cross-account stack read assumes to reach a peer stack's exported values.
        defaultBehavior: No role is supplied, and a cross-account reference carries no assume-role.
        scope:
          - boundary
