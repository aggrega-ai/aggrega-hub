apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: arm
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # wellKnownAnnotations is this provider's support claim: the aggrega.ai/
    # annotations the arm provider reads, the scope each is read at, and the
    # behavior applied when it is absent. The annotation values stay opaque
    # strings the compiler passes through without reading or validating.
    #
    # Each is boundary-scoped: it is read when a boundary's template is
    # assembled or when a reference crosses from one deployment to another, so
    # input kind is not a meaningful axis.
    wellKnownAnnotations:
      - key: aggrega.ai/azure-subscription
        purpose: The Azure subscription the boundary's template deploys into. A cross-boundary reference reads it to build the producing deployment's resource ID.
        defaultBehavior: The producer is taken to be in the consuming deployment's own subscription.
        scope:
          - boundary
      - key: aggrega.ai/azure-resource-group
        purpose: The Azure resource group the boundary's template deploys into. A cross-boundary reference reads it to build the producing deployment's resource ID, and a boundary deployed at subscription scope deploys its resource-group content into it.
        defaultBehavior: The producer is taken to be in the consuming deployment's own resource group; a boundary deployed at subscription scope with resource-group content halts naming the annotation.
        scope:
          - boundary
      - key: aggrega.ai/azure-deployment-scope
        purpose: The scope the boundary's template deploys at, resourceGroup or subscription; managementGroup halts the build. At subscription scope the template's resource-group content deploys as one nested deployment into the resource group aggrega.ai/azure-resource-group names, and a cross-boundary reference to a component of the boundary halts.
        defaultBehavior: The template deploys at resource-group scope.
        scope:
          - boundary
