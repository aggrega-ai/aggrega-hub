apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: terraform
spec:
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
  provider:
    # provider carries this plugin's provider-socket metadata.
    # The terraform provider synthesizes no Workload, so it declares no
    # workloadSchema.
    #
    # readsNoWellKnownAnnotations is this provider's support claim: it reads
    # none of the aggrega.ai/ annotations. It vendors a module verbatim, places
    # a Recipe's artifact files as written, and writes the root configuration
    # that calls them; none of those has a slot for a namespace, a registry
    # prefix, a pull secret or a service account. So
    # a build warns about every such annotation that reaches a render through
    # this provider, and the value still passes through untouched. A provider
    # that declares nothing here makes no claim at all, and no warning is raised
    # for it.
    readsNoWellKnownAnnotations: true
