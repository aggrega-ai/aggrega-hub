apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: generated-secret
  version: 1.0.0
  description: >
    Terraform realization of core/generated-secret. Pure wiring: it declares
    nothing but the capability it binds to and the Feature it implements, and
    renders no resource of its own. The credential is provisioned and rotated
    by the target the Terraform Recipe manages — a managed database Recipe sets
    the provider's own managed-password directive — so there is no value to
    inject and no secret to emit. Its whole contribution is that the slot the
    component declares is bound, and bound by the form that says the engine
    owns the credential.

    The name generated-secret is shared with the cloudformation and helm
    realizations of the same Feature, so a Manifest references this one
    provider-qualified, as terraform/generated-secret:1.0.0. A bare
    generated-secret:1.0.0 matches more than one and resolves to none, and the
    pull halts on it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/generated-secret:1.0.0
  # DELIBERATE NEAR-DUPLICATE of the cloudformation and helm realizations of the
  # same name, identical but for spec.capability: the Feature declares no values
  # and no provides, so there is nothing here that depends on the target. If the
  # Feature's contract changes, change all three in the same edit.
