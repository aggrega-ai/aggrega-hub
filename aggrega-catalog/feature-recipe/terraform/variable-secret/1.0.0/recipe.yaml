apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: variable-secret
  version: 1.0.0
  description: >
    Terraform realization of core/secret-value, for the author-supplied
    credential model. The material originates in the Aggregate or the Release —
    the developer authors it on the attachment, or an operator fulfils the
    parameter the attachment's origin reads — and this recipe delivers that
    value into the consuming node's inject pipe under the chosen key. Nothing is
    emitted from here; the delivery is the whole contribution, so the value
    lands only where a Terraform Recipe reads that key and renders it into its
    own configuration — as the value of an input variable, or directly as a
    resource argument. A Recipe that does not read the key receives nothing. The
    managed-database Recipes the standard library ships read none: they set the
    provider's managed-password directive, and a Manifest binds their credential
    slot to terraform/generated-secret instead.

    This is the peer of terraform/generated-secret, not its replacement, and the
    two serve opposite models. generated-secret is pure wiring for the model
    where the target engine provisions and rotates the credential itself: it
    binds the slot the component declares and carries no injectMapping, because
    there is no authored value to hand over. Here the material is authored, so
    there is a value to deliver and injectMapping is how it
    travels. Satisfying a credential slot and injecting a value are different
    acts — which is exactly why a pure-wiring recipe can bind a required slot
    while rendering nothing at all.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/secret-value:1.0.0

  # Evaluated before the consuming node renders: deliver the value into that
  # node's inject pipe under the key the attachment names. A Terraform Recipe
  # reads it as .context.inject.env.<key> and places it where its own
  # configuration needs it. The key is a delivery name, not the material; the
  # value is routed as an opaque string and is never interpreted here.
  injectMapping: |
    env:
      {{ .values.key }}: "{{ .values.origin }}"
