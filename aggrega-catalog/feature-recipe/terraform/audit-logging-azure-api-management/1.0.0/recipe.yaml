apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: audit-logging-azure-api-management
  version: 1.0.0
  description: >
    Binds core/audit-logging on core/gateway/azure-api-management's terraform
    Recipe to a halt naming why the gateway cannot keep it; a Release binds it
    in its Manifest. It emits no file and changes no log.

    Azure API Management logs each model request — its token counts, the
    model and, where turned on, the prompt and completion — to Azure Monitor,
    through a diagnostic setting on the instance into a Log Analytics
    workspace. That log keeps no cost, how long a row lasts is the workspace's
    retention rather than a setting of the gateway, and the setting belongs to
    the instance, which the API's Recipe reads and never configures. So the
    build halts on every attachment, naming the three. It halts on any
    component other than core/gateway/azure-api-management.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # Nothing is delivered and nothing is written, because nothing this
  # realization could write keeps the Feature's promises.
  #
  # What the gateway's request log holds. Microsoft's guide to logging model
  # requests has the instance send them to Azure Monitor through a diagnostic
  # setting whose category is the generative AI gateway's logs, into a Log
  # Analytics workspace: per request, the prompt, completion and total token
  # counts and the model, and the request and reply messages where an API's
  # logging settings turn them on. It keeps three of the Feature's promises
  # nowhere a realization reaches. A cost: no price is kept, and the Feature
  # takes none. A retention, or keeping every row while none is asked for: a
  # row lasts as long as the workspace keeps it, which is the workspace's own
  # setting. Turning the log on: the diagnostic setting is the instance's, and
  # the terraform Recipe reads the instance and never configures it.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/azure-api-management" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Azure API Management realization, which describes core/gateway/azure-api-management alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts. The retention asked for, or its absence, is
    # named in the message, since the Feature promises both.
    gateway_keeps_the_record_asked_for: >-
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $kept := ternary "with none deleted, since no retention is asked for" (printf "for %s days before the gateway deletes it" $days) (eq $days "") -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a row per model request naming which model answered, what it cost and who it is billed to, kept %s, but core/gateway/azure-api-management keeps its model-request log in Azure Monitor, where three of those promises are kept nowhere this realization reaches: what a request cost, since the log records token counts and the model and no price; the retention, since a row lasts as long as the Log Analytics workspace it lands in keeps it; and the log itself, which a diagnostic setting on the API Management instance turns on, and the instance is read and never configured by the terraform Recipe; remove the attachment, and turn on the instance's diagnostic setting for the generative AI gateway's logs outside the Release" .metadata.feature_instance .metadata.instance_id $kept) -}}
