apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: audit-logging-azure-api-management
  version: 1.0.0
  description: >
    Binds core/audit-logging on core/gateway/azure-api-management's terraform
    Recipe to a halt naming why the gateway cannot keep it; a Release binds it
    in its Manifest. It emits no file and changes no log.

    Azure API Management logs each model request — its token counts, the
    model and, where turned on, the prompt and completion — to Azure Monitor,
    through a diagnostic setting on the instance into a Log Analytics
    workspace. That setting belongs to the instance, which the API's Recipe
    reads and never configures, so the build halts on every attachment,
    naming it. The halt also names what the attachment asks for that the log
    cannot keep: a cost while require_cost is on, since the log keeps none,
    and a retention where retention_days is given, since how long a row lasts
    is the workspace's retention rather than a setting of the gateway. It
    halts on any component other than core/gateway/azure-api-management.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # Nothing is delivered and nothing is written, because nothing this
  # realization could write turns the gateway's request log on.
  #
  # What the gateway's request log holds. Microsoft's guide to logging model
  # requests has the instance send them to Azure Monitor through a diagnostic
  # setting whose category is the generative AI gateway's logs, into a Log
  # Analytics workspace: per request, the prompt, completion and total token
  # counts and the model, and the request and reply messages where an API's
  # logging settings turn them on. Three things an attachment asks for are
  # out of this realization's reach. Turning the log on, whatever the
  # attachment's values: the diagnostic setting is the instance's, and the
  # terraform Recipe reads the instance and never configures it. A cost,
  # while require_cost is on: no price is kept, and the Feature takes none. A
  # retention, where retention_days is given: a row lasts as long as the
  # workspace keeps it, which is the workspace's own setting.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/azure-api-management" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Azure API Management realization, which describes core/gateway/azure-api-management alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts, since the log is turned on outside this
    # Recipe's reach. The message says what the attachment asks for, read
    # from its values, and adds a reason for the cost while require_cost is
    # on and for the retention where retention_days is given. A strict value
    # is strict unless the attachment writes it false.
    gateway_keeps_the_record_asked_for: >-
      {{- $infra := default dict .infra -}}
      {{- $costOff := and (hasKey $infra "require_cost") (eq (toString (index $infra "require_cost")) "false") -}}
      {{- $callerOff := and (hasKey $infra "require_verified_caller") (eq (toString (index $infra "require_verified_caller")) "false") -}}
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $names := list "the model that answered" "the tokens the reply reports" -}}
      {{- if not $costOff -}}
      {{- $names = append $names "what it cost" -}}
      {{- end -}}
      {{- if not $callerOff -}}
      {{- $names = append $names "the caller the gateway verified" -}}
      {{- end -}}
      {{- $asks := printf "%s and %s" (join ", " (initial $names)) (last $names) -}}
      {{- if ne $days "" -}}
      {{- $asks = printf "%s, kept for %s days before the gateway deletes it" $asks $days -}}
      {{- end -}}
      {{- $why := list "the log is turned on by a diagnostic setting on the API Management instance, which sends it to Azure Monitor, and the instance is read and never configured by the terraform Recipe" -}}
      {{- if not $costOff -}}
      {{- $why = append $why "the log records token counts and the model and no price, so none of its rows says what a request cost" -}}
      {{- end -}}
      {{- if ne $days "" -}}
      {{- $why = append $why (printf "a row lasts as long as the Log Analytics workspace it lands in keeps it, which is the workspace's own setting rather than one the gateway takes, so the gateway deletes none after %s days" $days) -}}
      {{- end -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of each model request naming %s, but this realization cannot keep it: %s. Remove the attachment, and turn on the instance's diagnostic setting for the generative AI gateway's logs outside the Release" .metadata.feature_instance .metadata.instance_id $asks (join "; " $why)) -}}
