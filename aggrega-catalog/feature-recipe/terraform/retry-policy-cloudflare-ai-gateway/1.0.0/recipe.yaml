apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: retry-policy-cloudflare-ai-gateway
  version: 1.0.0
  description: >
    Realizes core/retry-policy on core/gateway/cloudflare-ai-gateway's
    terraform Recipe; a Release binds it in its Manifest. It writes the
    gateway's own retry count into the gateway's resource and emits no file.

    max_attempts counts every send, the first included, while the gateway's
    retry count names the sends after the first, from 1 to 5, so the number
    written is one fewer than the attempts asked for and max_attempts runs
    from 2 to 6; any other value is refused by name. The retries are the
    gateway's, and the delay between them and its backoff are left as the
    gateway's own settings have them.

    It halts when the attachment is carried by any component other than
    core/gateway/cloudflare-ai-gateway, and when the gateway carries a second
    retry policy. That the gateway retries as described is Cloudflare's
    documented behaviour and no build observes it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/retry-policy:1.0.0
  # executionScope omitted -> component: the checks and the delivery run once
  # per attached component.

  # Cloudflare names the gateway setting a retry count, "the maximum number of
  # retry attempts", and the provider's attribute "Maximum number of retry
  # attempts for failed requests (1-5)": the sends that follow the first. One
  # send alone is no retry at all, which the setting cannot express, so a
  # Release wanting no retries attaches no retry policy.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/cloudflare-ai-gateway" -}}
      {{- fail (printf "core/retry-policy attachment %q on %q is bound to the Cloudflare AI Gateway realization, which writes the retry count into the gateway resource core/gateway/cloudflare-ai-gateway renders on terraform; %s renders no such resource. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    attempts_are_ones_the_gateway_keeps: >-
      {{- if or (lt (int .values.max_attempts) 2) (gt (int .values.max_attempts) 6) -}}
      {{- fail (printf "core/retry-policy attachment %q on %q asks for max_attempts %v, but core/gateway/cloudflare-ai-gateway retries a failed request 1 to 5 times after the first send, so it keeps 2 to 6 sends in all; set max_attempts between 2 and 6, or attach no retry policy for a single send" .metadata.feature_instance .metadata.instance_id .values.max_attempts) -}}
      {{- end -}}
    # The gateway keeps one retry count, so a second attachment would leave
    # which one applies to the order the two are read in.
    one_retry_policy_per_gateway: >-
      {{- $count := 0 -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" $attachment.type)) "core/retry-policy" -}}{{- $count = add1 $count -}}{{- end -}}
      {{- end -}}
      {{- if gt $count 1 -}}
      {{- fail (printf "core/retry-policy attachment %q on %q is one of %d retry policies on this gateway, but core/gateway/cloudflare-ai-gateway keeps one retry count; attach one retry policy" .metadata.feature_instance .metadata.instance_id $count) -}}
      {{- end -}}

  # Delivered on this node's inject pipe, on the cloudflare_ai_gateway
  # mechanism the gateway's terraform Recipe reads, which writes it as the
  # resource's retry_max_attempts.
  injectMapping: |
    cloudflare_ai_gateway:
      retry_max_attempts: "{{ sub (int .values.max_attempts) 1 }}"
