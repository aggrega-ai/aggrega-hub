apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: random-password
  version: 1.0.0
  description: >
    Terraform realization of core/random-password through the random
    provider's random_password resource. The attachment renders a module of its
    own holding one random_password resource and one output, named values.key
    and marked sensitive, that carries the password out of the module;
    Terraform draws the password when the configuration is applied, so the
    rendered configuration carries no value. The value is kept in the Terraform
    plan and state, so the state is where it must be protected.

    The published provides are the attachment's module call and the output
    holding the password, which a consumer joins with a dot and wraps in an
    interpolation — for example ${module.db--password.value}. The reference
    resolves in the boundary's root configuration, so the consuming Recipe is a
    source: Recipe, whose valuesMapping becomes its module's arguments there; a
    Recipe that authors its own body cannot reach it, and for a host composed in
    from another Aggregate Terraform refuses the reference at plan time.

    The password holds at least one upper-case letter, one lower-case letter
    and one digit, and one punctuation character while values.symbols is on,
    as Secrets Manager draws for the cloudformation realization by default, so
    with values.symbols on a service requiring every character class accepts
    it. It is drawn once
    and kept in state; a change to values.length or values.symbols draws a new
    one. The name random-password is shared with the cloudformation
    realization, so a Manifest references this one as
    terraform/random-password:1.0.0; a bare random-password:1.0.0 matches more
    than one and resolves to none, and the pull halts on it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/random-password:1.0.0
  # The name random-password is shared with the cloudformation realization of
  # the same Feature, which is why a Manifest names this one provider-qualified.
  # The random provider needs nothing running beforehand, so this realization
  # reads no prerequisite affirmation.

  # The resource name, derived once: values.name honoured when supplied, the host
  # component and the attachment name composed otherwise, as
  # {instance_id}_{attachment_name}. A Terraform resource name admits letters,
  # digits, underscores and hyphens, so the dot a component inside an imported
  # module carries in its identity is folded to an underscore.
  # The name is local to the attachment's own module, so it cannot meet a name
  # its host or a neighbour declares.
  locals:
    resource_name: '{{ default (printf "%s_%s" .context.instance_id .attachment_name) .values.name | replace "." "_" }}'

  # The String Pipe: the compiler does not know this is a Terraform address. It
  # pipes the strings, and Terraform resolves the reference at plan time. The
  # module call is the attachment's own, named for the host and the attachment
  # joined on --, exactly as a component's producer Recipe names its own module
  # call from .context.instance_id; the output is the one this module declares
  # under values.key.
  #
  # That reference resolves in the boundary's root configuration, where every
  # module call is declared, so the consuming Recipe is a source: Recipe whose
  # valuesMapping becomes its own module's arguments there; a Recipe that
  # authors its own body cannot reach it. The host-and-attachment name is the
  # one the root configuration gives the module call when the host is declared
  # in the Release's own Aggregate; for a host composed in from another
  # Aggregate the two differ and Terraform refuses the reference at plan time,
  # naming it.
  provides:
    name: "module.{{ .context.instance_id }}--{{ .attachment_name }}"
    key: "{{ .values.key }}"

  # The output is marked sensitive so the module states what it carries. The
  # random provider already marks the password attribute sensitive and Terraform
  # carries that marking through the output to the consumer's input, which a plan
  # shows as a sensitive value; the declaration says the same thing where a reader
  # of this module looks for it.
  #
  # The attachment renders this module of its own, as every terraform
  # attachment does. The rendered configuration names the resource and carries
  # no value. The value is kept in the Terraform plan and state, as every
  # attribute a resource produces is. The password is drawn once and kept in
  # state; Terraform replaces it only when the resource's settings change or the
  # resource is replaced, which is why a change to values.length or
  # values.symbols draws a new one.
  #
  # The random provider draws upper-case letters, lower-case letters and digits
  # by default, and punctuation while special is true, but guarantees none of
  # them: each min_ setting defaults to 0. So the resource asks for one of each
  # class it draws from — min_special 1 while values.symbols is on, 0 while it
  # is off — which is what Secrets Manager gives the cloudformation realization
  # unasked, and a service requiring every class takes either. The provider
  # requires length to be at least the sum of the minimums, four at most, which
  # the Feature's eight-character floor already exceeds.
  artifacts:
    random-password.tf: |
      resource "random_password" "{{ .locals.resource_name }}" {
        length      = {{ .values.length }}
        special     = {{ .values.symbols }}
        min_upper   = 1
        min_lower   = 1
        min_numeric = 1
        min_special = {{ if .values.symbols }}1{{ else }}0{{ end }}
      }

      output "{{ .values.key }}" {
        value     = random_password.{{ .locals.resource_name }}.result
        sensitive = true
      }
