apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: backup-native
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/backup on terraform through the
    managed database service's own automated backup. It renders nothing: the
    Recipe realizing the attached database configures the backup from the
    attachment, because the backup is a setting of the database that Recipe
    writes, and a FeatureRecipe writes files of its own and cannot set one
    on its host. It binds on a database realized by terraform/postgres-rds,
    terraform/mysql-rds, terraform/mariadb-rds, terraform/mysql-rds-module,
    terraform/mariadb-rds-module, the -terraform-aws-modules Recipe of each
    engine, terraform/postgres-cloud-sql, terraform/mysql-cloud-sql or
    terraform/postgres-flexible-server, each of which keeps
    infra.retention_days, and a daily infra.schedule where its service
    takes a time, as the service's automated backups, and refuses what its
    service cannot keep.

    infra.point_in_time_recovery is the host's Recipe's to keep, each with
    its service's own default. Amazon RDS and the flexible server keep it
    with their backups, so left out or true is what they give and false
    halts by name. Cloud SQL keeps it on in this catalog, as high
    availability needs: false turns it off, and halts beside high
    availability, or beside read replicas on MySQL.

    The build halts, naming the attachment, on a host whose Recipe configures
    no backup of its own from core/backup, on infra.role_arn, which AWS
    Backup reads, on a store connection, infra.volume or
    infra.credentials_secret, since the service keeps its backups in its own
    storage, and on infra.run_as_user or infra.run_as_group, since it runs no
    job in a cluster.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/backup:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  #
  # The service's backup — how long the managed service keeps its automated
  # backups and the time of day it takes them — is a setting of the database
  # the host's Recipe writes, in the host's own module: arguments of an Amazon
  # RDS instance, inputs of the module realizing a Cloud SQL instance or an
  # Azure flexible server. This FeatureRecipe renders into no file the host's
  # database is written in, so
  # the host's Recipe reads the attachment among its component's attachments
  # and writes those arguments itself, and this realization exists so that the
  # attachment is bound: an unbound attachment halts the build. It therefore
  # emits nothing, and it publishes nothing.
  #
  # A Recipe that configures its service's backup from core/backup declares a
  # local named native_backup, naming that backup, such as Amazon RDS automated
  # backups; an attached FeatureRecipe reads its host's locals beneath its own.
  # A host whose Recipe declares none would configure nothing from the
  # attachment, so the build halts rather than binding an attachment nothing
  # acts on. A host's Recipe refuses a second attachment it would configure its
  # backup from, so the attachment bound here is the one the host configures.
  # cloudformation/backup-native carries the same check and refusals, worded
  # for its target; a change to them is made to both.
  assertions:
    host_configures_its_backup: >-
      {{- if not (toString (optional .locals "native_backup" "")) -}}
      {{- fail (printf "core/backup attachment %q on %q is bound to terraform/backup-native, which leaves the backup to the Recipe realizing %q, and that Recipe configures no backup of its service from core/backup: bind this attachment in the Manifest to a FeatureRecipe for a backup product that runs beside %q, or map %q to a Recipe that configures its service's backup from core/backup" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # infra.role_arn is the IAM role AWS Backup assumes. A managed service's
    # own automated backup assumes no role an attachment names, so the role
    # would reach no emitted byte; the build halts on it rather than ignoring
    # it, and points at the realization that reads it.
    no_role_arn: >-
      {{- with trim (toString (optional .infra "role_arn" "")) -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.role_arn to %q, and this attachment is bound to terraform/backup-native, the service's own automated backup, which assumes no role: remove infra.role_arn from the attachment, or bind it in the Manifest to terraform/backup-aws-backup, which has AWS Backup back the database up under that role" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # A managed service keeps its automated backups in its own storage and
    # reads no Secret, so a Secret named here would reach no emitted byte.
    no_credentials_secret: >-
      {{- with toString (optional .infra "credentials_secret" "") -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.credentials_secret to %q, and the service's own automated backup keeps each backup in the service's storage and reads no Secret: remove infra.credentials_secret from the attachment" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # infra.volume asks for the backups to be kept on a disk volume in a
    # cluster. The service keeps every automated backup in its own storage and
    # on no volume, so the volume would reach no emitted byte.
    volume_refused: >-
      {{- if optional .infra "volume" dict -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.volume, and this attachment is bound to terraform/backup-native: the service's own automated backup keeps backups only in the service's storage, never on a volume; remove infra.volume from the attachment, or bind a FeatureRecipe for a product that keeps backups on a volume" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.run_as_user and infra.run_as_group name the user and group a
    # backup product's own jobs run as. The service takes each backup itself
    # and runs nothing in a cluster, so neither would reach an emitted byte.
    run_as_refused: >-
      {{- range $k := list "run_as_user" "run_as_group" -}}
      {{- if ge (int64 (optional $.infra $k -1)) 0 -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.%s, the user or group a backup product's own jobs run as, and this attachment is bound to terraform/backup-native: the service takes each backup itself and runs no job an attachment can set a user for; remove infra.%s from the attachment" $.metadata.feature_instance $.metadata.instance_id $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The store. The service keeps every backup in its own storage, so a store
    # connection names a bucket nothing writes to, and the build halts on one,
    # naming it, rather than leaving it unread. A component carries every
    # connection of every core/backup attachment on it under the Feature's
    # socket, so any such connection on the host halts here.
    no_store_connection: >-
      {{- range $alias, $c := (optional (optional . "uses" dict) "store" dict) -}}
      {{- if eq (toString (optional $c "origin_feature" "")) "core/backup" -}}
      {{- fail (printf "core/backup attachment %q on %q: a core/backup attachment on %q wires the store connection %q, to %q, and the service's own automated backup keeps each backup in the service's storage and writes none to a bucket: remove the store connection from the attachment in the Release" $.metadata.feature_instance $.metadata.instance_id $.metadata.instance_id $alias (toString (optional $c "target" ""))) -}}
      {{- end -}}
      {{- end -}}
