apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: generated-secret
  version: 1.0.0
  description: >
    CloudFormation realization of core/generated-secret. Pure wiring: it
    declares nothing but the capability it binds to and the Feature it
    implements, and renders no resource of its own. The credential is
    provisioned and rotated by the target the CloudFormation Recipe manages — a
    managed database Recipe sets the provider's own managed-password directive —
    so there is no value to inject and no secret to emit. Its whole contribution
    is that the slot the component declares is bound, and bound by the form that
    says the engine owns the credential.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/generated-secret:1.0.0
