apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: manual-trigger
  version: 1.0.0
  description: >
    Realizes core/manual-trigger on core/compute/task's CloudFormation Recipe,
    cloudformation/task-ecs; a Release binds it in its Manifest. It emits
    nothing: the host's Recipe carries the change, deploying a task with no
    schedule as its task definition alone, without starting it. A scheduled
    task runs on its schedule as it does without the attachment.

    A run is started by hand by the operator with aws ecs run-task, giving
    the cluster, the task definition, named after the component, and the
    subnets, security groups and public IP setting the Release sets under the
    task's infra.overrides.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  # No source, valuesMapping, artifacts, injectMapping or assertions: an
  # unscheduled task deployed without starting is what cloudformation/task-ecs
  # renders when it finds this attachment among the component's own, so this
  # FeatureRecipe adds no fragment to the stack and nothing to the task's
  # delivery pipe. The
  # Feature applies to components of type task only, and
  # cloudformation/task-ecs is the catalog's one CloudFormation realization of
  # such a component.
  implements: core/manual-trigger:1.0.0
