apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: shared-config
  version: 1.0.0
  description: >
    CloudFormation realization of core/shared-config. Boundary-scope
    (executionScope: boundary): it renders once per boundary rather than once per
    component, emitting a single parameter that carries the settings every
    component in that boundary shares. The parameter is a fragment like any
    other, so it assembles into the same stack the boundary's components do — one
    parameter in the stack, named for the boundary, rather than one per component.

    At boundary scope the template reads the boundary's own resolved values; the
    per-component context is not available, because there is no single component
    the rendering belongs to. The resource's logical ID is derived from the
    boundary name with a suffix of its own, so it stays clear of every component
    resource in the stack it lands in.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/shared-config:1.0.0
  executionScope: boundary

  # A logical ID is unique within a CloudFormation template and admits only
  # letters and digits, so the boundary name's separators are read as word
  # boundaries and each word is capitalised: boundary app gives AppSharedConfig.
  artifacts:
    template.yaml: |
      {{- $configId := printf "%sSharedConfig" (capitalizedWords .boundary.boundary_name) }}
      Resources:
        {{ $configId }}:
          Type: AWS::SSM::Parameter
          Properties:
            Name: "/{{ .boundary.boundary_name }}/shared-config"
            Type: String
            Description: "Settings shared by every component in the {{ .boundary.boundary_name }} boundary"
            Value: "tier={{ .infra.tier }}"
