apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: random-password
  version: 1.0.0
  description: >
    CloudFormation realization of core/random-password: an
    AWS::SecretsManager::Secret that generates its own string. The fragment
    asks Secrets Manager to generate a password into a JSON secret string under
    values.key when the stack is created, so the rendered template names the
    secret and carries no value. The fragment assembles into the same stack as
    the component carrying the attachment. The secret's logical ID composes the
    host component and the attachment name — or values.name, where one is
    supplied — with every separator read as a word boundary and each word
    capitalised, since a logical ID admits only letters and digits. Where
    values.name is supplied it is also the secret's own name in Secrets Manager;
    otherwise CloudFormation names the secret. The published provides are a
    reference that resolves to the secret's ARN at deploy time, and the JSON key
    holding the password — the two parts a consumer's Secrets Manager dynamic
    reference names.

    The password is generated once, when the secret is created. A change to
    values.length or values.symbols changes the generation settings, and
    CloudFormation then creates a new secret version with a new password.
    Secrets Manager is part of the AWS account the stack deploys into, so this
    realization reads no prerequisite affirmation.

    The name random-password is shared with the terraform realization of the
    same Feature, so a Manifest references this one provider-qualified, as
    cloudformation/random-password:1.0.0. A bare random-password:1.0.0 matches
    more than one and resolves to none, and the pull halts on it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/random-password:1.0.0
  # executionScope omitted -> component: renders once per attached component.

  # The secret's logical ID, derived once. A logical ID is unique within a
  # CloudFormation template and admits only letters and digits, so every
  # separator is read as a word boundary and each word is capitalised: host db
  # carrying the attachment under password gives DbPassword. It composes the
  # host and the attachment name, as the catalog's other component-scope
  # CloudFormation FeatureRecipes do, so one Feature attached twice to one
  # component does not collide with itself; a supplied values.name replaces the
  # pair. It carries no suffix naming the kind, because the resource type below
  # already says what it is.
  locals:
    logical_id: '{{ capitalizedWords (default (printf "%s %s" .context.instance_id .attachment_name) .values.name) }}'

  # The secret's identity, published for a consumer: Ref on a Secrets Manager
  # secret resolves to its ARN at deploy time, and the compiler pipes the
  # reference through without resolving it.
  provides:
    name: "!Ref {{ .locals.logical_id }}"
    key: "{{ .values.key }}"

  artifacts:
    template.yaml: |
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::SecretsManager::Secret
          Properties:
            {{- if .values.name }}
            Name: "{{ .values.name }}"
            {{- end }}
            Description: "Password generated for {{ .context.instance_id }}, attachment {{ .attachment_name }}"
            GenerateSecretString:
              SecretStringTemplate: "{}"
              GenerateStringKey: "{{ .values.key }}"
              PasswordLength: {{ .values.length }}
              {{- if not .values.symbols }}
              ExcludePunctuation: true
              {{- end }}
