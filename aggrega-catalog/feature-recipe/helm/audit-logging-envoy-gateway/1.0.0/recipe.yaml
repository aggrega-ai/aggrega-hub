apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: audit-logging-envoy-gateway
  version: 1.0.0
  description: >
    Binds core/audit-logging on the gateway core/gateway/envoy-gateway to a
    halt naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file and changes no log.

    Envoy Gateway writes a line per request to its access log, but that log
    keeps three of the Feature's promises nowhere. What a request cost: the
    per-request cost Envoy AI Gateway can compute is a number with no unit,
    and the gateway keeps no prices, nor does the Feature take any. The
    verified caller it is billed to: nothing on this path verifies who the
    caller is. A retention: the access log writes each line out, to a file,
    a gRPC log service or an OpenTelemetry collector, and has no store and
    no retention setting, so the gateway keeps no row and deletes none. So
    the build halts on every attachment, naming the three. With nothing
    wired to the models socket the gateway serves no model request to
    record, and it halts saying so. It halts on any component other than
    core/gateway/envoy-gateway.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write keeps the three promises.
  #
  # What the gateway's request log holds. Envoy Gateway's data plane writes
  # one access log line per request, by default to its standard output. It
  # keeps none of three things the Feature promises. A cost: Envoy AI
  # Gateway's per-request cost is an expression the route declares over the
  # model, the backend, the route and the token counts, whose result is a
  # whole number with no unit; the gateway keeps no prices and the Feature
  # takes none, so no line can say what a request cost. A caller it is billed
  # to: nothing on this path verifies who the caller is, so a line could name
  # only a header the caller writes about itself. A retention: the access log
  # writes its lines out — to a file, a gRPC log service or an OpenTelemetry
  # collector — and has no store and no retention setting, so the gateway
  # keeps no row, deletes none after retention_days, and has no bookkeeping
  # database for the rows to land in. A realization writing that line under
  # this Feature's name would deliver less than the name promises.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/envoy-gateway and core/gateway/envoy-gateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/envoy-gateway" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Envoy Gateway realization, which describes core/gateway/envoy-gateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the three promises the
    # gateway's request log does not keep; with none, for the model requests
    # the gateway does not serve. The retention asked for, or its absence, is
    # named in the message, since the Feature promises both.
    gateway_keeps_the_record_asked_for: >-
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $kept := ternary "with none deleted, since no retention is asked for" (printf "for %s days before the gateway deletes it" $days) (eq $days "") -}}
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a row per model request naming which model answered, what it cost and who it is billed to, kept %s, but the request log core/gateway/envoy-gateway writes keeps three of those promises nowhere: what a request cost, since the per-request cost Envoy AI Gateway can compute is a number with no unit and neither the gateway nor this Feature holds a price; the verified caller it is billed to, since nothing on this path verifies who the caller is; and a retention, since its access log writes each line out, to a file, a gRPC log service or an OpenTelemetry collector, and has no store and no retention setting, so the gateway keeps no row and deletes none; remove the attachment" .metadata.feature_instance .metadata.instance_id $kept) -}}
      {{- else -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of the model requests the gateway serves, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no model request to record; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
