apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: audit-logging-envoy-gateway
  version: 1.0.0
  description: >
    Realizes core/audit-logging on the gateway core/gateway/envoy-gateway as
    the gateway's access log; a Release binds it in its Manifest. It emits no
    file of its own: while the attachment is present, the gateway's Recipe
    names the access log from the gateway and has its model route report the
    token counts.

    The record lands on the data plane's standard output, one JSON line per
    request, and the access log keeps nothing itself: how long a line lasts
    is up to whatever collects that output. A line carries the fields Envoy
    Gateway writes by default, the model the request named, the model that
    answered and the prompt, completion and total tokens the reply reports; a
    request the model did not answer carries no model that answered and no
    tokens. No field names a caller the gateway verified: the client's address
    and the headers it sends are written as they arrive, unchecked.

    So the build halts, naming each value it cannot keep: require_cost while
    on, since the per-request cost Envoy AI Gateway can compute has no unit
    and the gateway keeps no prices; require_verified_caller while on, since
    nothing on this path verifies who the caller is; and retention_days where
    given, since the access log has no store and no retention setting. An
    attachment at the defaults is told both strict values in one failure. It
    halts with nothing wired to the models socket, and on any component other
    than core/gateway/envoy-gateway.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: the gateway's Recipe writes the access log
  # while a core/audit-logging attachment is present, and this realization
  # checks what that log can keep.
  #
  # What the gateway's access log holds, read in Envoy Gateway's source at
  # v1.9.1 and Envoy AI Gateway's at v1.1.0, the versions the gateway's Recipe
  # and the controller's Recipe pin. One JSON line per request on the data
  # plane's standard output, carrying Envoy Gateway's default fields, the
  # model name the request carried, and what Envoy AI Gateway writes into the
  # request's metadata once a reply completes: the model the reply names, or
  # the model the gateway asked for where the reply names none, and the
  # prompt, completion and total token counts the reply reports, which the
  # gateway's Recipe has the model route declare. A reply that is not a
  # success, or that does not complete, gets no such metadata, so its line
  # names no model that answered and no tokens. Value by value:
  # - require_cost: Envoy AI Gateway's per-request cost is an expression the
  #   route declares over the model, the backend, the route and the token
  #   counts, whose result is a whole number with no unit; the gateway keeps
  #   no prices and the Feature takes none, so no line can say what a request
  #   cost. Refused while on; off, the line carries the token counts and no
  #   cost.
  # - require_verified_caller: nothing on this path verifies who the caller
  #   is. The default fields carry the client's address, the forwarded-for
  #   chain and the headers the caller writes about itself, none of them
  #   checked, so none names a verified caller. Refused while on; off, the
  #   line names no verified caller.
  # - retention_days: the access log writes each line out and has no store
  #   and no retention setting, so the gateway deletes no line after
  #   retention_days. Refused wherever given; with none, how long a line is
  #   kept is up to whatever collects the data plane's output.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/envoy-gateway and core/gateway/envoy-gateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/envoy-gateway" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Envoy Gateway realization, which describes core/gateway/envoy-gateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # With nothing wired to the models socket the gateway serves no model
    # request to record. With a model wired, each value the access log cannot
    # keep is refused by name, every one in a single failure, so an attachment
    # at the defaults is told both strict values at once. A strict value is
    # strict unless the attachment writes it false.
    gateway_keeps_the_record_asked_for: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of the model requests the gateway serves, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no model request to record; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
      {{- $infra := default dict .infra -}}
      {{- $costOff := and (hasKey $infra "require_cost") (eq (toString (index $infra "require_cost")) "false") -}}
      {{- $callerOff := and (hasKey $infra "require_verified_caller") (eq (toString (index $infra "require_verified_caller")) "false") -}}
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $refused := list -}}
      {{- $change := list -}}
      {{- if not $costOff -}}
      {{- $refused = append $refused "what each request cost, which require_cost asks for, since the per-request cost Envoy AI Gateway can compute is a whole number with no unit and neither the gateway nor this Feature holds a price" -}}
      {{- $change = append $change "set require_cost to false to accept a record carrying no cost" -}}
      {{- end -}}
      {{- if not $callerOff -}}
      {{- $refused = append $refused "the caller the gateway verified, which require_verified_caller asks for, since nothing on this path verifies who the caller is" -}}
      {{- $change = append $change "set require_verified_caller to false to accept a record naming no verified caller" -}}
      {{- end -}}
      {{- if ne $days "" -}}
      {{- $refused = append $refused (printf "a retention of %s days, which retention_days asks for, since the access log writes each line to the data plane's standard output and has no store and no retention setting, so the gateway deletes no line" $days) -}}
      {{- $change = append $change "remove retention_days" -}}
      {{- end -}}
      {{- if $refused -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for what the access log core/gateway/envoy-gateway writes cannot keep: %s. On this attachment in the Release, %s, or attach the Feature to a gateway that keeps it" .metadata.feature_instance .metadata.instance_id (join "; " $refused) (join ", and " $change)) -}}
      {{- end -}}
