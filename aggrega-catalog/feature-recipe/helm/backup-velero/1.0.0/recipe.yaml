apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: backup-velero
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/backup on Kubernetes through Velero:
    writes a Velero Schedule and the BackupStorageLocation it writes to, both
    in the namespace velero, where core/storage/velero runs. The schedule runs
    only where that component is deployed; nothing in the build checks it.

    Each backup holds the attached component's pods, selected by the
    selectors of the controllers its render emits, in the namespaces they are
    emitted into; the persistent volume claims and volumes those pods mount;
    and the data of the pods' volumes, which Velero's node agent copies into
    the bucket. It runs on infra.schedule, or daily at 03:00 in the time zone
    of Velero's server where that is unset, and each backup is kept for
    infra.retention_days days. Point-in-time recovery is off: a restore
    returns to a backup's moment, and infra.point_in_time_recovery: true
    halts.

    The location is the bucket the store connection points at, under a
    prefix of the schedule's own name, reached at the endpoint and region the
    store publishes. The build halts, naming the attachment, with no store
    connection, with a store publishing no S3 API, with a store in the cluster
    whose namespace is not declared, on a component carrying a second
    core/backup attachment, on a component whose pods are emitted into no
    namespace, and on a component whose render emits no workload Velero can
    select, naming the realization to bind instead. It refuses
    infra.credentials_secret, infra.role_arn, infra.volume, infra.run_as_user
    and infra.run_as_group by
    name: Velero signs with the key core/storage/velero holds, assumes no role
    an attachment names, keeps backups only in a bucket, and starts no job an
    attachment writes.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/backup:1.0.0
  # executionScope omitted -> component: renders once per attached component.

  # The store's render is read below, to find the namespace of a store running
  # in the cluster, so the attachment renders once every component in the
  # build has rendered rather than right after its own host.
  readsTargetRenderFacts: true

  assertions:
    # Velero signs its requests to every backup bucket with the one key its own
    # installation holds — the credentials file core/storage/velero's
    # cloud_credentials slot names, or the identity its pods' environment
    # offers — and its storage location names no Secret of its own. So a
    # Secret named on the attachment would reach no emitted byte; the build
    # halts on it, naming the attachment, rather than ignoring it.
    velero_credentials_secret: >-
      {{- with toString (optional .infra "credentials_secret" "") -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.credentials_secret to %q, and Velero signs its requests to every backup bucket with the key its own installation holds: the credentials file the cloud_credentials slot of core/storage/velero names, or the identity its pods' environment offers; remove infra.credentials_secret from the attachment and attach the key to that slot, or bind a FeatureRecipe for a product that names a Secret on each backup resource" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # infra.role_arn names the IAM role AWS Backup assumes. Velero assumes no
    # role an attachment names — it acts with what its own installation holds
    # — so the role would reach no emitted byte; the build halts on it rather
    # than ignoring it.
    role_arn_refused: >-
      {{- with toString (optional .infra "role_arn" "") -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.role_arn to %q, the IAM role AWS Backup assumes, and this attachment is bound to helm/backup-velero, which backs up through Velero: Velero acts with the key or the identity its own installation holds and assumes no role an attachment names; remove infra.role_arn from the attachment, or bind a FeatureRecipe realizing core/backup through AWS Backup" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # infra.point_in_time_recovery asks for restores to any moment of the
    # retention window, which needs a log of every change kept beside the
    # backups. Velero copies the component's resources and the data of its
    # pods' volumes on a schedule and keeps no such log, so a restore returns
    # to the moment of a backup: off is Velero's default and its only shape.
    # true would reach no emitted byte, so the build halts on it rather than
    # ignoring it; false, or the option left out, is what Velero does.
    point_in_time_recovery_refused: >-
      {{- if eq (toString (optional .infra "point_in_time_recovery" "")) "true" -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, and this attachment is bound to helm/backup-velero, which backs up through Velero: Velero copies the component's resources and volume data on a schedule and keeps no log of the changes between backups, so a restore returns to the moment of a backup; remove infra.point_in_time_recovery from the attachment, or bind a FeatureRecipe for a product that restores to any moment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.volume asks for the backups to be kept on a disk volume in the
    # cluster. Velero writes every backup to the object storage its backup
    # storage location names, which takes a bucket and nothing else, so the
    # volume would reach no emitted byte; the build halts on it rather than
    # ignoring it.
    volume_refused: >-
      {{- if optional .infra "volume" dict -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.volume, and this attachment is bound to helm/backup-velero, which backs up through Velero: Velero keeps backups only in a bucket, the object storage its backup storage location names; remove infra.volume from the attachment and wire its store connection to a bucket, or bind a FeatureRecipe for a product that keeps backups on a volume" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.run_as_user and infra.run_as_group name the user and group a
    # backup product's own jobs run as. Velero copies the pods' volumes from
    # the node agent its own installation runs, under the user that
    # installation gives it, and starts no job an attachment writes, so neither
    # would reach an emitted byte; the build halts on them rather than
    # ignoring them.
    run_as_refused: >-
      {{- range $k := list "run_as_user" "run_as_group" -}}
      {{- if ge (int64 (optional $.infra $k -1)) 0 -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.%s, the user or group a backup product's own jobs run as, and this attachment is bound to helm/backup-velero, which backs up through Velero: Velero copies the volumes from the node agent its own installation runs, under the user that installation gives it, and starts no job the attachment writes; remove infra.%s from the attachment, or bind a FeatureRecipe that runs its backup jobs as the user an attachment sets" $.metadata.feature_instance $.metadata.instance_id $k $k) -}}
      {{- end -}}
      {{- end -}}

  # One file holding the storage location and the schedule.
  #
  # Where they are written. Velero reads schedules and storage locations from
  # the namespace it runs in and no other, and core/storage/velero's chart
  # realization halts unless the Release places Velero in velero. An
  # attachment on a datastore cannot read where another component was placed,
  # so both resources are written into velero. Nothing in the build checks
  # that Velero is deployed: applied to a cluster without Velero's
  # custom-resource definitions, the two resources are refused by the cluster,
  # and with the definitions but no Velero server, they sit unread.
  #
  # Names. Both resources take one name: the namespace of the attached
  # component's pods, its rendered name and the attachment name, folded to
  # hyphens. The namespace is part of it because every Release on the cluster
  # writes into the one velero namespace, and two Releases can each hold a
  # component of the same name. Velero copies the schedule's name into a
  # label on every backup it starts, and a label value holds 63 characters at
  # most, so a longer name halts, naming it. Where the Recipe realizing the
  # component reports no rendered name, as one placing manifests alone does,
  # its identity stands in, and an identity that is not a name Kubernetes
  # takes halts, naming it.
  #
  # The store. The attachment's store connection is the one connection on the
  # store socket that a core/backup attachment declared. A component carries
  # every such connection of every core/backup attachment on it, under the
  # Feature's name rather than the attachment's, so one attachment cannot tell
  # its own from another's; a component carrying a second core/backup
  # attachment therefore halts while any of them wires a store. No store
  # connection halts, naming both ways to fix it — a store, or a volume under a
  # realization that keeps backups on one — and so do two on one attachment,
  # since a schedule writes to one location. A store publishing no S3 API —
  # protocol other than s3, or no endpoint, as core/storage/gcs publishes —
  # halts: Velero reaches the bucket through its plugin for the S3 API. The
  # plugin's own documentation lists Cloud Storage's S3 API among the services
  # with known issues and points to Velero's plugin for Google Cloud, which
  # this catalog does not install.
  #
  # The store's address. A store running in the cluster publishes the bare
  # name of its Service, which resolves only inside its own namespace, while
  # Velero runs in velero. Where the store's render emitted a Service of that
  # name, the address is qualified with the namespace the Service is emitted
  # into, and the location takes path-style addressing, which a server in the
  # cluster serves; a store whose Service is emitted into no namespace halts,
  # since its address cannot be qualified. A store outside the cluster — a
  # managed bucket — is reached at its endpoint as published, with the
  # bucket in the host name. The region is the store's own; a store
  # publishing none leaves Velero to ask the S3 API for it.
  #
  # What is backed up. The attached component's pods are selected by the
  # matchLabels of every Deployment, StatefulSet, DaemonSet and ReplicaSet its
  # render emits, one label selector per controller, joined by OR, in the
  # namespaces those controllers are emitted into; a Job or CronJob writing no
  # selector is left out, and a controller of the four writing none halts.
  # Velero adds each selected pod's persistent volume claims, and their
  # volumes, to the backup. The data on the pods' volumes is copied by
  # Velero's node agent, file-system backup being on for every volume; cloud
  # snapshots are off, because Velero's chart realization installs no
  # snapshot location. A component whose render emits no controller halts:
  # there is nothing to select. That is the shape of a component realized by a
  # Recipe that renders only a custom resource, whose pods a controller creates
  # in the cluster later — a CloudNativePG cluster, for one — so the halt names
  # the realization of core/backup through that controller to bind instead.
  # Every key read from the render context that a host may not carry is read
  # with a default, so no host shape reaches a template error rather than this
  # halt.
  #
  # When and how long. infra.schedule is Velero's own Schedule field, a cron
  # expression of five fields, which Velero parses as standard cron in its
  # server's time zone; a value Velero cannot parse is reported on the
  # Schedule's status rather than at build time. Unset, it is 0 3 * * *.
  # infra.retention_days becomes the backups' time to live, in hours, which
  # Velero keeps for any number of days.
  #
  # Every label key and value is written through toJson, so a value that reads
  # as a number or a boolean stays a string, and every map is written in key
  # order, so identical input renders identical bytes.
  artifacts:
    backup.yaml: |
      {{- $attName := .attachment_name }}
      {{- $att := .attachment_name | replace "_" "-" }}
      {{- $host := .context.instance_id }}

      {{- /* This attachment's store connection. */}}
      {{- $stores := list }}
      {{- range $alias, $edge := .context.uses }}
        {{- if and (eq (toString $edge.socket) "store") (eq (toString (default "" $edge.origin_feature)) "core/backup") }}
          {{- $stores = append $stores (dict "alias" $alias "edge" $edge) }}
        {{- end }}
      {{- end }}
      {{- $backups := list }}
      {{- range $n, $f := (default dict .features) }}
        {{- if eq (toString (get $f "type")) "core/backup" }}
          {{- $backups = append $backups (printf "%q" $n) }}
        {{- end }}
      {{- end }}
      {{- if and (gt (len $backups) 1) $stores }}
        {{- fail (printf "core/backup attachment %q on %q: %q carries %d core/backup attachments (%s), and each one's store connection reaches every one of them under the Feature's name, so this attachment cannot tell which store is its own; attach core/backup to %q once when it is backed up through Velero" $attName $host $host (len $backups) (join ", " $backups) $host) }}
      {{- end }}
      {{- if not $stores }}
        {{- fail (printf "core/backup attachment %q on %q has no store connection and sets no infra.volume, so it names nowhere for its backups to go, and Velero writes every backup to a bucket; wire the attachment's store connection to the bucket the backups go to, under uses.store on the attachment in the Release, or, to keep the backups on a volume, set infra.volume and bind a FeatureRecipe for a product that keeps backups there" $attName $host) }}
      {{- end }}
      {{- if gt (len $stores) 1 }}
        {{- $aliases := list }}
        {{- range $stores }}{{ $aliases = append $aliases (printf "%q" .alias) }}{{ end }}
        {{- fail (printf "core/backup attachment %q on %q wires %d store connections (%s), and a Velero schedule writes to one location; keep one" $attName $host (len $stores) (join ", " $aliases)) }}
      {{- end }}
      {{- $store := index $stores 0 }}
      {{- $edge := $store.edge }}
      {{- $sp := default dict $edge.provides }}
      {{- $bucket := toString (default "" (get $sp "bucket")) }}
      {{- $endpoint := toString (default "" (get $sp "endpoint")) }}
      {{- $storeHost := toString (default "" (get $sp "host")) }}
      {{- $region := toString (default "" (get $sp "region")) }}
      {{- if or (ne (toString (default "" (get $sp "protocol"))) "s3") (not $endpoint) (not $bucket) }}
        {{- fail (printf "core/backup attachment %q on %q: its store connection %q reaches %q, which publishes no bucket at an S3 API endpoint, and Velero reaches its bucket through its plugin for the S3 API; wire the store connection to a store published over the S3 API, such as core/storage/s3-object-store" $attName $host $store.alias $edge.target) }}
      {{- end }}

      {{- /* A store running in the cluster: qualify its Service name with the namespace it is emitted into. */}}
      {{- $inCluster := false }}
      {{- range (default (list) (get (default (dict) $edge.render_facts) "service_selectors")) }}
        {{- if and $storeHost (eq (toString (get . "name")) $storeHost) }}
          {{- $ns := toString (optional . "namespace" "") }}
          {{- if not $ns }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q runs in the cluster behind the Service %q, which is emitted into no namespace, and Velero, running in velero, reaches a Service in another namespace only by a name qualified with that namespace; set aggrega.ai/namespace for %q, or on its boundary, in the Release" $attName $host $edge.target $storeHost $edge.target) }}
          {{- end }}
          {{- if not (contains (printf "://%s" $storeHost) $endpoint) }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q publishes the endpoint %q, which does not name its Service %q, so the address Velero reaches cannot be qualified with the Service's namespace; wire the store connection to a store whose endpoint names the host it publishes" $attName $host $edge.target $endpoint $storeHost) }}
          {{- end }}
          {{- $endpoint = replace (printf "://%s" $storeHost) (printf "://%s.%s" $storeHost $ns) $endpoint }}
          {{- $inCluster = true }}
        {{- end }}
      {{- end }}

      {{- /* The attached component's pods: one selector per controller, and the namespaces they are emitted into. */}}
      {{- $facts := default dict (optional .context "render_facts" dict) }}
      {{- $selectors := list }}
      {{- $seenSel := dict }}
      {{- $namespaces := list }}
      {{- $seenNs := dict }}
      {{- range (default (list) (get $facts "controller_selectors")) }}
        {{- $kind := toString (get . "kind") }}
        {{- $wname := toString (optional . "name" "") }}
        {{- $ml := optional . "match_labels" dict }}
        {{- if not $ml }}
          {{- if or (eq $kind "Job") (eq $kind "CronJob") }}
            {{- continue }}
          {{- end }}
          {{- fail (printf "core/backup attachment %q on %q: the %s %q that %q renders writes no matchLabels selector, so the schedule has no labels to select its pods by; realize %q with a Recipe whose workloads write a controller selector" $attName $host $kind $wname $host $host) }}
        {{- end }}
        {{- $wns := toString (optional . "namespace" "") }}
        {{- if not $wns }}
          {{- fail (printf "core/backup attachment %q on %q: the %s %q that %q renders is emitted into no namespace, so the schedule cannot name where its pods run; set aggrega.ai/namespace for %q, or on its boundary, in the Release" $attName $host $kind $wname $host $host) }}
        {{- end }}
        {{- $key := toJson $ml }}
        {{- if not (hasKey $seenSel $key) }}
          {{- $_ := set $seenSel $key true }}
          {{- $selectors = append $selectors $ml }}
        {{- end }}
        {{- if not (hasKey $seenNs $wns) }}
          {{- $_ := set $seenNs $wns true }}
          {{- $namespaces = append $namespaces $wns }}
        {{- end }}
      {{- end }}
      {{- if not $selectors }}
        {{- fail (printf "core/backup attachment %q on %q: %q renders no Deployment, StatefulSet, DaemonSet or ReplicaSet whose pods a Velero schedule can select by their labels; where its pods are created later by a controller reconciling what it renders, such as a CloudNativePG cluster, Velero has nothing here to select, so bind the FeatureRecipe realizing core/backup through that controller for this attachment in the Manifest, such as helm/backup-cloudnative-pg, or realize %q with a Recipe whose own render emits its workloads" $attName $host $host $host) }}
      {{- end }}

      {{- /* The name: the host's rendered name, or its identity where its provider reports none and the identity is a name Kubernetes takes. */}}
      {{- $hostName := toString (optional .context "rendered_name" "") }}
      {{- if not $hostName }}
        {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $host) }}
          {{- fail (printf "core/backup attachment %q on %q: the Recipe realizing %q reports no rendered name for it, and its identity %q is not a name Kubernetes takes, so the schedule and its location cannot be named after it; realize %q with a Recipe that supplies a chart or a workload, or give the component a name of lowercase letters, digits and hyphens" $attName $host $host $host $host) }}
        {{- end }}
        {{- $hostName = $host }}
      {{- end }}
      {{- $name := printf "%s-%s-%s" (index $namespaces 0) $hostName $att }}
      {{- if gt (len $name) 63 }}
        {{- fail (printf "core/backup attachment %q on %q: the schedule's name, %q, is %d characters, and Velero writes it into a label on every backup, which holds 63 at most; give the attachment, the component or its namespace a shorter name" $attName $host $name (len $name)) }}
      {{- end }}
      {{- $schedule := default "0 3 * * *" (toString (optional .infra "schedule" "")) }}
      {{- $ttl := printf "%dh0m0s" (mul (int (optional .infra "retention_days" 7)) 24) -}}
      apiVersion: velero.io/v1
      kind: BackupStorageLocation
      metadata:
        name: {{ toJson $name }}
        namespace: velero
      spec:
        provider: velero.io/aws
        objectStorage:
          bucket: {{ toJson $bucket }}
          prefix: {{ toJson $name }}
        config:
          {{- if $region }}
          region: {{ toJson $region }}
          {{- end }}
          s3Url: {{ toJson $endpoint }}
          {{- if $inCluster }}
          s3ForcePathStyle: "true"
          {{- end }}
      ---
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: {{ toJson $name }}
        namespace: velero
      spec:
        schedule: {{ toJson $schedule }}
        template:
          includedNamespaces:
            {{- range $namespaces }}
            - {{ toJson . }}
            {{- end }}
          orLabelSelectors:
            {{- range $selectors }}
            - matchLabels:
                {{- range $k, $v := . }}
                {{ toJson $k }}: {{ toJson $v }}
                {{- end }}
            {{- end }}
          storageLocation: {{ toJson $name }}
          ttl: {{ toJson $ttl }}
          snapshotVolumes: false
          defaultVolumesToFsBackup: true
