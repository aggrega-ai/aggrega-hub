apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: caller-allowlist-higress
  version: 1.0.0
  description: >
    Binds core/caller-allowlist on the gateway core/gateway/higress to a halt
    naming why the gateway cannot honour it; a Release binds it in its Manifest.
    It emits no file and writes no network policy.

    The allowlist admits callers on the ports the attached component's
    containers declare, read from what its render emitted. Higress's gateway
    container declares only its two telemetry ports; it programs the port that
    serves model traffic through its own control plane rather than as a
    container port, and the chart declares that port on the container only in a
    local or kind layout, and then bound to a host port. So a policy built from
    the gateway's declared ports would admit no model traffic and refuse every
    request to the gateway, its declared callers included. The build halts on
    every attachment, naming why. It halts on any component other than
    core/gateway/higress.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/caller-allowlist:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because a network policy
  # built from the ports the gateway's container declares would not admit the
  # model traffic the gateway serves.
  #
  # Read in Higress's chart at v2.2.5, the release the gateway's Recipe pins: the
  # gateway container's ports are its two telemetry ports, 15020 and 15090, and
  # the data-plane port is declared on the container only under a local or kind
  # layout, there with a host port; in a cluster layout the listener is
  # programmed by the control plane and is not a container port. The generic
  # core/caller-allowlist realization admits callers on the ports a component's
  # containers declare, so on this gateway it would admit neither the model
  # traffic nor its callers.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/caller-allowlist attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: the gateway's container declares only its telemetry
    # ports, so a policy built from them would admit no model traffic and refuse
    # the gateway's callers along with everything else.
    gateway_admits_its_callers: >-
      {{- fail (printf "core/caller-allowlist attachment %q on %q would write a network policy admitting callers on the ports the gateway's containers declare, but core/gateway/higress declares only its telemetry ports on its gateway container and programs the port that serves model traffic through its control plane, so the policy would admit no model traffic and refuse every request to the gateway, its declared callers included; remove the attachment, and restrict who reaches the gateway through the cluster's own ingress or mesh controls instead" .metadata.feature_instance .metadata.instance_id) -}}
