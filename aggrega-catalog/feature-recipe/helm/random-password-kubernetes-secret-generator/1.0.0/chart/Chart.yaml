apiVersion: v2
name: random-password-kubernetes-secret-generator
description: >
  A one-template local Helm chart that renders a kubernetes-secret-generator
  StringSecret, which the controller reconciles into a Secret of the same name
  holding a generated password. It is the source: of the
  random-password-kubernetes-secret-generator FeatureRecipe — the FeatureRecipe
  renders this chart once per attachment, naming the StringSecret and its field
  from the attachment's published provides and sizing the password from the
  attachment's values.
version: 0.1.0
appVersion: "1.0.0"
