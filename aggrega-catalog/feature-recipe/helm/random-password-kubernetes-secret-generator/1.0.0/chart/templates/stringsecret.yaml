apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: {{ .Values.secretName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  forceRegenerate: false
  fields:
    - fieldName: {{ .Values.dataKey | quote }}
      encoding: {{ .Values.encoding | quote }}
      length: {{ .Values.length | quote }}
