apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: response-validation-higress
  version: 1.0.0
  description: >
    Binds core/response-validation on the gateway core/gateway/higress to a
    halt naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file and writes no check.

    Higress 2.2.5 checks a model's reply against a JSON Schema with its
    ai-json-resp plugin, but that check is weaker than the Feature's name.
    A reply that passes is answered with the bare JSON the plugin finds in
    the reply's message, not with the chat completion the route's OpenAI
    API returns. Any client skips the check by sending the request header
    X-HIGRESS-AI-JSON-RESP: true. And a schema nested more than six levels
    deep is not checked at all: the plugin then checks only that the reply
    holds JSON. So the build halts on every attachment, naming all three.
    With nothing wired to the models socket the gateway serves no model
    route whose replies could be checked, and it halts saying so. It halts
    on any component other than core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/response-validation:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway's
  # one reply check would change what every caller of the route receives and
  # could be switched off by any of them.
  #
  # What the gateway offers, read in Higress's source at v2.2.5, the release
  # the gateway's Recipe pins, from which its ai-json-resp module 2.0.3 is
  # built. The plugin sends the request to the model itself, cuts from the
  # reply's message text the JSON between its first opening brace and its
  # last closing one, and, when that JSON matches the schema, answers the
  # caller with HTTP 200 and that JSON as the whole body — no id, no choices,
  # no usage — with a header offering it as a file to download. A reply that
  # does not match makes it ask the model again, with a prompt of its own, up
  # to its retry count — three where the setting is absent or zero — and
  # then answers HTTP 500. It lets a request carrying the header X-HIGRESS-AI-JSON-RESP: true
  # through unchecked, the marker it puts on its own requests to the model,
  # honoured from any client. It counts the depth of the schema document,
  # one level for each nested mapping or list, and above six it checks only
  # that the reply holds a JSON object; the setting its reference names for
  # refusing such a schema is not in its code. A streamed reply cannot be
  # parsed as one JSON document, so it is answered with HTTP 500 carrying the
  # reply's text. The Feature promises a reply checked before it reaches the
  # caller, on a route still answering the API its model.aggrega.ai/api label
  # asserts, so none of this keeps it.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/response-validation attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the three ways the
    # gateway's reply check falls short of the Feature; with none, for the
    # model route the gateway does not serve.
    gateway_keeps_the_reply_check: >-
      {{- if optional .uses "models" dict -}}
      {{- $inverted := "" -}}
      {{- if eq (toString (optional .values "invert" false)) "true" -}}
      {{- $inverted = "; nor does it have a check refusing a reply that matches the schema, which invert asks for" -}}
      {{- end -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for each model reply to be checked against a JSON Schema before it reaches the caller, but core/gateway/higress cannot keep that check: Higress's reply check, its ai-json-resp plugin, answers a reply that passes with the bare JSON it finds in the reply's message rather than the chat completion the route's OpenAI API returns, so the route would stop answering the API its model.aggrega.ai/api label asserts; any client skips the check by sending the request header X-HIGRESS-AI-JSON-RESP: true; and a schema nested more than six levels deep is not checked at all, only whether the reply holds JSON%s. Remove the attachment" .metadata.feature_instance .metadata.instance_id $inverted) -}}
      {{- else -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for model replies to be checked, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be checked; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
