apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-deny-patterns-traefik-hub
  version: 1.0.0
  description: >
    Realizes core/prompt-deny-patterns on the gateway core/gateway/traefik-hub;
    a Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, traefik-hub-chart, reads the attachment and writes a Content Guard
    of Traefik Hub's AI gateway onto the route of each model wired to the
    gateway's models socket.

    The guard's regular-expression engine reads each request as a chat
    completion and refuses one that any of deny_patterns matches, with HTTP
    403 and a plain-text body, before the request is forwarded. Expressions
    use Go's RE2 syntax, which has no lookahead and no backreference; letter
    case counts unless an expression says otherwise, as (?i) does, and an
    expression matches anywhere in the text. Which fields of a chat request
    the guard reads is not stated in Traefik's reference. The build does not
    check an expression: one the gateway cannot compile keeps the guard from
    starting. The guard reads requests only, so a streamed reply passes as it
    streams.

    So it honours deny_patterns, and several attachments, each its own guard.
    It refuses allow_patterns by name, since the guard refuses on a match and
    admits nothing by one, and halts with nothing wired to the models socket
    and on any component other than core/gateway/traefik-hub. That the
    gateway enforces the guard is not observed by any build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-deny-patterns:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # How the gateway guards. The chart Recipe writes one Content Guard
  # middleware for the attachment, named after the gateway and the
  # attachment, and names it on every model route: after the Chat Completion
  # middleware, or, on a route a fallback chain walks, ahead of the services
  # the walk tries, where each model's Chat Completion middleware sits, so
  # one guard reads the request once whichever model answers it. Either way
  # it comes before the semantic cache, so a refused request is never
  # answered from it. The guard is its regular-expression engine, the
  # request read as a chat completion, and one request rule blocking on any
  # of the deny patterns.
  # A Content Guard rule blocks or masks what it matches and nothing more, so
  # no rule admits a request by pattern.
  #
  # No assertion can read the host component's labels, so what the gateway
  # is able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_writes_the_guard: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q is bound to the Traefik Hub realization, which only core/gateway/traefik-hub carries out: that component's chart Recipe writes the guard onto the routes it serves models on, and %s renders none for it, so nothing would be guarded. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # A Content Guard rule refuses on a match; none admits on one.
    allow_patterns_are_not_kept: >-
      {{- if optional .values "allow_patterns" list -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q sets allow_patterns, but core/gateway/traefik-hub's Content Guard refuses or masks the text a pattern matches and admits nothing by pattern, so a request none of them matches would be forwarded; remove allow_patterns and keep deny_patterns, or attach the Feature to a gateway whose guard also admits by pattern" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The guard is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to guard.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q needs a model route to guard, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no request the guard could refuse; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
