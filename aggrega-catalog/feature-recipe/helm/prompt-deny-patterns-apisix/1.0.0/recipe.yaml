apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-deny-patterns-apisix
  version: 1.0.0
  description: >
    Realizes core/prompt-deny-patterns on the gateway core/gateway/apisix; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, apisix-chart, reads the attachment and writes APISIX 3.18.0's
    ai-prompt-guard onto the chat route of each model wired to the gateway's
    models socket, and writes no completion route, since the guard reads no
    completion request.

    The guard reads the text of every message, whatever its role, across the
    whole conversation, joined into one string with a space between messages,
    so an expression can match across two of them; images and tool-call
    arguments are not read. Letter case counts unless an expression says
    otherwise, as (?i) does. With allow_patterns set, a request none of them
    matches is refused with HTTP 400, "Request doesn't match allow patterns";
    then a request any of deny_patterns matches is refused with HTTP 400,
    "Request contains prohibited content", which names no expression. A
    request the guard cannot read as a model request is refused with HTTP
    400 rather than forwarded unchecked, and one carrying no message text at
    all is answered with an empty HTTP 200 and not forwarded. The build does
    not check an expression: one APISIX cannot compile drops every route it
    is written on when the gateway reads the file, and those answer HTTP 404.

    So it honours deny_patterns and allow_patterns, and halts with nothing
    wired to the models socket, on a second such attachment, and on any
    component other than core/gateway/apisix.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-deny-patterns:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # How the gateway guards. The chart Recipe writes ai-prompt-guard onto each
  # chat route with match_all_roles and match_all_conversation_history on, the
  # widest reading the plugin offers: every message of every role, the system
  # prompt and earlier turns included, its text joined into one string. The
  # allow list is checked first, then the deny list, and each expression is
  # matched with PCRE as written, without letter case folded. fail_mode error
  # refuses a request whose body the guard cannot read as a model request,
  # which the plugin would otherwise forward unchecked. A completion request
  # is one it cannot read, so while the guard is attached each connection gets
  # its chat route only, rather than a route serving traffic the guard never
  # reads.
  #
  # The workload Recipe renders no route and halts on the attachment itself,
  # ahead of these checks. No assertion can read the host component's labels,
  # so what the gateway is able to do is stated in the messages, and the check
  # of the host's type first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/apisix and core/gateway/apisix:1.0.0 are the same host.
    component_writes_the_guard: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/apisix" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q is bound to the APISIX realization, which only core/gateway/apisix carries out: that component's chart Recipe writes the guard onto the routes it serves models on, and %s renders none for it, so nothing would be guarded. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The guard is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to guard.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q needs a model route to guard, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no request the guard could refuse; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # APISIX carries one ai-prompt-guard on a route, so a second attachment
    # could not hold beside the first.
    one_guard_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-deny-patterns" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/prompt-deny-patterns is attached to %q more than once (%s), but core/gateway/apisix carries one prompt guard on a route, so the attachments cannot each hold; keep one attachment, with every expression in its lists" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
