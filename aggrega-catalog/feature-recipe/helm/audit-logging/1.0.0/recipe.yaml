apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: audit-logging
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/audit-logging on an AI gateway whose
    realization renders its routing table as a configuration body. The control it
    turns on is a setting the running proxy reads out of that body rather than a
    resource of its own, so this recipe emits no file: it writes the setting into
    the configuration the attached gateway already renders, and every other byte
    of that body is left as the gateway's own Recipe authored it. Attaching it
    states that the gateway keeps a row per request it served — which model
    answered, what it cost, and the caller it is billed to. Where retention_days
    is given, it also states how long such a row is kept before the gateway
    deletes it, and the gateway runs no deletion at all unless a retention is
    asked for. The rows land in the gateway's own bookkeeping database, so
    where none is configured the gateway has nowhere to write them and this
    attachment changes nothing it serves.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  pipeline:
    - id: write_request_record_settings
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: general_settings
        settings:
          disable_spend_logs: false
        {{- if ne (printf "%v" .values.retention_days) "" }}
          maximum_spend_logs_retention_period: "{{ .values.retention_days }}d"
        {{- end }}
