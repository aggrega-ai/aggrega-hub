apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: backup-cloudnative-pg
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/backup on a PostgreSQL database
    realized by helm/postgres-cloudnative-pg, through the Barman Cloud plugin
    core/storage/barman-cloud-plugin installs: writes the plugin's
    ObjectStore and a CloudNativePG ScheduledBackup beside the database's
    Cluster, which names the plugin as its write-ahead-log archiver. The
    backups run only where the plugin is deployed; nothing in the build
    checks it.

    The Cluster archives its write-ahead log into the bucket the store
    connection points at, continuously, and the schedule takes a base backup
    there on infra.schedule, or daily at 03:00 where that is unset. Backups
    and log older than infra.retention_days days are deleted, except the
    newest base backup taken before that window, which a restore into it
    needs. That archive is CloudNativePG's point-in-time recovery, on here,
    so infra.point_in_time_recovery: false halts by name. The plugin signs its requests with the key pair in the Secret
    infra.credentials_secret names or, unset, in one named after the
    ObjectStore, which the cluster must hold in the database's namespace.

    The build halts, naming the attachment, on a database realized by another
    Recipe, with no store connection, with a store publishing no S3 API, with
    a store in the cluster whose namespace is not declared, on a database
    carrying a second core/backup attachment, on infra.role_arn, the role
    AWS Backup assumes, which the plugin has no use for, on infra.volume,
    since the plugin keeps backups only in a bucket, and on infra.run_as_user
    and infra.run_as_group, since it runs inside the database's own pods.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/backup:1.0.0
  # executionScope omitted -> component: renders once per attached component.

  # The store's render is read below, to find the namespace of a store running
  # in the cluster, so the attachment renders once every component in the
  # build has rendered rather than right after its own host.
  readsTargetRenderFacts: true

  # Names. The ObjectStore and the ScheduledBackup take one name: the host's
  # identity and the attachment name, folded to hyphens. A Cluster's own
  # realization emits only the Cluster, so the helm provider reports no
  # rendered name for it, and the host part is the identity, which is the name
  # helm/postgres-cloudnative-pg gives the Cluster.
  locals:
    name: '{{ .context.instance_id }}-{{ .attachment_name | replace "_" "-" }}'

  # The handshake with the database's own Recipe. That Recipe reads this
  # attachment's provides, and writes the plugin entry naming this ObjectStore
  # into the Cluster only where object_store is published, so an attachment a
  # different backup product realizes leaves the Cluster as it is.
  provides:
    object_store: "{{ .locals.name }}"

  assertions:
    # The ScheduledBackup reaches the database only through the plugin entry
    # the database's own Recipe writes into its Cluster. That Recipe declares
    # the plugin's name as its local barman_cloud_plugin, which this assertion
    # reads — a FeatureRecipe's assertions read the locals and provides of the
    # component the attachment is on. Any other realization declares no such
    # local: the synthesized Recipe runs its own server and emits no Cluster,
    # and a Cluster another Recipe emits would carry no plugin entry, so the
    # schedule would back up nothing and the log would not be archived.
    cloudnative_pg_cluster: >-
      {{- if ne (toString (optional .locals "barman_cloud_plugin" "")) "barman-cloud.cloudnative-pg.io" -}}
      {{- fail (printf "core/backup attachment %q on %q is bound to helm/backup-cloudnative-pg, which backs up a core/datastore/postgres realized by helm/postgres-cloudnative-pg, through the Barman Cloud plugin that Recipe names as its Cluster's write-ahead-log archiver; %q, a %s, is realized by a Recipe that writes no such entry, so the schedule would back nothing up; bind the attachment to a backup FeatureRecipe for the realization %q has, or, for a core/datastore/postgres, select helm/postgres-cloudnative-pg for it in the Manifest" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.component .metadata.instance_id) -}}
      {{- end -}}
    # infra.role_arn names the IAM role AWS Backup assumes. The Barman Cloud
    # plugin signs with the key pair in the Secret the ObjectStore names and
    # assumes no role an attachment names, so the role would reach no emitted
    # byte; the build halts on it rather than ignoring it.
    role_arn_refused: >-
      {{- with toString (optional .infra "role_arn" "") -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.role_arn to %q, the IAM role AWS Backup assumes, and this attachment is bound to helm/backup-cloudnative-pg, which backs up through CloudNativePG's Barman Cloud plugin: the plugin signs with the key pair in the Secret its ObjectStore names and assumes no role an attachment names; remove infra.role_arn from the attachment, or bind a FeatureRecipe realizing core/backup through AWS Backup" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # infra.point_in_time_recovery. CloudNativePG's point-in-time recovery is
    # its write-ahead-log archive: the Cluster helm/postgres-cloudnative-pg
    # writes names the Barman Cloud plugin as its archiver, so the log is
    # shipped to the store continuously and a restore can reach any moment
    # back to the oldest base backup kept. That is this realization's default
    # and its only shape: the plugin entry is the database's Recipe's, and a
    # base backup taken while the database runs rests on the archive, so
    # false would reach no emitted byte; the build halts on it rather than
    # ignoring it. Left out or true, the option is what the archive gives.
    point_in_time_recovery_kept: >-
      {{- if eq (toString (optional .infra "point_in_time_recovery" "")) "false" -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and this attachment is bound to helm/backup-cloudnative-pg, which backs up through CloudNativePG's Barman Cloud plugin: the Cluster archives its write-ahead log to the store continuously, which lets a restore reach any moment of the retention and which every base backup taken while the database runs rests on, so it is not turned off here; remove infra.point_in_time_recovery from the attachment, or set it to true" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.volume asks for the backups to be kept on a disk volume in the
    # cluster. The Barman Cloud plugin writes the write-ahead log and every
    # base backup to an object store, and CloudNativePG's other method, a
    # volume snapshot, is a snapshot of the database's own disk rather than a
    # copy kept on another volume, so the volume would reach no emitted byte;
    # the build halts on it rather than ignoring it.
    volume_refused: >-
      {{- if optional .infra "volume" dict -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.volume, and this attachment is bound to helm/backup-cloudnative-pg, which backs up through CloudNativePG's Barman Cloud plugin: the plugin keeps backups only in a bucket, and a CloudNativePG volume snapshot is a snapshot of the database's own disk rather than a copy kept on another volume; remove infra.volume from the attachment and wire its store connection to a bucket, or bind a FeatureRecipe for a product that keeps backups on a volume" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.run_as_user and infra.run_as_group name the user and group a
    # backup product's own jobs run as. The Barman Cloud plugin backs up from
    # inside the database's own pods, which run as the user the Cluster gives
    # them, and starts no job an attachment writes, so neither would reach an
    # emitted byte; the build halts on them rather than ignoring them.
    run_as_refused: >-
      {{- range $k := list "run_as_user" "run_as_group" -}}
      {{- if ge (int64 (optional $.infra $k -1)) 0 -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.%s, the user or group a backup product's own jobs run as, and this attachment is bound to helm/backup-cloudnative-pg, which backs up through CloudNativePG's Barman Cloud plugin: the plugin runs inside the database's own pods, as the user the Cluster gives them, and starts no job the attachment writes; remove infra.%s from the attachment, or bind a FeatureRecipe that runs its backup jobs as the user an attachment sets" $.metadata.feature_instance $.metadata.instance_id $k $k) -}}
      {{- end -}}
      {{- end -}}

  # One file holding the object store and the schedule.
  #
  # Where they are written. An ObjectStore is read from the namespace of the
  # Cluster naming it, and a ScheduledBackup backs up a Cluster of its own
  # namespace, so both are written where the database's Recipe writes the
  # Cluster: the namespace the Release, or else the Aggregate, declares for the component through the
  # aggrega.ai/namespace annotation, or no namespace where none is declared,
  # leaving all three to the applying tool.
  #
  # The store. The attachment's store connection is the one connection on the
  # store socket that a core/backup attachment declared. A component carries
  # every such connection of every core/backup attachment on it, under the
  # Feature's name rather than the attachment's, so one attachment cannot tell
  # its own from another's; a component carrying a second core/backup
  # attachment therefore halts while any of them wires a store — and a Cluster
  # archives its log through one plugin entry. No store connection halts,
  # naming both ways to fix it — a store, or a volume under a realization that
  # keeps backups on one — and so do two on one attachment. A store publishing
  # no S3 API — protocol other than s3, or no endpoint, as core/storage/gcs
  # publishes — halts: this realization writes the plugin's S3 configuration,
  # and its Cloud Storage one would need a Google credential the store
  # connection does not carry.
  #
  # The store's address. A store running in the cluster publishes the bare
  # name of its Service, which resolves only inside its own namespace, while
  # the plugin runs beside the database. Where the store's render emitted a
  # Service of that name, the address is qualified with the namespace the
  # Service is emitted into; a store whose Service is emitted into no namespace
  # halts, since its address cannot be qualified. A store outside the cluster —
  # a managed bucket — is reached at its endpoint as published. The region the
  # store publishes is handed to the plugin as AWS_DEFAULT_REGION, which the
  # S3 client it runs reads to sign its requests; a store publishing none
  # leaves the client to its own default.
  #
  # The path. The backups are written under s3://<bucket>/<namespace>/<name>/,
  # or s3://<bucket>/<name>/ where no namespace is declared, and the plugin adds
  # the Cluster's name beneath it, so two databases, or two Releases sharing a
  # bucket, never write into one another's archive.
  #
  # The key. The store connection carries no credential: a consumer of the
  # store holds the key it presents. The plugin reads the key pair from the
  # Secret infra.credentials_secret names or, where it is unset, from one named
  # after the ObjectStore, in the database's namespace, under ACCESS_KEY_ID and
  # ACCESS_SECRET_KEY, the keys its own documentation uses. A Secret is read
  # from the namespace of the ObjectStore naming it, so it must be there and
  # not in the store's. The Secret is the cluster's to hold; nothing in the
  # build checks it.
  #
  # When. infra.schedule is a five-field cron expression; a ScheduledBackup
  # takes six, the first being seconds, so the expression is written with 0
  # before it. Unset, it is 0 0 3 * * *, daily at 03:00. The CloudNativePG
  # controller reads it in its own time zone, and reports a value it cannot
  # parse on the ScheduledBackup's status rather than at build time. The
  # backup is taken by the plugin (method plugin), never by the operator's
  # own object-store backup, which CloudNativePG deprecated in 1.26 in favour
  # of the plugin.
  #
  # How long. infra.retention_days becomes the ObjectStore's retention policy
  # in days, a recovery window: the plugin keeps every base backup and every
  # log segment needed to restore to any moment of the last N days, which is
  # the newest base backup older than the window and everything after it, and
  # deletes the rest once the next backup completes.
  #
  # Every value is written through toJson, so a value that reads as a number
  # or a boolean stays a string, and identical input renders identical bytes.
  artifacts:
    backup.yaml: |
      {{- $attName := .attachment_name }}
      {{- $host := .context.instance_id }}
      {{- $name := .locals.name }}

      {{- /* This attachment's store connection. */}}
      {{- $stores := list }}
      {{- range $alias, $edge := .context.uses }}
        {{- if and (eq (toString $edge.socket) "store") (eq (toString (default "" $edge.origin_feature)) "core/backup") }}
          {{- $stores = append $stores (dict "alias" $alias "edge" $edge) }}
        {{- end }}
      {{- end }}
      {{- $backups := list }}
      {{- range $n, $f := (default dict .features) }}
        {{- if eq (toString (get $f "type")) "core/backup" }}
          {{- $backups = append $backups (printf "%q" $n) }}
        {{- end }}
      {{- end }}
      {{- if and (gt (len $backups) 1) $stores }}
        {{- fail (printf "core/backup attachment %q on %q: %q carries %d core/backup attachments (%s), and each one's store connection reaches every one of them under the Feature's name, so this attachment cannot tell which store is its own, and a CloudNativePG Cluster archives its write-ahead log through one plugin entry; attach core/backup to %q once when it is backed up through the Barman Cloud plugin" $attName $host $host (len $backups) (join ", " $backups) $host) }}
      {{- end }}
      {{- if not $stores }}
        {{- fail (printf "core/backup attachment %q on %q has no store connection and sets no infra.volume, so it names nowhere for its backups to go, and the Barman Cloud plugin writes the write-ahead log and every base backup to a bucket; wire the attachment's store connection to the bucket the backups go to, under uses.store on the attachment in the Release, or, to keep the backups on a volume, set infra.volume and bind a FeatureRecipe for a product that keeps backups there" $attName $host) }}
      {{- end }}
      {{- if gt (len $stores) 1 }}
        {{- $aliases := list }}
        {{- range $stores }}{{ $aliases = append $aliases (printf "%q" .alias) }}{{ end }}
        {{- fail (printf "core/backup attachment %q on %q wires %d store connections (%s), and the Barman Cloud plugin writes a Cluster's backups to one object store; keep one" $attName $host (len $stores) (join ", " $aliases)) }}
      {{- end }}
      {{- $store := index $stores 0 }}
      {{- $edge := $store.edge }}
      {{- $sp := default dict $edge.provides }}
      {{- $bucket := toString (default "" (get $sp "bucket")) }}
      {{- $endpoint := toString (default "" (get $sp "endpoint")) }}
      {{- $storeHost := toString (default "" (get $sp "host")) }}
      {{- $region := toString (default "" (get $sp "region")) }}
      {{- if or (ne (toString (default "" (get $sp "protocol"))) "s3") (not $endpoint) (not $bucket) }}
        {{- fail (printf "core/backup attachment %q on %q: its store connection %q reaches %q, which publishes no bucket at an S3 API endpoint, and this realization writes the Barman Cloud plugin's configuration for the S3 API; wire the store connection to a store published over the S3 API, such as core/storage/s3-object-store" $attName $host $store.alias $edge.target) }}
      {{- end }}

      {{- /* A store running in the cluster: qualify its Service name with the namespace it is emitted into. */}}
      {{- range (default (list) (get (default (dict) $edge.render_facts) "service_selectors")) }}
        {{- if and $storeHost (eq (toString (get . "name")) $storeHost) }}
          {{- $sns := toString (optional . "namespace" "") }}
          {{- if not $sns }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q runs in the cluster behind the Service %q, which is emitted into no namespace, and the Barman Cloud plugin, running beside the database, reaches a Service in another namespace only by a name qualified with that namespace; set aggrega.ai/namespace for %q, or on its boundary, in the Release" $attName $host $edge.target $storeHost $edge.target) }}
          {{- end }}
          {{- if not (contains (printf "://%s" $storeHost) $endpoint) }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q publishes the endpoint %q, which does not name its Service %q, so the address the plugin reaches cannot be qualified with the Service's namespace; wire the store connection to a store whose endpoint names the host it publishes" $attName $host $edge.target $endpoint $storeHost) }}
          {{- end }}
          {{- $endpoint = replace (printf "://%s" $storeHost) (printf "://%s.%s" $storeHost $sns) $endpoint }}
        {{- end }}
      {{- end }}

      {{- $ns := "" }}
      {{- if .context.annotations }}
        {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        {{- if $raw }}{{- $ns = $raw }}{{- end }}
      {{- end }}
      {{- $path := printf "s3://%s/%s" $bucket $name }}
      {{- if $ns }}{{- $path = printf "s3://%s/%s/%s" $bucket $ns $name }}{{- end }}
      {{- $schedule := trim (toString (optional .infra "schedule" "")) }}
      {{- $schedule = printf "0 %s" (default "0 3 * * *" $schedule) }}
      {{- $retention := printf "%dd" (int .infra.retention_days) }}
      {{- $secret := default $name (toString (optional .infra "credentials_secret" "")) -}}
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: {{ toJson $name }}
        {{- with $ns }}
        namespace: {{ toJson . }}
        {{- end }}
      spec:
        configuration:
          destinationPath: {{ toJson $path }}
          endpointURL: {{ toJson $endpoint }}
          s3Credentials:
            accessKeyId:
              name: {{ toJson $secret }}
              key: "ACCESS_KEY_ID"
            secretAccessKey:
              name: {{ toJson $secret }}
              key: "ACCESS_SECRET_KEY"
        retentionPolicy: {{ toJson $retention }}
        {{- if $region }}
        instanceSidecarConfiguration:
          env:
            - name: "AWS_DEFAULT_REGION"
              value: {{ toJson $region }}
        {{- end }}
      ---
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: {{ toJson $name }}
        {{- with $ns }}
        namespace: {{ toJson . }}
        {{- end }}
      spec:
        schedule: {{ toJson $schedule }}
        cluster:
          name: {{ toJson $host }}
        method: "plugin"
        pluginConfiguration:
          name: "barman-cloud.cloudnative-pg.io"
