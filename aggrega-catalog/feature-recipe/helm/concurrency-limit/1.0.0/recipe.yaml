apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: concurrency-limit
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/concurrency-limit on the AI gateway
    core/gateway/litellm. It writes nothing and emits no file: it halts the
    build whenever it is attached, naming the attachment and the gateway,
    because the LiteLLM release that gateway pins enforces no cap on the
    requests it carries at once across everything it serves from its
    configuration, so a max_in_flight written there would limit nothing.

    Leave core/concurrency-limit unattached on this gateway, or bind the
    attachment in the Manifest to a realization for a gateway that enforces
    such a cap.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/concurrency-limit:1.0.0
  # executionScope omitted -> component: the check runs once per attached
  # component.
  #
  # Why this realization halts rather than writing the cap. The gateway's
  # configuration takes a cap on what it carries at once across everything it
  # serves, global_max_parallel_requests under general_settings, and the
  # gateway starts with it set; but the release the gateway pins reads that
  # setting only in an older request limiter it loads when its own
  # environment asks for one, and by default it loads a limiter that reads no
  # such cap. So under a cap of one, three requests sent together are all
  # served at once. A Release attaching the cap would believe the gateway's
  # traffic bounded when it is not, so this recipe refuses the attachment by
  # name instead of writing a setting the gateway does not enforce.
  assertions:
    gateway_enforces_the_cap: >-
      {{- fail (printf "core/concurrency-limit attachment %q on %q is bound to the realization for core/gateway/litellm, but the LiteLLM release that gateway pins enforces no cap on the requests it carries at once across everything it serves from its configuration, so a max_in_flight of %v written there would limit nothing. Leave core/concurrency-limit unattached on %q, or bind this attachment in the Manifest to a realization for a gateway that enforces such a cap" .metadata.feature_instance .metadata.instance_id .values.max_in_flight .metadata.instance_id) -}}
