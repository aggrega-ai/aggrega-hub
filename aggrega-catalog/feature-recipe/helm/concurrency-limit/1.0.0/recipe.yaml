apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: concurrency-limit
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/concurrency-limit on an AI gateway
    whose realization renders its routing table as a configuration body. The
    control it turns on is a setting the running proxy reads out of that body
    rather than a resource of its own, so this recipe emits no file: it writes
    the setting into the configuration the attached gateway already renders, and
    every other byte of that body is left as the gateway's own Recipe authored
    it. maxInFlight caps how many requests the gateway will carry at once across
    everything it serves, counted per running proxy rather than per upstream
    target, so a deployment running several replicas admits that many in flight
    on each of them.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/concurrency-limit:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  pipeline:
    - id: write_inflight_cap
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: general_settings
        settings:
          global_max_parallel_requests: {{ .values.maxInFlight }}
