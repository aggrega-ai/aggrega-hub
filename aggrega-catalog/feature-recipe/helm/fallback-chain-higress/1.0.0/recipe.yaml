apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: fallback-chain-higress
  version: 1.0.0
  description: >
    Binds core/fallback-chain on the gateway core/gateway/higress to a halt
    naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no fallback.

    Higress 2.2.5 sends a failed request on at most once, to one other
    destination: a route's default backend, a Kubernetes Service, on the
    reply statuses the route lists, or the one fallback route its console
    writes for an AI route, whose target is picked once — at random among
    several, or the single one an ordered fallback allows. Its AI proxy's
    failover moves between the keys of one connection, not between models.
    So no request is sent on along a chain of models until one answers, and
    a fallback's own entry is never followed; the build halts on every
    attachment, naming why. With nothing wired to the models socket the
    gateway serves no model route, and it halts saying so. It halts on any
    component other than core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/fallback-chain:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write sends a failed request on to another model in
  # turn.
  #
  # How the gateway falls back, read in Higress's source at v2.2.5, the
  # release the gateway's Recipe pins, and in its console's source at the
  # same release. An Ingress's default backend, set by annotation, is a
  # Kubernetes Service the controller looks up by name; a reply carrying one
  # of the statuses the route lists is redirected inside the gateway to that
  # one Service, at most once. The console's AI route writes a second route
  # for its fallback and an Envoy filter redirecting a failed request to it;
  # that route's target is chosen once per request, at random among the
  # fallback targets, or, for an ordered fallback, the first target, the one
  # the console allows there. The models this gateway serves are entries of
  # its own registry rather than Kubernetes Services, and none of these
  # walks a list of models, each tried in turn until one answers, or follows
  # a fallback's own entry. The AI proxy's failover takes a key that keeps
  # failing out of the keys one connection holds, and its retry sends a
  # request again only with another of those keys; neither moves a request
  # to another model.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the walk the gateway's
    # fallback does not make; with none, for the model route the gateway does
    # not serve.
    gateway_walks_a_failed_request_on: >-
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q asks for a request whose model fails to be sent on to the models its chain names, in turn, until one answers, but core/gateway/higress sends a failed request on at most once, to one other destination: a route's default backend, a Kubernetes Service, on the reply statuses the route lists, or the one fallback route Higress's console writes for an AI route, whose target is picked once, at random among several or the single one an ordered fallback allows; its AI proxy's failover moves between the keys of one connection, not between models. No request is walked along a chain, and a fallback's own entry is never followed; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q asks for failed requests to fall back to other models, but nothing is wired to the models socket of %q, so the gateway serves no model route to fall back from; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
