apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-injection-shield-higress
  version: 1.0.0
  description: >
    Binds core/prompt-injection-shield on the gateway core/gateway/higress to
    a halt naming why the gateway does not keep it; a Release binds it in its
    Manifest. It emits no file, writes no guard and routes nothing through
    one.

    Higress 2.2.5 judges a request for an attempt to override a model's
    instructions only through a service it calls: its ai-security-guard
    plugin calls Alibaba Cloud's content-security service, and the
    qwen3guard plugin its source carries, which its 2.2.5 plugin release
    does not publish, a Qwen3Guard model service the operator runs. Each
    lets the request through to the model when that call fails or its answer
    cannot be read, so a guard that is down or unreachable stops nothing.
    This realization wires neither and sends no request through a guard, so
    nothing would check the requests. The build halts on every attachment,
    naming the sensitivity asked for. It halts on any component other than
    core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-injection-shield:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization writes checks a request for an attempt to override a model's
  # instructions.
  #
  # What the gateway offers, read in Higress's source at v2.2.5, the release
  # the gateway's Recipe pins, from which its plugin modules 2.0.3 are built.
  # ai-security-guard sends a request's text to Alibaba Cloud's content
  # security service, a hosted service outside the cluster, and resumes the
  # request when that call fails or its answer does not parse. qwen3guard,
  # which is in Higress's source at v2.2.5 but not among the plugins its
  # 2.2.5 release publishes, sends the prompt to a Qwen3Guard model at an
  # address its configuration names and refuses the request on the risk
  # level the model answers; it lets the request through, logging that it
  # fails open, when the call cannot be sent, fails or answers in a way it
  # cannot read, and when the request holds no prompt where its
  # configuration looks for one. The
  # realizations on core/gateway/litellm and core/gateway/nginx send their
  # traffic through core/security/nemo-guardrails, which refuses a request
  # when its detector cannot be reached; no gateway in this catalog answers
  # either of Higress's guards.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts, whatever is wired, naming the sensitivity asked
    # for and what the gateway would need.
    gateway_checks_requests_for_injection: >-
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q asks for model requests to be checked for an attempt to override a model's instructions, at sensitivity %s, but core/gateway/higress judges a request that way only through a service it calls — its ai-security-guard plugin calls Alibaba Cloud's content-security service, and the qwen3guard plugin in its source, which its plugin release does not publish, a Qwen3Guard model service — and each lets the request through to the model when that call fails or its answer cannot be read; this realization wires neither and sends no request through a guard, so nothing would check the requests. Remove the attachment, or attach the shield to core/gateway/litellm or core/gateway/nginx, whose realizations send the requests through a guard" .metadata.feature_instance .metadata.instance_id (toString (optional .values "sensitivity" "standard"))) -}}
