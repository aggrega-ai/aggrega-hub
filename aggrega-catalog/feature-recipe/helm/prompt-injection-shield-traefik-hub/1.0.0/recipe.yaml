apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-injection-shield-traefik-hub
  version: 1.0.0
  description: >
    Binds core/prompt-injection-shield on the gateway core/gateway/traefik-hub
    to a halt naming why the gateway does not keep it; a Release binds it in
    its Manifest. It emits no file, writes no guard and routes nothing through
    one.

    Traefik Hub checks a request for an attempt to override a model's
    instructions only through a service it calls. Its LLM Guard and Parallel
    LLM Guard middlewares send a request to a guard service or a model in a
    shape the realization would write and judge the answer by conditions it
    would write too; how they work with a prompt-attack detector is not
    measured, so neither sensitivity maps to a check on this gateway. Its
    Azure Prompt Shield, Amazon Bedrock Guardrails and GCP Model Armor
    middlewares call hosted services this catalog does not wire. The build
    halts on every attachment, naming the sensitivity asked for, and on any
    component other than core/gateway/traefik-hub.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-injection-shield:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization writes checks a request for an attempt to override a model's
  # instructions.
  #
  # What the gateway offers, read in Traefik Hub's AI gateway reference. LLM
  # Guard calls a guard endpoint with a request the configuration builds — a
  # chat completion around extracted text, or a body its own template writes
  # — and blocks on conditions over the guard's answer; Parallel LLM Guard
  # runs several such guards at once. Turning the Feature's two
  # sensitivities into such a request and such conditions for the detector
  # this catalog's other realizations use is the contract no measurement
  # covers. Azure Prompt Shield calls Azure AI Content Safety, which needs a
  # resource's endpoint and key; Amazon Bedrock Guardrails and GCP Model Armor
  # relay a guardrail or a template configured in that cloud, with that
  # cloud's credentials. The realizations on core/gateway/litellm and
  # core/gateway/nginx send their traffic through
  # core/security/nemo-guardrails, and the one on
  # core/gateway/azure-api-management turns on Azure's own prompt shield.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to the Traefik Hub realization, which describes core/gateway/traefik-hub alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts, whatever is wired, naming the sensitivity asked
    # for and what the gateway would need.
    gateway_checks_requests_for_injection: >-
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q asks for model requests to be checked for an attempt to override a model's instructions, at sensitivity %s, but core/gateway/traefik-hub checks a request that way only through a service it calls: its LLM Guard and Parallel LLM Guard middlewares call a guard service or a model in a request and with conditions the realization would have to write, and how they work with a prompt-attack detector is not measured, so no sensitivity maps to a check on this gateway; its Azure Prompt Shield, Amazon Bedrock Guardrails and GCP Model Armor middlewares call hosted services this catalog does not wire. Remove the attachment, or attach the shield to core/gateway/litellm, core/gateway/nginx or core/gateway/azure-api-management, whose realizations check the requests" .metadata.feature_instance .metadata.instance_id (toString (optional .values "sensitivity" "standard"))) -}}
