apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: backup-mariadb-operator
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/backup on a MariaDB database
    realized by helm/mariadb-cluster: writes a mariadb-operator Backup beside
    the database's MariaDB, which the mariadb-operator controller runs as a
    CronJob. The backups run only where that controller is deployed; nothing
    in the build checks it.

    Each backup is a logical dump of every database on the server, taken with
    mariadb-dump on infra.schedule, or daily at 03:00 where that is unset, in
    the time zone of the cluster's CronJob controller; each backup run deletes
    the backups older than infra.retention_days days. It is written to the
    bucket the store connection points at, signing with the key pair in the
    Secret infra.credentials_secret names or, unset, in one named after the
    Backup, which the cluster must hold in the database's namespace; or, with
    infra.volume set instead, to a ReadWriteOnce claim of that size which the
    controller provisions beside the database. Point-in-time recovery is off:
    a restore returns to a dump's moment, and infra.point_in_time_recovery:
    true halts.

    The build halts, naming the attachment, on a database realized by another
    Recipe, with neither a store connection nor infra.volume, with a store
    publishing no S3 API, with a store in the cluster whose namespace is not
    declared, on a database carrying a second core/backup attachment, on a
    Backup name longer than a CronJob's name may be, on a volume size that is
    not a Kubernetes quantity, on infra.credentials_secret beside a volume,
    on infra.role_arn, the role AWS Backup assumes, which the Backup has no
    use for, and on infra.run_as_user and infra.run_as_group, since it writes
    no security context on the Backup.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/backup:1.0.0
  # executionScope omitted -> component: renders once per attached component.

  # The store's render is read below, to find the namespace of a store running
  # in the cluster, so the attachment renders once every component in the
  # build has rendered rather than right after its own host.
  readsTargetRenderFacts: true

  # The Backup's name: the host's identity and the attachment name, folded to
  # hyphens. A MariaDB's own realization emits only the MariaDB, so the helm
  # provider reports no rendered name for it, and the host part is the
  # identity, which is the name helm/mariadb-cluster gives the MariaDB.
  locals:
    name: '{{ .context.instance_id }}-{{ .attachment_name | replace "_" "-" }}'

  assertions:
    # The Backup refers to the database's MariaDB by name, and only
    # helm/mariadb-cluster emits one. That Recipe declares the API version it
    # writes the MariaDB at as its local mariadb_api_version, which this
    # assertion reads — a FeatureRecipe's assertions read the locals and
    # provides of the component the attachment is on — and the Backup below is
    # written at that same version. Any other realization declares no such
    # local: the synthesized Recipe runs its own server and emits no MariaDB,
    # so the Backup would refer to a database the controller cannot find.
    mariadb_operator_mariadb: >-
      {{- if ne (toString (optional .locals "mariadb_api_version" "")) "k8s.mariadb.com/v1alpha1" -}}
      {{- fail (printf "core/backup attachment %q on %q is bound to helm/backup-mariadb-operator, which backs up a core/datastore/mariadb realized by helm/mariadb-cluster through a mariadb-operator Backup referring to the MariaDB that Recipe emits; %q, a %s, is realized by a Recipe that emits no such MariaDB, so the Backup would refer to a database the controller cannot find; bind the attachment to a backup FeatureRecipe for the realization %q has, or, for a core/datastore/mariadb, select helm/mariadb-cluster for it in the Manifest" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.component .metadata.instance_id) -}}
      {{- end -}}
    # infra.role_arn names the IAM role AWS Backup assumes. A mariadb-operator
    # Backup signs with the key pair in the Secret it names and assumes no role
    # an attachment names, so the role would reach no emitted byte; the build
    # halts on it rather than ignoring it.
    role_arn_refused: >-
      {{- with toString (optional .infra "role_arn" "") -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.role_arn to %q, the IAM role AWS Backup assumes, and this attachment is bound to helm/backup-mariadb-operator, which backs up through a mariadb-operator Backup: the Backup signs with the key pair in the Secret it names and assumes no role an attachment names; remove infra.role_arn from the attachment, or bind a FeatureRecipe realizing core/backup through AWS Backup" $.metadata.feature_instance $.metadata.instance_id .) -}}
      {{- end -}}
    # infra.point_in_time_recovery asks for restores to any moment of the
    # retention window, which needs a log of every change kept beside the
    # backups. The Backup this realization writes takes a logical dump on a
    # schedule and archives no binary log, so a restore returns to the moment
    # of a dump: off is this realization's default. mariadb-operator restores
    # to a point in time from other resources — a PhysicalBackup as the base
    # and a PointInTimeRecovery the MariaDB names, archiving its binary logs,
    # on the asynchronous replication topology — which this realization does
    # not write. true would reach no emitted byte, so the build halts on it
    # rather than ignoring it; false, or the option left out, is what the
    # Backup does.
    point_in_time_recovery_refused: >-
      {{- if eq (toString (optional .infra "point_in_time_recovery" "")) "true" -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, and this attachment is bound to helm/backup-mariadb-operator, which writes a mariadb-operator Backup: it takes a logical dump on a schedule and archives no binary log, so a restore returns to the moment of a dump; remove infra.point_in_time_recovery from the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # infra.run_as_user and infra.run_as_group name the user and group a
    # backup product's own jobs run as. mariadb-operator's Backup takes a pod
    # security context for the jobs its controller starts, but this
    # realization writes none, so neither would reach an emitted byte; the
    # build halts on them rather than ignoring them.
    run_as_refused: >-
      {{- range $k := list "run_as_user" "run_as_group" -}}
      {{- if ge (int64 (optional $.infra $k -1)) 0 -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.%s, the user or group a backup product's own jobs run as, and this attachment is bound to helm/backup-mariadb-operator, which writes no security context on the mariadb-operator Backup, so its jobs run as the controller gives them; remove infra.%s from the attachment, or bind a FeatureRecipe that runs its backup jobs as the user an attachment sets" $.metadata.feature_instance $.metadata.instance_id $k $k) -}}
      {{- end -}}
      {{- end -}}

  # One file holding the Backup.
  #
  # Where it is written. A Backup refers to a MariaDB of its own namespace,
  # and the CronJob and Jobs the controller creates for it run there, so it is
  # written where the database's Recipe writes the MariaDB: the namespace the
  # Release, or else the Aggregate, declares for the component through the aggrega.ai/namespace
  # annotation, or no namespace where none is declared, leaving both to the
  # applying tool.
  #
  # The name. The controller names the CronJob after the Backup, and
  # Kubernetes takes a CronJob name of 52 characters at most, so a longer name
  # halts, naming it.
  #
  # Where the backups go. A Backup writes to exactly one storage: the bucket
  # the store connection points at, or a volume. An attachment wiring a store
  # and setting infra.volume halts on the Feature's own one_destination
  # assertion before this file renders, so either the store or the volume
  # decides the storage below. An attachment with neither halts, naming both
  # ways to fix it.
  #
  # The volume. mariadb-operator provisions the claim a Backup's storage
  # describes, in the Backup's namespace and under the Backup's name, and the
  # backup Job keeps each dump there; the claim stays when the Backup is
  # deleted, since the controller gives it no owner. infra.volume.size is the
  # claim's requested storage, a Kubernetes quantity such as 50Gi, and a value
  # the Backup's own schema refuses halts here by name instead of at apply
  # time; infra.volume.storage_class is the class it is provisioned from, and
  # unset, the claim names none and the cluster's default class provisions it.
  # A claim must name an access mode — the cluster refuses one naming none —
  # and the controller adds none, so it is written ReadWriteOnce, the mode its
  # own example writes and every provisioning class offers. The controller
  # runs a Backup's Jobs one at a time and, for a logical dump, places them
  # anywhere in the cluster, so each run mounts the claim alone. No key is read
  # on this path, so infra.credentials_secret beside a volume halts by name
  # rather than reaching nothing.
  #
  # The store. The attachment's store connection is the one connection on the
  # store socket that a core/backup attachment declared. A component carries
  # every such connection of every core/backup attachment on it, under the
  # Feature's name rather than the attachment's, so one attachment cannot tell
  # its own from another's; a component carrying a second core/backup
  # attachment therefore halts while any of them wires a store. Two store
  # connections on one attachment halt, since a Backup writes to one storage.
  # A store publishing no S3 API — protocol other than s3, or no
  # endpoint, as core/storage/gcs publishes — halts, and so does an endpoint
  # that is not a scheme and a host with an optional port: the Backup takes
  # the address without its scheme, and the scheme becomes its TLS switch,
  # on for https and off for http. This store handling is the one the other
  # realizations of core/backup carry, repeated in each, since a template
  # expression has no catalog kind to be shared from.
  #
  # The store's address. A store running in the cluster publishes the bare
  # name of its Service, which resolves only inside its own namespace, while
  # the backup runs beside the database. Where the store's render emitted a
  # Service of that name, the address is qualified with the namespace the
  # Service is emitted into; a store whose Service is emitted into no namespace
  # halts, since its address cannot be qualified. A store outside the cluster —
  # a managed bucket — is reached at its endpoint as published. The region the
  # store publishes is written as the Backup's region; a store publishing none
  # leaves it to the S3 client.
  #
  # The path. The backups are written under the prefix <namespace>/<name>/ in
  # the bucket, or <name>/ where no namespace is declared, so two databases, or
  # two Releases sharing a bucket, never write into one another's backups.
  #
  # The key. The store connection carries no credential: a consumer of the
  # store holds the key it presents. The backup reads the key pair from the
  # Secret infra.credentials_secret names or, where it is unset, from one named
  # after the Backup, under ACCESS_KEY_ID and ACCESS_SECRET_KEY, key names the
  # Backup takes as written. A Secret is read from the namespace of the Backup
  # naming it, so it must be in the database's namespace and not in the
  # store's. The Secret is the cluster's to hold; nothing in the build checks
  # it.
  #
  # When. infra.schedule is a five-field cron expression, the form a Backup's
  # schedule takes; unset, it is 0 3 * * *, daily at 03:00. The controller
  # turns the schedule into a CronJob, which Kubernetes runs in its CronJob
  # controller's time zone, the Backup naming none. The controller's admission
  # webhook refuses an expression it cannot parse when the Backup is applied,
  # where the webhook is installed, rather than at build time.
  #
  # What and how long. Each run takes a logical dump of every database on the
  # server with mariadb-dump, writes it under the bucket's prefix or onto the
  # claim, and deletes from there every backup older than
  # infra.retention_days days, the Backup's maximum retention in hours: the
  # schedule and the retention mean the same on either storage.
  #
  # Every value is written through toJson, so a value that reads as a number
  # or a boolean stays a string, and identical input renders identical bytes.
  artifacts:
    backup.yaml: |
      {{- $attName := .attachment_name }}
      {{- $host := .context.instance_id }}
      {{- $name := .locals.name }}
      {{- $vol := optional .infra "volume" dict }}

      {{- /* This attachment's store connection. */}}
      {{- $stores := list }}
      {{- range $alias, $edge := .context.uses }}
        {{- if and (eq (toString $edge.socket) "store") (eq (toString (default "" $edge.origin_feature)) "core/backup") }}
          {{- $stores = append $stores (dict "alias" $alias "edge" $edge) }}
        {{- end }}
      {{- end }}
      {{- $backups := list }}
      {{- range $n, $f := (default dict .features) }}
        {{- if eq (toString (get $f "type")) "core/backup" }}
          {{- $backups = append $backups (printf "%q" $n) }}
        {{- end }}
      {{- end }}
      {{- if and (gt (len $backups) 1) $stores }}
        {{- fail (printf "core/backup attachment %q on %q: %q carries %d core/backup attachments (%s), and each one's store connection reaches every one of them under the Feature's name, so this attachment cannot tell which store is its own; attach core/backup to %q once when it is backed up through mariadb-operator" $attName $host $host (len $backups) (join ", " $backups) $host) }}
      {{- end }}
      {{- if and (not $stores) (not $vol) }}
        {{- fail (printf "core/backup attachment %q on %q has no store connection and sets no infra.volume, so it names nowhere for its backups to go; wire the attachment's store connection to the bucket the backups go to, under uses.store on the attachment in the Release, or set infra.volume on the attachment, with its size, to keep the backups on a volume mariadb-operator provisions beside the database" $attName $host) }}
      {{- end }}
      {{- if gt (len $stores) 1 }}
        {{- $aliases := list }}
        {{- range $stores }}{{ $aliases = append $aliases (printf "%q" .alias) }}{{ end }}
        {{- fail (printf "core/backup attachment %q on %q wires %d store connections (%s), and a mariadb-operator Backup writes to one storage; keep one" $attName $host (len $stores) (join ", " $aliases)) }}
      {{- end }}
      {{- $bucket := "" }}
      {{- $region := "" }}
      {{- $address := "" }}
      {{- $tls := false }}
      {{- if $stores }}
      {{- $store := index $stores 0 }}
      {{- $edge := $store.edge }}
      {{- $sp := default dict $edge.provides }}
      {{- $bucket = toString (default "" (get $sp "bucket")) }}
      {{- $endpoint := toString (default "" (get $sp "endpoint")) }}
      {{- $storeHost := toString (default "" (get $sp "host")) }}
      {{- $region = toString (default "" (get $sp "region")) }}
      {{- if or (ne (toString (default "" (get $sp "protocol"))) "s3") (not $endpoint) (not $bucket) }}
        {{- fail (printf "core/backup attachment %q on %q: its store connection %q reaches %q, which publishes no bucket at an S3 API endpoint, and a mariadb-operator Backup writes to a bucket over the S3 API; wire the store connection to a store published over the S3 API, such as core/storage/s3-object-store" $attName $host $store.alias $edge.target) }}
      {{- end }}
      {{- if not (regexMatch "^https?://[^/?#@]+/?$" $endpoint) }}
        {{- fail (printf "core/backup attachment %q on %q: the store %q publishes the endpoint %q, and a mariadb-operator Backup takes its S3 address as a host and an optional port, with a TLS switch in place of the scheme, so this realization reaches only an endpoint made of http or https, a host and an optional port, with no path; wire the store connection to a store publishing such an endpoint" $attName $host $edge.target $endpoint) }}
      {{- end }}

      {{- /* A store running in the cluster: qualify its Service name with the namespace it is emitted into. */}}
      {{- range (default (list) (get (default (dict) $edge.render_facts) "service_selectors")) }}
        {{- if and $storeHost (eq (toString (get . "name")) $storeHost) }}
          {{- $sns := toString (optional . "namespace" "") }}
          {{- if not $sns }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q runs in the cluster behind the Service %q, which is emitted into no namespace, and the backup, running beside the database, reaches a Service in another namespace only by a name qualified with that namespace; set aggrega.ai/namespace for %q, or on its boundary, in the Release" $attName $host $edge.target $storeHost $edge.target) }}
          {{- end }}
          {{- if not (contains (printf "://%s" $storeHost) $endpoint) }}
            {{- fail (printf "core/backup attachment %q on %q: the store %q publishes the endpoint %q, which does not name its Service %q, so the address the backup reaches cannot be qualified with the Service's namespace; wire the store connection to a store whose endpoint names the host it publishes" $attName $host $edge.target $endpoint $storeHost) }}
          {{- end }}
          {{- $endpoint = replace (printf "://%s" $storeHost) (printf "://%s.%s" $storeHost $sns) $endpoint }}
        {{- end }}
      {{- end }}
      {{- $tls = hasPrefix "https://" $endpoint }}
      {{- $address = regexReplaceAll "^https?://([^/]+)/?$" $endpoint "${1}" }}
      {{- end }}

      {{- /* The volume, where no store is wired: the claim's size and class. */}}
      {{- $size := "" }}
      {{- $class := "" }}
      {{- if not $stores }}
        {{- $size = toString (get $vol "size") }}
        {{- $class = toString (optional $vol "storage_class" "") }}
        {{- if not (regexMatch `^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$` $size) }}
          {{- fail (printf "core/backup attachment %q on %q sets infra.volume.size to %q, and the claim mariadb-operator provisions for a Backup takes its size as a Kubernetes quantity, such as 50Gi or 500Mi; set infra.volume.size to one" $attName $host $size) }}
        {{- end }}
        {{- with toString (optional .infra "credentials_secret" "") }}
          {{- fail (printf "core/backup attachment %q on %q sets infra.credentials_secret to %q and keeps its backups on the volume infra.volume sizes, and a backup on a volume reads no key; remove infra.credentials_secret from the attachment, or wire its store connection to a bucket in place of infra.volume" $attName $host .) }}
        {{- end }}
      {{- end }}

      {{- if gt (len $name) 52 }}
        {{- fail (printf "core/backup attachment %q on %q: the Backup's name, %q, is %d characters, and the mariadb-operator controller names the CronJob running it after the Backup, which Kubernetes takes at 52 characters at most; give the attachment or the component a shorter name" $attName $host $name (len $name)) }}
      {{- end }}
      {{- $ns := "" }}
      {{- if .context.annotations }}
        {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        {{- if $raw }}{{- $ns = $raw }}{{- end }}
      {{- end }}
      {{- $prefix := $name }}
      {{- if $ns }}{{- $prefix = printf "%s/%s" $ns $name }}{{- end }}
      {{- $schedule := trim (toString (optional .infra "schedule" "")) }}
      {{- $schedule = default "0 3 * * *" $schedule }}
      {{- $retention := printf "%dh" (mul (int .infra.retention_days) 24) }}
      {{- $secret := default $name (toString (optional .infra "credentials_secret" "")) -}}
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: Backup
      metadata:
        name: {{ toJson $name }}
        {{- with $ns }}
        namespace: {{ toJson . }}
        {{- end }}
      spec:
        mariaDbRef:
          name: {{ toJson $host }}
        schedule:
          cron: {{ toJson $schedule }}
        maxRetention: {{ toJson $retention }}
        storage:
          {{- if $stores }}
          s3:
            bucket: {{ toJson $bucket }}
            prefix: {{ toJson $prefix }}
            endpoint: {{ toJson $address }}
            {{- if $region }}
            region: {{ toJson $region }}
            {{- end }}
            accessKeyIdSecretKeyRef:
              name: {{ toJson $secret }}
              key: "ACCESS_KEY_ID"
            secretAccessKeySecretKeyRef:
              name: {{ toJson $secret }}
              key: "ACCESS_SECRET_KEY"
            tls:
              enabled: {{ $tls }}
          {{- else }}
          persistentVolumeClaim:
            accessModes:
              - "ReadWriteOnce"
            resources:
              requests:
                storage: {{ toJson $size }}
            {{- with $class }}
            storageClassName: {{ toJson . }}
            {{- end }}
          {{- end }}
