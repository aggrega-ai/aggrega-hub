apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-deny-patterns-agentgateway
  version: 1.0.0
  description: >
    Realizes core/prompt-deny-patterns on the gateway
    core/gateway/agentgateway; a Release binds it in its Manifest. It emits
    no file: the gateway's chart Recipe, agentgateway-chart, writes
    agentgateway 1.6.0's regular-expression guard into the configuration,
    applied to every model the gateway serves, refusing a model request one
    of deny_patterns matches.

    The guard reads the system and developer prompts, every other message,
    the arguments of tool calls and the results of tool calls, each text on
    its own, so an expression does not match across two of them; images are
    not read. Letter case counts unless an expression says otherwise, as (?i)
    does. A refused caller receives HTTP 403 with the body "The request was
    rejected due to inappropriate content", which names no expression. The
    build does not check an expression: one agentgateway cannot compile stops
    a gateway reading the configuration from starting, and a running one
    keeps its previous configuration.

    So it honours deny_patterns, and refuses allow_patterns by name, since
    agentgateway's guard keeps no list a request must match. It halts with
    nothing wired to the models socket, on a second such attachment, and on
    any component other than core/gateway/agentgateway. The compose
    realization of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-deny-patterns:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # How the gateway guards, read in agentgateway's source at v1.6.0, the
  # release the gateway's Recipes pin. The chart Recipe writes a regex guard
  # with action reject, each expression a rule of it, as the first request
  # guard among the guardrails applied to every model the gateway serves, so
  # it reads a request before core/data-masking's guard changes it. Its scope
  # is the widest the guard takes: the system and developer prompts
  # (systemPrompt), the user's and the assistant's turns (messages), the
  # arguments of tool calls (toolInput) and the results of tool calls
  # (toolOutput). Each of those texts is matched on its own, an expression
  # matching any of them refuses the request, and the expressions are matched
  # by Rust's regular-expression engine, which has no look-around and no back
  # references, as written: letter case counts unless an expression says
  # otherwise. The gateway also accepts Anthropic messages and OpenAI
  # Responses requests for the models it serves; there the guard reads the
  # system prompt or instructions, the message text blocks and the input
  # items' text. The refusal is the guard's default, HTTP 403 with the body
  # "The request was rejected due to inappropriate content". The chart Recipe
  # writes each $ of an expression as $$, agentgateway's spelling of a
  # literal $, so the gateway receives the expression as authored.
  #
  # An expression the engine cannot compile makes the configuration invalid:
  # a gateway starting on it does not start, and a running gateway reading it
  # logs the error and keeps serving with the configuration it had, the
  # previous list included.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_writes_the_guard: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q is bound to the agentgateway realization, which only core/gateway/agentgateway carries out: that component's chart Recipe writes the guard into the configuration it renders, and %s renders none for it, so nothing would be guarded. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # agentgateway's guard refuses on a match and keeps no list a request must
    # match to be forwarded.
    allow_patterns_are_refused: >-
      {{- with optional .values "allow_patterns" list -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q sets allow_patterns, but core/gateway/agentgateway's regular-expression guard refuses a request a listed expression matches and keeps no list a request must match to be forwarded, so it cannot refuse a request none of them matches; remove allow_patterns, or attach the Feature to a gateway whose guard admits by pattern" $.metadata.feature_instance $.metadata.instance_id) -}}
      {{- end -}}
    # The guard applies to the models the gateway serves, and with none wired
    # it serves no model.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q needs a model to guard the requests of, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no request the guard could refuse; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The chart Recipe writes one deny guard from one attachment, so a second
    # attachment could not hold beside the first.
    one_guard_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-deny-patterns" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/prompt-deny-patterns is attached to %q more than once (%s), but core/gateway/agentgateway's chart Recipe writes one deny guard from one attachment, so the attachments cannot each hold; keep one attachment, with every expression in its list" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
