apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: k8s-external-secret
  version: 1.0.0
  description: >
    Generates a Kubernetes ExternalSecret resource from a co-located Helm chart,
    so a secret-store operator running in the cluster fetches the credential and
    reconciles it into a Secret. origin — from values or infra, whichever
    carries it — is read as the key to fetch from the store, so the rendered
    output carries the locator rather than the credential value. The ExternalSecret reads from a ClusterSecretStore named
    platform-secret-store and refreshes hourly. The reconciled Secret uses the
    deterministic name pattern {instance_id}-{attachment_name}, with underscores
    in the slot name normalized to hyphens so the name is a valid RFC-1123 label,
    and the published provides point a consumer at that Secret and the data key
    within it.

    Reach for this realization where the External Secrets Operator runs in the
    cluster with a ClusterSecretStore named platform-secret-store, and the
    credential should be fetched from that store rather than written into the
    rendered output. Reach for k8s-existing-secret where the Secret already
    exists in the target namespace, and for k8s-secret-from-parameter where
    neither holds and the material may sit in the rendered output, as it may
    for evaluation.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/referenced-secret:1.0.0

  # The referenceable-secret contract: publish the reconciled Secret's identity as
  # provides, so a consumer references it (a Kubernetes secretKeyRef) without
  # re-deriving the name. core/referenced-secret requires both keys; the emitted
  # ExternalSecret below names its target from these provides — the name is
  # authored once, here. The slot name is normalized (underscores to hyphens) so
  # the published name is a valid RFC-1123 label; the consumer and the emitted
  # ExternalSecret share this one resolved value, so a normalized name cannot
  # drift between them.
  #
  # DELIBERATE NEAR-DUPLICATE, and it must be kept in step by hand. The `name`
  # expression below is character-for-character the one k8s-secret-from-parameter
  # publishes, and the two MUST agree: they are the two helm realizations of
  # core/referenced-secret that DERIVE the Secret's name, so a Manifest may bind
  # either one for the same attachment, and a consuming component reads the
  # reference from .features.<slot>.provides.name either way. If the two
  # expressions diverged, swapping between them would silently change a
  # consumer's rendered reference — the build would still succeed, and the
  # reference would point at a resource under another name.
  #
  # The third helm realization, k8s-existing-secret, sits outside this agreement
  # on purpose: it derives no name and publishes the existing Secret's own, so
  # binding it in place of either of these changes the consumer's reference by
  # design — the reference then points at the Secret already in the namespace.
  #
  # There is no single home available for this expression: a provides value is a
  # plain string, so the $import: reuse that valuesMapping, workload and artifacts
  # accept does not apply to a provides block — an import map is refused as a
  # provides value, and an `$import` key written directly under provides is read
  # as an ordinary key and imports nothing — and no mapping library could hold
  # it. Change one and change the other in the same edit.
  provides:
    name: '{{ .context.instance_id }}-{{ .attachment_name | replace "_" "-" }}'
    key: "{{ .values.key }}"

  # Resource Generation via a co-located Helm chart: the chart renders one
  # ExternalSecret whose target name and data key are fed from the published
  # provides — so the reconciled Secret and the consumer's
  # .features.<slot>.provides are one authored source (no drift) — with the
  # origin input as the key to fetch from the store. valuesMapping reads
  # .provides (the same resolved values the consumer sees) rather than
  # re-deriving the name inside the chart.
  #
  # The store this recipe reads from is the recipe's own fact and carries no
  # authoring key: which store a cluster runs, and under which name, is a
  # property of the target rather than of the application, so the Manifest
  # selects it by binding this FeatureRecipe rather than by filling a field.
  # A target with a differently-named store is served by a FeatureRecipe of its
  # own naming that store.
  source: ./chart
  # The chart is also passed the scope's namespace, when the scope declares one,
  # so the emitted ExternalSecret lands beside the workload that references the
  # Secret it reconciles rather than wherever the applying tool defaults to — a
  # reference does not resolve a Secret in another namespace. Empty when no scope
  # declares one, and the chart then omits the field — matching a synthesized
  # workload, which also emits no namespace and is placed by the applying tool.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a credential
  # Feature that reads the locator repeats this one expression, because it sits
  # inside a template the realization owns, and no catalog kind holds a single
  # template expression for several entities to share. values is read only
  # through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  valuesMapping: |
    secretName: "{{ .provides.name }}"
    dataKey: "{{ .provides.key }}"
    remoteKey: {{ optional .values "origin" (optional .infra "origin" "") | toJson }}
    secretStore: "platform-secret-store"
    secretStoreKind: "ClusterSecretStore"
    refreshInterval: "1h"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- if .context.annotations.release }}
        {{- $raw := index .context.annotations.release "aggrega.ai/namespace" }}
        {{- if $raw }}{{- $ns = $raw }}{{- end }}
      {{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
