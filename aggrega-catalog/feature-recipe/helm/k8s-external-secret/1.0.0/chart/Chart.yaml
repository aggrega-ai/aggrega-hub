apiVersion: v2
name: k8s-external-secret
description: >
  A one-template local Helm chart that renders a single Kubernetes ExternalSecret,
  which a secret-store operator reconciles into a Secret. It is the source: of the
  k8s-external-secret FeatureRecipe — the FR renders this chart per
  referenceable-secret slot, naming the target Secret and its data key from the
  slot's published provides and taking the store key from the slot's origin.
version: 0.1.0
appVersion: "1.0.0"
