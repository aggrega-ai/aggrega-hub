apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secretStore }}
    kind: {{ .Values.secretStoreKind }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.dataKey }}
      remoteRef:
        key: {{ .Values.remoteKey | quote }}
