apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: semantic-caching-apisix
  version: 1.0.0
  description: >
    Binds core/semantic-caching on the gateway core/gateway/apisix to a halt
    naming why the gateway cannot keep it; a Release binds it in its Manifest.
    It emits no file and writes no cache.

    APISIX 3.18.0 carries a semantic cache, but keeps two callers' replies
    apart only by the consumer an authentication plugin names, or by a value
    the request carries, which it does not verify. While a model
    is wired the gateway reads its routes from a file rendered with it and
    runs no Admin API, so its consumers would have to be declared in that
    file, and nothing the catalog renders declares one. With no caller it can
    tell apart, every request would share one cache, under end_user and under
    key alike, and a reply generated for one caller could be served to
    another. So the build halts on every attachment, naming the scope asked
    for and the caller identity the gateway lacks. With nothing wired to the
    models socket the gateway serves no model route to cache, and it halts
    saying so. It halts on any component other than core/gateway/apisix.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write keeps callers apart.
  #
  # What the gateway would cache under. APISIX 3.18.0's ai-cache stores a reply
  # under a key made of the route, then the consumer name only where its
  # include_consumer setting is on and a consumer is named, then any request
  # variables its include_vars lists; with none of those set, every request on
  # a route shares one entry for a prompt. A consumer is named only by an
  # authentication plugin that matched a consumer the gateway holds. A request
  # variable — a header, a body field — is whatever the caller sends, which the
  # gateway does not verify, so a caller naming another would be served that
  # caller's replies. In the standalone mode the gateway runs while a model is
  # wired, it holds no consumer the rendered file does not declare, and the
  # file declares none. So under end_user, which keeps each end user the gateway
  # identifies apart, and under key, which keeps apart the callers presenting
  # one key to the gateway, the gateway identifies nobody: either would serve
  # one caller a reply generated for another under a name that says it does
  # not.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/apisix and core/gateway/apisix:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/apisix" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the APISIX realization, which describes core/gateway/apisix alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the caller identity the
    # gateway lacks; with none, for the model route it does not serve.
    gateway_tells_callers_apart: >-
      {{- $scope := optional .values "scope" "end_user" -}}
      {{- $asked := ternary "end_user, which keeps each end user the gateway identifies apart" "key, which keeps apart the callers presenting each key to the gateway" (eq $scope "end_user") -}}
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for scope %s, but core/gateway/apisix keeps two callers' cached replies apart only by the consumer an authentication plugin names, or by a value the request itself carries, which it does not verify, and while it serves the models wired to it, it reads its routes from a file rendered with it and runs no Admin API, so it has no consumers: the file declares none, and it identifies no caller, no end user and no key. Every request would share one cache, and a reply generated for one caller could be served to another; remove the attachment" .metadata.feature_instance .metadata.instance_id $asked) -}}
      {{- else -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be cached; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
