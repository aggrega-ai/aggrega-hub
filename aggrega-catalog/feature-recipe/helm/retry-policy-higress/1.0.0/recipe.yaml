apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: retry-policy-higress
  version: 1.0.0
  description: >
    Realizes core/retry-policy on the gateway core/gateway/higress; a Release
    binds it in its Manifest. It emits no file: the gateway's Recipe,
    higress-chart, reads the attachment and writes the route's own retry as
    Ingress annotations onto every alias's model route.

    max_attempts counts every send, the first included, while Higress's
    proxy-next-upstream-tries counts the sends after the first, so the number
    written is one fewer than the attempts asked for: three attempts is two
    retries. max_attempts 1 writes the retry off, so each request is sent once;
    this is written out rather than left unset, because a Higress route carrying
    no retry annotation takes the retry the gateway's Istio control plane
    applies by default. The retries are the gateway's, so a caller sees one
    answer whichever send produced it. A request is sent again, at once, after a
    refused or reset connection and after a reply of 500 to 599 or 429; a POST is
    sent again, which the gateway's own default retry excludes. The route sets no
    per-try deadline, so a model that accepts the connection and then answers
    nothing or slowly is waited on and not sent again, and a reply the gateway
    forms itself is not sent again. A streamed request is sent again only before
    its reply has begun, and a request whose body is too large to buffer is sent
    once.

    It refuses max_attempts above 2147483648, the most sends Higress's retry
    count holds, and halts on a second such attachment, with nothing wired to
    the models socket, and on any component other than core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/retry-policy:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's Recipe, which reads it and computes the annotations there, in
  # one place, so nothing here can disagree with what is rendered. What stays
  # here is what that Recipe cannot honour.
  #
  # How the gateway retries, read in Higress's source at v2.2.5, the release the
  # gateway's Recipe pins, and in the Istio and Envoy forks it pins as its
  # control plane and data plane. Higress reads the Ingress annotations
  # proxy-next-upstream-tries, proxy-next-upstream-timeout and
  # proxy-next-upstream (in the nginx and higress.io forms) into the route's
  # Istio HTTPRetry, whose attempts is the retries after the first send. The
  # token error maps to Envoy's 5xx condition, which resends a refused or reset
  # connection and any 500-to-599 reply; http_429 resends a 429; non_idempotent
  # lifts Istio's default restriction that retries no POST. Higress writes no
  # per-try timeout, so a slow or silent upstream is not retried, and the route
  # carries no request timeout. Envoy buffers the request body to resend it up
  # to the decoder buffer limit the AI proxy sets, and sends a larger request
  # once. A streamed request is retried only before its reply has started.
  #
  # No build proves that a running gateway sends a request again.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_writes_the_retry: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/retry-policy attachment %q on %q is bound to the Higress realization, which only core/gateway/higress carries out: that component's Recipe writes the retry as Ingress annotations onto the routes it serves models on, and %s renders none for it, so no request would be sent again. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Higress holds the retry count, the sends after the first, as a 32-bit
    # signed number in the Ingress annotation, so it counts at most 2147483647
    # retries.
    attempts_are_ones_the_gateway_keeps: >-
      {{- if gt (int64 .values.max_attempts) 2147483648 -}}
      {{- fail (printf "core/retry-policy attachment %q on %q asks for max_attempts %d, but core/gateway/higress counts at most 2147483647 retries after the first send, so it keeps at most 2147483648 sends in all; set max_attempts to 2147483648 or fewer" .metadata.feature_instance .metadata.instance_id (int64 .values.max_attempts)) -}}
      {{- end -}}
    # The retry is written onto the routes serving the wired models, and with
    # none wired the gateway renders no model route to retry on.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/retry-policy attachment %q on %q needs a model route to retry on, but nothing is wired to the models socket of %q, so the gateway serves no model and no request would be sent again; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The Recipe writes one retry from one attachment onto every model route, so
    # a second attachment could not hold beside the first.
    one_retry_policy_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/retry-policy" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/retry-policy is attached to %q more than once (%s), but core/gateway/higress writes one retry onto the routes serving its models, so the attachments cannot each hold; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
