apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: audit-logging-higress
  version: 1.0.0
  description: >
    Realizes core/audit-logging on the gateway core/gateway/higress; a
    Release binds it in its Manifest. It emits no file of its own: while the
    attachment is present, the gateway's chart Recipe, higress-chart, adds
    Higress's ai-statistics plugin to the model routes, and the access log
    the gateway writes to its standard output then carries, in each model
    request's line, an ai_log field naming the model that answered and the
    input, output and total tokens its reply reports, beside the request's
    path, status, timing and upstream. It keeps no prompt or reply text.

    So it realizes an attachment that turns require_cost and
    require_verified_caller off and gives no retention_days. It refuses by
    name require_cost on, since the gateway prices no request,
    require_verified_caller on, since the gateway declares no callers and so
    verifies none, and retention_days, since the gateway keeps no record it
    could delete: how long a line is kept is the log collection's own. It
    halts with nothing wired to the models socket, and on any component other
    than core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: the gateway's chart Recipe adds the
  # statistics plugin while a core/audit-logging attachment is present, and
  # this realization checks what the record the gateway then writes can keep.
  #
  # What the gateway records, read in Higress's source and chart at v2.2.5,
  # the release the gateway's Recipe pins, which its ai-statistics module
  # 2.0.3 is built from. The chart writes the gateway's access log to its
  # standard output, a line for each request, and the line's format, which
  # the chart sets, holds an ai_log field the statistics plugin fills: for a
  # model request, the model the reply names, the input, output and total
  # tokens it reports, and how long the model took to answer. The Recipe has
  # the plugin read every path of the model routes, so a request of every
  # operation is recorded. It records no prompt or reply text, and no caller,
  # since the gateway verifies none. Value by value:
  # - require_cost: Higress prices no request, so every record would carry no
  #   cost. Refused while on; off, the record carries the tokens and no cost.
  # - require_verified_caller: the gateway declares no callers and verifies
  #   none, so no record can name a verified caller. Refused while on; off,
  #   the record names no caller.
  # - retention_days: the gateway keeps no record of its own to delete; its
  #   access log goes to its standard output, and how long a line is kept is
  #   whatever collects that output. Refused wherever given.
  #
  # No assertion can read the host component's labels or infra, so what the
  # gateway is able to do is stated in the messages, and the check of the
  # host's type first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # With nothing wired to the models socket the gateway serves no model
    # request to record. With a model wired, each value the record cannot
    # keep is refused by name, every one in a single failure, so an attachment
    # at the defaults is told every strict value it needs to change at once. A
    # strict value is strict unless the attachment writes it false.
    gateway_keeps_the_record_asked_for: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of the model requests the gateway serves, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no model request to record; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
      {{- $infra := default dict .infra -}}
      {{- $costOff := and (hasKey $infra "require_cost") (eq (toString (index $infra "require_cost")) "false") -}}
      {{- $callerOff := and (hasKey $infra "require_verified_caller") (eq (toString (index $infra "require_verified_caller")) "false") -}}
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $refused := list -}}
      {{- $change := list -}}
      {{- if not $costOff -}}
      {{- $refused = append $refused "what each request cost, which require_cost asks for, since the gateway prices no request" -}}
      {{- $change = append $change "set require_cost to false to accept a record carrying no cost" -}}
      {{- end -}}
      {{- if not $callerOff -}}
      {{- $refused = append $refused "the caller the gateway verified, which require_verified_caller asks for, since the gateway declares no callers and so verifies none" -}}
      {{- $change = append $change "set require_verified_caller to false to accept a record naming no verified caller" -}}
      {{- end -}}
      {{- if ne $days "" -}}
      {{- $refused = append $refused (printf "a retention of %s days, which retention_days asks for, since the gateway writes its record to its standard output and keeps none it could delete" $days) -}}
      {{- $change = append $change "remove retention_days" -}}
      {{- end -}}
      {{- if $refused -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for what the record core/gateway/higress keeps cannot hold: %s. On this attachment in the Release, %s, or attach the Feature to a gateway that keeps it" .metadata.feature_instance .metadata.instance_id (join "; " $refused) (join ", and " $change)) -}}
      {{- end -}}
