apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: data-masking-agentgateway
  version: 1.0.0
  description: >
    Realizes core/data-masking on the gateway core/gateway/agentgateway; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, agentgateway-chart, writes agentgateway's regular-expression
    guards into the configuration, replacing each match of a listed pattern
    with <masked> — under refuse, refusing the request or the reply with HTTP
    403 — in requests, in replies or in both as scope says. While replies
    are masked a request asking for a streamed reply is refused with HTTP
    403 before it is forwarded, since agentgateway does not mask a streamed
    reply, and so is any request whose body is larger than the 2 MiB the
    gateway reads for that check, streamed or not.

    A request guard reads the system and developer prompts, every other
    message and the arguments and results of tool calls; masking an argument
    can leave its JSON invalid. A reply guard reads the reply's message text.
    Nothing else is read or refused, so each strict default is refused by
    name and an attachment builds once the Release relaxes it, letting
    through unmasked: under allow_unmasked_text, a message's name and fields
    beside its text and every request field beside its messages; under
    allow_non_text_content, images, files and audio; under
    allow_unmasked_reply_parts, a reply's tool calls, refusal, audio and
    token probabilities and a failed call's reply; under mask_reasoning
    false, its reasoning. Patterns need placeholder_shows_name false under
    redact. It refuses entity types and restore.

    It halts on a second attachment, with nothing wired to the models socket,
    and on any component other than core/gateway/agentgateway. The compose
    realization of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/data-masking:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: the configuration an attachment asks for is
  # written by the gateway's chart Recipe, which reads the attachment. What
  # stays here is what that Recipe cannot honour.
  #
  # How the gateway masks, read in agentgateway's source at v1.6.0, the release
  # the gateway's Recipes pin. The chart Recipe writes each listed pattern as a
  # rule of a regex guard among the guardrails applied to every model the
  # gateway serves: a request guard where scope is request or both, reading
  # the scopes systemPrompt, messages, toolInput and toolOutput, and a reply
  # guard where scope is response or both. The guard's action is mask under
  # redact and reject under refuse. A match is replaced by <masked>, whatever
  # the pattern is named. A refusal answers HTTP 403 with the body "The request
  # was rejected due to inappropriate content".
  #
  # What a request guard reads: in a chat-completions request, the text of
  # each message, as one string or as its text parts — the system and
  # developer prompts, the user's and the assistant's turns and the results of
  # tool calls — and the arguments of each tool call an earlier turn carries,
  # masked as one string, so a match spanning its JSON syntax can leave it
  # invalid. The gateway also accepts Anthropic messages and OpenAI Responses
  # requests for the models it serves and converts them; there the guard reads
  # the system prompt or instructions, the message text blocks and the input
  # items' text. A request prompt-deny-patterns refuses is refused before this
  # guard reads it.
  #
  # What a reply guard reads: the message text of each choice of a reply that
  # arrives whole. A streamed reply is not guarded at all, so while replies
  # are masked the chart Recipe writes an authorization rule refusing, with
  # HTTP 403 and before forwarding, a request whose body asks for a streamed
  # reply — and a request whose body is not JSON or is larger than the 2 MiB
  # the rule reads, streamed or not, since the rule cannot evaluate it.
  # allow_streamed_replies has no effect here, since entity types are refused.
  #
  # What each relaxation lets through unmasked. Nothing in agentgateway's
  # configuration refuses a request for the text its guard does not read, or
  # withholds what its reply guard does not read, so each protection is
  # refused by name below while it keeps its default, and an attachment builds
  # once the Release relaxes it:
  # - allow_unmasked_text, with scope request or both, lets reach the model
  #   provider as the caller sent them: a message's name and every field of a
  #   message beside its text and its tool calls, such as an earlier turn's
  #   refusal or audio reference; every field of a request beside its
  #   messages, such as the text of a predicted output, the user and the
  #   metadata; and the numbers and booleans of a tool call's arguments sent
  #   as structured JSON rather than as one string.
  # - allow_non_text_content, with scope request or both, lets reach the model
  #   provider as the caller sent them: a request's images, files and audio,
  #   and the addresses they are given by.
  # - allow_unmasked_reply_parts, with scope response or both, lets reach the
  #   caller as the provider sent them: a reply's tool calls and their
  #   arguments, a refusal, spoken audio and its transcript, the probabilities
  #   of the tokens the model chose, annotations a provider adds, and the reply
  #   to a failed call, which can quote the request or the reply.
  # - mask_reasoning false, with scope response or both, lets reach the caller
  #   the reasoning a reasoning model returns beside its message.
  #
  # What it keeps out of the gateway's own records: the configuration stores
  # no prompt or reply text in the store the gateway keeps under
  # core/audit-logging.
  #
  # No build proves that a running gateway masks anything.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_writes_the_masking: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/data-masking attachment %q on %q is bound to the agentgateway realization, which only core/gateway/agentgateway carries out: that component's chart Recipe writes the guards into the configuration it renders, and %s renders none for it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # agentgateway's guard matches the patterns written in its configuration,
    # and recognizes no entity type: named entity recognition is a webhook to
    # a service of the operator's own, which this catalog does not wire.
    entity_types_are_refused: >-
      {{- with optional .values "entities" list -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists the entity types %s, but core/gateway/agentgateway, which declares dataplane.aggrega.ai/content-masking: pattern-list, masks matches of the patterns written in its configuration and recognizes no entity type; list regular expressions under patterns instead, or attach the Feature to a gateway declaring entity-recognition" $.metadata.feature_instance $.metadata.instance_id (join ", " .)) -}}
      {{- end -}}
    # Nothing agentgateway offers puts a masked value back.
    restore_is_refused: >-
      {{- if eq (optional .values "action" "redact") "restore" -}}
      {{- fail (printf "core/data-masking attachment %q on %q asks for action restore, but core/gateway/agentgateway replaces each match with <masked> and keeps nothing to put the original back; set action to redact, which replaces each match for good, or to refuse, which refuses the request or reply carrying one" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # A pattern's match becomes <masked>, which does not show the pattern's
    # name, so patterns replaced under redact need placeholder_shows_name off.
    # Under refuse nothing is replaced and no placeholder is shown. Only false
    # turns it off.
    placeholder_shows_no_name: >-
      {{- $values := default dict .values -}}
      {{- $off := and (hasKey $values "placeholder_shows_name") (eq (toString (index $values "placeholder_shows_name")) "false") -}}
      {{- if and (optional .values "patterns" list) (eq (optional .values "action" "redact") "redact") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists patterns while placeholder_shows_name is on, but core/gateway/agentgateway replaces a match of a pattern written in its configuration with <masked>, which does not show the pattern's name; set placeholder_shows_name to false in this attachment's values, which accepts that placeholder" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The request guard reads the text of the messages and of tool calls, and
    # nothing in agentgateway's configuration refuses a request carrying text
    # it does not read, so allow_unmasked_text, off unless the Release turns
    # it on, cannot be honoured while requests are masked. Only true turns it
    # on.
    unmasked_text_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_text") (eq (toString (index $infra "allow_unmasked_text")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_unmasked_text is off, but core/gateway/agentgateway's guard reads the text of a request's messages and tool calls, and nothing in its configuration refuses a request carrying text it does not read — a message's name and other fields, and the fields beside the messages — so that text would reach the model provider unmasked; set allow_unmasked_text to true on this attachment in the Release, which lets it through as data-masking-agentgateway lists, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # The guard reads text, and nothing in agentgateway's configuration
    # refuses a request carrying images, files or audio, so
    # allow_non_text_content, off unless the Release turns it on, cannot be
    # honoured while requests are masked. Only true turns it on.
    non_text_content_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_non_text_content") (eq (toString (index $infra "allow_non_text_content")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_non_text_content is off, but core/gateway/agentgateway's guard passes a request's images, files and audio on unread, and nothing in its configuration refuses a request carrying them; set allow_non_text_content to true on this attachment in the Release, which lets them reach the model provider unmasked, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Of a reply, the guard reads the message text alone and withholds nothing
    # else, and a failed call's reply passes as the provider returned it, so
    # allow_unmasked_reply_parts, off unless the Release turns it on, cannot
    # be honoured while replies are masked. Only true turns it on.
    unmasked_reply_parts_are_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_reply_parts") (eq (toString (index $infra "allow_unmasked_reply_parts")) "true") -}}
      {{- if and (ne $scope "request") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while allow_unmasked_reply_parts is off, but core/gateway/agentgateway's reply guard reads a reply's message text alone and withholds none of the rest — its tool calls, a refusal, spoken audio and its transcript, the probabilities of the tokens the model chose — and passes the reply to a failed call on as the provider returned it; set allow_unmasked_reply_parts to true on this attachment in the Release, which lets them reach the caller unmasked, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Of a reply, the guard reads the message text and not the reasoning a
    # reasoning model returns beside it, so mask_reasoning, on unless turned
    # off, cannot be honoured while replies are masked. Only false turns it
    # off.
    reasoning_is_not_masked: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $off := and (hasKey $infra "mask_reasoning") (eq (toString (index $infra "mask_reasoning")) "false") -}}
      {{- if and (ne $scope "request") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while mask_reasoning is on, but core/gateway/agentgateway's reply guard reads a reply's message text and not the reasoning a reasoning model returns beside it, so that reasoning would reach the caller unmasked; set mask_reasoning to false on this attachment in the Release, which lets it through, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # The guards apply to the models the gateway serves, and with none wired
    # it serves no model.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/data-masking attachment %q on %q needs a model to mask the traffic of, but nothing is wired to the models socket of %q, so the gateway serves no model; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The chart Recipe writes one masking guard of each direction from one
    # attachment, so a second attachment could not hold beside the first.
    one_masking_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/data-masking" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/data-masking is attached to %q more than once (%s), but core/gateway/agentgateway's chart Recipe writes one masking guard of each direction from one attachment, so the attachments cannot each hold; merge them into one" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
