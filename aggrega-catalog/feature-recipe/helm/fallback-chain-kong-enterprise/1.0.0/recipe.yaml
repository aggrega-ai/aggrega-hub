apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: fallback-chain-kong-enterprise
  version: 1.0.0
  description: >
    Realizes core/fallback-chain on the gateway core/gateway/kong-enterprise;
    a Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, kong-enterprise-chart, reads the attachment and writes each
    chained alias's chat and completion routes through Kong's AI Proxy
    Advanced instead of its AI proxy, with the alias's model and the models
    its walk falls back to as targets in priority order.

    The walk is the alias, then its entry's fallbacks in order, each counting
    one fallback; a fallback's own entry is followed in turn only while fewer
    than max_hops have been counted, and every alias one entry lists is
    placed whatever the count. The balancer sends a request to each target of
    the walk once, in order, until one answers, moving on after a connection
    error or timeout, an invalid reply header or a reply of 429, 500, 502,
    503 or 504; every other reply is returned as it came. An alias with no
    entry keeps its AI proxy.

    The build halts where chains names an alias the models socket does not
    carry; beside core/retry-policy, because Kong keeps one retry count for
    the whole walk and cannot send to a model again before falling back; on a
    walk reaching an alias twice; on a second such attachment; with nothing
    wired; on a gateway image older than 3.12; and on any component other
    than core/gateway/kong-enterprise.

    Kong sells AI Proxy Advanced under its AI Gateway Enterprise entitlement,
    which no build can verify and without which Kong skips the plugin
    silently, so the gateway's Recipe halts until infra.ai_gateway_entitled
    affirms it. No build proves that a running gateway falls back.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/fallback-chain:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the KongModelRoutes bundle the gateway's chart Recipe imports, which reads
  # it and computes each alias's walk there, in one place, so nothing here can
  # disagree with what is rendered. What stays here is what that bundle cannot
  # honour and an assertion can see.
  #
  # How the gateway falls back. Each wired alias is served by a service of
  # its own whose chat and completion routes each carry their own AI Proxy
  # Advanced, so a walk's balancer and its count of retries belong to that
  # alias alone. The bundle gives the walk's targets weights from the number
  # of targets down to one, so each sits in a priority group of its own and
  # the balancer tries them in walk order, and sets the retries to one fewer
  # than the targets, so the walk can reach its last target and no further.
  # Kong's reference has the balancer move to the next target on each counted
  # failure, and its changelog treats choosing again a target already tried
  # as a defect, so each model of the walk is sent the request once; a POST
  # is passed on only with non_idempotent among the failures listed, which
  # the bundle writes. A walk reaching an alias a
  # second time would need the same model twice in one balancer, which Kong
  # is not shown to try twice, so the bundle halts on it, naming both.
  #
  # Each target is the fallback alias's own model, at the endpoint it
  # publishes, with that connection's credential read from Kong's environment
  # vault under its own variable, as on that alias's own routes.
  #
  # Kong 3.10 added the priority algorithm, and 3.12 stopped the balancer
  # retrying the first target more than once, so the chart Recipe halts on an
  # image older than 3.12.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_writes_the_chain: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q is bound to the Kong Gateway Enterprise realization, which only core/gateway/kong-enterprise carries out: that component's chart Recipe writes the chain into the routes it serves models on, and %s renders none for it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The chain is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to fall back from.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q needs model routes to fall back between, but nothing is wired to the models socket of %q, so the gateway serves no model; wire the models the chain names to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # An entry for an alias the socket does not carry would never be read,
    # since the gateway serves no route for it; a fallback it does not carry
    # has no model to be sent to. Both halt, naming the name and what the
    # socket carries.
    chains_name_wired_aliases: >-
      {{- $wired := sortAlpha (keys (optional .uses "models" dict)) -}}
      {{- range $entry := .values.chains -}}
      {{- if not (has $entry.alias $wired) -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q gives an entry to %q, but the models socket of core/gateway/kong-enterprise carries no connection under that alias, so the gateway serves no route for it and the entry would never be read; give entries only to aliases the models socket carries: %s" $.metadata.feature_instance $.metadata.instance_id $entry.alias (join ", " $wired)) -}}
      {{- end -}}
      {{- range $fallback := $entry.fallbacks -}}
      {{- if not (has $fallback $wired) -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q lists %q as a fallback of %q, but the models socket of core/gateway/kong-enterprise carries no connection under that alias, so there is no model to send the request to; list only aliases the models socket carries: %s" $.metadata.feature_instance $.metadata.instance_id $fallback $entry.alias (join ", " $wired)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # The Feature has a request fall back after the gateway's own retries of
    # the model it asked for. Kong's balancer holds one count of retries for
    # the whole walk and moves to the next target on every counted failure, so
    # a retry of the same model before its fallback cannot be written beside
    # the chain; the pair halts rather than counting the sends some other way.
    not_beside_a_retry_policy: >-
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/retry-policy" -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q is beside core/retry-policy attachment %q, but Kong Gateway Enterprise's AI Proxy Advanced holds one count of retries for a route's whole walk and moves to the next target on every counted failure, so it cannot send a request to the same model again before falling back, as the two together ask; remove one of the two attachments" $.metadata.feature_instance $.metadata.instance_id $name) -}}
      {{- end -}}
      {{- end -}}
    # The bundle writes one walk per alias from one attachment, so a second
    # attachment could not hold beside the first.
    one_chain_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/fallback-chain" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/fallback-chain is attached to %q more than once (%s), but core/gateway/kong-enterprise writes one walk per alias from one attachment, so the attachments cannot each hold; merge them into one" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
