apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: k8s-secret-from-parameter
  version: 1.0.0
  description: >
    Generates a Kubernetes Secret resource from a literal value passed
    via Release parameters. The generated Secret uses the deterministic
    name pattern: {instance_id}-{secret_name}.
    Anti-pattern for production. Use vault-backed recipes instead.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: helm
  implements: core/secret-value:1.0.0

  # Resource Generation pattern (source + valuesMapping).
  # Generates a standalone K8s Secret manifest.
  source: "./charts/k8s-secret"
  valuesMapping: |
    secretName: "{{ .context.instance_id }}-{{ .secret_name }}"
    secretKey: "{{ .values.key }}"
    secretValue: "{{ .values.source }}"
