apiVersion: v2
name: k8s-secret-from-parameter
description: >
  A one-template local Helm chart that renders a single Kubernetes Secret from a
  literal value. It is the source: of the k8s-secret-from-parameter
  FeatureRecipe — the FR renders this chart per referenceable-secret slot, naming
  the Secret and its data key from the slot's published provides.
