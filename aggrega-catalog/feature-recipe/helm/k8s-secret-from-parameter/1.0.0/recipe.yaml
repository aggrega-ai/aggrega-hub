apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: k8s-secret-from-parameter
  version: 1.0.0
  description: >
    Generates a Kubernetes Secret resource from a literal value passed
    via Release parameters. The generated Secret uses the deterministic
    name pattern: {instance_id}-{secret_name}.
    Anti-pattern for production. Use vault-backed recipes instead.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: helm
  implements: core/referenced-secret:1.0.0

  # The referenceable-secret contract: publish the generated Secret's identity as
  # provides, so a consumer references it (a Kubernetes secretKeyRef) without
  # re-deriving the name. core/referenced-secret requires both keys; the chart
  # input below derives from these provides — the name is authored once, here.
  provides:
    name: "{{ .context.instance_id }}-{{ .secret_name }}"
    key: "{{ .values.key }}"

  # Resource Generation pattern (source + valuesMapping). Generates a standalone
  # K8s Secret manifest whose name and data key derive from the published
  # provides, so the rendered Secret and the consumer's .secrets.<slot>.provides
  # are one authored source (no drift).
  source: "./charts/k8s-secret"
  valuesMapping: |
    secretName: "{{ .provides.name }}"
    secretKey: "{{ .provides.key }}"
    secretValue: "{{ .values.source }}"
