apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: k8s-secret-from-parameter
  version: 1.0.0
  description: >
    Generates a Kubernetes Secret resource from an authored literal
    value, rendered from a co-located Helm chart. The
    generated Secret uses the deterministic name pattern
    {rendered_name}-{attachment_name}: the host component's rendered name,
    which the helm provider spells in the characters a Kubernetes name
    allows, then the slot name with underscores normalized to hyphens, so the
    name is a valid RFC-1123 label wherever the host reports a rendered name.
    On a host that reports none, the host part is the component's identity,
    and the name is a valid label only where that identity is one. The value
    is written into the emitted Secret, so the credential material sits in
    every rendered artifact the build produces.

    Reach for this realization where no Secret exists yet and no
    secret-store operator runs in the cluster, and the material may sit in
    the rendered output — for evaluation and local work, not for a
    production credential. Reach for k8s-existing-secret where the Secret
    already exists in the target namespace, and for k8s-external-secret
    where a secret-store operator runs in the cluster and should fetch the
    credential from its store.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/referenced-secret:1.0.0

  # The referenceable-secret contract: publish the generated Secret's identity as
  # provides, so a consumer references it (a Kubernetes secretKeyRef) without
  # re-deriving the name. core/referenced-secret requires both keys; the emitted
  # Secret below derives from these provides — the name is authored once, here.
  # The host part is .context.rendered_name: a component's name may carry an
  # underscore or a capital, which the rendered name writes out. A host whose
  # provider reports no rendered name — a helm Recipe placing an artifact set
  # alone, such as helm/function-knative — names its own resources from its
  # identity, and so does this Secret there: the host part is read through
  # optional, which falls back to .context.instance_id, because a direct read of
  # .context.rendered_name on such a host halts the build. Wherever a rendered
  # name is reported, the name is the same either way. The slot name is
  # normalized (underscores to hyphens), so the published name is a valid
  # RFC-1123 label wherever the host part is a rendered name, and on the fallback
  # only where the component's identity is one; the consumer and the emitted
  # Secret share this one resolved value, so a normalized name cannot drift
  # between them. DELIBERATE NEAR-DUPLICATE of the `name` k8s-secret-from-value,
  # k8s-external-secret and k8s-secret-set publish — and k8s-external-secret's
  # MUST agree with it, since a Manifest may bind either realization of
  # core/referenced-secret for the same attachment: each realization publishes
  # its own, and no catalog kind holds a provides block for several entities to
  # share; a change to one of the four is made to all four. The two
  # random-password realizations compose their Secret's name the same way but
  # deliberately not byte for byte, honouring values.name ahead of it; a change
  # to how the host part is read is made in all six.
  provides:
    name: '{{ optional .context "rendered_name" .context.instance_id }}-{{ .attachment_name | replace "_" "-" }}'
    key: "{{ .values.key }}"

  # Resource Generation via a co-located Helm chart: the chart renders one
  # Kubernetes Secret whose name and data key are fed from the published provides
  # — so the rendered Secret and the consumer's .features.<slot>.provides are one
  # authored source (no drift) — with the origin input as its value. valuesMapping
  # reads .provides (the same resolved values the consumer sees) rather than
  # re-deriving the name inside the chart.
  source: ./chart
  # The chart is also passed the scope's namespace, when the scope declares one,
  # so the emitted Secret lands beside the workload that references it rather than
  # wherever the applying tool defaults to — a reference does not resolve a Secret
  # in another namespace. Empty when no scope declares one, and the chart then
  # omits the field — matching a synthesized workload, which also emits no
  # namespace and is placed by the applying tool.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a credential
  # Feature that reads the locator repeats this one expression, because it sits
  # inside a template the realization owns, and no catalog kind holds a single
  # template expression for several entities to share. values is read only
  # through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  valuesMapping: |
    secretName: "{{ .provides.name }}"
    dataKey: "{{ .provides.key }}"
    origin: {{ optional .values "origin" (optional .infra "origin" "") | toJson }}
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
