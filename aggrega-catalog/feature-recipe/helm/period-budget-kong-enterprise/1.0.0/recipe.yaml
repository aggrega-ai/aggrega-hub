apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: period-budget-kong-enterprise
  version: 1.0.0
  description: >
    Realizes core/period-budget on the gateway core/gateway/kong-enterprise; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, kong-enterprise-chart, reads the attachment and writes Kong's AI
    Rate Limiting Advanced into the routes file it imports, one plugin for
    the whole gateway under scope gateway, or one on each wired model's
    service under scope model.

    The gateway counts the tokens each model's reply reports, read, written
    or both as unit names, in fixed windows of period, each request counted
    in the one window its time falls in. Once the count reaches limit, the
    next model request is answered with HTTP 429 until the window ends, so the
    request that crosses the limit is served. The count is kept in the
    gateway's PostgreSQL backend, shared by every replica and kept across a
    restart. Under scope model a request is counted against the alias it
    named, whichever model answered it.

    So it honours unit total_tokens, prompt_tokens or completion_tokens,
    scope gateway or model, and a period of seconds, minutes, hours or days.
    It refuses usd, scope caller and calendar months by name, and halts on a
    second such attachment, with nothing wired to the models socket, on a
    gateway image older than 3.15, and on any component other than
    core/gateway/kong-enterprise.

    Kong sells the plugin under its AI Gateway Enterprise entitlement, which
    no build can verify and without which Kong skips the plugin silently, so
    the gateway's Recipe halts until infra.ai_gateway_entitled affirms it. No
    build proves that a running gateway enforces the budget.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/period-budget:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the KongModelRoutes bundle the gateway's chart Recipe imports, which reads
  # it. What stays here is what that bundle cannot honour.
  #
  # How the gateway keeps the budget. The bundle writes AI Rate Limiting
  # Advanced in its policy form: one policy whose one limit is limit, over a
  # window of period in seconds, counting the token count unit names, in a
  # fixed window, with the count in the Kong data store and read and written
  # on every request. Under scope gateway the plugin applies to the whole
  # gateway, and its policy matches every request whose AI proxy speaks to an
  # OpenAI-API model, partitioned by that one provider, so one count covers
  # every model the gateway serves, the routes of the wired models and any
  # other such route the gateway holds; a request no AI proxy answers matches
  # no policy and is not limited. Under scope model one plugin sits on each
  # wired model's service, with a policy matching all of that service's
  # requests and a counter namespace of its own, so each connection on the
  # models socket is counted apart. Kong adds a request's tokens once its
  # reply reports them, and can also refuse a request early, on its own
  # estimate of the prompt tokens it carries.
  #
  # Kong takes the policy form from 3.14, and beside AI Proxy, which serves an
  # alias with no fallback chain, from the releases whose changelog fixed that
  # pairing, 3.14.0.7 and 3.15.0.0. The chart Recipe reads the gateway's
  # version from the image's tag as its first three numbers, which cannot tell
  # 3.14.0.7 from 3.14.0.0, so it halts on an image older than 3.15.
  #
  # The gateway tells callers apart only as the consumers an authentication
  # plugin names, and core/gateway/kong-enterprise declares no callers, because
  # the import of its routes file could not revoke one: it adds and updates
  # what the file names and removes nothing, so a consumer and its key, once
  # written, stay able to authenticate after the caller is removed from the
  # Release, and a rotated key leaves the old one working. Nor can a key-auth
  # key be held by reference, so a caller's key would reach Kong only as a
  # literal in a rendered file. So scope caller is refused rather than counted
  # per address or per header a caller writes.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_writes_the_budget: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/period-budget attachment %q on %q is bound to the Kong Gateway Enterprise realization, which only core/gateway/kong-enterprise carries out: that component's chart Recipe writes the budget into the routes it serves models on, and %s renders none for it, so nothing would be counted. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Kong counts cost only from a price the configuration gives each model,
    # in whatever unit it chooses, and the catalog supplies none.
    unit_is_a_token_count: >-
      {{- if eq .values.unit "usd" -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for unit usd, but core/gateway/kong-enterprise, which declares dataplane.aggrega.ai/period-budget: tokens, counts cost only from an input and an output price the configuration gives each model, in whatever unit it chooses, and the catalog supplies no such price, so it keeps no budget in US dollars; set unit to total_tokens, prompt_tokens or completion_tokens, or attach the Feature to a gateway that counts cost" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The gateway tells callers apart only by the consumer an authentication
    # plugin names, and declares no callers, for the reasons above.
    scope_is_one_the_gateway_keeps: >-
      {{- if eq .values.scope "caller" -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for scope caller, but core/gateway/kong-enterprise tells callers apart only as the consumers an authentication plugin names, and it declares no callers, because the import of its routes file adds and updates what the file names and removes nothing, so a consumer and its key, once written, would stay able to authenticate after the caller is removed from the Release, and a rotated key would leave the old one working; and a key-auth key cannot be held by reference, so a caller's key could reach Kong only as a literal in a rendered file. Set scope to gateway, for every model request it serves, or model, for each connection on its models socket" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The window is a number of seconds. A whole number of seconds, minutes,
    # hours or days converts exactly; a calendar month does not.
    period_is_one_the_gateway_keeps: >-
      {{- if hasSuffix "mo" .infra.period -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for a period of %s, but core/gateway/kong-enterprise counts a budget over a window of a fixed number of seconds, and a calendar month has no fixed length; set period to a number of days, as in 30d" .metadata.feature_instance .metadata.instance_id .infra.period) -}}
      {{- end -}}
    # The budget is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to count.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/period-budget attachment %q on %q needs a model route to count, but nothing is wired to the models socket of %q, so the gateway serves no model and there is nothing the budget could count; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The bundle writes one budget plugin for the gateway, or one per wired
    # model's service, and Kong keeps one instance of a plugin in each place,
    # so a second attachment could not hold beside the first.
    one_budget_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/period-budget" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/period-budget is attached to %q more than once (%s), but core/gateway/kong-enterprise writes one budget plugin for the gateway, or one on each wired model's service, and keeps one instance of a plugin in each place, so the attachments cannot each hold; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
