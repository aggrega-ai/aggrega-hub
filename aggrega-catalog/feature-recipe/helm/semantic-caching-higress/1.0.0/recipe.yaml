apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: semantic-caching-higress
  version: 1.0.0
  description: >
    Binds core/semantic-caching on the gateway core/gateway/higress to a halt
    naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file, writes no cache and binds no store.

    Higress 2.2.5 carries a semantic cache, its ai-cache plugin, but it keeps
    no caller's replies apart: every stored reply sits under one key prefix,
    set once for the plugin, followed by the prompt text taken from the
    request body, and nothing in that key names a caller or an end user. The
    gateway also declares no callers, so it identifies none. Under end_user
    and under key alike every request would share one cache, and a reply
    generated for one caller could be served to another sending a similar
    prompt. So the build halts on every attachment, naming the scope asked
    for and the caller separation the cache lacks. With nothing wired to the
    models socket the gateway serves no model route to cache, and it halts
    saying so. It halts on any component other than core/gateway/higress.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write keeps callers apart.
  #
  # What the gateway would cache under, read in Higress's source at v2.2.5,
  # the release the gateway's Recipe pins, from which its ai-cache module
  # 2.0.3 is built. The plugin stores a reply under its key prefix, one value
  # for the whole plugin, higress-ai-cache: unless set, followed by the text
  # its key strategy takes from the request body — the last question, or
  # every question joined — and, for a match by meaning, compares the vector
  # of that text with those its vector store holds. The only request headers
  # it reads are one that skips the cache and the content type; no setting
  # adds a caller, a consumer or an end user to the key, and the gateway
  # declares no callers, so it verifies none to keep apart. Under end_user,
  # which keeps each end user the gateway identifies apart, and under key,
  # which keeps apart the callers presenting each key, every request would
  # share one cache, a reply generated for one caller served to another
  # under a name that says it is not.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the caller separation the
    # cache lacks; with none, for the model route the gateway does not serve.
    gateway_keeps_callers_apart: >-
      {{- $scope := toString (optional .values "scope" "end_user") -}}
      {{- $asked := ternary "end_user, which keeps each end user the gateway identifies apart" "key, which keeps apart the callers presenting each key to the gateway" (eq $scope "end_user") -}}
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for scope %s, but Higress's semantic cache, its ai-cache plugin, keeps no caller's replies apart: every stored reply sits under one key prefix set for the whole plugin, followed by the prompt text taken from the request body, and nothing in that key names a caller or an end user; core/gateway/higress also declares no callers, so it identifies none. Every request would share one cache, and a reply generated for one caller could be served to another sending a similar prompt; remove the attachment" .metadata.feature_instance .metadata.instance_id $asked) -}}
      {{- else -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be cached; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
