# Content pins for this entity's external inputs, written by `aggrega pin`.
# Commit it beside the entity. Run `aggrega pin` on the entity again to bring it up to date.
version: 1
localSourceDigests:
  - path: chart/Chart.yaml
    digest: sha256:ad95ca70f65eb9f349161e9e27d5468448c96a547586dd03bd95de30cb2aa95f
  - path: chart/templates/secret.yaml
    digest: sha256:a8638ef50591fbdab3393977ec3a9e7d54cb1d855e433a8505d3b3605bbc601b
ignore:
  plugin:
    name: provider/helm
    patterns:
      - .git/
      - .hg/
      - .svn/
      - .bzr/
      - templates/.?*
    files:
      - .helmignore
  rules:
    - pattern: .git/
      within: chart
      from: plugin
    - pattern: .hg/
      within: chart
      from: plugin
    - pattern: .svn/
      within: chart
      from: plugin
    - pattern: .bzr/
      within: chart
      from: plugin
    - pattern: templates/.?*
      within: chart
      from: plugin
