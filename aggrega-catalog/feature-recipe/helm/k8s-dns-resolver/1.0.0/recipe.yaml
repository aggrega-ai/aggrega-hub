apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: k8s-dns-resolver
  version: 1.0.0
  description: >
    Helm implementation of core/k8s-dns-resolver. Inject-only: before the base
    Recipe renders, the injectMapping qualifies the consumer's injected host
    with the target's Kubernetes namespace, producing the cross-namespace
    in-cluster DNS name (service.namespace). It reads the target's namespace
    from the consumer's resolved connection to that target, and falls back to
    the "default" namespace when none is set — matching where the helm provider
    deploys an unannotated workload, so the qualified host is always reachable
    and never malformed. Only the consumer's inject pipe is rewritten; the
    target's published host is untouched.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/k8s-dns-resolver:1.0.0

  # Pre-render interception. Steps: (1) read the base host already injected
  # under target_var; (2) find the connection that injected target_var (env-var
  # names are unique within a container, so this is unambiguous); (3) read that
  # target's namespace; (4) coalesce an absent namespace to "default" (where the
  # helm provider deploys an unannotated workload); (5) emit the qualified host
  # back under the same variable — but only when a target connection and a base
  # host were actually found, so a target_var that matches no connection (an Ops
  # typo) injects nothing rather than a spurious malformed variable. The base
  # host is escaped for the quoted scalar it is written into, so a quote or a
  # backslash in it is delivered as it arrived rather than breaking the mapping.
  injectMapping: |
    {{- $base_host := optional .context.inject.env .infra.target_var "" }}
    {{- $target_edge := dict }}
    {{- range $alias, $edge := .context.uses }}
      {{- if hasKey $edge.inject.env $.infra.target_var }}
        {{- $target_edge = $edge }}
      {{- end }}
    {{- end }}
    {{- $ns := "default" }}
    {{- if $target_edge.annotations }}
      {{- $raw := optional (optional (default dict $target_edge.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict $target_edge.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    {{- if and $target_edge $base_host }}
    env:
      "{{ .infra.target_var }}": "{{ $base_host | replace "\\" "\\\\" | replace "\"" "\\\"" }}.{{ $ns }}"
    {{- end }}
