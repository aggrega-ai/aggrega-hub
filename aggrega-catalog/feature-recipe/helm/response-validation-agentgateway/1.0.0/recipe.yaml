apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: response-validation-agentgateway
  version: 1.0.0
  description: >
    Binds core/response-validation on the gateway core/gateway/agentgateway
    to a halt naming why the gateway cannot honour it; a Release binds it in
    its Manifest. It emits no file and writes no check.

    agentgateway 1.6.0 checks no model reply against a JSON Schema. What it
    runs on a reply is its guards: a regular-expression guard, a
    content-safety service it calls, or a webhook of the operator's own, none
    of them a schema check this realization could write. So the build
    halts on every attachment, naming the check the gateway lacks. With
    nothing wired to the models socket the gateway serves no model route
    whose replies could be checked, and it halts saying so. It halts on any
    component other than core/gateway/agentgateway. The compose realization
    of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/response-validation:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway has
  # no check of this kind to turn on.
  #
  # What the gateway offers, read in agentgateway's source, configuration
  # schema and reference at v1.6.0, the release the gateway's Recipes pin. A
  # reply passes through the response guards its configuration lists: a
  # regular-expression guard, AWS Bedrock Guardrails, Google Model Armor,
  # Azure AI Content Safety, or a webhook the operator runs. None of them takes a JSON Schema, and the gateway's configuration
  # holds no setting that checks a reply against one; a webhook could only
  # carry such a check in a service the catalog does not provide.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/response-validation attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the schema check the
    # gateway lacks; with none, for the model route the gateway does not
    # serve.
    gateway_checks_a_reply_against_a_schema: >-
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for each model reply to be checked against a JSON Schema before it reaches the caller, but core/gateway/agentgateway checks no reply against a schema: its response guards match patterns or call a content-safety or webhook service, and none of them takes a schema; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for model replies to be checked, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be checked; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
