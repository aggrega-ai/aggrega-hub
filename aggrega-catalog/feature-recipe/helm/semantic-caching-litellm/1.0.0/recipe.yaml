apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: semantic-caching-litellm
  version: 1.0.0
  description: >
    Realizes core/semantic-caching on the AI gateway core/gateway/litellm; a
    Release binds it in its Manifest. It writes the gateway's own cache
    setting into the configuration the gateway's Recipe renders, and emits no
    file. The gateway keeps its replies in the core/datastore/redis wired to
    its cache_store socket, reached over TLS while it publishes redis-tls,
    turns each prompt into a vector with
    embedding_model, an alias of its model map, and serves a stored reply
    whose prompt is at least similarity_threshold alike; the store removes a
    reply ttl_seconds after it was stored. Chat requests, streamed or not, and
    responses and messages requests are cached; completions, embeddings and
    every other kind of request are not.

    Replies are kept apart by the key each request presents, which the
    gateway verifies and a request cannot name for itself. Under scope
    end_user it also keeps apart the end users requests name, in an
    x-litellm-end-user-id or x-litellm-customer-id header or in the body's
    user, metadata.user_id, litellm_metadata.user or safety_identifier field.
    The gateway verifies none of them, so a caller naming another end user is
    served that end user's replies, and a request naming none shares one
    cache with every other request naming none under the same key. Under
    scope key the end user is left out, though the body's user field, a
    request parameter, still keeps apart requests naming different ones.

    The build halts unless the gateway's api_key slot is attached and its
    cache_store socket wired, on an embedding_model the map does not publish,
    on a second such attachment on one gateway, and when the attachment is
    carried by any component other than core/gateway/litellm.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: the checks and the pipeline run once
  # per attached component and receive that component's rendered documents.
  #
  # How the gateway keeps the cache. For each request of a cached kind it turns
  # the prompt into a vector by sending it to embedding_model through its own
  # model map, the same alias a caller could ask for, and searches the store
  # for the closest reply stored under the request's own bucket. A reply whose
  # prompt is at least similarity_threshold alike, as a cosine similarity, is
  # returned in place of a model call; any other request is answered by the
  # model and its reply stored with that vector. The bucket is made of the
  # request's model and its other parameters, the body's user field among
  # them, together with the identity the gateway writes into the request
  # itself: the hash of the key the caller presented, which the gateway
  # verifies, that key's team and organization, and, under scope end_user, the
  # end user the request names. So a request differing from a stored one in
  # any of them, a temperature among them, does not share its replies. Every
  # stored reply is written with ttl_seconds as its lifetime in the store,
  # which then removes it, so a reply older than that is never served and the
  # next request for that prompt is answered by the model and stored afresh. A
  # caller cannot change whose key a bucket is kept under: the identity fields
  # are the gateway's own — where it writes them into the caller's metadata
  # its value replaces any the caller wrote, and where it keeps the caller's
  # metadata apart, as on the responses and messages routes, it removes the
  # team, organization and end user fields a caller wrote there and the
  # request guard refuses a request naming the key's hash there,
  # metadata.user_api_key. The request guard every Recipe running this gateway
  # delivers refuses a request's cache field as well. A caller can still move
  # a request among the buckets of the key it presented, through three fields
  # of its own metadata the guard admits: model_group, on the responses route,
  # labels the bucket with the name it gives in place of the request's model;
  # caching_groups, a list of groups of model aliases, lets requests naming
  # the same group share replies across the aliases in it, though they ask
  # for different models, on the responses and messages routes; and
  # redis_namespace, on the responses and chat routes, keeps requests naming
  # a namespace apart from those naming none and together with those naming
  # the same one. On the other cached routes the gateway overwrites the field
  # or does not act on it. None of the three moves a request into another
  # key's bucket. A reply served from the cache carries the bucket's hash in
  # an x-litellm-cache-key header.
  #
  # Which requests are cached. A reply to a prompt is what the Feature stores,
  # so the configuration names the chat completions, responses and messages
  # requests, the kinds whose prompt the cache reads; a chat request is cached
  # whether or not its reply is streamed. A completions request carries its
  # prompt where the cache does not read one, so it is never cached and is not
  # named. Left to its own default, the gateway would also store the reply to
  # every embeddings request in the cache, sending each input to
  # embedding_model a second time to do so, while serving none of those
  # replies back; naming the kinds keeps embeddings out of the store and out
  # of the extra call.
  #
  # How an end user is told apart, and what that is worth. The gateway reads an
  # end user from the request: first an x-litellm-customer-id or
  # x-litellm-end-user-id header, then the body's user field, then
  # litellm_metadata.user, then metadata.user_id, then safety_identifier. A
  # request naming none is stored and served under the key alone, so every
  # request naming no end user shares one cache with the others presenting the
  # same key. None of these is checked against anything: whoever presents the
  # key can name any end user and be served what was stored for that end user.
  # Without an administrative key the key itself would be the caller's own
  # claim too, so this recipe requires one: with api_key attached, a caller
  # presenting no key, or a key the gateway did not issue, is refused before
  # the cache is read.
  #
  # The store's address reaches the gateway from the cache_store edge, as two
  # variables its own Recipe writes and the locals it publishes name, and this
  # recipe writes only the names of those variables, which the gateway
  # resolves when it starts. The password is read by the cache from
  # REDIS_PASSWORD, which that Recipe delivers from the credential on the
  # cache_store connection as a secret reference, or empty with none. For a
  # store publishing redis-tls that Recipe writes one variable instead, the
  # cache's whole connection URL with the password in it as a reference the
  # container expands, and this recipe names that variable. The
  # cache connects to the store when it first serves a request, not when the
  # gateway starts. A store it
  # cannot use — one wanting a password it was not given, one refusing a
  # password it was given, one lacking the commands it needs — makes every
  # lookup a miss and stores nothing, while every request is still answered by
  # the model and only the gateway's own log says so.
  #
  # Each assertion reads what the gateway was given from what this check sees:
  # the attachments the host carries, its credential slots among them, the
  # sockets wired on it and the connections on them, and the locals its Recipe
  # publishes; the guard at the top keeps those the LiteLLM gateway's.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/litellm and core/gateway/litellm:1.0.0 are the same host.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/litellm" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the LiteLLM realization, which writes its cache into the configuration body core/gateway/litellm renders; %s renders no such body. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Without an administrative key the gateway checks no caller, so the key a
    # bucket is made of would be whatever the caller sent, and anyone repeating
    # another caller's claims would be served that caller's replies.
    gateway_checks_the_caller: >-
      {{- if not (hasKey .features "api_key") -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q needs core/gateway/litellm to check every caller's key before a cached reply is served, but its api_key credential slot is not attached, so the gateway checks no caller and a cache bucket would be made only of what each caller claims. Attach a credential to the api_key slot of %q" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The replies live in the store wired to the gateway's cache_store socket;
    # with none, the cache's configuration would name an address nothing sets.
    store_is_wired: >-
      {{- if not (hasKey .uses "cache_store") -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q needs a store for the replies core/gateway/litellm caches, but nothing is wired to its cache_store socket; wire a core/datastore/redis to the cache_store socket of %q" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The variables the cache configuration names are published by the
    # gateway's own Recipe; a Recipe publishing none would leave the cache
    # naming variables nothing sets.
    store_address_is_delivered: >-
      {{- if not (and (optional .locals "cache_store_host_variable" "") (optional .locals "cache_store_port_variable" "")) -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q needs the store's address in the gateway's environment, which core/gateway/litellm's Recipe delivers from the cache_store edge, but the Recipe rendering %q delivers none; bind the component in the Manifest to a Recipe that does" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The gateway embeds each prompt through its own model map, so the model
    # named must be an alias the map publishes: an alias of its hand-typed
    # entries, from the local its Recipe publishes, or of a model wired to its
    # models socket, from the host's connections there.
    embedding_model_is_a_mapped_alias: >-
      {{- $published := fromJson (optional .locals "model_aliases" "[]") -}}
      {{- range $alias, $connection := (optional .uses "models" dict) -}}
      {{- $published = append $published $alias -}}
      {{- end -}}
      {{- if not (has .values.embedding_model $published) -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q names %q as its embedding_model, but the model map of core/gateway/litellm publishes no such alias, so the gateway could not turn a prompt into a vector and would cache nothing; name an alias the map publishes: %s" .metadata.feature_instance .metadata.instance_id .values.embedding_model (join ", " $published)) -}}
      {{- end -}}
    # The gateway has one cache, and this recipe writes its whole setting, so a
    # second attachment on the same gateway would replace the first's.
    one_cache_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/semantic-caching" -}}
      {{- $names = append $names $name -}}
      {{- end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/semantic-caching is attached to %q more than once (%s), but core/gateway/litellm keeps one cache and each attachment writes its whole setting, so all but one would be replaced; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
  pipeline:
    # One step writes the two settings into litellm_settings, the section the
    # gateway reads its cache from: cache turns it on, and cache_params is the
    # whole cache configuration, replaced as one setting. The store's host and
    # port are named through the gateway's environment indirection, never
    # written as values here. The index the store keeps the replies in is
    # named for the component and the attachment, so two gateways of one
    # Release sharing a store keep separate indexes. The similarity threshold
    # is written as the cosine similarity the attachment gives, which the
    # gateway converts to the distance the store searches by. While the store
    # wired to cache_store publishes redis-tls, the cache is named its whole
    # connection URL instead of the host and port, through redis_url, the one
    # setting through which it connects over TLS: the variable the gateway's
    # Recipe writes that URL under, which its cache_store_url_variable local
    # names, and the build halts where that Recipe publishes no such local.
    # The protocol is read here from the connection as the Recipe reads it,
    # because a pipeline step and a Recipe's template are separate templates
    # and neither can hand the other what it decided.
    - id: write_semantic_cache
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        {{- $urlVariable := "" }}
        {{- range $alias, $edge := .context.uses }}{{ if and (eq $edge.socket "cache_store") (eq (toString (optional (default dict $edge.provides) "protocol" "")) "redis-tls") }}{{ $urlVariable = optional $.locals "cache_store_url_variable" "" }}{{ if not $urlVariable }}{{ fail (printf "core/semantic-caching attachment %q on %q is wired to a store publishing redis-tls, which the cache reaches only through a whole connection URL, but the Recipe rendering %q names no variable it delivers that URL under in a cache_store_url_variable local; bind the component in the Manifest to a Recipe that does" $.attachment_name $.context.instance_id $.context.instance_id) }}{{ end }}{{ end }}{{ end }}
        section: litellm_settings
        settings:
          cache: true
          cache_params:
            type: redis-semantic
        {{- if $urlVariable }}
            redis_url: os.environ/{{ $urlVariable }}
        {{- else }}
            host: os.environ/{{ .locals.cache_store_host_variable }}
            port: os.environ/{{ .locals.cache_store_port_variable }}
        {{- end }}
            redis_semantic_cache_index_name: {{ printf "%s-%s" .context.instance_id (.attachment_name | replace "_" "-") | toJson }}
            redis_semantic_cache_embedding_model: {{ .values.embedding_model | toJson }}
            similarity_threshold: {{ .values.similarity_threshold }}
            ttl: {{ .values.ttl_seconds }}
            semantic_cache_scope: {{ optional .values "scope" "end_user" }}
            supported_call_types: [acompletion, completion, aresponses, responses, aanthropic_messages, anthropic_messages]
