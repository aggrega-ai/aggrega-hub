apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: generated-secret
  version: 1.0.0
  description: >
    Helm realization of core/generated-secret. Pure wiring: it declares nothing
    but the capability it binds to and the Feature it implements, and renders no
    resource of its own. It is for a controller-driven Recipe that hands the
    credential to its controller: helm/mariadb-cluster with infra.credentials set
    to generated emits a MariaDB custom resource naming no root-password Secret,
    and the mariadb-operator controller generates the password into a Secret it
    creates and owns. Binding the component's required credential slot here says
    the controller owns the material, so no value is authored, none travels the
    inject pipe, and no Secret is emitted.

    Bind it only where the Recipe leaves the credential to its controller. The
    synthesis helm/mariadb delivers its credential slots itself, so it cannot
    take this binding and the build halts. helm/postgres-cloudnative-pg, whose
    controller also owns its credentials, realizes a Component whose credential
    slots are optional and refuses any attachment on them, so there they are left
    unbound instead.

    The name generated-secret is shared with the terraform and cloudformation
    realizations of the same Feature, so a Manifest references this one
    provider-qualified, as helm/generated-secret:1.0.0. A bare
    generated-secret:1.0.0 matches more than one and resolves to none, and the
    pull halts on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/generated-secret:1.0.0
  # DELIBERATE NEAR-DUPLICATE of the terraform and cloudformation realizations of
  # the same name. All three are identical but for spec.capability, because the
  # Feature declares no values and no provides: there is nothing to map, so
  # nothing here depends on the target. What differs is who owns the credential
  # on each target, and that lives in the component's Recipe, never here. There is
  # no single home available for the pair of lines they share — a FeatureRecipe
  # names exactly one capability, and spec.capability and spec.implements take no
  # $import: — so if the Feature's contract changes, change all three in the same
  # edit.
