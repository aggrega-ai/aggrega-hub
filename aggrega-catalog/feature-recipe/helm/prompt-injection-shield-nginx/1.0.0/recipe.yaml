apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-injection-shield-nginx
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/prompt-injection-shield on the NGINX
    gateway, core/gateway/nginx, on Kubernetes. It emits no file: it points
    the proxy_pass target the gateway's Recipe writes at the guard wired to
    the gateway's guard socket, in place of the component on its upstream
    socket, so every request the gateway forwards goes to the guard. The guard
    checks each chat request and forwards what it admits to the model its own
    infra.upstream_endpoint names, which the Release sets to the model the
    upstream socket names; it answers no completions, embeddings, responses or
    messages route, and its model listing passes the caller's Authorization
    header to the model's.

    The guard must be core/security/nemo-guardrails running the threshold the
    sensitivity names, 0.5 for standard and 0.001 for strict, the values
    measured for its detector's default classifier. The build halts otherwise,
    with nothing on the guard socket, naming it, with more than one guard, on
    a second attachment, beside core/traffic-shadowing, whose copies would
    bypass the guard, and on any component other than core/gateway/nginx.

    The guard reads only the latest user message, and judges no reply,
    tool-call argument or image. A request it refuses is answered with an
    ordinary completion, streamed when asked; when the guard or its detector
    cannot be reached the request is refused and nothing reaches the model.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-injection-shield:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # Where the route changes. The NGINX Recipe writes one server block whose one
  # location forwards to the host and port it reads from two variables of the
  # gateway's inject pipe, which its locals name and the Aggregate fills from
  # the upstream edge. This recipe's injectMapping writes those two variables,
  # before the Recipe renders, with the host and port the guard wired to the
  # guard socket publishes, so the location forwards to the guard instead, and
  # nothing else of the configuration changes. NGINX does not read the body,
  # so every request on the location goes to the guard whatever its path: the
  # guard checks chat completions, forwards what it admits to the model API its
  # own infra.upstream_endpoint names and answers what it refuses itself, an
  # ordinary completion carrying "I'm sorry, I can't respond to that.", with
  # nothing of the request reaching the model. It answers a completions,
  # embeddings, responses or messages request 404, and serves its own model
  # listing, which asks the model's listing and passes it the caller's
  # Authorization header, its health and configuration listings, and its check
  # routes, which call no model. The guard reaches the model the
  # upstream socket names only through its own setting, so the Release sets
  # the guard's infra.upstream_endpoint to that model's endpoint.
  #
  # What the guard checks, measured on core/security/nemo-guardrails in front of
  # core/security/trustyai-huggingface-detector running its default classifier:
  # the latest user message of each chat request, plain or streamed; a system
  # message, an earlier turn and a tool result are forwarded unread, and the
  # model's reply, tool-call arguments and images are not judged. Through this
  # gateway, at its pinned image, attempts to override the model's instructions
  # were refused and ordinary requests served with their messages unchanged,
  # streamed or not. A caller's request body cannot switch the check off: NGINX
  # forwards it as sent, and the guard's own configuration refuses that. When
  # the detector cannot be reached the guard refuses the request, a
  # plain one with a completion reporting an internal error and a streamed one
  # with a stream carrying no text; when the guard itself cannot be reached
  # NGINX answers 502. Neither reaches the model, and the configuration names no
  # server but the guard.
  #
  # The sensitivity, and the threshold it names. The guard refuses when its
  # detector scores a label it blocks at or above values.threshold, which the
  # guard publishes. 0.5 for standard and 0.001 for strict are the values
  # measured for the detector's default model, whose scores sit close to 0 or
  # close to 1: at 0.5 the guard refuses plain attempts to override a model's
  # instructions; at 0.001 it also refuses one respelled in leetspeak, and some
  # ordinary requests with it. The gateway reaches the guard and not the
  # detector behind it, so this recipe checks the threshold the guard runs and
  # cannot tell which model its detector loaded; under another model the two
  # numbers are measured again, and the same two numbers carry a different
  # meaning. The table is held by each realization of this Feature — this
  # recipe's compose counterpart and prompt-injection-shield-litellm state the
  # same two numbers — because each renders against a different gateway and no
  # surface is read by all three; change all of them together, and the guard's
  # own description of its threshold with them.
  #
  # Neither assertion can read the host component's labels, so what the
  # gateway is able to do is stated in the messages, and the check of the host's
  # type above them is what keeps those statements true.
  locals:
    sensitivity_thresholds: '{"standard": 0.5, "strict": 0.001}'
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/nginx and core/gateway/nginx:1.0.0 are the same host.
    component_forwards_through_the_guard: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/nginx" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to the NGINX realization, which points the proxy_pass target core/gateway/nginx renders at a guard; %s renders no such target. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The compiler never brings a guard on its own: the requests are sent
    # through the one wired to the guard socket, and with none the shield could
    # only be ignored.
    guard_is_wired: >-
      {{- if not (hasKey .uses "guard") -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q needs a guard to send the gateway's requests through, but nothing is wired to its guard socket; wire a core/security/nemo-guardrails to the guard socket of %q" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The location forwards to one guard at one threshold, so two attachments,
    # at two sensitivities or at one, cannot each hold.
    one_shield_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-injection-shield" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/prompt-injection-shield is attached to %q more than once (%s), but core/gateway/nginx forwards its one location to one guard at one threshold, so the attachments cannot each hold; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
    # A core/traffic-shadowing attachment makes the location copy every request
    # it forwards to a service of its own, which the guard never sees.
    no_unchecked_copy: >-
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/traffic-shadowing" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q sends the gateway's requests through a guard, but the core/traffic-shadowing attachment %q copies every request the gateway forwards to a service of its own, unchecked; keep only one of the two attachments" $.metadata.feature_instance $.metadata.instance_id $name) -}}
      {{- end -}}
      {{- end -}}
  # Evaluated before the NGINX Recipe renders, with the guard edge and what the
  # guard publishes, which an assertion cannot read. One guard; the NeMo
  # Guardrails guard and no other, because the two sensitivities are measured
  # on it, and core/security/trustyai-guardrails-gateway, the other guard the
  # socket's selector admits, honours no threshold below its detector's own
  # 0.5, sends a refused request's text to the model server's tokenizer route,
  # and serves its route under a path this location would not reach; the
  # threshold the guard runs equal to the one the sensitivity names, compared as
  # a number; and the two variable names read from the NGINX Recipe's own
  # locals, so a Recipe that names none halts here rather than leave the
  # location forwarding past the guard. Then it writes the guard's host and port
  # under those two names.
  injectMapping: |
    {{- $guards := list }}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "guard" }}{{ $guards = append $guards $edge }}{{ end }}{{ end }}
    {{- if ne (len $guards) 1 }}{{ fail (printf "core/prompt-injection-shield attachment %q on %q needs exactly one guard, but %d components are wired to the gateway's guard socket; wire a single core/security/nemo-guardrails to it" .attachment_name .context.instance_id (len $guards)) }}{{ end }}
    {{- $guard := first $guards }}
    {{- $type := first (splitList ":" (toString $guard.component)) }}
    {{- if ne $type "core/security/nemo-guardrails" }}{{ fail (printf "core/prompt-injection-shield attachment %q on %q is wired to the guard %q, a %s, but this realization sends the gateway's requests through core/security/nemo-guardrails alone, the one guard its two sensitivities are measured on and proved to refuse a request without the model's server receiving it; wire a core/security/nemo-guardrails to the guard socket instead" .attachment_name .context.instance_id $guard.target $type) }}{{ end }}
    {{- $want := optional (fromJson .locals.sensitivity_thresholds) (toString .values.sensitivity) "" }}
    {{- $have := optional $guard.provides "threshold" "" }}
    {{- if not $have }}{{ fail (printf "core/prompt-injection-shield attachment %q on %q is wired to the guard %q, which publishes no threshold, so the sensitivity it refuses at cannot be checked; bind %q in the Manifest to a Recipe that publishes one" .attachment_name .context.instance_id $guard.target $guard.target) }}{{ end }}
    {{- if ne (float64 $have) (float64 $want) }}{{ fail (printf "core/prompt-injection-shield attachment %q on %q asks for sensitivity %s, which this realization runs as the guard's threshold %v, but the guard %q runs at %v; set values.threshold of %q to %v" .attachment_name .context.instance_id (toString .values.sensitivity) $want $guard.target $have $guard.target $want) }}{{ end }}
    {{- $hostVar := optional .locals "upstream_host_variable" "" }}
    {{- $portVar := optional .locals "upstream_port_variable" "" }}
    {{- if not (and $hostVar $portVar) }}{{ fail (printf "core/prompt-injection-shield attachment %q on %q points the gateway's proxy_pass target at the guard through the two variables the NGINX Recipe names in its locals, but the Recipe rendering %q names none; bind the component in the Manifest to a Recipe that does" .attachment_name .context.instance_id .context.instance_id) }}{{ end }}
    env:
      {{ $hostVar }}: {{ $guard.provides.host | toJson }}
      {{ $portVar }}: {{ $guard.provides.port | toJson }}
