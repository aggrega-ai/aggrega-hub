apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-injection-shield-agentgateway
  version: 1.0.0
  description: >
    Binds core/prompt-injection-shield on the gateway
    core/gateway/agentgateway to a halt naming why the gateway does not keep
    it; a Release binds it in its Manifest. It emits no file, writes no guard
    and routes nothing through one.

    agentgateway 1.6.0 judges a request for an attempt to override a model's
    instructions only through a service it calls: a webhook the operator
    runs, or a hosted service — Azure AI Content Safety, whose jailbreak
    detection it can turn on, Google Model Armor or AWS Bedrock Guardrails,
    each judging by a policy defined in that service. This realization wires
    none of them, and it sends no model request through a guard, so nothing
    would check the requests. Its regular-expression guard, which
    core/prompt-deny-patterns turns on, matches patterns rather than judging
    with a classifier. So the build halts on every attachment, naming the
    sensitivity asked for. It halts on any component other than
    core/gateway/agentgateway. The compose realization of the gateway has no
    realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-injection-shield:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization writes checks a request for an attempt to override a model's
  # instructions.
  #
  # What the gateway offers, read in agentgateway's configuration schema and
  # reference at v1.6.0, the release the gateway's Recipes pin. A request
  # guard is a regular-expression guard or a call to a service: a webhook,
  # sent the request's text at an address the configuration names and
  # answering with a verdict; OpenAI's moderation, whose categories are kinds
  # of harmful content; Azure AI Content Safety, whose jailbreak detection
  # reads the user's prompts and is on or off; Google Model Armor and AWS
  # Bedrock Guardrails, each applying a policy defined in that service. Every
  # such call refuses the request when the service cannot be reached, unless
  # the guard is set to let it through. The shield sends a request through a
  # guard at a sensitivity, and the realizations on core/gateway/litellm and
  # core/gateway/nginx send their traffic through core/security/nemo-guardrails,
  # which forwards what it admits to the one model its own configuration
  # names; every model this gateway serves is wired to its models socket and
  # reached at that model's own endpoint, so that shape would serve one model
  # alone. No component this catalog provides answers agentgateway's webhook.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts, whatever is wired, naming the sensitivity asked
    # for and what the gateway would need.
    gateway_checks_requests_for_injection: >-
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q asks for model requests to be checked for an attempt to override a model's instructions, at sensitivity %s, but core/gateway/agentgateway judges a request that way only through a service it calls — a webhook the operator runs, or Azure AI Content Safety, Google Model Armor or AWS Bedrock Guardrails — and this realization wires none of them and sends no request through a guard, so nothing would check the requests; its regular-expression guard, which core/prompt-deny-patterns turns on, matches patterns rather than judging with a classifier. Remove the attachment, or attach the shield to core/gateway/litellm or core/gateway/nginx, whose realizations send the requests through a guard" .metadata.feature_instance .metadata.instance_id (toString (optional .values "sensitivity" "standard"))) -}}
