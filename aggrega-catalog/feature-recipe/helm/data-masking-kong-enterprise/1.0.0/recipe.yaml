apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: data-masking-kong-enterprise
  version: 1.0.0
  description: >
    Realizes core/data-masking on the gateway core/gateway/kong-enterprise; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe writes Kong's AI PII Sanitizer onto each wired model's routes, and
    the sanitizer sends the text it masks to the Kong PII service wired to the
    pii_sanitizer socket, failing the request when that service cannot be
    reached or errs. action redact replaces each match with a numbered
    placeholder; refuse, from Kong 3.12, refuses a request carrying one.
    Replies are masked from 3.12, and a request for a streamed reply is then
    refused. Reply text not sent as the one string the OpenAI API returns
    passes unread; a wired model not labelled as speaking that API halts the
    build.

    Kong's sanitizer reads the text of the user's turns, a completion's
    prompt and a reply's message text, and refuses or withholds nothing it
    does not read, so each strict default is refused by name and an
    attachment builds once it relaxes them, letting through unmasked: under
    allow_unmasked_text, a request's other turns, tool calls and other fields;
    under allow_non_text_content, its images, files and audio; under
    allow_unmasked_reply_parts, a reply's tool calls, refusal, audio, token
    probabilities and a failed call's reply; under mask_reasoning false, its
    reasoning. Patterns need placeholder_shows_name false under redact. It
    refuses restore, refuse on replies, allow_streamed_replies and entity
    types outside Kong's categories.

    Kong sells the plugin under its AI Gateway Enterprise entitlement, which no
    build can verify and without which Kong skips it silently, so the
    gateway's Recipe halts until infra.ai_gateway_entitled affirms it. No build
    proves that a running gateway masks.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/data-masking:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: the configuration an attachment asks for is
  # written by the KongModelRoutes bundle the gateway's chart Recipe imports,
  # which reads the attachment and the address the one pii_sanitizer
  # connection publishes, and writes Kong's AI PII Sanitizer onto each wired
  # model's chat and completion routes. Kong runs a route's plugins by
  # priority, so the sanitizer reads a request after the request transformer
  # and before the AI proxy sends it on. The entity types are Kong's own
  # categories and the patterns its custom patterns, each with a score of 1;
  # the sanitizer sends the text and both lists to the PII service, which
  # finds the matches. stop_on_error is written on, so a PII service that
  # cannot be reached or answers with an error fails the request, which the
  # error handling Kong ships for its AI plugins answers with HTTP 500:
  # nothing of a request is forwarded, and nothing of a reply delivered.
  # What stays here is what that bundle cannot honour and an assertion can
  # see; the release floors are the gateway's chart Recipe's, read from the
  # tag of the image the Release names.
  #
  # What it honours:
  # - action redact: each match is replaced for good by a numbered
  #   placeholder, PLACEHOLDER followed by a number, one value taking one
  #   number within a text; nothing is restored.
  # - action refuse, with scope request: Kong's block_if_detected, from Kong
  #   3.12, refuses with HTTP 400 a request in which the PII service finds a
  #   listed entity type or pattern, before anything of it is forwarded.
  # - scope request from Kong 3.10, and response or both from 3.12, the
  #   release that added the setting naming what the sanitizer masks. While
  #   replies are masked, the AI proxy refuses with HTTP 400, before
  #   forwarding, a request asking for a streamed reply, so a masked reply
  #   always reaches the caller whole; allow_streamed_replies is honoured off.
  # - placeholder_shows_name false: the numbered placeholder is accepted.
  #
  # What the sanitizer reads, as the text extraction Kong ships for it reads:
  # in a request, the text of each turn the user wrote, as one string or as
  # the text blocks of a list, and a completion's prompt or an input given as
  # one string; in a reply, the message text of each chat choice, where it is
  # one string, as the OpenAI API returns it, and the text of each completion
  # choice. Kong's reference does not say that its sanitizer reads the turns of
  # any other role. A chat choice whose message text arrives in another form,
  # a list of parts say, is passed to the caller unread, its own text
  # unmasked, whatever allow_unmasked_reply_parts says. That is not the form
  # the OpenAI API returns, so it takes a model answering outside that API,
  # and the guard is the gateway Component's: a model wired to it whose
  # model.aggrega.ai/api is not openai halts the build.
  #
  # What each relaxation lets through unmasked. Kong's reference names no
  # setting that refuses a request for text the sanitizer does not read, or
  # withholds what it does not read of a reply, so each of the Feature's
  # protections Kong cannot give is refused by name below while it stays at
  # its default, and an attachment builds once the Release relaxes it:
  # - allow_unmasked_text, with scope request or both, lets reach the model
  #   provider as the caller sent it: every turn the user did not write — the
  #   system or developer prompt, the assistant's earlier replies, the results
  #   of tool calls; the arguments of the tool calls an earlier turn carries;
  #   every field of a request beside its messages and its prompt; a
  #   completion request whose prompt is a list rather than one string; a
  #   request holding a user turn in a shape the extraction does not read,
  #   which Kong's reference does not say is refused; and, on a release before
  #   3.14, whose changelog records a change to which messages are read, any
  #   earlier turn that release's sanitizer leaves unread.
  # - allow_non_text_content, with scope request or both, lets reach the model
  #   provider as the caller sent them: a request's images, files and audio,
  #   and the addresses they are given by.
  # - allow_unmasked_reply_parts, with scope response or both, lets reach the
  #   caller as the provider sent them: a reply's tool calls and their
  #   arguments, a refusal, spoken audio and its transcript, the probabilities
  #   of the tokens the model chose with the tokens themselves, annotations a
  #   provider adds, and the reply to a failed call, which can quote the
  #   request or the reply.
  # - mask_reasoning false, with scope response or both, lets reach the caller
  #   the reasoning a reasoning model returns beside its message.
  #
  # What it keeps out of the gateway's own log: nothing. The gateway's Recipe
  # configures no logging plugin, and a PII service's error message is written
  # to the gateway's error log.
  #
  # Kong's sanitizer takes the categories general (person names, locations
  # and organizations), phone, email, creditcard, crypto, date, ip, nrp, ssn,
  # url, medical, driverlicense, passport, bank, nationalid and credentials as
  # its entity types; custom is how it turns its regular expressions on,
  # domain is one Kong has deprecated in favour of url, and all and
  # all_and_credentials stand for every category, so those four are refused as
  # entity types and the categories are listed instead.
  #
  # No build proves that a running gateway masks anything, or that the
  # sanitizer, whose handler Kong ships compiled, does what its reference and
  # its shipped extraction say: that needs a gateway running under a licence.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_writes_the_masking: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/data-masking attachment %q on %q is bound to the Kong Gateway Enterprise realization, which only core/gateway/kong-enterprise carries out: that component's chart Recipe writes the sanitizer into the routes it serves models on, and %s renders none for it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Kong's sanitizer can restore what it replaced, but it numbers its
    # placeholders in a way its reference does not show maps each one back to
    # its own original, so restore is refused rather than risk handing a
    # caller another person's value.
    restore_is_refused: >-
      {{- if eq (optional .values "action" "redact") "restore" -}}
      {{- fail (printf "core/data-masking attachment %q on %q asks for action restore, but core/gateway/kong-enterprise, which declares dataplane.aggrega.ai/content-masking: entity-recognition, replaces each match with a numbered placeholder that Kong's reference does not show maps back to its own original, so restoring could hand the caller one person's value where another's was written; set action to redact, which replaces each match for good, or to refuse with scope request, which refuses a request carrying one" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # refuse is Kong's block_if_detected, which its reference describes as
    # refusing a request in which the PII service finds what it was asked to
    # find; it does not show the setting withholding a reply that carries a
    # match, so refuse is honoured on requests alone.
    refuse_reaches_requests_only: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- if and (eq (optional .values "action" "redact") "refuse") (ne $scope "request") -}}
      {{- fail (printf "core/data-masking attachment %q on %q asks for action refuse with scope %s, but Kong Gateway Enterprise's AI PII Sanitizer refuses through block_if_detected, which Kong's reference describes as refusing a request carrying a match and does not show withholding a reply that carries one; set scope to request, which refuses such a request before it is forwarded, or set action to redact" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # The entity types are Kong's sanitizer's own categories.
    entity_types_are_the_sanitizers: >-
      {{- $categories := list "bank" "credentials" "creditcard" "crypto" "date" "driverlicense" "email" "general" "ip" "medical" "nationalid" "nrp" "passport" "phone" "ssn" "url" -}}
      {{- range $e := optional .values "entities" list -}}
      {{- if not (has $e $categories) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists the entity type %q, which is not one of the categories Kong Gateway Enterprise's AI PII Sanitizer takes as an entity type; list only categories from: %s" $.metadata.feature_instance $.metadata.instance_id $e (join ", " $categories)) -}}
      {{- end -}}
      {{- end -}}
    # Kong's placeholder is numbered and never shows the pattern's name, so
    # patterns replaced under redact need placeholder_shows_name off. Under
    # refuse nothing is replaced and no placeholder is shown. Only false turns
    # it off.
    placeholder_shows_no_name: >-
      {{- $values := default dict .values -}}
      {{- $off := and (hasKey $values "placeholder_shows_name") (eq (toString (index $values "placeholder_shows_name")) "false") -}}
      {{- if and (optional .values "patterns" list) (eq (optional .values "action" "redact") "redact") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists patterns while placeholder_shows_name is on, but Kong Gateway Enterprise's AI PII Sanitizer replaces each match with a numbered placeholder, PLACEHOLDER followed by a number, which does not show the pattern's name; set placeholder_shows_name to false in this attachment's values, which accepts the numbered placeholder" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The sanitizer reads the text of the user's turns and of a completion's
    # prompt, and Kong's reference names no setting that refuses a request
    # carrying text it does not read, so allow_unmasked_text, off unless the
    # Release turns it on, cannot be honoured while requests are masked. Only
    # true turns it on.
    unmasked_text_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_text") (eq (toString (index $infra "allow_unmasked_text")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_unmasked_text is off, but Kong Gateway Enterprise's AI PII Sanitizer reads the text of the user's turns and of a completion's prompt, and Kong's reference names no setting that refuses a request carrying text it does not read — the other turns, the tool calls a conversation carries and the fields beside its messages — so that text would reach the model provider unmasked; set allow_unmasked_text to true on this attachment in the Release, which lets it through as data-masking-kong-enterprise lists, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # The sanitizer passes a request's images, files and audio on unread, and
    # nothing on the gateway refuses a request carrying them, so
    # allow_non_text_content, off unless the Release turns it on, cannot be
    # honoured while requests are masked. Only true turns it on.
    non_text_content_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_non_text_content") (eq (toString (index $infra "allow_non_text_content")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_non_text_content is off, but Kong Gateway Enterprise's AI PII Sanitizer passes a request's images, files and audio on unread, and Kong's reference names no setting that refuses a request carrying them; set allow_non_text_content to true on this attachment in the Release, which lets them reach the model provider unmasked, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Of a reply, the sanitizer reads the message text alone and withholds
    # nothing else, and a failed call's reply passes as the provider returned
    # it, so allow_unmasked_reply_parts, off unless the Release turns it on,
    # cannot be honoured while replies are masked. Only true turns it on.
    unmasked_reply_parts_are_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_reply_parts") (eq (toString (index $infra "allow_unmasked_reply_parts")) "true") -}}
      {{- if and (ne $scope "request") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while allow_unmasked_reply_parts is off, but Kong Gateway Enterprise's AI PII Sanitizer reads a reply's message text alone and withholds none of the rest — its tool calls, a refusal, spoken audio and its transcript, the probabilities of the tokens the model chose — and passes the reply to a failed call on as the provider returned it; set allow_unmasked_reply_parts to true on this attachment in the Release, which lets them reach the caller unmasked, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Kong's reference does not say its sanitizer can hold a streamed reply and
    # mask it whole, so a request for one is refused, by the AI proxy, rather
    # than allowed. The setting has no effect unless entity types are masked
    # in replies.
    streamed_replies_are_refused: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- if and (optional .values "entities" list) (ne $scope "request") (optional .infra "allow_streamed_replies" false) -}}
      {{- fail (printf "core/data-masking attachment %q on %q sets allow_streamed_replies with scope %s, but Kong Gateway Enterprise's AI PII Sanitizer is not shown to hold a streamed reply and mask it whole, so the gateway refuses a request asking for a streamed reply while replies are masked; remove allow_streamed_replies" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Of a reply, the sanitizer reads each choice's message text and not the
    # reasoning a reasoning model returns beside it, so mask_reasoning, on
    # unless turned off, cannot be honoured while replies are masked. Only
    # false turns it off.
    reasoning_is_not_masked: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $off := and (hasKey $infra "mask_reasoning") (eq (toString (index $infra "mask_reasoning")) "false") -}}
      {{- if and (ne $scope "request") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while mask_reasoning is on, but Kong Gateway Enterprise's AI PII Sanitizer reads a reply's message text and not the reasoning a reasoning model returns beside it, so that reasoning would reach the caller unmasked; set mask_reasoning to false on this attachment in the Release, which lets it through, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # The sanitizer is written onto the routes of the wired models, and with
    # none wired the gateway renders no model route to mask.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/data-masking attachment %q on %q needs a model route to mask, but nothing is wired to the models socket of %q, so the gateway serves no model; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The sanitizer sends every text it masks to Kong's PII service, its
    # regular expressions included, so an attachment needs the service wired
    # whatever it lists, and the sanitizer reaches one service.
    sanitizer_is_wired: >-
      {{- $wired := sortAlpha (keys (optional .uses "pii_sanitizer" dict)) -}}
      {{- if not $wired -}}
      {{- fail (printf "core/data-masking attachment %q on %q needs Kong's PII service, which the gateway's AI PII Sanitizer sends every text it masks to, its patterns included, but nothing is wired to the pii_sanitizer socket of %q; wire a core/security/kong-ai-pii-service to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- else if gt (len $wired) 1 -}}
      {{- fail (printf "core/data-masking attachment %q on %q needs one PII service, but the pii_sanitizer socket of %q carries %s, and Kong Gateway Enterprise's AI PII Sanitizer calls one service; keep one connection" .metadata.feature_instance .metadata.instance_id .metadata.instance_id (join ", " $wired)) -}}
      {{- end -}}
    # The bundle writes one sanitizer on each route from one attachment, so a
    # second attachment could not hold beside the first.
    one_masking_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/data-masking" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/data-masking is attached to %q more than once (%s), but core/gateway/kong-enterprise writes one AI PII Sanitizer on each route from one attachment, so the attachments cannot each hold; merge them into one" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
