apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: data-masking-traefik-hub
  version: 1.0.0
  description: >
    Realizes core/data-masking on the gateway core/gateway/traefik-hub; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, traefik-hub-chart, writes a Content Guard of Traefik Hub's AI
    gateway onto the route of each wired model, reading requests, replies or
    both as scope names. Patterns are matched by its regular-expression
    engine; entity types are found by the Presidio analyzer on the gateway's
    pii_analyzer socket, in English. redact replaces a match with a run of *
    as long as the match; refuse answers HTTP 403 in its place. A reply that
    is masked or checked is held whole and sent at the end, streamed or not.

    Traefik's reference does not say which fields of a chat request or reply
    Content Guard reads, and names no setting that refuses or withholds what
    it does not read, so each strict default is refused by name and the
    attachment builds once the Release relaxes it: allow_unmasked_text and
    allow_non_text_content on requests; allow_unmasked_reply_parts and
    mask_reasoning false on replies; and allow_streamed_replies with entities
    on replies, since a streamed reply is held, not refused. What each lets
    through is what Content Guard does not read.

    It refuses restore, a placeholder showing a pattern's name, patterns and
    entities in one attachment, a second attachment, and an entity type the
    analyzer does not know; and halts with no model wired, with entities but
    not one analyzer wired, and on any other component. No build proves the
    gateway masks.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/data-masking:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # How the gateway masks, read in Traefik's Content Guard reference. The
  # chart Recipe writes one Content Guard for the attachment, named after the
  # gateway and the attachment, and names it on every model route after the
  # deny-pattern guards: the request and the reply read as a chat completion,
  # and one rule per direction scope names, listing every pattern's
  # expression, or every entity type, in one rule, which Content Guard applies
  # all together. A pattern is handed to the gateway exactly as written and
  # read in Go's RE2 syntax, which has no lookahead and no backreference;
  # letter case counts unless the expression says otherwise. Entity types go
  # to the Presidio analyzer the pii_analyzer connection reaches, in the
  # language en, and Traefik's reference names HTTP 500 as what an
  # unreachable analyzer causes. action redact writes a mask of the character
  # *, so a match becomes a run of * as long as the match, its length the one
  # thing left of it; refuse writes a block, answered with HTTP 403 and a
  # plain-text body in place of the request or the reply. A rule on replies
  # makes Content Guard hold a reply, a streamed one included, mask or check
  # it whole and send it at the end in the shape it arrived in.
  #
  # What it honours: action redact and refuse; scope request, response and
  # both; patterns and entities, each in an attachment of its own;
  # placeholder_shows_name false with patterns under redact, and either value
  # otherwise.
  #
  # What each relaxation lets through unmasked. Content Guard reads a request
  # and a reply as a chat completion, and its reference lists the fields it
  # reads for the Responses API alone; Traefik's release notes add that it
  # reads the arguments of tool calls in a chat completion, and the text of
  # a message given as a list of parts. Nothing the reference names refuses a
  # request, or withholds a reply's part, for text it does not read, so:
  # - allow_unmasked_text, with scope request or both, lets reach the model
  #   provider, as the caller sent it, every part of a request Content Guard
  #   does not read, which its reference does not list;
  # - allow_non_text_content, with scope request or both, lets reach it a
  #   request's images, files and audio and the addresses they are given by;
  # - allow_unmasked_reply_parts, with scope response or both, lets reach the
  #   caller every part of a reply Content Guard does not read, the reply to
  #   a failed call included;
  # - mask_reasoning false, with scope response or both, lets reach the
  #   caller the reasoning a reasoning model returns, which Content Guard is
  #   not stated to read in a chat completion;
  # - allow_streamed_replies, with entities and scope response or both,
  #   accepts that a request for a streamed reply is answered with the reply
  #   held and sent whole at the end, which is what Content Guard does, where
  #   the strict default refuses such a request.
  # The definitions of tools, a response format and stop sequences are the
  # developer's own and pass as sent.
  #
  # One engine per attachment and one attachment per gateway. Content Guard
  # takes one engine per middleware, so patterns and entities would need two,
  # and so would a second attachment; Traefik's reference does not say
  # whether a Content Guard later in a route's chain reads the text an
  # earlier one masked or the request as the caller sent it, which decides
  # whether the second could put back what the first masked. Both are
  # refused rather than written.
  #
  # What it keeps out of the gateway's own records: Content Guard records
  # which rule blocked a request, and the gateway's AI spans carry message
  # text only when their content level is chosen, which the chart Recipe does
  # not configure.
  #
  # No build proves that a running gateway masks anything: that needs a
  # gateway running under a licence token.
  #
  # No assertion can read the host component's labels, so what the gateway
  # is able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_writes_the_masking: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/data-masking attachment %q on %q is bound to the Traefik Hub realization, which only core/gateway/traefik-hub carries out: that component's chart Recipe writes the masking onto the routes it serves models on, and %s renders none for it, so nothing would be masked. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The masking is written onto the routes of the wired models, and with
    # none wired the gateway serves no model.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/data-masking attachment %q on %q needs a model route to mask, but nothing is wired to the models socket of %q, so the gateway serves no model; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # Content Guard masks with a character repeated over the match, and
    # Traefik's reference shows no way to put an original back.
    restore_is_refused: >-
      {{- if eq (optional .values "action" "redact") "restore" -}}
      {{- fail (printf "core/data-masking attachment %q on %q asks for action restore, but core/gateway/traefik-hub's Content Guard replaces a match with a character repeated over it and its reference shows no way to put the original back in the reply; set action to redact, which replaces each match for good, or to refuse, which answers HTTP 403 in place of a request or a reply carrying one" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # Content Guard takes one engine per middleware, and whether a second one
    # in the same chain reads the first one's masking is not stated.
    one_engine_per_attachment: >-
      {{- if and (optional .values "patterns" list) (optional .values "entities" list) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists both patterns and entities, but core/gateway/traefik-hub's Content Guard takes one engine per middleware, regular expressions or the Presidio analyzer, so the two lists would need two Content Guards on one route, and Traefik's reference does not say whether the second reads the text the first masked or the request as the caller sent it, which could put back what the first masked; list either patterns or entities" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    one_masking_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/data-masking" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/data-masking is attached to %q more than once (%s), but each attachment is written as a Content Guard of its own on every route of core/gateway/traefik-hub, and Traefik's reference does not say whether a later Content Guard reads the text an earlier one masked or the request as the caller sent it, which could put back what the earlier one masked; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
    # Content Guard's placeholder is a repeated character and never shows the
    # pattern's name; under refuse nothing is replaced. Only false turns the
    # value off.
    placeholder_shows_no_name: >-
      {{- $values := default dict .values -}}
      {{- $off := and (hasKey $values "placeholder_shows_name") (eq (toString (index $values "placeholder_shows_name")) "false") -}}
      {{- if and (optional .values "patterns" list) (eq (optional .values "action" "redact") "redact") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists patterns while placeholder_shows_name is on, but core/gateway/traefik-hub's Content Guard replaces each match with the character * repeated over it, which does not show the pattern's name; set placeholder_shows_name to false in this attachment's values, which accepts that placeholder" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The entity types are found by the Presidio analyzer the gateway calls on
    # its pii_analyzer socket, which a Content Guard calls one of.
    entities_need_the_analyzer: >-
      {{- if optional .values "entities" list -}}
      {{- $wired := sortAlpha (keys (optional .uses "pii_analyzer" dict)) -}}
      {{- if not $wired -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists entities, which core/gateway/traefik-hub's Content Guard has the Presidio analyzer find, but nothing is wired to the pii_analyzer socket of %q; wire a core/security/presidio-analyzer to that socket, or list patterns instead of entities" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- else if gt (len $wired) 1 -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists entities, but the pii_analyzer socket of %q carries %s, and core/gateway/traefik-hub's Content Guard calls one analyzer; keep one connection" .metadata.feature_instance .metadata.instance_id .metadata.instance_id (join ", " $wired)) -}}
      {{- end -}}
      {{- end -}}
    # The entity types the analyzer core/security/presidio-analyzer runs
    # recognizes in English, read from the list traefik-hub-chart publishes.
    # Traefik's reference does not say what Content Guard does with a type the
    # analyzer does not know, so such a type could mask nothing and say
    # nothing.
    entity_types_the_analyzer_knows: >-
      {{- $known := fromJson (optional .locals "analyzer_entity_types" "[]") -}}
      {{- range $e := optional .values "entities" list -}}
      {{- if not (has $e $known) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists the entity type %q, which the Presidio analyzer core/gateway/traefik-hub calls does not recognize in English, and Traefik's reference does not say what Content Guard does with such a type, so it could mask nothing and say nothing. List only types from: %s" $.metadata.feature_instance $.metadata.instance_id $e (join ", " $known)) -}}
      {{- end -}}
      {{- end -}}
    # Content Guard reads a request as a chat completion, its reference does
    # not list which fields, and nothing refuses a request for text it does
    # not read, so allow_unmasked_text, off unless the Release turns it on,
    # cannot be honoured while requests are masked. Only true turns it on.
    unmasked_text_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_text") (eq (toString (index $infra "allow_unmasked_text")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_unmasked_text is off, but core/gateway/traefik-hub's Content Guard reads a request as a chat completion, Traefik's reference does not list which of its fields, and nothing it names refuses a request carrying text it does not read, so that text would reach the model provider unmasked; set allow_unmasked_text to true on this attachment in the Release, which lets it through, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Nothing on the gateway refuses a request carrying an image, a file or
    # audio, so allow_non_text_content, off unless the Release turns it on,
    # cannot be honoured while requests are masked. Only true turns it on.
    non_text_content_is_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_non_text_content") (eq (toString (index $infra "allow_non_text_content")) "true") -}}
      {{- if and (ne $scope "response") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks requests with scope %s while allow_non_text_content is off, but core/gateway/traefik-hub's Content Guard reads text, and nothing Traefik's reference names refuses a request carrying an image, a file or audio; set allow_non_text_content to true on this attachment in the Release, which lets them reach the model provider unmasked, or remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Of a reply, Content Guard reads what its chat completion reading takes,
    # which Traefik's reference does not list, and withholds nothing else, so
    # allow_unmasked_reply_parts, off unless the Release turns it on, cannot
    # be honoured while replies are masked. Only true turns it on.
    unmasked_reply_parts_are_allowed: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_unmasked_reply_parts") (eq (toString (index $infra "allow_unmasked_reply_parts")) "true") -}}
      {{- if and (ne $scope "request") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while allow_unmasked_reply_parts is off, but core/gateway/traefik-hub's Content Guard reads a reply as a chat completion, Traefik's reference does not list which of its parts, and nothing it names withholds a part it does not read, the reply to a failed call included; set allow_unmasked_reply_parts to true on this attachment in the Release, which lets those parts reach the caller unmasked, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Content Guard is not stated to read the reasoning a reasoning model
    # returns in a chat completion, so mask_reasoning, on unless turned off,
    # cannot be honoured while replies are masked. Only false turns it off.
    reasoning_is_not_masked: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $off := and (hasKey $infra "mask_reasoning") (eq (toString (index $infra "mask_reasoning")) "false") -}}
      {{- if and (ne $scope "request") (not $off) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks replies with scope %s while mask_reasoning is on, but Traefik's reference does not state that core/gateway/traefik-hub's Content Guard reads the reasoning a reasoning model returns in a chat completion, so that reasoning could reach the caller unmasked; set mask_reasoning to false on this attachment in the Release, which lets it through, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Content Guard holds a streamed reply and masks it whole rather than
    # refusing a request for one, so allow_streamed_replies, off unless the
    # Release turns it on, cannot be honoured while entities are masked in
    # replies. Only true turns it on.
    streamed_replies_are_held: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $on := and (hasKey $infra "allow_streamed_replies") (eq (toString (index $infra "allow_streamed_replies")) "true") -}}
      {{- if and (optional .values "entities" list) (ne $scope "request") (not $on) -}}
      {{- fail (printf "core/data-masking attachment %q on %q masks entities in replies with scope %s while allow_streamed_replies is off, which refuses a request for a streamed reply, but core/gateway/traefik-hub's Content Guard refuses no such request: it holds the streamed reply, masks it whole and sends it at the end; set allow_streamed_replies to true on this attachment in the Release, which accepts that, or set scope to request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
