apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: env-secret
  version: 1.0.0
  description: >
    Helm implementation of core/secret-value. Inject-only: the injectMapping
    merges the value into the attached component's env pipe, so the component
    Recipe renders it as a container environment variable on the synthesized
    workload (or feeds a managed chart's auth values). No Kubernetes Secret is
    generated; a slot read as a secretKeyRef takes core/referenced-secret, or
    core/secret-value mapped to k8s-secret-from-value. An origin holding a
    Docker Compose variable reference of the form ${…} halts the build, since
    Kubernetes substitutes none; set the real value through the Release
    instead.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/secret-value:1.0.0

  # An origin carrying a Docker Compose variable reference, ${NAME}, halts the
  # build. Docker Compose substitutes such a reference when the stack starts;
  # Kubernetes substitutes no such reference, so the inject pipe would carry it
  # as literal text and the workload would run on it as its password. Only the
  # ${…} shape is refused, and only where the braces hold a variable name, alone
  # or followed by one of Compose's :-, -, :?, ?, :+ or + forms: a $ anywhere
  # else is part of the value and is delivered as written, and so is a ${…}
  # whose braces hold no variable name. The check is an assertion because a
  # FeatureRecipe's assertions run once the attachment is bound and before that
  # binding renders, and the halt writes no output. It reads the origin through
  # the expression the injectMapping below reads it through, inline: a
  # FeatureRecipe's assertions are handed the host component's locals, not this
  # entity's.
  #
  # The sentence is fixed and names no attachment. origin is declared sensitive,
  # and this refusal fires on what the value holds, so the compiler withholds any
  # text the template composes: a sentence filled in with the attachment's name
  # would never be shown. What the reader sees is the host component and this
  # rule's name, which the refusal carries, and this sentence as written.
  #
  # DELIBERATE NEAR-DUPLICATE of k8s-secret-from-value's assertion of the same
  # name, byte for byte: an assertion is a plain string that takes no $import:,
  # and no catalog kind holds an assertion for several entities to share. A
  # change to one is made to both.
  assertions:
    origin_is_not_a_compose_variable_reference: >-
      {{- $origin := optional .values "origin" (optional .infra "origin" "") -}}
      {{- if regexMatch `\$\{[A-Za-z_][A-Za-z0-9_]*(:?[-?+][^}]*)?\}` $origin -}}
      {{- fail "this core/secret-value attachment sets its origin to a Docker Compose variable reference of the form ${…}, which Docker Compose substitutes when the stack starts and Kubernetes never substitutes. Set the real value through the Release instead, as a parameter the Aggregate hoists into this origin or as infra.origin on this attachment in place of the origin the Aggregate writes, or attach core/referenced-secret naming a Secret that already exists in the namespace" -}}
      {{- end -}}

  # Pre-render interception: deliver the value into the component inject pipe
  # under the chosen variable name. The base Recipe reads it as
  # .context.inject.env.<VAR> and maps it onto the chart's auth values.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a credential
  # Feature that reads the locator repeats this one expression, because it sits
  # inside a template the realization owns, and no catalog kind holds a single
  # template expression for several entities to share. values is read only
  # through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  #
  # The value is written through toJson, as a JSON string, which the mapping's
  # YAML reads back exactly: a quote or a backslash in the value is delivered as
  # authored rather than breaking the mapping.
  #
  # DELIBERATE NEAR-DUPLICATE of k8s-secret-from-value's injectMapping, which
  # delivers the pipe identically: an injectMapping is a plain string and takes no
  # $import:, so no MappingLibrary entry can supply it to both. Change both in the
  # same edit.
  injectMapping: |
    env:
      {{ .values.key }}: {{ optional .values "origin" (optional .infra "origin" "") | toJson }}
