apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: response-validation-traefik-hub
  version: 1.0.0
  description: >
    Binds core/response-validation on the gateway core/gateway/traefik-hub to
    a halt naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file and writes no check.

    No middleware in Traefik Hub's reference checks a model's reply against a
    JSON Schema. Its Chat Completion middleware checks a request against the
    chat completion schema, not a reply; its API management checks request
    bodies against an OpenAPI document, not a model's reply; and its LLM
    Guard can send a reply to an outside service and judge that service's
    answer, which this realization does not wire. So the build halts on every
    attachment, naming why; with nothing wired to the models socket it halts
    saying the gateway serves no model route. It halts on any component other
    than core/gateway/traefik-hub.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/response-validation:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing the
  # gateway offers checks a reply against the attachment's schema.
  #
  # What the gateway offers, read in Traefik Hub's AI gateway reference and its
  # release notes. The Chat Completion middleware validates each request
  # against the OpenAI chat completion schema and records the reply's tokens;
  # Content Guard masks or refuses what its patterns or Presidio find; LLM
  # Guard and Parallel LLM Guard call an outside guard and block on conditions
  # over its answer; API management validates a request body against an
  # OpenAPI document. None checks a reply against a JSON Schema the
  # attachment holds, so neither the check nor its inversion can be written.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/response-validation attachment %q on %q is bound to the Traefik Hub realization, which describes core/gateway/traefik-hub alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the reply check the
    # gateway does not have; with none, for the model route it does not serve.
    gateway_keeps_the_reply_check: >-
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for each model reply to be checked against a JSON Schema before it reaches the caller, but no middleware in core/gateway/traefik-hub's reference checks a reply against a schema: its Chat Completion middleware checks requests against the chat completion schema, its API management checks request bodies against an OpenAPI document, and its LLM Guard sends a reply to an outside service, which this realization does not wire. Remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/response-validation attachment %q on %q asks for model replies to be checked, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be checked; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
