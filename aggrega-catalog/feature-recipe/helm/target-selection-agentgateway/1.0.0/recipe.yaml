apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: target-selection-agentgateway
  version: 1.0.0
  description: >
    Binds core/target-selection on the gateway core/gateway/agentgateway to a
    halt naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no virtual model.

    agentgateway 1.6.0 chooses among the targets of one model name by
    drawing two of them at random and taking the one whose health, divided
    by the time it has taken to answer, scores higher. The target observed
    to answer quickest is therefore taken only when it is drawn, and not
    always then, so strategy latency is refused by name; nothing in its
    configuration chooses a target by cost, and its model cost catalog prices
    none of the models wired to it, so strategy cost is refused by name too.
    Each model wired to the models socket is also served under its own alias
    with one target, which leaves nothing to choose between. With nothing
    wired to that socket the build halts saying the gateway serves no model
    route. It halts on any component other than core/gateway/agentgateway.
    The compose realization of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/target-selection:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway has
  # no choice of either kind to make.
  #
  # How the gateway chooses, read in agentgateway's source at v1.6.0, the
  # release the gateway's Recipes pin. Several targets serve one model name
  # only through a virtual model, whose targets of one priority form a group.
  # Within the group the gateway draws two targets at random, the same one
  # possibly twice, and takes the one with the higher score: its health, a
  # running average of its successes, divided by one plus its latency, a
  # running average of the time its replies took, weighted up by the
  # requests it has in flight. A target not yet measured has no latency, and
  # the quickest target is taken only when one of the two draws falls on it
  # and its health does not outweigh the other's; with two targets the slower
  # one is taken whenever both draws fall on it. The Feature's latency is the
  # target observed to answer quickest, so it is refused. The gateway also
  # weighs targets by fixed weights or by conditions on the request, and
  # neither is a choice by cost. In this catalog each wired connection is one
  # model entry under its own alias, so there is no second target to choose
  # either way; the refusal stands on the gateway's own choice all the same.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/target-selection attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, naming the strategy asked
    # for and what the gateway does instead; with none, for the model route
    # the gateway does not serve.
    gateway_chooses_by_the_strategy: >-
      {{- $strategy := toString (optional .values "strategy" "latency") -}}
      {{- if optional .uses "models" dict -}}
      {{- if eq $strategy "cost" -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy cost, but core/gateway/agentgateway chooses no target by cost: it chooses among the targets of one model name by fixed weights, by conditions on the request, or by a random draw of two weighed on health and latency, and its model cost catalog prices none of the models wired to it; each wired model is also served under its own alias with one target, which leaves nothing to choose between; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy %s, the target observed to answer quickest, but core/gateway/agentgateway draws two targets of a model name at random and takes the one whose health divided by its latency scores higher, so the quickest target is taken only when it is drawn and its health does not outweigh the other's; each wired model is also served under its own alias with one target, which leaves nothing to choose between; remove the attachment" .metadata.feature_instance .metadata.instance_id $strategy) -}}
      {{- end -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for a choice between targets, but nothing is wired to the models socket of %q, so the gateway serves no model route to choose a target for; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
