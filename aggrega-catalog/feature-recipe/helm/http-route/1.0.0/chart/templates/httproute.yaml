apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.targetName }}-{{ .Values.attachmentName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      {{- with .Values.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.listenerName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.host }}
  hostnames:
    - {{ . }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.path }}
      backendRefs:
        - name: {{ .Values.serviceName }}
          port: {{ .Values.servicePort }}
