apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: fallback-chain
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/fallback-chain on an AI gateway whose
    realization renders its routing table as a configuration body. The control it
    turns on is a setting the running proxy reads out of that body rather than a
    resource of its own, so this recipe emits no file: it writes the setting into
    the configuration the attached gateway already renders, and every other byte
    of that body is left as the gateway's own Recipe authored it. max_hops bounds
    how far the gateway walks its fallback chain before it gives up and returns
    the failure to the caller — each hop is one further target tried after the
    one before it failed. It bounds the walk rather than defining it: which
    targets the chain visits comes from the routing table the gateway serves, so
    a map publishing one alias once has nothing to fall back to and this bound
    changes no answer.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/fallback-chain:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  pipeline:
    - id: write_fallback_bound
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: router_settings
        settings:
          max_fallbacks: {{ .values.max_hops }}
