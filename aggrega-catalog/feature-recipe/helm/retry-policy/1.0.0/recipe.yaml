apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: retry-policy
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/retry-policy on an AI gateway whose
    realization renders its routing table as a configuration body. The control it
    turns on is a setting the running proxy reads out of that body rather than a
    resource of its own, so this recipe emits no file: it writes the setting into
    the configuration the attached gateway already renders, and every other byte
    of that body is left as the gateway's own Recipe authored it. max_attempts is
    the total number of times a request may be sent, while the gateway counts
    only the sends that follow the first one, so the number written is one fewer
    than the attempts asked for — three attempts is two retries. The retries
    apply to the request as a whole and are the gateway's, not the caller's: a
    caller sees one answer whichever send produced it. The body it writes into
    is the one core/gateway/litellm renders, so the build halts when the
    attachment is carried by any other component.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/retry-policy:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/litellm and core/gateway/litellm:1.0.0 are the same host.
    # Another gateway renders no such body, and without this check the step
    # below would fail there naming neither the Feature nor the gateway.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/litellm" -}}
      {{- fail (printf "core/retry-policy attachment %q on %q is bound to the LiteLLM realization, which writes the retry count into the configuration body core/gateway/litellm renders; %s renders no such body. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
  pipeline:
    - id: write_retry_count
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: router_settings
        settings:
          num_retries: {{ sub .values.max_attempts 1 }}
