apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: retry-policy
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/retry-policy on an AI gateway whose
    realization renders its routing table as a configuration body. The control it
    turns on is a setting the running proxy reads out of that body rather than a
    resource of its own, so this recipe emits no file: it writes the setting into
    the configuration the attached gateway already renders, and every other byte
    of that body is left as the gateway's own Recipe authored it. maxAttempts is
    the total number of times a request may be sent, while the gateway counts
    only the sends that follow the first one, so the number written is one fewer
    than the attempts asked for — three attempts is two retries. The retries
    apply to the request as a whole and are the gateway's, not the caller's: a
    caller sees one answer whichever send produced it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/retry-policy:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  assertions:
    # The gateway paces its own retries and exposes no setting that selects
    # between pacings, so an attachment naming one asks for something this
    # realization cannot deliver. Accepting the value and writing nothing would
    # leave a deployment believing it chose a pacing it did not get, so the
    # build halts here and says which value has no home.
    # The presence test is hasKey rather than a truth test on the value: on this
    # surface a reference to a key the attachment did not write halts before any
    # fallback can run, and an authored value could itself be empty.
    backoff-not-selectable: >-
      {{ if hasKey .values "backoff" }}{{ fail "this gateway realization does
      not select a retry pacing: the gateway paces its own retries and exposes
      no setting that chooses between them. Drop backoff from the attachment and
      keep maxAttempts, which it does honor." }}{{ end }}
  pipeline:
    - id: write_retry_count
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: router_settings
        settings:
          num_retries: {{ sub .values.maxAttempts 1 }}
