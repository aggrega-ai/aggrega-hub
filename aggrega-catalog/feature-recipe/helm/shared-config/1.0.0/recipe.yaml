apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: shared-config
  version: 1.0.0
  description: >
    Boundary-scope FeatureRecipe (executionScope: boundary): renders ONCE per
    boundary, emitting a single <boundary>-shared-config ConfigMap from its local
    chart source. The boundary-derived values flow through valuesMapping, so each
    boundary's ConfigMap carries that boundary's own resolved name and tier. The
    artifact is unmistakably boundary-level — one per boundary, named for the
    boundary — distinct from any per-instance ConfigMap a component's own chart
    emits.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/shared-config:1.0.0
  executionScope: boundary

  # Sourced mode: this FeatureRecipe emits its resources from source: +
  # valuesMapping, which is one of the input kinds it may use rather than the only
  # one — artifacts: and workload: generate resources too, subject to the bound
  # provider supporting the kind. The local chart renders the ConfigMap;
  # valuesMapping supplies the boundary-derived values. At boundary scope the
  # template root exposes .boundary.* (per-component .context.* is unavailable),
  # so the boundary's namespace is read from .boundary.annotations — the flat
  # boundary-level set — rather than from the per-component annotation buckets.
  # It is passed on when the boundary declares one, so the emitted ConfigMap
  # lands beside the components that consume it rather than wherever the applying
  # tool defaults to. Empty when the boundary declares none, and the chart then
  # omits the field — matching a synthesized workload, which also emits no
  # namespace and is placed by the applying tool.
  source: ./chart
  valuesMapping: |
    configmapName: "{{ .boundary.boundary_name }}-shared-config"
    boundaryName: "{{ .boundary.boundary_name }}"
    tier: "{{ .infra.tier }}"
    {{- $ns := "" }}
    {{- if .boundary.annotations }}
      {{- $raw := optional .boundary.annotations "aggrega.ai/namespace" "" }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
