apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configmapName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
data:
  # Boundary-shared environment, the same for every component in this boundary.
  # One ConfigMap is emitted per boundary, carrying that boundary's resolved
  # tier and name.
  PLATFORM_TIER: {{ .Values.tier | quote }}
  PLATFORM_BOUNDARY: {{ .Values.boundaryName | quote }}
