apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: audit-logging-traefik-hub
  version: 1.0.0
  description: >
    Binds core/audit-logging on the gateway core/gateway/traefik-hub to a halt
    naming why the gateway cannot keep it; a Release binds it in its Manifest.
    It emits no file and writes no record.

    Traefik Hub keeps a record of a model request only as an OpenTelemetry
    span its AI middlewares export to a tracing backend, naming the model and,
    at the span's detailed level, the tokens and their estimated cost in US
    dollars. The span names no caller, so a record naming the caller the
    gateway's key check verified, the default, cannot be kept; and this
    realization wires no tracing backend, so even a record naming no caller
    would land nowhere. The gateway keeps no record it could delete. The
    build halts on every attachment, naming why; with nothing wired to the
    models socket it halts saying the gateway serves no model route. It halts
    on any component other than core/gateway/traefik-hub.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the one record
  # Traefik Hub keeps of a model request names no caller this gateway
  # verifies, and lands only in a tracing backend nothing here wires.
  #
  # What the gateway records, read in Traefik Hub's AI gateway observability
  # reference. The Chat Completion middleware starts a span for each request,
  # always carrying the provider, the model requested and the model that
  # answered; at the detailed trace level it adds the tokens the reply
  # reports and their cost in US dollars, priced from the list the gateway
  # ships with. Spans are exported to a tracing backend the gateway is
  # configured with. No attribute the reference lists names a caller; the
  # caller labels the gateway's GenAI metrics can carry, an application and a
  # user, come from Traefik Hub's API management alone, and a metric counts
  # many requests rather than recording one. Wiring a tracing backend would
  # need a socket this catalog has not named.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the Traefik Hub realization, which describes core/gateway/traefik-hub alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the record the gateway
    # cannot keep; with none, for the model route the gateway does not serve.
    gateway_keeps_the_record: >-
      {{- if optional .uses "models" dict -}}
      {{- $infra := default dict .infra -}}
      {{- $caller := "" -}}
      {{- if not (and (hasKey $infra "require_verified_caller") (eq (toString (index $infra "require_verified_caller")) "false")) -}}
      {{- $caller = "; and the span names no caller, so not the one this gateway's key check verified, which require_verified_caller, on, asks for" -}}
      {{- end -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of each model request, but core/gateway/traefik-hub keeps one only as an OpenTelemetry span its AI middlewares export to a tracing backend, naming the model and, at its detailed level, the tokens and their cost in US dollars, and this realization wires no tracing backend, so the record would land nowhere%s. Remove the attachment" .metadata.feature_instance .metadata.instance_id $caller) -}}
      {{- else -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of each model request, but nothing is wired to the models socket of %q, so the gateway serves no model route whose requests could be recorded; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
