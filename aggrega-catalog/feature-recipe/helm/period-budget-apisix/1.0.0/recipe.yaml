apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: period-budget-apisix
  version: 1.0.0
  description: >
    Realizes core/period-budget on the gateway core/gateway/apisix; a Release
    binds it in its Manifest. It emits no file: the gateway's chart Recipe,
    apisix-chart, reads the attachment and writes APISIX's token rate limiting
    onto the chat routes of the models wired to the gateway's models socket,
    and writes no completion route, since APISIX counts no tokens on one.

    The gateway counts the tokens each model's reply reports, read, written or
    both as unit names, over a window of period that opens with the first
    model request after the previous window closed rather than on the clock.
    Once the count reaches limit it answers further model requests with HTTP
    503 until the window closes. It adds a request's tokens once the reply is
    complete, so the request that crosses the limit, and any answered beside
    it, is served, and a reply the gateway's semantic cache serves counts
    nothing and is served past the limit. The count is kept in the memory of
    the gateway process, so the chart runs one replica while the budget is
    attached, and a restart starts a new window.

    So it honours unit total_tokens, prompt_tokens or completion_tokens, scope
    gateway, model or caller, and a period of seconds, minutes, hours or days.
    Scope caller gives each caller infra.callers declares a count of its own
    across every route, the gateway telling them apart by the key each
    presents; with no caller declared it is refused by name. It refuses usd
    and calendar months by name, and halts on a limit that is not a whole
    number of tokens, on a second such attachment, with nothing wired to the
    models socket, and on any component other than core/gateway/apisix.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/period-budget:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # How the gateway keeps the budget. The chart Recipe writes APISIX's
  # ai-rate-limiting onto a service the model routes name, with the limit, the
  # window in seconds and the unit as the token count it limits. On each model
  # request the gateway checks the count the routes share and refuses with 503
  # once it has reached the limit; when a reply completes it adds the tokens
  # the model reported for it — prompt, completion or total, as unit names — so
  # a reply reporting none adds nothing. APISIX reads that report only from a
  # request it recognises the protocol of, which a completion request, carrying
  # a prompt rather than messages, is not: it would be answered and never
  # counted, so the chart Recipe writes each connection's chat route alone while
  # a budget is attached. The window opens with the first model request after
  # the previous one closed and lasts period, so it does not start on the
  # clock. The count lives in the gateway process's memory: shared by its
  # workers, lost when it restarts, and kept apart by every other replica,
  # which is why the chart Recipe runs one replica while a budget is attached.
  # Scope gateway counts every model route together; scope model counts each
  # connection on the models socket apart; scope caller counts, on the one
  # service every route names, each consumer apart through a rule keyed on the
  # consumer a request authenticated as. The consumers are the callers
  # infra.callers declares, and every route refuses a request presenting no
  # declared key before the count is read, so each declared caller has one
  # count and no request is counted without one.
  #
  # No assertion can read the host component's labels, so what the gateway
  # is able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true. The callers are
  # read from the local callers that apisix-chart publishes, the list
  # infra.callers declares, because this check reads the host Recipe's locals
  # and not the host's infra.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/apisix and core/gateway/apisix:1.0.0 are the same host.
    component_writes_the_budget: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/apisix" -}}
      {{- fail (printf "core/period-budget attachment %q on %q is bound to the APISIX realization, which only core/gateway/apisix carries out: that component's chart Recipe writes the budget onto the routes it serves models on, and %s renders none for it, so nothing would be counted. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # APISIX's token rate limiting counts the tokens a model's reply reports
    # and prices nothing.
    unit_is_a_token_count: >-
      {{- if eq .values.unit "usd" -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for unit usd, but core/gateway/apisix, which declares dataplane.aggrega.ai/period-budget: tokens, counts the tokens each model's reply reports and prices nothing, so it keeps no budget in US dollars; set unit to total_tokens, prompt_tokens or completion_tokens, or attach the Feature to a gateway that counts cost" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The gateway tells callers apart only by the consumer key-auth names, and
    # the routes file declares a consumer for each caller infra.callers
    # declares; with none declared there is no caller to count apart.
    scope_is_one_the_gateway_keeps: >-
      {{- if and (eq .values.scope "caller") (not (optional .locals "callers" "")) -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for scope caller, but core/gateway/apisix tells its callers apart only by the key each presents, and infra.callers of %q declares no caller, so every route is open and there is no caller to count apart. Declare the callers in infra.callers, with their keys through the caller_keys slot, or set scope to gateway, for everything it serves, or model, for each connection on its models socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The window is a number of seconds. A whole number of seconds, minutes,
    # hours or days converts exactly; a calendar month does not.
    period_is_one_the_gateway_keeps: >-
      {{- if hasSuffix "mo" .infra.period -}}
      {{- fail (printf "core/period-budget attachment %q on %q asks for a period of %s, but core/gateway/apisix counts a budget over a window of a fixed number of seconds, and a calendar month has no fixed length; set period to a number of days, as in 30d" .metadata.feature_instance .metadata.instance_id .infra.period) -}}
      {{- end -}}
    # The gateway takes its limit as a whole number of tokens.
    limit_is_a_whole_number_of_tokens: >-
      {{- $limit := float64 .infra.limit -}}
      {{- if ne $limit (floor $limit) -}}
      {{- fail (printf "core/period-budget attachment %q on %q sets limit %v, but core/gateway/apisix takes its limit as a whole number of tokens; set limit to a whole number" .metadata.feature_instance .metadata.instance_id .infra.limit) -}}
      {{- end -}}
    # The budget is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to count.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/period-budget attachment %q on %q needs a model route to count, but nothing is wired to the models socket of %q, so the gateway serves no model and there is nothing the budget could count; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The gateway runs one token rate limit on a route, so a second attachment
    # could not hold beside the first.
    one_budget_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/period-budget" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/period-budget is attached to %q more than once (%s), but core/gateway/apisix runs one token rate limit on a route, so the attachments cannot each hold; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
