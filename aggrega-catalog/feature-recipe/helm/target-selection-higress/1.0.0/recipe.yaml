apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: target-selection-higress
  version: 1.0.0
  description: >
    Binds core/target-selection on the gateway core/gateway/higress to a halt
    naming why the gateway cannot honour it; a Release binds it in its Manifest.
    It emits no file and writes no balancer.

    Higress has a plugin that measures latency — ai-load-balancer with
    LeastTotalLatency picks the service of lowest recent response time — but its
    choice does not take effect on the routes this gateway renders. That plugin
    runs after the AI proxy, which by then has set the request's model name,
    upstream address and credential from the candidate the route already
    resolved, and the balancer only writes its choice into a request header that
    nothing routes by unless an Envoy filter the vendor requires is added, which
    this catalog does not render. So the chosen service would be reached, if at
    all, carrying another candidate's proxy rule. strategy cost is refused for a
    second reason: Higress has no strategy that chooses a target by cost. The
    build halts on every attachment, naming why. An alias with one candidate has
    nothing to choose between, and with nothing wired to the models socket the
    gateway serves no model route; each halts saying so. It halts on any
    component other than core/gateway/higress.

    Without this Feature the gateway spreads an alias's requests across its
    candidates in equal shares.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/target-selection:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway
  # cannot make either choice take effect on the routes it renders.
  #
  # How the gateway would choose, read in Higress's source at v2.2.5, the
  # release the gateway's Recipe pins, and in its console's plugin specs at the
  # same release. Higress applies its wasm plugins by priority in descending
  # order within a phase; the AI proxy is priority 100 and the ai-load-balancer
  # 50, so the proxy runs first and, on the route the ingress already resolved,
  # fixes the base URL, the model name and the credential for that candidate.
  # The balancer then writes its pick into the request header
  # x-higress-target-cluster, which the vendor's own reference says routes a
  # request only with an Envoy filter cluster_header mechanism enabled; nothing
  # in the controller, the chart or the plugins this catalog renders reads that
  # header, so the balancer's choice steers no request and its statistics are
  # booked to a service the request did not take. Running the balancer ahead of
  # the proxy would rest on the Envoy fork's route-cache behaviour, which is not
  # establishable without a run. No strategy in any of its balancing modes
  # chooses a target by cost.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/higress and core/gateway/higress:1.0.0 are the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/higress" -}}
      {{- fail (printf "core/target-selection attachment %q on %q is bound to the Higress realization, which describes core/gateway/higress alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, naming the strategy asked for
    # and why the gateway's choice would not route; with none, for the model
    # route the gateway does not serve.
    gateway_chooses_by_the_strategy: >-
      {{- $strategy := toString (optional .values "strategy" "latency") -}}
      {{- if optional .uses "models" dict -}}
      {{- if eq $strategy "cost" -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy cost, but core/gateway/higress has no balancing mode that chooses a target by cost; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy %s, and core/gateway/higress can measure a service's latency but cannot make the choice take effect on the routes it renders: its load-balancer plugin runs after the AI proxy, which has already set the request's model, address and credential for the candidate the route resolved, and the balancer only writes its pick into a request header that routes nothing without an Envoy filter this catalog does not render, so the chosen service would carry another candidate's proxy rule; an alias with one candidate leaves nothing to choose between; remove the attachment, and the gateway spreads an alias's requests across its candidates in equal shares" .metadata.feature_instance .metadata.instance_id $strategy) -}}
      {{- end -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for a choice between targets, but nothing is wired to the models socket of %q, so the gateway serves no model route to choose a target for; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
