apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: gcp-workload-identity
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/gcp-workload-identity: emits one
    Kubernetes ServiceAccount per attached component from a co-located chart,
    annotated with the operator-set Google service-account email for GKE Workload
    Identity. The ServiceAccount name is published as provides so the operator can
    mirror it onto the consumer's aggrega.ai/service-account annotation. Resource
    Generation via source + valuesMapping; the per-component .context.* root is
    available at component scope.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/gcp-workload-identity:1.0.0

  # The emitted ServiceAccount's name is published so a consumer can bind to it
  # by setting aggrega.ai/service-account to this same value. Both the published
  # name and the chart's ServiceAccount name below read the operator-set
  # service_account_name directly — one authored input, no re-derivation.
  provides:
    name: "{{ .infra.service_account_name }}"

  # Resource Generation via a co-located Helm chart: renders one ServiceAccount
  # named for the operator-set service_account_name and annotated with the Google
  # service-account email.
  source: ./chart
  # The chart is also passed the scope's namespace, when the scope declares one,
  # so the emitted ServiceAccount lands beside the workload that mounts it rather
  # than wherever the applying tool defaults to. Empty when no scope declares one,
  # and the chart then omits the field — matching a synthesized workload, which
  # also emits no namespace and is placed by the applying tool.
  valuesMapping: |
    saName: "{{ .infra.service_account_name }}"
    gcpServiceAccount: "{{ .infra.gcp_service_account }}"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- if .context.annotations.release }}
        {{- $raw := index .context.annotations.release "aggrega.ai/namespace" }}
        {{- if $raw }}{{- $ns = $raw }}{{- end }}
      {{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
