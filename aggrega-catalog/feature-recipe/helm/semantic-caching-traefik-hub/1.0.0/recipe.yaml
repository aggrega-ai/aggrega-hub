apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: semantic-caching-traefik-hub
  version: 1.0.0
  description: >
    Realizes core/semantic-caching on the gateway core/gateway/traefik-hub; a
    Release binds it in its Manifest. It emits no file: the gateway's chart
    Recipe, traefik-hub-chart, reads the attachment and writes Traefik Hub's
    semantic cache onto the route of each model wired to the gateway's models
    socket, keeping the replies in the core/datastore/redis wired to its
    cache_store socket.

    A reply is stored per wired model and per caller: under the caller the
    gateway's key check verified, one of the callers infra.callers declares,
    each by its own key, so no caller is served a reply stored for another.
    The cache embeds a request's text with embedding_model, the alias of a
    models connection, through that model's own endpoint and credential, and
    serves a stored reply at least similarity_threshold alike, written as the
    cache's distance bound, one minus the threshold, which is the cosine
    distance: Traefik's reference gives the bound's direction, not its
    measure. A reply is kept ttl_seconds. A request too large to embed is
    answered uncached. It needs a Traefik Hub release from v3.19.11, or from
    v3.20.6, which keep callers apart by default; an older image halts the
    build.

    So it keeps scope key alone, and refuses end_user, the default, by name:
    the gateway cannot tell end users behind one key apart. It halts with no
    caller declared, with nothing wired to cache_store or the models socket,
    on an embedding_model no models connection carries, on a second such
    attachment, and on any component other than core/gateway/traefik-hub.
    That the gateway caches is not observed by any build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the gateway's chart Recipe, which reads it. What stays here is what that
  # Recipe cannot honour.
  #
  # What the gateway caches under. Traefik Hub's semantic cache, private as
  # the chart Recipe writes it, keeps each caller's replies in a partition of
  # their own, the caller being the identity the API Key middleware ahead of
  # it sets: the SHA-256 hash of the entry of infra.callers' key hashes the
  # request matched. Every model route refuses a request matching none before
  # the cache is read, and a request with no identity would bypass the cache.
  # So each caller has a cache of its own, which is scope key: every request
  # presenting one key shares it. An end user behind a key is not something
  # the gateway verifies, so scope end_user is refused rather than written as
  # a cache every end user behind a key shares. Each wired model's cache
  # names a collection of its own in the store, so no model is answered with
  # a reply stored for another.
  #
  # The release a semantic cache keeps callers apart by default from is read
  # off the image's tag, which the gateway's chart Recipe parses, so that
  # check sits there.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true. The callers are
  # read from the local callers that traefik-hub-chart publishes, the list
  # infra.callers declares, because this check reads the host Recipe's locals
  # and not the host's infra.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the Traefik Hub realization, which describes core/gateway/traefik-hub alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The cache is written onto the routes of the wired models, and with none
    # wired the gateway serves no model route whose replies could be cached.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be cached; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The gateway keeps replies apart by the caller a key authenticates, and
    # by nothing finer it verifies.
    scope_is_one_the_gateway_keeps: >-
      {{- if eq (optional .values "scope" "end_user") "end_user" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for scope end_user, which keeps each end user the gateway identifies apart, but core/gateway/traefik-hub tells its callers apart only by the key each presents, and cannot tell apart the end users behind one key: no identity it verifies names them. Set scope to key, which keeps each caller infra.callers declares apart, or attach the Feature to a gateway that identifies end users" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # With no caller declared every route is open and no request carries an
    # identity, so the cache would cache nothing; a shared one is never
    # written.
    callers_are_declared: >-
      {{- if not (optional .locals "callers" "") -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for scope key, but infra.callers of %q declares no caller, so the gateway checks no key and no request carries a caller its cache could keep apart, and a cache shared among callers is not written; declare the callers in infra.callers, with the hashes of their keys through the caller_keys slot" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The replies live in the store wired to the gateway's cache_store socket;
    # with none, the cache would name a store nothing provides.
    store_is_wired: >-
      {{- if not (optional .uses "cache_store" dict) -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q needs a store for the replies core/gateway/traefik-hub caches, but nothing is wired to its cache_store socket; wire a core/datastore/redis to the cache_store socket of %q" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The gateway embeds a prompt through a model it reaches as one of its
    # models connections, so embedding_model must be the alias of one.
    embedding_model_is_a_wired_alias: >-
      {{- $wired := sortAlpha (keys (optional .uses "models" dict)) -}}
      {{- if not (has .values.embedding_model $wired) -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q names %q as its embedding_model, but no connection on the models socket of core/gateway/traefik-hub carries that alias, so the gateway could not turn a prompt into a vector; name the alias of the models connection reaching the embeddings model: %s" .metadata.feature_instance .metadata.instance_id .values.embedding_model (join ", " $wired)) -}}
      {{- end -}}
    # Two caches on one route would each store every reply, the first to
    # match answering, so one is kept.
    one_cache_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/semantic-caching" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/semantic-caching is attached to %q more than once (%s), but core/gateway/traefik-hub writes one semantic cache on each model route, since two would each store every reply and the first to match would answer; keep one attachment" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
