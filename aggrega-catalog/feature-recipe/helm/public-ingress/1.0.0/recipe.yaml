apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: public-ingress
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/public-ingress: emits one Kubernetes
    Ingress per attached component from a co-located chart, routing the host the
    operator names (infra.host) and the path the developer writes (values.path)
    to the named port of the Service the component's own Recipe emits. Resource
    Generation via source + valuesMapping; the per-component .context.* root is
    available at component scope. The backend
    Service name is the operator-set service_name where one is supplied, and
    otherwise the primary Service a synthesized workload emits for the attached
    component — the component's rendered name followed by the primary service
    key, which is how workload synthesis names it. The Ingress itself is named
    from the same rendered name, the name the helm provider spells in the
    characters a Kubernetes name allows. An ingress controller is a runtime
    prerequisite: the build halts unless the Operator affirms one is running in
    the target cluster (infra.control_plane_present), so an Ingress is never
    emitted into a cluster with nothing to reconcile it into routing. Where the
    Operator names a certificate Secret (infra.tls_secret), the Ingress gains a
    TLS section listing the host and that Secret, which is how an Ingress asks
    its controller to serve the host over HTTPS; the Secret is referenced and
    never emitted, and with the key unset the Ingress carries no TLS section.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/public-ingress:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  source: ./chart

  # An ingress controller must already be running in the target cluster before an
  # emitted Ingress becomes routing; without one it is an orphan that routes
  # nothing. The compiler is ahead-of-time and cannot inspect cluster state, so
  # the prerequisite is declared instead: the Operator affirms it on this
  # attachment in the Release, and an unaffirmed build halts here rather than
  # emitting a resource the cluster cannot act on.
  assertions:
    ingress_controller_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "an ingress controller must be running in the target cluster before this attachment emits its Ingress; once a controller is present, affirm the prerequisite by setting infra.control_plane_present to true on this attachment in the Release" -}}
      {{- end -}}

  # This template is the single authored home for every routing fallback, and the
  # chart reads what it resolves rather than re-deriving anything. An operator
  # override wins wherever one is supplied; where none is, the fallback here is
  # what renders, so an attachment given nothing but its hostname still gets
  # working routing. Putting a fallback in the chart as well would give one
  # value two homes, and the two agreeing today is exactly what would hide them
  # disagreeing later.
  #
  # The Service fallback is the primary Service workload synthesis emits for the
  # attached component: its rendered name followed by the primary service key.
  # An upstream chart that names its own Service is reached by setting
  # service_name. The Ingress is named from the same rendered name. Both read
  # .context.rendered_name, never .context.instance_id: a component's name may
  # carry an underscore or a capital, which the rendered name writes out, so a
  # name built from the identity would name a Service that does not exist and
  # an Ingress the cluster refuses.
  #
  # The certificate Secret has no fallback. Left unset it resolves empty, and the
  # chart then omits the TLS section, exactly as it omits the ingress class.
  #
  # The scope's namespace, when the scope declares one, so the emitted Ingress
  # lands beside the Service it routes to rather than wherever the applying tool
  # defaults to. Empty when no scope declares one, and the chart then omits the
  # field — matching a synthesized workload, which also emits no namespace and is
  # placed by the applying tool.
  valuesMapping: |
    {{- $service := default (printf "%s-default" .context.rendered_name) .infra.service_name }}
    {{- $portName := default "http" .infra.service_port_name }}
    {{- $path := default "/" .values.path }}
    targetName: "{{ .context.rendered_name }}"
    host: "{{ .infra.host }}"
    serviceName: "{{ $service }}"
    servicePortName: "{{ $portName }}"
    path: "{{ $path }}"
    ingressClassName: "{{ .infra.ingress_class_name }}"
    tlsSecret: "{{ .infra.tls_secret }}"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
