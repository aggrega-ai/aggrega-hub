apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: public-ingress
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/public-ingress: emits one Kubernetes
    Ingress per attached component from a co-located chart, routing the
    developer-declared host to the named port of the Service the component's own
    Recipe emits. Resource Generation via source + valuesMapping; the
    per-component .context.* root is available at component scope. The backend
    Service name is the operator-set service_name where one is supplied, and
    otherwise the primary Service a synthesized workload emits for the attached
    component — the instance id followed by the primary service key, which is how
    workload synthesis names it. An ingress controller is a runtime prerequisite:
    the build halts unless the Operator affirms one is running in the target
    cluster (infra.control_plane_present), so an Ingress is never emitted into a
    cluster with nothing to reconcile it into routing.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/public-ingress:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  source: ./chart

  # An ingress controller must already be running in the target cluster before an
  # emitted Ingress becomes routing; without one it is an orphan that routes
  # nothing. The compiler is ahead-of-time and cannot inspect cluster state, so
  # the prerequisite is declared instead: the Operator affirms it on this
  # attachment in the Release, and an unaffirmed build halts here rather than
  # emitting a resource the cluster cannot act on.
  assertions:
    ingress_controller_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "an ingress controller must be running in the target cluster before this attachment emits its Ingress; once a controller is present, affirm the prerequisite by setting infra.control_plane_present to true on this attachment in the Release" -}}
      {{- end -}}

  # This template is the single authored home for every routing fallback, and the
  # chart reads what it resolves rather than re-deriving anything. An operator
  # override wins wherever one is supplied; where none is, the fallback here is
  # what renders, so authoring nothing but the hostname still gets working
  # routing. Putting a fallback in the chart as well would give one value two
  # homes, and the two agreeing today is exactly what would hide them
  # disagreeing later.
  #
  # The Service fallback is the primary Service workload synthesis emits for the
  # attached component: the instance id followed by the primary service key. An
  # upstream chart that names its own Service is reached by setting service_name.
  #
  # The scope's namespace, when the scope declares one, so the emitted Ingress
  # lands beside the Service it routes to rather than wherever the applying tool
  # defaults to. Empty when no scope declares one, and the chart then omits the
  # field — matching a synthesized workload, which also emits no namespace and is
  # placed by the applying tool.
  valuesMapping: |
    {{- $service := default (printf "%s-default" .context.instance_id) .infra.service_name }}
    {{- $portName := default "http" .infra.service_port_name }}
    {{- $path := default "/" .infra.path }}
    targetName: "{{ .context.instance_id }}"
    host: "{{ .values.host }}"
    serviceName: "{{ $service }}"
    servicePortName: "{{ $portName }}"
    path: "{{ $path }}"
    ingressClassName: "{{ .infra.ingress_class_name }}"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- if .context.annotations.release }}
        {{- $raw := index .context.annotations.release "aggrega.ai/namespace" }}
        {{- if $raw }}{{- $ns = $raw }}{{- end }}
      {{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
