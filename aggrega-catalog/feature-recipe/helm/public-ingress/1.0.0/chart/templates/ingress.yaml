apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.targetName }}-ingress
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.tlsSecret }}
  tls:
    - secretName: {{ . }}
      {{- with $.Values.host }}
      hosts:
        - {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: {{ .Values.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.serviceName }}
                port:
                  name: {{ .Values.servicePortName }}
