apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: k8s-secret-set
  version: 1.0.0
  description: >
    Generates a single Kubernetes Secret carrying several caller-supplied data
    keys, rendered from a co-located Helm chart. The generated Secret uses the
    deterministic name pattern {rendered_name}-{attachment_name}: the host
    component's rendered name, which the helm provider spells in the characters
    a Kubernetes name allows, then the slot name with underscores normalized to
    hyphens, so the name is a valid RFC-1123 label wherever the host reports a
    rendered name. On a host that reports none, the host part is the
    component's identity, and the name is a valid label only where that
    identity is one.
    The caller supplies the fixed key names its consuming target reads, so the
    consumer references the Secret by name and its target reads the keys it
    already knows. Each entry's value is written into the emitted Secret's
    stringData, so the material sits in the rendered output: this suits
    evaluation and local work, not a production credential.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/referenced-secret-set:1.0.0

  # The multi-key referenceable-secret contract: publish the generated Secret's
  # identity as provides, so a consumer references it (by name) without
  # re-deriving the name. core/referenced-secret-set requires the name key; the
  # emitted Secret below derives its name from this provides — the name is
  # authored once, here. The host part is .context.rendered_name: a component's
  # name may carry an underscore or a capital, which the rendered name writes
  # out. A host whose provider reports no rendered name — a helm Recipe placing
  # an artifact set alone, such as helm/function-knative — names its own
  # resources from its identity, and so does this Secret there: the host part is
  # read through optional, which falls back to .context.instance_id, because a
  # direct read of .context.rendered_name on such a host halts the build before
  # that Recipe can judge the attachment. Wherever a rendered name is reported,
  # the name is the same either way. The slot name is normalized (underscores to
  # hyphens), so the published name is a valid RFC-1123 label wherever the host
  # part is a rendered name, and on the fallback only where the component's
  # identity is one; the consumer and the emitted Secret share this one resolved
  # value, so a normalized name cannot drift between them. DELIBERATE
  # NEAR-DUPLICATE of the `name` k8s-secret-from-value, k8s-secret-from-parameter
  # and k8s-external-secret publish: each realization publishes its own, and no
  # catalog kind holds a provides block for several entities to share; a change
  # to one of the four is made to all four. The two random-password realizations
  # compose their Secret's name the same way but deliberately not byte for byte,
  # honouring values.name ahead of it; a change to how the host part is read is
  # made in all six.
  provides:
    name: '{{ optional .context "rendered_name" .context.instance_id }}-{{ .attachment_name | replace "_" "-" }}'

  # Resource Generation via a co-located Helm chart: the chart renders one
  # Kubernetes Secret whose name is fed from the published provides — so the
  # rendered Secret and the consumer's .features.<slot>.provides.name are one
  # authored source (no drift) — carrying the caller's data keys as stringData.
  # valuesMapping reads .provides (the same resolved value the consumer sees)
  # rather than re-deriving the name inside the chart.
  source: ./chart
  # The chart is also passed the scope's namespace, when the scope declares one,
  # so the emitted Secret lands beside the workload that references it rather than
  # wherever the applying tool defaults to — a reference does not resolve a Secret
  # in another namespace. Empty when no scope declares one, and the chart then
  # omits the field — matching a synthesized workload, which also emits no
  # namespace and is placed by the applying tool.
  #
  # entries is read from whichever pillar carries it — values where the
  # developer wrote it, infra where the operator did; the Feature halts the build
  # when both or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a
  # credential Feature that reads the locator repeats this one expression,
  # because it sits inside a template the realization owns, and no catalog kind
  # holds a single template expression for several entities to share. values is
  # read only through optional, and that is load-bearing: a template that also
  # read .values.entries as a path would find the key present and empty, and
  # never fall through to infra.
  valuesMapping: |
    secretName: "{{ .provides.name }}"
    entries:
    {{- range (optional .values "entries" (optional .infra "entries" (list))) }}
      - key: "{{ .key }}"
        value: {{ .value | toJson }}
    {{- end }}
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
