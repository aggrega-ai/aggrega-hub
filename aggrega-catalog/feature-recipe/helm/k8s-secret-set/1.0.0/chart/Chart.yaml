apiVersion: v2
name: k8s-secret-set
description: >
  A one-template local Helm chart that renders a single Kubernetes Secret
  carrying several caller-supplied data keys. It is the source: of the
  k8s-secret-set FeatureRecipe — the FR renders this chart per multi-key
  referenceable-secret slot, naming the Secret from the slot's published
  provides and filling stringData from the caller's entries.
version: 0.1.0
appVersion: "1.0.0"
