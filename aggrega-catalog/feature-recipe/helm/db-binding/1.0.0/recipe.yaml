apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: db-binding
  version: 1.0.0
  description: >
    Helm implementation of example/db-binding. This FeatureRecipe renders no
    resources. A component-attached feature is an instance that must resolve to
    a FeatureRecipe for resolution-completeness, the same way a component
    resolves to a Recipe. This binding's effect — injecting the database server
    address into the consumer (db's host provides → ADMINER_DEFAULT_SERVER) —
    flows through the uses-edge, not through this recipe; so the recipe is
    intentionally empty.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: example/db-binding:1.0.0
