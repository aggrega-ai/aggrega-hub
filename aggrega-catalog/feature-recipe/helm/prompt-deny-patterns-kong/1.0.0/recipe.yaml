apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-deny-patterns-kong
  version: 1.0.0
  description: >
    Realizes core/prompt-deny-patterns on the gateway core/gateway/kong; a
    Release binds it in its Manifest. It emits no file: the KongModelRoutes
    bundle each of the gateway's Recipes imports reads the attachment and
    writes Kong 3.9.3's AI Prompt Guard onto the chat and completion routes
    of each model wired to the gateway's models socket.

    The guard reads the text of every message of every role across the whole
    conversation, joined into one string with a space after each message, so
    an expression can match across two of them, and a completion's prompt. A
    message whose content is not a single string, such as content in parts or
    a turn carrying only tool calls, refuses the whole request.
    Letter case counts unless an expression says otherwise, as (?i) does. A
    request any of deny_patterns matches is refused whatever allow_patterns
    says; with allow_patterns set, a request none of them matches is refused.
    A refused caller receives HTTP 400 with the message "bad request", which
    names no expression, and so does a request the guard cannot read, such as
    a body that outgrows Kong's 8 KiB request buffer and is set aside on disk,
    which the gateway refuses without the guard as well. The build does not
    check an expression: one Kong cannot compile answers the requests reaching
    it with HTTP 500.

    So it honours deny_patterns and allow_patterns, and halts on a list of
    more than 10 expressions or an expression over 500 bytes, on a second
    such attachment, with nothing wired to the models socket, and on any
    component other than core/gateway/kong. The gateway imports its routes
    into its database, which keeps the guard after the attachment is removed,
    until it is deleted through Kong's Admin API.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prompt-deny-patterns:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the KongModelRoutes bundle that both of the gateway's helm Recipes, kong
  # and kong-chart, import. What stays here is what that bundle cannot honour.
  #
  # How the gateway guards. The bundle writes ai-prompt-guard onto every route
  # of each wired model, beside the request transformer and the AI proxy; Kong
  # runs it after the transformer and before the proxy. It is written with
  # match_all_roles on and allow_all_conversation_history off, the widest
  # reading the plugin offers at 3.9.3: every message of every role, the system
  # prompt and earlier turns included, newest first, its text joined into one
  # string. A message whose content is not a string, and a completion whose
  # prompt is not one, is a request the guard cannot read, and it refuses it
  # rather than forwarding it unchecked. The deny list is checked first and the
  # allow list after it, each expression matched with PCRE as written, without
  # letter case folded. Every refusal is the same HTTP 400, whose body is
  # {"error":{"message":"bad request"}}. The guard parses the body with its
  # default size, which is also the AI proxy's: a body Nginx keeps in memory
  # is read whole, and one that outgrows its 8 KiB request buffer and is set
  # aside on disk is not read, and is refused — as the AI proxy alone refuses
  # it, with HTTP 400, when no guard is attached.
  #
  # Kong's schema takes at most 10 expressions in each list, each at most 500
  # bytes, and validates nothing else about them; an import holding a longer
  # list or expression fails, and the gateway then does not start, so those are
  # refused here before anything renders. An expression PCRE cannot compile
  # passes the import and answers HTTP 500 to each request that reaches it.
  #
  # The routes reach Kong through an import into its database that adds and
  # updates rows and removes none, so the guard written by an attachment stays
  # on the routes once the attachment is removed, until it is deleted through
  # the Admin API; a changed list replaces the one the guard held.
  #
  # Kong Gateway Enterprise carries no prompt-guard value, so an attachment on
  # core/gateway/kong-enterprise is refused by the Feature's selector before
  # this realization is reached. No assertion can read the host component's
  # labels, so what the gateway is able to do is stated in the messages, and
  # the check of the host's type first in the list is what keeps those
  # statements true.
  #
  # DELIBERATE NEAR-DUPLICATE of prompt-deny-patterns-kong under compose: the
  # two differ only in capability, in the Recipes they name and in what the
  # compose target does to a $, because one realization holds one capability
  # and both targets run the same routes. If one of them changes, change both
  # in the same edit.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong and core/gateway/kong:1.0.0 are the same host.
    component_writes_the_guard: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q is bound to the Kong realization, which only core/gateway/kong carries out: the routes that component's Recipes import carry the guard, and %s renders none of them, so nothing would be guarded. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The guard is written onto the routes of the wired models, and with none
    # wired the gateway renders no model route to guard.
    models_are_wired: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q needs a model route to guard, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no request the guard could refuse; wire a model to that socket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # Kong keeps one instance of a plugin on a route, so a second attachment
    # could not hold beside the first.
    one_guard_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-deny-patterns" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/prompt-deny-patterns is attached to %q more than once (%s), but core/gateway/kong carries one AI Prompt Guard on a route, so the attachments cannot each hold; keep one attachment, with every expression in its lists" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
    # Kong's schema bounds each list and each expression, and an import past
    # either bound fails, leaving the gateway unstarted.
    lists_fit_the_guard: >-
      {{- range $list := list "deny_patterns" "allow_patterns" -}}
      {{- $patterns := optional $.values $list list -}}
      {{- if gt (len $patterns) 10 -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q lists %d expressions in %s, but core/gateway/kong's AI Prompt Guard takes at most 10 in a list, and an import holding more fails, leaving the gateway unstarted; keep at most 10, joining expressions with | where one can stand for several" $.metadata.feature_instance $.metadata.instance_id (len $patterns) $list) -}}
      {{- end -}}
      {{- range $pattern := $patterns -}}
      {{- if gt (len (toString $pattern)) 500 -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q holds an expression of %d bytes in %s, but core/gateway/kong's AI Prompt Guard takes expressions of at most 500 bytes, and an import holding a longer one fails, leaving the gateway unstarted; shorten it, or move some of its alternatives to an entry of their own" $.metadata.feature_instance $.metadata.instance_id (len (toString $pattern)) $list) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
