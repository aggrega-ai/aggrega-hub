apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: fallback-chain-agentgateway
  version: 1.0.0
  description: >
    Binds core/fallback-chain on the gateway core/gateway/agentgateway to a
    halt naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no virtual model.

    agentgateway 1.6.0 fails over between models through a virtual model, a
    name whose targets sit in priority groups. A request is sent to the first
    group holding a target that has not been evicted, and a failed send
    evicts that target for the requests that come after it while the request
    it failed is answered with that failure; a retry beside it chooses again
    from whichever group is active at that moment, which can be the target
    that just failed. So no request is sent on to the next model of a chain
    once its own has failed, which is what the Feature promises, and a
    fallback's own entry could not be followed in turn either, since a
    virtual model's targets are model entries rather than other virtual
    models. The build halts on every attachment, naming why; with nothing
    wired to the models socket it halts saying the gateway serves no model
    route. It halts on any component other than core/gateway/agentgateway.
    The compose realization of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/fallback-chain:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write sends a failed request on to another model.
  #
  # How the gateway fails over, read in agentgateway's source and reference
  # at v1.6.0, the release the gateway's Recipes pin. A virtual model's
  # failover targets become one backend whose priority groups are the
  # distinct priorities in order, each target an entry of the configuration's
  # model list. Each send takes the first group holding a target not evicted,
  # and when every group is evicted it falls back to the first group. A send
  # that fails — by default a 5xx reply or a failed connection — marks its
  # target unhealthy, and the eviction it triggers is handed to a background
  # task, so it takes effect for the requests that follow; the request that
  # failed is answered with its failure. agentgateway's reference puts it
  # plainly: failover is driven by eviction of the active set, not by
  # rewriting a single in-flight request to another target, and the request
  # that triggers eviction still fails unless retries let a later attempt
  # choose again after eviction. A retry chooses again from the group active
  # when it is sent, which, before the eviction lands, is still the one whose
  # target just failed. The Feature sends the request whose model fails on to
  # the models its chain names, in turn, until one answers, so the walk it
  # promises cannot be met, whatever list a realization writes.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the walk the gateway's
    # failover does not make; with none, for the model route the gateway does
    # not serve.
    gateway_walks_a_failed_request_on: >-
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q asks for a request whose model fails to be sent on to the models its chain names, in turn, until one answers, but core/gateway/agentgateway fails over between models only by eviction: a request is sent to the first priority group of a virtual model holding a target not evicted, a failed send evicts that target for the requests after it while the request itself is answered with its failure, and a retry chooses again from the group still active, which can be the model that just failed, so no request is walked along a chain; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q asks for failed requests to fall back to other models, but nothing is wired to the models socket of %q, so the gateway serves no model route to fall back from; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
