apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: semantic-caching-agentgateway
  version: 1.0.0
  description: >
    Binds core/semantic-caching on the gateway core/gateway/agentgateway to a
    halt naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file, writes no cache and binds no store.

    agentgateway 1.6.0 keeps no cache of model replies: it answers every
    model request by calling the model, and nothing in its configuration
    stores a reply or compares one prompt with another. Its prompt caching is
    a different thing, marking in a request where a provider that caches
    prompts itself may do so; the reply still comes from the model. So the
    build halts on every attachment, naming the scope asked for and the cache
    the gateway lacks. With nothing wired to the models socket the gateway
    serves no model route to cache, and it halts saying so. It halts on any
    component other than core/gateway/agentgateway. The compose realization
    of the gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway has
  # no cache to write.
  #
  # What the gateway offers, read in agentgateway's source, configuration
  # schema and reference at v1.6.0, the release the gateway's Recipes pin. No
  # setting stores a model's reply or serves one in place of a call: the
  # caches its configuration holds keep authorization decisions and exchanged
  # tokens, its cost catalog prices the prompt tokens a provider reports
  # reading from its own cache, and its prompt caching inserts cache points
  # into a request for providers that cache prompts themselves. None of them
  # answers a prompt with a reply stored for an earlier one.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the cache the gateway
    # lacks; with none, for the model route the gateway does not serve.
    gateway_keeps_a_reply_cache: >-
      {{- $scope := toString (optional .values "scope" "end_user") -}}
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies served by meaning, with scope %s, but core/gateway/agentgateway keeps no cache of replies: it answers every model request by calling the model, and its prompt caching only marks where a provider that caches prompts itself may do so; remove the attachment" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- else -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be cached; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
