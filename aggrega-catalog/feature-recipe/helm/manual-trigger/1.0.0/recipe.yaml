apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: manual-trigger
  version: 1.0.0
  description: >
    Realizes core/manual-trigger on Kubernetes, on core/compute/task's helm
    Recipe, helm/task; a Release binds it in its Manifest. It emits nothing:
    the host's Recipe carries the change, rendering a task with no schedule as
    a suspended CronJob in place of the Job that would run at deploy, because
    a FeatureRecipe sees neither the host's values nor can it withdraw a
    resource the host emits. A scheduled task runs on its schedule as it does
    without the attachment.

    A run is started by hand by the operator with kubectl create job
    <run-name> --from=cronjob/<cronjob>, the CronJob named as the component
    is rendered.

    The build halts, naming the attachment, on a component whose render emits
    a Job, which runs as soon as it is deployed, or no CronJob to start a run
    from, as helm/agenta-migrations renders its run.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/manual-trigger:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  #
  # No source, valuesMapping, workload, injectMapping or assertions: an
  # unscheduled task held until someone starts it is what helm/task renders
  # when it finds this attachment among the component's own, so this
  # FeatureRecipe adds nothing to the task's delivery pipe and its one artifact
  # renders empty, which writes no file.
  #
  # The Feature applies to every component of type task, and more than one
  # Recipe renders such a component on helm: helm/agenta-migrations renders its
  # migration step as a Job, run once at deploy, and reads no attachment. An
  # attachment accepted there would leave that run starting at deploy while
  # the build reported it held. This FeatureRecipe cannot read which Recipe
  # rendered its host, but it reads what the host's render emitted, from the
  # helm provider's controller_selectors render fact, one entry per controller
  # with its kind and name. So the artifact below halts, naming the
  # attachment, the component and the controller, where the host's render
  # emitted a Job, which starts its run as soon as it is deployed, or no
  # CronJob, which is what a run is started from by hand. That holds for any
  # Recipe rendering a task-typed component on helm, without a list of Recipe
  # names to keep current. A host emitting a CronJob and no Job passes: on
  # helm/task, that is a suspended CronJob with no schedule authored, and one
  # running on the developer's schedule otherwise.
  artifacts:
    manual-trigger.yaml: |
      {{- $attName := .attachment_name }}
      {{- $host := .context.instance_id }}
      {{- $jobs := list }}
      {{- $cronJobs := list }}
      {{- range (default (list) (get (default dict .context.render_facts) "controller_selectors")) }}
        {{- $kind := toString (get . "kind") }}
        {{- if eq $kind "Job" }}{{ $jobs = append $jobs (printf "%q" (toString (optional . "name" ""))) }}{{ end }}
        {{- if eq $kind "CronJob" }}{{ $cronJobs = append $cronJobs (toString (optional . "name" "")) }}{{ end }}
      {{- end }}
      {{- if $jobs }}
        {{- fail (printf "core/manual-trigger attachment %q on %q: %q renders the Job %s, which starts its run as soon as it is deployed, so the run would not wait for someone to start it; remove the attachment from %q in the Aggregate, or map the component in the Manifest to a Recipe that renders it as a suspended CronJob while it carries core/manual-trigger, as helm/task does for core/compute/task" $attName $host $host (join ", " $jobs) $host) }}
      {{- end }}
      {{- if not $cronJobs }}
        {{- fail (printf "core/manual-trigger attachment %q on %q: %q renders no CronJob, and on Kubernetes a run is started by hand by creating a Job from a CronJob, with kubectl create job --from=cronjob/; remove the attachment from %q in the Aggregate, or map the component in the Manifest to a Recipe that renders it as a suspended CronJob while it carries core/manual-trigger, as helm/task does for core/compute/task" $attName $host $host $host) }}
      {{- end }}
