apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: audit-logging-agentgateway
  version: 1.0.0
  description: >
    Realizes core/audit-logging on the gateway core/gateway/agentgateway; a
    Release binds it in its Manifest. It emits no file of its own: while the
    attachment is present, the gateway's chart Recipe, agentgateway-chart,
    gives the gateway its store, a SQLite file on a volume it renders, with
    one replica, and the gateway writes there a record of each model request
    that passes its key, budget and authorization checks, a guard's refusal
    included.

    A record names the model the gateway asked the model server for — the
    name the wired model publishes, not the alias the caller sent — and the
    model that answered, the input, output and total tokens the reply
    reports, the response's status and timing, and, for a caller
    infra.callers declares, that caller's name, from the API key the gateway
    verified. It keeps no prompt or reply text. The records are read through
    the gateway's admin interface, which listens inside its pod.

    So it honours require_verified_caller while callers are declared, and
    refuses by name require_cost while on, since no model wired to the
    gateway is priced, require_verified_caller while on with no caller
    declared, and retention_days, since the gateway deletes no record. It
    halts with nothing wired to the models socket, and on any component
    other than core/gateway/agentgateway. The compose realization of the
    gateway has no realization of it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/audit-logging:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: the gateway's chart Recipe gives the
  # gateway its database while a core/audit-logging attachment is present, and
  # this realization checks what the records the gateway then writes can keep.
  #
  # What the gateway records, read in agentgateway's source at v1.6.0, the
  # release the gateway's Recipes pin. With a database in its configuration
  # the gateway writes a row to the request_logs table of that database for
  # each model request that passes its API key, budget and authorization
  # checks — one a guard refuses included, one refused for its key, by an
  # authorization rule or by a caller's budget leaving none: when it started
  # and completed, its HTTP status, the model the gateway asked the model
  # server for, which is the name the wired model publishes rather than the
  # alias the caller sent, and the model the reply names, the input,
  # output and total tokens the reply reports, a cost, and the user the
  # request is attributed to — by default the name in the metadata of the API
  # key the gateway verified, which for each caller infra.callers declares is
  # the caller's name. The chart Recipe sets the access log's database mode to
  # metadata, so no prompt or reply text is stored. The store is a SQLite
  # file on a volume the chart Recipe renders while the attachment is present,
  # read through the gateway's admin interface, which listens on the pod's own
  # loopback address. Value by value:
  # - require_cost: the gateway prices a request from its model cost catalog,
  #   which prices none of the models this catalog wires to it, each of them
  #   an OpenAI-compatible entry of the gateway's own, so every record would
  #   carry no cost. Refused while on; off, the record carries the tokens and
  #   no cost.
  # - require_verified_caller: the record names the caller whose API key the
  #   gateway verified, in strict mode, so it is honoured while infra.callers
  #   declares a caller. Refused while on with no caller declared, the model
  #   routes then being open; off, the record then names no caller.
  # - retention_days: the gateway deletes no record, and nothing in its
  #   configuration sets how long one is kept, so a record lasts as long as
  #   the volume holding the store. Refused wherever given.
  #
  # No assertion can read the host component's labels or infra, so what the
  # gateway is able to do is stated in the messages, and the check of the
  # host's type first in the list is what keeps those statements true. The
  # callers are read from the local callers agentgateway-chart publishes, the
  # list infra.callers declares, because this check reads the host Recipe's
  # locals and not the host's infra.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/agentgateway and core/gateway/agentgateway:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/agentgateway" -}}
      {{- fail (printf "core/audit-logging attachment %q on %q is bound to the agentgateway realization, which describes core/gateway/agentgateway alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # With nothing wired to the models socket the gateway serves no model
    # request to record. With a model wired, each value the records cannot
    # keep is refused by name, every one in a single failure, so an attachment
    # at the defaults is told every strict value it needs to change at once. A
    # strict value is strict unless the attachment writes it false.
    gateway_keeps_the_record_asked_for: >-
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for a record of the model requests the gateway serves, but nothing is wired to the models socket of %q, so the gateway serves no model and there is no model request to record; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
      {{- $infra := default dict .infra -}}
      {{- $costOff := and (hasKey $infra "require_cost") (eq (toString (index $infra "require_cost")) "false") -}}
      {{- $callerOff := and (hasKey $infra "require_verified_caller") (eq (toString (index $infra "require_verified_caller")) "false") -}}
      {{- $days := toString (optional .infra "retention_days" "") -}}
      {{- $refused := list -}}
      {{- $change := list -}}
      {{- if not $costOff -}}
      {{- $refused = append $refused "what each request cost, which require_cost asks for, since the gateway prices a request from its model cost catalog and that catalog prices none of the models wired to it here" -}}
      {{- $change = append $change "set require_cost to false to accept a record carrying no cost" -}}
      {{- end -}}
      {{- if and (not $callerOff) (not (optional .locals "callers" "")) -}}
      {{- $refused = append $refused (printf "the caller the gateway verified, which require_verified_caller asks for, since infra.callers of %q declares no caller, so the gateway checks no key and verifies no caller" .metadata.instance_id) -}}
      {{- $change = append $change "set require_verified_caller to false to accept a record naming no verified caller, or declare the callers in infra.callers with their keys through the caller_keys slot" -}}
      {{- end -}}
      {{- if ne $days "" -}}
      {{- $refused = append $refused (printf "a retention of %s days, which retention_days asks for, since the gateway deletes no record and nothing in its configuration sets how long one is kept" $days) -}}
      {{- $change = append $change "remove retention_days" -}}
      {{- end -}}
      {{- if $refused -}}
      {{- fail (printf "core/audit-logging attachment %q on %q asks for what the records core/gateway/agentgateway keeps cannot hold: %s. On this attachment in the Release, %s, or attach the Feature to a gateway that keeps it" .metadata.feature_instance .metadata.instance_id (join "; " $refused) (join ", and " $change)) -}}
      {{- end -}}
