apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: retry-policy-kong-enterprise
  version: 1.0.0
  description: >
    Binds core/retry-policy on the gateway core/gateway/kong-enterprise to a
    halt naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no retry count.

    Kong Gateway Enterprise's AI Proxy Advanced holds a count of retries on
    each route's balancer, spent across that route's targets. On this gateway
    each model wired to the models socket is served on routes of its own,
    which carry that one model, so a retry has to send the request to that
    same target again, and Kong's reference reads both ways on whether the
    balancer does: the reference has a failed request move to the next
    target, and Kong's changelog fixed the balancer retrying the first target
    more than once, while its load-balancing page says a failure retries the
    same or another target. The code that decides it ships compiled, and no
    measurement on a licensed gateway has settled it. The retry count of the
    service a route belongs to resends no POST once sent and acts on no status
    code, so it does not honour the Feature either. So the build halts on
    every attachment, naming why; with nothing wired to the models socket it
    halts saying the gateway serves no model route. It halts on any component
    other than core/gateway/kong-enterprise.

    It writes no plugin. Kong sells AI Proxy Advanced under its AI Gateway
    Enterprise entitlement, which no build can verify and without which Kong
    skips the plugin silently.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/retry-policy:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write is shown to send a request to a model again.
  #
  # Why no retry is written. AI Proxy Advanced holds one count of retries per
  # route's balancer, spent on the failures its failover criteria list. Kong's
  # reference has each such failure move the request to the next target, and
  # its changelog fixed, as defects, the balancer retrying the first target
  # more than once and its retries going on with the last target chosen after
  # every priority peer had been tried; read that way, a balancer holding one
  # target sends a request once whatever its count of retries says. Kong's
  # load-balancing page also has a failure retry the same or another target,
  # which would send it again. Each wired model's chat and completion routes
  # carry that one model, so the two readings give a Release asking for three
  # attempts three sends or one, with nothing at build time to tell which.
  # Kong's own retries on the service each route belongs to, five by default,
  # resend no POST once it is sent, and every chat and completion request is a
  # POST; nor do they resend on a status code, so a 429 or a 503 from the model
  # is returned as it came.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/retry-policy attachment %q on %q is bound to the Kong Gateway Enterprise realization, which describes core/gateway/kong-enterprise alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the second send to its one
    # target that Kong's balancer is not shown to make; with none, for the model
    # route the gateway does not serve.
    gateway_resends_to_the_one_target: >-
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/retry-policy attachment %q on %q asks for max_attempts %d, but on core/gateway/kong-enterprise each model wired to the models socket is served on routes of its own carrying that one model, so a retry has to send the request to that same target again, and Kong Gateway Enterprise's AI Proxy Advanced is not shown to do so: Kong's reference moves a failed request to the next target and its changelog fixed the balancer retrying the first target more than once, while its load-balancing page says a failure retries the same or another target; the code that decides it ships compiled, and no measurement on a licensed gateway has settled which holds. The retry count of the service each route belongs to resends no POST once sent and acts on no status code; remove the attachment" .metadata.feature_instance .metadata.instance_id (int64 .values.max_attempts)) -}}
      {{- else -}}
      {{- fail (printf "core/retry-policy attachment %q on %q asks for requests to be sent again, but nothing is wired to the models socket of %q, so the gateway serves no model route to retry on; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
