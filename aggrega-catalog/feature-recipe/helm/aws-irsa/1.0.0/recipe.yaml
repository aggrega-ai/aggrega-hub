apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: aws-irsa
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/aws-irsa: emits one Kubernetes
    ServiceAccount per attached component from a co-located chart, annotated with
    the operator-set IAM role ARN for IAM Roles for Service Accounts (IRSA). The
    ServiceAccount name defaults to <instance-id>-aws-irsa and is published as
    provides so the operator can mirror it onto the consumer's
    aggrega.ai/service-account annotation. Resource Generation via source +
    valuesMapping; the per-component .context.* root is available at component
    scope.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/aws-irsa:1.0.0

  # The emitted ServiceAccount's name is published so a consumer can bind to it
  # by setting aggrega.ai/service-account to this same value. Both the published
  # name and the chart's ServiceAccount name below read the operator-set
  # service_account_name directly — one authored input, no re-derivation.
  provides:
    name: "{{ .infra.service_account_name }}"

  # Resource Generation via a co-located Helm chart: renders one ServiceAccount
  # named for the operator-set service_account_name and annotated with the IAM
  # role ARN.
  source: ./chart
  valuesMapping: |
    saName: "{{ .infra.service_account_name }}"
    roleArn: "{{ .infra.role_arn }}"
