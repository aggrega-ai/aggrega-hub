apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: aws-irsa
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/aws-irsa: emits one Kubernetes
    ServiceAccount per attached component from a co-located chart, annotated with
    the operator-set IAM role ARN for IAM Roles for Service Accounts (IRSA). An
    operator-set service_account_name is used exactly as written, so a name an IAM
    role's trust policy already names is never rewritten; left unset, the name
    composes the host component's rendered name — the name the helm provider
    spells in the characters a Kubernetes name allows — with the name the
    attachment is carried under, so attaching this Feature to several components
    in one namespace emits a distinct ServiceAccount for each. The name is
    published as provides so the operator can
    mirror it onto the consumer's aggrega.ai/service-account annotation. Resource
    Generation via source + valuesMapping; the per-component .context.* root is
    available at component scope.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/aws-irsa:1.0.0

  # The emitted ServiceAccount's name, derived once here and read by both the
  # published name below and the chart's saName, so the name a consumer binds to
  # and the name the chart emits cannot disagree.
  #
  # An operator-set service_account_name is honoured exactly as written: an IAM
  # role's trust policy names the ServiceAccount it will mint credentials for, so
  # that name has to match something outside this build and is not the compiler's
  # to rewrite. Left unset, the name composes the host component's rendered name
  # with the name the attachment is carried under — which is what keeps two
  # attachments of this Feature in one namespace from deriving the same
  # ServiceAccount name. The host part is .context.rendered_name, never
  # .context.instance_id: a component's name may carry an underscore or a
  # capital, which the rendered name writes out.
  locals:
    sa_name: '{{ default (printf "%s-%s" .context.rendered_name (.attachment_name | replace "_" "-")) .infra.service_account_name }}'

  provides:
    name: "{{ .locals.sa_name }}"

  # Resource Generation via a co-located Helm chart: renders one ServiceAccount
  # under the name derived above and annotated with the IAM role ARN.
  source: ./chart
  # The chart is also passed the scope's namespace, when the scope declares one,
  # so the emitted ServiceAccount lands beside the workload that mounts it rather
  # than wherever the applying tool defaults to. Empty when no scope declares one,
  # and the chart then omits the field — matching a synthesized workload, which
  # also emits no namespace and is placed by the applying tool.
  valuesMapping: |
    saName: "{{ .locals.sa_name }}"
    roleArn: "{{ .infra.role_arn }}"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
