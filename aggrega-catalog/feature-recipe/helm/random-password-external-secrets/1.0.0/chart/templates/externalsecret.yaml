apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0s"
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.secretName }}
      rewrite:
        - regexp:
            source: "^password$"
            target: {{ .Values.dataKey | quote }}
