apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.secretName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  length: {{ .Values.length }}
  {{- if not .Values.symbols }}
  symbols: 0
  {{- end }}
  noUpper: false
  allowRepeat: true
