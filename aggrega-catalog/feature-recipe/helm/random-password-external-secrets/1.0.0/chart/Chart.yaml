apiVersion: v2
name: random-password-external-secrets
description: >
  A two-template local Helm chart that renders an External Secrets Operator
  Password generator and the ExternalSecret that fills a Secret from it. It is
  the source: of the random-password-external-secrets FeatureRecipe — the
  FeatureRecipe renders this chart once per attachment, naming the generator,
  the ExternalSecret and the Secret they fill from the attachment's published
  provides, and sizing the password from the attachment's values.
version: 0.1.0
appVersion: "1.0.0"
