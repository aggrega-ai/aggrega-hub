apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: target-selection-traefik-hub
  version: 1.0.0
  description: >
    Binds core/target-selection on the gateway core/gateway/traefik-hub to a
    halt naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no balancer.

    Traefik picks by lowest response time only among the servers of one
    Kubernetes Service, which one Chat Completion middleware covers with one
    model name and one credential; between Services it balances by weight or
    by a hash of the client's address, or fails over in a fixed order. On
    this gateway each model wired to the models socket is served on a route
    of its own carrying that one model, so there is nothing to choose
    between, and no Traefik strategy chooses a target by cost. So the build
    halts on every attachment, naming the strategy asked for and why the
    gateway cannot honour it; with nothing wired to the models socket it
    halts saying the gateway serves no model route. It halts on any component
    other than core/gateway/traefik-hub.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/target-selection:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway
  # has no choice to make.
  #
  # How Traefik chooses, read in Traefik Proxy's load-balancing and
  # TraefikService references. A Service's strategy leasttime picks among its
  # servers the one with the lowest response time and fewest connections;
  # the servers of one Service are reached through the route's one Chat
  # Completion middleware, so they serve one model name with one credential,
  # where the Feature's targets are models of their own. Between Services a
  # TraefikService balances by weight, or by a hash of the client's address
  # weighted the same way, mirrors, or fails over in a fixed order, which
  # core/fallback-chain uses; none of these looks at latency or price.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/traefik-hub and core/gateway/traefik-hub:1.0.0 are the
    # same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/traefik-hub" -}}
      {{- fail (printf "core/target-selection attachment %q on %q is bound to the Traefik Hub realization, which describes core/gateway/traefik-hub alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, naming the strategy asked for
    # and why the gateway cannot honour it; with none, for the model route the
    # gateway does not serve.
    gateway_chooses_by_the_strategy: >-
      {{- $strategy := toString (optional .values "strategy" "latency") -}}
      {{- if optional .uses "models" dict -}}
      {{- if eq $strategy "cost" -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy cost, but no strategy of core/gateway/traefik-hub's balancing chooses a target by cost, and each model wired to its models socket is served on a route of its own carrying that one model, so there is nothing to choose between; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy %s, but core/gateway/traefik-hub picks by lowest response time only among the servers of one Service, which one model name and one credential cover, and between Services balances by weight or by a hash of the client's address, never by latency; each model wired to its models socket is served on a route of its own carrying that one model, so there is nothing to choose between; remove the attachment" .metadata.feature_instance .metadata.instance_id $strategy) -}}
      {{- end -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for a choice between targets, but nothing is wired to the models socket of %q, so the gateway serves no model route to choose a target for; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
