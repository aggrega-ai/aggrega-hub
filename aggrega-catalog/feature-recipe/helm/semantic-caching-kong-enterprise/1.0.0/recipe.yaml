apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: semantic-caching-kong-enterprise
  version: 1.0.0
  description: >
    Binds core/semantic-caching on the gateway core/gateway/kong-enterprise to
    a halt naming why the gateway cannot keep it; a Release binds it in its
    Manifest. It emits no file, writes no cache and binds no store.

    Kong Gateway Enterprise carries a semantic cache, AI Semantic Cache, but
    has no setting that keeps one caller's cached replies apart from
    another's. Kong tells callers apart only as the consumers an
    authentication plugin names, a consumer being the holder of a key, not the
    end user behind it. The gateway declares no callers: the import of its
    routes file adds and updates what the file names and removes nothing, so a
    consumer and its key, once written, would stay able to authenticate after
    the caller is removed from the Release, and a rotated key would leave the
    old one working. Nor can a key-auth key be held by reference, so a caller's
    key could reach Kong only as a literal in a rendered file. Under end_user
    and under key alike every request would share one cache, and a reply
    generated for one caller could be served to another. So the build halts on
    every attachment, naming the scope asked for and the caller separation the
    cache lacks. With nothing wired to the models socket the gateway serves no
    model route to cache, and it halts saying so. It halts on any component
    other than core/gateway/kong-enterprise.

    It writes no plugin. Kong sells the cache under its AI Gateway Enterprise
    entitlement, which no build can verify and without which Kong skips the
    plugin silently.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/semantic-caching:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because nothing this
  # realization could write keeps callers apart.
  #
  # What the gateway would cache under. Kong's AI Semantic Cache stores a reply
  # under the vector of the prompt it answered, in a store shared by every
  # request the plugin instance sees. The plugin can be scoped to one consumer
  # or consumer group, which an authentication plugin names, and to nothing
  # finer; its configuration holds no field that partitions entries by caller.
  # core/gateway/kong-enterprise declares no callers, because the import of its
  # routes file could not revoke one: it adds and updates what the file names
  # and removes nothing, so a consumer and its key, once written, stay able to
  # authenticate after the caller is removed from the Release, and a rotated key
  # leaves the old one working. Nor can a key-auth key be held by reference, so
  # a caller's key would reach Kong only as a literal in a rendered file. So
  # the gateway identifies nobody: under end_user, which keeps each end user the
  # gateway identifies apart, and under key, which keeps apart the callers
  # presenting one key to the gateway, either would serve one caller a reply
  # generated for another under a name that says it does not.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q is bound to the Kong Gateway Enterprise realization, which describes core/gateway/kong-enterprise alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the caller separation the
    # cache lacks; with none, for the model route the gateway does not serve.
    gateway_keeps_callers_apart: >-
      {{- $scope := optional .values "scope" "end_user" -}}
      {{- $asked := ternary "end_user, which keeps each end user the gateway identifies apart" "key, which keeps apart the callers presenting each key to the gateway" (eq $scope "end_user") -}}
      {{- if optional .uses "models" dict -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for scope %s, but Kong Gateway Enterprise's AI Semantic Cache keeps no entries apart per caller: no setting partitions its entries by caller, and Kong tells callers apart only as the consumers an authentication plugin names. core/gateway/kong-enterprise declares no callers, because the import of its routes file adds and updates what the file names and removes nothing, so a consumer and its key, once written, would stay able to authenticate after the caller is removed from the Release, and a rotated key would leave the old one working; and a key-auth key cannot be held by reference, so a caller's key could reach Kong only as a literal in a rendered file. The gateway therefore identifies no caller, no end user and no key: every request would share one cache, and a reply generated for one caller could be served to another; remove the attachment" .metadata.feature_instance .metadata.instance_id $asked) -}}
      {{- else -}}
      {{- fail (printf "core/semantic-caching attachment %q on %q asks for a cache of model replies, but nothing is wired to the models socket of %q, so the gateway serves no model route whose replies could be cached; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
