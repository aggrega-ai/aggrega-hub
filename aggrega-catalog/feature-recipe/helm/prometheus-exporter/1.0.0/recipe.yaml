apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prometheus-exporter
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/prometheus-exporter: emits one
    Prometheus ServiceMonitor per attached component from a co-located chart,
    templating the scrape interval, the named port and the metrics path from
    the operator-set feature infra. Resource
    Generation via source + valuesMapping; the per-component .context.* root is
    available at component scope. The ServiceMonitor is named from the attached
    component's rendered name, the name the helm provider spells in the
    characters a Kubernetes name allows, and selects the component's Service by
    its app.kubernetes.io/name label, which on a Service the helm provider
    synthesizes is the component's identity.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/prometheus-exporter:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  source: ./chart
  # The scope's namespace, when the scope declares one, so the emitted
  # ServiceMonitor lands beside the workload it scrapes rather than wherever the
  # applying tool defaults to. Empty when no scope declares one, and the chart
  # then omits the field — matching a synthesized workload, which also emits no
  # namespace and is placed by the applying tool.
  #
  # The ServiceMonitor's name and the label it selects on are two values, not
  # one. The name is a Kubernetes object name, so it is built from
  # .context.rendered_name: a component's name may carry an underscore or a
  # capital, which a Kubernetes name refuses and the rendered name writes out.
  # The selector matches the app.kubernetes.io/name label on the Service the
  # component's own Recipe emits, and a label value admits both, so it stays
  # the component's identity, .context.instance_id, which is what that label
  # carries on a Service the helm provider synthesizes.
  valuesMapping: |
    monitorName: "{{ .context.rendered_name }}-scrape"
    targetName: "{{ .context.instance_id }}"
    interval: "{{ .infra.interval }}"
    port: "{{ .infra.port }}"
    path: "{{ .infra.path }}"
    {{- $ns := "" }}
    {{- if .context.annotations }}
      {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
      {{- if $raw }}{{- $ns = $raw }}{{- end }}
    {{- end }}
    namespace: "{{ $ns }}"
