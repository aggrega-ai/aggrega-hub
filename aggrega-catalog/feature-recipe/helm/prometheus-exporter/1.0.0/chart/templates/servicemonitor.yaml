apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.monitorName }}
  {{- with .Values.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.targetName }}
  endpoints:
    - port: {{ .Values.port }}
      interval: {{ .Values.interval }}
      path: {{ .Values.path }}
