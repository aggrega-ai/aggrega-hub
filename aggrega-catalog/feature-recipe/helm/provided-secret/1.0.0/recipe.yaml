apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: provided-secret
  version: 1.0.0
  description: >
    Helm realization of core/secret-provided. origin — from values or infra,
    whichever carries it — is published as the `value` provides key, and the
    attachment dictates where it is delivered with its own `inject:` block on a
    transparent slot — this realization carries no injectMapping of its own, so
    an attachment without that block delivers the value nowhere. The value
    reaches a host Recipe that reads the slot's inject pipe, and it is written
    into the rendered output as it stands, so the material sits in the
    artifact. A host Recipe that renders the slot as a workload secret
    reference, a secretKeyRef, cannot take it: a value carries no locator for
    the reference to point at, and the build halts naming the slot. Fill such a
    slot with a referenceable credential instead.

    The name provided-secret is shared with the compose realization of the same
    Feature, so a Manifest references this one provider-qualified, as
    helm/provided-secret:1.0.0. A bare provided-secret:1.0.0 matches both and
    resolves to neither, and the pull halts on it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/secret-provided:1.0.0

  # DELIBERATE NEAR-DUPLICATE of the compose realization of the same name, which
  # differs only in spec.capability. The contract is host-side — the value is
  # published unchanged and the attachment's inject block delivers it — and a
  # provides value is a plain string that no $import: can supply, so the one line
  # the two share has no single home. If the Feature's provides contract changes,
  # change both realizations in the same edit.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. The expression is the one every realization of a credential
  # Feature that reads the locator repeats, for the reason above. values is read
  # only through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  provides:
    value: '{{ optional .values "origin" (optional .infra "origin" "") }}'
