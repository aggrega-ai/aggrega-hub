apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: provided-secret
  version: 1.0.0
  description: >
    Helm realization of core/secret-provided. values.origin is published as the
    `value` provides key, and the attachment dictates where it is delivered with
    its own `inject:` block on a transparent slot — this realization carries no
    injectMapping of its own, so an attachment without that block delivers the
    value nowhere. The value reaches a host Recipe that reads the
    slot's inject pipe, and it is written into the rendered output as it stands,
    so the material sits in the artifact. A host Recipe that renders the slot as
    a workload secret reference, a secretKeyRef, cannot take it: a value carries
    no locator for the reference to point at, and the build halts naming the
    slot. Fill such a slot with a referenceable credential instead.

    The name provided-secret is shared with the compose realization of the same
    Feature, so a Manifest references this one provider-qualified, as
    helm/provided-secret:1.0.0. A bare provided-secret:1.0.0 matches both and
    resolves to neither, and the pull halts on it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/secret-provided:1.0.0

  # DELIBERATE NEAR-DUPLICATE of the compose realization of the same name, which
  # differs only in spec.capability. The contract is host-side — the value is
  # published unchanged and the attachment's inject block delivers it — and a
  # provides value is a plain string that no $import: can supply, so the one line
  # the two share has no single home. If the Feature's provides contract changes,
  # change both realizations in the same edit.
  provides:
    value: "{{ .values.origin }}"
