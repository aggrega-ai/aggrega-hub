apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: target-selection-kong-enterprise
  version: 1.0.0
  description: >
    Binds core/target-selection on the gateway core/gateway/kong-enterprise to
    a halt naming why the gateway cannot honour it; a Release binds it in its
    Manifest. It emits no file and writes no balancer.

    Kong Gateway Enterprise chooses among a route's targets with AI Proxy
    Advanced, whose balancer can pick the lowest-latency target or the
    lowest-usage one. On this gateway each model wired to the models socket
    is served on routes of its own, which carry that one model, so a balancer
    there has one target and nothing to choose between. Choosing by cost
    would also need a price per target, which nothing the catalog renders
    supplies. So the build halts on every attachment, naming the strategy
    asked for and why the gateway cannot honour it; with nothing wired to the
    models socket it halts saying the gateway serves no model route. It halts
    on any component other than core/gateway/kong-enterprise.

    It writes no plugin. Kong sells AI Proxy Advanced under its AI Gateway
    Enterprise entitlement, which no build can verify and without which Kong
    skips the plugin silently.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/target-selection:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because the gateway has
  # no choice to make.
  #
  # Why there is nothing to choose between. Each connection on the models
  # socket becomes one service whose chat and completion routes each proxy to
  # the model that connection reaches, so a balancer written on a route holds
  # that one model. AI Proxy Advanced's lowest-latency algorithm picks the
  # target observed to answer quickest, and its lowest-usage algorithm by
  # cost picks the cheapest target, priced from an input and an output cost
  # per target, in whatever unit the configuration chooses; the catalog
  # supplies no such price. A route that falls back across models under
  # core/fallback-chain holds several targets, but in a priority order, and a
  # balancer runs one algorithm, so the choice could not be added there either.
  #
  # No assertion can read the host component's labels, so what the gateway is
  # able to do is stated in the messages, and the check of the host's type
  # first in the list is what keeps those statements true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/kong-enterprise and core/gateway/kong-enterprise:1.0.0 are
    # the same host.
    component_is_the_gateway_described: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/kong-enterprise" -}}
      {{- fail (printf "core/target-selection attachment %q on %q is bound to the Kong Gateway Enterprise realization, which describes core/gateway/kong-enterprise alone, and %s is not it. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Every attachment halts: with a model wired, for the one target each route
    # holds; with none, for the model route the gateway does not serve.
    gateway_has_targets_to_choose_between: >-
      {{- $strategy := toString (optional .values "strategy" "latency") -}}
      {{- if optional .uses "models" dict -}}
      {{- if eq $strategy "cost" -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy cost, but on core/gateway/kong-enterprise each model wired to the models socket is served on routes of its own carrying that one model, so a route's balancer has one target and nothing to choose between, and choosing by cost would need a price per target, which nothing the catalog renders supplies; remove the attachment" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for strategy %s, but on core/gateway/kong-enterprise each model wired to the models socket is served on routes of its own carrying that one model, so a route's balancer has one target and nothing to choose between; remove the attachment" .metadata.feature_instance .metadata.instance_id $strategy) -}}
      {{- end -}}
      {{- else -}}
      {{- fail (printf "core/target-selection attachment %q on %q asks for a choice between targets, but nothing is wired to the models socket of %q, so the gateway serves no model route to choose a target for; remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
