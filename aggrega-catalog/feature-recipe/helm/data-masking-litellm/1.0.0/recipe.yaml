apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: data-masking-litellm
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/data-masking on the AI gateway
    core/gateway/litellm, whose realization renders its routing table as a
    configuration body. The masking is a setting the running proxy reads out
    of that body rather than a resource of its own, so this recipe emits no
    file: it writes guardrail entries and one logging setting into the
    configuration the attached gateway already renders, and every other byte
    of that body is left as the gateway's own Recipe authored it. Each entry
    runs on every request that reaches the gateway, and a caller cannot switch
    it off from the request; an administrator can exempt a key or a team from
    the gateway's always-on guardrails in that key's or team's own settings.
    Listed patterns are matched inside the gateway, with no other service,
    ignoring letter case, against the text of every message whatever its role;
    a match is replaced for good by the pattern's name in capitals in
    brackets, [PROJECT_CODE_REDACTED] for a pattern named project_code. The
    gateway compiles each expression when it starts, and one that does not
    compile stops it starting. Listed entity types are found by the Presidio
    analyzer and replaced by the Presidio anonymizer that the gateway calls
    through its pii_analyzer and pii_anonymizer sockets: a person's name
    becomes <PERSON>. The recipe refuses action restore, which
    core/data-masking offers for a gateway that can map its stand-ins back
    reliably: this gateway numbers the stand-ins it maps back afresh in every
    text it masks, so two
    messages of one request, or two values of one tool call's arguments, can
    both carry <PERSON_1> for different names, and restoring could hand the
    caller one person's name where another's was written. Use action redact,
    which replaces each match for good. Both services receive the unmasked
    text, recognition runs in English, and it can miss an entity. When the
    analyzer cannot be reached or answers with an error, or the anonymizer
    cannot be reached while there is something to replace, the gateway fails
    the request with HTTP 500: masking a request, it forwards nothing, and
    masking a reply sent in one piece, it sends none of the reply. Entities in
    replies are masked by a guardrail loaded from a module the gateway's own
    Recipe delivers beside its
    configuration, in place of the gateway's built-in masking of a streamed
    reply, which passes the reply on unmasked when the analyzer cannot be
    reached. By default a request with stream set to true is then refused with
    HTTP 400 before it is forwarded, telling the caller to ask for the reply in
    one piece. With allow_streamed_replies set on the attachment in the
    Release, the gateway instead holds the whole streamed reply, masks it as
    one piece and sends it as a single chunk once all of it is masked, so the
    caller receives the reply all at once at the end rather than word by word;
    when masking it fails for any reason, including a recognizer that cannot
    be reached or answers with an error, the caller receives HTTP 500 and none
    of the reply. That guardrail also masks a reply's reasoning text with the
    same entity types, sent in one piece or streamed, in each field the
    gateway returns it in: a chat reply's reasoning text, thinking blocks and
    reasoning items and the copies of them the same reply carries among its
    provider-specific fields, the thinking blocks of a reply on the gateway's
    messages route, and the reasoning items of one on its responses route.
    Reasoning a provider returns under a name of its own among those
    provider-specific fields passes as sent. A thinking block's signature and
    a redacted block's data are passed on as the provider sent them, and a
    recognizer that cannot be reached fails the request before any of the
    reasoning is sent. With mask_reasoning set to false on the attachment in
    the Release, the reasoning text reaches the caller as the provider sent
    it. A client that sends a masked reply back on a later turn sends a
    thinking block whose text no longer matches its signature, the gateway
    forwards the block as the client sent it, and a provider that signs its
    reasoning documents that it refuses such a block with an error; a client
    that must send signed reasoning back needs mask_reasoning off. Listed
    entity types are also masked in tool-call arguments and tool results: in
    the tool calls a request's earlier turns carry and the results of those
    calls, by an entry of its own that runs before the built-in guardrail, on
    the chat, messages and responses routes; and in a reply's tool calls, by
    the reply guardrail, on those three routes in a reply sent in one piece and
    in a chat reply streamed under allow_streamed_replies. The arguments, and a
    result that is JSON, are masked value by value rather than as one text:
    they are read as JSON, every string value at any depth and every number
    whose digits the analyzer recognizes as a listed type are masked, each
    analyzed on its own, the names of the keys are not, and the JSON is written
    back, so it stays valid JSON and a name its escaping hides is still found.
    A recognized number becomes the placeholder as a string, so a tool whose
    schema asks for a number there refuses the call rather than receiving the
    original. A result that is not JSON is masked as one text. The built-in
    guardrail is kept off the chat route's tool turns, so their results are
    masked only value by value; the result on a legacy function turn is then
    masked once more by that guardrail as one text, which masks its keys as
    well, and one whose key is an address stops being valid JSON, though
    nothing in it reaches the provider unmasked. Arguments that are not JSON,
    other than empty ones, are never masked as one text: a reply carrying them
    is refused with HTTP 500 and none of it is sent, and a request carrying
    them in its conversation is refused with HTTP 400 before it is forwarded.
    Listed patterns are matched against tool-call arguments the same way,
    value by value, by an entry of their own beside the content filter: in the
    tool calls a request's earlier turns carry, on the chat, messages and
    responses routes, and in a reply's tool calls, in a reply sent in one piece
    on those three routes and in a streamed chat reply. A streamed chat reply's
    text keeps streaming, and its tool calls are held until the reply finishes
    and then sent whole and masked, just before its last chunk; when their
    arguments are not JSON, none of the tool calls is sent and the stream ends
    with an error after the text already sent. Patterns are not matched against
    a reply's reasoning text, nor against the result of an earlier tool call on
    the messages and responses routes, which reaches the model provider as the
    caller sent it (on the chat route such a result is masked as one text). A
    reply streamed on the messages or responses route is not masked by
    patterns at all, neither its text nor its tool calls; there, only a reply
    sent in one piece is masked. So an attachment listing patterns with scope
    response or both builds only with mask_reasoning set to false on it in the
    Release, and that attachment then masks none of a reply's reasoning text,
    with its patterns or with any entity types it lists; to have a reply's
    reasoning text masked, list the entity types in an attachment of their own
    and keep the patterns in one whose mask_reasoning is false or whose scope
    is request. The recipe halts
    on an entity type the analyzer does not recognize in English, which the
    analyzer would otherwise ignore without a word, on action restore, on
    patterns with scope response or
    both while mask_reasoning is on, on entities with the recognizer sockets
    unwired, and when the attachment is carried by any component other than
    core/gateway/litellm. While the masking is attached the gateway hands its
    logging integrations a redacted copy of every request's messages and every
    reply, and a caller cannot turn that off from the request; its debug
    output, which the gateway's Recipe does not turn on, still carries the
    unmasked text. The gateway leaves images and files unmasked, and it passes
    a request of a kind it does not scan through unchanged. A Release binds
    this recipe for core/data-masking in its Manifest.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/data-masking:1.0.0
  # executionScope omitted -> component: the pipeline runs once per attached
  # component and receives that component's rendered documents.
  #
  # No assertion can read the host component's labels, so the capability the
  # gateway declares is stated in each message, and the guard at the top is
  # what keeps that statement true.
  assertions:
    component_renders_the_body: >-
      {{- if ne .metadata.component "core/gateway/litellm" -}}
      {{- fail (printf "core/data-masking attachment %q on %q is bound to the LiteLLM realization, which writes its guardrails into the configuration body core/gateway/litellm renders; %s renders no such body. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # Action restore is refused on this gateway. LiteLLM numbers the stand-ins
    # it maps back afresh in every text it masks, so two names in one request
    # can both become <PERSON_1> and the reply then maps both back to one of
    # them: https://github.com/BerriAI/litellm/issues/31959, with a proposed
    # fix in https://github.com/BerriAI/litellm/pull/31978, open and in no
    # release as of 2026-09-27. The refusal is lifted once the LiteLLM release
    # this gateway pins carries a fix that numbers the stand-ins across a whole
    # request, established by running that release rather than assumed from
    # the fix's description; lifting it means writing output_parse_pii into
    # the request entries below and honouring it in the module the gateway's
    # Recipe delivers.
    restore_is_refused: >-
      {{- if eq (optional .values "action" "redact") "restore" -}}
      {{- fail (printf "core/data-masking attachment %q on %q asks for action restore, but core/gateway/litellm, which declares dataplane.aggrega.ai/content-masking: entity-recognition, numbers its stand-ins afresh in every text it masks, so two people's names can share a stand-in, and restoring could hand the caller one person's name where another's was written; set action to redact, which replaces each match for good" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
    # The gateway matches patterns against a reply's message text and never
    # against its reasoning text, so an attachment masking replies with
    # patterns cannot honour mask_reasoning while it is on. The value is read
    # exactly as the reply entry below reads it: only false turns it off.
    patterns_leave_reasoning_unmasked: >-
      {{- $scope := optional .values "scope" "request" -}}
      {{- $infra := default dict .infra -}}
      {{- $reasoningOff := and (hasKey $infra "mask_reasoning") (eq (toString (index $infra "mask_reasoning")) "false") -}}
      {{- if and (optional .values "patterns" list) (ne $scope "request") (not $reasoningOff) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists patterns with scope %s while mask_reasoning is on, but core/gateway/litellm declares dataplane.aggrega.ai/content-masking: entity-recognition and matches patterns against a reply's message text only, never its reasoning text, so what the patterns match would reach the caller unmasked in the reasoning text a reasoning model returns. Set mask_reasoning to false on this attachment in the Release, which lets reasoning text reach the caller unmasked; or mask replies by entity type in an attachment of its own, whose reasoning text is masked, and keep the patterns in an attachment with mask_reasoning false or with scope request" .metadata.feature_instance .metadata.instance_id $scope) -}}
      {{- end -}}
    # Tool-call arguments and tool results in a request's conversation, and
    # everything a reply carries by entity type, are masked by guardrail
    # classes the gateway's own Recipe delivers in a module beside the
    # configuration and publishes the names of; a Recipe publishing none would
    # leave the entries naming nothing the gateway can load.
    masking_module_is_delivered: >-
      {{- if and (or (optional .values "entities" list) (optional .values "patterns" list)) (not (optional .locals "masking_module" "")) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists what it masks, which core/gateway/litellm masks in tool-call arguments through a module its Recipe delivers beside the configuration, but the Recipe rendering %q delivers none; bind the component in the Manifest to a Recipe that does" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The entity types the Presidio analyzer that core/security/presidio-analyzer
    # runs reports it recognizes in English. A type outside the list is ignored
    # by the analyzer when it is listed beside one it knows, so the attachment
    # would mask nothing for it and nothing would say so.
    entity_types_the_analyzer_knows: >-
      {{- $known := list "CREDIT_CARD" "CRYPTO" "DATE_TIME" "EMAIL_ADDRESS" "IBAN_CODE" "IP_ADDRESS" "LOCATION" "MAC_ADDRESS" "MEDICAL_LICENSE" "NRP" "PERSON" "PHONE_NUMBER" "UK_NHS" "URL" "US_BANK_NUMBER" "US_DRIVER_LICENSE" "US_ITIN" "US_PASSPORT" "US_SSN" -}}
      {{- range $e := optional .values "entities" list -}}
      {{- if not (has $e $known) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists the entity type %q, which the Presidio analyzer core/gateway/litellm calls does not recognize in English; listed beside types it does recognize it would mask nothing and say nothing. List only types from: %s" $.metadata.feature_instance $.metadata.instance_id $e (join ", " $known)) -}}
      {{- end -}}
      {{- end -}}
    entities_need_the_recognizer: >-
      {{- if optional .values "entities" list -}}
      {{- $analyzer := hasKey .uses "pii_analyzer" -}}
      {{- $anonymizer := hasKey .uses "pii_anonymizer" -}}
      {{- if not (and $analyzer $anonymizer) -}}
      {{- $unwired := "neither its pii_analyzer socket nor its pii_anonymizer socket is wired" -}}
      {{- if $analyzer }}{{ $unwired = "its pii_anonymizer socket is not wired" }}{{ end -}}
      {{- if $anonymizer }}{{ $unwired = "its pii_analyzer socket is not wired" }}{{ end -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists entities, which core/gateway/litellm finds and replaces through the Presidio analyzer and anonymizer it calls, but %s; wire a core/security/presidio-analyzer to pii_analyzer and a core/security/presidio-anonymizer to pii_anonymizer on %q, or list patterns instead of entities" .metadata.feature_instance .metadata.instance_id $unwired .metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
  pipeline:
    # One entry per recognizer in the gateway's top-level guardrails list, each
    # found again by its name, so a second attachment adds entries rather than
    # replacing the first's. default_on runs an entry on every request, where
    # without it the entry runs only for a request that names it. Each pattern
    # is written as a JSON string, so its backslashes and quotes reach the
    # gateway exactly as authored. The entity entry names no address: the
    # gateway reads the recognizer's addresses from the environment its own
    # Recipe fills from the pii_analyzer and pii_anonymizer sockets. It always
    # lists the entity types, and that list is also what makes the gateway fail
    # a request when the analyzer answers with an error, where with no list it
    # would pass the text on unmasked. Listed patterns are matched in the text
    # of the messages by the gateway's content filter, and in tool-call
    # arguments by an entry of their own right after it, given the same mode
    # and the same patterns, each computed once. The text of a request's
    # messages is masked by entity type by the gateway's built-in Presidio
    # guardrail. The tool calls its earlier turns carry, which that guardrail
    # passes on, and the results of those calls are masked by an entry of
    # their own, value by value where they are JSON, written before the
    # built-in one: the built-in guardrail masks a JSON result as one text,
    # which can leave it no longer JSON, so it runs only after the walk, and
    # skip_tool_message_in_guardrail keeps it off the chat route's tool turns
    # altogether. A legacy function turn is not a tool turn to it, so that
    # result is masked once more as one text. A reply is masked by a further
    # entry, which refuses a streamed reply unless the attachment sets
    # allow_streamed_replies, and then masks it whole. The tool-call entries
    # and the reply's name a guardrail class loaded from the module the
    # gateway's Recipe delivers, named through that Recipe's locals. The reply
    # entry always states mask_reasoning, false only
    # when the Release sets it false on the attachment, and the class masks the
    # reply's reasoning text unless it reads false there.
    - id: write_masking_guardrails
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        {{- $scope := optional .values "scope" "request" }}
        {{- $patterns := optional .values "patterns" list }}
        {{- $entities := optional .values "entities" list }}
        {{- $id := printf "%s-%s" .context.instance_id (.attachment_name | replace "_" "-") }}
        {{- $piiEntities := "" }}
        {{- range $e := $entities }}{{ $piiEntities = printf "%s\n                %s: MASK" $piiEntities ($e | toJson) }}{{ end }}
        {{- $patternMode := "pre_call" }}
        {{- if eq $scope "both" }}{{ $patternMode = "[pre_call, post_call]" }}{{ else if eq $scope "response" }}{{ $patternMode = "post_call" }}{{ end }}
        {{- $patternList := "" }}
        {{- range $p := $patterns }}{{ $patternList = printf "%s\n                - pattern_type: regex\n                  name: %s\n                  pattern: %s\n                  action: MASK" $patternList ($p.name | toJson) ($p.regex | toJson) }}{{ end }}
        section: guardrails
        identifiedBy: guardrail_name
        entries:
        {{- if $patterns }}
          - guardrail_name: {{ $id }}
            litellm_params:
              guardrail: litellm_content_filter
              default_on: true
              mode: {{ $patternMode }}
              patterns:{{ $patternList }}
          - guardrail_name: {{ $id }}-tool-call-patterns
            litellm_params:
              guardrail: {{ .locals.masking_module }}.{{ .locals.tool_call_pattern_masking_class }}
              default_on: true
              mode: {{ $patternMode }}
              patterns:{{ $patternList }}
        {{- end }}
        {{- if and $entities (ne $scope "response") }}
          - guardrail_name: {{ $id }}-tool-call-entities
            litellm_params:
              guardrail: {{ .locals.masking_module }}.{{ .locals.request_tool_call_masking_class }}
              default_on: true
              mode: pre_call
              pii_entities_config:{{ $piiEntities }}
          - guardrail_name: {{ $id }}-entities
            litellm_params:
              guardrail: presidio
              default_on: true
              mode: pre_call
              presidio_filter_scope: input
              skip_tool_message_in_guardrail: true
              pii_entities_config:{{ $piiEntities }}
        {{- end }}
        {{- if and $entities (ne $scope "request") }}
          - guardrail_name: {{ $id }}-reply-entities
            litellm_params:
              guardrail: {{ .locals.masking_module }}.{{ if optional .infra "allow_streamed_replies" false }}{{ .locals.buffered_reply_masking_class }}{{ else }}{{ .locals.reply_masking_class }}{{ end }}
              default_on: true
              mode: post_call
              mask_reasoning: {{ $infra := default dict .infra }}{{ if and (hasKey $infra "mask_reasoning") (eq (toString (index $infra "mask_reasoning")) "false") }}false{{ else }}true{{ end }}
              pii_entities_config:{{ $piiEntities }}
        {{- end }}
    # While the masking is attached the gateway hands its logging integrations
    # a redacted copy of every request's messages and every reply.
    - id: turn_off_message_logging
      plugin: pipeline-step/litellm-gateway-config:1.0.0
      function: step
      with: |
        section: litellm_settings
        settings:
          turn_off_message_logging: true
