apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: manual-trigger
  version: 1.0.0
  description: >
    Realizes core/manual-trigger on Azure Resource Manager; a Release binds it
    in its Manifest. It emits nothing: the Recipe realizing the attached task
    carries the change, because whether a run starts is decided by the
    resources that Recipe writes into the template, and a FeatureRecipe adds
    resources of its own and can neither change its host's nor withdraw a run
    its host would start.

    Finding this attachment among its component's own, the task's Recipe
    deploys a task with no schedule without starting it, as a Container Apps
    job with a manual trigger, and it refuses by name an unscheduled task
    carrying none, since nothing would start the run that task asks for. A
    scheduled task runs on its schedule as it does without the attachment.

    The operator starts each run by hand with the target's own command, which
    the description of the Recipe realizing the task names. The build halts,
    naming the attachment, on an infra key written on it, as the Feature takes
    none.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: arm
  implements: core/manual-trigger:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  #
  # No source, valuesMapping, artifacts or injectMapping. Whether a task's run
  # starts is set by the resources the host's Recipe writes into the template:
  # a Container Apps job takes a trigger, manual or on a schedule, among its
  # own properties. So the Recipe realizing a task finds this attachment among
  # its component's attachments by its Feature's type, in an assertion of its
  # own, and renders the task with no schedule; this realization exists so
  # that the attachment is bound, since an unbound attachment halts the build.
  # It adds no resource to the template and nothing to the task's delivery
  # pipe.
  #
  # The binding relies on the host's Recipe reading the attachment, as every
  # arm Recipe of a task in this catalog does. This FeatureRecipe has nothing
  # to check that by: an Azure Resource Manager render reports no facts of
  # what it emitted, and a task's Recipe declares no local naming the change,
  # so a Recipe of a task that read no attachment would render its task as it
  # does without one.
  assertions:
    # The Feature declares no infra, and the build admits any key written
    # under an attachment's infra when its Feature declares none, so a key
    # written there would reach no emitted byte. The build halts on one,
    # naming every such key, rather than accepting and ignoring it.
    # DELIBERATE NEAR-DUPLICATE of terraform/manual-trigger's no_infra, word
    # for word: no catalog kind holds an assertion for several FeatureRecipes
    # to share, so a change to one is made to both.
    no_infra: >-
      {{- with sortAlpha (keys (optional . "infra" dict)) -}}
      {{- fail (printf "core/manual-trigger attachment %q on %q sets infra.%s, and core/manual-trigger takes no infra: the Recipe realizing %q reads only that the attachment is there, and nothing reads a key written under it; remove infra from the attachment" $.metadata.feature_instance $.metadata.instance_id (join ", infra." .) $.metadata.instance_id) -}}
      {{- end -}}
