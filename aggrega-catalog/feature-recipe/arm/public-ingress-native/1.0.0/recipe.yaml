apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: public-ingress-native
  version: 1.0.0
  description: >
    Realizes core/public-ingress on Azure Resource Manager through the cloud
    service's own public ingress; a Release binds it in its Manifest. It renders nothing:
    the Recipe realizing the attached server publishes it from the
    attachment, because what opens a managed server to the internet, and the
    custom domain it answers on, are properties of the resources that Recipe
    writes into the template, and a FeatureRecipe adds resources of its own
    and cannot change its host's.

    It binds on a server whose Recipe declares the local native_ingress,
    naming the ingress it configures, such as App Service public access,
    custom domain and certificate binding. Such a Recipe takes infra.host as
    the server's custom domain, reads the certificate that domain is served
    with from its own infra.overrides, and refuses by name what its service
    cannot keep.

    The build halts, naming the attachment, on a host whose Recipe declares
    no native_ingress, and on infra.service_name, infra.service_port_name,
    infra.ingress_class_name and infra.tls_secret, which name a Kubernetes
    Service, its port, an ingress class and a Kubernetes Secret.
    values.path is the host Recipe's to honour or refuse, as its service
    routes paths or does not; infra.control_plane_present is not read.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/public-ingress:1.0.0
  # executionScope omitted -> component: renders once per attached component.
  #
  # No source, valuesMapping, artifacts or injectMapping. What publishes a
  # managed server — the property that lets the internet reach it, the
  # custom domain bound to it and the certificate that domain is served
  # with — is set by the resources the host's Recipe writes into the
  # template: properties of an App Service app and of its host name binding.
  # This FeatureRecipe adds no resource the host's server is written in, so
  # the host's Recipe reads the attachment among its component's attachments
  # and writes those properties itself, and this realization exists so that
  # the attachment is bound: an unbound attachment halts the build. It
  # therefore emits nothing, and it publishes nothing.
  #
  # A Recipe that configures its server's public ingress from
  # core/public-ingress declares a local named native_ingress, naming what it
  # configures; an attached FeatureRecipe reads its host's locals beneath its
  # own. A host whose Recipe declares none would publish nothing from the
  # attachment, so the build halts rather than binding an attachment nothing
  # acts on.
  #
  # Every Feature value and infra key is honoured, refused below by name, or
  # not read:
  #   the host's Recipe's to honour or refuse — infra.host, as the server's
  #     custom domain, which that Recipe checks; and values.path, since one
  #     service routes a path prefix of a host to a server and another routes
  #     every path of it, so only the Recipe writing the service knows which.
  #   refused here — infra.service_name, infra.service_port_name,
  #     infra.ingress_class_name and infra.tls_secret. Each describes a
  #     Kubernetes Ingress rather than a cloud service's own public ingress,
  #     so the refusal has one home, here, for every host this FeatureRecipe
  #     binds on rather than one in each host's Recipe; the host's Recipe
  #     does not check them again.
  #   not read — infra.control_plane_present, the affirmation that an ingress
  #     controller runs in the cluster an Ingress lands in: the service's own
  #     front ends route the host, so no controller is needed and nothing the
  #     affirmation says changes what is published; and values.display_name,
  #     values.description, values.severity and values.as, which describe the
  #     attachment or name where a value it injects lands, and this
  #     realization injects nothing.
  #
  # DELIBERATE NEAR-DUPLICATE of terraform/public-ingress-native's check and
  # refusals, worded for this target: no catalog kind holds an assertion for
  # several FeatureRecipes to share, so a change to one is made to both.
  assertions:
    host_configures_its_ingress: >-
      {{- if not (toString (optional .locals "native_ingress" "")) -}}
      {{- fail (printf "core/public-ingress attachment %q on %q is bound to arm/public-ingress-native, which leaves the ingress to the Recipe realizing %q, and that Recipe configures no public ingress from core/public-ingress: map %q in the Manifest to a Recipe that does, one declaring the local native_ingress, such as arm/server-app-service from 1.1.0, or remove the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The Kubernetes Service an Ingress routes to, and its named port. The
    # service sends the host's requests to the server itself, on the port the
    # server's Recipe gives it, with no Service between them to name.
    service_name_refused: >-
      {{- if hasKey .infra "service_name" -}}
      {{- fail (printf "core/public-ingress attachment %q on %q sets infra.service_name, the Kubernetes Service an Ingress routes to, and the service the Recipe realizing %q publishes it with sends the host's requests to the server itself, with no Service to name: remove infra.service_name from the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    service_port_name_refused: >-
      {{- if hasKey .infra "service_port_name" -}}
      {{- fail (printf "core/public-ingress attachment %q on %q sets infra.service_port_name, the named port of the Kubernetes Service an Ingress routes to, and the service the Recipe realizing %q publishes it with sends the host's requests to the server on the port that Recipe gives it, with no Service port to name: remove infra.service_port_name from the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # The class of the ingress controller that reconciles an Ingress. The
    # service's own front ends serve the host, and no controller is chosen.
    ingress_class_name_refused: >-
      {{- if hasKey .infra "ingress_class_name" -}}
      {{- fail (printf "core/public-ingress attachment %q on %q sets infra.ingress_class_name, the class of the Kubernetes ingress controller that reconciles an Ingress, and the service the Recipe realizing %q publishes it with serves the host at its own front ends, with no ingress controller to choose: remove infra.ingress_class_name from the attachment" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    # A Kubernetes Secret holding the certificate an Ingress presents. The
    # service presents a certificate the operator keeps in the cloud, which
    # the host's Recipe reads by its ID from its own infra.overrides.
    tls_secret_refused: >-
      {{- if hasKey .infra "tls_secret" -}}
      {{- fail (printf "core/public-ingress attachment %q on %q sets infra.tls_secret, a Kubernetes Secret holding the certificate an Ingress presents, and the service the Recipe realizing %q publishes it with presents a certificate the operator keeps in the cloud, which that Recipe reads by its ID from a key of its own infra.overrides, as its description names, such as certificate_id on arm/server-app-service: remove infra.tls_secret from the attachment and set that key on %q in the Release" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
