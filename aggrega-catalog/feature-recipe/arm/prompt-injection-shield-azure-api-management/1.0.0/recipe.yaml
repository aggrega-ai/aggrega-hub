apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-injection-shield-azure-api-management
  version: 1.0.0
  description: >
    Realizes core/prompt-injection-shield on
    core/gateway/azure-api-management's arm Recipe; a Release binds it
    in its Manifest. The Recipe writes Azure's content safety check into the
    API's policy with its prompt shield on, and it emits no file.

    Azure AI Content Safety checks each request for a user attack before the
    model is called, and the gateway answers one it detects with HTTP 403. The
    shield is on or off, so it keeps sensitivity standard and refuses strict
    by name. It runs at Microsoft's own sensitivity, which is not measured
    against the threshold standard means on the gateways that send requests
    through a guard. The check calls the instance's Azure AI Content Safety
    resource through the backend infra.content_safety_backend_id names, which
    the instance reaches with its managed identity; the build halts while that
    key is unset, and cannot see the backend.

    It halts on any component other than core/gateway/azure-api-management,
    and on one whose Recipe writes no delivered element into its policy, as
    arm/azure-api-management 1.0.0; 1.1.0 or later writes it.
    That the check applies as described is Microsoft's documented behaviour,
    and no build observes it.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: arm
  implements: core/prompt-injection-shield:1.0.0
  # executionScope omitted -> component: the checks and the delivery run once
  # per attached component.
  #
  # DELIBERATE NEAR-DUPLICATE of
  # terraform/prompt-injection-shield-azure-api-management: the same checks,
  # refusals and delivery, worded for arm, with host_writes_the_policy_element
  # added. No catalog kind holds an assertion or a delivery for several
  # FeatureRecipes to share, so a change to one is made to both.

  # What Azure's check offers. Microsoft's llm-content-safety sends a request
  # to Azure AI Content Safety and blocks it with 403 when that service detects
  # malicious content; its shield-prompt setting, "if set to true, check
  # content for user attacks", is on or off, and the 0 to 7 thresholds the
  # policy takes belong to its four harm categories, not to the attack check.
  # So one value of the Feature's two maps onto it: standard, the default,
  # turns the shield on, and strict, which asks for a check refusing more
  # attacks than standard, has no setting to make it so.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/azure-api-management" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to the Azure API Management realization, which turns on the content safety check of the API policy core/gateway/azure-api-management renders on arm; %s renders no such policy. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # A Recipe that writes an attached FeatureRecipe's element into the
    # gateway's API policy declares a local named native_policy, naming that
    # policy; an attached FeatureRecipe reads its host's locals beneath its
    # own. A host whose Recipe declares none, as arm/azure-api-management
    # 1.0.0 does, writes nothing delivered on its inject pipe, so the build
    # halts rather than binding an attachment nothing acts on. The terraform
    # counterpart needs no such check: every version of
    # terraform/azure-api-management writes what is delivered.
    host_writes_the_policy_element: >-
      {{- if not (toString (optional .locals "native_policy" "")) -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q is bound to arm/prompt-injection-shield-azure-api-management, which delivers its element for the API policy the Recipe realizing %q writes, and that Recipe writes no delivered element into its policy, so the attachment would change nothing: map %q in the Manifest to arm/azure-api-management 1.1.0 or later, which writes the element into the Azure API Management API policy" .metadata.feature_instance .metadata.instance_id .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    sensitivity_is_one_the_gateway_keeps: >-
      {{- if eq (optional .values "sensitivity" "standard") "strict" -}}
      {{- fail (printf "core/prompt-injection-shield attachment %q on %q asks for sensitivity strict, but core/gateway/azure-api-management's prompt shield is on or off, checking each request at Microsoft's own sensitivity, with no setting that makes it refuse more attacks; set sensitivity to standard, or attach the Feature to a gateway whose guard runs the strict threshold" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}

  # Delivered on this node's inject pipe, on the azure_api_management mechanism
  # the gateway's arm Recipe reads, which writes the check with the
  # backend its own infra names.
  injectMapping: |
    azure_api_management:
      prompt_shield: "true"
