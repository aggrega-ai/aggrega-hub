apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: key-vault-secret
  version: 1.0.0
  description: >
    Points a consumer at an Azure Key Vault secret that already exists.
    origin, from values or infra, is the secret's resource ID,
    /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret>,
    and values.key is the data key; both are published exactly as written, as
    the locator a consuming Recipe turns into the Key Vault reference Azure
    Resource Manager reads when the template deploys. It renders no resource of
    its own, so the secret's value never passes through an authored file or the
    emitted template: whoever deploys creates the secret and lets the deploying
    identity read it. An origin that is not a Key Vault secret's resource ID
    halts the build.

    Reach for it where the secret lives in a Key Vault the operator owns. A
    secret that is generated at deploy time, or supplied as a template
    parameter, is not this realization.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/referenced-secret:1.0.0

  # core/referenced-secret requires both keys, and a consumer reads them from
  # .features.<slot>.provides. name is the secret's resource ID as the origin
  # wrote it, not normalized: a consumer splits it into the vault's ID and the
  # secret's name, and rewriting it would point the consumer at another secret.
  # key is the data key the attachment declares.
  #
  # No source or artifacts are declared: this realization emits nothing, and a
  # FeatureRecipe that emits nothing needs no engine input.
  #
  # origin is read from whichever pillar carries it, values where the developer
  # wrote it and infra where the operator did; the Feature halts the build when
  # both or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a
  # credential Feature that reads the locator repeats this one expression,
  # because it sits inside a template the realization owns, and no catalog kind
  # holds a single template expression for several entities to share. values is
  # read only through optional: a template that also read .values.origin as a
  # path would find the key present and empty, and never fall through to infra.
  provides:
    name: '{{ optional .values "origin" (optional .infra "origin" "") }}'
    key: "{{ .values.key }}"

  # The Feature holds presence only, so an origin that is no Key Vault secret's
  # resource ID passes it, and published as written the consumer would hand
  # Azure Resource Manager a reference to nothing, failing at deploy time far
  # from the attachment that caused it. So the origin is checked here, before
  # anything renders, for whichever pillar carried it.
  # DELIBERATE NEAR-DUPLICATE of the provides.name expression above, and the two
  # must be changed together: an assertion of a FeatureRecipe reads the
  # attachment's values and infra but not the name this FeatureRecipe publishes
  # (its .provides and .locals are the host component's), so the expression is
  # repeated rather than read back.
  #
  # The sentence names the attachment and the component, never the origin: the
  # origin is declared sensitive, so no value read from it is composed into the
  # text.
  assertions:
    origin_is_a_key_vault_secret: >-
      {{- $origin := toString (optional .values "origin" (optional .infra "origin" "")) -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+/secrets/[^/]+$` $origin) -}}
      {{- fail (printf "core/referenced-secret attachment %q on %q is bound to arm/key-vault-secret and sets an origin that is not a Key Vault secret's resource ID; write /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret> in values.origin in the Aggregate, or in infra.origin in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
