apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: concurrency-limit-nginx
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/concurrency-limit on the NGINX
    gateway, core/gateway/nginx, under Docker Compose. The cap is a setting
    inside the server configuration the gateway's own Recipe writes rather than
    a service of its own, so this recipe emits nothing: the NGINX Recipe reads
    the attachment and writes a limit_conn keyed on one fixed word, so NGINX
    counts every request the server is processing as one total, kept in shared
    memory across its worker processes, and answers a request past
    max_in_flight with 503. NGINX keeps that one total and no count for each
    upstream target — the gateway declares
    dataplane.aggrega.ai/concurrency-cap: total — so this recipe halts on scope
    model rather than capping the total in its place. It halts on a
    max_in_flight above 65535, the most limit_conn takes, and when the
    attachment is carried by any component other than core/gateway/nginx,
    because no other component's Recipe reads it, and the attachment would
    render no cap at all.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/concurrency-limit:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the NGINX Recipe, which reads it. What stays here is what that Recipe
  # cannot honour. No assertion can read the host component's labels, so the
  # value the gateway declares is stated in the message, and the guard above
  # it is what keeps that statement true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/nginx and core/gateway/nginx:1.0.0 are the same host.
    carrier_writes_the_cap: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/nginx" -}}
      {{- fail (printf "core/concurrency-limit attachment %q on %q is bound to the NGINX realization, which only core/gateway/nginx carries out: that component's own Recipe writes the cap into its server configuration, and %s renders none for it, so nothing would be capped. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # limit_conn counts against a key in one zone; with the key the same for
    # every request there is one count, and NGINX holds none for each target it
    # forwards to, so a cap per target is refused rather than written as the
    # total.
    one_total_only: >-
      {{- if ne (toString .infra.scope) "gateway" -}}
      {{- fail (printf "core/concurrency-limit attachment %q on %q asks for scope %v, but core/gateway/nginx declares dataplane.aggrega.ai/concurrency-cap: total — NGINX's limit_conn keeps one count of every request the gateway forwards and none for each upstream target. Omit scope, or set it to gateway, to cap the total, or attach the Feature to a gateway whose cap counts each target" .metadata.feature_instance .metadata.instance_id .infra.scope) -}}
      {{- end -}}
    # limit_conn takes a number from 1 to 65535 and refuses the configuration
    # above that, so NGINX would not start.
    cap_within_limit_conn: >-
      {{- if gt (int64 .infra.max_in_flight) 65535 -}}
      {{- fail (printf "core/concurrency-limit attachment %q on %q asks for max_in_flight %v, but NGINX's limit_conn takes at most 65535 requests at once and refuses a configuration above it, so NGINX would not start. Set max_in_flight to 65535 or less" .metadata.feature_instance .metadata.instance_id .infra.max_in_flight) -}}
      {{- end -}}
