apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: compose-bridge-fr
  version: 1.0.0
  description: >
    Cross-boundary network bridge for compose. Runs once per boundary
    attachment (executionScope: boundary), producing a single nginx-stream
    gateway named "aggrega-gw" at the boundary's evaluated assembly path. The
    gateway's stream config and the per-consumer env rewrites are derived from
    the boundary's cross-network uses edges (no hand-authored address): each
    bridged edge gets a `server { listen <port>; proxy_pass <target> }` block,
    and each consumer's host env var is rewritten to "aggrega-gw:<port>" so it
    reaches the target across the compose network seam.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/compose-bridge:1.0.0
  executionScope: boundary

  # Resource Generation: load the co-located gateway fragment (the bare
  # aggrega-gw service) and forward the boundary's cross-network uses edges to
  # the compose engine via the x-aggrega-bridge marker. The engine derives the
  # per-edge listen ports (target-port default; portBase collision fallback),
  # generates the nginx stream config, mounts it into the gateway as a compose
  # config (a top-level configs: entry referenced from the service, mounted at
  # /etc/nginx/nginx.conf), and strips the marker. The stream config carries a
  # resolver so each upstream resolves at connection time (no static-startup
  # failure). The per-consumer env rewrites are produced from the same edge
  # derivation through the boundary->component env channel, so the gateway's
  # listen and each consumer's rewrite agree per edge. The upstream is a
  # deterministic compile-time compose service pointer; compose runtime DNS
  # resolves it.
  source: "./bridge-fragment.yaml"
  valuesMapping: |
    x-aggrega-bridge:
      edges: {{ .boundary.internal_uses_edges | toJson }}
      portBase: {{ optional .infra "portBase" 10000 }}
      providesField: {{ optional .infra "providesField" "host" }}
