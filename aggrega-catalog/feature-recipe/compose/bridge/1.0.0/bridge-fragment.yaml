# Compose fragment for the core/compose-bridge FeatureRecipe. Loaded as YAML
# through compose's sourced render, with no template evaluation of its own.
#
# The bridge runs as a single nginx service named "aggrega-gw" in the
# boundary's own compose file. It is authored here unconditionally, so a
# boundary with nothing to bridge still carries the gateway, idle.
#
# Where any edge is bridged, the FeatureRecipe's values add the gateway's nginx
# stream config — one server block per bridged edge — as a top-level compose
# config mounted into this service at /etc/nginx/nginx.conf, and name the
# bridged ends under x-aggrega-networks-of, so the compose provider joins this
# service to their networks. Consumers reach the bridge at
# "aggrega-gw:<listen port>", the value the FeatureRecipe delivers in place of
# the target's address. The canonical end-user teaching lives at
# aggrega-docs/language-reference/providers/compose.md.
services:
  aggrega-gw:
    image: nginx:alpine
