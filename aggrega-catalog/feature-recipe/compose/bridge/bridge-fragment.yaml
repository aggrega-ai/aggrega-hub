# Compose fragment for the core/compose-bridge FeatureRecipe. Loaded via
# compose's sourced-mode Render path (loaded as YAML, no template eval at
# this stage).
#
# The bridge runs as a single nginx service named "aggrega-gw" at the
# boundary's evaluated assembly path. Consumers reach the bridge at
# "aggrega-gw:<assigned-port>" (the boundary->component env channel rewrites
# each consumer's host env var).
#
# The nginx stream proxy config is generated by the compose engine from the
# boundary's cross-network uses edges (one server block per bridged edge) and
# mounted into the gateway as a compose config (a top-level configs: entry
# referenced from this service at /etc/nginx/nginx.conf). The canonical
# end-user teaching lives at aggrega-docs/language-reference/providers/compose.md.
services:
  aggrega-gw:
    image: nginx:alpine
