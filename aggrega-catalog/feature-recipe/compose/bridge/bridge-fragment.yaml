# Compose fragment for the core/compose-bridge FeatureRecipe. Loaded via
# compose's sourced-mode Render path (loaded as YAML, no template eval at
# this stage — the FR's valuesMapping overlay supplies the templated
# fields like the port mapping).
#
# The bridge runs as a single nginx:alpine service named "aggrega-gw" at
# the boundary's evaluated assembly path. Consumers reach the bridge at
# "aggrega-gw:<mappedPort>" (via the FR's injectMapping rewrite).
#
# TCP stream proxy configuration is mounted at runtime; the canonical
# end-user teaching for compose-bridge lives at
# aggrega-docs/language-reference/providers/compose.md.
services:
  aggrega-gw:
    image: nginx:alpine
