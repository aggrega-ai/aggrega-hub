apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: compose-bridge-fr
  version: 1.0.0
  description: >
    Cross-boundary network bridge for compose. Runs once per boundary
    attachment (executionScope: boundary), producing a single nginx-stream
    service named "aggrega-gw" at the boundary's evaluated assembly path.
    Per-consumer injectMapping rewrites the target env var (e.g. DB_HOST)
    to "aggrega-gw:<mappedPort>" so consumers reach the bridge transparently.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: compose
  implements: core/compose-bridge:1.0.0
  executionScope: boundary

  # Phase A: rewrite the consumer's env var to point at the bridge. Runs
  # per-consumer regardless of executionScope. The cascade-merged feature
  # infra carries .infra.targetVar (the env var name) and .infra.mappedPort
  # (the bridge's listening port).
  injectMapping: |
    env:
      "{{ .infra.targetVar }}": "aggrega-gw:{{ .infra.mappedPort }}"

  # Resource Generation: the boundary-scope FR loads the co-located
  # compose fragment via sourced-mode Render (the fragment is loaded as
  # literal YAML, no template eval at this stage). The valuesMapping
  # overlay supplies the templated port mapping derived from the boundary-
  # attached feature's infra (.infra.mappedPort). Compose's deep-merge
  # combines the two: image stays from the fragment, ports come from
  # this overlay.
  source: "./bridge-fragment.yaml"
  valuesMapping: |
    services:
      aggrega-gw:
        ports:
          - "{{ .infra.mappedPort }}:{{ .infra.mappedPort }}"
