apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: fallback-chain
  version: 1.0.0
  description: >
    Realizes core/fallback-chain on the AI gateway core/gateway/litellm under
    Docker Compose; a Release binds it in its Manifest, as
    compose/fallback-chain. It emits no file: the LiteLLMGatewayConfig bundle
    the gateway's compose Recipe imports reads the attachment and writes the
    chain and its bound into the gateway's configuration.

    Once the gateway gives up on the alias a request asked for, it sends the
    request to the aliases the alias's entry lists, in order, until one
    answers, and a fallback that fails follows its own entry in turn. Each
    alias tried after the first counts one fallback; a fallback's own entry is
    followed only while fewer than max_hops have been counted, and every alias
    one entry lists is tried whatever the count.

    The build halts where chains names an alias the gateway's model map does
    not publish, on a second such attachment, and on any component other than
    core/gateway/litellm.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/fallback-chain:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: on this target no pipeline step edits the
  # gateway's rendered configuration, so the bundle that renders it writes the
  # chain from this attachment, under router_settings, as fallbacks, the
  # gateway's list of one-key maps from an alias to the aliases it falls back
  # to, in the order written, and max_fallbacks, the attachment's max_hops. The
  # gateway checks max_fallbacks on entering an alias's list of fallbacks and
  # counts one fallback for each alias it tries from a list, so a list longer
  # than the bound is still tried to its end. What stays here is what the bundle
  # cannot honour.
  #
  # DELIBERATE NEAR-DUPLICATE of fallback-chain under helm: the two differ in
  # capability, in what writes the chain, and in the refusal of a second
  # attachment, which the bundle could only merge, because one realization holds
  # one capability and both targets run the same configuration. If one of them
  # changes, change both in the same edit.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/litellm" -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q is bound to the LiteLLM realization, which writes its chain into the configuration body core/gateway/litellm renders; %s renders no such body. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    # The gateway keeps one fallbacks list and one bound, so a second attachment
    # could not hold beside the first.
    one_chain_per_gateway: >-
      {{- $names := list -}}
      {{- range $name, $attachment := .features -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/fallback-chain" }}{{ $names = append $names $name }}{{ end -}}
      {{- end -}}
      {{- if gt (len $names) 1 -}}
      {{- fail (printf "core/fallback-chain is attached to %q more than once (%s), but core/gateway/litellm keeps one list of fallbacks and one bound, so the attachments cannot each hold; keep one attachment, with an entry for every alias that falls back" .metadata.instance_id (join ", " (sortAlpha $names))) -}}
      {{- end -}}
    # An entry for an alias the map does not publish would never be read, and a
    # fallback the map does not publish would fail on every request reaching it.
    chains_name_published_aliases: >-
      {{- $published := fromJson (optional .locals "model_aliases" "[]") -}}
      {{- range $alias, $connection := (optional .uses "models" dict) -}}
      {{- $published = append $published $alias -}}
      {{- end -}}
      {{- range $entry := .values.chains -}}
      {{- if not (has $entry.alias $published) -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q gives an entry to %q, but the model map of core/gateway/litellm publishes no such alias, so no request asks for it and the entry would never be read; give entries only to aliases the map publishes: %s" $.metadata.feature_instance $.metadata.instance_id $entry.alias (join ", " $published)) -}}
      {{- end -}}
      {{- range $fallback := $entry.fallbacks -}}
      {{- if not (has $fallback $published) -}}
      {{- fail (printf "core/fallback-chain attachment %q on %q lists %q as a fallback of %q, but the model map of core/gateway/litellm publishes no such alias, so every request falling back there would fail; list only aliases the map publishes: %s" $.metadata.feature_instance $.metadata.instance_id $fallback $entry.alias (join ", " $published)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
