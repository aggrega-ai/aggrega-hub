apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: egress-allowlist
  version: 1.0.0
  description: >
    Binds core/egress-allowlist under Docker Compose to a halt naming why
    compose cannot honour it; a Release binds it in its Manifest. It emits no
    file and restricts nothing.

    The Feature lets a component connect only to the components it is wired
    to, which takes a network policy over the component's outbound
    connections. Compose has no network policy: every service of a group
    shares one network and reaches every other service on it, and a service's
    own fragment has nothing to say where its connections may go. So the build
    halts on every attachment, naming the Feature, rather than render the
    component with every connection still open while the Release reads as
    restricted.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/egress-allowlist:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: nothing is written, because compose has no
  # network policy into which the restriction could be written.
  assertions:
    # Every attachment halts, whatever the component is wired to.
    compose_has_no_network_policy: >-
      {{- fail (printf "core/egress-allowlist attachment %q on %q restricts the component's outbound connections to the components it is wired to, which takes a network policy, and compose has no network policy: every service of a group shares one network and reaches every other service on it, so nothing could be restricted; remove the attachment from the Release or the Aggregate that declares it, or deploy this component to a Kubernetes target whose network plugin enforces network policy" .metadata.feature_instance .metadata.instance_id) -}}
