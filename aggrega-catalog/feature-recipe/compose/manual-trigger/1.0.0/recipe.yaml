apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: manual-trigger
  version: 1.0.0
  description: >
    Realizes core/manual-trigger on Docker Compose, on core/compute/task's
    compose Recipe, compose/task; a Release binds it in its Manifest. It emits
    nothing: the host's Recipe carries the change, giving the task's service
    the profile manual, so docker compose up leaves it stopped, because a
    FeatureRecipe can neither add a key to the host's service nor withdraw
    the run the host would start.

    A run is started by hand with docker compose run --rm <service>, the
    service named after the component. A task with a schedule is refused by
    compose/task whether or not it carries the attachment, as Docker Compose
    has no scheduler.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  # No source, valuesMapping, workload, artifacts, injectMapping or assertions:
  # a task's service gated behind the profile manual is what compose/task
  # renders when it finds this attachment among the component's own, so this
  # FeatureRecipe adds no file to the build and nothing to the task's delivery
  # pipe. The Feature applies to components of type task only, and compose/task
  # is the catalog's one compose realization of such a component.
  implements: core/manual-trigger:1.0.0
