apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: prompt-deny-patterns-litellm
  version: 1.0.0
  description: >
    Realizes core/prompt-deny-patterns on the AI gateway core/gateway/litellm
    under Docker Compose; a Release binds it in its Manifest, as
    compose/prompt-deny-patterns-litellm. It emits no file: the
    LiteLLMGatewayConfig bundle the gateway's compose Recipe imports reads the
    attachment and adds one entry to the gateway's guardrails, turning on its
    built-in content filter before a request is forwarded, with one blocking
    rule per entry of deny_patterns, on every request, so a caller cannot
    turn it off from the request.

    A request any expression matches, ignoring letter case, in the text of any
    message, is refused with HTTP 400 naming the rule by its position in the
    list — deny_pattern_1 for the first — and not the expression. Images are
    not examined; an administrator can exempt a key or a team from the
    gateway's always-on guardrails; and a request of a kind the gateway maps to
    no guardrail is forwarded unchecked.

    It halts on allow_patterns, because this gateway's filter only refuses a
    request that matches, and on any component other than
    core/gateway/litellm.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/prompt-deny-patterns:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: on this target no pipeline step edits the
  # gateway's rendered configuration, so the bundle that renders it writes the
  # guardrail entry from this attachment. The entry is the one
  # prompt-deny-patterns-litellm's step writes under helm: named for the
  # component and the attachment, so two attachments add two entries; pre_call,
  # so the filter runs before the request is forwarded; default_on, so it runs
  # on every request; each expression written as a JSON string, so its
  # backslashes and quotes reach the gateway exactly as authored, and each $
  # written as $$, the compose file's spelling of a literal $, so the gateway
  # receives the expression as authored. What stays here is what the bundle
  # cannot honour.
  #
  # The gateway compiles each expression when it builds the guardrail and
  # matches it ignoring letter case; in a chat completion it matches the text of
  # every message, whatever its role, each message on its own. An expression the
  # gateway cannot compile stops it starting. The build does not check one.
  #
  # DELIBERATE NEAR-DUPLICATE of prompt-deny-patterns-litellm under helm: the two
  # differ in capability and in what writes the entry, because one realization
  # holds one capability and both targets run the same configuration. If one of
  # them changes, change both in the same edit.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside.
    component_renders_the_body: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/litellm" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q is bound to the LiteLLM realization, which writes its guardrail into the configuration body core/gateway/litellm renders; %s renders no such body. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    deny_list_only: >-
      {{- if optional .values "allow_patterns" "" -}}
      {{- fail (printf "core/prompt-deny-patterns attachment %q on %q sets allow_patterns, but core/gateway/litellm declares dataplane.aggrega.ai/prompt-guard: pattern-list and its pattern guardrail only refuses a request that matches; it has no list a request must match to be forwarded. Remove allow_patterns, or bind the attachment to a realization for a gateway whose pattern guard also admits by pattern" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
