apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: provided-secret
  version: 1.0.0
  description: >
    Compose realization of core/secret-provided. origin — from values or infra,
    whichever carries it — is published as the `value` provides key, and the
    attachment dictates where it is delivered with its own `inject:` block on a
    transparent slot — this realization carries no injectMapping of its own, so
    an attachment without that block delivers the value nowhere. On compose the
    delivered value is written into the emitted docker-compose file as a literal
    environment value, exactly as authored: a literal origin puts the material
    in the rendered artifact, and an origin written as a Compose variable
    reference, such as ${DB_PASSWORD}, lands as that reference, which Docker
    Compose substitutes when the stack starts.

    The name provided-secret is shared with the helm realization of the same
    Feature, so a Manifest references this one provider-qualified, as
    compose/provided-secret:1.0.0. A bare provided-secret:1.0.0 matches both and
    resolves to neither, and the pull halts on it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/secret-provided:1.0.0

  # The core/secret-provided contract: publish the material as `value`, for the
  # attachment's own inject block to route. No source, mapping, workload or
  # artifact is declared: this realization emits nothing, and a FeatureRecipe that
  # emits nothing needs no engine input.
  #
  # DELIBERATE NEAR-DUPLICATE of the helm realization of the same name. The two are
  # identical but for spec.capability, because the contract is host-side: the
  # value is published unchanged and the attachment's inject block delivers it, so
  # nothing here depends on the target. There is no single home available for the
  # line they share: a provides value is a plain string, so the $import: reuse that
  # valuesMapping, workload and artifacts accept does not apply to a provides block
  # — an import map is refused as a provides value, and an `$import` key written
  # directly under provides is read as an ordinary key and imports nothing. If the
  # Feature's provides contract changes, change both realizations in the same edit.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. The expression is the one every realization of a credential
  # Feature that reads the locator repeats, for the reason above. values is read
  # only through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  provides:
    value: '{{ optional .values "origin" (optional .infra "origin" "") }}'
