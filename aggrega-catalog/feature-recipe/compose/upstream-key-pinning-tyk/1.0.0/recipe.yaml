apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: upstream-key-pinning-tyk
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/upstream-key-pinning on the Tyk
    gateway, core/gateway/tyk, under Docker Compose. The pins are a setting the
    gateway reads rather than a service of their own, so this recipe emits
    nothing: the gateway's Recipe reads the attachment and hands every entry to
    the gateway's container as the one environment variable the gateway takes
    its upstream pins from. An upstream is the host the gateway dials,
    `*.example.com` for every host one label under a suffix, or `*` for every
    upstream; the most specific entry applies, and it replaces the `*` entry
    rather than adding to it.

    Setting any pin changes how the gateway reaches every upstream: from then
    on it checks an upstream's key rather than the chain the upstream
    presents, so an upstream no entry covers is reached with its certificate
    not verified at all. `*` covers every upstream with no entry of its own
    and holds each of them to its key.

    It halts on an upstream given more than one key, on an upstream holding a
    comma, a colon or a misplaced `*`, and when the attachment is carried by
    any component other than core/gateway/tyk.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/upstream-key-pinning:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the Tyk Recipe, which reads it. What stays here is what that Recipe cannot
  # honour. No assertion can read the host component's labels, so the
  # capability the gateway declares is stated in the messages, and the guard
  # first in the list is what keeps that statement true.
  #
  # The gateway takes its pins from one environment variable whose entries are
  # separated by commas, each an upstream and a key separated by a colon, and a
  # value it cannot split that way stops it loading its configuration. So an
  # upstream carries one key here, and an upstream holding either separator
  # cannot be named. The key text itself is PEM, which carries neither, and
  # the Feature has already refused anything else. The gateway matches `*`
  # whole, or as `*.` before the part of a host after its first dot; a `*`
  # anywhere else would match no host and pin nothing.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/tyk and core/gateway/tyk:1.0.0 are the same host.
    carrier_reads_the_pins: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/tyk" -}}
      {{- fail (printf "core/upstream-key-pinning attachment %q on %q is bound to the Tyk realization, which only core/gateway/tyk carries out: that component's own Recipe writes the pins into the gateway's configuration, and %s renders none for it, so nothing would be pinned. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    one_key_per_upstream: >-
      {{- range $pin := .infra.pins -}}
      {{- if gt (len $pin.public_keys) 1 -}}
      {{- fail (printf "core/upstream-key-pinning attachment %q on %q lists %d keys for the upstream %q, but core/gateway/tyk, which declares dataplane.aggrega.ai/upstream-pinning: public-key, takes its pins from one environment variable whose entries are separated by commas, so it accepts one key from an upstream; list one key for it" $.metadata.feature_instance $.metadata.instance_id (len $pin.public_keys) $pin.upstream) -}}
      {{- end -}}
      {{- end -}}
    upstream_the_gateway_can_name: >-
      {{- range $pin := .infra.pins -}}
      {{- $u := $pin.upstream -}}
      {{- if or (contains "," $u) (contains ":" $u) -}}
      {{- fail (printf "core/upstream-key-pinning attachment %q on %q names the upstream %q, but core/gateway/tyk separates its pin entries with commas and each upstream from its key with a colon, so an upstream holding either cannot be named: name the host alone, with no port" $.metadata.feature_instance $.metadata.instance_id $u) -}}
      {{- end -}}
      {{- if and (contains "*" $u) (ne $u "*") (not (and (hasPrefix "*." $u) (not (contains "*" (trimPrefix "*." $u))))) -}}
      {{- fail (printf "core/upstream-key-pinning attachment %q on %q names the upstream %q, but core/gateway/tyk matches `*` only as a whole entry for every upstream, or as `*.` before the part of a host after its first dot, so this entry would match no host and pin nothing; use `*`, a `*.suffix` entry, or the host itself" $.metadata.feature_instance $.metadata.instance_id $u) -}}
      {{- end -}}
      {{- end -}}
