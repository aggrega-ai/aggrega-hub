apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: dotenv-referenced-secret
  version: 1.0.0
  description: >
    Compose realization of core/referenced-secret, for local development. It
    delivers origin — from values or infra, whichever carries it — under
    values.key on the consuming component's inject pipe, and a compose Recipe
    reading the slot writes that value into the emitted docker-compose file,
    exactly as authored. A literal origin therefore lands in the file as the
    credential itself. An origin written as a Compose variable reference, such
    as ${DIFY_DB_PASSWORD}, lands as that reference instead, and Docker Compose
    substitutes it when the stack starts — from the shell environment, a file
    named with --env-file, or a .env file in the project directory — and
    substitutes an empty string, with a warning, for a variable it cannot
    resolve and that names no default. The compiler neither reads nor writes a
    .env file; whoever starts the stack maintains it.

    Docker Compose has no secret resource for a consumer to reference, so this
    realization emits none and the name it publishes is empty; the key it
    publishes is values.key, the name the value travels under. origin is
    therefore the value, never the name of a Secret. Reach for it under Docker
    Compose; on Kubernetes reach for helm/k8s-existing-secret,
    helm/k8s-external-secret or helm/k8s-secret-from-parameter.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/referenced-secret:1.0.0

  # The Feature's contract requires every realization to publish name, the
  # locator of the resource holding the secret, and key, the data key within
  # it; the build halts on one that publishes neither. Docker Compose has no
  # secret resource and this realization emits nothing, so there is nothing to
  # locate: name is published empty rather than naming a resource that does not
  # exist, as compose/dotenv-secret-set publishes its own. key is the key the
  # value is delivered under on the inject pipe. A consumer that reads a locator to reference a
  # resource by name has nothing to reference on this target, and a compose
  # Recipe that halts on a non-empty name — the Model Context Protocol Recipes
  # do, for their server_env slot — accepts this realization and delivers the
  # value under its key.
  provides:
    name: ""
    key: "{{ .values.key }}"

  # Evaluated before the consuming node renders: deliver origin, unchanged, into
  # that node's inject pipe under the key the attachment names — the Feature's
  # default, value, when the Release alone attaches it. The value is routed as
  # an opaque string, so a ${VAR} reference reaches the file as written,
  # whichever pillar carries it. On a connection the value lands on the pipe of
  # the component whose connection it is, as every attachment on a connection
  # does.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a credential
  # Feature that reads the locator repeats this one expression, because it sits
  # inside a template the realization owns, and no catalog kind holds a single
  # template expression for several entities to share. values is read only
  # through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  #
  # The output is a flat dictionary, one environment delivery: the spelling
  # that makes no claim about the consuming component's other delivery
  # mechanisms. An output keyed by mechanism (env:) is read as naming every
  # mechanism this attachment delivers through, and halts the build on a
  # component whose own inject block also delivers a file. The key and the value
  # are each written through toJson, as a JSON string, which the mapping's YAML
  # reads back exactly: a quote or a backslash is delivered as authored rather
  # than breaking the mapping.
  injectMapping: |
    {{ .values.key | toJson }}: {{ optional .values "origin" (optional .infra "origin" "") | toJson }}
