apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: traffic-shadowing-nginx
  version: 1.0.0
  description: >
    Component-scope FeatureRecipe for core/traffic-shadowing on the NGINX
    gateway, core/gateway/nginx, under Docker Compose. The copy is a setting
    inside the server configuration the gateway's own Recipe writes rather than
    a service of its own, so this recipe emits nothing: the NGINX Recipe reads
    the attachment and adds the mirror to the location it forwards, sending a
    copy of every forwarded request, with its original URI, to the service the
    attachment's infra names, and discarding that service's response. NGINX
    copies every request it forwards and has no setting that copies a share of
    them — the gateway declares dataplane.aggrega.ai/request-mirroring:
    full-rate — so this recipe halts on a shadow_percent below 100 rather than
    copying more traffic than was asked for. It also halts when the attachment
    is carried by any component other than core/gateway/nginx, because no other
    component's Recipe reads it, and the attachment would render no copy at
    all. The service the copies go to has to resolve on the compose network
    when NGINX starts, as the upstream does.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/traffic-shadowing:1.0.0
  # executionScope omitted -> component: evaluated once per attached component.
  #
  # No input kind and no pipeline: what this attachment changes is written by
  # the NGINX Recipe, which reads it. What stays here is what that Recipe
  # cannot honour. Neither assertion can read the host component's labels, so
  # the fidelity the gateway declares is stated in the message, and the guard
  # above it is what keeps that statement true.
  assertions:
    # The host's type reaches this check as the Aggregate wrote it, so it is
    # compared with any version it was authored with set aside:
    # core/gateway/nginx and core/gateway/nginx:1.0.0 are the same host.
    carrier_writes_the_mirror: >-
      {{- if ne (first (splitList ":" .metadata.component)) "core/gateway/nginx" -}}
      {{- fail (printf "core/traffic-shadowing attachment %q on %q is bound to the NGINX realization, which only core/gateway/nginx carries out: that component's own Recipe writes the mirror into its server configuration, and %s renders none for it, so nothing would be copied. Bind this attachment in the Manifest to a realization for %s" .metadata.feature_instance .metadata.instance_id .metadata.component .metadata.component) -}}
      {{- end -}}
    whole_stream_only: >-
      {{- if lt (int .infra.shadow_percent) 100 -}}
      {{- fail (printf "core/traffic-shadowing attachment %q on %q asks for shadow_percent %v, but core/gateway/nginx declares dataplane.aggrega.ai/request-mirroring: full-rate — NGINX copies every request it forwards and has no setting that copies a share of them. Omit shadow_percent to copy the whole stream, or attach the Feature to a gateway declaring the sampled fidelity" .metadata.feature_instance .metadata.instance_id .infra.shadow_percent) -}}
      {{- end -}}
