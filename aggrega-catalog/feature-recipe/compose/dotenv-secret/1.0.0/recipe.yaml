apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: dotenv-secret
  version: 1.0.0
  description: >
    Compose realization of core/secret-value, for local development. It
    delivers origin — from values or infra, whichever carries it — under
    values.key on the consuming component's inject pipe, and the compose Recipe
    writes that value into the emitted docker-compose file as the service's
    environment value, exactly as authored. A literal origin therefore lands in
    the file as the credential itself. An origin written as a Compose variable
    reference, such as ${DB_PASSWORD}, lands as that reference instead, and
    Docker Compose substitutes it when the stack starts — from the shell
    environment, a file named with --env-file, or a .env file in the project
    directory — and substitutes an empty string, with a warning, for a variable
    it cannot resolve and that names no default. The compiler neither reads nor
    writes a .env file and emits no env_file entry; whoever starts the stack
    maintains the .env file.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/secret-value:1.0.0

  # Evaluated before the consuming node renders: deliver origin, unchanged, into
  # that node's inject pipe under the key the attachment names. The value is
  # routed as an opaque string, so a ${VAR} reference reaches the file as written,
  # whichever pillar carries it.
  #
  # origin is read from whichever pillar carries it — values where the developer
  # wrote it, infra where the operator did; the Feature halts the build when both
  # or neither do. DELIBERATE NEAR-DUPLICATE: each realization of a credential
  # Feature that reads the locator repeats this one expression, because it sits
  # inside a template the realization owns, and no catalog kind holds a single
  # template expression for several entities to share. values is read only
  # through optional, and that is load-bearing: a template that also read
  # .values.origin as a path would find the key present and empty, and never
  # fall through to infra.
  #
  # The value is written through toJson, as a JSON string, which the mapping's
  # YAML reads back exactly: a quote or a backslash in the value is delivered as
  # authored rather than breaking the mapping.
  injectMapping: |
    env:
      {{ .values.key }}: {{ optional .values "origin" (optional .infra "origin" "") | toJson }}
