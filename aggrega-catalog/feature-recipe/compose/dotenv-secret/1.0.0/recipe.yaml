apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: dotenv-secret
  version: 1.0.0
  description: >
    For local development. Maps a secret value to a .env file entry
    that Docker Compose resolves at runtime. The compiler does NOT
    fetch or write the .env file — it generates the docker-compose
    env_file reference. The developer maintains their local .env.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  target: compose
  implements: core/secret-value:1.0.0

  # Pre-Render Interception: inject the env var name into the
  # component's inject pipe so the base Compose Recipe can
  # render it as an environment variable with ${VAR} syntax.
  injectMapping: |
    env:
      {{ .values.key }}: "{{ .values.origin }}"
