apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: dotenv-secret
  version: 1.0.0
  description: >
    Compose realization of core/secret-value, for local development. It
    delivers values.origin under values.key on the consuming component's inject
    pipe, and the compose Recipe writes that value into the emitted
    docker-compose file as the service's environment value, exactly as
    authored. A literal origin therefore lands in the file as the credential
    itself. An origin written as a Compose variable reference, such as
    ${DB_PASSWORD}, lands as that reference instead, and Docker Compose
    substitutes it when the stack starts — from the shell environment, a file
    named with --env-file, or a .env file in the project directory — and
    substitutes an empty string, with a warning, for a variable it cannot
    resolve and that names no default. The compiler neither reads nor writes a
    .env file and emits no env_file entry; the developer maintains the .env file.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/secret-value:1.0.0

  # Evaluated before the consuming node renders: deliver origin, unchanged, into
  # that node's inject pipe under the key the attachment names. The value is
  # routed as an opaque string, so a ${VAR} reference reaches the file as written.
  injectMapping: |
    env:
      {{ .values.key }}: "{{ .values.origin }}"
