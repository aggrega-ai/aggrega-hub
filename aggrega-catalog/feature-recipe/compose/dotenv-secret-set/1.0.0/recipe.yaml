apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: dotenv-secret-set
  version: 1.0.0
  description: >
    Compose realization of core/referenced-secret-set, for local development.
    It delivers every entry — from values or infra, whichever carries them —
    on the consuming component's inject pipe, one environment variable per
    entry, named as the entry's key and carrying its value, and a compose
    Recipe that delivers its attachments' variables writes each into the
    emitted docker-compose file as the service's environment value, exactly as
    authored. A literal value therefore lands in the file as the credential
    itself. A value written as a Compose variable reference, such as
    ${GITHUB_TOKEN}, lands as that reference instead, and Docker Compose
    substitutes it when the stack starts — from the shell environment, a file
    named with --env-file, or a .env file in the project directory — and
    substitutes an empty string, with a warning, for a variable it cannot
    resolve and that names no default. The compiler neither reads nor writes a
    .env file and emits no env_file entry; whoever starts the stack maintains
    the .env file.

    Docker Compose has no secret resource for a consumer to reference, so this
    realization emits none, and the name it publishes is empty: a consumer
    reads the entries from its inject pipe rather than from a resource. Reach
    for it under Docker Compose; reach for helm/k8s-secret-set on Kubernetes,
    where the entries are held in a Secret the consumer references by name.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/referenced-secret-set:1.0.0

  # The Feature's contract requires every realization to publish name, the
  # locator of the resource holding the entries, and the build halts on one
  # that publishes none. Docker Compose has no secret resource and this
  # realization emits nothing, so there is nothing to locate: the name is
  # published empty rather than naming a resource that does not exist. A
  # consumer that reads a locator to reference a resource by name has nothing
  # to reference on this target; one that delivers its attachments' variables
  # reads the entries off its inject pipe.
  provides:
    name: ""

  # Evaluated before the consuming node renders: deliver each entry, unchanged,
  # into that node's inject pipe as an env entry named as its key. Each value is
  # routed as an opaque string, so a ${VAR} reference reaches the file as
  # written, whichever pillar carries it.
  #
  # entries is read from whichever pillar carries it — values where the
  # developer wrote it, infra where the operator did; the Feature halts the
  # build when both or neither do. DELIBERATE NEAR-DUPLICATE: each realization
  # of a credential Feature that reads the locator repeats this one expression,
  # because it sits inside a template the realization owns, and no catalog kind
  # holds a single template expression for several entities to share. values is
  # read only through optional, and that is load-bearing: a template that also
  # read .values.entries as a path would find the key present and empty, and
  # never fall through to infra.
  #
  # The output is a flat dictionary, each entry one environment delivery: the
  # spelling that makes no claim about the consuming component's other
  # delivery mechanisms. An output keyed by mechanism (env:) is read as naming
  # every mechanism this attachment delivers through, and halts the build on a
  # component whose own inject block also delivers a file. Each key and each
  # value is written through toJson, as a JSON string, which the mapping's YAML
  # reads back exactly: a quote or a backslash is delivered as authored rather
  # than breaking the mapping. An attachment carrying no entry delivers
  # nothing.
  injectMapping: |
    {{- range (optional .values "entries" (optional .infra "entries" (list))) }}
    {{ .key | toJson }}: {{ .value | toJson }}
    {{- end }}
