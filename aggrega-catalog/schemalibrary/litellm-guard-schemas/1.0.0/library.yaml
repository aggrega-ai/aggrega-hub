apiVersion: aggrega.ai/v1beta1
kind: SchemaLibrary
metadata:
  name: LiteLLMGuardSchemas
  version: 1.0.0
  description: |
    Schema fragments for the Components that run the LiteLLM proxy behind the
    request guard of the LiteLLMGuard#/artifacts/RequestGuard bundle.
    RequestGuardInfra declares admitted_request_fields, the infra key a Release
    names further request fields in for the guard to forward. It is declared here
    once for every such Component, so what the key admits, and what it cannot
    re-open, is stated in one place wherever the guard runs.
spec:
  schemas:
    RequestGuardInfra:
      type: object
      properties:
        admitted_request_fields:
          type: array
          items:
            type: string
          description: >
            Request fields the proxy forwards from a caller on top of the ones it
            already forwards for the route. The proxy forwards only the fields LiteLLM
            itself declares for each route and refuses the rest, so a caller cannot
            change where a request is sent or with which credential; a Release whose
            callers must send a further field names it here, and it is admitted on
            every route; a Feature attached to the proxy can still refuse it, as
            core/data-masking refuses every field its masking does not reach, an
            admitted one included. It cannot re-open a refused field — naming one the proxy
            refuses (a credential, an endpoint, or a routing field such as model_list
            or fallbacks) halts the build, because those are what the refusal exists
            to stop. Omitted, the proxy admits nothing beyond each route's own fields.
