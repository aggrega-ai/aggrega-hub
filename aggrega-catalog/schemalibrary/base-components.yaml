apiVersion: aggrega.ai/v1alpha1
kind: SchemaLibrary
metadata:
  name: BaseComponents
  version: 1.0.0
  description: |
    Universal base schemas shared by every Component in the core catalog.
    BaseComponentParameter carries the displayName + description fields
    every Component supports as developer-tunable documentation knobs.
spec:
  schemas:
    BaseComponentParameter:
      # Explicit `type: object, properties: { ... }` form is required because
      # `description:` is reserved by the compact-form schema vocabulary.
      # Inferred-form authoring would surface "unknown keyword" errors on
      # the property names. Cross-document `$ref:` composition enforces
      # closure (`additionalProperties: false`) on the merged shape
      # regardless of how this library entry is authored, so the library
      # entry's openness is not a concern for consumers.
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
    BaseToolParameter:
      # Tool security and execution boundaries shared by every Tool
      # Component. Composes the universal BaseComponentParameter via
      # cross-document `$ref:` and adds the side_effects + timeout
      # +  optional LLM-description-override fields. side_effects is the
      # zero-trust default for tools: secure (mutating) unless explicitly
      # downgraded by the Tool author.
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        side_effects: { type: string, enum: [mutating, read_only, none], default: mutating }
        timeout_seconds: { type: integer, default: 30 }
        llm_description_override: { type: string }
      required: [side_effects, timeout_seconds]
