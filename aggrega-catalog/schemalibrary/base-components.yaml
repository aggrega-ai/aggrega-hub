apiVersion: aggrega.ai/v1alpha1
kind: SchemaLibrary
metadata:
  name: BaseComponents
  version: 1.0.0
  description: |
    Universal base schemas shared by every Component in the core catalog.
    BaseComponentParameter carries the displayName + description fields
    every Component supports as developer-tunable documentation knobs.
spec:
  schemas:
    BaseComponentParameter:
      # Explicit `type: object, properties: { ... }` form is required because
      # `description:` is reserved by the compact-form schema vocabulary.
      # Inferred-form authoring would surface "unknown keyword" errors on
      # the property names. Cross-document `$ref:` composition enforces
      # closure (`additionalProperties: false`) on the merged shape
      # regardless of how this library entry is authored, so the library
      # entry's openness is not a concern for consumers.
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
    BaseToolParameter:
      # Tool security and execution boundaries shared by every Tool
      # Component. Composes the universal BaseComponentParameter via
      # cross-document `$ref:` and adds the side_effects + timeout
      # +  optional LLM-description-override fields. side_effects is the
      # zero-trust default for tools: secure (mutating) unless explicitly
      # downgraded by the Tool author.
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        side_effects: { type: string, enum: [mutating, read_only, none], default: mutating }
        timeout_seconds: { type: integer, default: 30 }
        llm_description_override: { type: string }
      required: [side_effects, timeout_seconds]
    BaseModelParameter:
      # AI Model identity and capability hints shared by every Model
      # Component. Composes the universal BaseComponentParameter via
      # cross-document `$ref:` and adds the model identifier + optional
      # context-window hint. `model` carries the provider-specific model
      # string (e.g. "gpt-4o", "meta-llama/Llama-3-70b"). `context_window`
      # is an Ops-consumable hint for sizing inference-server parameters
      # like vLLM `max_model_len`.
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        model: { type: string }
        context_window: { type: integer, min: 0 }
      required: [model]
    BaseAgentParameter:
      # AI Agent topological-reference fields shared by every Agent
      # Component. Composes the universal BaseComponentParameter via
      # cross-document `$ref:` and adds four optional typed-reference
      # array fields connecting the Agent to its dependencies: models
      # it uses, tools it can invoke, datastores it persists state to,
      # and other agents it can delegate to. Each item carries an
      # `x-aggrega-selector:` extension annotation hinting which entity
      # type the value should resolve to in the topology; this preserves
      # the post-conversion authoring metadata pending the future socket-
      # migration that maps these annotated fields into a declarative
      # `usesSchema:` socket table. Agents do not carry secret credentials
      # at their own scope; credential ownership co-locates with the
      # referenced entity (Model / Tool / Datastore).
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        models: { type: array, items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-model" } }
        tools_allowed: { type: array, items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-tool" } }
        datastores: { type: array, items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-datastore" } }
        agents_allowed: { type: array, items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-agent" } }
    BaseFeatureParameter:
      # Universal optional documentation knobs and the Feature-exclusive
      # Universal Injection Contract shared by every Feature in the core
      # catalog. Standalone entry; does NOT compose BaseComponentParameter
      # via cross-document `$ref:`. This base is declared as a standalone
      # definition that duplicates the displayName + description fields
      # rather than chain-extending the Component-side base. The
      # architectural reason is the entity-kind distinction (Feature CRD
      # vs Component CRD) — the `as:` Universal Injection Contract here
      # is strictly for Features, never Components, motivating a separate
      # definition rather than shared inheritance. Explicit
      # `type: object, properties: { ... }` form is required because
      # `description:` collides with compact-form vocabulary. The nested
      # `as:` object carries explicit `additionalProperties: false` so
      # the closed-struct semantic survives at the merged consumer shape
      # (the outer scope's closure is injected automatically by
      # cross-document `$ref:` expansion; nested-scope closure inside a
      # library entry needs author-side injection).
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
          default: info
        as:
          type: object
          properties:
            env: { type: string }
            file: { type: string }
            arg: { type: string }
          additionalProperties: false
