apiVersion: aggrega.ai/v1beta1
kind: SchemaLibrary
metadata:
  name: AIDatastores
  version: 1.0.0
  description: |
    Shared schema fragments for ai-datastore Components. Carries the universal
    datastore base shape plus two specialised variants for the dominant
    operational shapes used by AI agents: vector stores (Qdrant, Milvus,
    Pinecone) and graph stores (Neo4j, Memgraph). Each variant composes the
    universal datastore base via cross-document `$ref:` and adds shape-specific
    fields.
spec:
  schemas:
    BaseDatastoreParameter:
      # The universal datastore shape. Composes the universal
      # BaseComponentParameter from the BaseComponents library and adds
      # the engine identifier, the storage tier hint, and an optional
      # replica count. `engine` carries the provider-specific engine
      # string (e.g. "qdrant", "neo4j", "postgresql"). `storage_tier`
      # is a provider-neutral hint: a Recipe that reads it maps the
      # tier onto the provider's own storage type (`gp3` or `io2` on
      # AWS, `Premium_LRS` on Azure, `pd-ssd` on GCP). `replicas` is
      # the post-primary read-replica count for shapes that support
      # horizontal read scaling.
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        engine: { type: string }
        storage_tier: { type: string, enum: [nvme, ssd, hdd], default: nvme }
        replicas: { type: integer, min: 1 }
      required: [engine, storage_tier]
    VectorDatastoreParameter:
      # The vector-store specialisation. Composes BaseDatastoreParameter
      # and adds the vector-specific configuration block: embedding
      # dimensionality and the distance metric used at query time.
      # `dimensions` matches the embedding model's output dimensionality;
      # mis-pairing dimensionality between the embedder Component and the
      # vector-store Component produces runtime errors at insert time, so
      # the field is required. `distance_metric` defaults to cosine — the
      # dominant choice for semantic similarity over embeddings — with
      # euclidean and dot-product as the other shipping options.
      $ref: "AIDatastores#/schemas/BaseDatastoreParameter"
      properties:
        vector_config:
          type: object
          properties:
            dimensions: { type: integer, min: 1 }
            distance_metric: { type: string, enum: [cosine, euclidean, dot], default: cosine }
          required: [dimensions, distance_metric]
      required: [vector_config]
    GraphDatastoreParameter:
      # The graph-store specialisation. Composes BaseDatastoreParameter
      # and adds an optional graph-configuration block. `strict_schema`
      # controls whether the graph engine enforces a typed node/edge
      # schema at write time (Neo4j 5.x labels + property type
      # constraints; Memgraph node-types) or treats the graph as
      # schemaless. The schemaless default mirrors how most AI-agent
      # workloads start — schema discipline is added as the graph
      # shape stabilizes.
      $ref: "AIDatastores#/schemas/BaseDatastoreParameter"
      properties:
        graph_config:
          type: object
          properties:
            strict_schema: { type: boolean, default: false }
