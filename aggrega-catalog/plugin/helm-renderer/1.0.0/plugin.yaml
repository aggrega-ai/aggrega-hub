apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-renderer
  version: 1.0.0
  description: Wasm rendering engine for the helm provider — renders Helm chart sources and synthesizes workloads into flat Kubernetes manifests.
spec:
  plugin: oci://hub.aggrega.ai/plugins/helm-provider@sha256:18738bdabcf57eb4f6b947358b75dc83a9be3b622873530492a8040767059110
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - helm
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
