apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-renderer
  version: 1.0.0
  description: Wasm rendering engine for the helm provider — renders Helm chart sources and synthesizes workloads into flat Kubernetes manifests.
spec:
  plugin: oci://hub.aggrega.ai/plugins/helm-provider@sha256:733cc4441c5fa57a82ebc91fabfcee76671bbeb0fd7574f547a815e2018beabb
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - helm
  exports:
    - name: render_node
  # capabilities is this engine's plugin-level self-report, matched against the
  # plugin's own describe() output at publish and at load: the input kinds it
  # renders and how it treats a dispatch group's output. The helm engine renders
  # sourced charts, synthesizes workloads, and emits standalone artifacts as flat
  # manifests written directly at the dispatch path (no boundary assembly).
  capabilities:
    inputKinds:
      sourced: true
      synthesized: true
      artifactsStandalone: true
    boundaryAssembly: none
    # reusableInstance declares that one loaded instance of this engine serves
    # every render, assemble, and validate crossing of a build rather than a
    # fresh instance per crossing. The engine holds no state across crossings —
    # its output is a pure function of each crossing's input — so a reused
    # instance produces byte-identical artifacts.
    reusableInstance: true
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
  provider:
    # provider carries the provider-socket metadata for this rendering engine:
    # how it translates the aggrega.ai/v1alpha1 Workload kind and which
    # platform-native annotations it reads. A non-empty workloadSchema declares
    # that this engine supports Workload synthesis; it is compiled to JSON
    # Schema 2020-12 at load as a structural guardrail and documents, for
    # catalog readers, the Workload surface the helm engine materialises.
    #
    # Helm synthesis rules the body reflects:
    #   - 1 Deployment (or StatefulSet if any volume uses persistentTemplate)
    #   - 1 Service per entry in workload.services
    #   - 1 PVC per workload.volumes.*.persistent entry
    #   - ConfigMap/Secret volumes render as volume refs (source must exist)
    #   - replicas, scheduling, podSecurityContext, serviceAccount flow to
    #     the Deployment/StatefulSet spec directly
    #   - containers.*.secrets with as:env -> envFrom; as:file -> volume+mount
    workloadSchema: |
      apiVersion:
        type: string
        description: Always aggrega.ai/v1alpha1.
      kind:
        type: string
        description: Always Workload.
      metadata:
        labels:
          type: object
          valuesType: string
          description: Author-declared labels; merged with aggrega.ai/* provenance labels on every rendered Kubernetes resource.
        annotations:
          type: object
          valuesType: string
          description: Author-declared annotations; propagated to the pod template.
      replicas:
        type: integer
        min: 0
        description: Desired replica count on the rendered Deployment or StatefulSet. A StatefulSet is selected when any volume uses persistentTemplate.
      initContainers:
        type: array
        description: Containers that run to completion before the main containers start.
      containers:
        type: object
        valuesType: object
        description: Map of container name to container spec (image, command, args, variables, ports, resources, health probes, volumeMounts, securityContext). At least one entry is required.
      volumes:
        type: object
        valuesType: object
        description: Map of volume name to volume spec. persistent renders one PVC each; persistentTemplate renders StatefulSet volumeClaimTemplates; configmap and secret render as references to an existing source.
      services:
        type: object
        valuesType: object
        description: Map of service name to service spec. Each renders a Kubernetes Service (ClusterIP, NodePort, LoadBalancer, or Headless); names are suffixed by the aggrega instance id for resource-name uniqueness.
      scheduling:
        type: object
        description: Kubernetes scheduling constraints (nodeSelector, affinity, tolerations, topologySpreadConstraints) applied to the pod template.
      podSecurityContext:
        type: object
        description: Pod-level security context (runAsUser, runAsGroup, fsGroup, supplementalGroups).
      serviceAccount:
        type: string
        description: Name of the ServiceAccount the rendered pods run under.
    # wellKnownAnnotations documents the aggrega.ai/ boundary annotations the
    # helm engine reads and the behavior applied when each is absent. This is
    # descriptive contract metadata for catalog readers and the inspect
    # surface; the compiler passes these annotations through as opaque strings.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Kubernetes namespace the boundary's resources render into.
        defaultBehavior: No namespace field is injected; resources inherit the apply-time context namespace.
      - key: aggrega.ai/image-registry
        purpose: Registry prefix prepended to container image references.
        defaultBehavior: No prefix; images render with their authored references.
      - key: aggrega.ai/image-pull-secret
        purpose: Name of the Kubernetes imagePullSecrets entry attached to the pod template.
        defaultBehavior: No imagePullSecrets entry is added.
      - key: aggrega.ai/cluster-domain
        purpose: DNS suffix used for cross-namespace service discovery.
        defaultBehavior: cluster.local.
      - key: aggrega.ai/ingress-class
        purpose: IngressClass applied to rendered Ingress resources.
        defaultBehavior: The provider default is used or the field is omitted.
      - key: aggrega.ai/service-mesh
        purpose: Mesh sidecar-injection annotations applied to the pod template.
        defaultBehavior: No mesh annotations are added.
      - key: aggrega.ai/service-account
        purpose: ServiceAccount the rendered pods run under.
        defaultBehavior: default.
      - key: aggrega.ai/pod-security-standard
        purpose: Pod Security Standards level applied to the workload.
        defaultBehavior: No pod-security-standard level is applied.
