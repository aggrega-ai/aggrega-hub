apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: helm-chart
  version: 0.9.0-rc.2
  pluginType: provider
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
    hostFunctions:
      - aggrega_pack_source
  exports:
    - name: render_node
    - name: assemble_boundary
    - name: name_bound
    - name: carve
    - name: reassemble
  provider:
    capabilities:
      - helm-chart
    wellKnownAnnotations:
      - key: aggrega.ai/chart-name
        purpose: Name of the assembled umbrella Helm chart.
        defaultBehavior: The Aggregate name and the umbrella's assembly path — its output directory under dist/, such as boundaries/data/helm-chart — are used, each encoded and joined.
        scope:
          - boundary
    contract:
      inputKinds:
        sourced: true
      boundaryAssembly: nest
      artifactDelimiters:
        left: '[['
        right: ']]'
      assemblyNameAnnotation:
        annotation: aggrega.ai/chart-name
        requireUnique: true
      reusableInstance: true
      nestSegment: charts
      sourceIgnore:
        patterns:
          - .git/
          - .hg/
          - .svn/
          - .bzr/
          - templates/.?*
        files:
          - .helmignore
