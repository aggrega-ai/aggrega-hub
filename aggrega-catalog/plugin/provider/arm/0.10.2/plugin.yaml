# Generated from the plugin by `aggrega plugin gen-catalog`. You may narrow its capability lists; edit nothing else here.
apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: arm
  version: 0.10.2
  pluginType: provider
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
    hostFunctions:
      - aggrega_pack_source
  exports:
    - name: render_node
    - name: validate_node_input
    - name: assemble_boundary
    - name: link_publish
    - name: link_resolve
  provider:
    capabilities:
      - arm
    wellKnownAnnotations:
      - key: aggrega.ai/azure-subscription
        purpose: The Azure subscription the boundary's template deploys into. A cross-boundary reference to a boundary deployed at resource-group or subscription scope reads it to build the producing deployment's resource ID, and a boundary deployed at management-group scope deploys its subscription and resource-group content to it.
        defaultBehavior: The producer is taken to be in the consuming deployment's own subscription; a boundary deployed at management-group scope with subscription or resource-group content halts naming the annotation, and so does a read at management-group scope of a producer at resource-group or subscription scope.
        scope:
          - boundary
      - key: aggrega.ai/azure-resource-group
        purpose: The Azure resource group the boundary's template deploys into. A cross-boundary reference to a boundary deployed at resource-group scope reads it to build the producing deployment's resource ID, and a boundary deployed at subscription or management-group scope deploys its resource-group content into it.
        defaultBehavior: The producer is taken to be in the consuming deployment's own resource group; a boundary deployed at subscription or management-group scope with resource-group content halts naming the annotation.
        scope:
          - boundary
      - key: aggrega.ai/azure-management-group
        purpose: The Azure management group the boundary's template deploys to. A cross-boundary reference to a boundary deployed at management-group scope reads it to build the producing deployment's resource ID.
        defaultBehavior: The producer is taken to be in the consuming deployment's own management group, which only a consuming template deployed at management-group scope has; a reference from any other scope halts naming the annotation.
        scope:
          - boundary
      - key: aggrega.ai/azure-deployment-scope
        purpose: The scope the boundary's template deploys at, resourceGroup, subscription or managementGroup. At subscription scope the template's resource-group content deploys as one nested deployment into the resource group aggrega.ai/azure-resource-group names; at management-group scope the subscription content and the resource-group content deploy as two nested deployments, to the subscription aggrega.ai/azure-subscription names.
        defaultBehavior: The template deploys at resource-group scope.
        scope:
          - boundary
    contract:
      inputKinds:
        sourced: true
        artifactsStandalone: true
      boundaryAssembly: merge
      reusableInstance: true
      crossBoundaryLinking: true
      omits: true
