apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: terraform-renderer
  version: 1.0.0
  description: Wasm rendering engine for the terraform provider — copies sourced Terraform file sets into the node's output verbatim.
spec:
  plugin: oci://hub.aggrega.ai/plugins/terraform-provider@sha256:9667198cc4a5181e1689d46af66a06d091a7f0d6da80bf864490913da88379bc
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - terraform
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
