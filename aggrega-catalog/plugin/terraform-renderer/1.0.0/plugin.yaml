apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: terraform-renderer
  version: 1.0.0
  description: Wasm rendering engine for the terraform provider — copies sourced Terraform file sets into the node's output verbatim.
spec:
  plugin: oci://hub.aggrega.ai/plugins/terraform-provider@sha256:8311c3d147b1309fed39566a0619130dee3f7b3ca5c701ade2c4f90915adf82b
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - terraform
  exports:
    - name: render_node
  # capabilities is this engine's plugin-level self-report, matched against the
  # plugin's own describe() output at publish and at load. The terraform engine
  # renders sourced module file sets and standalone artifacts; it does not
  # synthesize workloads and writes each node's output directly at the dispatch
  # path (no boundary assembly).
  capabilities:
    inputKinds:
      sourced: true
      synthesized: false
      artifactsStandalone: true
    boundaryAssembly: none
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
