apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: litellm-gateway-config
  pluginType: pipeline-step
  version: 1.0.0
  license: Apache-2.0
  description: >
    Write runtime controls into an AI gateway's rendered configuration. The
    gateway's realization emits its configuration as a text block inside a
    ConfigMap and the proxy reads that file through its --config flag, so a
    control the running proxy honors is a setting inside that body rather than a
    resource of its own. A feature-recipe pipeline step names the configuration
    section and the settings it wants; this plugin selects the entry carrying the
    routing table the gateway serves, writes those settings into that section,
    and replaces the entry. Only the lines a setting touches are rewritten, so
    the routing table keeps the order and formatting its Recipe authored and a
    build's diff shows the settings an attachment asked for and nothing else.
    Compatible with the helm provider, whose Workload synthesis emits the
    documents it patches; the build refuses the step where the provider rendering
    those documents is another.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  abiVersion: v1alpha1
  # Explicit caps rather than the platform defaults, so what bounds this guest is
  # readable from the entity. hostFunctions and commands are machine-owned: they
  # are derived from the artifact's own imports and self-report, written by
  # `aggrega plugin sync`, and verified against the artifact at publish — an
  # entity whose records disagree with its bytes is refused. This guest imports
  # no host function and contributes no command, so both record an explicit empty
  # list rather than being omitted.
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
    hostFunctions: []
  exports:
    - name: step
      operates: patch
      scope: host
  pipelineStep:
    capabilities:
      - helm
  commands: []
