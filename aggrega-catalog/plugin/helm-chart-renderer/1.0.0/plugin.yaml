apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-chart-renderer
  version: 1.0.0
  description: Wasm rendering engine for the helm-chart provider — copies sourced Helm charts into sub-chart file sets and assembles a dispatch group's sub-charts into an umbrella Chart.yaml and values.yaml.
spec:
  plugin: oci://hub.aggrega.ai/plugins/helmchart-provider@sha256:d5818048458e180de742867fcb2a1007c09fc1ff1f09d4ee263d34dafef89add
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - helm-chart
  exports:
    - name: render_node
    - name: assemble_boundary
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
