apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: search/example
  version: 0.1.0
  description: Example search engine — answers a ranked full-text query over a small embedded index, for exercising the search socket end-to-end.
spec:
  pluginType: search
  abiVersion: v1alpha1
  # search is a cross-cutting runtime socket: it renders no provider target, so
  # targets is empty.
  exports:
    - name: search
  # search carries the search-socket metadata this guest's describe() self-reports:
  # the index format and version it reads and the ranked-query capabilities it
  # advertises. The compiler routes the query and does not parse the index; these
  # fields document the guest's index contract for catalog readers and inspect.
  search:
    indexFormat: aggrega.search.index
    indexVersion: v1
    capabilities:
      - term-match
      - field-filter
  runtime:
    maxMemoryPages: 512
    timeoutMs: 30000
