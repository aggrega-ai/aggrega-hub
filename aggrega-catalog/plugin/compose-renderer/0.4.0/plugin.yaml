apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: compose-renderer
  version: 0.4.0
  description: Wasm rendering engine for the compose provider — renders compose file sources, synthesizes workloads into compose service fragments, and merges a dispatch group's fragments into a single docker-compose.yaml.
spec:
  plugin: oci://hub.aggrega.ai/plugins/core/compose-provider
  pluginType: provider
  abiVersion: v1alpha1
  targets:
    - compose
  exports:
    - name: render_node
    - name: assemble_boundary
  # capabilities is this engine's plugin-level self-report, matched against the
  # plugin's own describe() output at publish and at load. The compose engine
  # renders sourced compose files and synthesizes workloads; it does not emit
  # standalone artifacts, and it merges a dispatch group's per-node fragments
  # into a single docker-compose.yaml (boundary-merge assembly).
  capabilities:
    inputKinds:
      sourced: true
      synthesized: true
      artifactsStandalone: false
    boundaryAssembly: merge
    # reusableInstance declares that one loaded instance of this engine serves
    # every render, assemble, and validate crossing of a build rather than a
    # fresh instance per crossing. The engine holds no state across crossings —
    # its output is a pure function of each crossing's input — so a reused
    # instance produces byte-identical artifacts.
    reusableInstance: true
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
  provider:
    # provider carries the provider-socket metadata for this rendering engine:
    # how it translates the aggrega.ai/v1alpha1 Workload kind and which
    # platform-native annotations it reads. A non-empty workloadSchema declares
    # that this engine supports Workload synthesis; it is compiled to JSON
    # Schema 2020-12 at load as a structural guardrail and documents, for
    # catalog readers, the Workload surface the compose engine materialises.
    #
    # Compose synthesis rules the body reflects:
    #   - workload.form: stateless and stateful render as services (stateful adds
    #     the named volume); daemon, scheduled, and task have no compose mapping
    #     and halt loudly
    #   - Each Workload -> one service entry in docker-compose.yaml
    #   - containers -> compose service (multi-container -> sidecars via
    #     additional services sharing the network namespace)
    #   - volumes.*.persistent -> named volume + service mount
    #   - volumes.*.configmap / .secret -> bind mount of rendered file
    #   - services (K8s) -> exposed ports on the compose service
    #   - replicas -> deploy.replicas (swarm mode) or ignored in plain compose
    #   - probes -> healthcheck block (http/tcp mapped to curl/nc, exec direct)
    workloadSchema: |
      apiVersion:
        type: string
        description: Always aggrega.ai/v1alpha1.
      kind:
        type: string
        description: Always Workload.
      metadata:
        labels:
          type: object
          valuesType: string
          description: Author-declared labels; merged with aggrega.ai/* provenance labels on every emitted compose service.
        annotations:
          type: object
          valuesType: string
          description: Author-declared annotations; emitted as compose service labels.
      form:
        type: string
        description: Abstract controller-shape intent, one of stateless, stateful, daemon, scheduled, task. compose renders stateless and stateful as services (stateful adds the named volume); daemon, scheduled, and task have no compose mapping and halt loudly. Defaults to stateless.
      replicas:
        type: integer
        min: 0
        description: Desired replica count. Mapped to deploy.replicas under swarm mode; ignored by plain compose when greater than one.
      initContainers:
        type: array
        description: Containers that run to completion before the main containers start; emitted as depends_on service-completion ordering.
      containers:
        type: object
        valuesType: object
        description: Map of container name to container spec. The first container becomes the compose service; additional containers become sidecar services sharing the network namespace.
      volumes:
        type: object
        valuesType: object
        description: Map of volume name to volume spec. persistent and persistentTemplate (which requires form: stateful) render as named volumes with service mounts; configmap and secret render as bind mounts of the rendered file.
      services:
        type: object
        valuesType: object
        description: Map of service name to service spec. Kubernetes service ports become published or exposed ports on the compose service.
      scheduling:
        type: object
        description: Kubernetes scheduling constraints. Ignored by compose except where a native analog exists; a warning is emitted.
      podSecurityContext:
        type: object
        description: Pod-level security context. Best-effort mapping to compose user and security options where an analog exists.
      serviceAccount:
        type: string
        description: Name of the ServiceAccount. No compose analog; documented for parity and ignored by the compose engine.
    # wellKnownAnnotations documents the aggrega.ai/ boundary annotations the
    # compose engine reads and the behavior applied when each is absent. This is
    # descriptive contract metadata for catalog readers and the inspect
    # surface; the compiler passes these annotations through as opaque strings.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Per-boundary Docker network name the boundary's services attach to.
        defaultBehavior: The sanitised boundary path is used as the network name.
      - key: aggrega.ai/project-name
        purpose: Docker Compose project name for the emitted docker-compose.yaml.
        defaultBehavior: The leaf boundary name is used.
      - key: aggrega.ai/image-registry
        purpose: Registry prefix prepended to container image references.
        defaultBehavior: No prefix; images render with their authored references.
