apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: cloudformation-renderer
  version: 1.0.0
  description: Wasm rendering engine for the cloudformation provider — normalizes CloudFormation fragments to pure-JSON long-form intrinsics and merges a dispatch group's fragments into a single CloudFormation stack template.
spec:
  plugin: oci://hub.aggrega.ai/plugins/core/cloudformation-provider
  pluginType: provider
  abiVersion: v1alpha1
  targets:
    - cloudformation
  # The engine renders standalone artifact fragments and normalizes sourced
  # templates to pure-JSON long-form intrinsics, structurally validating a sourced
  # template ahead of render; it merges a dispatch group's per-node fragments into
  # one stack template, and it wires cross-boundary uses edges through the
  # link_publish and link_resolve export pair.
  exports:
    - name: render_node
    - name: validate_node_input
    - name: assemble_boundary
    - name: link_publish
    - name: link_resolve
  # capabilities is this engine's plugin-level self-report, matched against the
  # plugin's own describe() output at publish and at load. The cloudformation
  # engine renders sourced templates and standalone artifact fragments; it does
  # not synthesize workloads, and it merges a dispatch group's per-node fragments
  # into a single stack template (boundary-merge assembly).
  capabilities:
    inputKinds:
      sourced: true
      synthesized: false
      artifactsStandalone: true
    boundaryAssembly: merge
    # reusableInstance declares that one loaded instance of this engine serves
    # every render, assemble, and validate crossing of a build rather than a
    # fresh instance per crossing. The engine holds no state across crossings —
    # its output is a pure function of each crossing's input — so a reused
    # instance produces byte-identical artifacts.
    reusableInstance: true
    # crossBoundaryLinking declares that this engine wires a cross-boundary uses
    # edge — a uses edge whose ends assemble into different stacks (dispatch
    # groups) — by emitting a cross-stack reference through its paired
    # link_publish and link_resolve exports, both declared above.
    crossBoundaryLinking: true
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap. The standard-Go SDK guest's runtime initialization
    # is seconds-scale and slower where the host runs the Wasm engine without
    # native code generation (a restricted environment that denies executable
    # memory falls back to interpretation). Raise this plugin's own cap the same
    # way its memory cap is raised, so a legitimate render never false-times-out.
    timeoutMs: 300000
  provider:
    # provider carries the provider-socket metadata for this rendering engine.
    # The cloudformation engine synthesizes no Workload, so it declares no
    # workloadSchema; it reads the cloud-target boundary annotations below to
    # shape a cross-stack reference between boundaries (a boundary is one
    # stack). This is descriptive contract metadata for catalog readers and the
    # inspect surface; the compiler passes these annotations through as opaque
    # strings and never reads or validates them.
    wellKnownAnnotations:
      - key: aggrega.ai/aws-account
        purpose: The AWS account the stack (boundary) deploys into. A cross-boundary reference reads it to decide whether a peer stack sits in the same account.
        defaultBehavior: The peer is treated as same-account, and a cross-stack reference resolves through a same-account stack-export import rather than a cross-account stack-output read.
      - key: aggrega.ai/aws-region
        purpose: The AWS region the stack (boundary) deploys into. A cross-boundary reference reads it to decide whether a peer stack sits in the same region.
        defaultBehavior: The peer is treated as same-region, and a cross-stack reference resolves through a same-region stack-export import.
      - key: aggrega.ai/aws-assume-role-arn
        purpose: The IAM role ARN a cross-account stack read assumes to reach a peer stack's exported values.
        defaultBehavior: No role is supplied, and a cross-account reference carries no assume-role.
