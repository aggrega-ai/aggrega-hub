apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: langgraph
  version: 0.9.0-rc.2
  pluginType: importer
  description: Import the graphs a LangGraph project declares in langgraph.json into a draft Aggregate holding one core/ai-agent/langgraph instance per graph, wired to the datastore its checkpointer keeps state in, and a draft Release carrying the environment the configuration states; the project's code is not read, nor any value of an environment file.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:langgraph
    detect:
      - syntax: json
        files:
          - langgraph.json
        match:
          - path: graphs
            is: object
      - syntax: json
        match:
          - path: $schema
            is: string
            equals: https://langgra.ph/schema.json
          - path: graphs
            is: object
