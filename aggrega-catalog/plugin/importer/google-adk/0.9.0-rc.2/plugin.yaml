apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: google-adk
  version: 0.9.0-rc.2
  pluginType: importer
  description: Import the agents declared in the Agent Config files of an application built on Google ADK (root_agent.yaml and the configurations its sub-agents name) into a draft Aggregate holding one core/ai-agent/google-adk instance per agent tree, wired to the Gemini model the tree names, and a draft Release beside it; the application's code is not read, nor its environment file.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:google-adk
    detect:
      - syntax: yaml
        files:
          - root_agent.yaml
        match:
          - path: name
            is: present
          - path: instruction
            is: present
      - syntax: yaml
        files:
          - root_agent.yaml
        match:
          - path: agent_class
            is: string
          - path: name
            is: present
