apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: agent-framework
  version: 0.8.10
  pluginType: importer
  description: Import a Microsoft Agent Framework declarative agent (a YAML document of kind Prompt) into a draft Aggregate holding one core/ai-agent/agent-framework instance per declarative agent, wired to the OpenAI model it names and to each MCP server it reaches, and a draft Release beside it; the application's code is not read.
spec:
  abiVersion: v1alpha1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:agent-framework
    detect:
      - syntax: yaml
        match:
          - path: kind
            is: string
            equals: Prompt
          - path: model
            is: object
