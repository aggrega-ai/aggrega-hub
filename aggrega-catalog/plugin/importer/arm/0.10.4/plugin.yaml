# Generated from the plugin by `aggrega plugin gen-catalog`. You may narrow its capability lists; edit nothing else here.
apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: arm
  version: 0.10.4
  pluginType: importer
  description: Import Azure Resource Manager templates (language version 1.0 and 2.0, with comments or without) and their parameters files into a draft Aggregate holding one instance per resource, of the catalog Component its type matches, connected as its references and dependencies say, a draft Release carrying what the template states for its operation, and the catalog entities a resource no Component covers is drafted as. An import that names no target drafts for arm. Resource types are matched through a table generated from the arm Recipes of aggrega-hub at d4135ac28b7135f32550c03acb3b1b205e97aaf2; Azure Verified Modules modules are recognised through the module index of commit ef1f2199f8c29d5489261aff8d4b5dc92178d1b8.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 90000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:arm
    detect:
      - syntax: jsonc
        files:
          - '*.json'
        match:
          - path: $schema
            is: string
            prefix: https://schema.management.azure.com/schemas/
          - path: resources
            is: present
      - syntax: jsonc
        files:
          - '*.json'
        match:
          - path: $schema
            is: string
            prefix: https://schema.management.azure.com/schemas/
          - path: parameters
            is: object
    defaultTarget: arm
