# Generated from the plugin by `aggrega plugin gen-catalog`. You may narrow its capability lists; edit nothing else here.
apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: arm-schema
  version: 0.10.1
  pluginType: importer
  description: Import the resource types of a Bicep types.json file (from Azure/bicep-types-az, one resource provider namespace at one API version) into a draft Component and a draft Recipe for each type the settings' resource_types names, targeting the arm provider.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 60000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:arm-schema
    detect:
      - syntax: json
        files:
          - types.json
        match:
          - path: 0.$type
            is: string
