# Generated from the plugin by `aggrega plugin gen-catalog`. You may narrow its capability lists; edit nothing else here.
apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: cloudformation-schema
  version: 0.10.0
  pluginType: importer
  description: Import CloudFormation resource types — a resource type's provider schema or the output of describe-type — into a draft Component and a draft Recipe for each type, targeting the cloudformation provider, named by the settings' resource_types or, for a source holding one type, taken whole.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 60000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:cloudformation-schema
    detect:
      - syntax: json
        files:
          - '*.json'
        match:
          - path: typeName
            is: string
          - path: properties
            is: object
      - syntax: json
        files:
          - '*.json'
        match:
          - path: TypeName
            is: string
          - path: Schema
            is: string
