apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: mcp
  version: 0.9.0-rc.2
  pluginType: importer
  description: Import an MCP client configuration (.mcp.json, claude_desktop_config.json, .vscode/mcp.json, .cursor/mcp.json) or an MCP registry server description (server.json) into a draft Aggregate holding one core/ai-tool/mcp instance per server, and a draft Release beside it carrying each server's command line, address or image and its environment.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:mcp
    detect:
      - syntax: json
        files:
          - .mcp.json
        match:
          - path: mcpServers
            is: object
      - syntax: json
        files:
          - claude_desktop_config.json
        match:
          - path: mcpServers
            is: object
      - syntax: json
        files:
          - .cursor/mcp.json
        match:
          - path: mcpServers
            is: object
      - syntax: jsonc
        files:
          - .vscode/mcp.json
        match:
          - path: servers
            is: object
      - syntax: json
        match:
          - path: $schema
            is: string
            prefix: https://static.modelcontextprotocol.io/schemas/
