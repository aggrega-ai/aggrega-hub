apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: dify
  version: 0.9.0-rc.2
  pluginType: importer
  description: Import a Dify application, in the YAML DSL Dify exports, into a draft Aggregate composing the Dify installation core/dify with the application carried in its app_definition parameter; the models, tools, knowledge bases and plugins the application names are reported as configured inside Dify.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:dify
    detect:
      - syntax: yaml
        match:
          - path: kind
            is: string
            equals: app
          - path: app.mode
            is: present
          - path: version
            is: present
