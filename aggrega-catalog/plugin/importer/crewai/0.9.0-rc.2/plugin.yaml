apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: crewai
  version: 0.9.0-rc.2
  pluginType: importer
  description: Import the agents and tasks a CrewAI project declares (config/agents.yaml and config/tasks.yaml, or crew.jsonc and agents/*.jsonc, or their .json spellings) into a draft Aggregate holding one core/ai-agent/crewai instance per agent, wired to the model its llm names, and a draft Release beside it; the crew's program is not read.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 30000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:crewai
    detect:
      - syntax: yaml
        files:
          - config/agents.yaml
      - syntax: yaml
        files:
          - config/tasks.yaml
      - syntax: jsonc
        files:
          - crew.jsonc
          - crew.json
        match:
          - path: agents
            is: array
      - syntax: jsonc
        files:
          - agents/*.jsonc
          - agents/*.json
        match:
          - path: role
            is: present
