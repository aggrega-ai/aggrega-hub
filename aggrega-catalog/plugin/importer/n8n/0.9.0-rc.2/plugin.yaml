apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: n8n
  version: 0.9.0-rc.2
  pluginType: importer
  description: 'Import an exported n8n workflow into a draft Aggregate: by default the n8n platform carrying the workflow, with the workflow''s models, tools and vector stores that match the workspace''s catalog wired to it as Components; with the layout setting nodes, every node drafted as a Component of its own.'
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 120000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:n8n
    detect:
      - syntax: json
        match:
          - path: nodes
            is: array
          - path: connections
            is: object
          - path: edges
            is: absent
          - path: data.nodes
            is: absent
