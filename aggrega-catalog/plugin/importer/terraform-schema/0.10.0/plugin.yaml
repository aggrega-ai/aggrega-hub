# Generated from the plugin by `aggrega plugin gen-catalog`. You may narrow its capability lists; edit nothing else here.
apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: terraform-schema
  version: 0.10.0
  pluginType: importer
  description: Import the resource types of a Terraform provider schema export (the JSON of terraform providers schema -json, or the same of OpenTofu) into a draft Component and a draft Recipe for each type the settings' resource_types names, or for the one the export holds, targeting the terraform provider.
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 8192
    timeoutMs: 150000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:terraform-schema
    detect:
      - syntax: json
        files:
          - '*.json'
        match:
          - path: format_version
            is: string
          - path: provider_schemas
            is: object
