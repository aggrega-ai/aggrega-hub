apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: flowise
  version: 0.9.0-rc.2
  pluginType: importer
  description: 'Import Flowise agent-flow JSON into a draft Aggregate: by default the Flowise platform carrying the flow, with the flow''s models, tools and stores that match the workspace''s catalog wired to it as Components; with the layout setting nodes, every node drafted as a Component of its own.'
spec:
  abiVersion: v1beta1
  runtime:
    maxMemoryPages: 2048
    timeoutMs: 60000
    hostFunctions:
      - aggrega_parse_source
  exports:
    - name: import
  importer:
    capabilities:
      - import:flowise
    detect:
      - syntax: json
        match:
          - path: nodes
            is: array
          - path: edges
            is: array
          - path: data.nodes
            is: absent
