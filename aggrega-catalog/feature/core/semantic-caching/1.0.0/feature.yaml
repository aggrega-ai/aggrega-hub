apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/semantic-caching
  version: 1.0.0
  description: >
    Lets an AI gateway answer a prompt from the replies it stored earlier
    when the prompt is close enough in meaning to one it answered before,
    rather than calling the model again. The gateway turns each prompt into a
    vector with embedding_model, serves a stored reply whose prompt is at
    least similarity_threshold alike, and keeps a reply for ttl_seconds.

    scope decides who shares a cache. With key, every caller presenting the
    same key to the gateway is served from one cache, so an end user behind
    that key can be served a reply generated for another, tool calls
    included. The default, end_user, keeps each end user the gateway
    identifies apart.

    A match on meaning suits single prompts: on multi-turn or agentic traffic
    consecutive turns read alike, so a reply to an earlier turn can be served
    for a later one. It does not meet core/data-masking on one component.

    The developer attaches it in the Aggregate, with its inputs in values; it
    takes no infra. core/gateway/litellm, azure-api-management, apisix and
    traefik-hub realize it, the last three keeping scope key alone, apisix
    and traefik-hub for the callers each Release declares; litellm, apisix
    and traefik-hub keep the replies in a core/datastore/redis wired to the
    gateway, litellm requiring its administrative key. On
    core/gateway/kong-enterprise and higress every attachment halts, naming
    the caller separation each cache lacks, and on agentgateway, naming the
    reply cache it lacks; on any component but these seven an attachment
    halts naming the type, rendering nothing.
  # Each realization is the FeatureRecipe named after the Feature and its
  # gateway: semantic-caching-litellm, semantic-caching-azure-api-management,
  # semantic-caching-apisix and semantic-caching-traefik-hub, and the halting
  # semantic-caching-kong-enterprise, semantic-caching-higress and
  # semantic-caching-agentgateway.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  # core/data-masking declares the conflict with this Feature, and one
  # declaration is enough for the build to halt on the pair: a response cache
  # keys a request after masking, so two requests differing only in what
  # masking replaces would share one stored reply.
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      # The four values are the shape gateways caching replies by meaning
      # share: how alike two prompts must be, the model that compares them, how
      # long a stored reply lasts, and whose requests share a cache. The first
      # three are required: which threshold suits depends on the embedding
      # model, and the gateways' own default lifetimes differ from minutes to a
      # day, so no default would say what an attachment gets.
      properties:
        # A cosine similarity, the measure these gateways compare. A
        # realization whose gateway takes the bound in another form writes it
        # converted.
        similarity_threshold:
          type: number
          min: 0
          max: 1
          description: "How alike a prompt must be to one answered before for the stored reply to be served: the cosine similarity of their two vectors, from 0 to 1, where 1 is identical. A higher value serves fewer and closer matches; which value suits depends on embedding_model."
        # Named as the gateway publishes it, so the attachment carries no
        # address and no credential: a gateway that names its embedding model
        # by an alias of its model map takes the name as written, and for one
        # that reaches the model by an endpoint the realization writes the
        # endpoint, model and credential the gateway already holds under that
        # name.
        embedding_model:
          type: string
          min: 1
          description: "The model that turns a prompt into the vector compared, named as the gateway knows it: an alias of the model map on an AI gateway, or on Azure API Management the id of a backend the instance holds for an embeddings model. Each realization refuses a name its gateway does not publish wherever the build can see what the gateway publishes; an instance's backends are not in the build, so the Azure API Management realization takes the id as written."
        ttl_seconds:
          type: integer
          min: 1
          description: "How long a stored reply stays usable, in seconds."
        # Whose requests share a cache decides whether one caller can be served
        # a reply generated for another, so the default keeps end users apart,
        # and sharing per key is written out where it is meant.
        scope:
          type: string
          enum: [key, end_user]
          default: end_user
          description: "Who shares one cache. end_user, the default: each end user the gateway identifies has a cache of its own, so none is served a reply generated for another. key: every caller presenting the same key to the gateway shares one cache, so a reply generated for one end user behind that key can be served to another sending a similar prompt. Each realization says how its gateway identifies an end user and what it does with a request naming none, and refuses end_user where its gateway cannot keep end users apart."
      required: [similarity_threshold, embedding_model, ttl_seconds]
