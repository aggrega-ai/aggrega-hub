apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/semantic-caching
  version: 1.0.0
  description: >
    Declares that an AI gateway may answer from a cache rather than calling
    the upstream model again, and how long a cached answer stays usable. What
    counts as a match is not declared here — only the lifetime is — so which
    requests a realization would treat as the same question is left to that
    realization. No FeatureRecipe in the standard library implements this
    today, so a Release that attaches it halts the build naming the type
    rather than rendering anything: the control is declared here, and the
    realization that would honour it is not yet authored.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        ttlSeconds: { type: integer, min: 0 }
