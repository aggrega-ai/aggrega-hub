apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/egress-allowlist
  version: 1.0.0
  description: >
    Lets the component it is attached to connect only to the components it is
    wired to: the targets of its uses edges, each on the ports its pods
    declare, plus its own pods, the cluster's DNS and the address ranges the
    attachment names. It keeps, say, an agent platform reaching only the
    models and tools its Aggregate wires it to. It restricts where a
    connection may go, not what it carries.

    The cluster's network enforces the rule, and only where its network plugin
    implements network policy, so the Release affirms it. A target the cluster
    does not run, such as a hosted model API, is reached only through the
    address ranges the attachment lists for it, and a range admits those
    addresses on any port for the whole component, not for that connection
    alone.

    Attached by the operator in the Release, on the component it restricts,
    under components.<id>.features. Its destinations are the uses edges the
    Aggregate already declares, so a connection the Aggregate does not declare
    as an edge can be refused by the cluster wherever a Release attaches it.

    Realized on helm: one network policy per workload the component renders,
    in that workload's namespace. The build halts, naming the connection, where
    a target renders no pods and no range is listed for it, or where a target
    declares no port; and, as core/caller-allowlist does, where a workload is
    emitted into no namespace or carries neither a controller selector nor the
    build's identity labels. On compose the build halts, naming this Feature:
    compose has no network policy.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # A component that runs pods: every type but a resource, which runs none. A
  # function realized through a control plane that creates its pods at runtime
  # renders no pod either, and the bound FeatureRecipe halts on it, naming why.
  appliesTo: "component.aggrega.ai/type in (server, stateful-server, worker, task, function)"
  # What the rule admits, and what it cannot see:
  #
  # - The destinations are read from the Aggregate as built: every component
  #   the attached one's uses edges point at, in whichever boundary and
  #   namespace the Release places it. A target is admitted by the pods its own
  #   render emitted, together with the namespace they are emitted into, on the
  #   ports those pods' containers declare, so the same pods running in another
  #   namespace, or another port of theirs, are not admitted. Pods a Feature
  #   attached to a target renders count as that target's.
  # - Pods are selected as core/caller-allowlist selects them: by the selector
  #   each workload's controller writes, which the controller owns its pods by;
  #   a bare Pod, or a Job relying on the selector the cluster generates, by the
  #   identity labels the build stamps on the pods it synthesizes and on every
  #   bare Pod. Neither carries a version, so a policy keeps matching the old
  #   pods while an upgrade rolls out. A workload with neither, which a chart's
  #   Job usually is, halts the build.
  # - The attached component's own pods may always reach each other, on the
  #   ports their containers declare, so a clustered server keeps reaching its
  #   peers, in whichever namespaces its workloads are emitted into.
  # - The cluster's DNS is admitted on UDP and TCP port 53, to the pods
  #   dns_pods names, so the component can resolve the names of what it is
  #   wired to.
  # - A target the cluster does not run — a hosted model API, a remote agent —
  #   renders no pods a policy can select, and a network policy cannot name a
  #   destination by its host name. Such a connection is admitted only by the
  #   address ranges admitted_destinations lists for it. A range admits those
  #   addresses on any port, and for every connection of the component, since a
  #   policy cannot tie an address to one connection. The compiler is
  #   ahead-of-time and never resolves a host name, so nothing checks that a
  #   range covers the address the target is reached at.
  # - Every other outbound connection of the component's pods is refused, the
  #   cluster's API server included.
  # - Attaching it in the Aggregate is accepted and renders the same policy;
  #   the Release is where it belongs, because what it restricts is how the
  #   cluster lets traffic through, which the operator decides.
  # - Network policies add up: where another policy in the cluster selects the
  #   same pods for egress, a connection either of them admits is admitted.
  # - A pod running on the node's own network is not reliably covered, as the
  #   attached component or as a target: what network policy does with such a
  #   pod is left to each network plugin.
  # - Ingress is left untouched; who may connect to the component is what
  #   core/caller-allowlist restricts.
  # - Compose has no network policy: every service of a group shares one
  #   network, so the compose realization halts the build naming this Feature
  #   rather than leave its restriction silently unrendered.
  schema:
    infra:
      # The runtime prerequisite, declared rather than assumed. A network
      # policy only restricts anything once the cluster's network plugin
      # implements network policy; written into a cluster whose plugin does
      # not, it is accepted and enforces nothing, and every destination stays
      # reachable. The compiler is ahead-of-time and cannot inspect the
      # cluster, so this is an affirmation the Operator makes in the Release
      # rather than something the build can check for itself.
      control_plane_present:
        type: boolean
        default: false
        description: "Operator affirmation that the target cluster's network plugin enforces network policy. The bound FeatureRecipe halts the build unless this is set true, so a policy is never written for a cluster that would accept it and enforce nothing."
      # The pods serving the cluster's DNS. Left unset, they are the kube-dns
      # pods most distributions run: namespace kube-system, pod label
      # k8s-app: kube-dns. A cluster running its resolver under other labels
      # or in another namespace names them here, in the Release, and a value
      # written here replaces that default whole; the realization applies the
      # default. The two fields name pods
      # exactly as an admitted_sources entry of core/caller-allowlist does:
      #
      # - namespace alone: every pod in that namespace.
      # - pod_labels alone: pods carrying those labels in the namespace each
      #   policy is placed in, the one the attached component's workload is
      #   emitted into.
      # - namespace and pod_labels together: pods carrying those labels in that
      #   namespace, and only there.
      #
      # A value naming neither halts the build; an empty value counts as not
      # named. Nothing here is checked against the cluster: a namespace or a
      # label that matches no pod admits nothing, and the component then
      # resolves no name.
      dns_pods:
        type: object
        description: "The pods serving the cluster's DNS, which the attached component may reach on UDP and TCP port 53. Named by namespace, by labels, or by both. Left unset, the pods labelled k8s-app: kube-dns in kube-system; a value written here replaces that whole."
        properties:
          namespace:
            type: string
            description: "Namespace whose pods serve DNS, matched by its kubernetes.io/metadata.name label, which the cluster sets on every namespace. With pod_labels, only the pods in it carrying those labels."
          pod_labels:
            type: object
            additionalProperties:
              type: string
            description: "Labels the DNS pods carry. Without namespace, pods in the namespace each policy is placed in, the one the attached component's workload is emitted into."
        additionalProperties: false
      # Destinations the cluster does not run, admitted by address range. Each
      # entry names one connection by its target and one range for it; a
      # target reached at several ranges takes one entry per range. An entry
      # is how a connection whose target renders no pods a policy can select is
      # admitted at all: without one, the build halts naming the connection.
      #
      # An entry whose target names no connection of the attached component, or
      # whose cidr is empty, halts the build naming the entry. A range admits
      # its addresses on any port, for every connection of the component.
      admitted_destinations:
        type: array
        default: []
        description: "Address ranges the attached component may also reach, each listed for one of its connections. Each entry names the connection's target and one range; a target reached at several ranges takes one entry per range. A range admits its addresses on any port, for the whole component."
        items:
          target:
            type: string
            description: "The target of one of the attached component's uses edges, by its instance ID, such as gpt. An entry naming a component the attached one has no connection to halts the build, listing the targets it does connect to."
          cidr:
            type: string
            description: "Address range admitted, in CIDR notation, such as 203.0.113.0/24."
