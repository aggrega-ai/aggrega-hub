apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/conversational-ingress
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-agent"
  interoperability:
    conflictsWith: []
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseFeatureParameter & {
      // The frontend chat platform
      channel: *"whatsapp" | "slack" | "telegram" | "discord" | "msteams" | "gchat" |string
      
      // Defines when the gateway should wake up the agent
      listen_mode: *"mentions_only" | "direct_messages" | "all_messages"
      
      // Optional: Specific channel IDs the agent is allowed to listen to
      allowed_channel_ids?: [...string]
    }