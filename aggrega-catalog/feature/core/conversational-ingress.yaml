apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/conversational-ingress
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
spec:
  appliesTo: "component.aggrega.ai/category=ai-agent"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        channel:
          type: string
          default: whatsapp
          description: "The frontend chat platform."
        listen_mode:
          type: string
          enum: [mentions_only, direct_messages, all_messages]
          default: mentions_only
          description: "Defines when the gateway should wake up the agent."
        allowed_channel_ids:
          type: array
          items: { type: string }
          description: "Optional: specific channel IDs the agent is allowed to listen to."
      required: [channel, listen_mode]