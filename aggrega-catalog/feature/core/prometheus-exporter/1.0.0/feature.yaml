apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/prometheus-exporter
  version: 1.0.0
  description: >
    Marks a component as a Prometheus scrape target. Its FeatureRecipe
    (component-scope) emits one ServiceMonitor per attached component, scraping
    the component's named metrics port on the operator-set interval. The metrics
    path is developer intent (values.scrapePath); the scrape cadence and the
    named port are operator sizing (infra). Designed to be attached in bulk via a
    Manifest features.annotations binding — one annotation on a boundary expands
    to every contained component — as well as by a per-component features: block.
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "component.aggrega.ai/type=server"
  interoperability:
    conflictsWith: []
  schema:
    values:
      # Developer Intent — the metrics path the application serves.
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        scrapePath: { type: string, default: "/metrics" }
    infra:
      # Operational sizing — filled by the Operator (commonly routed from a
      # monitoring annotation via the Manifest features.annotations binding).
      interval:
        type: string
        default: "60s"
        description: Prometheus scrape interval.
      port:
        type: string
        default: metrics
        description: Named Service port the ServiceMonitor scrapes.
