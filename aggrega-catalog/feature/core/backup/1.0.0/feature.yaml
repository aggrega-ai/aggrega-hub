apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/backup
  version: 1.0.0
  description: >
    Has the datastore it is attached to backed up on a schedule, each backup
    kept for a number of days and then deleted. Every input is the operator's,
    who attaches it in the Release, under the component's features; the
    developer writes nothing for it. It applies to components of type
    stateful-server.

    On a managed database service, attaching it configures the service's own
    automated backup: when it starts and how many days each backup is kept.
    On AWS, the Manifest can also select AWS Backup, which backs up an Amazon
    RDS instance into a vault of its own under the IAM role infra.role_arn
    names, the instance keeping its own automated backups beside unless
    infra.keep_automated_backups is false. On Kubernetes, a backup product
    the Manifest selects writes to the bucket the store connection points at
    or, where it can, to a volume infra.volume sizes; an attachment naming
    both, or neither for such a product, halts. A backup on a volume sits in
    the same cluster as the data it protects, so it guards against a bad
    change or deletion but not against losing the cluster.

    A target refuses by name a value its product cannot keep, rather than
    running a backup other than the one written: a schedule it cannot
    express, a retention outside the days it keeps, a key, a role, a user, a
    store or a volume it has no use for.

    infra.point_in_time_recovery asks for restores to any moment of the
    retention window, with no single default: left out, each product keeps
    its own. It is on, refusing false, on Amazon RDS, Azure Database for
    PostgreSQL flexible server and CloudNativePG; on in Cloud SQL; off on AWS
    Backup until true; off, refusing true, on mariadb-operator, Velero, K8up,
    KubeStash and Kasten.
  # Each target realizes the Feature through a FeatureRecipe the Manifest binds
  # to it, and a Manifest binding none halts the build, naming the attachment.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # What a backup applies to: a component that keeps state of its own. The
  # products that back up a datastore — a managed database service's automated
  # backup, a database operator's backup resource, a cluster backup tool
  # copying a workload's volumes — all act on a server holding data, which is
  # what stateful-server names. A server keeping no state of its own has
  # nothing for a backup to keep.
  #
  # The selector admits every stateful-server, the datastores among them. It
  # does not admit core/datastore/redis, core/datastore/valkey or
  # core/datastore/memcached, which are typed server.
  appliesTo: "component.aggrega.ai/type=stateful-server"
  # One target can run two backup products — a PostgreSQL operator's backup
  # for one datastore, a cluster backup tool for another. The Manifest binds
  # each by the attachment's name, in the name tier of its feature mappings,
  # and that name is the attachment's own, not the component's: give the
  # attachments different names, such as backup on one component and
  # backup_volumes on the other, and bind each name to its FeatureRecipe.
  interoperability:
    conflictsWith: []
  # Where a backup product writes its backups. Each Kubernetes backup product
  # can write them to a bucket reached over the S3 API: Velero through its
  # backup storage location, K8up, CloudNativePG's Barman Cloud object store,
  # mariadb-operator, KubeStash and Kasten's location profiles. A managed
  # database service keeps its backups in its own storage, and some products
  # can keep them on the volume infra.volume describes instead, so the
  # connection is optional: a realization that writes to a bucket or a volume
  # refuses an attachment wiring no store and setting no volume, and one
  # keeping backups in storage of its own refuses an attachment that wires
  # it, each by name.
  #
  # The selector admits a storage resource: core/storage/s3-object-store, and
  # also core/storage/gcs, which carries the same two labels. A realization
  # that reaches its bucket over the S3 API refuses a core/storage/gcs target
  # by name. The type requirement keeps out every component that runs: a
  # backup product installed in the cluster is a server, never the bucket its
  # backups go to.
  #
  # No delivery is declared, so nothing the store publishes is written into
  # the datastore's own configuration: the FeatureRecipe realizing the
  # attachment reads the bucket, the endpoint and the region the store
  # publishes and writes them into the backup product's own resource.
  #
  # Each FeatureRecipe realizes the Feature for one product and reaches that
  # product's controller through the product's own resource kinds — a Velero
  # Schedule, a CloudNativePG ScheduledBackup, a mariadb-operator Backup — so
  # nothing selects a backup controller through a connection, and the backup
  # controllers carry no capability label for a selector to read.
  usesSchema:
    store:
      selector: "component.aggrega.ai/type=resource,component.aggrega.ai/category=storage"
  schema:
    # The inputs are read off the products that back up a datastore, rather
    # than invented ahead of them. Each says when a backup runs, how long it is
    # kept, and where it goes, each in its own shape:
    #   - when: a cron expression (Velero, K8up, CloudNativePG with a seconds
    #     field, mariadb-operator, KubeStash, AWS Backup), or a daily start time
    #     (Amazon RDS, Cloud SQL, Amazon ElastiCache, Kasten's daily policy);
    #     Azure Database for PostgreSQL flexible server takes none and backs up
    #     once a day at a time it chooses.
    #   - how long: a number of days or a duration (Velero, CloudNativePG,
    #     mariadb-operator, KubeStash, AWS Backup, Amazon RDS, Azure Database
    #     for PostgreSQL flexible server), or a count of daily backups (Cloud
    #     SQL, Kasten, K8up), which is the same number when one backup runs a
    #     day.
    #   - where: a bucket for the Kubernetes products, some of which can also keep a
    #     volume or a snapshot; the service's own storage for every managed
    #     one — the store connection above, or infra.volume below.
    # How a product takes its backup — a logical dump, a physical copy, a
    # volume snapshot — differs from one product to the next and is each
    # realization's own.
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # Optional, with no default: unset leaves the time to the target. A
      # managed service then backs up in its own window — Amazon RDS picks a
      # 30-minute window at random within an 8-hour block for its region — and
      # a Kubernetes realization runs a daily backup at the time its own
      # description states. Set, every realization that can express the
      # expression keeps it exactly: a cron expression is native to the
      # Kubernetes products, and a service taking one daily start time keeps
      # an expression naming one minute and one hour of every day, such as
      # 30 2 * * *, as its start time. A realization refuses an expression it
      # cannot keep, naming the value: an hourly expression on a service that
      # backs up once a day, and any expression on Azure Database for
      # PostgreSQL flexible server, whose backup time is the service's.
      schedule:
        type: string
        pattern: "^\\s*\\S+(\\s+\\S+){4}\\s*$"
        description: "When a backup runs: a cron expression of five fields — minute, hour, day of the month, month and day of the week — such as 30 2 * * *. A managed service reads it in UTC; a Kubernetes backup product reads it in its controller's own time zone. Unset, the target chooses the time. A realization refuses an expression its product cannot keep, naming it."
      # A protection, so it keeps its default: an attachment written without
      # it still keeps each backup for 7 days. 7 is a value every measured
      # product keeps: Azure Database for PostgreSQL flexible server keeps 7 to
      # 35 days and defaults to 7, Amazon RDS keeps up to 35 days, Cloud SQL
      # keeps 1 to 365 daily backups. A realization refuses a value outside
      # what its product keeps, naming the range, and never keeps backups for
      # fewer days than written.
      retention_days:
        type: integer
        min: 1
        default: 7
        description: "How many days each backup is kept before it is deleted. A realization whose product keeps backups for fewer or more days than this refuses it by name: Azure Database for PostgreSQL flexible server keeps 7 to 35, Amazon RDS up to 35."
      # The store connection carries no credential: a consumer of a bucket
      # holds the key it presents. A product that writes one backup resource
      # per attachment and reads the key from a Secret that resource names —
      # CloudNativePG's Barman Cloud plugin is one — takes the Secret's name
      # from here. Unset, such a realization names the Secret after the
      # attachment's own resource, <component>-<attachment> with any
      # underscore folded to a hyphen, such as db-backup, or with the
      # namespace of the component's workloads before it, such as
      # app-db-backup, where that resource sits in a namespace every Release on
      # the cluster writes into, as Kasten's policies do. No schema default can
      # express that name, since it differs per attachment, so the key carries
      # none and each realization derives it. The Secret lives in the namespace
      # the backup resource is written into, which each realization's
      # description names, and holds the key pair under the data keys the
      # product reads, which each realization's description names too:
      # ACCESS_KEY_ID and ACCESS_SECRET_KEY where the product takes the key
      # names it is given, as K8up, CloudNativePG's Barman Cloud plugin and
      # mariadb-operator do, and the product's own fixed names where it takes
      # none, as KubeStash, which reads AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY, and Kasten, which reads aws_access_key_id and
      # aws_secret_access_key. A product that takes its key at install, as Velero
      # does through its own component, cannot honour a Secret named here, so
      # its realization refuses the key by name rather than ignoring it.
      credentials_secret:
        type: string
        description: "Name of an existing Secret holding the store's key pair, for a realization that names a Secret on its own backup resource: under ACCESS_KEY_ID and ACCESS_SECRET_KEY, or under the data keys the realization's description names where its product fixes them. Unset, such a realization names it after its own backup resource, <component>-<attachment> such as db-backup, or with the component's namespace before it, such as app-db-backup, where that resource sits in a namespace every Release shares. A realization whose product takes its key at install refuses it by name."
      # The IAM role AWS Backup assumes to back the datastore up. AWS Backup
      # takes the role every backup runs under from the selection naming what
      # it backs up, and no realization creates one: the role is one the
      # operator already runs, trusting backup.amazonaws.com and allowed to
      # back up the resource, as AWS's managed policy
      # AWSBackupServiceRolePolicyForBackup allows. The value is the role's
      # ARN, written in the Release and passed through as written: the build
      # looks nothing up and never checks that the role exists. Optional in the
      # schema, because only the AWS Backup realizations read it:
      # terraform/backup-aws-backup and cloudformation/backup-aws-backup refuse
      # an attachment that leaves it out, and every other realization refuses
      # an attachment carrying it, by name, since its product assumes no role
      # an attachment names.
      role_arn:
        type: string
        description: "ARN of an existing IAM role AWS Backup assumes to back up the datastore, such as arn:aws:iam::123456789012:role/backup, passed through as written. The AWS Backup realizations require it; every other realization refuses it by name."
      # Whether an Amazon RDS instance AWS Backup protects keeps its own
      # automated backups beside AWS Backup's. AWS Backup realizes an attachment
      # carrying infra.role_arn, and the RDS Recipes, which configure the
      # instance's own automated backups, read this option on that attachment
      # and on no other: unset or true, the instance keeps them exactly as with
      # no attachment, 7 days; false turns them off on that instance, as a
      # retention of zero, and AWS Backup's are then its only backups. Amazon
      # RDS replicates only from an instance keeping automated backups, so an
      # RDS Recipe provisioning read replicas refuses false while it does.
      #
      # No default, because a declared default is written into every
      # core/backup attachment, where the option means nothing, and the
      # assertion below could no longer tell a value an author wrote from one
      # filled in. That assertion refuses the option on any attachment carrying
      # no infra.role_arn, whichever realization binds it.
      keep_automated_backups:
        type: boolean
        description: "On an attachment AWS Backup realizes for an Amazon RDS instance, whether the instance keeps its own automated backups beside AWS Backup's: unset or true keeps them for 7 days, as an instance with no attachment does; false turns them off on that instance. An attachment setting no infra.role_arn halts on it by name."
      # Whether a restore can reach any moment of the retention window, from the
      # backups and a log of every change kept beside them, rather than only the
      # moment a backup was taken. There is no single default: the products
      # differ, so the option declares none, and a realization keeps its
      # product's own default where the option is left out, as each provider's
      # documentation states it:
      #   - Amazon RDS keeps point-in-time recovery for as long as it keeps
      #     automated backups, and Azure Database for PostgreSQL flexible server
      #     for every server. Neither can turn it off, so true is what they give
      #     and false halts by name.
      #   - Cloud SQL turns it on with a setting, on in this catalog's Recipes:
      #     it makes an instance highly available only with it on, and a MySQL
      #     instance takes read replicas only with binary logging, which is
      #     point-in-time recovery there. false turns it off, and halts by name
      #     beside high availability, or beside read replicas on MySQL.
      #   - AWS Backup keeps a continuous backup only where a rule asks for one,
      #     for 35 days at most. true asks for it, and the instance's own
      #     automated backups are then kept for as many days as AWS Backup's,
      #     so true halts above 35 days and beside
      #     infra.keep_automated_backups false. Left out or false, AWS Backup
      #     takes snapshots alone, and the instance keeps Amazon RDS's own
      #     point-in-time recovery for as long as it keeps its automated backups.
      #   - CloudNativePG, through the Barman Cloud plugin, archives the
      #     write-ahead log continuously beside its base backups: on, and false
      #     halts by name.
      #   - mariadb-operator's logical Backup, Velero, K8up, KubeStash and Kasten
      #     copy the data on a schedule and archive no log, so a restore returns
      #     to the moment of a backup: off, and true halts by name.
      # No schema default, because a declared default is written into every
      # attachment, where a realization could no longer tell a value an author
      # wrote from one filled in, and Amazon RDS and the flexible server could
      # only refuse a declared false.
      point_in_time_recovery:
        type: boolean
        description: "Whether a restore can reach any moment of the retention window rather than only the moment of a backup. Left out, each product keeps its own default, which its realization's description states: on with the backups on Amazon RDS, Azure Database for PostgreSQL flexible server, Cloud SQL and CloudNativePG; off on AWS Backup, which true turns on, and on mariadb-operator, Velero, K8up, KubeStash and Kasten. A realization refuses a value its product cannot keep, by name."
      # The user and the group a backup product's own jobs run as, for a
      # product that starts a job of its own for each backup and takes the job's
      # security context from the resource the attachment writes. K8up is one:
      # its image runs as user 65532, so a datastore whose files only its own
      # user or group can read may be backed up incompletely unless the jobs
      # run as a user, or in a group, that may read them. Each is a Kubernetes
      # user or group ID, written into the security context of the backup and
      # prune pods as runAsUser and runAsGroup. Optional, with no default:
      # unset, the jobs run as the product's image says, and nothing is
      # written. Every realization that writes no such security context
      # refuses both keys by name rather than ignoring them: a product backing
      # up with a process of its own installation or with a managed service
      # runs nothing an attachment can set a user for.
      run_as_user:
        type: integer
        min: 0
        description: "User ID the backup product's own backup and prune jobs run as, such as 999, for a realization that starts them from the resource it writes. Unset, the jobs run as the product's image says. A realization that writes no such security context refuses it by name."
      run_as_group:
        type: integer
        min: 0
        description: "Group ID the backup product's own backup and prune jobs run as, such as 999, for a realization that starts them from the resource it writes. Unset, the jobs run in the group the product's image gives them. A realization that writes no such security context refuses it by name."
      # A disk volume in the cluster to keep the backups on, in place of a
      # bucket. Some Kubernetes backup products can keep their backups there:
      # mariadb-operator on a claim its Backup provisions, K8up and KubeStash in
      # a repository on a claim they mount, Kasten through a file-store location
      # profile naming a claim. Each takes the volume as a persistent volume
      # claim, so the option carries what a claim is provisioned from: its size,
      # required, and the storage class, optional, the cluster's default class
      # where it is unset. Velero and CloudNativePG keep their backups only in a
      # bucket — a CloudNativePG volume snapshot is a snapshot of the database's
      # own disk, not a copy kept on another volume — and AWS Backup and the
      # managed services keep theirs in storage of their own, so each of those
      # realizations refuses the option by name.
      #
      # Where a backup goes is always written: the store connection sends it to
      # the bucket, volume to the volume, and schedule and retention_days keep
      # their meaning on either. An attachment carrying both halts by
      # the assertion below, whichever realization binds. One carrying neither
      # halts in each realization whose product writes to the store or the
      # volume the attachment names, naming both ways to fix it; a realization
      # keeping backups in storage of its own — AWS Backup's vault, a managed
      # service's automated backup — refuses both, and an attachment carrying
      # neither is its normal shape.
      #
      # A backup on a volume sits in the same cluster as the data it protects,
      # so it guards against a bad change or a deletion and not against losing
      # the cluster. The description says so, and the build gives no warning.
      volume:
        type: object
        description: "A disk volume in the cluster to keep the backups on, in place of the bucket the store connection points at, for a backup product that can keep them there; a realization whose product cannot refuses it by name. A backup goes to one destination, so setting it and wiring a store halts. A backup on a volume sits in the same cluster as the data it protects, so it guards against a bad change or deletion but not against losing the cluster."
        properties:
          size:
            type: string
            minLength: 1
            description: "Size of the volume, a Kubernetes quantity such as 50Gi. Required when volume is set."
          storage_class:
            type: string
            minLength: 1
            description: "Storage class the volume is provisioned from, such as standard. Unset, the cluster's default class."
        required: [size]
        additionalProperties: false
  # One backup goes to one destination whichever realization binds, so this is
  # a rule of the Feature rather than of one realization. It reads .uses.store,
  # which holds every store connection the component's core/backup attachments
  # wire, since a connection is keyed by the Feature's type: on a component with
  # two of them the store may be the other one's, and the message says so.
  #
  # infra.keep_automated_backups has a meaning only where AWS Backup protects
  # an Amazon RDS instance, and AWS Backup realizes exactly the attachments
  # carrying infra.role_arn: its realizations require the role and every other
  # realization refuses it. So the option halts on any attachment carrying no
  # role, here, once for every realization, rather than in each of them.
  assertions:
    one_destination: >-
      {{- if and (optional .infra "volume" dict) (optional (optional . "uses" dict) "store" dict) -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.volume while a store connection is wired among %q's core/backup attachments, and a backup goes to one destination: remove the store connection to keep the backups on the volume, or remove infra.volume to keep them in the bucket" .metadata.feature_instance .metadata.instance_id .metadata.instance_id) -}}
      {{- end -}}
    keep_automated_backups_only_with_aws_backup: >-
      {{- if and (hasKey .infra "keep_automated_backups") (not (trim (toString (optional .infra "role_arn" "")))) -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.keep_automated_backups, which says whether an Amazon RDS instance AWS Backup protects keeps its own automated backups, and the attachment sets no infra.role_arn, so AWS Backup does not realize it: remove infra.keep_automated_backups from the attachment, or set infra.role_arn and bind the attachment to AWS Backup in the Manifest" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
