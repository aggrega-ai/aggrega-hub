apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/token-budget
  version: 1.0.0
  description: >
    Declares a ceiling on how much a single request passing through an AI
    gateway may consume, which bounds both what one call costs and how long it
    can occupy the upstream. It bounds a request rather than a period, so it
    is a per-call guard and not a spending limit over time. No FeatureRecipe
    in the standard library implements this today, so a Release that attaches
    it halts the build naming the type rather than rendering anything: the
    control is declared here, and the realization that would honour it is not
    yet authored.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        maxTokensPerRequest: { type: integer, exclusiveMinimum: 0 }
      required: [maxTokensPerRequest]
