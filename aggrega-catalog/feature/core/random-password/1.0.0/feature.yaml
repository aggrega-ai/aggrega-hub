apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/random-password
  version: 1.0.0
  description: >
    A credential the target generates when it deploys, so no one authors it and
    no default ships for every reader of a catalog to know. The build cannot
    make the password: its output is identical for identical input and never
    carries a secret's value. So the FeatureRecipe renders a request instead —
    a generator resource naming the secret resource it fills — and the target
    draws the value at deploy time: a controller in a Kubernetes cluster, the
    random provider during a Terraform apply, Secrets Manager when a
    CloudFormation stack is created. The rendered output names the generator
    and the secret resource, and carries no value.

    It publishes the same locator core/referenced-secret publishes, the secret
    resource's name and the data key within it, so a consuming component
    references a generated credential exactly as it references one that already
    exists, and a slot selecting the credential family admits it. Where several
    components share one credential, attach core/random-password on one of them
    and core/referenced-secret, bound to k8s-existing-secret, on the others,
    with its origin set to the name this attachment publishes; pin that name
    with the name value so both attachments can be written from one parameter.
    Attaching core/random-password on each of them, or once at a scope that
    reaches them all, instead renders one request per component, and each
    request draws a different password.

    Realized on helm (through the External Secrets Operator, or through the
    kubernetes-secret-generator controller), on terraform and on
    cloudformation. The compose target has no generator, so a Release binding
    this Feature there halts for want of a realization; supply the credential
    with core/secret-value instead.
  labels:
    # Credential-family marker, the same one every other credential Feature
    # carries, so a slot selector matching the family admits this Feature as
    # their peer. The compiler reads the label as opaque metadata and admits the
    # attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      # No value on this Feature is sensitive, and that is deliberate: nothing
      # authored here is the credential. What handles the material is the slot
      # this Feature fills, which declares `sensitive: true` on the consuming
      # Component.
      key:
        type: string
        default: "value"
        required: true
        description: "The data key within the generated secret resource under which the password is written, and which a consumer reads."
      name:
        type: string
        description: "The name of the secret resource the generator fills, honoured exactly as written. Supplied where another attachment must reference the same credential — core/referenced-secret bound to k8s-existing-secret, with its origin set to this name — so one parameter can feed both. Left unset, the name is derived from the component carrying the attachment and the attachment's own name, as the other credential realizations derive theirs. On helm it names the Secret and must be a valid Kubernetes object name; on terraform it names the random_password resource, with a dot folded to an underscore; on cloudformation it is the Secrets Manager secret's name, and its words, capitalised, form the resource's logical ID."
      # The two generator settings every realization honours. The option set is
      # read off the generating products rather than invented ahead of them:
      # each of them takes a length, and each can leave punctuation out. Finer
      # character-class control (upper case, digits, a chosen symbol set) is
      # offered by some of them and not by all, so it is not declared here.
      length:
        type: integer
        default: 32
        min: 8
        max: 128
        description: "Length of the generated password, in characters."
      symbols:
        type: boolean
        default: false
        description: "Whether the generated password may contain punctuation. Off by default, because a password is often placed inside a connection string or URL, where a character such as @, / or : changes what the string means. Turned on, each realization uses its generator's own default punctuation set."
    infra:
      # The runtime prerequisite, declared rather than assumed. A generator
      # request rendered for a Kubernetes cluster is only filled once the
      # controller that reconciles it is running there; emitted into a cluster
      # that runs none, it fills nothing and every workload referencing the
      # secret fails to start. The compiler is ahead-of-time and cannot inspect
      # cluster state, so the prerequisite is an affirmation the Operator makes
      # in the Release rather than something the build can check for itself.
      control_plane_present:
        type: boolean
        default: false
        description: "Operator affirmation that the controller the bound FeatureRecipe hands its request to is running in the target cluster. The helm FeatureRecipes halt the build unless this is set true, so a generator request is never emitted into a cluster with nothing to fill it. The terraform and cloudformation FeatureRecipes need no controller, since the value is drawn by the apply or the stack itself, and do not read it."
    provides:
      # The referenceable-secret output contract, the same two keys
      # core/referenced-secret publishes, so a consumer reads a generated
      # credential through the path it already uses for an existing one. Every
      # FeatureRecipe implementing core/random-password MUST publish both keys
      # (the compiler halts otherwise).
      #
      # Neither published key is sensitive: a secret resource's name and the data
      # key within it are locators, rendered in the clear into the consumer's own
      # output, and the value itself never passes through the build.
      name:
        type: string
        description: "The generated secret resource's locator: the Kubernetes Secret name on helm, the attachment's own module call on terraform, a reference resolving to the Secrets Manager secret's ARN on cloudformation."
      key:
        type: string
        description: "The data key within the resource a consumer reads: the Kubernetes Secret data key on helm, the module output carrying the password on terraform, the JSON key within the secret string on cloudformation."
