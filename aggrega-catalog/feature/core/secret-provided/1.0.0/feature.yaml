apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/secret-provided
  version: 1.0.0
  description: >
    A secret value the developer delivers explicitly. Unlike core/secret-value
    (which the FeatureRecipe injects directly into the component pipe), this
    credential exposes its value as a `provides` key, so the developer dictates
    delivery with the attachment's own `inject:` block — the third inject
    placement, allowed only on a transparent featuresSchema slot. The
    feature.aggrega.ai/kind: secret label names what it produces; it is attached
    on the features: pillar like any other Feature.

    origin is written by the developer in values or by the operator in infra,
    exactly one of the two on each attachment; the build halts naming the
    attachment when both or neither carry it. Only an attachment the Aggregate
    declares can carry the inject: block that delivers the value, so on a
    connection, or on an attachment the Release alone makes, no inject block
    delivers it: use core/referenced-secret or core/secret-value there.
  labels:
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # The value is written in exactly one pillar per attachment. Neither pillar's
  # schema can require it, because each pillar is validated on its own and
  # neither sees the other, so the rule is held here, where both are in view.
  # Presence decides, not content: an origin written as an empty string is
  # written.
  assertions:
    origin_in_exactly_one_pillar: >-
      {{- $inValues := hasKey .values "origin" -}}
      {{- $inInfra := hasKey .infra "origin" -}}
      {{- if and $inValues $inInfra -}}
      {{- fail (printf "core/secret-provided attachment %q on %q sets origin in both values and infra, so it does not say which value it publishes; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else if not (or $inValues $inInfra) -}}
      {{- fail (printf "core/secret-provided attachment %q on %q sets origin in neither values nor infra, so it publishes nothing; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    values:
      # The developer's form, authored on the attachment in the Aggregate.
      # Optional on its own: the assertion above requires it here or in
      # infra.origin, never in both.
      origin:
        type: string
        sensitive: true
        description: >
          The secret value, written by the developer and exposed to the
          attachment as the `value` provides key. Every realization the
          standard library ships publishes it unchanged, for the attachment's
          inject block to deliver. Write it here or in infra.origin, never in
          both.
    infra:
      # The operator's form of the same value, authored in the Release as the
      # sizing of an attachment the Aggregate declares. Delivery is still the
      # attachment's own inject: block, which only the Aggregate writes: a
      # connection's attachment carries none, and neither does an attachment the
      # Release alone makes, so the value either one publishes has no inject
      # block to deliver it.
      origin:
        type: string
        sensitive: true
        description: >
          The secret value, written by the operator in the Release. Published
          exactly as values.origin is, for the inject block the Aggregate wrote
          on the attachment to deliver. Write it here or in values.origin, never
          in both.
    provides:
      # The output contract every FeatureRecipe implementing
      # core/secret-provided publishes. It is the secret material itself, not a
      # locator, so it carries the sensitivity declaration: an inject key whose
      # `from:` names it is delivering secret material.
      value:
        type: string
        sensitive: true
        description: >
          The secret material, exposed for the attachment's inject block to
          route to a delivery target on the consuming component.
