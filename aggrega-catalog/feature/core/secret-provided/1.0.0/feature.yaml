apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/secret-provided
  version: 1.0.0
  description: >
    A secret value the developer delivers explicitly. Unlike core/secret-value
    (which the FeatureRecipe injects directly into the component pipe), this
    credential exposes its value as a `provides` key, so the developer dictates
    delivery with a secret.inject block on the attachment — the third inject
    placement, allowed only on a transparent secretsSchema slot. Labeled
    feature.aggrega.ai/kind: secret, so it lives in the secrets: pillar.
  labels:
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      source:
        type: string
        required: true
        description: >
          The secret value, exposed to the attachment as the `value` provides
          key. Inline for local development; a production FeatureRecipe sources
          it from a secret store instead.
