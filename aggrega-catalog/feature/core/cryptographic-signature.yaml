apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/cryptographic-signature
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "cryptographic_signature"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-agent"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        algorithm: { type: string, enum: [Ed25519, RSA-PSS, ECDSA], default: Ed25519 }
      required: [algorithm]
