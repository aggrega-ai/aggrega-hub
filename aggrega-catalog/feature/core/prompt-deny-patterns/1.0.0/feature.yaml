apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/prompt-deny-patterns
  version: 1.0.0
  description: >
    Refuses a model request whose text matches one of the regular expressions
    the attachment lists, before the request reaches a model. It acts at the
    gateway hop: it attaches to a component standing in the request path that
    declares it can match the model payload it routes against a list of
    patterns (dataplane.aggrega.ai/prompt-guard: pattern-list), and that
    component turns a matching request away instead of forwarding it. The
    control is a literal match and is only as good as its list: it refuses
    text an expression matches, and it does not catch a paraphrase, the same
    request in another language, text disguised by an encoding, text split
    across messages, tool-call arguments, images or anything in the model's
    reply. A request that does not pass through the gateway is not seen at
    all. Attaching it therefore does not establish that a payload can be
    trusted and does not stop prompt injection; judging whether a request
    tries to override the instructions a model was given is a different
    control, declared as core/prompt-injection-shield. Which messages a
    gateway reads, whether letter case counts, and what a refused caller
    receives are the gateway's, and each realization states them for its own.
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "prompt_deny_patterns"
    routing.aggrega.ai/tier: "data"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Selects on the capability's value, not on its presence. Refusing a request
  # on an authored list needs a guard that matches the payload against a list;
  # a component whose guard works any other way has no reduced fidelity at
  # which this attachment still does its job, so it is refused before anything
  # renders, by a selector violation naming this Feature and the selector.
  appliesTo: "dataplane.aggrega.ai/prompt-guard=pattern-list"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        deny_patterns:
          type: array
          min: 1
          items:
            type: string
            min: 1
          description: "The regular expressions a request's text is matched against; a request any one of them matches is refused. Each is handed to the gateway exactly as written, in the expression syntax that gateway reads, and the build does not check that an expression is valid. At least one is required, and none may be empty, because an empty expression matches every request."
        allow_patterns:
          type: array
          items:
            type: string
            min: 1
          description: "Expressions a request must match at least one of to be forwarded at all, checked beside deny_patterns. Only a gateway whose pattern guard also admits by pattern can honour it; a realization for a gateway without such a list refuses an attachment that sets it, naming the capability the gateway declares, rather than forwarding requests the list would have turned away."
      required: [deny_patterns]
