apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/traffic-shadowing
  version: 1.0.0
  description: >
    Sends a copy of live requests to a second service and discards that
    service's answers, so a candidate — a new model version, a rewritten
    service — can be watched under real traffic while every caller is still
    answered by the destination it was sent to. It acts at the gateway hop: it
    attaches to a component standing in the request path that declares it can
    mirror a request (dataplane.aggrega.ai/request-mirroring, whichever
    value), and that component copies the requests it forwards to the Service
    the Release names. The component needs to be able to copy a matching
    request to a second destination and drop that destination's response;
    that is all the whole stream asks for, so the default attaches wherever the
    capability is declared. Copying only a share of the requests asks for
    more: a component declaring the sampled fidelity, which offers a settable
    share. A realization for a component that copies every request refuses a
    share below 100, naming the fidelity that component declares, rather than
    copying more traffic than was asked for.

    Every input is the operator's, so the operator attaches it in the Release,
    on the mirroring component's entry under that component's features, and
    writes in infra the Service the copies go to and the share copied.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Selects on the capability's presence, not on its value. Mirroring the whole
  # stream works on every component that mirrors at all; only a share below
  # 100 needs the sampled fidelity, and that is a setting on the attachment
  # rather than a different request. So the attachment is admitted wherever
  # mirroring is declared, and a realization for a component that cannot
  # sample refuses the share itself — a refusal that can name the share asked
  # for and the fidelity the component declares, where a selector naming the
  # value could say only that the component's labels did not satisfy it.
  appliesTo: "dataplane.aggrega.ai/request-mirroring"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # How much of the live traffic is copied is a sampling share decided per
      # environment, so it is the operator's, beside where the copies go.
      shadow_percent:
        type: integer
        min: 1
        max: 100
        default: 100
        description: "Share of the forwarded requests that are copied, as a percentage. The default copies every request, which every component able to mirror honours; a smaller share needs a component declaring the sampled fidelity, and a realization for a component that copies every request refuses it. A share of zero copies nothing, which is not attaching the Feature, so the least it takes is 1."
      # Where the copies go is a property of the cluster the Release lands in —
      # which Service runs the candidate, on which port — so it is operator
      # sizing. Neither key has a fallback that could be right, so neither
      # carries a default, and the assertion below halts until both are set.
      service_name:
        type: string
        description: "Name of the Service the copies are sent to, written as the mirroring component resolves it: a Service in that component's own namespace by its bare name, one in another namespace by a name qualified with that namespace."
      service_port:
        type: integer
        min: 1
        max: 65535
        description: "Port on that Service the copies are sent to. This is the port the Service publishes, not the port its container listens on."
  # Every mirroring component needs somewhere to send the copies, whichever
  # realization binds, so this is a rule of the Feature rather than of one
  # realization.
  assertions:
    copy_destination_named: >-
      {{- if or (not (optional .infra "service_name" "")) (not (optional .infra "service_port" 0)) -}}
      {{- fail "this core/traffic-shadowing attachment names no Service to send its copies to: set infra.service_name and infra.service_port on the attachment in the Release to the Service that should receive a copy of each request and the port it publishes" -}}
      {{- end -}}
