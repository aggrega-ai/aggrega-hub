apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/secret-value
  version: 1.0.0
  description: >
    A single secret value, delivered into the consuming component's inject
    pipe under a named key rather than held in a resource of its own.
    Provider-agnostic: the Manifest maps it to a FeatureRecipe per target,
    which delivers it as an environment or chart value on helm, an environment
    value in the Compose file, or a value a Terraform Recipe reads.
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      origin:
        type: string
        required: true
        sensitive: true
        description: "The origin of the secret value. Interpretation depends on the FeatureRecipe: env-secret, dotenv-secret and variable-secret deliver it verbatim — a literal, or a template expression such as \"{{ .parameters.db_root_pass }}\" that the Release fulfils — and on compose it may be a Compose variable reference such as ${DB_PASSWORD}, which Docker Compose substitutes when the stack starts."
      # `key` names a data key; it is deliberately NOT sensitive. A key name is a
      # locator for the material, not the material, and every FeatureRecipe
      # implementing this Feature renders it in the clear as the delivery key.
      key:
        type: string
        default: "value"
        required: true
        description: "The key within the origin for multi-key secrets. For single-value secrets, defaults to \"value\"."
