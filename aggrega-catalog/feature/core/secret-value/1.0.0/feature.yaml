apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/secret-value
  version: 1.0.0
  description: >
    A single secret value, delivered into the consuming component's inject
    pipe under a named key. Provider-agnostic: the Manifest maps it to a
    FeatureRecipe per target, which delivers it as an environment or chart
    value on helm (where k8s-secret-from-value also holds it in a Kubernetes
    Secret a Recipe can read by reference), an environment value in the
    Compose file, or a value a Terraform Recipe reads.

    origin is written by the developer in values or by the operator in infra,
    exactly one of the two on each attachment; the build halts naming the
    attachment when both or neither carry it.
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # The locator is written in exactly one pillar per attachment. Neither pillar's
  # schema can require it, because each pillar is validated on its own and
  # neither sees the other, so the rule is held here, where both are in view.
  # Presence decides, not content: an origin written as an empty string is
  # written.
  assertions:
    origin_in_exactly_one_pillar: >-
      {{- $inValues := hasKey .values "origin" -}}
      {{- $inInfra := hasKey .infra "origin" -}}
      {{- if and $inValues $inInfra -}}
      {{- fail (printf "core/secret-value attachment %q on %q sets origin in both values and infra, so it does not say which value it delivers; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else if not (or $inValues $inInfra) -}}
      {{- fail (printf "core/secret-value attachment %q on %q sets origin in neither values nor infra, so it delivers nothing; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    values:
      # The developer's form, authored on the attachment in the Aggregate.
      # Optional on its own: the assertion above requires it here or in
      # infra.origin, never in both.
      origin:
        type: string
        sensitive: true
        description: "The origin of the secret value, written by the developer. Interpretation depends on the FeatureRecipe: every standard-library realization delivers it verbatim — a literal, or a template expression such as \"{{ .parameters.db_root_pass }}\" that the Release fulfils — and on compose it may be a Compose variable reference such as ${DB_PASSWORD}, which Docker Compose substitutes when the stack starts; on helm, env-secret and k8s-secret-from-value refuse such a reference, since Kubernetes substitutes none. Write it here or in infra.origin, never in both."
      # `key` names a data key; it is deliberately NOT sensitive. A key name is a
      # locator for the material, not the material, and every FeatureRecipe
      # implementing this Feature renders it in the clear as the delivery key.
      key:
        type: string
        default: "value"
        required: true
        description: "The key within the origin for multi-key secrets. For single-value secrets, defaults to \"value\"."
    infra:
      # The operator's form of the same locator, authored in the Release: on an
      # attachment the Release makes, or as the sizing of one whose Aggregate
      # declaration names no value. Same shape and same sensitivity as
      # values.origin, and every realization delivers whichever of the two
      # carries it, verbatim — so on compose a Compose variable reference written
      # here reaches the file as written, while on helm env-secret and
      # k8s-secret-from-value refuse one. key stays a values leaf, so an
      # attachment the Release alone makes delivers under the key "value".
      origin:
        type: string
        sensitive: true
        description: "The origin of the secret value, written by the operator in the Release. Delivered exactly as values.origin is: a Compose variable reference such as ${DB_PASSWORD} reaches a Compose file as written, and env-secret and k8s-secret-from-value on helm refuse it. Write it here or in values.origin, never in both."
