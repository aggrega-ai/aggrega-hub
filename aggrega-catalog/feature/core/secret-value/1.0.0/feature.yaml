apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/secret-value
  version: 1.0.0
  description: >
    Abstract credential interface. Represents a single secret value
    that must be provisioned into the target infrastructure.
    Provider-agnostic: the Manifest maps this to the appropriate
    FeatureRecipe per target (K8s Secret, Compose .env, Terraform
    variable, CloudFormation parameter, vault integration, etc.).
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      origin:
        type: string
        required: true
        description: "The origin of the secret value. Interpretation depends on the FeatureRecipe: k8s-secret-from-parameter — the parameter expression (e.g., \"{{ .parameters.db_root_pass }}\"); compose-dotenv-secret — the .env variable name; eso-aws-fetcher — the AWS Secrets Manager path; vault-fetcher — the HashiCorp Vault path."
      key:
        type: string
        default: "value"
        required: true
        description: "The key within the origin for multi-key secrets. For single-value secrets, defaults to \"value\"."
