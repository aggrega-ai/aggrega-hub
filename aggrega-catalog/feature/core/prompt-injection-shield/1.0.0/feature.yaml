apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/prompt-injection-shield
  version: 1.0.0
  description: >
    Declares that requests reaching an AI gateway should be inspected for
    attempts to override the instructions a model was given, at one of two
    strictness settings — the stricter catching more, and, as any such filter
    does, also refusing more that was legitimate. No FeatureRecipe in the
    standard library implements this today, so a Release that attaches it
    halts the build naming the type rather than rendering anything: the
    control is declared here, and the realization that would honour it is not
    yet authored.
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "prompt_injection"
    routing.aggrega.ai/tier: "data"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        sensitivity: { type: string, enum: [standard, strict], default: standard }
      required: [sensitivity]
