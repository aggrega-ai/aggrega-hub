apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/prompt-injection-shield
  version: 1.0.0
  description: >
    Declares that the model requests a gateway forwards are checked for
    attempts to override the instructions a model was given, before the model
    is called, at one of two sensitivities: strict refuses more such attempts,
    and more legitimate requests with them. The check is a probabilistic
    classifier's verdict: it misses some attacks, reworded, encoded or
    respelled ones among them, refuses some legitimate requests, and is known
    to be evadable, so it is one control beside others. It does not judge the
    model's reply, tool-call arguments or images.

    A realization either sends the requests through a guard wired to the
    gateway's guard socket, which checks each one and forwards what it admits
    to the model, or turns on a check the gateway runs itself.
    core/gateway/litellm and core/gateway/nginx realize it with
    core/security/nemo-guardrails as the guard, each halting the build with no
    guard wired or unless the guard's threshold is the one the sensitivity
    names. core/gateway/azure-api-management realizes it as Azure's prompt
    shield, which is on or off, so it keeps standard alone. What each check
    reads, and what the gateway still serves, is stated on each realization.
    On a gateway with no realization, attaching it halts the build naming the
    type.
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "prompt_injection"
    routing.aggrega.ai/tier: "data"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Every gateway. All a guard realization needs of the component it is attached
  # to is that it forwards the model traffic it receives to an address it is
  # configured with, so that the address can be a guard's, and every component
  # of the gateway category does that; a gateway that runs such a check itself
  # needs no guard at all. No capability label says more that the shield
  # needs: dataplane.aggrega.ai/prompt-guard names a gateway that inspects the
  # payload itself against a list or a classifier of its configuration, which
  # the shield does not ask of it, and gateway.aggrega.ai/intelligence=semantic
  # names a product tier, which a gateway that never parses the request body
  # realizes the shield without. Which gateways realize it is answered one
  # product at a time, by the realizations: core/gateway/litellm and
  # core/gateway/nginx, whose Recipes render the one route the model traffic
  # takes, so a realization can send that route through the guard; and
  # core/gateway/azure-api-management, whose terraform Recipe renders the API's
  # policy, where Azure's own prompt shield is turned on. Most other gateways in
  # this catalog render neither — each keeps its routes in a store of its own,
  # takes them from the services behind it, or is a hosted service whose
  # check this catalog does not write — and has no realization; a Release
  # attaching the shield there halts at binding, naming the type. On
  # core/gateway/agentgateway, core/gateway/higress and
  # core/gateway/traefik-hub a realization halts every attachment instead,
  # naming why: each judges such an attempt only through a service it calls,
  # which its realization does not wire.
  appliesTo: "component.aggrega.ai/category=gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        # How readily the check refuses. A realization through a gateway's own
        # check refuses by name a value that check cannot keep. A guard
        # realization turns each value into the threshold of the guard it routes
        # through and halts the build when the guard wired to the gateway runs
        # another one: on core/gateway/litellm and
        # core/gateway/nginx, the threshold of core/security/nemo-guardrails, 0.5
        # for standard and 0.001 for strict. Those two numbers are measured for the
        # default classifier of core/security/trustyai-huggingface-detector, the
        # detector that guard calls, whose scores sit close to 0 or close to 1: at
        # standard it refuses plain attempts to override a model's instructions; at
        # strict it also refuses such an attempt respelled in leetspeak, and with it
        # some ordinary requests the classifier scores low but not near zero.
        sensitivity: { type: string, enum: [standard, strict], default: standard }
      required: [sensitivity]
