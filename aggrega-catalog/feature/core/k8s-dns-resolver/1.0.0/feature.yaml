apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/k8s-dns-resolver
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "network"
  description: >
    Caller-side cross-namespace host qualification for Kubernetes. When a
    consumer reaches a target deployed in a different namespace, the in-cluster
    DNS name it must dial is the target's bare service name qualified with the
    target's namespace (service.namespace). This feature, attached to the
    consumer, rewrites the consumer's own injected host to that qualified form —
    leaving the target's published host untouched, so the same target stays
    reachable by same-namespace callers under its bare name. The qualification
    is derived from the target's resolved placement, never hardcoded.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # No appliesTo gate: this is an addressing concern attached explicitly to the
  # consumer that needs a cross-namespace target qualified, not a partition over
  # a component-type. The single parameter identifies which injected variable
  # to rewrite; the target edge and its namespace are discovered from the
  # consumer's own connections.
  interoperability:
    conflictsWith: []
  schema:
    infra:
      target_var:
        type: string
        required: true
        description: >
          The injected environment variable carrying the target host to qualify
          (for example the variable a consumer injects from a database's host).
          The feature locates the connection that produced this variable and
          appends the target's namespace to it. Because environment-variable
          names are unique within a container, this variable unambiguously
          identifies the connection to rewrite.
