apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/compose-bridge
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "network"
spec:
  # No appliesTo gate. compose-bridge is a network-architecture concern that
  # operates at the boundary level (the FR's executionScope: boundary already
  # encodes "this runs once per boundary, not per component"). Per-component-
  # type filtering is meaningless for a boundary-scoped FR; cross-boundary
  # routing applies to anything that connects across compose network seams,
  # not to a specific component-type partition.
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        mappedPort:
          type: integer
          description: "The TCP port the bridge service listens on. Consumers reach the target via \"aggrega-gw:<mappedPort>\"."
        targetVar:
          type: string
          description: "The env-var name on the consumer that should be rewritten to \"aggrega-gw:<mappedPort>\". For example, \"DB_HOST\"."
      required: [mappedPort, targetVar]
