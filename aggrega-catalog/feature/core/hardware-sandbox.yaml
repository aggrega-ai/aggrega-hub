apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/hardware-sandbox
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "hardware_isolation"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo: "component.aggrega.ai/category=ai-tool"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        attestationRequired: { type: boolean, default: true }
      required: [attestationRequired]
