apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/shared-config
  version: 1.1.0
  description: >
    Settings shared by every component in a boundary, written once for the
    boundary rather than once per component. Its FeatureRecipe runs once per
    boundary (executionScope: boundary) and writes one object named for the
    boundary, such as a Kubernetes ConfigMap, carrying the boundary's
    settings. Every input is the operator's, who attaches it in the Release,
    on the boundary, so each boundary's object carries its own resolved
    values.

    infra.configuration_store_id names, by resource ID, an Azure App
    Configuration store the operator already runs, for a realization that
    writes the settings into it; every other realization of this version
    refuses it by name.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    infra:
      tier:
        type: string
        default: standard
        description: >
          Boundary tier label written into the boundary's shared settings, set
          per boundary by the operator in the Release.
      # The Azure App Configuration store the settings are written into, for a
      # realization that keeps them as key-values of a store rather than as an
      # object of its own. No realization creates the store: it is one the
      # operator already runs, which the boundary's components read their
      # settings from. The value is the store's resource ID, written in the
      # Release and passed through as written: the build looks nothing up and
      # never checks that the store exists. Optional in the schema, because
      # only a realization writing into such a store reads it, and such a
      # realization refuses an attachment that leaves it out. Every other
      # realization of this version refuses an attachment carrying it, by
      # name, since it writes into no store an attachment names. A realization
      # of core/shared-config 1.0.0 alone takes no attachment of this version:
      # a Manifest mapping this version to one halts at the mapping.
      configuration_store_id:
        type: string
        description: "Resource ID of an existing Azure App Configuration store the boundary's settings are written into, such as /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-rg/providers/Microsoft.AppConfiguration/configurationStores/example-store, passed through as written. A realization writing into such a store requires it; every other realization of this version refuses it by name."
