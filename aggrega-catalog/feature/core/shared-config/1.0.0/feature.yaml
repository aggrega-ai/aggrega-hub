apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/shared-config
  version: 1.0.0
  description: >
    A boundary-level shared-config feature. Its FeatureRecipe runs once per
    boundary (executionScope: boundary), emitting a ConfigMap of settings shared
    by every component in the boundary. The per-boundary tier is operator-set
    infra, so each boundary's ConfigMap carries its own resolved value.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    infra:
      tier:
        type: string
        default: standard
        description: >
          Boundary tier label written into the shared ConfigMap, set per boundary
          by the operator in the Release.
