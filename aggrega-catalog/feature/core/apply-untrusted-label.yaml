apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/apply-untrusted-label
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "label_propagation"
    routing.aggrega.ai/tier: "data"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        labelKey: { type: string }
      required: [labelKey]
