apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/data-masking
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "data_masking"
    routing.aggrega.ai/tier: "data"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        action: { type: string, enum: [redact, tokenize, hash], default: redact }
      required: [action]
