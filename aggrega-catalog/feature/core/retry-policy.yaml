apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/retry-policy
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        maxAttempts: { type: integer, min: 1 }
        backoff: { type: string, enum: [exponential, linear, none], default: exponential }
      required: [maxAttempts]
