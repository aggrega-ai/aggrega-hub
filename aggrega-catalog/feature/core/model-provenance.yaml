apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/model-provenance
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "provenance"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-model"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        provenanceRef: { type: string }
