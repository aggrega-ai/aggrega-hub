apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/response-validation
  version: 1.0.0
  description: >
    Declares that a model's reply passing through an AI gateway should be
    checked against a named schema before it reaches the caller, so an
    application expecting structured output is not left parsing whatever came
    back. No FeatureRecipe in the standard library implements this today, so a
    Release that attaches it halts the build naming the type rather than
    rendering anything: the control is declared here, and the realization that
    would honour it is not yet authored.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "data_plane_guardrail"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        schema_ref: { type: string }
