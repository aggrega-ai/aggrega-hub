apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/data-masking
  version: 1.0.0
  description: >
    Declares that content passing through an AI gateway should have sensitive
    material removed before it travels further, and in which of three ways:
    replaced outright, substituted for a stand-in that can be turned back, or
    reduced to a digest. They differ in what survives the treatment — nothing,
    something recoverable, or something that can only be compared — which is
    the choice an Aggregate makes when it picks one. No FeatureRecipe in the
    standard library implements this today, so a Release that attaches it
    halts the build naming the type rather than rendering anything: the
    control is declared here, and the realization that would honour it is not
    yet authored.
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "data_masking"
    routing.aggrega.ai/tier: "data"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        action: { type: string, enum: [redact, tokenize, hash], default: redact }
      required: [action]
