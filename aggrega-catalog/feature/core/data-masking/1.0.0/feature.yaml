apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/data-masking
  version: 1.0.0
  description: >
    Replaces sensitive text in the chat and completion traffic an AI gateway
    routes with a placeholder, so the original does not travel past the
    gateway. It attaches to a gateway that declares it can mask that payload
    (dataplane.aggrega.ai/content-masking, whichever value) and acts on the
    text the traffic carries — the messages' text and, where its realization
    reaches them, the arguments of tool calls, the results of earlier ones,
    the other text a request carries beside its messages, such as a system
    prompt, and the parts a model or its provider adds to a reply beside its
    text, such as a refusal, citations or a web search's results — on requests
    before they reach the model provider, on replies before they reach the
    caller, or both, as scope says. While replies are masked, a failed call to
    the model reaches the caller without the message the provider returned with
    the error, which can quote text from the request or from the reply. What is
    masked is what the attachment lists — regular expressions under patterns,
    and entity types under entities, which a recognizer service the gateway
    calls detects — and an attachment listing neither halts the build, because
    no list is assumed on its behalf. With action redact a match is replaced
    for good. With action restore it is replaced by a numbered stand-in that
    the gateway maps back to the original in its reply, so the model provider
    receives the stand-in and the caller still gets the value back; the mapping
    lives only for that request, and only entities a recognizer detected can be
    restored. A realization whose gateway cannot map every stand-in back to its
    own original refuses restore at build time rather than risk handing a
    caller one person's value where another's was written: the one for
    core/gateway/litellm refuses it, because that gateway numbers its
    stand-ins afresh in every text it masks, so two names in one request can
    share one. Masking replaces what it finds and refuses no request for the
    sensitive text it finds in it, and it is not sufficient on its own. A
    realization does refuse, before it is forwarded, a request its gateway
    cannot mask: a kind of request, a field, a part of the conversation or a
    kind of tool its masking does not reach, and, while replies are masked, a
    streamed request of a kind whose streamed reply it cannot mask, or an option
    asking for output its reply masking does not read, such as token
    probabilities or spoken audio. While requests are masked, content that is
    not text — an image, a file, a document given as data or by address, or
    audio — is such a part, because masking cannot see into it, unless
    allow_non_text_content lets it through unmasked. The definitions of tools, a
    response format and stop sequences are the developer's own and pass as
    sent, and so does the reasoning of an earlier turn that a client sends back.
    The Feature does not reach a component alongside core/semantic-caching: a
    response cache keys a request after it is masked, so two callers' requests
    differing only in what masking replaced would share one cached reply, and
    the cache would keep the provider's unmasked reply.
    Text no listed pattern matches and no recognizer detects passes unchanged;
    the gateway itself, and any recognizer it calls, handle the unmasked text;
    masking replies does not change what the provider already received; and
    traffic that does not pass through the gateway is not touched. A
    realization never passes text on unmasked because a recognizer it depends
    on cannot be reached: it fails the request, or refuses at build time a
    combination its gateway cannot hold to that. Entities are found over the
    whole reply, so while an attachment masks entities in replies a request
    asking for a streamed reply is refused before it is forwarded; with
    allow_streamed_replies set, a gateway whose realization can hold the whole
    reply masks it and sends it in one piece at the end instead, and the
    caller receives it all at once rather than as it is produced. A reasoning
    model's reply can carry the reasoning behind its answer beside the message
    text. While replies are masked and mask_reasoning is on, as it is by
    default, a realization masks that reasoning text with the listed patterns
    and entities as it masks the message text, and a realization whose gateway
    cannot reach reasoning text with some of them refuses the attachment at
    build time until mask_reasoning is turned off. Turned off, the reasoning
    text reaches the caller unmasked; that is for clients that send a reply's
    reasoning back on a later turn, because some providers sign the reasoning
    they return and refuse it when it comes back changed. Each realization
    refuses an entity type its recognizer does not know rather than masking
    nothing for it, and states which scopes it honours for entities, what its
    gateway leaves unmasked, and what it keeps out of the gateway's own logs.
  annotations:
    security.aggrega.ai/class: "data_plane_guardrail"
    security.aggrega.ai/guardrail: "data_masking"
    routing.aggrega.ai/tier: "data"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Selects on the capability's presence, not on its value. Masking listed
  # patterns works on every gateway able to mask at all; recognizing entity
  # types and restoring originals ask for more, and a realization for a
  # gateway that cannot do either refuses the value itself, naming the
  # fidelity the gateway declares.
  appliesTo: "dataplane.aggrega.ai/content-masking"
  # A response cache keys a request after masking, so two requests differing
  # only in what masking replaces become one entry and a caller is served the
  # reply to another caller's request; and the cache keeps the provider's
  # unmasked reply. So the two do not meet on one component.
  interoperability:
    conflictsWith: [core/semantic-caching]
  # No list is assumed when none is given. A default set would decide on the
  # reader's behalf what counts as sensitive in their traffic, and an
  # attachment that masks nothing would read as protection it does not give.
  assertions:
    names_what_it_masks: >-
      {{- if not (or (optional .values "patterns" list) (optional .values "entities" list)) -}}
      {{- fail (printf "core/data-masking attachment %q on %q lists neither patterns nor entities, so it would mask nothing; list the regular expressions to mask under patterns, the entity types a recognizer detects under entities, or both" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        action:
          type: string
          enum: [redact, restore]
          default: redact
          description: "What a match is replaced with. redact replaces it for good. restore replaces it with a numbered stand-in the gateway maps back to the original in its reply to the caller; the mapping lives only for that request, only entity types a recognizer detected can be restored, and a restored reply reaches the caller unmasked. A realization whose gateway cannot map every stand-in back to its own original refuses restore at build time; the one for core/gateway/litellm does."
        scope:
          type: string
          enum: [request, response, both]
          default: request
          description: "Where masking applies. request masks a request before it reaches the model provider; response masks the reply before it reaches the caller, after the provider has already received the request unmasked; both does the two. Entities are found over the whole reply, so while entities are masked in replies a request asking for a streamed reply is refused unless infra.allow_streamed_replies is set."
        patterns:
          type: array
          description: "Regular expressions whose matches are masked. Each carries a name, which the placeholder shows in place of the matched text, and the expression itself, handed to the gateway exactly as written in the expression syntax that gateway reads. An expression matches what it literally describes and nothing else: another format, other spacing or another spelling of the same value passes unmasked."
          items:
            type: object
            properties:
              name:
                type: string
                min: 1
                description: "The name the placeholder shows in place of a match."
              regex:
                type: string
                min: 1
                description: "The regular expression whose matches are masked."
            required: [name, regex]
        entities:
          type: array
          description: "Entity types a recognizer service detects and the gateway masks, written in that recognizer's own vocabulary, for example PERSON or EMAIL_ADDRESS. Recognition is statistical: it can miss an entity and can mask text that is not one. Listing any needs the gateway to be wired to a recognizer, which each realization names, and a realization refuses a type its recognizer does not know."
          items:
            type: string
            min: 1
      required: [action]
    infra:
      # Whether callers may stream a reply whose entities are masked is decided
      # where the Release lands, beside the traffic it serves, so it is operator
      # sizing, and it stays off until a Release turns it on.
      allow_streamed_replies:
        type: boolean
        default: false
        description: "Whether a request may ask for a streamed reply while this attachment masks entities in replies, with entities listed and scope response or both. Off, such a request is refused before it is forwarded, and the caller asks for the reply in one piece. On, the gateway holds the whole streamed reply, masks it and sends it in one piece at the end, so the caller receives it all at once rather than as it is produced, and receives an error and none of the reply when masking it fails. It has no effect on patterns, or on an attachment that masks entities in requests only, and a realization still refuses a streamed request of a kind whose streamed reply its gateway cannot hold that way. A realization whose gateway cannot hold a streamed reply that way at all refuses the setting."
      # Whether images, files and audio may reach the model provider beside
      # masking is decided where the Release lands, beside the clients that send
      # them, and it stays off until a Release turns it on.
      allow_non_text_content:
        type: boolean
        default: false
        description: "Whether a request may carry content that is not text while this attachment masks requests, with scope request or both: an image, a file, a document given as data or by address rather than as text, or audio. Masking reads text and cannot see into such content, and an address in it is not masked either. Off, a request carrying any of it is refused before it is forwarded, with an error naming what to remove. On, it reaches the model provider exactly as the caller sent it, unmasked, and the text around it is masked as usual. It has no effect on an attachment that masks replies only."
      # Whether a reasoning model's reasoning text is masked is decided where the
      # Release lands, beside the clients that read it, and it is on until a
      # Release turns it off.
      mask_reasoning:
        type: boolean
        default: true
        description: "Whether a reply's reasoning text is masked as well as its message text, wherever this attachment masks replies. A reasoning model can return the reasoning behind its answer in fields of its own, and one reply can carry several copies of it. On, the default, the realization masks it with the listed patterns and entities as it masks the message text, in each field its own description names, and a realization whose gateway cannot reach reasoning text with some of the listed patterns or entities refuses the attachment at build time until this is turned off. Off, the reasoning text reaches the caller exactly as the provider sent it, unmasked. Some providers sign the reasoning they return, and refuse a signed block that comes back changed on a later turn of a conversation, so a client that must send such blocks back needs this off. It has no effect on an attachment that masks requests only."
