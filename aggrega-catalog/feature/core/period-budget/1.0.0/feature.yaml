apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/period-budget
  version: 1.0.0
  description: >
    Bounds what the traffic through an AI gateway may consume over a period.
    Once what the gateway has counted over period exceeds limit, it refuses
    further model requests until the count falls back under the limit. unit
    names what is counted, a cost in US dollars or tokens, and scope names
    whose traffic one limit covers: everything the gateway serves, each caller
    apart, or each model apart.

    The developer attaches it in the Aggregate, writing unit and scope in
    values; the operator sizes that attachment in the Release, writing limit
    and period in infra under the same attachment name on the Release's entry
    for the component.

    It attaches to a component in the request path that declares it can keep
    such a budget (dataplane.aggrega.ai/period-budget, whichever value). Each
    realization says how its gateway counts a period, and refuses a unit, a
    scope or a period its gateway cannot keep, naming the value asked for and
    what the gateway offers, rather than accepting it and counting something
    else.

    Each realization writes the budget where its gateway reads one: into the
    gateway's own configuration, or as a resource the gateway's controller
    reconciles.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Selects on the capability's presence, not on its value. What a component
  # counts is its label's value, and what an attachment needs counted is its
  # unit; a selector can read the first and never the second. So the
  # attachment is admitted wherever a period budget is declared, and the
  # realization refuses a unit, a scope or a period its gateway cannot keep, in
  # a message naming both, which a selector naming a value could not do.
  appliesTo: "dataplane.aggrega.ai/period-budget"
  interoperability:
    conflictsWith: []
  schema:
    # The four inputs are the shape gateways keeping a budget over time share:
    # a limit, the length of time it covers, whose traffic it covers, and what
    # is counted. Each is required, because each changes what the limit means
    # and no default would be right for every gateway. What is counted and
    # whose traffic are part of what the application is, so they are the
    # developer's values; how much may be spent, and over how long, is decided
    # per environment, so the ceiling and its window are the operator's infra.
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        scope:
          type: string
          enum: [gateway, caller, model]
          description: "Whose traffic one limit covers. gateway: everything the gateway serves counts against one limit. caller: each caller the gateway tells apart has a limit of its own. model: each model the gateway serves has a limit of its own."
        unit:
          type: string
          enum: [usd, total_tokens, prompt_tokens, completion_tokens]
          description: "What is counted against limit. usd: what the traffic costs in US dollars, as the gateway prices it. total_tokens, prompt_tokens and completion_tokens: the tokens a model reports reading and writing, reading only, or writing only."
      required: [scope, unit]
    infra:
      limit:
        type: number
        exclusiveMinimum: 0
        required: true
        description: "How much the traffic may consume in one period, in the unit named by unit: US dollars for usd, a number of tokens otherwise. Once what the gateway has counted over the period exceeds it, model requests are refused."
      # A count and a unit, the spelling gateways taking a length of time as
      # text share; a gateway taking seconds reads the same length converted.
      # A month is a calendar month, so it is written in months rather than
      # as a number of days.
      period:
        type: string
        pattern: "^[1-9][0-9]*(s|m|h|d|mo)$"
        required: true
        description: "The length of time consumption is counted over: a whole number followed by s, m, h or d for seconds, minutes, hours or days, or by mo for calendar months, as in 30m, 1d, 7d or 1mo. Each realization says whether its gateway starts the count again when a period ends or counts a window that moves forward with time, and refuses a length it cannot keep."
