apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/semantic-routing
  version: 1.0.0
  description: >
    Declares which way an AI gateway should choose among several targets that
    can serve the same request: latency picks the target observed to answer
    quickest, and cost picks the target that is cheapest to call. It is the
    choice between targets rather than the routing itself: which targets are
    candidates comes from the gateway's own routing table, so a table that
    publishes each alias once leaves nothing to choose between. No
    FeatureRecipe in the standard library implements this today, so a Release
    that attaches it halts the build naming the type rather than rendering
    anything: the control is declared here, and the realization that would
    honour it is not yet authored.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        strategy: { type: string, enum: [latency, cost], default: latency }
      required: [strategy]
