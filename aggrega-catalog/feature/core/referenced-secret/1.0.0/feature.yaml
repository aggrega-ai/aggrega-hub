apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/referenced-secret
  version: 1.0.0
  description: >
    A credential held in a referenceable secret resource, whose identity it
    publishes for consumers to point at. The referenceable-secret member of the
    credential family: where core/secret-value delivers a value into the inject
    pipe, core/referenced-secret names a resource (a Kubernetes Secret, an AWS
    Secrets Manager secret, a Vault entry) — one the FeatureRecipe's output
    creates, or one that already exists — and exposes its locator via provides,
    so a consumer references it (e.g. a Kubernetes secretKeyRef) instead of
    re-deriving the name. Provider-neutral: the Manifest maps it per target.

    origin is written by the developer in values or by the operator in infra,
    exactly one of the two on each attachment; the build halts naming the
    attachment when both or neither carry it. So a Release can attach it to a
    connection it wires, or to a component, and name the secret itself.
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # The locator is written in exactly one pillar per attachment. Neither pillar's
  # schema can require it, because each pillar is validated on its own and
  # neither sees the other, so the rule is held here, where both are in view.
  # Presence decides, not content: an origin written as an empty string is
  # written.
  assertions:
    origin_in_exactly_one_pillar: >-
      {{- $inValues := hasKey .values "origin" -}}
      {{- $inInfra := hasKey .infra "origin" -}}
      {{- if and $inValues $inInfra -}}
      {{- fail (printf "core/referenced-secret attachment %q on %q sets origin in both values and infra, so it does not say which secret it names; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else if not (or $inValues $inInfra) -}}
      {{- fail (printf "core/referenced-secret attachment %q on %q sets origin in neither values nor infra, so it names no secret; write it in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    values:
      # The developer's form of the locator, authored on the attachment in the
      # Aggregate. Optional on its own: the assertion above requires it here or
      # in infra.origin, never in both.
      origin:
        type: string
        sensitive: true
        description: "The origin of the secret value, written by the developer. Interpretation depends on the FeatureRecipe (e.g. k8s-secret-from-parameter: the parameter expression). Write it here or in infra.origin, never in both."
      # `key` names a data key within the secret resource; it is deliberately
      # NOT sensitive. A data key is a locator for the material, not the material.
      key:
        type: string
        default: "value"
        required: true
        description: "The data key within the secret resource."
    infra:
      # The operator's form of the same locator, authored in the Release: on an
      # attachment the Release makes — on a connection it wires, or on a
      # component — or as the sizing of an attachment whose Aggregate declaration
      # names no secret. It has the shape and the sensitivity of values.origin,
      # and every realization reads whichever of the two carries it. key stays a
      # values leaf, so an attachment the Release alone makes reads the data key
      # "value".
      origin:
        type: string
        sensitive: true
        description: "The origin of the secret value, written by the operator in the Release. Read exactly as values.origin is. Write it here or in values.origin, never in both."
    provides:
      # The referenceable-secret output contract. Every FeatureRecipe implementing
      # core/referenced-secret MUST publish both keys (the compiler halts otherwise):
      # they are how a consumer references the secret resource without re-deriving
      # its name. Provider-neutral abstract keys — a K8s Secret name, an SM ARN, and
      # a Vault path are all `name`.
      #
      # Neither published key is sensitive, and that is deliberate rather than an
      # omission: a Kubernetes Secret's name and the data key within it are both
      # public, and both are rendered in the clear into the consumer's own manifest
      # as a secretKeyRef. What handles the material is the SLOT this Feature fills,
      # which declares `sensitive: true` on the consuming Component. Marking these
      # keys would state that a locator is secret material and would propagate that
      # error to every consumer of the axis.
      name:
        type: string
        description: "The secret resource's locator: the Kubernetes Secret name, AWS Secrets Manager ARN, Vault path, etc."
      key:
        type: string
        description: "The data key within the resource a consumer reads (e.g. a Kubernetes Secret data key)."
