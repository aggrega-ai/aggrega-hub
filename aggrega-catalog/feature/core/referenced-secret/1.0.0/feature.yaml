apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/referenced-secret
  version: 1.0.0
  description: >
    A credential that materializes as a referenceable secret resource and
    publishes that resource's identity for consumers to point at. The
    referenceable-secret member of the credential family: where core/secret-value
    delivers a value into the inject pipe, core/referenced-secret produces a
    resource (a Kubernetes Secret, an AWS Secrets Manager secret, a Vault entry)
    and exposes its locator via provides, so a consumer references it (e.g. a
    Kubernetes secretKeyRef) instead of re-deriving the name. Provider-neutral:
    the Manifest maps it to the appropriate FeatureRecipe per target.
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      origin:
        type: string
        required: true
        sensitive: true
        description: "The origin of the secret value. Interpretation depends on the FeatureRecipe (e.g. k8s-secret-from-parameter: the parameter expression)."
      # `key` names a data key within the produced resource; it is deliberately
      # NOT sensitive. A data key is a locator for the material, not the material.
      key:
        type: string
        default: "value"
        required: true
        description: "The data key within the produced secret resource."
    provides:
      # The referenceable-secret output contract. Every FeatureRecipe implementing
      # core/referenced-secret MUST publish both keys (the compiler halts otherwise):
      # they are how a consumer references the produced resource without re-deriving
      # its name. Provider-neutral abstract keys — a K8s Secret name, an SM ARN, and
      # a Vault path are all `name`.
      #
      # Neither published key is sensitive, and that is deliberate rather than an
      # omission: a Kubernetes Secret's name and the data key within it are both
      # public, and both are rendered in the clear into the consumer's own manifest
      # as a secretKeyRef. What handles the material is the SLOT this Feature fills,
      # which declares `sensitive: true` on the consuming Component. Marking these
      # keys would state that a locator is secret material and would propagate that
      # error to every consumer of the axis.
      name:
        type: string
        description: "The produced secret resource's locator: the Kubernetes Secret name, AWS Secrets Manager ARN, Vault path, etc."
      key:
        type: string
        description: "The data key within the produced resource a consumer reads (e.g. a Kubernetes Secret data key)."
