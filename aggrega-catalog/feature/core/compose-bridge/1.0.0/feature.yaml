apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/compose-bridge
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "network"
spec:
  # No appliesTo gate. compose-bridge is a network-architecture concern that
  # operates at the boundary level (the FR's executionScope: boundary already
  # encodes "this runs once per boundary, not per component"). Per-component-
  # type filtering is meaningless for a boundary-scoped FR; cross-boundary
  # routing applies to anything that connects across compose network seams,
  # not to a specific component-type partition.
  interoperability:
    conflictsWith: []
  schema:
    # The listen port and the rewritten consumer env var are DERIVED from the
    # boundary's cross-network uses edges (the target's own port; the env var
    # the consumer injects from the upstream host field) — not authored. Both
    # knobs below are optional.
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        portBase:
          type: integer
          default: 10000
          description: "Collision-fallback base port. When two bridged edges resolve to the same listen port, the colliding edge is reassigned to the next free port at or above portBase."
        providesField:
          type: string
          default: host
          description: "The target component's provides field used as the proxy upstream host (and the consumer inject `from:` whose env var is rewritten to the gateway). Defaults to \"host\"."
