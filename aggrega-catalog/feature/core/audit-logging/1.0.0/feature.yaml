apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/audit-logging
  version: 1.0.0
  description: >
    Keeps a record of what an AI gateway served. While attached to a gateway
    that routes on the model named in a request, the gateway keeps a record of
    each model request it served, naming the model that answered and the
    tokens the reply reports. Each realization states where the record lands.

    By default the record also says what each request cost and names the
    caller the gateway verified, and a gateway that cannot keep either
    refuses the attachment at build. require_cost and require_verified_caller
    relax that. With require_verified_caller off, the record names whatever
    caller a request claims to be, or none, so anyone sending a request can
    have it recorded against someone else. retention_days has the gateway
    delete a record once it is that old. With none, the gateway itself
    deletes no record, and how long the place a record lands holds it is
    that place's own.

    Every input is the operator's, so the operator attaches it in the Release,
    on the gateway's entry under that component's features, and sets any of
    the three there in infra.
  annotations:
    security.aggrega.ai/class: "observability"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # Whether a record must say what each request cost is decided where the
      # Release lands, beside what that environment's traffic is billed for,
      # so it is the operator's. It is on until a Release turns it off, so an
      # attachment written without it gets the record with the cost, and a
      # gateway that cannot price a request says so at build rather than
      # recording less in silence.
      require_cost:
        type: boolean
        default: true
        description: "Whether the record also says what each request cost, in a currency the realization names. On, the default, a realization whose gateway cannot price a request refuses the attachment at build time, naming this value. Off, the attachment accepts a record that carries no cost; a realization whose gateway prices its requests records the cost either way."
      # Whether a record must name a caller the gateway verified is decided
      # where the Release lands, beside the callers that environment serves,
      # so it is the operator's. It is on until a Release turns it off: a
      # record naming whoever a request claims to be lets any sender have a
      # request recorded against another caller, so the protection is the
      # default.
      require_verified_caller:
        type: boolean
        default: true
        description: "Whether the record names the caller the gateway verified for each request: a key the gateway issued or checked. On, the default, a realization whose gateway verifies no caller refuses the attachment at build time, naming this value. Off, the attachment accepts a record whose caller is whatever the request itself claims, or no caller at all: anyone sending a request can then have it recorded against another caller, so such a record does not show who sent a request. A realization whose gateway verifies its callers records the verified caller either way."
      # How long a request record is kept is a retention period the compliance
      # regime of each environment sets, so it is the operator's. Unset, the
      # gateway itself deletes no record. How long the place a record lands
      # holds it is that place's own setting, which each realization states,
      # so a gateway writing its records to a log it does not store honours an
      # attachment that asks for no retention.
      retention_days:
        type: integer
        min: 0
        description: "How many days the gateway keeps a record before it deletes it. A realization whose gateway keeps no record it can delete refuses the value by name. Unset, the gateway itself deletes no record; how long the place a record lands holds it is that place's own, which each realization states."
