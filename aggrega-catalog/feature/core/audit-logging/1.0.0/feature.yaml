apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/audit-logging
  version: 1.0.0
  description: >
    Keeps a record of what an AI gateway served. Attached to a gateway that
    routes on the model named in a request, it turns on that gateway's own
    request log — a row per request naming which model answered, what it cost
    and who it is billed to — and where a retention is given, how long such a
    row is kept before the gateway deletes it; with no retention asked for,
    the gateway deletes nothing. It brings no resource of its own: the setting
    is written into the routing configuration the gateway's Recipe already
    renders, so attaching it adds no file to the output. The rows land in the
    gateway's own bookkeeping database, so a gateway configured without one
    has nowhere to write them.

    Every input is the operator's, so the operator attaches it in the Release,
    on the gateway's entry under that component's features, and sets any
    retention there as retention_days in infra.

    Beside core/log-masking, the LiteLLM gateway's request log keeps answered
    requests only: failed and refused requests are counted in the gateway's
    daily request count but not recorded per key, model or caller.
  annotations:
    security.aggrega.ai/class: "observability"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # How long a request record is kept is a retention period the compliance
      # regime of each environment sets, so it is the operator's.
      retention_days: { type: integer, min: 0 }
