apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/human-approval-gate
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "human_approval"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-agent"
  interoperability:
    conflictsWith: []
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseFeatureParameter & {
      approverRoles?: [...string]
    }
