apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/retry-policy
  version: 1.0.0
  description: >
    Sets how many times an AI gateway may send a request before giving up.
    Attached to a gateway that routes on the model named in a request, it
    covers the transient failure — a refused connection, a rate limit, a
    timeout — that succeeds on being sent again, and the retries are the
    gateway's rather than the caller's, so a caller sees one answer whichever
    send produced it. The value is the total number of sends including the
    first, which is one more than the number of retries it buys. It brings no
    resource of its own: the setting is written into the routing configuration
    the gateway's Recipe already renders.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        max_attempts: { type: integer, min: 1 }
      required: [max_attempts]
