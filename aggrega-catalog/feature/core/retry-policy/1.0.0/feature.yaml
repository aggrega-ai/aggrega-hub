apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/retry-policy
  version: 1.0.0
  description: >
    Sets how many times an AI gateway may send a request before giving up.
    It is meant for the transient failure — a refused connection, a rate
    limit, a timeout — that succeeds on being sent again; which of those a
    gateway sends again is the gateway's own, and not every gateway sends all
    three again. The retries are the gateway's rather than the caller's, so a
    caller sees one answer whichever send produced it. The value is the total
    number of sends including the first, which is one more than the number of
    retries it buys. It brings no resource of its own: the gateway's Recipe
    writes the setting where the gateway reads one, into the routing
    configuration it already renders, a traffic policy the gateway's
    controller reconciles, or a hosted gateway's own configuration.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        max_attempts: { type: integer, min: 1 }
      required: [max_attempts]
