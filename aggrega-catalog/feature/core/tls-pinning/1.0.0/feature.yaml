apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/tls-pinning
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "tls_pinning"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        spkiHashes: { type: array, items: { type: string } }
