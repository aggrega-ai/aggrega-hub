apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/public-ingress
  version: 1.0.0
  description: >
    Publishes a server component at a hostname outside the deployment. Its
    FeatureRecipe (component-scope) emits one ingress resource per attached
    component, routing the host to the Service the component's own Recipe
    emits.

    The developer attaches it in the Aggregate and writes the request path in
    values, because which requests an application serves is part of what the
    application is. The operator sizes the same attachment on the Release's
    entry for the component, writing in infra the hostname, which is the
    environment's name for the component, and the cluster knobs, which
    describe the cluster the Release lands in rather than the application:
    which Service and named port to route to, the ingress class that
    reconciles the resource, and the certificate the host is served with over
    HTTPS (tls_secret).

    The Service defaults to the primary Service a synthesized workload emits,
    so a Release whose Recipe sources an upstream chart naming its Service
    otherwise sets service_name to that name. The certificate is referenced,
    never issued: the Secret already holds it — created by the operator, or
    written by a certificate controller such as the one
    core/security/cert-manager installs, once a Certificate resource in the
    cluster asks it to — and this Feature emits neither the Secret nor that
    request.
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "gateway"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "component.aggrega.ai/type=server"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        # What the application serves is the developer's, so the path prefix
        # the component answers under is written with the attachment in the
        # Aggregate. It is optional because the bound FeatureRecipe carries the
        # fallback for its own target, as it does for the routing knobs below.
        # A path that has to differ from one environment to the next is written
        # as a parameter of the Aggregate, which each Release fulfils.
        path:
          type: string
          description: "Request path prefix routed to the component."
    infra:
      # The hostname is the environment's name for the component: a staging and
      # a production Release publish the same component under different names,
      # so the operator writes it on the Release's entry for this attachment.
      host:
        type: string
        description: "Hostname the component answers on from outside the cluster."
      # The runtime prerequisite, declared rather than assumed. An Ingress only
      # becomes routing once an ingress controller is already running in the
      # target cluster; emitted into a cluster that runs none, it is an orphan
      # that routes nothing. The compiler is ahead-of-time and cannot inspect
      # cluster state, so the prerequisite is an affirmation the Operator makes
      # in the Release rather than something the build can check for itself.
      control_plane_present:
        type: boolean
        default: false
        description: "Operator affirmation that an ingress controller is running in the target cluster. The bound FeatureRecipe halts the build unless this is set true, so an Ingress is never emitted into a cluster with nothing to reconcile it into routing."
      # Operational routing configuration — optional overrides filled by the
      # Operator, who knows which Service the bound Recipe emits and which
      # ingress controller runs in the target cluster. Each routing knob below
      # is optional because the bound FeatureRecipe carries the fallback for its
      # own target: a named port, like the request path in values, describes
      # one target's routing model, not every target's, so the realization is
      # where those fallbacks belong and neither pillar states a default it
      # does not itself deliver. A Release that affirms the prerequisite and
      # supplies none of the routing knobs still renders working routing.
      service_name:
        type: string
        description: "Name of the Service traffic is routed to. Supplied where the bound Recipe sources an upstream chart that names its own Service; left unset, the routing targets the Service the attached component's own Recipe emits."
      service_port_name:
        type: string
        description: "Named port on that Service traffic is routed to."
      ingress_class_name:
        type: string
        description: "Ingress class that reconciles the emitted resource. Left unset, the field is omitted and the cluster's default ingress class claims it."
      # The certificate the ingress presents for the host. Which Secret, issued
      # by which issuer, differs per cluster and per environment, so it is
      # operator sizing like the routing knobs above. It carries no default,
      # because no Secret name could be right for every cluster.
      tls_secret:
        type: string
        description: "Name of an existing Secret of type kubernetes.io/tls, in the namespace the Ingress lands in, holding the certificate and private key the ingress presents for host. Set, the Ingress carries a TLS section naming host and this Secret, so the ingress controller serves host over HTTPS with that certificate. Left unset, the Ingress carries no TLS section and serves host over plain HTTP. The Secret is referenced and never created here: it is the operator's, or a certificate controller's, to provide."
