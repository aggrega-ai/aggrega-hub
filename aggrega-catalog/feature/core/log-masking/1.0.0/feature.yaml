apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/log-masking
  version: 1.0.0
  description: >
    Keeps sensitive text out of what a gateway writes to its logs, while the
    request it forwards and the reply it returns stay exactly as they were
    sent. It attaches to a gateway declaring dataplane.aggrega.ai/log-masking
    and masks what the attachment lists in the copy of each call the gateway
    hands to its logs: regular expressions under patterns and, under
    entities, entity types a recognizer service detects. It serves the
    readers and stores of those logs, such as the gateway's request and spend
    records and the logging and observability backends it exports to.

    List what to mask; an attachment listing neither halts the build,
    because no list is assumed. It is an alternative to core/data-masking,
    not an addition to it: data masking hides the text from the model and
    turns the gateway's logging of messages off, so the two do not share a
    component, and attaching both to one halts the build.

    It keeps the text from no one else: the model provider, or whatever the
    gateway forwards to, receives everything unmasked; the gateway and any
    recognizer it calls see the original; only the logs its realization
    writes through are covered, not a debug log and not a provider's own
    logs; a logging integration added beside the gateway can still receive a
    provider's own error message for a failed call; and text no pattern
    matches and no recognizer detects is logged as sent. Each realization's
    FeatureRecipe names the logs it covers, how it treats a failed call, and
    what it leaves unmasked.
  annotations:
    # What the Feature acts on is what the gateway records, never what travels
    # through it, so it is classed with the Features that shape a gateway's
    # records rather than with the guardrails that change its traffic.
    security.aggrega.ai/class: "observability"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Selects on the capability's presence, not on its value: masking listed
  # patterns in a gateway's logs works on every gateway able to mask its logs
  # at all; recognizing entity types asks for more, and a realization for a
  # gateway that recognizes none refuses entities itself, naming the fidelity
  # the gateway declares.
  appliesTo: "dataplane.aggrega.ai/log-masking"
  # Data masking hides the text from the model and turns the gateway's logging
  # of message contents off while it is attached, so beside it this Feature
  # has nothing to act on, and a reader could take the two for one protection.
  # So they do not meet on one component; core/data-masking declares the same
  # relation.
  interoperability:
    conflictsWith: [core/data-masking]
  # No list is assumed when none is given, as for core/data-masking: a default
  # set would decide on the reader's behalf what counts as sensitive in their
  # logs, and an attachment that masks nothing would read as protection it
  # does not give.
  assertions:
    names_what_it_masks: >-
      {{- if not (or (optional .values "patterns" list) (optional .values "entities" list)) -}}
      {{- fail (printf "core/log-masking attachment %q on %q lists neither patterns nor entities, so it would mask nothing in the gateway's logs; list the regular expressions to mask under patterns, the entity types a recognizer detects under entities, or both" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    # patterns and entities are declared once, for this Feature and for
    # core/data-masking, in the TextMaskingSchemas library, so a pattern or an
    # entity type means the same thing on both. There is nothing else to set:
    # a logged copy is masked for good, and every copy the realization reaches
    # is masked.
    values:
      $ref: "TextMaskingSchemas#/schemas/MaskedTextParameter"
