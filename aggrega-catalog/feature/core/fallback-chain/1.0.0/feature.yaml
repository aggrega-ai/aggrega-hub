apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/fallback-chain
  version: 1.0.0
  description: >
    Bounds how far an AI gateway keeps trying after a target fails. Attached
    to a gateway that routes on the model named in a request, it sets how many
    further targets may be tried before the failure is returned to the caller,
    so a request aimed at a provider having a bad minute can be answered by
    the next target instead of failing outright. It bounds the walk rather
    than defining it: which targets the chain visits comes from the routing
    table the gateway serves, so a table publishing one alias once has nothing
    to fall back to and this bound changes no answer. It brings no resource of
    its own: the setting is written into the routing configuration the
    gateway's Recipe already renders.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        max_hops: { type: integer, min: 1 }
      required: [max_hops]
