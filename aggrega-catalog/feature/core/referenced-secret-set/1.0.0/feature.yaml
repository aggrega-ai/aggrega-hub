apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/referenced-secret-set
  version: 1.0.0
  description: >
    A credential that materializes a single multi-key secret resource and
    publishes that resource's identity for consumers to point at. The
    multi-key member of the referenceable-secret family: where
    core/referenced-secret produces a resource around one caller-named data
    key and publishes both the resource locator and that key, this Feature
    carries a caller-supplied set of data keys in one resource and publishes
    the locator only. The consumer already knows the fixed key names its
    target reads (a Helm chart that expects a Secret with several named keys),
    so it references the resource by name and lets its target read the keys it
    already knows. Provider-neutral: the Manifest maps it to the appropriate
    FeatureRecipe per target.

    entries is written by the developer in values or by the operator in infra,
    exactly one of the two on each attachment; the build halts naming the
    attachment when both or neither carry it.
  labels:
    # Sensitivity marker. Declares the material this Feature handles as
    # sensitive, so a Recipe or a policy plugin can route it accordingly. It
    # does not restrict where the Feature may be attached: the compiler reads
    # this label as opaque metadata and admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # The entries are written in exactly one pillar per attachment. Neither
  # pillar's schema can require them, because each pillar is validated on its own
  # and neither sees the other, so the rule is held here, where both are in view.
  # Presence decides, not content: an empty list written is written.
  assertions:
    entries_in_exactly_one_pillar: >-
      {{- $inValues := hasKey .values "entries" -}}
      {{- $inInfra := hasKey .infra "entries" -}}
      {{- if and $inValues $inInfra -}}
      {{- fail (printf "core/referenced-secret-set attachment %q on %q sets entries in both values and infra, so it does not say which data keys the resource carries; write them in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- else if not (or $inValues $inInfra) -}}
      {{- fail (printf "core/referenced-secret-set attachment %q on %q sets entries in neither values nor infra, so the resource would carry no data key; write them in exactly one: values in the Aggregate, or infra in the Release" .metadata.feature_instance .metadata.instance_id) -}}
      {{- end -}}
  schema:
    values:
      # The marker sits on `entries` rather than on the nested `value` because a
      # declaration is read on the node it sits on and the read descends only
      # through property maps, never into an array's element type — so a marker on
      # `value` would be authored where nothing reads it. `entries` itself carries
      # secret material (each item's `value` becomes a data value in the produced
      # resource), so the marker is true where it sits.
      #
      # The developer's form, authored on the attachment in the Aggregate.
      # Optional on its own: the assertion above requires it here or in
      # infra.entries, never in both.
      entries:
        type: array
        sensitive: true
        description: "The data keys carried by the produced secret resource, written by the developer. Each item names one data key and its value. The caller supplies the fixed key names its consuming target reads (nothing is hardcoded per resource); the produced resource carries exactly these keys. Write it here or in infra.entries, never in both."
        items:
          type: object
          properties:
            key:
              type: string
              description: "The data key within the produced secret resource."
            value:
              type: string
              description: "The value stored under this data key."
          required: [key, value]
    infra:
      # The operator's form of the same entries, authored in the Release: on an
      # attachment the Release makes, or as the sizing of one whose Aggregate
      # declaration carries none. Same shape and same sensitivity as
      # values.entries, and every realization reads whichever of the two carries
      # them.
      entries:
        type: array
        sensitive: true
        description: "The data keys carried by the produced secret resource, written by the operator in the Release. Read exactly as values.entries is. Write it here or in values.entries, never in both."
        items:
          type: object
          properties:
            key:
              type: string
              description: "The data key within the produced secret resource."
            value:
              type: string
              description: "The value stored under this data key."
          required: [key, value]
    provides:
      # The multi-key referenceable-secret output contract. Every FeatureRecipe
      # implementing core/referenced-secret-set MUST publish this key (the
      # compiler halts otherwise): it is how a consumer references the produced
      # resource without re-deriving its name. Unlike core/referenced-secret,
      # no `key` is published — a multi-key resource carries several keys the
      # consumer already knows, so only the resource locator is exposed.
      # Provider-neutral abstract locator — a K8s Secret name, an SM ARN, and a
      # Vault path are all `name`. It is deliberately not sensitive: a locator is
      # not the material, and it is rendered in the clear into every consumer that
      # references the resource. The slot this Feature fills carries the
      # sensitivity declaration instead.
      name:
        type: string
        description: "The produced secret resource's locator: the Kubernetes Secret name, AWS Secrets Manager ARN, Vault path, etc."
