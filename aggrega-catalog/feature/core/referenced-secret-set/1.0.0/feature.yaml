apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/referenced-secret-set
  version: 1.0.0
  description: >
    A credential that materializes a single multi-key secret resource and
    publishes that resource's identity for consumers to point at. The
    multi-key member of the referenceable-secret family: where
    core/referenced-secret produces a resource around one caller-named data
    key and publishes both the resource locator and that key, this Feature
    carries a caller-supplied set of data keys in one resource and publishes
    the locator only. The consumer already knows the fixed key names its
    target reads (a Helm chart that expects a Secret with several named keys),
    so it references the resource by name and lets its target read the keys it
    already knows. Provider-neutral: the Manifest maps it to the appropriate
    FeatureRecipe per target.
  labels:
    # Credential partition label. The compiler enforces this Feature may only
    # appear in `secrets:` blocks, never in `features:`.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    values:
      entries:
        type: array
        required: true
        description: "The data keys carried by the produced secret resource. Each item names one data key and its value. The caller supplies the fixed key names its consuming target reads (nothing is hardcoded per resource); the produced resource carries exactly these keys."
        items:
          type: object
          properties:
            key:
              type: string
              description: "The data key within the produced secret resource."
            value:
              type: string
              description: "The value stored under this data key."
          required: [key, value]
    provides:
      # The multi-key referenceable-secret output contract. Every FeatureRecipe
      # implementing core/referenced-secret-set MUST publish this key (the
      # compiler halts otherwise): it is how a consumer references the produced
      # resource without re-deriving its name. Unlike core/referenced-secret,
      # no `key` is published — a multi-key resource carries several keys the
      # consumer already knows, so only the resource locator is exposed.
      # Provider-neutral abstract locator — a K8s Secret name, an SM ARN, and a
      # Vault path are all `name`.
      name:
        type: string
        description: "The produced secret resource's locator: the Kubernetes Secret name, AWS Secrets Manager ARN, Vault path, etc."
