apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/prometheus-exporter
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "none"
spec:
  appliesTo:
    component.aggrega.ai/type: "server"
  interoperability:
    conflictsWith: []
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseFeatureParameter & {
      scrapePath?: *"/metrics" | string
    }
