apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/gcp-workload-identity
  version: 1.0.0
  description: >
    Binds a workload to a Google Cloud service account through GKE Workload
    Identity. Its FeatureRecipe emits one Kubernetes ServiceAccount annotated
    with the Google service-account email; the pod runs under that ServiceAccount
    and impersonates the Google service account at runtime, so no static key
    material is stored. The Google service-account email and the ServiceAccount
    name are operator sizing (infra) — cloud identity is operational
    configuration, not application intent. Binding the pod to the emitted
    ServiceAccount is a separate operator act: set the aggrega.ai/service-account
    annotation on the consumer to the published ServiceAccount name, so the
    rendered pod runs under it. That annotation is honoured on the synthesized
    render path; a consumer rendered from an external chart via `source:` does
    not honour it, and the binding has to be expressed through that chart's own
    inputs instead. Emitting the ServiceAccount and binding the pod
    are two explicit steps; attaching this Feature performs the first, the
    annotation performs the second.
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "component.aggrega.ai/type=server"
  interoperability:
    conflictsWith: []
  schema:
    infra:
      gcp_service_account:
        type: string
        required: true
        description: >
          The Google service-account email the ServiceAccount is annotated with
          (<name>@<project>.iam.gserviceaccount.com). The pod impersonates this
          Google service account at runtime through Workload Identity.
      service_account_name:
        type: string
        required: true
        description: >
          The name of the emitted ServiceAccount. Set the same value on the
          consumer's aggrega.ai/service-account annotation to run the pod under
          it — honoured on the synthesized render path, not on a consumer
          rendered from an external chart.
    provides:
      name:
        type: string
        description: >
          The emitted ServiceAccount's name — the value to mirror onto the
          consumer's aggrega.ai/service-account annotation so the pod binds to
          it, on the synthesized render path.
