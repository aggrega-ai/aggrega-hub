apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/aws-irsa
  version: 1.0.0
  description: >
    Binds a workload to an AWS IAM role through IAM Roles for Service Accounts
    (IRSA). Its FeatureRecipe emits one Kubernetes ServiceAccount annotated with
    the IAM role ARN; the pod runs under that ServiceAccount and the EKS OIDC
    provider mints role credentials at runtime, so no static credential material
    is stored. The role ARN and the ServiceAccount name are operator sizing
    (infra) — cloud identity is operational configuration, not application
    intent. Binding the pod to the emitted ServiceAccount is a separate operator
    act: set the aggrega.ai/service-account annotation on the consumer to the
    published ServiceAccount name, so the rendered pod runs under it. That
    annotation is honoured on the synthesized render path; a consumer rendered
    from an external chart via `source:` does not honour it, and the binding has
    to be expressed through that chart's own inputs instead. Emitting
    the ServiceAccount and binding the pod are two explicit steps; attaching this
    Feature performs the first, the annotation performs the second.
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "none"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "component.aggrega.ai/type=server"
  interoperability:
    conflictsWith: []
  schema:
    infra:
      role_arn:
        type: string
        required: true
        description: >
          The AWS IAM role ARN the ServiceAccount is annotated with
          (arn:aws:iam::<account>:role/<role>). The pod assumes this role at
          runtime through the EKS OIDC provider.
      service_account_name:
        type: string
        required: true
        description: >
          The name of the emitted ServiceAccount. Set the same value on the
          consumer's aggrega.ai/service-account annotation to run the pod under
          it — honoured on the synthesized render path, not on a consumer
          rendered from an external chart.
    provides:
      name:
        type: string
        description: >
          The emitted ServiceAccount's name — the value to mirror onto the
          consumer's aggrega.ai/service-account annotation so the pod binds to
          it, on the synthesized render path.
