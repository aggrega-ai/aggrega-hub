apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/traffic-shadowing
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseFeatureParameter & {
      shadowPercent: int & >=0 & <=100
    }
