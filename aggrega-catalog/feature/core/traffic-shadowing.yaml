apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/traffic-shadowing
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        shadowPercent: { type: integer, min: 0, max: 100 }
      required: [shadowPercent]
