apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/manual-trigger
  version: 1.0.0
  description: >
    Lets a core/compute/task with no schedule be deployed without starting,
    for someone to start each run by hand, as a backup on request or a
    one-off data fix is. Attached to a task with no schedule, no run starts
    when the Release deploys; each run is one someone starts on the target.
    Attached to a task with a schedule, the task runs on its schedule exactly
    as it would without the Feature, and can also be started by hand.

    Running on demand is part of what the task is, so the developer attaches it
    in the Aggregate, under the task's features. It takes no values and no
    infra, so the operator writes nothing for it in the Release. It applies to
    components of type task only.

    No script is written into the build output: a run is started with the
    target's own command, which is the operator's to run. On Kubernetes that
    is kubectl create job <run-name> --from=cronjob/<cronjob>, the CronJob
    named as the task is rendered. On Docker Compose it is docker compose run
    --rm <service>, the service named after the task, which docker compose up
    leaves stopped. On Amazon ECS it is aws ecs run-task,
    given the cluster, the task definition and the network configuration the
    task's Recipe reads from infra.overrides. Each
    target realizes the Feature through a FeatureRecipe the Manifest binds to
    it, and a Manifest binding none halts the build, naming the attachment.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Only a task runs to completion, so only a task can wait to be started. A
  # long-running server or worker is started once and keeps running, which
  # leaves nothing for this Feature to change.
  appliesTo: "component.aggrega.ai/type=task"
  interoperability:
    conflictsWith: []
  schema:
    # No input of its own. Each product that can hold an unscheduled task
    # until someone starts it does so by configuration of its own: Kubernetes
    # keeps a CronJob suspended and creates a Job from it by hand; Docker
    # Compose leaves a service gated behind a profile until
    # `docker compose run` targets it; Amazon ECS runs a task definition only
    # when a RunTask call starts it. No setting is shared by all three, so
    # whatever one target needs is read by that target's FeatureRecipe rather
    # than declared here.
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
