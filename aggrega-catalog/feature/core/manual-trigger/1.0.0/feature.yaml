apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/manual-trigger
  version: 1.0.0
  description: >
    Makes a core/compute/task run only when someone starts it, as a backup on
    request or a one-off data fix does. Attached to a task, it changes when a
    run happens: no run starts when the Release deploys, and none starts on the
    task's schedule; each run is one someone starts on the target. A schedule
    the developer also wrote is kept, and does not fire while the Feature is
    attached.

    Running on demand is part of what the task is, so the developer attaches it
    in the Aggregate, under the task's features. It takes no values and no
    infra, so the operator writes nothing for it in the Release. It applies to
    components of type task only.

    No script is written into the build output: a run is started with the
    target's own command. Each target realizes the Feature through a
    FeatureRecipe the Manifest binds to it, and a Manifest binding none halts
    the build, naming the attachment.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Only a task runs to completion, so only a task can wait to be started. A
  # long-running server or worker is started once and keeps running, which
  # leaves nothing for this Feature to change.
  appliesTo: "component.aggrega.ai/type=task"
  interoperability:
    conflictsWith: []
  schema:
    # No input of its own. Each product that can hold a task until someone
    # starts it does so by configuration of its own: Kubernetes keeps a CronJob
    # suspended and creates a Job from it by hand; Docker Compose leaves a
    # service gated behind a profile until `docker compose run` targets it;
    # Amazon ECS runs a task definition only when a RunTask call starts it. No
    # setting is shared by all three, so whatever one target needs is read by
    # that target's FeatureRecipe rather than declared here.
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
