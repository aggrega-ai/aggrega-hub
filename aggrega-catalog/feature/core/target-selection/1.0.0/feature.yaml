apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  # Named for the choice it declares. In the field, "semantic routing" names
  # routing a request by what it means, which this Feature does not declare, so
  # that name is left free for a Feature that does.
  name: core/target-selection
  version: 1.0.0
  description: >
    Declares which way an AI gateway chooses among several targets that can
    serve the same request. Its strategy is latency, which picks the target
    observed to answer quickest, or cost, which picks the target that is
    cheapest to call.

    It is the choice between targets rather than the routing itself: which
    targets are candidates comes from the gateway's own routing table, so a
    table that publishes each model alias once leaves nothing to choose
    between.

    No FeatureRecipe in the standard library implements it, so a Release that
    attaches it halts the build naming the type rather than rendering anything.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        strategy:
          type: string
          enum: [latency, cost]
          default: latency
          description: "How the gateway chooses among the targets that can serve a request: latency, the target observed to answer quickest; or cost, the target cheapest to call."
      required: [strategy]
