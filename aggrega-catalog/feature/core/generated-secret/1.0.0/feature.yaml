apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/generated-secret
  version: 1.0.0
  description: >
    A credential whose material the target engine generates and manages. The
    deployment declares that a component's credential slot is delegated to the
    engine: no value is authored on the attachment, none travels the inject
    pipe, and no secret resource is rendered. It is the engine-managed peer of
    the developer-supplied credential Features — it carries the same
    feature.aggrega.ai/kind: secret label and binds the same slot — so a
    credential slot is always bound and what varies between deployments is what
    binds it.

    Attach it where the target provisions and rotates the credential itself: a
    managed cloud database, for example, whose Recipe sets the provider's own
    managed-password directive. That directive lives in the component's Recipe,
    never here, which is why this Feature declares no values and its
    FeatureRecipes render nothing. Bind it only on a target the catalog ships a
    FeatureRecipe for — the standard library ships the terraform and
    cloudformation capabilities, matching the managed-database Recipes that
    carry the directive.
  labels:
    # Credential-family marker, the same one the developer-supplied credential
    # Features carry, so a slot selector matching the family admits this Feature
    # as their peer. The material itself belongs to the target engine, never to
    # this deployment. The compiler reads the label as opaque metadata and
    # admits the attachment on any surface.
    feature.aggrega.ai/kind: secret
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
# No values, no provides: the developer supplies nothing and the attachment
# publishes nothing. The engine owns the credential's whole lifecycle, so there
# is neither an input to author nor an output for a consumer to read.
#
# Consequently this Feature declares no sensitive leaf, and that is correct rather
# than an omission: there is no datum here to declare anything about. An
# attachment of this Feature is still sensitive whenever it fills a slot the
# consuming Component declared `sensitive: true`, because a slot states what the
# binding point handles regardless of what the fill declares.
spec: {}
