apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/context-propagation
  version: 1.0.0
  annotations:
    security.aggrega.ai/class: "trust"
    security.aggrega.ai/trust_mechanism: "context_propagation"
    routing.aggrega.ai/tier: "gateway"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        propagationMode: { type: string, enum: [jwt, mTLS, opaque], default: jwt }
      required: [propagationMode]
