apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/concurrency-limit
  version: 1.0.0
  description: >
    Caps how many requests a gateway carries at once — the control that keeps
    a burst of callers from becoming a queue at the upstream. scope names what
    one cap counts: gateway, every request the gateway forwards, counted
    together; or model, each target the gateway sends requests to, counted
    apart. A target is each upstream entry the gateway routes to, so where one
    model name has several entries each entry is counted apart. The count is
    per running proxy, so where several replicas run each of them admits
    max_in_flight: size it against one replica, not against the whole.

    Every input is the operator's, so the operator attaches it in the Release,
    on the gateway's entry under that component's features, and sets
    max_in_flight in infra, with scope where the default, gateway, is not the
    count wanted.

    It attaches to a component in the request path that declares it can keep
    such a cap (dataplane.aggrega.ai/concurrency-cap, whichever value), and
    each realization refuses the scope its gateway does not count, naming the
    cap the gateway keeps. On core/gateway/nginx scope gateway is realized and
    a request past the cap is answered 503; scope model is refused, because
    NGINX keeps one total. On core/gateway/envoy-gateway scope model is
    realized, one cap for each wired model, and a request past it is answered
    503; scope gateway is refused, because Envoy Gateway keeps a cap for each
    backend and none on their total. On core/gateway/litellm scope model is
    realized, one cap for each entry of its model map, and a request past it
    is answered 429 unless a fallback chain sends it on; scope gateway is
    refused, because the proxy keeps no total that holds.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Where it is realized. A realization is a FeatureRecipe for a gateway that
  # keeps a count of the requests in flight and holds or refuses the request
  # past the cap; it refuses the scope its gateway does not count, naming the
  # dataplane.aggrega.ai/concurrency-cap value the gateway declares.
  # core/gateway/nginx declares total: NGINX's limit_conn keeps one count, in
  # a zone of shared memory every worker process reads, against a key that is
  # the same for every request, so concurrency-limit-nginx (under helm and
  # under compose) realizes scope gateway and refuses model.
  # core/gateway/envoy-gateway declares per-target: Envoy Gateway's circuit
  # breaker caps the requests in flight to each backend of a route rule, and
  # the gateway's Recipe gives each wired model a rule of its own, so
  # concurrency-limit-envoy-gateway realizes scope model, one cap for each
  # wired model, and refuses gateway. core/gateway/litellm declares
  # per-target: the proxy's router caps the requests in flight to each entry
  # of its model map, typed by hand or wired, and keeps the count only as
  # long as its in-memory records live, which the gateway's Recipe sets to a
  # century while it writes the cap; its one total is read only by a request
  # limiter an environment variable switches on, which counts a request for
  # its first second. So concurrency-limit-litellm realizes scope model, one
  # cap for each entry, and refuses gateway. A component declaring no
  # concurrency-cap value is not admitted by the selector below, so an
  # attachment there halts the build, naming the selector.
  #
  # Selects on the capability's presence, not on its value. A cap of either
  # shape is something the operator can size on any component that keeps one,
  # and what an attachment needs counted is its scope, which a selector cannot
  # read. So the attachment is admitted wherever a cap is declared, and the
  # realization refuses the scope its gateway does not count, in a message
  # naming the scope asked for and the value the gateway declares, which a
  # selector naming a value could not do.
  appliesTo: "dataplane.aggrega.ai/concurrency-cap"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # A capacity limit sized against one running proxy; how many proxies run
      # is decided per environment, so the cap is the operator's.
      max_in_flight: { type: integer, min: 1, required: true }
      # What one cap counts is the operator's too: a total and a cap per target
      # are two ways of sizing the same capacity — the gateway's own, or each
      # upstream's — which is the operator's decision, like the cap itself. A
      # budget's scope differs: it says whose traffic is billed, which the
      # author of the Aggregate decides, so it is the developer's.
      scope:
        type: string
        enum: [gateway, model]
        default: gateway
        description: "What one cap counts. gateway: every request the gateway forwards counts against one cap. model: each target the gateway sends requests to has a cap of its own; a target is each upstream entry the gateway routes to, so where one model name has several entries each entry is counted apart. A realization refuses the scope its gateway does not count."
