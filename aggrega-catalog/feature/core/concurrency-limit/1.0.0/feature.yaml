apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/concurrency-limit
  version: 1.0.0
  description: >
    Caps how many requests an AI gateway carries at once. Attached to a
    gateway that routes on the model named in a request, it bounds the
    in-flight total across everything that gateway serves — the control that
    keeps a burst of callers from becoming a queue at the upstream provider.
    The count is per running proxy rather than per upstream target, so where
    several replicas run each of them admits the stated number: size it
    against one replica, not against the whole.

    Every input is the operator's, so the operator attaches it in the Release,
    on the gateway's entry under that component's features, and sets
    max_in_flight in infra.

    No gateway in the standard library realizes it, so a Release attaching it
    halts the build naming the attachment and core/concurrency-limit. The
    proxy core/gateway/litellm runs can cap the requests in flight for each
    entry of its model map, but does not hold a cap on their total, so that
    gateway carries no realization of this Feature.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  # Where it is realized. A realization is a FeatureRecipe for a gateway that
  # keeps one count of the requests in flight across every alias and model it
  # serves and holds or refuses the request past the cap. None in this catalog
  # is such a gateway, so an attachment stops the build at recipe resolution,
  # naming the attachment and this type.
  #
  # The proxy core/gateway/litellm runs, at the release it pins, can cap each
  # entry of its model map on its own (an entry's max_parallel_requests, which
  # nothing in this catalog renders): two entries capped at one carry two
  # requests at once, whether they publish one alias or two, and a request
  # past an entry's cap is answered 429. Its cap on everything it serves
  # (global_max_parallel_requests under general_settings) is read only by a
  # request limiter the proxy loads when an environment variable asks for it,
  # and that limiter refuses the first request at a cap of one with nothing in
  # flight, then admits one more request at once for each request it has
  # refused. Neither holds the total this Feature promises, so the gateway
  # declines the Feature rather than carry a narrower cap under its name.
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
    infra:
      # A capacity limit sized against one running proxy; how many proxies run
      # is decided per environment, so the cap is the operator's.
      max_in_flight: { type: integer, min: 1, required: true }
