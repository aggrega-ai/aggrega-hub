apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/concurrency-limit
  version: 1.0.0
  description: >
    Caps how many requests an AI gateway carries at once. Attached to a
    gateway that routes on the model named in a request, it bounds the
    in-flight total across everything that gateway serves — the control that
    keeps a burst of callers from becoming a queue at the upstream provider.
    The count is per running proxy rather than per upstream target, so where
    several replicas run each of them admits the stated number: size it
    against one replica, not against the whole. It brings no resource of its
    own: the setting is written into the routing configuration the gateway's
    Recipe already renders.
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "gateway.aggrega.ai/intelligence=semantic"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        maxInFlight: { type: integer, min: 1 }
      required: [maxInFlight]
