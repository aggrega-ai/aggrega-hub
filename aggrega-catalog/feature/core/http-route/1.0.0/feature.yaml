apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/http-route
  version: 1.0.0
  description: >
    Publishes a server component on a gateway programmed through the Gateway
    API. Its FeatureRecipe (component-scope) emits one HTTP route per attached
    component, naming the gateway the route attaches to as its parent and the
    Service the component's own Recipe emits as its backend.

    The developer attaches it in the Aggregate and writes the request path in
    values, because which requests an application serves is part of what the
    application is. The operator sizes the same attachment on the Release's
    entry for the component, writing in infra the hostname, which is the
    environment's name for the component, and the cluster knobs, which
    describe the cluster the Release lands in rather than the application:
    which gateway and listener to attach to, and which Service and port to
    forward to. Left without a hostname, the route carries none and serves
    every hostname the gateway's listener accepts, with the path match
    separating it from the other routes on that listener.

    The Service defaults to the primary Service a synthesized workload emits,
    so a Release whose Recipe sources an upstream chart naming its Service
    otherwise sets service_name to that name. A route names its backend port
    by number rather than by name, and an attachment cannot read the port the
    component it is attached to was given, so service_port carries no default
    and the build halts until the Release supplies it.
  annotations:
    security.aggrega.ai/class: "cloud_native"
    routing.aggrega.ai/tier: "gateway"
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  appliesTo: "component.aggrega.ai/type=server"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        # What the application serves is the developer's, so the path prefix
        # the component answers under is written with the attachment in the
        # Aggregate. It is optional because the bound FeatureRecipe carries the
        # fallback for its own target, as it does for service_name below. A
        # path that has to differ from one environment to the next is written
        # as a parameter of the Aggregate, which each Release fulfils.
        path:
          type: string
          description: "Request path prefix routed to the component."
    infra:
      # The hostname is the environment's name for the component: a staging and
      # a production Release publish the same component under different names,
      # so the operator writes it on the Release's entry for this attachment.
      host:
        type: string
        description: "Hostname the component answers on through the gateway. Left unset, the route carries no hostname and serves every hostname the gateway's listener accepts."
      # The runtime prerequisite, declared rather than assumed. An HTTP route
      # only becomes routing once a gateway control plane implementing the
      # Gateway API is already running in the target cluster and reconciling
      # the gateway this route names; emitted into a cluster that runs none, it
      # is an orphan that routes nothing. The compiler is ahead-of-time and
      # cannot inspect cluster state, so the prerequisite is an affirmation the
      # Operator makes in the Release rather than something the build can check
      # for itself. A Release that declares a gateway Component of its own
      # installs that control plane alongside this route and affirms the flag
      # on the strength of it.
      control_plane_present:
        type: boolean
        default: false
        description: "Operator affirmation that a gateway control plane implementing the Gateway API is running in the target cluster. The bound FeatureRecipe halts the build unless this is set true, so a route is never emitted into a cluster with nothing to reconcile it into routing."
      # Operational routing configuration — filled by the Operator, who knows
      # which gateway fronts this cluster and which Service the bound Recipe
      # emits. Two of these are required and the build halts without either:
      # gateway_name, because a route naming no gateway attaches to nothing,
      # and service_port, because a route naming no backend port forwards
      # nowhere. Neither has a fallback that could be right, so neither states
      # a default it cannot deliver. Of the rest, service_name takes the
      # fallback the bound FeatureRecipe carries for its own target, and
      # gateway_namespace and listener_name are simply omitted from the
      # emitted route when unset, which is what the routing API reads as "the
      # route's own namespace" and "every listener that admits it".
      gateway_name:
        type: string
        description: "Name of the gateway this route attaches to, which is the name of the gateway resource the cluster's gateway install emits. Where the same Release declares a gateway Component, it is that component's own name."
      gateway_namespace:
        type: string
        description: "Namespace the gateway lives in. Left unset, the route attaches to a gateway in its own namespace. A gateway in another namespace accepts the route only where that gateway's listener admits routes from other namespaces."
      listener_name:
        type: string
        description: "Name of the listener on that gateway the route attaches to. Left unset, the route attaches to every listener on the gateway that admits it, which is what a single-listener gateway wants."
      service_name:
        type: string
        description: "Name of the Service traffic is forwarded to. Supplied where the bound Recipe sources an upstream chart that names its own Service; left unset, the routing targets the Service the attached component's own Recipe emits."
      service_port:
        type: integer
        min: 1
        max: 65535
        description: "Port number on that Service traffic is forwarded to. This is the port the Service publishes, not the port the container listens on, and it carries no default because the port differs per component and a guessed one would render a route to a port nothing serves."
