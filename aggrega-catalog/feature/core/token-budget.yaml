apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/token-budget
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "quota"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        maxTokensPerRequest: { type: integer, exclusiveMinimum: 0 }
      required: [maxTokensPerRequest]
