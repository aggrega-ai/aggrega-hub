apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/semantic-routing
  version: 1.0.0
  annotations:
    routing.aggrega.ai/tier: "gateway"
    security.aggrega.ai/class: "routing_policy"
spec:
  appliesTo:
    component.aggrega.ai/type: "ai-gateway"
  interoperability:
    conflictsWith: []
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseFeatureParameter"
      properties:
        strategy: { type: string, enum: [latency, cost, quality], default: latency }
      required: [strategy]
