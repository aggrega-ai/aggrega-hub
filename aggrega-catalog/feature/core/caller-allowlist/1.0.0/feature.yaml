apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: core/caller-allowlist
  version: 1.0.0
  description: >
    Lets only the components declared to call the component it is attached to
    connect to it: those whose uses edges point at it, plus the component's own
    pods and the sources the attachment names, on the ports its pods declare.
    It keeps, say, a model server reachable only through the gateway in front
    of it. It restricts who may connect, not what a connection carries.

    The cluster's network enforces the rule, and only where its network plugin
    implements network policy. The build writes the policy and cannot know
    whether it will be enforced, so the Release affirms it. Traffic from a
    source outside the Aggregate, such as an ingress controller or a monitoring
    agent, is admitted only when the attachment names it. A chart that runs
    several workloads is protected as one, and pods a controller creates at
    runtime are outside the rule.

    Attached by the operator in the Release, on the component it protects,
    under components.<id>.features. Its callers are the uses edges the
    Aggregate already declares, so a call the Aggregate does not declare as an
    edge can be refused by the cluster wherever a Release attaches it.

    Realized on helm: one network policy per workload the component renders, in
    that workload's namespace, selecting pods by a selector carrying no
    version. The build halts, naming the component, where it or a caller
    renders no pods, emits a workload into no namespace or with neither a
    controller selector nor the build's identity labels (a chart's Job, say),
    or where it declares no port. Compose cannot express the rule, so binding
    this Feature there halts for want of a realization.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # A component that serves connections: a server or a stateful server, whose
  # pods listen for callers, or a worker whose pods listen on a port they
  # declare, such as a metrics port; one whose render declares no port halts
  # the build, naming it, as any component does. A task or a function is not
  # called through a uses edge it serves, and a resource runs no pods of its own.
  appliesTo: "component.aggrega.ai/type in (server, stateful-server, worker)"
  # What the rule admits, and what it cannot see:
  #
  # - The callers are read from the Aggregate as built: every component whose
  #   uses edge points at the attached one, in whichever boundary and namespace
  #   the Release places it. A caller is admitted by the pods its own render
  #   emitted, together with the namespace they are emitted into, so the same
  #   pods running in another namespace are not admitted. Pods a Feature
  #   attached to a caller renders count as that caller's.
  # - Pods are selected by the selector each workload's controller writes,
  #   which the controller owns its pods by; a bare Pod, or a Job relying on the
  #   selector the cluster generates, by the identity labels the build stamps
  #   on the pods it synthesizes and on every bare Pod. Neither carries a
  #   version, so a policy keeps matching the old pods while an upgrade rolls
  #   out. A workload with neither, which a chart's Job usually is, halts the
  #   build, since selecting it by every label it carries would stop matching
  #   its pods the first time a version label changed.
  # - The attached component's own pods may always reach each other, so a
  #   clustered server keeps talking to its peers, in whichever namespaces its
  #   workloads are emitted into.
  # - Attaching it in the Aggregate is accepted and renders the same policy;
  #   the Release is where it belongs, because what it restricts is how the
  #   cluster lets traffic through, which the operator decides.
  # - Network policies add up: where another policy in the cluster selects the
  #   same pods, a connection either of them admits is admitted.
  # - A pod running on the node's own network is not reliably covered, as the
  #   attached component or as a caller: what network policy does with such a
  #   pod is left to each network plugin.
  # - Egress is left untouched; the component's own outbound connections,
  #   name resolution included, behave as they did.
  # - Compose has no realization: it puts every service of a group on one
  #   network, and one service's fragment cannot move another service off it,
  #   so there is nothing a rule restricting callers could be written into.
  schema:
    infra:
      # The runtime prerequisite, declared rather than assumed. A network
      # policy only restricts anything once the cluster's network plugin
      # implements network policy; written into a cluster whose plugin does
      # not, it is accepted and enforces nothing, and every workload stays
      # reachable. The compiler is ahead-of-time and cannot inspect the
      # cluster, so this is an affirmation the Operator makes in the Release
      # rather than something the build can check for itself.
      control_plane_present:
        type: boolean
        default: false
        description: "Operator affirmation that the target cluster's network plugin enforces network policy. The bound FeatureRecipe halts the build unless this is set true, so a policy is never written for a cluster that would accept it and enforce nothing."
      # Sources outside the Aggregate the component must also admit: an
      # ingress controller, a monitoring agent scraping the component, a
      # client outside the cluster. Each entry names one source, either as an
      # address range or as a set of pods:
      #
      # - cidr alone: connections from that address range.
      # - namespace alone: every pod in that namespace.
      # - pod_labels alone: pods carrying those labels in the namespace each
      #   policy is placed in, the one the attached component's workload is
      #   emitted into.
      # - namespace and pod_labels together: pods carrying those labels in that
      #   namespace, and only there.
      #
      # An entry naming a cidr together with a namespace or pod labels, or
      # naming none of the three, halts the build; an empty value counts as
      # not named. Nothing here is checked against the cluster: a namespace
      # or a label that matches no pod admits nothing.
      admitted_sources:
        type: array
        default: []
        description: "Sources outside the Aggregate the attached component also admits, on the same ports as its declared callers. Each entry names an address range (cidr), or pods by namespace, by labels, or by both."
        items:
          namespace:
            type: string
            description: "Namespace whose pods are admitted, matched by its kubernetes.io/metadata.name label, which the cluster sets on every namespace. With pod_labels, only the pods in it carrying those labels."
          pod_labels:
            type: object
            additionalProperties:
              type: string
            description: "Labels a pod must carry to be admitted. Without namespace, pods in the namespace each policy is placed in, the one the attached component's workload is emitted into."
          cidr:
            type: string
            description: "Address range admitted, in CIDR notation, such as 10.20.0.0/16. Cannot be combined with namespace or pod_labels in one entry."
