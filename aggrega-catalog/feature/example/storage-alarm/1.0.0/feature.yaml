apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: example/storage-alarm
  version: 1.0.0
  description: >
    Raises an alarm when a datastore's free storage falls below the headroom the
    application needs. Its FeatureRecipe is component-scope: it emits one alarm
    per attached component, watching that component's own storage. The headroom
    is developer intent (values), because how much spare capacity an application
    needs before it is in trouble is a property of the application; where the
    alarm notifies and how long a dip has to persist before it fires are operator
    sizing (infra), because they describe the operator's on-call arrangements
    rather than the application.

    This is an example-namespace Feature: it exists to show how an attachment
    contributes resources to a target's output, and it is authored for the worked
    example that demonstrates it rather than as a portable standard-library
    capability.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  interoperability:
    conflictsWith: []
  schema:
    values:
      free_storage_bytes:
        type: integer
        default: 10737418240
        description: "Free storage, in bytes, below which the alarm is raised. The default is ten gibibytes."
    infra:
      # Operator sizing. Both are optional because the bound FeatureRecipe
      # carries the fallback for its own target: how many evaluation intervals a
      # dip must persist is a property of one target's alarm model rather than
      # every target's, so the realization is where that default belongs.
      evaluation_periods:
        type: integer
        description: "Number of consecutive evaluation intervals the threshold must be breached before the alarm is raised."
      notify_target:
        type: string
        description: "Where the alarm notifies when it is raised. Left unset, the alarm is emitted with no notification action and is readable from the deployed target's own console."
