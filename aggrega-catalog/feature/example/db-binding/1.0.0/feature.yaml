apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: example/db-binding
  version: 1.0.0
  description: >
    A database-binding feature: attach it to an application component to wire
    that component to a stateful-server database and deliver the connection.
    The feature carries the `databases` uses-edge to the target plus the
    delivery declaration that lands the database's published host on the
    consumer's environment as ADMINER_DEFAULT_SERVER. The binding is the
    vehicle for the edge — the application component consumes the database
    through it, so the connection wiring is declared once as a reusable
    attachment rather than inline on every consumer. It renders no resource of
    its own — its FeatureRecipe (db-binding) is a no-op. Like any feature
    instance it still resolves to a FeatureRecipe; its whole contribution is the
    bound edge and its injection.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  interoperability:
    conflictsWith: []
  # The socket the binding offers: a `databases` edge to a stateful-server
  # database, delivering the resolved connection over the env pillar. The
  # attachment's `uses.databases` fills this socket; the consumer is wired to
  # the matched database and injected its published host.
  usesSchema:
    databases:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]
