apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: SourcedChartValues
  version: 1.0.0
  description: |
    Reusable value mappings for a recipe that sources an upstream chart. A recipe
    consumes an entry with `valuesMapping: { $import: SourcedChartValues#/mappings/<Entry> }`;
    the version is supplied by the per-Release lockfile and no registry host
    enters the reference. The import replaces the whole `valuesMapping`, so each
    entry below is a complete value document rather than a fragment spliced into
    one.

    Each entry carries the two obligations a sourced recipe owes: the generated
    object names are pinned to the node's rendered name — the release name the
    helm provider gives the chart, which spells the component's name in the
    alphabet a Kubernetes name allows — so a value the component publishes
    through `provides` from the same `.context.rendered_name` names something the
    chart emits, and the image the chart runs is delivered explicitly rather than
    left to the chart's own default, so repeated renders are reproducible.

    The pin reads `.context.rendered_name` inside the imported body, which
    renders the release name on a `capability: helm` Recipe sourcing a chart,
    because that provider reports one for such a node. Under a provider that
    reports no such name, a reference inside an imported body renders empty
    rather than halting, so import these entries into helm Recipes only.

    The key names are the ones most charts use for these settings —
    `fullnameOverride`, `image`, `resources`, `nodeSelector`, `tolerations`,
    `persistence`. A chart that spells one of them differently, or that nests its
    workload under a named sub-component, needs its own mapping: adapt an entry
    here rather than importing it, since only the chart settles what belongs in
    its value document.
spec:
  mappings:
    # A chart deploying one workload with no storage of its own.
    #
    # A shared mapping cannot hold one product's image pin, because the pin
    # belongs to the product and the mapping serves many. The pin therefore moves
    # to the consuming component, which declares `infra.image` with the pinned
    # repository and tag as its default; this entry delivers whatever that key
    # carries, and `infra.overrides.image` replaces the whole block for a
    # Release that runs a build of its own. The pin stays explicit and the
    # render stays reproducible — what changes is which document holds it.
    #
    # `compute` and `overrides` are read through hoisted variables because
    # `default` falls back for a missing *leaf* and not for a missing *parent*: a
    # consuming component that declares no `infra.compute` at all leaves the
    # parent absent, and reading `.infra.compute.cpu` off it halts before the
    # fallback is reached. `optional .infra "compute" dict` yields an empty block
    # in that case, so each leaf's declared fallback applies as written.
    SingleWorkloadChart: |
      {{- $overrides := optional .infra "overrides" dict }}
      {{- $compute := optional .infra "compute" dict }}
      ## ── Generated object names ─────────────────────────────────
      ## Bound to the node's rendered name, so a Service the component publishes
      ## through `provides` is named something the render actually emits.
      fullnameOverride: "{{ .context.rendered_name }}"

      ## ── Replicas ───────────────────────────────────────────────
      replicaCount: {{ optional .infra "replicas" 1 }}

      ## ── Image ──────────────────────────────────────────────────
      ## Delivered field by field, so a component pinning only repository and tag
      ## renders those two and a component that also pins a registry or a pull
      ## policy renders those as well, with no key list restated here.
      ## Written only when one of the two carries a field: an `image:` with
      ## nothing under it would be a null, and a null removes the chart's own
      ## image block, leaving the workload with no image to run. Unwritten, the
      ## chart's own image stands.
      {{- $image := optional .infra "image" dict }}
      {{- if or $overrides.image $image }}
      image:
      {{- if $overrides.image }}
      {{- range $k, $v := $overrides.image }}
        {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      {{- range $k, $v := $image }}
        {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- end }}
      {{- end }}

      ## ── Resources ──────────────────────────────────────────────
      ## Requests and limits are set from the same operator sizing. A chart whose
      ## workload should burst above its request takes a separate limits source;
      ## equal values are the conservative default, not a rule.
      resources:
        requests:
          cpu: "{{ $compute.cpu | default "100m" }}"
          memory: "{{ $compute.memory | default "128Mi" }}"
        limits:
          cpu: "{{ $compute.cpu | default "100m" }}"
          memory: "{{ $compute.memory | default "128Mi" }}"

      ## ── Scheduling ─────────────────────────────────────────────
      ## Emitted only when the operator asked for placement, so a Release that
      ## sets neither key renders no scheduling block at all.
      {{- if $overrides.nodeSelector }}
      nodeSelector: {{ toJson $overrides.nodeSelector }}
      {{- end }}
      {{- if $overrides.tolerations }}
      tolerations: {{ toJson $overrides.tolerations }}
      {{- end }}
    # A chart deploying one workload that keeps state on a volume.
    #
    # Identical to SingleWorkloadChart apart from the persistence block, and the
    # duplication is deliberate: the import replaces the whole `valuesMapping`,
    # so an entry cannot extend another entry, and a consumer chooses exactly one.
    # Splitting the shared part into a third entry would leave neither of these
    # usable on its own.
    #
    # The storage keys are the ones the datastore family surface declares —
    # `infra.storage.size` and `infra.storage.type`. A target with no volume-size
    # concept ignores the size; this entry is for sourced Recipes on a target that
    # has one.
    PersistentWorkloadChart: |
      {{- $overrides := optional .infra "overrides" dict }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $storage := optional .infra "storage" dict }}
      ## ── Generated object names ─────────────────────────────────
      fullnameOverride: "{{ .context.rendered_name }}"

      ## ── Replicas ───────────────────────────────────────────────
      replicaCount: {{ optional .infra "replicas" 1 }}

      ## ── Image ──────────────────────────────────────────────────
      ## Written only when one of the two carries a field, as above.
      {{- $image := optional .infra "image" dict }}
      {{- if or $overrides.image $image }}
      image:
      {{- if $overrides.image }}
      {{- range $k, $v := $overrides.image }}
        {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      {{- range $k, $v := $image }}
        {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- end }}
      {{- end }}

      ## ── Resources ──────────────────────────────────────────────
      resources:
        requests:
          cpu: "{{ $compute.cpu | default "100m" }}"
          memory: "{{ $compute.memory | default "128Mi" }}"
        limits:
          cpu: "{{ $compute.cpu | default "100m" }}"
          memory: "{{ $compute.memory | default "128Mi" }}"

      ## ── Persistence ────────────────────────────────────────────
      ## The storage class is emitted only when the operator named one, so an
      ## unset key leaves the cluster's own default class in force rather than
      ## binding the volume to an empty class name.
      persistence:
        enabled: true
        size: "{{ $storage.size | default "8Gi" }}"
      {{- with $storage.type }}
        storageClass: "{{ . }}"
      {{- end }}

      ## ── Scheduling ─────────────────────────────────────────────
      {{- if $overrides.nodeSelector }}
      nodeSelector: {{ toJson $overrides.nodeSelector }}
      {{- end }}
      {{- if $overrides.tolerations }}
      tolerations: {{ toJson $overrides.tolerations }}
      {{- end }}
