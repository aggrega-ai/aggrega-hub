apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: EcsFargateArguments
  version: 1.0.0
  description: >
    The config every Amazon ECS Recipe hands the body it imports from
    EcsFargateModule, with the container's environment and the refusals,
    held once: ServiceArguments for the Service body and TaskArguments for
    Task. A Recipe consumes one with `valuesMapping: { $import:
    EcsFargateArguments#/mappings/ServiceArguments }`; the import replaces
    the whole valuesMapping.

    Each entry names the task definition after the component, places it in
    the operator's cluster, subnets and security groups under the operator's
    roles from infra.overrides, sizes it to a Fargate task size from
    infra.compute, and delivers env entries as variables, refusing by name
    what Fargate cannot take. What differs between importers is read from
    the locals each declares: a default image, the container's port, and the
    variable each own value and each socket's connections are delivered as
    by default.
spec:
  mappings:
    # The entries. Each renders one key, config, the one argument of the
    # importing component's module block in the boundary's root
    # configuration, which the fixed pass-through hands to the body; the
    # names inside config are the body's, documented in EcsFargateModule.
    # Each stops the build, naming what to change, before config is written
    # when an input cannot be one Amazon ECS on Fargate takes. They are one
    # template below their opening lines, which set what differs between a
    # service and a task: the entry's name, the resource's word, the name
    # rule, whether a count of tasks is kept running, and whether a schedule
    # starts runs; a change to one is made to every one of them.
    #
    # What the importing Recipe declares, as its locals, each optional; a
    # local the Recipe does not declare reads as empty here rather than
    # stopping the build:
    #   default_image   the image the component runs while infra.image is
    #                   unset; a Recipe running the Release's own code
    #                   declares none, so the Release names the image;
    #   container_port  the port the container listens on; while it is not
    #                   declared, infra.port, where the Component declares
    #                   one. The container maps it where either names it,
    #                   and maps no port otherwise;
    #   value_env       a JSON object mapping each own value the Recipe
    #                   delivers by default, values.<key>, to the variable it
    #                   is delivered as;
    #   socket_env      a JSON object mapping each socket whose connections
    #                   the Recipe delivers by default to an object mapping
    #                   each variable to the key of the target's provides it
    #                   carries. Locals cannot read connections, so the
    #                   names travel as this table, read here with fromJson;
    #   probe_path      refused where it is declared: this realization
    #                   declares no container health check, since Amazon ECS
    #                   runs one as a command inside the container and an
    #                   image it does not build may hold no tool to run one,
    #                   and a load balancer target group's own health check
    #                   is the operator's;
    #   gpu             refused where it is declared: the Amazon ECS
    #                   developer guide's "Amazon ECS task definition
    #                   differences for Fargate" lists gpu among the task
    #                   definition parameters not valid in Fargate tasks.
    #
    # The name. The task definition's family and the service or the schedule
    # are named after the component, so the name is checked here: for a
    # service, against what Amazon ECS takes for both a service's name and a
    # family, up to 255 letters, digits, hyphens and underscores; for a task,
    # against what both a family and an EventBridge Scheduler schedule's name
    # take, the scheduler taking up to 64 characters for a name, so up to 64
    # letters, digits, hyphens and underscores, whether a schedule is
    # rendered or not.
    #
    # The environment. Every env entry on the inject pipe — dictated by a
    # connection's inject block, by the component's own inject block or by an
    # attachment — becomes one variable of the container, under the name it
    # was dictated as, its value written whole, so a Terraform reference a
    # neighbour publishes, such as ${module.db.address}, reaches the root
    # configuration as an interpolation the engine evaluates there, where the
    # neighbour's module is declared. Then the defaults:
    #   - each connection on a socket socket_env names, while that connection
    #     dictates nothing, delivers each variable of its table carrying the
    #     key the target publishes; a target publishing no such key, two such
    #     connections setting one variable, and a variable another source
    #     dictates as well each halt, naming both;
    #   - each own value value_env names is delivered under its variable
    #     while it has a value, set in the Aggregate or defaulted by the
    #     Component, and no entry of the component's own inject block, in any
    #     mechanism, delivers it — the template reads that at
    #     .context.self_inject, which maps each name the developer wrote to
    #     values.<key> for an entry reading that one own value — and a list or
    #     a map is written as its JSON text; a variable another source
    #     delivers as well halts, naming both.
    # This realization refuses no variable by its name.
    #
    # DELIBERATE NEAR-DUPLICATE of the environment assembly each other
    # target's container Recipes hold, in their own values mapping or in the
    # shared arguments they import, and of the reading of .context.self_inject
    # every Recipe that reads it declares: the same steps, save the variables
    # each target reserves and the mechanisms it delivers. It is part of a
    # values mapping, and no catalog kind composes part of a template into
    # another; a change to it is made to all of them.
    #
    # Other mechanisms. Every other entry on the pipe is refused, naming the
    # entry, its mechanism and who dictated it, so none is dropped: a file
    # entry, because an Amazon ECS task definition on Fargate offers no way to
    # write a file's content into the container — the storage a Fargate task
    # mounts is an Amazon EBS or Amazon EFS volume or a bind mount, as the
    # same guide's "Task storage" lists, and the task definition fills none of
    # them; an arg entry, because no command line is rendered, and Amazon ECS
    # takes a container's command in place of the image's default one; and
    # any custom mechanism.
    #
    # The size. The task runs at the first pair of the task-size table of the
    # same guide ("Task CPU and memory"), by CPU and then by memory, that
    # meets both the CPU and the memory infra.compute asks for: a CPU size in
    # CPU units, 1024 to a vCPU, and the memory sizes in MiB that CPU size
    # takes. Each requested quantity is a floor: the task may be given more
    # than was written, and is billed for what it is given. A size the table
    # adds later is not chosen until it is listed here. A quantity this entry
    # cannot read, and a pair larger than the largest Fargate task, halt
    # naming it. DELIBERATE NEAR-DUPLICATE: the CloudFormation Amazon ECS
    # Recipes, and any fragment they share, hold the same table and the same
    # reading of the quantities, as locals or as a template of their own. A
    # values mapping and a CloudFormation template share no catalog kind that
    # composes one into the other, so the table is held in each; a change to
    # one is made to the other.
    #
    # infra.overrides is read for cluster, subnet_ids, vpc_security_groups
    # and execution_role_arn, each required: cluster a string, the name or
    # ARN of an existing cluster for a service and its ARN for a task, since
    # a schedule names its target by ARN; subnet_ids one to sixteen subnet
    # IDs and vpc_security_groups one to five security group IDs, the bounds
    # of an awsvpc network configuration; execution_role_arn a string.
    # task_role_arn and awslogs_group are optional strings, and
    # assign_public_ip true or false, false unless the Release sets it. A
    # service reads target_group_arn, a string, and registers its tasks'
    # port with that target group, which needs a port; a task refuses it, as
    # a run ends. A task whose component has a schedule reads
    # scheduler_role_arn, required, and schedule_expression_timezone, a
    # string, UTC unless the Release names one; a task with no schedule
    # refuses both. infra.published_port, a Docker Compose setting, halts,
    # and infra.replicas is a service's count of tasks, 1 where the
    # Component declares none.
    #
    # The schedule. A task's values.schedule, where the Component declares it
    # and the Aggregate sets it, becomes the six fields of an EventBridge
    # Scheduler cron expression, or halts naming what that expression cannot
    # carry. The fields are read as Kubernetes reads a CronJob's schedule:
    # minute, hour, day of the month, month and day of the week, each a comma
    # list of numbers, ranges and steps, or *; month and day names in any
    # case; ? as *; and the descriptors @hourly, @daily, @midnight, @weekly,
    # @monthly, @yearly and @annually as the fields they stand for. The
    # scheduler reads minute, hour, day of the month and month in the same
    # forms, so they pass through, with names written as numbers. It numbers
    # the days of the week 1 to 7 from Sunday and takes no step there, so
    # that field becomes the explicit list of the days it names. Both readers
    # run a field whose list holds * (or a step of 1 over it) as
    # unrestricted; with both day fields restricted, Kubernetes runs on a day
    # matching either, which the scheduler cannot express, since it requires
    # one of the two to be ?, so that schedule halts, as do @every, which
    # counts its interval from a moment the scheduler cannot reproduce, a
    # time zone written into the expression, and any field in another form.
    # The year field is *. A task with no schedule renders its task
    # definition alone. DELIBERATE NEAR-DUPLICATE: the CloudFormation Amazon
    # ECS task Recipe, and any fragment the CloudFormation Amazon ECS Recipes
    # share, hold the same translation. A values mapping and a CloudFormation
    # template share no catalog kind that composes one into the other, so the
    # translation is held in each; a change to one is made to the other.

    # An Amazon ECS service, for EcsFargateModule#/artifacts/Service.
    # infra.replicas is the count of tasks it keeps running, and it reads
    # target_group_arn; no schedule is read.
    ServiceArguments: |
      {{- $entry := "EcsFargateArguments#/mappings/ServiceArguments" }}
      {{- $resource := "service" }}
      {{- $nameRule := `^[A-Za-z0-9_-]{1,255}$` }}
      {{- $nameSentence := "names its Amazon ECS service and task definition family, and ECS takes up to 255 letters, digits, hyphens and underscores for each" }}
      {{- $instances := true }}
      {{- $scheduled := false }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q %s: rename the component in the Aggregate to such a name" $id $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and an Amazon ECS %s on Fargate has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and an Amazon ECS task definition on Fargate offers no way to write a file's content into the container: the storage a Fargate task mounts is an Amazon EBS or Amazon EFS volume or a bind mount, and the task definition fills none of them. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Amazon ECS takes a container's command in place of the image's default one, which stays the image's own. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and Amazon ECS gives a task on Fargate no GPU: the Amazon ECS developer guide lists gpu among the task definition parameters not valid in Fargate tasks. Leave gpu out of the Recipe realizing the component on Amazon ECS, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- with toString (optional .locals "probe_path" "") }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and this realization declares no container health check: Amazon ECS runs one as a command inside the container, and an image this realization does not build may hold no tool to run one, while a load balancer target group's own health check is the operator's. Leave probe_path out of the Recipe realizing the component on Amazon ECS" $entry .) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $_ := set $env $name (toJson $v) }}{{ else }}{{ $_ := set $env $name (toString $v) }}{{ end }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 256 (list 512 1024 2048)) (list 512 (untilStep 1024 4097 1024)) (list 1024 (untilStep 2048 8193 1024)) (list 2048 (untilStep 4096 16385 1024)) (list 4096 (untilStep 8192 30721 1024)) (list 8192 (untilStep 16384 61441 4096)) (list 16384 (untilStep 32768 122881 8192)) (list 32768 (list 61440 122880 249856)) }}
      {{- $cpu := index . 0 }}
      {{- if and (not $size) (ge (mul $cpu 1000) (mul $mc 1024)) }}
      {{- range index . 1 }}{{ if and (not $size) (ge . $mib) }}{{ $size = list $cpu . }}{{ end }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Fargate task size meets both: the largest is 32 vCPU with 244 GB, and each CPU size takes a bounded range of memory, up to 120 GB at 16 vCPU and 30 GB at 4 vCPU; set infra.compute in the Release to a pair one Fargate size meets" $id $c $m) }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $cluster := optional $o "cluster" "" }}
      {{- if $scheduled }}
      {{- if not (and (typeIs "string" $cluster) (regexMatch `^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]{1,255}$` $cluster)) }}
      {{- fail (printf "the component %q starts its runs in an Amazon ECS cluster that already exists in the target account, and a schedule names the cluster by its ARN, but infra.overrides.cluster is %s: set infra.overrides.cluster in the Release to the ARN of an existing ECS cluster, such as arn:aws:ecs:us-east-1:123456789012:cluster/example" $id (toJson $cluster)) }}
      {{- end }}
      {{- else if not (and (typeIs "string" $cluster) $cluster) }}
      {{- fail (printf "the component %q runs as an Amazon ECS %s in a cluster that already exists in the target account, but infra.overrides.cluster is %s: set infra.overrides.cluster in the Release to the name or ARN of an existing ECS cluster" $id $resource (toJson $cluster)) }}
      {{- end }}
      {{- $s := optional $o "subnet_ids" "" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 16) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the component %q places its tasks in subnets of the operator's VPC, one to sixteen of them, but infra.overrides.subnet_ids is %s: set infra.overrides.subnet_ids in the Release to a list of the IDs of existing subnets" $id (toJson $s)) }}
      {{- end }}
      {{- $s = optional $o "vpc_security_groups" "" }}
      {{- $ok = and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 5) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the component %q attaches its tasks to security groups of the operator's VPC, one to five of them, which decide what reaches the tasks and what they reach, but infra.overrides.vpc_security_groups is %s: set infra.overrides.vpc_security_groups in the Release to a list of the IDs of existing security groups" $id (toJson $s)) }}
      {{- end }}
      {{- $v := optional $o "execution_role_arn" "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs its tasks under a task execution role that already exists, with which Amazon ECS pulls the image and writes the container's logs, but infra.overrides.execution_role_arn is %s: set infra.overrides.execution_role_arn in the Release to the ARN of an existing role" $id (toJson $v)) }}
      {{- end }}
      {{- $strings := list "task_role_arn" "awslogs_group" }}
      {{- if $instances }}{{ $strings = append $strings "target_group_arn" }}{{ end }}
      {{- if $scheduled }}{{ $strings = append $strings "schedule_expression_timezone" }}{{ end }}
      {{- range $k := $strings }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a non-empty string: set it in the Release to that string, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if and (hasKey $o "assign_public_ip") (not (kindIs "bool" (index $o "assign_public_ip"))) }}
      {{- fail (printf "infra.overrides.assign_public_ip of %q is %s, and this realization reads it as true or false: set it in the Release to true to give each task a public IP address, or remove it" $id (toJson (index $o "assign_public_ip"))) }}
      {{- end }}
      {{- if hasKey $o "target_group_arn" }}
      {{- if not $instances }}
      {{- fail (printf "the component %q runs as an Amazon ECS task that a schedule or the operator starts, and infra.overrides.target_group_arn names a load balancer target group for it, while Amazon ECS registers the tasks of a service with a target group and this realization runs no service, since a run ends: remove infra.overrides.target_group_arn from the Release, or realize the component as a service, as the Recipes of core/compute/server do" $id) }}
      {{- else if not $port }}
      {{- fail (printf "the component %q maps no container port, and infra.overrides.target_group_arn names a load balancer target group to register its tasks' port with, so nothing could be registered with it: remove infra.overrides.target_group_arn from the Release, or realize the component with a port, which the Recipe realizing it declares as the local container_port or its Component as infra.port, as core/compute/server does" $id) }}
      {{- end }}
      {{- end }}
      {{- $schedule := "" }}
      {{- if $scheduled }}{{ $schedule = trim (toString (optional .values "schedule" "")) }}{{ end }}
      {{- if $schedule }}
      {{- $v := optional $o "scheduler_role_arn" "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q starts its runs from an EventBridge Scheduler schedule, which calls Amazon ECS under a role that already exists, trusts the scheduler and may run the task definition, but infra.overrides.scheduler_role_arn is %s: set infra.overrides.scheduler_role_arn in the Release to the ARN of an existing role" $id (toJson $v)) }}
      {{- end }}
      {{- else if $scheduled }}
      {{- if hasKey $o "scheduler_role_arn" }}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and nothing starts a run under infra.overrides.scheduler_role_arn: each run is the one the operator starts with aws ecs run-task. Remove infra.overrides.scheduler_role_arn from the Release" $id) }}
      {{- end }}
      {{- if hasKey $o "schedule_expression_timezone" }}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and infra.overrides.schedule_expression_timezone names the time zone of nothing: remove it from the Release" $id) }}
      {{- end }}
      {{- end }}
      {{- $expression := "" }}
      {{- if $schedule }}
      {{- $refusal := "" }}
      {{- $fields := regexSplit `\s+` $schedule -1 }}
      {{- $descriptors := dict "@yearly" "0 0 1 1 *" "@annually" "0 0 1 1 *" "@monthly" "0 0 1 * *" "@weekly" "0 0 * * 0" "@daily" "0 0 * * *" "@midnight" "0 0 * * *" "@hourly" "0 * * * *" }}
      {{- if and (eq (len $fields) 1) (hasKey $descriptors (index $fields 0)) }}
      {{- $fields = regexSplit `\s+` (index $descriptors (index $fields 0)) -1 }}
      {{- end }}
      {{- if hasPrefix "@every" $schedule }}
      {{- $refusal = "@every repeats at an interval counted from a moment Kubernetes chooses, which an EventBridge Scheduler schedule cannot reproduce: write the schedule as five cron fields" }}
      {{- else if regexMatch `^(CRON_)?TZ=` (index $fields 0) }}
      {{- $refusal = "it names a time zone inside the expression, where an EventBridge Scheduler expression takes none: write the five fields alone, and name the time zone under infra.overrides in the Release" }}
      {{- else if ne (len $fields) 5 }}
      {{- $refusal = printf "it has %d fields where a cron expression has five, minute, hour, day of the month, month and day of the week: write the schedule as those five fields" (len $fields) }}
      {{- else }}
      {{- $item := `^(\*|\?|[0-9]+(-[0-9]+)?)(/[0-9]+)?$` }}
      {{- $min := index $fields 0 }}{{ $hour := index $fields 1 }}{{ $dom := index $fields 2 }}
      {{- $mon := lower (index $fields 3) }}{{ $dow := lower (index $fields 4) }}
      {{- range $i, $n := list "jan" "feb" "mar" "apr" "may" "jun" "jul" "aug" "sep" "oct" "nov" "dec" }}{{ $mon = replace $n (toString (add1 $i)) $mon }}{{ end }}
      {{- range $i, $n := list "sun" "mon" "tue" "wed" "thu" "fri" "sat" }}{{ $dow = replace $n (toString $i) $dow }}{{ end }}
      {{- $badField := "" }}{{ $badValue := "" }}
      {{- range $pair := list (list "minute" $min (index $fields 0)) (list "hour" $hour (index $fields 1)) (list "day-of-month" $dom (index $fields 2)) (list "month" $mon (index $fields 3)) (list "day-of-week" $dow (index $fields 4)) }}
      {{- range splitList "," (index $pair 1) }}
      {{- if and (not $badField) (not (regexMatch $item .)) }}{{ $badField = index $pair 0 }}{{ $badValue = index $pair 2 }}{{ end }}
      {{- end }}
      {{- end }}
      {{- $domStar := false }}{{ $dowStar := false }}
      {{- range splitList "," $dom }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $domStar = true }}{{ end }}{{ end }}
      {{- range splitList "," $dow }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $dowStar = true }}{{ end }}{{ end }}
      {{- $days := list }}{{ $dowBad := false }}
      {{- if not $badField }}
      {{- range splitList "," $dow }}
      {{- $p := splitList "/" . }}
      {{- $step := 1 }}{{ if eq (len $p) 2 }}{{ $step = atoi (index $p 1) }}{{ end }}
      {{- $lo := 0 }}{{ $hi := 6 }}
      {{- if not (has (index $p 0) (list "*" "?")) }}
      {{- $lh := splitList "-" (index $p 0) }}
      {{- $lo = atoi (index $lh 0) }}
      {{- if eq (len $lh) 2 }}{{ $hi = atoi (index $lh 1) }}{{ else if eq (len $p) 1 }}{{ $hi = $lo }}{{ end }}
      {{- end }}
      {{- if or (gt $hi 6) (gt $lo $hi) (lt $step 1) }}{{ $dowBad = true }}{{ else }}{{ range untilStep $lo (int (add1 $hi)) $step }}{{ $days = append $days (toString (add1 .)) }}{{ end }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if $badField }}
      {{- $refusal = printf "its %s field %q is not a comma list of numbers, names, ranges, steps or *, the forms Kubernetes and EventBridge Scheduler both read alike: write that field in those forms" $badField $badValue }}
      {{- else if $dowBad }}
      {{- $refusal = printf "its day-of-week field %q names a day outside 0 to 6, Sunday to Saturday, or a range running backwards, which Kubernetes refuses as well: write the days from 0 for Sunday to 6 for Saturday" (index $fields 4) }}
      {{- else if and (not $domStar) (not $dowStar) }}
      {{- $refusal = "it restricts both the day of the month and the day of the week, so a run happens on a day matching either, and an EventBridge Scheduler cron expression leaves one of the two unrestricted, so it cannot run on a day matching either: restrict one of the two fields only, and declare a second component for the other" }}
      {{- else }}
      {{- $domOut := $dom }}{{ $dowOut := "?" }}
      {{- if $domStar }}{{ $domOut = "?" }}{{ $dowOut = join "," (sortAlpha (uniq $days)) }}{{ end }}
      {{- if and $domStar $dowStar }}{{ $domOut = "*" }}{{ $dowOut = "?" }}{{ end }}
      {{- $expression = printf "cron(%s %s %s %s %s *)" (replace "?" "*" $min) (replace "?" "*" $hour) $domOut (replace "?" "*" $mon) $dowOut }}
      {{- end }}
      {{- end }}
      {{- with $refusal }}
      {{- fail (printf "the component %q is scheduled %q, and %s" $id $schedule .) }}
      {{- end }}
      {{- end }}
      config:
        name: {{ toJson $id }}
        image: {{ toJson $image }}
        {{- if $port }}
        port: {{ $port }}
        {{- end }}
        cpu: "{{ index $size 0 }}"
        memory: "{{ index $size 1 }}"
        {{- if $instances }}
        desired_count: {{ optional .infra "replicas" 1 }}
        {{- end }}
        environment: {{ toJson $env }}
        {{- with $expression }}
        schedule_expression: {{ toJson . }}
        schedule_expression_timezone: {{ toJson (optional $o "schedule_expression_timezone" "UTC") }}
        scheduler_role_arn: {{ toJson $o.scheduler_role_arn }}
        {{- end }}
        cluster: {{ toJson $o.cluster }}
        subnet_ids: {{ toJson $o.subnet_ids }}
        security_groups: {{ toJson $o.vpc_security_groups }}
        assign_public_ip: {{ optional $o "assign_public_ip" false }}
        execution_role_arn: {{ toJson $o.execution_role_arn }}
        {{- with optional $o "task_role_arn" "" }}
        task_role_arn: {{ toJson . }}
        {{- end }}
        {{- if $instances }}
        {{- with optional $o "target_group_arn" "" }}
        target_group_arn: {{ toJson . }}
        {{- end }}
        {{- end }}
        {{- with optional $o "awslogs_group" "" }}
        awslogs_group: {{ toJson . }}
        {{- end }}

    # An Amazon ECS task, for EcsFargateModule#/artifacts/Task. No count of
    # tasks is rendered, target_group_arn is refused, the cluster is named by
    # its ARN, and values.schedule, where the Component declares it and the
    # Aggregate sets it, is translated into the schedule that starts its runs.
    TaskArguments: |
      {{- $entry := "EcsFargateArguments#/mappings/TaskArguments" }}
      {{- $resource := "task" }}
      {{- $nameRule := `^[A-Za-z0-9_-]{1,64}$` }}
      {{- $nameSentence := "names its EventBridge Scheduler schedule and its Amazon ECS task definition family, and a name both take holds up to 64 letters, digits, hyphens and underscores: the scheduler takes up to 64 characters for a schedule's name, and ECS letters, digits, hyphens and underscores for a family" }}
      {{- $instances := false }}
      {{- $scheduled := true }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q %s: rename the component in the Aggregate to such a name" $id $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and an Amazon ECS %s on Fargate has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and an Amazon ECS task definition on Fargate offers no way to write a file's content into the container: the storage a Fargate task mounts is an Amazon EBS or Amazon EFS volume or a bind mount, and the task definition fills none of them. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Amazon ECS takes a container's command in place of the image's default one, which stays the image's own. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and Amazon ECS gives a task on Fargate no GPU: the Amazon ECS developer guide lists gpu among the task definition parameters not valid in Fargate tasks. Leave gpu out of the Recipe realizing the component on Amazon ECS, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- with toString (optional .locals "probe_path" "") }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and this realization declares no container health check: Amazon ECS runs one as a command inside the container, and an image this realization does not build may hold no tool to run one, while a load balancer target group's own health check is the operator's. Leave probe_path out of the Recipe realizing the component on Amazon ECS" $entry .) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $_ := set $env $name (toJson $v) }}{{ else }}{{ $_ := set $env $name (toString $v) }}{{ end }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 256 (list 512 1024 2048)) (list 512 (untilStep 1024 4097 1024)) (list 1024 (untilStep 2048 8193 1024)) (list 2048 (untilStep 4096 16385 1024)) (list 4096 (untilStep 8192 30721 1024)) (list 8192 (untilStep 16384 61441 4096)) (list 16384 (untilStep 32768 122881 8192)) (list 32768 (list 61440 122880 249856)) }}
      {{- $cpu := index . 0 }}
      {{- if and (not $size) (ge (mul $cpu 1000) (mul $mc 1024)) }}
      {{- range index . 1 }}{{ if and (not $size) (ge . $mib) }}{{ $size = list $cpu . }}{{ end }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Fargate task size meets both: the largest is 32 vCPU with 244 GB, and each CPU size takes a bounded range of memory, up to 120 GB at 16 vCPU and 30 GB at 4 vCPU; set infra.compute in the Release to a pair one Fargate size meets" $id $c $m) }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $cluster := optional $o "cluster" "" }}
      {{- if $scheduled }}
      {{- if not (and (typeIs "string" $cluster) (regexMatch `^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]{1,255}$` $cluster)) }}
      {{- fail (printf "the component %q starts its runs in an Amazon ECS cluster that already exists in the target account, and a schedule names the cluster by its ARN, but infra.overrides.cluster is %s: set infra.overrides.cluster in the Release to the ARN of an existing ECS cluster, such as arn:aws:ecs:us-east-1:123456789012:cluster/example" $id (toJson $cluster)) }}
      {{- end }}
      {{- else if not (and (typeIs "string" $cluster) $cluster) }}
      {{- fail (printf "the component %q runs as an Amazon ECS %s in a cluster that already exists in the target account, but infra.overrides.cluster is %s: set infra.overrides.cluster in the Release to the name or ARN of an existing ECS cluster" $id $resource (toJson $cluster)) }}
      {{- end }}
      {{- $s := optional $o "subnet_ids" "" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 16) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the component %q places its tasks in subnets of the operator's VPC, one to sixteen of them, but infra.overrides.subnet_ids is %s: set infra.overrides.subnet_ids in the Release to a list of the IDs of existing subnets" $id (toJson $s)) }}
      {{- end }}
      {{- $s = optional $o "vpc_security_groups" "" }}
      {{- $ok = and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 5) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the component %q attaches its tasks to security groups of the operator's VPC, one to five of them, which decide what reaches the tasks and what they reach, but infra.overrides.vpc_security_groups is %s: set infra.overrides.vpc_security_groups in the Release to a list of the IDs of existing security groups" $id (toJson $s)) }}
      {{- end }}
      {{- $v := optional $o "execution_role_arn" "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs its tasks under a task execution role that already exists, with which Amazon ECS pulls the image and writes the container's logs, but infra.overrides.execution_role_arn is %s: set infra.overrides.execution_role_arn in the Release to the ARN of an existing role" $id (toJson $v)) }}
      {{- end }}
      {{- $strings := list "task_role_arn" "awslogs_group" }}
      {{- if $instances }}{{ $strings = append $strings "target_group_arn" }}{{ end }}
      {{- if $scheduled }}{{ $strings = append $strings "schedule_expression_timezone" }}{{ end }}
      {{- range $k := $strings }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a non-empty string: set it in the Release to that string, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if and (hasKey $o "assign_public_ip") (not (kindIs "bool" (index $o "assign_public_ip"))) }}
      {{- fail (printf "infra.overrides.assign_public_ip of %q is %s, and this realization reads it as true or false: set it in the Release to true to give each task a public IP address, or remove it" $id (toJson (index $o "assign_public_ip"))) }}
      {{- end }}
      {{- if hasKey $o "target_group_arn" }}
      {{- if not $instances }}
      {{- fail (printf "the component %q runs as an Amazon ECS task that a schedule or the operator starts, and infra.overrides.target_group_arn names a load balancer target group for it, while Amazon ECS registers the tasks of a service with a target group and this realization runs no service, since a run ends: remove infra.overrides.target_group_arn from the Release, or realize the component as a service, as the Recipes of core/compute/server do" $id) }}
      {{- else if not $port }}
      {{- fail (printf "the component %q maps no container port, and infra.overrides.target_group_arn names a load balancer target group to register its tasks' port with, so nothing could be registered with it: remove infra.overrides.target_group_arn from the Release, or realize the component with a port, which the Recipe realizing it declares as the local container_port or its Component as infra.port, as core/compute/server does" $id) }}
      {{- end }}
      {{- end }}
      {{- $schedule := "" }}
      {{- if $scheduled }}{{ $schedule = trim (toString (optional .values "schedule" "")) }}{{ end }}
      {{- if $schedule }}
      {{- $v := optional $o "scheduler_role_arn" "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q starts its runs from an EventBridge Scheduler schedule, which calls Amazon ECS under a role that already exists, trusts the scheduler and may run the task definition, but infra.overrides.scheduler_role_arn is %s: set infra.overrides.scheduler_role_arn in the Release to the ARN of an existing role" $id (toJson $v)) }}
      {{- end }}
      {{- else if $scheduled }}
      {{- if hasKey $o "scheduler_role_arn" }}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and nothing starts a run under infra.overrides.scheduler_role_arn: each run is the one the operator starts with aws ecs run-task. Remove infra.overrides.scheduler_role_arn from the Release" $id) }}
      {{- end }}
      {{- if hasKey $o "schedule_expression_timezone" }}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and infra.overrides.schedule_expression_timezone names the time zone of nothing: remove it from the Release" $id) }}
      {{- end }}
      {{- end }}
      {{- $expression := "" }}
      {{- if $schedule }}
      {{- $refusal := "" }}
      {{- $fields := regexSplit `\s+` $schedule -1 }}
      {{- $descriptors := dict "@yearly" "0 0 1 1 *" "@annually" "0 0 1 1 *" "@monthly" "0 0 1 * *" "@weekly" "0 0 * * 0" "@daily" "0 0 * * *" "@midnight" "0 0 * * *" "@hourly" "0 * * * *" }}
      {{- if and (eq (len $fields) 1) (hasKey $descriptors (index $fields 0)) }}
      {{- $fields = regexSplit `\s+` (index $descriptors (index $fields 0)) -1 }}
      {{- end }}
      {{- if hasPrefix "@every" $schedule }}
      {{- $refusal = "@every repeats at an interval counted from a moment Kubernetes chooses, which an EventBridge Scheduler schedule cannot reproduce: write the schedule as five cron fields" }}
      {{- else if regexMatch `^(CRON_)?TZ=` (index $fields 0) }}
      {{- $refusal = "it names a time zone inside the expression, where an EventBridge Scheduler expression takes none: write the five fields alone, and name the time zone under infra.overrides in the Release" }}
      {{- else if ne (len $fields) 5 }}
      {{- $refusal = printf "it has %d fields where a cron expression has five, minute, hour, day of the month, month and day of the week: write the schedule as those five fields" (len $fields) }}
      {{- else }}
      {{- $item := `^(\*|\?|[0-9]+(-[0-9]+)?)(/[0-9]+)?$` }}
      {{- $min := index $fields 0 }}{{ $hour := index $fields 1 }}{{ $dom := index $fields 2 }}
      {{- $mon := lower (index $fields 3) }}{{ $dow := lower (index $fields 4) }}
      {{- range $i, $n := list "jan" "feb" "mar" "apr" "may" "jun" "jul" "aug" "sep" "oct" "nov" "dec" }}{{ $mon = replace $n (toString (add1 $i)) $mon }}{{ end }}
      {{- range $i, $n := list "sun" "mon" "tue" "wed" "thu" "fri" "sat" }}{{ $dow = replace $n (toString $i) $dow }}{{ end }}
      {{- $badField := "" }}{{ $badValue := "" }}
      {{- range $pair := list (list "minute" $min (index $fields 0)) (list "hour" $hour (index $fields 1)) (list "day-of-month" $dom (index $fields 2)) (list "month" $mon (index $fields 3)) (list "day-of-week" $dow (index $fields 4)) }}
      {{- range splitList "," (index $pair 1) }}
      {{- if and (not $badField) (not (regexMatch $item .)) }}{{ $badField = index $pair 0 }}{{ $badValue = index $pair 2 }}{{ end }}
      {{- end }}
      {{- end }}
      {{- $domStar := false }}{{ $dowStar := false }}
      {{- range splitList "," $dom }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $domStar = true }}{{ end }}{{ end }}
      {{- range splitList "," $dow }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $dowStar = true }}{{ end }}{{ end }}
      {{- $days := list }}{{ $dowBad := false }}
      {{- if not $badField }}
      {{- range splitList "," $dow }}
      {{- $p := splitList "/" . }}
      {{- $step := 1 }}{{ if eq (len $p) 2 }}{{ $step = atoi (index $p 1) }}{{ end }}
      {{- $lo := 0 }}{{ $hi := 6 }}
      {{- if not (has (index $p 0) (list "*" "?")) }}
      {{- $lh := splitList "-" (index $p 0) }}
      {{- $lo = atoi (index $lh 0) }}
      {{- if eq (len $lh) 2 }}{{ $hi = atoi (index $lh 1) }}{{ else if eq (len $p) 1 }}{{ $hi = $lo }}{{ end }}
      {{- end }}
      {{- if or (gt $hi 6) (gt $lo $hi) (lt $step 1) }}{{ $dowBad = true }}{{ else }}{{ range untilStep $lo (int (add1 $hi)) $step }}{{ $days = append $days (toString (add1 .)) }}{{ end }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if $badField }}
      {{- $refusal = printf "its %s field %q is not a comma list of numbers, names, ranges, steps or *, the forms Kubernetes and EventBridge Scheduler both read alike: write that field in those forms" $badField $badValue }}
      {{- else if $dowBad }}
      {{- $refusal = printf "its day-of-week field %q names a day outside 0 to 6, Sunday to Saturday, or a range running backwards, which Kubernetes refuses as well: write the days from 0 for Sunday to 6 for Saturday" (index $fields 4) }}
      {{- else if and (not $domStar) (not $dowStar) }}
      {{- $refusal = "it restricts both the day of the month and the day of the week, so a run happens on a day matching either, and an EventBridge Scheduler cron expression leaves one of the two unrestricted, so it cannot run on a day matching either: restrict one of the two fields only, and declare a second component for the other" }}
      {{- else }}
      {{- $domOut := $dom }}{{ $dowOut := "?" }}
      {{- if $domStar }}{{ $domOut = "?" }}{{ $dowOut = join "," (sortAlpha (uniq $days)) }}{{ end }}
      {{- if and $domStar $dowStar }}{{ $domOut = "*" }}{{ $dowOut = "?" }}{{ end }}
      {{- $expression = printf "cron(%s %s %s %s %s *)" (replace "?" "*" $min) (replace "?" "*" $hour) $domOut (replace "?" "*" $mon) $dowOut }}
      {{- end }}
      {{- end }}
      {{- with $refusal }}
      {{- fail (printf "the component %q is scheduled %q, and %s" $id $schedule .) }}
      {{- end }}
      {{- end }}
      config:
        name: {{ toJson $id }}
        image: {{ toJson $image }}
        {{- if $port }}
        port: {{ $port }}
        {{- end }}
        cpu: "{{ index $size 0 }}"
        memory: "{{ index $size 1 }}"
        {{- if $instances }}
        desired_count: {{ optional .infra "replicas" 1 }}
        {{- end }}
        environment: {{ toJson $env }}
        {{- with $expression }}
        schedule_expression: {{ toJson . }}
        schedule_expression_timezone: {{ toJson (optional $o "schedule_expression_timezone" "UTC") }}
        scheduler_role_arn: {{ toJson $o.scheduler_role_arn }}
        {{- end }}
        cluster: {{ toJson $o.cluster }}
        subnet_ids: {{ toJson $o.subnet_ids }}
        security_groups: {{ toJson $o.vpc_security_groups }}
        assign_public_ip: {{ optional $o "assign_public_ip" false }}
        execution_role_arn: {{ toJson $o.execution_role_arn }}
        {{- with optional $o "task_role_arn" "" }}
        task_role_arn: {{ toJson . }}
        {{- end }}
        {{- if $instances }}
        {{- with optional $o "target_group_arn" "" }}
        target_group_arn: {{ toJson . }}
        {{- end }}
        {{- end }}
        {{- with optional $o "awslogs_group" "" }}
        awslogs_group: {{ toJson . }}
        {{- end }}
