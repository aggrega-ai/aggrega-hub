      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 1 512 4096) (list 2 512 8192) (list 4 2048 16384) (list 6 4096 24576) (list 8 4096 32768) }}
      {{- if and (not $size) (ge (mul (index . 0) 1000) (max $mc (index $floor 0))) (ge (index . 2) (max $mib (index $floor 1))) }}
      {{- $size = list (index . 0) (max (index . 1) $mib (index $floor 1)) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- $with := "" }}
      {{- if $gpu }}{{ $with = printf ", and its GPU, %s, needs at least %d vCPU with %d GiB" $gpu (div (index $floor 0) 1000) (div (index $floor 1) 1024) }}{{ end }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q%s, and no Cloud Run size meets that: the largest is 8 vCPU with 32 GiB, and each CPU size takes a bounded range of memory, up to 4 GiB at 1 vCPU, 8 GiB at 2, 16 GiB at 4 and 24 GiB at 6; set infra.compute in the Release to a pair one size meets" $id $c $m $with) }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- range $k := list "project_id" "region" "private_network" "service_account" }}
      {{- $v := optional $o $k "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs as a Cloud Run %s in the operator's own Google Cloud project, region and VPC network, as a service account that already exists, and this realization never chooses any of them, but infra.overrides.%s carries none: set infra.overrides.project_id, infra.overrides.region, infra.overrides.private_network and infra.overrides.service_account in the Release" $id $resource $k) }}
      {{- end }}
      {{- end }}
      {{- if not (regexMatch `^projects/[^/]+/global/networks/[^/]+$` $o.private_network) }}
      {{- fail (printf "infra.overrides.private_network of %q is %q, and this realization takes the VPC network the Cloud Run %s reaches private addresses through as the network's resource link: set it to projects/<project>/global/networks/<name>" $id $o.private_network $resource) }}
      {{- end }}
      {{- if hasKey $o "subnetwork" }}
      {{- $v := index $o "subnetwork" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.subnetwork of %q is %s, and this realization reads it as the name or resource link of an existing subnet of infra.overrides.private_network: set it in the Release to that string, or remove it to use the subnet named as the network" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "network_tags" }}
      {{- $s := index $o "network_tags" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.network_tags of %q is %s, and this realization reads it as a list of network tag names: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- if and (hasKey $o "deletion_protection") (not (kindIs "bool" (index $o "deletion_protection"))) }}
      {{- fail (printf "infra.overrides.deletion_protection of %q is %s, and this realization reads it as true or false: set it in the Release to false to let Terraform destroy the Cloud Run %s, or remove it" $id (toJson (index $o "deletion_protection")) $resource) }}
      {{- end }}
      config:
        project_id: {{ toJson $o.project_id }}
        location: {{ toJson $o.region }}
        name: {{ toJson $id }}
        image: {{ toJson $image }}
        {{- if $port }}
        port: {{ $port }}
        {{- end }}
        cpu: "{{ index $size 0 }}"
        memory: "{{ index $size 1 }}Mi"
        {{- if $instances }}
        manual_instance_count: {{ optional .infra "replicas" 1 }}
        {{- end }}
        environment: {{ toJson $env }}
        service_account: {{ toJson $o.service_account }}
        network: {{ toJson $o.private_network }}
        {{- with optional $o "subnetwork" "" }}
        subnetwork: {{ toJson . }}
        {{- end }}
        {{- with optional $o "network_tags" "" }}
        tags: {{ toJson . }}
        {{- end }}
        {{- if kindIs "bool" (optional $o "deletion_protection" "") }}
        deletion_protection: {{ $o.deletion_protection }}
        {{- end }}
        {{- with $files }}
        files: {{ toJson . }}
        {{- end }}
        {{- with $probe }}
        probe_path: {{ toJson . }}
        {{- end }}
        {{- with $gpu }}
        gpu: {{ toJson (dict "count" 1 "type" .) }}
        {{- end }}
        {{- if $scheduled }}
        {{- with toString (optional .values "schedule" "") }}
        schedule: {{ toJson . }}
        {{- end }}
        {{- end }}

    # A Cloud Run job, for CloudRunModule#/artifacts/Job. Cloud Run sets
    # CLOUD_RUN_JOB, CLOUD_RUN_EXECUTION, CLOUD_RUN_TASK_INDEX,
    # CLOUD_RUN_TASK_ATTEMPT and CLOUD_RUN_TASK_COUNT in every job itself. A
    # port is read only for the startup probe, no instance count is rendered,
