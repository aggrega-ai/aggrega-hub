apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: CloudRunArguments
  version: 1.0.0
  description: >
    The config every Cloud Run Recipe hands the body it imports from
    CloudRunModule, with the container's environment and the refusals, held
    once: ServiceArguments for the Service body, WorkerPoolArguments for
    WorkerPool and JobArguments for Job. A Recipe consumes one with
    `valuesMapping: { $import: CloudRunArguments#/mappings/ServiceArguments }`;
    the import replaces the whole valuesMapping.

    Each entry names the resource after the component, places it in the
    operator's project, region, VPC network and service account from
    infra.overrides, sizes it from infra.compute, and delivers env entries as
    variables and file entries as files, refusing by name what Cloud Run
    cannot take. What differs between importers is read from the locals each
    declares: a default image, the container's port, the variable each own
    value and each socket's connections are delivered as by default, a probe
    path and a GPU.
spec:
  mappings:
    # The three entries. Each renders one key, config, the one argument of the
    # importing component's module block in the boundary's root configuration,
    # which the fixed pass-through hands to the body; the names inside config
    # are the body's, documented in CloudRunModule. Each stops the build,
    # naming what to change, before config is written when an input cannot be
    # one Cloud Run takes. The three are one template below their opening
    # lines, which set what differs between a service, a worker pool and a
    # job: the entry's name, the resource's word, the name rule, the variables
    # Cloud Run sets itself, whether a port is required, whether an instance
    # count is rendered and whether a schedule is; a change to one is made to
    # all three.
    #
    # What the importing Recipe declares, as its locals, each optional; a
    # local the Recipe does not declare reads as empty here rather than
    # stopping the build:
    #   default_image   the image the component runs while infra.image is
    #                   unset; a Recipe running the Release's own code
    #                   declares none, so the Release names the image;
    #   container_port  the port the container listens on; while it is not
    #                   declared, infra.port, where the Component declares
    #                   one. A service requires one of the two; a worker pool
    #                   or a job uses it only for its probes;
    #   value_env       a JSON object mapping each own value the Recipe
    #                   delivers by default, values.<key>, to the variable it
    #                   is delivered as;
    #   socket_env      a JSON object mapping each socket whose connections
    #                   the Recipe delivers by default to an object mapping
    #                   each variable to the key of the target's provides it
    #                   carries. Locals cannot read connections, so the
    #                   names travel as this table, read here with fromJson;
    #   probe_path      the HTTP path the container's probes request, on
    #                   the container's port: a startup and a liveness probe
    #                   on a service and a worker pool, a startup probe on a
    #                   job. While it is not declared, no probe is rendered,
    #                   and a service keeps Cloud Run's default startup probe;
    #   gpu             {"count": 1, "type": <accelerator>}, one GPU of the
    #                   accelerator nvidia-l4 or nvidia-rtx-pro-6000. Cloud
    #                   Run gives an instance one GPU and requires at least 4
    #                   vCPU with 16 GiB beside an nvidia-l4 and 20 vCPU with
    #                   80 GiB beside an nvidia-rtx-pro-6000, so the
    #                   container is sized to at least that, and no size this
    #                   entry chooses reaches the second.
    #
    # The name. The resource is named after the component, so the name is
    # checked here against what Cloud Run takes: for a service and a worker
    # pool, a name beginning with a lowercase letter, of lowercase letters,
    # digits and hyphens, not ending with a hyphen and fewer than 50
    # characters long; for a job, the same with the bound of 63 characters
    # Cloud Run's job reference gives.
    #
    # The environment. Every env entry on the inject pipe — dictated by a
    # connection's inject block, by the component's own inject block or by an
    # attachment — becomes one variable of the container, under the name it
    # was dictated as, its value written whole, so a Terraform reference a
    # neighbour publishes, such as ${module.db.private_ip_address}, reaches
    # the root configuration as an interpolation the engine evaluates there,
    # where the neighbour's module is declared. Then the defaults:
    #   - each connection on a socket socket_env names, while that connection
    #     dictates nothing, delivers each variable of its table carrying the
    #     key the target publishes; a target publishing no such key, two such
    #     connections setting one variable, and a variable another source
    #     dictates as well each halt, naming both;
    #   - each own value value_env names is delivered under its variable
    #     while the Aggregate sets it and no entry of the component's own
    #     inject block, in any mechanism, delivers it — the template reads
    #     that at .context.self_inject, which maps each name the developer
    #     wrote to values.<key> for an entry reading that one own value — and
    #     a list or a map is written as its JSON text; a variable another
    #     source delivers as well halts, naming both.
    # Cloud Run sets some variables itself and refuses a configuration
    # naming one, or a name holding = or beginning X_GOOGLE_, so a variable
    # under such a name halts here, naming who dictated it.
    #
    # DELIBERATE NEAR-DUPLICATE of the environment assembly each other
    # target's container Recipes hold, in their own values mapping or in the
    # shared arguments they import, and of the reading of .context.self_inject
    # every Recipe that reads it declares: the same steps, save the variables
    # each target reserves and the mechanisms it delivers. It is part of a
    # values mapping, and no catalog kind composes part of a template into
    # another; a change to it is made to all of them.
    #
    # Files. Every file entry on the pipe is mounted at the path it was
    # dictated at, as CloudRunModule describes: a secret volume of its own at
    # the file's directory, holding the one file. A path that is not absolute
    # or not written plainly, a path lying beneath another file's, a directory
    # Cloud Run mounts no volume at (/dev, /proc and /sys and beneath them, a
    # path holding a colon, and /, where a volume would hide the whole image),
    # and two files in one directory, where Cloud Run would mount two volumes
    # at one path, each halt, naming the file. Every other mechanism is
    # refused, naming the entry, its mechanism and who dictated it: an arg
    # entry, because no command line is rendered, and Cloud Run takes a
    # container's arguments in place of the image's default command; and any
    # custom mechanism.
    #
    # The size. The container runs at the first whole-vCPU size meeting the
    # CPU and the memory infra.compute asks for, each a floor, with that
    # memory or the size's least, read off the vCPU and memory table of Cloud
    # Run's "Configure CPU limits" pages for services and worker pools: 1 vCPU
    # with 512 MiB to 4 GiB, 2 with 512 MiB to 8 GiB, 4 with 2 to 16 GiB, 6
    # with 4 to 24 GiB and 8 with 4 to 32 GiB. No size below 1 vCPU is chosen:
    # Cloud Run runs one only in the first-generation environment with one
    # request at a time, which would change how the container serves rather
    # than its size. A size the table adds later is not chosen until it is
    # listed here. A quantity this entry cannot read, and a pair no size
    # meets, halt naming it.
    #
    # infra.overrides is read for project_id, region, private_network and
    # service_account, each required and a string, private_network as
    # projects/<project>/global/networks/<name>; subnetwork, a string;
    # network_tags, a list of strings; and deletion_protection, true or
    # false. infra.published_port, a Docker Compose setting, halts, and
    # infra.replicas is a service's and a worker pool's instance count, 1
    # where the Component declares none.

    # A Cloud Run service, for CloudRunModule#/artifacts/Service. Cloud Run
    # sets PORT, K_SERVICE, K_REVISION and K_CONFIGURATION in every service
    # itself. The container's port is required, and infra.replicas is the
    # service's instance count.
    ServiceArguments: |
      {{- $entry := "CloudRunArguments#/mappings/ServiceArguments" }}
      {{- $resource := "service" }}
      {{- $nameRule := `^[a-z]([-a-z0-9]{0,47}[a-z0-9])?$` }}
      {{- $nameSentence := "Cloud Run takes a name that begins with a lowercase letter, holds lowercase letters, digits and hyphens, does not end with a hyphen and is fewer than 50 characters long" }}
      {{- $reserved := list "PORT" "K_SERVICE" "K_REVISION" "K_CONFIGURATION" }}
      {{- $reservedSentence := "it sets PORT, K_SERVICE, K_REVISION and K_CONFIGURATION in every service itself" }}
      {{- $portRequired := true }}
      {{- $instances := true }}
      {{- $scheduled := false }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Cloud Run %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and a Cloud Run %s has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env" "file")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Cloud Run takes a container's arguments in place of the image's default command, which stays the image's own. Dictate the value as an env or a file entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $files := optional $inject "file" dict }}
      {{- $dirs := dict }}
      {{- range $path, $_ := $files }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject "file" dict) $path }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "file" dict) $path }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if or (not (hasPrefix "/" $path)) (ne (clean $path) $path) }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and a file is written at an absolute path inside the container, written plainly: write that path in the inject block starting with /, with no . or .. part and no doubled or trailing /" $id $path $by) }}
      {{- end }}
      {{- range $other, $_ := $files }}
      {{- if hasPrefix (printf "%s/" $path) $other }}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $id $path $other) }}
      {{- end }}
      {{- end }}
      {{- $dir := dir $path }}
      {{- if or (eq $dir "/") (regexMatch `^/(dev|proc|sys)(/|$)` $dir) (contains ":" $dir) }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and Cloud Run mounts a file as a secret volume at its directory, %s, but it mounts no volume at /dev, /proc or /sys or beneath them, nor at a path holding a colon, and a volume at / would hide the whole image: dictate the file at a path in another directory" $id $path $by $dir) }}
      {{- end }}
      {{- if hasKey $dirs $dir }}
      {{- fail (printf "the component %q is handed a file at %q and another at %q, and Cloud Run mounts each file as a secret volume of its own at the file's directory, %s, and mounts no two volumes at one path: dictate the two files in different directories" $id (index $dirs $dir) $path $dir) }}
      {{- end }}
      {{- $_ := set $dirs $dir $path }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $gpu := "" }}
      {{- $floor := list 0 0 }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- $g := fromJson . }}
      {{- $floors := dict "nvidia-l4" (list 4000 16384) "nvidia-rtx-pro-6000" (list 20000 81920) }}
      {{- if not (and (kindIs "map" $g) (eq (len $g) 2) (eq (toString (optional $g "count" "")) "1") (hasKey $floors (toString (optional $g "type" "")))) }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and this entry reads it as {\"count\": 1, \"type\": <accelerator>}, the accelerator nvidia-l4 or nvidia-rtx-pro-6000: Cloud Run gives an instance one GPU, and those are the accelerators whose least CPU and memory this entry sizes the container to. Declare it so, or leave it out for no GPU" $entry .) }}
      {{- end }}
      {{- $gpu = toString $g.type }}
      {{- $floor = index $floors $gpu }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- if and $portRequired (not $port) }}
      {{- fail (printf "the component %q runs as a Cloud Run %s, which sends requests to the container's port, and neither the local container_port of the Recipe realizing it nor infra.port names one: the Recipe importing %s declares container_port, or its Component declares infra.port" $id $resource $entry) }}
      {{- end }}
      {{- $probe := toString (optional .locals "probe_path" "") }}
      {{- if and $probe (not (hasPrefix "/" $probe)) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a probe requests an HTTP path, which begins with /: declare it so, or leave it out for no probe" $entry $probe) }}
      {{- end }}
      {{- if and $probe (not $port) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a Cloud Run %s's container declares no port of its own, so the probe has no port to request it on: declare the local container_port as the port the container answers it on" $entry $probe $resource) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $_ := set $env $name (toJson $v) }}{{ else }}{{ $_ := set $env $name (toString $v) }}{{ end }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- range $k, $_ := $env }}
      {{- if or (has $k $reserved) (contains "=" $k) (hasPrefix "X_GOOGLE_" $k) }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and Cloud Run refuses it: %s, and takes no name holding = or beginning X_GOOGLE_. Rename the variable where it is dictated" $id $k (index $source $k) $reservedSentence) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 1 512 4096) (list 2 512 8192) (list 4 2048 16384) (list 6 4096 24576) (list 8 4096 32768) }}
      {{- if and (not $size) (ge (mul (index . 0) 1000) (max $mc (index $floor 0))) (ge (index . 2) (max $mib (index $floor 1))) }}
      {{- $size = list (index . 0) (max (index . 1) $mib (index $floor 1)) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- $with := "" }}
      {{- if $gpu }}{{ $with = printf ", and its GPU, %s, needs at least %d vCPU with %d GiB" $gpu (div (index $floor 0) 1000) (div (index $floor 1) 1024) }}{{ end }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q%s, and no Cloud Run size meets that: the largest is 8 vCPU with 32 GiB, and each CPU size takes a bounded range of memory, up to 4 GiB at 1 vCPU, 8 GiB at 2, 16 GiB at 4 and 24 GiB at 6; set infra.compute in the Release to a pair one size meets" $id $c $m $with) }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- range $k := list "project_id" "region" "private_network" "service_account" }}
      {{- $v := optional $o $k "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs as a Cloud Run %s in the operator's own Google Cloud project, region and VPC network, as a service account that already exists, and this realization never chooses any of them, but infra.overrides.%s carries none: set infra.overrides.project_id, infra.overrides.region, infra.overrides.private_network and infra.overrides.service_account in the Release" $id $resource $k) }}
      {{- end }}
      {{- end }}
      {{- if not (regexMatch `^projects/[^/]+/global/networks/[^/]+$` $o.private_network) }}
      {{- fail (printf "infra.overrides.private_network of %q is %q, and this realization takes the VPC network the Cloud Run %s reaches private addresses through as the network's resource link: set it to projects/<project>/global/networks/<name>" $id $o.private_network $resource) }}
      {{- end }}
      {{- if hasKey $o "subnetwork" }}
      {{- $v := index $o "subnetwork" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.subnetwork of %q is %s, and this realization reads it as the name or resource link of an existing subnet of infra.overrides.private_network: set it in the Release to that string, or remove it to use the subnet named as the network" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "network_tags" }}
      {{- $s := index $o "network_tags" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.network_tags of %q is %s, and this realization reads it as a list of network tag names: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- if and (hasKey $o "deletion_protection") (not (kindIs "bool" (index $o "deletion_protection"))) }}
