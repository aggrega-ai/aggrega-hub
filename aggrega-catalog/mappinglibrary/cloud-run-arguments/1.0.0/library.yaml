        {{- end }}

    # A Cloud Run worker pool, for CloudRunModule#/artifacts/WorkerPool. Cloud
    # Run sets CLOUD_RUN_WORKER_POOL and CLOUD_RUN_REVISION in every worker
    # pool itself. A port is read only for the probes, and infra.replicas is
    # the worker pool's instance count.
    WorkerPoolArguments: |
      {{- $entry := "CloudRunArguments#/mappings/WorkerPoolArguments" }}
      {{- $resource := "worker pool" }}
      {{- $nameRule := `^[a-z]([-a-z0-9]{0,47}[a-z0-9])?$` }}
      {{- $nameSentence := "Cloud Run takes a name that begins with a lowercase letter, holds lowercase letters, digits and hyphens, does not end with a hyphen and is fewer than 50 characters long" }}
      {{- $reserved := list "CLOUD_RUN_WORKER_POOL" "CLOUD_RUN_REVISION" }}
      {{- $reservedSentence := "it sets CLOUD_RUN_WORKER_POOL and CLOUD_RUN_REVISION in every worker pool itself" }}
      {{- $portRequired := false }}
      {{- $instances := true }}
      {{- $scheduled := false }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Cloud Run %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
