apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: ContainerAppParameters
  version: 1.0.0
  description: >
    The parameters every Azure Container Apps Recipe on Azure Resource
    Manager binds in the Azure Verified Modules module it sources, with the
    container's environment and the refusals, held once: AppParameters for
    avm/res/app/container-app and JobParameters for avm/res/app/job. A
    Recipe consumes one with `valuesMapping: { $import:
    ContainerAppParameters#/mappings/AppParameters }`; the import replaces
    the whole valuesMapping.

    The provider wraps the module in one nested deployment, and the entry
    binds its parameters so that it creates the app or the job and nothing
    else: telemetry is turned off, and the module's lock, role assignments,
    diagnostic settings and authentication settings are left unbound, so
    none is deployed. The app or job is named after the component and runs
    in the operator's Container Apps environment, in its region, with the
    operator's identities, registry and Key Vault secrets, at a Consumption
    size meeting infra.compute; env entries become its variables, and what
    this realization cannot take is refused by name. What differs between
    importers is read from the locals each declares: a default image, the
    container's port, the variable each own value and each socket's
    connections are delivered as by default, and a probe path.

    This realization sets a deadline on each execution of a job, because
    Container Apps requires a replica timeout of every job, one of the job
    settings its "Jobs in Azure Container Apps" page lists:
    infra.overrides.replica_timeout_in_seconds where the Release sets it, and
    30 minutes otherwise.
spec:
  mappings:
    # The entries. Each renders the parameters of the module the importing
    # Recipe sources, under the module's own names, which the provider binds
    # in the nested deployment it wraps the module in. Each stops the build,
    # naming what to change, before a parameter is written when an input
    # cannot be one this realization takes. They are one template below
    # their opening lines, which set what differs between an app and a job:
    # the entry's name, the resource's word, the word for its secrets, the
    # name rule and its sentence, the variables Container Apps sets itself,
    # whether it is an app, which takes a replica count, an ingress and
    # readiness and liveness probes, or a job, which takes a trigger and a
    # replica timeout, and the form its module takes the CPU in; a change to
    # one is made to every one of them.
    #
    # What the importing Recipe declares, as its locals, each optional; a
    # local the Recipe does not declare reads as empty here rather than
    # stopping the build:
    #   default_image   the image the component runs while infra.image is
    #                   unset; a Recipe running the Release's own code
    #                   declares none, so the Release names the image;
    #   container_port  the port the container listens on; while it is not
    #                   declared, infra.port, where the Component declares
    #                   one. An app listening on a port has internal ingress
    #                   to it and a readiness probe on it; an app listening
    #                   on none has no ingress, and a job uses the port only
    #                   for its probe;
    #   value_env       a JSON object mapping each own value the Recipe
    #                   delivers by default, values.<key>, to the variable it
    #                   is delivered as;
    #   socket_env      a JSON object mapping each socket whose connections
    #                   the Recipe delivers by default to an object mapping
    #                   each variable to the key of the target's provides it
    #                   carries. Locals cannot read connections, so the
    #                   names travel as this table, read here with fromJson;
    #   probe_path      the HTTP path the container's probes request, on the
    #                   container's port, which is then required: a startup,
    #                   a readiness and a liveness probe on an app, a startup
    #                   probe on a job. While it is not declared, an app with
    #                   a port keeps a readiness probe opening a TCP
    #                   connection to it, and no other probe is rendered;
    #   gpu             refused where it is declared: this realization runs
    #                   every app and job on its environment's Consumption
    #                   workload profile, which gives a container no GPU, and
    #                   names no GPU workload profile of the operator's.
    #
    # The name. The app or job is named after the component, so the name is
    # checked here: 2 to 32 lowercase letters, digits and hyphens that begins
    # with a letter and ends with a letter or a digit, the rule Microsoft's
    # naming rules for Azure resources state for a container app. For a job
    # it is a rule this realization chooses: those naming rules state none for
    # a job, so a job's name is held to the app's. A doubled hyphen never
    # reaches it: the build writes one in a component's name out as -zh-.
    #
    # The environment. Every env entry on the inject pipe — dictated by a
    # connection's inject block, by the component's own inject block or by an
    # attachment — becomes one variable of the container, under the name it
    # was dictated as, its value written whole, so a neighbour's Azure
    # Resource Manager expression, such as the address a database publishes,
    # reaches the template as an expression evaluated where the neighbour's
    # resource is declared, and a neighbour's value written inside literal
    # text, such as postgres://<value>:5432, is written by the provider as a
    # format() expression. Then the defaults:
    #   - each connection on a socket socket_env names, while that connection
    #     dictates nothing, delivers each variable of its table carrying the
    #     key the target publishes; a target publishing no such key, two such
    #     connections setting one variable, and a variable another source
    #     dictates as well each halt, naming both;
    #   - each own value value_env names is delivered under its variable
    #     while it has a value, set in the Aggregate or defaulted by the
    #     Component, and no entry of the component's own inject block, in any
    #     mechanism, delivers it — the template reads that at
    #     .context.self_inject, which maps each name the developer wrote to
    #     values.<key> for an entry reading that one own value — and a list or
    #     a map is written as its JSON text; a variable another source
    #     delivers as well halts, naming both. An own value is text, never an
    #     expression, so one opening with [ and closing with ], which Azure
    #     Resource Manager would read as an expression, is written opening
    #     with [[, which it reads as a single literal [.
    # Container Apps sets variables of its own in every app and every job, as
    # its "Manage environment variables" page lists under "Built-in
    # environment variables", so a variable under one of those names halts
    # here, naming who dictated it.
    #
    # DELIBERATE NEAR-DUPLICATE of the environment assembly each other
    # target's container Recipes hold, in their own values mapping or in the
    # shared arguments they import, and of the reading of .context.self_inject
    # every Recipe that reads it declares: the same steps, save the variables
    # each target reserves, the mechanisms it delivers and the escaping of a
    # literal [ above, where the Terraform arguments escape a ${ instead.
    # ContainerAppArguments, CloudRunArguments and EcsFargateArguments also
    # read value_env, socket_env, container_port, default_image and the
    # quantities infra.compute asks for in the same lines as this entry. It is
    # part of a values mapping, and no catalog kind composes part of a
    # template into another; a change to it is made to all of them.
    #
    # A value declared sensitive. The entry reads the inject pipe and each
    # connection, and is marked as reading a sensitive value when its output
    # depends on one: when an inject block, the component's own or a
    # connection's, delivers a value declared sensitive into a variable, the
    # provider refuses every literal the entry produces and the build halts
    # naming the parameters, rather than write the value into the template as
    # text. A connection whose target publishes such a value that nothing
    # delivers builds. The route for such a credential is Key Vault: store it there, name it under
    # infra.overrides.secrets, and drop the delivery from the inject block, so
    # the container reads it through a secret by secretRef.
    #
    # Files and other mechanisms. This realization delivers env entries alone,
    # and every other entry on the pipe halts, naming the entry, its mechanism
    # and who dictated it, so none is dropped: a file entry, because its
    # content would reach the container as the value of a secret of the app
    # or job, which the template would carry as text; an arg entry, because no
    # command line is rendered, and Container Apps passes a container's
    # arguments to its startup command in place of the image's default ones;
    # and any custom mechanism.
    #
    # Secrets. infra.overrides.secrets is how a credential reaches the
    # container: a map from the name of a container variable to an entry
    # holding origin, the resource ID of the Key Vault secret,
    # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<name>,
    # the value core/referenced-secret takes under the same name on arm, and
    # identity, the user-assigned identity Container Apps reads it with,
    # which needs read access to that secret. Each entry becomes one secret of
    # the app or job, named after the variable in lowercase with each
    # underscore a hyphen, whose keyVaultUrl is
    # [format('https://{0}{1}/secrets/{2}', '<vault>', environment().suffixes.keyvaultDns, '<name>')],
    # so the vault's address is the one of the cloud the template deploys to
    # and Container Apps reads the secret's latest version; the variable names
    # that secret with secretRef, and the value never passes through the
    # Release or the template. An entry naming its variable outside letters,
    # digits, underscores and hyphens, or under a name Container Apps sets
    # itself, an entry setting value or any key beyond origin and identity, an
    # origin or an identity of another form, two entries naming one secret or
    # one naming the registry password's, and a variable both delivered and
    # named in secrets, halt. The vault's and the secret's names are written
    # inside the keyVaultUrl expression, so each holds only the characters Key
    # Vault names take: 3 to 24 letters, digits and hyphens for a vault, 1 to
    # 127 for a secret.
    #
    # Identities and the registry. The app or job is given the user-assigned
    # identities identity_ids names, and every identity named for the
    # registry or for a secret, since Container Apps reads a registry or a Key
    # Vault secret only with one of its own identities; each already exists,
    # and none is created. A private image is pulled from registry_server, the
    # registry's host name, either with registry_identity, a user-assigned
    # identity granted pull on the registry, or with registry_username and a
    # password Container Apps reads from the Key Vault secret
    # registry_password_secret_id names,
    # https://<vault>.vault.azure.net/secrets/<name>, with or without a
    # version, with the identity registry_password_identity names; that
    # password is the secret registry-password. A registry key set
    # without registry_server, registry_identity beside a user name or
    # password key, and registry_server with neither registry_identity nor
    # the user name and password keys together, halt, as does
    # registry_password, a password written as text, which would be written
    # into the template. With no registry key set the image is pulled as a
    # public one. A system-assigned identity, which Azure creates with the app
    # or job, is not one this realization names.
    #
    # The size. The container runs at the first size of the table of
    # Container Apps' "vCPU and memory allocation requirements", which every
    # app and job on the Consumption workload profile meets, that meets both
    # the CPU and the memory infra.compute asks for: 0.25 vCPU with 0.5 GiB,
    # and each step of 0.25 vCPU with 0.5 GiB more, to 4 vCPU with 8 GiB.
    # Each requested quantity is a floor: the container may be given more
    # than was written, and is billed for what it is given. An environment of
    # the Consumption-only type takes 2 vCPU with 4 GiB at most, which the
    # build cannot see: a larger size fails when the template deploys. A size
    # the table adds later is not chosen until it is listed here. A quantity
    # this entry cannot read, and a pair no size meets, halt naming it.
    #
    # Where it runs. infra.overrides.container_app_environment_id is
    # required, a string, the environment's resource ID,
    # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>,
    # and has no default: the environment is provisioned outside the Release,
    # no subscription-independent value exists for it, and this realization
    # never chooses an environment, and with it a network, for the operator.
    # The environment decides the network the container's egress leaves
    # through and where its logs go, so no log destination is read. The app
    # or job runs in its environment, so its location is bound to the
    # environment's own region rather than left at the module's default, the
    # resource group's region, which need not be the environment's: it is
    # read when the template deploys, by a reference() call over the
    # environment's ID at API version 2026-01-01, the one each module creates
    # its resource at, and the identity that deploys the template reads the
    # environment. The ID is written inside that call, so it may hold no
    # quote, backslash or white space. The app or job is created in the
    # resource group the template is deployed to, so no resource group is
    # read.
    #
    # infra.overrides is read for container_app_environment_id, identity_ids,
    # registry_server, registry_identity, registry_username,
    # registry_password_secret_id, registry_password_identity and secrets as
    # above, and a job reads replica_timeout_in_seconds as well, the deadline
    # of each execution, a whole number of seconds, 1 or more, bound to
    # replicaTimeout, which left out is 1800 seconds; registry_password
    # halts, and so does enable_telemetry while it
    # is true: the module deploys a telemetry resource while its
    # enableTelemetry parameter is true, its default, reporting the module and
    # its version to Microsoft, and every entry binds it to false, so the
    # template deploys no telemetry. infra.published_port, a Docker Compose
    # setting, halts. The module's own defaults stand for every parameter an
    # entry leaves unbound.
    #
    # DELIBERATE NEAR-DUPLICATE of ContainerAppArguments, which holds the
    # same name rule, the same variables Container Apps sets in an app and in
    # a job, the same size table with the same reading of the quantities, the
    # same identity and registry checks and the same reading of a job's
    # replica timeout for the Container Apps Recipes on Terraform. No catalog
    # kind composes part of a values mapping into another, so each is held in
    # both; a change to one is made to the other.

    # A container app, for avm/res/app/container-app. Container Apps sets
    # CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME,
    # CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and
    # CONTAINER_APP_REPLICA_NAME in every app itself. infra.replicas, 1 where
    # the Component declares none, is both the app's minimum and its maximum
    # replica count, so Container Apps runs exactly that many whatever the
    # traffic: from 1 to 1,000, the most replicas of a revision Container Apps
    # configures. An app listening on a port has internal ingress to it: its
    # address is reachable only from inside its environment, by the other
    # apps and jobs there, and is not published at the environment's inbound
    # address, whether that is public or the internal load balancer of the
    # operator's virtual network; an environment-level HTTP route
    # configuration naming the app as a target is the one way in from
    # outside, and it is the operator's. ingressAllowInsecure is bound to
    # false in place of the module's default of true, so a plain HTTP request
    # is redirected to HTTPS, and all traffic goes to the latest revision of a
    # single-revision app. An app listening on no port has its ingress
    # disabled, the module's default being an external one, so nothing
    # reaches it, and a minimum of one replica or more is what keeps it
    # running. No scale rule is declared, and the module's default of no
    # inactive revision kept stands, so the app keeps none to return to. The
    # CPU is written as json('<vCPU>'), the form Bicep compiles a fractional
    # number to, since a template writes no fractional number of its own.
    AppParameters: |
      {{- $entry := "ContainerAppParameters#/mappings/AppParameters" }}
      {{- $resource := "container app" }}
      {{- $secretWord := "app secret" }}
      {{- $nameRule := `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` }}
      {{- $nameSentence := "Container Apps takes a name of 2 to 32 lowercase letters, digits and hyphens that begins with a letter and ends with a letter or a digit" }}
      {{- $reserved := list "CONTAINER_APP_NAME" "CONTAINER_APP_REVISION" "CONTAINER_APP_HOSTNAME" "CONTAINER_APP_ENV_DNS_SUFFIX" "CONTAINER_APP_PORT" "CONTAINER_APP_REPLICA_NAME" }}
      {{- $reservedSentence := "Container Apps sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME, CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and CONTAINER_APP_REPLICA_NAME in every app itself" }}
      {{- $app := true }}
      {{- $cpuForm := "[json('%s')]" }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Azure %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and a %s has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and this realization delivers env entries only: the file's content would reach the container as the value of a secret of the %s, written into the template as text. Dictate the value as an env entry in that inject block instead" $id $name $by $resource) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, which stay the image's own. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and this realization runs every Container Apps app and job on its environment's Consumption workload profile, which gives a container no GPU, and names no GPU workload profile: leave gpu out of the Recipe realizing the component on Container Apps, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- $probe := toString (optional .locals "probe_path" "") }}
      {{- if and $probe (not (hasPrefix "/" $probe)) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a probe requests an HTTP path, which begins with /: declare it so, or leave it out for no probe" $entry $probe) }}
      {{- end }}
      {{- if and $probe (not $port) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and the component's container listens on no port, neither the local container_port of the Recipe realizing it nor infra.port naming one, so the probe has no port to request it on: declare the local container_port as the port the container answers it on" $entry $probe) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- $text := toString $v }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $text = toJson $v }}{{ end }}
      {{- if and (hasPrefix "[" $text) (hasSuffix "]" $text) }}{{ $text = printf "[%s" $text }}{{ end }}
      {{- $_ := set $env $name $text }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- range $k, $_ := $env }}
      {{- if has $k $reserved }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and %s, so the two would collide: rename the variable where it is dictated" $id $k (index $source $k) $reservedSentence) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") }}
      {{- if and (not $size) (ge (index . 0) $mc) (ge (index . 1) $mib) }}
      {{- $size = list (index . 2) (index . 3) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" $id $c $m) }}
      {{- end }}
      {{- $replicas := 0 }}
      {{- if $app }}
      {{- $replicas = optional .infra "replicas" 1 }}
      {{- if not (and (regexMatch `^[0-9]{1,4}$` (toString $replicas)) (ge (atoi (toString $replicas)) 1) (le (atoi (toString $replicas)) 1000)) }}
      {{- fail (printf "infra.replicas of %q is %s, and Container Apps configures from 1 to 1,000 replicas of a revision: set infra.replicas in the Release to a count in that range" $id (toJson $replicas)) }}
      {{- end }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $environment := optional $o "container_app_environment_id" "" }}
      {{- if not (and (typeIs "string" $environment) $environment) }}
      {{- fail (printf "the component %q runs as a %s in the operator's own Azure Container Apps environment, and this realization never chooses one, but infra.overrides.container_app_environment_id carries none: set it in the Release to the environment's resource ID" $id $resource) }}
      {{- end }}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/'"\\\s]+/resourceGroups/[^/'"\\\s]+/providers/Microsoft\.App/managedEnvironments/[^/'"\\\s]+$` $environment) }}
      {{- fail (printf "infra.overrides.container_app_environment_id of %q is %q, and this realization takes the Container Apps environment the %s runs in as the environment's resource ID, written as well inside the expression that reads the environment's region, so it holds no quote, backslash or white space: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $id $environment $resource) }}
      {{- end }}
      {{- if eq (toString (optional $o "enable_telemetry" "")) "true" }}
      {{- fail (printf "infra.overrides.enable_telemetry of %q is true, and this realization turns the module's telemetry off in every template it writes: remove infra.overrides.enable_telemetry from the Release" $id) }}
      {{- end }}
      {{- $timeout := "" }}
      {{- if and (not $app) (hasKey $o "replica_timeout_in_seconds") }}
      {{- $timeout = toString (index $o "replica_timeout_in_seconds") }}
      {{- if not (regexMatch `^[1-9][0-9]*$` $timeout) }}
      {{- fail (printf "infra.overrides.replica_timeout_in_seconds of %q is %s, and this realization reads it as the deadline of each execution of the %s, a whole number of seconds, 1 or more: set it in the Release to one, or remove it for 1800 seconds, 30 minutes" $id (toJson (index $o "replica_timeout_in_seconds")) $resource) }}
      {{- end }}
      {{- end }}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` }}
      {{- if hasKey $o "registry_password" }}
      {{- fail (printf "infra.overrides.registry_password of %q is set, and this realization takes a registry password only by reference, so that its value is never written into the template: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" $id) }}
      {{- end }}
      {{- if hasKey $o "identity_ids" }}
      {{- $s := index $o "identity_ids" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.identity_ids of %q is %s, and this realization reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_server" "registry_username" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a string: set it in the Release to one, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "registry_password_secret_id" }}
      {{- $v := index $o "registry_password_secret_id" }}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) }}
      {{- fail (printf "infra.overrides.registry_password_secret_id of %q is %s, and this realization reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" }}
      {{- $set := list }}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end }}
      {{- if and $set (not (hasKey $o "registry_server")) }}
      {{- fail (printf "infra.overrides.%s of %q is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set) $id) }}
      {{- end }}
      {{- if hasKey $o "registry_server" }}
      {{- $missing := list }}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end }}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) (len $byPassword)) }}
      {{- fail (printf "infra.overrides of %q sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" $id) }}
      {{- end }}
      {{- if and (not (hasKey $o "registry_identity")) $missing }}
      {{- fail (printf "infra.overrides.registry_server of %q names a private registry, and this realization pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" $id (first $missing)) }}
      {{- end }}
      {{- end }}
      {{- $secrets := dict }}
      {{- if hasKey $o "secrets" }}
      {{- $secrets = index $o "secrets" }}
      {{- if not (and (kindIs "map" $secrets) (gt (len $secrets) 0)) }}
      {{- fail (printf "infra.overrides.secrets of %q is set, and this realization reads it as a map from the name of a container variable to the Key Vault secret it holds: write it as {<VARIABLE>: {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}}, or remove it" $id) }}
      {{- end }}
      {{- end }}
      {{- $kv := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[A-Za-z0-9-]{3,24}/secrets/[A-Za-z0-9-]{1,127}$` }}
      {{- $secretOf := dict }}
      {{- if hasKey $o "registry_password_secret_id" }}{{ $_ := set $secretOf "registry-password" "infra.overrides.registry_password_secret_id" }}{{ end }}
      {{- range $name, $e := $secrets }}
      {{- if not (regexMatch `^[A-Za-z0-9]([-_A-Za-z0-9]*[A-Za-z0-9])?$` $name) }}
      {{- fail (printf "infra.overrides.secrets of %q names the variable %q, and this realization names the %s holding it after the variable, so a variable named in secrets holds letters, digits, underscores and hyphens, beginning and ending with a letter or a digit: rename it in the Release" $id $name $secretWord) }}
      {{- end }}
      {{- if has $name $reserved }}
      {{- fail (printf "infra.overrides.secrets of %q names the variable %q, and %s, so the two would collide: rename the variable in the Release" $id $name $reservedSentence) }}
      {{- end }}
      {{- if not (kindIs "map" $e) }}
      {{- fail (printf "infra.overrides.secrets.%s of %q is %s, and this realization reads each entry as the Key Vault secret the variable holds: write it as {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}" $name $id (toJson $e)) }}
      {{- end }}
      {{- if hasKey $e "value" }}
      {{- fail (printf "infra.overrides.secrets.%s of %q sets value, and this realization takes a secret only by reference, so that its value is never written into the template: store it as a Key Vault secret, set origin to the secret's resource ID and identity to a user-assigned identity allowed to read it, then remove value" $name $id) }}
      {{- end }}
      {{- range $k, $_ := $e }}
      {{- if not (has $k (list "origin" "identity")) }}
      {{- fail (printf "infra.overrides.secrets.%s of %q sets %s, and this realization reads origin and identity alone from an entry: remove %s from the Release" $name $id $k $k) }}
      {{- end }}
      {{- end }}
      {{- if not (and (typeIs "string" (optional $e "origin" 0)) (regexMatch $kv (toString (optional $e "origin" "")))) }}
      {{- fail (printf "infra.overrides.secrets.%s.origin of %q is not a Key Vault secret's resource ID, and this realization names the secret the variable holds by that ID: write /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret> in infra.overrides.secrets.%s.origin in the Release, with a vault name of 3 to 24 and a secret name of 1 to 127 letters, digits and hyphens" $name $id $name) }}
      {{- end }}
      {{- if not (and (typeIs "string" (optional $e "identity" 0)) (regexMatch $uai (toString (optional $e "identity" "")))) }}
      {{- fail (printf "infra.overrides.secrets.%s.identity of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity allowed to read the secret, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID" $name $id (toJson (optional $e "identity" ""))) }}
      {{- end }}
      {{- $secret := lower (replace "_" "-" $name) }}
      {{- if hasKey $secretOf $secret }}
      {{- fail (printf "infra.overrides.secrets.%s of %q and %s both name the %s %s, which this realization names after the variable in lowercase with each underscore a hyphen: rename one of them in the Release" $name $id (index $secretOf $secret) $secretWord $secret) }}
      {{- end }}
      {{- $_ := set $secretOf $secret (printf "infra.overrides.secrets.%s" $name) }}
      {{- if hasKey $env $name }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and infra.overrides.secrets names it as well, so one would silently replace the other: rename the variable where it is dictated, or remove the entry from infra.overrides.secrets" $id $name (index $source $name)) }}
      {{- end }}
      {{- end }}
      {{- $entries := dict }}
      {{- range $k, $v := $env }}{{ $_ := set $entries $k (dict "name" $k "value" $v) }}{{ end }}
      {{- $appSecrets := list }}
      {{- $identities := list }}
      {{- range $v := optional $o "identity_ids" list }}{{ $identities = append $identities $v }}{{ end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}{{ with optional $o $k "" }}{{ $identities = append $identities . }}{{ end }}{{ end }}
      {{- with optional $o "registry_password_secret_id" "" }}
      {{- $appSecrets = append $appSecrets (dict "name" "registry-password" "keyVaultUrl" . "identity" (optional $o "registry_password_identity" "")) }}
      {{- end }}
      {{- range $k, $e := $secrets }}
      {{- $secret := lower (replace "_" "-" $k) }}
      {{- $ref := splitList "/" (toString (index $e "origin")) }}
      {{- $appSecrets = append $appSecrets (dict "name" $secret "keyVaultUrl" (printf "[format('https://{0}{1}/secrets/{2}', '%s', environment().suffixes.keyvaultDns, '%s')]" (index $ref 8) (index $ref 10)) "identity" (index $e "identity")) }}
      {{- $identities = append $identities (index $e "identity") }}
      {{- $_ := set $entries $k (dict "name" $k "secretRef" $secret) }}
      {{- end }}
      {{- $envList := list }}
      {{- range $k, $e := $entries }}{{ $envList = append $envList $e }}{{ end }}
      {{- $probes := list }}
      {{- if $probe }}
      {{- $probes = append $probes (dict "type" "Startup" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- if $app }}
      {{- $probes = append $probes (dict "type" "Readiness" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- $probes = append $probes (dict "type" "Liveness" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- end }}
      {{- else if and $app $port }}
      {{- $probes = append $probes (dict "type" "Readiness" "tcpSocket" (dict "port" (atoi $port))) }}
      {{- end }}
      {{- $container := dict "name" "main" "image" $image "resources" (dict "cpu" (printf $cpuForm (index $size 0)) "memory" (index $size 1)) }}
      {{- if $probes }}{{ $_ := set $container "probes" $probes }}{{ end }}
      {{- if $envList }}{{ $_ := set $container "env" $envList }}{{ end }}
      name: {{ toJson $id }}
      location: {{ toJson (printf "[reference('%s', '2026-01-01', 'full').location]" $environment) }}
      environmentResourceId: {{ toJson $environment }}
      containers: {{ toJson (list $container) }}
      {{- if $app }}
      scaleSettings:
        minReplicas: {{ $replicas }}
        maxReplicas: {{ $replicas }}
      activeRevisionsMode: Single
      {{- if $port }}
      disableIngress: false
      ingressExternal: false
      ingressTargetPort: {{ $port }}
      ingressAllowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
      {{- else }}
      disableIngress: true
      {{- end }}
      {{- else }}
      {{- with toString (optional .values "schedule" "") }}
      triggerType: Schedule
      scheduleTriggerConfig:
        cronExpression: {{ toJson . }}
      {{- else }}
      triggerType: Manual
      manualTriggerConfig: {}
      {{- end }}
      replicaTimeout: {{ default "1800" $timeout }}
      {{- end }}
      {{- with uniq $identities }}
      managedIdentities:
        userAssignedResourceIds: {{ toJson . }}
      {{- end }}
      {{- $server := optional $o "registry_server" "" }}
      {{- $pullIdentity := optional $o "registry_identity" "" }}
      {{- if and $server $pullIdentity }}
      registries: {{ toJson (list (dict "server" $server "identity" $pullIdentity)) }}
      {{- else if $server }}
      registries: {{ toJson (list (dict "server" $server "username" (optional $o "registry_username" "") "passwordSecretRef" "registry-password")) }}
      {{- end }}
      {{- with $appSecrets }}
      secrets: {{ toJson . }}
      {{- end }}
      enableTelemetry: false

    # A Container Apps job, for avm/res/app/job, running one replica an
    # execution. Container Apps sets CONTAINER_APP_JOB_NAME and
    # CONTAINER_APP_JOB_EXECUTION_NAME in every job itself. A port is read
    # only for the startup probe, and no replica count is rendered.
    # values.schedule, where the Component declares it and the Aggregate sets
    # it, is the cron expression of the job's Schedule trigger, read as the
    # fields minute, hour, day of the month, month and day of the week and
    # evaluated in UTC, and passed as it is written: this entry checks nothing
    # in it, and Container Apps judges it when the template is deployed.
    # Otherwise the trigger is Manual, and an execution runs when someone
    # starts one. The module's default replica retry limit, 0, stands, so a
    # failed replica is not retried. Each execution has a deadline,
    # replicaTimeout: infra.overrides.replica_timeout_in_seconds where the
    # Release sets it, and otherwise 1800 seconds, 30 minutes, the module's
    # own default: Container Apps requires a replica timeout of every job, one
    # of the job settings its "Jobs in Azure Container Apps" page lists, and
    # documents no maximum. A Component's own timeout value reaches the
    # container as a variable and sets no other deadline. The CPU is written
    # as text, the type the module declares for it.
    JobParameters: |
      {{- $entry := "ContainerAppParameters#/mappings/JobParameters" }}
      {{- $resource := "Container Apps job" }}
      {{- $secretWord := "job secret" }}
      {{- $nameRule := `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` }}
      {{- $nameSentence := "this realization takes a job's name as Container Apps takes a container app's, 2 to 32 lowercase letters, digits and hyphens that begins with a letter and ends with a letter or a digit" }}
      {{- $reserved := list "CONTAINER_APP_JOB_NAME" "CONTAINER_APP_JOB_EXECUTION_NAME" }}
      {{- $reservedSentence := "Container Apps sets CONTAINER_APP_JOB_NAME and CONTAINER_APP_JOB_EXECUTION_NAME in every job itself" }}
      {{- $app := false }}
      {{- $cpuForm := "%s" }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Azure %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and a %s has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and this realization delivers env entries only: the file's content would reach the container as the value of a secret of the %s, written into the template as text. Dictate the value as an env entry in that inject block instead" $id $name $by $resource) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, which stay the image's own. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and this realization runs every Container Apps app and job on its environment's Consumption workload profile, which gives a container no GPU, and names no GPU workload profile: leave gpu out of the Recipe realizing the component on Container Apps, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- $probe := toString (optional .locals "probe_path" "") }}
      {{- if and $probe (not (hasPrefix "/" $probe)) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a probe requests an HTTP path, which begins with /: declare it so, or leave it out for no probe" $entry $probe) }}
      {{- end }}
      {{- if and $probe (not $port) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and the component's container listens on no port, neither the local container_port of the Recipe realizing it nor infra.port naming one, so the probe has no port to request it on: declare the local container_port as the port the container answers it on" $entry $probe) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- $text := toString $v }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $text = toJson $v }}{{ end }}
      {{- if and (hasPrefix "[" $text) (hasSuffix "]" $text) }}{{ $text = printf "[%s" $text }}{{ end }}
      {{- $_ := set $env $name $text }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- range $k, $_ := $env }}
      {{- if has $k $reserved }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and %s, so the two would collide: rename the variable where it is dictated" $id $k (index $source $k) $reservedSentence) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") }}
      {{- if and (not $size) (ge (index . 0) $mc) (ge (index . 1) $mib) }}
      {{- $size = list (index . 2) (index . 3) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" $id $c $m) }}
      {{- end }}
      {{- $replicas := 0 }}
      {{- if $app }}
      {{- $replicas = optional .infra "replicas" 1 }}
      {{- if not (and (regexMatch `^[0-9]{1,4}$` (toString $replicas)) (ge (atoi (toString $replicas)) 1) (le (atoi (toString $replicas)) 1000)) }}
      {{- fail (printf "infra.replicas of %q is %s, and Container Apps configures from 1 to 1,000 replicas of a revision: set infra.replicas in the Release to a count in that range" $id (toJson $replicas)) }}
      {{- end }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $environment := optional $o "container_app_environment_id" "" }}
      {{- if not (and (typeIs "string" $environment) $environment) }}
      {{- fail (printf "the component %q runs as a %s in the operator's own Azure Container Apps environment, and this realization never chooses one, but infra.overrides.container_app_environment_id carries none: set it in the Release to the environment's resource ID" $id $resource) }}
      {{- end }}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/'"\\\s]+/resourceGroups/[^/'"\\\s]+/providers/Microsoft\.App/managedEnvironments/[^/'"\\\s]+$` $environment) }}
      {{- fail (printf "infra.overrides.container_app_environment_id of %q is %q, and this realization takes the Container Apps environment the %s runs in as the environment's resource ID, written as well inside the expression that reads the environment's region, so it holds no quote, backslash or white space: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $id $environment $resource) }}
      {{- end }}
      {{- if eq (toString (optional $o "enable_telemetry" "")) "true" }}
      {{- fail (printf "infra.overrides.enable_telemetry of %q is true, and this realization turns the module's telemetry off in every template it writes: remove infra.overrides.enable_telemetry from the Release" $id) }}
      {{- end }}
      {{- $timeout := "" }}
      {{- if and (not $app) (hasKey $o "replica_timeout_in_seconds") }}
      {{- $timeout = toString (index $o "replica_timeout_in_seconds") }}
      {{- if not (regexMatch `^[1-9][0-9]*$` $timeout) }}
      {{- fail (printf "infra.overrides.replica_timeout_in_seconds of %q is %s, and this realization reads it as the deadline of each execution of the %s, a whole number of seconds, 1 or more: set it in the Release to one, or remove it for 1800 seconds, 30 minutes" $id (toJson (index $o "replica_timeout_in_seconds")) $resource) }}
      {{- end }}
      {{- end }}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` }}
      {{- if hasKey $o "registry_password" }}
      {{- fail (printf "infra.overrides.registry_password of %q is set, and this realization takes a registry password only by reference, so that its value is never written into the template: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" $id) }}
      {{- end }}
      {{- if hasKey $o "identity_ids" }}
      {{- $s := index $o "identity_ids" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.identity_ids of %q is %s, and this realization reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_server" "registry_username" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a string: set it in the Release to one, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "registry_password_secret_id" }}
      {{- $v := index $o "registry_password_secret_id" }}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) }}
      {{- fail (printf "infra.overrides.registry_password_secret_id of %q is %s, and this realization reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" }}
      {{- $set := list }}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end }}
      {{- if and $set (not (hasKey $o "registry_server")) }}
      {{- fail (printf "infra.overrides.%s of %q is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set) $id) }}
      {{- end }}
      {{- if hasKey $o "registry_server" }}
      {{- $missing := list }}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end }}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) (len $byPassword)) }}
      {{- fail (printf "infra.overrides of %q sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" $id) }}
      {{- end }}
      {{- if and (not (hasKey $o "registry_identity")) $missing }}
      {{- fail (printf "infra.overrides.registry_server of %q names a private registry, and this realization pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" $id (first $missing)) }}
      {{- end }}
      {{- end }}
      {{- $secrets := dict }}
      {{- if hasKey $o "secrets" }}
      {{- $secrets = index $o "secrets" }}
      {{- if not (and (kindIs "map" $secrets) (gt (len $secrets) 0)) }}
      {{- fail (printf "infra.overrides.secrets of %q is set, and this realization reads it as a map from the name of a container variable to the Key Vault secret it holds: write it as {<VARIABLE>: {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}}, or remove it" $id) }}
      {{- end }}
      {{- end }}
      {{- $kv := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[A-Za-z0-9-]{3,24}/secrets/[A-Za-z0-9-]{1,127}$` }}
      {{- $secretOf := dict }}
      {{- if hasKey $o "registry_password_secret_id" }}{{ $_ := set $secretOf "registry-password" "infra.overrides.registry_password_secret_id" }}{{ end }}
      {{- range $name, $e := $secrets }}
      {{- if not (regexMatch `^[A-Za-z0-9]([-_A-Za-z0-9]*[A-Za-z0-9])?$` $name) }}
      {{- fail (printf "infra.overrides.secrets of %q names the variable %q, and this realization names the %s holding it after the variable, so a variable named in secrets holds letters, digits, underscores and hyphens, beginning and ending with a letter or a digit: rename it in the Release" $id $name $secretWord) }}
      {{- end }}
      {{- if has $name $reserved }}
      {{- fail (printf "infra.overrides.secrets of %q names the variable %q, and %s, so the two would collide: rename the variable in the Release" $id $name $reservedSentence) }}
      {{- end }}
      {{- if not (kindIs "map" $e) }}
      {{- fail (printf "infra.overrides.secrets.%s of %q is %s, and this realization reads each entry as the Key Vault secret the variable holds: write it as {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}" $name $id (toJson $e)) }}
      {{- end }}
      {{- if hasKey $e "value" }}
      {{- fail (printf "infra.overrides.secrets.%s of %q sets value, and this realization takes a secret only by reference, so that its value is never written into the template: store it as a Key Vault secret, set origin to the secret's resource ID and identity to a user-assigned identity allowed to read it, then remove value" $name $id) }}
      {{- end }}
      {{- range $k, $_ := $e }}
      {{- if not (has $k (list "origin" "identity")) }}
      {{- fail (printf "infra.overrides.secrets.%s of %q sets %s, and this realization reads origin and identity alone from an entry: remove %s from the Release" $name $id $k $k) }}
      {{- end }}
      {{- end }}
      {{- if not (and (typeIs "string" (optional $e "origin" 0)) (regexMatch $kv (toString (optional $e "origin" "")))) }}
      {{- fail (printf "infra.overrides.secrets.%s.origin of %q is not a Key Vault secret's resource ID, and this realization names the secret the variable holds by that ID: write /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret> in infra.overrides.secrets.%s.origin in the Release, with a vault name of 3 to 24 and a secret name of 1 to 127 letters, digits and hyphens" $name $id $name) }}
      {{- end }}
      {{- if not (and (typeIs "string" (optional $e "identity" 0)) (regexMatch $uai (toString (optional $e "identity" "")))) }}
      {{- fail (printf "infra.overrides.secrets.%s.identity of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity allowed to read the secret, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID" $name $id (toJson (optional $e "identity" ""))) }}
      {{- end }}
      {{- $secret := lower (replace "_" "-" $name) }}
      {{- if hasKey $secretOf $secret }}
      {{- fail (printf "infra.overrides.secrets.%s of %q and %s both name the %s %s, which this realization names after the variable in lowercase with each underscore a hyphen: rename one of them in the Release" $name $id (index $secretOf $secret) $secretWord $secret) }}
      {{- end }}
      {{- $_ := set $secretOf $secret (printf "infra.overrides.secrets.%s" $name) }}
      {{- if hasKey $env $name }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and infra.overrides.secrets names it as well, so one would silently replace the other: rename the variable where it is dictated, or remove the entry from infra.overrides.secrets" $id $name (index $source $name)) }}
      {{- end }}
      {{- end }}
      {{- $entries := dict }}
      {{- range $k, $v := $env }}{{ $_ := set $entries $k (dict "name" $k "value" $v) }}{{ end }}
      {{- $appSecrets := list }}
      {{- $identities := list }}
      {{- range $v := optional $o "identity_ids" list }}{{ $identities = append $identities $v }}{{ end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}{{ with optional $o $k "" }}{{ $identities = append $identities . }}{{ end }}{{ end }}
      {{- with optional $o "registry_password_secret_id" "" }}
      {{- $appSecrets = append $appSecrets (dict "name" "registry-password" "keyVaultUrl" . "identity" (optional $o "registry_password_identity" "")) }}
      {{- end }}
      {{- range $k, $e := $secrets }}
      {{- $secret := lower (replace "_" "-" $k) }}
      {{- $ref := splitList "/" (toString (index $e "origin")) }}
      {{- $appSecrets = append $appSecrets (dict "name" $secret "keyVaultUrl" (printf "[format('https://{0}{1}/secrets/{2}', '%s', environment().suffixes.keyvaultDns, '%s')]" (index $ref 8) (index $ref 10)) "identity" (index $e "identity")) }}
      {{- $identities = append $identities (index $e "identity") }}
      {{- $_ := set $entries $k (dict "name" $k "secretRef" $secret) }}
      {{- end }}
      {{- $envList := list }}
      {{- range $k, $e := $entries }}{{ $envList = append $envList $e }}{{ end }}
      {{- $probes := list }}
      {{- if $probe }}
      {{- $probes = append $probes (dict "type" "Startup" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- if $app }}
      {{- $probes = append $probes (dict "type" "Readiness" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- $probes = append $probes (dict "type" "Liveness" "httpGet" (dict "path" $probe "port" (atoi $port))) }}
      {{- end }}
      {{- else if and $app $port }}
      {{- $probes = append $probes (dict "type" "Readiness" "tcpSocket" (dict "port" (atoi $port))) }}
      {{- end }}
      {{- $container := dict "name" "main" "image" $image "resources" (dict "cpu" (printf $cpuForm (index $size 0)) "memory" (index $size 1)) }}
      {{- if $probes }}{{ $_ := set $container "probes" $probes }}{{ end }}
      {{- if $envList }}{{ $_ := set $container "env" $envList }}{{ end }}
      name: {{ toJson $id }}
      location: {{ toJson (printf "[reference('%s', '2026-01-01', 'full').location]" $environment) }}
      environmentResourceId: {{ toJson $environment }}
      containers: {{ toJson (list $container) }}
      {{- if $app }}
      scaleSettings:
        minReplicas: {{ $replicas }}
        maxReplicas: {{ $replicas }}
      activeRevisionsMode: Single
      {{- if $port }}
      disableIngress: false
      ingressExternal: false
      ingressTargetPort: {{ $port }}
      ingressAllowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
      {{- else }}
      disableIngress: true
      {{- end }}
      {{- else }}
      {{- with toString (optional .values "schedule" "") }}
      triggerType: Schedule
      scheduleTriggerConfig:
        cronExpression: {{ toJson . }}
      {{- else }}
      triggerType: Manual
      manualTriggerConfig: {}
      {{- end }}
      replicaTimeout: {{ default "1800" $timeout }}
      {{- end }}
      {{- with uniq $identities }}
      managedIdentities:
        userAssignedResourceIds: {{ toJson . }}
      {{- end }}
      {{- $server := optional $o "registry_server" "" }}
      {{- $pullIdentity := optional $o "registry_identity" "" }}
      {{- if and $server $pullIdentity }}
      registries: {{ toJson (list (dict "server" $server "identity" $pullIdentity)) }}
      {{- else if $server }}
      registries: {{ toJson (list (dict "server" $server "username" (optional $o "registry_username" "") "passwordSecretRef" "registry-password")) }}
      {{- end }}
      {{- with $appSecrets }}
      secrets: {{ toJson . }}
      {{- end }}
      enableTelemetry: false
