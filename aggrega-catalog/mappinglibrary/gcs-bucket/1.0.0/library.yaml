apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: GCSBucket
  version: 1.0.0
  description: >
    The module arguments, and the refusals, every Recipe provisioning one Google
    Cloud Storage bucket through the terraform-google-modules project's
    cloud-storage module writes alike, held once. A Recipe consumes it with
    `valuesMapping: { $import: GCSBucket#/mappings/ModuleArguments }`; the import
    replaces the whole `valuesMapping`, so the entry is the Recipe's complete
    argument list.

    The entry names the one bucket values.bucket names, exactly as written,
    places it in the operator's project and location, keeps public access
    prevention enforced and uniform bucket-level access on, and creates no IAM
    binding, service account or HMAC key; no key a Release sets reaches any of
    those. It refuses a bucket name Cloud Storage does not take, a missing
    project or location, and every infra.overrides key but project_id.

    What differs between importers is read from the locals each declares: the
    location, the name of the infra key it came from, and, where the Recipe
    writes them, the storage class and versioning. terraform/s3-object-store-gcs
    and terraform/gcs import it.
spec:
  mappings:
    # The entry. It renders the arguments of the importing component's module
    # block in the boundary's root configuration, by the module's own input
    # names, and stops the build before any of them is written when an input
    # cannot be one Cloud Storage takes.
    #
    # What the importing Recipe declares, as its locals:
    #   location       the bucket's location, read from the infra key the
    #                  Recipe's Component declares for it; required;
    #   location_key   that key's name, such as infra.region, which the
    #                  sentence stopping a build without a location names;
    #                  required;
    #   storage_class  the bucket's storage class, written as the module's
    #                  storage_class where it is declared and left to the
    #                  module's STANDARD where it is not;
    #   versioning     true or false, written as the bucket's object
    #                  versioning where it is declared and left to the module's
    #                  default, off, where it is not.
    # A local the Recipe does not declare reads as empty here rather than
    # stopping the build, so location and location_key are checked before
    # anything is written, and the build stops naming the one that is missing.
    #
    # What is fixed, whatever is authored:
    #   prefix is empty and randomize_suffix false, so the module names the
    #     bucket exactly as values.bucket writes it, and a Recipe publishes
    #     that name as written;
    #   public_access_prevention is enforced, so no IAM policy and no ACL can
    #     make the bucket's data public;
    #   bucket_policy_only is true for the bucket, which the module passes as
    #     uniform_bucket_level_access: access is granted by IAM alone, and
    #     Cloud Storage answers a request setting a bucket or object ACL with
    #     400 Bad Request;
    #   set_hmac_access is false, and none of the module's set_*_roles inputs
    #     is written, so the module creates no HMAC key and no IAM binding.
    #
    # infra.overrides is read for project_id, the project the bucket is
    # created in, alone. Any other key there stops the build naming it, so a
    # setting written to relax one of the fixed values above is refused rather
    # than ignored.
    #
    # Bucket names. Cloud Storage takes lowercase letters, digits, dashes,
    # underscores and dots, starting and ending with a letter or digit, 3 to 63
    # characters, or up to 222 where the name holds dots; no name in
    # dotted-decimal IP form, none beginning with goog and none containing
    # google. The module also writes the name, its dots turned into dashes,
    # as the bucket's label name, and a label value holds at most 63
    # characters, so a longer dotted name would fail when the bucket is
    # created: this entry refuses every name over 63 characters. Close
    # misspellings of google, which Cloud Storage also refuses, are not checked
    # here; Cloud Storage refuses them when the bucket is created. A name
    # holding dots is a domain name, which Cloud Storage creates only once the
    # project has verified the domain, and which an S3 client reaches by the
    # path-style address alone.
    ModuleArguments: |
      {{- $entry := "GCSBucket#/mappings/ModuleArguments" }}
      {{- $key := toString (optional .locals "location_key" "") }}
      {{- if not $key }}
      {{- fail (printf "the Recipe importing %s does not declare the local location_key, which names the infra key the bucket's location is read from, in the sentence that stops a build without one; declare it" $entry) }}
      {{- end }}
      {{- $location := toString (optional .locals "location" "") }}
      {{- if not $location }}
      {{- fail (printf "%q places its Cloud Storage bucket in the location %s names, and this Recipe never chooses one, but %s carries none: set %s in the Release to a Cloud Storage location, such as the region europe-west1, the dual-region EUR4 or the multi-region EU" .context.instance_id $key $key $key) }}
      {{- end }}
      {{- if not (regexMatch `^[A-Za-z][A-Za-z0-9-]*[A-Za-z0-9]$` $location) }}
      {{- fail (printf "%s is %q, and a Cloud Storage location is a region, dual-region or multi-region code of letters, digits and dashes, such as europe-west1, EUR4 or EU: set %s in the Release to one" $key $location $key) }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- range $k, $v := $o }}
      {{- if ne $k "project_id" }}
      {{- fail (printf "infra.overrides.%s is not a setting this Recipe reads: it reads project_id alone from infra.overrides, keeps public access prevention enforced and uniform bucket-level access on, and creates no IAM binding, service account or HMAC key; remove infra.overrides.%s from the Release" $k $k) }}
      {{- end }}
      {{- end }}
      {{- $project := optional $o "project_id" "" }}
      {{- if not (typeIs "string" $project) }}
      {{- fail (printf "infra.overrides.project_id of %q is %v, and it names the Google Cloud project the bucket is created in by the project's ID, a string: set infra.overrides.project_id in the Release to the project's ID" .context.instance_id $project) }}
      {{- end }}
      {{- if not $project }}
      {{- fail (printf "%q creates its Cloud Storage bucket in the operator's own Google Cloud project, and this Recipe never chooses one, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release to the project's ID" .context.instance_id) }}
      {{- end }}
      {{- $b := toString .values.bucket }}
      {{- $rule := "" }}
      {{- if not (regexMatch `^[a-z0-9._-]*$` $b) }}
      {{- $rule = "Cloud Storage takes lowercase letters, digits, dashes, underscores and dots alone in a bucket name" }}
      {{- else if lt (len $b) 3 }}
      {{- $rule = "Cloud Storage takes a bucket name of at least 3 characters" }}
      {{- else if gt (len $b) 63 }}
      {{- $rule = "this Recipe takes a bucket name of at most 63 characters, because the module it sources also writes the name as the bucket's label name, and a Cloud Storage label value holds at most 63" }}
      {{- else if not (regexMatch `^[a-z0-9].*[a-z0-9]$` $b) }}
      {{- $rule = "Cloud Storage takes a bucket name only where it starts and ends with a letter or a digit" }}
      {{- else if regexMatch `^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$` $b }}
      {{- $rule = "Cloud Storage takes no bucket name in the form of an IP address" }}
      {{- else if hasPrefix "goog" $b }}
      {{- $rule = "Cloud Storage takes no bucket name beginning with goog" }}
      {{- else if contains "google" $b }}
      {{- $rule = "Cloud Storage takes no bucket name containing google" }}
      {{- end }}
      {{- if $rule }}
      {{- fail (printf "values.bucket of %q is %q, and %s: set values.bucket in the Aggregate to another name" .context.instance_id $b $rule) }}
      {{- end }}
      {{- $versioning := toString (optional .locals "versioning" "") }}
      {{- if and $versioning (not (has $versioning (list "true" "false"))) }}
      {{- fail (printf "the Recipe importing %s declares the local versioning as %q, and it is passed to the module as a boolean: declare it as true or false" $entry $versioning) }}
      {{- end }}
      project_id: {{ toJson $project }}
      names:
        - "{{ $b }}"
      prefix: ""
      randomize_suffix: false
      location: "{{ $location }}"
      public_access_prevention: "enforced"
      bucket_policy_only:
        "{{ $b }}": true
      set_hmac_access: false
      {{- with toString (optional .locals "storage_class" "") }}
      storage_class: {{ toJson . }}
      {{- end }}
      {{- if $versioning }}
      versioning:
        "{{ $b }}": {{ $versioning }}
      {{- end }}
