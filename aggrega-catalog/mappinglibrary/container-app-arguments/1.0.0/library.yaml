apiVersion: aggrega.ai/v1beta1
kind: MappingLibrary
metadata:
  name: ContainerAppArguments
  version: 1.0.0
  description: >
    The config every Azure Container Apps Recipe on Terraform hands the body
    it imports from ContainerAppModule, with the container's environment and
    the refusals, held once: AppArguments for the App body and JobArguments
    for Job. A Recipe consumes one with `valuesMapping: { $import:
    ContainerAppArguments#/mappings/AppArguments }`; the import replaces the
    whole valuesMapping.

    Each entry names the app or job after the component, places it in the
    operator's Container Apps environment and resource group from
    infra.overrides, with the operator's identities and registry, sizes it
    to a Consumption size from infra.compute, and delivers env entries as
    variables and file entries as files, refusing by name what this
    realization cannot take. What differs between importers is read from
    the locals each declares: a default image, the container's port, the
    variable each own value and each socket's connections are delivered as
    by default, and a probe path.
spec:
  mappings:
    # The entries. Each renders one key, config, the one argument of the
    # importing component's module block in the boundary's root
    # configuration, which the fixed pass-through hands to the body; the
    # names inside config are the body's, documented in ContainerAppModule.
    # Each stops the build, naming what to change, before config is written
    # when an input cannot be one this realization takes. They are one
    # template below their opening lines, which set what differs between an
    # app and a job: the entry's name, the resource's word, the name rule and
    # its sentence, the variables Container Apps sets itself, whether a
    # replica count is rendered, whether a schedule is, and whether a region
    # is read; a change to one is made to every one of them.
    #
    # What the importing Recipe declares, as its locals, each optional; a
    # local the Recipe does not declare reads as empty here rather than
    # stopping the build:
    #   default_image   the image the component runs while infra.image is
    #                   unset; a Recipe running the Release's own code
    #                   declares none, so the Release names the image;
    #   container_port  the port the container listens on; while it is not
    #                   declared, infra.port, where the Component declares
    #                   one. An app listening on a port has internal ingress
    #                   to it and a readiness probe on it; an app listening
    #                   on none has no ingress, and a job uses the port only
    #                   for its probe;
    #   value_env       a JSON object mapping each own value the Recipe
    #                   delivers by default, values.<key>, to the variable it
    #                   is delivered as;
    #   socket_env      a JSON object mapping each socket whose connections
    #                   the Recipe delivers by default to an object mapping
    #                   each variable to the key of the target's provides it
    #                   carries. Locals cannot read connections, so the
    #                   names travel as this table, read here with fromJson;
    #   probe_path      the HTTP path the container's probes request, on the
    #                   container's port, which is then required: a startup,
    #                   a readiness and a liveness probe on an app, a startup
    #                   probe on a job. While it is not declared, an app with
    #                   a port keeps a readiness probe opening a TCP
    #                   connection to it, and no other probe is rendered;
    #   gpu             refused where it is declared: this realization runs
    #                   every app and job on its environment's Consumption
    #                   workload profile, which gives a container no GPU, and
    #                   names no GPU workload profile of the operator's.
    #
    # The name. The app or job is named after the component, so the name is
    # checked here: 2 to 32 lowercase letters, digits and hyphens that begins
    # with a letter and ends with a letter or a digit, the rule Microsoft's
    # naming rules for Azure resources state for a container app. For a job
    # it is a rule this realization chooses: those naming rules state none for
    # a job, so a job's name is held to the app's. A doubled hyphen, which the
    # azurerm provider refuses in a name, never reaches it: the build writes
    # one in a component's name out as -zh-.
    #
    # The environment. Every env entry on the inject pipe — dictated by a
    # connection's inject block, by the component's own inject block or by an
    # attachment — becomes one variable of the container, under the name it
    # was dictated as, its value written whole, so a Terraform reference a
    # neighbour publishes, such as ${module.cache.hostname}, reaches the root
    # configuration as an interpolation the engine evaluates there, where the
    # neighbour's module is declared. Then the defaults:
    #   - each connection on a socket socket_env names, while that connection
    #     dictates nothing, delivers each variable of its table carrying the
    #     key the target publishes; a target publishing no such key, two such
    #     connections setting one variable, and a variable another source
    #     dictates as well each halt, naming both;
    #   - each own value value_env names is delivered under its variable
    #     while it has a value, set in the Aggregate or defaulted by the
    #     Component, and no entry of the component's own inject block, in any
    #     mechanism, delivers it — the template reads that at
    #     .context.self_inject, which maps each name the developer wrote to
    #     values.<key> for an entry reading that one own value — and a list or
    #     a map is written as its JSON text; a variable another source
    #     delivers as well halts, naming both.
    # Container Apps sets variables of its own in every app and every job, as
    # its "Manage environment variables" page lists under "Built-in
    # environment variables", so a variable under one of those names halts
    # here, naming who dictated it.
    #
    # DELIBERATE NEAR-DUPLICATE of the environment assembly each other
    # target's container Recipes hold, in their own values mapping or in the
    # shared arguments they import, and of the reading of .context.self_inject
    # every Recipe that reads it declares: the same steps, save the variables
    # each target reserves and the mechanisms it delivers. CloudRunArguments,
    # EcsFargateArguments and ContainerAppParameters also read value_env,
    # socket_env, container_port, default_image and the quantities
    # infra.compute asks for in the same lines as this entry. It is part of a
    # values mapping, and no catalog kind composes part of a template into
    # another; a change to it is made to all of them.
    #
    # Files and other mechanisms. Every file entry on the pipe is mounted at
    # the path it was dictated at, as ContainerAppModule describes: a secret
    # of the app or job, mounted alone by sub path from one Secret volume. A
    # path that is not absolute, and a path lying beneath another file's,
    # halt, naming the file. Every other mechanism is refused, naming the
    # entry, its mechanism and who dictated it, so none is dropped: an arg
    # entry, because no command line is rendered, and Container Apps passes a
    # container's arguments to its startup command in place of the image's
    # default ones; and any custom mechanism.
    #
    # The size. The container runs at the first size of the table of
    # Container Apps' "vCPU and memory allocation requirements", which every
    # app and job on the Consumption workload profile meets, that meets both
    # the CPU and the memory infra.compute asks for: 0.25 vCPU with 0.5 GiB,
    # and each step of 0.25 vCPU with 0.5 GiB more, to 4 vCPU with 8 GiB.
    # Each requested quantity is a floor: the container may be given more
    # than was written, and is billed for what it is given. An environment of
    # the Consumption-only type takes 2 vCPU with 4 GiB at most, which the
    # build cannot see: a larger size fails when Terraform applies. A size
    # the table adds later is not chosen until it is listed here. A quantity
    # this entry cannot read, and a pair no size meets, halt naming it.
    #
    # infra.overrides is read for resource_group_name and
    # container_app_environment_id, each required and a string, the
    # environment by its resource ID,
    # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>;
    # identity_ids, a list of resource IDs of existing user-assigned managed
    # identities; registry_server and registry_username, strings;
    # registry_identity and registry_password_identity, each the resource ID
    # of an existing user-assigned managed identity; and
    # registry_password_secret_id, the ID of a Key Vault secret,
    # https://<vault>.vault.azure.net/secrets/<name>, with or without a
    # version. A registry key set without registry_server, registry_identity
    # beside a user name or password key, and registry_server with neither
    # registry_identity nor the user name and password keys together, halt,
    # as does registry_password, a password written as text, which would be
    # written into the rendered configuration. A job reads location as well,
    # required and a string, the region its environment is in, which
    # azurerm_container_app_job requires and azurerm_container_app does not
    # take. infra.published_port, a Docker Compose setting, halts, and
    # infra.replicas is an app's replica count, 1 where the Component
    # declares none, from 1 to 300, the range the azurerm provider's own
    # check on a container app's minimum and maximum replica count admits.
    #
    # DELIBERATE NEAR-DUPLICATE: ContainerAppParameters, the parameters the
    # Container Apps Recipes on Azure Resource Manager bind in the Azure
    # Verified Modules they source, holds the same name rule, the same
    # variables Container Apps sets in an app and in a job, the same
    # size table with the same reading of the quantities, and the same
    # identity and registry checks. No catalog kind composes part of a values
    # mapping into another, so each is held in both; a change to one is made
    # to the other.

    # A container app, for ContainerAppModule#/artifacts/App. Container Apps
    # sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME,
    # CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and
    # CONTAINER_APP_REPLICA_NAME in every app itself, and infra.replicas is
    # the app's replica count.
    AppArguments: |
      {{- $entry := "ContainerAppArguments#/mappings/AppArguments" }}
      {{- $resource := "container app" }}
      {{- $nameRule := `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` }}
      {{- $nameSentence := "Container Apps takes a name of 2 to 32 lowercase letters, digits and hyphens that begins with a letter and ends with a letter or a digit" }}
      {{- $reserved := list "CONTAINER_APP_NAME" "CONTAINER_APP_REVISION" "CONTAINER_APP_HOSTNAME" "CONTAINER_APP_ENV_DNS_SUFFIX" "CONTAINER_APP_PORT" "CONTAINER_APP_REPLICA_NAME" }}
      {{- $reservedSentence := "Container Apps sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME, CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and CONTAINER_APP_REPLICA_NAME in every app itself" }}
      {{- $instances := true }}
      {{- $scheduled := false }}
      {{- $located := false }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Azure %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and a %s has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env" "file")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, which stay the image's own. Dictate the value as an env or a file entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $files := optional $inject "file" dict }}
      {{- range $path, $_ := $files }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject "file" dict) $path }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "file" dict) $path }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if not (hasPrefix "/" $path) }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and a file is written at an absolute path inside the container: write that path in the inject block starting with /" $id $path $by) }}
      {{- end }}
      {{- range $other, $_ := $files }}
      {{- if hasPrefix (printf "%s/" $path) $other }}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $id $path $other) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and this realization runs every Container Apps app and job on its environment's Consumption workload profile, which gives a container no GPU, and names no GPU workload profile: leave gpu out of the Recipe realizing the component on Container Apps, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- $probe := toString (optional .locals "probe_path" "") }}
      {{- if and $probe (not (hasPrefix "/" $probe)) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a probe requests an HTTP path, which begins with /: declare it so, or leave it out for no probe" $entry $probe) }}
      {{- end }}
      {{- if and $probe (not $port) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and the component's container listens on no port, neither the local container_port of the Recipe realizing it nor infra.port naming one, so the probe has no port to request it on: declare the local container_port as the port the container answers it on" $entry $probe) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $_ := set $env $name (toJson $v) }}{{ else }}{{ $_ := set $env $name (toString $v) }}{{ end }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- range $k, $_ := $env }}
      {{- if has $k $reserved }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and %s, so the two would collide: rename the variable where it is dictated" $id $k (index $source $k) $reservedSentence) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") }}
      {{- if and (not $size) (ge (index . 0) $mc) (ge (index . 1) $mib) }}
      {{- $size = list (index . 2) (index . 3) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" $id $c $m) }}
      {{- end }}
      {{- $replicas := 0 }}
      {{- if $instances }}
      {{- $replicas = optional .infra "replicas" 1 }}
      {{- if not (and (regexMatch `^[0-9]{1,3}$` (toString $replicas)) (ge (atoi (toString $replicas)) 1) (le (atoi (toString $replicas)) 300)) }}
      {{- fail (printf "infra.replicas of %q is %s, and the azurerm provider takes a container app's replica count from 1 to 300: set infra.replicas in the Release to a count in that range" $id (toJson $replicas)) }}
      {{- end }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $required := list "resource_group_name" "container_app_environment_id" }}
      {{- $ask := "infra.overrides.resource_group_name and infra.overrides.container_app_environment_id" }}
      {{- if $located }}
      {{- $required = append $required "location" }}
      {{- $ask = "infra.overrides.resource_group_name, infra.overrides.container_app_environment_id and infra.overrides.location, the region the environment is in" }}
      {{- end }}
      {{- range $k := $required }}
      {{- $v := optional $o $k "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs as a %s in the operator's own Azure Container Apps environment and resource group, and this realization never chooses them, but infra.overrides.%s carries none: in the Release, set %s" $id $resource $k $ask) }}
      {{- end }}
      {{- end }}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.App/managedEnvironments/[^/]+$` $o.container_app_environment_id) }}
      {{- fail (printf "infra.overrides.container_app_environment_id of %q is %q, and this realization takes the Container Apps environment the %s runs in as the environment's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $id $o.container_app_environment_id $resource) }}
      {{- end }}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` }}
      {{- if hasKey $o "registry_password" }}
      {{- fail (printf "infra.overrides.registry_password of %q is set, and this realization takes a registry password only by reference, so that its value is never written into the rendered configuration: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" $id) }}
      {{- end }}
      {{- if hasKey $o "identity_ids" }}
      {{- $s := index $o "identity_ids" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.identity_ids of %q is %s, and this realization reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_server" "registry_username" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a string: set it in the Release to one, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "registry_password_secret_id" }}
      {{- $v := index $o "registry_password_secret_id" }}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) }}
      {{- fail (printf "infra.overrides.registry_password_secret_id of %q is %s, and this realization reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" }}
      {{- $set := list }}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end }}
      {{- if and $set (not (hasKey $o "registry_server")) }}
      {{- fail (printf "infra.overrides.%s of %q is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set) $id) }}
      {{- end }}
      {{- if hasKey $o "registry_server" }}
      {{- $missing := list }}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end }}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) (len $byPassword)) }}
      {{- fail (printf "infra.overrides of %q sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" $id) }}
      {{- end }}
      {{- if and (not (hasKey $o "registry_identity")) $missing }}
      {{- fail (printf "infra.overrides.registry_server of %q names a private registry, and this realization pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" $id (first $missing)) }}
      {{- end }}
      {{- end }}
      config:
        name: {{ toJson $id }}
        {{- if $located }}
        location: {{ toJson $o.location }}
        {{- end }}
        resource_group_name: {{ toJson $o.resource_group_name }}
        container_app_environment_id: {{ toJson $o.container_app_environment_id }}
        image: {{ toJson $image }}
        {{- if $port }}
        port: {{ $port }}
        {{- end }}
        cpu: {{ toJson (index $size 0) }}
        memory: {{ toJson (index $size 1) }}
        {{- if $instances }}
        replicas: {{ $replicas }}
        {{- end }}
        environment: {{ toJson $env }}
        {{- with $files }}
        files: {{ toJson . }}
        {{- end }}
        {{- with optional $o "identity_ids" "" }}
        identity_ids: {{ toJson . }}
        {{- end }}
        {{- range $k := list "registry_server" "registry_identity" "registry_username" "registry_password_secret_id" "registry_password_identity" }}
        {{- with optional $o $k "" }}
        {{ $k }}: {{ toJson . }}
        {{- end }}
        {{- end }}
        {{- with $probe }}
        probe_path: {{ toJson . }}
        {{- end }}
        {{- if $scheduled }}
        {{- with toString (optional .values "schedule" "") }}
        schedule: {{ toJson . }}
        {{- end }}
        {{- end }}

    # A Container Apps job, for ContainerAppModule#/artifacts/Job. Container
    # Apps sets CONTAINER_APP_JOB_NAME and CONTAINER_APP_JOB_EXECUTION_NAME in
    # every job itself. A port is read only for the startup probe, no replica
    # count is rendered, infra.overrides.location is required, and
    # values.schedule, where the Component declares it and the Aggregate sets
    # it, is the cron expression the job is started on. This realization sets
    # a deadline of 30 minutes on each execution, in the Job body: Container
    # Apps requires a replica timeout of every job, one of the job settings
    # its "Jobs in Azure Container Apps" page lists, and documents no maximum.
    # No value is read for it: a Component's own timeout value reaches the
    # container as a variable and sets no other deadline.
    JobArguments: |
      {{- $entry := "ContainerAppArguments#/mappings/JobArguments" }}
      {{- $resource := "Container Apps job" }}
      {{- $nameRule := `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` }}
      {{- $nameSentence := "this realization takes a job's name as Container Apps takes a container app's, 2 to 32 lowercase letters, digits and hyphens that begins with a letter and ends with a letter or a digit" }}
      {{- $reserved := list "CONTAINER_APP_JOB_NAME" "CONTAINER_APP_JOB_EXECUTION_NAME" }}
      {{- $reservedSentence := "Container Apps sets CONTAINER_APP_JOB_NAME and CONTAINER_APP_JOB_EXECUTION_NAME in every job itself" }}
      {{- $instances := false }}
      {{- $scheduled := true }}
      {{- $located := true }}
      {{- $id := .context.instance_id }}
      {{- if not (regexMatch $nameRule $id) }}
      {{- fail (printf "the component %q names its Azure %s, and %s: rename the component in the Aggregate to such a name" $id $resource $nameSentence) }}
      {{- end }}
      {{- if optional .infra "published_port" 0 }}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting, and a %s has no host to publish one on, so remove infra.published_port from the Release for this target" $id $resource) }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env" "file")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, which stay the image's own. Dictate the value as an env or a file entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $files := optional $inject "file" dict }}
      {{- range $path, $_ := $files }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject "file" dict) $path }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "file" dict) $path }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if not (hasPrefix "/" $path) }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and a file is written at an absolute path inside the container: write that path in the inject block starting with /" $id $path $by) }}
      {{- end }}
      {{- range $other, $_ := $files }}
      {{- if hasPrefix (printf "%s/" $path) $other }}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $id $path $other) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $valueEnv := dict }}
      {{- with toString (optional .locals "value_env" "") }}
      {{- $valueEnv = fromJson . }}
      {{- $ok := kindIs "map" $valueEnv }}
      {{- if $ok }}{{ range $path, $name := $valueEnv }}{{ if not (and (regexMatch `^values\.[A-Za-z0-9_]+$` $path) (typeIs "string" $name) $name) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local value_env as %s, and this entry reads it as a JSON object mapping each own value the Recipe delivers by default, values.<key>, to the variable it is delivered as, such as {\"values.timeout\": \"TASK_TIMEOUT\"}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- $socketEnv := dict }}
      {{- with toString (optional .locals "socket_env" "") }}
      {{- $socketEnv = fromJson . }}
      {{- $ok := kindIs "map" $socketEnv }}
      {{- if $ok }}{{ range $socket, $table := $socketEnv }}{{ if kindIs "map" $table }}{{ range $name, $key := $table }}{{ if not (and $name (typeIs "string" $key) $key) }}{{ $ok = false }}{{ end }}{{ end }}{{ else }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "the Recipe importing %s declares the local socket_env as %s, and this entry reads it as a JSON object mapping each socket whose connections it delivers by default to an object mapping each variable to the key of the target's provides it carries, such as {\"database\": {\"DB_HOST\": \"host\"}}: declare it so" $entry .) }}
      {{- end }}
      {{- end }}
      {{- with toString (optional .locals "gpu" "") }}
      {{- fail (printf "the Recipe importing %s declares the local gpu as %s, and this realization runs every Container Apps app and job on its environment's Consumption workload profile, which gives a container no GPU, and names no GPU workload profile: leave gpu out of the Recipe realizing the component on Container Apps, or map the component to a realization that runs it with a GPU" $entry .) }}
      {{- end }}
      {{- $port := toString (optional .locals "container_port" "") }}
      {{- $portFrom := "the local container_port of the Recipe realizing it" }}
      {{- if not $port }}{{ $port = toString (optional .infra "port" "") }}{{ $portFrom = "infra.port" }}{{ end }}
      {{- if and $port (not (and (regexMatch `^[0-9]{1,5}$` $port) (ge (atoi $port) 1) (le (atoi $port) 65535))) }}
      {{- fail (printf "the component %q listens on %s, which is %q, and a container's port is a whole number from 1 to 65535: set it to one" $id $portFrom $port) }}
      {{- end }}
      {{- $probe := toString (optional .locals "probe_path" "") }}
      {{- if and $probe (not (hasPrefix "/" $probe)) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and a probe requests an HTTP path, which begins with /: declare it so, or leave it out for no probe" $entry $probe) }}
      {{- end }}
      {{- if and $probe (not $port) }}
      {{- fail (printf "the Recipe importing %s declares the local probe_path as %q, and the component's container listens on no port, neither the local container_port of the Recipe realizing it nor infra.port naming one, so the probe has no port to request it on: declare the local container_port as the port the container answers it on" $entry $probe) }}
      {{- end }}
      {{- $env := dict }}
      {{- $source := dict }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- $_ := set $env $k (toString $v) }}
      {{- $_ := set $source $k $by }}
      {{- end }}
      {{- $defaults := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- $table := optional $socketEnv (toString $edge.socket) dict }}
      {{- if and $table (not $edge.inject) }}
      {{- range $name, $key := $table }}
      {{- $provides := default dict $edge.provides }}
      {{- if not (hasKey $provides $key) }}
      {{- fail (printf "the component %q delivers its connection %q, on the socket %q, as the variable %s by default, carrying the key %s the target publishes, and %q publishes no %s: dictate that connection's variables with an inject block on it" $id $alias (toString $edge.socket) $name $key (toString $edge.target) $key) }}
      {{- end }}
      {{- if hasKey $defaults $name }}
      {{- fail (printf "the component %q delivers its connections %q and %q, both on the socket %q, under the same default names, and both would set %s: dictate the variables of one of them with an inject block on it" $id (index $defaults $name) $alias (toString $edge.socket) $name) }}
      {{- end }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its connection %q as %s by default, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $id $alias $name (index $source $name)) }}
      {{- end }}
      {{- $_ := set $env $name (toString (index $provides $key)) }}
      {{- $_ := set $source $name (printf "the default for its connection %q" $alias) }}
      {{- $_ := set $defaults $name $alias }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $name := $valueEnv }}
      {{- $key := trimPrefix "values." $path }}
      {{- $v := optional $.values $key nil }}
      {{- if and (not (hasKey $named $path)) (not (kindIs "invalid" $v)) }}
      {{- if hasKey $source $name }}
      {{- fail (printf "the component %q delivers its own value %s to the container as %s, and %s delivers a variable under that name as well, so one would silently replace the other: rename that variable, or give the value another name with an entry of the component's own inject block reading it alone" $id $path $name (index $source $name)) }}
      {{- end }}
      {{- if or (kindIs "slice" $v) (kindIs "map" $v) }}{{ $_ := set $env $name (toJson $v) }}{{ else }}{{ $_ := set $env $name (toString $v) }}{{ end }}
      {{- $_ := set $source $name (printf "the default for its own value %s" $path) }}
      {{- end }}
      {{- end }}
      {{- range $k, $_ := $env }}
      {{- if has $k $reserved }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and %s, so the two would collide: rename the variable where it is dictated" $id $k (index $source $k) $reservedSentence) }}
      {{- end }}
      {{- end }}
      {{- $image := toString (optional .infra "image" "") }}
      {{- if not $image }}{{ $image = toString (optional .locals "default_image" "") }}{{ end }}
      {{- if not $image }}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and the Recipe realizing it holds no default image, as a Recipe running the Release's own code holds none; set infra.image in the Release to the container image it runs" $id) }}
      {{- end }}
      {{- $compute := optional .infra "compute" dict }}
      {{- $c := toString (optional $compute "cpu" "") }}
      {{- $mc := -1 }}
      {{- if regexMatch `^[0-9]+m$` $c }}{{ $mc = atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c }}
      {{- $p := splitList "." $c }}{{ $f := 0 }}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end }}
      {{- $mc = add (mul (atoi (index $p 0)) 1000) $f }}
      {{- end }}
      {{- if lt $mc 0 }}
      {{- fail (printf "infra.compute.cpu of %q is %q, and this realization reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms, or remove it to take the component's default" $id $c) }}
      {{- end }}
      {{- $m := toString (optional $compute "memory" "") }}
      {{- $mib := -1 }}
      {{- if regexMatch `^[0-9]+Mi$` $m }}{{ $mib = atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m }}{{ $mib = mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end }}
      {{- if lt $mib 0 }}
      {{- fail (printf "infra.compute.memory of %q is %q, and this realization reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms, or remove it to take the component's default" $id $m) }}
      {{- end }}
      {{- $size := list }}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") }}
      {{- if and (not $size) (ge (index . 0) $mc) (ge (index . 1) $mib) }}
      {{- $size = list (index . 2) (index . 3) }}
      {{- end }}
      {{- end }}
      {{- if not $size }}
      {{- fail (printf "infra.compute of %q asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" $id $c $m) }}
      {{- end }}
      {{- $replicas := 0 }}
      {{- if $instances }}
      {{- $replicas = optional .infra "replicas" 1 }}
      {{- if not (and (regexMatch `^[0-9]{1,3}$` (toString $replicas)) (ge (atoi (toString $replicas)) 1) (le (atoi (toString $replicas)) 300)) }}
      {{- fail (printf "infra.replicas of %q is %s, and the azurerm provider takes a container app's replica count from 1 to 300: set infra.replicas in the Release to a count in that range" $id (toJson $replicas)) }}
      {{- end }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $required := list "resource_group_name" "container_app_environment_id" }}
      {{- $ask := "infra.overrides.resource_group_name and infra.overrides.container_app_environment_id" }}
      {{- if $located }}
      {{- $required = append $required "location" }}
      {{- $ask = "infra.overrides.resource_group_name, infra.overrides.container_app_environment_id and infra.overrides.location, the region the environment is in" }}
      {{- end }}
      {{- range $k := $required }}
      {{- $v := optional $o $k "" }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "the component %q runs as a %s in the operator's own Azure Container Apps environment and resource group, and this realization never chooses them, but infra.overrides.%s carries none: in the Release, set %s" $id $resource $k $ask) }}
      {{- end }}
      {{- end }}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.App/managedEnvironments/[^/]+$` $o.container_app_environment_id) }}
      {{- fail (printf "infra.overrides.container_app_environment_id of %q is %q, and this realization takes the Container Apps environment the %s runs in as the environment's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $id $o.container_app_environment_id $resource) }}
      {{- end }}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` }}
      {{- if hasKey $o "registry_password" }}
      {{- fail (printf "infra.overrides.registry_password of %q is set, and this realization takes a registry password only by reference, so that its value is never written into the rendered configuration: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" $id) }}
      {{- end }}
      {{- if hasKey $o "identity_ids" }}
      {{- $s := index $o "identity_ids" }}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) }}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}
      {{- if not $ok }}
      {{- fail (printf "infra.overrides.identity_ids of %q is %s, and this realization reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" $id (toJson $s)) }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $k := list "registry_server" "registry_username" }}
      {{- if hasKey $o $k }}
      {{- $v := index $o $k }}
      {{- if not (and (typeIs "string" $v) $v) }}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this realization reads it as a string: set it in the Release to one, or remove it" $k $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if hasKey $o "registry_password_secret_id" }}
      {{- $v := index $o "registry_password_secret_id" }}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) }}
      {{- fail (printf "infra.overrides.registry_password_secret_id of %q is %s, and this realization reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" $id (toJson $v)) }}
      {{- end }}
      {{- end }}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" }}
      {{- $set := list }}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end }}
      {{- if and $set (not (hasKey $o "registry_server")) }}
      {{- fail (printf "infra.overrides.%s of %q is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set) $id) }}
      {{- end }}
      {{- if hasKey $o "registry_server" }}
      {{- $missing := list }}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end }}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) (len $byPassword)) }}
      {{- fail (printf "infra.overrides of %q sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" $id) }}
      {{- end }}
      {{- if and (not (hasKey $o "registry_identity")) $missing }}
      {{- fail (printf "infra.overrides.registry_server of %q names a private registry, and this realization pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" $id (first $missing)) }}
      {{- end }}
      {{- end }}
      config:
        name: {{ toJson $id }}
        {{- if $located }}
        location: {{ toJson $o.location }}
        {{- end }}
        resource_group_name: {{ toJson $o.resource_group_name }}
        container_app_environment_id: {{ toJson $o.container_app_environment_id }}
        image: {{ toJson $image }}
        {{- if $port }}
        port: {{ $port }}
        {{- end }}
        cpu: {{ toJson (index $size 0) }}
        memory: {{ toJson (index $size 1) }}
        {{- if $instances }}
        replicas: {{ $replicas }}
        {{- end }}
        environment: {{ toJson $env }}
        {{- with $files }}
        files: {{ toJson . }}
        {{- end }}
        {{- with optional $o "identity_ids" "" }}
        identity_ids: {{ toJson . }}
        {{- end }}
        {{- range $k := list "registry_server" "registry_identity" "registry_username" "registry_password_secret_id" "registry_password_identity" }}
        {{- with optional $o $k "" }}
        {{ $k }}: {{ toJson . }}
        {{- end }}
        {{- end }}
        {{- with $probe }}
        probe_path: {{ toJson . }}
        {{- end }}
        {{- if $scheduled }}
        {{- with toString (optional .values "schedule" "") }}
        schedule: {{ toJson . }}
        {{- end }}
        {{- end }}
