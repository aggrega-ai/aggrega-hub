apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/athena
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Athena is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon Athena workgroup: the place a client runs its SQL queries
    in, over data in Amazon S3 and the other sources Athena reads, whose
    databases and tables the AWS Glue Data Catalog describes. The workgroup
    holds the settings its queries run under, among them where their
    results go and how much data one query may scan, and keeps its own
    query history and saved queries. A consumer reads work_group, the name
    a query names to run in it.

    The workgroup takes the component's name. Databases and tables are the
    Data Catalog's and queries the application's, so no value of the
    Aggregate describes them. A client calls Athena's endpoint in the
    workgroup's Region and signs each call with its own IAM identity, so no
    credential and no address of the workgroup's own are published.

    Each realization writes query results to storage Athena manages, which
    keeps them for 24 hours, unless the Release names an Amazon S3 location
    for them in a bucket that is the operator's; no bucket is created. Each
    Recipe's description says which keys it honours and which it refuses
    by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values: databases and tables are objects of the AWS Glue Data Catalog,
  # and queries are what the application sends, so no value of the Aggregate
  # describes them. No credential slot: a client signs each call with its own
  # IAM identity, which the operator grants access to the workgroup.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      work_group:
        type: string
        required: true
        description: >
          The workgroup's name, which a client names to run its queries in
          this workgroup: the WorkGroup of Athena's StartQueryExecution call,
          and the workgroup setting of its JDBC and ODBC drivers. A
          realization publishes a pointer string the provisioning tool
          resolves to the name once the workgroup exists, so a consumer
          reads this rather than composing one.

  # The rule Amazon Athena holds a workgroup's name to, which every
  # realization's workgroup, named after the component, is created under. It
  # halts the build naming the component rather than leaving the creation to
  # fail.
  assertions:
    # Athena takes a workgroup name of 1 to 128 letters, digits, periods,
    # underscores and hyphens (the CreateWorkGroup reference), and every AWS
    # account already holds a workgroup named primary, which cannot be deleted
    # (the Athena User Guide's considerations for workgroups).
    work_group_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9._-]{1,128}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon Athena workgroup, and Athena takes a workgroup name of 1 to 128 letters, digits, periods, underscores and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
      {{- if eq $n "primary" -}}
      {{- fail "the component \"primary\" names its Amazon Athena workgroup, and every AWS account already holds a workgroup named primary, which cannot be deleted: rename the component in the Aggregate" -}}
      {{- end -}}
