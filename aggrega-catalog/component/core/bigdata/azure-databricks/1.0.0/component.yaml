apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/azure-databricks
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Databricks is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Databricks workspace: Microsoft's managed Apache Spark
    analytics platform, where notebooks, jobs and SQL queries run on
    classic clusters the service starts in the operator's subscription, or
    on serverless compute Azure Databricks runs in its own. A consumer
    reads the workspace's host name and its https:// address, where the
    workspace's web application and REST API answer.

    Clusters, jobs, notebooks and SQL warehouses are objects inside the
    workspace, created through its own web application and API rather than
    declared here. A caller authenticates with a Microsoft Entra ID token or
    a token Azure Databricks issues, and no credential is published.

    Azure Databricks also creates a managed resource group in the
    workspace's subscription, outside the Release, and keeps in it the
    workspace storage account, an access connector reaching that account,
    and each running cluster's virtual machines, disks and network
    interfaces; Azure denies changes to the group. Deleting the workspace
    removes the clusters' resources but keeps the storage account and the
    access connector, in a group the operator then owns, unless the
    deletion is forced. No backup is configured: the service keeps the
    workspace's objects in its control plane, replicated across
    availability zones, and its disaster recovery copies them to a second
    workspace outside the Release. Each Recipe's description says which
    keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values: clusters, jobs, notebooks and SQL warehouses are objects the
  # workspace holds, created through its web application or REST API by its
  # users, so no value of the Aggregate describes them.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The workspace's host name, as the service reports it, such as
          adb-<workspace id>.<n>.azuredatabricks.net in the public cloud. A
          realization publishes a pointer string the provisioning tool
          resolves once the workspace exists, so a consumer reads this rather
          than deriving one.
      endpoint:
        type: string
        description: >
          https:// followed by host: the address a client opens the
          workspace's web application at and sends its REST API calls to. It
          carries no credential.
