apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/bigquery
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: BigQuery is a hosted service
  # the reader contracts for with Google Cloud, under Google Cloud's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The dataset's behaviour follows BigQuery's REST reference of a dataset:
  # the rule for a dataset's ID, and its location, fixed when the dataset is
  # created.
  description: >
    One BigQuery dataset: the container of tables, views and routines that
    BigQuery, Google Cloud's serverless data warehouse, keeps in one
    location of a project. A consumer reads dataset_id, the ID a query names
    a table under, dataset_id.table, or project.dataset_id.table from
    another project.

    The dataset takes the ID values.dataset_id gives, or else the instance's
    name with each hyphen written as an underscore. Its tables, views and
    routines are the application's, created by its DDL, its loads or its
    jobs; none is declared here. A client calls the BigQuery API at
    bigquery.googleapis.com and signs each call with its own Google
    identity, which the operator grants access to the dataset through IAM,
    so no credential and no address are published.

    Reach for it where an application keeps data it analyses with SQL in
    Google Cloud. The project, and a Cloud KMS key the dataset is encrypted
    with, are the operator's. Each Recipe's description says which keys it
    honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No credential slot: a client signs each call with its own Google
  # identity, which the operator grants a BigQuery role on the dataset.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The value
      # may be omitted, so a bare `analytics: {}` keeps a working contract: a
      # dataset whose ID is the instance's name.
      dataset_id:
        type: string
        max: 1024
        pattern: "^[A-Za-z0-9_]+$"
        description: >
          The dataset's ID, published as dataset_id: 1 to 1,024 letters,
          digits and underscores, as BigQuery names a dataset; letters keep
          their case, so Sales and sales are two datasets. Unset, the
          dataset takes the instance's name with each hyphen written as an
          underscore, which the same rule then holds. BigQuery fixes a
          dataset's ID when it creates the dataset, so a changed ID takes a
          new, empty dataset.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      dataset_id:
        type: string
        required: true
        description: >
          The dataset's ID, which a query names a table under,
          dataset_id.table, and which a client library's dataset reference
          takes beside the project. A realization publishes a pointer string
          the provisioning tool resolves to the ID once the dataset exists,
          so a consumer reads this rather than composing one.

  # BigQuery's rule for a dataset's ID: letters, digits and underscores, up
  # to 1,024 characters (the REST reference of a dataset). The schema holds
  # values.dataset_id to it; this holds the instance's name where it stands
  # in, with its hyphens written as underscores, to the length, since the
  # Aggregate already holds an instance's name to letters, digits,
  # underscores and hyphens.
  assertions:
    dataset_id: >-
      {{- if not (optional .values "dataset_id" "") -}}
      {{- $id := replace "-" "_" .metadata.instance_id -}}
      {{- if gt (len $id) 1024 -}}
      {{- fail (printf "values.dataset_id is unset, so the dataset takes the instance's name, %d characters long, and BigQuery takes a dataset ID of up to 1,024 characters: set values.dataset_id in the Aggregate, or rename the instance" (len $id)) -}}
      {{- end -}}
      {{- end -}}
