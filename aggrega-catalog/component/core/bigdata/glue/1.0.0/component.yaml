apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/glue
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: the AWS Glue Data Catalog is a
  # hosted service the reader contracts for with AWS, under AWS's terms, which
  # no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One database in the AWS Glue Data Catalog: the named group of table
    definitions, each a table's columns and where its data lies, that
    Amazon Athena, AWS Glue jobs and other engines read before they read
    the data. A consumer reads database, the name a query or a job names.

    The database takes the name values.database gives. Its tables are the
    application's, created by its DDL, a crawler or a job outside this
    contract; jobs and crawlers are not offered here, since each needs a
    service role and a script or crawl targets of its own. A client calls
    AWS Glue's endpoint in the database's Region and signs each call with
    its own IAM identity, so no credential and no address are published.

    The database is created in the Data Catalog of the account and Region
    it is deployed to. The Release may name its location, an Amazon S3
    location in a bucket that is the operator's; no bucket is created, and
    Lake Formation permissions stay the operator's. Deleting the database
    deletes the tables it holds. Each Recipe's description says which keys
    it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No credential slot: a client signs each call with its own IAM identity,
  # which the operator grants access to the database, through IAM policies or
  # Lake Formation permissions.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # database's name has no default: it is unique among the databases of
      # the account's Data Catalog in its Region, and the application's
      # queries name it.
      database:
        type: string
        required: true
        pattern: "^[a-z0-9_]{1,255}$"
        description: >
          The database's name, published as database: 1 to 255 lowercase
          letters, digits and underscores. The Data Catalog folds a database
          name to lower case, and the AWS Glue Developer Guide asks for
          letters, digits and underscores alone in the name of a database
          Amazon Athena reads; the schema holds this rule. The name is unique
          among the databases of the account's Data Catalog in its Region, and
          the Data Catalog renames no database, so a changed name takes a new,
          empty database.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      database:
        type: string
        required: true
        description: >
          The database's name, which a client names to reach the tables it
          holds: the DatabaseName of AWS Glue's table calls, and the database
          an Amazon Athena query runs against, the Database of its query
          execution context or the first part of a table written
          database.table. A realization publishes a pointer string the
          provisioning tool resolves to the name once the database exists, so
          a consumer reads this rather than composing one.
