apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/azure-data-factory
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Data Factory is a
  # hosted service the reader contracts for with Microsoft, under Azure's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Data Factory: Microsoft's managed data integration service,
    whose pipelines run activities that copy data between stores and start
    work in other services. The factory holds the pipelines
    values.pipelines declares, each written as Data Factory writes a
    pipeline's definition, and the global parameters
    values.global_parameters declares, which its pipelines read.

    A pipeline's activities name the factory's linked services, datasets,
    data flows and integration runtimes by reference. Those, and the
    triggers that start a pipeline on a schedule or an event, are objects of
    the factory the operator creates outside the Release, in Data Factory
    Studio or through its API, before a pipeline naming them is deployed;
    without a trigger, a pipeline runs when a caller starts it. The factory
    reaches each store with the identity or credential its linked service
    names.

    The factory publishes no address: it is managed through Azure Resource
    Manager, where a caller starts a pipeline run under its own Microsoft
    Entra ID identity. No backup is configured: the factory holds
    definitions rather than data, and its pipelines and global parameters
    are written each time the Release deploys. Each Recipe's description
    says which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `ingest: {}` keeps a working contract: a
      # factory holding no pipeline and no global parameter.
      pipelines:
        type: object
        default: {}
        # Microsoft Learn's pipeline JSON reference: at most 140 characters,
        # beginning with a letter, a digit or an underscore, none of
        # . + ? / < > * % & : or \; the pipeline resource's schema and the
        # azurerm provider also refuse #.
        propertyNames:
          pattern: '^[A-Za-z0-9_][^.+?/<>*%&:\\#]{0,139}$'
        additionalProperties:
          type: object
          required:
            - activities
          properties:
            activities:
              type: array
              minItems: 1
              items:
                type: object
              description: >
                The pipeline's activities, each an object in Data Factory's
                own spelling: name, type, typeProperties, dependsOn, policy
                and the rest an activity of that type takes. Microsoft
                documents the section as required, holding one or more
                activities.
            description:
              type: string
              description: The text describing what the pipeline is for.
            parameters:
              type: object
              additionalProperties:
                type: object
                required:
                  - type
                properties:
                  type:
                    enum: [Object, String, Int, Float, Bool, Array, SecureString]
                  defaultValue:
                    type: [string, number, integer, boolean, array, object]
                additionalProperties: false
              description: >
                The pipeline's parameters, a map from each parameter's name
                to its type and, optionally, its default value; a parameter
                with no default is given a value by the run that starts the
                pipeline.
            variables:
              type: object
              additionalProperties:
                type: object
                required:
                  - type
                properties:
                  type:
                    enum: [String, Bool, Array]
                  defaultValue:
                    type: [string, number, integer, boolean, array, object]
                additionalProperties: false
              description: >
                The pipeline's variables, a map from each variable's name to
                its type and, optionally, its default value.
            concurrency:
              type: integer
              minimum: 1
              description: >
                The most runs of the pipeline at once; a run started beyond it
                is queued. Unset, the pipeline has no limit.
            annotations:
              type: array
              description: Tags describing the pipeline.
            folder:
              type: object
              properties:
                name:
                  type: string
              additionalProperties: false
              description: The folder the pipeline appears in, by its name, in Data Factory Studio; unset, at the root.
            policy:
              type: object
              properties:
                elapsedTimeMetric:
                  type: object
                  properties:
                    duration:
                      type: [string, number, integer, boolean, array, object]
                  additionalProperties: false
              additionalProperties: false
              description: >
                The pipeline's policy: elapsedTimeMetric.duration, the
                timespan after which a run still going raises an Azure
                Monitor metric.
            runDimensions:
              type: object
              description: The dimensions each run of the pipeline emits.
          additionalProperties: false
        description: >
          The factory's pipelines, a map from each pipeline's name to its
          definition: the properties of a Data Factory pipeline, activities
          among them, written as Data Factory writes them, as the properties
          object of a pipeline's JSON in Data Factory Studio's code view.
          Microsoft documents a pipeline's name as at most 140 characters,
          beginning with a letter, a digit or an underscore and holding none
          of . + ? / < > * % & : or \, the pipeline resource's schema also
          refusing #, and takes names without regard to case; the build halts
          on another name, naming this key. Left empty, the factory holds no
          pipeline.
      global_parameters:
        type: object
        default: {}
        additionalProperties:
          type: object
          required:
            - type
            - value
          properties:
            type:
              enum: [Object, String, Int, Float, Bool, Array]
            value:
              type: [string, number, integer, boolean, array, object]
          additionalProperties: false
        description: >
          The factory's global parameters, a map from each parameter's name
          to its type, Object, String, Int, Float, Bool or Array, and its
          value, which every pipeline of the factory reads as
          pipeline().globalParameters.<name>. The value is of the declared
          type: text for String, a whole number for Int, a number for Float,
          true or false for Bool, a list for Array and a map for Object; the
          build halts on a value of another kind, naming this key. Left
          empty, the factory has none.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    # No provides: the factory has no address of its own. Azure Resource
    # Manager manages it, and a caller starting a pipeline run names the
    # factory there.
  # Data Factory takes a pipeline's name without regard to case, so two names
  # differing only in case name one pipeline.
  assertions:
    pipeline_names_distinct: >-
      {{- $seen := dict -}}
      {{- range $name, $_ := (default dict .values.pipelines) -}}
      {{- $k := lower $name -}}
      {{- if hasKey $seen $k -}}
      {{- fail (printf "values.pipelines names %q and %q, and Data Factory takes a pipeline's name without regard to case, so both name one pipeline: rename one of them in the Aggregate" (get $seen $k) $name) -}}
      {{- end -}}
      {{- $_ := set $seen $k $name -}}
      {{- end -}}
    # A global parameter's value is of the kind its type names, so a value of
    # another kind never reaches a realization to be rewritten as text or
    # read by Data Factory as a different type from the one declared.
    global_parameter_types: >-
      {{- range $name, $spec := (default dict .values.global_parameters) -}}
      {{- $v := $spec.value -}}
      {{- $ok := false -}}
      {{- if eq $spec.type "String" }}{{ $ok = kindIs "string" $v }}{{ end -}}
      {{- if eq $spec.type "Bool" }}{{ $ok = kindIs "bool" $v }}{{ end -}}
      {{- if eq $spec.type "Array" }}{{ $ok = kindIs "slice" $v }}{{ end -}}
      {{- if eq $spec.type "Object" }}{{ $ok = kindIs "map" $v }}{{ end -}}
      {{- if eq $spec.type "Float" }}{{ $ok = or (kindIs "int" $v) (kindIs "int64" $v) (kindIs "float64" $v) }}{{ end -}}
      {{- if eq $spec.type "Int" }}{{ $ok = or (kindIs "int" $v) (kindIs "int64" $v) (and (kindIs "float64" $v) (eq (toString (int64 $v)) (toString $v))) }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "values.global_parameters.%s is of type %s, and its value %s is not of that kind: write the value as %s in the Aggregate, or change the type to the kind the value has" $name $spec.type (toJson $v) (get (dict "String" "text" "Int" "a whole number" "Float" "a number" "Bool" "true or false" "Array" "a list" "Object" "a map") $spec.type)) -}}
      {{- end -}}
      {{- end -}}
