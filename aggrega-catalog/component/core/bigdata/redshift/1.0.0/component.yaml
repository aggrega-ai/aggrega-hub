apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/redshift
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Redshift is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon Redshift data warehouse, run serverless: a namespace, which
    holds the warehouse's databases, users and data, and a workgroup, the
    compute serving its SQL queries, which the service scales in Redshift
    Processing Units. A consumer reads the workgroup's host and port, the
    administrator's user name, the database the namespace creates, and the
    protocol.

    Amazon Redshift generates the administrator's password and keeps it in
    AWS Secrets Manager, in a secret the service creates, so the password
    never travels through this contract: the password slot stays empty or
    takes core/generated-secret, and any other credential halts the build.

    Schemas, tables, further databases and users are objects inside the
    warehouse, created through SQL rather than declared here. No backup is
    configured: the service keeps recovery points of the namespace, taken
    at least every 30 minutes and kept for 24 hours, with no setting that
    changes either, and a snapshot kept longer is taken outside the
    Release. Each Recipe's description says which keys it honours and
    which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The credential slot. inject: [] is black-box: the Recipe decides how the
  # credential reaches the service. Optional, since Amazon Redshift keeps the
  # administrator's password itself and needs nothing attached.
  featuresSchema:
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The password of the administrator values.user names. Amazon Redshift generates it and keeps it in AWS Secrets Manager, so the slot carries nothing to the service: it stays empty, or takes core/generated-secret, which says the service owns the password, and a realization halts naming the slot on any other credential."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `warehouse: {}` keeps a working contract.
      database:
        type: string
        default: dev
        description: The database the namespace creates when it is created, published as database, so a consumer's connection lands in it. A realization halts the build on a name its service does not take, naming this key.
      user:
        type: string
        default: admin
        description: The administrator the namespace creates, published as user. Its password is the one the service generates and keeps, and never travels through this contract. A realization halts the build on a name its service does not take, naming this key.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5439
        description: TCP port the workgroup accepts connections on, published as port. A realization halts the build on a port its service does not serve, naming this key.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client opens its SQL connection to: a pointer string the
          provisioning tool resolves to the workgroup's address once the
          workgroup exists, so a consumer reads this rather than deriving one.
          A realization publishes the DNS name the Release sets in
          infra.overrides.host instead of its pointer, so a consumer on
          another target receives an address it can resolve.
      port:
        type: integer
        required: true
        description: TCP port the workgroup accepts connections on. A consumer reads it rather than assuming 5439.
      user:
        type: string
        description: Name of the administrator a consumer authenticates as. The matching password is the one the service keeps in AWS Secrets Manager, never this contract.
      database:
        type: string
        description: Name of the database the namespace creates. A consumer names it in its connection to land in it.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `redshift`, the protocol Amazon Redshift's own JDBC, ODBC and Python drivers connect with, which is what a consumer selects a driver for.
