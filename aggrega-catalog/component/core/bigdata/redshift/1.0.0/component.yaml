apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/redshift
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Redshift is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon Redshift data warehouse, run serverless: a namespace, which
    holds the warehouse's databases, users and data, and a workgroup, the
    compute serving its SQL queries, which the service scales in Redshift
    Processing Units. A consumer reads the workgroup's host and port, the
    administrator's user name, the database the namespace creates, and the
    protocol.

    Amazon Redshift generates the administrator's password and keeps it in
    AWS Secrets Manager, in a secret the service creates, so the password
    never travels through this contract: the password slot stays empty or
    takes core/generated-secret, and any other credential halts the build.

    Schemas, tables, further databases and users are objects inside the
    warehouse, created through SQL rather than declared here. No backup is
    configured: the service keeps recovery points of the namespace, taken
    at least every 30 minutes and kept for 24 hours, with no setting that
    changes either, and a snapshot kept longer is taken outside the
    Release. Each Recipe's description says which keys it honours and
    which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The credential slot. inject: [] is black-box: the Recipe decides how the
  # credential reaches the service. Optional, since Amazon Redshift keeps the
  # administrator's password itself and needs nothing attached.
  featuresSchema:
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The password of the administrator values.user names. Amazon Redshift generates it and keeps it in AWS Secrets Manager, so the slot carries nothing to the service: it stays empty, or takes core/generated-secret, which says the service owns the password, and a realization halts naming the slot on any other credential."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `warehouse: {}` keeps a working contract.
      database:
        type: string
        default: dev
        pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,126}$"
        description: The database the namespace creates when it is created, published as database, so a consumer's connection lands in it. Amazon Redshift takes 1 to 127 letters, digits and underscores beginning with a letter, and no word it reserves; the schema holds the first rule and the Component halts the build on a reserved word, naming this key.
      user:
        type: string
        default: admin
        pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,126}$"
        description: The administrator the namespace creates, published as user. Its password is the one the service generates and keeps, and never travels through this contract. Amazon Redshift takes 1 to 127 letters, digits and underscores beginning with a letter, and neither PUBLIC nor a word it reserves; the schema holds the first rule and the Component halts the build on the others, naming this key.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5439
        description: TCP port the workgroup accepts connections on, published as port. Amazon Redshift Serverless serves a workgroup on a port from 5431 to 5455 or from 8191 to 8215, and the Component halts the build on any other, naming this key.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client opens its SQL connection to: a pointer string the
          provisioning tool resolves to the workgroup's address once the
          workgroup exists, so a consumer reads this rather than deriving one.
          A realization publishes the DNS name the Release sets in
          infra.overrides.host instead of its pointer, so a consumer on
          another target receives an address it can resolve.
      port:
        type: integer
        required: true
        description: TCP port the workgroup accepts connections on. A consumer reads it rather than assuming 5439.
      user:
        type: string
        description: Name of the administrator a consumer authenticates as. The matching password is the one the service keeps in AWS Secrets Manager, never this contract.
      database:
        type: string
        description: Name of the database the namespace creates. A consumer names it in its connection to land in it.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `redshift`, the protocol Amazon Redshift's own JDBC, ODBC and Python drivers connect with, which is what a consumer selects a driver for.

  # The rules Amazon Redshift holds a warehouse's names and port to, which every
  # realization's namespace and workgroup are created under. Each halts the
  # build naming the key rather than leaving the creation to fail.
  assertions:
    # A database or user name is not one of the words Amazon Redshift reserves
    # (the Database Developer Guide's list of reserved words, in lower case),
    # and Amazon Redshift folds a name's letters to lower case. A user name is
    # not PUBLIC either (CREATE USER). The schema holds the names' shape.
    names_not_reserved: >-
      {{- $reserved := splitList " " "aes128 aes256 all allowoverwrite analyse analyze and any array as asc authorization az64 backup between binary blanksasnull both bytedict bzip2 case cast check collate column constraint create credentials cross current_date current_time current_timestamp current_user current_user_id default deferrable deflate defrag delta delta32k desc disable distinct do else emptyasnull enable encode encrypt encryption end except explicit false for foreign freeze from full globaldict256 globaldict64k grant group gzip having identity ignore ilike in initially inner intersect interval into is isnull join leading left like limit localtime localtimestamp lun luns lzo lzop minus mostly16 mostly32 mostly8 natural new not notnull null nulls off offline offset oid old on only open or order outer overlaps parallel partition percent permissions pivot placing primary raw readratio recover references rejectlog resort respect restore right select session_user similar snapshot some sysdate system table tag tdes text255 text32k then timestamp to top trailing true truncatecolumns union unique unnest unpivot user using verbose wallet when where with without" -}}
      {{- $d := lower (toString .values.database) -}}
      {{- if has $d $reserved -}}
      {{- fail (printf "values.database is %q, the database the namespace creates, and Amazon Redshift takes no database name that is one of its reserved words: set values.database in the Aggregate to another name" .values.database) -}}
      {{- end -}}
      {{- $u := lower (toString .values.user) -}}
      {{- if or (eq $u "public") (has $u $reserved) -}}
      {{- fail (printf "values.user is %q, the administrator the namespace creates, and Amazon Redshift takes no user name that is PUBLIC or one of its reserved words: set values.user in the Aggregate to another name" .values.user) -}}
      {{- end -}}
    port_served: >-
      {{- $p := int .infra.port -}}
      {{- if not (or (and (ge $p 5431) (le $p 5455)) (and (ge $p 8191) (le $p 8215))) -}}
      {{- fail (printf "infra.port is %v, and Amazon Redshift Serverless serves a workgroup on a port from 5431 to 5455 or from 8191 to 8215: set infra.port in the Release to such a port, or remove it for 5439" .infra.port) -}}
      {{- end -}}
