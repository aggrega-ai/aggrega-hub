apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/bigdata/dataflow
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Dataflow is a hosted service
  # the reader contracts for with Google Cloud, under Google Cloud's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. The
  # pipeline the job runs is the application's, in a template file and an
  # image the Release names, so no realization pins an artifact either; the
  # catalog distributes and brokers none, and the standard library's
  # admission test, which reads the artifacts an entity pins, finds nothing
  # to refuse.
  #
  # The job's behaviour follows Dataflow's documentation of Flex Templates
  # and its REST reference of a launch: the template file, a JSON spec in
  # Cloud Storage naming the container image that holds the pipeline; the
  # parameters, a map of strings the pipeline reads under its own names.
  description: >
    One Dataflow job launched from a Flex Template: Google Cloud's managed
    runner for Apache Beam pipelines, which starts the worker machines a
    pipeline needs, scales them and runs its batch or streaming steps on
    them. The job runs the template file infra.container_spec_gcs_path
    names in Cloud Storage, which names the container image holding the
    pipeline, with the parameters values.parameters gives. A consumer reads
    job_id, the ID the Dataflow API names the job by.

    The template file and its image, the Cloud Storage locations the job
    stages and keeps temporary files in, the network its workers join and
    the service account they run as are the operator's. A topic, a table or
    a bucket the pipeline reads or writes reaches it as a parameter's
    value, so no socket is declared. A client calls the Dataflow API with
    its own Google identity, so no credential and no address are published.

    Each Recipe's description says which keys it honours and which it
    refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: bigdata
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No credential slot: the job's workers call other services as the
  # service account they run as, and a client of the Dataflow API signs
  # with its own Google identity.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The value
      # carries a default, so a bare `pipeline: {}` keeps a working contract:
      # a job launched with no parameter, for a template that requires none.
      parameters:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: >
          The template's parameters, a map from each parameter's name, as the
          template's metadata and the pipeline spell it, to its value, a
          string the pipeline parses: a topic, a table or a path the
          pipeline reads or writes is passed here. Each reaches the
          template as written. Left empty, the job is launched with no
          parameter.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # No default: the template file is built and uploaded outside the
      # Release, as the generic server's image is, so the Release names the
      # one the job runs.
      container_spec_gcs_path:
        type: string
        required: true
        description: >
          The Flex Template file the job runs, as a Cloud Storage path,
          gs://<bucket>/<object>: the JSON spec that names the container
          image holding the pipeline and the parameters it takes, which
          Dataflow reads when it launches the job.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      job_id:
        type: string
        required: true
        description: >
          The job's ID, which the Dataflow API's job methods and the gcloud
          dataflow jobs commands name it by. A realization publishes a
          pointer string the provisioning tool resolves to the ID once the
          job is launched, so a consumer reads this rather than composing
          one.
