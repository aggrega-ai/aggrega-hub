apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder, run in-cluster as the image a Release
    names. Flowise is a browser editor in which a chatflow is assembled from
    nodes and served over HTTP, so deploying it gives the editor and the
    endpoint together, backed by a volume holding the chatflow database and
    the key encrypting the editor's credentials. What this component exposes
    is the chatflow a caller invokes and the per-request overrides that call
    may carry; the model wired into the `model` socket arrives as the endpoint
    an OpenAI-compatible client reads, while the chatflow's own node chooses
    the model it calls.
    The catalog pins no image for it: which Flowise build to run is named by
    the Release, and until that Release sets `infra.image` the build halts
    naming the container image.

    A chatflow set as flow_definition is seeded at deploy, on both targets,
    under the owner account the operator names.

    Each tool wired into the optional `tools` socket, such as a Model Context
    Protocol server reached over HTTP, and each vector store wired into the
    optional `vector_store` socket reach the platform under variables named
    for the connection's alias, as each socket's comments set out:
    AGGREGA_TOOL_<ALIAS>_URL or AGGREGA_VECTOR_STORE_<ALIAS>_URL, their parts
    and the connection's credential, by reference. A chatflow reads each
    through a Runtime variable of the same name created on Flowise's Variables
    page, as $vars.<name>; nothing creates one at startup. A connection
    writing an `inject:` block receives the names it dictates instead of its
    address and part variables, read the same way; its credentials stay.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: open-core
  annotations:
    # How the platform's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. Flowise answers its metrics only
    # to an API key created inside Flowise, which the scrape presents; no slot
    # of this component holds it.
    observability.aggrega.ai/metrics-credential: separate-token
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint, which the Recipe reads the same way from either. The flow
    # itself names the model, which through a gateway is an alias its map
    # publishes. The platform reads this connection itself: the OpenAI client
    # library under a chatflow's OpenAI node reads OPENAI_BASE_URL and
    # OPENAI_API_KEY by those names, so the socket offers no inject block.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the platform presents to the model this connection reaches. When attached, the Recipe delivers it to the platform as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the platform runs without an injected key."
    # A tool socket, in the catalog's form: the category admits tools and
    # nothing else, and the transport admits only the tools the platform
    # reaches over HTTP. Optional, and it takes one connection per tool the
    # Aggregate wires. Flowise reads no tool's address from a variable of its
    # own: a chatflow reads a value from the platform's environment only
    # through a Runtime variable, which Flowise stores in its own database and
    # resolves from the environment variable of the same name. So the Recipe
    # delivers each connection under variables named for its alias,
    # upper-cased with every hyphen an underscore: a tool wired under the
    # alias docs-search arrives as AGGREGA_TOOL_DOCS_SEARCH_URL, which a
    # chatflow reads once a Runtime variable of that name exists. Those names
    # are defaults: a connection writing an inject block receives the values
    # it dictates, under the names it gives, in place of the address and the
    # header variables, as variables a Runtime variable of the same name reads
    # or as files at the paths it names; the credential and an endpoint secret
    # stay. Two aliases that differ only in letter case, or in a hyphen against
    # an underscore, would deliver one variable twice, and the Recipes halt the
    # build naming both; the vector_store socket's aliases are held to the
    # same.
    tools:
      selector: "component.aggrega.ai/category=ai-tool, tool.aggrega.ai/transport=http"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the tool it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the tool this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Both secrets are held on the connection they are used on, so each
      # connection names its own fill. Both are optional and transparent
      # (inject: [env]), so a synthesized Workload references either as an
      # environment secret on helm, and a compose Recipe reads either from the
      # inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional credential the platform presents to the tool this
            connection reaches, under the request header the tool publishes as
            credential_header: as Bearer <credential> under Authorization, and
            as the whole value of any other header. When attached, the Recipe
            delivers it as AGGREGA_TOOL_<ALIAS>_CREDENTIAL (a Kubernetes
            secretKeyRef on helm, the inject pipe on compose), and, on a
            connection writing no inject block, the header as
            AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER where the tool publishes one.
        endpoint:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional whole address of the tool this connection reaches, the part
            carrying its key included, for a server that reads its key from its
            own address. When attached, the Recipe delivers it as
            AGGREGA_TOOL_<ALIAS>_URL in place of the endpoint the tool publishes:
            a Kubernetes secretKeyRef on helm, so the key reaches no rendered
            file, and the inject pipe on compose, written as delivered.
    # A vector-store socket, in the catalog's idiom: the selector admits a
    # store whose engine label says it indexes vectors, or keeps a semantic
    # memory, rather than one product. Optional, and it takes one connection
    # per store the Aggregate wires, each delivered under variables named for
    # its alias as the tool socket's are: a store wired under the alias kb
    # arrives as AGGREGA_VECTOR_STORE_KB_URL. The address is the endpoint the
    # store publishes where it publishes one, and is otherwise composed from
    # the protocol, host and port it publishes, since a store such as
    # core/datastore/qdrant publishes its address in those parts alone. A
    # store that also publishes a database and a user, as
    # core/datastore/pgvector does, arrives in parts as well, as
    # AGGREGA_VECTOR_STORE_KB_HOST, _PORT, _DATABASE and _USER, because
    # Flowise's Postgres node takes no connection string: it takes the host
    # and the database in text fields a Runtime variable fills, the port in a
    # number field, and the user and the password from its Postgres API
    # credential, which Flowise stores and no Runtime variable fills. Those
    # names are defaults, as on the tool socket: a connection writing an
    # inject block receives what it dictates instead of the address and the
    # parts, read through a Runtime variable of the name it gives, and its
    # credential stays.
    vector_store:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the store it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the vector store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The store's key is held on the connection it is presented on, so each
      # connection names its own fill. Optional and transparent (inject: [env]),
      # so a synthesized Workload references it as an environment secret on
      # helm, and a compose Recipe reads it from the inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: Optional credential the platform presents to the vector store this connection reaches, such as the API key the store checks. When attached, the Recipe delivers it as AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, no credential is delivered for the store.
  featuresSchema:
    # The password of the platform's owner account, read only when
    # values.flow_definition is set. Flowise holds its accounts in its own
    # database, and the first account registered on a fresh instance becomes
    # the owner, so the step that seeds the chatflow registers that account
    # with this password, or signs in with it where the owner already exists.
    # Unlike a connection's credential it has no development literal to fall
    # back on: an owner password every reader of the catalog knows would hand
    # the platform to anyone who reads it, so the build halts instead.
    owner_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password of the owner account named by infra.owner_email, read only when values.flow_definition is set: the step that seeds the chatflow registers that account with it on a fresh instance, and signs in with it. Required then, and the build halts when nothing fills this slot; there is no development default. On helm the step receives it by reference, as a Kubernetes secretKeyRef to the Secret the credential publishes, so the password appears in no file the Recipe renders, and a credential publishing no Secret name and data key halts the build; on compose it is read from the inject pipe and written as it was delivered, so a Compose variable reference such as ${FLOWISE_OWNER_PASSWORD} lands as that reference. Flowise accepts a password of 8 to 128 characters holding a lower-case and an upper-case letter, a digit and a character that is neither."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        chatflow_id: { type: string }
        override_config:
          $jsonschema:
            type: object
            additionalProperties:
              type: [string, integer, boolean]
        # A chatflow carried verbatim, as Flowise's editor exports it. Flowise
        # loads no chatflow from a file or a variable at start-up, so both
        # Recipes seed it through the platform's own API after the platform
        # answers: a one-shot step signs in as the owner and writes the
        # chatflow at chatflow_id, which therefore names it in Flowise. Seeding
        # again updates that chatflow in place rather than adding a second.
        flow_definition:
          type: string
          description: "A chatflow in the JSON Flowise's editor exports for it, the nodes and edges of the canvas, carried verbatim. Realized by both targets: when set, a one-shot step running the platform's own image seeds it once the platform answers — a Job on helm, carrying the definition in a ConfigMap, and a service that runs once on compose, carrying it in a compose config with every $ written $$ and starting once the platform reports healthy. The step registers the owner account named by infra.owner_email with the password attached to the owner_password slot when the instance has no owner yet, and otherwise signs in as that account, halting with the cause when signing in is refused; then it updates the chatflow whose id is chatflow_id, replacing its nodes and edges, or imports the definition at that id where no such chatflow exists, named after display_name or, without one, after chatflow_id. So chatflow_id must be a UUID, which Flowise requires of a chatflow's id, and an edit made to the chatflow's canvas in the editor is replaced the next time the step runs, while its name and settings are kept. When set, infra.owner_email and the owner_password slot are required and the build halts without them. When unset, nothing is seeded and no step is rendered. An Aggregate's text is evaluated as a template before it is read, so a definition carrying Flowise's own {{...}} variable references halts the build when written into an Aggregate as it stands; supply it as a parameter the Release fills, written into this value through toJson, and it arrives as written."
        # Flowise's own metrics, in the Prometheus format, which it serves only
        # once ENABLE_METRICS is true, and in that format with METRICS_PROVIDER
        # prometheus; both Recipes deliver the two variables only while this
        # value is true. They are served at /api/v1/metrics on the platform's
        # port, 3000, behind the same API-key check as the rest of its API, so a
        # scrape presents a Flowise API key. While false the variables are not
        # delivered and the address is unpublished.
        metrics_enabled:
          type: boolean
          default: false
          description: Turns on Flowise's own metrics, in the Prometheus format, at /api/v1/metrics on the platform's port, 3000, and publishes their address as `metrics_endpoint`; while false that key is empty. Flowise answers them only to a valid Flowise API key presented as a bearer token.
      required: [chatflow_id]
    infra:
      image:
        type: string
        description: Container image running the Flowise platform.
      storage:
        size:
          type: string
          default: "2Gi"
          description: Size of the persistent volume backing the platform's chatflow database.
      # Who owns the platform is the operator's choice, so this carries no
      # default: a default would name an identity nobody chose.
      owner_email:
        type: string
        description: "Email address of the platform's owner account, read only when values.flow_definition is set. The step that seeds the chatflow registers this account when the instance has no owner yet, which makes it the owner, and signs in as it; on an instance that already has one, it names an account allowed to import chatflows, and the password attached to the owner_password slot is that account's. Required when values.flow_definition is set: the build halts when it is empty. It has no default."
    provides:
      # The address a Prometheus server scrapes the platform's own metrics at,
      # while values.metrics_enabled is true: /api/v1/metrics on port 3000 of
      # the name each Recipe serves the platform under. Every Recipe publishes
      # it spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:3000/api/v1/metrics`, the
          host being the name the platform is served under. Empty while
          values.metrics_enabled is false.
      # Whether a scrape of metrics_endpoint presents a credential: true while
      # values.metrics_enabled is true, since Flowise checks an API key on every
      # path of its API outside a fixed public list, and its metrics are not on
      # that list; false while it is false, when no address is published. The
      # metrics route checks that the key is valid, not what it permits, and
      # the same key opens whatever its permissions allow elsewhere.
      metrics_credential_required:
        type: boolean
        description: >
          Whether a scrape of `metrics_endpoint` must present a credential:
          true while values.metrics_enabled is true, because Flowise answers
          its metrics only to a valid API key, and false while no address is
          published. The metrics route checks only that the key is valid, and
          the key opens whatever its permissions allow elsewhere, so create one
          for the scrape with as little permission as Flowise lets a key carry.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  #
  # Seeding values.flow_definition needs an account to seed it as. A fresh
  # Flowise has none, and its first registered account becomes the owner, so
  # the seeding step registers infra.owner_email with the password attached
  # to owner_password, or signs in as that account where an owner exists.
  # Neither has a default: both name who owns the platform. And Flowise reads
  # and imports a chatflow only under an id its UUID check accepts, the check
  # written below as a pattern. Both Recipes seed the definition, so a
  # definition missing either account fact, or carrying a chatflow_id that is
  # not a UUID, halts here, whichever Recipe binds, where the fix is one line
  # of authored YAML, rather than as a step that fails once deployed. With no
  # definition nothing is read and nothing halts.
  assertions:
    flow_definition_needs_an_owner: >-
      {{- if optional .values "flow_definition" "" -}}
      {{- if not (optional .infra "owner_email" "") -}}
      {{- fail (printf "the Flowise platform %q is given values.flow_definition to seed but no infra.owner_email: set infra.owner_email in the Release to the email address of the platform's owner account, or remove flow_definition" .metadata.instance_id) -}}
      {{- end -}}
      {{- if not (hasKey (default dict .features) "owner_password") -}}
      {{- fail (printf "the Flowise platform %q is given values.flow_definition to seed but nothing fills its owner_password slot: attach a secret credential to owner_password holding the password of the account infra.owner_email names, or remove flow_definition" .metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
    flow_definition_needs_a_uuid: >-
      {{- if optional .values "flow_definition" "" -}}
      {{- if not (regexMatch "^(?i:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$" .values.chatflow_id) -}}
      {{- fail (printf "the Flowise platform %q is given values.flow_definition to seed under values.chatflow_id %q, which is not a UUID, and Flowise reads and imports a chatflow only under a UUID: set chatflow_id to one, such as the id the chatflow already carries in Flowise, or remove flow_definition" .metadata.instance_id .values.chatflow_id) -}}
      {{- end -}}
      {{- end -}}
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" "tools" "vector_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
