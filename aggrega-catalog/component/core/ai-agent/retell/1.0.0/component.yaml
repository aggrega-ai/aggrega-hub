apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/retell
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the platform is operated by its provider and no source licence is granted for
  # it, so no single identifier expresses the situation. The class it falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A voice-agent platform reached over Retell AI's REST API, so an application
    holds a spoken conversation with an agent Retell hosts and runs. The developer
    names the agent and, optionally, the version to run; the operator supplies the
    API base address and the platform-held dialable number a call originates from.
    Wire here rather than to a carrier: a carrier moves the call, an agent
    platform conducts the conversation, and many Releases want both.
    Consumers read the base address, the agent identifier, the version and that
    number. Realized by reference: no compute runs here.
  labels:
    # A platform the Release calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The platform's own documentation states that every request carries the API key
  # as a bearer token in the Authorization header, and that the same key is what
  # verifies the signature on a webhook the platform delivers. One piece of secret
  # material serves both directions, so one slot rather than a separate signing
  # secret. The slot is secret-kind-pinned but family-agnostic, so either a
  # referenceable credential or an inject-value credential may fill it per target.
  #
  # The slot is not required here, because whether a realization can carry the
  # credential depends on the target: the helm Recipe requires it and halts
  # naming it when it is empty, while the compose Recipe defines no service,
  # refuses a filled slot, and leaves the credential to the component that calls
  # the platform.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The API key presented as a bearer token in the Authorization header on every request, and the material a delivered webhook's signature is verified against.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The agent identifier is a value rather than a label because nothing
        # selects on it: it names which configured agent this wiring addresses,
        # and the Aggregate sets it. Published to consumers below so an application
        # reads it from one place instead of restating it.
        agent_id:
          type: string
          description: The identifier of the agent a call runs, as the platform's dashboard reports it.
        # This platform versions an agent by a reference the caller passes
        # through unchanged — a version number, or a tag the platform resolves —
        # so the key is a string and the catalog states no default: unset, the
        # platform applies its own.
        agent_version:
          type: string
          description: The agent version reference a call runs, a version number or a platform tag; unset, the platform applies its own default.
      required: [agent_id]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the platform's documented public host, so
      # taking the default needs no operator input. It is sourced from infra
      # rather than fixed in a Recipe so an operator may repoint it at
      # a proxy the Release routes egress through. A deterministic pointer
      # string the runtime resolves; the compiler never contacts it.
      endpoint: { type: string, default: "https://api.retellai.com" }
      # This platform names the originating number as a dialable number in E.164
      # form rather than by an opaque identifier, which is why the key names a
      # number. It carries no default because it is specific to the account a
      # Release holds, and it is not secret material: the number is dialable by
      # anyone and grants no access.
      from_number:
        type: string
        description: The dialable number in E.164 form, held on the platform, that an outbound call originates from.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # platform itself, so it reads all four from one place rather than each of its
    # own containers carrying a copy: where to call, which agent to run, which
    # version to run it at, and which number to originate from. The credential is
    # not published and is not carried across the edge — on Kubernetes a
    # credential attached to the slot above is materialized in the Release, and
    # the consuming application references the material under the name it was
    # given; on Compose it is attached to the consuming component itself.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application calls to hold a spoken
          conversation. The Release supplies it, so an operator may point it
          at a different host without the application changing.
      agent_id:
        type: string
        required: true
        description: >
          Identifier of the agent a call is conducted by, carried through from
          the value the Aggregate declared. An application sends it to address
          this agent rather than another on the same account.
      agent_version:
        type: string
        description: >
          Version of that agent to run instead of the one the platform serves
          by default. It is absent unless the Aggregate pinned one, so an
          application sends it only when it is set.
      from_number:
        type: string
        description: >
          Dialable number, in E.164 form, an outbound call originates from.
          The operator supplies it because the number is held on the
          platform's account rather than chosen per request.
