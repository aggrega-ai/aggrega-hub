apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/gumloop
  version: 1.0.0
  description: >
    A Gumloop automation pipeline on Gumloop's managed platform, realized as an external reference (no in-cluster compute). The pipeline is built and stored in Gumloop's service and is addressed by the pipeline identifier the developer supplies, alongside the inputs a run starts from. The realization emits only the wiring a consuming application needs, which is the API endpoint and the pipeline identifier to start a run against it. The endpoint defaults to Gumloop's fixed API host and is sourced from infra so an operator may repoint it at a gateway or proxy. Authentication is the consumer's concern: the realization delivers no key, because the environment-variable name belongs to the consuming application rather than to the endpoint.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        pipeline_id: { type: string }
        pipeline_inputs: { type: object, valuesType: string }
      required: [pipeline_id]
    infra:
      # Gumloop's managed API has a fixed host, so the endpoint defaults to it
      # and an operator need not supply one. It is sourced from infra (not
      # hardcoded in the Recipe) so an operator may repoint it at a gateway or
      # proxy.
      endpoint: { type: string, default: "https://api.gumloop.com" }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application calls to start a run.
          The Release supplies it, so an operator may point it at a different
          host without the application changing.
      pipeline_id:
        type: string
        required: true
        description: >
          Identifier of the pipeline a run starts, carried through from the
          value the Aggregate declared. An application sends it to say which
          pipeline is to be run.
