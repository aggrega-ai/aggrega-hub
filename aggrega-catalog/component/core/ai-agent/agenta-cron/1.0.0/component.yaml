apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/agenta-cron
  version: 1.0.0
  # metadata.license is deliberately absent, for the reason stated on
  # core/ai-agent/agenta-api: the platform is published open-core, no single
  # SPDX identifier covers it, and the class is carried on the
  # component.aggrega.ai/upstream-licensing label below while the licence of the
  # pinned artifact is named on this component's Recipe.
  description: >
    The scheduler of an agent workspace — the process that decides when a
    time-triggered thing is due and puts it on the queue. A background agent set
    to run every morning, and the platform's own periodic housekeeping, both
    become work because this tier woke up and enqueued them.

    It is a resident process carrying its own schedule table rather than a
    platform-level scheduled object, which is how the platform's own published
    deployment runs it: one container that stays up and fires on its own clock.
    It reads the schedules from the relational backend wired through `backend`,
    using the two database names given on that edge, enqueues onto the queue
    wired through `queue`, and uses the cache wired through `cache` for the same
    read-caching the rest of the platform does. It performs none of the work
    itself — the queue-consuming worker tier does — so this tier stays small
    however much is scheduled.

    Wire here because a schedule with nothing evaluating it never
    fires. That failure is silent from every other tier: the agent exists, its
    schedule is stored, and nothing happens at the appointed time.

    Exactly one instance of this component belongs in an Aggregate. It is not
    horizontally scalable — two schedulers reading one schedule table each
    enqueue the same due item — so scale is a question for the worker tier
    rather than this one.

    It serves no port and nothing connects to it, so it publishes no provides
    contract.

    Realized on Kubernetes via its Helm Recipe, which synthesizes the tier as a
    stateless single-replica Deployment with no Service, running the platform
    image under its scheduler entry point.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  inject: [env]

  usesSchema:
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        core_database:
          type: string
          default: agenta_core
          description: Database on the wired backend holding the platform's own model, including the schedules this tier reads. It names the same database the control-plane API reads.
        tracing_database:
          type: string
          default: agenta_tracing
          description: Database on the same backend holding traces and spans. It names the same database the control-plane API reads.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired cache. It matches the control-plane API's index on the same cache.
    queue:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired queue. It matches the index the worker tiers read, because this tier is what puts work there.

  featuresSchema:
    backend_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password the scheduler authenticates to the relational backend with, delivered as an env secret reference and substituted into the connection URL at run time. The same credential is attached to the control-plane API's slot, because both reach the same server. Unattached, the Recipe emits the development default the standard-library relational Recipes leave in place."
    auth_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key the platform signs its own internal tokens with. It carries the same value as the control-plane API's slot. Unattached, the Recipe emits a pinned development literal suitable for evaluation only."
    crypt_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key stored credentials are encrypted under. It carries the same value as the control-plane API's slot. Unattached, the Recipe emits a pinned development literal suitable for evaluation only."

  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this. This tier exposes no values pillar: what it does is
      # decided by the schedules stored in the backend, which are authored in
      # the platform rather than in an Aggregate.
      engine_version:
        type: string
        default: "v0.114.1"
        description: Platform API container image tag. This tier runs the same image as the control-plane API under a different entry point, so a Release moves both together.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the scheduler emits.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 256Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
