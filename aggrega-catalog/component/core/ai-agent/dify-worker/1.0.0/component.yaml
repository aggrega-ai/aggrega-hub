apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/dify-worker
  version: 1.0.0
  # metadata.license is deliberately absent. This service runs the Dify API
  # image, published under a modified Apache License 2.0 carrying additional
  # conditions that no single SPDX identifier names. The licensing class is
  # stated on the component.aggrega.ai/upstream-licensing label instead.
  description: >
    The Dify task worker — the Celery consumer that runs everything a Dify
    installation does off the request path: indexing uploaded documents into the
    vector datastore, executing scheduled and queued workflow runs, generating
    dataset segments, and delivering mail and webhooks. It takes work from the
    Redis-compatible broker wired through the `cache` uses-socket, reads and
    writes the platform's relational model in the PostgreSQL backend wired
    through `backend`, and writes embeddings into the vector datastore wired
    through `vector_store`. Workflow code nodes it executes run in the sandbox
    wired through `sandbox`, and outbound requests to addresses a user supplied
    are routed through the forward proxy wired through `ssrf_proxy`. It serves
    no port and nothing connects to it — work reaches it through the broker — so
    it publishes no provides contract and renders as a stateless worker tier.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the worker as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform's source is published under terms that are not OSI-approved:
    # a modified Apache License 2.0 whose additional conditions attach to
    # operating a multi-tenant environment and to altering the front end's
    # branding. Any reader may obtain and run the pinned image on those terms.
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The PostgreSQL backend holding the platform's relational model.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
    # The Redis-compatible cache the worker takes its queue from.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # Redis logical-database indices this connection uses. They match the
        # API server's indices on the same cache, because the two exchange work
        # through it.
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Redis logical-database index the application cache uses on this connection.
        broker_db_index:
          type: integer
          min: 0
          max: 15
          default: 1
          description: Redis logical-database index the Celery broker uses on this connection.
    # The vector datastore the worker writes dataset embeddings into.
    vector_store:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory)"
      inject: [env]
      required: true
      valueSchema:
        # Which client driver the worker speaks on this connection. It names the
        # same driver as the API server's own vector-store edge, because both
        # read and write the same collections.
        engine:
          type: string
          enum: [weaviate, qdrant]
          default: weaviate
          description: Vector-store client driver the worker uses on this connection.
    # The sandbox that executes the code nodes of workflows the worker runs.
    sandbox:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true
    # The plugin runtime the worker dispatches model calls through. Indexing a
    # document means embedding it, and an embedding model is delivered as a
    # plugin, so the worker reaches the runtime for the same reason the API
    # server does.
    plugin_daemon:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true
    # The forward proxy that outbound requests to user-supplied addresses are
    # routed through.
    ssrf_proxy:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true

  featuresSchema:
    # Optional backend-password credential slot, shared with the backend and the
    # API server. When attached, supplies the PostgreSQL password via the
    # credential subsystem; when unattached, the Recipe falls back to its inline
    # development default.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential shared with the backend. When attached, supplies the backend password via the credential subsystem; unattached, the Recipe uses its inline development default."
    # Optional application-secret slot. The worker decrypts stored
    # model-provider credentials under this value, so it must carry the same
    # secret as the API server; unattached, the Recipe uses a pinned development
    # literal.
    secret_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional application-secret credential. The worker decrypts stored model-provider credentials under it, so it carries the same secret as the API server. Unattached, the Recipe uses a pinned development literal suitable for evaluation only."
    # Optional sandbox execution-key slot. The worker presents this key on every
    # code-execution request, so the same credential is attached to the
    # code_execution_key slot on the sandbox. Unattached, the Recipe uses a
    # pinned development literal.
    code_execution_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional execution-key credential the worker presents on every code-execution request. The same credential is attached to the code_execution_key slot on the sandbox, so both ends present the same value. Unattached, the Recipe uses a pinned development literal suitable for evaluation only."
    # Optional plugin-runtime key slot. The worker presents this key on every
    # call it makes to the plugin runtime, and the runtime admits the call only
    # when the value matches its own. The worker, the API server and the plugin
    # runtime each declare this slot under the same name, so the same credential
    # is attached to all three or to none of them. Unattached, the Recipe uses a
    # pinned development literal.
    plugin_daemon_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional credential the worker presents on every call it makes to the plugin runtime. The worker, the API server and the plugin runtime declare this slot under the same name and must carry the same value, so the credential is attached to all three or to none: attaching it to some of them leaves the rest carrying a different value, which renders cleanly and is refused when the call is made. Unattached, the Recipe uses a pinned development literal suitable for evaluation only."
    # Optional internal-API key slot. The plugin runtime presents this key on
    # every call back into the internal API, and the worker admits the call only
    # when the value matches its own. The worker, the API server and the plugin
    # runtime each declare this slot under the same name, so the same credential
    # is attached to all three or to none of them. Unattached, the Recipe uses a
    # pinned development literal.
    inner_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional credential the plugin runtime presents on every call back into the internal API, which the worker compares against its own. The worker, the API server and the plugin runtime declare this slot under the same name and must carry the same value, so the credential is attached to all three or to none: attaching it to some of them leaves the rest carrying a different value, which renders cleanly and is refused when the call is made. Unattached, the Recipe uses a pinned development literal suitable for evaluation only."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      vector_index_prefix:
        type: string
        default: "Vector_index"
        description: Name prefix the worker gives the collections it creates in the wired vector datastore. It matches the API server's prefix, because the two write the same collections.
      indexing_max_segmentation_tokens:
        type: integer
        min: 1
        default: 4000
        description: Longest segment, in tokens, the dataset indexer produces when it splits a document.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "1.17.0"
        description: Dify API container image tag. The API server, the scheduler and this worker run the same image, so a Release moves all three together.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the worker emits.
      concurrency:
        type: integer
        min: 1
        default: 4
        description: Number of task slots one worker process runs in parallel. Raising it raises throughput and the worker's memory ceiling together, so it is sized with compute.memory.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
