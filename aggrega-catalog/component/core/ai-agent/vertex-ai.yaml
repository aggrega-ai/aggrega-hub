apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/vertex-ai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_id: { type: string }
        instructions: { type: string }
        data_stores:
          type: array
          items: { type: string, x-aggrega-selector: "datastore.aggrega.ai/engine in (vector, episodic, semantic-memory)" }
      required: [instructions]
