apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/vertex-ai
  version: 1.0.0
  description: >
    A Vertex AI agent, realized as an external reference (no in-cluster compute). The agent and its instructions live in Google's service and are addressed by the agent identifier the developer supplies. The regional endpoint is operator-supplied, since the Vertex AI host carries the region. Authentication is the consumer's concern — workloads use ambient GCP workload identity or inject their own credentials, rather than a static key delivered by the realization. The optional data-store socket wires the agent to a retrieval-capable datastore when the Aggregate declares one.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    data_store:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_id: { type: string }
        instructions: { type: string }
      required: [instructions]
    infra:
      # The Vertex AI host is regional (<region>-aiplatform.googleapis.com), so
      # the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Regional Vertex AI URL an application sends the agent's requests to.
          The region is the operator's choice, so the Release supplies it.
      agent_id:
        type: string
        description: >
          Identifier of the agent a request addresses, carried through from
          the value the Aggregate declared. The agent and its instructions
          live in the provider's service, so this is what reaches them.
