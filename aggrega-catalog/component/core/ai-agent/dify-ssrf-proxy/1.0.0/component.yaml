apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/dify-ssrf-proxy
  version: 1.0.0
  license: GPL-2.0-or-later
  description: >
    The egress proxy a Dify installation routes user-directed outbound requests
    through. A Dify workflow fetches whatever address its author or its end user
    supplies — a web page to crawl, a file to load, an HTTP request node's
    target — and a service that made those calls itself would be reachable proof
    of every address the cluster can see. This component is the chokepoint that
    removes that: it is a Squid forward proxy configured to refuse any
    destination in private, loopback, link-local or multicast address space, so
    a supplied address can reach the public internet and cannot reach the
    cluster's own services or the node's metadata endpoint. Its allowlist of
    private destinations is empty by default and is widened only by naming
    addresses explicitly. Holds no state — its cache is in memory and discarded
    with the process — so it renders as a stateless server. Exports its host,
    port and protocol to consumers via the uses topology, which is how each
    caller learns the proxy address to send through.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the proxy as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      allowed_private_networks:
        type: array
        items: { type: string }
        description: Private-address ranges the proxy permits as destinations, each in CIDR notation, permitted ahead of the private-network refusal. Left unset, no private destination is reachable through the proxy. Naming a range here is how an installation lets a workflow reach a service inside its own cluster, and each entry widens what a supplied address can reach, so the list stays as short as the installation needs.
      allowed_domains:
        type: array
        items: { type: string }
        description: Domains the proxy permits as destinations regardless of the address they resolve to, each written as the domain or a leading-dot suffix match. Left unset, only the plugin marketplace the platform installs from is named.
      max_request_body_size:
        type: string
        default: "100 MB"
        description: Largest request body the proxy will buffer, as a Squid size quantity.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3128
        description: Forward-proxy listen port callers send through.
      engine_version:
        type: string
        default: "6.6-24.04_edge"
        description: Squid container image tag.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the egress proxy. A
          caller sets it as its proxy address rather than as a request target,
          so its outbound calls leave through the proxy.
      port:
        type: integer
        required: true
        description: >
          TCP port the proxy accepts forwarded requests on. It follows the
          port an operator set in the Release, so a caller reads it rather
          than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a caller composes its proxy address on.
