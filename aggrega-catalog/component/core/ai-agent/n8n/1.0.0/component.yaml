apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/n8n
  version: 1.0.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: source-available
spec:
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential delivered to the platform as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose), read by workflow expressions via n8n's $env; unattached, the platform runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        workflow_id: { type: string }
      required: [workflow_id]
    infra:
      image:
        type: string
        description: Container image running the n8n platform.
      flow_definition:
        type: string
        description: "The n8n workflow definition (JSON), realized by the helm target only: it carries the definition in a ConfigMap an init container imports into the platform on start. The compose target has no import step, seeds no workflow and does not read this key, so a definition supplied against compose is accepted here and has no effect on the rendered output — author or import the workflow through the editor on that target. Deployment-specific and operator-supplied; when unset, the platform deploys with no seeded workflow."
