apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/n8n
  version: 1.0.0
  description: >
    The n8n automation platform, run in-cluster as the image a Release names.
    n8n runs workflows built from connected nodes and started by a webhook, a
    schedule or an event, so deploying it gives the editor and the webhook
    endpoint together, with a model reachable from whichever node needs one.
    What this component exposes is the workflow a caller invokes and,
    optionally, the workflow definition itself: supplied in the Aggregate, it
    is imported before the platform starts and on every start, so the platform
    runs the workflow as authored, whatever its data directory holds. The
    catalog pins no image: the Release names it in `infra.image`, and the
    build halts naming the container image until it does.

    The model, and each tool and store wired into the optional `tools` and
    `vector_store` sockets, reach the platform as environment variables, each
    credential by reference; each socket's comments and slots name them. A
    connection writing an `inject:` block receives the names it dictates
    instead of those its target's values fill; its credentials stay.

    A workflow reads these through n8n's $env only where the Aggregate sets
    `values.allow_env_access_in_nodes` to true. By default the Recipes keep
    n8n's block on environment access in expressions and the Code node, and
    lifting it lets every workflow read every variable of the platform's
    environment, the delivered credentials included.

    On Kubernetes, reach for `n8n-chart`, rendering n8n's own chart, where a
    chart repository is reachable at build time, and for `n8n`, the workload
    synthesis, where the build must fetch nothing. Of the two, only
    `n8n-chart` keeps the data directory on a volume that survives a restart,
    sized by `infra.storage.size`.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint, which the Recipe reads the same way from either. The flow
    # itself names the model, which through a gateway is an alias its map
    # publishes. The Recipes deliver that endpoint as OPENAI_BASE_URL, and a
    # key attached on the connection as OPENAI_API_KEY. n8n reads neither
    # itself: a workflow reads them through $env, so OPENAI_BASE_URL is a
    # default, and a connection writing an inject block receives the values it
    # dictates, under the names it gives, in its place, as variables a
    # workflow reads through $env or as files at the paths it names; the key
    # stays.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the platform presents to the model this connection reaches. When attached, the Recipe delivers it to the platform as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose), which a workflow reads through n8n's $env only while allow_env_access_in_nodes is true, the Recipes otherwise keeping n8n's block on environment access in nodes; unattached, the platform runs without an injected key."
    # A tool socket, in the catalog's form: the category admits tools and
    # nothing else, and the transport admits only the tools the platform
    # reaches over HTTP. Optional, and it takes one connection per tool the
    # Aggregate wires. n8n reads no tool's address from a variable of its own:
    # a workflow reads a value from the platform's environment through $env,
    # and only where allow_env_access_in_nodes lifts n8n's block on it. So the
    # Recipe delivers each connection under variables named for its alias,
    # upper-cased with every hyphen an underscore: a tool wired under the alias
    # docs-search arrives as AGGREGA_TOOL_DOCS_SEARCH_URL. Those names are
    # defaults: a connection writing an inject block receives the values it
    # dictates, under the names it gives, in place of the address and the
    # header variables, read through $env as every other variable, or as files
    # at the paths it names; the credential and an endpoint secret stay. Two
    # aliases that differ only in letter case, or in a hyphen against an
    # underscore, would deliver one variable twice, and the Recipes halt the
    # build naming both; the vector_store socket's aliases are held to the
    # same.
    tools:
      selector: "component.aggrega.ai/category=ai-tool, tool.aggrega.ai/transport=http"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the tool it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the tool this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Both secrets are held on the connection they are used on, so each
      # connection names its own fill. Both are optional and transparent
      # (inject: [env]), so a synthesized Workload references either as an
      # environment secret on helm, and a compose Recipe reads either from the
      # inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional credential the platform presents to the tool this
            connection reaches, under the request header the tool publishes as
            credential_header: as Bearer <credential> under Authorization, and
            as the whole value of any other header. When attached, the Recipe
            delivers it as AGGREGA_TOOL_<ALIAS>_CREDENTIAL (a Kubernetes
            secretKeyRef on helm, the inject pipe on compose), and, on a
            connection writing no inject block, the header as
            AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER where the tool publishes one.
        endpoint:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional whole address of the tool this connection reaches, the part
            carrying its key included, for a server that reads its key from its
            own address. When attached, the Recipe delivers it as
            AGGREGA_TOOL_<ALIAS>_URL in place of the endpoint the tool publishes:
            a Kubernetes secretKeyRef on helm, so the key reaches no rendered
            file, and the inject pipe on compose, written as delivered.
    # A vector-store socket, in the catalog's idiom: the selector admits a
    # store whose engine label says it indexes vectors, or keeps a semantic
    # memory, rather than one product. Optional, and it takes one connection
    # per store the Aggregate wires, each delivered under variables named for
    # its alias as the tool socket's are: a store wired under the alias kb
    # arrives as AGGREGA_VECTOR_STORE_KB_URL. The address is the endpoint the
    # store publishes where it publishes one, and is otherwise composed from
    # the protocol, host and port it publishes, since a store such as
    # core/datastore/qdrant publishes its address in those parts alone. A
    # store that also publishes a database and a user, as
    # core/datastore/pgvector does, arrives in parts as well, as
    # AGGREGA_VECTOR_STORE_KB_HOST, _PORT, _DATABASE and _USER, because n8n's
    # PGVector node takes no connection string: it reaches the store through a
    # Postgres credential with a field for each part and the password, and a
    # field written as an expression reads its variable through $env, held by
    # the same block as every other read. Those names are defaults, as on the
    # tool socket: a connection writing an inject block receives what it
    # dictates instead of the address and the parts, and its credential stays.
    vector_store:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the store it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the vector store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The store's key is held on the connection it is presented on, so each
      # connection names its own fill. Optional and transparent (inject: [env]),
      # so a synthesized Workload references it as an environment secret on
      # helm, and a compose Recipe reads it from the inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: Optional credential the platform presents to the vector store this connection reaches, such as the API key the store checks. When attached, the Recipe delivers it as AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, no credential is delivered for the store.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        workflow_id: { type: string }
        # n8n reads N8N_BLOCK_ENV_ACCESS_IN_NODE to decide whether $env answers
        # in an expression or a Code node. Its 2.x releases block when the
        # variable is anything but "false", and its 1.x releases only when it is
        # "true", so leaving the variable out would block on one line and not on
        # the other. The catalog pins no image, so the Recipes always deliver it:
        # "true" while this value is false, and "false" only when an Aggregate
        # sets it true. Off unless the Aggregate says otherwise.
        allow_env_access_in_nodes:
          type: boolean
          default: false
          description: Whether workflows may read the platform's environment through n8n's $env, in expressions and the Code node. While false, its default, the Recipes deliver N8N_BLOCK_ENV_ACCESS_IN_NODE set to true, n8n refuses every such read, and the delivered model, tool and store values cannot be read by a workflow. Set true, the variable is delivered as false, and every workflow, and every user who can edit one, can read every variable of the platform's environment, the delivered credentials included.
        flow_definition:
          type: string
          description: "The n8n workflow definition (JSON) the developer authors. Both targets realize it with an init step that imports the definition before the platform starts: the helm target carries it in a ConfigMap, and the compose target carries it in a config. An Aggregate's text is evaluated as a template before it is read, so a definition carrying n8n's own {{ ... }} expressions halts the build when written into an Aggregate as it stands; write each {{ in it as {{\"{{\"}}, and interpolation restores the definition's text. When unset, no init step is rendered and the platform deploys with no seeded workflow — author or import the workflow through the editor instead."
        # n8n's own metrics, in the Prometheus format: N8N_METRICS switches them
        # on, and n8n serves them at /metrics on its main port, beside the editor
        # and the webhook endpoint, answering that path without a sign-in. The
        # main port is on the Service each Recipe renders already, so true adds
        # only the variable, and false leaves the metrics off and their address
        # unpublished.
        metrics_enabled:
          type: boolean
          default: false
          description: Turns on n8n's own metrics, in the Prometheus format, and publishes their address as `metrics_endpoint`; while false that key is empty. They are served at /metrics on the platform's main port, which answers that path without a sign-in, so anything that reaches the port can read them.
      required: [workflow_id]
    infra:
      image:
        type: string
        description: Container image running the n8n platform.
      # Selects the version of n8n's own Helm chart the chart-backed Recipe
      # pulls; the workload-synthesis and compose Recipes pull no chart and read
      # nothing here. Changing it away from that Recipe's default does not
      # guarantee value-mapping compatibility with the other chart version.
      source_version:
        type: string
        description: Version of n8n's own Helm chart the chart-backed Recipe pulls, defaulting to the version that Recipe was checked against. The workload-synthesis and compose Recipes pull no chart and read nothing here.
      # The chart the n8n-chart Recipe renders runs n8n on its own SQLite
      # database only with the data directory on a persistent volume, and this
      # sizes that volume, as a whole number of gibibytes because the chart
      # accepts no other unit; the default is the chart's own. No other Recipe
      # reads it: the workload-synthesis Recipe keeps the directory on a scratch
      # volume, and the compose Recipe on a named volume of a size it writes
      # itself.
      storage:
        size:
          type: string
          default: "10Gi"
          description: Size of the persistent volume holding the platform's data directory, its database, the workflows and credentials authored in the editor and the encryption key it generates, on the n8n-chart Recipe, which alone reads it. The workload-synthesis and compose Recipes read nothing here.
      external_base_url:
        type: string
        description: >
          Externally reachable base URL of the platform, as assembled at the
          ingress tier — for example https://n8n.example.com. The platform
          composes from this the editor address it puts in the emails it sends
          and hands a SAML identity provider to return a browser to, and the base
          of every webhook URL it shows in the editor and registers with an
          outside service, so a service calling a workflow back reaches the
          platform. The editor is served from the root of that address; the
          product recommends a host of its own over a path behind a reverse
          proxy. Omitted, the Recipes set neither address and the platform
          composes both from its host, port and path settings, whose defaults
          name localhost — correct only for a platform no outside service calls.
    provides:
      # The address a Prometheus server scrapes the platform's own metrics at,
      # while values.metrics_enabled is true: /metrics on the main port 5678 of
      # the name each Recipe's Service carries. Every Recipe publishes it spelled
      # out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:5678/metrics`, the host
          being the platform's Service name. Empty while values.metrics_enabled
          is false.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" "tools" "vector_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
