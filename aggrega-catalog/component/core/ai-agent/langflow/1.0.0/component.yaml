apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/langflow
  version: 1.0.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: osi-approved
spec:
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  featuresSchema:
    admin_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password of the administrator account the platform seeds at startup, delivered as LANGFLOW_SUPERUSER_PASSWORD (a Kubernetes secretKeyRef on helm, the inject pipe on compose). Attach it wherever require_authentication is left at its default, since that account is then the only way into the editor; with require_authentication false the platform signs every visitor in and nothing reads this slot."
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential delivered to the platform as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the platform runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        flow_id: { type: string }
        flow_definition:
          type: string
          description: "A Langflow flow definition (JSON) the developer authors, realized by the helm target only: it carries the definition in a ConfigMap the platform loads from a mounted directory on startup. The compose target seeds no flow and does not read this key, so a definition supplied against compose is accepted here and has no effect on the rendered output — author the flow through the editor on that target. When unset, the platform deploys with no seeded flow."
        tweaks: { type: object, valuesType: string }
        require_authentication:
          type: boolean
          default: true
          description: "Whether reaching the editor requires signing in. At the default the platform's built-in sign-in bypass is switched off and the seeded administrator account is the only way in, so the deployment must attach that account's password to the admin_password slot; a deployment that leaves this at the default and attaches nothing is refused at build rather than deployed with an editor nobody can sign in to. Set it to false to run the editor with the bypass on, where everyone who can reach the service arrives already signed in as the administrator and no credential is needed."
        admin_user:
          type: string
          default: admin
          description: "Login name of the administrator account the platform seeds at startup. Read only where the editor requires a sign-in; with require_authentication false no account is seeded and nothing reads this value."
      required: [flow_id]
    infra:
      image:
        type: string
        description: Container image running the Langflow platform.
      storage_size:
        type: string
        default: "2Gi"
        description: Size of the persistent volume backing the platform's flow database.
