apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/langflow
  version: 1.0.0
  description: >
    The Langflow visual flow-builder, run in-cluster as the image a Release
    names. Deploying it gives the browser editor and the endpoint serving
    its flows, on a volume holding them and their encryption key. This component
    exposes the flow a caller invokes, the per-request tweaks that call may
    carry, and how the editor is reached: signing in is required by default,
    so the seeded administrator's password is attached or the build halts,
    while an Aggregate wanting the editor open to anyone says so. A flow
    authored in the Aggregate is loaded at each start on both targets, which
    an image at Langflow 1.5.1 or older does only with signing in off. The
    catalog pins no image: the Release names it in `infra.image`, and the
    build halts until it does.

    Each vector store wired into the optional `vector_store` socket arrives
    under variables named for the connection's alias: its address as
    AGGREGA_VECTOR_STORE_<ALIAS>_URL, and the connection's credential as
    AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL. A connection writing an
    `inject:` block receives the names it dictates instead, read by a flow as
    global variables; its credential stays.

    Each tool wired into the optional `tools` socket, a Model Context Protocol
    server reached over HTTP, is written into the flow's MCP Tools node named
    for the connection's alias.

    With `values.metrics_enabled` true Langflow's metrics are served at
    /metrics on port 9090, which checks no caller, and published as
    `metrics_endpoint`. On Kubernetes,
    reach for `langflow`, the workload synthesis, where the build must fetch
    nothing or the metrics are wanted, and for `langflow-chart`, rendering
    Langflow's own chart, which refuses them, where a chart repository is
    reachable at build time.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint, which the Recipe reads the same way from either. The flow
    # itself names the model, which through a gateway is an alias its map
    # publishes. The platform reads this connection itself, as
    # OPENAI_BASE_URL and OPENAI_API_KEY, the names its OpenAI components and
    # their client library read, so the socket offers no inject block.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the platform presents to the model this connection reaches. When attached, the Recipe delivers it to the platform as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the platform runs without an injected key."
    # A tool socket, in the catalog's form: the category admits tools and
    # nothing else, and the transport admits only the tools the platform
    # reaches over HTTP. Optional, and it takes one connection per tool the
    # Aggregate wires. Langflow's MCP Tools component reads a server's address
    # from no variable: it takes a server by name, from the MCP servers stored
    # in Langflow's settings or from the server configuration written into the
    # flow, and uses the address it finds there as written. So a tools
    # connection reaches the platform through the flow set as
    # values.flow_definition: each MCP Tools node whose server is named for the
    # connection's alias has the address the tool publishes written into that
    # configuration, and the component's assertion halts the build on a
    # connection with no flow to reach, on one no node names, and on a node
    # naming a server no connection answers. A server of the same name stored
    # in Langflow's settings takes precedence over the configuration in the
    # flow. Two aliases that differ only in letter case, or in a hyphen against
    # an underscore, would deliver one credential variable twice, and the
    # component's assertion halts the build naming both; the vector_store
    # socket's aliases are held to the same by the Recipes. Langflow's
    # private-address guard admits the hosts of wired tools and stores: every
    # Recipe lists them in LANGFLOW_SSRF_ALLOWED_HOSTS. The platform reads
    # this connection itself, from the flow the Recipe writes and from the
    # variables its node's header names, so the socket offers no inject block.
    tools:
      selector: "component.aggrega.ai/category=ai-tool, tool.aggrega.ai/transport=http"
      # A statement about this connection's target, authored on the
      # connection: the tool it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the tool this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Both secrets are held on the connection they are used on, so each
      # connection names its own fill. Both are optional and transparent
      # (inject: [env]), as on every tool socket in the catalog.
      #
      # Langflow presents an MCP request header from a stored global variable
      # only where the header's whole value is that variable's name, and
      # stores a variable named in LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT
      # from the environment for the administrator when the administrator
      # signs in. So the credential travels by reference: the Recipe delivers
      # it to the environment, lists it there, and writes its variable's name,
      # never its value, as the header's value in the flow. Under the
      # Authorization header a server reads Bearer and the credential, so
      # there the Recipe also delivers a variable holding exactly that, and
      # the header names it.
      #
      # The endpoint slot is the tool socket's form for a server that reads
      # its key from its own address. Langflow takes an MCP server's address
      # only from the flow file it loads, where the key would be written as a
      # literal, so every Recipe refuses an attachment here by name.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional credential the platform presents to the tool this
            connection reaches, under the request header the tool publishes as
            credential_header. When attached, the Recipe delivers it as
            AGGREGA_TOOL_<ALIAS>_CREDENTIAL (a Kubernetes secretKeyRef on helm,
            the inject pipe on compose), has Langflow store as a global variable
            the variable holding the header's whole value, and writes that
            variable's name as the header's value in the MCP Tools node the
            connection reaches, so the credential is written into no rendered
            flow. Under any header but Authorization that variable is
            AGGREGA_TOOL_<ALIAS>_CREDENTIAL itself. Under Authorization, which
            takes Bearer <credential> as its value, it is
            AGGREGA_TOOL_<ALIAS>_AUTHORIZATION, holding Bearer and the
            credential: on helm a reference Kubernetes expands from the
            delivered Secret when the container starts, on compose the
            credential as delivered. Langflow stores the variable for the
            administrator at each sign-in, or, with require_authentication
            false, once when it creates the administrator, so until then the
            header carries the variable's name. The build halts where the tool
            publishes no header to present a credential under.
        endpoint:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            The whole address of the tool this connection reaches, the part
            carrying its key included, for a server that reads its key from its
            own address. Langflow reads an MCP server's address only from the
            flow file it loads, where that key would be written as a literal,
            so an attachment here halts the build naming the connection, on
            both targets.
    # A vector-store socket, in the catalog's idiom: the selector admits a
    # store whose engine label says it indexes vectors, or keeps a semantic
    # memory, rather than one product. Optional, and it takes one connection
    # per store the Aggregate wires. A Langflow field that accepts a global
    # variable, such as the Qdrant component's URL and API key, resolves a
    # variable name no stored variable carries from the environment variable
    # of that name, a fallback Langflow keeps on unless its own setting turns
    # it off. So the Recipe delivers each connection under variables named for
    # its alias, upper-cased with every hyphen an underscore: a store wired
    # under the alias kb arrives as AGGREGA_VECTOR_STORE_KB_URL. Those names
    # are defaults: a connection writing an inject block receives the values
    # it dictates, under the names it gives, in place of the address and
    # connection-string variables, read by a flow the same way, through a
    # field naming a global variable of that name, or as files at the paths it
    # names; the credential stays. Two aliases that differ only in letter
    # case, or in a hyphen against an underscore, would deliver one variable
    # twice, and the Recipes halt the build naming both. The
    # address is the endpoint the store publishes where it publishes one, and
    # is otherwise composed from the protocol, host and port it publishes,
    # since a store such as core/datastore/qdrant publishes its address in
    # those parts alone. A store that also publishes a database and a user,
    # as core/datastore/pgvector does, is delivered as well as
    # AGGREGA_VECTOR_STORE_<ALIAS>_CONNECTION_STRING, the PostgreSQL
    # connection string Langflow's PGVector component takes in one field,
    # with the connection's credential as its password.
    vector_store:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the store it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the vector store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The store's key is held on the connection it is presented on, so each
      # connection names its own fill. Optional and transparent (inject: [env]),
      # so a synthesized Workload references it as an environment secret on
      # helm, and a compose Recipe reads it from the inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: Optional credential the platform presents to the vector store this connection reaches, such as the API key the store checks. When attached, the Recipe delivers it as AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL (a Kubernetes secretKeyRef on helm, the inject pipe on compose), and, for a store publishing a database and a user, as the password inside AGGREGA_VECTOR_STORE_<ALIAS>_CONNECTION_STRING, written unencoded; unattached, no credential is delivered for the store and that string carries no password.
  featuresSchema:
    admin_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password of the administrator account the platform seeds at startup, delivered as LANGFLOW_SUPERUSER_PASSWORD (a Kubernetes secretKeyRef on helm, the inject pipe on compose). Attach it wherever require_authentication is left at its default, since that account is then the only way into the editor; with require_authentication false the platform signs every visitor in and nothing reads this slot."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        flow_id: { type: string }
        flow_definition:
          type: string
          description: "A Langflow flow definition (JSON) the developer authors, realized on both targets: the helm target carries it in a ConfigMap mounted as the directory LANGFLOW_LOAD_FLOWS_PATH names, and the compose target in a compose config mounted as one file in that directory, every $ written as $$ so Docker Compose delivers it unchanged. Langflow loads the directory into the administrator's flows at each start, whether or not signing in is required; where the definition carries the id of a flow already loaded, that flow is updated in place, so an edit made to it in the editor is replaced at the next start. An image at Langflow 1.5.1 or older loads it only with require_authentication false. Where tools connections are wired, each MCP Tools node whose server is named for a connection's alias has that connection's address, and the header carrying its credential, written into the node's server configuration, every other part of the definition kept and the whole written back as JSON with its keys sorted; with no tools connection the definition is carried as written. A node naming a server no tools connection answers halts the build, as does a tools connection no node names, a node it names that starts a server of its own, and a tools connection wired with no definition. A server of the same name stored in Langflow's settings takes precedence over the configuration written here. An Aggregate's text is evaluated as a template before it is read, so a definition whose component source carries {{ halts the build when written into an Aggregate as it stands; write each {{ in it as {{\"{{\"}}, and interpolation restores the definition's text. When unset, the platform deploys with no seeded flow."
        tweaks: { type: object, valuesType: string }
        require_authentication:
          type: boolean
          default: true
          description: "Whether reaching the editor requires signing in. At the default the platform's built-in sign-in bypass is switched off and the seeded administrator account is the only way in, so that account's password must be attached to the admin_password slot; leaving this at the default and attaching nothing is refused at build rather than deployed with an editor nobody can sign in to. Set it to false to run the editor with the bypass on, where everyone who can reach the service arrives already signed in as the administrator and no credential is needed."
        admin_user:
          type: string
          default: admin
          description: "Login name of the administrator account the platform seeds at startup. Read only where the editor requires a sign-in; with require_authentication false no account is seeded and nothing reads this value."
        # Langflow's own metrics, in the Prometheus format.
        # LANGFLOW_PROMETHEUS_PORT switches them on and names their port, 9090
        # here, where Langflow starts a listener of its own on every interface,
        # apart from the editor's port, serving the metrics and nothing else at
        # any path, /metrics the documented one, and checking no caller. The
        # Recipes deliver the variable only while this value is true, so false
        # leaves the metrics off and their address unpublished. The
        # langflow-chart Recipe halts the build while it is true, because the
        # chart it renders gives its Service no port for that listener.
        metrics_enabled:
          type: boolean
          default: false
          description: Turns on Langflow's own metrics, in the Prometheus format, on a port of their own, 9090, and publishes their address as `metrics_endpoint`; while false that key is empty. The metrics port checks no caller, so anything that reaches it can read them. The langflow-chart Recipe refuses true, since the chart it renders has no Service port for the metrics; the workload-synthesis and compose Recipes serve them.
      required: [flow_id]
    infra:
      image:
        type: string
        description: Container image running the Langflow platform.
      # Selects the version of Langflow's own langflow-ide Helm chart the
      # chart-backed Recipe pulls; the workload-synthesis Recipe pulls no chart
      # and reads nothing here. Changing it away from that Recipe's default
      # does not guarantee value-mapping compatibility with the other chart
      # version.
      source_version:
        type: string
        description: Version of Langflow's own langflow-ide Helm chart the chart-backed Recipe pulls, defaulting to the version that Recipe was checked against. The workload-synthesis Recipe pulls no chart and reads nothing here.
      storage:
        size:
          type: string
          default: "2Gi"
          description: Size of the persistent volume backing the platform's flow database.
    provides:
      # The address a Prometheus server scrapes the platform's own metrics at,
      # while values.metrics_enabled is true: /metrics on port 9090 of the name
      # each Recipe's Service carries. Every Recipe serving the metrics
      # publishes it spelled out in full; langflow-chart, which refuses them,
      # publishes it empty.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:9090/metrics`, the host
          being the platform's Service name. Empty while values.metrics_enabled
          is false.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  #
  # The Recipes deliver a tools connection's credential under a variable named
  # for the alias upper-cased with every character other than a letter or a
  # digit an underscore, so two tools aliases that differ only in letter case,
  # or in a hyphen against an underscore, would deliver one variable twice.
  # The build halts here on them, naming both connections, whichever Recipe
  # binds. Two vector_store aliases are held to the same by the Recipes, which
  # see whether a connection dictates its own names.
  #
  # A tools connection reaches Langflow only through the flow it runs, so the
  # flow and the connections are checked against each other here, from the
  # Aggregate's values and connections alone, whichever Recipe binds. The flow
  # is read as Langflow exports it: an object whose data.nodes lists the
  # nodes, an MCP Tools node carrying the mcp_server field under
  # data.node.template, whose value names the server, either as a name alone
  # or as an object with a name and a server configuration. A node with no
  # server chosen names nothing. Every tools connection needs the flow, and a
  # node naming it, or its address would reach nothing; every server a node
  # names needs a tools connection of that alias, or the node would reach a
  # server the Aggregate does not wire; and a node a connection reaches keeps
  # no configuration that starts a server of its own, a command or the Stdio
  # mode, which Langflow would use in place of the address. A definition that
  # is not a JSON object names no server, and halts only where a tools
  # connection needs it. The LangflowFlow bundle every Recipe imports walks the
  # nodes the same way to write each connection's address into the flow; the
  # walk is kept in both places on purpose, since this check runs before any
  # Recipe binds and imports no library, and the rewrite needs the address
  # each tool publishes, which this check does not read. A change to how a
  # node names its server is made in both.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" "tools" "vector_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    connection_aliases_deliver_apart: >-
      {{- $seen := dict -}}
      {{- range $alias, $connection := (optional $.uses "tools" dict) -}}
      {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" -}}
      {{- if hasKey $seen $name -}}
      {{- fail (printf "the tools connections %s and %s of %q would both be delivered as AGGREGA_TOOL_%s_CREDENTIAL, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" (index $seen $name) $alias $.metadata.instance_id $name) -}}
      {{- end -}}
      {{- $_ := set $seen $name $alias -}}
      {{- end -}}
    tools_connections_reach_the_flow: >-
      {{- $tools := optional .uses "tools" dict -}}
      {{- $definition := optional .values "flow_definition" "" -}}
      {{- if and $tools (not $definition) -}}
      {{- range $alias, $connection := $tools -}}
      {{- fail (printf "the tools connection %s of the Langflow platform %q has no flow to reach: Langflow reads an MCP server's address only from the flow it runs, where it is written into an MCP Tools node whose server is named %s; set values.flow_definition to a flow carrying that node, or remove the connection" $alias $.metadata.instance_id $alias) -}}
      {{- end -}}
      {{- end -}}
      {{- if $definition -}}
      {{- $flow := fromJson $definition -}}
      {{- if and $tools (not (kindIs "map" $flow)) -}}
      {{- fail (printf "values.flow_definition of the Langflow platform %q is not a JSON object, so the address of a tools connection cannot be written into it: supply the flow as Langflow exports it" $.metadata.instance_id) -}}
      {{- end -}}
      {{- $nodes := list -}}
      {{- if kindIs "map" $flow -}}
      {{- $data := optional $flow "data" dict -}}
      {{- if kindIs "map" $data -}}
      {{- $listed := optional $data "nodes" list -}}
      {{- if kindIs "slice" $listed -}}{{- $nodes = $listed -}}{{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $named := dict -}}
      {{- range $node := $nodes -}}
      {{- $field := $node -}}
      {{- range $key := list "data" "node" "template" "mcp_server" -}}
      {{- if kindIs "map" $field -}}{{- $field = optional $field $key dict -}}{{- else -}}{{- $field = dict -}}{{- end -}}
      {{- end -}}
      {{- $value := "" -}}
      {{- if kindIs "map" $field -}}{{- $value = optional $field "value" "" -}}{{- end -}}
      {{- $server := "" -}}
      {{- $config := dict -}}
      {{- if kindIs "string" $value -}}
      {{- $server = $value -}}
      {{- else if kindIs "map" $value -}}
      {{- $name := optional $value "name" "" -}}
      {{- if kindIs "string" $name -}}{{- $server = $name -}}{{- end -}}
      {{- $config = optional $value "config" dict -}}
      {{- end -}}
      {{- if $server -}}
      {{- $id := "" -}}
      {{- if kindIs "map" $node -}}{{- $id = toString (optional $node "id" "") -}}{{- end -}}
      {{- if not (hasKey $tools $server) -}}
      {{- fail (printf "the MCP Tools node %q in values.flow_definition of the Langflow platform %q names the MCP server %q, which no tools connection answers: wire the tool it uses into the tools socket under the alias %s, or name the node's server for the alias of a wired tools connection" $id $.metadata.instance_id $server $server) -}}
      {{- end -}}
      {{- if and (kindIs "map" $config) (or (hasKey $config "command") (eq (toString (optional $config "mode" "")) "Stdio")) -}}
      {{- fail (printf "the MCP Tools node %q in values.flow_definition of the Langflow platform %q names the tools connection %s, but its server configuration starts a server of its own, which Langflow would use in place of the connection's address: remove the command, and the Stdio mode, from that configuration" $id $.metadata.instance_id $server) -}}
      {{- end -}}
      {{- $_ := set $named $server true -}}
      {{- end -}}
      {{- end -}}
      {{- range $alias, $connection := $tools -}}
      {{- if not (hasKey $named $alias) -}}
      {{- fail (printf "the tools connection %s of the Langflow platform %q is named by no MCP Tools node of values.flow_definition, so its address would reach nothing: Langflow reads an MCP server's address only from the flow, so name the server of the MCP Tools node that uses the tool %s, or remove the connection" $alias $.metadata.instance_id $alias) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
