apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/open-webui
  version: 1.0.0
  # metadata.license is deliberately absent. The Open WebUI platform is
  # published under terms that begin as the three BSD-3-Clause conditions and
  # add a fourth prohibiting alteration of the platform's own branding, and no
  # single SPDX identifier names that combination — naming BSD-3-Clause here
  # would understate a condition the licence makes material. The licensing class
  # is stated on the component.aggrega.ai/upstream-licensing label instead, which
  # is the surface a policy filter reads.
  description: >
    A self-hosted Open WebUI installation — the browser platform a person holds
    conversations in, and the tier that turns a bare model endpoint into a
    working assistant surface. It reaches its model through the `model`
    uses-socket and calls it as an OpenAI-compatible API, adding retrieval over
    the documents a user loads, tool invocation over the tool servers an
    administrator registers, and per-user and per-group access control. The
    conversation loop is always started by a person: the platform runs no
    background loop of its own.

    It keeps its accounts, conversations and document index on one durable
    volume, so a realization gives it storage that outlives its container. It
    exports its host, port and protocol, which is how an ingress tier publishes
    it.

    On Kubernetes there are two realizations and the Manifest chooses between
    them. `open-webui` synthesizes the platform as a workload and fetches
    nothing, so it is the one to reach for where the build must complete with no
    chart repository reachable. `open-webui-chart` renders the platform's own
    Helm chart, which additionally carries single sign-on against several
    identity providers and per-component log levels, both set through
    `infra.overrides`, so reach for it where a chart repository is reachable at
    build time.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # The cognitive loop is real — the platform dispatches retrieval and tool
    # calls while answering — and it is always entered by a person rather than
    # by a schedule or a background worker, which is what this value records.
    agent.aggrega.ai/autonomy: copilot
    # Every Recipe of this component runs the platform as containers in the
    # Release's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform's source is published under terms that are not OSI-approved:
    # the three BSD-3-Clause conditions plus a fourth that forbids altering the
    # platform's branding where it is run or redistributed, waived below fifty
    # end users in a rolling thirty-day period and by separate permission. Any
    # reader may obtain and run the pinned image on those terms.
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The model the platform calls. The selected component's published endpoint
    # and model name arrive on this edge; each Recipe writes the endpoint into
    # the variable the platform reads for an OpenAI-compatible base URL, and the
    # model name into the model a new conversation opens on. So changing which
    # model answers is a change of edge target rather than a change of this
    # component.
    #
    # Around that call it adds retrieval over the documents a user loads, tool
    # invocation over the tool servers an administrator registers, and per-user
    # and per-group access control over both — which is why it is an agent
    # platform rather than a view onto a model.
    #
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the platform presents to the model this connection reaches. Unattached, the Recipe delivers no key at all, which suits an in-cluster endpoint that authenticates callers by network position rather than by key."

  featuresSchema:
    # Required session-signing secret, with no default. The platform signs the
    # session tokens it issues with this value, so a secret every reader of this
    # catalog held would let anyone mint a session the platform accepts.
    session_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required secret the platform signs its session tokens with. There is no default: the build halts when nothing fills this slot. Leaving the variable unset instead, so the platform mints a key of its own, is a bootstrap convenience rather than a credential-rotation system: the minted key does not survive a restart, so each restart invalidates every sign-in then active."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        instance_title:
          type: string
          default: "Open WebUI"
          description: Name the platform presents in the browser title and the interface header. Two installations reachable by the same people tell themselves apart by carrying different titles.
        enable_signup:
          type: boolean
          default: false
          description: Whether a visitor who is not yet a user may create an account from the sign-in page. Left off, accounts are created only by an administrator, which is the posture an installation reachable beyond its own team wants.
        default_user_role:
          type: string
          enum: [pending, user, admin]
          default: pending
          description: Role a newly created account receives. The default withholds access until an administrator grants it, so enabling signup does not by itself grant anyone the platform.
        enable_web_search:
          type: boolean
          default: false
          description: Whether the platform offers web search as a retrieval source inside a conversation. Left off, retrieval draws only on documents a user loaded, so no conversation content reaches a search provider.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Listen port the platform serves its interface and API on, and the port consumers connect to. Most operators should omit this and let the Recipe assign the default (8080).
      engine_version:
        type: string
        default: "v0.11.1"
        description: Open WebUI container image tag. Selects the image tag on the synthesized platform container; the chart-backed realization pins its own image tag.
      # `open-webui-chart` renders the platform's own Helm chart, which carries
      # the integration surface its maintainers keep in step with the platform —
      # single sign-on against several identity providers, external object
      # storage for uploaded documents, an external relational store in place of
      # the embedded one, and per-component log levels — along with a seeding
      # step that copies the packaged starter data onto the volume before the
      # platform first starts. Of those, that Recipe passes single sign-on and
      # the log levels through `infra.overrides`; it sets no external object
      # storage and no external relational store.
      source_version:
        type: string
        description: Version of the Helm chart the chart-backed realization pulls. Read only by that realization; the workload-synthesis realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      # It serves the chat interface, the model and prompt workspaces, the
      # document library and the administration console from one process, and
      # it owns the accounts, conversations, prompts and document collections
      # that outlive any single session. It keeps its accounts, conversations and
      # document index on one durable volume, so a realization has to give it
      # storage that outlives its container rather than running it without any.
      storage:
        size:
          type: string
          default: "4Gi"
          description: Size of the persistent volume holding the accounts, the conversations, the prompt library and the document index. The platform keeps all of them in one place, so this single size covers every kind of state it accumulates.
      external_base_url:
        type: string
        default: ""
        description: Externally reachable base URL of the installation, as a browser sees it — the address the ingress tier publishes. The platform composes the links it emits from it, which is what makes a shared conversation link resolve from outside the cluster. Left empty, no link base is set and the platform derives each address from the incoming request, which suits an installation reached only in-cluster.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: In-cluster DNS name of the Service serving the chat interface and its API. The ingress tier points its upstream at this name.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service serves the interface and API on. It follows
          the port an operator set in the Release, so a consumer reads it
          rather than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a consumer composes its base URL on.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
