apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/agenta-worker-queues
  version: 1.0.0
  # metadata.license is deliberately absent, for the reason stated on
  # core/ai-agent/agenta-api: the platform is published open-core, no single
  # SPDX identifier covers it, and the class is carried on the
  # component.aggrega.ai/upstream-licensing label below while the licence of the
  # pinned artifact is named on this component's Recipe.
  description: >
    The queue-consuming worker tier of an agent workspace — the process that
    runs the platform's discrete background jobs. Four families of job reach it:
    the outbound webhooks a deployment has configured, the triggers that start a
    background agent when something happens in a connected application, the
    asynchronous turns of an agent session, and the evaluation runs a team asks
    for over a set of test cases.

    It takes work from the queue wired through the `queue` socket, reads and
    writes the platform's model in the relational backend wired through
    `backend` using the two database names given on that edge, uses the cache
    wired through `cache`, and reaches the model-facing service wired through
    `services` because a job that runs an agent turn or scores an evaluation
    needs a model call made. Its `queues` value selects which families one
    container runs; left unset it runs all four, and an Aggregate that needs one
    family scaled apart declares a second instance naming just that family.

    Wire here because background work is what makes an agent
    workspace more than a chat window: a background agent that runs on a
    schedule or on an event, and an evaluation over a test set, both exist only
    on this tier. With nothing running it, such a request is accepted and never
    performed.

    It serves no port and nothing connects to it, so it publishes no provides
    contract.

    Realized on Kubernetes via its Helm Recipe, which synthesizes the tier as a
    stateless Deployment with no Service, running the platform image under the
    queue-consumer entry point.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  inject: [env]

  usesSchema:
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        core_database:
          type: string
          default: agenta_core
          description: Database on the wired backend holding the platform's own model. It names the same database the control-plane API reads.
        tracing_database:
          type: string
          default: agenta_tracing
          description: Database on the same backend holding traces and spans. It names the same database the control-plane API reads.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired cache. It matches the control-plane API's index on the same cache.
    queue:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired queue. It matches the index the producing services use, because this tier runs what they enqueue.
    # The model-facing service a job reaches to have a model called — running an
    # agent turn, or scoring an evaluation with a model as the judge. Required:
    # without it the evaluation and interaction families accept work they cannot
    # complete.
    services:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true

  featuresSchema:
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    backend_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password the worker authenticates to the relational backend with, delivered as an env secret reference and substituted into the connection URL at run time. The same credential is attached to the control-plane API's slot, because both reach the same server. Unattached, the Recipe emits the development default the standard-library relational Recipes leave in place."
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    auth_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key the platform signs its own internal tokens with. It carries the same value as the control-plane API's slot. Unattached, the Recipe emits a pinned development literal suitable for evaluation only."
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    crypt_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key stored model-provider credentials are encrypted under. The worker decrypts them to make a model call, so it carries the same value as the control-plane API's slot. Unattached, the Recipe emits a pinned development literal suitable for evaluation only."
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    services_internal_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key the worker presents on its internal calls to the model-facing service. Both ends carry the same value. Unattached, the Recipe emits a pinned development literal suitable for evaluation only."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      queues:
        type: string
        description: >
          Comma-separated list of job families this container runs, drawn from
          webhooks, triggers, interactions and evaluations. Left unset it runs
          all four, which is what a single-container deployment wants; naming a
          subset is how one family is scaled apart from the others.
      concurrency:
        type: integer
        min: 1
        default: 4
        description: How many jobs one container runs at once. Raising it raises throughput and the container's memory ceiling together, so it is sized with compute.memory.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "v0.114.1"
        description: Platform API container image tag. This tier runs the same image as the control-plane API under a different entry point, so a Release moves both together.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the worker emits.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
