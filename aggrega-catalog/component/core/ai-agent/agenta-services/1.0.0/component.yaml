apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/agenta-services
  version: 1.0.0
  # metadata.license is deliberately absent, for the reason stated on
  # core/ai-agent/agenta-api: the platform is published open-core, no single
  # SPDX identifier covers it, and the class is carried on the
  # component.aggrega.ai/upstream-licensing label below while the licence of the
  # pinned artifact is named on this component's Recipe.
  description: >
    The model-facing service of an agent workspace: the tier that talks to
    language-model providers on the platform's behalf. It serves the completion
    and chat endpoints the console's playground calls, holds the adapter layer
    that presents one interface over many providers, and starts an agent run by
    handing it to the runner.

    It reads the platform's relational model through backend, uses cache and
    queue as the control-plane API does, keeps the files an agent produces in
    the object store wired through store, and reaches auth_core to establish who
    a request belongs to and runner to start, watch and cancel a run.

    Wire here to invoke a model or start an agent run. That is the line between
    this service and core/ai-agent/agenta-api, which owns the platform's own
    data: a caller listing agents or reading a trace talks to that one, and a
    caller asking for a completion or a run talks to this one. Both are needed,
    and neither is a superset of the other.

    Realized on Kubernetes via its Helm Recipe, which synthesizes the service as
    a stateless Deployment behind a ClusterIP Service on its HTTP port. It
    exports its host, port, endpoint and protocol to consumers.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  inject: [env]

  # Each backing system's connection arrives as the values on the injection
  # context, and the Helm Recipe composes the service's connection to it from
  # them; the object store's is the endpoint it publishes, read from the store
  # connection itself. cache and queue serve the same session and
  # work-dispatch purposes they serve on the control-plane API.
  usesSchema:
    # The relational backend holding the platform's model and its traces. Same
    # contract as on core/ai-agent/agenta-api: host, port and user arrive on the
    # injection context, the two database names are given on the edge, and the
    # password stays a secret reference, the credential this connection carries.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        core_database:
          type: string
          default: agenta_core
          description: Database on the wired backend holding the platform's own model. It names the same database the control-plane API reads, because the two share one model.
        tracing_database:
          type: string
          default: agenta_tracing
          description: Database on the same backend holding traces and spans. It names the same database the control-plane API reads.
        # A statement about this connection's target, authored on the
        # connection: the backend it reaches takes no credential. It changes
        # nothing this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the relational backend this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # To replace the Recipe's development default, attach core/random-password
      # on the connection: the cluster generates it, and the backend takes the
      # same credential by core/referenced-secret.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Password the service authenticates to the relational backend this connection reaches with, delivered as an env secret reference and substituted into the connection URL at run time. The same credential is attached to the control-plane API's backend connection, because both reach the same server. Unattached, the Recipe emits the development literal `apppass`, the default the standard-library relational Recipes leave in place; this catalog publishes it, so every Release that leaves the slot unattached shares that password."
    # A cache publishing protocol valkey-tls or redis-tls is reached over TLS: the URL
    # takes the rediss scheme, and the platform's Redis client checks the
    # cache's certificate and the name dialed against the authority in
    # server_ca where one is attached, and against the image's default trust
    # store where not. A cache publishing another value served over TLS halts
    # the build, naming the connection.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired cache. It matches the control-plane API's index on the same cache, because the two read the same sessions.
      # The authority the platform's Redis client checks the cache's
      # certificate against, for a cache whose certificate an authority the
      # image does not already trust signs. Secret-kind-pinned because a
      # referenceable Secret is what the Recipe mounts, and so marked sensitive
      # as every secret-kind slot is, though the authority's certificate is not
      # itself secret; delivered as a file.
      featuresSchema:
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the platform's Redis client checks the cache's certificate against while the cache publishes protocol valkey-tls or redis-tls, where the image does not already trust the authority that signs it. Its Secret holds ca.crt. The Recipe mounts the whole Secret read-only and names the file in the connection's URL. The build halts on a server_ca publishing no Secret name, and on one wired to a cache served without TLS. Fill it with core/referenced-secret."
    # A queue publishing protocol valkey-tls or redis-tls is reached over TLS: the URL
    # takes the rediss scheme, and the platform's Redis client checks the
    # queue's certificate and the name dialed against the authority in
    # server_ca where one is attached, and against the image's default trust
    # store where not. A queue publishing another value served over TLS halts
    # the build, naming the connection.
    queue:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Logical-database index this connection uses on the wired queue. It matches the index the worker tiers use, because this service is what puts work there.
      # The authority the platform's Redis client checks the queue's
      # certificate against, for a queue whose certificate an authority the
      # image does not already trust signs. Secret-kind-pinned because a
      # referenceable Secret is what the Recipe mounts, and so marked sensitive
      # as every secret-kind slot is, though the authority's certificate is not
      # itself secret; delivered as a file.
      featuresSchema:
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the platform's Redis client checks the queue's certificate against while the queue publishes protocol valkey-tls or redis-tls, where the image does not already trust the authority that signs it. Its Secret holds ca.crt. The Recipe mounts the whole Secret read-only and names the file in the connection's URL. The build halts on a server_ca publishing no Secret name, and on one wired to a queue served without TLS. Fill it with core/referenced-secret."
    auth_core:
      selector: "component.aggrega.ai/category=security"
      inject: [env]
      required: true
      # A statement about this connection's target, authored on the connection:
      # the authentication core it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the authentication core this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Where the authentication core's key comes from core/random-password,
      # generated in the cluster, present it on this connection by
      # core/referenced-secret; unattached, none is sent.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "API key presented to the authentication core this connection reaches. Where a key is attached to the core, the same one is attached here. Unattached, no key is sent."
    # The object store holding the files an agent writes, the same store the
    # control-plane API is wired to. The service's S3 client is pointed at the
    # endpoint the selected store publishes, scheme included, and a store
    # publishing none halts the build. The selector admits a storage resource,
    # an object store, and refuses a backup controller, which the catalog files
    # under storage too but types server.
    store:
      selector: "component.aggrega.ai/type=resource,component.aggrega.ai/category=storage"
      inject: [env]
      required: true
      valueSchema:
        bucket:
          type: string
          default: agenta
          description: Bucket on the wired object store agent working directories are kept in. It names the same bucket the control-plane API uses, and where the store publishes a bucket of its own, that one too, or the build halts.
        region:
          type: string
          default: us-east-1
          description: Region name the S3 client sends. An S3-compatible store that does not use regions accepts any value; a cloud store needs its own.
        # A statement about this connection's target, authored on the
        # connection: the object store it reaches takes no credential. The
        # secret key has no default, so this is what lets a connection carrying
        # none build; it changes nothing else this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the object store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. A connection carrying neither a credential nor this value halts the build; with this value set and no credential, no secret key is sent. It changes nothing else this component renders.
      # The access key the S3 client authenticates to this store with is a pair
      # presented on one connection: credential_id holds its identifier half and
      # credential its secret half. The secret half has no development default:
      # a connection with nothing in credential halts the build, naming it,
      # unless it declares unauthenticated.
      # To have the cluster generate the secret half, attach core/random-password
      # on the store; this connection takes the same credential by
      # core/referenced-secret.
      featuresSchema:
        credential_id:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Access-key identifier the S3 client authenticates to the object store this connection reaches with, the identifier half of the pair whose secret half is this connection's credential. Unattached, the Recipe presents the identifier admin."
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Secret key paired with this connection's credential_id. There is no default: the build halts when nothing fills this slot, unless the connection's values set unauthenticated: true."
    # The runner that executes an agent's harness in a sandbox. It is a socket
    # of its own rather than an internal detail because the two are separately
    # scalable and the runner is the tier that executes untrusted work.
    # Required: with nothing wired here the service can serve a completion and
    # cannot run an agent, which is most of what the platform is for.
    runner:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true
      # A statement about this connection's target, authored on the connection:
      # the runner it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the runner this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # To replace the Recipe's development default, attach core/random-password
      # on the runner: the cluster generates it, and this connection takes the
      # same credential by core/referenced-secret.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Token presented on every call to the runner this connection reaches, which rejects an untokened request. The same credential is attached to the runner's own slot so both ends agree. Unattached, the Recipe emits the pinned development literal `dev-agenta-runner-change-me`, suitable for evaluation only and published in this catalog, so every Release that leaves the slot unattached shares it."

  featuresSchema:
    # Required, with no default. A key the cluster generates is attached through
    # core/random-password, and slots sharing it take it by core/referenced-secret.
    auth_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required key the platform signs its own internal tokens with. It carries the same value as the control-plane API's slot. There is no default: the build halts when nothing fills this slot."
    # Required, with no default. A key the cluster generates is attached through
    # core/random-password, and slots sharing it take it by core/referenced-secret.
    crypt_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required key stored model-provider credentials are encrypted under. This service decrypts them to call a provider, so it carries the same value as the control-plane API's slot. There is no default: the build halts when nothing fills this slot."
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    services_internal_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Key this service and the control-plane API present to each other on internal calls. Both ends carry the same value. Unattached, the Recipe emits the pinned development literal `dev-agenta-internal-change-me`, suitable for evaluation only and published in this catalog, so every Release that leaves the slot unattached shares it."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      model_call_timeout_seconds:
        type: integer
        min: 1
        default: 120
        description: How long a single model call may take before the service gives up on it. A long-running agent turn needs a wider window than a playground completion does.
      max_concurrent_model_calls:
        type: integer
        min: 1
        default: 16
        description: How many model calls the service will have outstanding at once. It bounds what one container holds open, so it is sized with compute.memory.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the service serves its HTTP API on; consumers connect here. Most operators should omit this and let the Recipe assign the default (8080).
      external_base_url:
        type: string
        description: >
          Externally reachable base URL of the whole platform, as a browser
          reaches it through the ingress tier — for example
          https://agenta.example.com. The service composes the addresses it
          reports from it. The compiler cannot know a cluster's external
          hostname, so this carries no default and the Kubernetes realization
          halts at build until it is set.
      engine_version:
        type: string
        default: "v0.114.1"
        description: Platform services container image tag. It tracks the same release as the control-plane API, so a Release moves both together.
      web_workers:
        type: integer
        min: 1
        default: 2
        description: Number of request-serving worker processes in one container. Raising it raises throughput and the container's memory ceiling together, so it is sized with compute.memory.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the service emits.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the model-facing tier.
          The console's playground and anything else asking for a completion
          dial this name.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts completion and chat requests on. It
          follows the port an operator set in the Release, so a consumer reads
          it rather than assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full in-cluster base URL of the completion and chat API, with the
          host and the port already composed. It is the address a peer tier
          calls, not the address a browser reaches.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "backend" "auth_core" "store" "runner" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
