apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/dify-web
  version: 1.0.0
  # metadata.license is deliberately absent. This service runs the Dify front-end
  # image, published under a modified Apache License 2.0 carrying additional
  # conditions that no single SPDX identifier names — among them a condition on
  # altering the branding this very image serves. The licensing class is stated
  # on the component.aggrega.ai/upstream-licensing label instead.
  description: >
    The Dify front end — the server-rendered web application behind the console
    and the published application pages. It renders the workflow editor, the
    dataset and application management screens, and the chat and completion
    surfaces an end user reaches, and it calls the API server for every piece of
    data it shows: the API server's in-cluster address arrives on the `api`
    uses-socket and becomes the base URL the server-side rendering path uses.
    Holds no state of its own and owns no datastore, so it renders as a
    stateless server. Exports its host, port and protocol to consumers via the
    uses topology, so an ingress tier can route the browser path to it.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the front end as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform's source is published under terms that are not OSI-approved:
    # a modified Apache License 2.0 whose additional conditions attach to
    # operating a multi-tenant environment and to altering the front end's
    # branding. Any reader may obtain and run the pinned image on those terms.
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The API server the front end calls for every piece of data it renders.
    api:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      allow_embed:
        type: boolean
        default: false
        description: Whether a published application page may be framed by another site. Left at the default, the front end refuses to be framed, which is what stops another site presenting this installation's pages as its own.
      text_generation_timeout_ms:
        type: integer
        min: 1000
        default: 60000
        description: How long, in milliseconds, the browser waits for a generation response before giving up.
      top_k_max:
        type: integer
        min: 1
        default: 10
        description: Highest retrieval top-k the editor offers. It matches the API server's ceiling, since a value above it is refused when the workflow runs.
      max_parallel_limit:
        type: integer
        min: 1
        default: 10
        description: Highest parallel-branch count the editor offers. It matches the API server's ceiling.
      max_iterations:
        type: integer
        min: 1
        default: 99
        description: Highest iteration count the editor offers on an iteration node. It matches the API server's ceiling.
      max_tools:
        type: integer
        min: 1
        default: 10
        description: Highest number of tools the editor lets an agent be given. It matches the API server's ceiling.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3000
        description: HTTP listen port the front end serves the console and application pages on.
      engine_version:
        type: string
        default: "1.17.0"
        description: Dify front-end container image tag. It tracks the API server's tag, because the front end and the console API are released together.
      external_base_url:
        type: string
        default: ""
        description: Externally reachable base URL of the installation, as a browser sees it — the address the ingress tier publishes. The browser calls the console API at this address, so it is set wherever the front end is reached from outside the cluster. Left empty, the front end derives the address from the page it was served on.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service serving the console and the
          published application pages. The ingress tier points its upstream at
          this name rather than at the API server.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service serves the front end on. It follows the port
          an operator set in the Release, so the ingress tier reads it rather
          than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a gateway composes its upstream address on.
