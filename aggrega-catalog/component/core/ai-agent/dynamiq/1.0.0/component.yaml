apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/dynamiq
  version: 1.0.0
  description: >
    A Dynamiq agent, run in-cluster as an application image the Release supplies. Dynamiq composes model calls, retrieval and agent loops into a workflow of typed nodes, and the workflow is Python code the host program constructs — so the unit of work here is a named entrypoint inside that program rather than a prompt, and the Aggregate chooses whether the entrypoint streams each intermediate node result or returns only the final one. Conversation and workflow memory is held by a pluggable backend rather than in the process, which is why this component wires a datastore as a topology edge alongside the model. The Release supplies the image carrying both the framework and the workflow it runs.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Two compiler-wired edges. `state_store` carries the coordinates of the
  # datastore the framework's memory backend persists conversation and workflow
  # state to; it is optional, because the framework also ships in-process and
  # file-backed memory that needs no external store. `model` carries the model
  # endpoint into the synthesized application container and is required, since a
  # workflow of model calls has nothing to call without it. The sockets, not the
  # documented `models` / `datastores` name-lists, are what the selector gate
  # enforces.
  usesSchema:
    state_store:
      selector: "component.aggrega.ai/category=datastore"
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  # Optional model API-key credential, referenced at the consumer's scope, so
  # applications may share one key or hold per-application keys. Optional (bare
  # deployments run against a no-auth endpoint or supply the key out of band);
  # transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        workflow_entrypoint: { type: string }
        stream_events: { type: boolean, default: false }
      required: [workflow_entrypoint, stream_events]
    infra:
      # Operator-supplied container image running the Dynamiq application.
      image:
        type: string
        description: Container image running the Dynamiq framework and the workflow it executes.
