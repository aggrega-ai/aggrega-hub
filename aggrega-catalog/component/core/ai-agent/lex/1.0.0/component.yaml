apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/lex
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Lex is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The bot's behaviour follows the Amazon Lex V2 Developer Guide
  # ("Versioning and aliases with your Lex V2 bot", "AMAZON.FallbackIntent"),
  # the Amazon Lex V2 API Reference (CreateBot, CreateBotLocale,
  # CreateIntent, CreateSlot, CreateSlotType, BuildBotLocale, RecognizeText)
  # and the CloudFormation resource schema of AWS::Lex::Bot, which gives the
  # ranges, the names and the values the rules below hold a bot to.
  description: >
    One Amazon Lex V2 bot: AWS's managed service that holds a conversation
    with a user in text or speech, recognizes what the user wants as one of
    the bot's intents from the sample utterances the developer gives it,
    and asks for the slot values the intent needs. The bot is named after
    the component, and values.bot_locales declares its locales, each with
    its intents, their slots and the custom slot types those slots take, in
    the subset of the Lex model the key describes. Lex adds its fallback
    intent, AMAZON.FallbackIntent, to every locale, which answers what no
    intent matches.

    The bot runs as the IAM role the operator names: each Recipe reads it
    by its ARN and creates none. A caller reaches the bot through Amazon
    Lex's runtime API under its own IAM identity, naming the bot by agent_id
    and the alias it runs by bot_alias_id, so no credential is published.
    A Recipe that creates no alias publishes bot_alias_id empty, and its
    description says so.

    values.child_directed and values.idle_session_ttl_in_seconds have no
    default: whether the bot is directed at children under 13 is the
    developer's statement to make, and how long a conversation is kept is
    the developer's choice. No backup is configured: the bot holds its
    definition, which is written each time the Release deploys. Each
    Recipe's description says what it creates beside the bot, what a change
    of the locales does to a deployed bot, and which keys it honours and
    which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    # No agent.aggrega.ai/autonomy label: a Lex bot acts on nothing of its
    # own accord; it recognizes an intent and elicits its slots, and what
    # follows is the caller's.
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      child_directed:
        type: boolean
        required: true
        description: >
          Whether the bot is directed, wholly or in part, at children under
          13 and so subject to the Children's Online Privacy Protection Act
          (COPPA): true or false, with no default, as Amazon Lex requires
          the statement of every bot. Changing it changes the bot in place.
      idle_session_ttl_in_seconds:
        type: integer
        required: true
        description: >
          How long, in seconds, Lex keeps a conversation's information
          while the user says nothing: from 60 to 86,400 (24 hours), with no
          default. When it passes, the session ends and Lex deletes what the
          user provided. A value outside that range halts the build.
          Changing it changes the bot in place.
      bot_locales:
        type: array
        required: true
        items:
          type: object
          properties:
            locale_id:
              type: string
              description: >
                The locale's identifier, one of the locales the Amazon Lex
                V2 Developer Guide's "Supported languages" lists, such as
                en_US or it_IT; Lex judges it when it creates the locale.
            nlu_confidence_threshold:
              type: number
              description: >
                From 0 to 1: the confidence below which Lex returns the
                fallback intent, rather than an intent of the developer's,
                among the alternatives it recognizes.
            intents:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: The intent's name, unique in its locale.
                  sample_utterances:
                    type: array
                    items:
                      type: object
                      properties:
                        utterance:
                          type: string
                          description: >
                            A phrase a user says to express the intent; a
                            slot's name in braces, such as {PickupDate},
                            stands for its value.
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The slot's name, unique in its intent.
                        slot_type_name:
                          type: string
                          description: >
                            The slot type of the slot's value: the name of
                            a slot type of the same locale's slot_types, or
                            of a built-in slot type, such as AMAZON.Date or
                            AMAZON.Number.
                        value_elicitation_setting:
                          type: object
                          properties:
                            slot_constraint:
                              type: string
                              description: >
                                Required or Optional: whether the intent
                                needs the slot's value to be fulfilled.
                            prompt_specification:
                              type: object
                              properties:
                                message_groups_list:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      message:
                                        type: object
                                        properties:
                                          plain_text_message:
                                            type: object
                                            properties:
                                              value:
                                                type: string
                                                description: >
                                                  The prompt's text, 1 to
                                                  1,000 characters.
                                  description: >
                                    The prompts Lex chooses from to ask for
                                    the slot's value, 1 to 5 of them.
                                max_retries:
                                  type: integer
                                  description: >
                                    How many times, from 0 to 5, Lex asks
                                    again when it does not recognize the
                                    answer.
            slot_types:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: The slot type's name, unique in its locale.
                  slot_type_values:
                    type: array
                    items:
                      type: object
                      properties:
                        sample_value:
                          type: object
                          properties:
                            value:
                              type: string
                              description: A value of the slot type, 1 to 140 characters.
                        synonyms:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                                description: >
                                  Another way a user says the same value,
                                  1 to 140 characters.
                  value_selection_setting:
                    type: object
                    properties:
                      resolution_strategy:
                        type: string
                        description: >
                          ORIGINAL_VALUE, to take what the user said where
                          it resembles a value; TOP_RESOLUTION, to take the
                          value it resolves to; or CONCATENATION, to take
                          the user's words together.
        description: >
          The bot's locales, at least one. Each declares locale_id and
          nlu_confidence_threshold, and optionally intents and slot_types.
          An intent declares its name, optionally its sample_utterances,
          each an utterance, and its slots, which Lex elicits in the order
          listed; a slot declares its name, its slot_type_name and its
          value_elicitation_setting: slot_constraint and, optionally, a
          prompt_specification of message_groups_list, each a
          message.plain_text_message.value, and max_retries. A slot type
          declares its name, its slot_type_values, each a sample_value.value
          with optional synonyms, each a value, and optionally its
          value_selection_setting.resolution_strategy. Code hooks, input and
          output contexts, confirmation and closing settings, generative AI
          and speech settings, and composite and external slot types are not
          offered: any other key halts the build naming it, as do a required
          key left out and a value Amazon Lex refuses.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      agent_id:
        type: string
        required: true
        description: >
          Identifier of the bot a request addresses: the ten letters and
          digits Lex assigns, which a call to Amazon Lex's runtime API, such
          as RecognizeText, names as botId. A realization publishes a
          pointer string the provisioning tool resolves once the bot
          exists.
      bot_alias_id:
        type: string
        description: >
          Identifier of the alias a request runs: the ten letters and
          digits Lex assigns, which a call to the runtime API names as
          botAliasId beside agent_id. An alias points to a numbered version
          of the bot. A Recipe that creates an alias publishes a pointer
          string the provisioning tool resolves once the alias exists; one
          that creates none publishes the empty string, and its description
          says so.
      arn:
        type: string
        required: true
        description: >
          The bot's ARN, arn:<partition>:lex:<region>:<account>:bot/<bot id>:
          what an IAM policy names as the resource it grants on. A
          realization publishes a pointer string the provisioning tool
          resolves once the bot exists.

  # The rules Amazon Lex holds a bot to that the schema above does not
  # state. Each halts the build naming what to change rather than leaving
  # the creation to fail.
  assertions:
    # Lex takes a session time to live from 60 to 86,400 seconds (the
    # AWS::Lex::Bot resource schema's IdleSessionTTLInSeconds).
    idle_session_ttl_in_seconds: >-
      {{- $t := .values.idle_session_ttl_in_seconds -}}
      {{- $ok := or (kindIs "int" $t) (kindIs "int64" $t) (and (kindIs "float64" $t) (eq (float64 (int64 $t)) $t)) -}}
      {{- if not (and $ok (ge (int64 $t) 60) (le (int64 $t) 86400)) -}}
      {{- fail (printf "values.idle_session_ttl_in_seconds is %s, and Amazon Lex keeps a conversation from 60 to 86400 seconds: set it in the Aggregate to a whole number in that range" (toJson $t)) -}}
      {{- end -}}
    # Lex takes a bot name of 1 to 100 letters and digits, each followed by
    # at most one hyphen or underscore (CreateBot's botName). Each
    # realization names the bot after the component, whose name the
    # Aggregate already limits to letters, digits, hyphens and underscores.
    bot_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (and (le (len $n) 100) (regexMatch `^([0-9a-zA-Z][_-]?)+$` $n)) -}}
      {{- fail (printf "the component %q names its Amazon Lex bot, and Amazon Lex takes a bot name of 1 to 100 letters and digits, each followed by at most one hyphen or underscore: rename the component in the Aggregate to such a name" (trunc 64 $n)) -}}
      {{- end -}}
    # The subset of the Lex model the schema above describes, and the rules
    # Lex holds it to: the keys each level takes and requires (the
    # AWS::Lex::Bot resource schema's BotLocale, Intent, SampleUtterance,
    # Slot, SlotValueElicitationSetting, PromptSpecification, MessageGroup,
    # PlainTextMessage, SlotType, SlotTypeValue, SampleValue and
    # SlotValueSelectionSetting); the confidence threshold from 0 to 1;
    # names of 1 to 100 letters and digits, each followed by at most one
    # hyphen or underscore (CreateIntent, CreateSlot, CreateSlotType); one
    # locale per locale_id, and one intent, slot type and slot per name
    # (CreateIntent: "Intent names must be unique in the locale"); the slot
    # constraints, the resolution strategies and the ranges of max_retries,
    # of the message groups and of the texts the resource schema gives; and
    # a slot's type, which names a slot type of its locale or a built-in
    # slot type, whose names begin AMAZON. (CreateSlot's slotTypeId). The
    # counts the resource schema caps in the hundreds or thousands are
    # Lex's to judge; the locale_id is Lex's to judge against its supported
    # languages, which it extends over time.
    bot_locales: >-
      {{- $ls := .values.bot_locales -}}
      {{- $np := `^([0-9a-zA-Z][_-]?)+$` -}}
      {{- if eq (len $ls) 0 -}}
      {{- fail "values.bot_locales holds no locale, and an Amazon Lex bot answers a request only in one of its locales: declare at least one in the Aggregate" -}}
      {{- end -}}
      {{- $seenLocale := dict -}}
      {{- range $i, $l := $ls -}}
      {{- $p := printf "values.bot_locales[%d]" $i -}}
      {{- range $k, $_ := $l }}{{ if not (has $k (list "locale_id" "nlu_confidence_threshold" "intents" "slot_types")) }}{{ fail (printf "%s.%s is set, and a locale of this Component takes locale_id, nlu_confidence_threshold, intents and slot_types and no other key: correct its spelling, or remove it from the Aggregate" $p $k) }}{{ end }}{{ end -}}
      {{- range $r := list "locale_id" "nlu_confidence_threshold" }}{{ if not (hasKey $l $r) }}{{ fail (printf "%s holds no %s, which Amazon Lex requires of a locale: set it in the Aggregate" $p $r) }}{{ end }}{{ end -}}
      {{- if hasKey $seenLocale $l.locale_id }}{{ fail (printf "values.bot_locales declares the locale %q more than once, and an Amazon Lex bot holds one locale per locale_id: merge them in the Aggregate" $l.locale_id) }}{{ end -}}
      {{- $_ := set $seenLocale $l.locale_id true -}}
      {{- $c := $l.nlu_confidence_threshold -}}
      {{- if not (and (ge (float64 $c) 0.0) (le (float64 $c) 1.0)) }}{{ fail (printf "%s.nlu_confidence_threshold is %s, and Amazon Lex takes a confidence threshold from 0 to 1: set it in the Aggregate to a number in that range" $p (toJson $c)) }}{{ end -}}
      {{- $types := dict -}}
      {{- range $j, $st := (get $l "slot_types" | default list) -}}
      {{- $q := printf "%s.slot_types[%d]" $p $j -}}
      {{- range $k, $_ := $st }}{{ if not (has $k (list "name" "slot_type_values" "value_selection_setting")) }}{{ fail (printf "%s.%s is set, and a slot type of this Component takes name, slot_type_values and value_selection_setting and no other key: correct its spelling, or remove it from the Aggregate" $q $k) }}{{ end }}{{ end -}}
      {{- if not (hasKey $st "name") }}{{ fail (printf "%s holds no name, which Amazon Lex requires of a slot type: set it in the Aggregate" $q) }}{{ end -}}
      {{- if not (and (le (len $st.name) 100) (regexMatch $np $st.name)) }}{{ fail (printf "%s.name is %q, and Amazon Lex takes a name of 1 to 100 letters and digits, each followed by at most one hyphen or underscore: rename it in the Aggregate" $q (trunc 100 $st.name)) }}{{ end -}}
      {{- if hasKey $types $st.name }}{{ fail (printf "%s declares the slot type %q more than once, and Amazon Lex takes each slot type name once in a locale: rename or merge them in the Aggregate" $p $st.name) }}{{ end -}}
      {{- $_ := set $types $st.name true -}}
      {{- range $m, $v := (get $st "slot_type_values" | default list) -}}
      {{- $r := printf "%s.slot_type_values[%d]" $q $m -}}
      {{- range $k, $_ := $v }}{{ if not (has $k (list "sample_value" "synonyms")) }}{{ fail (printf "%s.%s is set, and a slot type value of this Component takes sample_value and synonyms and no other key: correct its spelling, or remove it from the Aggregate" $r $k) }}{{ end }}{{ end -}}
      {{- if not (hasKey $v "sample_value") }}{{ fail (printf "%s holds no sample_value, which Amazon Lex requires of a slot type value: set it in the Aggregate" $r) }}{{ end -}}
      {{- $vals := list $v.sample_value -}}
      {{- range $sy := (get $v "synonyms" | default list) }}{{ $vals = append $vals $sy }}{{ end -}}
      {{- range $sv := $vals -}}
      {{- range $k, $_ := $sv }}{{ if ne $k "value" }}{{ fail (printf "%s holds %s in a sample value or synonym, and this Component takes value there and no other key: correct its spelling, or remove it from the Aggregate" $r $k) }}{{ end }}{{ end -}}
      {{- if not (hasKey $sv "value") }}{{ fail (printf "%s holds a sample value or synonym with no value, which Amazon Lex requires: set it in the Aggregate" $r) }}{{ end -}}
      {{- if not (regexMatch `^(?s).{1,140}$` $sv.value) }}{{ fail (printf "%s holds the value %q, and Amazon Lex takes a slot type value or synonym of 1 to 140 characters: shorten it in the Aggregate" $r (trunc 64 $sv.value)) }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- with get $st "value_selection_setting" -}}
      {{- range $k, $_ := . }}{{ if ne $k "resolution_strategy" }}{{ fail (printf "%s.value_selection_setting.%s is set, and this Component takes resolution_strategy there and no other key: correct its spelling, or remove it from the Aggregate" $q $k) }}{{ end }}{{ end -}}
      {{- if not (has (get . "resolution_strategy") (list "ORIGINAL_VALUE" "TOP_RESOLUTION" "CONCATENATION")) }}{{ fail (printf "%s.value_selection_setting.resolution_strategy is %s, and Amazon Lex takes ORIGINAL_VALUE, TOP_RESOLUTION or CONCATENATION, spelt so: set it in the Aggregate to one of them" $q (toJson (get . "resolution_strategy"))) }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $intents := dict -}}
      {{- range $j, $in := (get $l "intents" | default list) -}}
      {{- $q := printf "%s.intents[%d]" $p $j -}}
      {{- range $k, $_ := $in }}{{ if not (has $k (list "name" "sample_utterances" "slots")) }}{{ fail (printf "%s.%s is set, and an intent of this Component takes name, sample_utterances and slots and no other key: correct its spelling, or remove it from the Aggregate" $q $k) }}{{ end }}{{ end -}}
      {{- if not (hasKey $in "name") }}{{ fail (printf "%s holds no name, which Amazon Lex requires of an intent: set it in the Aggregate" $q) }}{{ end -}}
      {{- if not (and (le (len $in.name) 100) (regexMatch $np $in.name)) }}{{ fail (printf "%s.name is %q, and Amazon Lex takes a name of 1 to 100 letters and digits, each followed by at most one hyphen or underscore: rename it in the Aggregate" $q (trunc 100 $in.name)) }}{{ end -}}
      {{- if hasKey $intents $in.name }}{{ fail (printf "%s declares the intent %q more than once, and Amazon Lex takes each intent name once in a locale: rename or merge them in the Aggregate" $p $in.name) }}{{ end -}}
      {{- $_ := set $intents $in.name true -}}
      {{- range $m, $u := (get $in "sample_utterances" | default list) -}}
      {{- range $k, $_ := $u }}{{ if ne $k "utterance" }}{{ fail (printf "%s.sample_utterances[%d].%s is set, and this Component takes utterance there and no other key: correct its spelling, or remove it from the Aggregate" $q $m $k) }}{{ end }}{{ end -}}
      {{- if not (hasKey $u "utterance") }}{{ fail (printf "%s.sample_utterances[%d] holds no utterance, which Amazon Lex requires of a sample utterance: set it in the Aggregate" $q $m) }}{{ end -}}
      {{- end -}}
      {{- $slots := dict -}}
      {{- range $m, $s := (get $in "slots" | default list) -}}
      {{- $r := printf "%s.slots[%d]" $q $m -}}
      {{- range $k, $_ := $s }}{{ if not (has $k (list "name" "slot_type_name" "value_elicitation_setting")) }}{{ fail (printf "%s.%s is set, and a slot of this Component takes name, slot_type_name and value_elicitation_setting and no other key: correct its spelling, or remove it from the Aggregate" $r $k) }}{{ end }}{{ end -}}
      {{- range $x := list "name" "slot_type_name" "value_elicitation_setting" }}{{ if not (hasKey $s $x) }}{{ fail (printf "%s holds no %s, which Amazon Lex requires of a slot: set it in the Aggregate" $r $x) }}{{ end }}{{ end -}}
      {{- if not (and (le (len $s.name) 100) (regexMatch $np $s.name)) }}{{ fail (printf "%s.name is %q, and Amazon Lex takes a name of 1 to 100 letters and digits, each followed by at most one hyphen or underscore: rename it in the Aggregate" $r (trunc 100 $s.name)) }}{{ end -}}
      {{- if hasKey $slots $s.name }}{{ fail (printf "%s declares the slot %q more than once, and Amazon Lex takes each slot name once in an intent: rename or merge them in the Aggregate" $q $s.name) }}{{ end -}}
      {{- $_ := set $slots $s.name true -}}
      {{- if not (or (regexMatch `^AMAZON\.[A-Za-z_]+$` $s.slot_type_name) (hasKey $types $s.slot_type_name)) }}{{ fail (printf "%s.slot_type_name is %q, which names no slot type of its locale and no built-in slot type, and Amazon Lex takes a slot's type as one of them: declare the slot type in this locale's slot_types, or name a built-in one such as AMAZON.Date, in the Aggregate" $r $s.slot_type_name) }}{{ end -}}
      {{- $e := $s.value_elicitation_setting -}}
      {{- range $k, $_ := $e }}{{ if not (has $k (list "slot_constraint" "prompt_specification")) }}{{ fail (printf "%s.value_elicitation_setting.%s is set, and this Component takes slot_constraint and prompt_specification there and no other key: correct its spelling, or remove it from the Aggregate" $r $k) }}{{ end }}{{ end -}}
      {{- if not (has (get $e "slot_constraint") (list "Required" "Optional")) }}{{ fail (printf "%s.value_elicitation_setting.slot_constraint is %s, and Amazon Lex takes Required or Optional, spelt so: set it in the Aggregate to one of them" $r (toJson (get $e "slot_constraint"))) }}{{ end -}}
      {{- with get $e "prompt_specification" -}}
      {{- $ps := . -}}
      {{- range $k, $_ := $ps }}{{ if not (has $k (list "message_groups_list" "max_retries")) }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification.%s is set, and this Component takes message_groups_list and max_retries there and no other key: correct its spelling, or remove it from the Aggregate" $r $k) }}{{ end }}{{ end -}}
      {{- range $x := list "message_groups_list" "max_retries" }}{{ if not (hasKey $ps $x) }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification holds no %s, which Amazon Lex requires of a prompt: set it in the Aggregate" $r $x) }}{{ end }}{{ end -}}
      {{- $mr := $ps.max_retries -}}
      {{- if not (and (ge (int64 $mr) 0) (le (int64 $mr) 5)) }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification.max_retries is %s, and Amazon Lex asks again from 0 to 5 times: set it in the Aggregate to a whole number in that range" $r (toJson $mr)) }}{{ end -}}
      {{- $gs := $ps.message_groups_list -}}
      {{- if not (and (ge (len $gs) 1) (le (len $gs) 5)) }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification.message_groups_list holds %d message groups, and Amazon Lex takes from 1 to 5 in a prompt: declare that many in the Aggregate" $r (len $gs)) }}{{ end -}}
      {{- range $g := $gs -}}
      {{- $ok := and (eq (len $g) 1) (kindIs "map" (get $g "message")) -}}
      {{- if $ok }}{{ $ok = and (eq (len $g.message) 1) (kindIs "map" (get $g.message "plain_text_message")) }}{{ end -}}
      {{- if $ok }}{{ $ok = and (eq (len $g.message.plain_text_message) 1) (typeIs "string" (get $g.message.plain_text_message "value")) }}{{ end -}}
      {{- if not $ok }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification.message_groups_list holds %s, and a message group of this Component takes message.plain_text_message.value alone, which Amazon Lex requires there: write each message group so in the Aggregate" $r (trunc 200 (toJson $g))) }}{{ end -}}
      {{- if not (regexMatch `^(?s).{1,1000}$` $g.message.plain_text_message.value) }}{{ fail (printf "%s.value_elicitation_setting.prompt_specification.message_groups_list holds the message %q, and Amazon Lex takes a plain text message of 1 to 1000 characters: shorten it in the Aggregate" $r (trunc 64 $g.message.plain_text_message.value)) }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
