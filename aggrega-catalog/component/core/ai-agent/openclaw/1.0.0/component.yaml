apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/openclaw
  version: 1.0.0
  description: >
    An OpenClaw agent, run in-cluster as the deployment's own application image. OpenClaw is a long-lived assistant process that receives requests over messaging channels and drives a model on the requester's behalf, and it declares its providers, channels and agent defaults in a JSON configuration file it reads from its own state directory rather than on a command line. So what this component states is the bound a single turn runs under — whether the agent completes the turn by itself or pauses for the requester between steps, how long the turn may take, and how many steps it may spend — and it leaves provider and channel selection to that configuration. The deployment supplies the image and the configuration the image reads.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # One compiler-wired edge: the model endpoint flows into the synthesized
  # application container. Required, because the assistant process has nothing to
  # answer with until a model is reachable. The socket, not the documented
  # `models` name-list, is what the selector gate enforces.
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  # Optional model API-key credential, referenced at the consumer's scope so a
  # deployment chooses whether applications share one key or hold per-application
  # keys. Optional (bare deployments run against a no-auth endpoint or supply the
  # key out of band); transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        execution_mode: { type: string, enum: [autonomous, interactive], default: autonomous }
        max_execution_time: { type: integer, default: 300 }
        max_steps: { type: integer, default: 20 }
      required: [execution_mode, max_execution_time, max_steps]
    infra:
      # Operator-supplied container image running the OpenClaw agent.
      image:
        type: string
        description: Container image running the OpenClaw agent and the configuration it reads.
