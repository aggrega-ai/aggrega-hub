apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/vapi
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the platform is operated by its provider and no source licence is granted for
  # it, so no single identifier expresses the situation. The class it falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A voice-agent platform reached over Vapi's REST API, so an application holds a
    spoken conversation with an assistant Vapi hosts and runs. The developer names
    the assistant and, optionally, the version to pin; the operator supplies the
    API base address and the platform-held number a call originates from.
    Wire here rather than to a carrier: a carrier moves the call, an
    agent platform conducts the conversation, and many Releases want both.
    Consumers read the base address, the assistant identifier, the version and the
    number. Realized by reference: no compute runs here.
  labels:
    # A platform the Release calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Vapi's own documentation states that a server-side request is authenticated
  # with a private API key sent in the Authorization header as a bearer token.
  # That is one piece of secret material, so one slot. The slot is
  # secret-kind-pinned but family-agnostic, so either a referenceable credential
  # or an inject-value credential may fill it per target. Webhook authentication
  # is not a second slot: the platform holds that credential itself, referenced
  # by an identifier a Release configures on the platform rather than material
  # a Release presents.
  #
  # The slot is not required here, because whether a realization can carry the
  # credential depends on the target: the helm Recipe requires it and halts
  # naming it when it is empty, while the compose Recipe defines no service,
  # refuses a filled slot, and leaves the credential to the component that calls
  # the platform.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The private API key presented as a bearer token in the Authorization header on every request to the platform.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The assistant identifier is a value rather than a label because nothing
        # selects on it: it names which configured assistant this wiring
        # addresses, and the Aggregate sets it. Published to consumers below so an
        # application reads it from one place instead of restating it.
        assistant_id:
          type: string
          description: The identifier of the saved assistant a call runs, as the platform's dashboard reports it.
        # Left unset, the platform follows its own latest version of the
        # assistant, which is why the catalog states no default here.
        assistant_version:
          type: string
          description: The assistant version to pin a call to; unset, the platform follows its own latest.
      required: [assistant_id]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the platform's documented public host, so
      # taking the default needs no operator input. It is sourced from infra
      # rather than fixed in a Recipe so an operator may repoint it at
      # a proxy the Release routes egress through. A deterministic pointer
      # string the runtime resolves; the compiler never contacts it.
      endpoint: { type: string, default: "https://api.vapi.ai" }
      # This platform addresses a number it holds by an opaque platform-issued
      # identifier rather than by a dialable number, which is why the key names an
      # identifier. It carries no default because it is specific to the account a
      # Release holds, and it is not secret material: it names a resource
      # rather than granting access to one.
      phone_number_id:
        type: string
        description: The platform-issued identifier of the number an outbound call originates from.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # platform itself, so it reads all four from one place rather than each of its
    # own containers carrying a copy: where to call, which assistant to run, which
    # version to pin, and which number to originate from. The credential is not
    # published and is not carried across the edge — on Kubernetes a credential
    # attached to the slot above is materialized in the Release, and the
    # consuming application references the material under the name it was given;
    # on Compose it is attached to the consuming component itself.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application calls to hold a spoken
          conversation. The Release supplies it, so an operator may point it
          at a different host without the application changing.
      assistant_id:
        type: string
        required: true
        description: >
          Identifier of the assistant a call is conducted by, carried through
          from the value the Aggregate declared. An application sends it to
          address this assistant rather than another on the same account.
      assistant_version:
        type: string
        description: >
          Version of that assistant to pin a call to instead of the one the
          platform serves by default. It is absent unless the Aggregate pinned
          one, so an application sends it only when it is set.
      phone_number_id:
        type: string
        description: >
          Platform-issued identifier of the number an outbound call originates
          from. An application sends the identifier rather than the number
          itself, which the platform holds.
