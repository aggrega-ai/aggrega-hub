apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/dify-sandbox
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Dify code sandbox — the isolated execution service that runs the Python
    and JavaScript of a workflow's code nodes. The API server and the task worker
    hand it a snippet over HTTP and receive the result; the snippet never runs
    inside either of them, which is what keeps a workflow author's code out of
    the platform's own process. It holds an authentication key that its callers
    present, so a workload that merely reaches its port cannot execute code
    through it, and its own outbound traffic leaves through the forward proxy
    wired on the `ssrf_proxy` uses-socket rather than going out directly. Keeps
    no state between calls — each execution is independent and its working
    directory is discarded — so it renders as a stateless server. Exports its
    host, port and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the sandbox as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The forward proxy the sandbox's own outbound traffic leaves through.
    # Required rather than optional: the sandbox runs code an application author
    # supplied, so a deployment that let it reach the network directly would
    # hand that code the cluster's internal address space.
    ssrf_proxy:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true

  featuresSchema:
    # Optional execution key the sandbox checks on every execution request. It is
    # the sandbox's own: each service that calls the sandbox presents the same key
    # as the credential on the connection it reaches the sandbox through.
    # Unattached, the Recipe uses a pinned development literal.
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    code_execution_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional execution key the sandbox checks on every request it receives. Each service that calls the sandbox presents the same key, as the credential on the connection it reaches the sandbox through, so the sandbox and its callers hold one value. Unattached, the Recipe uses the pinned development literal `dify-sandbox`, suitable for evaluation only and published in this catalog, so every Release that leaves the slot unattached shares it."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      enable_network:
        type: boolean
        default: true
        description: Whether executed code may make network calls at all. Left at the default, calls are permitted and leave through the wired forward proxy, which is what lets a code node fetch a URL while still being unable to reach a private address. Set it false to refuse network access outright, which suits an installation whose code nodes only transform data they were given.
      worker_timeout:
        type: integer
        min: 1
        default: 15
        description: How long, in seconds, one execution may run before the sandbox stops it.
      python_packages:
        type: array
        items: { type: string }
        description: Extra Python package requirements the sandbox installs before it accepts work, each written as one requirement line. Left unset, executed code sees the sandbox's built-in package set only.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8194
        description: HTTP listen port the execution API is served on.
      engine_version:
        type: string
        default: "0.2.15"
        description: Dify sandbox container image tag. The sandbox is released on its own cadence, so this tag moves independently of the API server's.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the code sandbox. The
          API server and the worker dial this name to have a snippet executed
          away from their own process.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts execution requests on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a consumer composes its base URL on.
