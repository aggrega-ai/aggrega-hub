apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/openai
  version: 1.0.0
  description: >
    An assistant hosted on OpenAI's Assistants API, realized as an external reference (no in-cluster compute). The assistant itself — its instructions, its tool capabilities and its conversation state — lives in OpenAI's service and is addressed by an assistant identifier the developer supplies. The realization emits only the wiring a consuming application needs, which is the API endpoint and the assistant identifier to address a request to it. The endpoint defaults to OpenAI's fixed host and is sourced from infra so an operator may repoint it at a gateway or proxy.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        instructions: { type: string }
        assistant_id: { type: string }
        capabilities:
          code_interpreter: { type: boolean, default: false, required: true }
          file_search: { type: boolean, default: false, required: true }
    infra:
      # OpenAI's managed API has a fixed host, so the endpoint defaults to it
      # and an operator need not supply one. It is sourced from infra (not
      # hardcoded in the Recipe) so an operator may repoint it at a gateway or
      # proxy.
      endpoint: { type: string, default: "https://api.openai.com/v1" }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Base URL an application sends the assistant's requests to. It
          follows the endpoint set in the Release, so an operator may point it
          at a gateway or proxy without the application changing.
      assistant_id:
        type: string
        description: >
          Identifier of the assistant a request addresses, carried through
          from the value the Aggregate declared. The assistant's instructions
          and its conversation state live in the provider's service, so this
          is what reaches them.
