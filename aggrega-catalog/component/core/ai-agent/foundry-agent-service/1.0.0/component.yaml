apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/foundry-agent-service
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Foundry Agent Service is a
  # hosted service the reader contracts for with Microsoft, under Azure's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    An agent of Microsoft Foundry Agent Service, reached as an external
    reference: no compute runs and nothing is provisioned. An agent is an
    object the service holds inside a Foundry project, created and versioned
    there by name, and no Azure resource type defines the agent itself, so
    the agent and the project it lives in exist outside the Release.

    The developer names the agent, and optionally pins the version a call
    runs; the operator supplies the project's endpoint,
    https://<resource>.services.ai.azure.com/api/projects/<project>, in the
    Release. Consumers read the endpoint, the agent's name and its version
    over a uses edge, which a call to the agent needs.

    Authentication is the consumer's concern: a workload calls with a
    Microsoft Entra ID token for the identity its platform gives it, under
    an Azure role assignment the operator makes on the project, and receives
    no key from this realization.
  labels:
    # A service the Release calls rather than runs: nothing in the Release
    # serves it, so the operational primitive is a resource.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    # No agent.aggrega.ai/autonomy label: how far an agent acts on its own is
    # set by the definition the project holds, its instructions and tools,
    # which this Component does not carry.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The agent's name is a value rather than a label because nothing
        # selects on it: it names which agent of the project this wiring
        # addresses, and the service never lets it change once the agent is
        # created. Published below so a consumer reads it from one place.
        agent_name:
          type: string
          description: The name the agent is created under in the Foundry project.
        # The service keeps each saved version of an agent unchanged and lets
        # a call direct its requests to one of them, so the version is a value
        # the developer pins or leaves unset.
        agent_version:
          type: string
          description: The version of the agent a call runs, as the project numbers it; unset, a consumer names the agent alone.
      required: [agent_name]

    # infra — Operational Sizing
    infra:
      # The project endpoint carries the operator's Foundry resource and
      # project names, so it is operator-supplied rather than a fixed host.
      endpoint: { type: string }
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Endpoint of the Foundry project a consumer calls the agent at,
          https://<resource>.services.ai.azure.com/api/projects/<project>.
          The project belongs to the organisation, so the Release supplies it
          and the value differs per environment.
      agent_name:
        type: string
        required: true
        description: >
          Name the agent is created under in the project, carried through
          from the value the Aggregate declared. A consumer names it to
          address this agent rather than another in the same project.
      agent_version:
        type: string
        description: >
          Version of that agent a call runs, carried through from the value
          the Aggregate declared. It is empty unless the Aggregate pinned
          one, so a consumer sends it only when it is set.
