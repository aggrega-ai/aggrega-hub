apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/griptape
  version: 1.0.0
  description: >
    A Griptape agent, run in-cluster as the deployment's own application image. Griptape's distinguishing move is to keep large tool output out of the prompt: a tool's result is parked in task memory and referenced, so the agent reasons over a handle instead of the payload. That is what the off-prompt switch selects, and it is why this component wires a task-memory store as a topology edge alongside the model. The deployment supplies the image containing its Griptape application.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Two compiler-wired edges. `model` carries the model endpoint into the
  # synthesized application container. `task_memory` is pinned to the
  # memory-capable datastore engines because off-prompt output is retrieved by
  # similarity rather than by key, so a plain key-value store cannot serve it.
  # The socket, not the documented `models` / `datastores` name-lists, is what
  # the selector gate enforces.
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
    task_memory:
      selector: "datastore.aggrega.ai/engine in (vector, episodic, semantic-memory)"
  # Optional model API-key credential, referenced at the consumer's scope so a
  # deployment chooses whether applications share one key or hold per-application
  # keys. Optional (bare deployments run against a no-auth endpoint or supply the
  # key out of band); transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        off_prompt: { type: boolean, default: true }
        stream: { type: boolean, default: false }
      required: [off_prompt, stream]
    infra:
      # Operator-supplied container image running the Griptape application.
      image:
        type: string
        description: Container image running the Griptape application code.
