apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/bedrock
  version: 1.0.0
  description: >
    An Amazon Bedrock agent, realized as an external reference (no in-cluster compute). The agent, its instruction and its action groups live in the Bedrock service and are addressed by the agent name the developer supplies. The regional runtime endpoint is operator-supplied, since the Bedrock agent-runtime host carries the region. Authentication is the consumer's concern — workloads use ambient AWS IAM (for example EKS IRSA) or inject their own credentials, rather than a static key delivered by the realization. The optional knowledge-base socket wires the agent to a retrieval-capable datastore when the deployment declares one.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    knowledge_bases:
      selector: "datastore.aggrega.ai/engine in (vector, episodic, semantic-memory)"
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_name: { type: string }
        instruction: { type: string }
        action_groups: { type: array, items: { type: string } }
      required: [agent_name, instruction]
    infra:
      # The Bedrock agent-runtime host is regional
      # (bedrock-agent-runtime.<region>.amazonaws.com), so the endpoint is
      # operator-supplied rather than a fixed host.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint: { type: string, required: true }
      agent_name: { type: string, required: true }
