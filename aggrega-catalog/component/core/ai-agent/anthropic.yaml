apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/anthropic
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        model: { type: string }
        system_prompt: { type: string }
        enable_computer_use: { type: boolean, default: false }
        max_tokens: { type: integer, default: 4096 }
      required: [model, enable_computer_use, max_tokens]
