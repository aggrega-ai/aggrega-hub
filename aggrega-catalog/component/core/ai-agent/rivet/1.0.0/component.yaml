apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/rivet
  version: 1.0.0
  description: >
    A Rivet agent, run in-cluster as an application image the Release supplies. Rivet is authored visually: chains are drawn as named graphs and saved together inside a project file, and the runtime executes one of those graphs by name. So this component identifies its work by a file-and-graph coordinate rather than by a prompt — the only agent here that does — and passes the graph's declared inputs as a string map. The Release supplies the image carrying both the runtime and the project file.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The model reference is a compiler-wired edge for this agent: the model's
  # published endpoint flows into the synthesized application container. The
  # socket, not the documented `models` name-list, is what the selector gate
  # enforces.
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
  # Optional model API-key credential, referenced at the consumer's scope, so
  # applications may share one key or hold per-application keys. Optional (bare
  # deployments run against a no-auth endpoint or supply the key out of band);
  # transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        project_file: { type: string }
        graph_name: { type: string }
        inputs: { type: object, valuesType: string }
      required: [project_file, graph_name]
    infra:
      # Operator-supplied container image running the Rivet application.
      image:
        type: string
        description: Container image running the Rivet runtime and project file.
