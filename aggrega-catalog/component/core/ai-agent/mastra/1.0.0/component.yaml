apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/mastra
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and no single identifier covers what this one runs: Mastra's
  # packages carry the Apache License 2.0 outside its `ee/` directories and
  # Mastra's enterprise terms inside them, and its core package holds both.
  # component.aggrega.ai/upstream-licensing records the class, `open-core`.
  #
  # The image runs the server `mastra build` produces, started with
  # `node .mastra/output/index.mjs` or `mastra start`.
  description: >
    An agent built on Mastra, run in-cluster as an application image the
    Release supplies: the server `mastra build` produces. The catalog pins no
    image; the build halts naming `infra.image` until a Release sets it.

    It runs on `infra.port`, 4111 by default, delivered as Mastra's PORT,
    with MASTRA_HOST set to every interface. It serves routes under `/api`,
    such as `/api/agents/<id>/generate` and `/api/v1/responses`, and
    `/health`, read by the Kubernetes readiness check. They answer any caller
    unless the application configures authentication, so attaching
    core/public-ingress or core/http-route halts the build until
    `infra.routes_authenticated` affirms it does. The address is published as
    host, port, endpoint and protocol. Mastra serves every registered agent
    over Agent2Agent; where `values.agent_id` names one, agent_card_url
    publishes its card's address, for core/ai-tool/agent-invocation to
    delegate to.

    The `model` socket takes a model or gateway serving the OpenAI API and
    delivers its endpoint as OPENAI_BASE_URL and the connection's credential,
    by reference, as OPENAI_API_KEY, which Mastra reads for an `openai/`
    model the agent's code names.

    Each tool wired to the optional `tools` socket, such as an HTTP Model
    Context Protocol server, reaches the application as
    AGGREGA_TOOL_<ALIAS>_URL, beside any credential its connection carries. An
    `inject:` block on any connection, or on the component itself, delivers
    names the application reads, as variables or files, a tools connection's
    in place of the tool's address and header. A set `values.agent_id` reaches
    the application as MASTRA_AGENT_ID by default; an entry of the component's
    own block reading it alone replaces that name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two every Recipe of this component delivers, as none
  # renders a command line. Each env entry reaches the container under the name
  # the developer gives it and each file entry at the path it gives. An entry
  # reading one of the agent's own values alone replaces that value's default
  # name, the MASTRA_AGENT_ID variable the Recipes otherwise deliver it under;
  # an entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  # The model reference is a compiler-wired edge for this agent: the model's
  # published endpoint flows into the synthesized application container. The
  # socket, not the documented `models` name-list, is what the selector gate
  # enforces.
  #
  # The image is the Release's own code, so every socket admits an inject
  # block, of env entries and of file entries, which every Recipe of this
  # component writes as files at the absolute paths the connection names. A
  # connection writing one receives the names it dictates in place of the
  # variables the Recipes derive from its target's published values, which are
  # defaults; a variable Mastra reads by itself, and what an attachment on the
  # connection delivers, stay.
  usesSchema:
    # Mastra's model router reads a provider's address from
    # <PROVIDER>_BASE_URL and its key from the provider's own variable, and
    # the agent's code names the model as <provider>/<model>. The selector
    # names openai, the API whose variables the Recipes deliver: it admits a
    # model component, or a gateway serving that API in front of several, and
    # refuses one whose API is another. Through a gateway the model the code
    # names is an alias the gateway publishes.
    #
    # The router sends an openai/ model's requests to the Responses API, and
    # many servers other than OpenAI's serve Chat Completions alone; which of
    # the two a model serves is not something its label records.
    #
    # The Recipes deliver the endpoint as OPENAI_BASE_URL, which Mastra's
    # model router reads by itself, and an attached credential as
    # OPENAI_API_KEY, so neither is a default: an inject block on the
    # connection, of env or file entries, delivers the names it dictates beside
    # them.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api=openai"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill. Optional (a Release runs
      # against a model that checks no key, or supplies the key out of band);
      # transparent (inject: [env]) so a synthesized Workload may reference it
      # as an env secret; secret-kind-pinned but family-agnostic so either a
      # referenceable Secret (helm secretKeyRef) or an inject-value (compose
      # inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the agent presents to the model this connection reaches. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
    # A tool socket, in the catalog's form: the category admits tools and
    # nothing else, and the transport admits only the tools the application
    # reaches over HTTP. Optional, and it takes one connection per tool the
    # Aggregate wires. Mastra reads no tool's address from a variable of its
    # own: the application names each server in the MCP client it builds. So
    # the Recipe delivers each connection under variables named for its alias,
    # upper-cased with every hyphen an underscore: a tool wired under the alias
    # docs-search arrives as AGGREGA_TOOL_DOCS_SEARCH_URL.
    #
    # The address, and beside a credential the header the tool publishes as
    # AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER, are the defaults: an inject block
    # on the connection, of env or file entries, replaces both with the names
    # it dictates, while the credential and endpoint attachments still deliver
    # theirs. Two aliases that differ only in letter case, or in a hyphen
    # against an underscore, are named alike, and the Recipes halt the build,
    # naming both, wherever the two would deliver one variable.
    tools:
      selector: "component.aggrega.ai/category=ai-tool, tool.aggrega.ai/transport=http"
      inject: [env, file]
      # A statement about this connection's target, authored on the
      # connection: the tool it reaches takes no credential. It changes
      # nothing this component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the tool this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Both secrets are held on the connection they are used on, so each
      # connection names its own fill. Both are optional and transparent
      # (inject: [env]), so a synthesized Workload references either as an
      # environment secret on helm, and a compose Recipe reads either from the
      # inject pipe.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional credential the agent presents to the tool this connection
            reaches, under the request header the tool publishes as
            credential_header: as Bearer <credential> under Authorization, and
            as the whole value of any other header. When attached, the Recipe
            delivers it as AGGREGA_TOOL_<ALIAS>_CREDENTIAL (a Kubernetes
            secretKeyRef on helm, the inject pipe on compose), on a connection
            writing an inject block too, and, on one writing none, the header as
            AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER where the tool publishes one.
        endpoint:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: >
            Optional whole address of the tool this connection reaches, the part
            carrying its key included, for a server that reads its key from its
            own address. When attached, the Recipe delivers it as
            AGGREGA_TOOL_<ALIAS>_URL in place of the endpoint the tool publishes:
            a Kubernetes secretKeyRef on helm, so the key reaches no rendered
            file, and the inject pipe on compose, written as delivered.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The agent identifier is a value rather than a label because nothing
        # selects on it: it names which of the application's agents a caller
        # delegates to over the Agent2Agent protocol, and the Aggregate sets it.
        # It is the coordinate Mastra's agent routes take in their path. Mastra
        # serves the card of every agent it registers under the server's API
        # prefix, /api unless the application's code sets another, so the
        # Recipes compose the card's address from this and nothing else.
        agent_id:
          type: string
          description: The identifier of an agent the application registers with Mastra, as Mastra's agent routes take it, for example weather-agent. Where set, the component publishes the address of that agent's Agent2Agent card as agent_card_url; unset, it publishes agent_card_url empty.
    infra:
      # The application is the Release's own server built by Mastra, so the
      # catalog holds no default and the Release names the image, its tag
      # included.
      image:
        type: string
        description: Container image running the server `mastra build` produces from the application.
      # The port Mastra's server listens on unless told otherwise. The server
      # reads PORT, which the Recipes deliver as this value, unless the
      # application's code sets server.port, which takes precedence.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 4111
        description: Port the server listens on, delivered to it as PORT, and the port the component publishes. A port set in the application's own server configuration takes precedence over PORT.
      # The operator's word that the application authenticates the requests
      # its routes take. Whether the application's own code does is not
      # something the build can see, so the Release affirms it, as a
      # core/public-ingress attachment's infra.control_plane_present affirms a
      # running ingress controller, and the component's assertion reads it
      # before a core/public-ingress or core/http-route attachment publishes
      # the routes through an ingress or a gateway.
      routes_authenticated:
        type: boolean
        default: false
        description: Operator affirmation that the application authenticates every request its routes take. While false, its default, a core/public-ingress or core/http-route attachment on this component halts the build, because Mastra's routes otherwise answer any caller. An attachment is matched by those two Feature names, so one of a Feature that extends either under another name is not refused, though it may publish the routes as well. It changes nothing this component renders.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges: where a caller
    # reaches the server, and where the card of the agent values.agent_id
    # names is read. The card lists the address a caller sends Agent2Agent
    # requests to, formed from the address the caller used.
    provides:
      host:
        type: string
        required: true
        description: >
          DNS name a caller reaches the server at: the Service's name on
          Kubernetes, the service's name on the compose network. A caller that
          composes its own address dials this name; one that does not reads
          `endpoint` instead.
      port:
        type: integer
        required: true
        description: TCP port the server is reached on, following infra.port.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the server, with the host and the port already composed.
          Mastra's routes sit under /api below it, and /health at its root.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a caller composing its own address rather than reading `endpoint`.
      agent_card_url:
        type: string
        description: >
          The URL the Agent2Agent card of the agent values.agent_id names is
          read at, /api/.well-known/<agent_id>/agent-card.json on the server's
          address, which describes that agent and the address a caller sends
          requests to. Empty while values.agent_id is unset.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  #
  # The image is the Release's and nothing else supplies one, so a Release
  # setting none halts here, naming the key and where it is set, whichever
  # Recipe binds. Only a build wiring the required model is judged, and every
  # build of a Release wires it: a Recipe validated on its own places this
  # component in a build of one that wires nothing and sets no infra, where an
  # absent image is expected rather than an omission.
  #
  # Mastra's routes answer any caller unless the application configures
  # authentication, so a core/public-ingress or core/http-route attachment,
  # which publishes them through an ingress or a gateway, halts the build until
  # the Release affirms in infra.routes_authenticated that the application
  # authenticates every request its routes take. The rule reads each
  # attachment's type, whether the Aggregate or the Release wrote it and
  # whether or not it carries a version, and the affirmation in infra, all
  # known before a Recipe binds, so it holds whichever Recipe binds. It
  # compares the type, its version removed, with those two Feature names,
  # because an attachment as an assertion reads it carries its type, resolved
  # version and values and nothing of what the Feature extends. So an
  # attachment of a Feature that extends either under another name, and
  # publishes the routes the same way, is not refused.
  assertions:
    image_supplied: >-
      {{- if and (optional $.uses "model" dict) (not (optional .infra "image" "")) -}}
      {{- fail (printf "%q runs a server built by Mastra from an image the Release supplies, and the catalog holds no default for it: set infra.image on it in the Release to the container image running that server" $.metadata.instance_id) -}}
      {{- end -}}
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" "tools" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    published_routes_are_authenticated: >-
      {{- range $name, $feature := .features -}}
      {{- $type := first (splitList ":" $feature.type) -}}
      {{- if and (has $type (list "core/public-ingress" "core/http-route")) (not (optional $.infra "routes_authenticated" false)) -}}
      {{- fail (printf "%q publishes its routes through its %s attachment %s, and Mastra's routes answer any caller unless the application configures authentication: set infra.routes_authenticated to true on it in the Release, once the application authenticates every request its routes take, or remove the attachment" $.metadata.instance_id $type $name) -}}
      {{- end -}}
      {{- end -}}
