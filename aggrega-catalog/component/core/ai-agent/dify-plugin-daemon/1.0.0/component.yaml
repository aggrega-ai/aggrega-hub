apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/dify-plugin-daemon
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Dify plugin runtime — the service that installs and runs the plugins a
    Dify installation's model providers and tools are delivered as. Every model
    call and every tool invocation an application makes is dispatched through it,
    so an installation with no plugin runtime can edit a workflow but cannot run
    one. It keeps its own plugin catalogue and installation records in a
    dedicated database on the PostgreSQL backend wired through the `backend`
    uses-socket, coordinates through the Redis-compatible cache wired through
    `cache`, and calls back into the API server over the internal API on the
    `api` socket to resolve workspace and credential context. Installed plugin
    packages and their prepared runtime environments live on its own volume, and
    it verifies each package's signature before running it, so it renders as a
    single-replica stateful server with a persistent claim. Exports its host,
    port and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the plugin runtime as containers in
    # the deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The PostgreSQL backend holding the runtime's plugin catalogue and
    # installation records, in a database of its own alongside the platform's.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
    # The Redis-compatible cache the runtime coordinates through.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Redis logical-database index the runtime uses on this connection.
    # The API server the runtime calls over the internal API to resolve
    # workspace and credential context for a plugin invocation.
    api:
      selector: "component.aggrega.ai/category=ai-agent"
      inject: [env]
      required: true

  featuresSchema:
    # Optional backend-password credential slot, shared with the backend. When
    # attached, supplies the PostgreSQL password via the credential subsystem;
    # when unattached, the Recipe falls back to its inline development default.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential shared with the backend. When attached, supplies the backend password via the credential subsystem; unattached, the Recipe uses its inline development default."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      plugin_database:
        type: string
        default: dify_plugin
        description: Name of the database the runtime keeps its plugin catalogue in. It sits on the same backend as the platform's own database and is separate from it, so a deployment that reuses one server for both keeps the two schemas apart.
      verify_signature:
        type: boolean
        default: true
        description: Whether a plugin package must carry a valid signature before the runtime will install it. Left at the default, an unsigned package is refused, which is what stops arbitrary code entering the installation through the plugin path. Set it false only for an installation that develops its own unsigned plugins.
      max_package_size:
        type: integer
        min: 1
        default: 52428800
        description: Largest plugin package, in bytes, the runtime accepts for installation.
      max_execution_timeout:
        type: integer
        min: 1
        default: 600
        description: How long, in seconds, one plugin invocation may run before the runtime stops it.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5002
        description: HTTP listen port the plugin-dispatch API is served on.
      engine_version:
        type: string
        default: "0.6.10-local"
        description: Dify plugin-runtime container image tag. The runtime is released on its own cadence, so this tag moves independently of the API server's.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 5Gi
            description: Size of the persistent volume holding installed plugin packages and their prepared runtime environments.
          type:
            type: string
            default: gp3
            description: Storage class the persistent volume is provisioned from.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the plugin runtime. The
          API server dials this name to dispatch a model call or a tool
          invocation.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts dispatch requests on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a consumer composes its base URL on.
