apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/autogpt
  version: 1.0.0
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        ai_name: { type: string }
        ai_role: { type: string }
        ai_goals: { type: array, items: { type: string }, minItems: 1 }
        continuous_mode: { type: boolean, default: false }
        continuous_limit: { type: integer, exclusiveMinimum: 0 }
      required: [ai_name, ai_role, ai_goals, continuous_mode]
