apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/autogpt
  version: 1.0.0
  description: >
    An AutoGPT agent, run in-cluster as the deployment's own application image. AutoGPT pursues a list of goals on its own initiative rather than answering a single request, so this component's surface is that goal list plus the identity the agent adopts while working through it, and a bound on how many steps it may take without being asked again. The deployment supplies the image containing its AutoGPT application; the model is wired as a topology edge rather than configured in code.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The model reference is a compiler-wired edge for this agent: the model's
  # published endpoint flows into the synthesized application container. The
  # socket, not the documented `models` name-list, is what the selector gate
  # enforces.
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  # Optional model API-key credential, referenced at the consumer's scope so a
  # deployment chooses whether applications share one key or hold per-application
  # keys. Optional (bare deployments run against a no-auth endpoint or supply the
  # key out of band); transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        ai_name: { type: string }
        ai_role: { type: string }
        ai_goals: { type: array, items: { type: string }, minItems: 1 }
        continuous_mode: { type: boolean, default: false }
        continuous_limit: { type: integer, exclusiveMinimum: 0 }
      required: [ai_name, ai_role, ai_goals, continuous_mode]
    infra:
      # Operator-supplied container image running the AutoGPT application.
      image:
        type: string
        description: Container image running the AutoGPT application code.
