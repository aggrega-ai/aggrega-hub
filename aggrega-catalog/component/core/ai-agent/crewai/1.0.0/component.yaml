apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/crewai
  version: 1.0.0
  description: >
    A CrewAI agent, run in-cluster as an application image the Release
    supplies. CrewAI casts each agent as a member of a crew with a stated part
    to play, so what this component exposes is that part — the role the agent
    occupies, the goal it is working toward and the backstory it reasons from
    — together with whether it may hand work to another member and how much of
    its reasoning it narrates. Deploying it gives that agent as a worker wired
    to a model: the component on the `model` socket publishes its endpoint and
    model name, and the Recipe delivers them as the environment an
    OpenAI-compatible client reads, so one image runs against any model in the
    catalog without an endpoint in its code. The catalog supplies no image for
    it — CrewAI is published as a library an application is built around, so
    there is no upstream image to pin — and until a Release sets `infra.image`
    the build halts naming the container image and renders nothing.
    An `inject:` block on the model connection delivers the names the
    application reads, as variables or as files, beside the variables the
    framework and its client read.
    Its Recipes deliver each own value under a default variable name; the
    component's own `inject:` block takes `env` and `file` entries, and one
    reading a value alone replaces that value's default name.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two every Recipe of this component delivers, as none
  # renders a command line. Each env entry reaches the container under the name
  # the developer gives it and each file entry at the path it gives. An entry
  # reading one of the agent's own values alone replaces that value's default
  # name, the CREWAI_* variable the Recipes otherwise deliver it under; an entry
  # reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  # The model reference is a compiler-wired edge for this agent: the model's
  # published endpoint flows into the synthesized application container. The
  # socket, not the documented `models` name-list, is what the selector gate
  # enforces.
  #
  # The image is the Release's own code, so every socket admits an inject block,
  # of env entries and of file entries, which every Recipe of this component
  # writes as files at the absolute paths the connection names. A connection
  # writing one receives the names it dictates in place of the variables the
  # Recipes derive from its target's published values, which are defaults; a
  # variable the framework or its client reads by itself, and what an attachment
  # on the connection delivers, stay.
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    #
    # The Recipes deliver the endpoint as OPENAI_BASE_URL, which the
    # OpenAI-compatible client SDK reads, the model name as MODEL, which CrewAI
    # reads by itself, and an attached credential as OPENAI_API_KEY, so none is
    # a default: an inject block on the connection, of env or file entries,
    # delivers the names it dictates beside them.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the agent presents to the model this connection reaches. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        role: { type: string }
        goal: { type: string }
        backstory: { type: string }
        allow_delegation: { type: boolean, default: false }
        log_level:
          type: string
          enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
          default: DEBUG
          description: Log verbosity the agent emits. At DEBUG the agent narrates each step of its reasoning as it works; INFO and above report progress and problems only.
      required: [role, goal, backstory, allow_delegation, log_level]
    infra:
      # Operator-supplied container image running the CrewAI application.
      image:
        type: string
        description: Container image running the CrewAI application code.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
