apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/dify-worker-beat
  version: 1.0.0
  # metadata.license is deliberately absent. This service runs the Dify API
  # image, published under a modified Apache License 2.0 carrying additional
  # conditions that no single SPDX identifier names. The licensing class is
  # stated on the component.aggrega.ai/upstream-licensing label instead.
  description: >
    The Dify task scheduler — the Celery beat process that puts the platform's
    periodic work on the queue at its due time: dataset re-indexing sweeps,
    expired-file and orphaned-document cleanup, workspace usage rollups, and
    scheduled application runs. It reads the schedule from the platform's
    relational model in the PostgreSQL backend wired through the `backend`
    uses-socket and enqueues onto the Redis-compatible broker wired through
    `cache`, where the task worker picks the work up; it never runs a task
    itself. Exactly one instance runs — two schedulers on one queue would
    enqueue every periodic task twice — so it renders as a single-replica
    stateless worker. It serves no port and nothing connects to it, so it
    publishes no provides contract.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    # Every Recipe of this component runs the scheduler as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform's source is published under terms that are not OSI-approved:
    # a modified Apache License 2.0 whose additional conditions attach to
    # operating a multi-tenant environment and to altering the front end's
    # branding. Any reader may obtain and run the pinned image on those terms.
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The PostgreSQL backend the scheduler reads the periodic-task schedule
    # from.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
    # The Redis-compatible cache the scheduler enqueues onto.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # Redis logical-database indices this connection uses. They match the
        # worker's indices on the same cache, because the scheduler enqueues
        # what the worker consumes.
        db_index:
          type: integer
          min: 0
          max: 15
          default: 0
          description: Redis logical-database index the application cache uses on this connection.
        broker_db_index:
          type: integer
          min: 0
          max: 15
          default: 1
          description: Redis logical-database index the Celery broker uses on this connection.

  featuresSchema:
    # Optional backend-password credential slot, shared with the backend and the
    # API server. When attached, supplies the PostgreSQL password via the
    # credential subsystem; when unattached, the Recipe falls back to its inline
    # development default.
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential shared with the backend. When attached, supplies the backend password via the credential subsystem; unattached, the Recipe uses its inline development default."

  schema:
    # The scheduler reads no developer values: what it enqueues and when is
    # fixed by the platform, and the schedule itself lives in the backend.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "1.17.0"
        description: Dify API container image tag. The API server, the task worker and this scheduler run the same image, so a Release moves all three together.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the scheduler emits.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 256Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
