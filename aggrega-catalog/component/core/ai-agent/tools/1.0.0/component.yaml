apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/tools
  version: 1.0.0
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  usesSchema:
    tools:
      selector: "component.aggrega.ai/category=ai-tool"
      required: true
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        system_prompt: { type: string }
        max_iterations: { type: integer, default: 15 }
        agents_allowed: { type: array, maxItems: 0 }
      required: [system_prompt, max_iterations]
