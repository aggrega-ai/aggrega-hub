apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/agenta-migrations
  version: 1.0.0
  # metadata.license is deliberately absent, for the reason stated on
  # core/ai-agent/agenta-api: the platform is published open-core, no single
  # SPDX identifier covers it, and the class is carried on the
  # component.aggrega.ai/upstream-licensing label below while the licence of the
  # pinned artifact is named on this component's Recipe.
  description: >
    The schema-migration step of an agent workspace — the run that creates and
    updates the platform's tables. It applies the migration history the platform
    ships to both of its databases: the one holding the platform's own model,
    and the one holding traces.

    It runs to completion and exits, which is what makes it a different
    operational shape from every other tier of this platform. It reaches the
    relational backend through the `backend` socket, using the two database
    names given on that edge, and it declares nothing else: the run reads no
    cache, takes no queue work, writes no files, and authenticates no user, so
    giving it a cache, queue, object-store or authentication socket would be
    declaring a dependency it does not have.

    Wire this in because the platform's services do not create
    their own tables. Without this run the databases stay empty and every
    service starts, connects, and then fails on its first query — a failure that
    reads as a broken installation rather than as a missing step, which is why the
    step is a declared component rather than something a reader is expected to
    remember.

    It serves no port and nothing connects to it, so it publishes no provides
    contract. Because it exits, an Aggregate sequences it ahead of the services
    that need the schema; it is written to be safe to run again, so re-running it
    on an already-migrated database applies nothing and succeeds.

    Realized on Kubernetes via its Helm Recipe, which synthesizes the step as a
    run-to-completion workload rather than a Deployment, running the platform
    image under its migration entry point.
  labels:
    component.aggrega.ai/type: task
    component.aggrega.ai/category: ai-agent
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  inject: [env]

  usesSchema:
    # The only socket this component declares. Same contract as on
    # core/ai-agent/agenta-api, and the two database names must match that
    # service's, because these are the databases it is about to migrate.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        core_database:
          type: string
          default: agenta_core
          description: Database on the wired backend the platform's own schema is applied to. It names the same database the control-plane API reads.
        tracing_database:
          type: string
          default: agenta_tracing
          description: Database on the same backend the tracing schema is applied to. It names the same database the stream-consuming worker writes into.
        # A statement about this connection's target, authored on the
        # connection: the relational backend it reaches takes no credential. It
        # changes nothing this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the relational backend this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # To replace the Recipe's development default, attach core/random-password
      # on the connection: the cluster generates it, and the backend takes the
      # same credential by core/referenced-secret.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Password the run authenticates to the relational backend this connection reaches with, delivered as an env secret reference and substituted into the connection URL at run time. The same credential is attached to the control-plane API's backend connection, because both reach the same server. Unattached, the Recipe emits the development literal `apppass`, the default the standard-library relational Recipes leave in place; this catalog publishes it, so every Release that leaves the slot unattached shares that password."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      apply_on_start:
        type: boolean
        default: true
        description: Apply any migration the databases are behind on. Turned off, the run reports what it would apply and changes nothing, which is how an installation that migrates its databases by another route keeps this step in place without it acting.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "v0.114.1"
        description: Platform API container image tag. The migration history is shipped inside this image, so it is the same tag the services run and a Release moves them together.
      log_level:
        type: string
        enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        default: INFO
        description: Log verbosity the run emits.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "backend" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
