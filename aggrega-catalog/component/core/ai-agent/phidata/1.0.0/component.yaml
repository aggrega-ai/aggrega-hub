apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/phidata
  version: 1.0.0
  description: >
    A Phidata agent, run in-cluster as an application image the Release supplies. Phidata separates two kinds of remembering that other frameworks fold together: session storage, which holds the running conversation so a later turn can see an earlier one, and a knowledge base, which holds reference material the agent retrieves from. This component declares both as distinct topology edges — the only agent here that does — and its two values govern whether prior turns are replayed into the prompt and whether replies are formatted as markdown. The Release supplies the image containing the Phidata application. The catalog pins no image, so nothing renders until the Release sets `infra.image`. The variables each connection is delivered under are defaults: an `inject:` block on the connection replaces them with the names the application reads, as variables or as files, and a store connection writing none refuses a store served over TLS alone or over HTTPS, since the application would be handed only its host and port. Neither store connection carries a credential, so a store that requires signing in cannot be reached through one.
    Its Recipes deliver each own value under a default variable name; the
    component's own `inject:` block takes `env` and `file` entries, and one
    reading a value alone replaces that value's default name.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two every Recipe of this component delivers, as none
  # renders a command line. Each env entry reaches the container under the name
  # the developer gives it and each file entry at the path it gives. An entry
  # reading one of the agent's own values alone replaces that value's default
  # name, the PHIDATA_* variable the Recipes otherwise deliver it under; an
  # entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  # Three compiler-wired edges. `model` carries the model endpoint. `storage` is
  # any datastore, because session history is written and read back by key. The
  # `knowledge_base` socket is pinned to the memory-capable engines instead,
  # because reference material is retrieved by similarity — the two sockets are
  # deliberately not interchangeable. The sockets, not the documented `models` /
  # `datastores` name-lists, are what the selector gate enforces.
  #
  # The image is the Release's own code, so the variables the Recipes deliver a
  # connection under are defaults, and every socket admits an inject block that
  # replaces them with the names the application reads: env entries, and file
  # entries, which every Recipe of this component writes as files at the
  # absolute paths the connection names.
  usesSchema:
    # The model the agent calls. The selector admits a model component, or a
    # gateway serving a model API in front of several: both carry
    # model.aggrega.ai/api and publish an endpoint and a model name, so the
    # Recipe reads either the same way. Through a gateway the model name is the
    # one alias the gateway publishes.
    #
    # By default the Recipes deliver the endpoint as OPENAI_BASE_URL, which the
    # OpenAI-compatible client SDK reads, and the model name as OPENAI_MODEL, for
    # the application's own code. An inject block on the connection, of env or
    # file entries, replaces OPENAI_MODEL with the names it dictates;
    # OPENAI_BASE_URL stays, and so does OPENAI_API_KEY from an attached
    # credential.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the agent presents to the model this connection reaches. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
    # Any datastore holding the agent's session history. By default the Recipes
    # deliver its host and port as PHIDATA_STORAGE_HOST and PHIDATA_STORAGE_PORT.
    # Handed only those, the application's own code could not tell that a store
    # requires TLS, so on a connection writing no inject block a store served
    # over TLS alone or over HTTPS — publishing a protocol ending in -tls, such
    # as valkey-tls, or publishing https — halts the build, naming the
    # connection. An inject block on the connection, of env or file entries,
    # replaces both variables with the names it dictates, so it can deliver the
    # store's protocol too, and such a connection is not refused. The socket
    # declares no credential slot, so a store that requires signing in, such as
    # OpenSearch with its security plugin, self-hosted or managed, cannot be
    # signed in to through it.
    storage:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env, file]
    # The vector, semantic-memory or search store holding the reference material
    # the agent retrieves. By default the Recipes deliver its host and port as
    # PHIDATA_KNOWLEDGE_BASE_HOST and PHIDATA_KNOWLEDGE_BASE_PORT, and on a
    # connection writing no inject block a store served over TLS alone or over
    # HTTPS halts the build, naming the connection, for the same reason as on
    # `storage`. An inject block on the connection, of env or file entries,
    # replaces both variables with the names it dictates, and such a connection
    # is not refused. The socket declares no credential slot, so a store that
    # requires signing in, such as OpenSearch with its security plugin,
    # self-hosted or managed, cannot be signed in to through it.
    knowledge_base:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
      inject: [env, file]
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        add_history_to_messages: { type: boolean, default: true }
        markdown: { type: boolean, default: true }
      required: [add_history_to_messages, markdown]
    infra:
      # Operator-supplied container image running the Phidata application.
      image:
        type: string
        description: Container image running the Phidata application code.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
