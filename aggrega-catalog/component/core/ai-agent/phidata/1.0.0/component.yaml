apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/phidata
  version: 1.0.0
  description: >
    A Phidata agent, run in-cluster as an application image the Release supplies. Phidata separates two kinds of remembering that other frameworks fold together: session storage, which holds the running conversation so a later turn can see an earlier one, and a knowledge base, which holds reference material the agent retrieves from. This component declares both as distinct topology edges — the only agent here that does — and its two values govern whether prior turns are replayed into the prompt and whether replies are formatted as markdown. The Release supplies the image containing the Phidata application.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Three compiler-wired edges. `model` carries the model endpoint. `storage` is
  # any datastore, because session history is written and read back by key. The
  # `knowledge_base` socket is pinned to the memory-capable engines instead,
  # because reference material is retrieved by similarity — the two sockets are
  # deliberately not interchangeable. The sockets, not the documented `models` /
  # `datastores` name-lists, are what the selector gate enforces.
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
    storage:
      selector: "component.aggrega.ai/category=datastore"
    knowledge_base:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory)"
  # Optional model API-key credential, referenced at the consumer's scope, so
  # applications may share one key or hold per-application keys. Optional (bare
  # deployments run against a no-auth endpoint or supply the key out of band);
  # transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        add_history_to_messages: { type: boolean, default: true }
        markdown: { type: boolean, default: true }
      required: [add_history_to_messages, markdown]
    infra:
      # Operator-supplied container image running the Phidata application.
      image:
        type: string
        description: Container image running the Phidata application code.
