apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/librechat
  version: 1.0.0
  license: MIT
  description: >
    A self-hosted LibreChat installation — the browser platform a person holds
    conversations in, and the tier that turns a bare model endpoint into a
    working assistant surface. It reaches its model through the `model`
    uses-socket and adds agents an author assembles without writing code, tool
    invocation over the tool servers an administrator registers, a code
    interpreter, and retrieval over files a user uploads. Every agent run, a
    delegated child run included, is entered from a conversation a person
    started: the platform runs no background loop of its own.

    Its accounts, conversations, agents and stored per-user credentials live in
    a document store wired through the `backend` socket, the system of record;
    only uploaded files sit on a volume of its own.

    The two token-signing secrets and the credential-encryption pair decide what
    its sign-ins and stored credentials are worth, and each has a slot of its
    own. None of the four has a default, and the build halts until each slot
    is filled.

    On Kubernetes, reach for `librechat-chart`, rendering the project's own
    chart, where a chart repository is reachable at build time, and for
    `librechat`, the workload synthesis, where the build must fetch nothing.

    With `values.metrics_enabled` true each Recipe turns on the platform's
    Prometheus metrics, at /metrics on its port and answered only to a bearer
    token equal to the secret attached to metrics_secret, and publishes the
    address as `metrics_endpoint`; a scrape presents that secret on its
    connection's `credential` slot.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # The cognitive loop is real — the platform dispatches tool calls, retrieval
    # and delegated child agent runs while answering — and it is always entered
    # by a person rather than by a schedule or a background worker, which is what
    # this value records. An agent may delegate part of its work to a child run
    # holding its own context, and every such run is entered from a
    # conversation a person started.
    agent.aggrega.ai/autonomy: copilot
    # Every Recipe of this component runs the platform as containers in the
    # Release's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform is published under the MIT licence, which metadata.license
    # names exactly; this label carries the class that licence falls into.
    component.aggrega.ai/upstream-licensing: osi-approved
  annotations:
    # How the platform's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. LibreChat answers its metrics
    # only to a bearer token equal to the secret attached to metrics_secret, a
    # secret set for the metrics alone, so a scrape presents that secret.
    observability.aggrega.ai/metrics-credential: separate-token
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The model the platform calls. The selected component's published endpoint
    # and model name arrive on this edge; each Recipe writes the endpoint into
    # the variable the platform reads for an OpenAI-compatible base URL, and the
    # model name into the list of models it offers. So changing which model
    # answers is a change of edge target rather than a change of this
    # component.
    #
    # Around that call it adds agents an author assembles without writing code,
    # tool invocation over the tool servers an administrator registers, a code
    # interpreter, and retrieval over files a user uploads — which is why it is
    # an agent platform rather than a view onto a model.
    #
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the platform presents to the model this connection reaches. Unattached, the Recipe leaves the platform in its per-user mode, where each person enters their own key in the interface and no key is rendered at all."
    # The document store holding accounts, conversations, agents and stored
    # per-user credentials. The selected component's provides host and port
    # arrive on this edge and each Recipe composes them into the platform's
    # connection string. The wired component must answer on the document-store
    # wire protocol the platform speaks; the selector matches the category, and
    # the compiler routes the resulting strings without checking what answers at
    # the other end, so choosing a store that speaks a different protocol is a
    # decision to get right.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      required: true

  # Four values decide what its sign-ins and its stored credentials are worth —
  # the two token-signing secrets and the credential-encryption pair — and each
  # of the four carries a slot of its own below. All four are required and
  # have no default, because a key every reader of this catalog holds would
  # let anyone mint the tokens the platform accepts, or make the stored
  # credentials readable to anyone with a copy of the store, and a vector
  # published here would be the same in every Release. Blanking a variable
  # instead, so the platform generates one for itself, is a bootstrap
  # convenience rather than a credential-rotation system, because the
  # generated value does not survive a restart and a second replica generates
  # a different one.
  featuresSchema:
    # Required session-signing secret, with no default. The platform signs the
    # access tokens it issues with this value.
    session_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required secret the platform signs its access tokens with. There is no default: the build halts when nothing fills this slot. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change invalidates every session then active."
    # Required refresh-token secret, with no default. The refresh tokens signed
    # under this value are what mint new access tokens, so it carries the
    # weight of the access-token secret.
    session_refresh_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required secret the platform signs its refresh tokens with — the tokens a browser presents to mint a new access token, so it carries the weight of the access-token secret. There is no default: the build halts when nothing fills this slot. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change makes every person sign in again."
    # Required credential-encryption key, with no default. The platform encrypts
    # the credentials it holds in the document store under this value. It
    # encrypts the credentials it supports whether or not the people using the
    # installation ever save one of their own, so a centrally supplied model key
    # does not make this slot unnecessary.
    credential_encryption_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required key the platform encrypts the credentials it stores in the document store under, as 64 hexadecimal characters (a 32-byte key). It encrypts the credentials it supports whether or not the people using the installation ever save one of their own, so this slot is filled even where the model key is supplied centrally. There is no default: the build halts when nothing fills this slot. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change leaves everything already stored undecryptable."
    # Required initialization vector, paired with the key above, with no
    # default. A vector is not secret by cryptographic design, but one published
    # in this catalog would be the same in every Release rendered from it, so
    # each Release attaches its own alongside the key.
    credential_encryption_iv:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required initialization vector the platform pairs with the credential-encryption key when it encrypts what it stores, as 32 hexadecimal characters (16 bytes). A vector is not secret by cryptographic design, but one every reader of this catalog held would be the same in every Release, so there is no default: the build halts when nothing fills this slot. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change leaves everything already stored undecryptable."
    # Optional secret the platform answers its Prometheus metrics to. LibreChat
    # serves /metrics on its own port and answers it only to a bearer token
    # equal to METRICS_SECRET; with that variable unset it collects no metrics
    # and answers the route 401. The Recipe delivers the attached secret as
    # METRICS_SECRET, by reference, only while values.metrics_enabled is true,
    # and halts the build when the value is true and nothing fills this slot;
    # there is no default. It is a secret of its own rather than one of the
    # four above, so a scraper holds nothing that signs a token or decrypts a
    # stored credential.
    metrics_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional secret the platform answers its Prometheus metrics to: a scrape presents it as a bearer token, on its connection's credential slot. It is delivered as METRICS_SECRET only while values.metrics_enabled is true, and is required then: the build halts when the value is true and nothing fills this slot. There is no default. While the value is false it is not delivered, and the platform answers its metrics route 401 to every caller."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        app_title:
          type: string
          default: "LibreChat"
          description: Name the platform presents in the browser title and the interface header. Two installations reachable by the same people tell themselves apart by carrying different titles.
        database_name:
          type: string
          default: "LibreChat"
          description: Name of the logical database the platform uses inside the wired document store. Two installations sharing one store keep their data apart by carrying different names.
        allow_registration:
          type: boolean
          default: false
          description: Whether a visitor who is not yet a user may create an account from the sign-in page. Left off, accounts are created only by an administrator, which is the posture an installation reachable beyond its own team wants.
        # The platform's own metrics, in the Prometheus format. LibreChat serves
        # /metrics on its own port and answers it only to a bearer token equal
        # to METRICS_SECRET, collecting nothing while that variable is unset.
        # While this value is true the Recipe delivers the secret attached to
        # metrics_secret as that variable, which turns the metrics on, and
        # publishes their address; the build halts when the value is true and
        # nothing fills that slot. While false nothing is delivered and the
        # address is unpublished. The metrics carry the process's own figures
        # (CPU, memory, event loop); request counts, latencies and body sizes
        # by method, route and status, with every conversation, message, file,
        # agent and share identifier in a route replaced by a placeholder;
        # event-stream and upload counts; document-store query counts by
        # collection and operation; and generation-job counts. No user or
        # conversation identifier and no content reaches them.
        metrics_enabled:
          type: boolean
          default: false
          description: Turns on LibreChat's own metrics, in the Prometheus format, at /metrics on the platform's port, and publishes their address as `metrics_endpoint`; while false that key is empty. The platform answers them only to the secret attached to metrics_secret, presented as a bearer token, so the build halts when this is true and that slot is unfilled. They carry request counts and timings, never a user's or conversation's identifier or content.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3080
        description: Listen port the platform serves its interface and API on, and the port consumers connect to. Most operators should omit this and let the Recipe assign the default (3080).
      engine_version:
        type: string
        default: "v0.8.7"
        description: LibreChat container image tag. Selects the image tag of the platform container on both Recipes.
      # Selects the version of the platform's own Helm chart the chart-backed
      # Recipe pulls; the workload-synthesis Recipe pulls no chart and reads
      # nothing here. Changing it away from that Recipe's default does not
      # guarantee value-mapping compatibility with the other chart version.
      source_version:
        type: string
        description: Version of the platform's own Helm chart the chart-backed Recipe pulls, defaulting to the version that Recipe was checked against. The workload-synthesis Recipe pulls no chart and reads nothing here.
      storage:
        size:
          type: string
          default: "2Gi"
          description: Size of the persistent volume holding the files people upload. The accounts, conversations and agents live in the wired document store rather than here, so this size covers uploads alone.
      external_base_url:
        type: string
        default: ""
        description: Externally reachable base URL of the installation, as a browser sees it — the address the ingress tier publishes. The platform composes the links it emits from it and accepts browser requests against it. Left empty, the Recipe supplies the installation's own in-cluster address instead, which suits an installation reached only in-cluster.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # It serves the chat interface, the agent builder and the administration
      # surface from one process, behind the address published here: its host,
      # port and protocol, which is how an ingress tier publishes it.
      host:
        type: string
        required: true
        description: In-cluster DNS name of the Service serving the chat interface and its API. The ingress tier points its upstream at this name.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service serves the interface and API on. It follows
          the port an operator set in the Release, so a consumer reads it
          rather than assuming a default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a consumer composes its base URL on.
      # The address a Prometheus server scrapes the platform's own metrics at,
      # while values.metrics_enabled is true: /metrics on the port the platform
      # serves its interface on, under the name the Recipe serves it under.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:<port>/metrics`, on the
          port the interface is served on. Empty while values.metrics_enabled
          is false.
      # Whether a scrape of metrics_endpoint presents a credential: true while
      # values.metrics_enabled is true, since the platform answers its metrics
      # only to the secret attached to metrics_secret; false while it is false,
      # when no address is published.
      metrics_credential_required:
        type: boolean
        description: >
          Whether a scrape of `metrics_endpoint` must present a credential:
          true while values.metrics_enabled is true, because the platform
          answers its metrics only to the secret attached to metrics_secret,
          which a scrape presents on its connection's `credential` slot; false
          while no address is published.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "model" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
