apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/librechat
  version: 1.0.0
  license: MIT
  description: >
    A self-hosted LibreChat installation — the browser platform a person holds
    conversations in, and the tier that turns a bare model endpoint into a
    working assistant surface. It serves the chat interface, the agent builder
    and the administration surface from one process. Reaches the model it talks
    to through the `model` uses-socket: the selected component's published
    endpoint and served model name both arrive on that edge, so changing which
    model answers is a change of edge target rather than a change of this
    component. Around that call it adds agents an author assembles without
    writing code, tool invocation over the tool servers an administrator
    registers, a code interpreter, and retrieval over files a user uploads —
    which is why it is an agent platform rather than a view onto a model. An
    agent may delegate part of its work to a child run holding its own context,
    and every such run is entered from a conversation a person started: the
    platform runs no background loop of its own. Keeps its accounts,
    conversations, agents and stored per-user credentials in a document store
    wired through the `backend` socket, which is the system of record, and keeps
    only uploaded files on a volume of its own. Exports its host, port and
    protocol to consumers via the uses topology, which is how an ingress tier
    publishes it. Four values decide what its sign-ins and its stored
    credentials are worth — the two token-signing secrets and the
    credential-encryption pair — and each of the four carries a slot of its own.
    A slot left unattached is rendered with a development
    literal published in this catalog; blanking the variable instead, so the
    platform generates one for itself, is a bootstrap convenience rather than a
    credential-rotation system, because the generated value does not survive a
    restart and a second replica generates a different one.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    # The cognitive loop is real — the platform dispatches tool calls, retrieval
    # and delegated child agent runs while answering — and it is always entered
    # by a person rather than by a schedule or a background worker, which is what
    # this value records.
    agent.aggrega.ai/autonomy: copilot
    # Every Recipe of this component runs the platform as containers in the
    # deployment's own cluster, so a single posture is its identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The platform is published under the MIT licence, which metadata.license
    # names exactly; this label carries the class that licence falls into.
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The model the platform calls. The selected component's published endpoint
    # and model name arrive on this edge; each Recipe writes the endpoint into
    # the variable the platform reads for an OpenAI-compatible base URL, and the
    # model name into the list of models it offers.
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
    # The document store holding accounts, conversations, agents and stored
    # per-user credentials. The selected component's provides host and port
    # arrive on this edge and each Recipe composes them into the platform's
    # connection string. The wired component must answer on the document-store
    # wire protocol the platform speaks; the selector matches the category, and
    # the compiler routes the resulting strings without checking what answers at
    # the other end, so choosing a store that speaks a different protocol is a
    # decision to get right.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      required: true

  featuresSchema:
    # Optional model API-key credential. The platform presents it on every call
    # it makes to the endpoint wired on the `model` socket. Unattached, the
    # Recipe leaves the platform's per-user key entry in place, so each person
    # supplies their own key in the interface.
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential the platform presents to the endpoint wired on the model socket. Unattached, the Recipe leaves the platform in its per-user mode, where each person enters their own key in the interface and no key is rendered into the deployment at all."
    # Optional session-signing secret. The platform signs the access tokens it
    # issues with this value, so a deployment whose sign-ins must survive a
    # restart attaches one; unattached, the Recipe pins a development literal.
    session_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional secret the platform signs its access tokens with. Attach it for any deployment whose sign-ins must stay valid across a restart. Unattached, the Recipe pins a development literal suitable for evaluation only, and every deployment rendered from that default signs its tokens with the same value published in this catalog. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change invalidates every session then active."
    # Optional refresh-token secret. The refresh tokens signed under this value
    # are what mint new access tokens, so it carries the weight of the
    # access-token secret and is attached in the same breath as it; unattached,
    # the Recipe pins a development literal.
    session_refresh_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional secret the platform signs its refresh tokens with — the tokens a browser presents to mint a new access token, which is why this value is attached alongside the access-token secret rather than on its own. Unattached, the Recipe pins a development literal suitable for evaluation only, and every deployment rendered from that default signs its refresh tokens with the same value published in this catalog. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change makes every person sign in again."
    # Optional credential-encryption key. The platform encrypts the credentials
    # it holds in the document store under this value. It encrypts the
    # credentials it supports whether or not the people using the installation
    # ever save one of their own, so a centrally supplied model key does not
    # make this slot unnecessary.
    credential_encryption_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional key the platform encrypts the credentials it stores in the document store under. It encrypts the credentials it supports whether or not the people using the installation ever save one of their own, so this slot is attached even where the model key is supplied centrally. Unattached, the Recipe pins a development literal suitable for evaluation only, which means the stored credentials of every deployment rendered from that default are readable to anyone holding a copy of the store and this catalog. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change leaves everything already stored undecryptable."
    # Optional initialization vector, paired with the key above. Attached
    # together with that key: a published key and a published vector are what
    # make stored credentials readable, and replacing only one of the two
    # leaves the pair as weak as its published half.
    credential_encryption_iv:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional initialization vector the platform pairs with the credential-encryption key when it encrypts what it stores. Attach it together with that key: replacing only one of the two leaves the pair as weak as whichever half stayed published. A vector is not secret by cryptographic design, but one fixed vector published in this catalog means two deployments encrypt the same credential to identical bytes, so a deployment rendered from the default offers no confidentiality for what it stores. Blanking the variable instead, so the platform generates one for itself, is a bootstrap convenience rather than a credential-rotation system: the generated value does not survive a restart and a second replica generates a different one, and each change leaves everything already stored undecryptable."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        app_title:
          type: string
          default: "LibreChat"
          description: Name the platform presents in the browser title and the interface header. Two installations reachable by the same people tell themselves apart by carrying different titles.
        database_name:
          type: string
          default: "LibreChat"
          description: Name of the logical database the platform uses inside the wired document store. Two installations sharing one store keep their data apart by carrying different names.
        allow_registration:
          type: boolean
          default: false
          description: Whether a visitor who is not yet a user may create an account from the sign-in page. Left off, accounts are created only by an administrator, which is the posture an installation reachable beyond its own team wants.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3080
        description: Listen port the platform serves its interface and API on, and the port consumers connect to. Most operators should omit this and let the Recipe assign the default (3080).
      engine_version:
        type: string
        default: "v0.8.7"
        description: LibreChat container image tag. Selects the image tag on the synthesized platform container.
      storage:
        size:
          type: string
          default: "2Gi"
          description: Size of the persistent volume holding the files people upload. The accounts, conversations and agents live in the wired document store rather than here, so this size covers uploads alone.
      external_base_url:
        type: string
        default: ""
        description: Externally reachable base URL of the installation, as a browser sees it — the address the ingress tier publishes. The platform composes the links it emits from it and accepts browser requests against it. Left empty, the Recipe supplies the installation's own in-cluster address instead, which suits an installation reached only in-cluster.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
