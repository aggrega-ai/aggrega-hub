apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/lindy
  version: 1.0.0
  description: >
    A Lindy assistant on Lindy's managed platform, realized as an external reference (no in-cluster compute). The assistant lives in Lindy's service and is addressed by the identifier the developer supplies, together with the task prompt it is asked to carry out and an optional persona override. The realization emits only the wiring a consuming application needs, which is the platform endpoint and the assistant identifier to address a request to it. The endpoint carries no default and is operator-supplied, so a Release states the host it reaches the platform at; it is sourced from infra so an operator may also repoint it at a gateway or proxy. Authentication is the consumer's concern: the realization delivers no key, because the environment-variable name belongs to the consuming application rather than to the endpoint.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        lindy_id: { type: string }
        task_prompt: { type: string }
        persona_override: { type: string }
      required: [lindy_id, task_prompt]
    infra:
      # The endpoint carries no catalog-authored default, so a Release
      # supplies the host it reaches the platform at. It is sourced from infra
      # (not hardcoded in the Recipe) so an operator may also repoint it at a
      # gateway or proxy.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application calls to give the
          assistant a task. The Release supplies it, so an operator may point
          it at a different host without the application changing.
      lindy_id:
        type: string
        required: true
        description: >
          Identifier of the assistant a task is given to, carried through from
          the value the Aggregate declared. An application sends it to address
          this assistant rather than another on the same account.
