apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/autogen
  version: 1.0.0
  description: >
    An AutoGen agent, run in-cluster as the deployment's own application image. AutoGen composes agents that converse with one another to reach a result, and each agent is constructed with a name and a system message that fixes its part in that conversation — which is what this component exposes. The deployment supplies the image containing its AutoGen application; the model the agents talk to is wired as a topology edge rather than configured in code, so the same image runs against any model in the catalog.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The model reference is a compiler-wired edge for this agent: the model's
  # published endpoint flows into the synthesized application container. The
  # socket, not the documented `models` name-list, is what the selector gate
  # enforces.
  usesSchema:
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  # Optional model API-key credential, referenced at the consumer's scope so a
  # deployment chooses whether applications share one key or hold per-application
  # keys. Optional (bare deployments run against a no-auth endpoint or supply the
  # key out of band); transparent (inject: [env]) so a synthesized Workload may
  # reference it as an env secret; secret-kind-pinned but family-agnostic so
  # either a referenceable Secret (helm secretKeyRef) or an inject-value (compose
  # inject pipe) may fill it.
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_name: { type: string }
        system_message: { type: string }
      required: [agent_name, system_message]
    infra:
      # Operator-supplied container image running the AutoGen application.
      image:
        type: string
        description: Container image running the AutoGen application code.
