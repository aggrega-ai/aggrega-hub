apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/langgraph
  version: 1.0.0
  description: >
    A LangGraph agent, run in-cluster as an application image the Release
    supplies. LangGraph models an agent as a graph whose nodes resume from
    persisted state rather than as a single call, which is why a datastore is
    a required topology edge here rather than an option: the store wired into
    `checkpointer_db` contributes its host and port, and is where a run's
    state survives between steps. What this component exposes is the graph
    entrypoint inside the application image and the recursion ceiling that
    stops a graph which is not converging. The catalog supplies no image for
    it — LangGraph is published as a library an application is built around,
    so there is no upstream image to pin — and until a Release sets
    `infra.image` the build halts naming the container image and renders
    nothing.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    checkpointer_db:
      selector: "component.aggrega.ai/category=datastore"
      required: true
    model:
      selector: "component.aggrega.ai/category=ai-model"
      required: true
  featuresSchema:
    model_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model API-key credential delivered to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        graph_entrypoint: { type: string }
        recursion_limit: { type: integer, default: 25 }
      required: [graph_entrypoint, recursion_limit]
    infra:
      image:
        type: string
        description: Container image running the LangGraph application code.
