apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/langgraph
  version: 1.0.0
  description: >
    A LangGraph agent, run in-cluster as an application image the Release
    supplies. LangGraph models an agent as a graph whose nodes resume from
    persisted state rather than as a single call, which is why a datastore is
    a required topology edge here rather than an option: the store wired into
    `checkpointer_db` contributes its host and port, and its user and database
    where it publishes them; a credential attached on that connection
    contributes its password; and the store is where a run's state survives
    between steps. What this component exposes is the graph
    entrypoint inside the application image and the recursion ceiling that
    stops a graph which is not converging. LangGraph is published as a library
    an application is built around, so there is no upstream image to pin: the
    Release supplies its application in `infra.image`. On Kubernetes, until it
    does, the build halts naming the container image; on Docker Compose the
    image defaults to the catalog's own quickstart agent, whose own code reads
    the model's default variables and the store's host and port, and no other.
    The variables each connection is delivered under are defaults: an
    `inject:` block on the connection replaces them with the names the
    application reads, as variables or as files, and a checkpointer connection
    writing none refuses a store served over TLS alone or over HTTPS, since the
    application would be handed its host and port and not its protocol.
    Its Recipes deliver each own value under a default variable name; the
    component's own `inject:` block takes `env` and `file` entries, and one
    reading a value alone replaces that value's default name.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two every Recipe of this component delivers, as none
  # renders a command line. Each env entry reaches the container under the name
  # the developer gives it and each file entry at the path it gives. An entry
  # reading one of the agent's own values alone replaces that value's default
  # name, the LANGGRAPH_GRAPH_ENTRYPOINT variable the Recipes otherwise deliver
  # it under; an entry reading it beside another value, or beside infra,
  # metadata or the component's identity, replaces nothing.
  # LANGGRAPH_DEFAULT_RECURSION_LIMIT is read by the framework itself, so it is
  # no default: it is rendered whatever the block delivers, and an entry under
  # that name halts.
  inject: [env, file]

  # The image is the Release's own code, so the variables the Recipes deliver a
  # connection under are defaults, and every socket admits an inject block that
  # replaces them with the names the application reads: env entries, and file
  # entries, which every Recipe of this component writes as files at the
  # absolute paths the connection names.
  usesSchema:
    # The datastore the checkpointer persists graph state to. By default the
    # Recipes deliver its host and port as LANGGRAPH_CHECKPOINTER_HOST and
    # LANGGRAPH_CHECKPOINTER_PORT, and, where the store publishes them, its user
    # as LANGGRAPH_CHECKPOINTER_USER and its database as
    # LANGGRAPH_CHECKPOINTER_DATABASE: a PostgreSQL store publishes both, and a
    # Valkey store neither, so neither variable is rendered for one. Handed only
    # those, the application's own code could not tell that a store requires
    # TLS, so on a connection writing no inject block a store served over TLS
    # alone or over HTTPS — publishing a protocol ending in -tls, such as
    # valkey-tls, or publishing https — halts the build, naming the connection.
    # An inject block on the connection, of env or file entries, replaces those
    # variables with the names it dictates, so it can deliver the store's
    # protocol too, and such a connection is not refused.
    #
    # The store's password is held on the connection it is presented on, in the
    # credential slot below, and the Recipes deliver it as
    # LANGGRAPH_CHECKPOINTER_PASSWORD whether or not the connection writes an
    # inject block. The store holds a password of its own in a slot of its own
    # Component, and neither end sees the other's attachment, so a store that
    # checks a password is reached with the same credential attached on both
    # ends, both reading one parameter.
    checkpointer_db:
      selector: "component.aggrega.ai/category=datastore"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the store it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Optional, since a store may check no password; transparent (inject:
      # [env]) so a synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional password the agent presents to the store this connection reaches, the same password that store holds in its own credential slot. When attached, the Recipe delivers it to the application as LANGGRAPH_CHECKPOINTER_PASSWORD (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, no password variable is rendered."
    # The model the graph calls. The selector admits a model component, or a
    # gateway serving a model API in front of several: both carry
    # model.aggrega.ai/api and publish an endpoint and a model name, so the
    # Recipe reads either the same way. Through a gateway the model name is the
    # one alias the gateway publishes.
    #
    # By default the Recipes deliver the endpoint as OPENAI_BASE_URL, which the
    # OpenAI-compatible client SDK reads, and the model name as OPENAI_MODEL, for
    # the application's own code. An inject block on the connection, of env or
    # file entries, replaces OPENAI_MODEL with the names it dictates;
    # OPENAI_BASE_URL stays, and so does OPENAI_API_KEY from an attached
    # credential.
    model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
      inject: [env, file]
      # A statement about this connection's target, authored on the connection:
      # the model it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The model API-key credential is held on the connection it is presented
      # on, so each connection names its own fill, and several consumers share
      # one key by reading one parameter or by pointing at one Secret.
      # Optional (a Release runs against a model that checks no key, or
      # supplies the key out of band); transparent (inject: [env]) so a
      # synthesized Workload may reference it as an env secret;
      # secret-kind-pinned but family-agnostic so either a referenceable Secret
      # (helm secretKeyRef) or an inject-value (compose inject pipe) may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the agent presents to the model this connection reaches. When attached, the Recipe delivers it to the application as OPENAI_API_KEY (a Kubernetes secretKeyRef on helm, the inject pipe on compose); unattached, the application runs without an injected key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        graph_entrypoint: { type: string }
        recursion_limit: { type: integer, default: 25 }
      required: [graph_entrypoint, recursion_limit]
    infra:
      image:
        type: string
        description: Container image running the LangGraph application code. The Docker Compose Recipe runs the catalog's quickstart agent when it is unset.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "checkpointer_db" "model" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
