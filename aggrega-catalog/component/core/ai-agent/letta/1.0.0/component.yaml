apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/letta
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and this entity describes a
  # platform its provider operates and offers under a provider agreement rather
  # than an artifact a deployment obtains and runs, so no single identifier
  # expresses the situation. The class it falls into is stated instead through
  # component.aggrega.ai/upstream-licensing below.
  description: >
    A stateful-agent platform reached over Letta's REST API, so an application
    sends a message to an agent Letta hosts and runs, and that agent carries its
    memory forward from one message to the next. The developer names the agent;
    the operator supplies the API base address. Wire here rather than to a
    model: a model answers from the context a caller supplies, an agent
    platform holds that context itself across messages. Consumers read the base
    address and the agent identifier. Realized by reference: no compute runs here.
  labels:
    # A platform the deployment calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    # The class describes the hosted platform this entity addresses, which is
    # what a deployment calls. Its terms are the provider's rather than an
    # artifact's, because this entity names no artifact for a deployment to
    # obtain.
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The platform's own API reference presents one authentication scheme: an
  # account-scoped API key sent in the Authorization header as a bearer token on
  # every request. That is one piece of secret material, so one slot. The slot
  # is secret-kind-pinned but family-agnostic, so either a referenceable
  # credential or an inject-value credential may fill it per target.
  #
  # The slot is not required here, because whether a realization can carry the
  # credential depends on the target: the helm Recipe requires it and halts
  # naming it when it is empty — this entity provisions nothing, so with no
  # credential there is nothing it can reach and no value to fall back to — while
  # the compose Recipe defines no service, refuses a filled slot, and leaves the
  # credential to the component that calls the platform.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The account-scoped API key presented as a bearer token in the Authorization header on every request to the platform; it is obtained from the platform's own web console and there is no default.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The agent identifier is a value rather than a label because nothing
        # selects on it: it names which agent this wiring addresses, and the
        # Aggregate sets it. It is the coordinate the platform's message
        # endpoint takes in its own path. Published to consumers below so an
        # application reads it from one place instead of restating it.
        agent_id:
          type: string
          description: The identifier of the agent a message is sent to, as the platform's own console and API report it.
      required: [agent_id]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the platform's documented public host, so
      # taking the default needs no operator input. It is sourced from infra
      # rather than fixed in a Recipe so an operator may repoint it at
      # a proxy the deployment routes egress through. A deterministic pointer
      # string the runtime resolves; the compiler never contacts it.
      endpoint: { type: string, default: "https://api.letta.com" }

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # platform itself, so it reads both from one place rather than each of its own
    # containers carrying a copy: where to call, and which agent to address. The
    # model an agent answers with is not here — this platform holds that with the
    # agent, and an application that wants a different one names it per message
    # rather than reading it from configuration. The credential is not
    # published and is not carried across the edge — on Kubernetes a credential
    # attached to the slot above is materialized in the Release, and the
    # consuming application references the material under the name it was given;
    # on Compose it is attached to the consuming component itself.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application sends messages to. The
          Release supplies it, so an operator may point it at a different host
          without the application changing.
      agent_id:
        type: string
        required: true
        description: >
          Identifier of the agent a message is sent to, carried through from
          the value the Aggregate declared. Addressing the same agent is what
          makes the conversation carry its memory forward.
