apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-agent/supervisor
  version: 1.0.0
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        system_prompt: { type: string }
        routing_mode: { type: string, enum: [fast, quality], default: fast }
        agents_allowed:
          type: array
          items: { type: string, x-aggrega-selector: "component.aggrega.ai/category=ai-agent" }
          minItems: 1
        tools_allowed: { type: array, maxItems: 0 }
      required: [system_prompt, routing_mode, agents_allowed]
