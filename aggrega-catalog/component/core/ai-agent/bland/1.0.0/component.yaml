apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-agent/bland
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # what this entity addresses is a platform its provider operates, offered
  # under a provider agreement rather than published under a single licence, so
  # no one identifier expresses the situation. The class it falls into is stated
  # instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A voice-agent platform reached over Bland's REST API, so an application places
    a spoken call that a conversational pathway Bland hosts and runs conducts. The
    developer names the pathway and, optionally, the version to run instead of the
    one the platform marks as production; the operator supplies the API base
    address. Wire here rather than to a carrier: a carrier moves the call, an
    agent platform conducts the conversation, and many Releases want both.
    Consumers read the base address, the pathway identifier and the version.
    Realized by reference: no compute runs here.
  labels:
    # A platform the Release calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # This platform's own documentation states that a call request carries the API
  # key in the authorization header directly, with no bearer prefix, and that an
  # account placing calls through telephony it brings itself carries a second,
  # separate key in its own header. So two slots, and the second is optional
  # everywhere because an account using the platform's own telephony never sends
  # it. Both slots are secret-kind-pinned but family-agnostic, so either a
  # referenceable credential or an inject-value credential may fill them per
  # target.
  #
  # The API key slot is not required here either, because whether a realization
  # can carry the credential depends on the target: the helm Recipe requires it
  # and halts naming it when it is empty, while the compose Recipe defines no
  # service, refuses a filled slot, and leaves the credential to the component
  # that calls the platform.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The API key presented in the authorization header, without a bearer prefix, on every request to the platform.
    byo_telephony_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The separate key an account sending calls through telephony it supplies itself presents alongside the API key; unattached, the platform's own telephony is used and no such key is sent.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        # The pathway identifier is a value rather than a label because nothing
        # selects on it: it names which configured pathway this wiring addresses,
        # and the Aggregate sets it. Published to consumers below so an application
        # reads it from one place instead of restating it.
        pathway_id:
          type: string
          description: The identifier of the conversational pathway a call runs, as the platform's dashboard reports it.
        # This platform numbers a pathway's versions, and marks one of them as its
        # production version, so the key is an integer and the catalog states no
        # default: unset, the platform uses the version it marks as production.
        pathway_version:
          type: integer
          description: The numbered pathway version a call runs; unset, the platform uses the version it marks as its production one.
      required: [pathway_id]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the platform's documented public host, so
      # taking the default needs no operator input. It is sourced from infra
      # rather than fixed in a Recipe so an operator may repoint it at
      # a proxy the Release routes egress through, or at an address the
      # provider gives an account running the platform in its own boundary. A
      # deterministic pointer string the runtime resolves; the compiler never
      # contacts it.
      endpoint: { type: string, default: "https://api.bland.ai" }

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # platform itself, so it reads all three from one place rather than each of its
    # own containers carrying a copy: where to call, which pathway to run, and
    # which version to run it at. The destination number is not here — this
    # platform takes it per call from the application rather than from
    # configuration. Credentials are not published and are not carried across the
    # edge — on Kubernetes a credential attached to a slot above is materialized
    # in the Release, and the consuming application references the material
    # under the name it was given; on Compose it is attached to the consuming
    # component itself.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the platform's API an application calls to place a
          spoken call. The Release supplies it, so an operator may point it at
          a different host without the application changing.
      pathway_id:
        type: string
        required: true
        description: >
          Identifier of the conversational pathway the platform runs on a
          call, carried through from the value the Aggregate declared. An
          application sends it to say which conversation is to be held.
      pathway_version:
        type: integer
        description: >
          Version of that pathway to run instead of the one the platform marks
          as production. It is absent unless the Aggregate pinned one, so an
          application sends it only when it is set.
