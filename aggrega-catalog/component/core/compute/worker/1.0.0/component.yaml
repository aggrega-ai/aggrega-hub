apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/worker
  version: 1.0.0
  description: >
    A generic background-worker primitive. Its operational type is `worker` —
    long-running, stateless compute that pulls from queues or runs background
    loops with zero inbound application ports — and it adds two optional
    integer fields, `queue_depth_hint` and `concurrency`, to the shared base
    schema's documentation knobs. An Aggregate declares this for a component
    that consumes work rather than accepting inbound application traffic,
    which is what `server` is for. Declaring no `provides`, it publishes
    nothing across an edge: an Aggregate author receives a fixed operational
    shape, with the physical form left to the Ops Recipe layer.

    On a Kubernetes cluster it is realized as a Deployment and nothing else.
    In an AWS account with an ECS cluster and a VPC, terraform/worker-ecs and
    cloudformation/worker-ecs run it as an Amazon ECS service on Fargate. In a
    Google Cloud project with a VPC network, terraform/worker-cloud-run runs it
    as a Cloud Run worker pool. No realization emits a Service, load balancer
    or container port. The catalog pins no image, so nothing renders until the
    Release sets `infra.image`.

    The image is the Release's own code, so an edge from this component
    delivers what its `inject:` block dictates: `env` entries become variables
    on every realization, beside the two developer values' names, which no edge
    may dictate; `file` entries read-only files on Kubernetes only; and `arg`
    or any other mechanism is refused by name, as no realization renders a
    command line. A `core/secret-value` attachment's value is written into the
    rendered workload in the clear on every realization; a secret that must
    stay out of rendered output takes `core/referenced-secret` or
    `core/random-password`.
  # The Kubernetes realization needs no cluster control plane beyond Kubernetes
  # itself. The Amazon ECS realizations run the service in the cluster, subnets
  # and security groups the Release names under infra.overrides, and the Cloud
  # Run realization runs the worker pool in the project, region, VPC network
  # and service account it names there. Emitting no
  # Service, load balancer or container port is how the zero inbound
  # application ports the type promises reach the emitted output rather than
  # staying a claim in the description.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        queue_depth_hint: { type: integer, min: 0 }
        concurrency: { type: integer, min: 1 }

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this. No port key
    # appears here, and its absence is the point: a worker accepts no inbound
    # application traffic, so there is no port for an operator to set.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image running the worker loop.
      replicas:
        type: integer
        min: 1
        default: 1
        description: >
          Replica count, the number of tasks on Amazon ECS and of instances in
          a Cloud Run worker pool. Each replica pulls its own work, so raising
          it widens throughput rather than sharing one queue position.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least, and Cloud Run the worker
            pool at the smallest size meeting both, 1 vCPU and 512 MiB at
            least.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size, and Cloud Run to a worker pool
            size.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the service
          runs under, each under its target's own spelling (subnet_ids on
          terraform, Subnets on CloudFormation), the Cloud Run realization
          the project, region, VPC network and service account the worker
          pool runs in, and the Kubernetes realization reads none of its
          keys.
