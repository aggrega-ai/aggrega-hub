apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/worker
  version: 1.0.0
  description: >
    A generic background-worker primitive. Its operational type is `worker` —
    long-running, stateless compute that pulls from queues or runs background
    loops with zero inbound application ports — and it adds two optional
    integer fields, `queue_depth_hint` and `concurrency`, to the shared base
    schema's documentation knobs. An Aggregate declares this for a component
    that consumes work rather than accepting inbound application traffic,
    which is what `server` is for. Declaring no `provides`, it publishes
    nothing across an edge.

    On a Kubernetes cluster it is a Deployment. In an AWS account with an ECS
    cluster and a VPC, terraform/worker-ecs and cloudformation/worker-ecs run
    it as an Amazon ECS service on Fargate. In a Google Cloud project with a
    VPC network, terraform/worker-cloud-run runs it as a Cloud Run worker pool;
    in an Azure subscription with a Container Apps environment,
    terraform/worker-container-apps as a container app with no ingress. The
    catalog pins no image, so nothing renders until the Release sets
    `infra.image`.

    The image is the Release's own code, so an edge from this component
    delivers what its `inject:` block dictates: `env` entries become variables
    everywhere, beside both values' default names, which the
    component's own `env` entries may replace and, while each is the default,
    no edge may dictate; `file` entries files on Kubernetes and Container Apps
    alone; and `arg` or any other mechanism is refused by name, as no
    realization renders a command line. A `core/secret-value` attachment's
    value is rendered in the clear on every realization; no
    realization delivers `core/referenced-secret` or `core/random-password` to
    it, and the helm realization refuses either by name.
  # An Aggregate author receives a fixed operational shape, with the physical
  # form left to the Ops Recipe layer.
  #
  # The Kubernetes realization needs no cluster control plane beyond Kubernetes
  # itself. The Amazon ECS realizations run the service in the cluster, subnets
  # and security groups the Release names under infra.overrides, the Cloud Run
  # realization runs the worker pool in the project, region, VPC network and
  # service account it names there, and the Container Apps realization runs the
  # app in the Container Apps environment and resource group it names there.
  # No realization emits a Service, load balancer or container port. Emitting
  # none, and declaring no ingress on Container Apps, is how the zero inbound
  # application ports the type promises reach the emitted output rather than
  # staying a claim in the description.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env alone, the one every realization delivers, since the Amazon ECS and
  # Cloud Run ones write no file and none renders a command line. Each env entry
  # reaches the container under the name the developer gives it, and an entry
  # reading `concurrency` or `queue_depth_hint` alone replaces
  # WORKER_CONCURRENCY or WORKER_QUEUE_DEPTH_HINT, that value's default name; an
  # entry reading either beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        queue_depth_hint: { type: integer, min: 0 }
        concurrency: { type: integer, min: 1 }

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this. No port key
    # appears here, and its absence is the point: a worker accepts no inbound
    # application traffic, so there is no port for an operator to set.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image running the worker loop.
      replicas:
        type: integer
        min: 1
        default: 1
        description: >
          Replica count, the number of tasks on Amazon ECS, of instances in a
          Cloud Run worker pool and of replicas on Container Apps, up to 300
          there. Each replica pulls its own work, so raising it widens
          throughput rather than sharing one queue position.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least, Cloud Run the worker pool
            at the smallest size meeting both, 1 vCPU and 512 MiB at least,
            and Container Apps the app at the smallest Consumption size
            meeting both, 0.25 vCPU and 0.5 GiB at least.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size, Cloud Run to a worker pool size,
            and Container Apps to a Consumption size.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the service
          runs under, each under its target's own spelling (subnet_ids on
          terraform, Subnets on CloudFormation), the Cloud Run realization
          the project, region, VPC network and service account the worker
          pool runs in, the Container Apps realization the environment and
          resource group the app runs in and the identities and registry it
          pulls with, and the Kubernetes realization reads none of its keys.
