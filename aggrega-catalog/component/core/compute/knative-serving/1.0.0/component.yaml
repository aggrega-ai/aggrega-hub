apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/knative-serving
  version: 1.0.0
  description: >
    The Knative Serving control plane, declared as an explicit deployment
    component so a scale-to-zero realization ships its runtime prerequisite
    alongside the custom resources it emits. Its controllers reconcile Service,
    Configuration, Revision and Route into Deployments, hold requests for a
    revision at zero replicas, and set replica count from observed concurrency.
    Declaring it in that same deployment is what satisfies the prerequisite. It
    publishes nothing across an edge; it reconciles. Realized on Kubernetes via
    its Helm Recipe, a
    minimal bootstrap installing the four control-plane workloads and neither
    the custom-resource definitions nor the ingress layer.
  license: Apache-2.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      namespace:
        type: string
        default: "knative-serving"
        description: Namespace the control plane is installed into and watches.
      # One image field per control-plane workload: this control plane is four
      # separate binaries rather than one, and each is released independently.
      # The upstream release manifest references these by digest, and the
      # release channel publishes no semantic version tag, so a digest is the
      # only reference form that names one release.
      controller_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/controller@sha256:ca5062ece0329d002a81940cf4268d7898866434d70049bb93f27d3a786d3292"
        description: >
          Image the controller Deployment runs. The controller reconciles the
          Serving custom resources into Deployments and serverless services.
      webhook_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/webhook@sha256:3846e9a416665c5b9ec2e4de246cfcb5c4ab0d01ba19348aa008caf30144b650"
        description: >
          Image the webhook Deployment runs. The webhook defaults and validates
          the Serving custom resources as they are admitted.
      autoscaler_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/autoscaler@sha256:879da127b23db65d862cafa6b23fb987381d0e44150f0027d44e1f5aee83bde2"
        description: >
          Image the autoscaler Deployment runs. The autoscaler decides each
          revision's replica count, zero included, from reported concurrency.
      activator_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/activator@sha256:e5ab46f3b73fa2e3898fe47f6a3a0c2bd765596f4fb36ceb4c28c35d0a74b2e5"
        description: >
          Image the activator Deployment runs. The activator holds requests
          addressed to a revision at zero replicas and reports the concurrency
          the autoscaler scales on.
      queue_proxy_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/queue@sha256:a3cc71ce80dbc6df8781f15eac2cf3531a4c9815271799afd8776bef9e6aeaf2"
        description: >
          Image the controller stamps into each revision as its request-queue
          sidecar. The sidecar meters concurrency for the autoscaler and queues
          requests beyond the revision's configured limit.
