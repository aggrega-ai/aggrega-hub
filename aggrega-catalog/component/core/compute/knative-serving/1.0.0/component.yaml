apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/knative-serving
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Knative Serving control plane, declared as an explicit
    component so a scale-to-zero realization ships its runtime prerequisite
    alongside the custom resources it emits. Its controllers reconcile Service,
    Configuration, Revision and Route into Deployments, hold requests for a
    revision at zero replicas, and set replica count from observed concurrency.
    Declaring it in that same Aggregate is what satisfies the prerequisite.
    Realized on Kubernetes via its Helm Recipe, a minimal bootstrap installing
    the four control-plane workloads and neither the custom-resource
    definitions nor the ingress layer.

    What it publishes across an edge is where Prometheus finds its own metrics,
    which are off by default. With `values.metrics_enabled` true the Recipe
    switches them on, and each of the four processes serves them in pods of its
    own, on a port no Service carries, so the Recipe publishes the pod label
    selecting all four, the name of their metrics port and the path, for a
    scraper that discovers those pods directly; false, those keys are empty.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      # The control plane's own metrics. Knative Serving serves them only once
      # its observability configuration names a protocol for them, and by
      # default it names none. True has the Recipe write that configuration,
      # the config-observability entry, naming the Prometheus format, so the
      # controller, the webhook, the autoscaler and the activator each serve
      # their metrics at /metrics on port 9090, the container port each names
      # metrics, in plain HTTP with no caller check; that listener serves the
      # metrics and nothing else, and no Service carries it. The setting reaches
      # the control plane alone: the request metrics each revision's sidecar
      # serves are configured by a key of their own, which this value leaves as
      # it is.
      metrics_enabled:
        type: boolean
        default: false
        description: Switches on the control plane's own metrics, in the Prometheus format, and publishes the pod label, the port name and the path a scraper discovers them by; while false those keys are empty. The metrics port checks no caller, so anything that reaches the control plane's pods can read them.
    infra:
      namespace:
        type: string
        default: "knative-serving"
        description: Namespace the control plane is installed into and watches.
      # One image field per control-plane workload: this control plane is four
      # separate binaries rather than one, and each is released independently.
      # The upstream release manifest references these by digest, and the
      # release channel publishes no semantic version tag, so a digest is the
      # only reference form that names one release.
      controller_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/controller@sha256:ca5062ece0329d002a81940cf4268d7898866434d70049bb93f27d3a786d3292"
        description: >
          Image the controller Deployment runs. The controller reconciles the
          Serving custom resources into Deployments and serverless services.
      webhook_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/webhook@sha256:3846e9a416665c5b9ec2e4de246cfcb5c4ab0d01ba19348aa008caf30144b650"
        description: >
          Image the webhook Deployment runs. The webhook defaults and validates
          the Serving custom resources as they are admitted.
      autoscaler_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/autoscaler@sha256:879da127b23db65d862cafa6b23fb987381d0e44150f0027d44e1f5aee83bde2"
        description: >
          Image the autoscaler Deployment runs. The autoscaler decides each
          revision's replica count, zero included, from reported concurrency.
      activator_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/activator@sha256:e5ab46f3b73fa2e3898fe47f6a3a0c2bd765596f4fb36ceb4c28c35d0a74b2e5"
        description: >
          Image the activator Deployment runs. The activator holds requests
          addressed to a revision at zero replicas and reports the concurrency
          the autoscaler scales on.
      queue_proxy_image:
        type: string
        default: "gcr.io/knative-releases/knative.dev/serving/cmd/queue@sha256:a3cc71ce80dbc6df8781f15eac2cf3531a4c9815271799afd8776bef9e6aeaf2"
        description: >
          Image the controller stamps into each revision as its request-queue
          sidecar. The sidecar meters concurrency for the autoscaler and queues
          requests beyond the revision's configured limit.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Where Prometheus finds the control plane's own metrics while
      # values.metrics_enabled is true. The four processes run in pods of their
      # own and no Service carries their metrics port, so a scraper discovers
      # the pods directly: one label, which every control-plane pod carries,
      # selects all four, and they share the port name. While the value is false
      # every key is empty. None of the keys carries a namespace: the control
      # plane runs once per cluster, its pods under that fixed label, in the
      # namespace infra.namespace sets rather than the one a Release annotates,
      # so a scraper looks its pods up by label across the cluster.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching the controller, webhook,
          autoscaler and activator pods, `app.kubernetes.io/name=knative-serving`,
          for a scraper that discovers those pods directly rather than scraping
          one address. Published beside `metrics_pod_port` and `metrics_path`
          while values.metrics_enabled is true; empty otherwise.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `metrics`. Set and empty together with `metrics_pod_selector`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`. Set and empty
          together with `metrics_pod_selector`.
