apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/function
  version: 1.0.0
  description: >
    A generic event-driven compute primitive. Its operational type is
    `function` — event-driven compute that scales to zero — and it adds a
    required `runtime` value to the shared base schema's optional
    `displayName` and `description` knobs. A deployment whose work is
    event-triggered and idles at no capacity declares this rather than
    `server`, which expects inbound application traffic, or `task`, which runs
    once and ends. Declaring no `provides`, it publishes nothing across an
    edge: an Aggregate author receives a fixed operational shape, with the
    physical form left to the Ops Recipe layer. Realized on Kubernetes two
    ways, chosen per deployment in the Manifest: as a Knative Service, whose
    control plane admits an inbound call while the revision runs no replicas
    and sets the replica count from observed concurrency; or as a Deployment
    paired with a KEDA scaling resource, whose control plane sets the replica
    count from the depth of an event source the deployment names. Either
    control plane is a runtime prerequisite the operator affirms in the
    Release, and the build halts while it is unaffirmed.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        runtime: { type: string }
      required: [runtime]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    #
    # Two realizations read this block, and three keys are read by one of them
    # only: `scaler` by the KEDA realization, which needs an event source to
    # scale on, and nothing else does; `port` and `compute` are read by both.
    # Each Recipe's own header states which keys it reads.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The deployment names the one it runs, tag included.
      image:
        type: string
        description: Container image serving the function.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the function's container listens on.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the function occupy no compute
          between the events that invoke it.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the control plane the chosen realization
          needs is installed in the target cluster. The build halts unless this
          is set true, so a custom resource is never emitted as an orphan into
          a cluster that cannot reconcile it.
      scaler:
        type: object
        properties:
          type:
            type: string
            description: >
              Event-source kind the queue-paced realization scales on, named as
              the installed control plane spells it — `kafka`, `rabbitmq`,
              `redis` and so on. Read only by that realization.
          metadata:
            type: object
            additionalProperties: true
            description: >
              Event-source coordinates the chosen scaler kind expects, as
              string keys and values. Which keys a kind reads belongs to the
              installed control-plane version rather than to this catalog, so
              they carry through as authored.
          authentication_ref:
            type: string
            description: >
              Name of an existing trigger-authentication resource in the target
              namespace, for an event source that requires credentials to read
              its depth. Supplied whole by the deployment and carried through
              without being resolved; omit it for an event source that needs
              none.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
