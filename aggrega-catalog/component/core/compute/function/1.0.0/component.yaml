apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/function
  version: 1.0.0
  description: >
    A generic event-driven compute primitive. Its operational type is
    `function` — event-driven compute that scales to zero — and it adds a
    required `runtime` value to the shared base schema's optional
    `display_name` and `description` knobs. An Aggregate whose work is
    event-triggered and idles at no capacity declares this rather than
    `server`, which expects inbound application traffic, or `task`, which runs
    once and ends. Declaring no `provides`, it publishes nothing across an
    edge.

    On Kubernetes it is realized two ways, chosen in the Manifest: as a Knative
    Service, or as a Deployment paired with a KEDA scaling resource; either
    control plane is a prerequisite the operator affirms in the Release, and
    the build halts while it is unaffirmed. Where the target is an AWS
    account, terraform/function-lambda and cloudformation/function-lambda run
    it as an AWS Lambda function from a container image in Amazon ECR, and
    emit no trigger and no URL: what invokes it is the operator's. Nothing
    renders until the Release sets `infra.image`.

    The image is the Release's own code, so an edge delivers what its
    `inject:` block dictates, and no declared socket narrows the mechanism:
    `env` entries become variables beside `FUNCTION_RUNTIME`, `runtime`'s
    default name, which the component's own `env` entries may replace and,
    while it is the default, no edge may dictate; `file` entries read-only
    files on Kubernetes only; and `arg` or any other mechanism is refused by
    name, as no realization renders a command line. A `core/secret-value`
    attachment's value is rendered in the clear; no realization
    delivers `core/referenced-secret` or `core/random-password` to it, and the
    two helm realizations refuse either by name.
  # Each realization leaves the physical form to the Ops Recipe layer: an
  # Aggregate author receives a fixed operational shape. The Knative Service's
  # control plane admits an inbound call while the revision runs no replicas
  # and sets the replica count from observed concurrency; the KEDA scaling
  # resource's control plane sets the replica count from the depth of an event
  # source the Release names. Lambda invokes the image through its runtime API
  # and needs no control plane of the operator's; it writes no file into a
  # function, as a function's configuration offers no way to write one, and it
  # refuses a dictated variable name it reserves for itself. A
  # `core/secret-value` attachment's value is in the clear on Lambda as on
  # Kubernetes.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env alone, the one every realization delivers, since the AWS Lambda ones
  # write no file and none renders a command line. Each env entry reaches the
  # function under the name the developer gives it, and an entry reading
  # `runtime` alone replaces FUNCTION_RUNTIME, which is that value's default
  # name; an entry reading `runtime` beside another value, or beside infra,
  # metadata or the component's identity, replaces nothing.
  inject: [env]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        runtime: { type: string }
      required: [runtime]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    #
    # Four realizations read this block, two on Kubernetes and two on AWS
    # Lambda. `scaler` is read by the KEDA realization only, which needs an
    # event source to scale on; `control_plane_present` and `port` by the
    # Kubernetes realizations only, and `compute.cpu` likewise, since Lambda
    # allots CPU from memory; `overrides` by each under its own keys. Each
    # Recipe's own header states which keys it reads.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: >
          Container image serving the function. On AWS Lambda it is an image
          in Amazon ECR, in the function's Region, that implements Lambda's
          runtime API.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the function's container listens on. Read on Kubernetes only:
          Lambda hands each invocation to the image through its runtime API
          rather than over a port.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Read on
            Kubernetes only: Lambda allots CPU in proportion to memory.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Lambda takes
            it as a memory setting from 128 to 10240 MB, one per Mi.
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the function occupy no compute
          between the events that invoke it. On Lambda a floor above zero is
          provisioned concurrency on the function's published version.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: >
          Replica ceiling the realization's autoscaler may reach. On Lambda it
          is the function's reserved concurrency.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the control plane the chosen realization
          needs is installed in the target cluster. The build halts unless this
          is set true, so a custom resource is never emitted as an orphan into
          a cluster that cannot reconcile it. Read on Kubernetes only: Lambda
          needs no control plane of the operator's.
      scaler:
        type: object
        properties:
          type:
            type: string
            description: >
              Event-source kind the queue-paced realization scales on, named as
              the installed control plane spells it — `kafka`, `rabbitmq`,
              `redis` and so on. Read only by that realization.
          metadata:
            type: object
            additionalProperties: true
            description: >
              Event-source coordinates the chosen scaler kind expects, as
              string keys and values. Which keys a kind reads belongs to the
              installed control-plane version rather than to this catalog, so
              they carry through as authored.
          authentication_ref:
            type: string
            description: >
              Name of an existing trigger-authentication resource in the target
              namespace, for an event source that requires credentials to read
              its depth. Supplied whole by the Release and carried through
              without being resolved; omit it for an event source that needs
              none.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Realization-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the AWS Lambda realizations
          read the function's execution role and the log group, time limit
          and VPC placement it runs with, each under its target's own
          spelling (lambda_role on terraform, Role on CloudFormation).
