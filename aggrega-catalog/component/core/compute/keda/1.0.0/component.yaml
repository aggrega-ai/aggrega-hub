apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/keda
  version: 1.0.0
  license: Apache-2.0
  description: >
    The KEDA control plane, declared as an explicit component so an
    event-driven realization ships its runtime prerequisite alongside the custom
    resources it emits. Its operator reconciles ScaledObject and ScaledJob into
    horizontal pod autoscalers, and its metrics adapter answers the
    external-metrics API, so a workload scales on queue depth or event rate down
    to zero. Declaring it in that same Aggregate satisfies the prerequisite.

    Realized on Kubernetes by two Helm Recipes. `keda-chart` renders the
    project's own chart, custom-resource definitions and admission webhooks
    included, and is the one to reach for; its chart repository must be
    reachable from the build. `keda` is a minimal bootstrap installing the
    operator and adapter without the definitions or the webhooks, and at the
    images pinned here neither process starts, because it sets no
    WATCH_NAMESPACE.

    What it publishes across an edge is where Prometheus finds its own metrics.
    The operator and the adapter each serve them behind a Service of their own,
    under names fixed for the cluster, so each Recipe publishes both Service
    names, the name of their metrics port and the path, for a scraper that
    discovers every endpoint behind them.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # The chart realization places the control plane in the namespace the
      # Release declares for the component and offers no setting placing it
      # elsewhere, so there the build halts unless the two agree; the bootstrap
      # writes this namespace on its objects itself.
      namespace:
        type: string
        default: "keda"
        description: >
          Namespace the control plane is installed into. The `keda-chart`
          realization requires the Release to declare the same namespace for
          the component.
      # Read by the chart realization alone; the bootstrap pulls no chart.
      source_version:
        type: string
        description: >
          Version of the KEDA chart the `keda-chart` realization pulls. Its
          default is the release whose application version is the tag of the
          two image defaults below; changing it away from that default does not
          guarantee value-mapping compatibility with the new chart, and the
          images follow it only where they are set too.
      # Provider-specific overrides. Each Recipe documents which keys it reads;
      # the bootstrap reads none.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides; each Recipe documents the keys it reads.
      # One image field per control-plane workload: the operator and the metrics
      # adapter are separate binaries published as separate images on a shared
      # release tag.
      operator_image:
        type: string
        default: "ghcr.io/kedacore/keda:2.20.2"
        description: >
          Image the operator Deployment runs. The operator reconciles the
          scaling custom resources into horizontal pod autoscalers and issues
          the certificate the metrics adapter serves on.
      metrics_adapter_image:
        type: string
        default: "ghcr.io/kedacore/keda-metrics-apiserver:2.20.2"
        description: >
          Image the metrics adapter Deployment runs. The adapter answers the
          cluster's external-metrics API on behalf of the horizontal pod
          autoscalers the operator creates.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Where Prometheus finds KEDA's own metrics. The operator and the metrics
      # adapter each serve them at /metrics on port 8080, in plain HTTP with no
      # caller check; each listener serves the metrics and nothing else. Each
      # process has a Service of its own naming that port metrics — the
      # bootstrap names them keda-operator and keda-metrics-apiserver, the
      # project's chart keda-operator and keda-operator-metrics-apiserver — so a
      # scraper discovers every endpoint behind the two rather than scraping
      # one address. None of the keys carries a namespace: the control plane
      # runs once per cluster, as the external-metrics API admits one provider,
      # under those fixed Service names in the namespace infra.namespace names,
      # so a scraper looks the two Services up by name across the cluster.
      metrics_service:
        type: string
        description: >
          Names of the Services the operator's and the metrics adapter's
          metrics sit behind, comma-separated — `keda-operator,keda-metrics-apiserver`
          from the bootstrap, `keda-operator,keda-operator-metrics-apiserver`
          from the chart — for a scraper that discovers each endpoint of those
          Services rather than scraping one address. Published beside
          `metrics_service_port` and `metrics_path`.
      metrics_service_port:
        type: string
        description: >
          Name of the port of both Services that carries the metrics, `metrics`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`.
