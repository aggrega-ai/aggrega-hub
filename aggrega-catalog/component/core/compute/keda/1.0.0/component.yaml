apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/keda
  version: 1.0.0
  license: Apache-2.0
  description: >
    The KEDA control plane, declared as an explicit component so an
    event-driven realization ships its runtime prerequisite alongside the custom
    resources it emits. Its operator reconciles ScaledObject and ScaledJob into
    horizontal pod autoscalers, and its metrics adapter answers the
    external-metrics API, so a workload scales on queue depth or event rate down
    to zero. Declaring it in that same Aggregate satisfies the prerequisite.
    Realized on Kubernetes via its Helm Recipe, a minimal bootstrap installing
    the operator and adapter but not the custom-resource definitions or
    admission webhooks.

    What it publishes across an edge is where Prometheus finds its own metrics.
    The operator and the adapter each serve them behind a Service of their own,
    under names fixed for the cluster, so the Recipe publishes both Service
    names, the name of their metrics port and the path, for a scraper that
    discovers every endpoint behind them.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      namespace:
        type: string
        default: "keda"
        description: Namespace the control plane is installed into and watches.
      # One image field per control-plane workload: the operator and the metrics
      # adapter are separate binaries published as separate images on a shared
      # release tag.
      operator_image:
        type: string
        default: "ghcr.io/kedacore/keda:2.20.2"
        description: >
          Image the operator Deployment runs. The operator reconciles the
          scaling custom resources into horizontal pod autoscalers and issues
          the certificate the metrics adapter serves on.
      metrics_adapter_image:
        type: string
        default: "ghcr.io/kedacore/keda-metrics-apiserver:2.20.2"
        description: >
          Image the metrics adapter Deployment runs. The adapter answers the
          cluster's external-metrics API on behalf of the horizontal pod
          autoscalers the operator creates.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Where Prometheus finds KEDA's own metrics. The operator and the metrics
      # adapter each serve them at /metrics on port 8080, in plain HTTP with no
      # caller check, and both do so by default; each listener serves the
      # metrics and nothing else. Each process has a Service of its own,
      # keda-operator and keda-metrics-apiserver, naming that port metrics, so a
      # scraper discovers every endpoint behind the two rather than scraping
      # one address. None of the keys carries a namespace: the control plane
      # runs once per cluster, as the external-metrics API admits one provider,
      # under those fixed Service names in the namespace infra.namespace sets
      # rather than the one a Release annotates, so a scraper looks the two
      # Services up by name across the cluster.
      metrics_service:
        type: string
        description: >
          Names of the Services the operator's and the metrics adapter's
          metrics sit behind, comma-separated, `keda-operator,keda-metrics-apiserver`,
          for a scraper that discovers each endpoint of those Services rather
          than scraping one address. Published beside `metrics_service_port`
          and `metrics_path`.
      metrics_service_port:
        type: string
        description: >
          Name of the port of both Services that carries the metrics, `metrics`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`.
