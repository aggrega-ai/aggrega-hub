apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/keda
  version: 1.0.0
  description: >
    The KEDA control plane, declared as an explicit deployment component so an
    event-driven realization ships its runtime prerequisite alongside the custom
    resources it emits. Its operator reconciles ScaledObject and ScaledJob into
    horizontal pod autoscalers, and its metrics adapter answers the
    external-metrics API, so a workload scales on queue depth or event rate down
    to zero. Declaring it in that same deployment satisfies the prerequisite. It
    publishes nothing across an edge; it reconciles. Realized on Kubernetes via
    its Helm Recipe, a minimal bootstrap installing the operator and adapter but
    not the custom-resource definitions or admission webhooks.
  license: Apache-2.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      namespace:
        type: string
        default: "keda"
        description: Namespace the control plane is installed into and watches.
      # One image field per control-plane workload: the operator and the metrics
      # adapter are separate binaries published as separate images on a shared
      # release tag.
      operator_image:
        type: string
        default: "ghcr.io/kedacore/keda:2.20.2"
        description: >
          Image the operator Deployment runs. The operator reconciles the
          scaling custom resources into horizontal pod autoscalers and issues
          the certificate the metrics adapter serves on.
      metrics_adapter_image:
        type: string
        default: "ghcr.io/kedacore/keda-metrics-apiserver:2.20.2"
        description: >
          Image the metrics adapter Deployment runs. The adapter answers the
          cluster's external-metrics API on behalf of the horizontal pod
          autoscalers the operator creates.
