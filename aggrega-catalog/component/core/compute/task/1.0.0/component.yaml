apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/task
  version: 1.0.0
  description: >
    A generic ephemeral compute primitive. Its operational type is `task` —
    ephemeral compute that runs to completion and dies, such as a database
    migration — and it adds two optional fields of its own, `schedule` and
    `timeout`, to the shared base schema's `display_name` and `description`
    knobs. An Aggregate declares this for work that ends, rather than `server`
    or `worker`, which are both long-running. Declaring no `provides`, it
    publishes nothing across an edge: an Aggregate author receives a fixed
    operational shape, with the physical form left to the Ops Recipe layer.
    Realized on Kubernetes as a single run to completion when the developer
    authors no `schedule`, and as a recurring one on that schedule when they
    do — one Recipe covering both, so the shape follows the value its author
    wrote rather than a choice made for them elsewhere. No Service and no port
    are emitted in either shape: nothing connects to a run that ends. The
    catalog pins no image, so nothing renders until the Release sets
    `infra.image`.

    The image is the Release's own code, so an edge from this component
    delivers what its `inject:` block dictates, in either shape, and no declared
    socket narrows the mechanism: `env` entries become variables beside
    `TASK_TIMEOUT`, which carries the developer's `timeout` and which no edge
    may dictate, and `file` entries read-only files at the paths the edge
    names. An `arg` entry, or any other mechanism, is refused by name, as the
    realization renders no command line.
  labels:
    component.aggrega.ai/type: task
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. `schedule` is what decides
    # whether the realization renders a recurring run or a single one, so the
    # shape follows the developer's own value and no operator choice can
    # contradict it.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        schedule: { type: string }
        timeout: { type: string }

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image the run executes.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
