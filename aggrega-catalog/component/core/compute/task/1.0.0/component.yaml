apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/task
  version: 1.0.0
  description: >
    A generic ephemeral compute primitive. Its operational type is `task` —
    ephemeral compute that runs to completion and dies, such as a database
    migration — and it adds two optional fields of its own, `schedule` and
    `timeout`, to the shared base schema's `displayName` and `description`
    knobs. A deployment declares this for work that ends, rather than `server`
    or `worker`, which are both long-running. Declaring no `provides`, it
    publishes nothing across an edge: an Aggregate author receives a fixed
    operational shape, with the physical form left to the Ops Recipe layer.
  labels:
    component.aggrega.ai/type: task
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        schedule: { type: string }
        timeout: { type: string }
