apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/task
  version: 1.0.0
  description: >
    A generic ephemeral compute primitive. Its operational type is `task` —
    ephemeral compute that runs to completion and dies, such as a database
    migration — and it adds two optional fields of its own, `schedule` and
    `timeout`, to the shared base schema's `display_name` and `description`
    knobs. An Aggregate declares this for work that ends, rather than `server`
    or `worker`, which are both long-running. Declaring no `provides`, it
    publishes nothing across an edge.

    On Kubernetes one Recipe runs it once when the developer authors no
    `schedule`, and on that schedule when they do. On an AWS account with an
    ECS cluster and a VPC, terraform/task-ecs and cloudformation/task-ecs run
    it as an Amazon ECS task on Fargate, on its schedule through EventBridge
    Scheduler, and the operator can start a run by hand with
    `aws ecs run-task`, given the cluster, task definition and network
    configuration in `infra.overrides`. With no `schedule`, one carrying
    `core/manual-trigger` is deployed without starting; any other is refused,
    as nothing on AWS would start it. Nothing renders until the Release sets
    `infra.image`.

    The image is the Release's own code, so an edge delivers what its
    `inject:` block dictates, and no declared socket narrows the mechanism:
    `env` entries become variables beside `TASK_TIMEOUT`, which carries
    `timeout` and which no edge may dictate; `file` entries read-only files on
    Kubernetes only; and `arg` or any other mechanism is refused by name, as no
    realization renders a command line. A `core/secret-value` attachment's
    value is written into the rendered workload in the clear; a secret that
    must stay out of rendered output takes `core/referenced-secret` or
    `core/random-password`.
  # Each realization leaves the physical form to the Ops Recipe layer: an
  # Aggregate author receives a fixed operational shape. No realization emits
  # a Service or a port: nothing connects to a run that ends. The Kubernetes
  # realization needs no cluster control plane beyond Kubernetes itself. The
  # Amazon ECS realizations run the task in the cluster, subnets and security
  # groups the Release names under infra.overrides, and the schedule starts it
  # under a role the Release names there too; they write no file, as a Fargate
  # task definition offers no volume whose content it supplies itself, and they
  # refuse a `schedule` the scheduler's own expression cannot carry exactly. A
  # `core/secret-value` attachment's value is in the clear on Amazon ECS as on
  # Kubernetes.
  labels:
    component.aggrega.ai/type: task
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. `schedule` is what decides
    # whether the Kubernetes realization renders a recurring run or a single
    # one, and whether the Amazon ECS realizations render a schedule, and,
    # where the task carries no core/manual-trigger, render at all, so the
    # shape follows the developer's own value and no operator choice can
    # contradict it.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        schedule:
          type: string
          description: >
            A cron expression of five fields — minute, hour, day of the month,
            month and day of the week — such as 30 2 * * 1-5. Kubernetes runs
            it in its controller manager's time zone; Amazon ECS runs it
            through EventBridge Scheduler, in UTC unless the Release names a
            time zone, and refuses one the scheduler cannot carry exactly, such
            as one restricting both the day of the month and the day of the
            week.
        timeout:
          type: string
          description: >
            How long a run may take, delivered to the container as
            TASK_TIMEOUT for the application's own code to honour: no
            realization sets a deadline at which the platform stops a run.

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image the run executes.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the task runs
          and is started under, and the schedule's time zone, each under its
          target's own spelling (subnet_ids on terraform, Subnets on
          CloudFormation), and the Kubernetes realization reads none of its
          keys.
