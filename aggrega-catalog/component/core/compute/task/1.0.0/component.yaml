apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/task
  version: 1.0.0
  description: >
    A generic ephemeral compute primitive. Its operational type is `task` —
    ephemeral compute that runs to completion and dies, such as a database
    migration — with two optional fields of its own, `schedule` and
    `timeout`. An Aggregate declares this for work that ends, rather than
    `server` or `worker`, which are both long-running.

    helm/task runs it on Kubernetes, on its `schedule` as a CronJob and once
    at deploy without one. compose/task runs it on Docker Compose once at
    each `docker compose up`, and refuses a `schedule`. terraform/task-ecs and
    cloudformation/task-ecs run it as an Amazon ECS task on Fargate, on its
    schedule through EventBridge Scheduler, and refuse it with none, as
    nothing on AWS would start it.

    With no `schedule`, `core/manual-trigger` holds it until someone starts
    a run, with the command each realization's description names. Nothing
    renders until the Release sets `infra.image`.

    The image is the Release's own code, so an edge delivers what its
    `inject:` block dictates, and no declared socket narrows the mechanism:
    `env` entries become variables beside `TASK_TIMEOUT`, `timeout`'s
    default name, which the component's own `env` entries may replace and,
    while it is the default, no edge may dictate; `file` entries files, read-only
    on Kubernetes, and none on Amazon ECS; and `arg` or any other mechanism
    is refused by name, as no realization renders a command line. A
    `core/secret-value` attachment's
    value is written into the rendered workload in the clear; no realization
    delivers `core/referenced-secret` or `core/random-password` to it, and the
    helm realization refuses either by name.
  # The two fields of its own sit beside the shared base schema's display_name
  # and description knobs. Declaring no provides, it publishes nothing across
  # an edge.
  #
  # A run of a task held by core/manual-trigger is started on Kubernetes from
  # its suspended CronJob with `kubectl create job --from=cronjob/`, on Docker
  # Compose from its service behind a profile with `docker compose run --rm`,
  # and on Amazon ECS from its task definition with `aws ecs run-task`.
  #
  # Each realization leaves the physical form to the Ops Recipe layer: an
  # Aggregate author receives a fixed operational shape. No realization emits
  # a Service or a port: nothing connects to a run that ends. The Kubernetes
  # realization needs no cluster control plane beyond Kubernetes itself. The
  # Amazon ECS realizations run the task in the cluster, subnets and security
  # groups the Release names under infra.overrides, and the schedule starts it
  # under a role the Release names there too; they write no file, as a Fargate
  # task definition offers no volume whose content it supplies itself, and they
  # refuse a `schedule` the scheduler's own expression cannot carry exactly.
  # They run a task with no `schedule` only while it carries
  # core/manual-trigger, deploying its task definition without starting it,
  # and the operator starts each run with `aws ecs run-task`, given the
  # cluster, task definition and network configuration in `infra.overrides`.
  # The Docker Compose realization writes one service that is not restarted
  # when it exits, gated behind a Compose profile while the task carries
  # core/manual-trigger, and refuses every `schedule`, as Compose has no
  # scheduler. A `core/secret-value` attachment's value is in the clear on
  # Amazon ECS and Docker Compose as on Kubernetes.
  labels:
    component.aggrega.ai/type: task
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env alone, the one every realization delivers, since the Amazon ECS ones
  # write no file and none renders a command line. Each env entry reaches the
  # container under the name the developer gives it, and an entry reading
  # `timeout` alone replaces TASK_TIMEOUT, which is that value's default name;
  # an entry reading `timeout` beside another value, or beside infra, metadata
  # or the component's identity, replaces nothing.
  inject: [env]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. `schedule` is what decides
    # whether the Kubernetes realization renders a recurring run or a single
    # one, and whether the Amazon ECS realizations render a schedule, and,
    # where the task carries no core/manual-trigger, render at all. With no
    # schedule, a core/manual-trigger attachment, which the developer writes
    # too, turns the Kubernetes realization's single run into a suspended
    # CronJob, and gates the Docker Compose realization's service behind a
    # profile; that realization refuses a schedule. So the shape follows what
    # the developer wrote and no operator choice can contradict it.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        schedule:
          type: string
          description: >
            A cron expression of five fields — minute, hour, day of the month,
            month and day of the week — such as 30 2 * * 1-5. Kubernetes runs
            it in its controller manager's time zone; Amazon ECS runs it
            through EventBridge Scheduler, in UTC unless the Release names a
            time zone, and refuses one the scheduler cannot carry exactly, such
            as one restricting both the day of the month and the day of the
            week. Docker Compose has no scheduler and refuses a schedule.
        timeout:
          type: string
          description: >
            How long a run may take, delivered to the container as
            TASK_TIMEOUT, or under the name an env entry of the component's
            own inject block reading it alone gives it, for the application's own
            code to honour: no realization sets a deadline at which the
            platform stops a run.

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image the run executes.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least. Docker Compose takes it as
            the service's limit and reservation. Amazon ECS and Docker Compose
            read whole millicores or cores with at most three decimals.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size; Docker Compose takes it as the
            service's limit and reservation. Amazon ECS and Docker Compose read
            whole Mi or Gi.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the task runs
          and is started under, and the schedule's time zone, each under its
          target's own spelling (subnet_ids on terraform, Subnets on
          CloudFormation), and the Kubernetes and Docker Compose realizations
          read none of its keys.
