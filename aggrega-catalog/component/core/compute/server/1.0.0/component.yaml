apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/server
  version: 1.0.0
  description: >
    A generic long-running server primitive. It adds no fields of its own, so
    its value surface is just the shared base schema's optional `display_name`
    and `description` knobs; what it contributes is its operational type,
    `server` — long-running, stateless compute that expects inbound
    application traffic. An Aggregate declares this for a component that stays
    up and serves requests, rather than `worker`, with zero inbound
    application ports, or the run-once `task`. Declaring no `provides`, it
    publishes nothing across an edge: an Aggregate author receives a fixed
    operational shape, with the physical form left to the Ops Recipe layer.

    Where the target is a Kubernetes cluster, it is realized as a Deployment
    behind a ClusterIP Service, which carries the inbound application traffic
    the type expects. Where the target is an AWS account with an ECS
    cluster and a VPC, terraform/server-ecs and cloudformation/server-ecs run
    it as an Amazon ECS service on Fargate. Either way the Release names the
    image, the port and the replica count; the catalog pins no image, so
    nothing renders until the Release sets `infra.image`.

    The image is the Release's own code, so an edge from this component
    delivers what its `inject:` block dictates, and no declared socket narrows
    the mechanism: `env` entries become variables on every realization, `file`
    entries read-only files on Kubernetes only, and `arg` or any other
    mechanism is refused by name, as no realization renders a command line. A
    `core/secret-value` attachment's value is written into the rendered
    workload in the clear, on Kubernetes as on Amazon ECS; a secret that must
    stay out of rendered output takes `core/referenced-secret` or
    `core/random-password`.
  # The Kubernetes realization needs no cluster control plane beyond Kubernetes
  # itself. The Amazon ECS realizations run the service in the cluster, subnets
  # and security groups the Release names under infra.overrides.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. This primitive adds no fields
    # of its own, so the surface is the shared base schema's two knobs.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this. With no
    # developer fields of its own, this primitive renders entirely from here.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image serving the application.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the container listens on. On Kubernetes the fronting Service
          carries inbound traffic to it; on Amazon ECS it is the container
          port a load balancer target group the Release names sends traffic
          to.
      replicas:
        type: integer
        min: 1
        default: 1
        description: >
          Replica count, the number of tasks on Amazon ECS. The floor is one,
          because a server that expects inbound traffic has nothing to hold a
          request while it is at zero.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the service
          runs under, each under its target's own spelling (subnet_ids on
          terraform, Subnets on CloudFormation), and the Kubernetes
          realization reads none of its keys.
