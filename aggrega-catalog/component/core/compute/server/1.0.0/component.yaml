apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/server
  version: 1.0.0
  description: >
    A generic long-running server primitive. It adds no fields of its own;
    what it contributes is its operational type, `server` — long-running,
    stateless compute that expects inbound application traffic. An Aggregate
    declares this for a component that stays up and serves requests, rather
    than `worker`, with zero inbound application ports, or the run-once
    `task`. Declaring no `provides`, it publishes nothing across an edge.

    On a Kubernetes cluster it is a Deployment behind a ClusterIP Service. In
    an AWS account with an ECS cluster and a VPC, terraform/server-ecs and
    cloudformation/server-ecs run it as an Amazon ECS service on Fargate. In a
    Google Cloud project with a VPC network, terraform/server-cloud-run runs
    it as a Cloud Run service; in an Azure subscription with a Container Apps
    environment, terraform/server-container-apps as a container app. On
    Docker Compose, compose/server runs it on the host's loopback address.
    The catalog pins no image, so nothing renders until the Release sets
    `infra.image`.

    The image is the Release's own code, so an edge from this component
    delivers what its `inject:` block dictates, and no declared socket narrows
    the mechanism: `env` entries become variables on every realization, `file`
    entries files everywhere but on Amazon ECS and Cloud Run, and `arg` or any
    other mechanism is refused by name, as no realization renders a command
    line. The component's own `inject:` block takes `env` entries too. A
    `core/secret-value` attachment's value is written into the
    rendered workload in the clear on every realization; no realization
    delivers `core/referenced-secret` or `core/random-password` to it, and the
    helm realization refuses either by name.
  # An Aggregate author receives a fixed operational shape, with the physical
  # form left to the Ops Recipe layer. On Kubernetes the ClusterIP Service
  # carries the inbound traffic the type expects.
  #
  # The Kubernetes realization needs no cluster control plane beyond Kubernetes
  # itself. The Amazon ECS realizations run the service in the cluster, subnets
  # and security groups the Release names under infra.overrides, the Cloud Run
  # realization runs the service in the project, region, VPC network and
  # service account it names there, with ingress from inside that network only,
  # and the Container Apps realization runs the app in the Container Apps
  # environment and resource group it names there, with ingress from inside that
  # environment only. The Docker Compose realization runs one service whose port
  # is published on the host's loopback address alone.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env alone, the one every realization delivers, since the Amazon ECS and
  # Cloud Run ones write no file and none renders a command line. Each env entry
  # reaches the container under the name the developer gives it. No
  # realization delivers any of its values under a name of its own, so no
  # default exists for such an entry to replace.
  inject: [env]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. This primitive adds no fields
    # of its own, so the surface is just the shared base schema's two optional
    # knobs, `display_name` and `description`.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this. With no
    # developer fields of its own, this primitive renders entirely from here.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image serving the application.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the container listens on. On Kubernetes the fronting Service
          carries inbound traffic to it; on Amazon ECS it is the container
          port a load balancer target group the Release names sends traffic
          to; on Cloud Run it is the port requests are sent to, which the
          container is also handed as PORT; on Container Apps it is the
          ingress's target port, which the container is also handed as
          CONTAINER_APP_PORT; on Docker Compose it is also the port published
          on the host's loopback address.
      replicas:
        type: integer
        min: 1
        default: 1
        description: >
          Replica count, the number of tasks on Amazon ECS, of instances on
          Cloud Run and of replicas on Container Apps, up to 300 there. The
          floor is one, because a server that expects inbound traffic has
          nothing to hold a request while it is at zero. Docker Compose runs
          one container and refuses a count above one.
      compute:
        cpu:
          type: string
          default: 100m
          description: >
            CPU as a Kubernetes quantity, such as 100m or 0.5. Kubernetes
            takes it as the container's request and limit; Amazon ECS runs the
            task at the smallest Fargate size meeting both cpu and memory, a
            quarter of a vCPU and 512 MiB at least, Cloud Run the service at
            the smallest whole-vCPU size meeting both, 1 vCPU and 512 MiB at
            least, and Container Apps the app at the smallest Consumption
            size meeting both, 0.25 vCPU and 0.5 GiB at least.
        memory:
          type: string
          default: 128Mi
          description: >
            Memory as a Kubernetes quantity, such as 128Mi or 1Gi. Kubernetes
            takes it as the container's request and limit; Amazon ECS rounds
            it up with cpu to a Fargate size, Cloud Run to a whole-vCPU size,
            and Container Apps to a Consumption size.
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. Each
          Recipe documents which keys it reads: the Amazon ECS realizations
          read the cluster, subnets, security groups and roles the service
          runs under, each under its target's own spelling (subnet_ids on
          terraform, Subnets on CloudFormation), the Cloud Run realization
          the project, region, VPC network and service account the service
          runs in, the Container Apps realization the environment and
          resource group the app runs in and the identities and registry it
          pulls with, and the Kubernetes and Docker Compose realizations read
          none of its keys.
