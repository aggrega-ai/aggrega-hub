apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/compute/server
  version: 1.0.0
  description: >
    A generic long-running server primitive. It adds no fields of its own, so
    its value surface is just the shared base schema's optional `display_name`
    and `description` knobs; what it contributes is its operational type,
    `server` — long-running, stateless compute that expects inbound
    application traffic. An Aggregate declares this for a component that stays
    up and serves requests, rather than `worker`, with zero inbound
    application ports, or the run-once `task`. Declaring no `provides`, it
    publishes nothing across an edge: an Aggregate author receives a fixed
    operational shape, with the physical form left to the Ops Recipe layer.
    Realized on Kubernetes as a Deployment behind a ClusterIP Service, which is
    what carries the inbound application traffic the type expects; the
    Release names the image, the port and the replica count. It needs no
    cluster control plane beyond Kubernetes itself.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. This primitive adds no fields
    # of its own, so the surface is the shared base schema's two knobs.
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this. With no
    # developer fields of its own, this primitive renders entirely from here.
    infra:
      # No default: this primitive packages no software, so it holds no image
      # to fall back to. The Release names the one it runs, tag included.
      image:
        type: string
        description: Container image serving the application.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the container listens on, and the port the fronting Service
          carries inbound traffic to.
      replicas:
        type: integer
        min: 1
        default: 1
        description: >
          Replica count. The floor is one, because a server that expects
          inbound traffic has nothing to hold a request while it is at zero.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
