apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-pipeline/cloud-composer
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Cloud Composer is a hosted
  # service the reader contracts for with Google Cloud, under Google Cloud's
  # terms, which no SPDX identifier names, though the Apache Airflow it runs
  # is Apache-2.0. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. The
  # service supplies Airflow's images, and the DAGs are the application's,
  # uploaded outside the Release, so no realization pins an artifact; the
  # catalog distributes and brokers none, and the standard library's
  # admission test, which reads the artifacts an entity pins, finds nothing
  # to refuse.
  #
  # The environment's behaviour follows Cloud Composer's documentation, which
  # names the service Managed Service for Apache Airflow, and its REST
  # reference of an environment: the rule for a Python package's name and
  # its extras and version specifier; for an environment variable's name;
  # and for an Airflow configuration option's key.
  description: >
    One Cloud Composer environment, which Google Cloud's documentation calls
    Managed Service for Apache Airflow: Google's managed Apache Airflow,
    which runs a multi-step job as a DAG, scheduling each run, running each
    task in the order the DAG gives on workers the service manages,
    retrying a failed task under the DAG's retry settings and keeping each
    run's history. The DAGs are the application's, uploaded to
    dag_gcs_prefix, which the environment reads them from. A consumer reads
    host and endpoint, the Airflow web server's name and URL, under which
    Airflow's REST API answers, and dag_gcs_prefix.

    The environment runs the Airflow version infra.engine_version names,
    with the Python packages, environment variables and Airflow
    configuration options its values give. A caller signs in to the web
    server and calls the REST API with its own Google identity, which the
    operator grants a Composer role, so no credential is published.

    The project, the network, the service account and a Cloud Storage
    bucket or Cloud KMS key the environment uses are the operator's. Each
    Recipe's description says which keys it honours and which it refuses by
    name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-pipeline
    # No pipeline.aggrega.ai/mode label: its values say who holds a run and
    # who executes its steps, reconciled for a run a cluster's controller
    # turns into workload and durable for one whose steps run on workers the
    # application deploys, and here the service holds the run and executes
    # every task on workers of its own, which neither value describes.
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `orchestration: {}` keeps a working
      # contract: an environment with the packages, variables and options
      # the service installs and sets itself.
      pypi_packages:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: >
          The Python packages the DAGs need beyond those the service
          preinstalls, a map from each package's name, in lower case, to its
          extras and version specifier, in lower case, such as ==1.12.0 or
          [gcp]>=2.0, or empty for any version. The service installs them
          in the environment, and refuses a set whose requirements conflict
          when it applies them.
      env_variables:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: >
          Environment variables the Airflow scheduler, workers and web
          server run with, which the DAGs read: a map from each name, of
          letters, digits and underscores not beginning with a digit, to its
          value. A name of the form AIRFLOW__<SECTION>__<KEY>, which sets an
          Airflow configuration option, belongs under
          airflow_config_overrides instead.
      airflow_config_overrides:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: >
          Airflow configuration options, a map from each option, written
          <section>-<option> as in core-dags_are_paused_at_creation, to its
          value. The service refuses an option it keeps for itself when it
          applies the configuration.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # No default: unset, the service runs the Airflow version and build it
      # creates an environment with by default, which its versions page
      # names.
      engine_version:
        type: string
        description: >
          The Apache Airflow version the environment runs, as the service's
          versions page spells it: a major, major.minor or
          major.minor.patch version, each taking the newest build the
          service offers of it, or major.minor.patch-build.<n> for one
          build. Unset, the service's default version.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The name of the Airflow web server, a name of the service's own
          under which the environment's web interface and REST API answer
          over HTTPS on port 443.
      endpoint:
        type: string
        required: true
        description: >
          The Airflow web server's URL, https:// followed by host; Airflow's
          REST API answers beneath it, at /api/v1 or /api/v2 as the
          environment's Airflow version serves it. It carries no credential.
      dag_gcs_prefix:
        type: string
        required: true
        description: >
          The Cloud Storage path, gs://<bucket>/dags, the environment reads
          DAG files from: a DAG uploaded beneath it is picked up by the
          scheduler.

  # The rules Cloud Composer's REST reference of an environment's software
  # configuration and its pages on Python packages, environment variables and
  # Airflow configuration overrides give, for every version the service
  # runs: a package's name in lower case, and its extras and version
  # specifier in lower case; a variable's name matching
  # [a-zA-Z_][a-zA-Z0-9_]* and not of the form AIRFLOW__<SECTION>__<KEY>; an
  # option's key, a section with no hyphen, square bracket or period, a
  # hyphen, and an option name in snake_case with no =, ; or period. A
  # package's name is held to the characters a Python distribution's name
  # takes, letters, digits, periods, underscores and hyphens, beginning and
  # ending with a letter or a digit. Each map is ranged in its keys' sorted
  # order, so a halt names the first offending key alone.
  assertions:
    software_config: >-
      {{- range $name, $spec := (default dict (optional .values "pypi_packages" dict)) -}}
      {{- if not (regexMatch `^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$` $name) -}}
      {{- fail (printf "values.pypi_packages names %q, and Cloud Composer takes a Python package by its name in lower case, of letters, digits, periods, underscores and hyphens, beginning and ending with a letter or a digit: rename it in the Aggregate" $name) -}}
      {{- end -}}
      {{- if regexMatch `[A-Z]` (toString $spec) -}}
      {{- fail (printf "values.pypi_packages.%s is %q, and Cloud Composer takes a package's extras and version specifier in lower case: write it in lower case in the Aggregate" $name (toString $spec)) -}}
      {{- end -}}
      {{- end -}}
      {{- range $name, $_ := (default dict (optional .values "env_variables" dict)) -}}
      {{- if not (regexMatch `^[a-zA-Z_][a-zA-Z0-9_]*$` $name) -}}
      {{- fail (printf "values.env_variables names %q, and Cloud Composer takes an environment variable's name of letters, digits and underscores, not beginning with a digit: rename it in the Aggregate" $name) -}}
      {{- end -}}
      {{- if regexMatch `AIRFLOW__[A-Z0-9_]+__[A-Z0-9_]+` $name -}}
      {{- fail (printf "values.env_variables names %s, which sets an Airflow configuration option, and Cloud Composer sets none through a variable: move it to values.airflow_config_overrides as <section>-<option> in the Aggregate" $name) -}}
      {{- end -}}
      {{- end -}}
      {{- range $key, $_ := (default dict (optional .values "airflow_config_overrides" dict)) -}}
      {{- if not (regexMatch `^[^-\[\].]+-[a-z][a-z0-9_]*$` $key) -}}
      {{- fail (printf "values.airflow_config_overrides names %q, and Cloud Composer takes an option as <section>-<option>: a section with no hyphen, square bracket or period, and the option's name in snake_case: rename it in the Aggregate" $key) -}}
      {{- end -}}
      {{- end -}}
