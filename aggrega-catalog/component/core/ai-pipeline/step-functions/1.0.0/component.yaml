apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-pipeline/step-functions
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: AWS Step Functions is a
  # hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The state machine's behaviour follows the AWS Step Functions API
  # Reference: CreateStateMachine (the rule for a state machine's name, the
  # definition's length, the type, STANDARD as its default and fixed once
  # the state machine exists) and DeleteStateMachine; and the AWS Step
  # Functions Developer Guide: "State machine structure in Amazon States
  # Language", "Choosing workflow type in Step Functions" and "Using
  # CloudWatch Logs to log execution history in Step Functions".
  description: >
    One AWS Step Functions state machine: AWS's managed service that runs a
    workflow as executions, each moving through the states of the
    definition values.definition declares, written in the Amazon States
    Language: a task calling another service, a choice, a wait, a parallel
    or map branch, a pass, a success or a failure, with the retries and
    catches the definition sets. The service runs every state itself; no
    worker of the application's own takes part. The state machine is named
    after the component. A consumer reads its ARN as arn, which
    StartExecution names to start an execution and an IAM policy names as
    the resource it grants on.

    The service calls other services as the IAM role the state machine
    assumes, which is the operator's: each Recipe reads it by its ARN and
    creates none. A caller starts an execution under its own IAM identity,
    under permissions the operator grants, so no credential is published.

    values.state_machine_type is STANDARD unless set: an execution runs
    exactly once for up to one year, and Step Functions keeps its history
    for 90 days after it ends. EXPRESS runs an execution for up to five
    minutes, at least once when started asynchronously, and keeps no
    history in Step Functions: logging to the operator's CloudWatch Logs
    log group, where a Recipe's override names one, is the only record. The
    type is fixed when the state machine is created.

    No backup is configured: the state machine holds its definition, which
    is written each time the Release deploys. Each Recipe's description says
    what a change of type or name does and which keys it honours and which
    it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-pipeline
    # No pipeline.aggrega.ai/mode label: its values say who holds a run and
    # who executes its steps, reconciled for a run a cluster's controller
    # turns into workload and durable for one whose steps run on workers the
    # application deploys, and here the service holds the execution and runs
    # every state itself, which neither value describes.
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # definition has no default: a state machine needs at least one state
      # to start at, and no state is the catalog's to choose.
      #
      # The fields are those the Developer Guide's "State machine structure
      # in Amazon States Language" documents for a definition: StartAt and
      # States, which it marks required, and Comment, QueryLanguage,
      # TimeoutSeconds and Version, which it marks optional. Each state holds
      # its Type, which the guide marks required, and is named in at most 80
      # characters, the limit the Amazon States Language specification
      # gives a state name.
      definition:
        type: object
        required: true
        properties:
          StartAt:
            type: string
            description: >
              The name of the state an execution starts at, matching one of
              the names under States exactly, case included.
          States:
            type: object
            minProperties: 1
            propertyNames:
              minLength: 1
              maxLength: 80
            additionalProperties:
              type: object
              required:
                - Type
            description: >
              The states, a map from each state's name to its definition:
              Type, and the fields a state of that type takes, such as
              Resource, Next or End.
          Comment:
            type: string
            description: A human-readable description of the state machine.
          QueryLanguage:
            enum:
              - JSONPath
              - JSONata
            description: >
              The query language the states use, JSONPath unless set.
          TimeoutSeconds:
            type: integer
            description: >
              The longest an execution runs, in seconds, before it fails
              with States.Timeout.
          Version:
            type: string
            description: >
              The version of the Amazon States Language the definition is
              written in, 1.0 unless set.
        description: >
          The state machine's definition, written in the Amazon States
          Language as the Step Functions console's code view shows it: StartAt,
          States, and optionally Comment, QueryLanguage, TimeoutSeconds and
          Version. Expressions the service evaluates when an execution runs,
          JSONPath paths and JSONata expressions inside {% %}, are written as
          the language writes them. A definition without StartAt or States,
          or whose StartAt names no state, halts the build naming this key;
          what the states do is the service's to judge when it creates the
          state machine. Changing it changes the state machine in place.
      state_machine_type:
        type: string
        default: STANDARD
        description: >
          STANDARD, the service's default, or EXPRESS, as the description
          above compares them. Step Functions fixes it when it creates the
          state machine, and each Recipe's description says what changing it
          on a deployed state machine does. Any other value halts the build.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      arn:
        type: string
        required: true
        description: >
          The state machine's ARN, arn:<partition>:states:<region>:<account>:stateMachine:<name>,
          the name being the component's: what StartExecution and
          StartSyncExecution name to start an execution, and what an IAM
          policy names as the resource it grants states:StartExecution on. A
          realization publishes a pointer string the provisioning tool
          resolves once the state machine exists.

  # The rules Step Functions holds a state machine to that the schema above
  # does not state: the types it offers, the rule for a state machine's
  # name, which reads the component's name, and the start state naming one
  # of the states. Each halts the build naming what to change rather than
  # leaving the creation to fail.
  assertions:
    # Step Functions takes STANDARD and EXPRESS, spelt so (the API
    # Reference's CreateStateMachine).
    state_machine_type: >-
      {{- $t := .values.state_machine_type -}}
      {{- if not (and (typeIs "string" $t) (has $t (list "STANDARD" "EXPRESS"))) -}}
      {{- fail (printf "values.state_machine_type is %s, and the Step Functions state machine %q takes STANDARD or EXPRESS, spelt so: set it to one of them in the Aggregate, or remove it for STANDARD" (toJson $t) .metadata.instance_id) -}}
      {{- end -}}
    # Step Functions takes a state machine name of 1 to 80 characters, and
    # one made of letters, digits, hyphens and underscores alone for a state
    # machine logging to CloudWatch Logs (the API Reference's
    # CreateStateMachine). Each realization names the state machine after
    # the component, whose name is made of those characters already, so the
    # rule reads its length.
    state_machine_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if gt (len $n) 80 -}}
      {{- fail (printf "the component %q names its Step Functions state machine, and Step Functions takes a state machine name of at most 80 characters: rename the component in the Aggregate to such a name" (trunc 64 $n)) -}}
      {{- end -}}
    # The Amazon States Language: a definition "MUST have an object field
    # named States", and StartAt "MUST match exactly the name of one of the
    # States fields". The schema above holds each field's type where it is
    # set; this rule holds both to be set and reads them together.
    definition: >-
      {{- $d := .values.definition -}}
      {{- $s := "" }}{{ $states := dict -}}
      {{- if kindIs "map" $d }}{{ $s = get $d "StartAt" }}{{ $states = get $d "States" }}{{ end -}}
      {{- if not (and (typeIs "string" $s) (kindIs "map" $states) (hasKey $states (toString $s))) -}}
      {{- fail (printf "values.definition.StartAt is %s, and the Amazon States Language takes a definition holding States, a map of the states, and StartAt, the name of one of them, matched exactly, case included: set both in the Aggregate" (toJson $s)) -}}
      {{- end -}}
