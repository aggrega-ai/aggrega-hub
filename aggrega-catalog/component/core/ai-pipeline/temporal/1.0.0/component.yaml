apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-pipeline/temporal
  version: 1.0.0
  license: MIT
  description: >
    Temporal, a durable-execution engine. A multi-step job is written as ordinary
    program code against one of the project's client libraries; the engine records
    every step's outcome as an event and hands the next piece of work to a worker
    the application itself deploys. Because the run is a replayable event history
    rather than a position in a process, a worker that crashes mid-job is replaced
    and the job resumes where it stopped, and a step that fails is retried on the
    policy the code declared. That division is what separates this from a
    scheduler: the engine owns the run's history and its timers, while the
    application owns the code each step executes.

    It keeps none of its own durable state. A relational datastore holds the
    event histories and a second database on that same connection holds the
    visibility index the console and the list APIs read, so the store is wired as
    a topology edge to a datastore component the Aggregate already declares
    rather than bundled inside this one. The engine is reached over gRPC on the
    frontend service, which is the address the provides contract publishes; a
    browser console is deployed alongside it.

    Realized on Kubernetes through a Helm Recipe that sources the project's own
    chart. It has no standalone local-container form, so no Compose Recipe is
    provided.

    Each of the engine's services serves its own metrics, in pods of its own,
    so the Recipe publishes the pod labels selecting every one of them, the
    name of their metrics port and the path, for a scraper that discovers
    those pods directly.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-pipeline
    pipeline.aggrega.ai/mode: durable
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: a consumer whose workers connect to this engine may
  # inject this component's own provides keys into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The relational datastore holding the event histories and the visibility
    # index. The edge's resolved host, port and user reach the Recipe, which
    # passes them into the engine's own datastore configuration rather than
    # composing a connection string — which is what keeps the store's password
    # out of the rendered artifact, since a password embedded in a URL cannot be
    # delivered as a secret reference. Required: the engine has nowhere to record
    # a run without it, so omitting it would start the engine and refuse
    # every workflow.
    metadata_store:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # The dialect, the two database names and the transport belong to this
        # connection rather than to either component: one datastore server can
        # carry a second engine's histories under different database names.
        driver:
          type: string
          enum: [postgres12, postgres12_pgx, mysql8]
          default: postgres12
          description: Which SQL dialect the engine speaks on this connection. The two PostgreSQL values select different client libraries against the same server; pick the MySQL value for a MySQL-compatible target.
        history_database:
          type: string
          default: temporal
          description: Database on this connection holding the event histories. It must already exist and carry the engine's schema — the engine's setup step creates the tables, it does not create the database.
        visibility_database:
          type: string
          default: temporal_visibility
          description: Database on the same connection holding the visibility index the console and the list APIs read. It is a second database rather than a second server, and it must already exist for the same reason.
        connect_protocol:
          type: string
          default: tcp
          description: Transport the engine dials the store over.
        # A statement about this connection's target, authored on the
        # connection: the datastore it reaches takes no credential. It changes
        # nothing this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the relational datastore this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The password the engine presents to this datastore, held on the
      # connection it is presented on. Optional, black-box (`inject: []`): the
      # Recipe binds the produced Secret by name and key, so the value reaches the
      # engine's pods without passing through the rendered artifact and without
      # the developer choosing how it is delivered.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: []
          description: "Password the engine authenticates to the relational datastore this connection reaches with. When attached, the Recipe points the engine at the produced Secret so the value never appears in the rendered manifest. Unattached, the engine is configured with no password, which suits a store reached without one and matches what the standard-library relational Recipes leave in place when nothing is attached to them."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      console_enabled:
        type: boolean
        default: true
        description: Deploy the browser console beside the engine. The console reads the visibility index to list and inspect runs; the engine serves its gRPC API with or without it, so turning it off removes a browser surface rather than a capability.
      admin_tools_enabled:
        type: boolean
        default: true
        description: Deploy the administrative command-line image as a long-running pod an operator can exec into to inspect namespaces, describe a run, or apply a schema change. Turning it off removes that entry point; it serves no application traffic either way.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1
        max: 65535
        default: 7233
        description: Port the frontend service serves the gRPC API on. This is the address workers and clients dial, and the one the provides contract publishes. Most operators should omit this and let the Recipe assign the default (7233).
      console_port:
        type: integer
        min: 1
        max: 65535
        default: 8080
        description: Port the browser console listens on. It carries no application traffic; it exists so the console can be reached separately from the gRPC API.
      history_shards:
        type: integer
        min: 1
        default: 512
        description: How many shards the event history is partitioned across, which bounds how far the engine can scale out. It is fixed for the life of an installation — the engine cannot repartition an existing history, so raising it later requires a new installation. Size it for the load the installation is expected to reach rather than for its first day.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host and port address the frontend gRPC service, which is what a worker
      # or a client connects to; protocol is grpc rather than http because the
      # engine's own API is gRPC.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the engine's frontend. A
          worker or a client that starts a run points its connection target at
          this name together with `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port that frontend accepts client connections on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming a default.
      protocol:
        type: string
        description: >
          How the published address is spoken to — `grpc`, so a consumer
          configures one of the project's client libraries rather than an HTTP
          client.
      # Where Prometheus finds the engine's own metrics. Each of its services —
      # the frontend, history, matching and the internal worker, and the
      # internal frontend where it is switched on — runs in pods of its own and
      # serves them at /metrics on a container port named metrics, 9090, in
      # plain HTTP with no caller check; that listener serves the metrics and
      # nothing else. One address would reach one service, so a scraper
      # discovers the pods directly: one label selector matches the pods of
      # every service, and they share the port name. None of the keys carries
      # a namespace: a scraper reads where the target runs from its own
      # connection.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching the pods of every engine service,
          for a scraper that discovers those pods directly rather than scraping
          one address. Published beside `metrics_pod_port` and `metrics_path`.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `metrics`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "metadata_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
