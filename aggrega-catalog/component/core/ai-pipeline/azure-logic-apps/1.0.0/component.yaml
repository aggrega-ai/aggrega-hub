apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-pipeline/azure-logic-apps
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Logic Apps is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Logic Apps workflow on the Consumption plan: Microsoft's
    managed service that orchestrates a multi-step job, starting a run when
    a trigger fires, running each action in the order its definition gives,
    retrying an action that fails under the retry policy the action sets,
    or the service's default policy when it sets none, and keeping each
    run's history. The service runs every step itself, built-in
    operations and calls to other services alike; no worker or datastore of
    the application's own takes part, and it infers nothing itself. The
    workflow runs the definition values.definition declares, written in the
    Workflow Definition Language as Logic Apps' code view shows it. A
    Standard logic app, which runs in single-tenant Azure Logic Apps on a
    hosting plan of its own, is not this Component.

    The API connections a managed connector's action names, an integration
    account, and the identities the workflow calls other services as are the
    operator's, created outside the Release.

    The workflow publishes no address. A caller starts a run through the
    callback URL of a Request trigger, which carries a shared access
    signature the service generates, so the URL is a credential: the
    operator reads it from the workflow, through Azure Resource Manager's
    List Callback Url operation or the Azure portal, and delivers it to the
    caller outside the Release. A caller may also start a trigger through
    Azure Resource Manager's Run operation under its own Microsoft Entra ID
    identity, and a workflow on a recurrence or polling trigger starts its
    own runs. No backup is configured: the workflow holds its definition,
    which is written each time the Release deploys. Each Recipe's
    description says which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-pipeline
    # No pipeline.aggrega.ai/mode label: its values say who holds a run and
    # who executes its steps, reconciled for a run a cluster's controller
    # turns into workload and durable for one whose steps run on workers the
    # application deploys, and here the service holds the run and executes
    # every step itself, which neither value describes.
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # definition carries a default, so a bare `orders: {}` keeps a working
      # contract: a workflow with no trigger and no action, which never runs.
      #
      # The sections are those Microsoft's Workflow Definition Language
      # schema reference documents for a definition, each with the limits it
      # gives: $schema, the one schema version it names; contentVersion, four
      # numbers joined by periods, the form the language's published JSON
      # schema checks; at most 10 triggers, 10 outputs and 50 parameters;
      # each trigger, and each action at the top of the definition, named in
      # at most 80 characters, the limit the Logic Apps limits reference
      # gives, and holding its type. A parameter
      # holds its type and its default value, both of which the reference
      # documents as required, and an output its type and its value; a type
      # is one the reference lists, spelled as the reference does in lower case
      # (int, securestring, secureobject) or as the language's published JSON
      # schema does with a capital (Int, SecureString, SecureObject).
      definition:
        type: object
        default: {}
        properties:
          $schema:
            enum:
              - https://schema.management.azure.com/providers/Microsoft.Logic/schemas/2016-06-01/workflowdefinition.json#
            description: >
              The Workflow Definition Language schema the definition follows,
              written as Logic Apps writes it; unset, the service's own.
          contentVersion:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
            description: >
              The version number of the definition, four numbers joined by
              periods; unset, 1.0.0.0, the service's default.
          triggers:
            type: object
            maxProperties: 10
            propertyNames:
              maxLength: 80
            additionalProperties:
              type: object
              required:
                - type
            description: >
              The triggers that start a run, a map from each trigger's name
              to its definition: type, inputs, recurrence and the rest a
              trigger of that type takes.
          actions:
            type: object
            propertyNames:
              maxLength: 80
            additionalProperties:
              type: object
              required:
                - type
            description: >
              The actions a run executes, a map from each action's name to
              its definition: type, inputs, runAfter and the rest an action
              of that type takes, a scope, condition or loop holding its own
              actions.
          outputs:
            type: object
            maxProperties: 10
            additionalProperties:
              type: object
              required:
                - type
                - value
              properties:
                type:
                  type: string
                  enum: [int, float, string, securestring, bool, array, object, secureobject, Int, Float, String, SecureString, Bool, Array, Object, SecureObject]
            description: >
              The values a run returns when it finishes, a map from each
              output's name to its type and value.
          parameters:
            type: object
            maxProperties: 50
            additionalProperties:
              type: object
              required:
                - type
                - defaultValue
              properties:
                type:
                  type: string
                  enum: [int, float, string, securestring, bool, array, object, secureobject, Int, Float, String, SecureString, Bool, Array, Object, SecureObject]
                defaultValue:
                  type: [string, number, integer, boolean, array, object, "null"]
                allowedValues:
                  type: array
                metadata:
                  type: object
              additionalProperties: false
            description: >
              The definition's parameters, a map from each parameter's name to
              its type, its default value, and optionally the values it
              admits and its metadata; the workflow's triggers and actions
              read each one as parameters('<name>').
          staticResults:
            type: object
            additionalProperties:
              type: object
            description: >
              The mock results an action returns while its static result
              setting is on, a map from each result's name to its outputs and
              status, which the action names in its runtimeConfiguration.
        additionalProperties: false
        description: >
          The workflow's definition, written in the Workflow Definition
          Language as Logic Apps' code view shows the definition object: its
          triggers, actions, outputs, parameters and static results, and
          optionally $schema and contentVersion. Expressions the workflow
          evaluates when it runs, @-prefixed or inside @{ }, are written as the
          language writes them and reach the service as written. Microsoft's
          Workflow Definition Language schema reference documents these
          sections, at most 10 triggers, 10 outputs and 50 parameters, a
          parameter's type and default value as required and an output's type
          and value; a definition outside that shape halts the build, naming
          this key. Left empty, the workflow has no trigger and no action.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    # No provides: the workflow publishes no address. A Request trigger's
    # callback URL carries a shared access signature, a credential the
    # service generates, and the workflow's access endpoint starts no run on
    # its own.
