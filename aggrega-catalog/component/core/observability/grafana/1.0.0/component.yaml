apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/grafana
  version: 1.0.0
  description: >
    A Grafana dashboards and visualization server. Grafana renders operational
    dashboards over its query and web endpoint and keeps its own state — users,
    saved dashboards, preferences — in a local database, so it renders as a
    server backed by a persistent volume. An admin account is always present:
    its username is a developer value and its password is wired through the
    optional `admin_password` credential slot. When a credential is attached its
    value becomes the admin password; when none is attached the Recipe supplies a
    deterministic development default, so the render stays byte-identical across
    runs rather than depending on a server-generated random password. This
    component ships standalone: wiring a metrics or logs source (such as a
    Prometheus server) into Grafana as a provisioned datasource is a future
    refinement not yet modelled here. Provider-agnostic: the same component is
    implemented by a Helm Recipe (Bitnami chart on Kubernetes) and a Compose
    Recipe (local development). Exports its web endpoint host and port to
    consumers via the uses topology. The packaged Grafana server is AGPL-3.0.
  license: AGPL-3.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: observability
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved credential values
  # into the env delivery mechanism.
  inject: [env]
  secretsSchema:
    # Optional admin-password credential slot. The Grafana admin account is
    # always present; when a deployment attaches a credential here, the Recipe
    # wires its value as the admin password through the credential subsystem.
    # When unattached, the Recipe falls back to a deterministic inline
    # development default rather than letting Grafana generate a random password
    # (which would make the rendered output non-deterministic). `required`
    # omitted → optional, so a bare `dashboards: {}` deployment still loads.
    # Transparent (inject: [env]) so the injected value reaches the Recipe on the
    # env pipe; the selector is secret-kind-pinned but family-agnostic so either
    # an inject-value or a referenceable credential may fill it.
    admin_password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional Grafana admin-password credential. When attached, supplies the admin password via the credential subsystem; unattached, the Recipe uses a deterministic development default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      admin_user:
        type: string
        default: admin
        description: Grafana admin account username. The account is always created; its password is wired through the optional `admin_password` credential slot.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3000
        description: HTTP port the Grafana web and query endpoint listens on. Most operators should omit this and let the Recipe assign the default (3000).
      engine_version:
        type: string
        default: "12.1.1"
        description: Grafana container image tag. Selects the image tag on container targets; the chart-backed target pins its own image tag.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing Grafana's local state (users, dashboards, preferences).
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
