apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/google-cloud-observability
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Google Cloud Observability is
  # a hosted service the reader contracts for with Google, under Google
  # Cloud's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the Telemetry API takes follows Google's "Telemetry (OTLP) API
  # overview": the OpenTelemetry Protocol over HTTP at the root URL of a
  # global endpoint, telemetry.googleapis.com, or of a regional one,
  # telemetry.<region>.rep.googleapis.com, to which an exporter appends
  # /v1/traces, /v1/metrics or /v1/logs; exporters configured "with the
  # credentials necessary to send data to your Google Cloud project", a
  # collector through its googleclientauth extension; and the Cloud
  # Telemetry Writer role for the identity that writes.
  description: >
    Google Cloud Observability's Telemetry API, reached as an external
    reference: no compute runs and nothing is provisioned. The Telemetry API
    receives the traces, metrics and logs a workload or a collector sends
    over the OpenTelemetry Protocol (OTLP) over HTTP, and Google Cloud
    Observability stores what it accepts.

    The operator supplies the API's address in the Release: the global
    endpoint, https://telemetry.googleapis.com, or a regional one,
    https://telemetry.<region>.rep.googleapis.com. A consumer reads it over a
    uses edge and appends the signal's path, /v1/traces, /v1/metrics or
    /v1/logs, as an OTLP HTTP exporter does.

    Authentication is the consumer's concern: every request carries Google
    credentials for an identity holding the Cloud Telemetry Writer role on
    the project, which a collector sends through its googleclientauth
    extension and an application through Application Default Credentials,
    and no credential comes from this realization. The service keeps the
    telemetry, and the component holds no data of its own, so no backup is
    configured.
  labels:
    # A service the Release sends to rather than runs: nothing in the Release
    # serves it, so the operational primitive is a resource.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: observability
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
    # No observability.aggrega.ai/<signal> label. That label states that a
    # component receives a signal pushed to it over OTLP at an address it
    # publishes, and the catalog's OpenTelemetry Collector, which selects on
    # it, writes for each target it selects an OTLP exporter carrying no
    # credential and no header. The Telemetry API takes OTLP only from a
    # sender presenting Google credentials, so that collector cannot send to
    # it, and a sender holding a Google identity of its own reads the
    # endpoint below instead.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values are declared: the Telemetry API holds no setting a developer
  # chooses for the application. Which endpoint is reached is the operator's,
  # under infra.endpoint.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # The global endpoint and each regional one differ in where Google Cloud
      # Observability processes the data, which is the operator's choice, so
      # the address is operator-supplied rather than a fixed host.
      endpoint:
        type: string
        description: >
          Root URL of the Telemetry API a consumer sends OTLP to, with no
          signal path: https://telemetry.googleapis.com, or
          https://telemetry.<region>.rep.googleapis.com for a region Google
          offers.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Root URL of the Telemetry API, as the Release supplies it, to which
          a consumer's OTLP HTTP exporter appends /v1/traces, /v1/metrics or
          /v1/logs. Each request carries the consumer's own Google
          credentials.
