apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/thanos-store
  version: 1.0.0
  license: Apache-2.0
  description: >
    Thanos Store Gateway, the read side of a Thanos metrics stack. The Store
    Gateway reads historical metric blocks from an S3-compatible object store and
    serves them to queriers over its StoreAPI on a gRPC port. The object store it
    reads from is wired through its `objstore` uses-socket: the store's host and
    port arrive on the injection context and compose the S3 endpoint in the
    object-store configuration. Credentials reach the process as environment
    variables through the AWS SDK credential chain rather than being embedded in
    that configuration, so the rendered configuration carries no secret. The Store
    Gateway keeps only an ephemeral local cache of index data — the object store is
    the system of record — so it renders as a stateless server. Exports its
    StoreAPI host, port, and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The S3-compatible object store the Store Gateway reads metric blocks from.
    # The selected component's provides host and port arrive on the injection
    # context and compose the S3 endpoint in the object-store configuration.
    objstore:
      selector: "component.aggrega.ai/type=server"
      inject: [env]
      required: true
      # A statement about this connection's target, authored on the connection:
      # the object store it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the object store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The S3 secret key is held on the connection it is presented on: it is
      # the secret half of the access key the Store Gateway authenticates to
      # this object store with. When attached, the Recipe supplies it as an env
      # secret; when unattached, the Recipe falls back to its inline development
      # default, and a connection carrying none renders byte-identically to one
      # with no slot at all. Transparent (inject: [env]) so the injected value
      # reaches the Recipe on the env pipe.
      # To replace the Recipe's development default, attach core/random-password
      # on the connection: the cluster generates it, and the store takes the same
      # credential by core/referenced-secret.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional S3 secret key the Store Gateway presents to the object store this connection reaches. When attached, supplies the object-store secret access key via the credential subsystem; unattached, the Recipe uses an inline development default."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      s3_access_key:
        type: string
        default: admin
        description: S3 access-key identity used against the object store. Its secret is the optional `credential` the `objstore` connection carries.
      bucket:
        type: string
        default: thanos
        description: Object-store bucket the Store Gateway reads metric blocks from. The bucket must be pre-created out of band; the read tier does not provision it.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      http_port:
        type: integer
        min: 1024
        max: 65535
        default: 10902
        description: HTTP port serving health and metrics endpoints, reachable in-cluster only.
      grpc_port:
        type: integer
        min: 1024
        max: 65535
        default: 10901
        description: gRPC port serving the StoreAPI; queriers connect here.
      engine_version:
        type: string
        default: "v0.42.0"
        description: Thanos container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service the gateway serves historical
          metric blocks on. A query front end adds this name to its store list
          together with `port`.
      port:
        type: integer
        required: true
        description: TCP port the store API is served on. It carries the gRPC port an operator set, never the health-and-metrics HTTP port.
      protocol:
        type: string
        description: How the published address is spoken to — `grpc`, so a query front end dials it as a store rather than as an HTTP endpoint.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "objstore" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
