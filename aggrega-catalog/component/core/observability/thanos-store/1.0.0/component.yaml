apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/thanos-store
  version: 1.0.0
  license: Apache-2.0
  description: >
    Thanos Store Gateway, the read side of a Thanos metrics stack. The Store
    Gateway reads historical metric blocks from an S3-compatible object store and
    serves them to queriers over its StoreAPI on a gRPC port. The object store it
    reads from is wired through its `objstore` uses-socket: the store's host and
    port arrive on the injection context and compose the S3 endpoint in the
    object-store configuration. Credentials reach the process as environment
    variables through the AWS SDK credential chain rather than being embedded in
    that configuration, so the rendered configuration carries no secret. The Store
    Gateway keeps only an ephemeral local cache of index data — the object store is
    the system of record — so it renders as a stateless server. Exports its
    StoreAPI host, port, and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The S3-compatible object store the Store Gateway reads metric blocks from.
    # The selected component's provides host and port arrive on the injection
    # context and compose the S3 endpoint in the object-store configuration.
    objstore:
      selector: "component.aggrega.ai/type=server"
      inject: [env]
      required: true

  featuresSchema:
    # Optional object-store secret-key credential slot. When attached, supplies
    # the S3 secret access key via the credential subsystem as an env secret;
    # when unattached, the Recipe falls back to its inline development default.
    # `required` omitted → optional, so with no credential attached it still
    # loads and renders byte-identically. Transparent (inject: [env]) so
    # the injected value reaches the Recipe on the env pipe.
    s3_secret_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional S3 secret-key credential. When attached, supplies the object-store secret access key via the credential subsystem; unattached, the Recipe uses an inline development default."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      s3_access_key:
        type: string
        default: admin
        description: S3 access-key identity used against the object store. Its secret is wired through the optional `s3_secret_key` credential slot.
      bucket:
        type: string
        default: thanos
        description: Object-store bucket the Store Gateway reads metric blocks from. The bucket must be pre-created out of band; the read tier does not provision it.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      http_port:
        type: integer
        min: 1024
        max: 65535
        default: 10902
        description: HTTP port serving health and metrics endpoints, reachable in-cluster only.
      grpc_port:
        type: integer
        min: 1024
        max: 65535
        default: 10901
        description: gRPC port serving the StoreAPI; queriers connect here.
      engine_version:
        type: string
        default: "v0.42.0"
        description: Thanos container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
