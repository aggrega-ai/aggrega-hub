apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/jaeger
  version: 1.0.0
  license: Apache-2.0
  description: >
    A Jaeger distributed-tracing backend in its single-node shape. Jaeger
    receives trace spans over the OpenTelemetry protocol, keeps them in a local
    embedded key-value trace store, and serves trace-lookup and search queries
    over its query UI. Every Jaeger subsystem — the OTLP receiver, the storage
    writer, and the query service — runs inside one process backed by a local
    on-disk store, so it renders as a single stateful server with a data volume
    rather than a set of microservices. Its primary contract to consumers is the
    OTLP gRPC receiver: a trace producer wires to it and pushes spans there. The
    OTLP HTTP receiver and the query UI are exposed on their own ports.
    Realized on Kubernetes via its Helm Recipe, which synthesizes the workload
    directly from the official Jaeger image; helm-only. Exports its OTLP gRPC
    receiver host and port to consumers via the uses topology, and carries
    `observability.aggrega.ai/traces: otlp-grpc`, so an OpenTelemetry
    Collector's `traces` socket takes it and exports spans to that receiver. The
    packaged Jaeger server is Apache-2.0.

    With `values.metrics_enabled` true the Recipe has Jaeger serve its own
    metrics, at /metrics on port 8888, on every interface rather than its
    loopback address, and publishes that address as `metrics_endpoint`; false,
    that key is empty. The port checks no caller.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
    # Signal: Jaeger's OTLP gRPC receiver answers at the host and port this
    # component publishes, so it carries traces: otlp-grpc. An OpenTelemetry
    # Collector's traces socket selects the key and writes a gRPC exporter to
    # that address. Jaeger also receives OTLP over HTTP on its own port, which
    # it does not publish; the value names the protocol at the published
    # address. It names what the server receives, not a configured state: the
    # receiver is on whether or not a collector is wired to it.
    observability.aggrega.ai/traces: otlp-grpc
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Jaeger's own metrics, in the Prometheus format: the internal telemetry
      # of the OpenTelemetry Collector Jaeger is built on, which it serves as
      # the collector does, at /metrics on port 8888, but by default on its
      # loopback address alone, where nothing outside the
      # container can read them. With this value true the Recipe's configuration
      # listens on every interface instead, on the same port and with the same
      # metric names, a listener serving the metrics and nothing else and
      # checking no caller, and the port joins the Recipe's ClusterIP Service.
      metrics_enabled:
        type: boolean
        default: false
        description: Makes Jaeger's own metrics, served at /metrics on port 8888, reachable on every interface rather than its loopback address alone, and publishes their address as `metrics_endpoint`; while false that key is empty. The port checks no caller, so anything that reaches it can read them.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "2.19.0"
        description: Jaeger server image tag. Pins the packaged Jaeger version the workload references.
      otlp_grpc_port:
        type: integer
        default: 4317
        description: Port for the OTLP gRPC trace receiver — the primary ingestion endpoint trace producers push spans to.
      otlp_http_port:
        type: integer
        default: 4318
        description: Port for the OTLP HTTP trace receiver.
      query_port:
        type: integer
        default: 16686
        description: Port for the Jaeger query UI and its trace-lookup API.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing the embedded on-disk trace store.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service receiving trace spans. An
          application exporting spans points its exporter at this name
          together with `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port spans are ingested on. It carries the OpenTelemetry gRPC
          receiver port, not the query UI port, so a consumer wires its
          exporter rather than its browser.
      protocol:
        type: string
        description: How the published address is spoken to — `grpc`, so an exporter is configured for the gRPC transport rather than the HTTP one.
      # The address a Prometheus server scrapes Jaeger's own metrics at, while
      # values.metrics_enabled is true: /metrics on port 8888 of the name the
      # Recipe's Service carries. The Recipe publishes it spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:8888/metrics`, the host
          being the tracing backend's Service name. Empty while
          values.metrics_enabled is false.
