apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/otel-collector
  version: 1.0.0
  license: Apache-2.0
  description: >
    The OpenTelemetry Collector, in its contrib distribution: a stateless server
    that receives traces, metrics and logs over the OpenTelemetry protocol
    (OTLP), on a gRPC port and an HTTP port, and runs each signal through a
    pipeline of its own. A producer points its OTLP exporter at the endpoint the
    collector publishes for the transport it speaks.

    Every signal always has a pipeline fed by the OTLP receiver. A backend wired
    to the signal's socket — `traces`, `metrics` or `logs`, each taking the
    components labelled `observability.aggrega.ai/<signal>` — adds one exporter
    to that pipeline, for the protocol the label names. A Prometheus is reached
    only with its `values.otlp_receiver` true; the build halts otherwise, naming
    that line. A signal with nothing wired ends in the collector's debug
    exporter at basic verbosity: what arrives is summarised in the collector's
    own log, one line per batch, and sent nowhere else. A producer is not
    refused for want of a backend, and what it sends is not dropped unseen.

    Realized on helm by `otel-collector-chart`, which renders the project's own
    Helm chart and needs its chart repository reachable at build time, and on
    compose by `otel-collector`, a compose service publishing nothing to the
    host. Both run the same image with the same configuration, written once in
    the OtelCollectorConfig bundle they import.

    With `values.metrics_enabled` true the collector serves its own telemetry
    metrics, at /metrics on port 8888, on every interface rather than its
    loopback address, and publishes that address as `metrics_endpoint`; false,
    that key is empty. The port checks no caller. On helm it joins a ClusterIP
    Service, and another Service type halts the build.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The collector holds no durable state: what it receives passes through its
  # pipelines in memory and leaves through an exporter, so it renders as a
  # stateless server with no data volume.
  #
  # Its configuration is the receivers, processors, exporters and pipelines it
  # runs, written once in the OtelCollectorConfig artifact bundle every Recipe of
  # this component imports. The OTLP receiver listens on the two ports below. A
  # pipeline for traces, one for metrics and one for logs are always present,
  # each fed by that receiver through a memory limiter and a batch processor.
  # Each ends in one exporter for every backend wired to its signal's socket
  # below, or, with nothing wired there, in the debug exporter at basic
  # verbosity, which writes one line per batch to the collector's log naming
  # the signal and how many records arrived, and sends them nowhere else.
  usesSchema:
    # One socket per signal, each optional and each taking as many connections
    # as the Release wires, so one collector can send a signal to several
    # backends at once. Each selects its label's key alone, the
    # observability.aggrega.ai/<signal> label a component carries when it
    # receives that signal, so it takes every component receiving the signal
    # whatever the protocol, and a component receiving another signal only is
    # refused by the selector before anything renders. The label's value names
    # the protocol the target receives the signal on, and the configuration
    # bundle writes the exporter for it: otlp-grpc, an exporter to the host and
    # port the target publishes; otlp-http, one to the otlp_http_endpoint it
    # publishes. A value the bundle writes no exporter for, or a target
    # publishing no address, halts the build naming the connection.
    #
    # Trace stores receiving OTLP over gRPC: core/observability/tempo and
    # core/observability/jaeger.
    traces:
      selector: "observability.aggrega.ai/traces"
    # core/observability/prometheus, over OTLP HTTP. Prometheus receives pushed
    # metrics only with its OTLP receiver on, which its values.otlp_receiver
    # turns on and which is off by default; while it is off the server
    # publishes an empty otlp_http_endpoint, and a connection to it halts the
    # build, naming that line.
    metrics:
      selector: "observability.aggrega.ai/metrics"
    # core/observability/loki, over OTLP HTTP at its /otlp path.
    logs:
      selector: "observability.aggrega.ai/logs"

  schema:
    values:
      # The collector's own telemetry metrics, in the Prometheus format: its
      # internal telemetry, about the collector itself, not the metrics signal
      # the metrics socket above forwards to a backend. The collector serves
      # these at /metrics on port 8888 by default, but on its loopback address
      # alone, where nothing outside it can read them.
      # With this value true the configuration bundle listens on every interface
      # instead, on the same port and with the same metric names, a listener
      # serving the metrics and nothing else and checking no caller. On helm the
      # port then joins the collector's Service, which must stay ClusterIP: the
      # chart Recipe halts the build when infra.overrides.service_type names
      # another type, since that Service carries every port the chart enables.
      # The OTLP ports must then differ from 8888, which the bundle checks.
      metrics_enabled:
        type: boolean
        default: false
        description: Makes the collector's own telemetry metrics, served at /metrics on port 8888, reachable on every interface rather than its loopback address alone, and publishes their address as `metrics_endpoint`; while false that key is empty. These describe the collector itself, not the metrics it forwards. The port checks no caller, so anything that reaches it can read them.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # Both Recipes run otel/opentelemetry-collector-contrib at this tag: the
      # compose Recipe in its image reference and the chart Recipe in the image
      # tag its value mapping sets, so the one value selects the release on either
      # target. The chart version the chart Recipe pulls is the one whose
      # appVersion is this release.
      engine_version:
        type: string
        default: "0.162.0"
        description: Tag of the otel/opentelemetry-collector-contrib image both Recipes run. The configuration is written for 0.162.0; another release may name a component differently.
      # Read by the chart Recipe alone; the compose Recipe pulls no source
      # artifact.
      source_version:
        type: string
        description: Version of the opentelemetry-collector Helm chart the chart-backed realization pulls. Read only by that realization; the compose realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      # The OTLP receiver's two listeners. Each also names the container port and
      # the Service port the Recipes publish, so the listener and the published
      # address move together. They must differ from each other and from 13133,
      # where the collector's health check listens; the configuration bundle
      # stops the build otherwise. The image runs as an unprivileged user, so a
      # port below 1024 is refused here rather than failing to bind at start.
      otlp_grpc_port:
        type: integer
        min: 1024
        max: 65535
        default: 4317
        description: Port the OTLP receiver accepts gRPC on — the port published as `port` and in `endpoint`.
      otlp_http_port:
        type: integer
        min: 1024
        max: 65535
        default: 4318
        description: Port the OTLP receiver accepts HTTP on — the port published as `otlp_http_port` and in `otlp_http_endpoint`.
      # The memory limiter in every pipeline takes its limit as a share of the
      # memory limit set here, and the chart also gives the Go runtime a soft
      # limit below it. The defaults are the limits the project's own Helm chart
      # gives as its example.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol describe the OTLP gRPC listener, the same three
      # keys a trace server receiving OTLP publishes, so a producer wired to the
      # collector reads what it would read wired to the server directly. The
      # endpoints are the base addresses an OTLP exporter is configured with:
      # plain http:// on both, the receiver serving no TLS.
      host:
        type: string
        required: true
        description: >
          Name the collector is reached at — the in-cluster Service on helm, the
          service name on compose. A producer points its exporter at this name
          together with `port`.
      port:
        type: integer
        required: true
        description: TCP port the OTLP receiver accepts gRPC on.
      protocol:
        type: string
        description: How the published address is spoken to — `grpc`, so an exporter is configured for the gRPC transport.
      endpoint:
        type: string
        description: >
          The OTLP gRPC endpoint as an exporter takes it — `http://<host>:<port>`,
          the scheme saying the connection is not encrypted.
      otlp_http_port:
        type: integer
        description: TCP port the OTLP receiver accepts HTTP on.
      otlp_http_endpoint:
        type: string
        description: >
          The OTLP HTTP endpoint as an exporter takes it —
          `http://<host>:<otlp_http_port>`. An exporter given this base address
          appends the path for each signal itself, such as `/v1/traces`.
      # The address a Prometheus server scrapes the collector's own telemetry
      # metrics at, while values.metrics_enabled is true: /metrics on port 8888
      # of the name each Recipe publishes as host. Every Recipe publishes it
      # spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes the collector's own telemetry
          metrics at — scheme, host, port and path,
          `http://<host>:8888/metrics`, the host being the one published as
          `host`. Empty while values.metrics_enabled is false.
