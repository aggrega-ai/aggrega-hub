apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/langfuse
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and no single identifier
  # covers this one: the platform is published open-core, so which terms apply
  # depends on which part an installation uses, and the published container images
  # declare no single licence of their own. The class that situation falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below, and
  # the licence of the artifact each Recipe actually pins is named on that
  # Recipe, which is the surface that knows which artifact it pinned.
  description: >
    A self-hosted tracing and evaluation platform for language-model
    applications, and the home a team keeps its prompts in. An application sends
    a trace per request, carrying the version of the prompt that produced it,
    and fetches versioned prompts at run time over the platform's own API; the
    platform ingests OpenTelemetry spans as well as its own client libraries.
    Exports its console host, port, endpoint and protocol to consumers.

    It keeps none of its own durable state. The relational backend, the
    Redis-compatible cache and the S3-compatible object store are wired as
    topology edges; the columnar analytics store holding the traces is supplied
    as pointer strings — its address, migration address, user and database —
    which carry no default, and the build halts until both addresses are set.

    On Kubernetes there are two realizations and the Manifest chooses between
    them. `langfuse` synthesizes the console and the asynchronous worker as one
    Deployment and fetches nothing, so it is the one to reach for where the
    build must complete with no chart repository reachable. `langfuse-chart`
    renders the platform maintainers' own Helm chart, which puts the console and
    the worker in separate Deployments and adds the platform's schema-migration
    switches, so reach for it where a chart repository is reachable at build
    time and the two will be scaled independently.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: observability
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: a consumer that sends traces here may inject this
  # component's own provides keys into the env delivery mechanism.
  inject: [env]

  # Its identity is a browser console plus an ingestion API, and it keeps none
  # of its own durable state: four backing systems do. The first three, below,
  # are wired as topology edges to components the Aggregate already declares;
  # the fourth, the columnar analytics store, is supplied as pointer strings in
  # infra.
  usesSchema:
    # The relational backend holding organizations, projects, users and the
    # prompt registry. The selected component's provides host, port, user and
    # database arrive on the injection context under the names the platform
    # itself reads, so the Recipe passes them through rather than composing a
    # connection string — which is also what keeps the backend password out of
    # the rendered artifact, since a password embedded in a URL cannot be
    # delivered as a secret reference.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      # A statement about this connection's target, authored on the connection:
      # the backend it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the relational backend this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The password the platform presents to this backend, held on the
      # connection it is presented on. Optional and transparent (inject: [env]
      # so the synthesized Workload may reference it as an env secret); the
      # selector is secret-kind-pinned but family-agnostic. Unattached, the
      # Recipe emits a deterministic development default, as the credential's
      # description says.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Password the platform authenticates to the relational backend this connection reaches with, delivered as an env secret reference so the value never appears in the rendered manifest. Unattached, helm/langfuse and helm/langfuse-chart emit the development literal `apppass`, the default the standard-library relational Recipes leave in place, which is what makes a Release with nothing attached render and run; this catalog publishes it, so every Release that leaves the slot unattached shares that password."
    # The Redis-compatible cache carrying the ingestion queue. The console
    # accepts an event and enqueues it here; the asynchronous worker drains the
    # queue and writes to the analytics store, which is why the queue is a
    # required part of the platform rather than an optimization. A cache
    # publishing protocol valkey-tls or redis-tls is reached over TLS, the console and the
    # worker checking its certificate and the name dialed against the
    # authority in server_ca where one is attached, and against the runtime's
    # own trust store where not; a cache publishing another value served over
    # TLS halts the build, naming the connection.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # A key prefix scoping this platform's keys on the connection, so one
        # cache may carry more than one tenant. The prefix is a property of the
        # connection rather than of either component.
        key_prefix:
          type: string
          default: ""
          description: Key prefix the platform applies to every key it writes on this connection. Leave it empty on a cache this platform has to itself; set it to keep two tenants apart on one shared cache.
        # A statement about this connection's target, authored on the
        # connection: the cache it reaches takes no credential. It changes
        # nothing this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the cache this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The password the platform presents to this cache, held on the connection
      # it is presented on. Optional and transparent; unattached, no cache
      # credential is emitted at all.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional password the platform authenticates to the cache this connection reaches with. Unattached, no cache credential is emitted at all, which matches the standard-library Redis-compatible Recipes: those leave authentication off unless a credential is attached to them, and emitting a password against a cache that wants none would fail the connection."
        # The authority the console and the worker check the cache's
        # certificate against, for a cache whose certificate an authority the
        # image does not already trust signs. Secret-kind-pinned because a
        # referenceable Secret is what the Recipe mounts, and so marked
        # sensitive as every secret-kind slot is, though the authority's
        # certificate is not itself secret; delivered as a file.
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the console and the worker check the cache's certificate against while the cache publishes protocol valkey-tls or redis-tls, where the image does not already trust the authority that signs it. Its Secret holds ca.crt. The Recipe mounts the whole Secret read-only into both and points the cache client at the file. The build halts on a server_ca publishing no Secret name, and on one wired to a cache served without TLS. Fill it with core/referenced-secret."
    # The S3-compatible object store holding raw event bodies and uploaded
    # media. Every ingested event body is written here before the worker reads
    # it back, so an installation without an object store loses ingestion rather
    # than losing a feature. The platform's S3 client is pointed at the endpoint
    # the selected store publishes, scheme included, and a store publishing none
    # halts the build. The selector admits a storage resource, an object store,
    # and refuses a backup controller, which the catalog files under storage
    # too but types server.
    event_store:
      selector: "component.aggrega.ai/type=resource,component.aggrega.ai/category=storage"
      inject: [env]
      required: true
      valueSchema:
        # The bucket, the region and the two key prefixes are properties of this
        # connection: the same store serves a different platform by wiring a
        # different bucket. A store that publishes the one bucket it holds must
        # publish this one, or the build halts naming both.
        bucket:
          type: string
          required: true
          description: Bucket the platform writes event bodies and media into. It must already exist on the target store — the platform writes objects, it does not create buckets. Where the store publishes a bucket of its own, this names the same one, or the build halts.
        region:
          type: string
          default: us-east-1
          description: Region name the platform's S3 client signs requests with. An S3-compatible store that has no regions still needs a value here, and any value it accepts will do.
        event_prefix:
          type: string
          default: events/
          description: Key prefix raw event bodies are written under.
        media_prefix:
          type: string
          default: media/
          description: Key prefix uploaded media is written under.
        access_key_id:
          type: string
          required: true
          description: Access-key identifier the platform authenticates to the store with. The identifier names a credential rather than being one, so it is stated here; its secret half is the credential this connection carries.
        force_path_style:
          type: boolean
          default: true
          description: Address buckets as a path segment rather than a hostname prefix. Self-hosted S3-compatible stores generally require the path form; a store reached by virtual-hosted style takes false.
        # A statement about this connection's target, authored on the
        # connection: the object store it reaches takes no credential. The
        # secret key has no default, so this is what lets a connection carrying
        # none build; it changes nothing else this component renders.
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the object store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. A connection carrying neither a credential nor this value halts the build; with this value set and no credential, no secret key is presented. It changes nothing else this component renders.
      # The secret half of the access key the platform presents to this object
      # store, held on the connection it is presented on beside the identifier
      # half above. Transparent (inject: [env]). It has no development default:
      # a connection with nothing in credential halts the build, naming it,
      # unless it declares unauthenticated.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Secret half of the access key the platform authenticates to the object store this connection reaches with; its identifier half is this connection's access_key_id. There is no default: the build halts when nothing fills this slot, unless the connection's values set unauthenticated: true."

  featuresSchema:
    # Every slot below is transparent (inject: [env] so the synthesized Workload
    # may reference it as an env secret) and, but for the encryption key, the
    # session secret and the salt, optional (`required` omitted). The selector
    # is secret-kind-pinned but family-agnostic, so any credential Feature of
    # the secret kind may fill any of them.
    #
    # The encryption key, the session secret and the salt are the exceptions:
    # each is required and has no default, so a build with nothing in one of
    # those slots halts naming it. A key every reader of this catalog holds
    # would make every stored provider credential readable to anyone with a
    # copy of the database, or let anyone mint a console session for any user,
    # and a published salt would be the one every installation hashes its API
    # keys with.
    #
    # The analytics-store password stays a slot of the Component: the analytics
    # store is supplied as pointer strings rather than wired as a connection, so
    # there is no connection for it to be held on.
    analytics_store_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Password the platform authenticates to the columnar analytics store with. Unattached, no analytics-store password is emitted, which suits a store reachable without one; a managed store almost always needs this slot filled."
    session_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required signing key for the browser session cookies the console issues. Anyone who knows it can mint a session for any user. There is no default: the build halts when nothing fills this slot."
    encryption_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required key the platform encrypts stored provider credentials and integration secrets under, as 64 hexadecimal characters (generate one with openssl rand -hex 32). Rotating it makes everything already encrypted unreadable, so it is set once, before the platform first starts, and kept. There is no default: the build halts when nothing fills this slot."
    salt:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      required: true
      description: "Required salt the platform hashes API keys with before storing them. It is fixed for the life of an installation — changing it invalidates every API key already issued. There is no default: the build halts when nothing fills this slot."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      experimental_features:
        type: boolean
        default: false
        description: Make the platform's experimental console features reachable. They are unfinished by the upstream's own account, so leave this off where other people depend on the platform.
      otel_max_body_bytes:
        type: integer
        min: 1048576
        default: 5242880
        description: Largest OpenTelemetry ingestion request body the platform accepts, in bytes. A tracing client that batches aggressively needs this raised; the value bounds one request, not a trace.
      media_upload_enabled:
        type: boolean
        default: true
        description: Accept media referenced by an ingested trace — an image or an audio clip a request carried — and store it in the object store beside the event bodies. Turned off, traces still ingest and their media references are dropped.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # Both realizations probe the platform's own health and readiness
      # endpoints, so a rollout reports the console ready only once it answers.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3000
        description: Port the console and the ingestion API listen on. Most operators should omit this and let the Recipe assign the default (3000).
      worker_port:
        type: integer
        min: 1024
        max: 65535
        default: 3030
        description: Port the asynchronous worker exposes its own health endpoint on. It serves no application traffic; it exists so the platform's readiness can be observed separately from the console's.
      engine_version:
        type: string
        default: "4.22.0"
        description: Platform image tag. Selects the tag on both the console container and the worker container, which are versioned together and must not be split across versions; the chart-backed realization pins its own tag, on a setting that moves both at once for the same reason.
      # `langfuse` synthesizes the console and the asynchronous worker as one
      # Deployment reading one set of backing systems. `langfuse-chart` puts them
      # in separate Deployments — they have unrelated load profiles, and only
      # separate Deployments let an operator scale or restart one without the
      # other — and adds the platform's own schema-migration switches.
      source_version:
        type: string
        description: Version of the Helm chart the chart-backed realization pulls. Read only by that realization; the workload-synthesis realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 2Gi
      worker_compute:
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 2Gi
      external_base_url:
        type: string
        description: Externally reachable base URL of the console, as assembled at the ingress tier. The console composes the links it puts in an email and the address it redirects a browser to after sign-in from this, so a shared link resolves from outside the cluster. Omitted, the Recipe falls back to the in-cluster address, which is correct for an installation nobody reaches from a browser outside the cluster.
      # The analytics store is supplied as deterministic pointer strings the
      # runtime resolves — its address, its migration address, its user and its
      # database — because a Release typically reaches a columnar store it does
      # not run itself.
      analytics_store_url:
        type: string
        description: HTTP address of the columnar analytics store holding traces, observations and scores. A deterministic pointer string the runtime resolves; the compiler never connects to it. It carries no default because the console has nothing to read without one, and the Kubernetes realization refuses to render until it is set — a build that has not supplied it halts with a diagnostic naming this value, rather than emitting a console with an address-less variable that starts and stays empty.
      analytics_store_migration_url:
        type: string
        description: Native-protocol address of the same analytics store, which the platform applies its schema migrations over. It is a separate value from the HTTP address because the two use different ports and different protocols on the same store. A deterministic pointer string the runtime resolves, and the Kubernetes realization refuses to render until it is set, on the same terms as the HTTP address above.
      analytics_store_user:
        type: string
        default: default
        description: User the platform authenticates to the analytics store as.
      analytics_store_database:
        type: string
        default: default
        description: Database within the analytics store the platform reads and writes.
      analytics_store_cluster:
        type: boolean
        default: false
        description: Treat the analytics store as a multi-node cluster, which changes the statements the platform's migrations issue. A single-node store takes false.
      log_level:
        type: string
        enum: [trace, debug, info, warn, error, fatal]
        default: info
        description: Log verbosity of both containers.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol are the shape every server component publishes;
      # endpoint is the base URL a tracing client points at.
      #
      # An application sends a trace per request — the prompt that went out, the
      # completion that came back, the latency, the token counts and the cost —
      # and the platform stores, indexes and charts them; the same trace carries
      # the version of the prompt that produced it, so a prompt in the registry
      # and the behaviour it caused are one record rather than two. Prompts are
      # versioned and labelled in the platform and fetched by an application at
      # run time over the platform's own API, which is what lets a prompt change
      # without a redeploy. It ingests OpenTelemetry spans as well as its own
      # client libraries, so a workload already emitting spans points them here.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the console and the
          ingestion API. A consumer that composes its own address dials this
          name; one that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts console and ingestion requests on. It
          carries the platform port an operator set, never the worker's health
          port.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the ingestion API, with the host and the port
          already composed. An application hands it to one of the platform's
          client libraries as the address it sends traces to.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "backend" "cache" "event_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
