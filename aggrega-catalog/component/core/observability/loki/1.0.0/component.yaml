apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/loki
  version: 1.0.0
  description: >
    A Grafana Loki log-aggregation server. Loki receives log streams from
    shippers and agents over its HTTP push API, indexes them by label rather
    than by full-text content, stores them in a chunk object store, and answers
    log-query and range requests over the same HTTP API. This component models
    Loki in its single-binary shape: every Loki subsystem — distributor,
    ingester, querier, compactor — runs inside one process backed by a local
    filesystem chunk store, so it renders as a single stateful server with a
    data volume rather than a set of microservices. Its contract to consumers is
    that HTTP endpoint: a log shipper pushes streams to it, and a dashboards
    server reads them back over the query API. Realized on Kubernetes via its
    Helm Recipe, which wraps the official Grafana Loki chart; helm-only. Exports
    its in-cluster service host and port to consumers via the uses topology. The
    packaged Loki server is AGPL-3.0.
  license: AGPL-3.0
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      retention_period:
        type: string
        default: "168h"
        description: How long stored log streams are kept before the in-process compactor deletes them. Expressed as a Go duration (e.g. `168h` for seven days).
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing the Loki single-binary chunk store.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
