apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/cloudwatch
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon CloudWatch Logs is a
  # hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The log group's behaviour follows the Amazon CloudWatch Logs API
  # Reference: CreateLogGroup (a name unique within its account and Region,
  # events kept with no expiry until a retention period is set, encryption
  # with a KMS key where one is associated), PutRetentionPolicy and the
  # LogGroup type (the retention periods the service takes; the two forms of
  # the group's ARN) and DeleteLogGroup (deleting a group permanently
  # deletes its log events).
  description: >
    One Amazon CloudWatch Logs log group: a store of log events in one AWS
    account and Region, named after the component, into which a writer sends
    events in log streams it creates there, such as Amazon ECS's awslogs log
    driver, AWS Lambda or the CloudWatch agent. A consumer reads the group's
    name, which such a writer is given, and its ARN, which an IAM policy or
    another AWS service names.

    infra.retention_days sets how many days CloudWatch Logs keeps each event
    before it expires; unset, events never expire. CloudWatch Logs encrypts
    every event at rest, with the operator's KMS key where a Recipe's
    override names one. A group's name is unique within its account and
    Region, so two Releases of one Aggregate deployed there collide. Only
    the group is created: no log stream, metric or subscription filter,
    alarm, resource policy, role or key, and the permission to write into it
    is the operator's to grant.

    CloudWatch receives OTLP only from an authenticated sender naming the
    group and an existing log stream in its request headers, so the
    catalog's OpenTelemetry Collector, which sends no credential or header,
    cannot export to it. Reach for it where workloads on AWS write their
    output to CloudWatch Logs. Deleting the group permanently deletes every
    event in it, so no backup is configured; each Recipe's description says
    when that happens and which keys it honours and which it refuses by
    name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: observability
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
    # No observability.aggrega.ai/<signal> label. That label states that a
    # component receives a signal pushed to it over OTLP at an address it
    # publishes, and the catalog's OpenTelemetry Collector, which selects on
    # it, writes for each target it selects an OTLP exporter carrying no
    # credential and no header. CloudWatch takes OTLP logs at one regional
    # address for every group, https://logs.<region>.amazonaws.com/v1/logs,
    # only from a sender authenticated with AWS Signature Version 4, or with
    # a bearer token on a group that has bearer token authentication turned
    # on, and only with the x-aws-log-group and x-aws-log-stream headers
    # naming a group and a stream that already exist (the Amazon CloudWatch
    # User Guide's "OTLP Endpoints", which names the collector's sigv4auth
    # and bearertokenauth extensions as the ones a collector sends with). So
    # that collector cannot send to it, and a writer uses the group's name
    # with its own AWS credentials instead.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values are declared: the group holds no setting a developer chooses
  # for the application. How long events are kept is the operator's, under
  # infra.retention_days; the log class and the encryption key are the
  # operator's too, set under infra.overrides as each Recipe documents.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # The retention_days assertion below holds the value to the retention
      # periods CloudWatch Logs takes. Expiry follows the API Reference's
      # PutRetentionPolicy: an event past the period is marked for deletion
      # and is typically deleted within 72 hours, and where an account-level
      # retention policy applies to the group, that policy's period decides
      # expiry instead while the group keeps the period set here.
      retention_days:
        type: integer
        description: >
          How many days CloudWatch Logs keeps each log event in the group
          before it expires and is deleted: one of 1, 3, 5, 7, 14, 30, 60, 90,
          120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288
          or 3653, the periods the service takes. Unset, events never expire.
          Lowering it expires the events already older than the new period.
          An account-level retention policy of the operator's that applies
          to the group decides expiry in its place.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      log_group_name:
        type: string
        required: true
        description: >
          The group's name, which is the component's name, such as api-logs:
          what a writer names the group by, as Amazon ECS's awslogs-group log
          driver option and the CloudWatch Logs API's logGroupName do. A
          realization publishes a pointer string the provisioning tool
          resolves once the group exists, so a consumer reading it is created
          after the group.
      arn:
        type: string
        required: true
        description: >
          The group's ARN, arn:<partition>:logs:<region>:<account>:log-group:<name>,
          the form CloudWatch Logs calls logGroupArn: what its API takes as a
          log group identifier and what an IAM policy names for tagging. An
          IAM policy names the group for its other actions as this ARN
          followed by :*, which a consumer appends. A realization publishes a
          pointer string the provisioning tool resolves once the group
          exists.

  # The rules CloudWatch Logs holds a group to that the schema above does not
  # state: the retention periods it takes, a set rather than a range, and
  # the rule for a group's name, which reads the component's name. Each
  # halts the build naming what to change rather than leaving the creation
  # to fail.
  assertions:
    # CloudWatch Logs takes a retention period of 1, 3, 5, 7, 14, 30, 60, 90,
    # 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288 or
    # 3653 days (the API Reference's PutRetentionPolicy and LogGroup), and no
    # retention period for events that never expire.
    retention_days: >-
      {{- if hasKey .infra "retention_days" -}}
      {{- $d := toString (get .infra "retention_days") -}}
      {{- if not (has $d (list "1" "3" "5" "7" "14" "30" "60" "90" "120" "150" "180" "365" "400" "545" "731" "1096" "1827" "2192" "2557" "2922" "3288" "3653")) -}}
      {{- fail (printf "infra.retention_days is %s, and CloudWatch Logs keeps log events for 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288 or 3653 days: set it to one of them in the Release, or remove it to keep events without expiry" $d) -}}
      {{- end -}}
      {{- end -}}
    # CloudWatch Logs takes a group name of 1 to 512 letters, digits,
    # underscores, hyphens, slashes, periods and number signs, not beginning
    # aws/ (the API Reference's CreateLogGroup). Each realization names the
    # group after the component, whose name is made of letters, digits,
    # underscores and hyphens, so only its length can fall outside the rule.
    log_group_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if or (not (regexMatch `^[.\-_/#A-Za-z0-9]{1,512}$` $n)) (hasPrefix "aws/" $n) -}}
      {{- fail (printf "the component %q names its Amazon CloudWatch Logs log group, and CloudWatch Logs takes a group name of 1 to 512 letters, digits, underscores, hyphens, slashes, periods and number signs, not beginning aws/: rename the component in the Aggregate to such a name" (trunc 64 $n)) -}}
      {{- end -}}
