apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/prometheus
  version: 1.0.0
  description: >
    A Prometheus metrics server. Prometheus scrapes metrics from its targets and
    stores them in a local time-series database. The targets it scrapes are
    wired through its `scrape_target` uses-socket: one socket carries as many
    connections as the topology binds, and each connection becomes one scrape
    job addressed by the host and port that target publishes. Job label, cadence
    and metrics path are declared per connection on the socket's `valueSchema`,
    so one server can scrape each of its targets on its own terms, and adding a
    target is a matter of wiring another connection rather than changing the
    server. Prometheus persists its time-series database to disk, so it
    renders as a stateful server backed by a data volume. Provider-agnostic: the
    same component is implemented by a Helm Recipe (Workload synthesis to native Kubernetes resources)
    and a Compose Recipe (local development). Exports its query endpoint host and
    port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The targets Prometheus scrapes. Each component wired here becomes one
    # scrape job: its provides host and port are the job's target, and the
    # per-edge values below tune how that one target is scraped. One Prometheus
    # scrapes many targets, so scrape settings are per-connection rather than
    # component-wide.
    scrape_target:
      selector: "component.aggrega.ai/type=server"
      inject: [env]
      valueSchema:
        # Job label for this scrape target. Appears as the `job` label on every
        # metric collected from it, so it is unique per target. It deliberately
        # carries no `default:` here: when omitted the Recipe falls back to the
        # edge's alias, which is per-edge context no static value can express.
        job_name:
          type: string
          description: Prometheus `job` label for this scrape target. When omitted, the Recipe falls back to the edge's alias.
        # Scrape cadence for this target, overriding the server default. When
        # omitted, the default below is filled into the edge.
        scrape_interval:
          type: string
          default: "15s"
          description: How often Prometheus scrapes this target (a Prometheus duration such as `15s` or `1m`). Defaults to 15s.
        # HTTP path Prometheus requests when scraping this target. When omitted,
        # the default below is filled into the edge.
        metrics_path:
          type: string
          default: "/metrics"
          description: HTTP path Prometheus requests when scraping this target. Defaults to the conventional `/metrics` endpoint.

  schema:
    # The developer tunes each scrape target through the `scrape_target`
    # socket's per-edge values, so the component declares no developer values.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9090
        description: HTTP port the Prometheus query and scrape endpoint listens on. Most operators should omit this and let the Recipe assign the default (9090).
      engine_version:
        type: string
        default: "v3.5.0"
        description: Prometheus container image tag. Selects the image tag on container targets; the chart-backed target pins its own image tag.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 8Gi
          description: Size of the persistent volume backing the Prometheus time-series database.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the query endpoint. A
          dashboard or an alert rule evaluator points its data-source address
          at this name together with `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service serves the query endpoint on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes a data-source URL on that scheme.
