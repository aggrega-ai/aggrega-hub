apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/prometheus
  version: 1.0.0
  description: >
    A Prometheus metrics server. Prometheus scrapes metrics from targets at a
    fixed interval and stores them in a local time-series database. The target
    it scrapes is wired through its `scrape_target` uses-socket: the selected
    component's host and port arrive on the injection context and are rendered
    into a Prometheus scrape job, so Prometheus scrapes whichever component the
    topology binds. Prometheus persists its time-series database to disk, so it
    renders as a stateful server backed by a data volume. Provider-agnostic: the
    same component is implemented by a Helm Recipe (Bitnami chart on Kubernetes)
    and a Compose Recipe (local development). Exports its query endpoint host and
    port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: observability
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The target Prometheus scrapes. The selected component's provides host and
    # port arrive on the injection context; each Recipe renders them into the
    # targets list of a Prometheus scrape job.
    scrape_target:
      selector: "component.aggrega.ai/type=server"
      inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      scrape_job_name:
        type: string
        default: "scrape-target"
        description: Job label for the scrape target wired on the `scrape_target` socket. Appears as the `job` label on every metric collected from that target.
      metrics_path:
        type: string
        default: "/metrics"
        description: HTTP path Prometheus requests when scraping the target. Defaults to the conventional `/metrics` endpoint.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9090
        description: HTTP port the Prometheus query and scrape endpoint listens on. Most operators should omit this and let the Recipe assign the default (9090).
      engine_version:
        type: string
        default: "v3.5.0"
        description: Prometheus container image tag. Selects the image tag on container targets; the chart-backed target pins its own image tag.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 8Gi
          description: Size of the persistent volume backing the Prometheus time-series database.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
