apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/observability/tempo
  version: 1.0.0
  license: AGPL-3.0
  description: >
    A Grafana Tempo distributed-tracing server. Tempo receives trace spans over
    the OpenTelemetry protocol and other tracing wire formats, stores them in a
    trace object store, and answers trace-lookup and search queries over its
    HTTP API. This component models Tempo in its single-binary shape: every
    Tempo subsystem — distributor, ingester, querier, compactor — runs inside
    one process backed by a local trace store, so it renders as a single
    stateful server with a data volume rather than a set of microservices. Its
    primary contract to consumers is the OTLP gRPC receiver: a trace producer
    wires to it and pushes spans there. The HTTP query API, on its own port, is
    what a dashboards server reads to display traces. Realized on Kubernetes via
    its Helm Recipe, which synthesizes native Kubernetes resources (a StatefulSet,
    a config ConfigMap, and Services) from the platform Workload abstraction
    running the official grafana/tempo image, rather than sourcing an upstream
    chart; helm-only. Exports its OTLP receiver host and port to consumers via
    the uses topology. The packaged Tempo server is AGPL-3.0.

    On Kubernetes there are two realizations and the Manifest chooses between
    them. `tempo` synthesizes the server as a workload and fetches nothing, so it
    is the one to reach for where the build must complete with no chart
    repository reachable. `tempo-chart` renders the community-maintained Tempo
    Helm chart, which assembles the server's whole configuration from named
    settings rather than from a hand-written file — so retention, receivers,
    storage layout and query tuning arrive with the chart when they move
    upstream — and which additionally accepts spans in the Jaeger and Zipkin wire
    formats, so reach for it where a chart repository is reachable at build time.
    Both realizations probe the server's readiness endpoint, so a rollout reports
    it ready only once it can serve traffic.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: observability
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      retention_period:
        type: string
        default: "168h"
        description: How long stored trace blocks are kept before the in-process compactor deletes them. Expressed as a Go duration (e.g. `168h` for seven days).
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        default: "2.9.0"
        description: Tempo container image tag. Selects the grafana/tempo image tag the synthesized workload runs; the chart-backed realization pins its own image tag.
      source_version:
        type: string
        description: Version of the Helm chart the chart-backed realization pulls. Read only by that realization; the workload-synthesis realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing the Tempo single-binary trace store.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service receiving trace spans. An
          application exporting spans points its exporter at this name
          together with `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port spans are ingested on. It carries the OpenTelemetry gRPC
          receiver port, not the query API port, so a consumer wires its
          exporter rather than its dashboard.
      protocol:
        type: string
        description: How the published address is spoken to — `grpc`, so an exporter is configured for the gRPC transport rather than the HTTP one.
