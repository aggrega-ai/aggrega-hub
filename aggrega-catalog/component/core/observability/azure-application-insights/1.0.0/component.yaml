apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/observability/azure-application-insights
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Application Insights is a
  # hosted service the reader contracts for with Microsoft, under Azure's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Application Insights component: the application performance
    monitoring service of Microsoft's Azure Monitor, receiving the requests,
    dependencies, exceptions, traces and metrics an instrumented application
    sends. A consumer reads the connection string and hands it to Microsoft's
    OpenTelemetry distro or another Application Insights SDK, which sends
    telemetry over HTTPS to the ingestion address it holds.

    The component is workspace-based, the one kind Microsoft offers, since
    classic Application Insights is retired: its telemetry is stored in a
    Log Analytics workspace, which is the operator's, named by its resource
    ID, and the Release creates none. How long telemetry is kept is set on
    the workspace.

    The connection string is declared sensitive. While the component's local
    authentication is on, as by default, the instrumentation key in it is all
    a sender needs to write telemetry into the component; with it off, a
    sender also authenticates with Microsoft Entra ID. Each Recipe's
    description says how a consumer on its target receives it.

    Reach for it where an application in Azure reports its behaviour to
    Azure Monitor. The component keeps no data of its own, so no backup is
    configured. Each Recipe's description says which keys it honours and
    which it refuses by name.

    Azure itself also creates an alert rule named Failure Anomalies -
    <component name> and an action group named Application Insights Smart
    Detection in the resource group. They are outside the Release and
    untracked by its template or Terraform, and they outlive the component
    when it is deleted or destroyed.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: observability
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
    # No observability.aggrega.ai/<signal> label. That label states that a
    # component receives a signal pushed to it over OTLP at an address it
    # publishes, and the catalog's OpenTelemetry Collector, which selects on
    # it, writes an OTLP exporter carrying no credential for each target it
    # selects. Azure Monitor takes OTLP only at a data collection endpoint
    # its data collection rule names, a resource apart from the component,
    # and only from a sender presenting a Microsoft Entra ID token, so that
    # collector cannot send to it. An application sends with an Application
    # Insights SDK and the connection string instead.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values are declared: the component holds no setting a developer
  # chooses for the application. The Log Analytics workspace, the application
  # type, ingestion sampling and local authentication are the operator's,
  # set under infra.overrides as each Recipe documents.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      connection_string:
        type: string
        required: true
        sensitive: true
        description: >
          The component's connection string, as the service reports it:
          settings separated by semicolons, among them the instrumentation key
          and the address telemetry is ingested at, which an Application
          Insights SDK and Microsoft's OpenTelemetry distro take, commonly
          from the variable APPLICATIONINSIGHTS_CONNECTION_STRING. A
          realization publishes a pointer string the provisioning tool
          resolves once the component exists. It is declared sensitive:
          while local authentication is on, whoever holds it can send
          telemetry into the component.
