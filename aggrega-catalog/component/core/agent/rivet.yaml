apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/rivet
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The path to the compiled visual graph file
      project_file: string

      // The specific graph ID to execute within the project
      graph_name: string

      // Static inputs passed to the graph at runtime
      inputs?: {
        [string]: string
      }
    }
