apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/openhands
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        task: { type: string }
        max_iterations: { type: integer, default: 100 }
      required: [max_iterations]
