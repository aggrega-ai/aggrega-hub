apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/haystack
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        pipeline_yaml_path: { type: string }
        max_loops: { type: integer, default: 10 }
        document_stores:
          type: array
          items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-datastore" }
      required: [pipeline_yaml_path, max_loops]
