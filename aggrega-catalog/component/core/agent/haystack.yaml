apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/haystack
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Haystack compiles from its own pipeline YAML definitions
      pipeline_yaml_path: string

      // Maximum loops the agent can execute in the Haystack pipeline
      max_loops: int | *10

      // Explicit document stores for the pipeline to connect to
      document_stores?: [...core.#DatastoreRef]
    }
