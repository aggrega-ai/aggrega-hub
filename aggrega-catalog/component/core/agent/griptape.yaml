apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/griptape
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Griptape's core security feature: keep tool outputs out of the LLM prompt
      off_prompt: bool | *true

      // Griptape uses explicit memory constructs for off-prompt storage
      task_memory?: core.#DatastoreRef

      // Stream output tokens
      stream: bool | *false
    }
