apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/griptape
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        off_prompt: { type: boolean, default: true }
        task_memory: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-datastore" }
        stream: { type: boolean, default: false }
      required: [off_prompt, stream]
