apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/bedrock
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_name: { type: string }
        instruction: { type: string }
        action_groups: { type: array, items: { type: string } }
        knowledge_bases:
          type: array
          items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-datastore" }
      required: [agent_name, instruction]
