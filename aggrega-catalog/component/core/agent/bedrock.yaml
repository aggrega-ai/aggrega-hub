apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/bedrock
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      agent_name:  string
      instruction: string

      // AWS Bedrock uses Action Groups instead of standard tool arrays
      action_groups?: [...string]

      // AWS Bedrock requires explicit knowledge base bindings
      knowledge_bases?: [...core.#DatastoreRef]
    }
