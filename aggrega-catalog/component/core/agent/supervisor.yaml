apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/supervisor
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      system_prompt: string
      routing_mode:  *"fast" | "quality"

      // A Supervisor MUST have at least one worker agent to delegate to
      agents_allowed: [...core.#AgentRef] & [_, ...]

      // A Supervisor should manage, not execute tools directly
      tools_allowed: []
    }
