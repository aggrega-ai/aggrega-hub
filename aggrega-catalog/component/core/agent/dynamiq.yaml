apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/dynamiq
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The entrypoint for the Dynamiq workflow (could be a Python file or serialized JSON/YAML graph)
      workflow_entrypoint: string

      // Dynamiq places a heavy emphasis on robust state management across workflow steps
      state_store?: core.#DatastoreRef

      // Controls if the workflow should stream intermediate node outputs
      stream_events: bool | *false

      // Observability Features handle tracing
    }
