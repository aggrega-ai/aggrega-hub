apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/gemini
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // e.g., "gemini-2.5-pro" or "gemini-2.0-flash"
      model: string

      system_instruction?: string

      // Gemini's native capability to ground responses in Google Search
      enable_google_search_grounding: bool | *false

      temperature: float & >=0.0 & <=2.0 | *0.7
    }
