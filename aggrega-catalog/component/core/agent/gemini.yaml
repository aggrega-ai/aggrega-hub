apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/gemini
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        model: { type: string }
        system_instruction: { type: string }
        enable_google_search_grounding: { type: boolean, default: false }
        temperature: { type: number, min: 0.0, max: 2.0, default: 0.7 }
      required: [model, enable_google_search_grounding, temperature]
