apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/anthropic
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // e.g., "claude-3-5-sonnet-latest"
      model: string
      
      system_prompt?: string
      
      // Anthropic's specific agentic feature
      enable_computer_use: bool | *false
      
      // Enforces a strict response limit for cost control
      max_tokens: int | *4096
    }
