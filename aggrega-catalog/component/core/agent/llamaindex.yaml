apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/llamaindex
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // How the agent reasons about the tools/datastores it has
      agent_mode: *"react" | "openai_tools" | "rewoo"

      system_prompt?: string

      // Critical for RAG: limits how many documents/tools it can query per turn
      max_function_calls: int | *10

      verbose: bool | *false
    }
