apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/openclaw
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Core OpenClaw operational modes
      execution_mode: *"autonomous" | "interactive"

      // Strict limits on the cognitive loop
      max_execution_time: int | *300
      max_steps:          int | *20
    }
