apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/tools
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      system_prompt:  string
      max_iterations: int | *15

      // A Tools Agent MUST have at least one tool
      tools_allowed: [...core.#ToolRef] & [_, ...]

      // A Tools Agent cannot delegate to other agents (use supervisor-agent for that)
      agents_allowed: []
    }
