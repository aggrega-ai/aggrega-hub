apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/tools
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        system_prompt: { type: string }
        max_iterations: { type: integer, default: 15 }
        tools_allowed:
          type: array
          items: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-tool" }
          minItems: 1
        agents_allowed: { type: array, maxItems: 0 }
      required: [system_prompt, max_iterations, tools_allowed]
