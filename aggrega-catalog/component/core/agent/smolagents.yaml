apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/smolagents
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        agent_type: { type: string, enum: [CodeAgent, ToolCallingAgent], default: CodeAgent }
        max_steps: { type: integer, default: 6 }
      required: [agent_type, max_steps]
