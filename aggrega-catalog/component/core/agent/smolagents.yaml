apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/smolagents
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      agent_type: *"CodeAgent" | "ToolCallingAgent"

      max_steps: int | *6

      // Execution guardrails handle authorized_imports
    }
