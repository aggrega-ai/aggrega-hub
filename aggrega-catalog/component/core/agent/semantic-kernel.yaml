apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/semantic-kernel
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // SK uses planners to figure out how to chain plugins (tools)
      planner_type: *"Handlebars" | "FunctionCalling" | "Sequential"

      // SK Execution Settings
      execution_settings?: {
        temperature: float & >=0.0 & <=2.0 | *0.7
        top_p:       float & >=0.0 & <=1.0 | *1.0
      }
    }
