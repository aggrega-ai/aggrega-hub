apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/openai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Required for creating a new one
      instructions?: string

      // Optional: If adopting a pre-existing brownfield assistant
      assistant_id?: string

      // Specific OpenAI Tool formats
      capabilities?: {
        code_interpreter: bool | *false
        file_search:      bool | *false
      }
    }
