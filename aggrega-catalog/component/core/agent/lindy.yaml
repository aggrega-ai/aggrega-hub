apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/lindy
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The ID of the specific Lindy employee
      lindy_id: string

      // The core instruction or trigger context
      task_prompt: string

      // Optional override for the Lindy's persona
      persona_override?: string
    }
