apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/lindy
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        lindy_id: { type: string }
        task_prompt: { type: string }
        persona_override: { type: string }
      required: [lindy_id, task_prompt]
