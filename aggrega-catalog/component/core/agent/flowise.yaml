apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/flowise
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The unique identifier for the exported Flowise chatflow
      chatflow_id: string

      // Runtime overrides for the Flowise nodes (e.g., swapping model temperatures dynamically)
      override_config?: {
        [string]: string | int | bool
      }

      // Ops handles api_host routing
    }
