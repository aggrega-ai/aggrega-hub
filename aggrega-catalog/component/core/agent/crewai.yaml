apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/crewai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Native CrewAI concepts exposed as infrastructure configuration
      role:             string
      goal:             string
      backstory:        string
      allow_delegation: bool | *false
      verbose:          bool | *true
    }
