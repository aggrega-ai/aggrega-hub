apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/crewai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        role: { type: string }
        goal: { type: string }
        backstory: { type: string }
        allow_delegation: { type: boolean, default: false }
        verbose: { type: boolean, default: true }
      required: [role, goal, backstory, allow_delegation, verbose]
