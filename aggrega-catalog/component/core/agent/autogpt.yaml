apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/autogpt
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      ai_name: string
      ai_role: string
      ai_goals: [...string] & [_, ...]

      // Operational Safety: Prevents infinite loops/spending
      continuous_mode: bool | *false
      continuous_limit?: int & >0
    }
