apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/phidata
  version: 1.0.0
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        add_history_to_messages: { type: boolean, default: true }
        markdown: { type: boolean, default: true }
        storage: { type: string, x-aggrega-selector: "component.aggrega.ai/category=datastore" }
        knowledge_base: { type: string, x-aggrega-selector: "datastore.aggrega.ai/engine in (vector, episodic, semantic-memory)" }
      required: [add_history_to_messages, markdown]
