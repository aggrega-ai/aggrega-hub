apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/phidata
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Phidata specific flags
      add_history_to_messages: bool | *true
      markdown:                bool | *true

      // Explicitly typing the Phidata components to Aggrega Datastores
      storage?:        core.#DatastoreRef
      knowledge_base?: core.#DatastoreRef
    }
