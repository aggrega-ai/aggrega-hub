apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/dify
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The unique identifier for the published Dify App
      app_id: string

      // How the gateway should handle the connection
      response_mode: *"streaming" | "blocking"

      // Parameter overrides to pass into the Dify workflow
      inputs_mapping?: {
        [string]: string
      }
    }
