apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/dify
  version: 1.0.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: copilot
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        app_id: { type: string }
        response_mode: { type: string, enum: [streaming, blocking], default: streaming }
        inputs_mapping: { type: object, valuesType: string }
      required: [app_id, response_mode]
