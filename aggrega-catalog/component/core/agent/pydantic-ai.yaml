apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/pydantic-ai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        result_type: { type: string }
        retries: { type: integer, default: 1 }
        system_prompt: { type: string }
      required: [result_type, retries]
