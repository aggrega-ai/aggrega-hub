apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/pydantic-ai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The fully qualified Python import path to the Pydantic BaseModel
      // e.g., "my_app.schemas.FinancialReport"
      result_type: string

      // How many times the agent should retry if Pydantic validation fails
      retries: int | *1

      system_prompt?: string
    }
