apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/langflow
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The UUID of the visual flow exported from Langflow
      flow_id: string

      // Tweak parameters injected at runtime
      tweaks?: {
        [string]: string
      }
    }
