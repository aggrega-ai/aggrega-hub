apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/gumloop
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // The UUID of the Gumloop pipeline
      pipeline_id: string

      // Inputs passed to the Gumloop API
      pipeline_inputs?: {
        [string]: string
      }
    }
