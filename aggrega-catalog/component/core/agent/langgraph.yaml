apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/langgraph
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-agent
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseAgentParameter & {
      // Points to the compiled graph object in the developer's code
      graph_entrypoint: string

      // LangGraph requires state persistence for its checkpointer
      checkpointer_db: core.#DatastoreRef

      recursion_limit: int | *25
    }
