apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/agent/langgraph
  version: 1.0.0
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: ai-agent
    agent.aggrega.ai/autonomy: autonomous
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseAgentParameter"
      properties:
        graph_entrypoint: { type: string }
        checkpointer_db: { type: string, x-aggrega-selector: "component.aggrega.ai/category=datastore" }
        recursion_limit: { type: integer, default: 25 }
      required: [graph_entrypoint, checkpointer_db, recursion_limit]
