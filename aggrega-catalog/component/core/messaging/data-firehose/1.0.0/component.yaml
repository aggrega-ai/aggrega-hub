apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/data-firehose
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Data Firehose is a
  # hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The delivery behaviour follows the Amazon Data Firehose Developer Guide:
  # "Understand data delivery in Amazon Data Firehose", "Handle data delivery
  # failures" (Amazon S3) and "Configure Amazon S3 object name format".
  description: >
    One Amazon Data Firehose stream delivering to Amazon S3: AWS's managed
    delivery service, which a producer sends records to with PutRecord or
    PutRecordBatch and which buffers them, joins them into objects and
    writes each object to an S3 bucket. A producer reads
    delivery_stream_name, which each call names, and arn, which an IAM
    policy names.

    The stream takes the component's name and records put to it directly:
    no other source, and no destination but the bucket. A client signs each
    call with its own IAM identity, so no credential is published and no
    credential slot is declared. The bucket and the IAM role Firehose
    assumes to write to it are the operator's, named in the Release and
    never created; no transformation, format conversion, dynamic
    partitioning or error logging is configured.

    Firehose retries a delivery to the bucket for up to 24 hours, after
    which the records are lost. Deleting the stream, which removing its
    component from the Aggregate does, deletes it with its data, and
    Firehose no longer guarantees delivery of the records it holds; the
    objects already in the bucket stay. Each Recipe's description says which
    keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # compression_format carries the service's own default, so a bare
  # `events: {}` creates the stream Firehose creates when no compression is
  # given, and every realization writes it whatever its tool would default
  # to. prefix and error_output_prefix carry no default: unset, a realization
  # writes neither, and Firehose places objects under its own time prefix.
  # Each length and each listed value is the one the Firehose API reference
  # gives for the field (ExtendedS3DestinationConfiguration), and the schema
  # halts the build on a value outside it, naming the key. The rules Firehose
  # holds the prefixes to, which the schema cannot state, are the assertions
  # below. No credential slot: a client signs each call with its
  # own IAM identity, which the operator grants access to the stream.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      prefix:
        type: string
        maxLength: 1024
        description: >
          The object key prefix Firehose writes each delivered object under,
          up to 1,024 characters. It may hold !{timestamp:<format>}
          expressions, a Java DateTimeFormatter pattern evaluated at the
          arrival of the object's oldest record, and !{firehose:random-string},
          eleven random characters; holding any, it needs
          values.error_output_prefix. A prefix with no timestamp expression is
          followed by yyyy/MM/dd/HH/ in UTC, and an unset one is that alone.
          A prefix ending in a slash appears as a folder in the bucket.
      error_output_prefix:
        type: string
        maxLength: 1024
        description: >
          The object key prefix Firehose writes records it fails to process
          under, up to 1,024 characters. Firehose writes a failed record there
          when a transformation or a format conversion fails, neither of which
          this Component configures, and needs the prefix wherever
          values.prefix holds an expression. It may hold the expressions
          values.prefix takes and !{firehose:error-output-type}, the kind of
          failure; holding any expression, it holds that one.
      compression_format:
        type: string
        enum:
          - UNCOMPRESSED
          - GZIP
          - ZIP
          - Snappy
          - HADOOP_SNAPPY
        default: UNCOMPRESSED
        description: >
          How Firehose compresses each object it delivers: UNCOMPRESSED,
          unless set; GZIP, ZIP or Snappy, whose objects end in .gz, .zip and
          .snappy; or HADOOP_SNAPPY, Snappy in the framing Hadoop reads, whose
          objects end in .hsnappy. Changing it applies to the objects
          delivered from then on.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      delivery_stream_name:
        type: string
        required: true
        description: >
          The stream's name, which a producer names as the DeliveryStreamName
          of each PutRecord and PutRecordBatch call. It is not an address: a
          Firehose client calls the service's endpoint in the stream's Region
          and names the stream in the request. A realization publishes a
          pointer string the provisioning tool resolves once the stream
          exists, so a consumer that tool provisions is created after it.
      arn:
        type: string
        required: true
        description: >
          The stream's Amazon Resource Name, which an IAM policy granting a
          producer PutRecord and PutRecordBatch on the stream names. A
          realization publishes a pointer string the provisioning tool
          resolves once the stream exists.

  # The rules Amazon Data Firehose holds a stream's name and its prefixes
  # to, which every realization's stream, named after the component and
  # delivering to S3 with neither dynamic partitioning nor a backup, is
  # created under. Each halts the build naming what to change rather than
  # leaving the creation to fail. The prefix rules are those of the Firehose
  # Developer Guide's "Understand custom prefixes for Amazon S3 objects".
  assertions:
    # Firehose takes a stream name of 1 to 64 letters, digits, periods,
    # underscores and hyphens (the CreateDeliveryStream API reference's
    # DeliveryStreamName).
    delivery_stream_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9._-]{1,64}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon Data Firehose stream, and Firehose takes a stream name of 1 to 64 letters, digits, periods, underscores and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The sequence !{ appears in a prefix only as an expression of a
    # namespace Firehose evaluates there. A prefix takes the timestamp
    # namespace and firehose:random-string; firehose:error-output-type
    # belongs to the error prefix alone; and partitionKeyFromQuery and
    # partitionKeyFromLambda name keys only dynamic partitioning creates,
    # which this Component's stream does not perform.
    prefix_expressions: >-
      {{- $p := toString (optional .values "prefix" "") -}}
      {{- if contains "!{" (regexReplaceAll `!\{(timestamp:[^}]+|firehose:random-string)\}` $p "") -}}
      {{- fail (printf "values.prefix is %q, and Amazon Data Firehose evaluates !{timestamp:<format>} and !{firehose:random-string} in the prefix of a stream without dynamic partitioning, !{firehose:error-output-type} in the error prefix alone, and !{ nowhere else: rewrite values.prefix in the Aggregate with those expressions alone" $p) -}}
      {{- end -}}
    # The error prefix takes the expressions a prefix takes and
    # firehose:error-output-type, and no partitioning key in any case; an
    # error prefix holding any expression holds firehose:error-output-type
    # at least once.
    error_output_prefix_expressions: >-
      {{- $e := toString (optional .values "error_output_prefix" "") -}}
      {{- if contains "!{" (regexReplaceAll `!\{(timestamp:[^}]+|firehose:(random-string|error-output-type))\}` $e "") -}}
      {{- fail (printf "values.error_output_prefix is %q, and Amazon Data Firehose evaluates !{timestamp:<format>}, !{firehose:random-string} and !{firehose:error-output-type} in an error prefix, and !{ nowhere else: rewrite values.error_output_prefix in the Aggregate with those expressions alone" $e) -}}
      {{- end -}}
      {{- if and (contains "!{" $e) (not (contains "!{firehose:error-output-type}" $e)) -}}
      {{- fail (printf "values.error_output_prefix is %q, and Amazon Data Firehose takes an error prefix holding an expression only with !{firehose:error-output-type} among them: add it to values.error_output_prefix in the Aggregate" $e) -}}
      {{- end -}}
    # Firehose leaves the error prefix unset only where the prefix holds no
    # expression.
    error_output_prefix_required: >-
      {{- $p := toString (optional .values "prefix" "") -}}
      {{- if and (contains "!{" $p) (eq (toString (optional .values "error_output_prefix" "")) "") -}}
      {{- fail (printf "values.prefix is %q, which holds an expression, and Amazon Data Firehose takes a prefix holding an expression only with an error prefix: set values.error_output_prefix in the Aggregate, with !{firehose:error-output-type} in it" $p) -}}
      {{- end -}}
