apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/azure-event-hubs
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Event Hubs is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Event Hubs namespace: Microsoft's managed event streaming
    service, holding the event hubs values.eventhubs declares, each with
    the partitions it asks for, created with the namespace. A consumer
    reads the namespace's host name and endpoint and sends and receives
    through an Event Hubs client library over AMQP, or reads
    bootstrap_servers and reaches the event hubs as Kafka topics through
    the namespace's Kafka endpoint.

    The namespace takes requests authenticated with Microsoft Entra ID
    alone: its shared access signature authentication is off, so no key or
    connection string reaches a consumer and no credential slot is
    declared. A consumer authenticates as the managed identity it runs
    under, and the role assignment granting that identity the Azure Event
    Hubs Data Sender or Data Receiver role is the operator's.

    Reach for it where an application in Azure streams events to readers
    that each keep their own place in a partitioned log. Microsoft
    documents that the Basic tier serves no Kafka endpoint, so no
    realization provisions it; each Recipe's description says which keys
    it honours, which it refuses by name, and which tier it provisions.
    Microsoft documents Event Hubs as no long-term store, its guidance on
    backup and restore naming each event hub's retention and Capture rather
    than a backup, so no backup is configured, and a core/backup attachment
    halts, since that Feature applies to stateful servers.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `events: {}` keeps a working contract: a
      # namespace holding no event hub.
      eventhubs:
        type: object
        default: {}
        propertyNames:
          pattern: "^[A-Za-z0-9]([A-Za-z0-9._-]{0,254}[A-Za-z0-9])?$"
        additionalProperties:
          type: object
          properties:
            partition_count:
              type: integer
              minimum: 1
              maximum: 1024
              description: >
                How many partitions the event hub spreads its events over,
                each an ordered log one reader in a consumer group reads at a
                time, so it bounds how many readers in a group work in
                parallel. Microsoft documents the largest count each tier
                takes, 32 on the Basic and Standard tiers, 100 on Premium
                and 1,024 on a Dedicated cluster; the build halts on a number below 1 or
                above 1,024, naming this key, and a realization halts on a
                count above what the tier it provisions takes. Microsoft
                documents that the count of an event hub on the Standard
                tier never changes once it is created, and that on Premium
                it can only grow.
          additionalProperties: false
        description: >
          The namespace's event hubs, a map from each event hub's name to its
          settings, an empty map taking each setting's default. Microsoft
          documents an event hub's name as 1 to 256 letters, digits,
          periods, hyphens and underscores, beginning and ending with a
          letter or a digit; the build halts on another, naming this key. A
          Kafka client reads each event hub as the topic of the same name.
          Each event hub keeps the consumer group $Default, which an Event
          Hubs client reads through, while a Kafka client names its own
          group. Left empty, the namespace holds no event hub.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The namespace's DNS name, which an Event Hubs client library takes
          as the fully qualified namespace it connects to. A realization
          publishes a pointer string the provisioning tool resolves once the
          namespace exists, so a consumer reads this rather than deriving
          one, or the DNS name the Release sets in infra.overrides.host
          instead.
      endpoint:
        type: string
        description: >
          The namespace's URL as the service reports it, https:// followed by
          host and :443/. It carries no credential.
      bootstrap_servers:
        type: string
        description: >
          The namespace's Kafka endpoint, host followed by :9093, which a
          Kafka client takes as its bootstrap servers, connecting over
          SASL_SSL and authenticating with Microsoft Entra ID through the
          OAUTHBEARER mechanism. It carries no credential.
