apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/base
  version: 1.0.0
  labels:
    component.aggrega.ai/type: messaging
    component.aggrega.ai/category: messaging
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        brokerKind: { type: string }
        ordering: { type: string, enum: [none, partition, strict], default: none }
      required: [brokerKind]
