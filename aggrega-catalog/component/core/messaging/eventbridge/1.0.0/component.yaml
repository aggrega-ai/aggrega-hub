apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/eventbridge
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon EventBridge is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon EventBridge custom event bus: AWS's managed event router,
    which a publisher sends events to with PutEvents and whose rules each
    match the events they describe and pass them to the rule's targets. A
    publisher reads arn, which PutEvents, a rule and an IAM policy name the
    bus by.

    The bus takes the component's name. A client signs each call with its
    own IAM identity, so no credential is published and no credential slot
    is declared. The bus is created alone: no rule or target, which are the
    subscriber's to declare, no archive, schema discoverer, pipe, schedule,
    API destination or role, no resource policy, so only the account owning
    the bus sends events to it and adds rules to it, no logging and no
    dead-letter queue.

    EventBridge passes each event to the targets of the rules matching it
    and keeps a copy only in an archive, which is not created, so a bus
    holds no events to back up. Deleting the bus, which removing its
    component from the Aggregate does, needs every rule on it deleted
    first. Each Recipe's description says which keys it honours, which it
    refuses by name, and which key encrypts the bus's events.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values: what an event bus carries, and where, is decided by the rules
  # created on it, and a rule names the targets it delivers to, so each rule
  # is the subscriber's, created on the bus apart from this Component, and no
  # value of the Aggregate describes it. No credential slot: a client signs
  # each call with its own IAM identity, which the operator grants access to
  # the bus.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      arn:
        type: string
        required: true
        description: >
          The event bus's Amazon Resource Name, which a publisher names as
          the EventBusName of each event it sends with PutEvents, a rule
          names as the bus it matches events on, and an IAM policy granting
          access to the bus names. EventBridge takes it in place of the
          bus's name in each of those calls. It is not an address: an
          EventBridge client calls the service's endpoint in the bus's Region
          and names this ARN in the request. A realization publishes a
          pointer string the provisioning tool resolves once the bus exists,
          so a consumer reads this rather than composing one.

  # The rule Amazon EventBridge holds a custom event bus's name to, which
  # every realization's bus, named after the component, is created under. It
  # halts the build naming the component rather than leaving the creation to
  # fail.
  assertions:
    # EventBridge takes an event bus name of 1 to 256 letters, digits,
    # periods, hyphens, underscores and slashes, and a custom event bus's name
    # holds no slash (the CreateEventBus API reference's Name): a slash marks
    # a partner event bus, whose name is that of the partner event source it
    # receives from, beginning aws.partner/, so no name this rule admits is a
    # partner bus's. Every account already holds an event bus named default,
    # which receives the events of AWS services, and the CreateEventBus API
    # reference reserves that name for it.
    event_bus_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9._-]{1,256}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon EventBridge event bus, and EventBridge takes a custom event bus name of 1 to 256 letters, digits, periods, hyphens and underscores: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
      {{- if eq $n "default" -}}
      {{- fail "the component \"default\" names its Amazon EventBridge event bus, and EventBridge reserves the name default for the event bus every account already holds: rename the component in the Aggregate" -}}
      {{- end -}}
