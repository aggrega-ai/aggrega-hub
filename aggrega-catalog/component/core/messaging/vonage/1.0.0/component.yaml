apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/vonage
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the carrier is operated by its provider and no source licence is granted for
  # it, so no single identifier expresses the situation. The class it falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A voice carrier reached over Vonage's Voice API, so an application places
    and answers calls without operating telephony infrastructure. The modality
    is calls; the developer names the direction, outbound, inbound or both. The
    operator supplies the API base address and the two addresses the carrier
    calls back on, for instructions and for events. Wire here rather than to a
    broker: a broker delivers inside the Release, a carrier onto the public
    telephone network. Consumers read the base address, both
    callback addresses, the modality and direction. Realized by reference: no
    compute runs here.
  labels:
    # A carrier the Release calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Vonage authenticates a request with an API key and an API secret, and signs
  # the webhooks it sends with a THIRD value the provider's own documentation
  # distinguishes from the API secret: a signature secret, held in the same
  # account settings but used only for signing. So three pieces of secret
  # material, and three slots. A signing secret is a credential like any other
  # and belongs on this axis rather than among the values below. All three are
  # secret-kind-pinned but family-agnostic, so either a referenceable credential
  # or an inject-value credential may fill them per target.
  #
  # None of the three is required here, because whether a realization can carry
  # the credential depends on the target: the helm Recipe requires all three and
  # halts naming an empty one, while the compose Recipe defines no service,
  # refuses a filled slot, and leaves the credentials to the component that calls
  # the carrier.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The API key half of the credential pair the carrier authenticates a request with.
    api_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The API secret half of the credential pair the carrier authenticates a request with.
    signature_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: The separate secret the carrier signs an inbound webhook with, which the application verifies the signature against. Distinct from the API secret and not interchangeable with it.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      # The modality and the direction are values rather than labels because
      # nothing selects on them: they describe what this wiring is for, and the
      # Aggregate sets them. Both are published to consumers below so an
      # application reads them from one place instead of restating them.
      modality:
        type: string
        enum: [voice]
        default: voice
        description: Which of the carrier's channels this wiring addresses. Pinned to calls, because the webhook contract and the credential shape declared here are the Voice API's.
      direction:
        type: string
        enum: [outbound, inbound, bidirectional]
        default: outbound
        description: Whether the application originates calls, answers them, or both.

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the host the carrier's Voice API is
      # documented at, so taking the default needs no operator
      # input. It is sourced from infra rather than fixed in a Recipe so an
      # operator may repoint it at a regional address or at a proxy the
      # Release routes egress through. A deterministic pointer string the
      # runtime resolves; the compiler never contacts it.
      endpoint: { type: string, default: "https://api.nexmo.com" }
      # The two webhook addresses the carrier calls back on. They are addresses
      # the Release itself serves, so only its operator can supply them, and they
      # carry no default. Each is an opaque pointer string piped through to the
      # output unchanged: the compiler never resolves one, never fetches one, and
      # never derives one from cluster state. Both are required rather than
      # conditional on direction, because the instruction address is read when
      # placing a call as well as when answering one.
      answer_url:
        type: string
        required: true
        description: The address the carrier fetches a call's instructions from, read when the application places a call and when the carrier answers one on its behalf.
      event_url:
        type: string
        required: true
        description: The address the carrier posts call events to.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer both calls
    # the carrier and serves its callbacks, so it reads all five from one place
    # rather than each of its own containers carrying a copy: where to call, which
    # two addresses to serve, which channel, and which direction. Credentials are
    # not published and are not carried across the edge — on Kubernetes a
    # credential attached to a slot above is materialized in the Release, and the
    # consuming application references the material under the name it was given;
    # on Compose it is attached to the consuming component itself.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the carrier's Voice API an application calls to place a
          call. The Release supplies it, so an operator may point it at a
          different host without the application changing.
      answer_url:
        type: string
        required: true
        description: >
          Address the carrier fetches a call's instructions from. A consumer
          must serve that address itself, so it reads this to know which of
          its own routes the carrier will call.
      event_url:
        type: string
        required: true
        description: >
          Address the carrier posts call events to. A consumer must serve that
          address itself, so it reads this to know where its own event handler
          has to answer.
      modality:
        type: string
        required: true
        description: >
          Which of the carrier's channels this wiring addresses, carried
          through from the value the Aggregate declared. A consumer reads it
          to pick the request shape it sends.
      direction:
        type: string
        required: true
        description: >
          Whether the application originates calls on this wiring, answers
          them, or both, carried through from the value the Aggregate
          declared. A consumer reads it to know whether it must also stand up
          an answering path.
