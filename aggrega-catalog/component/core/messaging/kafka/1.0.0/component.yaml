apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/kafka
  version: 1.0.0
  description: >
    An Apache Kafka event-streaming broker in its single-node KRaft shape. The
    node runs the broker and the controller roles in one process, so there is
    no ZooKeeper and no second bundled service — one coherent workload. It keeps
    its commit log on a local data volume, so it renders as a single stateful
    server rather than a set of microservices. Its primary contract to consumers
    is the client bootstrap endpoint: a producer or consumer wires to it and
    reaches the broker there. The controller listener is internal to the node
    and is not part of the exported contract. The cluster identity is pinned to
    a fixed value so the rendered workload is byte-identical across builds.
    Realized on Kubernetes via its Helm Recipe, which synthesizes the workload
    directly from the official Apache Kafka image; helm-only. Exports its
    bootstrap host and client port to consumers via the uses topology. The
    packaged Apache Kafka server is Apache-2.0.
  license: Apache-2.0
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: messaging
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      cluster_id:
        type: string
        default: "4L6g3nShT-eMCtK--X86sw"
        description: Pinned KRaft cluster identity; a fixed value keeps the render deterministic.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      broker_port:
        type: integer
        default: 9092
        description: Client bootstrap port — the endpoint producers and consumers connect to.
      controller_port:
        type: integer
        default: 9093
        description: Internal KRaft controller-quorum port. Not part of the exported contract.
      engine_version:
        type: string
        default: "4.1.2"
        description: Apache Kafka image tag. Pins the packaged Kafka version the workload references.
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing the Kafka commit log.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
