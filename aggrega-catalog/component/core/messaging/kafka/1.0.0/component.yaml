apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/kafka
  version: 1.0.0
  license: Apache-2.0
  description: >
    An Apache Kafka event-streaming broker in its single-node KRaft shape. The
    node runs the broker and the controller roles in one process, so there is
    no ZooKeeper and no second bundled service — one coherent workload. It keeps
    its commit log on a local data volume, so it renders as a single stateful
    server rather than a set of microservices. Its primary contract to consumers
    is the client bootstrap endpoint: a producer or consumer wires to it and
    reaches the broker there.
    Realized on Kubernetes two ways, both through Helm Recipes and chosen in the
    Manifest: a synthesis Recipe that builds the workload directly from the
    official Apache Kafka image, and a controller-driven Recipe that emits a Kafka
    custom resource for the Strimzi Cluster Operator to reconcile. Reach for the
    synthesis Recipe on a cluster that runs no Kafka control plane — it needs no
    operator installed and no chart repository, so it builds with nothing fetched
    — and for the controller-driven Recipe where the Strimzi Cluster Operator is
    already in place and the cluster should own broker upgrades, rolling restarts
    and partition rebalancing. There is no Compose or cloud-managed realization.

    The controller-driven Recipe runs Kafka 4.2.0 to 4.3.1 only, which the
    `engine_version` default is not, so a Release selecting it sets
    `engine_version` to one of them.

    With `values.metrics_enabled` true the controller-driven Recipe has every
    node serve its metrics and publishes the pod label selector, port name and
    path a scraper discovers them by; false, those keys are empty. The
    synthesized Recipe runs an image that serves no Prometheus metrics, so it
    publishes them empty and halts the build on true.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: messaging
    # The packaged Apache Kafka server is Apache-2.0.
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      cluster_id:
        type: string
        default: "4L6g3nShT-eMCtK--X86sw"
        description: Pinned KRaft cluster identity; a fixed value keeps the render deterministic. Honoured by the synthesized realization; on the controller-driven one the operator generates the identity, and any value other than this default halts the build.
      # The brokers' own metrics, in the Prometheus format. Apache Kafka keeps its
      # metrics behind JMX; a Prometheus endpoint comes from something run beside
      # it. On the controller-driven realization true sets the Kafka resource's
      # metrics configuration to the Strimzi metrics reporter, which the operator
      # configures on every node and which serves /metrics on a container port
      # named tcp-prometheus, 9404, plain HTTP with no caller check, on every
      # address of the pod; the same listener answers an exporter health check at
      # /-/healthy and a static help page at every other path, and nothing else.
      # No Service carries the port, so the Recipe publishes the pod facts. The
      # official image the synthesized realization runs carries no exporter, so
      # there true halts the build rather than publish an address nothing serves.
      metrics_enabled:
        type: boolean
        default: false
        description: Turns on the brokers' own metrics, in the Prometheus format, on a port of their own on every node, and publishes the pod label selector, port name and path a scraper discovers them by; while false those keys are empty. The port checks no caller, so anything that reaches a node can read them. Honored by the controller-driven realization; the synthesized one serves no Prometheus metrics and halts the build when this is true.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      broker_port:
        type: integer
        default: 9092
        description: Client bootstrap port — the endpoint producers and consumers connect to.
      controller_port:
        type: integer
        default: 9093
        description: Internal KRaft controller-quorum port. Not part of the exported contract. Honoured by the synthesized realization; on the controller-driven one the operator fixes the port, and any value other than this default halts the build.
      engine_version:
        type: string
        default: "4.1.2"
        description: Apache Kafka image tag. Pins the packaged Kafka version the workload references. On the controller-driven realization it is the Kafka version the operator runs, one of 4.2.0 to 4.3.1, which this default is not.
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing the Kafka commit log.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the Kafka operator (control plane) is
          installed in the target cluster. An operator-driven realization halts
          the build unless this is set true, so a Kafka custom resource is never
          emitted as an orphan into a cluster that cannot reconcile it. The
          synthesized StatefulSet realization ignores this flag.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges:
      # the bootstrap host and client port first, then the same bootstrap
      # address as the list a Kafka client takes. The controller listener is
      # internal to the node and is not part of the exported contract.
      host:
        type: string
        required: true
        description: >
          Bootstrap address a producer or consumer connects to first, from
          which the client learns the rest of the cluster. Which Service
          carries it follows the realization the Manifest selected, so a
          consumer reads this rather than deriving a name.
      port:
        type: integer
        required: true
        description: >
          TCP port the bootstrap address accepts client connections on. It
          carries the broker port an operator set, never the controller-quorum
          port, which is internal to the cluster.
      # A realization serving one bootstrap address publishes it here alone,
      # joined from the host and port above; one running several brokers lists
      # each of them, so a client can still start while one broker is down.
      bootstrap_servers:
        type: string
        required: true
        description: >
          Comma-separated `host:port` list a Kafka client takes as its bootstrap
          servers — what a client that takes a list reads, where `host` and
          `port` serve one that takes a single address. A realization with one
          bootstrap address publishes that address as the whole list.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `kafka`, which is what a consumer selects a client library for.
      # Where Prometheus finds the brokers' metrics, while values.metrics_enabled
      # is true on the controller-driven realization: the label selector of the
      # node pods, the name of the container port carrying the metrics and the
      # path, for a scraper that discovers those pods directly. Empty otherwise.
      # None of the keys carries a namespace: a scraper reads where the target
      # runs from its own connection.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching every Kafka node pod, for a scraper
          that discovers those pods directly. Set by the controller-driven
          realization while values.metrics_enabled is true, beside
          `metrics_pod_port` and `metrics_path`; empty otherwise.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `tcp-prometheus`. Set and empty together with `metrics_pod_selector`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`. Set and empty
          together with `metrics_pod_selector`.
