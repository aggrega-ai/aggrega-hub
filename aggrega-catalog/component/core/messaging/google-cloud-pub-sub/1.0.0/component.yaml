apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/google-cloud-pub-sub
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Pub/Sub is a hosted service
  # the reader contracts for with Google Cloud, under Google Cloud's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The topic's behaviour follows Pub/Sub's documentation: "Pub/Sub basics"
  # (the guidelines for naming a topic) and the REST reference of a topic
  # (its resource name, and messageRetentionDuration, from 10 minutes to 31
  # days, written as a duration in seconds).
  description: >
    One Pub/Sub topic: the named channel of Google Cloud's managed
    publish-and-subscribe service, which a publisher sends messages to and
    which delivers each message to every subscription attached to it. A
    publisher reads topic, the topic's resource name,
    projects/<project>/topics/<name>, which each publish call names, as a
    subscriber names it when it creates its subscription.

    The topic takes the component's name. It is created alone: no
    subscription, which is the subscriber's to declare, no schema and no
    IAM binding. A client signs each call with its own Google identity,
    which the operator grants a Pub/Sub role through IAM, so no credential
    is published and no credential slot is declared.

    values.message_retention_duration keeps each published message on the
    topic for that long, so a subscription can replay it; unset, the topic
    keeps none, and each subscription's own retention decides.

    No backup is configured: a topic holds messages for delivery, and the
    snapshots Pub/Sub offers are of a subscription, which is the
    subscriber's. Each Recipe's description says which keys it honours,
    which it refuses by name, and which key encrypts the topic.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No credential slot: a client signs each call with its own Google
  # identity, which the operator grants a Pub/Sub role on the topic.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The value
      # may be omitted, so a bare `events: {}` keeps a working contract: a
      # topic that keeps no message itself.
      message_retention_duration:
        type: string
        description: >
          How long the topic keeps each published message, as a number of
          seconds followed by s, such as 86400s for one day, with up to nine
          digits after a decimal point: from 600s, ten minutes, to 2678400s,
          31 days, the range Pub/Sub takes. While it is set, a subscription
          attached to the topic can seek back to any message published within
          that time, whether or not it was acknowledged; unset, the topic
          keeps no message, and each subscription's own retention decides. A
          value of another form or outside that range halts the build, naming
          this key.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      topic:
        type: string
        required: true
        description: >
          The topic's resource name, projects/<project>/topics/<name>, the
          name being the component's: what a publisher names in each publish
          call, a subscriber names when it creates a subscription, and an IAM
          policy names as the resource it grants publishing on. It is not an
          address: a Pub/Sub client calls pubsub.googleapis.com and names
          this topic in the request. A realization publishes a pointer string
          the provisioning tool resolves once the topic exists, so a consumer
          reads this rather than composing one.

  # The rules Pub/Sub holds a topic to that the schema above does not state:
  # the guidelines for naming a topic, which read the component's name, and
  # the form and range of the retention. Each halts the build naming what to
  # change rather than leaving the creation to fail.
  assertions:
    # Pub/Sub takes a topic ID that starts with a letter, holds 3 to 255
    # letters, digits, dashes, underscores, periods, tildes, plus signs and
    # percent signs, and does not begin with goog ("Pub/Sub basics"). Each
    # realization names the topic after the component, whose name is made of
    # letters, digits, underscores and hyphens, so the rule reads it with
    # those characters alone.
    topic_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if or (not (regexMatch `^[A-Za-z][A-Za-z0-9_-]{2,254}$` $n)) (hasPrefix "goog" $n) -}}
      {{- fail (printf "the component %q names its Pub/Sub topic, and Pub/Sub takes a topic ID of 3 to 255 characters that starts with a letter and does not begin with goog: rename the component in the Aggregate to such a name" (trunc 64 $n)) -}}
      {{- end -}}
    # The REST reference of a topic writes messageRetentionDuration as a
    # duration in seconds with up to nine fractional digits, terminated by s,
    # and takes 10 minutes to 31 days.
    message_retention_duration: >-
      {{- if hasKey .values "message_retention_duration" -}}
      {{- $d := .values.message_retention_duration -}}
      {{- $ok := and (typeIs "string" $d) (regexMatch `^[0-9]+(\.[0-9]{1,9})?s$` $d) -}}
      {{- if $ok }}{{ $s := float64 (trimSuffix "s" $d) }}{{ $ok = and (ge $s 600.0) (le $s 2678400.0) }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "values.message_retention_duration is %s, and Pub/Sub keeps a topic's messages for 10 minutes to 31 days, written as seconds followed by s: set it to a value from 600s to 2678400s in the Aggregate, such as 86400s, or remove it" (toJson $d)) -}}
      {{- end -}}
      {{- end -}}
