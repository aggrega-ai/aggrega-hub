apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/sns
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon SNS is a hosted service
  # the reader contracts for with AWS, under AWS's terms, which no SPDX
  # identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The delivery guarantees follow the SNS Developer Guide, "Amazon SNS message
  # delivery for FIFO topics": a FIFO topic delivers to SQS standard and FIFO
  # queues; strict ordering and deduplication come from pairing with SQS FIFO
  # queues, and a standard queue gets best-effort ordering and at-least-once
  # delivery.
  description: >
    One Amazon SNS topic: AWS's managed publish-and-subscribe service, which a
    publisher publishes messages to and which delivers a copy of each message
    to every subscription of the topic. A standard topic delivers each
    message at least once, in a best-effort order, to any kind of
    subscription SNS offers; a FIFO topic, which values.fifo_topic asks for,
    delivers to Amazon SQS queues alone: to an SQS FIFO queue subscribed to
    it, in order within a message group and without duplicates, and to an SQS
    standard queue at least once, in a best-effort order. A publisher reads
    arn, which each Publish call and an IAM policy name.

    The topic takes the component's name, ending in .fifo on a FIFO topic.
    A client signs each call with its own IAM identity, so no credential is
    published and no credential slot is declared. The topic is created
    alone: no subscription, which is the subscriber's to declare, no topic
    policy, so SNS's default lets only the account owning the topic publish
    and subscribe, and no delivery-status logging.

    SNS offers no backup of a topic. Deleting the topic, which removing its
    component from the Aggregate does, deletes every subscription of it, and
    messages published shortly before may go undelivered. Each Recipe's
    description says which keys it honours, which it refuses by name, and
    which key encrypts the topic.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Each value carries SNS's own default, so a bare `topic: {}` creates the
  # standard topic SNS creates when no attribute is given, and every
  # realization writes the same settings whatever its tool would default to.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      fifo_topic:
        type: boolean
        default: false
        description: >
          A FIFO topic, false unless set. A FIFO topic delivers each message
          to the Amazon SQS queues subscribed to it: once, in the order it
          was published within its message group, to an SQS FIFO queue, and
          at least once, in a best-effort order, to an SQS standard queue. A
          publisher names the message group on every message; the topic's
          name ends in .fifo. SNS fixes a
          topic's type when it creates the topic, so changing this creates a
          new topic under the other name and deletes the old one with every
          subscription of it.
      content_based_deduplication:
        type: boolean
        default: false
        description: >
          Deduplication by message body on a FIFO topic, false unless set.
          SNS then takes the SHA-256 hash of a message's body as its
          deduplication ID where the publisher gives none; unset, a publisher
          gives a deduplication ID on every message. SNS offers it on a FIFO
          topic alone, so true with values.fifo_topic false halts the build,
          naming both keys.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      arn:
        type: string
        required: true
        description: >
          The topic's Amazon Resource Name, which a publisher names in each
          Publish call, and which an IAM policy granting access to the topic,
          or a subscription to it, names. It is not an address: an SNS client
          calls the service's endpoint in the topic's Region and names this
          ARN in the request. A realization publishes a pointer string the
          provisioning tool resolves once the topic exists, so a consumer
          reads this rather than composing one.

  # The rules Amazon SNS holds a topic to that the schema above cannot state,
  # since each reads two keys together or the component's name. Each halts
  # the build naming what to change rather than leaving the creation to fail.
  assertions:
    # SNS takes a topic name of up to 256 letters, digits, hyphens and
    # underscores, and a FIFO topic's name ends in .fifo, the suffix counted
    # among the 256 (the CreateTopic API reference's Name). The topic is named
    # after the component, followed by .fifo on a FIFO topic, so the
    # component's name takes 256 characters on a standard topic and 251 on a
    # FIFO topic.
    topic_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if .values.fifo_topic -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_-]{1,251}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon SNS FIFO topic, whose name ends in .fifo, and SNS takes a topic name of up to 256 letters, digits, hyphens and underscores, the .fifo suffix counted among them: rename the component in the Aggregate to 251 such characters or fewer" $n) -}}
      {{- end -}}
      {{- else if not (regexMatch `^[a-zA-Z0-9_-]{1,256}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon SNS topic, and SNS takes a topic name of up to 256 letters, digits, hyphens and underscores: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # ContentBasedDeduplication is one of the attributes the CreateTopic API
    # reference lists as applying to FIFO topics alone.
    content_based_deduplication_fifo: >-
      {{- if and .values.content_based_deduplication (not .values.fifo_topic) -}}
      {{- fail "values.content_based_deduplication is true while values.fifo_topic is false, and Amazon SNS deduplicates messages by their body on a FIFO topic alone: set values.fifo_topic to true in the Aggregate, or remove values.content_based_deduplication" -}}
      {{- end -}}
