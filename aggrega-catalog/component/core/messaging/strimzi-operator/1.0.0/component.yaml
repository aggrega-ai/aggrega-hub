apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/strimzi-operator
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Strimzi Cluster Operator, declared as an explicit component so
    an operator-driven Kafka realization can ship its runtime prerequisite
    alongside the Kafka custom resource it emits, rather than assuming an ambient
    install. The control plane is the operator that reconciles Kafka custom
    resources into running brokers. Declare this component in the same
    Aggregate as an operator-driven Kafka to satisfy the Kafka component's control-plane
    prerequisite; the operator affirms the prerequisite on the Kafka in the same
    Release.

    Realized on Kubernetes by two Helm Recipes. `strimzi-operator-chart`
    renders the project's own chart, custom-resource definitions and the
    operator's full roles included, and is the one to reach for; its chart
    repository must be reachable from the build. `strimzi-operator` is a
    minimal bootstrap installing the operator alone, and at the image pinned
    here its role falls short of what the operator needs to run a Kafka
    cluster.

    The operator serves its own metrics on its pod. With
    `values.metrics_enabled` true each Recipe puts their port on a ClusterIP
    Service in the control plane's namespace and publishes the address as
    `metrics_endpoint`; false, that key is empty.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: messaging
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # The operator's own metrics, in the Prometheus format: /metrics on port
      # 8080, the port its health and metrics server is fixed to, over plain
      # HTTP on every address of its pod. The same server answers the liveness
      # and readiness paths, /healthy and /ready, and nothing else. They are
      # served whatever this value says, so false only keeps their address
      # unpublished; true puts the port on a ClusterIP Service of its own in
      # infra.namespace, reachable inside the cluster.
      metrics_enabled:
        type: boolean
        default: false
        description: Publishes the address of the operator's own metrics, in the Prometheus format, as `metrics_endpoint`, putting their port on a ClusterIP Service of its own; while false that key is empty. The port, which also answers the operator's liveness and readiness paths, checks no caller, so anything that reaches it can read them.
    infra:
      # Operator container image running the Strimzi Cluster Operator. The
      # default is the image the 1.3.0 chart composes from its own registry,
      # repository and tag defaults, so both realizations run one release.
      image:
        type: string
        default: "quay.io/strimzi/operator:1.3.0"
        description: Strimzi Cluster Operator image the control-plane Deployment runs. Pinned to a published release tag so the rendered workload names one version; a Release pulling from its own registry mirror sets this to that reference instead.
      namespace:
        type: string
        default: "kafka"
        description: Namespace the control plane is installed into and watches. The `strimzi-operator-chart` realization requires the Release to declare the same namespace for the component.
      # Read by the chart realization alone; the bootstrap pulls no chart.
      source_version:
        type: string
        description: Version of the Strimzi chart the `strimzi-operator-chart` realization pulls. Its default is the release whose application version is the tag of the image default above; changing it away from that default does not guarantee value-mapping compatibility with the new chart, and the image follows it only where it is set too.
      # Provider-specific overrides. Each Recipe documents which keys it reads;
      # the bootstrap reads none.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides; each Recipe documents the keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Nothing reaches the control plane at an address — it reconciles the
      # Kafka custom resources an operator-driven Kafka emits — so the one key
      # is the address a Prometheus server scrapes the operator's own metrics
      # at, while values.metrics_enabled is true. The Recipe publishes it
      # spelled out in full, its host qualified with infra.namespace, because
      # the Service lives in the control plane's own namespace rather than the
      # Release's.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>.<namespace>:8080/metrics`,
          the host qualified with the namespace the control plane runs in.
          Empty while values.metrics_enabled is false.
