apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/kinesis-data-streams
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Kinesis Data Streams is
  # a hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon Kinesis Data Streams data stream: AWS's managed stream of data
    records, which a producer writes to with PutRecord or PutRecords, each
    record's partition key placing it on one of the stream's shards, and
    which each consumer reads shard by shard, in sequence, independently of
    the others, for as long as the stream keeps the records. A producer and
    a consumer read arn, which each call and an IAM policy name the stream
    by.

    The stream takes the component's name. A client signs each call with its
    own IAM identity, so no credential is published and no credential slot
    is declared. The stream is created alone: no consumer, since an enhanced
    fan-out consumer is registered by its subscriber, no resource policy, so
    only the account owning the stream reads and writes it, no shard-level
    metrics, and no key or role. Its capacity, on demand or a provisioned
    number of shards, is the operator's, set in the Release.

    Kinesis Data Streams keeps each record for
    values.retention_period_hours and offers no backup of a stream. Deleting
    the stream, which removing its component from the Aggregate does,
    deletes every record it holds. Each Recipe's description says which
    keys it honours, which it refuses by name, and which key encrypts the
    stream.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The value carries the service's own default, so a bare `stream: {}`
  # keeps records for the period Kinesis Data Streams keeps them when none is
  # given, and every realization writes it whatever its tool would default
  # to. Its range is the one the Kinesis Data Streams Developer Guide gives
  # for a stream's retention period, and the schema halts the build on a
  # number outside it, naming the key. No credential slot: a client signs
  # each call with its own IAM identity, which the operator grants access to
  # the stream.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      retention_period_hours:
        type: integer
        minimum: 24
        maximum: 8760
        default: 24
        description: >
          The hours a record stays readable after it is written, 24 to 8,760
          (365 days), 24 unless set. Kinesis Data Streams makes a record
          inaccessible once it is older than the period, whether or not a
          consumer has read it, and lowering the period on a stream makes the
          records older than the new one inaccessible almost at once. AWS
          charges extra for a period above 24 hours.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      arn:
        type: string
        required: true
        description: >
          The stream's Amazon Resource Name, which a producer names as the
          StreamARN of each PutRecord and PutRecords call, a consumer in each
          call reading the stream and in registering an enhanced fan-out
          consumer, and an IAM policy granting access to the stream. Kinesis
          Data Streams takes it in place of the stream's name in each of
          those calls. It is not an address: a Kinesis client calls the
          service's endpoint in the stream's Region and names this ARN in the
          request. A realization publishes a pointer string the provisioning
          tool resolves once the stream exists, so a consumer reads this
          rather than composing one.

  # The rule Amazon Kinesis Data Streams holds a stream's name to, which every
  # realization's stream, named after the component, is created under. It
  # halts the build naming the component rather than leaving the creation to
  # fail.
  assertions:
    # Kinesis Data Streams takes a stream name of 1 to 128 letters, digits,
    # underscores, periods and hyphens (the CreateStream API reference's
    # StreamName).
    stream_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_.-]{1,128}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon Kinesis data stream, and Kinesis Data Streams takes a stream name of 1 to 128 letters, digits, underscores, periods and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
