apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/sqs
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon SQS is a hosted service
  # the reader contracts for with AWS, under AWS's terms, which no SPDX
  # identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon SQS queue: AWS's managed message queue, which a producer sends
    messages to and a consumer receives them from, deleting each once it has
    handled it. A standard queue delivers each message at least once and
    keeps a best-effort order; a FIFO queue, which values.fifo_queue asks
    for, delivers each once, in order within a message group. A consumer
    reads queue_url, which each send and receive call names, and arn, which
    an IAM policy names.

    The queue takes the component's name, ending in .fifo on a FIFO queue.
    A client signs each call with its own IAM identity, and the policy
    granting it access to the queue is the operator's, so no credential is
    published and no credential slot is declared. The queue is created alone:
    no dead-letter queue, no queue policy.

    SQS keeps each message for values.message_retention_period and offers no
    backup of a queue. Deleting the queue, which removing its component from
    the Aggregate does, deletes every message in it. Each Recipe's
    description says which keys it honours, which it refuses by name, and
    which key encrypts the queue.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Each value carries SQS's own default, so a bare `queue: {}` creates the
  # queue SQS creates when no attribute is given, and every realization
  # writes the same settings whatever its tool would default to. Each range is
  # the one the CreateQueue API reference gives for the attribute, and the
  # schema halts the build on a number outside it, naming the key.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      fifo_queue:
        type: boolean
        default: false
        description: >
          A FIFO queue, false unless set. A FIFO queue delivers each message
          once, in the order it was sent within its message group, and a
          producer names the message group on every message; its name ends in
          .fifo. SQS fixes a queue's type when it creates the queue, so
          changing this creates a new queue under the other name and deletes
          the old one with every message it holds.
      content_based_deduplication:
        type: boolean
        default: false
        description: >
          Deduplication by message body on a FIFO queue, false unless set.
          SQS then takes the SHA-256 hash of a message's body as its
          deduplication ID where the producer gives none, and delivers one
          copy of messages sent with the same ID within the deduplication
          interval. SQS offers it on a FIFO queue alone, so true with
          values.fifo_queue false halts the build, naming both keys.
      visibility_timeout:
        type: integer
        minimum: 0
        maximum: 43200
        default: 30
        description: >
          The seconds a received message stays hidden from other consumers,
          so the consumer that received it can handle and delete it, 0 to
          43,200 (12 hours), 30 unless set.
      message_retention_period:
        type: integer
        minimum: 60
        maximum: 1209600
        default: 345600
        description: >
          The seconds SQS keeps a message that no consumer deletes, 60 to
          1,209,600 (14 days), 345,600 (4 days) unless set. Lowering it on a
          queue holding messages older than the new period deletes them.
      delay_seconds:
        type: integer
        minimum: 0
        maximum: 900
        default: 0
        description: >
          The seconds every new message waits before a consumer can receive
          it, 0 to 900 (15 minutes), 0 unless set.
      maximum_message_size:
        type: integer
        minimum: 1024
        maximum: 1048576
        default: 1048576
        description: >
          The largest message, in bytes, the queue takes before SQS refuses
          it, 1,024 to 1,048,576 (1 MiB), 1,048,576 unless set.
      receive_message_wait_time_seconds:
        type: integer
        minimum: 0
        maximum: 20
        default: 0
        description: >
          The seconds a receive call waits for a message to arrive before it
          returns empty, 0 to 20: from 1, long polling; 0, unless set, short
          polling, which returns at once.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      queue_url:
        type: string
        required: true
        description: >
          The queue's URL, which a client names in each SendMessage,
          ReceiveMessage and DeleteMessage call. It is not the address a
          client connects to: an SQS client calls the service's endpoint in
          the queue's Region and names this URL in the request. A realization
          publishes a pointer string the provisioning tool resolves once the
          queue exists, so a consumer reads this rather than composing one.
      arn:
        type: string
        required: true
        description: >
          The queue's Amazon Resource Name, which an IAM policy granting
          access to the queue, or another service sending to it, names. A
          realization publishes a pointer string the provisioning tool
          resolves once the queue exists.

  # The rules Amazon SQS holds a queue to that the schema above cannot state,
  # since each reads two keys together or the component's name. Each halts
  # the build naming what to change rather than leaving the creation to fail.
  assertions:
    # SQS takes a queue name of up to 80 letters, digits, hyphens and
    # underscores, and a FIFO queue's name ends in .fifo, the suffix counted
    # among the 80 (the CreateQueue API reference's QueueName). The queue is
    # named after the component, followed by .fifo on a FIFO queue, so the
    # component's name takes 80 characters on a standard queue and 75 on a
    # FIFO queue.
    queue_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if .values.fifo_queue -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_-]{1,75}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon SQS FIFO queue, whose name ends in .fifo, and SQS takes a queue name of up to 80 letters, digits, hyphens and underscores, the .fifo suffix counted among them: rename the component in the Aggregate to 75 such characters or fewer" $n) -}}
      {{- end -}}
      {{- else if not (regexMatch `^[a-zA-Z0-9_-]{1,80}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon SQS queue, and SQS takes a queue name of up to 80 letters, digits, hyphens and underscores: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # ContentBasedDeduplication is one of the attributes the CreateQueue API
    # reference lists as applying to FIFO queues alone.
    content_based_deduplication_fifo: >-
      {{- if and .values.content_based_deduplication (not .values.fifo_queue) -}}
      {{- fail "values.content_based_deduplication is true while values.fifo_queue is false, and Amazon SQS deduplicates messages by their body on a FIFO queue alone: set values.fifo_queue to true in the Aggregate, or remove values.content_based_deduplication" -}}
      {{- end -}}
