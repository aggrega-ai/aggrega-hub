apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/twilio
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the carrier is operated by its provider and no source licence is granted for
  # it, so no single identifier expresses the situation. The class it falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A messaging and voice carrier reached over Twilio's REST API, so an
    application sends a text message or places a call without operating
    telephony infrastructure. The developer names the modality, text or call,
    and the direction, outbound, inbound or both; the operator supplies the
    account coordinate and the API base address. A deployment wires here rather
    than to a broker: a broker delivers inside the deployment, a carrier onto
    the public networks. Consumers read the base address, the account
    coordinate, the modality and the direction. Realized by reference: no
    compute runs here.
  labels:
    # A carrier the deployment calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Twilio authenticates a REST request with HTTP Basic, and its own
  # documentation states that API keys are the preferred way to authenticate:
  # the API key SID is the username and the API key secret is the password. That
  # is two pieces of secret material, so two slots. Both are secret-kind-pinned
  # but family-agnostic, so either a referenceable credential or an inject-value
  # credential may fill them per target. The account coordinate is not here: it
  # appears in the request path and in the provider's own response bodies, so it
  # is an identifier rather than secret material, and it lives in infra below.
  featuresSchema:
    api_key_sid:
      selector: "feature.aggrega.ai/kind=secret"
      required: true
      sensitive: true
      inject: [env]
      description: The API key identifier presented as the Basic-authentication username on every request to the carrier.
    api_key_secret:
      selector: "feature.aggrega.ai/kind=secret"
      required: true
      sensitive: true
      inject: [env]
      description: The API key secret presented as the Basic-authentication password on every request to the carrier.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      # The modality and the direction are values rather than labels because
      # nothing selects on them: they describe what this wiring is for, and a
      # deployment sets them. Both are published to consumers below so an
      # application reads them from one place instead of restating them.
      modality:
        type: string
        enum: [sms, voice]
        default: sms
        description: Which of the carrier's two channels this wiring addresses — a text message, or a call.
      direction:
        type: string
        enum: [outbound, inbound, bidirectional]
        default: outbound
        description: Whether the application originates traffic, receives it, or both.

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the carrier's documented public host, so
      # a deployment taking the default needs no operator input. It is sourced
      # from infra rather than fixed in a Recipe so an operator may repoint it at
      # a regional address or at a proxy the deployment routes egress through. A
      # deterministic pointer string the runtime resolves; the compiler never
      # contacts it.
      endpoint: { type: string, default: "https://api.twilio.com" }
      # The account coordinate the carrier's request paths are scoped by. It
      # carries no default because it is specific to the account a deployment
      # holds, and it is not secret material: the carrier renders it in the clear
      # in every response body it returns.
      account_sid:
        type: string
        required: true
        description: The account identifier the carrier's request paths are scoped by.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # carrier itself, so it reads all four from one place rather than each of its
    # own containers carrying a copy: where to call, which account to address,
    # which channel, and which direction. Credentials are not published and are
    # not carried across the edge — a credential attached to a slot above is
    # materialized in the deployment, and the consuming application references
    # the material it finds there under the name the deployment gave it.
    provides:
      endpoint: { type: string, required: true }
      account_sid: { type: string, required: true }
      modality: { type: string, required: true }
      direction: { type: string, required: true }
