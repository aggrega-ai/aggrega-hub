apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/telnyx
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the carrier is operated by its provider and no source licence is granted for
  # it, so no single identifier expresses the situation. The class it falls into
  # is stated instead through component.aggrega.ai/upstream-licensing below.
  description: >
    A messaging and voice carrier reached over Telnyx's REST API, so an
    application sends a text message or places a call without operating
    telephony infrastructure. The developer names the modality, text or call,
    and the direction, outbound, inbound or both; the operator supplies the API
    base address. Wire here rather than to a broker: a broker delivers inside
    the deployment, a carrier onto the public networks.
    Consumers read the base address, the modality and the direction. Realized by
    reference: no compute runs here.
  labels:
    # A carrier the deployment calls rather than runs: nothing in the cluster
    # serves it, so the operational primitive is a resource, and the trust
    # boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Telnyx authenticates a REST request with a single bearer token carried in the
  # authorization header, so one piece of secret material and one slot. No second
  # slot is declared for webhook verification: the carrier signs an inbound
  # webhook with a key pair and the application verifies it against the account's
  # PUBLIC key, so there is no shared secret for the deployment to hold. The slot
  # is secret-kind-pinned but family-agnostic, so either a referenceable
  # credential or an inject-value credential may fill it per target.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      required: true
      sensitive: true
      inject: [env]
      description: The bearer token carried in the authorization header of every request to the carrier.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      # The modality and the direction are values rather than labels because
      # nothing selects on them: they describe what this wiring is for, and the
      # Aggregate sets them. Both are published to consumers below so an
      # application reads them from one place instead of restating them.
      modality:
        type: string
        enum: [sms, voice]
        default: sms
        description: Which of the carrier's two channels this wiring addresses — a text message, or a call.
      direction:
        type: string
        enum: [outbound, inbound, bidirectional]
        default: outbound
        description: Whether the application originates traffic, receives it, or both.

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The API base address defaults to the carrier's documented public host, so
      # taking the default needs no operator input. It is sourced from infra
      # rather than fixed in a Recipe so an operator may repoint it at
      # a regional address or at a proxy the deployment routes egress through. A
      # deterministic pointer string the runtime resolves; the compiler never
      # contacts it.
      endpoint: { type: string, default: "https://api.telnyx.com" }

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # carrier itself, so it reads all three from one place rather than each of its
    # own containers carrying a copy: where to call, which channel, and which
    # direction. The credential is not published and is not carried across the
    # edge — a credential attached to the slot above is materialized in the
    # deployment, and the consuming application references the material it finds
    # there under the name it was given.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the carrier's API an application calls to send a message
          or place a call. The Release supplies it, so an operator may point
          it at a different host without the application changing.
      modality:
        type: string
        required: true
        description: >
          Which of the carrier's two channels this wiring addresses — a text
          message, or a call — carried through from the value the Aggregate
          declared. A consumer reads it to pick the request shape it sends.
      direction:
        type: string
        required: true
        description: >
          Whether the application originates traffic on this wiring, receives
          it, or both, carried through from the value the Aggregate declared.
          A consumer reads it to know whether it must also stand up a
          receiving path.
