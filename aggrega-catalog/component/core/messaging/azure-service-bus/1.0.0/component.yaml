apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/azure-service-bus
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Service Bus is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Service Bus namespace: Microsoft's managed message broker,
    holding the queues values.queues declares and the topics values.topics
    declares, each with the subscriptions it lists, created with the
    namespace. A consumer reads the namespace's host name and endpoint, and
    sends and receives through a Service Bus client library, over AMQP 1.0
    or HTTPS.

    The namespace takes requests authenticated with Microsoft Entra ID
    alone: its shared access signature authentication is off, so no key or
    connection string reaches a consumer and no credential slot is
    declared. A consumer authenticates as the managed identity it runs
    under, and the role assignment granting that identity the Azure Service
    Bus Data Sender or Data Receiver role is the operator's.

    Reach for it where an application in Azure exchanges messages through
    queues, or publishes to topics that subscribers each receive a copy
    from. Each Recipe's description says which keys it honours, which it
    refuses by name, and which tier it provisions. Microsoft documents that
    Service Bus keeps replicas of message data but offers no backup or
    restore of it, so no backup is configured, and a core/backup
    attachment halts, since that Feature applies to stateful servers.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `bus: {}` keeps a working contract: a
      # namespace holding no queue and no topic.
      queues:
        type: object
        default: {}
        propertyNames:
          pattern: "^[A-Za-z0-9]([A-Za-z0-9._/-]{0,258}[A-Za-z0-9])?$"
        additionalProperties:
          type: object
          properties:
            requires_session:
              type: boolean
              description: >
                First-in, first-out delivery by session, false unless set. A
                sender then sets a session identifier on every message, and a
                receiver accepts a session and takes its messages in order,
                holding them alone; a message with no session identifier is
                refused. Microsoft documents that the Basic tier offers no
                sessions, so a realization provisioning that tier halts on
                true, naming this key.
            max_delivery_count:
              type: integer
              minimum: 1
              maximum: 2147483647
              description: >
                How many times a message is delivered before the service
                moves it to the queue's dead-letter queue, 10 unless set,
                the service's default. Microsoft documents its minimum as 1,
                and the service keeps it as a 32-bit integer; the build
                halts on a number outside that range, naming this key.
          additionalProperties: false
        description: >
          The namespace's queues, a map from each queue's name to its
          settings, an empty map taking each setting's default. Microsoft
          documents a queue's name as 1 to 260 letters, digits, periods,
          hyphens, underscores and slashes, beginning and ending with a
          letter or a digit; the build halts on another, naming this key.
          Left empty, the namespace holds no queue.
      topics:
        type: object
        default: {}
        propertyNames:
          pattern: "^[A-Za-z0-9]([A-Za-z0-9._/-]{0,258}[A-Za-z0-9])?$"
        additionalProperties:
          type: object
          properties:
            subscriptions:
              type: object
              propertyNames:
                pattern: "^[A-Za-z0-9]([A-Za-z0-9._-]{0,48}[A-Za-z0-9])?$"
              additionalProperties:
                type: object
                properties:
                  requires_session:
                    type: boolean
                    description: First-in, first-out delivery by session, false unless set, as on a queue.
                  max_delivery_count:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
                    description: How many times a message is delivered before the service moves it to the subscription's dead-letter queue, 10 unless set, at least 1, as on a queue.
                additionalProperties: false
              description: >
                The topic's subscriptions, a map from each subscription's name
                to its settings, as a queue takes them. Each receives a copy
                of every message sent to the topic. Microsoft documents a
                subscription's name as 1 to 50 letters, digits, periods,
                hyphens and underscores, beginning and ending with a letter
                or a digit; the build halts on another, naming this key. Left
                out, the topic has no subscription, and a message sent to it
                reaches no receiver.
          additionalProperties: false
        description: >
          The namespace's topics, a map from each topic's name to its
          subscriptions. A topic's name follows a queue's rule. Microsoft
          documents that the Basic tier offers no topics, so a realization
          provisioning that tier halts on any, naming this key. Left empty,
          the namespace holds no topic.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The namespace's DNS name, which a Service Bus client library takes
          as the fully qualified namespace it connects to. A realization
          publishes a pointer string the provisioning tool resolves once the
          namespace exists, so a consumer reads this rather than deriving
          one, or the DNS name the Release sets in infra.overrides.host
          instead.
      endpoint:
        type: string
        description: >
          The namespace's URL as the service reports it, https:// followed by
          host and :443/. It carries no credential.
