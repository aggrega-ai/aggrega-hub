apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/azure-event-grid
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Event Grid is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Event Grid custom topic: Microsoft's managed event routing
    service, taking the events a publisher sends to the topic's endpoint in
    the format values.input_schema names and delivering each to the event
    subscriptions created on the topic. A consumer reads the topic's host
    name and endpoint and publishes through an Event Grid client library
    over HTTPS.

    The topic takes requests authenticated with Microsoft Entra ID alone:
    its access key and shared access signature authentication is off, so no
    key reaches a consumer and no credential slot is declared. A publisher
    authenticates as the managed identity it runs under, and the role
    assignment granting that identity the EventGrid Data Sender role is the
    operator's.

    No event subscription is declared: a subscription names the handler its
    events are delivered to, so it is the subscriber's, created on the topic
    apart from this Component. Reach for it where an application in Azure
    publishes events that other services subscribe to, each receiving the
    events its filter matches. Each Recipe's description says which keys it
    honours and which it refuses by name. Microsoft documents Event Grid as
    an event routing service with no backup or restore of its own, so no
    backup is configured, and a core/backup attachment halts, since that
    Feature applies to stateful servers.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: messaging
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The value
      # carries a default, so a bare `notices: {}` keeps a working contract: a
      # topic taking events in Event Grid's own schema.
      input_schema:
        type: string
        enum: [EventGridSchema, CloudEventSchemaV1_0]
        default: EventGridSchema
        description: >
          The format a publisher sends events to the topic in, spelt as
          Microsoft spells it: EventGridSchema, Event Grid's own event
          schema, unless set; or CloudEventSchemaV1_0, the JSON form of the
          CloudEvents 1.0 specification. Microsoft documents a third format, a
          custom event schema, which needs a mapping of the publisher's
          fields onto Event Grid's schema that this Component does not
          declare, so it is not offered; the build halts on another value,
          naming this key. Each event subscription chooses the format its
          events are delivered in.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The topic's DNS name, the host of the endpoint the service reports.
          A realization publishes a pointer string the provisioning tool
          resolves once the topic exists, so a consumer reads this rather
          than deriving one, or the DNS name the Release sets in
          infra.overrides.host instead.
      endpoint:
        type: string
        description: >
          The URL a publisher sends events to, as the service reports it,
          https:// followed by host and /api/events, which an Event Grid
          client library takes as the topic's endpoint. It carries no
          credential.
