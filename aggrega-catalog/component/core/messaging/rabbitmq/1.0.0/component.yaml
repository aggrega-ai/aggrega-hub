apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/rabbitmq
  version: 1.0.0
  description: >
    A RabbitMQ message broker speaking the AMQP protocol. RabbitMQ persists
    queues and messages durably, so the component renders as a stateful
    workload with a persistent volume and declares storage sizing. Broker
    access always requires credentials: the password is an optional,
    transparent credential slot, and each Recipe falls back to a deterministic
    inline development default when no credential is attached so the render
    stays reproducible. Provider-agnostic: the same component is implemented by
    a Helm Recipe (Workload synthesis to native Kubernetes resources), a Compose Recipe (local
    development), and a controller-driven Helm Recipe that emits a RabbitmqCluster
    custom resource for the RabbitMQ Cluster Operator to reconcile. Reach for the
    synthesis Recipe on a cluster that runs no RabbitMQ control plane — it needs no
    controller installed and no chart repository — and for the controller-driven
    Recipe where the control plane is already in place and the cluster should own
    upgrades, rolling restarts and credential rotation. Exports its host and AMQP
    port to consumers via the uses topology.

    The broker serves its own metrics on every realization. With
    `values.metrics_enabled` true each Recipe makes their port reachable at the
    published host and publishes the address as `metrics_endpoint` — the
    controller-driven one while the cluster runs one node; false, that key is
    empty.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: messaging
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. RabbitMQ always authenticates, so when
    # a credential is attached here the Recipe wires the broker
    # password through the credential subsystem; when unattached, the Recipe
    # falls back to a deterministic inline development default. `required`
    # omitted → optional, so a bare `broker: {}` still loads.
    # Transparent (inject: [env]) so the injected value reaches the Recipe on
    # the env pipe; the selector is secret-kind-pinned but family-agnostic so
    # either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional broker password credential. When attached, supplies the RabbitMQ application-user password via the credential subsystem; unattached, the Recipe uses a deterministic inline development default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      user:
        type: string
        default: "user"
        description: Application user the broker provisions on startup. The matching password comes from the optional password credential slot.
      # The broker's own metrics, in the Prometheus format, from its prometheus
      # plugin, which the image and the RabbitMQ Cluster Operator both switch
      # on: port 15692, at /metrics, a listener serving those metrics and
      # nothing else. Each Recipe leaves them on whatever this value says, so
      # false only keeps their address unpublished. True puts the port on the
      # synthesized Kubernetes Service; on Compose any peer on the network
      # already reaches it, and the controller-driven Recipe's client Service
      # carries it already. That Recipe publishes the address while the cluster
      # runs one node, and leaves it empty for more: one address then reaches a
      # different node at each scrape, and each node serves only its own.
      metrics_enabled:
        type: boolean
        default: false
        description: Publishes the address of the broker's own metrics, in the Prometheus format, as `metrics_endpoint`, putting their port on the Service where a realization needs it; while false that key is empty. The metrics port checks no caller, so anything that reaches it can read them.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5672
        description: AMQP listen port. Most operators should omit this and let the Recipe assign the default (5672).
      management_port:
        type: integer
        min: 1024
        max: 65535
        default: 15672
        description: Management HTTP API and dashboard port. Most operators should omit this and let the Recipe assign the default (15672).
      engine_version:
        type: string
        default: "4.1.3-management-alpine"
        description: RabbitMQ container image tag. Selects the image tag on container targets; the chart-backed target pins its own engine version in the chart.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 8Gi
          type:
            type: string
            description: >
              Storage class the broker's persistent volume is provisioned from
              on Kubernetes. Leave it unset to take the cluster's default storage
              class; set it to name another class the cluster offers. The Compose
              Recipe names no class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the RabbitMQ Cluster Operator (control plane) is
          installed in the target cluster. A controller-driven realization halts the
          build unless this is set true, so a RabbitmqCluster custom resource is never
          emitted as an orphan into a cluster that cannot reconcile it. The
          synthesized realizations ignore this flag.
      credentials:
        type: string
        enum: [generated, supplied]
        default: generated
        description: >
          Who owns the broker's credentials on a controller-driven realization.
          `generated` — the controller creates the credential Secret and owns the
          password, which is what it does when nothing is supplied; the developer's
          `user` value is still honored, and no password reaches the rendered
          artifact. `supplied` — the controller reads the credentials from an
          existing Secret named in `credentials_secret` and generates none. The
          synthesized realizations ignore this key: they always take the password
          from the `password` credential slot.
      credentials_secret:
        type: string
        default: ""
        description: >
          Name of the existing Secret a controller-driven realization reads the
          broker credentials from when `credentials` is `supplied`. The Secret lives
          in the same namespace as the broker and carries the same entries the
          controller would otherwise generate — `username`, `password`,
          `default_user.conf`, `host`, `port`, `provider` and `type`. Leave it empty
          when `credentials` is `generated`; a controller-driven build halts if
          `supplied` is selected without it.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a producer or consumer opens its broker connection to. Which
          Service carries it follows the realization the Manifest selected, so
          a consumer reads this rather than deriving a name.
      port:
        type: integer
        required: true
        description: >
          TCP port the broker accepts client connections on. It carries the
          messaging port, never the management API port, so a consumer reaches
          the broker rather than its dashboard.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `amqp`, which is what a consumer selects a client library for.
      # The address a Prometheus server scrapes the broker's own metrics at,
      # while values.metrics_enabled is true: /metrics on port 15692 of the
      # published host. Every Recipe publishes it spelled out in full, because a
      # provides entry cannot read another.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:15692/metrics`. Empty
          while values.metrics_enabled is false, and on the controller-driven
          realization while the cluster runs more than one node.
