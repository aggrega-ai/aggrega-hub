apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/messaging/rabbitmq-cluster-operator
  version: 1.0.0
  license: MPL-2.0
  description: >
    The RabbitMQ Cluster Operator, declared as an explicit component so a
    controller-driven RabbitMQ realization can ship its runtime prerequisite
    alongside the RabbitmqCluster custom resource it emits, rather than assuming an
    ambient install. The control plane is the controller that reconciles
    RabbitmqCluster custom resources into running brokers, their client Services
    and their credential Secrets. Declare this component in the same Aggregate as a
    controller-driven RabbitMQ to satisfy the RabbitMQ component's control-plane
    prerequisite; the operator affirms the prerequisite on the broker in the same
    Release. Realized on Kubernetes via its Helm Recipe.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: messaging
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      image:
        type: string
        default: "ghcr.io/rabbitmq/cluster-operator:2.23.0"
        description: RabbitMQ Cluster Operator image the control-plane Deployment runs. Pinned to a release tag so the rendered workload references an immutable version.
      namespace:
        type: string
        default: "rabbitmq-system"
        description: Namespace the control plane is installed into and watches.
