apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/messaging/rabbitmq-cluster-operator
  version: 1.0.0
  license: MPL-2.0
  description: >
    The RabbitMQ Cluster Operator, declared as an explicit component so a
    controller-driven RabbitMQ realization can ship its runtime prerequisite
    alongside the RabbitmqCluster custom resource it emits, rather than assuming an
    ambient install. The control plane is the controller that reconciles
    RabbitmqCluster custom resources into running brokers, their client Services
    and their credential Secrets. Declare this component in the same Aggregate as a
    controller-driven RabbitMQ to satisfy the RabbitMQ component's control-plane
    prerequisite; the operator affirms the prerequisite on the broker in the same
    Release. Realized on Kubernetes via its Helm Recipe.

    The controller serves its own metrics on its pod. With
    `values.metrics_enabled` true the Recipe puts their port on a ClusterIP
    Service in the control plane's namespace and publishes the address as
    `metrics_endpoint`; false, that key is empty.
  labels:
    component.aggrega.ai/type: worker
    component.aggrega.ai/category: messaging
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # The controller's own metrics, in the Prometheus format: /metrics on
      # port 8080, the controller's default metrics address, over plain HTTP on
      # every address of its pod, from a listener serving those metrics and
      # nothing else. They are served whatever this value says, so false only
      # keeps their address unpublished; true puts the port on a ClusterIP
      # Service of its own in infra.namespace, reachable inside the cluster.
      metrics_enabled:
        type: boolean
        default: false
        description: Publishes the address of the controller's own metrics, in the Prometheus format, as `metrics_endpoint`, putting their port on a ClusterIP Service of its own; while false that key is empty. The metrics port checks no caller, so anything that reaches it can read them.
    infra:
      image:
        type: string
        default: "ghcr.io/rabbitmq/cluster-operator:2.23.0"
        description: RabbitMQ Cluster Operator image the control-plane Deployment runs. Pinned to a release tag so the rendered workload references an immutable version.
      namespace:
        type: string
        default: "rabbitmq-system"
        description: Namespace the control plane is installed into and watches.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Nothing reaches the control plane at an address — it reconciles the
      # RabbitmqCluster custom resources a controller-driven RabbitMQ emits — so
      # the one key is the address a Prometheus server scrapes the controller's
      # own metrics at, while values.metrics_enabled is true. The Recipe
      # publishes it spelled out in full, its host qualified with
      # infra.namespace, because the Service lives in the control plane's own
      # namespace rather than the Release's.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>.<namespace>:8080/metrics`,
          the host qualified with the namespace the control plane runs in.
          Empty while values.metrics_enabled is false.
