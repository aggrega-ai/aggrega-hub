apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/database/ai-datastore
  version: 1.0.0
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        consistency: { type: string, enum: [strong, eventual], default: strong }
        indexPolicy: { type: string }
      required: [consistency]
