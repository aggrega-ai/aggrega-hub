apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/database/mariadb
  version: 1.0.0
  description: >
    A MariaDB relational database. Provider-agnostic: the same component
    is implemented by Helm Recipes (Bitnami chart on Kubernetes),
    Terraform Recipes (AWS RDS, Azure Database), CloudFormation Recipes,
    and Compose Recipes (local development).
  labels:
    component.aggrega.ai/type: stateful-server
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides
  # keys into env or file delivery mechanisms.
  inject: [env, file]

  # Credential slots. inject: [] = blackbox (Recipe controls delivery).
  # inject: [env, file] = transparent (developer may dictate delivery).
  # required: false is the default (omitted = optional).
  secretsSchema:
    root_password:
      required: true
      inject: []
      description: Root database password. Recipe controls delivery (Black-Box).
    user_password:
      inject: [env, file]
      description: Application user password, auto-generated if omitted.

  cueSchema: |
    // values — Developer Intent
    // Filled by the Developer in the Aggregate.
    values: {
      // Logical database name created on startup.
      database: string

      // MariaDB server version.
      version: string | *"11.4"

      // Application-level database user (non-root).
      // Omit for root-only access.
      user?: string

      // Default character set and collation.
      charset:   string | *"utf8mb4"
      collation: string | *"utf8mb4_general_ci"

      // Connection port. Most applications should omit this and let
      // the Recipe assign the default (3306).
      port: int & >=1024 & <=65535 | *3306

      // SQL scripts executed on first database initialization.
      // Each key is a filename, each value is the SQL content.
      // Scripts run in alphabetical key order.
      init_scripts?: [string]: string

      // Raw server configuration block (my.cnf format).
      // Injected verbatim into the server configuration file.
      custom_config?: string
    }

    // infra — Operational Sizing
    // Filled by Ops in the Release. Developer never sees this.
    infra: {
      // Server binary version.
      engine_version: string | *"11.4"

      // Source artifact version (Helm chart, Terraform module, etc.).
      // Overrides the Recipe's default source version.
      // Changing from default does not guarantee value mapping compatibility.
      source_version?: string

      compute: {
        cpu:    string | *"250m"
        memory: string | *"512Mi"
      }

      storage: {
        size: string | *"10Gi"
        type: string | *"gp3"
      }

      ha: {
        enabled:       bool | *false
        read_replicas: int & >=0 | *0
      }

      backup: {
        enabled:        bool | *true
        retention_days: int & >=0 | *7
      }

      // Provider-specific overrides. Accepts any nested structure.
      // Each Recipe documents which keys it reads.
      overrides?: _
    }

    // provides — Public API Contract
    // Keys exported to consumers via uses topology edges.
    provides: {
      host:     string
      port:     string
      protocol: string
    }