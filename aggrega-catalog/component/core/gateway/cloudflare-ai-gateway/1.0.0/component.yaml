apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  # The name keeps -gateway although it repeats the category. AI Gateway is the
  # product's own name: cloudflare-ai would read as Cloudflare's model service,
  # and cloudflare alone as Cloudflare Gateway, a different product of the same
  # vendor.
  name: core/gateway/cloudflare-ai-gateway
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and a hosted service grants
  # no source licence, so there is none to name. The class is stated through
  # component.aggrega.ai/upstream-licensing below.
  description: >
    Cloudflare's AI Gateway, a hosted service in front of model providers: a
    caller sends its model requests to the gateway, which forwards them to the
    provider. Nothing runs in the Release and the compiler never calls
    Cloudflare. It publishes the address of one of the gateway's endpoints,
    composed from the Cloudflare account and the gateway's id, and the model a
    caller asks for, which the gateway forwards unchecked.

    On terraform its Recipe creates the gateway in the account and is the one
    that carries controls: reach for it where the Release is to create the
    gateway and set them. On helm and compose its Recipes reference a gateway
    that already exists and carry no Feature: reach for those where the gateway
    is created and configured outside the Release.

    The terraform Recipe realizes core/period-budget, in US dollars over a
    moving window, and core/retry-policy. Not realized: core/semantic-caching,
    as the cache answers identical requests only; core/fallback-chain, as a
    request falls back only inside a route it names; core/audit-logging,
    core/data-masking, core/prompt-injection-shield and core/target-selection.

    It holds no credential. What a gateway does when it serves a request is
    Cloudflare's documented behaviour and no build observes it. It carries no
    model.aggrega.ai/api label, so an agent's model socket does not take it.
  labels:
    # A hosted service the Release does not run: platform-managed
    # infrastructure, as a managed model API is.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: gateway
    # mixed: the terraform Recipe creates the gateway in the operator's own
    # Cloudflare account, which Cloudflare then runs (managed), and the helm and
    # compose Recipes reference one that already exists (external).
    component.aggrega.ai/hosting: mixed
    # A hosted service under Cloudflare's own terms, which the user contracts
    # for directly.
    component.aggrega.ai/upstream-licensing: proprietary
    # The gateway reads each model request it forwards: the model it names, the
    # tokens it reports and the content its own checks inspect. So a runtime
    # control that has to parse a model payload can attach here.
    gateway.aggrega.ai/intelligence: semantic
    # Period budget: the gateway can refuse model requests once what its traffic
    # has cost over a time window, in US dollars, priced from the pricing it
    # keeps per model, exceeds a limit set in its configuration, which is the
    # fidelity this value names. It counts only models whose pricing it knows,
    # and refuses nothing until core/period-budget is attached on the terraform
    # Recipe.
    dataplane.aggrega.ai/period-budget: cost
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Why each AI gateway control this gateway's reference names is or is not
  # realized here:
  # - core/period-budget: a spend-limit rule on the gateway's own resource,
  #   which its terraform realization writes.
  # - core/retry-policy: the gateway's own retry count, written the same way.
  # - core/semantic-caching: the gateway's cache answers a request identical to
  #   an earlier one, never a similar one, so it does not take the name.
  # - core/fallback-chain: the gateway falls back between models only inside a
  #   dynamic route, which a request reaches by naming the route through the
  #   compat endpoint rather than the model it asks for, so a request for a
  #   model never falls back.
  # - core/audit-logging: the gateway keeps its request log for as long as the
  #   account's plan keeps it, not for a number of days a Release sets, and
  #   keeps it without the Feature attached; a caller may also skip it per
  #   request.
  # - core/data-masking: its data loss prevention flags or blocks a request; it
  #   does not replace the matched text.
  # - core/prompt-injection-shield: its guardrails name categories of harmful
  #   content, not prompt injection.
  # - core/target-selection: its automatic router picks a model by what a
  #   request asks, not between targets serving the same request.
  #
  # No credential slot is declared, because no Recipe here delivers one. The
  # gateway's own resource names none: Terraform authenticates to Cloudflare
  # with the API token in the environment it runs in. A caller presents its own
  # token to the gateway, and a provider key either travels with the caller's
  # request or is stored in the account by its operator.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        model:
          type: string
          min: 1
          description: "The model a caller asks the gateway for, written as the endpoint named by provider_endpoint expects it: the provider's own model name on a provider's endpoint, such as gpt-4o-mini on openai, or provider/model on compat, such as openai/gpt-4o-mini. Published as model; the gateway forwards it to the provider without checking it."
      required: [model]
    infra:
      # The account and the gateway are named by the operator, and the
      # published address is composed from them, so it is a string fixed ahead
      # of time rather than one anything has to resolve.
      account_id:
        type: string
        required: true
        min: 1
        description: "The identifier of the Cloudflare account the gateway belongs to. An identifier, not a credential: it is part of the gateway's address."
      gateway_id:
        type: string
        required: true
        min: 1
        max: 64
        description: "The gateway's id within the account. The terraform Recipe creates the gateway under it; the helm and compose Recipes reference the gateway that already carries it."
      provider_endpoint:
        type: string
        default: openai
        pattern: "^[a-z0-9-]+$"
        description: "Which of the gateway's endpoints the published address names, as the last segment of that address: a provider's own endpoint, such as openai, which speaks that provider's own API, or compat, the endpoint speaking the OpenAI chat completions API for every provider. The value is Cloudflare's own vocabulary and is passed through as written."
      # Two of the gateway's own settings. Only the terraform Recipe writes
      # them, because it is the one Recipe that configures the gateway; the
      # helm and compose Recipes reference a gateway configured elsewhere and
      # leave both alone.
      authentication:
        type: boolean
        default: true
        description: "Whether the gateway refuses a request that presents no Cloudflare API token allowed to run requests through it. Off, anyone holding the address can send requests through the gateway. Written by the terraform Recipe only."
      collect_logs:
        type: boolean
        default: true
        description: "Whether the gateway logs each request it serves, prompt and response included, in the account. On is Cloudflare's own default; how long a log is kept follows the account's plan. Written by the terraform Recipe only."
    provides:
      endpoint:
        type: string
        required: true
        description: "The address of the gateway endpoint named by provider_endpoint, https://gateway.ai.cloudflare.com/v1/<account_id>/<gateway_id>/<provider_endpoint>. A client of the provider's API uses it as its base address."
      model:
        type: string
        required: true
        description: "The model a caller asks for, carried through from values.model."
