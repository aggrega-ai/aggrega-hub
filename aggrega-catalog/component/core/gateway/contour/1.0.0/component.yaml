apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/contour
  version: 1.0.0
  description: >
    A Contour ingress gateway. Contour is a Kubernetes-native ingress
    controller: its control plane watches the cluster's Ingress and HTTPProxy
    resources and programs an Envoy data plane, which terminates client HTTP and
    HTTPS traffic and load-balances it to the backing services those resources
    name. Because its routing input is the cluster's own Ingress objects rather
    than a wired upstream, the gateway takes no `uses` edge; applications reach
    it by declaring Ingress resources against its ingress class. Contour is
    realized on Kubernetes through a Helm Recipe; it has no
    standalone local-container form, so no Compose Recipe is provided. Exports
    the Envoy data-plane host and listen port to consumers via the provides
    contract.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      ingress_class_name:
        type: string
        default: "contour"
        description: Name of the IngressClass this controller reconciles. Applications route to the gateway by referencing this class in their Ingress or HTTPProxy resources.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1
        max: 65535
        default: 80
        description: HTTP port the Envoy data-plane service listens on. Most operators should omit this and let the Recipe assign the default (80).
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via the provides contract.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
