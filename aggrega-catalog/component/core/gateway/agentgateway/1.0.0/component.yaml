apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/agentgateway
  version: 1.0.0
  license: Apache-2.0
  description: >
    agentgateway, an open-source gateway for model, tool and agent traffic,
    serving the OpenAI chat-completions API in front of the models wired to
    it. It terminates client HTTP traffic on its data-plane port, publishes
    that port's host, port and protocol, and runs from one configuration file
    with no state of its own.

    Each model wired to its models socket is served under the connection's
    alias: a request names the alias as its model at the gateway's one /v1
    base URL, and is sent to the endpoint and model name the model publishes,
    presenting that connection's credential. It publishes that base URL as
    its endpoint and values.model as its model, so an agent's model socket
    takes it in place of a model; with nothing wired it serves no model and
    both are empty.

    It realizes none of the AI Features its labels admit: attaching one halts
    the build when the Recipe for it is resolved, naming its type.

    Two realizations run the same image, pinned by digest, from the same
    configuration. On Kubernetes, `agentgateway-chart` renders the project's
    standalone Helm chart, which the build fetches from the project's
    registry. Under Docker Compose, `agentgateway` runs it as one service.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
    # Model API: the endpoint this gateway publishes answers the OpenAI API —
    # the chat-completions route agentgateway serves under /v1 for the models
    # wired to its models socket, each chosen by the alias a request names as
    # its model — so a consumer drives it with an OpenAI client whichever model
    # answers behind it. It is what lets a model socket selecting this key
    # admit the gateway beside the models themselves; the gateway publishes the
    # endpoint and the model name such a socket's consumers read. The value
    # names what the product serves, not a configured state: with nothing wired
    # to the models socket the gateway serves no model, and both of those are
    # empty. Read off agentgateway's own reference at v1.6.0, the release both
    # Recipes run.
    model.aggrega.ai/api: openai
    # The gateway capability dimension: agentgateway reads the body of each
    # request on its model-serving paths to find the model it names, which is
    # how it chooses the entry a request is sent to, and it reads the tokens
    # each reply reports. A runtime control that has to parse a model payload
    # can therefore attach here. The value names what the product does on
    # those paths, not a configured state: with nothing wired to the models
    # socket no request is routed by its model.
    gateway.aggrega.ai/intelligence: semantic
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The models the gateway serves, each wired as a connection: any ai-model
    # Component, managed or self-hosted, one or several. Each connection is
    # one model entry in the gateway's configuration, named by the
    # connection's alias: a request naming that alias as its model, on the
    # gateway's chat-completions route at /v1/chat/completions, is sent to the
    # endpoint the model publishes with /chat/completions appended, asking for
    # the model name the model publishes whatever name the request carried —
    # pointers the compiler pipes into the configuration and never resolves.
    # Every alias shares the one /v1 base URL, so the model name a request
    # sends chooses the model. The gateway writes a wired model's entry for
    # the OpenAI API alone, as an OpenAI-compatible provider accepting chat
    # completions, so a connection whose target's model.aggrega.ai/api is not
    # openai halts the build, naming it. A published endpoint that is not an
    # absolute http or https URL, or that carries user information, a query
    # or a fragment, halts the build where the configuration is written,
    # because agentgateway refuses such a base URL when it reads the file.
    #
    # The credential the gateway presents to a wired model is the one its
    # connection carries in the credential slot, sent as a bearer token. The
    # configuration names the variable holding it, never the value, and
    # agentgateway replaces the variable with its value from its environment
    # when it reads the file; a variable missing from that environment stops
    # the gateway at start-up rather than sending its name. A connection
    # carrying none adds no credential. A connection to a target labelled
    # component.aggrega.ai/hosting: managed with no credential halts the build
    # unless its values set unauthenticated: true. A self-hosted server that
    # checks a key holds it in a slot of its own, and its connection carries a
    # credential holding the same key.
    #
    # Optional: with nothing wired, the gateway serves no model and its
    # configuration lists none.
    models:
      selector: "component.aggrega.ai/category=ai-model"
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the gateway presents to the model this connection reaches, as a bearer token. When attached, the Recipe delivers it as AI_PROXY_<ALIAS>_API_KEY, the connection's alias in capitals with every character other than a letter or a digit as an underscore — a Kubernetes secretKeyRef to the Secret the credential publishes on the chart realization, which halts the build when it publishes none, and the value the credential publishes under that name on the inject pipe on compose — and the connection's model entry names $AI_PROXY_<ALIAS>_API_KEY, which agentgateway replaces from its environment, never the value. Unattached, the entry adds no credential."

  schema:
    # The models the gateway serves arrive on the models socket, so the one
    # developer value is the alias it publishes as its model.
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      #
      # The alias this gateway publishes as its model. A component wired to the
      # gateway's address over a model socket — an agent, a tool, a memory store
      # — reads one endpoint and one model name off the edge, the same keys a
      # model publishes; the endpoint is the gateway's /v1 base URL and the
      # model name is the alias. A Recipe writes the gateway's published values
      # from what the gateway itself was given, which holds none of its
      # connections, so the published alias is named here rather than taken
      # from the socket: with a connection on the models socket this value is
      # required, and with none it is omitted.
      model:
        type: string
        description: The alias of a connection on the models socket that this gateway publishes as its model, the model name a consumer wired to it sends. It must be an alias a models connection carries, and the build halts naming this value otherwise; it is required while the models socket holds a connection, and omitted while it holds none.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # The data-plane port: the port the configuration's gateway listens on
      # and the port of the Service or compose service in front of it, so the
      # published address and the listener move together. The default is the
      # port agentgateway serves model traffic on when a configuration names
      # none. The image runs as an unprivileged user with no capability to bind
      # a port below 1024.
      http_port:
        type: integer
        min: 1024
        max: 65535
        default: 4000
        description: Data-plane port consumers connect to.
      source_version:
        type: string
        description: Version of the standalone Helm chart the chart-backed realization pulls. The realization holds the chart versions its configuration is proven at, and the build halts naming them on any other. The compose realization pulls no chart and ignores it.
      # The gateway's own resources. The chart realization sets them as the
      # container's limits beside the chart's own requests; the compose
      # realization sets them as both.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          DNS name of the Service, or the compose service, fronting the
          gateway's data plane, the name alone without a namespace. A consumer
          sends its client traffic here rather than to the model behind the
          gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that address accepts model traffic on, infra.http_port.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
      # endpoint and model together are the contract every model component
      # publishes, which is what lets a model socket take this gateway in place
      # of a model with its consumer's Recipe unchanged. Neither is required:
      # with nothing wired to the models socket the gateway serves no model and
      # publishes both empty.
      endpoint:
        type: string
        description: >
          Full base URL of the OpenAI-compatible API the gateway serves, with
          the host, the port and /v1 composed. A caller hands it to a client
          library as its base URL and names values.model as its model; every
          other wired model is served at the same base URL under its own
          alias. Empty while nothing is wired to the models socket.
      model:
        type: string
        description: >
          The alias a consumer wired to the gateway sends as its model name:
          values.model. The gateway sends the request on asking for the model
          name the wired model publishes. Empty while nothing is wired to the
          models socket.

  # The rules of the models socket, with the credential rule every socket
  # declaring unauthenticated carries. Each reads what the Aggregate and the
  # Release wrote — the values, and each connection's target labels, values
  # and attachments — all known before a Recipe binds, so each holds whichever
  # Recipe renders this component and halts before anything renders.
  #
  # DELIBERATE NEAR-DUPLICATES: published_model_is_a_wired_alias,
  # wired_model_speaks_the_openai_api, credential_variables_are_distinct and
  # managed_target_needs_a_credential repeat the rules core/gateway/apisix
  # declares for its models socket. Each assertion sits inside the entity it
  # guards, and no catalog kind holds an assertion for several components to
  # share; here an alias is a model name a request sends to one base URL,
  # where on APISIX it is a path segment.
  assertions:
    # The model the gateway publishes must be one it serves. values.model names
    # the alias of a connection on the models socket, and is required while the
    # socket holds one, because the published values are written from what the
    # gateway was given and a connection is not among it. With nothing wired, a
    # value naming an alias names a model the gateway does not serve.
    published_model_is_a_wired_alias: >-
      {{- $wired := sortAlpha (keys (optional .uses "models" dict)) -}}
      {{- with optional .values "model" "" -}}
      {{- if not (has . $wired) -}}
      {{- if $wired -}}
      {{- fail (printf "values.model is %q, but no connection on the models socket carries that alias, so a component wired to this gateway would ask for a model it does not serve; set values.model to one of the aliases the models socket carries: %s" . (join ", " $wired)) -}}
      {{- else -}}
      {{- fail (printf "values.model is %q, but nothing is wired to the models socket, so the gateway serves no model to publish under that alias; wire a model to the models socket under that alias, or remove values.model" .) -}}
      {{- end -}}
      {{- end -}}
      {{- else -}}
      {{- if $wired -}}
      {{- fail (printf "values.model is not set, but the models socket carries %s, so the gateway cannot tell which of them a component wired to it asks for, and the alias a connection is served under is not among what its published values are written from; set values.model to one of them" (join ", " $wired)) -}}
      {{- end -}}
      {{- end -}}
    # A wired model's entry is written from the endpoint and the model name the
    # model publishes, for agentgateway to reach over the OpenAI API, which is
    # what model.aggrega.ai/api: openai asserts answers at that endpoint. A
    # model whose API is another needs that provider's own settings, which
    # nothing the model publishes names, so it halts rather than being written
    # as a guess.
    wired_model_speaks_the_openai_api: >-
      {{- range $alias, $connection := (optional .uses "models" dict) -}}
      {{- $api := optional $connection.labels "model.aggrega.ai/api" "" -}}
      {{- if ne $api "openai" -}}
      {{- fail (printf "the models connection %s of %q reaches %q, whose model.aggrega.ai/api is %q, but the gateway writes a wired model's entry from the endpoint and model name it publishes for the OpenAI API alone, so it cannot write an entry for it; wire a model whose model.aggrega.ai/api is openai instead" $alias $.metadata.instance_id $connection.target $api) -}}
      {{- end -}}
      {{- end -}}
    # The Recipes name the variable a models connection's credential is
    # delivered under after the connection's alias in capitals, with every
    # character other than a letter or a digit as an underscore, so two aliases
    # that rule maps to one name — fast-a and fast_a — would deliver two
    # credentials under one variable. It halts, naming both connections.
    credential_variables_are_distinct: >-
      {{- $seen := dict -}}
      {{- range $alias, $connection := (optional .uses "models" dict) -}}
      {{- if hasKey $connection.features "credential" -}}
      {{- $variable := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" -}}
      {{- with get $seen $variable -}}
      {{- fail (printf "the models connections %s and %s of %q would each deliver their credential under one variable, because the gateway names a connection's variable after its alias in capitals with every character other than a letter or a digit as an underscore; rename one of the two connections" . $alias $.metadata.instance_id) -}}
      {{- end -}}
      {{- $_ := set $seen $variable $alias -}}
      {{- end -}}
      {{- end -}}
    # A connection to a target its catalog labels a managed service
    # (component.aggrega.ai/hosting: managed) carries a credential, or says on
    # the connection that its target takes none. The rule reads the target's
    # labels, the connection's unauthenticated value and its credential slot,
    # all known before a Recipe binds, so it holds whichever Recipe renders this
    # component; a self-hosted target draws nothing. The list names every
    # socket of this component that declares unauthenticated.
    managed_target_needs_a_credential: >-
      {{- range $socket := list "models" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional (optional $connection "values" dict) "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
