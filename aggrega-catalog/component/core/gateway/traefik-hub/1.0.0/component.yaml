apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/gateway/traefik-hub
  version: 1.0.0
  description: >
    Traefik Hub, Traefik's paid gateway: the Traefik proxy run from Traefik
    Hub's own image, with an API gateway and an AI gateway a licence token
    unlocks. It serves each model wired to its models socket at
    /<alias>/v1/chat/completions through Traefik Hub's Chat Completion
    middleware.

    The operator supplies the image: Traefik distributes Traefik Hub under its
    own terms, so the Release names in infra.image one it is entitled to pull,
    and the catalog names none. Nothing renders until the Release sets
    `infra.image`. The licence token reaches the gateway by reference to a
    Secret in the required license slot.

    A Release may name its callers in infra.callers and their key hashes
    through the caller_keys slot; every model route then refuses a request
    with no declared key, and removes the key before forwarding.

    Through Traefik Hub's AI gateway it realizes core/period-budget,
    core/prompt-deny-patterns, core/semantic-caching and core/data-masking,
    each halting the build until infra.ai_gateway_entitled affirms the
    licence carries it; through Traefik's own failover and retry,
    core/fallback-chain and core/retry-policy. core/prompt-injection-shield,
    audit logging, target selection and reply validation halt, naming why.

    Traefik requires outbound HTTPS to api.traefik.io, where the gateway
    validates its token. A token lasts a year by default, and the gateway
    stops once it expires. The compiler validates no token and contacts no
    vendor, so a clean build cannot say whether the gateway starts, serves or
    enforces anything.

    With `values.metrics_enabled` true a ClusterIP Service carries the
    gateway's metrics port, which checks no caller, and the address is
    published as `metrics_endpoint`; false, that key is empty.
  # Realized on Kubernetes by traefik-hub-chart alone, which wraps Traefik's own
  # Helm chart; there is no compose realization.
  #
  # The token check. Traefik's installation guide lists outbound HTTPS, on
  # TCP port 443, to api.traefik.io among its requirements, so that the
  # gateway can validate its token there. Its release notes, under Traefik
  # Hub v3.21.0-ea.1, say that an online gateway validates its token as it
  # starts but serves at once even while that host cannot be reached, keeps
  # retrying in the background, checks in every 24 hours once connected, and
  # stops only on a definitive refusal from Traefik's platform; no earlier
  # release's notes describe that tolerance. They also say that every gateway
  # token expires after one year and must be rotated before it does, and that
  # a gateway stops working as soon as its token has expired. Read in
  # https://doc.traefik.io/traefik-hub/api-gateway/setup/kubernetes/installation
  # and https://doc.traefik.io/traefik-hub/api-gateway/release-notes on
  # 2026-10-14.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    # The Release runs the gateway as containers in its own cluster. The
    # licence check Traefik Hub makes with Traefik as it runs is a condition
    # the running gateway meets, not a service the Release consumes in place
    # of running its own.
    component.aggrega.ai/hosting: self-hosted
    # Traefik Hub is distributed under Traefik's own terms, so no single
    # licence identifier applies and metadata.license is left absent.
    component.aggrega.ai/upstream-licensing: proprietary
    # Model API: the endpoint this gateway publishes answers the OpenAI chat
    # completion API — the route Traefik Hub's Chat Completion middleware
    # serves for each model wired to its models socket, under that
    # connection's alias in the path, which validates each request against
    # the OpenAI chat completion schema — so a consumer drives it with an
    # OpenAI client whichever model answers behind it. It is what lets a model
    # socket selecting this key admit the gateway beside the models
    # themselves; the gateway publishes the endpoint and the model name such a
    # socket's consumers read. The value names what the product serves, not a
    # configured state: with nothing wired to the models socket the gateway
    # serves no model, and both of those are empty.
    model.aggrega.ai/api: openai
    # The gateway capability dimension: on the route serving a model wired to
    # the models socket, the Chat Completion middleware reads each request's
    # body, checks it against the chat completion schema and writes the
    # model's own name into it, and reads the tokens each reply reports, so a
    # runtime control that has to parse a model payload can attach here. The
    # value names what the product does on such a route, not a configured
    # state: with nothing wired to the models socket no route parses a model
    # payload.
    gateway.aggrega.ai/intelligence: semantic
    # Data-path capability labels. Each states what Traefik Hub's AI gateway
    # is able to do, read off Traefik's own middleware reference, never what a
    # given Release has switched on: each refuses or replaces nothing until a
    # Feature asking for it is attached and its realization writes it.
    #
    # Content masking: the Content Guard middleware replaces the text in a
    # chat request or reply that a rule matches with a character repeated over
    # the match — a regular expression under its regular-expression engine,
    # or an entity type the Presidio analyzer it calls detects under its
    # Presidio engine — which is the fidelity entity-recognition names. It
    # masks nothing until core/data-masking is attached; traefik-hub-chart
    # then writes the attachment as a Content Guard on each wired model's
    # route, and data-masking-traefik-hub says what this gateway honours of it.
    dataplane.aggrega.ai/content-masking: entity-recognition
    # Prompt guard: a Content Guard rule can refuse a chat request whose text
    # a regular expression in its configuration matches. Its LLM Guard
    # middleware can also refuse on the verdict of a detection service it
    # calls, against a threshold in its configuration; one value is carried,
    # and pattern-list is the one core/prompt-deny-patterns selects. It
    # matches nothing until that Feature is attached; traefik-hub-chart then
    # writes the attachment's patterns as a Content Guard on each wired
    # model's route, and prompt-deny-patterns-traefik-hub says what this
    # gateway honours of it.
    dataplane.aggrega.ai/prompt-guard: pattern-list
    # Period budget: the Token Rate Limit & Quota middleware can refuse model
    # requests once what it has counted over a period reaches a limit in its
    # configuration, and it can count what the traffic cost in US dollars,
    # priced from a price list per model that the middleware ships with, which
    # is the fidelity this value names. It can count the tokens each reply
    # reports in place of their cost as well. It refuses nothing until
    # core/period-budget is attached; traefik-hub-chart then writes the
    # budget onto each wired model's route, and period-budget-traefik-hub
    # says what this gateway honours of it.
    dataplane.aggrega.ai/period-budget: cost
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Which AI gateway control Feature is realized here, and how. Attaching any
  # of the first four halts the build until infra.ai_gateway_entitled affirms
  # the AI gateway entitlement of the licence:
  # - core/period-budget: Traefik Hub's quota middleware on each wired
  #   model's route, counting the tokens each reply reports or their cost in
  #   US dollars, in the Redis-protocol store wired to the cache socket;
  #   period-budget-traefik-hub refuses what it cannot keep.
  # - core/prompt-deny-patterns: a Content Guard on each wired model's route,
  #   its regular-expression engine refusing a request a pattern matches;
  #   prompt-deny-patterns-traefik-hub refuses allow_patterns.
  # - core/semantic-caching: Traefik Hub's semantic cache on each wired
  #   model's route, kept apart per caller by the key the caller presented,
  #   in the store wired to the cache_store socket; semantic-caching-traefik-hub
  #   keeps scope key for the callers infra.callers declares and refuses
  #   end_user.
  # - core/data-masking: a Content Guard on each wired model's route, masking
  #   or refusing what its regular-expression engine matches, or what the
  #   Presidio analyzer wired to the pii_analyzer socket detects; Content
  #   Guard does not say which fields of a chat request or reply it reads, so
  #   data-masking-traefik-hub refuses each protection that leaves unread
  #   text until the Release relaxes it, and refuses restore, a placeholder
  #   showing a pattern's name, patterns and entities in one attachment and a
  #   second attachment.
  # - core/fallback-chain: the route of each alias an entry names sends to
  #   nested failovers of Traefik's own, each model of the walk tried with its
  #   own model name and credential; fallback-chain-traefik-hub checks it.
  # - core/retry-policy: Traefik's retry middleware on each model route;
  #   retry-policy-traefik-hub checks it.
  # - core/prompt-injection-shield: prompt-injection-shield-traefik-hub halts
  #   every attachment. Traefik Hub checks a prompt for an attempt to override
  #   a model's instructions only through a service it calls: its LLM Guard
  #   and Parallel LLM Guard middlewares, which call a guard service or a
  #   model in a request and with conditions the realization would have to
  #   write, a contract not measured against a detector, so no sensitivity
  #   maps to a check here; and its Azure Prompt Shield, Amazon Bedrock
  #   Guardrails and GCP Model Armor middlewares, which call hosted services
  #   this catalog does not wire.
  # - core/audit-logging, core/target-selection and core/response-validation:
  #   the FeatureRecipe of each halts every attachment, naming what Traefik
  #   Hub lacks — a record naming the caller its key check verified, a choice
  #   between the models of one route, a check of a reply against a JSON
  #   Schema.
  # - core/caller-allowlist is realized by the generic caller-allowlist
  #   FeatureRecipe, which admits the declared callers on the ports the
  #   gateway's container declares, its model listener among them.
  # - core/concurrency-limit: the gateway carries no
  #   dataplane.aggrega.ai/concurrency-cap value, so an attachment halts at
  #   the Feature's selector.
  #
  # Traefik Hub's other AI middlewares realize no Feature here. Responses API
  # and Messages API serve the OpenAI Responses API and the Anthropic Messages
  # API on a route, and Bedrock Mantle and Google Agent Platform the Messages
  # API in front of Amazon Bedrock and Google Agent Platform, which no Feature
  # declares; Azure Content Safety moderates text by category, which no
  # Feature declares either; NeMo Switchyard rewrites the model to what an
  # outside decision service picks, neither by latency nor by cost; Amazon
  # Bedrock Guardrails and GCP Model Armor relay a policy configured in that
  # cloud, which the build cannot read.
  #
  # The licence token. Traefik's chart mounts the Secret named in its
  # hub.token value into the gateway's pod and Traefik Hub reads the token
  # from the file the data key token becomes; the Recipe sets hub.token to the
  # Secret this slot's attachment names, so the token travels by reference
  # and is in no rendered file. Fill it with core/referenced-secret bound to
  # k8s-existing-secret, which names a Secret that already exists, and publish
  # the data key token: declare the attachment in the Aggregate with
  # values.key set to token, and name the Secret in values.origin there or in
  # infra.origin in the Release, since an attachment the Release alone makes
  # publishes the key value. A credential publishing no Secret name and data
  # key, a data key other than token, or a Secret name of 65 characters or
  # more, which Traefik's chart would take for the token itself, halts the
  # build naming it. Required: a Release that binds nothing here halts the
  # build, naming the slot. What the build cannot see is whether the Secret
  # holds a valid token, or one whose licence carries the AI gateway.
  featuresSchema:
    license:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      required: true
      inject: []
      description: "The Traefik Hub licence token, held in a Kubernetes Secret this attachment names under the data key token: the gateway reads it by reference to that Secret, never as a value written into the Release or the rendered output. Required: the build halts when no attachment binds it, and when the attachment publishes a data key other than token."
    # The keys of the callers infra.callers declares, as Traefik Hub's API Key
    # middleware takes them: the htpasswd hash of each key, bcrypt, SHA-1 or
    # MD5, never the key itself. They reach the gateway only by reference to
    # the one Secret this slot names: the middleware on every model route
    # names each caller's entry as urn:k8s:secret:<Secret>:<caller>, which
    # Traefik Hub reads from that Secret in the gateway's namespace, so no
    # rendered resource of the gateway carries a hash, and a caller removed
    # from infra.callers is named by nothing once the next render is applied.
    # The Secret therefore differs from the one a caller presents its key
    # from, which holds the key itself. Attached exactly when infra.callers
    # declares a caller, which the assertion
    # callers_are_declared_with_their_keys below holds. The Recipe reads the
    # Secret's name the fill publishes, so core/referenced-secret-set fills
    # it.
    caller_keys:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The Secret holding, for each caller infra.callers declares, the htpasswd hash of the key that caller presents — bcrypt, SHA-1 or MD5, as Traefik Hub's API Key middleware takes it — under a data key named for the caller. The attached credential must publish the Secret's name, as core/referenced-secret-set does, and a credential publishing none halts the build. Each model route's key check names every caller's entry by reference to this Secret, in the gateway's namespace, so no rendered file carries a hash. Required while infra.callers declares a caller, and refused while it declares none. What Traefik Hub does with an entry naming a Secret or a data key that does not exist is not stated in its reference, and the case is neither read nor run: Traefik Hub's source is not published, and the catalog holds no licence token to run it. So it is caught, if at all, only at run time, and in the worst case the routes are as open as with no callers declared."

  usesSchema:
    # The models the gateway serves through its AI gateway, each wired as a
    # connection: any ai-model Component, managed or self-hosted, one or
    # several. Each connection becomes one route at
    # /<alias>/v1/chat/completions on the gateway's address, through Traefik
    # Hub's Chat Completion middleware, sent to the endpoint the model
    # publishes and asking for the model name it publishes, whatever model
    # name a request carries — pointers the compiler pipes into the resources
    # and never resolves. The path chooses the model. The route serves chat
    # completions alone, the one request shape that middleware takes.
    #
    # The gateway reaches a wired model over the OpenAI API alone, so a
    # connection whose target's model.aggrega.ai/api is not openai halts the
    # build, naming it. A host the model publishes with no dot in it is a
    # Service name carrying no namespace, so the gateway qualifies it with the
    # namespace the Release places the model in, or `default` where it
    # declares none; a managed API's host is used as published. An endpoint
    # whose host is an address rather than a name halts the build, because the
    # route reaches a model through a Service of type ExternalName, which
    # names a host. The alias names the connection's resources too, in
    # lowercase with every underscore as a hyphen, so two aliases giving one
    # name, or an alias ending in a hyphen or an underscore, halt the build
    # where the resources are rendered.
    #
    # The credential the gateway presents to a wired model is the one its
    # connection carries in the credential slot: the connection's Chat
    # Completion middleware names the Secret the credential publishes and the
    # data key inside it, and Traefik Hub reads the key from that Secret and
    # sends it as a bearer token, so no rendered file carries the key. A
    # connection carrying none renders no reference, and the gateway adds no
    # credential of its own. A connection to a target labelled
    # component.aggrega.ai/hosting: managed with no credential halts the build
    # unless its values set unauthenticated: true. A self-hosted server that
    # checks a key holds it in a slot of its own, and its connection carries a
    # credential holding the same key.
    #
    # Optional: with nothing wired, the gateway serves no model and its
    # rendered output is the gateway alone.
    models:
      selector: "component.aggrega.ai/category=ai-model"
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the model this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # No inject list: no container of this component receives the
      # credential. The Recipe names its Secret in a middleware, and the
      # gateway reads the key from the Secret itself.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          description: "Optional credential the gateway presents to the model this connection reaches, as a bearer token. When attached, the connection's Chat Completion middleware names the Secret the credential publishes and the data key inside it, and Traefik Hub reads the key from that Secret, so the key appears in no rendered file; a credential publishing no Secret name and data key halts the build. Unattached, the gateway adds no credential."
    # The Redis-protocol store Traefik Hub's quota middleware keeps a period
    # budget's count in. The selector admits the key-value stores; the Recipe
    # halts on one whose published protocol is neither redis nor valkey nor
    # valkey-tls nor redis-tls. A store publishing either is reached over TLS,
    # the middleware checking its certificate against the authority in server_ca
    # where one is attached, and against the system's authorities where not;
    # another value served over TLS halts the build, naming the connection. The
    # selected component's provides host and port arrive on the connection
    # and are written into the quota's configuration, a host carrying no dot
    # qualified with the namespace the Release places the store in, or
    # `default` where it declares none — pointers the compiler pipes and
    # never resolves. Traefik's reference says the middleware serves requests
    # uncounted while the store cannot be reached.
    #
    # Optional: wired alone it changes nothing rendered, because the quota is
    # written only while core/period-budget is attached, and that attachment
    # halts the build unless this socket holds a connection. The quota keeps
    # its count in one store, so a second connection halts the build.
    #
    # The password the quota presents to the store is the connection's own, in
    # its credential slot, for a store that requires one: the quota names the
    # Secret the credential publishes and the data key in it, and Traefik Hub
    # reads the password from that Secret. With none, it presents no
    # password.
    cache:
      selector: "datastore.aggrega.ai/engine=kv"
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          description: "Optional password the gateway's quota middleware presents to the Redis-protocol store this connection reaches. When attached, the quota names the Secret the credential publishes and the data key inside it, and Traefik Hub reads the password from that Secret in the gateway's namespace, so the password appears in no rendered file; a credential publishing no Secret name and data key halts the build. Unattached, the quota connects with no password."
        # The authority the quota middleware checks the store's certificate
        # against, for a store whose certificate an authority the image does
        # not already trust signs. Secret-kind-pinned because a referenceable
        # Secret is what the Recipe mounts, and so marked sensitive as every
        # secret-kind slot is, though the authority's certificate is not itself
        # secret; delivered as a file.
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the gateway's quota middleware checks the store's certificate against while the store publishes protocol valkey-tls or redis-tls, where the gateway does not already trust the authority that signs it. Its Secret holds ca.crt and sits in the gateway's namespace. The Recipe mounts the whole Secret read-only into the gateway and names the file in the quota's store settings. The build halts on a server_ca publishing no Secret name, and on one wired to a store served without TLS. Fill it with core/referenced-secret."
    # The store the gateway's semantic cache keeps its replies in, each beside
    # the vector of the prompt it answered, which the cache searches by
    # similarity when a prompt arrives. Traefik Hub's cache drives a Redis
    # store through the vector search of its query engine, which a store
    # states it serves by publishing vector_search, as core/datastore/redis
    # does from release 8.0.0 on; the selector admits the key-value stores,
    # and the Recipe halts on a store publishing no vector_search. The store's
    # published host and port are written into the cache's configuration as
    # pointers the compiler never resolves. That Traefik Hub's client works
    # against that query engine is not observed by any build.
    #
    # Optional: wired alone it changes nothing rendered, since the cache is
    # written only while core/semantic-caching is attached, and that
    # attachment halts the build unless this socket holds one connection.
    #
    # The password the cache presents to the store is the connection's own, in
    # its credential slot, for a store that requires one: the cache names the
    # Secret the credential publishes and the data key in it. With none, it
    # presents no password.
    #
    # A store publishing valkey-tls or redis-tls is reached over TLS, the cache
    # checking its certificate against the authority in server_ca where one is
    # attached, and against the system's authorities where not; another value
    # served over TLS halts the build, naming the connection.
    cache_store:
      selector: "datastore.aggrega.ai/engine=kv"
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the store this connection reaches takes no password, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          description: "Optional password the gateway's semantic cache presents to the store this connection reaches. When attached while core/semantic-caching is attached, the cache names the Secret the credential publishes and the data key inside it, and Traefik Hub reads the password from that Secret in the gateway's namespace, so the password appears in no rendered file; a credential publishing no Secret name and data key halts the build. Unattached, the cache connects without a password."
        # The authority the semantic cache checks the store's certificate
        # against, for a store whose certificate an authority the gateway does
        # not already trust signs. Secret-kind-pinned because a referenceable
        # Secret is what the Recipe mounts, and so marked sensitive as every
        # secret-kind slot is, though the authority's certificate is not itself
        # secret; delivered as a file.
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the gateway's semantic cache checks the store's certificate against while the store publishes protocol valkey-tls or redis-tls, where the gateway does not already trust the authority that signs it. Its Secret holds ca.crt and sits in the gateway's namespace. While core/semantic-caching is attached, the Recipe mounts the whole Secret read-only into the gateway and names the file in the cache's store settings. The build halts on a server_ca publishing no Secret name, and on one wired to a store served without TLS. Fill it with core/referenced-secret."
    # The Presidio analyzer the Content Guard of a core/data-masking attachment
    # calls to find the entity types it lists, core/security/presidio-analyzer,
    # which speaks the Presidio HTTP API Content Guard's Presidio engine
    # calls. The selector admits only the service of that role. Content Guard
    # replaces what the analyzer finds itself, so no anonymizer is wired. The
    # selected component's published endpoint is written into the Content
    # Guard as its address, a host with no dot qualified with the namespace
    # the Release places the analyzer in — a pointer the compiler pipes and
    # never resolves — in the language en, the one the analyzer's image loads
    # a model for. The analyzer authenticates no caller, so the connection
    # carries no credential.
    #
    # Optional: wired alone it changes nothing this component renders, since
    # the analyzer's address is written only while a core/data-masking
    # attachment lists entity types, and such an attachment halts the build
    # unless this socket holds one connection.
    pii_analyzer:
      selector: "security.aggrega.ai/text-anonymization=analyzer"

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      #
      # The alias this gateway publishes as its model. A component wired to the
      # gateway's address over a model socket — an agent, a tool, a memory store
      # — reads one endpoint and one model name off the edge, the same keys a
      # model publishes; the endpoint is this alias's route and the model name
      # is the alias. A Recipe writes the gateway's published values from what
      # the gateway itself was given, which holds none of its connections, so
      # the published alias is named here rather than taken from the socket:
      # with a connection on the models socket this value is required, and with
      # none it is omitted.
      model:
        type: string
        description: The alias of a connection on the models socket that this gateway publishes as its model, and whose route its published endpoint addresses. It must be an alias a models connection carries, and the build halts naming this value otherwise; it is required while the models socket holds a connection, and omitted while it holds none.
      # The gateway's own metrics, in the Prometheus format: Traefik's chart
      # turns them on by default, on the entry point `metrics`, port 9100 of the
      # gateway's pod, at /metrics, and nothing there checks a caller. The
      # realization leaves them on whatever this value says, so false only
      # keeps their address unpublished; true has the chart render a ClusterIP
      # Service of its own for that port. Traefik also serves on that entry
      # point any route written without entry points, as on every entry point
      # but its internal one, each route keeping its own middlewares; the routes
      # this component writes name the plain HTTP listener.
      metrics_enabled:
        type: boolean
        default: false
        description: Publishes the address of the gateway's own metrics, in the Prometheus format, as `metrics_endpoint`, putting their port on a ClusterIP Service of its own; while false that key is empty. The metrics port checks no caller, so anything that reaches it can read them.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Port the gateway listens on for plain HTTP and its Service accepts client traffic on. Most operators should omit this and let the Recipe assign the default (8000).
      # No default and no version knob: access to the Traefik Hub image is
      # governed by Traefik's terms rather than by the catalog, so the catalog
      # names none and the Release names the one it runs, tag included.
      image:
        type: string
        required: true
        description: Full reference of the Traefik Hub image the gateway runs, tag included, as in ghcr.io/traefik/traefik-hub:v3.21.2, optionally followed by a digest — the image the operator is entitled to pull. There is no default, because access to the image is governed by Traefik's terms rather than by the catalog, and the catalog therefore names none. A build that omits the image, or names one with no tag, halts. Traefik's chart reads the gateway's version from the tag and refuses an image whose repository path does not contain traefik-hub.
      image_pull_secret:
        type: string
        description: Name of a pre-created image-pull Secret granting access to the registry the image is pulled from. Set this when that registry needs credentials; omit it when the cluster can pull the image without them.
      # The callers the gateway authenticates, by name. Each becomes an entry
      # of the API Key middleware heading every model route, read from the
      # caller_keys Secret under its name, so a semantic cache can keep each
      # caller's replies apart. The routes exist only while a model is wired,
      # so callers need one; with none declared the routes are open, as they
      # are without this key.
      callers:
        type: array
        min: 1
        items:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,253}$"
        description: The callers the gateway serves models to, by name, each presenting its own key in the Authorization header as `Bearer <key>`, which is how an OpenAI client presents one. Every model route then refuses a request presenting no declared key, and removes the Authorization header from the request it forwards, so a caller's key never reaches a model. A name takes letters, digits, hyphens and underscores, and is also the data key holding the htpasswd hash of that caller's key in the Secret the caller_keys slot names. A model must be wired to the models socket; the build halts on callers otherwise. Omit it for open routes.
      # The AI gateway entitlement, affirmed rather than checked: the licence
      # carries it inside a token the build never reads. core/fallback-chain
      # and core/retry-policy are kept through Traefik's own failover and
      # retry, not the AI gateway's middlewares, so it does not guard them.
      ai_gateway_entitled:
        type: boolean
        default: false
        description: Affirms that the licence the license slot names carries Traefik Hub's AI gateway, through whose middlewares core/period-budget, core/prompt-deny-patterns, core/semantic-caching and core/data-masking are kept here. The compiler runs ahead of time and never reads the licence, so it asks rather than checks. With any of those four attached and this left unaffirmed, the build halts, because what Traefik Hub does with a valid token whose licence lacks the AI gateway is undocumented. With none attached it changes nothing rendered.
      source_version:
        type: string
        description: Version of the Helm chart the realization pulls. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the gateway. A consumer
          sends its client traffic here rather than to the service behind the
          gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts client traffic on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
      # endpoint and model together are the contract every model component
      # publishes, which is what lets a model socket take this gateway in place
      # of a model with its consumer's Recipe unchanged. Neither is required:
      # with nothing wired to the models socket the gateway serves no model and
      # publishes both empty.
      endpoint:
        type: string
        description: >
          Full base URL of the OpenAI-compatible API the gateway serves for the
          model values.model names, with the host, the port and that alias's
          route already composed. A caller hands it to a client library as its
          base URL. Every other wired model is served at the same host and port
          under its own alias in the path. Empty while nothing is wired to the
          models socket.
      model:
        type: string
        description: >
          The alias a consumer wired to the gateway sends as its model name:
          values.model. The route behind the endpoint asks for the model it was
          written for whatever name a request carries. Empty while nothing is
          wired to the models socket.
      # The address a Prometheus server scrapes the gateway's own metrics at,
      # while values.metrics_enabled is true: /metrics on port 9100 of the
      # Service Traefik's chart renders for them. The Recipe publishes it
      # spelled out in full, because a provides entry cannot read another.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:9100/metrics`, the host
          being the Service carrying the metrics port. Empty while
          values.metrics_enabled is false.

  # The rules of the models socket and of the callers, and the credential rule
  # every socket declaring unauthenticated carries. Each reads what the
  # Aggregate and the Release wrote — the values, the callers, the attachments,
  # and each connection's target labels, values and attachments — all known
  # before a Recipe binds, so each holds whichever Recipe renders this
  # component and halts before anything renders.
  #
  # DELIBERATE NEAR-DUPLICATE of the assertions of the same names on
  # core/gateway/envoy-gateway, core/gateway/kong, core/gateway/kong-enterprise
  # and core/gateway/apisix: each
  # gateway serves the models wired to one socket over the OpenAI API and
  # publishes one alias of them, so the rules guarding that socket are the
  # same, and an assertion is a string on the Component that no library kind
  # can hold for several Components to share. If one of them changes, change
  # each in the same edit.
  assertions:
    # The model the gateway publishes must be one it serves. values.model names
    # the alias of a connection on the models socket, and is required while the
    # socket holds one, because the published values are written from what the
    # gateway was given and a connection is not among it. With nothing wired, a
    # value naming an alias names a route the gateway does not serve.
    published_model_is_a_wired_alias: >-
      {{- $wired := sortAlpha (keys (optional .uses "models" dict)) -}}
      {{- with optional .values "model" "" -}}
      {{- if not (has . $wired) -}}
      {{- if $wired -}}
      {{- fail (printf "values.model is %q, but no connection on the models socket carries that alias, so a component wired to this gateway would be sent to a route it does not serve; set values.model to one of the aliases the models socket carries: %s" . (join ", " $wired)) -}}
      {{- else -}}
      {{- fail (printf "values.model is %q, but nothing is wired to the models socket, so the gateway serves no model to publish under that alias; wire a model to the models socket under that alias, or remove values.model" .) -}}
      {{- end -}}
      {{- end -}}
      {{- else -}}
      {{- if $wired -}}
      {{- fail (printf "values.model is not set, but the models socket carries %s, so the gateway cannot tell which of them a component wired to it asks for, and the alias a connection is served under is not among what its published values are written from; set values.model to one of them" (join ", " $wired)) -}}
      {{- end -}}
      {{- end -}}
    # A wired model's route is written from the endpoint and the model name the
    # model publishes, for the Chat Completion middleware to reach over the
    # OpenAI API, which is what model.aggrega.ai/api: openai asserts answers at
    # that endpoint. A model whose API is another needs settings that nothing
    # the model publishes names, so it halts rather than being written as a
    # guess.
    wired_model_speaks_the_openai_api: >-
      {{- range $alias, $connection := (optional .uses "models" dict) -}}
      {{- $api := optional $connection.labels "model.aggrega.ai/api" "" -}}
      {{- if ne $api "openai" -}}
      {{- fail (printf "the models connection %s of %q reaches %q, whose model.aggrega.ai/api is %q, but the gateway writes a wired model's route from the endpoint and model name it publishes for the OpenAI API alone, so it cannot write a route for it; wire a model whose model.aggrega.ai/api is openai instead" $alias $.metadata.instance_id $connection.target $api) -}}
      {{- end -}}
      {{- end -}}
    # The callers infra.callers declares are entries of the key check heading
    # every model route, so they need a model wired. Each caller's entry names
    # its data key in the Secret the caller_keys slot names, so one name
    # written twice would be one entry, and the slot is attached exactly when
    # a caller is declared, since a key Secret no caller reads, or callers with
    # no Secret to read from, says otherwise. The same rule as the one of this
    # name on core/gateway/apisix and core/gateway/agentgateway, without their
    # check on two names giving one variable, since here a caller's name is
    # used as written.
    callers_are_declared_with_their_keys: >-
      {{- $callers := optional .infra "callers" list -}}
      {{- $hasKeys := hasKey (optional . "features" dict) "caller_keys" -}}
      {{- if $callers -}}
      {{- if not (optional .uses "models" dict) -}}
      {{- fail (printf "infra.callers of %q declares %s, but nothing is wired to its models socket, so it serves no model route on which a caller's key could be checked; wire a model to its models socket, or remove infra.callers" .metadata.instance_id (join ", " $callers)) -}}
      {{- end -}}
      {{- $seen := dict -}}
      {{- range $caller := $callers -}}
      {{- if hasKey $seen $caller -}}
      {{- fail (printf "infra.callers of %q names %s more than once; name each caller once" $.metadata.instance_id $caller) -}}
      {{- end -}}
      {{- $_ := set $seen $caller true -}}
      {{- end -}}
      {{- if not $hasKeys -}}
      {{- fail (printf "infra.callers of %q declares %s, but nothing is attached to its caller_keys slot, so the gateway has no Secret to read its callers' key hashes from; attach core/referenced-secret-set to caller_keys, with one data key per caller, named for the caller, holding the htpasswd hash of that caller's key" .metadata.instance_id (join ", " $callers)) -}}
      {{- end -}}
      {{- else if $hasKeys -}}
      {{- fail (printf "an attachment fills the caller_keys slot of %q, but infra.callers declares no caller, so the gateway would read no key from it; declare the callers in infra.callers, or remove the attachment" .metadata.instance_id) -}}
      {{- end -}}
    # A connection to a target its catalog labels a managed service
    # (component.aggrega.ai/hosting: managed) carries a credential, or says on
    # the connection that its target takes none. The rule reads the target's
    # labels, the connection's unauthenticated value and its credential slot,
    # all known before a Recipe binds, so it holds whichever Recipe renders this
    # component; a self-hosted target draws nothing. The list names every
    # socket of this component that declares unauthenticated.
    managed_target_needs_a_credential: >-
      {{- range $socket := list "models" "cache" "cache_store" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
