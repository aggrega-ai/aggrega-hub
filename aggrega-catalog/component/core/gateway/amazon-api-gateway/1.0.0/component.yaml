apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/gateway/amazon-api-gateway
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon API Gateway is a
  # hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The routing follows the Amazon API Gateway Developer Guide: "Create
  # routes for HTTP APIs" (the $default route sends the full request path to
  # its integration), "Create HTTP proxy integrations for HTTP APIs" and
  # "Create private integrations for HTTP APIs".
  description: >
    One Amazon API Gateway HTTP API: AWS's managed entry point taking HTTPS
    requests at an endpoint the service names in its Region and forwarding
    every one, whatever its method and path, to one upstream through a
    catch-all route on a stage that deploys each change. A consumer reads
    the API's host name and its https:// address.

    The upstream is the component wired to the upstream socket, a server or
    a managed resource. API Gateway forwards each request over HTTPS to the
    host that component publishes, on the port it publishes or else 443,
    with the request's full path; or, where the Release names the operator's
    VPC link and the load balancer listener or AWS Cloud Map service behind
    it, through that link, reading no host. The socket takes exactly one
    connection, and a target publishing no host halts the build unless a
    VPC link is named.

    API Gateway checks no caller: no authorizer, API key or other route is
    offered, nor a WebSocket API. The stage sets no throttling, so only the
    limits API Gateway applies across the account's APIs in the Region
    bound the requests, and writes no access log. A custom domain is the
    operator's DNS name under
    infra.overrides.host, given together with its AWS Certificate Manager
    certificate; the DNS record pointing the name at the API stays the
    operator's. API Gateway keeps no data of its own, so no backup is
    configured. Each Recipe's description says which keys it honours and
    which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: gateway
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
    # No gateway.aggrega.ai/intelligence label: an HTTP proxy integration
    # passes each request and response through whole, and the API parses no
    # model payload.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The upstream API Gateway forwards every request to. Each Recipe reads
    # the host and the port the connection's target publishes and writes
    # https://<host>:<port>, or https://<host> where the target publishes no
    # port, as the URL of the API's one HTTP proxy integration. The selector
    # admits any component labelled type server or resource, the kinds that
    # can publish a host; a stateful server, a worker or a task is refused
    # before anything renders. A target publishing no host halts in the
    # Recipe, naming the connection, unless the Release names a VPC link,
    # whose integration takes the ARN of the listener or service behind it
    # rather than a URL, so the host is not read. No inject block is authored
    # on the connection, since the Recipe reads it itself. Exactly one
    # connection: the compiler refuses none, as the socket is required, and
    # the one_upstream assertion below refuses a second, since an integration
    # forwards to one address.
    upstream:
      selector: "component.aggrega.ai/type in (server, resource)"
      required: true
  schema:
    infra:
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The API's host name: the host of the endpoint the service gives it,
          <api-id>.execute-api.<region>.amazonaws.com, where <api-id> is the
          identifier API Gateway generates, or the operator's DNS name where
          the Release gives the API a custom domain. A realization publishes
          the service's name as a pointer string the provisioning tool
          resolves once the API exists, so a consumer reads this rather than
          deriving one.
      endpoint:
        type: string
        required: true
        description: >
          https:// followed by host: the address a client sends its requests
          to, whatever their path, which API Gateway forwards to the upstream
          with that path. It carries no credential.

  assertions:
    # The upstream socket holds one connection; the compiler refuses none,
    # since the socket is required.
    one_upstream: >-
      {{- $up := optional .uses "upstream" dict -}}
      {{- if gt (len $up) 1 -}}
      {{- fail (printf "the upstream socket of %q holds %d connections, and Amazon API Gateway forwards every request to one upstream here, through one catch-all route and its one integration: keep one connection under upstream in the Aggregate" .metadata.instance_id (len $up)) -}}
      {{- end -}}
