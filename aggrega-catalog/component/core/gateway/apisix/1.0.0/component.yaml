apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/apisix
  version: 1.0.0
  license: Apache-2.0
  description: >
    Apache APISIX, a dynamic, high-performance API gateway. APISIX terminates
    client HTTP traffic on its proxy port and routes it according to
    configuration held in an etcd store wired through its `etcd` uses-socket: the
    store host and client port arrive on the injection context and compose
    APISIX's configuration-store connection. Routes are administered through an
    Admin API authenticated by a static key and reachable in-cluster only.
    APISIX holds no persistent state of its own — etcd is the system of record —
    so it renders as a stateless server. Exports its proxy host, port, and
    protocol to consumers via the uses topology.

    On Kubernetes there are two realizations and the Manifest chooses between
    them. `apisix` synthesizes the gateway as a workload with a hand-written
    configuration file and fetches nothing, so it is the one to reach for where
    the build must complete with no chart repository reachable. `apisix-chart`
    renders the project's own Helm chart, which assembles that whole
    configuration from named settings — nginx tuning, the plugin set, the
    router, DNS and service discovery — rather than from a file that has to be
    re-derived by hand whenever the gateway moves, so reach for it where a chart
    repository is reachable at build time.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The etcd store APISIX holds its configuration in. The selected component's
    # provides host and port arrive on the injection context and compose
    # APISIX's configuration-store connection.
    etcd:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]
      required: true

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      admin_key:
        type: string
        default: edd1c9f034335f136f87ad84b625c8f1
        description: Static token authenticating the Admin API (X-API-KEY header). Pinned to a deterministic default so the stack renders self-contained; override it in the Aggregate to secure the Admin API.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      http_port:
        type: integer
        min: 1024
        max: 65535
        default: 9080
        description: Proxy data-plane port consumers connect to.
      admin_port:
        type: integer
        min: 1024
        max: 65535
        default: 9180
        description: Admin API port, reachable in-cluster only.
      engine_version:
        type: string
        default: "3.17.0-debian"
        description: Apache APISIX container image tag. Selects the image tag on container targets; the chart-backed realization pins its own image tag.
      source_version:
        type: string
        description: Version of the Helm chart the chart-backed realization pulls. Read only by that realization; the workload-synthesis realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the proxy data plane. A
          consumer sends its client traffic here rather than to the service
          behind the gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxied traffic on. It carries the
          data-plane port an operator set, never the Admin API port, which
          stays in-cluster.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
