apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/gateway/tyk
  version: 1.0.0
  license: MPL-2.0
  description: >
    Tyk Gateway, a self-hosted API gateway. The gateway terminates client
    traffic on its data plane and routes it to the services its API definitions
    name. It keeps its keys, rate-limit counters and session state in a
    Redis-protocol store wired through its `cache` uses-socket: the store's host
    and port arrive on the injection context and compose the gateway's storage
    connection. That store is the gateway's one prerequisite — it needs no
    management console and no licence key to serve traffic — so the stack a
    Release stands up is the gateway and a Redis-protocol component and nothing
    else. The gateway holds no durable state of its own, so it renders as a
    stateless server. Realized on Kubernetes by a Recipe that points at the
    chart the gateway's own maintainers publish, and for local development by a
    Recipe that synthesizes a container from the same published image. It can
    pin the public key it accepts from an upstream it forwards to, which a
    Release asks for by attaching core/upstream-key-pinning; that realization's
    description states what setting one pin costs the upstreams that have
    none. Exports its data-plane host, port, and protocol to consumers via the
    uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
    # Data-path capability label. It states what this gateway is able to do,
    # never what a given Release has switched on — the two read alike to a
    # developer and only the first is a property of the product.
    #
    # Upstream pinning: the gateway can hold an upstream it forwards to, named
    # by the host it dials, to a public key the Release supplies, accepting the
    # upstream only when a certificate in the chain it presents carries that
    # key. The pin is the key itself, so the value is public-key. Once any pin
    # is set the gateway checks keys instead of certificate chains for every
    # upstream, which is why the realization's own description says what an
    # upstream with no entry is left with.
    dataplane.aggrega.ai/upstream-pinning: public-key
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The Redis-protocol store the gateway keeps its keys, rate-limit counters
    # and session state in. The selected component's provides host and port
    # arrive on the injection context and compose the gateway's storage
    # connection. The category selector admits either Redis-protocol component
    # the catalog ships; both carry component.aggrega.ai/category: datastore.
    # A store publishing protocol valkey-tls or redis-tls is reached over TLS, the gateway
    # checking its certificate against the authority in server_ca where one is
    # attached, and against the image's default trust store where not; a store
    # publishing another value served over TLS halts the build, naming the
    # connection.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      # A statement about this connection's target, authored on the connection:
      # the store it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the store this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # Optional password credential for the wired store, held on the connection
      # it is presented on. The shipped Redis-protocol components run without
      # authentication unless a credential is attached to them, so this slot is
      # optional: when nothing is attached the gateway connects with an empty
      # password, byte-identically to a Component with no slot at all. When a
      # credential is attached on the connection, the Recipe wires it through
      # the credential subsystem, and the same credential is attached to the
      # store so both sides hold the same material. Transparent (inject: [env])
      # so the injected value reaches the Recipe on the env pipe; the selector is
      # secret-kind-pinned but family-agnostic, so either an inject-value or a
      # referenceable credential may fill it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional password the gateway presents to the Redis-protocol store this connection reaches. When attached, supplies the store password via the credential subsystem; unattached, the gateway connects with an empty password, which is what the shipped store components expect by default."
        # The authority the gateway checks the store's certificate against, for
        # a store whose certificate an authority the image does not already
        # trust signs. Secret-kind-pinned because a referenceable Secret is what
        # the Recipe mounts, and so marked sensitive as every secret-kind slot
        # is, though the authority's certificate is not itself secret; delivered
        # as a file.
        server_ca:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [file]
          description: "Optional authority the gateway checks the store's certificate against while the store publishes protocol valkey-tls or redis-tls, where the image does not already trust the authority that signs it. Its Secret holds ca.crt. The Kubernetes realization mounts the whole Secret read-only into the gateway and points it at the file; the Compose realization refuses it, since no credential Feature realized there delivers a Secret as files. The build halts on a server_ca publishing no Secret name, and on one wired to a store served without TLS. Fill it with core/referenced-secret."

  schema:
    # The gateway reads no developer values. What it routes is carried by the
    # API definitions it loads, and where it keeps its state arrives on the
    # `cache` uses-edge.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Data-plane port consumers connect to. Most operators should omit this and let the Recipe assign the default (8080).
      engine_version:
        type: string
        default: "v5.14.0"
        description: >
          Gateway container image tag. It selects a tag and not a repository.
          Both Recipes read it: the Compose Recipe uses it for the container it
          synthesizes, and the chart-backed Recipe sets it on the chart's own
          image field so the render names one exact tag rather than whichever
          tag the chart happens to default to.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 256Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads. Both Recipes read api_secret here, the gateway's own API secret; left unset, compose/tyk and helm/tyk use the development literal `tyk-development-secret`, which this catalog publishes, so every Release that leaves it unset shares that secret.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the data plane. A
          consumer sends its client traffic here rather than to the service
          behind the gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxied traffic on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted target draws nothing. The list names every socket of this
  # component that declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "cache" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
