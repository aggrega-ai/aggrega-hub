apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/tyk
  version: 1.0.0
  license: MPL-2.0
  description: >
    Tyk Gateway, a self-hosted API gateway. The gateway terminates client
    traffic on its data plane and routes it to the services its API definitions
    name. It keeps its keys, rate-limit counters and session state in a
    Redis-protocol store wired through its `cache` uses-socket: the store's host
    and port arrive on the injection context and compose the gateway's storage
    connection. That store is the gateway's one prerequisite — it needs no
    management console and no licence key to serve traffic — so the stack a
    Release stands up is the gateway and a Redis-protocol component and nothing
    else. The gateway holds no durable state of its own, so it renders as a
    stateless server. Realized on Kubernetes by a Recipe that points at the
    chart the gateway's own maintainers publish, and for local development by a
    Recipe that synthesizes a container from the same published image. It can
    also pin the public key it will accept from an upstream it forwards to; the
    infra field carrying those pins states what setting one costs the upstreams
    that have none. Exports its data-plane host, port, and protocol to consumers
    via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The Redis-protocol store the gateway keeps its keys, rate-limit counters
    # and session state in. The selected component's provides host and port
    # arrive on the injection context and compose the gateway's storage
    # connection. The category selector admits either Redis-protocol component
    # the catalog ships; both carry component.aggrega.ai/category: datastore.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true

  featuresSchema:
    # Optional password credential slot for the wired store. The shipped
    # Redis-protocol components run without authentication unless a credential
    # is attached to them, so this slot is optional: when nothing is attached
    # the gateway connects with an empty password, byte-identically to a
    # Component with no slot at all. When a credential is attached here, the
    # Recipe wires it through the credential subsystem, and the same credential
    # is attached to the store so both sides hold the same material.
    # Transparent (inject: [env]) so the injected value reaches the Recipe on
    # the env pipe; the selector is secret-kind-pinned but family-agnostic, so
    # either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential for the wired Redis-protocol store. When attached, supplies the store password via the credential subsystem; unattached, the gateway connects with an empty password, which is what the shipped store components expect by default."

  schema:
    # The gateway reads no developer values. What it routes is carried by the
    # API definitions it loads, and where it keeps its state arrives on the
    # `cache` uses-edge.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Data-plane port consumers connect to. Most operators should omit this and let the Recipe assign the default (8080).
      engine_version:
        type: string
        default: "v5.14.0"
        description: >
          Gateway container image tag. It selects a tag and not a repository.
          Both Recipes read it: the Compose Recipe uses it for the container it
          synthesizes, and the chart-backed Recipe sets it on the chart's own
          image field so the render names one exact tag rather than whichever
          tag the chart happens to default to.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 256Mi
      # Certificate pinning is a dial on this gateway rather than an attachment
      # because it is the only gateway in the catalog that can pin. If a second
      # pinning gateway is admitted, revisit whether the capability belongs on a
      # surface the two share.
      upstream_public_key_pins:
        type: object
        additionalProperties: { type: string }
        description: >
          Public keys this gateway will accept from the upstreams it forwards
          to, keyed by the upstream each key belongs to. A key is the upstream
          host exactly as the gateway dials it, `*.example.com` for every host
          under one suffix, or `*` for every upstream. A value is that
          upstream's public key in PEM form — the key itself, not the
          certificate carrying it — or the path of a file holding that PEM which
          is already present in the gateway's container; this Component places
          no file anywhere, so a path is honoured only where the operator has
          put the material there. A value made only of hexadecimal digits is
          read as neither: the gateway takes it as a reference into its own
          certificate store, which is filled while the gateway runs and is not
          something a build can supply.
          Setting any entry changes how the gateway reaches every upstream and
          not only the ones named here: from then on it takes an upstream
          certificate on the key matching rather than on the chain it presents,
          and an upstream with no entry is reached with its chain unchecked.
          Where the gateway forwards to more than one upstream, the Release
          names all of them, or names `*`; leaving one out is not the same as
          leaving this field unset.
          A value carries no comma and no colon. Those two characters separate
          the entries the gateway reads, so a value holding either makes the
          gateway's configuration fail to load.
          Unset, nothing at all is emitted and the rendered output is what it
          would be without this field. Nothing here reads, parses or validates
          the key material — it is carried to the gateway as the text the
          Release supplied. Both Recipes honour it.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the data plane. A
          consumer sends its client traffic here rather than to the service
          behind the gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxied traffic on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
