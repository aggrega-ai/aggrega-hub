apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/envoy-ai-gateway-operator
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Envoy AI Gateway control plane: a controller that turns the project's
    AI routes, model backends and policies into Envoy configuration, which
    Envoy Gateway takes from it by calling the controller's extension server,
    and a mutating webhook that adds the AI external processor to each
    data-plane pod Envoy Gateway creates. It publishes the address of its
    extension server for Envoy Gateway to call. Its Helm Recipe installs the
    project's own chart and, beside it, the six AI Gateway custom-resource
    definitions.

    The controller runs under the cluster role the project's chart grants, and
    that grant spans the whole cluster: the controller may read, create,
    change and delete every Secret, Pod, Service, Deployment and DaemonSet in
    every namespace, and every resource of the Gateway API, Envoy Gateway, AI
    Gateway and inference-pool API groups.

    cert-manager must already run in the cluster: the webhook's serving
    certificate is a cert-manager Certificate, signed by a self-signed Issuer
    the Recipe renders. The controller expects the Envoy Gateway it extends in
    the `envoy-gateway-system` namespace.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
    # Extension server: the controller serves Envoy Gateway's extension
    # protocol — Envoy Gateway calls it over gRPC, at the address this
    # component publishes, to have the Envoy configuration it translates for
    # its data plane adjusted for the AI routes — and the value names whose
    # protocol that is. It is what an Envoy Gateway's extension socket selects,
    # so that socket takes this controller and refuses any other gateway. The
    # value names what the product serves, not a configured state: the
    # controller serves its extension server whether or not an Envoy Gateway
    # is wired to it.
    gateway.aggrega.ai/extension-server: envoy-gateway
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operator container image running the Envoy AI Gateway control plane.
      image:
        type: string
        default: "docker.io/envoyproxy/ai-gateway-controller:v1.1.0"
        description: Envoy AI Gateway controller image the control-plane Deployment runs.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the controller's Service, the name alone
          without a namespace; a consumer in another namespace qualifies it
          with the namespace the controller is placed in. Envoy Gateway calls
          the controller's extension server here.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service serves the extension server on, which Envoy
          Gateway calls over gRPC.
