apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/envoy-ai-gateway-operator
  version: 1.0.0
  description: >
    The Envoy AI Gateway control plane, declared as an explicit
    component so a gateway-mediated model realization can ship its runtime
    prerequisite alongside the custom resources it emits, rather than assuming an
    ambient install. The control plane is the operator that reconciles the
    gateway custom resources (AIServiceBackend, BackendSecurityPolicy) into a
    running data plane. Declare this component in the same Aggregate as a
    gateway-mediated model to satisfy the model's control-plane prerequisite; the
    operator affirms the prerequisite on the model in the same Release. Realized
    on Kubernetes via its Helm Recipe.
  license: Apache-2.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operator container image running the Envoy AI Gateway control plane.
      image:
        type: string
        default: "docker.io/envoyproxy/ai-gateway-controller:latest"
        description: Envoy AI Gateway controller image the control-plane Deployment runs.
      namespace:
        type: string
        default: "envoy-ai-gateway-system"
        description: Namespace the control plane is installed into.
