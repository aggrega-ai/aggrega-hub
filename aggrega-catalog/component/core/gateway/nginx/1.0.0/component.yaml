apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/gateway/nginx
  version: 1.0.0
  description: >
    An NGINX reverse-proxy gateway. NGINX terminates client HTTP traffic and
    forwards it to an upstream service wired through its `upstream` uses-socket:
    the upstream host and port arrive on the injection context and are rendered
    into the NGINX server configuration as the proxy_pass target, so the gateway
    routes to whichever component the topology binds. NGINX holds no persistent
    state, so it renders as a stateless server with no volume. Provider-agnostic:
    the same component is implemented by a synthesized Helm Recipe on the official
    NGINX image (Kubernetes) and a Compose Recipe (local development). Exports its
    host and listen port to consumers via the uses topology. The optional guard
    socket takes the core/security/nemo-guardrails a
    core/prompt-injection-shield attachment sends every forwarded request
    through in place of the upstream; wired alone it changes no request.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
    # Data-path capability labels. Each states what this proxy is able to do,
    # never what a given deployment has switched on — the two read alike to a
    # developer and only the first is a property of the product.
    #
    # Request mirroring: the proxy copies a matching request to a second
    # destination and discards that destination's response. It mirrors every
    # matching request and offers no setting that narrows the copy to a
    # fraction of them, so the fidelity it carries is the whole stream.
    dataplane.aggrega.ai/request-mirroring: full-rate
    # Upstream TLS: the proxy can require an upstream's certificate to chain to
    # a trust anchor the deployment supplies. The capability is what the label
    # asserts; verification is off until an operator turns it on, and a
    # deployment that never does still runs a proxy that could.
    dataplane.aggrega.ai/upstream-tls: trust-anchor
    # Concurrency cap: the proxy can refuse a request once the requests it is
    # processing at once reach a cap. Its limit_conn counts them against a key,
    # in a zone of shared memory every worker process reads, so with one key for
    # every request the count is one total across everything the proxy
    # forwards, and the request past the cap is answered 503. The capability is
    # what the label asserts; no cap applies until an operator sets one. Read
    # in NGINX's limit_conn reference,
    # https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html, on
    # 2026-10-12, for the 1.27.5 the default engine_version runs.
    dataplane.aggrega.ai/concurrency-cap: total
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The upstream the gateway proxies to. The selected component's provides
    # host and port arrive on the injection context; each Recipe renders them
    # into the proxy_pass target of the NGINX server configuration.
    upstream:
      selector: "component.aggrega.ai/type=server"
      inject: [env]
    # The guard every request the gateway forwards is sent to while
    # core/prompt-injection-shield is attached, in place of the upstream: a
    # service speaking the OpenAI chat-completions API, which checks each chat
    # request and forwards what it admits to the model it is configured with.
    # The selector admits a component whose prompt guard is a trained
    # classifier's; the shield's realization halts the build unless the guard
    # wired here is core/security/nemo-guardrails, the one guard its two
    # sensitivities are measured on. The guard's published host, port and
    # threshold arrive on the edge, and the realization writes the host and port
    # in place of the upstream's as the proxy_pass target. No inject block is
    # authored on the edge, because the realization reads the edge itself.
    # Optional: wired alone it changes no request, since the target is the
    # guard's only while the shield is attached, and that attachment halts the
    # build unless this socket is wired.
    guard:
      selector: "dataplane.aggrega.ai/prompt-guard=classifier"

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      upstream_path:
        type: string
        default: "/"
        description: Location path prefix the gateway proxies to the upstream. Requests matching this prefix are forwarded to the upstream wired on the `upstream` socket.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: HTTP port NGINX listens on. Most operators should omit this and let the Recipe assign the default (8080).
      engine_version:
        type: string
        default: "1.27.5-alpine"
        description: NGINX container image tag for the official upstream nginx image. Both targets — the synthesized Helm Deployment (Kubernetes) and the Compose service (local) — run `nginx:<engine_version>`.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the proxy. A consumer
          sends its client traffic here and the gateway forwards it to
          whichever component the topology bound to its upstream socket.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts client traffic on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
