apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/nginx
  version: 1.0.0
  description: >
    An NGINX reverse-proxy gateway. NGINX terminates client HTTP traffic and
    forwards it to an upstream service wired through its `upstream` uses-socket:
    the upstream host and port arrive on the injection context and are rendered
    into the NGINX server configuration as the proxy_pass target, so the gateway
    routes to whichever component the topology binds. NGINX holds no persistent
    state, so it renders as a stateless server with no volume. Provider-agnostic:
    the same component is implemented by a synthesized Helm Recipe on the official
    NGINX image (Kubernetes) and a Compose Recipe (local development). Exports its
    host and listen port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The upstream the gateway proxies to. The selected component's provides
    # host and port arrive on the injection context; each Recipe renders them
    # into the proxy_pass target of the NGINX server configuration.
    upstream:
      selector: "component.aggrega.ai/type=server"
      inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      upstream_path:
        type: string
        default: "/"
        description: Location path prefix the gateway proxies to the upstream. Requests matching this prefix are forwarded to the upstream wired on the `upstream` socket.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: HTTP port NGINX listens on. Most operators should omit this and let the Recipe assign the default (8080).
      engine_version:
        type: string
        default: "1.27.5-alpine"
        description: NGINX container image tag for the official upstream nginx image. Both targets — the synthesized Helm Deployment (Kubernetes) and the Compose service (local) — run `nginx:<engine_version>`.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
