apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/gateway/azure-api-management
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and a hosted service grants
  # no source licence, so there is none to name. The class is stated through
  # component.aggrega.ai/upstream-licensing below.
  description: >
    The AI gateway of Azure API Management, a hosted service: a caller sends
    its model requests to an API on an API Management instance, which forwards
    them to the model API behind it. Nothing runs in the Release and the
    compiler never calls Azure. It publishes the API's address and the model a
    caller asks for, which the gateway forwards unchecked.

    On terraform its Recipe adds the API, its backend and its policy to an
    instance that already exists, and is the one that can carry controls:
    reach for it where the instance exists and the Release is to configure the
    API. On helm and compose its Recipes reference an API that already exists
    and carry no Feature: reach for those where the API is configured outside
    the Release.

    On terraform it realizes core/semantic-caching, core/period-budget,
    core/prompt-injection-shield and core/retry-policy in the API's policy,
    and halts core/audit-logging by name. Not realized:
    core/response-validation, core/target-selection, core/data-masking,
    core/concurrency-limit and core/fallback-chain.

    A caller presents its own subscription key; the one credential the gateway
    holds is the optional provider_key, written as a reference to a Key Vault
    secret. What the gateway does with a request is Microsoft's documented
    behaviour and no build observes it. It carries no model.aggrega.ai/api
    label, so an agent's model socket does not take it.
  labels:
    # A hosted service the Release does not run: platform-managed
    # infrastructure, as a managed model API is.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: gateway
    # mixed: the terraform Recipe adds the API to an instance in the operator's
    # own Azure account, which Azure then runs (managed), and the helm and
    # compose Recipes reference an API that already exists (external).
    component.aggrega.ai/hosting: mixed
    # A hosted service under Microsoft's own terms, which the user contracts
    # for directly.
    component.aggrega.ai/upstream-licensing: proprietary
    # The gateway reads each model request it forwards on an API serving a
    # model API: the prompt its semantic cache compares, the tokens a reply
    # reports and the content its safety check sends for inspection. So a
    # runtime control that has to parse a model payload can attach here.
    gateway.aggrega.ai/intelligence: semantic
    # Period budget: the gateway can refuse model requests once the tokens it
    # has counted for a key over a period reach a quota set in its policy: the
    # prompt and completion tokens each reply reports, counted together, which
    # is the fidelity this value names. It prices nothing, so it counts no
    # cost, and it keeps a separate count at each gateway of the instance. The
    # value names what the product can do, not a configured state: the gateway
    # refuses nothing on tokens while no token limit is in its policy.
    dataplane.aggrega.ai/period-budget: tokens
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Where each AI gateway control this gateway's reference names is or is not
  # realized here. Each realized one is a FeatureRecipe for the terraform
  # Recipe, which writes into the API's policy the element the FeatureRecipe
  # delivers or, for the prompt shield, the element it asks for; the helm and
  # compose references halt on any attachment.
  # - core/semantic-caching: Azure's semantic cache lookup and store, apart
  #   per API and per subscription; semantic-caching-azure-api-management
  #   refuses end_user by name, since the API validates no end user's token,
  #   and the terraform Recipe halts until infra.cache_serves_vector_search
  #   affirms that the instance's external cache serves RediSearch.
  # - core/period-budget: Azure's token limit, counting prompt and completion
  #   tokens together over a fixed window on the UTC clock or a rate per
  #   minute; period-budget-azure-api-management refuses what it cannot keep.
  # - core/prompt-injection-shield: Azure's content safety check with its
  #   prompt shield on, through the backend infra.content_safety_backend_id
  #   names; prompt-injection-shield-azure-api-management keeps sensitivity
  #   standard and refuses strict by name, since the shield is on or off.
  # - core/retry-policy: Azure's retry around the forwarding, in the API
  #   policy's backend section, sends a request again after a reply of 429 or
  #   a 5xx status. A refused connection or a timeout raises an error, which
  #   ends the retry in the on-error section, so neither is sent again;
  #   retry-policy-azure-api-management refuses more than 51 sends.
  # - core/audit-logging: audit-logging-azure-api-management halts every
  #   attachment. The model-request log goes to Azure Monitor through a
  #   diagnostic setting on the instance, keeps no cost, and lasts as long as
  #   its Log Analytics workspace keeps it.
  # - core/concurrency-limit: Microsoft calls the cap limit-concurrency
  #   enforces never completely accurate, and lower when several capacity
  #   units run in a region, so it keeps neither a count per running proxy,
  #   which the Feature's sizing assumes, nor an exact cap.
  # - core/fallback-chain: the API forwards to one backend, and Azure's own
  #   fallback, a backend pool's priority groups, moves later requests off a
  #   backend whose circuit breaker has tripped rather than sending a failed
  #   request on to another model.
  # - core/response-validation: validate-content checks the whole body of a
  #   request or a reply against a schema. A chat reply's text is a string
  #   inside that body, which the check does not parse, so it does not check
  #   what the model wrote.
  # - core/target-selection: a backend pool balances requests round-robin, by
  #   weight, by priority or by session; none of them picks the target that
  #   answers quickest or costs least.
  # - core/data-masking: no policy replaces sensitive text in a model request
  #   or reply; find-and-replace swaps one literal string for another.
  #
  # No model.aggrega.ai/api label. The API answers the OpenAI chat completions
  # request shape, but by default a caller authenticates with an API
  # Management subscription key, sent in the Ocp-Apim-Subscription-Key header
  # rather than as OpenAI's bearer token, so a plain OpenAI client is not
  # enough to call it.

  # The credential the gateway presents to the model API behind it. A caller's
  # own key is not one of these: API Management issues subscription keys and
  # checks them itself, and a consumer presents its key from the connection it
  # reaches the gateway on. Terraform authenticates to Azure with the
  # credentials in the environment it runs in, so the rendered configuration
  # names none.
  featuresSchema:
    provider_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional key the gateway presents to the model API behind it, read only by the terraform Recipe and only while infra.backend_authentication is provider_key. The key itself stays in Azure Key Vault: the attachment delivers the identifier of the Key Vault secret holding it, https://<vault>.vault.azure.net/secrets/<name>, as core/secret-value bound to terraform/variable-secret does, and the Recipe writes that identifier into a secret named value the instance reads with its managed identity, which needs read access to that secret. The build halts on a delivered value that is not such an identifier, so a key written in place of one never reaches a rendered file. The secret holds the header's whole value, as the header named by infra.provider_key_header carries it: for a bearer token, Bearer followed by the key."
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        model:
          type: string
          min: 1
          description: "The model a caller asks the gateway for, written as the model API behind it expects it: a deployment name on Azure OpenAI, or the provider's own model name, such as gpt-4o-mini. Published as model; the gateway forwards it without checking it."
      required: [model]
    infra:
      # The instance and the API are named by the operator, and the published
      # address is composed from them, so it is a string fixed ahead of time
      # rather than one anything has to resolve.
      api_management_name:
        type: string
        required: true
        min: 1
        max: 50
        pattern: "^[a-zA-Z]([a-zA-Z0-9-]*[a-zA-Z0-9])?$"
        description: "The name of the API Management instance the API is served on. The terraform Recipe reads this instance and never creates it; the helm and compose Recipes compose the address from it."
      api_path:
        type: string
        required: true
        min: 1
        max: 400
        pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(/[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$"
        description: "The path the API is served under at the gateway, unique within the instance, such as models or teams/chat. The terraform Recipe creates the API at it and names the API, its backend and its named value after it, with each slash as a hyphen; the helm and compose Recipes reference the API already served there."
      gateway_url:
        type: string
        pattern: "^https://[^/]+$"
        description: "The scheme and host the instance's gateway answers on, with no path, such as https://api.contoso.com for an instance reached under its own domain. Unset, the address is https://<api_management_name>.azure-api.net, the host Azure gives the instance."
      # The settings below are written by the terraform Recipe only, because it
      # is the one Recipe that configures the API; the helm and compose Recipes
      # reference an API configured elsewhere and leave them alone. The ones it
      # cannot do without halt that Recipe when unset rather than being
      # required here.
      resource_group_name:
        type: string
        min: 1
        description: "The resource group the API Management instance sits in. Read by the terraform Recipe only, which halts the build when it is unset."
      backend_url:
        type: string
        pattern: "^https://"
        description: "The base address of the model API the gateway forwards to, with no trailing slash: the gateway appends /chat/completions. For Azure OpenAI, https://<resource>.openai.azure.com/openai/v1. Read by the terraform Recipe only, which halts the build when it is unset."
      # How the gateway proves itself to the model API. No default: a managed
      # identity token sent to a backend that is not the intended Azure service
      # hands that backend a token Azure accepts, and API Management does not
      # check where it sends one, so the operator says which it is.
      backend_authentication:
        type: string
        enum: [managed_identity, provider_key, none]
        description: "How the gateway authenticates to the model API. managed_identity: a token for https://cognitiveservices.azure.com obtained with the instance's system-assigned identity and sent as a bearer token, which Azure OpenAI and other Microsoft Foundry models accept once that identity holds a role on them; the gateway does not check where it sends the token, so choose it only for such a backend. provider_key: the key held in the Key Vault secret provider_key names, sent in the header infra.provider_key_header names. none: nothing is added, for a model API that takes no credential. Read by the terraform Recipe only, which halts the build when it is unset."
      provider_key_header:
        type: string
        default: api-key
        pattern: "^[A-Za-z0-9-]+$"
        description: "The header the key provider_key names is sent in. api-key, the default, is the header Azure OpenAI reads; a model API taking a bearer token reads Authorization. Read by the terraform Recipe only, while infra.backend_authentication is provider_key."
      subscription_required:
        type: boolean
        default: true
        description: "Whether the API refuses a request that presents no API Management subscription key. Off, anyone holding the address can send model requests through the gateway. Written by the terraform Recipe only."
      # Named rather than created: Azure's content safety check calls Azure AI
      # Content Safety through a backend the instance authenticates to with its
      # managed identity, and azurerm's backend resource takes no managed
      # identity credential, so that backend is configured on the instance
      # outside the Release.
      content_safety_backend_id:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        description: "The id of the API Management backend for the instance's Azure AI Content Safety resource, at https://<name>.cognitiveservices.azure.com, which the instance reaches with its managed identity holding the Cognitive Services User role there. Read by the terraform Recipe only, which halts the build when core/prompt-injection-shield is attached and it is unset; the backend is configured on the instance outside the Release."
      # Affirmed rather than checked: Azure's semantic cache looks a prompt up
      # by vector proximity in the external cache configured on the instance,
      # which Microsoft requires to be a Redis cache with RediSearch enabled,
      # and that cache is configured outside the Release, where no build can
      # see it.
      cache_serves_vector_search:
        type: boolean
        default: false
        description: "Affirms that the external cache the API Management instance uses is a Redis cache serving the vector search of the Redis query engine, RediSearch, which Azure's semantic cache looks prompts up with. The cache is configured on the instance outside the Release and the compiler never reads it, so it asks rather than checks. Read by the terraform Recipe only, which halts the build when core/semantic-caching is attached and this is left unaffirmed; with no such attachment it changes nothing rendered."
    provides:
      endpoint:
        type: string
        required: true
        description: "The address of the API, <gateway_url>/<api_path>, with gateway_url defaulting to https://<api_management_name>.azure-api.net. A client of the OpenAI chat completions API uses it as its base address and presents its subscription key in the Ocp-Apim-Subscription-Key header."
      model:
        type: string
        required: true
        description: "The model a caller asks for, carried through from values.model."
