apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/gateway/kong
  version: 1.0.0
  license: Apache-2.0
  description: >
    Kong, a database-backed API gateway. Kong terminates client traffic on its
    proxy data-plane and routes it according to configuration held in a
    PostgreSQL backend wired through its `backend` uses-socket: the backend
    host, port, user, and database arrive on the injection context and compose
    Kong's PostgreSQL connection. The database schema is provisioned by a
    migrations step that runs to completion before the gateway begins serving,
    so the gateway starts against a ready schema. Kong holds no persistent state
    of its own — the database is the system of record — so it renders as a
    stateless server. Exports its proxy host, port, and protocol to consumers
    via the uses topology.

    On Kubernetes there are two realizations and the Manifest chooses between
    them. `kong` synthesizes the gateway as a workload with a bootstrap step
    ahead of it and fetches nothing, so it is the one to reach for where the
    build must complete with no chart repository reachable. `kong-chart` renders
    the official Kong Helm chart, which sequences three schema-migration steps
    around a release rather than one ahead of a start — a bootstrap, an
    up-migration before an upgrade and a finishing migration after it — so reach
    for it where the gateway will be upgraded in place.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    component.aggrega.ai/upstream-licensing: osi-approved
    # Data-path capability label. It states what this gateway is able to do,
    # never what a given deployment has switched on — the two read alike to a
    # developer and only the first is a property of the product.
    #
    # Upstream TLS: a routed service may be configured to have its certificate
    # verified against a trust anchor the deployment supplies. The capability
    # is what the label asserts; whether a given service turns it on is that
    # service's own configuration.
    dataplane.aggrega.ai/upstream-tls: trust-anchor
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The PostgreSQL backend Kong stores its configuration in. The selected
    # component's provides host, port, user, and database arrive on the
    # injection context and compose Kong's KONG_PG_* connection.
    backend:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]
      required: true

  featuresSchema:
    # Optional password credential slot, shared with the backend. When attached,
    # supplies KONG_PG_PASSWORD via the credential subsystem; when unattached,
    # the Recipe falls back to its inline default.
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential shared with the backend. When attached, supplies the backend password via the credential subsystem; unattached, the Recipe uses its inline default."

  schema:
    # Kong needs no developer values; the backend user and database arrive on
    # the `backend` uses-edge.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      proxy_port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Proxy data-plane port consumers connect to.
      admin_port:
        type: integer
        min: 1024
        max: 65535
        default: 8001
        description: Admin API port, reachable in-cluster only.
      engine_version:
        type: string
        default: "3.9.3"
        description: Kong gateway container image tag. Selects the image tag on container targets; the chart-backed realization pins its own image tag.
      source_version:
        type: string
        description: Version of the Helm chart the chart-backed realization pulls. Read only by that realization; the workload-synthesis realization pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the proxy data plane. A
          consumer sends its client traffic here rather than to the service
          behind the gateway.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxied traffic on. It carries the
          proxy port an operator set, never the Admin API port, which stays
          in-cluster.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
