apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/server/ai-gateway
  version: 1.0.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    gateway.aggrega.ai/intelligence: semantic
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseComponentParameter"
      properties:
        routingMode: { type: string, enum: [latency_optimized, cost_optimized], default: latency_optimized }
        upstreamTimeoutSeconds: { type: integer, exclusiveMinimum: 0 }
      required: [routingMode]
