apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/devtool/adminer
  version: 1.0.0
  description: >
    Adminer — a lightweight single-file database administration web UI.
    Connects to any stateful-server database wired through its `databases`
    uses-socket: the database host arrives on the injection context and
    the Recipe renders it as ADMINER_DEFAULT_SERVER so the login screen
    targets the right server. Login credentials are entered in the
    browser; the component holds no credential slots of its own.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: devtool
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge
  # values into the env delivery mechanism.
  inject: [env]

  usesSchema:
    databases:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      design:
        type: string
        default: pepa-linha-dark
        description: Adminer CSS theme name (ADMINER_DESIGN).

    infra:
      # Operational Sizing — filled by the Operator in the Release.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the administration UI is reached on — the Service port on Kubernetes, and the host port it is published on with Docker Compose. Adminer itself listens on 8080 inside its container.

    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        description: >
          In-cluster DNS name of the Service serving the administration UI. A
          consumer that fronts the UI behind a gateway points its upstream at
          this name together with `port`.
      port:
        type: string
        description: >
          TCP port that Service serves the UI on. The realization falls back
          to 8080 when no port is set, so a consumer reads this rather than
          assuming either.
