apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/devtool/harbor-portal
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor portal — the web UI. It is a pure static-asset server: an nginx
    process that serves the compiled single-page application bundled into its
    image and rewrites unmatched routes to the SPA entry point. It talks to no
    other service and needs no backend of its own; API traffic reaches the core
    service through path routing at the ingress tier rather than through the
    portal. Holds no state, so it renders as a stateless server. Exports its
    host, port, and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: devtool
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]

  schema:
    # The portal reads no developer values; it serves the static bundle baked
    # into its image and takes only its listen port from infra.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Static web UI listen port consumers connect to.
      engine_version:
        type: string
        default: "v2.13.4"
        description: Harbor portal container image tag.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
