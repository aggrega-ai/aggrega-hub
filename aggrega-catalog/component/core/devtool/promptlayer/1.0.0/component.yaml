apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/devtool/promptlayer
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the platform is a hosted service and no source licence is granted for it, so
  # no single identifier expresses the situation. The class it falls into is
  # stated instead through component.aggrega.ai/upstream-licensing below. The
  # publisher's client libraries are separately published under their own
  # permissive terms, and those terms cover the libraries rather than the
  # platform, so they are not carried over here.
  description: >
    A hosted prompt registry, and the surface a team edits and versions its
    prompts on. A prompt is authored and versioned in the registry rather than
    in application source, each version carries a release label such as prod or
    staging, and an application fetches the prompt behind a label at run time
    over the platform's API — so moving a label to a new version changes what
    the application sends without a redeploy. The registry also keeps a log of
    the requests an application reports to it, which is how a prompt version and
    the behaviour it produced are read together.

    Nothing runs in the deployment for this component: the platform is operated
    by its publisher, and a deployment holds a contract and an API key rather
    than a process. Its realizations are therefore reference realizations, which
    emit only the wiring a consumer needs to reach the service and provision no
    compute. The base address is an operational value so it can be repointed —
    the platform's own client libraries read the same override — which is what
    lets a Release address a regional or self-managed installation without a
    consumer changing.

    Exports the base address and the release label to consumers via the uses
    topology, so a consuming component reads which registry to call and which
    label to ask for from one place rather than each of its own containers
    carrying a copy. The API key is not exported and is not held here: the
    environment-variable name a credential arrives under belongs to the
    consuming application, so a consumer that needs one declares the
    `credential` slot on the socket that reaches the registry and delivers it
    from its own container.
  labels:
    # A hosted service the deployment neither provisions nor operates: nothing
    # in the cluster runs it, so the operational primitive is a resource rather
    # than a server, and the trust boundary sits with the publisher.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: devtool
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      prompt_label:
        type: string
        default: prod
        required: true
        description: "Release label an application resolves a prompt through. The label names a moving pointer rather than a fixed version, and that is the point: promoting a new prompt version onto this label changes what the application sends with no change here and no redeploy. A deployment that must pin an exact version asks for it in its own call rather than through this value."
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      endpoint:
        type: string
        default: "https://api.promptlayer.com"
        description: Base address of the registry's API. It defaults to the publisher's public address and is stated here rather than fixed in a Recipe so an operator may repoint it — at a regional address, at an installation the operator has contracted for, or at a proxy the deployment routes egress through. A deterministic pointer string the runtime resolves; the compiler never contacts it.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint is the address a consumer calls; prompt_label is the label it
      # asks for, published so the two travel together on one edge.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the registry's API an application fetches its prompts
          from. The Release supplies it, so an operator may point it at a
          different host without the application changing.
      prompt_label:
        type: string
        required: true
        description: >
          Release label an application resolves a prompt through, carried
          through from the label the Aggregate declared. Moving the label to
          another prompt version changes what the application sends without a
          redeploy.
      protocol:
        type: string
        description: How the published address is spoken to — `https`, since the registry is reached across the public network.
