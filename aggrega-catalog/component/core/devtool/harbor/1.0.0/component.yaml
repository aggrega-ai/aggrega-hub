apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/devtool/harbor
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    A Harbor container registry, declared as one component and deployed as one
    unit. Harbor is several cooperating services — an API and token-service
    control plane, an OCI blob store, a web console, an asynchronous worker
    tier, a vulnerability scanner, a relational backend and a key-value cache —
    and this component describes the whole of that, not any one of them. An
    Aggregate declaring it gets a registry a container client can log in to,
    push to and pull from, and a console to administer it through.

    A single in-cluster address fronts the whole registry: one reverse proxy
    routes the console path to the web console and the registry and API paths to
    the control plane, so a consumer wires to one host and one port rather than
    to each service in turn. That address is what `provides` publishes, and it
    is the only address consumers need.

    The relational backend and the key-value cache are part of the unit rather
    than separate components, so the registry stands up with nothing else
    declared beside it. Durable state lives in three places — image layers and
    manifests on the blob store's volume, the project and user model in the
    backend, and the scanner's vulnerability database on its own volume — so the
    component is stateful.

    Every credential the registry needs has a value, and every one of them can
    be replaced. Those the running software can be pointed at a secret for are
    credential slots, filled from the credential subsystem when a Release
    attaches one, so the material never reaches the rendered output; the rest are
    operational settings a Release sets. Unattached and unset, each takes a
    development value stated in the Recipe, so the component runs self-contained
    for evaluation and local development. Those values are shared and published
    in this catalog: a Release serving real traffic replaces them.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: devtool
    # The Recipe runs the registry as containers in the Release's own cluster,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  featuresSchema:
    # Four credential slots. Each one is optional: `required` is omitted, so an
    # Aggregate declaring a bare `registry: {}` still loads, and with nothing
    # attached the Recipe supplies its own development value for that credential.
    #
    # Each slot below names a secret the registry reads by key, and the Recipe
    # points the running software at the attached secret BY NAME rather than
    # copying the material, so an attached credential never appears in the
    # rendered artifact. The selector is secret-kind-pinned but family-agnostic,
    # so any referenceable secret may fill any of them.
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates the credential when it deploys.
    admin_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      description: "Optional credential for the registry's built-in administrator account, the account the web console and the API are first administered through. Unattached, the Recipe uses its development default."
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, at the Feature's default length of 32 this key needs.
    csrf_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      description: "Optional credential holding the key the control plane signs its cross-site request forgery tokens with. It must be exactly 32 characters; a shorter or longer value is refused by the control plane at start-up. Unattached, the Recipe uses its development default."
    # To replace the Recipe's development default, attach core/random-password with
    # length 16, which Harbor's chart documents for it; the cluster generates it.
    jobservice_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      description: "Optional credential holding the shared secret the worker tier and the control plane authenticate to each other with. Unattached, the Recipe uses its development default."
    # To replace the Recipe's development default, attach core/random-password with
    # length 16, which Harbor's chart documents for it; the cluster generates it.
    registry_http_secret:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      description: "Optional credential holding the secret the blob store signs its upload state with, which every replica of the blob store must share. Unattached, the Recipe uses its development default."

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # registry's projects, users and repositories are created through its own
      # API at run time, so the component declares the registry rather than its
      # contents, and the developer surface is correspondingly small.
      log_level:
        type: string
        description: Log verbosity the registry's services run at (debug, info, warning, error or fatal). Omit to use the product's default (info).

    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1
        max: 65535
        default: 80
        description: >
          Port the registry's single published address accepts traffic on. It
          sets the Service port only — the reverse proxy behind it listens on a
          port the product fixes — so any value in range is servable, including
          the privileged ports a registry is conventionally reached on.
      external_base_url:
        type: string
        description: >
          Externally reachable address of the registry, as assembled at the
          ingress tier — scheme, host and, where it is not the scheme's default,
          port, with no path; for example https://registry.example.com. The
          registry composes from this the token-service address it returns to a
          container client that logs in, and the push and pull commands its
          console shows, so a client outside the cluster is sent somewhere it can
          reach. A container client addresses a registry at the root of a host,
          so the Recipe halts the build on an address carrying a path. Omitted,
          the Recipe gives the registry its in-cluster address, which is correct
          for a registry nobody reaches from outside the cluster.
      engine_version:
        type: string
        default: "v2.15.2"
        description: >
          Harbor container image tag. The product ships every one of its service
          images on a single tag, so this one value selects them all. Moving it
          away from the Recipe's default is not guaranteed to match the chart the
          Recipe pulls; move source_version with it.
      source_version:
        type: string
        description: Version of the Helm chart the Recipe pulls. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
            description: Persistent volume size for the image layers and manifests the blob store holds. The registry's other volumes — the backend's, the cache's, the scanner's and the worker tier's log volume — take the product's own sizes.
          type:
            type: string
            description: >
              Persistent volume storage class, applied to every volume the
              registry claims. Leave it unset to take the cluster's default
              storage class; set it to name another class the cluster offers.

      # ── Credentials with no by-name path ────────────────────────
      # The credential slots above cover what the running software reads from a
      # secret it is pointed at. Everything below is written into the
      # configuration the Release renders instead, because the software offers no
      # way to be pointed at a secret for it — so a Release replaces these by
      # setting them here. Each has a development value stated in the Recipe, and
      # those values are published in this catalog; a Release serving real
      # traffic replaces every one of them.
      secret_key:
        type: string
        description: >
          Key the control plane encrypts stored credentials with — the
          credentials of the upstream registries it replicates from and to. It
          must be exactly 16 characters. Changing it on a registry that already
          holds replication credentials makes those credentials unreadable, so
          it is set once, when the registry is first stood up.
      core_secret:
        type: string
        description: Shared secret the control plane presents to its own services. It must be exactly 16 characters.
      database_password:
        type: string
        description: Password for the account the control plane connects to its relational backend as.
      # These three describe ONE account — the one the control plane and the
      # worker tier present to the blob store — written three ways, so they are
      # set together or not at all. A Release that sets some of them halts,
      # because a partial change leaves the blob store checking one account while
      # the registry's own services present another, and the build would
      # otherwise succeed over a registry that rejects every push.
      registry_username:
        type: string
        default: harbor_registry_user
        description: Account name the control plane and the worker tier present to the blob store. Set it together with registry_password and registry_htpasswd, or set none of the three.
      registry_password:
        type: string
        description: Password the control plane and the worker tier present to the blob store. Set it together with registry_username and registry_htpasswd, or set none of the three.
      registry_htpasswd:
        type: string
        description: >
          The other two keys as a single htpasswd line —
          `<registry_username>:<bcrypt hash of registry_password>` — which is the
          form the blob store checks a presented account against. Produce it with
          `htpasswd -nbB <username> <password>`. Set it together with the other
          two, or set none of the three.

      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # One address fronts the whole registry, so there is one host to publish.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the whole registry. A
          container client logs in, pushes and pulls against this name, and a
          browser reaches the console on it.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts traffic on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, so a consumer composes an address on that scheme.
