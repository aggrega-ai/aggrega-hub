apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/devtool/artifact-registry
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Artifact Registry is a hosted
  # service the reader contracts for with Google Cloud, under Google Cloud's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The repository's behaviour follows Artifact Registry's documentation: the
  # REST reference of a repository (its formats, registryUri, a name unique
  # among a project's repositories in one location, and the Docker
  # repository's immutableTags), the supported formats page, the gcloud
  # reference of `gcloud artifacts repositories create` (its
  # --repository-format values, and --immutable-tags for Docker
  # repositories alone), and "Docker image names" (the address an image is
  # pushed to).
  description: >
    One Artifact Registry repository: a store of container images or of
    language and operating system packages, kept by Google Cloud's managed
    registry in one location of a project and named after the component. A
    consumer reads the registry's name as host, such as
    europe-west1-docker.pkg.dev, the name a client authenticates at, and the
    repository's address as repository_uri, <host>/<project>/<repository>,
    which an image is pushed to and pulled from as
    <repository_uri>/<image>:<tag>. A package manager's URL is formed from
    the repository's location, project and name as the page of its format
    gives.

    Images and packages are created by pushing or uploading them, not
    declared here. A client authenticates as its own Google identity, under
    IAM roles the operator grants on the repository; the repository carries
    no IAM binding, and no credential is published.

    values.format chooses what the repository holds, DOCKER unless set, and
    values.immutable_tags, on a Docker repository, keeps each pushed tag on
    its image. The repository is a standard one, which clients write to: a
    remote repository caching an upstream and a virtual repository grouping
    others need upstream settings no value carries, and are not offered.
    Artifact Registry fixes the format when it creates the repository, and
    holds a repository's name unique among a project's repositories in one
    location, so two Releases of one Aggregate deployed to one project and
    location collide.

    No backup is configured: keeping copies of images and packages
    elsewhere is the operator's. Each Recipe's description says when the
    repository is deleted and which keys it honours and which it refuses by
    name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: devtool
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No credential slot: a client authenticates as its own Google identity,
  # which the operator grants an Artifact Registry role on the repository.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # values are declared as one object, with properties:, because a value
      # named format is read as the schema keyword itself in the compact
      # form, and closed with additionalProperties: false, which the compact
      # form adds itself, so a misspelt value halts the build. Both may be
      # omitted, so a bare `images: {}` keeps a working contract: a Docker
      # repository, the format a container image is pushed to.
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          default: DOCKER
          description: >
            What the repository holds, DOCKER unless set: DOCKER for container
            images and other OCI artifacts, or a package format, APT, CONDA,
            GENERIC, GO, GOOGET, KFP, MAVEN, NPM, PYTHON, RUBY or YUM, the
            formats Artifact Registry's documentation names, written in
            either case. It also names the registry, such as
            europe-west1-docker.pkg.dev for DOCKER. Artifact Registry fixes it
            when it creates the repository, so changing it creates a new,
            empty repository. Any other format halts the build, naming this
            key.
        immutable_tags:
          type: boolean
          description: >
            On a Docker repository, whether a pushed tag stays on its image:
            true prevents every tag of the repository from being modified,
            moved or deleted once pushed, while new tags can still be created;
            false, or unset as Artifact Registry's own default, lets a push
            move a tag to another image. Changing it changes the repository in
            place. Artifact Registry offers it on Docker repositories alone,
            so setting it with another values.format halts the build, naming
            both keys.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The registry's name, <location>-<format>.pkg.dev, such as
          europe-west1-docker.pkg.dev: the host part of repository_uri, the
          name a client authenticates at, as docker login or a credential
          helper does, and the first part of every image reference the
          repository serves. Every repository of that format in that location
          shares it. A realization publishes a pointer string the provisioning
          tool resolves once the repository exists, so a consumer reads this
          rather than composing one.
      repository_uri:
        type: string
        required: true
        description: >
          The repository's address, <host>/<project>/<repository>, such as
          europe-west1-docker.pkg.dev/example-project/api-images, the
          repository being the component's name: an image is pushed to and
          pulled from <repository_uri>/<image>:<tag>, or
          <repository_uri>/<image>@<digest>. A package manager's URL is
          formed from the repository's location, project and name as the page
          of its format gives. A realization publishes a pointer string the
          provisioning tool resolves once the repository exists.

  # The rules Artifact Registry holds a repository to that the schema above
  # does not state. Each halts the build naming what to change rather than
  # leaving the creation to fail.
  #
  # Artifact Registry's documentation states no rule for a repository's name
  # beyond its being unique among a project's repositories in one location,
  # so the component's name, which the repository takes, is not held to one
  # here: a name the service does not take fails when the repository is
  # created.
  assertions:
    # The formats Artifact Registry's documentation names: the REST
    # reference's Format values, the supported formats page and the gcloud
    # reference's --repository-format values, which differ from one another,
    # taken together, so no format any of them names is refused. The google
    # provider compares the format without regard to case.
    format_offered: >-
      {{- $f := .values.format -}}
      {{- if not (and (typeIs "string" $f) (has (upper $f) (list "APT" "CONDA" "DOCKER" "GENERIC" "GO" "GOOGET" "KFP" "MAVEN" "NPM" "PYTHON" "RUBY" "YUM"))) -}}
      {{- fail (printf "values.format is %s, and Artifact Registry's documentation names the repository formats APT, CONDA, DOCKER, GENERIC, GO, GOOGET, KFP, MAVEN, NPM, PYTHON, RUBY and YUM: set values.format to one of them in the Aggregate, or remove it for DOCKER" (toJson $f)) -}}
      {{- end -}}
    # The REST reference keeps immutableTags in the Docker repository's
    # configuration, and the gcloud reference gives --immutable-tags as
    # Docker only.
    immutable_tags_docker: >-
      {{- if and (kindIs "bool" (optional .values "immutable_tags" "")) (ne (upper (toString .values.format)) "DOCKER") -}}
      {{- fail (printf "values.immutable_tags is set while values.format is %s, and Artifact Registry offers immutable tags on a Docker repository alone: remove values.immutable_tags from the Aggregate, or set values.format to DOCKER" (toString .values.format)) -}}
      {{- end -}}
