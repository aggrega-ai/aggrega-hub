apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/devtool/harbor-registry
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor distribution registry — the OCI blob store that physically holds
    image layers and manifests. This is the upstream Docker distribution server
    configured for Harbor: it authenticates clients with HTTP basic auth against
    a bundled htpasswd file (the core service is the party that basic-auths to
    it), stores blobs on a persistent filesystem volume, and keeps a blob
    descriptor cache in a Redis-compatible store wired through the `cache`
    uses-socket. It holds durable blob data on its own volume, so it renders as
    a stateful server with a per-replica claim. Exports its host, port, and
    protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: devtool
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The Redis-compatible cache the registry keeps its blob descriptor cache
    # in. The selected component's provides host and port arrive on the
    # injection context and compose the registry's redis addr.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # Per-connection Redis logical-database index. The registry isolates its
        # blob-descriptor cache on a distinct logical DB of the shared cache, so
        # this is a per-edge value rather than a component value.
        db_index:
          type: integer
          minimum: 0
          maximum: 15
          description: Redis logical-database index the registry uses on the shared cache.

  schema:
    # The registry reads no developer values; its blob store and cache settings
    # arrive from infra and the cache uses-edge.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5000
        description: Registry HTTP listen port consumers connect to.
      engine_version:
        type: string
        default: "v2.13.4"
        description: Harbor distribution registry container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            default: gp3
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
