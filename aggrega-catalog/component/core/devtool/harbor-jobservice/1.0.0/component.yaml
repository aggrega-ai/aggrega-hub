apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/devtool/harbor-jobservice
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor job service — the asynchronous worker tier that runs the
    registry's background jobs (replication, garbage-collection triggers,
    webhook delivery, scan orchestration). It runs a Redis-backed worker pool
    wired through the `cache` uses-socket, and it calls back into the core
    service through the `core` socket, from which it takes the core's in-cluster
    address and the shared internal secrets that authenticate the two to each
    other. Its persistent work queue lives in the shared cache, so the service
    itself keeps no durable state beyond a scratch log directory and renders as a
    stateless server. Exports its host, port, and protocol to consumers via the
    uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: devtool
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The Redis-compatible cache backing the job service's worker pool. The
    # selected component's provides host and port arrive on the injection
    # context and compose the worker pool's redis_url.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # Per-connection Redis logical-database index. The job service runs its
        # worker pool on a distinct logical DB of the shared cache, so this is a
        # per-edge value rather than a component value.
        db_index:
          type: integer
          minimum: 0
          maximum: 15
          description: Redis logical-database index the worker pool uses on the shared cache.
        # Per-connection key prefix the worker pool namespaces its Redis keys
        # under, keeping its keyspace distinct on the shared cache.
        key_namespace:
          type: string
          description: Redis key namespace the worker pool prefixes its keys with.
    # The core service the job service calls back into. The selected
    # component's provides host and port arrive on the injection context and
    # compose the job service's CORE_URL.
    core:
      selector: "component.aggrega.ai/category=devtool"
      inject: [env]
      required: true

  schema:
    # The job service reads no developer values; its worker pool and core
    # callback arrive on the uses-edges and its listen port from infra.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Job-service API listen port consumers connect to.
      engine_version:
        type: string
        default: "v2.13.4"
        description: Harbor job service container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 256Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
