apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/devtool/ecr
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Elastic Container
  # Registry is a hosted service the reader contracts for with AWS, under
  # AWS's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The repository's behaviour follows the Amazon ECR API Reference:
  # CreateRepository (the rule for a repository's name, the tag mutability
  # settings and MUTABLE as the service's own default, a name unique within
  # its registry), EncryptionConfiguration and DeleteRepository; and the
  # Amazon ECR User Guide: "Amazon ECR private registry" (the registry's
  # address), "Private registry authentication in Amazon ECR", "Encryption at
  # rest", "Preventing image tags from being overwritten in Amazon ECR" and
  # "Scan images for software vulnerabilities in Amazon ECR".
  description: >
    One Amazon Elastic Container Registry (Amazon ECR) private repository: a
    store of container images and other OCI artifacts in the default private
    registry of one AWS account and Region, named after the component. A
    consumer reads the registry's name as host, the repository's address as
    repository_uri, which an image is pushed to and pulled from as
    <repository_uri>:<tag>, and the repository's ARN, which an IAM policy
    names.

    Images and tags are created by pushing them, not declared here. A client
    logs in at host with an authorization token it obtains from Amazon ECR as
    its own IAM identity, under permissions the operator grants; the
    repository carries no repository policy, and no credential is published.

    A pushed tag stays on its image unless values.image_tag_mutability is
    MUTABLE, and the repository's own scan on push is on unless
    values.scan_on_push is false. Amazon ECR encrypts the images at rest,
    with the operator's KMS key where a Recipe's override names one, and
    fixes that choice when it creates the repository. A repository's name is
    unique within its registry, so two Releases of one Aggregate deployed to
    one account and Region collide.

    No backup is configured: AWS Backup does not list Amazon ECR among the
    services it backs up, and copying images elsewhere, such as through the
    registry's replication, is the operator's. Each Recipe's description says
    when the repository is deleted and which keys it honours and which it
    refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: devtool
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Each value carries a default every realization writes, whatever its tool
  # would default to, so a bare `images: {}` creates the same repository on
  # every target. The defaults are the protections, not the service's own
  # (MUTABLE, scan on push off): a tag that cannot move names one image for
  # good, so a deployed reference cannot change under it, and AWS Security
  # Hub's controls ECR.1 and ECR.2 check a private repository for image
  # scanning and for tag immutability. The image_tag_mutability assertion
  # below holds the value to the settings this Component offers.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      image_tag_mutability:
        type: string
        default: IMMUTABLE
        description: >
          Whether a pushed tag may later name another image: IMMUTABLE unless
          set, under which Amazon ECR refuses a push reusing a tag the
          repository already holds, with ImageTagAlreadyExistsException, so
          each tag names one image; or MUTABLE, under which such a push moves
          the tag to the new image. It applies to every tag of the
          repository, and changing it changes the repository in place.
          MUTABLE_WITH_EXCLUSION and IMMUTABLE_WITH_EXCLUSION halt the build:
          they exempt the tags matching exclusion filters, for which this
          Component declares no value.
      scan_on_push:
        type: boolean
        default: true
        description: >
          Whether the repository's own scan on push is on, true unless set:
          under the registry's basic scanning, its default, Amazon ECR scans
          each pushed image for operating system vulnerabilities and keeps
          the findings. Amazon ECR documents this repository setting as being
          deprecated in favour of the registry's scanning configuration, and
          where the operator turns on the registry's enhanced scanning, the
          registry's filters decide which repositories Amazon Inspector scans,
          a repository matching none being left unscanned. Changing it
          changes the repository in place.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The registry's name, such as 123456789012.dkr.ecr.eu-west-1.amazonaws.com:
          the host part of repository_uri, the name a client logs in at, as
          docker login does, and the first part of every image reference the
          registry serves. Every repository of the account's registry in that
          Region shares it. A realization publishes a pointer string the
          provisioning tool resolves once the repository exists, so a
          consumer reads this rather than composing one.
      repository_uri:
        type: string
        required: true
        description: >
          The repository's address, <host>/<name>, such as
          123456789012.dkr.ecr.eu-west-1.amazonaws.com/api-images, the name
          being the component's: an image is pushed to and pulled from
          <repository_uri>:<tag>, or <repository_uri>@<digest>. A realization
          publishes a pointer string the provisioning tool resolves once the
          repository exists.
      arn:
        type: string
        required: true
        description: >
          The repository's ARN, arn:<partition>:ecr:<region>:<account>:repository/<name>:
          what an IAM policy names as the resource it grants pushes and pulls
          on. A realization publishes a pointer string the provisioning tool
          resolves once the repository exists.

  # The rules Amazon ECR holds a repository to that the schema above does not
  # state: the tag mutability settings this Component offers, and the rule for
  # a repository's name, which reads the component's name. Each halts the
  # build naming what to change rather than leaving the creation to fail.
  assertions:
    # Amazon ECR takes MUTABLE, IMMUTABLE, IMMUTABLE_WITH_EXCLUSION and
    # MUTABLE_WITH_EXCLUSION (the API Reference's CreateRepository), each
    # spelt so. The exclusion settings exempt the tags matching the
    # repository's exclusion filters, which this Component declares no value
    # for, so they halt by name; any other value halts as well.
    image_tag_mutability: >-
      {{- $m := .values.image_tag_mutability -}}
      {{- if and (typeIs "string" $m) (has $m (list "MUTABLE_WITH_EXCLUSION" "IMMUTABLE_WITH_EXCLUSION")) -}}
      {{- fail (printf "values.image_tag_mutability is %q, and that setting exempts the tags matching the repository's exclusion filters, for which the Amazon ECR repository %q declares no value: set it to IMMUTABLE or MUTABLE in the Aggregate" $m .metadata.instance_id) -}}
      {{- else if not (and (typeIs "string" $m) (has $m (list "IMMUTABLE" "MUTABLE"))) -}}
      {{- fail (printf "values.image_tag_mutability is %s, and the Amazon ECR repository %q takes IMMUTABLE or MUTABLE, spelt so: set it to one of them in the Aggregate, or remove it for IMMUTABLE" (toJson $m) .metadata.instance_id) -}}
      {{- end -}}
    # Amazon ECR takes a repository name of 2 to 256 characters: lowercase
    # letters and digits in runs separated by a period, one or two
    # underscores or any number of hyphens, the runs optionally grouped under
    # namespaces by slashes, and starting with a letter (the API Reference's
    # CreateRepository, its pattern and its description). Each realization
    # names the repository after the component, whose name is made of
    # letters, digits, underscores and hyphens, so the rule reads it without
    # periods or slashes.
    repository_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[a-z][a-z0-9]*((_|__|-+)[a-z0-9]+)*$` $n) (ge (len $n) 2) (le (len $n) 256)) -}}
      {{- fail (printf "the component %q names its Amazon ECR repository, and Amazon ECR takes a repository name of 2 to 256 lowercase letters and digits, starting with a letter, in runs separated by one or two underscores or by hyphens: rename the component in the Aggregate to such a name" (trunc 64 $n)) -}}
      {{- end -}}
