apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/devtool/harbor-core
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor core service — the container registry's control plane and API
    server. It owns the registry's configuration, project and user model, and
    the authentication token service: it is the token issuer and validator that
    the distribution registry basic-authenticates against, and it holds the RSA
    signing key used to mint those tokens. The core stores its relational state
    in a PostgreSQL backend wired through the `backend` uses-socket and uses a
    Redis-compatible cache through the `cache` socket for sessions and job
    coordination. It composes the in-cluster addresses of the distribution
    registry, the job service, and the portal from the `registry`, `jobservice`,
    and `portal` sockets so it can proxy API traffic and drive background jobs.
    Holds no durable state of its own — the database and the registry blob store
    are the systems of record — so it renders as a stateless server. Exports its
    host, port, and protocol to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: devtool
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge values
  # into the env delivery mechanism.
  inject: [env]

  usesSchema:
    # The PostgreSQL backend the core stores its relational state in. The
    # selected component's provides host, port, user, and database arrive on
    # the injection context and compose the core's PostgreSQL connection.
    backend:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
    # The Redis-compatible cache the core uses for sessions and coordination.
    cache:
      selector: "component.aggrega.ai/category=datastore"
      inject: [env]
      required: true
      valueSchema:
        # Per-connection Redis logical-database index. Each Harbor service that
        # shares one Redis-compatible cache isolates its keyspace on a distinct
        # logical DB, so this is a per-edge value rather than a component value.
        db_index:
          type: integer
          min: 0
          max: 15
          description: Redis logical-database index this service uses on the shared cache.
    # The distribution registry the core basic-authenticates against and
    # proxies for image pull and push.
    registry:
      selector: "component.aggrega.ai/category=devtool"
      inject: [env]
      required: true
    # The job service the core dispatches background jobs to.
    jobservice:
      selector: "component.aggrega.ai/category=devtool"
      inject: [env]
      required: true
    # The static portal the core presents as the web UI.
    portal:
      selector: "component.aggrega.ai/category=devtool"
      inject: [env]
      required: true

  featuresSchema:
    # Optional password credential slot, shared with the backend. When attached,
    # supplies the PostgreSQL password via the credential subsystem; when
    # unattached, the Recipe falls back to its inline development default.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password credential shared with the backend. When attached, supplies the backend password via the credential subsystem; unattached, the Recipe uses its inline default."

  schema:
    # The core reads no developer values; the backend and cache identities
    # arrive on their uses-edges and its operational settings arrive from infra.
    values: {}
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: API and token-service listen port consumers connect to.
      engine_version:
        type: string
        default: "v2.13.4"
        description: Harbor core container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
