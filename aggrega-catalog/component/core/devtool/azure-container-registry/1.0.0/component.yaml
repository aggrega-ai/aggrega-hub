apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/devtool/azure-container-registry
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Container Registry is a
  # hosted service the reader contracts for with Microsoft, under Azure's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Container Registry: Microsoft's managed registry for container
    images, Helm charts and other OCI artifacts. A consumer reads the
    registry's login server as host, the name a client logs in at and
    pushes to and pulls from, as <host>/<repository>:<tag>.

    Repositories, images and tags are created by pushing them, not declared
    here. A client authenticates as a Microsoft Entra ID identity under the
    role assignments the operator makes on the registry, such as AcrPull to
    pull and AcrPush to push; the registry's admin account stays off and no
    credential is published.

    The registry answers at the name the service gives it, under
    azurecr.io in Azure's public cloud, and a private endpoint the operator
    links resolves that same name to a private address. No backup is
    configured: Microsoft recommends copying critical images to another
    registry or to external storage, outside the Release. Each Recipe's
    description says which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: devtool
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values: repositories, images and tags are objects the registry holds,
  # created by the clients that push them, so no value of the Aggregate
  # describes them.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The registry's login server, as the service reports it, such as
          <registry>.azurecr.io in Azure's public cloud: the name a client
          logs in at and the first part of every image reference the
          registry serves. A realization publishes a pointer string the
          provisioning tool resolves once the registry exists, so a consumer
          reads this rather than deriving one.
