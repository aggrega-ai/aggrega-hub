apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/network/dns-record
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none. Every realization writes a
  # record set into a managed DNS service the reader contracts for with the
  # cloud provider, under that provider's terms, which no SPDX identifier
  # names: the situation component.aggrega.ai/upstream-licensing records as
  # proprietary. No realization pins an artifact of the service, so the
  # catalog distributes and brokers none, and the standard library's admission
  # test, which reads the artifacts an entity pins, finds nothing to refuse.
  description: >
    One DNS record set: the records of one type that one name holds, written
    into a DNS zone hosted by a cloud provider's managed DNS service. One
    Component serves every cloud: the same values reach each service. Each
    Recipe is named dns-record- followed by the service it writes to, such
    as dns-record-azure-dns for Azure DNS.

    The Aggregate gives the record's fully qualified name, its type, its time
    to live and its data. The zone is the operator's, named in the Release
    under infra.overrides, and no realization creates or changes it. A
    consumer reads the record's name as host.

    An alias record, a name the DNS service answers with the address of a
    cloud resource it looks up, is not offered: type ALIAS halts the build on
    every realization. Each Recipe's description says which record types and
    names its service takes, and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: network
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The record's data comes from values alone: no socket takes it from another
  # component. A name known only once the target exists, such as a server's
  # address, reaches the record through the Aggregate as a fixed value, or
  # stays with the operator.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The
      # values are declared as one object, with properties: and required:,
      # because a value named type is read as the schema keyword itself in
      # the compact form, and closed with additionalProperties: false, which
      # the compact form adds itself, so a misspelt value halts the build.
      # name, type and records carry no default: a record set means nothing
      # without them.
      type: object
      additionalProperties: false
      required: [name, type, records]
      properties:
        name:
          type: string
          # Labels of letters, digits, hyphens and underscores, as DNS host
          # names and service labels such as _sip._tcp use, each of 1 to 63
          # characters, the leftmost one * for a wildcard, with or without
          # the trailing dot; 253 characters at most without it.
          pattern: "^(\\*\\.)?([A-Za-z0-9_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?\\.)*[A-Za-z0-9_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?\\.?$"
          maxLength: 254
          description: >
            The record's fully qualified domain name, such as api.example.com,
            inside the zone the Release names; a trailing dot may be written
            or left out. The zone's own name places the record at the zone's
            apex. A leftmost label * makes it a wildcard record, answering for
            every name below it that holds no record of its own. A realization
            halts the build, naming this key, on a name outside the zone or one
            its service does not take for the type.
        type:
          type: string
          description: >
            The record type, in upper case: A, AAAA, CNAME, MX, TXT, SRV, CAA,
            NS or PTR. A realization writes a type its service takes and halts
            the build, naming the type, on any other. ALIAS halts on every
            realization, since an alias record is not offered.
        ttl:
          type: integer
          min: 0
          max: 2147483647
          default: 300
          description: >
            Seconds a resolver may cache the record set's answers before
            asking again, 300 unless set. A realization halts the build,
            naming this key, on a number its service does not take.
        records:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: >
            The record set's data, one entry for each record, written as a DNS
            zone file writes it after the type: an IPv4 address for A, such as
            192.0.2.10; an IPv6 address for AAAA; a domain name for CNAME, NS
            and PTR, and one entry alone for CNAME; the preference and the mail
            server for MX, such as 10 mail.example.com; the priority, weight,
            port and target for SRV, such as 10 5 5060 sip.example.com; and the
            flags, tag and value for CAA, such as 0 issue letsencrypt.org, the
            value in double quotes or not. A TXT entry is the text itself,
            without the quotation marks a zone file writes around it, and a
            realization divides a long text into strings of the length its
            service takes. A domain name in an entry may end in a dot or not.
            A realization halts the build, naming this key, on an entry it
            cannot read in its type's form or its service refuses.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: >
          Provider-specific overrides. Accepts any nested structure. The DNS
          zone the record is written into is the operator's and is named
          here, under the key and in the form each Recipe reads, each
          provider's own spelling; every Recipe halts the build without it.
          Each Recipe documents which keys it reads and halts the build on any
          other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The record's fully qualified domain name, without a trailing dot:
          the name a client resolves to reach what the records point at. A
          realization publishes a pointer string the provisioning tool
          resolves to the name its DNS service reports for the record once
          the record exists, so a consumer reads this rather than repeating
          values.name.
