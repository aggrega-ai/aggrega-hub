apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/network/cloudfront
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon CloudFront is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The origin's behaviour follows the Amazon CloudFront Developer Guide:
  # "Origin settings" (an origin's domain name is a publicly resolvable DNS
  # name; over HTTPS one of the names in the origin's certificate must match
  # it, else CloudFront answers 502 Bad Gateway) and "Use managed origin
  # request policies" (AllViewerExceptHostHeader forwards every viewer
  # header but Host, every cookie and every query string, and CloudFront
  # sends the origin's domain name as Host).
  description: >
    One Amazon CloudFront distribution: AWS's managed content delivery
    network, taking HTTP and HTTPS requests at its edge locations under a
    domain name the service gives it and forwarding each to one origin. A
    consumer reads the distribution's host name and its https:// address.

    The origin is the component wired to the upstream socket, a server or a
    managed resource, and the DNS name it publishes as host becomes the
    origin's domain name. CloudFront connects to it over HTTPS, on the port
    it publishes or else 443, sends that name as the Host header and answers
    502 where the origin's certificate does not carry it; a VPC origin the
    Release names sets its own protocol and port. The socket takes exactly
    one connection, and a target publishing no host halts the build. The
    distribution redirects HTTP to HTTPS, forwards every method, cookie,
    query string and header but Host, and caches nothing unless the Release
    names a cache policy. A custom domain is the operator's DNS name under
    infra.overrides.host, given with its AWS Certificate Manager certificate
    in us-east-1; the DNS record pointing it at the distribution stays the
    operator's.

    infra.waf_policy_id names the operator's AWS WAF web ACL, which then
    inspects every request the distribution takes; unset, none does. Reach
    for it where clients across regions reach one HTTPS service through
    AWS's edge. CloudFront keeps no data but cached copies, so no backup is
    configured. Each Recipe's description says which keys it honours and
    which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: network
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The origin CloudFront forwards every request to. Each Recipe reads the
    # host the connection's target publishes and writes it as the domain name
    # of the distribution's one origin, and the port the target publishes, or
    # 443 where it publishes none, as the port CloudFront connects to over
    # HTTPS, so a target that publishes no host gives CloudFront nowhere to
    # forward and halts the build. The selector admits any component labelled
    # type server or resource, the kinds that can publish a host; a stateful
    # server, a worker or a task is refused before anything renders, and a
    # server or a resource publishing no host halts in the Recipe. No inject
    # block is authored on the connection, since the Recipe reads it itself.
    # Exactly one connection: the compiler refuses none, as the socket is
    # required, and the one_upstream assertion below refuses a second, since
    # an origin group failing over between origins needs status codes to
    # fail over on, which no key here names.
    upstream:
      selector: "component.aggrega.ai/type in (server, resource)"
      required: true
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      waf_policy_id:
        type: string
        description: >
          The ARN of the operator's AWS WAF web ACL, created with the scope
          CLOUDFRONT in US East (N. Virginia), such as
          arn:aws:wafv2:us-east-1:<account>:global/webacl/<name>/<id>,
          associated with the distribution, so it inspects every request the
          distribution takes. The web ACL and its rules are the operator's,
          created apart from the Release, and no realization creates or
          changes one. Unset, no web ACL applies.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The distribution's host name, as the service reports it, such as
          d111111abcdef8.cloudfront.net, a name CloudFront generates under
          cloudfront.net, or the operator's DNS name where the Release gives
          the distribution a custom domain. A realization publishes the
          service's name as a pointer string the provisioning tool resolves
          once the distribution exists, so a consumer reads this rather than
          deriving one.
      endpoint:
        type: string
        required: true
        description: >
          https:// followed by host: the address a client sends its requests
          to, whatever their path, which CloudFront forwards to the origin
          with that path. It carries no credential.

  assertions:
    # The upstream socket holds one connection; the compiler refuses none,
    # since the socket is required.
    one_upstream: >-
      {{- $up := optional .uses "upstream" dict -}}
      {{- if gt (len $up) 1 -}}
      {{- fail (printf "the upstream socket of %q holds %d connections, and Amazon CloudFront forwards to one origin here, since an origin group failing over between origins needs the status codes to fail over on, which this Component does not take: keep one connection under upstream in the Aggregate" .metadata.instance_id (len $up)) -}}
      {{- end -}}
    # The web ACL is named by the ARN of an AWS WAF web ACL. CloudFront takes
    # a web ACL created with the scope CLOUDFRONT, which AWS WAF creates in
    # US East (N. Virginia) alone (the AWS WAF API Reference's CreateWebACL:
    # "To work with CloudFront, you must also specify the Region US East
    # (N. Virginia)"), and such a web ACL's ARN reads global/webacl, as the
    # CloudFront API Reference's DistributionConfig example shows. A web ACL
    # of the REGIONAL scope, or in another Region, protects regional
    # resources and is refused here by name. The identifier of an AWS WAF
    # Classic web ACL, which CloudFront also takes, is refused with it: AWS
    # WAF Classic is going through a planned end of life (the AWS WAF
    # Developer Guide's "AWS WAF Classic").
    waf_policy_id_shape: >-
      {{- if hasKey .infra "waf_policy_id" -}}
      {{- $w := .infra.waf_policy_id -}}
      {{- $acl := and (typeIs "string" $w) (regexMatch `^arn:aws[a-z-]*:wafv2:[a-z0-9-]+:[0-9]{12}:(global|regional)/webacl/[^/\s]+/[^/\s]+$` $w) -}}
      {{- if not $acl -}}
      {{- fail (printf "infra.waf_policy_id is %s, and it names the operator's AWS WAF web ACL by its ARN, arn:aws:wafv2:us-east-1:<account>:global/webacl/<name>/<id>: set it in the Release to such an ARN, or remove it for no web ACL" (toJson $w)) -}}
      {{- end -}}
      {{- if not (regexMatch `^arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/` $w) -}}
      {{- fail (printf "infra.waf_policy_id is %s, and Amazon CloudFront takes a web ACL created with the scope CLOUDFRONT in US East (N. Virginia), whose ARN reads arn:aws:wafv2:us-east-1:<account>:global/webacl/<name>/<id>; a web ACL of the REGIONAL scope protects regional resources alone: set it in the Release to the ARN of a CLOUDFRONT web ACL" (toJson $w)) -}}
      {{- end -}}
      {{- end -}}
