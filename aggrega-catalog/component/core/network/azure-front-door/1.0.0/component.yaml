apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/network/azure-front-door
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Front Door is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Front Door: Microsoft's managed entry point at the edge of its
    global network, taking HTTP and HTTPS requests at one endpoint under the
    service's own domain and forwarding each to one origin. A consumer reads
    the endpoint's host name and its https:// address.

    The origin is the component wired to the upstream socket, a server or a
    managed resource, and the host it publishes becomes the origin's host
    name. Front Door forwards over HTTPS to port 443 of that host, sends the
    name as the Host header and refuses an origin whose certificate, from a
    trusted authority, does not carry it. The socket takes exactly one
    connection, and a target publishing no host halts the build. The
    endpoint serves HTTPS on its own name with no certificate of the
    operator's, redirects HTTP to HTTPS and caches nothing. Custom domains
    are not offered, and Front Door refuses a request naming any other host.

    infra.waf_policy_id names the operator's Front Door web application
    firewall policy, which then inspects every request the endpoint takes;
    unset, none does. Reach for it where clients across regions reach one
    HTTPS service through an address at Microsoft's edge. Front Door keeps
    no data of its own, so no backup is configured. Each Recipe's
    description says which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: network
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The origin Front Door forwards every request to. Each Recipe reads the
    # host the connection's target publishes and writes it as the host name
    # of the profile's one origin, so a target that publishes no host gives
    # Front Door nowhere to forward and halts the build. The selector admits
    # a server and a managed resource, the two kinds of component that serve
    # requests at an address; a stateful server, a worker or a task is
    # refused before anything renders. No inject block is authored on the
    # connection, since the Recipe reads it itself. Exactly one connection:
    # the compiler refuses none, as the socket is required, and the
    # one_upstream assertion below refuses a second, since an origin group
    # balancing several origins needs health probes, a path no key here
    # names.
    upstream:
      selector: "component.aggrega.ai/type in (server, resource)"
      required: true
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      waf_policy_id:
        type: string
        description: >
          The resource ID of the operator's Azure Front Door web application
          firewall policy, such as
          /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/frontDoorWebApplicationFirewallPolicies/<policy>,
          associated with the endpoint for every path, so it inspects every
          request the endpoint takes. The policy and its rules are the
          operator's, created apart from the Release, and no realization
          creates or changes one. Unset, no policy applies.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The endpoint's host name, as the service reports it, such as
          <endpoint>-<hash>.z01.azurefd.net, the endpoint's name followed by a
          hash Front Door generates. A realization publishes a pointer string
          the provisioning tool resolves once the endpoint exists, so a
          consumer reads this rather than deriving one, or the name the
          Release sets in infra.overrides.host instead.
      endpoint:
        type: string
        description: >
          https:// followed by host: the address a client sends its requests
          to. It carries no credential.

  assertions:
    # The upstream socket holds one connection; the compiler refuses none,
    # since the socket is required.
    one_upstream: >-
      {{- $up := optional .uses "upstream" dict -}}
      {{- if gt (len $up) 1 -}}
      {{- fail (printf "the upstream socket of %q holds %d connections, and Azure Front Door forwards to one origin here, since an origin group balancing several origins needs health probes on a path this Component does not take: keep one connection under upstream in the Aggregate" .metadata.instance_id (len $up)) -}}
      {{- end -}}
    # The policy is named by its resource ID, which Azure Resource Manager
    # reads without regard to case.
    waf_policy_id_shape: >-
      {{- if hasKey .infra "waf_policy_id" -}}
      {{- $w := .infra.waf_policy_id -}}
      {{- $ok := typeIs "string" $w -}}
      {{- if $ok }}{{ $ok = regexMatch `(?i)^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.network/frontdoorwebapplicationfirewallpolicies/[^/]+$` $w }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.waf_policy_id is %v, and it names an Azure Front Door web application firewall policy by its resource ID, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/frontDoorWebApplicationFirewallPolicies/<policy>: set it in the Release to such an ID, or remove it for no policy" $w) -}}
      {{- end -}}
      {{- end -}}
