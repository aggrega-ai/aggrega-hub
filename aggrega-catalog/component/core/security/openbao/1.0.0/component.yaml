apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/openbao
  version: 1.0.0
  license: MPL-2.0
  description: >
    An OpenBao secrets-management server. OpenBao stores, generates, and
    controls access to tokens, passwords, certificates, and other secrets
    behind an authenticated HTTP API, and encrypts data at rest on a durable
    data volume — so it renders as a self-hosted, stateful running server, not
    a managed-cloud resource. Its operational type is therefore
    `stateful-server`: the deployment runs and owns the OpenBao process backed
    by a persistent volume. This component ships a single standalone server that
    keeps its state in the built-in file storage backend; highly-available,
    multi-node topologies are a future refinement not modelled here. OpenBao is
    initialized and unsealed at runtime inside the cluster — its root token and
    unseal keys are produced by the running server after it starts — so the
    component declares no credential slot and no secret is materialized at
    render time. Realized on Kubernetes through its Helm Recipe; it has no
    standalone local-container form, so no Compose Recipe is provided. Exports
    its API endpoint host and port to consumers via the uses topology. OpenBao
    is distributed under the MPL-2.0 license.

    With `values.metrics_enabled` true the Recipe turns on OpenBao's Prometheus
    telemetry and publishes its address as `metrics_endpoint`. A scrape presents
    an OpenBao token, best one whose policy grants read and list on sys/metrics
    and nothing else.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: security
    component.aggrega.ai/upstream-licensing: osi-approved
  annotations:
    # How the server's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. OpenBao answers its metrics only
    # to an OpenBao token, which the scrape presents; it is issued by the
    # running server, and no slot of this component holds it.
    observability.aggrega.ai/metrics-credential: separate-token
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      ui_enabled:
        type: boolean
        default: true
        description: Whether the OpenBao server serves its built-in web UI on the API endpoint. Leave on for interactive administration; set false to expose the HTTP API only.
      # OpenBao's own metrics, in the Prometheus format. The server collects
      # them for Prometheus only when its configuration carries a telemetry
      # stanza, which it does not by default, so the Recipe writes one only
      # while this value is true: the product's own retention of 24 hours, and
      # gauge names left unprefixed by the host name, as OpenBao recommends for
      # Prometheus. They are served at /v1/sys/metrics on the API port, only by
      # an active server and only to a token whose policy grants read and list
      # on sys/metrics; Prometheus asks for the Prometheus format with the
      # format=prometheus parameter, since a query written into the path is
      # escaped. While false nothing is written and the address is
      # unpublished.
      metrics_enabled:
        type: boolean
        default: false
        description: Turns on OpenBao's own metrics, in the Prometheus format, at /v1/sys/metrics on the API port, and publishes their address as `metrics_endpoint`; while false that key is empty. Only an active server serves them, and only to a token whose policy grants read and list on sys/metrics.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      external_base_url:
        type: string
        description: >
          Externally reachable base URL of the secrets API, as assembled at the
          ingress tier — for example https://secrets.example.com. The server
          advertises this as its own API address: the address it hands a client
          to be redirected to, and the one its plugin backends are given as the
          server's own. Omitted, the Recipe advertises the server's pod address,
          which is reachable only from inside the cluster.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 256Mi
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the persistent volume backing OpenBao's file storage backend, where the server keeps its encrypted state.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the secrets API. A
          consumer points its client's address at this name together with
          `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts API requests on. The realization
          serves the project's own default, so a consumer reads this rather
          than hard-coding one.
      protocol:
        type: string
        description: How the published address is spoken to — `http`, the scheme a consumer composes its client address on.
      # The address a Prometheus server scrapes the server's own metrics at,
      # while values.metrics_enabled is true: /v1/sys/metrics on the API port
      # of the Service host names. The path is published without the
      # format=prometheus parameter, which a scraper sends as a parameter of its
      # own.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:8200/v1/sys/metrics`, the
          host being the server's Service name. Empty while
          values.metrics_enabled is false. A scrape asks for the Prometheus
          format with the parameter format=prometheus.
      # Whether a scrape of metrics_endpoint presents a credential: true while
      # values.metrics_enabled is true, since OpenBao answers its metrics only
      # to a token; false while it is false, when no address is published.
      metrics_credential_required:
        type: boolean
        description: >
          Whether a scrape of `metrics_endpoint` must present a credential:
          true while values.metrics_enabled is true, because OpenBao answers its
          metrics only to a token, and false while no address is published.
          Present a token whose policy grants read and list on sys/metrics and
          nothing else, so the scraper reads the metrics and no secret.
