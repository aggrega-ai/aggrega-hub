apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/cert-manager
  version: 1.0.0
  license: Apache-2.0
  description: >
    A cert-manager TLS-certificate lifecycle controller for Kubernetes.
    cert-manager is a cluster-scoped add-on that automates the issuance and
    renewal of X.509 certificates from issuing sources such as ACME (Let's
    Encrypt), a private CA, or Vault. It extends the cluster with its own
    Certificate, Issuer, and ClusterIssuer custom resources; applications
    request certificates by declaring those resources rather than by wiring a
    topology edge, so the component takes no `uses` edge, and what it publishes
    is where Prometheus finds its metrics. The controller reconciles certificate
    requests, a webhook validates and defaults the custom resources, and a CA
    injector wires the webhook's CA bundle into the cluster. cert-manager is
    realized on Kubernetes through a Helm Recipe; it has no standalone
    local-container form, so no Compose Recipe is provided.

    Each of the three serves its own metrics, and their Services do not all
    name the metrics port alike, so the Recipe publishes the pod label selecting
    all three, the name of their metrics port and the path, for a scraper that
    discovers those pods directly.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      install_crds:
        type: boolean
        default: true
        description: Whether this component installs cert-manager's custom resource definitions (Certificate, Issuer, ClusterIssuer, and the ACME resources). Leave on to bring the certificate API into the cluster; set false when the CRDs are managed out of band or already present.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Where Prometheus finds cert-manager's own metrics. The controller, the
      # webhook and the CA injector each serve them at /metrics on a container
      # port named http-metrics, 9402, in plain HTTP with no caller check; that
      # listener serves the metrics and nothing else. Each process has a
      # Service of its own, and the webhook's names that port metrics where the
      # other two name it http-metrics, so no one Service port name reaches
      # them all; their pods share one label and one container port name, so a
      # scraper discovers the pods directly.
      # None of the keys carries a namespace: a scraper reads where the target
      # runs from its own connection.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching the controller, webhook and CA
          injector pods, for a scraper that discovers those pods directly
          rather than scraping one address. Published beside
          `metrics_pod_port` and `metrics_path`.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `http-metrics`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`.
