apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/cloud-armor
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Google Cloud Armor is a
  # hosted service the reader contracts for with Google Cloud, under Google
  # Cloud's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description and the rules below state follows the Compute
  # Engine API reference of securityPolicies (a policy's name, 1 to 63
  # characters matching [a-z]([-a-z0-9]*[a-z0-9])?; its rules[]: "There must
  # always be a default rule which is a rule with priority 2147483647 and
  # match all condition", and with no rules "a default rule with action
  # "allow" will be added"; a rule's action, allow or deny(STATUS) with
  # STATUS 403, 404 or 502, among others; its priority, from 0 to
  # 2147483647; its match, of which "Exactly one field must be specified",
  # versionedExpr SRC_IPS_V1 with config, which "must be specified if
  # versioned_expr is specified and cannot be specified if versioned_expr is
  # not specified", or a CEL expression; "Maximum number of src_ip_ranges
  # allowed is 10"; preview, which leaves the action unenforced), Google
  # Cloud Armor's "Quotas and limits" ("Number of characters in a custom
  # expression", 2048), its "Rules language reference" (inIpRange(x, y),
  # "Returns true if the IP address x is contained within the IP range y")
  # and its "Security policy overview" ("You
  # cannot configure two or more rules with the same priority"; "You can't
  # delete the default rule, but you can modify it"; edge policies filter on
  # origin.asn, origin.ip, origin.region_code and the request's headers,
  # method, path, query and scheme alone; "Only edge security policies can
  # be applied to backend buckets").
  description: >
    One Google Cloud Armor security policy: the rules by which Google's load
    balancing filters the HTTP requests that reach a backend service or a
    backend bucket naming the policy. values declare the rules, each with
    its action, priority and match. A consumer reads security_policy, the
    policy's URL, which a backend service or backend bucket names to be
    filtered by it. Attaching the policy is the backend's side: no backend
    service, backend bucket or load balancer is created.

    A rule allows a request or denies it with the status 403, 404 or 502,
    and matches by one condition: up to 10 source IP ranges, or a Common
    Expression Language expression over the request of up to 2,048
    characters, through which a backend security policy can also apply
    Cloud Armor's preconfigured WAF rules. Rules are evaluated from
    priority 0 upwards, and the first that matches acts; a rule in preview
    logs its action without enforcing it. Every policy holds a default
    rule, at priority 2147483647, matching every source address: rules
    left unset or empty leave the policy that rule alone, allowing every
    request, and rules set include it.

    Rate limiting, redirects, header actions, WAF exclusions, adaptive
    protection, advanced options and reCAPTCHA are not offered. A policy
    holds no data to back up. Each Recipe's description says which policy
    types it creates and which keys it honours and refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # A rule's keys include description, a word this schema itself reads, so
  # each object below lists its keys under properties, where each is the
  # name of a key and nothing else. Each object is closed, so a key spelt
  # otherwise halts the build.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      rules:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            action:
              type: string
              required: true
              enum:
                - allow
                - deny(403)
                - deny(404)
                - deny(502)
              description: >
                What a matching request meets: allow, or deny(403), deny(404)
                or deny(502), denying it with that HTTP status.
            priority:
              type: integer
              required: true
              minimum: 0
              maximum: 2147483647
              description: >
                Where the rule is evaluated: from 0, evaluated first, to
                2147483646, and 2147483647 for the default rule alone. No two
                rules share a priority.
            match:
              type: object
              required: true
              additionalProperties: false
              properties:
                versioned_expr:
                  type: string
                  enum:
                    - SRC_IPS_V1
                  description: >
                    SRC_IPS_V1, matching the source addresses config lists;
                    set with config and without expr.
                config:
                  type: object
                  additionalProperties: false
                  properties:
                    src_ip_ranges:
                      type: array
                      required: true
                      minItems: 1
                      maxItems: 10
                      items:
                        type: string
                        pattern: "^(\\*|[0-9]{1,3}(\\.[0-9]{1,3}){3}(/[0-9]{1,2})?|[0-9a-fA-F:.]*:[0-9a-fA-F:.]*(/[0-9]{1,3})?)$"
                      description: >
                        1 to 10 IPv4 or IPv6 addresses or ranges in CIDR
                        notation, such as 203.0.113.0/24, or *, matching
                        every source address.
                  description: The source addresses SRC_IPS_V1 matches.
                expr:
                  type: object
                  additionalProperties: false
                  properties:
                    expression:
                      type: string
                      required: true
                      minLength: 1
                      description: >
                        A Common Expression Language expression over the
                        request's attributes, of 1 to 2,048 characters, such
                        as origin.region_code == 'AU', a source range test
                        such as inIpRange(origin.ip, '198.51.100.0/24'), or
                        a call of a preconfigured WAF rule set, such as
                        evaluatePreconfiguredWaf('sqli-v33-stable'). Cloud
                        Armor checks it when the policy is applied.
                  description: >
                    An expression the request is matched against; set
                    without versioned_expr and config.
              description: >
                The one condition a request is matched against:
                versioned_expr with config, or expr. A rule matching source
                ranges and other attributes together tests the ranges inside
                its expression, with inIpRange.
            description:
              type: string
              description: >
                What the rule is for, as a reader of the policy sees it.
            preview:
              type: boolean
              description: >
                Whether the rule only logs the action it would take, leaving
                it unenforced; false unless set.
        description: >
          The policy's rules, each with action, priority and match, and
          optionally description and preview. Unset or empty, the policy
          holds the default rule alone, allowing every request, as Cloud
          Armor gives a policy created with no rule; set, the list includes
          the default rule: priority
          2147483647, match versioned_expr SRC_IPS_V1 with src_ip_ranges
          ["*"], and the action every request no other rule matches meets.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      security_policy:
        type: string
        required: true
        description: >
          The policy's URL, the self link Compute Engine gives it, ending in
          projects/<project>/global/securityPolicies/<name>, which a backend
          service names as its security policy, or a backend service or
          backend bucket as its edge security policy, to be filtered by the
          policy. A realization publishes a pointer string the provisioning
          tool resolves once the policy exists.

  # The rules Cloud Armor holds a policy to that the schema above does not
  # state. Each halts the build naming what to change rather than leaving
  # the creation to fail.
  assertions:
    # The policy takes the instance's name, and Compute Engine takes a
    # policy name of 1 to 63 characters matching [a-z]([-a-z0-9]*[a-z0-9])?.
    policy_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $n) -}}
      {{- fail (printf "the security policy takes the component's name, %q, and Compute Engine takes a policy name of 1 to 63 lowercase letters, digits and hyphens, beginning with a letter and not ending with a hyphen: rename the component in the Aggregate" (trunc 80 $n)) -}}
      {{- end -}}
    # A match holds one condition, versioned_expr with config, or expr: the
    # Compute Engine API's SecurityPolicyRuleMatcher, "Exactly one field must
    # be specified", config being set with versioned_expr and never without
    # it.
    rule_match: >-
      {{- range $i, $r := (default list (optional .values "rules" list)) -}}
      {{- $m := default dict (get $r "match") -}}
      {{- $ip := and (hasKey $m "versioned_expr") (hasKey $m "config") -}}
      {{- $ex := hasKey $m "expr" -}}
      {{- if not (or (and $ip (not $ex)) (and $ex (not (hasKey $m "versioned_expr")) (not (hasKey $m "config")))) -}}
      {{- fail (printf "values.rules[%d].match holds %s, and Cloud Armor matches a request by exactly one condition, versioned_expr SRC_IPS_V1 with config.src_ip_ranges or expr.expression: set one of them in the Aggregate, testing source ranges inside an expression with inIpRange(origin.ip, '<range>') where a rule matches other attributes too" $i (trunc 120 (toJson $m))) -}}
      {{- end -}}
      {{- end -}}
    # A custom expression holds at most 2,048 characters (Cloud Armor's
    # "Quotas and limits", "Number of characters in a custom expression").
    rule_expression: >-
      {{- range $i, $r := (default list (optional .values "rules" list)) -}}
      {{- $e := toString (get (default dict (get (default dict (get $r "match")) "expr")) "expression") -}}
      {{- $n := len (regexFindAll "(?s)." $e -1) -}}
      {{- if gt $n 2048 -}}
      {{- fail (printf "values.rules[%d].match.expr.expression is %d characters long, and Cloud Armor takes a custom expression of at most 2,048 characters: shorten it in the Aggregate" $i $n) -}}
      {{- end -}}
      {{- end -}}
    # No two rules share a priority.
    rule_priorities: >-
      {{- $seen := dict -}}
      {{- range $i, $r := (default list (optional .values "rules" list)) -}}
      {{- $p := toString (get $r "priority") -}}
      {{- if hasKey $seen $p -}}
      {{- fail (printf "values.rules[%d].priority is %s, as is values.rules[%s].priority, and Cloud Armor evaluates no two rules at the same priority: give each rule its own in the Aggregate" $i $p (get $seen $p)) -}}
      {{- end -}}
      {{- $_ := set $seen $p (toString $i) -}}
      {{- end -}}
    # A list of rules includes the default rule: priority 2147483647,
    # matching every source address.
    default_rule: >-
      {{- $rules := default list (optional .values "rules" list) -}}
      {{- if gt (len $rules) 0 -}}
      {{- $found := false -}}
      {{- range $r := $rules -}}
      {{- if eq (toString (get $r "priority")) "2147483647" -}}
      {{- $m := default dict (get $r "match") -}}
      {{- $c := default dict (get $m "config") -}}
      {{- if and (eq (toString (get $m "versioned_expr")) "SRC_IPS_V1") (eq (toJson (get $c "src_ip_ranges")) "[\"*\"]") -}}
      {{- $found = true -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if not $found -}}
      {{- fail "values.rules holds no default rule, the rule at priority 2147483647 matching versioned_expr SRC_IPS_V1 with src_ip_ranges [\"*\"], which Cloud Armor keeps in every policy: add it to values.rules in the Aggregate with the action a request no other rule matches meets, or remove values.rules for Cloud Armor's own, which allows every request" -}}
      {{- end -}}
      {{- end -}}
