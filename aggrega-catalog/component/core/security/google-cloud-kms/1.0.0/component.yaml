apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/google-cloud-kms
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Cloud Key Management Service
  # is a hosted service the reader contracts for with Google Cloud, under
  # Google Cloud's terms, which no SPDX identifier names. That is the
  # situation component.aggrega.ai/upstream-licensing records as
  # proprietary. No realization pins an artifact of the service, so the
  # catalog distributes and brokers none, and the standard library's
  # admission test, which reads the artifacts an entity pins, finds nothing
  # to refuse.
  #
  # What the description states follows the Cloud KMS REST reference: a key
  # ring's and a key's ID, unique within its location or ring and of the form
  # [a-zA-Z0-9_-]{1,63} (keyRings.create, cryptoKeys.create); a key's
  # resource name, projects/*/locations/*/keyRings/*/cryptoKeys/*; the
  # CryptoKeyPurpose values; the CryptoKeyVersionAlgorithm values and the
  # purpose each describes; automatic rotation, which keys of purpose
  # ENCRYPT_DECRYPT alone take (CryptoKey's rotationPeriod); and a version's
  # scheduled destruction, 30 days unless set when the key is created
  # (destroyScheduledDuration). It also follows the Cloud KMS documentation:
  # "Cloud KMS locations" (key rings and keys cannot be moved to another
  # location after creation) and the google provider's documentation of
  # google_kms_key_ring and google_kms_crypto_key at v8.11.0 (key rings and
  # keys cannot be deleted from Google Cloud; destroying a key destroys its
  # versions and leaves the key in the project).
  description: >
    One Cloud KMS key ring, named after the component, and the keys the
    Aggregate names in it: Cloud Key Management Service creates each key's
    material, which never leaves it unencrypted, in the location the Release
    chooses. A consumer reads the ring's resource name,
    projects/<project>/locations/<location>/keyRings/<ring>, and names a key
    as that name followed by /cryptoKeys/<key>, the value another Google Cloud
    service takes as its customer-managed key. A component name that is not a
    key ring ID Cloud KMS takes halts the build.

    Every key in the ring has the purpose and algorithm the Aggregate gives, a
    symmetric encryption key unless set: a key encrypts and decrypts, signs,
    decrypts with an asymmetric pair, encrypts in raw AES modes, computes
    MACs, encapsulates keys or wraps AES keys. An algorithm the purpose does
    not take halts the build naming both.

    No IAM binding is set up: a client calls Cloud KMS with its own Google
    identity, which the operator grants a Cloud KMS role on the ring or a key,
    so no credential is published. Cloud KMS keeps a ring and a key in its
    project and location for good: neither is deleted nor moved, and a ring's
    or key's name stays taken. Destroying a key destroys each of its versions
    once they have been scheduled for destruction for a period, 30 days unless
    set when the key is created, and data encrypted under it can then no
    longer be decrypted. KMS keeps no data to back up. Each Recipe's
    description says how the keys rotate, how they are kept from being
    destroyed, and which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # purpose and algorithm carry the values Cloud KMS documents as a key's
  # default purpose and the symmetric algorithm, so a bare component with its
  # key names creates the symmetric encryption keys Cloud KMS creates when no
  # purpose is given, and every realization writes both whatever its tool
  # would default to. No credential slot: a client signs each call with its
  # own Google identity.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      crypto_keys:
        type: array
        required: true
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,63}$"
        description: >
          The names of the keys the ring holds, each 1 to 63 letters, digits,
          underscores and hyphens, unique in the ring, such as
          [orders-data, invoices]: a key's resource name is the ring's
          followed by /cryptoKeys/<name>. Every key takes purpose and
          algorithm. A name stays taken in the ring once its key exists, so
          removing a name from the list destroys that key's versions and
          leaves the name unusable for a new key; each Recipe's description
          says how its tool meets a removed or reordered name.
      purpose:
        type: string
        enum:
          - ENCRYPT_DECRYPT
          - ASYMMETRIC_SIGN
          - ASYMMETRIC_DECRYPT
          - RAW_ENCRYPT_DECRYPT
          - MAC
          - KEY_ENCAPSULATION
          - AES_WRAPPING
        default: ENCRYPT_DECRYPT
        description: >
          What every key in the ring does, ENCRYPT_DECRYPT unless set:
          ENCRYPT_DECRYPT, symmetric encryption, the purpose another Google
          Cloud service's customer-managed key takes; ASYMMETRIC_SIGN,
          signing with an asymmetric key pair; ASYMMETRIC_DECRYPT, decryption
          with an asymmetric key pair; RAW_ENCRYPT_DECRYPT, symmetric
          encryption in a raw AES mode, for interoperability; MAC, message
          authentication codes; KEY_ENCAPSULATION, key encapsulation; and
          AES_WRAPPING, wrapping AES keys. Cloud KMS fixes a key's purpose
          when it creates the key, so changing it on keys that exist means
          new keys under other names.
      algorithm:
        type: string
        enum:
          - GOOGLE_SYMMETRIC_ENCRYPTION
          - EXTERNAL_SYMMETRIC_ENCRYPTION
          - AES_128_GCM
          - AES_256_GCM
          - AES_128_CBC
          - AES_256_CBC
          - AES_128_CTR
          - AES_256_CTR
          - RSA_SIGN_PSS_2048_SHA256
          - RSA_SIGN_PSS_3072_SHA256
          - RSA_SIGN_PSS_4096_SHA256
          - RSA_SIGN_PSS_4096_SHA512
          - RSA_SIGN_PKCS1_2048_SHA256
          - RSA_SIGN_PKCS1_3072_SHA256
          - RSA_SIGN_PKCS1_4096_SHA256
          - RSA_SIGN_PKCS1_4096_SHA512
          - RSA_SIGN_RAW_PKCS1_2048
          - RSA_SIGN_RAW_PKCS1_3072
          - RSA_SIGN_RAW_PKCS1_4096
          - EC_SIGN_P256_SHA256
          - EC_SIGN_P384_SHA384
          - EC_SIGN_SECP256K1_SHA256
          - EC_SIGN_ED25519
          - PQ_SIGN_ML_DSA_44
          - PQ_SIGN_ML_DSA_65
          - PQ_SIGN_ML_DSA_87
          - PQ_SIGN_SLH_DSA_SHA2_128S
          - PQ_SIGN_HASH_SLH_DSA_SHA2_128S_SHA256
          - PQ_SIGN_ML_DSA_44_EXTERNAL_MU
          - PQ_SIGN_ML_DSA_65_EXTERNAL_MU
          - PQ_SIGN_ML_DSA_87_EXTERNAL_MU
          - RSA_DECRYPT_OAEP_2048_SHA256
          - RSA_DECRYPT_OAEP_3072_SHA256
          - RSA_DECRYPT_OAEP_4096_SHA256
          - RSA_DECRYPT_OAEP_4096_SHA512
          - RSA_DECRYPT_OAEP_2048_SHA1
          - RSA_DECRYPT_OAEP_3072_SHA1
          - RSA_DECRYPT_OAEP_4096_SHA1
          - HMAC_SHA1
          - HMAC_SHA224
          - HMAC_SHA256
          - HMAC_SHA384
          - HMAC_SHA512
          - ML_KEM_768
          - ML_KEM_1024
          - KEM_XWING
          - KEM_ECDH_P256
          - KEM_ECDH_P384
          - AES_256_KWP
        default: GOOGLE_SYMMETRIC_ENCRYPTION
        description: >
          The algorithm of each key's versions, GOOGLE_SYMMETRIC_ENCRYPTION
          unless set, one of the CryptoKeyVersionAlgorithm values of the
          Cloud KMS REST reference. Each purpose takes its own:
          ENCRYPT_DECRYPT, GOOGLE_SYMMETRIC_ENCRYPTION, or
          EXTERNAL_SYMMETRIC_ENCRYPTION for a key held in an external key
          manager; RAW_ENCRYPT_DECRYPT, an AES_ GCM, CBC or CTR algorithm;
          ASYMMETRIC_SIGN, an RSA_SIGN_, EC_SIGN_ or PQ_SIGN_ algorithm;
          ASYMMETRIC_DECRYPT, an RSA_DECRYPT_OAEP_ algorithm; MAC, an HMAC_
          algorithm; KEY_ENCAPSULATION, ML_KEM_768, ML_KEM_1024, KEM_XWING,
          KEM_ECDH_P256 or KEM_ECDH_P384; and AES_WRAPPING, AES_256_KWP. Any
          other pairing halts the build, naming both keys. A key's new
          versions take a changed algorithm within its purpose; its existing
          versions keep theirs.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      key_ring:
        type: string
        required: true
        description: >
          The ring's resource name,
          projects/<project>/locations/<location>/keyRings/<ring>. A key's
          resource name is this followed by /cryptoKeys/<key>, one of
          values.crypto_keys: the ID a Cloud KMS call such as Encrypt,
          AsymmetricSign or MacSign names, and the value another Google Cloud
          service's customer-managed key setting takes. A realization
          publishes a pointer string the provisioning tool resolves once the
          ring exists, so a consumer reads this rather than composing one. A
          client calls the Cloud KMS endpoint with it; KMS offers no address
          of the ring's own.

  # The rules Cloud KMS holds the ring and its keys to that the schema above
  # cannot state, since one reads the component's name and the other reads
  # purpose and algorithm together. Each is a rule of the service itself, held here once for
  # every realization, and halts the build naming what to change rather than
  # leaving the creation to fail.
  assertions:
    # The ring takes the component's name, and Cloud KMS takes a key ring ID
    # of 1 to 63 letters, digits, underscores and hyphens
    # (keyRings.create's keyRingId).
    key_ring_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_-]{1,63}$` $n) -}}
      {{- fail (printf "the key ring takes the component's name, %q, and Cloud KMS takes a key ring ID of 1 to 63 letters, digits, underscores and hyphens: rename the component in the Aggregate" (trunc 80 $n)) -}}
      {{- end -}}
    # The algorithms of each purpose, as the CryptoKeyVersionAlgorithm
    # values of the REST reference describe them and the "Key purposes and
    # algorithms" page lists them.
    algorithm_for_purpose: >-
      {{- $purpose := toString .values.purpose -}}
      {{- $alg := toString .values.algorithm -}}
      {{- $ok := false -}}{{- $takes := "" -}}
      {{- if eq $purpose "ENCRYPT_DECRYPT" -}}
      {{- $ok = has $alg (list "GOOGLE_SYMMETRIC_ENCRYPTION" "EXTERNAL_SYMMETRIC_ENCRYPTION") -}}{{- $takes = "GOOGLE_SYMMETRIC_ENCRYPTION, or EXTERNAL_SYMMETRIC_ENCRYPTION for an external key" -}}
      {{- else if eq $purpose "RAW_ENCRYPT_DECRYPT" -}}
      {{- $ok = has $alg (list "AES_128_GCM" "AES_256_GCM" "AES_128_CBC" "AES_256_CBC" "AES_128_CTR" "AES_256_CTR") -}}{{- $takes = "an AES_ GCM, CBC or CTR algorithm" -}}
      {{- else if eq $purpose "ASYMMETRIC_SIGN" -}}
      {{- $ok = or (hasPrefix "RSA_SIGN_" $alg) (hasPrefix "EC_SIGN_" $alg) (hasPrefix "PQ_SIGN_" $alg) -}}{{- $takes = "an RSA_SIGN_, EC_SIGN_ or PQ_SIGN_ algorithm" -}}
      {{- else if eq $purpose "ASYMMETRIC_DECRYPT" -}}
      {{- $ok = hasPrefix "RSA_DECRYPT_OAEP_" $alg -}}{{- $takes = "an RSA_DECRYPT_OAEP_ algorithm" -}}
      {{- else if eq $purpose "MAC" -}}
      {{- $ok = hasPrefix "HMAC_" $alg -}}{{- $takes = "an HMAC_ algorithm" -}}
      {{- else if eq $purpose "KEY_ENCAPSULATION" -}}
      {{- $ok = has $alg (list "ML_KEM_768" "ML_KEM_1024" "KEM_XWING" "KEM_ECDH_P256" "KEM_ECDH_P384") -}}{{- $takes = "ML_KEM_768, ML_KEM_1024, KEM_XWING, KEM_ECDH_P256 or KEM_ECDH_P384" -}}
      {{- else if eq $purpose "AES_WRAPPING" -}}
      {{- $ok = eq $alg "AES_256_KWP" -}}{{- $takes = "AES_256_KWP" -}}
      {{- end -}}
      {{- if not $ok -}}
      {{- fail (printf "values.algorithm is %s while values.purpose is %s, and Cloud KMS gives a key of that purpose %s: set values.algorithm to one in the Aggregate, or choose another values.purpose" $alg $purpose $takes) -}}
      {{- end -}}
