apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/nemo-guardrails
  version: 1.0.0
  license: Apache-2.0
  description: >
    NVIDIA NeMo Guardrails' server as a guard in a model's path: a service
    speaking the OpenAI chat-completions API that checks each request against
    its input rail, forwards what it admits to the upstream model API in
    infra.upstream_endpoint, and returns the upstream's answer, streamed or
    not. A request the rail refuses is answered by the guard itself with an
    ordinary completion, and nothing of it reaches the upstream.

    The rail sends the latest user message to the detector wired on the
    detector socket and refuses the request when the detector reports one of
    values.blocked_labels at or above values.threshold; a detector that cannot
    be reached, or answers with an error, refuses the request too. It judges
    the latest user message alone. Its verdict is a probabilistic classifier's:
    it misses some attacks, refuses some legitimate requests and is known to be
    evadable. Only a flow in its configuration, redefining the product's own,
    keeps a request body from switching the rail off, and that closure has to
    be proved again for any image or flow it was not proved on.

    NVIDIA's NemoGuard models add rails on the content_safety and
    jailbreak_detection sockets; the jailbreak rail admits a request when its
    classifier is unreachable.

    It authenticates no caller, and with no credential attached to its
    upstream_key slot a caller can reach the upstream on a credential of its
    own. The Release supplies the image in infra.image and the catalog names
    none: TrustyAI's published build carries NLTK's punkt tokenizer model,
    whose licence is unresolved upstream, and is published only under a
    floating tag, whose superseded digests stop resolving. Nothing renders
    until the Release sets `infra.image`.
  # Realized on Kubernetes by its Helm Recipe and for local development by its
  # Compose Recipe, each running that image on CPU as a single stateless
  # service.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    # Every Recipe of this component runs the guard as containers the Release
    # itself operates, so a single posture is its identity.
    component.aggrega.ai/hosting: self-hosted
    # The guard is published under the Apache-2.0 licence, which
    # metadata.license names exactly; this label carries the class that licence
    # falls into.
    #
    # The catalog names no image of the guard: the Release supplies one in
    # infra.image, where the comment beside the setting says what the published
    # build carries and why the catalog names none. NVIDIA's own registries ask
    # for an account before they serve an image of the server.
    component.aggrega.ai/upstream-licensing: osi-approved
    # Prompt guard: the guard stands in the traffic path, inspects the chat
    # payload it is routing and refuses a request on its content. classifier
    # names the fidelity: the verdict is a trained text classifier's, reached
    # through the detector wired on its socket, on a threshold supplied in its
    # configuration. The value is added with this component, the first to carry
    # it; pattern-list names a match against configured patterns, which is a
    # different fidelity a Feature can tell apart.
    dataplane.aggrega.ai/prompt-guard: classifier
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The classifier service the guard's rail calls. The selector admits only a
    # component whose role in text detection is the detector, so any other
    # service wired here is refused by name. The selected component's published
    # endpoint and model arrive on the edge and the Recipe writes them into the
    # guard's configuration; no inject block is authored on the edge, because
    # the configuration is the Recipe's to write. The compiler routes the
    # address without checking what answers there, and the wired service must
    # speak the guardrails detector API's content route, which the guard's rail
    # calls. Required: the guard has no check without it.
    #
    # The configuration its Recipes render carries one rail: the Hugging Face
    # classifier rail, which sends the latest user message of each request to
    # the detector wired here and refuses the request when the detector reports
    # one of values.blocked_labels with a probability at or above
    # values.threshold. When the detector cannot be reached, or answers with an
    # error, the request is refused and nothing is forwarded: a plain request is
    # answered with an ordinary completion whose message reports an internal
    # error, and a streamed one with a stream carrying no content. The rail
    # reads only the latest user message: a system message, an earlier turn and
    # a tool result are forwarded unread. It judges no reply of the model, no
    # tool-call argument and no image.
    detector:
      selector: "security.aggrega.ai/text-detection=detector"
      required: true
    # NVIDIA's NemoGuard content-safety model, which the guard's content-safety
    # rail asks whether the latest user message of each request is safe. With
    # nothing wired here the configuration carries no such rail, byte for byte
    # as before the socket existed. The selector admits a model serving the
    # OpenAI API, the API the rail calls it through, and the Recipes then halt
    # the build unless the target is core/ai-model/nemoguard-content-safety:
    # the prompt and the verdict parser they write are NVIDIA's for that model,
    # and another model would answer them in a shape the parser does not read.
    # The selected component's published endpoint and model arrive on the edge
    # and the Recipe writes them into the guard's configuration; no inject block
    # is authored on the edge.
    #
    # The rail sends that message inside NVIDIA's prompt, which lists the
    # model's harm categories, and refuses the request when the model rates it
    # unsafe. It judges the user's message alone, never the model's reply. How
    # the guard answers when the model cannot be reached has not been proved.
    # Optional: one content-safety model at most.
    content_safety:
      selector: "component.aggrega.ai/category=ai-model, model.aggrega.ai/api=openai"
    # NVIDIA's NemoGuard JailbreakDetect, which the guard's jailbreak-detection
    # rail asks whether the latest user message of each request is a jailbreak
    # attempt, refusing the request when it says so. With nothing wired here the
    # configuration carries no such rail. The selector admits a security
    # component, and the Recipes then halt the build unless the target is
    # core/security/nemoguard-jailbreak-detect, whose classify route the rail
    # calls. Its published endpoint arrives on the edge and the Recipe writes it
    # into the guard's configuration.
    #
    # 🔴 This rail fails open, as NVIDIA documents it: when the classifier
    # cannot be reached, times out or answers with an error, the rail lets the
    # request through and reports nothing to the caller, so an outage of the
    # classifier removes this check silently. The classifier rail on the
    # detector socket still refuses on its own detector's failure. Optional: one
    # classifier at most.
    jailbreak_detection:
      selector: "component.aggrega.ai/category=security"
  featuresSchema:
    # Optional and transparent (`required` omitted → optional; inject: [env] so a
    # synthesized Workload may reference it as an env secret). The selector is
    # secret-kind-pinned but family-agnostic, so a referenceable credential
    # fills the slot on helm and an inject-value credential fills it on compose.
    # The value never reaches the guard's configuration body: the Recipes
    # deliver it as an environment variable and the configuration names the
    # variable.
    #
    # The guard presents its own credential to the upstream when one is
    # attached here, and a caller's Authorization header does not travel with a
    # chat request. With no credential attached, the product passes a caller's
    # X-Authorization header to the upstream as its Authorization, so a caller
    # can reach the upstream on a credential of its own; and its model listing
    # passes a caller's Authorization header on to the upstream's.
    upstream_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional credential the guard presents to the upstream model API as a bearer token. Attached, every forwarded request carries it, whatever the caller sends. Unattached, the guard holds no upstream credential, which suits an upstream that asks for none: the product then sends a fixed placeholder in its place, which an upstream requiring a key refuses, or passes a caller's X-Authorization header on as the credential when the caller sends one."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      #
      # A request a rail refuses is answered by the guard itself — an ordinary
      # completion whose message is "I'm sorry, I can't respond to that." — and
      # nothing of it reaches the upstream. The verdict is a probabilistic
      # classifier's, so it misses some attacks — reworded, encoded or respelled
      # ones among them — refuses some legitimate requests, and is known to be
      # evadable; it is one control beside others, not a guarantee.
      threshold:
        type: number
        min: 0
        max: 1
        default: 0.5
        description: >
          Probability at or above which a label the detector reports refuses the
          request. Measured with the detector's default model, which scores most
          texts close to 0 or close to 1: at 0.5 the guard refuses plain attempts
          to override a model's instructions; at 0.001 it also refuses an
          override respelled in leetspeak, which the model scores near 0.008, and
          with it some ordinary requests the model scores low but not near zero.
          At either value it refuses the ordinary requests the model scores close
          to 1, and serves attacks it scores close to 0. Those two numbers hold
          for that model only, and are measured again for any other.
      blocked_labels:
        type: array
        min: 1
        items: { type: string }
        default: [INJECTION]
        description: >
          Labels of the detector's classifier that refuse a request when reported
          at or above the threshold. The default is the label the detector's
          default model gives an attempt to override a model's instructions;
          another model labels by its own vocabulary, which this list follows. It
          may not be empty, because a guard refusing on no label forwards
          everything.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Port the guard listens on and its Service accepts callers on. Most operators should omit this and let the Recipe assign the default (8000), the port the published image listens on unless told otherwise.
      # The guard is a service speaking the OpenAI chat-completions API that
      # checks each request it is sent against the input rails its configuration
      # names, forwards what it admits to the upstream model API named here, and
      # returns the upstream's answer, streamed or not. The caller's messages and
      # model name travel on unchanged.
      upstream_endpoint:
        type: string
        required: true
        description: >
          Base URL of the OpenAI-compatible model API the guard forwards the
          requests it admits to, with its API path, for example
          http://model-server:8000/v1. A deterministic pointer string the guard
          resolves when it forwards; the compiler never contacts it. The request
          is forwarded under the model name the caller asked for.
      # The guard runs its one configuration and no other: a request naming
      # another configuration is refused. The product also lets a request body
      # switch its input rails off, through the options it accepts for a
      # generation. This guard refuses that attempt, applying the check whatever
      # the body says, only because its configuration carries a flow that
      # redefines the product's own input-processing flow without that switch;
      # the closure is proved for the build named below, and has to be proved
      # again for any other image and whenever the flow changes. Each Recipe
      # runs the image as a single stateless service with its configuration
      # mounted as the product's own configuration files.
      #
      # The Release supplies the image, and the catalog names none.
      #
      # The build of the server published for anyone to pull is TrustyAI's,
      # quay.io/trustyai/nemo-guardrails-server: the server under the Apache-2.0
      # licence, on Red Hat's Universal Base Image 9 for Python 3.12, whose own
      # end-user licence agreement covers the base layers. Beside the server it
      # carries NLTK's data package tokenizers/punkt, the pretrained Punkt
      # sentence-tokenizer model, whose licence is unresolved upstream. NLTK's
      # code is Apache-2.0, but the pretrained model carries no explicit licence
      # and the data it was trained on is undocumented; on the NLTK data
      # repository's issue about it, https://github.com/nltk/nltk_data/issues/188,
      # a maintainer wrote on 2025-05-09 that "nobody can or wants to provide a
      # legally binding confirmation", and on 2025-10-23 that a clarification
      # effort was ongoing, with a new file stating the known facts and a pull
      # request intended to separate free packages from non-free ones.
      #
      # The publisher releases each build under the moving tag latest only, and
      # a digest is the only reference form that names one build. The registry
      # stops serving a build once the tag it was published under moves on, so a
      # digest the catalog pinned would stop resolving, and a Release that must
      # keep running one build mirrors the image into a registry it controls and
      # sets this key to the copy.
      #
      # 🔴 The guard these Recipes describe — its single configuration, its
      # refusal of every body toggle and of a caller-named configuration, its
      # refusal when the detector is unreachable, its threshold, benign requests
      # and streaming unchanged — was proved running
      # quay.io/trustyai/nemo-guardrails-server@sha256:bf08994e25d84f03b5182f5505cb8358e99e2d5a8879a64728322fd569b6c327,
      # whose installed library is NeMo Guardrails 0.24.0.dev0. The flow each
      # Recipe's mounted configuration carries in rails.co is pinned to that
      # build: it redefines "process user input", an internal flow of the NeMo
      # Guardrails library, with the one condition that lets a request body
      # switch the input rails off removed, and the closure it gives rests on
      # that internal flow's name and body, which the library can change in any
      # release. So re-prove the closure — every body toggle and a caller-named
      # configuration refused, benign requests and streaming unchanged — at every
      # upgrade of this component, and for every image a Release sets here other
      # than that build.
      image:
        type: string
        required: true
        description: >
          Image the guard runs, supplied by the Release; the catalog names none.
          The Recipes run the published build's own start-up and paths, so the
          image is TrustyAI's NeMo Guardrails server or a copy of it. That build
          carries a data package whose licence is unresolved upstream and is
          tagged only as latest, under which the registry stops serving a build
          once the tag moves on, so a Release that must keep one build mirrors it
          and names the copy here. The guard's refusal of a request-body switch
          was proved on one build, and is proved again for any other image.
      # The guard runs on CPU and needs no model weights of its own — the
      # classifier runs in the detector.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint is the OpenAI-compatible base URL a consumer hands a client
      # library; host, port and protocol expose the raw serving location.
      #
      # The guard authenticates no caller: whatever reaches its address can call
      # it, and in a cluster whose network lets any workload reach any Service, a
      # workload can call the guard directly as readily as through a gateway in
      # front of it.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the guard. Every caller
          reaching this name can send requests through the guard, so it is an
          address for the component routing model traffic through it rather than
          one to publish.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts callers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the OpenAI-compatible API the guard serves, with the host,
          the port and the API path already composed. A consumer hands it to a
          client library as its base URL, and sends chat completions to it.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # The threshold the guard's rail refuses at, published so a component
      # routing model traffic through the guard can tell what the guard will
      # refuse: a gateway's realization of core/prompt-injection-shield reads it
      # and halts the build when it is not the threshold the attachment's
      # sensitivity names.
      threshold:
        type: number
        required: true
        description: >
          values.threshold, the probability at or above which a label the
          detector reports refuses the request.
