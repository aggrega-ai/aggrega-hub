apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/bedrock-guardrails
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Bedrock Guardrails is
  # a hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The guardrail's behaviour follows the Amazon Bedrock User Guide
  # ("Detect and filter harmful content by using Amazon Bedrock Guardrails",
  # "Safeguard tiers for guardrails policies", "Block denied topics to help
  # remove harmful content", "Use contextual grounding check to filter
  # hallucinations in responses", "Remove PII from conversations by using
  # sensitive information filters", "Deploy your guardrail") and the Amazon
  # Bedrock API Reference: CreateGuardrail and the types it takes
  # (GuardrailContentPolicyConfig, GuardrailContentFilterConfig,
  # GuardrailTopicPolicyConfig, GuardrailTopicConfig,
  # GuardrailWordPolicyConfig, GuardrailWordConfig,
  # GuardrailManagedWordsConfig, GuardrailSensitiveInformationPolicyConfig,
  # GuardrailPiiEntityConfig, GuardrailRegexConfig,
  # GuardrailContextualGroundingPolicyConfig,
  # GuardrailContextualGroundingFilterConfig), CreateGuardrailVersion and
  # DeleteGuardrail. Those pages give the names, values, lengths, counts and
  # ranges the rules below hold a guardrail to.
  description: >
    One Amazon Bedrock guardrail: the safeguards Amazon Bedrock applies to a
    prompt before a model reads it and to the model's response before the
    caller does. values declare what it checks: harmful-content filters and
    their strengths, denied topics, blocked words and the managed profanity
    list, personal information and patterns to block or mask, and the scores
    below which a response counts as ungrounded in its source or irrelevant
    to the query; and the messages returned in place of a blocked prompt or
    response. Each policy is optional; the messages are required.

    Each Recipe creates the guardrail, named after the component, and a
    numbered version of it, a snapshot that does not change: a model call or
    ApplyGuardrail names guardrail_id and guardrail_version, and an IAM
    policy names arn. A caller signs each request as the AWS identity it runs
    under, so no credential is published. The guardrail is encrypted with a
    key AWS manages unless the operator names a KMS key.

    Inside each policy, the subset each key describes is offered; the
    per-direction actions, switches and modalities, the safeguard tiers,
    cross-Region inference and Automated Reasoning checks are not, so the
    content filters, denied topics and grounding checks run on the Classic
    tier, which supports English, French and Spanish. A topic definition
    over 200 characters halts the build: Amazon Bedrock takes a longer one
    only on the Standard tier. Any other key halts the build naming it, as
    do a required key left out and a value Amazon Bedrock refuses. A
    guardrail holds no data to back up. Each Recipe's description says when
    a new version is created and which keys it honours and which it refuses
    by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Each policy is an object of the vendor's own keys in snake_case, and its
  # lists' entries are objects whose keys include type, pattern and
  # description: words this schema itself reads, so every object here lists
  # its keys under properties, where each is the name of a key and nothing
  # else.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      blocked_input_messaging:
        type: string
        required: true
        description: >
          The message Amazon Bedrock returns in place of a prompt the
          guardrail blocks: 1 to 500 characters, required.
      blocked_outputs_messaging:
        type: string
        required: true
        description: >
          The message Amazon Bedrock returns in place of a model response the
          guardrail blocks: 1 to 500 characters, required.
      content_policy_config:
        type: object
        properties:
          filters_config:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  description: >
                    The harmful category the filter applies to: SEXUAL,
                    VIOLENCE, HATE, INSULTS, MISCONDUCT or PROMPT_ATTACK.
                input_strength:
                  type: string
                  description: >
                    How strongly the filter applies to prompts: NONE, LOW,
                    MEDIUM or HIGH. The higher the strength, the more
                    content of the category is blocked.
                output_strength:
                  type: string
                  description: >
                    How strongly the filter applies to model responses: NONE,
                    LOW, MEDIUM or HIGH.
            description: The filters, 1 to 6 of them, each with its type, input_strength and output_strength.
        description: >
          The harmful-content filters: filters_config, required. A filter's
          strength in each direction sets the confidence at which Amazon
          Bedrock filters content it classifies in the filter's category:
          LOW filters content classified with HIGH confidence, MEDIUM with
          MEDIUM or HIGH, HIGH with LOW, MEDIUM or HIGH, and NONE filters
          nothing.
      topic_policy_config:
        type: object
        properties:
          topics_config:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  description: >
                    The topic's name, a noun or a phrase: 1 to 100 letters,
                    digits, spaces, hyphens, underscores, exclamation marks,
                    question marks and periods.
                definition:
                  type: string
                  description: >
                    What the topic covers, 1 to 200 characters. Amazon
                    Bedrock takes a longer one, up to 1,000, only on the
                    Standard tier, which this Component does not offer, so a
                    longer one halts the build.
                examples:
                  type: array
                  items:
                    type: string
                  description: >
                    Up to 5 sample prompts or responses that belong to the
                    topic, each 1 to 100 characters.
                type:
                  type: string
                  description: DENY, the one kind of topic Amazon Bedrock takes.
            description: The topics, 1 to 30 of them, each with its name, definition and type, and optionally examples.
        description: >
          The denied topics: topics_config, required. A prompt or a response
          that Amazon Bedrock finds belongs to a topic is blocked.
      word_policy_config:
        type: object
        properties:
          words_config:
            type: array
            items:
              type: object
              properties:
                text:
                  type: string
                  description: A word or phrase to block, 1 to 100 characters, matched whole and regardless of case.
            description: The words and phrases to block, 1 to 10,000 of them, each a text.
          managed_word_lists_config:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  description: PROFANITY, the one list AWS manages.
            description: The word lists AWS manages to block, each a type.
        description: >
          The blocked words: words_config, managed_word_lists_config, or
          both.
      sensitive_information_policy_config:
        type: object
        properties:
          pii_entities_config:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  description: >
                    The kind of personal information, one of the types the
                    Amazon Bedrock API Reference's GuardrailPiiEntityConfig
                    lists, such as EMAIL, PHONE or US_SOCIAL_SECURITY_NUMBER.
                action:
                  type: string
                  description: >
                    BLOCK, to block the prompt or response; ANONYMIZE, to
                    mask the information; or NONE, to only report it.
            description: The personal information to act on, at least one entry, each with its type and action.
          regexes_config:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  description: The pattern's name, 1 to 100 characters.
                pattern:
                  type: string
                  description: >
                    The regular expression, 1 to 500 characters, with no
                    lookaround, which Amazon Bedrock does not support.
                action:
                  type: string
                  description: BLOCK, ANONYMIZE or NONE, as for an entity.
                description:
                  type: string
                  description: What the pattern finds, 1 to 1,000 characters, optional.
            description: The custom patterns, 1 to 30 of them, each with its name, pattern and action, and optionally a description.
        description: >
          The sensitive information filters: pii_entities_config,
          regexes_config, or both.
      contextual_grounding_policy_config:
        type: object
        properties:
          filters_config:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  description: >
                    GROUNDING, whether the response is supported by the
                    source the caller supplies, or RELEVANCE, whether it
                    answers the query.
                threshold:
                  type: number
                  description: >
                    From 0 to 0.99: a response scoring below it is blocked.
                    A threshold of 1 would block every response.
            description: The checks, at least one, each with its type and threshold.
        description: >
          The contextual grounding checks: filters_config, required. Amazon
          Bedrock scores a response against the grounding source and the
          query the caller marks in the request.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other; a CloudFormation Recipe reads each in the property's own spelling, a terraform Recipe in the argument's.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      guardrail_id:
        type: string
        required: true
        description: >
          The guardrail's ID, the lowercase letters and digits Amazon
          Bedrock assigns, which a model call such as Converse or
          InvokeModel, or ApplyGuardrail, names as guardrailIdentifier. A
          realization publishes a pointer string the provisioning tool
          resolves once the guardrail exists.
      guardrail_version:
        type: string
        required: true
        description: >
          The number of the guardrail's version the realization creates,
          such as 1, which a call names as guardrailVersion beside
          guardrail_id. A version is a snapshot of the guardrail's policies
          and messages that does not change; each Recipe's description says
          when it creates a new one.
      arn:
        type: string
        description: >
          The guardrail's ARN,
          arn:<partition>:bedrock:<region>:<account>:guardrail/<id>, which an
          IAM policy granting a consumer use of the guardrail names as its
          resource; it covers every version of the guardrail.

  # The rules Amazon Bedrock holds a guardrail to that the schema above does
  # not state. Each halts the build naming what to change rather than
  # leaving the creation to fail.
  assertions:
    # The guardrail takes the instance's name, and Amazon Bedrock takes a
    # guardrail name of 1 to 50 letters, digits, hyphens and underscores
    # (CreateGuardrail's name).
    guardrail_name: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (and (le (len $n) 50) (regexMatch `^[0-9a-zA-Z_-]+$` $n)) -}}
      {{- fail (printf "the guardrail takes the instance's name, %q, and Amazon Bedrock takes a guardrail name of 1 to 50 letters, digits, hyphens and underscores: rename the instance in the Aggregate" (trunc 64 $n)) -}}
      {{- end -}}
    # Each message 1 to 500 characters (CreateGuardrail's
    # blockedInputMessaging and blockedOutputsMessaging).
    blocked_messaging: >-
      {{- range $k := list "blocked_input_messaging" "blocked_outputs_messaging" -}}
      {{- $m := get $.values $k -}}
      {{- if not (and (typeIs "string" $m) (regexMatch `^(?s).{1,500}$` $m)) -}}
      {{- fail (printf "values.%s, which Amazon Bedrock takes as a message of 1 to 500 characters, is %s: set it so in the Aggregate" $k (trunc 80 (toJson $m))) -}}
      {{- end -}}
      {{- end -}}
    # The subset of each policy the schema above describes, and the rules
    # Amazon Bedrock holds it to. The schema holds each key's type, and an
    # unknown key beside the policies; these rules hold the rest. $lists
    # gives, for each policy, its lists and, for each list, the fewest and
    # most entries it takes (0 where the API Reference sets no bound), the
    # keys an entry takes and the keys an entry requires; $required the lists
    # a policy requires; $forms the form each string key takes, as a regular
    # expression and the words that say it. The counts, the values and the
    # lengths are the API Reference's for each type. A topic definition's 200
    # characters are also the Classic tier's, the Standard tier taking up to
    # 1,000 ("Safeguard tiers for guardrails policies"), and a guardrail
    # that configures no tier uses the Classic tier ("Use contextual
    # grounding check to filter hallucinations in responses"). The
    # threshold's range, from 0 to 0.99, is that page's too, and the
    # lookaround a custom pattern may not hold is the User Guide's ("Remove
    # PII from conversations by using sensitive information filters").
    policies: >-
      {{- $strength := list `^(NONE|LOW|MEDIUM|HIGH)$` "NONE, LOW, MEDIUM or HIGH, spelt so" -}}
      {{- $action := list `^(BLOCK|ANONYMIZE|NONE)$` "BLOCK, ANONYMIZE or NONE, spelt so" -}}
      {{- $lists := dict
        "content_policy_config" (dict "filters_config" (list 1 6 (list "type" "input_strength" "output_strength") (list "type" "input_strength" "output_strength")))
        "topic_policy_config" (dict "topics_config" (list 1 30 (list "name" "definition" "examples" "type") (list "name" "definition" "type")))
        "word_policy_config" (dict "words_config" (list 1 10000 (list "text") (list "text")) "managed_word_lists_config" (list 0 0 (list "type") (list "type")))
        "sensitive_information_policy_config" (dict "pii_entities_config" (list 1 0 (list "type" "action") (list "type" "action")) "regexes_config" (list 1 30 (list "name" "pattern" "action" "description") (list "name" "pattern" "action")))
        "contextual_grounding_policy_config" (dict "filters_config" (list 1 0 (list "type" "threshold") (list "type" "threshold"))) -}}
      {{- $required := dict
        "content_policy_config" (list "filters_config")
        "topic_policy_config" (list "topics_config")
        "word_policy_config" (list)
        "sensitive_information_policy_config" (list)
        "contextual_grounding_policy_config" (list "filters_config") -}}
      {{- $forms := dict
        "content_policy_config.filters_config.type" (list `^(SEXUAL|VIOLENCE|HATE|INSULTS|MISCONDUCT|PROMPT_ATTACK)$` "SEXUAL, VIOLENCE, HATE, INSULTS, MISCONDUCT or PROMPT_ATTACK, spelt so")
        "content_policy_config.filters_config.input_strength" $strength
        "content_policy_config.filters_config.output_strength" $strength
        "topic_policy_config.topics_config.name" (list `^[0-9a-zA-Z_ !?.-]{1,100}$` "a name of 1 to 100 letters, digits, spaces, hyphens, underscores, exclamation marks, question marks and periods")
        "topic_policy_config.topics_config.definition" (list `^(?s).{1,200}$` "a definition of 1 to 200 characters, a longer one taking the Standard tier, which this Component does not offer")
        "topic_policy_config.topics_config.type" (list `^DENY$` "DENY, spelt so")
        "word_policy_config.words_config.text" (list `^(?s).{1,100}$` "a word or phrase of 1 to 100 characters")
        "word_policy_config.managed_word_lists_config.type" (list `^PROFANITY$` "PROFANITY, spelt so")
        "sensitive_information_policy_config.pii_entities_config.type" (list `^(ADDRESS|AGE|AWS_ACCESS_KEY|AWS_SECRET_KEY|CA_HEALTH_NUMBER|CA_SOCIAL_INSURANCE_NUMBER|CREDIT_DEBIT_CARD_CVV|CREDIT_DEBIT_CARD_EXPIRY|CREDIT_DEBIT_CARD_NUMBER|DRIVER_ID|EMAIL|INTERNATIONAL_BANK_ACCOUNT_NUMBER|IP_ADDRESS|LICENSE_PLATE|MAC_ADDRESS|NAME|PASSWORD|PHONE|PIN|SWIFT_CODE|UK_NATIONAL_HEALTH_SERVICE_NUMBER|UK_NATIONAL_INSURANCE_NUMBER|UK_UNIQUE_TAXPAYER_REFERENCE_NUMBER|URL|USERNAME|US_BANK_ACCOUNT_NUMBER|US_BANK_ROUTING_NUMBER|US_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER|US_PASSPORT_NUMBER|US_SOCIAL_SECURITY_NUMBER|VEHICLE_IDENTIFICATION_NUMBER)$` "one of the PII entity types the API Reference's GuardrailPiiEntityConfig lists, spelt so, such as EMAIL or US_SOCIAL_SECURITY_NUMBER")
        "sensitive_information_policy_config.pii_entities_config.action" $action
        "sensitive_information_policy_config.regexes_config.name" (list `^(?s).{1,100}$` "a name of 1 to 100 characters")
        "sensitive_information_policy_config.regexes_config.pattern" (list `^(?s).{1,500}$` "a regular expression of 1 to 500 characters")
        "sensitive_information_policy_config.regexes_config.action" $action
        "sensitive_information_policy_config.regexes_config.description" (list `^(?s).{1,1000}$` "a description of 1 to 1,000 characters")
        "contextual_grounding_policy_config.filters_config.type" (list `^(GROUNDING|RELEVANCE)$` "GROUNDING or RELEVANCE, spelt so") -}}
      {{- range $p, $ls := $lists -}}
      {{- if hasKey $.values $p -}}
      {{- $pv := get $.values $p -}}
      {{- $names := list }}{{ range $l, $_ := $ls }}{{ $names = append $names $l }}{{ end -}}
      {{- range $k, $_ := $pv }}{{ if not (hasKey $ls $k) }}{{ fail (printf "values.%s.%s is set, and this Component takes %s there and no other key: correct its spelling, or remove it from the Aggregate" $p $k (join " and " $names)) }}{{ end }}{{ end -}}
      {{- range $r := get $required $p }}{{ if not (hasKey $pv $r) }}{{ fail (printf "values.%s holds no %s, which Amazon Bedrock requires of it: set it in the Aggregate" $p $r) }}{{ end }}{{ end -}}
      {{- range $l, $spec := $ls -}}
      {{- if hasKey $pv $l -}}
      {{- $items := get $pv $l -}}
      {{- $min := index $spec 0 }}{{ $max := index $spec 1 -}}
      {{- if not (and (kindIs "slice" $items) (ge (len $items) $min) (or (eq $max 0) (le (len $items) $max))) -}}
      {{- fail (printf "values.%s.%s, which Amazon Bedrock takes as a list of %s entries, holds %d: correct it in the Aggregate" $p $l (ternary (printf "at least %d" $min) (printf "%d to %d" $min $max) (eq $max 0)) (len $items)) -}}
      {{- end -}}
      {{- range $i, $it := $items -}}
      {{- $q := printf "values.%s.%s[%d]" $p $l $i -}}
      {{- range $k, $_ := $it }}{{ if not (has $k (index $spec 2)) }}{{ fail (printf "%s.%s is set, and an entry of %s takes %s and no other key: correct its spelling, or remove it from the Aggregate" $q $k $l (join ", " (index $spec 2))) }}{{ end }}{{ end -}}
      {{- range $r := index $spec 3 }}{{ if not (hasKey $it $r) }}{{ fail (printf "%s holds no %s, which Amazon Bedrock requires of an entry of %s: set it in the Aggregate" $q $r $l) }}{{ end }}{{ end -}}
      {{- range $f, $v := $it -}}
      {{- if eq $f "threshold" -}}
      {{- if not (and (or (kindIs "float64" $v) (kindIs "int" $v) (kindIs "int64" $v)) (ge (float64 $v) 0.0) (le (float64 $v) 0.99)) -}}
      {{- fail (printf "%s.threshold, which Amazon Bedrock takes from 0 to 0.99, a threshold of 1 blocking every response, is %s: correct it in the Aggregate" $q (toJson $v)) -}}
      {{- end -}}
      {{- else if eq $f "examples" -}}
      {{- $ok := and (kindIs "slice" $v) (le (len $v) 5) -}}
      {{- if $ok }}{{ range $e := $v }}{{ if not (and (typeIs "string" $e) (regexMatch `^(?s).{1,100}$` $e)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "%s.examples, which Amazon Bedrock takes as up to 5 sample phrases, each of 1 to 100 characters, is %s: correct it in the Aggregate" $q (trunc 120 (toJson $v))) -}}
      {{- end -}}
      {{- else -}}
      {{- $form := get $forms (printf "%s.%s.%s" $p $l $f) -}}
      {{- if not (and (typeIs "string" $v) (regexMatch (index $form 0) $v)) -}}
      {{- fail (printf "%s.%s, which Amazon Bedrock takes as %s, is %s: correct it in the Aggregate" $q $f (index $form 1) (trunc 80 (toJson $v))) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if and (eq $l "regexes_config") (regexMatch `(^|[^\\])(\\\\)*\(\?<?[=!]` (get $it "pattern")) -}}
      {{- fail (printf "%s.pattern holds a lookaround, which Amazon Bedrock does not support in a custom pattern, in %s: rewrite it without (?=, (?!, (?<= or (?<! in the Aggregate" $q (trunc 80 (toJson (get $it "pattern")))) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
