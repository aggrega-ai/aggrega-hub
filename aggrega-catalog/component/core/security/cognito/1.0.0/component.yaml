apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/cognito
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Cognito is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description states follows the Amazon Cognito Developer Guide:
  # "Working with user attributes" (username attributes let a user sign up
  # and sign in with an email address or phone number as the username, and
  # "After you create a user pool, you can't change this setting"), "Adding
  # MFA to a user pool" (required, optional or no MFA; SMS messages, email
  # messages or an authenticator app as the factor), "SMS message settings"
  # (Amazon Cognito sends an SMS message by assuming an IAM role in the
  # account), "Email settings" (the default email configuration sends from
  # no-reply@verificationemail.com and limits the messages it sends each day
  # below what a typical production pool needs) and "Identity provider and
  # relying party endpoints" (the discovery document at
  # https://cognito-idp.<region>.amazonaws.com/<pool ID>/.well-known/openid-configuration,
  # and the original issuer as the current default); and the Amazon Cognito
  # API Reference, CreateUserPoolClient (the authentication flows, the flows
  # a client takes when none is named, ALLOW_USER_AUTH on the Essentials
  # feature plan or higher, OAuth 2.0 features off unless turned on) and
  # AdminCreateUserConfigType (users may sign themselves up unless only an
  # administrator may create them).
  description: >
    One Amazon Cognito user pool, a directory of users in the Region the
    Release deploys to, and one public app client in it through which an
    app signs its users in with the user pools API. A consumer reads the
    pool's ID and ARN, the client's ID, and the URL of the pool's OpenID
    Connect discovery document, from which a token's verifier reads the
    issuer and its signing keys.

    Users sign in with a username they choose, or with the email address or
    phone number username_attributes names. Cognito verifies an email
    address by sending a code where auto_verified_attributes asks, and
    requires, offers or leaves off multi-factor authentication by an
    authenticator app. The client takes the sign-in flows
    explicit_auth_flows names, SRP and token refresh unless set. Anyone
    holding the client's ID can sign up, as Cognito allows unless only
    administrators create users.

    The client has no secret. No OAuth 2.0 flow, domain, managed login,
    identity provider, resource server, Lambda trigger, SMS or Amazon SES
    configuration, IAM role or KMS key is set up, so SMS and email
    messages as a second factor, phone number verification and custom
    authentication are not offered. Cognito fixes username_attributes when
    it creates the pool, so changing them takes a new pool, which starts
    with no users. Deletion protection stays off: removing the pool deletes
    every user in it, and Cognito keeps no backup to configure. Each
    Recipe's description says which keys it honours and which it refuses by
    name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Every realization writes mfa_configuration and explicit_auth_flows,
  # whatever its tool would default to, so a bare component creates the same
  # pool and client on every target. mfa_configuration's default is the one
  # Cognito applies when none is given. explicit_auth_flows' default is the
  # set Cognito gives a client when none is named, less ALLOW_CUSTOM_AUTH,
  # which signs no one in without the Lambda triggers this Component does
  # not set up.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      username_attributes:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - email
            - phone_number
        description: >
          What a user signs up and signs in with in place of a username of
          their own: email, an email address; phone_number, a phone number
          of the form +<country code><number>; or both, either one. Unset,
          each user chooses a username. An email address or phone number
          used this way is unique in the pool and need not be verified.
          Cognito fixes this list when it creates the pool, so changing it
          takes a new pool, which starts with no users; each Recipe's
          description says how its tool meets the change.
      auto_verified_attributes:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - email
        description: >
          The attributes Cognito verifies by sending a code when a user
          signs up or changes them: email, which Cognito sends through its
          default email configuration. Unset, Cognito sends no code, and a
          user who signs up stays unconfirmed until an administrator
          confirms them through the user pools API. Verifying a phone
          number sends an SMS message, which Cognito sends by assuming an
          IAM role in the account that this Component does not take, so
          phone_number is not offered.
      mfa_configuration:
        type: string
        enum:
          - "OFF"
          - "ON"
          - OPTIONAL
        default: "OFF"
        description: >
          Multi-factor authentication, OFF unless set, as Cognito applies it
          when none is given. ON requires every user to set up a second
          factor and present it at each sign-in after their first; OPTIONAL
          lets each user choose to set one up, and the app offers the
          choice. The factor is a time-based one-time password from an
          authenticator app, which the user registers with the user pools
          API. SMS and email messages are not offered as a factor: each
          takes an SMS or Amazon SES configuration this Component does not
          set up.
      explicit_auth_flows:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - ALLOW_USER_SRP_AUTH
            - ALLOW_USER_PASSWORD_AUTH
            - ALLOW_ADMIN_USER_PASSWORD_AUTH
            - ALLOW_USER_AUTH
            - ALLOW_REFRESH_TOKEN_AUTH
        default:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        description: >
          The flows the client signs users in by, ALLOW_USER_SRP_AUTH and
          ALLOW_REFRESH_TOKEN_AUTH unless set: ALLOW_USER_SRP_AUTH, a
          username and password proven by the Secure Remote Password
          protocol, so the password never reaches Cognito;
          ALLOW_USER_PASSWORD_AUTH, the password sent to Cognito in the
          request; ALLOW_ADMIN_USER_PASSWORD_AUTH, the same from a server
          calling with AWS credentials; ALLOW_USER_AUTH, choice-based sign-in,
          which takes the password or SRP and needs the Essentials feature
          plan or higher; and ALLOW_REFRESH_TOKEN_AUTH, which renews a
          session's tokens and signs no one in by itself, so a list naming
          it alone halts the build, naming this key. Custom authentication
          and the token exchange flows take Lambda triggers or settings this
          Component does not set up, and are not offered.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      user_pool_id:
        type: string
        required: true
        description: >
          The pool's ID, its Region, an underscore and a string Cognito
          assigns, such as us-east-1_EXAMPLE, which a call to the user pools
          API names and which ends the issuer a token names. A realization
          publishes a pointer string the provisioning tool resolves once the
          pool exists, so a consumer reads this rather than deriving one.
      client_id:
        type: string
        required: true
        description: >
          The app client's ID, which an app names when it signs a user up or
          in with the user pools API, and which Cognito writes into the
          tokens it issues through the client: an ID token's aud claim and an
          access token's client_id claim, which a verifier checks. It is no
          credential: the client has no secret. A realization publishes a
          pointer string the provisioning tool resolves once the client
          exists.
      oidc_discovery_url:
        type: string
        required: true
        description: >
          The URL of the pool's OpenID Connect discovery document,
          https://cognito-idp.<region>. followed by the domain suffix of the
          Region's partition, such as amazonaws.com, /<user_pool_id>
          and /.well-known/openid-configuration: the original issuer's,
          from which a token's verifier reads the issuer the tokens name and
          the URL of the keys that sign them. A realization publishes a
          pointer string the provisioning tool resolves once the pool exists.
      arn:
        type: string
        required: true
        description: >
          The pool's ARN,
          arn:<partition>:cognito-idp:<region>:<account>:userpool/<user_pool_id>,
          which an IAM policy names as the resource it grants access to, and
          which another AWS service's setting takes where it names a pool by
          ARN. A realization publishes a pointer string the provisioning tool
          resolves once the pool exists.

  # The rule the client is held to that the schema above cannot state, since
  # it reads the list as a whole. Held here once for every realization, it
  # halts the build naming what to change rather than leaving a client that
  # signs no one in.
  assertions:
    # ALLOW_REFRESH_TOKEN_AUTH renews the tokens of a session that another
    # flow began, and this Component offers no OAuth 2.0 flow, so a client
    # whose list names it alone has no way to sign a user in.
    sign_in_flow: >-
      {{- $signIn := false -}}
      {{- range .values.explicit_auth_flows -}}
      {{- if ne (toString .) "ALLOW_REFRESH_TOKEN_AUTH" -}}{{- $signIn = true -}}{{- end -}}
      {{- end -}}
      {{- if not $signIn -}}
      {{- fail "values.explicit_auth_flows names ALLOW_REFRESH_TOKEN_AUTH alone, which renews the tokens of a session another flow began and signs no one in, and the client takes no OAuth 2.0 flow: add a sign-in flow in the Aggregate, ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH or ALLOW_USER_AUTH" -}}
      {{- end -}}
