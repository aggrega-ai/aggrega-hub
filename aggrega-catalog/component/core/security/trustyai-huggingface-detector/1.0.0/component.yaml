apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/trustyai-huggingface-detector
  version: 1.0.0
  license: Apache-2.0
  description: >
    TrustyAI's Hugging Face detector: a service that runs one text classifier
    from the Hugging Face Hub and reports what it detects in the texts a
    caller sends. For each text posted to its content route with a threshold,
    it answers with every label the classifier scores at or above it, never
    the classifier's first label, read as the one for harmless text. It changes
    nothing and forwards nothing: what to do about a detection is the caller's
    decision, and core/security/nemo-guardrails is one such caller.

    The classifier is values.model at values.model_revision. The default,
    protectai/deberta-v3-base-prompt-injection-v2 (Apache-2.0), labels each
    text SAFE or INJECTION, and its own model card states that the project
    which published it is archived and no longer maintained. Another model
    labels and scores differently, so a caller's labels and thresholds follow
    it. The verdict misses some attacks and flags some ordinary requests. The
    weights are fetched where the service runs, never at build time.

    It authenticates no caller and every text reaches it as sent, so it is
    published on an in-cluster address only. Its own metrics, in the Prometheus
    format at /metrics on the same port, are published as `metrics_endpoint`.
    The Release supplies the image in
    infra.image and the catalog names none: TrustyAI's published build carries
    NVIDIA's proprietary CUDA runtime, whose licence agreement limits its use
    to systems with NVIDIA GPUs, and is published only under a floating tag,
    whose superseded digests stop resolving. Nothing renders until the Release
    sets `infra.image`.
  # Realized on Kubernetes by its Helm Recipe and for local development by its
  # Compose Recipe, each running that image on CPU, in about 1.2 GB of memory,
  # as a single stateless service.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    # Every Recipe of this component runs the service as containers the
    # Release itself operates, so a single posture is its identity.
    component.aggrega.ai/hosting: self-hosted
    # The detector is published under the Apache-2.0 licence, which
    # metadata.license names exactly; this label carries the class that licence
    # falls into.
    #
    # The catalog names no image of the detector: the Release supplies one in
    # infra.image, where the comment beside the setting says what the published
    # build carries and why the catalog names none.
    component.aggrega.ai/upstream-licensing: osi-approved
    # Text detection: the service scores the texts a caller sends with the
    # classifier it loaded and reports each label that clears the caller's
    # threshold, over the content route of the guardrails detector API; it
    # changes and forwards nothing. The value names that role, and it is what a
    # consumer's socket selects on to be handed this address. It is added with
    # this component, the first to carry it, because no existing label names
    # this role: text-anonymization names the two roles of a masking pair, whose
    # analyzer reports sensitive spans for an anonymizer to rewrite, and this
    # service reports a classifier's labels for a whole text and belongs to no
    # such pair; the data-path family names what a component in the traffic path
    # does to the traffic it forwards, and this service forwards nothing.
    #
    # A caller posts one or more texts to its content route together with a
    # threshold, and for each text the service answers with every label the
    # classifier gives a probability at or above that threshold, with the
    # probability. The classifier's first label is never reported, on the
    # reading that it is the label for harmless text, as it is for the default
    # model.
    security.aggrega.ai/text-detection: detector
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  featuresSchema:
    # Optional Hub access token for a gated model. When a credential is
    # attached here, the Recipe delivers it to the weights-pull step as an
    # environment variable; when unattached, weights are pulled anonymously,
    # byte-identically to a Recipe with no slot.
    model_pull_token:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional Hugging Face Hub access token for a gated model. When attached, the weights-pull step receives it as an environment variable, and the server itself never does; unattached, weights are pulled anonymously, which the default model allows."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. model and
      # model_revision name the weights; the pull step resolves them where the
      # service runs, and the compiler pipes the strings unresolved.
      #
      # The default is protectai/deberta-v3-base-prompt-injection-v2, published
      # under the Apache-2.0 licence and downloadable without an account: a
      # DeBERTa-v3 model trained to tell attempts to override a model's
      # instructions from ordinary requests, labelling each text SAFE or
      # INJECTION. Its own model card states that the project which published it
      # is archived and no longer maintained. Any sequence-classification model
      # on the Hub can be named instead; each labels differently and scores
      # differently, so the labels and thresholds a caller acts on follow the
      # model named. The verdict is a classifier's: it misses some attacks,
      # reworded, encoded or respelled ones among them, and it flags some
      # ordinary requests.
      model:
        type: string
        default: protectai/deberta-v3-base-prompt-injection-v2
        description: Hugging Face model id of the sequence-classification model the service runs. The default is a prompt-injection classifier labelling each text SAFE or INJECTION; another model labels by its own vocabulary, which a caller's refusal labels must then follow.
      model_revision:
        type: string
        default: 90c9989b1a342275dd0d1a95aad283c04e075671
        description: Revision of values.model to fetch — a commit id, a tag or a branch. The default is the commit of the default model whose scores a caller's thresholds are measured against; set it together with values.model, and main follows the repository's newest revision.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Port the service listens on and its Service accepts callers on. Most operators should omit this and let the Recipe assign the default (8000), the port the published image listens on unless told otherwise.
      # The Release supplies the image, and the catalog names none.
      #
      # The build of the service published for anyone to pull is TrustyAI's,
      # quay.io/trustyai/guardrails-detector-huggingface-runtime: the service
      # under the Apache-2.0 licence, on Red Hat's Universal Base Image 9
      # minimal, whose own end-user licence agreement covers the base layers. It
      # also carries a CUDA build of the model runtime and twelve NVIDIA CUDA
      # runtime packages each declaring a proprietary NVIDIA licence —
      # nvidia-cublas-cu12, nvidia-cudnn-cu12 and ten more. Ten of them ship the
      # CUDA Toolkit's end-user licence agreement, cuDNN ships NVIDIA's licence
      # agreement for its software development kits, and the twelfth ships no
      # licence file. Each agreement grants "a non-exclusive, non-transferable
      # license, without the right to sublicense", and each supplement's License
      # Scope states: "The SDK is licensed for you to develop applications only
      # for use in systems with NVIDIA GPUs." These Recipes request no GPU.
      #
      # The publisher releases each build under the moving tag latest only — its
      # versioned tags are older builds, and the newest of them cannot start on
      # its own default command — and a digest is the only reference form that
      # names one build. The registry stops serving a build once the tag it was
      # published under moves on, so a digest the catalog pinned would stop
      # resolving, and a Release that must keep running one build mirrors the
      # image into a registry it controls and sets this key to the copy.
      #
      # The service these Recipes describe — its content route and health
      # route, its weights-pull step, its scores for the default model and its
      # memory — was proved running
      # quay.io/trustyai/guardrails-detector-huggingface-runtime@sha256:3d052b86f8c857d62a26b9827900bbf922c6e584af8f83ae3c0dd83f17b74f43.
      image:
        type: string
        required: true
        description: >
          Image the service and its weights-pull step run, supplied by the
          Release; the catalog names none. The Recipes run the published build's
          own server command, log configuration and Hugging Face command-line
          tool, so the image is TrustyAI's Hugging Face detector or a copy of it.
          That build carries NVIDIA's proprietary CUDA runtime, whose licence
          agreement limits its use to systems with NVIDIA GPUs, and is tagged
          only as latest, under which the registry stops serving a build once the
          tag moves on, so a Release that must keep one build mirrors it and
          names the copy here.
      # The server runs on CPU here, in about 1.2 GB of memory with the default
      # model loaded; the published build carries a CUDA build of the model
      # runtime, which uses a GPU when the container is given one, and these
      # Recipes request none.
      compute:
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 2Gi
      # The weights are fetched where the service runs, never at build time: a
      # pull step fetches the model's configuration, tokenizer and safetensors
      # weights into this volume before the server starts, and the server reads
      # them from there, about 760 MB for the default model. A gated model needs
      # a Hub access token, which the optional model_pull_token slot delivers to
      # that step alone; the default model needs none.
      model_cache:
        type: object
        description: The volume the pull step writes the weights to and the server reads them from.
        properties:
          size:
            type: string
            default: 2Gi
            description: Upper bound on the volume's size, sized for the default model's weights with room to spare. Honoured on Kubernetes; the compose target creates the volume and honours no size.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol are the shape every server component publishes;
      # endpoint is the base URL a caller posts to, published as its own key so a
      # consumer reads it rather than assembling it; model names the classifier
      # the service loaded.
      #
      # Reachability is a deliberate part of the model. The service
      # authenticates no caller: whatever reaches its address can submit text to
      # it, and every text reaches it as it was sent. It is published on an
      # in-cluster address for the component that calls it, and is not meant to
      # be exposed beyond the cluster.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the detector. Every caller
          reaching this name can submit text, so it is an address for the
          component that calls the service rather than one to publish.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts callers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the detector's HTTP API, with the host and the port already
          composed and no path. A caller posts the texts to check to the content
          route under it.
      model:
        type: string
        required: true
        description: Hugging Face model id of the classifier the service loaded, so a caller can record which model gave a verdict.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # The address a Prometheus server scrapes the service's own metrics at.
      # It serves them in the Prometheus format at /metrics on the port callers
      # reach, always on, and, like every route it serves, asks no credential
      # for them. Every Recipe publishes the address spelled out in full from
      # its own host and port, because a provides entry cannot read another.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:<port>/metrics` on the
          port callers reach. Empty where the component serves none reachable.
