apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/security/sealed-secrets
  version: 1.0.0
  description: >
    A sealed-secrets controller for Kubernetes. sealed-secrets is a
    cluster-scoped add-on that decrypts SealedSecret custom resources into
    native Kubernetes Secrets, using a private key the controller holds in the
    cluster; the matching public key encrypts secret material so it can be
    committed to source control safely. It extends the cluster with its own
    SealedSecret custom resource; applications consume it by declaring
    SealedSecret resources that the controller unseals, rather than by wiring a
    topology edge, so the component takes no `uses` edge and exports nothing to
    consumers. The controller generates its sealing keypair in the cluster at
    runtime. sealed-secrets is realized on Kubernetes through a Helm Recipe; it
    has no standalone local-container form, so no Compose Recipe is provided.
  license: Apache-2.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
