apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/sealed-secrets
  version: 1.0.0
  license: Apache-2.0
  description: >
    A sealed-secrets controller for Kubernetes. sealed-secrets is a
    cluster-scoped add-on that decrypts SealedSecret custom resources into
    native Kubernetes Secrets, using a private key the controller holds in the
    cluster; the matching public key encrypts secret material so it can be
    committed to source control safely. It extends the cluster with its own
    SealedSecret custom resource; applications consume it by declaring
    SealedSecret resources that the controller unseals, rather than by wiring a
    topology edge, so the component takes no `uses` edge. The one address it
    exports is where its own metrics are served: the controller serves them in
    the Prometheus format at /metrics on its metrics port, on by default, and
    its Recipe publishes that address as `metrics_endpoint`. The controller
    generates its sealing keypair in the cluster at
    runtime. sealed-secrets is realized on Kubernetes through a Helm Recipe; it
    has no standalone local-container form, so no Compose Recipe is provided.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      source_version:
        type: string
        description: Source artifact version (Helm chart). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Applications reach the controller through the SealedSecret resources
      # they declare, not through an address, so the one key is the address a
      # Prometheus server scrapes the controller's own metrics at. The
      # controller serves them in the Prometheus format at /metrics on a
      # listener of their own, port 8081, always on and asking no credential,
      # and the chart renders a Service for that port whenever it renders the
      # controller. The Recipe publishes the address spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:8081/metrics` on the
          Service the chart renders for the controller's metrics port. Empty
          where the component serves none reachable.
