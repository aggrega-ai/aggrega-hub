apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/azure-key-vault
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Key Vault is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Key Vault: Microsoft's managed service holding the secrets,
    keys and certificates an application reads at run time. A consumer reads
    the vault's host name and URI and calls the vault through a Key Vault
    client library over HTTPS.

    The vault authorizes reads and writes of its contents with Azure
    role-based access control, so a caller authenticates with Microsoft
    Entra ID as the managed identity it runs under, and no key reaches a
    consumer. The role assignments granting identities access are the
    operator's, and so are the secrets, keys and certificates the vault
    holds, created in it apart from the Release. Azure Resource Manager may
    read the vault's secrets while it deploys a template, so a Key Vault
    reference in a template resolves.

    Reach for it where an application in Azure keeps its credentials out of
    its configuration. Soft delete is on, the service's default for a new
    vault, and once on it stays on, so a deleted vault and its contents stay
    recoverable for a retention period. Microsoft documents no backup of a
    whole vault, only of each secret, key or certificate on demand, so no
    backup is configured, and a core/backup attachment halts, since that
    Feature applies to stateful servers. Each Recipe's description says
    which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values are declared: the vault's secrets, keys and certificates are not
  # part of it. A secret is created in the vault apart from the Release, and a
  # consumer is pointed at it through a credential Feature; on Azure Resource
  # Manager, arm/key-vault-secret takes the secret's resource ID.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The vault's DNS name, the host of the URI the service reports. A
          realization publishes a pointer string the provisioning tool
          resolves once the vault exists, so a consumer reads this rather
          than deriving one, or the DNS name the Release sets in
          infra.overrides.host instead.
      endpoint:
        type: string
        description: >
          The vault's URI, as the service reports it, https:// followed by
          host and /, which a Key Vault client library takes as the vault to
          call. It carries no credential.
