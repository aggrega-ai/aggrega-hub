apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/aws-kms
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: AWS Key Management Service is
  # a hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description states follows the AWS KMS API Reference, CreateKey
  # (the key specs, the key usage each spec takes, ENCRYPT_DECRYPT the usage
  # unless set, and the default key policy when none is given) and
  # CreateAlias (the alias name's form and the reserved alias/aws/ prefix),
  # and the AWS KMS Developer Guide: "Default key policy" (one statement
  # giving the AWS account that owns the key every KMS action, which lets the
  # account's IAM policies grant access and keeps the key manageable),
  # "Rotate AWS KMS keys" (automatic rotation for symmetric encryption keys
  # whose key material KMS generates, off unless enabled, yearly unless
  # another period is set) and "Delete an AWS KMS key" (a waiting period of 7
  # to 30 days, 30 by default, during which the key is unusable; deletion
  # then removes the key and its aliases, and data encrypted under it cannot
  # be decrypted).
  description: >
    One AWS KMS key: a customer managed key AWS Key Management Service
    creates in the Region the Release deploys to, its key material generated
    by KMS, which never leaves KMS unencrypted, and the alias the Aggregate
    names, if any. A consumer reads the key's ID, which a KMS call names,
    and its ARN, which another service's key setting and an IAM policy name.

    The key's spec and usage are the Aggregate's: a symmetric encryption key
    unless set. An HMAC key generates and verifies MACs, an RSA key encrypts
    or signs, an elliptic curve key signs or derives shared secrets, an
    ML-DSA key signs and an ML-KEM key encapsulates. A usage the spec does
    not take, or an alias not of the form KMS takes or under the prefix
    alias/aws/, which AWS reserves, halts the build naming the key.

    Access is the key policy's: the operator's where the Release supplies
    one, else one statement giving the AWS account that owns the key every
    KMS action, so the account's IAM policies grant access, as KMS's default
    key policy does. No grant, replica key, imported key material or custom
    key store is set up. Automatic rotation stays off unless the Release
    turns it on, which a symmetric encryption key alone takes. Removing the
    key schedules its deletion after a waiting period, 30 days unless the
    Release sets 7 to 30; once it ends, data encrypted under the key cannot
    be decrypted. The key holds no credential a consumer presents, and KMS
    keeps no data to back up. Each Recipe's description says which keys it
    honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # key_spec and key_usage carry the defaults KMS applies when CreateKey
  # names neither, so a bare component creates the key KMS creates when no
  # type is given, and every realization writes both whatever its tool
  # would default to. KMS fixes both when it creates the key.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      key_spec:
        type: string
        enum:
          - SYMMETRIC_DEFAULT
          - HMAC_224
          - HMAC_256
          - HMAC_384
          - HMAC_512
          - RSA_2048
          - RSA_3072
          - RSA_4096
          - ECC_NIST_P256
          - ECC_NIST_P384
          - ECC_NIST_P521
          - ECC_NIST_EDWARDS25519
          - ECC_SECG_P256K1
          - ML_DSA_44
          - ML_DSA_65
          - ML_DSA_87
          - ML_KEM_512
          - ML_KEM_768
          - ML_KEM_1024
          - SM2
        default: SYMMETRIC_DEFAULT
        description: >
          The type of key material, one of the key specs KMS lists,
          SYMMETRIC_DEFAULT unless set: a 256-bit AES-GCM key for encryption
          and decryption, a 128-bit SM4 key in the China Regions; HMAC_224 to
          HMAC_512, an HMAC key; RSA_2048 to RSA_4096, an RSA key pair;
          ECC_NIST_P256, ECC_NIST_P384, ECC_NIST_P521, ECC_NIST_EDWARDS25519
          and ECC_SECG_P256K1, an elliptic curve key pair; ML_DSA_44 to
          ML_DSA_87, an ML-DSA key pair; ML_KEM_512 to ML_KEM_1024, an ML-KEM
          key pair, outside the China Regions; SM2, an SM2 key pair, in the
          China Regions alone. The AWS services that encrypt their data under
          a KMS key take a symmetric encryption key. KMS fixes the spec when
          it creates the key, and a realization halts the build, naming this
          key, on a spec its tool does not take.
      key_usage:
        type: string
        enum:
          - ENCRYPT_DECRYPT
          - SIGN_VERIFY
          - GENERATE_VERIFY_MAC
          - KEY_AGREEMENT
          - ENCAPSULATE_DECAPSULATE
        default: ENCRYPT_DECRYPT
        description: >
          What the key is used for, ENCRYPT_DECRYPT unless set, as KMS
          applies it when no usage is given. Each key spec takes its own:
          SYMMETRIC_DEFAULT, ENCRYPT_DECRYPT; an HMAC spec,
          GENERATE_VERIFY_MAC, which KMS requires written; an RSA spec,
          ENCRYPT_DECRYPT or SIGN_VERIFY; ECC_NIST_P256, ECC_NIST_P384 and
          ECC_NIST_P521, SIGN_VERIFY or KEY_AGREEMENT; ECC_NIST_EDWARDS25519,
          ECC_SECG_P256K1 and an ML-DSA spec, SIGN_VERIFY; an ML-KEM spec,
          ENCAPSULATE_DECAPSULATE; SM2, ENCRYPT_DECRYPT, SIGN_VERIFY or
          KEY_AGREEMENT. Any other pairing halts the build, naming both keys.
          KMS fixes the usage when it creates the key.
      alias_name:
        type: string
        pattern: "^alias/[a-zA-Z0-9/_-]+$"
        maxLength: 256
        description: >
          The key's alias, alias/ followed by letters, digits, slashes,
          underscores and hyphens, 256 characters at most, such as
          alias/orders-data: a name a KMS call, the KMS console and another
          service's key setting may give in place of the key's ID. Unset, the
          key has no alias. A name of another form, or one under alias/aws/,
          the prefix AWS reserves for the keys it manages for its services,
          halts the build, naming this key. An alias is unique in its account
          and Region, which KMS checks when it creates the alias. Changing it
          deletes the old alias and creates the new one; the key stays.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      key_id:
        type: string
        required: true
        description: >
          The key's ID, a UUID KMS assigns when it creates the key, which a
          KMS call such as Encrypt, Decrypt, Sign or GenerateMac names. A
          realization publishes a pointer string the provisioning tool
          resolves once the key exists, so a consumer reads this rather than
          deriving one. A client calls the KMS endpoint of the key's Region
          with it; KMS offers no address of the key's own.
      arn:
        type: string
        required: true
        description: >
          The key's ARN, arn:<partition>:kms:<region>:<account>:key/<key_id>,
          which another AWS service's KMS key setting takes, and an IAM policy
          names as the resource it grants access to. A realization publishes a
          pointer string the provisioning tool resolves once the key exists.

  # The rules AWS KMS holds a key and its alias to that the schema above
  # cannot state, since one reads two values together and the other excludes
  # a prefix the alias pattern admits. Each is a rule of the service itself,
  # held here once for every realization, and halts the build naming what to
  # change rather than leaving the creation to fail.
  assertions:
    # The key usages the CreateKey reference gives for each key spec. An HMAC
    # key takes GENERATE_VERIFY_MAC alone, and KMS refuses an HMAC key created
    # with the usage it applies when none is given, so an HMAC key_spec with
    # key_usage unset halts here too.
    key_usage_for_key_spec: >-
      {{- $spec := toString .values.key_spec -}}
      {{- $usage := toString .values.key_usage -}}
      {{- $takes := list "ENCRYPT_DECRYPT" -}}
      {{- if hasPrefix "HMAC_" $spec -}}{{- $takes = list "GENERATE_VERIFY_MAC" -}}
      {{- else if hasPrefix "RSA_" $spec -}}{{- $takes = list "ENCRYPT_DECRYPT" "SIGN_VERIFY" -}}
      {{- else if has $spec (list "ECC_NIST_P256" "ECC_NIST_P384" "ECC_NIST_P521") -}}{{- $takes = list "SIGN_VERIFY" "KEY_AGREEMENT" -}}
      {{- else if or (eq $spec "ECC_NIST_EDWARDS25519") (eq $spec "ECC_SECG_P256K1") (hasPrefix "ML_DSA_" $spec) -}}{{- $takes = list "SIGN_VERIFY" -}}
      {{- else if hasPrefix "ML_KEM_" $spec -}}{{- $takes = list "ENCAPSULATE_DECAPSULATE" -}}
      {{- else if eq $spec "SM2" -}}{{- $takes = list "ENCRYPT_DECRYPT" "SIGN_VERIFY" "KEY_AGREEMENT" -}}
      {{- end -}}
      {{- if not (has $usage $takes) -}}
      {{- fail (printf "values.key_usage is %s while values.key_spec is %s, and AWS KMS gives a key of that spec the key usage %s alone: set values.key_usage to it in the Aggregate, or choose another values.key_spec" $usage $spec (join " or " $takes)) -}}
      {{- end -}}
    # The CreateAlias reference: "The alias name cannot begin with
    # alias/aws/. The alias/aws/ prefix is reserved for AWS managed keys."
    alias_name_not_reserved: >-
      {{- $a := toString (optional .values "alias_name" "") -}}
      {{- if hasPrefix "alias/aws/" $a -}}
      {{- fail (printf "values.alias_name is %s, and AWS KMS reserves the prefix alias/aws/ for the keys AWS manages for its services: choose an alias outside it in the Aggregate" $a) -}}
      {{- end -}}
