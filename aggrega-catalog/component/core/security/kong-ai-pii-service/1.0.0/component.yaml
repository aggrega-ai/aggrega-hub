apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/kong-ai-pii-service
  version: 1.0.0
  description: >
    Kong's AI PII service: a service that finds personal and other sensitive
    data in a text and rewrites it in the same call. A caller posts a text, the
    categories to look for — person names and places, phone numbers, email
    addresses, card and bank numbers, national identifiers, credentials and the
    like — any regular expressions of its own, and how to rewrite what it
    finds, and the service answers with the rewritten text and what it found.

    The image is supplied by the operator: Kong distributes the service's
    images under its own terms, so the Release names in infra.image one it is
    entitled to pull, and the catalog names none. Nothing renders until
    the Release sets `infra.image`. Each image carries the
    language model for the language its tag names, or all of them; a model the
    service is configured for that its image does not carry is fetched from the
    spaCy models repository when the service starts, by the running service and
    never by the build.

    core/gateway/kong-enterprise takes it on its pii_sanitizer socket, for
    Kong's AI PII Sanitizer. Recognition is automated, so it misses some
    sensitive data and marks some text that is not sensitive. Kong's sanitizer
    presents no credential to it and every text reaches it unmasked, so it is
    published on an in-cluster address for the component that calls it and is
    not meant to be exposed beyond the cluster.

    Realized on Kubernetes by its Helm Recipe, running the image the Release
    names as a single stateless service over plain HTTP. Exports its host,
    port and protocol to consumers.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    # Every Recipe of this component runs the service as containers the
    # Release itself operates, so a single posture is its identity.
    component.aggrega.ai/hosting: self-hosted
    # The images are distributed under Kong's own terms, so no single licence
    # identifier applies and metadata.license is left absent.
    component.aggrega.ai/upstream-licensing: proprietary
    # Text anonymization: this service finds the sensitive spans in the text it
    # is sent and rewrites them itself, answering with the rewritten text, over
    # the HTTP API its sanitize route serves — the two halves the analyzer and
    # anonymizer values name, done by one service in one call. The value names
    # that role, which is what a consumer's socket selects on to be handed this
    # address.
    #
    # It finds a span with the language model its image carries and with the
    # regular expressions a caller sends, and rewrites each span with a
    # numbered placeholder or with a made-up value of the same kind, as the
    # caller asks.
    security.aggrega.ai/text-anonymization: sanitizer
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # No default and no version knob: access to the service's images is
      # governed by Kong's terms rather than by the catalog, so the catalog
      # names none and the Release names the one it runs.
      image:
        type: string
        required: true
        description: Full reference of Kong's AI PII service image, tag included, as in kong/ai-pii-service:v0.2.2-en — the image the operator is entitled to pull. The tag names the language whose model the image carries, or all of them. There is no default, because access to the images is governed by Kong's terms rather than by the catalog, and the catalog therefore names none; a build that omits it halts.
      image_pull_secret:
        type: string
        description: Name of a pre-created image-pull Secret granting access to the registry the image is pulled from. Set this when that registry needs credentials; omit it when the cluster can pull the image without them.
      # Kong asks for at least 600MB of free memory for the one language model
      # the service loads by default; a service configured for further models
      # needs more. Kong states nothing about the processor it needs.
      compute:
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 1Gi
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol are the address Kong's sanitizer is configured
      # with, as its host, port and scheme.
      #
      # Reachability is a deliberate part of the model. Kong's sanitizer
      # presents no credential to the service: whatever can reach its address
      # can submit text to it, and every text it is sent reaches it unmasked.
      # So the address is an in-cluster one for the component that calls it,
      # and is not meant to be exposed beyond the cluster.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the PII service. Every
          caller reaching this name can submit text, so it is an address for the
          component that calls the service rather than one to publish.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts callers on, the port the service
          listens on over plain HTTP. A consumer reads it rather than assuming a
          default.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, which a consumer hands to the client it calls the service with.
