apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/model-armor
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Model Armor is a hosted
  # service the reader contracts for with Google Cloud, under Google Cloud's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description and the schema below state follows the Model Armor
  # REST reference of projects.locations.templates (a template's
  # FilterConfig: raiSettings with its required raiFilters, each a
  # filterType of SEXUALLY_EXPLICIT, HATE_SPEECH, HARASSMENT or DANGEROUS
  # and a confidenceLevel of LOW_AND_ABOVE, "Highest chance of a false
  # positive", MEDIUM_AND_ABOVE or HIGH, "Low chance of false positives";
  # sdpSettings.basicConfig, piAndJailbreakFilterSettings and
  # maliciousUriFilterSettings, each with a filterEnforcement of ENABLED or
  # DISABLED, an unspecified one "Same as Disabled"; the jailbreak filter's
  # confidenceLevel, applied while it is enabled), "Create and manage
  # templates" (a template ID of letters, digits, underscores and hyphens,
  # at most 63 characters, not beginning with a hyphen; a template is
  # managed at a regional or multi-regional endpoint, and its location
  # cannot change), "Sanitize prompts and responses" ("To sanitize prompts
  # and responses, you must use regional endpoints",
  # https://modelarmor.LOCATION.rep.googleapis.com, LOCATION being the
  # template's) and "Model Armor locations" (regions, and the multi-regions
  # eu and us).
  description: >
    One Model Armor template: the filters Model Armor screens an AI
    model's prompts and responses with when a caller asks it to sanitize
    them. values declare the filters: Responsible AI filters for sexually
    explicit content, hate speech, harassment and dangerous content, each
    at a confidence level; Sensitive Data Protection's basic inspection;
    prompt injection and jailbreak detection, at a confidence level; and
    malicious URL detection. A filter left out screens nothing.

    A consumer reads endpoint, the Model Armor endpoint of the template's
    location, https://modelarmor.<location>.rep.googleapis.com, and
    template, the template's resource name,
    projects/<project>/locations/<location>/templates/<template ID>, which
    a sanitize call names. A caller signs each request as the Google
    identity it runs under, so no credential is published.

    Custom rule sets, Sensitive Data Protection templates, and the
    template's metadata, which sets enforcement, custom messages and
    logging, are not offered, so Model Armor's defaults for them hold. No
    floor setting is created. A template holds no data to back up. Each
    Recipe's description says which keys it honours and refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # filter_config nests the vendor's own settings in snake_case, each object
  # listing its keys under properties. Each object is closed, so a key spelt
  # otherwise halts the build.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      filter_config:
        type: object
        required: true
        additionalProperties: false
        properties:
          rai_settings:
            type: object
            additionalProperties: false
            properties:
              rai_filters:
                type: array
                required: true
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    filter_type:
                      type: string
                      required: true
                      enum:
                        - SEXUALLY_EXPLICIT
                        - HATE_SPEECH
                        - HARASSMENT
                        - DANGEROUS
                      description: >
                        The category the filter screens for:
                        SEXUALLY_EXPLICIT, HATE_SPEECH, HARASSMENT or
                        DANGEROUS.
                    confidence_level:
                      type: string
                      enum:
                        - LOW_AND_ABOVE
                        - MEDIUM_AND_ABOVE
                        - HIGH
                      description: >
                        The confidence from which the filter matches:
                        LOW_AND_ABOVE, which matches most and gives the most
                        false positives, MEDIUM_AND_ABOVE, or HIGH, which
                        gives the fewest. Unset, Model Armor applies the
                        default of the filter's category.
                description: The Responsible AI filters, at least one, each with filter_type and optionally confidence_level.
            description: >
              The Responsible AI filters: rai_filters, required.
          sdp_settings:
            type: object
            additionalProperties: false
            properties:
              basic_config:
                type: object
                additionalProperties: false
                properties:
                  filter_enforcement:
                    type: string
                    enum:
                      - ENABLED
                      - DISABLED
                    description: >
                      ENABLED, to inspect for the sensitive data types of
                      Sensitive Data Protection's basic configuration, or
                      DISABLED; unset, disabled.
                description: Sensitive Data Protection's basic configuration.
            description: >
              Sensitive Data Protection settings: basic_config.
          pi_and_jailbreak_filter_settings:
            type: object
            additionalProperties: false
            properties:
              filter_enforcement:
                type: string
                enum:
                  - ENABLED
                  - DISABLED
                description: ENABLED or DISABLED; unset, disabled.
              confidence_level:
                type: string
                enum:
                  - LOW_AND_ABOVE
                  - MEDIUM_AND_ABOVE
                  - HIGH
                description: >
                  The confidence from which the filter matches, as for a
                  Responsible AI filter, applied while the filter is enabled.
            description: >
              Prompt injection and jailbreak detection: filter_enforcement
              and confidence_level.
          malicious_uri_filter_settings:
            type: object
            additionalProperties: false
            properties:
              filter_enforcement:
                type: string
                enum:
                  - ENABLED
                  - DISABLED
                description: ENABLED or DISABLED; unset, disabled.
            description: >
              Malicious URL detection: filter_enforcement.
        description: >
          The filters the template screens with: rai_settings, sdp_settings,
          pi_and_jailbreak_filter_settings and malicious_uri_filter_settings,
          each optional; required, and {} for a template that screens
          nothing.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          The Model Armor endpoint of the template's location,
          https://modelarmor.<location>.rep.googleapis.com, the regional
          endpoint a sanitize call goes to. A realization publishes a
          pointer string the provisioning tool resolves once the template
          exists.
      template:
        type: string
        required: true
        description: >
          The template's resource name,
          projects/<project>/locations/<location>/templates/<template ID>,
          which a call of sanitizeUserPrompt or sanitizeModelResponse names
          at the endpoint. A realization publishes a pointer string the
          provisioning tool resolves once the template exists.

  assertions:
    # The template takes the instance's name, and Model Armor takes a
    # template ID of letters, digits, underscores and hyphens, at most 63
    # characters, not beginning with a hyphen.
    template_id: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_][a-zA-Z0-9_-]{0,62}$` $n) -}}
      {{- fail (printf "the template takes the component's name, %q, and Model Armor takes a template ID of 1 to 63 letters, digits, underscores and hyphens, not beginning with a hyphen: rename the component in the Aggregate" (trunc 80 $n)) -}}
      {{- end -}}
