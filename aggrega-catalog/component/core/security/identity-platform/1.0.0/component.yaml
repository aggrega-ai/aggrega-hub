apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/identity-platform
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Identity Platform is a hosted
  # service the reader contracts for with Google Cloud, under Google Cloud's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description states follows Identity Platform's REST reference
  # of a project's Config (the sign-in methods, email.passwordRequired, the
  # client's apiKey and firebaseSubdomain) and of
  # projects.identityPlatform.initializeAuth (available to billing-enabled
  # projects alone); "Adding multi-factor authentication to your web app"
  # (every sign-in provider supports a second factor except phone and
  # anonymous sign-in; a second factor needs verified email addresses; SMS
  # is sent to the regions the project's SMS region policy allows); the
  # google provider's documentation of google_identity_platform_config at
  # v8.11.0 (one configuration per project, created once and never deleted;
  # the MultiFactorAuthConfig states and second factors); and Google Cloud's
  # "Using Firebase to authenticate users" (API Gateway), which gives a
  # token's issuer as https://securetoken.google.com/<project ID>. The
  # discovery document answers at that issuer followed by
  # /.well-known/openid-configuration, naming the issuer and its signing
  # keys' jwks_uri.
  description: >
    Identity Platform in one Google Cloud project: the project's one
    configuration of the service that signs an app's users up and in, with
    the sign-in methods the Aggregate turns on. A consumer reads the API key
    a client SDK sends with each request, declared sensitive; the Firebase
    subdomain the service reports for the project, through which a client
    SDK signs users in; and the URL of the OpenID Connect discovery document,
    from which a token's verifier reads the issuer and its signing keys.

    Users sign in with an email address and a password, with a phone number
    and a code sent by SMS, or anonymously, each method off unless the
    Aggregate turns it on. Multi-factor authentication is off, enabled for
    the users who enrol a second factor, or mandatory; the second factor is a
    code sent by SMS. A second factor is added to an email sign-in: phone and
    anonymous sign-in take none, and Identity Platform asks for verified
    email addresses. SMS reaches only the regions the project's SMS region
    policy allows.

    Identity Platform keeps one configuration per project: it is set up
    once, for a project with billing enabled, and is never deleted, so every
    instance of this Component deployed into one project configures the
    same users and methods. No OAuth, OIDC or SAML identity provider, tenant,
    blocking function, quota, SMS region or client permission is set up.
    Users stay in Identity Platform, which keeps no backup to configure.
    Each Recipe's description says which keys it honours and which it
    refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Every realization writes each sign-in method and the multi-factor state,
  # whatever its tool would default to, so a bare component configures the
  # same project on every target: no method on and no second factor. Each
  # object below is closed, so a key spelt otherwise halts the build.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      sign_in:
        type: object
        additionalProperties: false
        properties:
          email:
            type: object
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                description: >
                  Whether users sign in with an email address, false unless
                  set.
              password_required:
                type: boolean
                description: >
                  Whether an email sign-in takes a password, true unless set;
                  false also lets a user sign in by a link sent to the
                  address.
            description: Email sign-in.
          phone_number:
            type: object
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                description: >
                  Whether users sign in with a phone number and a code sent
                  to it by SMS, false unless set.
            description: Phone sign-in.
          anonymous:
            type: object
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                description: >
                  Whether a user may sign in anonymously, with no
                  credential, false unless set.
            description: Anonymous sign-in.
          allow_duplicate_emails:
            type: boolean
            description: >
              Whether more than one account may have the same email address,
              false unless set.
        description: >
          The sign-in methods: email, with enabled and password_required;
          phone_number and anonymous, each with enabled; and
          allow_duplicate_emails. Every method is off unless set.
      mfa:
        type: object
        additionalProperties: false
        properties:
          state:
            type: string
            enum:
              - DISABLED
              - ENABLED
              - MANDATORY
            description: >
              DISABLED unless set; ENABLED lets each user enrol a second
              factor and asks for it at every sign-in once enrolled;
              MANDATORY asks every user for one.
          enabled_providers:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - PHONE_SMS
            description: >
              The second factors users may enrol: PHONE_SMS, a code sent by
              SMS to a phone number the user registers.
        description: >
          Multi-factor authentication: state and enabled_providers. An
          authenticator app is not offered as a second factor.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      api_key:
        type: string
        required: true
        sensitive: true
        description: >
          The API key Identity Platform generates for the project, which a
          client SDK sends with each request it makes for the project's
          users, such as signing one up or in. It is declared sensitive:
          whoever holds it calls those methods as the configuration allows,
          though a client SDK ships such a key to every browser, and
          Firebase's documentation says a key restricted to Firebase
          services only identifies the project and needs no secrecy. A
          realization publishes a pointer string the provisioning tool
          resolves once the configuration exists.
      firebase_subdomain:
        type: string
        required: true
        description: >
          The Firebase subdomain Identity Platform reports for the project,
          as the service gives it. Identity Platform handles sign-in
          redirects at a domain it creates for the project on Firebase
          Hosting, <project ID>.firebaseapp.com by Google's documentation,
          which a client SDK takes as its authDomain. A realization
          publishes a pointer string the provisioning tool resolves once the
          configuration exists.
      oidc_discovery_url:
        type: string
        required: true
        description: >
          The URL of the OpenID Connect discovery document of the project's
          tokens: their issuer, https://securetoken.google.com/<project ID>,
          followed by /.well-known/openid-configuration. A token's verifier
          reads from it the issuer the tokens name and the URL of the keys
          that sign them. A realization publishes a pointer string the
          provisioning tool resolves once the configuration exists.
