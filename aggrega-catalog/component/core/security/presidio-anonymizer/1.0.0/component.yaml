apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/presidio-anonymizer
  version: 1.0.0
  license: MIT
  description: >
    The Presidio anonymizer: a service that replaces spans of a text it is told
    about. A caller posts a text together with the list of spans to act on —
    each with its position and its entity type, in the shape the Presidio
    analyzer reports — and the service answers with the rewritten text and
    what it did to each span. Each entity type is handled by the operator the
    request names for it: replaced by a given value, removed, overwritten
    character by character, hashed or encrypted; with none named, every span is
    replaced by its entity type in angle brackets, such as <PERSON>. It can also
    reverse its own encryption when handed the key.

    It finds nothing. It acts only on the spans it is given, so text a caller
    does not list reaches the answer unchanged; finding the spans is the work
    of core/security/presidio-analyzer, and a caller that masks text calls
    both.

    Reachability is a deliberate part of the model. The service authenticates
    no caller: whatever can reach its address can submit text to it, and every
    text it is sent reaches it unmasked. It is published on an in-cluster
    address for the component that calls it, and is not meant to be exposed
    beyond the cluster.

    core/gateway/litellm takes it on its pii_anonymizer socket. Realized on
    Kubernetes by its Helm Recipe and for local development by its Compose
    Recipe, each running the vendor's published image as a single stateless
    service. Exports its host, port, endpoint and protocol to consumers via the
    uses topology, where the endpoint is the base URL a caller posts to.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    # Every Recipe of this component runs the service as containers the
    # Release itself operates, so a single posture is its identity.
    component.aggrega.ai/hosting: self-hosted
    # The service is published under the MIT licence, which metadata.license
    # names exactly; this label carries the class that licence falls into.
    component.aggrega.ai/upstream-licensing: osi-approved
    # Text anonymization: this service is the half of the pair that rewrites
    # the spans it is handed, over the HTTP API its anonymize route serves; it
    # finds nothing on its own. The value names that role, which is what a
    # consumer's socket selects on to be handed this address and not the other
    # half's.
    security.aggrega.ai/text-anonymization: anonymizer
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3000
        description: Port the service listens on and its Service accepts callers on. Most operators should omit this and let the Recipe assign the default (3000), the port the published image listens on unless told otherwise.
      engine_version:
        type: string
        default: "2.2.364"
        description: Image tag of the anonymizer the Recipe runs, from the vendor's own container registry.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol are the shape every server component publishes;
      # endpoint is the base URL a caller posts to, published as its own key so a
      # consumer reads it rather than assembling it.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the anonymizer. Every
          caller reaching this name can submit text, so it is an address for the
          component that calls the service rather than one to publish.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts callers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the anonymizer's HTTP API, with the host and the port
          already composed and no path. A caller posts the text and the spans to
          replace to the anonymize route under it.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
