apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/aws-certificate-manager
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: AWS Certificate Manager is a
  # hosted service the reader contracts for with AWS, under AWS's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description states follows the AWS Certificate Manager API
  # Reference: RequestCertificate (the name's form, the pattern every name
  # matches, the first name at most 64 octets as RFC 5280 limits the common
  # name and every other name at most 253, at most 100 names; ACM records
  # every public certificate other than an Amazon N2 certificate in a
  # certificate transparency log) and DeleteCertificate ("You cannot delete
  # an ACM certificate that is being used by another AWS service"); and the
  # AWS Certificate Manager User Guide: "AWS Certificate Manager DNS
  # validation" (a CNAME record for each name, "created specifically for your
  # domain and your account"; a wildcard name and its base name given the
  # same record; the record valid in any Region and for later certificates
  # of the same name while it stays; "ACM automatically renews your
  # certificate as long as the certificate is in use and your CNAME record
  # remains in place"; a name not validated within 72 hours times out),
  # "Quotas" (10 domain names for each certificate unless the account's
  # quota is raised, up to 100; the first name the certificate's common
  # name, every name in its Subject Alternative Name extension) and
  # "Managed automation with integrated services" ("To use an ACM
  # certificate with CloudFront, you must request or import the certificate
  # in the US East (N. Virginia) region"), "Supported Regions" (a
  # certificate is a regional resource, and Elastic Load Balancing takes one
  # from its own Region) and "AWS Certificate Manager concepts" (certificate
  # transparency log servers add each public certificate, with its domain
  # names, to their public databases, and no public certificate opts out; a
  # wildcard protects one subdomain level and not the apex domain). The
  # Amazon API Gateway Developer Guide, "Get certificates ready in AWS
  # Certificate Manager": a Regional custom domain name takes a certificate
  # from the API's Region, an edge-optimized one a certificate from US East
  # (N. Virginia). The CloudFormation reference for
  # AWS::CertificateManager::Certificate: a certificate for which no export
  # preference is given cannot be exported.
  description: >
    One public TLS certificate AWS Certificate Manager issues, in the Region
    the Release deploys to, for domain_name and any
    subject_alternative_names. A consumer reads its ARN, which a load
    balancer's listener and an API Gateway Regional custom domain name take
    from their own Region, and a CloudFront distribution and an
    edge-optimized custom domain name from US East (N. Virginia) alone. Its
    private key cannot be exported, so only the AWS services ACM integrates
    with use it.

    ACM validates each name through DNS: the record ACM gives each name, a
    CNAME, is written into the operator's Route 53 public hosted zone, which
    the Release names, and no zone is created. A wildcard name and its base
    name share one record, and ACM gives a name the same record for every
    certificate its account requests, in any Region. A consumer's reference
    to the ARN resolves once ACM has issued the certificate, and ACM renews
    it while it is in use and the records stay. ACM records every public
    certificate in a certificate transparency log, which publishes its names.

    Each name is a fully qualified domain name of letters, digits and
    hyphens, an internationalized one in its xn-- form, its leftmost label *
    for a wildcard covering one level; domain_name is at most 64 characters,
    every other name 253. More than 100 names halt the build; ACM takes 10
    unless the account's quota is raised. ACM refuses to delete the
    certificate while another AWS service uses it. No email validation,
    private certificate or exportable certificate is offered. Each Recipe's
    description says which keys it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: security
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Every name matches the pattern RequestCertificate gives for a domain
  # name, held in two parts since that pattern uses a look-ahead: the schema
  # pattern below takes labels of letters, digits and hyphens, neither
  # starting nor ending with a hyphen, each of 1 to 63 characters, the
  # leftmost one * for a wildcard; the name_form assertion adds that a name
  # has at least two labels, the last of at least 2 characters. ACM fixes
  # every name when it issues the certificate, so a realization replaces the
  # certificate when a name changes.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      domain_name:
        type: string
        required: true
        maxLength: 64
        pattern: '^(\*\.)?([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
        description: >
          The name the certificate secures, such as api.example.com, and its
          common name: labels of letters, digits and hyphens, an
          internationalized name in its xn-- form, at most 64 characters, the
          limit RFC 5280 sets on a common name. A leftmost label * makes it a
          wildcard, such as *.example.com, which covers every name one level
          below example.com and not example.com itself. ACM validates it
          through the record it gives this name in the operator's hosted
          zone; a longer name goes in subject_alternative_names. A name of
          one label, or of another form, halts the build, naming this key.
          Changing it replaces the certificate.
      subject_alternative_names:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          maxLength: 253
          pattern: '^(\*\.)?([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
        description: >
          Further names the certificate secures, each written once, in the
          form domain_name takes and at most 253 characters, such as
          www.example.com or *.example.com. Unset, the certificate secures
          domain_name alone, which ACM writes into the certificate's Subject
          Alternative Name extension with every name here. ACM validates each
          through the record it gives that name in the operator's hosted
          zone. ACM takes 10 names on a certificate, domain_name included,
          unless the account's quota is raised, and at most 100. A name of
          one label, or of another form, halts the build, naming this key.
          Changing the list replaces the certificate.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      arn:
        type: string
        required: true
        description: >
          The certificate's ARN,
          arn:<partition>:acm:<region>:<account>:certificate/<id>, which an
          API Gateway custom domain name, a load balancer's listener and a
          CloudFront distribution take as the certificate they present, and
          an IAM policy names as the resource it grants access to. A
          realization publishes a pointer string the provisioning tool
          resolves once ACM has issued the certificate. The certificate
          offers no address of its own.

  # The rules ACM holds a certificate's names to that the schema above does
  # not state: the rest of the pattern RequestCertificate gives a name, and
  # the number of names, which reads domain_name and
  # subject_alternative_names together. Each is a rule of the service
  # itself, held here once for every realization, and halts the build naming
  # what to change rather than leaving the request to fail.
  assertions:
    # The pattern RequestCertificate gives DomainName and each of
    # SubjectAlternativeNames ends in a label of at least 2 characters after
    # at least one other label.
    name_form: >-
      {{- $fqdn := `^(\*\.)?([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9]$` -}}
      {{- $d := toString .values.domain_name -}}
      {{- if not (regexMatch $fqdn $d) -}}
      {{- fail (printf "values.domain_name is %s, and AWS Certificate Manager takes a fully qualified domain name, of at least two labels and a last label of at least two characters, such as api.example.com: set it in the Aggregate" $d) -}}
      {{- end -}}
      {{- range (optional .values "subject_alternative_names" list) -}}
      {{- if not (regexMatch $fqdn (toString .)) -}}
      {{- fail (printf "values.subject_alternative_names names %s, and AWS Certificate Manager takes a fully qualified domain name, of at least two labels and a last label of at least two characters, such as www.example.com: correct it in the Aggregate" (toString .)) -}}
      {{- end -}}
      {{- end -}}
    # The RequestCertificate reference: "The maximum number of domain names
    # that you can add to an ACM certificate is 100", and the Quotas page:
    # every name, domain_name the first, is written into the certificate's
    # Subject Alternative Name extension. domain_name written again among
    # subject_alternative_names is one name.
    names_on_certificate: >-
      {{- $names := uniq (prepend (optional .values "subject_alternative_names" list) (toString .values.domain_name)) -}}
      {{- if gt (len $names) 100 -}}
      {{- fail (printf "values.domain_name and values.subject_alternative_names name %d distinct names together, and AWS Certificate Manager puts at most 100 domain names on one certificate: name at most 100 in the Aggregate, or divide them between two certificates" (len $names)) -}}
      {{- end -}}
