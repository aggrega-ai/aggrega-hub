apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/security/presidio-analyzer
  version: 1.0.0
  license: MIT
  description: >
    The Presidio analyzer: a service that finds personal and other sensitive
    data in text. A caller posts a text, the language it is written in and,
    optionally, the entity types it is looking for — person names, email
    addresses, phone numbers, card and bank account numbers, national
    identifiers and the like — and the service answers with where each match
    sits in the text, which type it is and how confident the match is. It
    changes nothing: replacing what it found is the work of
    core/security/presidio-anonymizer, so a caller that masks text calls both.

    core/gateway/litellm takes it on its pii_analyzer socket. Recognition is in
    English only, the one language the published image loads a model for. It is
    automated recognition, so it misses some sensitive data and marks some text
    that is not sensitive; other protections belong beside it. It authenticates
    no caller, and every text reaches it unmasked, so it is published on an
    in-cluster address for the component that calls it and is not meant to be
    exposed beyond the cluster.

    Realized on Kubernetes by its Helm Recipe and for local development by its
    Compose Recipe, each running the vendor's published image as a single
    stateless service. Exports its host, port, endpoint and protocol to
    consumers, where the endpoint is the base URL a caller posts to.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: security
    # Every Recipe of this component runs the service as containers the
    # Release itself operates, so a single posture is its identity.
    component.aggrega.ai/hosting: self-hosted
    # The service is published under the MIT licence, which metadata.license
    # names exactly; this label carries the class that licence falls into.
    component.aggrega.ai/upstream-licensing: osi-approved
    # Text anonymization: this service is the half of the pair that finds the
    # sensitive spans in a text and reports them, over the HTTP API its analyze
    # route serves; it replaces nothing. The value names that role, which is
    # what a consumer's socket selects on to be handed this address and not the
    # other half's.
    #
    # It finds a span by combining a statistical language model with patterns,
    # checksums and the words found near a match. The text it reports on is left
    # exactly as it was sent: a caller that masks text sends it, together with
    # these results, to core/security/presidio-anonymizer, the other half. The
    # two are separate services.
    security.aggrega.ai/text-anonymization: analyzer
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 3000
        description: Port the service listens on and its Service accepts callers on. Most operators should omit this and let the Recipe assign the default (3000), the port the published image listens on unless told otherwise.
      # The published image loads a language model for English alone, so a
      # request naming another language is answered with an error. Recognition
      # is automated: it misses some sensitive data and marks some text that is
      # not sensitive, and the product's own documentation says it cannot
      # guarantee to find everything and that other protections belong beside
      # it.
      engine_version:
        type: string
        default: "2.2.364"
        description: Image tag of the analyzer the Recipe runs, from the vendor's own container registry.
      compute:
        cpu:
          type: string
          default: "2"
        memory:
          type: string
          default: 3000Mi
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host, port and protocol are the shape every server component publishes;
      # endpoint is the base URL a caller posts to, published as its own key so a
      # consumer reads it rather than assembling it.
      #
      # Reachability is a deliberate part of the model. The service
      # authenticates no caller: whatever can reach its address can submit text
      # to it, and every text it is sent reaches it unmasked. So the address is
      # an in-cluster one for the component that calls it, and is not meant to
      # be exposed beyond the cluster.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the analyzer. Every caller
          reaching this name can submit text, so it is an address for the
          component that calls the service rather than one to publish.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts callers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the analyzer's HTTP API, with the host and the port
          already composed and no path. A caller posts the text to analyze to
          the analyze route under it.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
