apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/event-publisher
  version: 1.0.0
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        target_datastore: { type: string, x-aggrega-selector: "component.aggrega.ai/category=datastore" }
        target_topic: { type: string }
        payload_schema_ref: { type: string }
      required: [target_datastore, target_topic]
