apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/event-publisher
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Must point to a valid message broker/datastore in the topology
      target_datastore: string @selector("component.aggrega.ai/type=ai-datastore")
      
      // The specific topic, stream, or queue the agent is allowed to publish to
      target_topic: string
      
      // Optional: A schema reference to validate the LLM's generated payload before sending
      payload_schema_ref?: string
    }