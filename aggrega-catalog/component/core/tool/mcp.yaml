apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/mcp
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // MCP supports SSE (Server-Sent Events) over HTTP, or local STDIO execution
      transport: *"sse" | "stdio"

      // Ops provisions the MCP server pod and injects the server_url or command args
    }