apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/browser
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // The framework driving the browser
      automation_engine: *"playwright" | "multion" | "browserbase" | "puppeteer" | string
      
      // The actual browser binary to provision
      browser_type: *"chromium" | "firefox" | "webkit" | string
      
      headless: bool | *true
    }