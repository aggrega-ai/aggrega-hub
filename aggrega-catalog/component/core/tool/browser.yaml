apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/browser
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        automation_engine: { type: string, default: playwright }
        browser_type: { type: string, default: chromium }
        headless: { type: boolean, default: true }
      required: [automation_engine, browser_type, headless]
