apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/retrieval
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        target_datastore: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-datastore" }
        top_k: { type: integer, default: 5 }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [target_datastore, top_k, side_effects]
