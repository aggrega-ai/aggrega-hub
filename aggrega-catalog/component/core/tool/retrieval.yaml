apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/retrieval
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Must point to a valid datastore in the architecture
      target_datastore: string @selector("component.aggrega.ai/type=ai-datastore")
      
      // Limits how much context the tool can pull back into the LLM's prompt
      top_k: int | *5
      
      // Defaults to safe
      side_effects: *"read_only"
    }