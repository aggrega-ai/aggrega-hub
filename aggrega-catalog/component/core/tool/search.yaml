apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/search
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Allows officially supported providers OR any custom string
      provider: *"tavily" | "exa" | "google" | "bing" | "duckduckgo" | string
      
      max_results: int | *5
      
      side_effects: *"read_only"

      // Egress guardrails handle include_domains
    }