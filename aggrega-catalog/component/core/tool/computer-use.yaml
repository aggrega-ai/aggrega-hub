apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/computer-use
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Dimensions for the virtual framebuffer
      display_width:  int | *1024
      display_height: int | *768
      
      // Guardrail Features handle allow_keyboard and allow_mouse policies
    }