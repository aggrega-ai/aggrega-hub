apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/agent-invocation
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // The physical target in the topology
      target_agent: string @selector("component.aggrega.ai/type=ai-agent")
      
      // The communication standard used for the handoff
      // A2A is the industry standard for opaque agent interoperability
      protocol: *"a2a" | "mcp" | "grpc" | "rest" | string
      
      // Handoff vs Sub-task
      execution_mode: *"synchronous" | "asynchronous" | "fire_and_forget"
    }