apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/filesystem
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Determines if the mount is ReadWriteMany or ReadOnlyMany
      access_mode: *"read_only" | "read_write"
      
      side_effects: *"mutating" | "read_only"
      
      // Ops handles base_path mount. Guardrails handle allowed_extensions.
    }