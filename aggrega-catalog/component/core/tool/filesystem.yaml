apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/filesystem
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        access_mode: { type: string, enum: [read_only, read_write], default: read_only }
        side_effects: { type: string, enum: [mutating, read_only], default: mutating }
      required: [access_mode, side_effects]
