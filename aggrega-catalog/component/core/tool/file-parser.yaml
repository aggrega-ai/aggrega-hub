apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/file-parser
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // The synchronous parsing engine to execute
      engine: *"unstructured" | "llama_parse" | "aws_textract" | "azure_doc_intel" | string
      
      // How much fidelity the agent needs from the file
      extraction_mode: *"text_only" | "layout_preserving" | "multimodal" | string
      
      // Hardcoded security boundary: this tool only reads data
      side_effects: *"read_only"
    }