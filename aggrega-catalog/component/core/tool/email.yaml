apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/email
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  secretNames: ["smtp_credentials"]
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        action: { type: string, enum: [send_only, read_only, send_and_read], default: send_only }
      required: [action]
