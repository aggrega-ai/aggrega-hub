apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/email
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  secretNames: ["smtp_credentials"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Developer Intent: What is the agent allowed to do?
      action: *"send_only" | "read_only" | "send_and_read"
      
      // Egress guardrails handle allowed_domains
    }