apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/datastore-query
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Must point to a valid datastore in the topology
      target_datastore: string @selector("component.aggrega.ai/type=ai-datastore")
      
      // The dialect the LLM should use to generate the query
      dialect: *"sql" | "mql" | "cypher" | "promql" | string
      
      side_effects: *"read_only"
    }