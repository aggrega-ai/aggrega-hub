apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/datastore-query
  version: 1.0.0
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        target_datastore: { type: string, x-aggrega-selector: "component.aggrega.ai/category=datastore" }
        dialect: { type: string, default: sql }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [target_datastore, dialect, side_effects]
