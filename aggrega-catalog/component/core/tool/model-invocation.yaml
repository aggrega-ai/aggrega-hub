apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/model-invocation
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        target_model: { type: string, x-aggrega-selector: "component.aggrega.ai/type=ai-model" }
        task_type: { type: string, default: text_to_speech }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [target_model, task_type, side_effects]
