apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/tool/model-invocation
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-tool
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseToolParameter & {
      // Links the tool strictly to a defined AI Model in the topology
      target_model: string @selector("component.aggrega.ai/type=ai-model")
      
      // The expected modality of the task
      task_type: *"text_to_speech" | "speech_to_text" | "image_generation" | "classification" | string
      
      side_effects: *"read_only"
    }