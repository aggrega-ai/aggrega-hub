apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/ai21
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // AI21 specific penalization parameters
      presence_penalty?: {
        scale: float & >=0.0 & <=5.0
      }
      temperature?: float & >=0.0 & <=1.0
    }