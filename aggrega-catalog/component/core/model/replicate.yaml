apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/replicate
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // Replicate often requires the exact SHA256 version hash of the model
      version?: string
      
      // Signals if the infrastructure should wait for the response or use webhooks
      stream: bool | *false
    }