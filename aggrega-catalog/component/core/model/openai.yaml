apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/openai
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"
    
    parameter: core.#BaseModelParameter & {
      // Allows dev to specify if they need the newer structured outputs
      strict_response_format: bool | *false
    }