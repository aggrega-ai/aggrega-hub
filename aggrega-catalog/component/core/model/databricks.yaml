apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/databricks
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["databricks_token"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // Databricks addresses models via serving endpoints, not just model names
      endpoint_name: string
      
      // Ops injects the workspace_url connection string
    }