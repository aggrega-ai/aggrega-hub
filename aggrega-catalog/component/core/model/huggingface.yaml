apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/huggingface
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["hf_token"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // HF requires knowing the task type (e.g., text-generation vs feature-extraction)
      task: *"text-generation" | "text2text-generation" | "feature-extraction"

      // Ops handles all endpoint_url and base_url network injections
    }