apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/cohere
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // Cohere's native RAG connector IDs (e.g., "web-search")
      connectors?: [...string]
      
      temperature?: float & >=0.0 & <=1.0
    }