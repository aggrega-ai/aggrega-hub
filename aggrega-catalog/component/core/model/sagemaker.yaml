apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/sagemaker
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["aws_credentials"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // AWS SageMaker requires the specific endpoint name, not just the model string
      endpoint_name: string

      // Ops handles AWS Auth and Region routing.
    }