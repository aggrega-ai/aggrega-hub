apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/gemini
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        temperature: { type: number, min: 0.0, max: 2.0 }
        top_p: { type: number, min: 0.0, max: 1.0 }
        top_k: { type: integer, min: 0 }
