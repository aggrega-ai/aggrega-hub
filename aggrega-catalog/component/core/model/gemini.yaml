apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/gemini
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // Standard generative settings exposed to the developer
      temperature?: float & >=0.0 & <=2.0
      top_p?:       float & >=0.0 & <=1.0
      top_k?:       int & >=0
    }