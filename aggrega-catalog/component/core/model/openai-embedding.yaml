apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/openai-embedding
  version: 1.0.0
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"

    parameter: core.#BaseModelParameter & {
      // Modern OpenAI embedding models allow developers to truncate the vector size
      // e.g., dropping text-embedding-3-large from 3072 to 1024
      dimensions?: int & >0
    }