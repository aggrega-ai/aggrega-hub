apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/model/anthropic
  labels:
    component.aggrega.ai/type: ai-model
spec:
  secretNames: ["api_key"]
  cueSchema: |
    import "aggrega.registry/cue/core"
    
    parameter: core.#BaseModelParameter & {
      // Anthropic requires max_tokens on almost all API calls
      default_max_tokens: int | *4096
    }