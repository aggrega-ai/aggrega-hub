apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/azure-documentdb
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure DocumentDB is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure DocumentDB cluster: Microsoft's managed document database,
    which a client reaches with a MongoDB driver over the MongoDB wire
    protocol. A consumer reads the cluster's host, port and administrator
    login, or the whole mongodb+srv:// address, which carries the login and
    no password; the password arrives through the credential attached to the
    password slot, never through this contract. Databases and collections
    are created by the application as it writes, so none is declared here.

    Reach for it where the documents live in Azure and the application uses
    a MongoDB driver; reach for core/datastore/cosmos-db where it uses Azure
    Cosmos DB's own API.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which its service has no setting for and it does not read.
    Backup is the core/backup attachment: the service backs every cluster up
    on its own, and a realization keeps that backup from the attachment,
    halting on a setting the service does not offer.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: document
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The credential slot. inject: [] is black-box: the Recipe decides how the
  # credential reaches the service. Optional in the schema, so a Recipe can
  # name what is missing: the service draws no password for its
  # administrator, so a realization halts with the slot empty, naming it.
  featuresSchema:
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The password of the administrator login values.user names. A realization takes only a credential the service can receive without the rendered output carrying the value: a reference to a secret the operator keeps, or a reference to a password the target draws when it deploys. It halts naming the slot on any other credential, and with the slot empty, since the service draws no password. Each Recipe's description names the credentials it takes."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      user:
        type: string
        default: appuser
        description: The cluster's administrator login, published as user, which a consumer authenticates as with the password the password slot supplies. It is named once, when the cluster is created.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      engine_version:
        type: string
        description: >
          The MongoDB server version the cluster runs, such as 7.0 or 8.0.
          It carries no default: left out, each realization keeps the version
          its own description states. A realization whose source sets no
          version halts the build when this is set, naming it.
      storage:
        type: object
        properties:
          size:
            type: string
            default: 32Gi
            description: >
              Disk size of each shard, in whole gibibytes. A realization halts
              the build, naming this key, on a size the service documents the
              cluster tier cannot take; the service checks the rest when it
              provisions.
      ha:
        enabled:
          type: boolean
          default: false
          description: Give each shard a standby replica the service fails over to, in another availability zone where the region allows. A realization halts the build on it, naming the cluster tier, on a tier the service gives no standby.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The cluster's name a client reaches: the name a mongodb+srv:// client
          looks up the cluster's service record under, which lists the nodes
          it connects to and their port. A realization publishes a pointer
          string the provisioning tool resolves once the cluster exists, so a
          consumer reads this rather than deriving one, or the DNS name the
          Release sets in infra.overrides.host instead.
      port:
        type: integer
        required: true
        description: TCP port the cluster's nodes accept connections on. A mongodb+srv:// client reads it from the service record and needs no port; a consumer opening a connection to a node, or a firewall rule admitting one, reads it here.
      user:
        type: string
        description: The administrator login a consumer authenticates as. The matching password arrives through the credential attached to the component, never through this contract.
      endpoint:
        type: string
        description: >
          The cluster's mongodb+srv:// address, carrying the login and no
          password, with the options the service documents for a client, so a
          consumer hands it to a MongoDB driver and supplies the password
          beside it.
