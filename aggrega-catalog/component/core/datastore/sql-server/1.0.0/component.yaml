apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/sql-server
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none. Every realization provisions a
  # managed SQL Server service the reader contracts for with the cloud provider,
  # under that provider's terms, which no SPDX identifier names: the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of SQL Server, so the catalog distributes and
  # brokers none, and the standard library's admission test, which reads the
  # artifacts an entity pins, finds nothing to refuse. A realization running
  # SQL Server in a container would pin Microsoft's image, whose terms are
  # judged before such a Recipe is authored, so every realization of this
  # version is a managed service.
  description: >
    A SQL Server relational database, run by a cloud provider's managed
    service. One Component serves every cloud: the same values, infra keys
    and published address reach each product. Each Recipe is named
    sql-server- followed by the product it provisions, such as
    sql-server-azure-sql-database for Azure SQL Database, and its description
    says which keys it honours, which it refuses by name, and which its
    service has no setting for and it does not read.

    Backup is the core/backup attachment: a realization sets the service's
    own automated backups from it and keeps the service's default with none
    attached. A capability with no FeatureRecipe for core/backup halts on the
    attachment, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The credential slot. inject: [] is black-box: the Recipe decides how the
  # credential reaches the service. Optional, since a service that keeps the
  # administrator's password itself, or a module that draws one, needs nothing
  # attached; a realization whose service needs a password it cannot draw
  # halts with the slot empty, naming it.
  featuresSchema:
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The password of the login values.user names. A realization takes only a credential its service can receive without the rendered output carrying the value: a reference to a secret the operator keeps, a reference to a password the target draws when it deploys, or none where the service or the module the Recipe sources keeps the password itself. It halts naming the slot on any other credential, and with the slot empty where neither the service nor the module draws one. Each Recipe's description names the credentials it takes."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default or may be omitted, so a bare `db: {}` keeps a working
      # contract and every value stays configurable.
      database:
        type: string
        default: appdb
        description: The database a consumer connects to, published as database. A realization whose service creates databases creates it; where the service creates none when it provisions the server, the application creates it under this name. A consumer names it in its connection string to land in it rather than in the server's system database.
      user:
        type: string
        default: appuser
        description: The SQL login a consumer authenticates as, published as user. A realization creates it as the server's administrator login, or as a login beside the administrator a service keeps for itself, with the password the password slot supplies; it never travels through this contract.
      collation:
        type: string
        description: Collation of the database's data, such as SQL_Latin1_General_CP1_CI_AS or Latin1_General_100_CI_AS_SC_UTF8. Omit it to take the service's default. A realization sets it on the database, or on the server where the service takes a collation there alone, which a database created on it inherits. The build passes the name as written, and the service refuses a name it does not know when it provisions.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 1433
        description: TCP port the server accepts connections on, published as port. A realization whose service serves SQL Server on one port of its own publishes that port and halts the build on any other value.
      engine_version:
        type: string
        default: "2022"
        description: >
          The SQL Server release, by the year Microsoft names it, such as 2019
          or 2022. A realization that creates the server on a release takes it
          in the form its service spells it and halts the build, naming this
          key, on one its service does not offer. A realization whose service
          runs its own current database engine, which no setting chooses,
          reads no value while this holds its default and halts the build on
          any other, naming the service.
      # compute declares no default, so a Recipe can tell a value the Release
      # wrote from none: a managed realization sizes the server by a key of its
      # own and refuses these when set, naming the key it reads instead.
      compute:
        cpu:
          type: string
          description: CPU the database server is given where a realization runs the server itself. A managed service sizes the server by its own SKU or instance class, so a managed realization halts the build when this is set, naming the infra.overrides key it sizes by.
        memory:
          type: string
          description: Memory the database server is given where a realization runs the server itself. A managed service sizes the server by its own SKU or instance class, so a managed realization halts the build when this is set, naming the infra.overrides key it sizes by.
      storage:
        type: object
        properties:
          size:
            type: string
            default: 32Gi
            description: >
              Size of the database's storage, in whole gibibytes: the
              database's maximum data size, or the server's storage, as the
              service measures it. Each service bounds the size by the size
              class it provisions; a realization halts the build, naming this
              key, on a size its service documents the class cannot take, and
              the service checks the rest when it provisions.
          type:
            type: string
            description: >
              The provider's storage type, where the service lets one be
              chosen. Left unset, each realization takes its service's own. A
              realization whose service chooses the storage itself takes no
              type and halts the build when this is set.
      ha:
        enabled:
          type: boolean
          default: false
          description: Keep the database available through the loss of an availability zone, with the product's own zone redundancy, or a standby in another zone where the product keeps one. A realization halts the build on it, naming the size class, where its product gives that class neither.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client opens its database connection to: a pointer string
          the provisioning tool resolves to the server's address once the
          server exists, so a consumer reads this rather than deriving one. A
          realization publishes the DNS name the Release sets in
          infra.overrides.host instead of its pointer, so a consumer on another
          target receives an address it can resolve.
      port:
        type: integer
        required: true
        description: TCP port the server accepts connections on. A consumer reads it rather than assuming 1433.
      user:
        type: string
        description: Name of the SQL login a consumer authenticates as. The matching password arrives through the credential attached to the component, never through this contract.
      database:
        type: string
        description: Name of the database created on the server. A consumer names it in its connection string to land in the right database rather than in the server's default.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `sqlserver`, the Tabular Data Stream protocol of SQL Server, which is what a consumer selects a driver for.
