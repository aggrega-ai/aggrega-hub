apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/sql-server
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none. Every realization provisions a
  # managed SQL Server service the reader contracts for with the cloud provider,
  # under that provider's terms, which no SPDX identifier names: the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of SQL Server, so the catalog distributes and
  # brokers none, and the standard library's admission test, which reads the
  # artifacts an entity pins, finds nothing to refuse. A realization running
  # SQL Server in a container would pin Microsoft's image, whose terms are
  # judged before such a Recipe is authored; until one passes, every
  # realization is managed.
  description: >
    A SQL Server relational database, run by a cloud provider's managed
    service. One Component serves every cloud: the same values, infra keys
    and published address reach each product, and a realization honours each
    key its service keeps and refuses by name one it cannot keep. Each Recipe
    is named sql-server- followed by the product.

    On Azure, reach for arm/sql-server-azure-sql-database where the Release
    deploys an Azure Resource Manager template, and for
    terraform/sql-server-azure-sql-database where it deploys Terraform: each
    creates a logical server and the one database values.database names in
    Azure SQL Database.

    Backup is the core/backup attachment: a realization sets the service's
    own automated backups from it and keeps the service's default with none
    attached. A capability with no FeatureRecipe for core/backup halts on the
    attachment, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The credential slot. inject: [] is black-box: the Recipe decides how the
  # credential reaches the service. Optional, since a service that keeps the
  # administrator's password itself, or a module that draws one, needs nothing
  # attached; a realization whose service needs a password it cannot draw
  # halts with the slot empty, naming it.
  featuresSchema:
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: []
      description: "The administrator's password, the login values.user names. A realization takes only a credential its service can receive without the rendered output carrying the value, and halts naming the slot on any other. arm/sql-server-azure-sql-database takes core/referenced-secret bound to arm/key-vault-secret, a Key Vault secret handed over as a reference, and halts with nothing attached. terraform/sql-server-azure-sql-database takes core/random-password, handed over as a Terraform reference, and with nothing attached or core/generated-secret has the module it sources draw a password at apply time, kept in the Terraform state."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default or may be omitted, so a bare `db: {}` keeps a working
      # contract and every value stays configurable.
      database:
        type: string
        default: appdb
        description: Name of the database created on the server, published as database. A consumer names it in its connection string to land in it rather than in the server's system database.
      user:
        type: string
        default: appuser
        description: The SQL login a consumer authenticates as, created as the server's administrator login, published as user. Its password arrives through the credential attached to the password slot, never through this contract.
      collation:
        type: string
        description: Collation the database is created with, such as SQL_Latin1_General_CP1_CI_AS or Latin1_General_100_CI_AS_SC_UTF8. Omit it to take the server's default collation. The build passes the name as written, and the service refuses at deploy time a name it does not know.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 1433
        description: TCP port the server accepts connections on, published as port. A service that serves SQL Server on one port of its own publishes that port and halts the build on any other value; Azure SQL Database serves 1433 alone.
      engine_version:
        type: string
        default: "2022"
        description: >
          The SQL Server release, by the year Microsoft names it, such as 2019
          or 2022. A realization that creates the server on a release halts the
          build, naming this key, on one its service does not offer. Azure SQL
          Database runs the service's own current database engine, which no
          setting chooses, so its realizations read no value while this holds
          its default and halt the build on any other, naming the service.
      # compute declares no default, so a Recipe can tell a value the Release
      # wrote from none: a managed realization sizes the server by a key of its
      # own and refuses these when set, naming the key it reads instead.
      compute:
        cpu:
          type: string
          description: CPU the database server is given where a realization runs the server itself. A managed service sizes the server by its own SKU or instance class, so a managed realization halts the build when this is set, naming the infra.overrides key it sizes by; on Azure SQL Database that is infra.overrides.sku_name.
        memory:
          type: string
          description: Memory the database server is given where a realization runs the server itself. A managed service sizes the server by its own SKU or instance class, so a managed realization halts the build when this is set, naming the infra.overrides key it sizes by; on Azure SQL Database that is infra.overrides.sku_name.
      storage:
        type: object
        properties:
          size:
            type: string
            default: 32Gi
            description: >
              Size of the database's storage, in whole gibibytes. On Azure SQL
              Database it is the database's maximum data size, which each SKU
              caps at its own largest; the service checks that cap when the
              template deploys.
          type:
            type: string
            description: >
              The provider's storage type, where the service lets one be
              chosen. Left unset, each realization takes its service's own.
              Azure SQL Database chooses the storage by the SKU's service tier
              and takes no type, so its realizations halt the build when this
              is set.
      ha:
        enabled:
          type: boolean
          default: false
          description: Keep the database available through the loss of an availability zone, with the product's own zone redundancy, or a standby in another zone where the product keeps one. On Azure SQL Database the database is made zone redundant; the Basic and Standard tiers, General Purpose on hardware other than standard-series (Gen5), and Hyperscale, which needs zone-redundant backup storage no key here sets, halt the build on it, naming the SKU.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client opens its database connection to: a pointer string
          the provisioning tool resolves to the server's name once the server
          exists, so a consumer reads this rather than deriving one. A
          realization publishes the DNS name the Release sets in
          infra.overrides.host instead of its pointer, so a consumer on another
          target receives an address it can resolve.
      port:
        type: integer
        required: true
        description: TCP port the server accepts connections on. A consumer reads it rather than assuming 1433.
      user:
        type: string
        description: Name of the SQL login a consumer authenticates as. The matching password arrives through the credential attached to the component, never through this contract.
      database:
        type: string
        description: Name of the database created on the server. A consumer names it in its connection string to land in the right database rather than in the server's default.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `sqlserver`, the Tabular Data Stream protocol of SQL Server, which is what a consumer selects a driver for.
