apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/vertex-ai-vector-search
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Vertex AI Vector Search is a
  # hosted service the reader contracts for with Google Cloud, under Google
  # Cloud's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The index's behaviour follows Vertex AI Vector Search's documentation:
  # "Create and manage your index" (an index created empty, and the shard
  # sizes), "Index configuration parameters" (the distance measures and the
  # approximate neighbour count), "Query a public endpoint" (the endpoint's
  # name under vdb.vertexai.goog, REST and gRPC on it) and "Query an index
  # over VPC Network Peering" (gRPC at the deployed index's address on port
  # 10000); the REST reference of an index (its methods, none of them a
  # backup); and the Vertex AI SDK for Python, which reaches a peered
  # deployed index at its match_grpc_address on port 10000 over a channel
  # without TLS.
  description: >
    One Vertex AI Vector Search index served from an index endpoint: Google
    Cloud's managed vector database, which holds vectors of one length and
    answers a query with the vectors nearest the one it gives. A client
    queries the endpoint, naming index_endpoint and deployed_index_id; it
    upserts and removes vectors naming index on an index taking streaming
    updates, while one taking batch updates is changed by files in Cloud
    Storage. A consumer reads the endpoint's host, port and endpoint, and
    those three names.

    An endpoint is public or private, as each Recipe's description says. A
    public endpoint answers at a name of Google's under vdb.vertexai.goog,
    REST and gRPC over TLS on port 443, to a request signed as the Google
    identity the client runs under; a private one answers gRPC on port
    10000, at a private address in the operator's VPC network. No credential slot is declared, and no
    protocol is published.

    Reach for it where an application finds items by the nearness of their
    embeddings in Google Cloud. Feature normalization and the tuning of the
    search algorithm are not offered.

    Each Recipe's description says which keys it honours and which it
    refuses by name. Vertex AI Vector Search keeps no backup of an index,
    whose vectors come from the application or from Cloud Storage, so a
    core/backup attachment halts, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # An index of vectors its clients write and query by nearness is the
    # product's identity.
    datastore.aggrega.ai/engine: vector
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. dimensions
      # has no default: it is the length of the embeddings the application
      # writes, which only the application knows. The other values carry one.
      dimensions:
        type: integer
        required: true
        exclusiveMinimum: 0
        description: >
          The length of every vector the index holds, which is the length of
          the embeddings the application writes and queries with, such as an
          embedding model's output size. Vertex AI Vector Search fixes it
          when it creates the index, so a changed length takes a new, empty
          index.
      distance_measure_type:
        type: string
        enum: [DOT_PRODUCT_DISTANCE, COSINE_DISTANCE, SQUARED_L2_DISTANCE, L1_DISTANCE]
        default: DOT_PRODUCT_DISTANCE
        description: >
          How nearness is measured, spelt as Vertex AI Vector Search spells
          it: DOT_PRODUCT_DISTANCE, the negative of the dot product, the
          service's default; COSINE_DISTANCE, one minus the cosine
          similarity; SQUARED_L2_DISTANCE, the Euclidean distance; or
          L1_DISTANCE, the Manhattan distance. The service fixes it when it
          creates the index.
      approximate_neighbors_count:
        type: integer
        exclusiveMinimum: 0
        default: 150
        description: >
          How many neighbours an approximate search finds before it reorders
          them by their exact distance, the number a query that sets none
          takes. 150 is the number every example of an index in Vertex AI
          Vector Search's documentation sets. The service fixes it when it
          creates the index.
      index_update_method:
        type: string
        enum: [BATCH_UPDATE, STREAM_UPDATE]
        default: BATCH_UPDATE
        description: >
          How the index's vectors change, spelt as Vertex AI Vector Search
          spells it: BATCH_UPDATE, the service's default, takes the files
          in a Cloud Storage directory each time the index is pointed at one,
          inserting, updating or deleting the vectors they describe among
          those the index already holds; STREAM_UPDATE takes the vectors the application
          upserts and removes, which queries reach within seconds. The
          service fixes it when it creates the index.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Where the endpoint answers: on a public endpoint, the name Vertex AI
          gives it, <number>.<region>-<number>.vdb.vertexai.goog; on a private
          one, a private address in the operator's VPC network, or a name the
          operator gives that address. A realization publishes a pointer
          string the provisioning tool resolves once the endpoint serves the
          index, or the operator's name.
      port:
        type: integer
        required: true
        description: TCP port the endpoint answers on, 443 over TLS on a public endpoint, 10000 on a private one.
      endpoint:
        type: string
        description: >
          The endpoint as a client takes it: on a public endpoint, https://
          followed by host, which a REST call's path follows; on a private
          one, host:10000, the target a gRPC channel opens. It carries no
          credential.
      deployed_index_id:
        type: string
        required: true
        description: The ID the index is deployed under on the endpoint, which a query names.
      index_endpoint:
        type: string
        required: true
        description: The endpoint's resource name, projects/<project>/locations/<region>/indexEndpoints/<id>, which a query names beside deployed_index_id.
      index:
        type: string
        required: true
        description: The index's resource name, projects/<project>/locations/<region>/indexes/<id>, which an upsert or a removal of vectors names.
