apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/cosmos-db
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Cosmos DB is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Cosmos DB account for NoSQL: Microsoft's managed document
    database, which a client reaches through Azure Cosmos DB's own API with
    one of its client libraries, holding the one database values.database
    names and the containers values.containers declares. A consumer reads
    the account's host, port and endpoint and the database's name.

    The account takes requests authenticated with Microsoft Entra ID alone:
    its keys are turned off, so no key reaches a consumer and no credential
    slot is declared. A consumer authenticates as the managed identity it
    runs under, and the role assignment granting that identity access to
    the account's data is the operator's. Such an identity reads and writes
    items but creates no database or container, which Microsoft documents
    as management of the account's resources, so the database and its
    containers are declared here.

    Reach for it where the documents live in Azure and the application uses
    Azure Cosmos DB's own API; reach for core/datastore/azure-documentdb
    where it uses a MongoDB driver. The account's other APIs, for MongoDB,
    Apache Cassandra, Apache Gremlin and Table, are not offered.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which its service has no setting for and it does not read.
    Backup is the core/backup attachment: the service backs up every account
    on its own, and a realization configures that backup from the
    attachment, halting on a setting the service does not offer. A
    capability with no FeatureRecipe for core/backup halts on the
    attachment, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: document
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `docs: {}` keeps a working contract.
      database:
        type: string
        default: appdb
        description: The database the account holds, created with the account and published as database. A consumer names it, with a container, to reach its items. Azure Cosmos DB takes a name of 1 to 255 characters; a realization halts the build on a longer one, naming this key.
      containers:
        type: object
        default: {}
        additionalProperties:
          type: object
          properties:
            partition_key_paths:
              type: array
              items:
                type: string
              minItems: 1
              description: >
                The container's partition key: the path of the item property
                whose value places each item, such as /tenantId, or up to
                three paths for a hierarchical key, which Azure Cosmos DB
                takes in the order given. Each path begins with / and carries
                no wildcard and no trailing slash. A realization halts the
                build, naming this key, on a path the service refuses, and on
                more paths than the tool it deploys with can give a key.
          required: [partition_key_paths]
          additionalProperties: false
        description: >
          The database's containers, a map from each container's name to its
          settings, created with the database. A container's name is 1 to 255
          characters. The service fixes a container's partition key when it
          creates the container, so a changed key takes a new container. Left
          empty, the database holds none.
      consistency_level:
        type: string
        enum: [Strong, BoundedStaleness, Session, ConsistentPrefix, Eventual]
        default: Session
        description: >
          The account's default consistency level, how fresh a read is
          guaranteed to be, spelt as Azure Cosmos DB spells it, from the
          strongest: Strong reads the latest committed write;
          BoundedStaleness reads a write at most a bounded number of
          versions or seconds behind across regions, each realization's
          description giving the bounds; Session reads its own writes within
          a client's session; ConsistentPrefix never reads the writes of one
          transaction apart; Eventual guarantees no order. A client can
          override it for a request.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      ha:
        enabled:
          type: boolean
          default: false
          description: Keep the account available through the loss of an availability zone, with the service's zone redundancy for the account's region. The service offers it in a region with availability zones, and checks the region when it provisions.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The account's DNS name, which its API answers under. A realization
          publishes a pointer string the provisioning tool resolves once the
          account exists, so a consumer reads this rather than deriving one,
          or the DNS name the Release sets in infra.overrides.host instead.
      port:
        type: integer
        required: true
        description: TCP port the account's endpoint answers on, 443, over HTTPS. A client library in direct connection mode also opens connections to the service's replicas, on ports Microsoft documents as 10000 to 20000 over a public endpoint and any port over a private one, which a firewall admitting a consumer allows beside this one.
      endpoint:
        type: string
        description: >
          The account's URL as the service reports it, https:// followed by
          host and :443/, as a client library takes it to reach the account.
          It carries no credential.
      database:
        type: string
        description: The name of the database values.database names, which a consumer reaches the containers through.
