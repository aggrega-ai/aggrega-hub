apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/valkey
  version: 1.0.0
  description: >
    A Valkey in-memory key-value cache, speaking the Redis wire protocol. Used
    as a cache, entries live in memory and are not durably persisted, so the
    component renders as a stateless workload rather than a stateful one and
    declares no storage. Provider-agnostic: the same component is implemented
    by a Helm Recipe (Workload synthesis to native Kubernetes resources) and a Compose Recipe (local
    development). Exports its host and port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. Valkey authentication is off by
    # default; when a deployment attaches a credential here, the Recipe enables
    # password authentication and wires the password through the credential
    # subsystem. When unattached, the cache runs without authentication,
    # byte-identically to a Recipe with no slot at all. `required` omitted →
    # optional, so a bare `cache: {}` deployment still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional cache authentication credential. When attached, enables Valkey password authentication and supplies the password; unattached, the cache runs without authentication."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every knob
      # below is optional and unset by default, so a bare `cache: {}` deployment
      # is byte-identical to a component with an empty value surface. Defaults
      # left unset (rather than pinned to the built-in) keep the rendered cache
      # free of redundant flags until the developer expresses an intent.
      maxmemory:
        type: string
        description: Maximum memory the cache may use before eviction (the maxmemory directive, e.g. 256mb). Omit for no cap.
      maxmemory_policy:
        type: string
        description: Eviction policy applied when maxmemory is reached (the maxmemory-policy directive, e.g. allkeys-lru, volatile-ttl, noeviction). Omit to use the default.
      databases:
        type: integer
        min: 1
        description: Number of logical databases (the databases directive). Omit to use the default (16).
      appendonly:
        type: boolean
        default: false
        description: Enable append-only file (AOF) persistence. Pair with persistence.enabled for a durable volume; on an ephemeral cache the AOF is not retained across restarts.
      persistence:
        enabled:
          type: boolean
          default: false
          description: Run the cache as a durable StatefulSet with a persistent volume mounted at /data instead of the default ephemeral Deployment. Off by default — the cache role holds no durable state. Realized on the synthesized-Helm target; the Compose flavor is ephemeral.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 6379
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (6379).
      engine_version:
        type: string
        default: "8.1-alpine"
        description: Valkey container image tag. Selects the image tag on container targets; the chart-backed target pins its own engine version in the chart.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 1Gi
            description: Persistent volume size when persistence.enabled is set (synthesized-Helm target).
          type:
            type: string
            default: gp3
            description: Persistent volume storage class when persistence.enabled is set (synthesized-Helm target).
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
