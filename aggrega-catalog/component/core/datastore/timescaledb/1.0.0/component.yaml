apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/timescaledb
  version: 1.0.0
  description: >
    A time-series database on the PostgreSQL engine: PostgreSQL with the
    TimescaleDB extension, which adds hypertables — tables partitioned by a time
    column — and a columnstore for analytical queries over time ranges. Wire
    here when data arrives ordered by time and is queried over spans of it —
    metrics, events, telemetry; core/datastore/postgres is the general-purpose
    relational store, and core/datastore/documentdb the document store on the
    same engine. It presents the standard PostgreSQL wire contract and exports
    its host, port, user, database and protocol, so any consumer that speaks
    PostgreSQL reaches it unchanged.

    Realized three ways, all self-hosted: a Helm Recipe synthesizing a
    StatefulSet, a Compose Recipe for local development, and a Helm Recipe
    emitting a Cluster custom resource for the CloudNativePG control plane.
    Reach for the synthesized Recipes where nothing is installed in the target
    cluster; reach for the controller-driven Recipe where that control plane is
    in place and the cluster can mount an image as a volume. Only that Recipe
    serves Prometheus metrics; the synthesized Recipes publish those keys empty.

    On Azure no realization is authored: Azure Database for PostgreSQL flexible
    server carries the extension's Apache-licensed edition, but nothing its API
    offers enables it in a database; only CREATE EXTENSION does. The managed
    path there is core/datastore/postgres on terraform/postgres-flexible-server,
    with infra.overrides.server_configuration setting azure.extensions to
    TIMESCALEDB and shared_preload_libraries to timescaledb, and the application
    running CREATE EXTENSION timescaledb in its database.
  # The wire contract is the PostgreSQL image's: POSTGRES_USER,
  # POSTGRES_PASSWORD and POSTGRES_DB, on the PostgreSQL port, with the data
  # persisted on a volume, so the component is a stateful server. The
  # synthesized Helm Recipe emits the StatefulSet with a persistent volume and
  # a ClusterIP Service; the synthesized Recipes need no control plane and no
  # chart repository, and they build with nothing fetched. The
  # controller-driven Recipe's metrics come from the exporter the control plane
  # runs in every instance, and it publishes the pod label selector, port name
  # and path a scraper discovers them by.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # Every Recipe runs the server as a container in the Release's own
    # boundary — the synthesized ones directly, the controller-driven one through
    # a control plane installed in that same cluster — and none maps onto a
    # provider-managed service, so a single posture is this component's identity.
    # Selector-only: never stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The extension's source is split: the code outside its `tsl` directory is
    # published under the Apache License 2.0, and the code within it under the
    # vendor's own terms. Which set covers a given Release therefore follows the
    # image the realization runs — the tag `engine_version` selects on the
    # synthesized realizations, and `extension_image` on the controller-driven
    # one. Both defaults select an `-oss` build: the one that ships only the
    # Apache-licensed shared objects.
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: ["env"]
  featuresSchema:
    # Optional password credential slot. When a credential is attached
    # here, the Recipe wires the database password through the credential
    # subsystem; when unattached, the Recipe falls back to its inline default.
    # `required` omitted → optional, so a bare `metrics: {}` still
    # loads. Transparent (inject: [env]) so a synthesized Workload may reference
    # it as an env secret; the selector is secret-kind-pinned but family-agnostic
    # so either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional database password credential. When attached, supplies POSTGRES_PASSWORD via the credential subsystem. Unattached, compose/timescaledb and helm/timescaledb set POSTGRES_PASSWORD to the development literal `apppass`, which this catalog publishes, so every Release that leaves the slot unattached shares that password. The controller-driven realization owns the database's credentials through infra.credentials and halts the build when this slot is filled."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every key
      # carries a default where the engine has one, so a bare Release renders
      # without the developer choosing anything.
      database:
        type: string
        default: appdb
        description: Logical database name created on startup (POSTGRES_DB).
      user:
        type: string
        default: appuser
        description: Bootstrap superuser role created on startup (POSTGRES_USER), owner of the initial database.
      encoding:
        type: string
        description: Database encoding passed to initdb (e.g. UTF8). Omit to use the image default.
      locale:
        type: string
        description: Database locale passed to initdb (e.g. en_US.utf8). Omit to use the image default.
      custom_config:
        type: string
        description: >
          Raw server configuration block (postgresql.conf format). Applied as the
          server's configuration file, so settings it omits keep their built-in
          defaults. One setting is not read from this block: the extension's
          library must be preloaded at server start or the server refuses to
          start, so the synthesized Recipes pass the preload list as a server
          option, which takes precedence over the configuration file. Name any
          further libraries in extra_preload_libraries rather than here. The
          controller-driven realization takes server configuration as named
          settings rather than as a file and halts the build when this is set,
          naming the key it offers instead.
      extra_preload_libraries:
        type: string
        description: >
          Additional shared libraries to preload at server start, as a
          comma-separated list (e.g. pg_stat_statements). The extension's own
          library is always preloaded and does not need naming here; entries
          given here are appended to it. Every realization honors this — the
          synthesized ones as a server option, the controller-driven one as the
          preload list on the Cluster custom resource.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5432
        description: >
          Server listen port. Most operators should omit this and let the Recipe
          assign the default (5432). The controller-driven realization runs the
          server on 5432 and cannot move it, so it halts the build on any other
          value rather than handing a consumer a port the server does not answer
          on.
      engine_version:
        type: string
        default: "2.29.2-pg18-oss"
        description: >
          Server image tag the synthesized Recipes run. One compound coordinate
          carries three parts: the extension version, the PostgreSQL major
          version it is built against, and the edition suffix — so an operator
          supplies a value shaped like 2.29.2-pg18-oss rather than a bare major
          version. Dropping the -oss suffix selects the build that also carries
          the vendor-licensed shared objects. The controller-driven realization
          does not read this key: it runs a stock PostgreSQL server image and
          mounts the extension beside it as a second image, so its two
          coordinates are server_image and extension_image.
      # The product has no control plane of its own, so the controller-driven
      # realization runs it under the general-purpose PostgreSQL controller this
      # catalog already uses for core/datastore/postgres, with the extension
      # delivered as a second image the controller mounts into the server.
      server_image:
        type: string
        default: "ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie"
        description: >
          Full reference of the stock PostgreSQL server image the
          controller-driven realization runs. It carries no time-series
          extension of its own — the extension arrives as the separate image
          named in extension_image, which the controller mounts into this one.
          The two have to be built for the same PostgreSQL major version,
          operating-system distribution and processor architecture, or the
          extension's shared objects do not load, so the pair is chosen
          together. The default here is the build the default extension_image
          was itself built on: the CloudNativePG project builds its extension
          images on top of its own minimal PostgreSQL images, and the extension
          image records that base in its own metadata — PostgreSQL 18 on the
          Debian trixie base, the minimal build. So the reference has to name
          the minimal build specifically, not merely the right major version and
          base: a differently built image at the same major version and base
          presents a different set of shared libraries for the extension to link
          against. The default names a specific minor version rather than a tag
          that rolls, so the
          reference does not move under a Release. Set this key to move the pin —
          to another minor version, another base, or a digest reference — and
          move extension_image with it, since changing one side alone is what
          breaks the pairing. A build that sets this key empty halts naming it
          rather than emitting a Cluster with no server image. The synthesized
          Recipes ignore it and take their image from engine_version.
      extension_image:
        type: string
        default: "ghcr.io/cloudnative-pg/timescaledb-oss:2.29.2-18-trixie"
        description: >
          Full reference of the image carrying the time-series extension, which
          the controller-driven realization mounts into server_image as a
          volume. The default names the Apache-licensed build the CloudNativePG
          project publishes at the extension version this component targets, for
          PostgreSQL 18 on the Debian trixie base — which is the pairing the
          default server_image already names, so the two defaults match without
          an operator choosing either. It is pinned by tag: an image mounted as
          a volume is resolved by the target cluster rather than by the build,
          so whether a digest reference resolves on that path is the operator's
          to check against their own cluster. Set this key to move the pin — to
          another extension version, another base, or a digest reference that
          cluster resolves — and move server_image with it. The synthesized
          Recipes ignore it.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            description: >
              Storage class the database volume is provisioned from on
              Kubernetes, on both the synthesized and the controller-driven
              Recipe. Leave it unset to take the cluster's default storage class;
              set it to name another class the cluster offers. The Compose Recipe
              names no class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the CloudNativePG control plane is installed
          in the target cluster. The controller-driven realization halts the
          build unless this is set true, so a Cluster custom resource is never
          emitted as an orphan into a cluster that cannot reconcile it. The
          synthesized realizations ignore this flag.
      image_volumes_supported:
        type: boolean
        default: false
        description: >
          Operator affirmation that the target cluster can mount an image as a
          volume, which is how the controller-driven realization delivers the
          extension. Two things have to hold for it and neither implies the
          other: the cluster's ImageVolume feature, which is on by default from
          Kubernetes 1.35 and is enabled by hand on 1.33 and 1.34; and the
          container runtime the nodes run, which has to be containerd v2.1.0 or
          later, or CRI-O v1.31 or later. The runtime floor is a node-level one
          that no newer Kubernetes lifts, so check it against the nodes rather
          than reading it off the cluster version. The controller-driven
          realization halts the build unless this is set true, because an
          extension the cluster cannot mount leaves a server that starts without
          it. The synthesized realizations ignore this flag.
      credentials:
        type: string
        enum: [generated, supplied]
        default: generated
        description: >
          Who owns the database's credentials on the controller-driven
          realization. `generated` — the controller creates the Secret holding
          the owning role's password and owns it, which is what it does when
          nothing is supplied; the developer's `database` and `user` values are
          still honored, and no password reaches the rendered artifact.
          `supplied` — the controller reads that role's credentials from an
          existing Secret named in `credentials_secret` and generates none. The
          synthesized realizations ignore this key: they take the database
          password from the `password` credential slot.
      credentials_secret:
        type: string
        default: ""
        description: >
          Name of the existing Secret the controller-driven realization reads the
          database owner's credentials from when `credentials` is `supplied`. The
          Secret lives in the same namespace as the database, is of type
          `kubernetes.io/basic-auth`, and carries a `username` entry that must
          match `values.user` alongside a `password` entry holding that role's
          password. Leave it empty when `credentials` is `generated`; a
          controller-driven build halts if `supplied` is selected without it.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client opens its database connection to. On the in-cluster realizations it is the Service's DNS name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server accepts connections on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 5432.
      user:
        type: string
        description: >
          Name of the login role a consumer authenticates as. The matching
          password arrives through the credential attached to the component,
          never through this contract.
      database:
        type: string
        description: >
          Name of the logical database created at startup. A consumer names it
          in its connection string to land in the right database rather than
          the server's default.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `postgres`, so a
          consumer reaches the time-series tables with an ordinary PostgreSQL
          driver.
      # Where Prometheus finds the database's metrics. The server serves none of
      # its own. The CloudNativePG control plane runs an exporter in every
      # instance it manages, whatever the Cluster says: /metrics on a container
      # port named metrics, 9187, in plain HTTP with no caller check, a listener
      # that answers that one path and nothing else. No Service carries the port,
      # so the controller-driven realization publishes the label selector of the
      # instance pods, the port name and the path, for a scraper that discovers
      # those pods directly. The synthesized realizations run no exporter and
      # publish the three keys empty. None of the keys carries a namespace: a
      # scraper reads where the target runs from its own connection.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching every instance pod that serves the
          database's metrics, for a scraper that discovers those pods directly.
          Set by the controller-driven realization, beside `metrics_pod_port`
          and `metrics_path`; empty on the synthesized realizations, which serve
          no metrics.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `metrics`. Set and empty together with `metrics_pod_selector`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at on that port, `/metrics`. Set and empty
          together with `metrics_pod_selector`.
