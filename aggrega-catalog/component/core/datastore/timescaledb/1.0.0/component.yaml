apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/timescaledb
  version: 1.0.0
  description: >
    A time-series database on the PostgreSQL engine: PostgreSQL with the
    TimescaleDB extension, which adds hypertables — tables partitioned by a time
    column — and a columnstore for analytical queries over time ranges. It
    presents the standard PostgreSQL wire contract (POSTGRES_USER /
    POSTGRES_PASSWORD / POSTGRES_DB) on the PostgreSQL port and persists data on
    a volume, so it is a stateful server. Wire here when data arrives ordered
    by time and is queried over spans of it — metrics, events,
    telemetry; core/datastore/postgres is the general-purpose relational store
    for data that is not shaped that way, and core/datastore/documentdb is the
    document store built on the same engine. Exports its host, port, user,
    database, and protocol to consumers via the uses topology, so any consumer
    that speaks PostgreSQL reaches it unchanged. Realized self-hosted by a Helm
    Recipe (a StatefulSet with a persistent volume and a ClusterIP Service) and
    by a Compose Recipe for local development.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # Both Recipes run the server as a container in the deployment's own
    # boundary, and neither maps onto a provider-managed service, so a single
    # posture is this component's identity. Selector-only: never stamped onto
    # rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The extension's source is split: the code outside its `tsl` directory is
    # published under the Apache License 2.0, and the code within it under the
    # vendor's own terms. Which set covers a deployment therefore follows the
    # image tag `engine_version` selects, and the default selects an `-oss` tag
    # — the build that ships only the Apache-licensed shared objects.
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: ["env"]
  featuresSchema:
    # Optional password credential slot. When a credential is attached
    # here, the Recipe wires the database password through the credential
    # subsystem; when unattached, the Recipe falls back to its inline default.
    # `required` omitted → optional, so a bare `metrics: {}` still
    # loads. Transparent (inject: [env]) so a synthesized Workload may reference
    # it as an env secret; the selector is secret-kind-pinned but family-agnostic
    # so either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional database password credential. When attached, supplies POSTGRES_PASSWORD via the credential subsystem; unattached, the Recipe uses its inline default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every key
      # carries a default where the engine has one, so a bare deployment renders
      # without the developer choosing anything.
      database:
        type: string
        default: appdb
        description: Logical database name created on startup (POSTGRES_DB).
      user:
        type: string
        default: appuser
        description: Bootstrap superuser role created on startup (POSTGRES_USER), owner of the initial database.
      encoding:
        type: string
        description: Database encoding passed to initdb (e.g. UTF8). Omit to use the image default.
      locale:
        type: string
        description: Database locale passed to initdb (e.g. en_US.utf8). Omit to use the image default.
      custom_config:
        type: string
        description: >
          Raw server configuration block (postgresql.conf format). Applied as the
          server's configuration file, so settings it omits keep their built-in
          defaults. One setting is not read from this block: the extension's
          library must be preloaded at server start or the server refuses to
          start, so the Recipe passes the preload list as a server option, which
          takes precedence over the configuration file. Name any further
          libraries in extra_preload_libraries rather than here.
      extra_preload_libraries:
        type: string
        description: >
          Additional shared libraries to preload at server start, as a
          comma-separated list (e.g. pg_stat_statements). The extension's own
          library is always preloaded and does not need naming here; entries
          given here are appended to it.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5432
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (5432).
      engine_version:
        type: string
        default: "2.29.2-pg17-oss"
        description: >
          Server image tag. One compound coordinate carries three parts: the
          extension version, the PostgreSQL major version it is built against,
          and the edition suffix — so an operator supplies a value shaped like
          2.29.2-pg17-oss rather than a bare major version. Dropping the -oss
          suffix selects the build that also carries the vendor-licensed shared
          objects.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            default: gp3
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client opens its database connection to. On the in-cluster realizations it is the Service's DNS name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server accepts connections on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 5432.
      user:
        type: string
        description: >
          Name of the login role a consumer authenticates as. The matching
          password arrives through the credential attached to the component,
          never through this contract.
      database:
        type: string
        description: >
          Name of the logical database created at startup. A consumer names it
          in its connection string to land in the right database rather than
          the server's default.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `postgres`, so a
          consumer reaches the time-series tables with an ordinary PostgreSQL
          driver.
