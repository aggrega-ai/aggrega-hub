apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/firestore
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Firestore is a hosted service
  # the reader contracts for with Google Cloud, under Google Cloud's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The database's behaviour follows Firestore's documentation: "Choose
  # between Firestore APIs" (a database created for Datastore compatibility
  # accepts Datastore API requests and denies Firestore API requests), the
  # Firestore and Datastore REST references (the service endpoints
  # firestore.googleapis.com and datastore.googleapis.com), and the REST
  # reference of a database (the rule for a database ID).
  description: >
    One Firestore database: Google Cloud's managed document database, which
    a client reaches through a Google API with a client library, naming the
    database beside its project. values.type chooses the API the database
    serves: FIRESTORE_NATIVE, documents in collections, reached at
    firestore.googleapis.com, or DATASTORE_MODE, entities of kinds, reached
    at datastore.googleapis.com. A consumer reads the endpoint's host, port
    and endpoint, and the database's ID.

    Firestore takes no password: a client signs each request as the Google
    identity it runs under, and the IAM role granting that identity access
    to the database is the operator's, so no credential slot is declared.
    Firestore speaks its own API and publishes no protocol.

    Reach for it where an application keeps documents or entities it reads
    and writes by key and query in Google Cloud. Indexes, field
    configurations and time-to-live policies are not offered.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which its service has no setting for and it does not read.
    Backup is the core/backup attachment: a realization configures the
    database's scheduled backups and point-in-time recovery from it, halting
    on a setting they do not offer. A capability with no FeatureRecipe for
    core/backup halts on the attachment, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: document
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # Developer Intent — filled by the Developer in the Aggregate. Each value
    # carries a default or may be omitted, so a bare `catalog: {}` keeps a
    # working contract: a database of the instance's name, serving the
    # Firestore API. The block is written as an object with its properties,
    # because a property named type is read as a schema keyword in the
    # compact form.
    values:
      type: object
      properties:
        database:
          type: string
          min: 4
          max: 63
          pattern: "^([a-z][a-z0-9-]*[a-z0-9]|\\(default\\))$"
          description: >
            The database's ID, the last segment of its resource name,
            projects/<project>/databases/<database>, which a client names
            beside its project and which is published as database: 4 to 63
            lowercase letters, digits and hyphens, beginning with a letter
            and ending with a letter or a digit, and not shaped like a UUID,
            as Firestore names a database; or (default), the database a
            client library reaches when it names none. Unset, the database
            takes the instance's name, which the same rule then holds.
            Firestore fixes a database's ID when it creates the database, so
            a changed ID takes a new database.
        type:
          type: string
          enum: [FIRESTORE_NATIVE, DATASTORE_MODE]
          default: FIRESTORE_NATIVE
          description: >
            The API the database serves, spelt as Firestore spells it:
            FIRESTORE_NATIVE, documents in collections, through the
            Firestore API at firestore.googleapis.com; or DATASTORE_MODE,
            entities of kinds, through the Datastore API at
            datastore.googleapis.com, for an application written against
            Datastore. A database serves one API and denies requests through
            the other.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The name of the Google API endpoint the database answers at:
          firestore.googleapis.com for a database of type FIRESTORE_NATIVE,
          datastore.googleapis.com for one of type DATASTORE_MODE. Every
          database of either type answers at that name, which is the
          service's own and none of the operator's choosing; a client tells
          its database from another by the project and database it names.
      port:
        type: integer
        required: true
        description: TCP port the endpoint answers on, 443, over HTTPS.
      endpoint:
        type: string
        description: The endpoint's URL, https:// followed by host, as a Google Cloud client library takes it. It carries no credential.
      database:
        type: string
        required: true
        description: The database's ID, which a client names beside its project, as a client library's database setting takes it.

  # Firestore's rule for a database ID: 4 to 63 lowercase letters, digits and
  # hyphens, opening with a letter and closing with a letter or a digit, and
  # not of the form of a UUID, or (default) (the REST reference of a
  # database). The schema holds values.database to the characters and the
  # length; this holds the instance's name to the same rule where it stands
  # in, and either to the UUID exclusion, which a pattern without lookahead
  # cannot state.
  assertions:
    database_id: >-
      {{- $set := optional .values "database" "" -}}
      {{- $id := default .metadata.instance_id $set -}}
      {{- if not $set -}}
      {{- if not (regexMatch `^[a-z][a-z0-9-]{2,61}[a-z0-9]$` $id) -}}
      {{- fail (printf "values.database is unset, so the database takes the instance's name, %q, and Firestore takes a database ID of 4 to 63 lowercase letters, digits and hyphens, beginning with a letter and ending with a letter or a digit: set values.database in the Aggregate, or rename the instance" $id) -}}
      {{- end -}}
      {{- end -}}
      {{- if regexMatch `^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$` $id -}}
      {{- fail (printf "the database's ID is %q, which has the form of a UUID, and Firestore refuses a database ID of that form: set values.database in the Aggregate to another ID" $id) -}}
      {{- end -}}
