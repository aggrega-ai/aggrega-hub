apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/bedrock-knowledge-bases
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon Bedrock Knowledge
  # Bases is a hosted service the reader contracts for with AWS, under AWS's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The knowledge base's behaviour follows the Amazon Bedrock User Guide,
  # "Retrieve data and generate AI responses with Amazon Bedrock Knowledge
  # Bases", "Build a knowledge base with vector stores", "Prerequisites for
  # using a vector store you created for a knowledge base" and "Delete a
  # data source from your Amazon Bedrock knowledge base"; and the Amazon
  # Bedrock API Reference: CreateKnowledgeBase (the rule for a knowledge
  # base's name) and CreateDataSource.
  description: >
    One Amazon Bedrock knowledge base over a vector store the operator
    already has: Amazon Bedrock splits the documents of a data source into
    chunks, turns each into an embedding with the embedding model the
    operator names, writes them into that store, and answers a query with
    the chunks closest in meaning. A client calls Retrieve, or
    RetrieveAndGenerate, at the Bedrock agent runtime endpoint of the
    knowledge base's Region, naming knowledge_base_id, and an Amazon
    Bedrock agent names it among the knowledge bases it consults. A
    consumer reads the endpoint's host, port and endpoint, and the
    knowledge base's ID and ARN.

    The vector store and its index, the IAM role Amazon Bedrock assumes and
    the S3 bucket holding the documents are the operator's, and so is the
    choice of embedding model: each Recipe reads them under infra.overrides
    and creates none. Where the operator names a bucket, a data source over
    it is created with the knowledge base; its documents reach the store when
    the operator starts a sync, outside the Release. A client signs each
    request as the AWS identity it runs under, so no credential slot is
    declared, and no protocol is published.

    Reach for it where an application or a Bedrock agent retrieves
    passages from documents by meaning in AWS. A knowledge base whose
    store Amazon Bedrock runs itself, one over an Amazon Kendra index or a
    structured store, and data sources other than an S3 bucket are not
    offered.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which stores it takes. A knowledge base keeps no documents
    or embeddings of its own: they are the bucket's and the store's, so a
    core/backup attachment halts, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The knowledge base turns the documents it ingests into a memory an
    # agent retrieves from by meaning: it takes no vector from its clients
    # and offers no vector index of its own, which vector would claim.
    datastore.aggrega.ai/engine: semantic-memory
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads, each spelt as that Recipe's header lists it, and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The name of the Amazon Bedrock agent runtime endpoint in the
          knowledge base's Region, such as
          bedrock-agent-runtime.us-east-1.amazonaws.com, under the domain of
          the Region's partition. A realization publishes a pointer string the
          provisioning tool resolves to the Region it creates the knowledge
          base in. The endpoint offers no custom domain, so every name it
          answers under is one of the service's own and none is the
          operator's choice; this is the name offered for it.
      port:
        type: integer
        required: true
        description: TCP port the endpoint answers on, 443, over HTTPS.
      endpoint:
        type: string
        description: The endpoint's URL, https:// followed by host, as an AWS SDK takes it. It carries no credential.
      knowledge_base_id:
        type: string
        required: true
        description: >
          The knowledge base's ID, ten letters and digits Amazon Bedrock
          assigns, which Retrieve and RetrieveAndGenerate name and an Amazon
          Bedrock agent names among the knowledge bases it consults.
      arn:
        type: string
        description: The knowledge base's ARN, arn:<partition>:bedrock:<region>:<account>:knowledge-base/<id>, which an IAM policy granting a consumer Retrieve on the knowledge base names as its resource.

  assertions:
    # The knowledge base, and the data source a Recipe creates beside it,
    # take the instance's name, and Amazon Bedrock takes a name of letters
    # and digits, each followed by at most one underscore or hyphen, 100 of
    # them at most (CreateKnowledgeBase and CreateDataSource): a name
    # opening with a separator, or holding two in a row, is refused.
    knowledge_base_name: >-
      {{- if not (regexMatch `^([0-9a-zA-Z][_-]?){1,100}$` .metadata.instance_id) -}}
      {{- fail (printf "the knowledge base takes the instance's name, %q, and Amazon Bedrock takes a knowledge base name of 1 to 100 letters and digits, each followed by at most one underscore or hyphen: rename the instance in the Aggregate" .metadata.instance_id) -}}
      {{- end -}}
