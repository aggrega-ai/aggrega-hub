apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/mysql-innodb-cluster
  version: 1.0.0
  description: >
    A MySQL InnoDB Cluster, realized as an InnoDBCluster custom resource the MySQL
    Operator for Kubernetes reconciles. The emitted custom resource requests a
    count of MySQL server instances and a count of MySQL Router instances, and the
    controller acts on that request inside the target cluster — so what this
    component describes is what is asked for, never what ends up running. What it
    publishes is root access at an in-cluster address: the controller establishes
    the root account from the Secret the custom resource names, and creates
    neither a logical database nor an application user, so this component declares
    neither and whoever holds root creates the schemas and accounts an application
    needs. Reach for core/datastore/mysql where the application wants a logical
    database and a login role created for it, and where nothing may need
    installing first — its synthesized Recipe needs no controller and no chart
    repository, so it builds with nothing fetched. Reach for this component where
    the MySQL Operator control plane is already installed in the target cluster,
    which core/datastore/mysql-operator declares and installs.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides
  # keys into env or file delivery mechanisms.
  inject: [env, file]

  # One credential slot, and it is optional rather than required because it is
  # read in exactly one of the two credential custodies below. Attaching it while
  # the Secret is supplied would reach no emitted byte, so the realization halts
  # on that combination rather than dropping the attachment quietly.
  featuresSchema:
    root_password:
      sensitive: true
      inject: []
      description: Root account password. Read when `infra.credentials` is `generated`, to fill the Secret the custom resource names. Leave it unattached when the Secret is supplied.

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      charset:
        type: string
        default: utf8mb4
        description: Default character set. Written into the server configuration the custom resource carries.
      collation:
        type: string
        default: utf8mb4_general_ci
        description: Default collation. Written into the server configuration the custom resource carries.
      custom_config:
        type: string
        description: Raw server configuration block (my.cnf format). Appended verbatim to the server configuration the custom resource carries.

    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer never sees this.
      engine_version:
        type: string
        default: "8.4.0"
        description: >
          MySQL Server version the custom resource requests. The custom resource
          accepts a three-part version — major, minor and patch, optionally
          followed by a suffix — so a two-part value renders and is then rejected
          when the resource is applied. A build halts on a value the custom
          resource would reject.
      server_instances:
        type: integer
        min: 1
        max: 9
        default: 1
        description: >
          Number of MySQL server instances the custom resource requests. One is
          the custom resource's own default and nine is the highest it accepts.
      router_instances:
        type: integer
        min: 1
        default: 1
        description: >
          Number of MySQL Router instances the custom resource requests. One is
          the custom resource's own default. The published address is the Service
          the routers answer on, so this component does not offer a request of
          zero: an address nothing answers on would render as cleanly as one that
          works.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the MySQL Operator control plane is installed
          in the target cluster. The build halts unless this is set true, so an
          InnoDBCluster custom resource is never emitted as an orphan into a
          cluster that cannot reconcile it.
      credentials:
        type: string
        enum: [generated, supplied]
        default: supplied
        description: >
          Who owns the Secret holding the cluster's root account — the Secret the
          custom resource names and the controller reads. `supplied` — the Secret
          already exists in the target cluster and is named in
          `credentials_secret`; nothing is rendered for it and no password reaches
          the rendered artifact. `generated` — the Secret is rendered beside the
          custom resource from the credential attached to the `root_password`
          slot, so the password is carried in the rendered output. `supplied` is
          the default because the controller establishes the root account from a
          Secret it is pointed at and creates none of its own.
      credentials_secret:
        type: string
        default: ""
        description: >
          Name of the existing Secret the controller reads the root account from
          when `credentials` is `supplied`. The Secret lives in the same namespace
          as the cluster and carries the account's user name, host and password
          under the keys `rootUser`, `rootHost` and `rootPassword`. Leave it empty
          when `credentials` is `generated`; a build halts if `supplied` is
          selected without it.

    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client opens its database connection to. The controller
          creates a Service under the custom resource's own name, and that bare
          in-cluster name is what is published; a consumer in another namespace
          qualifies it with that namespace on its own side.
      port:
        type: integer
        required: true
        description: >
          TCP port the published address accepts connections on. The custom
          resource carries no field that moves it, so it is the port the
          controller publishes by default.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `mysql`, which is what a consumer selects a driver for.
