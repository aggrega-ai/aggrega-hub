apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/elasticsearch
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below. Elastic publishes
  # the image every Recipe runs under the Elastic License 2.0: the image's own
  # licence label names it, and so does the licence file it carries.
  license: Elastic-2.0
  description: >
    An Elasticsearch search and analytics engine. Indexes documents for
    full-text and analytical queries and indexes embedding vectors beside them
    in dense-vector fields, answering similarity searches, so a component that
    retrieves by similarity can be wired here. Indexes are created through
    Elasticsearch's own API at runtime; the component declares the server, not
    its contents. It runs as one node.

    Exports its host, port, protocol, an endpoint joining them and the account a
    client signs in as. Authentication stays on with the built-in superuser,
    elastic: its password is the attached credential, which the Kubernetes
    Recipe reads from its Secret by reference, and with none attached it is a
    development default that attaching one replaces. The server's own
    first-start setup, which generates certificates and prints a password, is
    switched off. The API is served over plain HTTP, not encrypted, and is
    reachable only inside the Release.

    Elastic publishes the image under the Elastic License 2.0. Realized on
    Kubernetes by a Recipe that synthesizes the server from that image, and by a
    Compose Recipe for local development; the host's vm.max_map_count kernel
    setting is the operator's to raise. Its Recipes are verified by their
    rendered output, not by a started server.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: Elasticsearch is a search and analytics engine whose identity is
    # search over the documents it indexes, and no value supplied makes it
    # something else. That is why it sits on the component itself. Every
    # vector-store socket in the standard library admits `search` beside `vector`
    # and `semantic-memory`, because the engine answers similarity searches too.
    datastore.aggrega.ai/engine: search
    # Both Recipes run the server as a container in the Release's own boundary,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    # The class of the licence the image is published under, the Elastic License
    # 2.0, in this label's value set.
    component.aggrega.ai/upstream-licensing: source-available
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  # infra.port is the REST API's port. The server also listens on 9300 for its
  # transport layer and, once it is ready to serve, on 8080 for the readiness
  # check both Recipes run, so a REST port equal to either would leave the
  # server unable to start. The build halts naming the key instead. It holds
  # whichever Recipe binds, so it is stated once, here.
  assertions:
    port_leaves_the_server_its_other_ports: >-
      {{- $port := int (optional .infra "port" 9200) -}}
      {{- if or (eq $port 9300) (eq $port 8080) -}}
      {{- fail (printf "infra.port is %d, a port the Elasticsearch server already listens on: 9300 carries its transport layer and 8080 its readiness check, so set infra.port to another port such as 9200" $port) -}}
      {{- end -}}
  featuresSchema:
    # Optional password credential slot: the password of `elastic`, the server's
    # built-in superuser and the account a client signs in as. Authentication is
    # never switched off. When a credential is attached here, its value is that
    # password; unattached, the password is the development default `apppass`,
    # the same for every reader of the catalog, which attaching a credential
    # replaces. `required` omitted → optional, so a bare `search: {}` still loads.
    # Transparent (inject: [env]) so the injected value reaches the Recipe on the
    # env pipe; the selector is secret-kind-pinned but family-agnostic. The Helm
    # Recipe reads the credential from the Secret it names, and halts on a
    # credential that names none; the Compose Recipe reads the value its
    # credential delivers.
    #
    # The server takes the password as its bootstrap password each time its
    # container is created — on Kubernetes, at every pod start — and the
    # superuser signs in with it until a password is set for it through the
    # security API, which then takes precedence. The server's other built-in
    # accounts have no password until one is set that way, so none of them can
    # sign in. The setup the image runs at a first start — generating
    # certificates, printing a password and an enrollment token — is switched off
    # by every Recipe, so nothing it would print is ever the password in force.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password of the server's built-in superuser, elastic. When attached, the Kubernetes Recipe reads it from the credential's Secret by reference and the Compose Recipe writes the value the credential delivers; unattached, compose/elasticsearch and helm/elasticsearch set it to the development literal `apppass`, which this catalog publishes, so every Release that leaves the slot unattached shares that password, and attaching a credential replaces it."
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9200
        description: >
          Port the server's REST API is published on. Most operators should omit
          this and let the Recipe assign the default (9200). The server listens
          on it on both targets; on Kubernetes it is also the Service port. It
          must differ from 9300 and 8080, which the server already listens on;
          the build halts otherwise.
      engine_version:
        type: string
        # Pinned by tag and by the digest of the image's index, so every platform
        # Elastic publishes resolves to the build read when this default was set.
        # A Release may name another tag, with or without a digest.
        default: "9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984"
        description: >
          Tag of the docker.elastic.co/elasticsearch/elasticsearch image every
          Recipe runs, optionally followed by @ and the digest it must resolve
          to. The Recipes configure the server through the settings of the 9.x
          releases; another release may need other ones.
      compute:
        # The server sizes its own Java heap from the memory it is given — half
        # of it, above 1 GB — and the product's own Kubernetes distribution gives
        # a node 2 GB so that the heap is 1 GB. Less than that may stop it
        # starting.
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 2Gi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 8Gi
            description: >
              Size of the volume holding the server's indexes on Kubernetes. The
              Compose Recipe creates the volume and honors no size, the target
              having no volume-size concept.
          type:
            type: string
            description: >
              Storage class the server's volume is provisioned from on Kubernetes.
              Leave it unset to take the cluster's default storage class; set it
              to name another class the cluster offers. The Compose Recipe names no
              class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client connects to. On Kubernetes it is the Service's DNS name, and on Compose the service name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server's REST API answers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 9200.
      user:
        type: string
        description: >
          Name of the account a client signs in as — `elastic`, the server's
          built-in superuser. The matching password arrives through the
          credential attached to the component, never through this contract.
      protocol:
        type: string
        description: >
          Scheme a client composes the server's address with — `http`, as in
          http://<host>:<port>; the REST API is served over HTTP.
      endpoint:
        type: string
        description: >
          The server's address as one URI, http://<host>:<port>, for a client
          that takes one address rather than its parts. It carries no
          credential.
