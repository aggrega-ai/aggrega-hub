apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/qdrant
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    A Qdrant vector database. Stores embedding vectors alongside their payloads
    and answers nearest-neighbour queries over them, so an application that
    retrieves reference material by similarity is wired to this component rather
    than to a general-purpose store. Collections are created through Qdrant's own
    API at runtime; the component declares the server, not its contents.
    Provider-agnostic: the same component is implemented by a Helm Recipe
    (Workload synthesis to native Kubernetes resources, running the official
    upstream image with no external chart) and a Compose Recipe (local
    development). Exports its host, its HTTP port and its gRPC port to consumers
    via the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: Qdrant is a vector search engine, and no value supplied makes
    # it something else. That is why it sits on the component
    # rather than on a specialization — the same standing the operational
    # primitive has. A general-purpose store whose vector capability arrives with
    # an extension is the opposite case, and carries the value on a
    # specialization or through the label-transform role instead.
    datastore.aggrega.ai/engine: vector
    # Both Recipes run the server as containers in the deployment's own cluster,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional API-key credential slot. Qdrant serves without authentication by
    # default; when a credential is attached here, the Recipe supplies
    # it as the service API key and every request must present it. `required`
    # omitted → optional, so a bare `vectors: {}` still loads, and
    # with nothing attached the render is byte-identical to a Recipe carrying no
    # slot at all. Transparent (inject: [env]) so the injected value reaches the
    # Recipe on the env pipe; the selector is secret-kind-pinned but
    # family-agnostic, so either a referenceable Secret (helm secretKeyRef) or an
    # inject-value (compose inject pipe) may fill it.
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional service API-key credential. When attached, every request to the server must present this key; unattached, the server accepts unauthenticated requests."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every knob
      # below is unset by default, so a bare `vectors: {}` renders
      # free of redundant settings and keeps the server's own built-in defaults.
      log_level:
        type: string
        description: Server log verbosity (TRACE, DEBUG, INFO, WARN or ERROR). Omit to use the server default (INFO).
      max_request_size_mb:
        type: integer
        min: 1
        description: Largest request body the server accepts, in mebibytes. Omit to use the server default (32).
      telemetry_disabled:
        type: boolean
        default: false
        description: Stop the server reporting anonymous usage telemetry to its maintainers. Off by default, matching the server's own default.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 6333
        description: HTTP (REST) listen port. Most operators should omit this and let the Recipe assign the default (6333).
      grpc_port:
        type: integer
        min: 1024
        max: 65535
        default: 6334
        description: gRPC listen port, published alongside the HTTP port for clients that prefer it. Most operators should omit this and let the Recipe assign the default (6334).
      engine_version:
        type: string
        default: "v1.19.0"
        description: Qdrant container image tag.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
            description: Persistent volume size for the vector data. Realized on the synthesized-Helm target; the Compose flavor is ephemeral.
          type:
            type: string
            default: gp3
            description: Persistent volume storage class for the vector data. Realized on the synthesized-Helm target; the Compose flavor is ephemeral.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host and port are the pair an ai-agent's knowledge-base socket reads.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      grpc_port: { type: integer }
      protocol: { type: string }
