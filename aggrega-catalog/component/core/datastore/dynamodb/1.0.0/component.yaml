apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/dynamodb
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon DynamoDB is a hosted
  # service the reader contracts for with AWS, under AWS's terms, which no
  # SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Amazon DynamoDB table: AWS's managed key-value and document
    database, which a client reaches through DynamoDB's own HTTPS API with an
    AWS SDK, at the service's endpoint in the table's Region. The table is
    keyed by values.key_schema, its key attributes typed by
    values.attribute_definitions, with the global secondary indexes
    values.global_secondary_indexes declares. A consumer reads the endpoint's
    host, port and endpoint, and the table's name and ARN.

    DynamoDB takes no password: a client signs each request as the AWS
    identity it runs under, and the IAM policy granting that identity access
    to the table is the operator's, so no credential slot is declared.
    DynamoDB speaks its own API, not the Redis protocol, and publishes no
    protocol.

    Reach for it where an application keeps items it reads and writes by
    key in AWS. Streams, local secondary indexes, time to live, global tables
    and vector indexes are not offered.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which its service has no setting for and it does not read.
    Backup is the core/backup attachment: a realization turns on the table's
    point-in-time recovery from it, halting on a setting point-in-time
    recovery does not offer. A capability with no FeatureRecipe for
    core/backup halts on the attachment, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The key
      # and its attribute carry a default, so a bare `orders: {}` keeps a
      # working contract: a table keyed by the string attribute id.
      table_name:
        type: string
        min: 3
        max: 255
        pattern: "^[a-zA-Z0-9_.-]+$"
        description: >
          The table's name, published as table_name, which a client names in
          every call: 3 to 255 letters, digits, underscores, hyphens and
          periods, as DynamoDB names a table, unique among the tables of its
          account and Region. Unset, the table takes the instance's name, which
          the same rule then holds. DynamoDB fixes a table's name when it
          creates the table, so a changed name takes a new table.
      key_schema:
        type: array
        min: 1
        max: 2
        default:
          - attribute_name: id
            key_type: HASH
        items:
          type: object
          properties:
            attribute_name:
              type: string
              min: 1
              max: 255
              description: The key attribute's name, which attribute_definitions types.
            key_type:
              type: string
              enum: [HASH, RANGE]
              description: HASH for the partition key, RANGE for the sort key, spelt as DynamoDB spells them.
          required: [attribute_name, key_type]
          additionalProperties: false
        description: >
          The table's primary key, as DynamoDB orders it: the partition key
          first, with key_type HASH, and optionally the sort key second, with
          key_type RANGE. Items sharing a partition key are kept in sort key
          order. DynamoDB fixes a table's key when it creates the table, so a
          changed key takes a new table.
      attribute_definitions:
        type: array
        min: 1
        default:
          - attribute_name: id
            attribute_type: S
        items:
          type: object
          properties:
            attribute_name:
              type: string
              min: 1
              max: 255
              description: The name of an attribute a key names.
            attribute_type:
              type: string
              enum: [S, N, B]
              description: The attribute's type, spelt as DynamoDB spells it, S for a string, N for a number, B for binary data.
          required: [attribute_name, attribute_type]
          additionalProperties: false
        description: >
          The type of each attribute a key names, the table's and each
          index's, and of no other attribute: beyond its keys a DynamoDB table
          holds items of any shape, and DynamoDB refuses a definition no key
          names, so the build halts, naming this key, when the attributes
          listed here and those the keys name differ.
      global_secondary_indexes:
        type: array
        default: []
        items:
          type: object
          properties:
            index_name:
              type: string
              min: 3
              max: 255
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: The index's name, unique among the table's indexes, under the rule a table's name follows.
            key_schema:
              type: array
              min: 1
              max: 2
              items:
                type: object
                properties:
                  attribute_name:
                    type: string
                    min: 1
                    max: 255
                    description: The key attribute's name, which attribute_definitions types.
                  key_type:
                    type: string
                    enum: [HASH, RANGE]
                    description: HASH for the index's partition key, RANGE for its sort key.
                required: [attribute_name, key_type]
                additionalProperties: false
              description: The index's key, ordered as the table's, a partition key and an optional sort key, over any attributes attribute_definitions types.
            projection:
              type: object
              properties:
                projection_type:
                  type: string
                  enum: [ALL, KEYS_ONLY, INCLUDE]
                  description: >
                    Which attributes the index copies from the table, spelt as
                    DynamoDB spells it: ALL of them, KEYS_ONLY the table's and
                    the index's keys, or INCLUDE those keys and the attributes
                    non_key_attributes names.
                non_key_attributes:
                  type: array
                  min: 1
                  max: 20
                  items:
                    type: string
                    min: 1
                    max: 255
                  description: >
                    Under INCLUDE, the attributes the index copies beside the
                    keys, as DynamoDB takes them: 1 to 20 for an index, and 100
                    at most across every index of the table. The build halts,
                    naming this key, on a list under ALL or KEYS_ONLY, which
                    would copy nothing more, and on INCLUDE without one.
              required: [projection_type]
              additionalProperties: false
          required: [index_name, key_schema, projection]
          additionalProperties: false
        description: >
          The table's global secondary indexes, each serving queries by a key
          of its own over a copy of the table's items, which DynamoDB keeps up
          to date as items are written. Each takes the table's billing mode,
          and under PROVISIONED the read and write capacity the table is
          provisioned with. Left empty, the table has none.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      billing_mode:
        type: string
        enum: [PAY_PER_REQUEST, PROVISIONED]
        default: PAY_PER_REQUEST
        description: >
          How the table's throughput is billed, spelt as DynamoDB spells it:
          PAY_PER_REQUEST, on-demand, billed for each request and serving what
          the requests ask for; or PROVISIONED, a read and write capacity set
          ahead of time, which each Recipe's description names the overrides
          for.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other; a CloudFormation Recipe reads each in the property's own spelling, a terraform Recipe in the module input's.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The name of DynamoDB's endpoint in the table's Region, such as
          dynamodb.eu-west-1.amazonaws.com, under the domain of the Region's
          partition, amazonaws.com.cn in China. A realization publishes a
          pointer string the provisioning tool resolves to the Region it
          creates the table in. DynamoDB offers no custom domain, so every name it
          answers under is one of the service's own and none is the
          operator's choice; this is the name offered for it.
      port:
        type: integer
        required: true
        description: TCP port the endpoint answers on, 443, over HTTPS.
      endpoint:
        type: string
        description: The endpoint's URL, https:// followed by host, as an AWS SDK takes it. It carries no credential.
      table_name:
        type: string
        description: The table's name, which a client names in every call.
      arn:
        type: string
        description: The table's ARN, arn:<partition>:dynamodb:<region>:<account>:table/<name>, which an IAM policy granting a consumer access to the table names as its resource.

  # The rules DynamoDB holds a table's keys and indexes to, which every
  # realization's table is created under. Each halts the build naming the key
  # rather than leaving the table's creation to fail.
  assertions:
    # A table takes its name from values.table_name, or else the instance's
    # name, and DynamoDB takes a table name of 3 to 255 letters, digits,
    # underscores, hyphens and periods. The schema holds values.table_name to
    # that rule; this holds the instance's name to it where it stands in.
    table_name_from_instance: >-
      {{- if not (optional .values "table_name" "") -}}
      {{- if not (regexMatch `^[a-zA-Z0-9_.-]{3,255}$` .metadata.instance_id) -}}
      {{- fail (printf "values.table_name is unset, so the table takes the instance's name, %q, and DynamoDB takes a table name of 3 to 255 letters, digits, underscores, hyphens and periods: set values.table_name in the Aggregate, or give the instance a name of 3 characters or more" .metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
    # DynamoDB takes a key as one entry with key_type HASH, the partition key,
    # or two, HASH then RANGE, the sort key: the table's key and each index's
    # alike.
    keys_ordered: >-
      {{- $keys := list (list "values.key_schema" .values.key_schema) -}}
      {{- range $i, $g := .values.global_secondary_indexes -}}
      {{- $keys = append $keys (list (printf "values.global_secondary_indexes[%d].key_schema" $i) $g.key_schema) -}}
      {{- end -}}
      {{- range $k := $keys -}}
      {{- $types := list -}}
      {{- range (index $k 1) }}{{ $types = append $types .key_type }}{{ end -}}
      {{- if not (has (join "," $types) (list "HASH" "HASH,RANGE")) -}}
      {{- fail (printf "%s gives its keys the key types %s, and DynamoDB takes a partition key, key_type HASH, first, and optionally a sort key, key_type RANGE, second: correct %s in the Aggregate" (index $k 0) (join ", " $types) (index $k 0)) -}}
      {{- end -}}
      {{- end -}}
    # DynamoDB refuses a table whose attribute definitions are not exactly the
    # attributes its keys and its indexes' keys name: a key attribute needs
    # its type, and a definition no key names is refused.
    attributes_match_keys: >-
      {{- $named := list -}}
      {{- range .values.key_schema }}{{ $named = append $named .attribute_name }}{{ end -}}
      {{- range .values.global_secondary_indexes }}{{ range .key_schema }}{{ $named = append $named .attribute_name }}{{ end }}{{ end -}}
      {{- $defined := list -}}
      {{- range .values.attribute_definitions -}}
      {{- if has .attribute_name $defined -}}
      {{- fail (printf "values.attribute_definitions types the attribute %q twice, and DynamoDB takes one definition for each attribute: keep one in the Aggregate" .attribute_name) -}}
      {{- end -}}
      {{- $defined = append $defined .attribute_name -}}
      {{- end -}}
      {{- range $n := $named -}}
      {{- if not (has $n $defined) -}}
      {{- fail (printf "a key names the attribute %q, and values.attribute_definitions gives it no type, which DynamoDB needs for every key attribute: add it to values.attribute_definitions in the Aggregate, with attribute_type S, N or B" $n) -}}
      {{- end -}}
      {{- end -}}
      {{- range $d := $defined -}}
      {{- if not (has $d $named) -}}
      {{- fail (printf "values.attribute_definitions types the attribute %q, which no key of the table or of its indexes names, and DynamoDB takes definitions for key attributes alone: remove it from values.attribute_definitions in the Aggregate" $d) -}}
      {{- end -}}
      {{- end -}}
    # An index's name is unique among the table's indexes; INCLUDE copies the
    # attributes non_key_attributes names, which mean nothing under ALL or
    # KEYS_ONLY; and DynamoDB takes 100 such attributes at most across every
    # index of the table.
    indexes_projected: >-
      {{- $names := list -}}{{- $included := 0 -}}
      {{- range $i, $g := .values.global_secondary_indexes -}}
      {{- if has $g.index_name $names -}}
      {{- fail (printf "values.global_secondary_indexes names two indexes %q, and DynamoDB takes a name once among a table's indexes: rename one in the Aggregate" $g.index_name) -}}
      {{- end -}}
      {{- $names = append $names $g.index_name -}}
      {{- $nka := optional $g.projection "non_key_attributes" list -}}
      {{- if eq $g.projection.projection_type "INCLUDE" -}}
      {{- if not $nka -}}
      {{- fail (printf "values.global_secondary_indexes[%d].projection.projection_type is INCLUDE, which copies the attributes non_key_attributes names beside the keys, and it names none: list them in projection.non_key_attributes in the Aggregate, or set projection_type to KEYS_ONLY" $i) -}}
      {{- end -}}
      {{- $included = add $included (len $nka) -}}
      {{- else if $nka -}}
      {{- fail (printf "values.global_secondary_indexes[%d].projection.non_key_attributes is set under projection_type %s, which copies %s and takes no list of attributes: remove non_key_attributes in the Aggregate, or set projection_type to INCLUDE" $i $g.projection.projection_type (ternary "every attribute" "the keys alone" (eq $g.projection.projection_type "ALL"))) -}}
      {{- end -}}
      {{- end -}}
      {{- if gt $included 100 -}}
      {{- fail (printf "values.global_secondary_indexes copy %d attributes beside their keys in projection.non_key_attributes, counted once for each index naming them, and DynamoDB takes 100 at most across a table's indexes: name fewer in the Aggregate, or project an index with ALL" $included) -}}
      {{- end -}}
