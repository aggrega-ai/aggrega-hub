apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/redis
  version: 1.0.0
  license: AGPL-3.0
  description: >
    A Redis in-memory key-value cache, speaking the Redis wire protocol. Used
    as a cache, entries live in memory and are not durably persisted, so the
    component renders as a stateless workload rather than a stateful one and
    declares no storage. Provider-agnostic: the same component is implemented
    by a Helm Recipe (Workload synthesis to native Kubernetes resources) and a Compose Recipe (local
    development). Exports its host and port to consumers via the uses topology.
    The packaged Redis server is AGPL-3.0 (tri-licensed AGPLv3 / RSALv2 /
    SSPLv1; deployed here under the AGPL arm); consumers needing a BSD-licensed
    alternative can select the Valkey component instead.

    From release 8.0 its image carries the query engine whose vector search a
    gateway's semantic cache searches its replies with, and it publishes
    vector_search while it does; the Valkey image the catalog pins does not.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. Redis authentication is off by
    # default; when a credential is attached here, the Recipe enables
    # password authentication and wires the password through the credential
    # subsystem. When unattached, the cache runs without authentication,
    # byte-identically to a Recipe with no slot at all. `required` omitted →
    # optional, so a bare `cache: {}` still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional cache authentication credential. When attached, enables Redis password authentication and supplies the password; unattached, the cache runs without authentication."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every knob
      # below is optional and unset by default, so a bare `cache: {}`
      # is byte-identical to a component with an empty value surface. Defaults
      # left unset (rather than pinned to the redis built-in) keep the rendered
      # cache free of redundant flags until the developer expresses an intent.
      maxmemory:
        type: string
        description: Maximum memory the cache may use before eviction (the redis maxmemory directive, e.g. 256mb). Omit for no cap.
      maxmemory_policy:
        type: string
        description: Eviction policy applied when maxmemory is reached (the redis maxmemory-policy directive, e.g. allkeys-lru, volatile-ttl, noeviction). Omit to use the redis default.
      databases:
        type: integer
        min: 1
        description: Number of logical databases (the redis databases directive). Omit to use the redis default (16).
      appendonly:
        type: boolean
        default: false
        description: Enable append-only file (AOF) persistence. Pair with persistence.enabled for a durable volume; on an ephemeral cache the AOF is not retained across restarts.
      persistence:
        enabled:
          type: boolean
          default: false
          description: Run the cache as a durable StatefulSet with a persistent volume mounted at /data instead of the default ephemeral Deployment. Off by default — the cache role holds no durable state. Realized on the synthesized-Helm target; the Compose flavor is ephemeral.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 6379
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (6379).
      # The default names an exact patch of the Redis image published by the
      # Redis project's own maintainers. A tag naming only the minor line moves
      # to the next patch as one is published, so two builds of the same
      # Aggregate weeks apart run different bytes while the rendered manifest is
      # identical — the exact pin is what makes repeated builds reproducible,
      # and the identical render is why a moving tag goes unnoticed.
      #
      # It selects a tag and not a repository. A Release needing a different
      # image sets infra.overrides.image instead, which both container targets
      # read in place of the reference they compose here.
      engine_version:
        type: string
        default: "8.8.2-alpine"
        description: >
          Redis container image tag, pinned to an exact patch of the image the
          Redis project's own maintainers publish. Selects the image tag on
          container targets; the chart-backed target pins its own engine version
          in the chart. It selects a tag and not a repository, so a Release
          needing a different image — the one the OT-CONTAINER-KIT Redis
          operator's own chart and examples name, quay.io/opstree/redis — sets
          infra.overrides.image to the whole image reference instead.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 1Gi
            description: Persistent volume size when persistence.enabled is set (synthesized-Helm target).
          type:
            type: string
            description: >
              Persistent volume storage class when persistence.enabled is set
              (synthesized-Helm target). Leave it unset to take the cluster's
              default storage class; set it to name another class the cluster
              offers.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      # The build cannot look inside an image, so whether the one
      # infra.overrides.image names serves the Redis query engine's vector
      # search is the operator's to state. It is read only while that override
      # is set; with none, vector_search follows engine_version.
      image_serves_vector_search:
        type: boolean
        default: false
        description: >
          Set to true when the image infra.overrides.image names serves the
          Redis query engine's vector search, FT.CREATE and FT.SEARCH over a
          vector field, so this instance publishes vector_search. Read only
          while infra.overrides.image is set.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the cache. A consumer
          puts this name in its client's connection settings together with
          `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port the cache accepts connections on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 6379.
      protocol:
        type: string
        description: Wire protocol the published address speaks — `redis`, which is what a consumer selects a client for.
      # Whether this instance serves the Redis query engine's vector search,
      # which a gateway's semantic cache stores and searches its replies with.
      # Every Recipe publishes it from this instance's own infra, as true or
      # empty. With no infra.overrides.image it is true for an engine_version
      # from 8.0.0 on: the official image builds the query engine in from that
      # release, alpine and debian alike, and loads it when the server starts —
      # on amd64 and arm64 nodes, the only architectures it builds it for. An
      # earlier release, or a tag naming no release, such as latest, publishes
      # it empty. With an override, it is true only while
      # infra.image_serves_vector_search is. A gateway wired to this instance
      # on its cache_store socket halts the build while it is empty.
      vector_search:
        type: string
        description: >
          `true` while this instance serves the Redis query engine's vector
          search, which a semantic cache needs of its store; empty otherwise.
          With no infra.overrides.image it is `true` for an infra.engine_version
          from 8.0.0 on; with one, only while infra.image_serves_vector_search
          is true.
