apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/redis
  version: 1.0.0
  # No license key: the realizations declare different terms — helm/redis and
  # compose/redis declare AGPL-3.0, terraform/redis-elasticache declares the
  # Apache-2.0 licence of the module it vendors, and
  # cloudformation/redis-elasticache and terraform/redis-azure-managed declare
  # none — so no single SPDX identifier names them.
  # The description states each.
  description: >
    A Redis in-memory key-value cache, speaking the Redis wire protocol. Used
    as a cache, entries live in memory and are not durably persisted, so the
    component renders as a stateless workload rather than a stateful one and
    declares no storage. Realized on Kubernetes (Workload synthesis to native
    Kubernetes resources), on Compose for local development, on Amazon
    ElastiCache and on Azure Managed Redis. Exports its host and port to
    consumers via the uses topology.

    The terms follow the realization. helm/redis and compose/redis declare the
    AGPL-3.0 licence; terraform/redis-elasticache declares Apache-2.0, the
    licence of the module it vendors; cloudformation/redis-elasticache and
    terraform/redis-azure-managed declare none. The Valkey component speaks the
    same wire protocol, and its helm Recipes declare BSD-3-Clause.

    From release 8.0 the container image carries the query engine whose vector
    search a gateway's semantic cache searches its replies with, and it
    publishes vector_search while it does; the Valkey image the catalog pins
    does not.

    Reach for terraform/redis-elasticache, or cloudformation/redis-elasticache
    in a CloudFormation stack, for an ElastiCache service in the operator's AWS
    account, where the Release sets infra.engine_version; and for
    terraform/redis-azure-managed for an Azure Managed Redis instance in the
    operator's Azure subscription. None publishes vector_search; each halts
    naming each value its service cannot apply.

    `infra.client_tls`, off by default, serves TLS alone and publishes
    `protocol` `redis-tls`: on Kubernetes with the certificate attached to
    `server_certificate`, on the managed services with their own. The Compose
    realization refuses it by name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
    # Realized self-hosted (helm, compose) and managed (ElastiCache, Azure
    # Managed Redis), so no single hosting posture is its identity; the
    # posture of a Release follows the Recipe the Manifest selects.
    # Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: mixed
    # Realized under terms of more than one class: the container Recipes declare
    # AGPL-3.0, an OSI-approved licence, while terraform/redis-azure-managed
    # provisions a service offered under Microsoft's terms of service and
    # declares no licence. So no single class is its identity; the class
    # of a Release follows the Recipe the Manifest selects.
    component.aggrega.ai/upstream-licensing: mixed
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. Redis authentication is off by
    # default; when a credential is attached here, the Recipe enables
    # password authentication and wires the password through the credential
    # subsystem. When unattached, the cache runs without authentication,
    # byte-identically to a Recipe with no slot at all. `required` omitted →
    # optional, so a bare `cache: {}` still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional cache authentication credential. When attached, enables Redis password authentication and supplies the password; unattached, the cache runs without authentication. On ElastiCache the password is the AUTH token, which the service accepts only while infra.client_tls is true, drawn by core/random-password, when Terraform applies or the stack is created, with no punctuation and at least 16 characters. Azure Managed Redis authenticates every client, with Microsoft Entra ID or an access key it generates, and takes no password, so its realization halts on any attachment."
    # Optional server certificate, read only while infra.client_tls is true. It
    # reaches the container as files (inject: [file]), so its fill must name a
    # Secret the workload mounts — core/referenced-secret, whose realization names
    # one that already exists. Unattached with client_tls off, nothing renders for
    # it; each realization halts on the two mismatched pairings.
    server_certificate:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [file]
      description: "Optional certificate the cache presents to its clients while infra.client_tls is true: a Secret holding tls.crt, the certificate followed by any intermediate certificates, and tls.key, its private key, the two keys a kubernetes.io/tls Secret holds. The certificate names every address a client dials: the published host, and its namespace-qualified forms where clients in other namespaces connect. Mounted as files, so attach a Feature that names an existing Secret, such as core/referenced-secret. Required by the Kubernetes realization while client_tls is true; a build halts on it attached while client_tls is false. ElastiCache presents a certificate AWS issues, and Azure Managed Redis one of its own, so their realizations halt on any attachment here."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Every knob
      # below is optional and unset by default, so a bare `cache: {}`
      # is byte-identical to a component with an empty value surface. Defaults
      # left unset (rather than pinned to the redis built-in) keep the rendered
      # cache free of redundant flags until the developer expresses an intent.
      maxmemory:
        type: string
        description: Maximum memory the cache may use before eviction (the redis maxmemory directive, e.g. 256mb). Omit for no cap. ElastiCache fixes it by the node type, and Azure Managed Redis by its SKU, so their realizations halt on it.
      maxmemory_policy:
        type: string
        description: Eviction policy applied when maxmemory is reached (the redis maxmemory-policy directive, e.g. allkeys-lru, volatile-ttl, noeviction). Omit to use the redis default; on Azure Managed Redis, omitted, the service's default, volatile-lru, applies, and a policy it does not offer halts.
      databases:
        type: integer
        min: 1
        description: Number of logical databases (the redis databases directive). Omit to use the redis default (16). The ElastiCache realizations set it through a parameter group from Redis OSS 6.0 on, and halt on it below, where ElastiCache lets no parameter group change it. Azure Managed Redis takes no such setting, so its realization halts on it.
      appendonly:
        type: boolean
        default: false
        description: Enable append-only file (AOF) persistence. Pair with persistence.enabled for a durable volume; on an ephemeral cache the AOF is not retained across restarts. ElastiCache writes no AOF for Redis OSS, so its realizations halt on it set true. On Azure Managed Redis it turns on the service's AOF persistence, written once per second to a managed disk the service keeps, which needs high availability on.
      persistence:
        enabled:
          type: boolean
          default: false
          description: Run the cache as a durable StatefulSet with a persistent volume mounted at /data instead of the default ephemeral Deployment. Off by default — the cache role holds no durable state. Realized on the synthesized-Helm target; the Compose flavor is ephemeral, and the ElastiCache realizations, which provision no volume, halt on it set true. On Azure Managed Redis it turns on the service's persistence to a managed disk the service keeps — AOF with appendonly, otherwise an RDB snapshot every hour — which needs high availability on.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 6379
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (6379). Azure Managed Redis serves port 10000 alone, which its realization publishes, and it halts on any value other than this default.
      client_tls:
        type: boolean
        default: false
        description: >
          Serve client connections over TLS alone. Off by default, which serves
          plaintext and renders exactly as a cache without the setting. On, the
          server listens for TLS on `port` with no plaintext listener, presents
          the certificate attached to `server_certificate` (required while this
          is on), requests no client certificate, and the published `protocol`
          is `redis-tls`. Served by the `redis` Kubernetes realization; the
          Compose realization refuses it. On ElastiCache it turns on the
          service's in-transit encryption, whose certificate AWS issues and
          clients trust without a `server_ca`. On Azure Managed Redis it keeps
          the service's TLS-only client connections, and off it serves
          plaintext, which only an access-key client can use: Microsoft Entra
          ID authentication needs TLS, so that realization halts with it off
          unless the Release turns access keys on.
      # The default names an exact patch of the Redis image published by the
      # Redis project's own maintainers. A tag naming only the minor line moves
      # to the next patch as one is published, so two builds of the same
      # Aggregate weeks apart run different bytes while the rendered manifest is
      # identical — the exact pin is what makes repeated builds reproducible,
      # and the identical render is why a moving tag goes unnoticed.
      #
      # It selects a tag and not a repository. A Release needing a different
      # image sets infra.overrides.image instead, which both container targets
      # read in place of the reference they compose here.
      engine_version:
        type: string
        default: "8.8.2-alpine"
        description: >
          Redis container image tag, pinned to an exact patch of the image the
          Redis project's own maintainers publish. Selects the image tag on
          container targets. It selects a tag and not a repository, so a Release
          needing a different image — the one the OT-CONTAINER-KIT Redis
          operator's own chart and examples name, quay.io/opstree/redis — sets
          infra.overrides.image to the whole image reference instead. The
          ElastiCache realizations read the version the value begins with as
          the Redis OSS engine version, 7.1, 7.0, 6.2, 6.0, 5.0.6 or 4.0.10, and
          halt on any other, this default included, so a Release mapped to them
          sets it; they halt on infra.overrides.image, since no image runs
          there. Azure Managed Redis runs the Redis version the service
          chooses and upgrades itself, so that realization does not read it,
          and halts on infra.overrides.image as well.
      compute:
        cpu:
          type: string
          default: 100m
          description: CPU the cache server is given. The ElastiCache realizations do not read it; they size the node by infra.overrides.node_type (CacheNodeType on CloudFormation). The Azure Managed Redis realization does not read it either; it sizes the cache by infra.overrides.sku_name.
        memory:
          type: string
          default: 128Mi
          description: Memory the cache server is given. The ElastiCache realizations do not read it; they size the node by infra.overrides.node_type (CacheNodeType on CloudFormation). The Azure Managed Redis realization does not read it either; it sizes the cache by infra.overrides.sku_name.
      storage:
        type: object
        properties:
          size:
            type: string
            default: 1Gi
            description: Persistent volume size when persistence.enabled is set (synthesized-Helm target). The ElastiCache and Azure Managed Redis realizations provision no volume and do not read it.
          type:
            type: string
            description: >
              Persistent volume storage class when persistence.enabled is set
              (synthesized-Helm target). Leave it unset to take the cluster's
              default storage class; set it to name another class the cluster
              offers. The ElastiCache and Azure Managed Redis realizations
              provision no volume and do not read it.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      # The build cannot look inside an image, so whether the one
      # infra.overrides.image names serves the Redis query engine's vector
      # search is the operator's to state. It is read only while that override
      # is set; with none, vector_search follows engine_version.
      image_serves_vector_search:
        type: boolean
        default: false
        description: >
          Set to true when the image infra.overrides.image names serves the
          Redis query engine's vector search, FT.CREATE and FT.SEARCH over a
          vector field, so this instance publishes vector_search. Read only
          while infra.overrides.image is set. The ElastiCache and Azure
          Managed Redis realizations run no image and do not read it.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a consumer opens its cache connection to, together with
          `port`: the in-cluster DNS name of the Service fronting the cache on
          Kubernetes, and on ElastiCache and Azure Managed Redis a pointer
          string Terraform or CloudFormation resolves to the service's endpoint,
          or the DNS name the Release sets in infra.overrides.host instead, so a
          consumer on another target receives an address it can resolve.
      port:
        type: integer
        required: true
        description: >
          TCP port the cache accepts connections on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 6379; on Azure Managed Redis it is 10000, the one port the
          service serves.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `redis` while
          `infra.client_tls` is off, and `redis-tls` while it is on, when the
          address accepts TLS connections alone. A consumer reaches either with
          a Redis-protocol client, over TLS for `redis-tls`. A client that reads
          only `host` and `port` reads this key too to learn that TLS is
          required: a plaintext client reaching a TLS listener fails its
          handshake and exchanges no command.
      # Whether this instance serves the Redis query engine's vector search,
      # which a gateway's semantic cache stores and searches its replies with.
      # Every container Recipe publishes it from this instance's own infra, as
      # true or empty; the ElastiCache Recipes publish it empty, since
      # ElastiCache offers vector search on Valkey alone and on no Redis OSS
      # version, and so does terraform/redis-azure-managed, since Azure Managed
      # Redis serves it only from the RediSearch module enabled when the cache
      # is created, and that Recipe creates the cache with no module. With no infra.overrides.image it is true for an engine_version
      # from 8.0.0 on: the official image builds the query engine in from that
      # release, alpine and debian alike, and loads it when the server starts —
      # on amd64 and arm64 nodes, the only architectures it builds it for. An
      # earlier release, or a tag naming no release, such as latest, publishes
      # it empty. With an override, it is true only while
      # infra.image_serves_vector_search is. A gateway wired to this instance
      # on its cache_store socket halts the build while it is empty.
      vector_search:
        type: string
        description: >
          `true` while this instance serves the Redis query engine's vector
          search, which a semantic cache needs of its store; empty otherwise.
          With no infra.overrides.image it is `true` for an infra.engine_version
          from 8.0.0 on; with one, only while infra.image_serves_vector_search
          is true. The ElastiCache and Azure Managed Redis realizations publish
          it empty.
