apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/opensearch
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    An OpenSearch search and analytics engine. Indexes documents for full-text
    and analytical queries and indexes embedding vectors beside them, answering
    similarity searches through its k-NN plugin, so a component that retrieves
    by similarity can be wired here. Indexes are created through OpenSearch's own
    API at runtime; the component declares the server, not its contents. It runs
    as one node.

    Exports its host, port, protocol, an endpoint joining them and the account a
    client signs in as. The security plugin stays on with one account, the
    administrator, whose password is the attached credential.

    Realized self-hosted by the product's own Helm chart on Kubernetes, fetched
    at build time, and by a Compose Recipe for local development. Each runs the
    product's image with no demonstration account or certificate, each node
    generating its own transport key when it starts; the API is served over
    plain HTTP, not encrypted, reachable only inside the Release, and with no
    credential attached the password is a development default.

    Realized on Amazon OpenSearch Service by terraform/opensearch-service and,
    in a CloudFormation stack, cloudformation/opensearch-service: each a domain
    in the operator's AWS account and VPC that serves HTTPS alone on port 443
    and answers similarity searches through the service's own k-NN support,
    and each halts unless core/random-password, with values.symbols true,
    supplies the password. Reach for them where the engine is the operator's
    managed AWS service; reach for the self-hosted Recipes on a cluster or a
    Docker host. The Recipes are verified by their rendered output, not by a
    started server.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: OpenSearch is a search and analytics engine whose identity is
    # search over the documents it indexes, and no value supplied makes it
    # something else. That is why it sits on the component itself. Every
    # vector-store socket in the standard library admits `search` beside `vector`
    # and `semantic-memory`, because the engine answers similarity searches too.
    datastore.aggrega.ai/engine: search
    # Realized self-hosted (helm, compose) and managed (Amazon OpenSearch
    # Service), so no single hosting posture is its identity; the posture of a
    # Release follows the Recipe the Manifest selects. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: mixed
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot: the password of `admin`, the one account
    # the server holds. The security plugin is never switched off, and every
    # self-hosted Recipe replaces the image's demonstration security setup — its
    # sample accounts, whose passwords are published, and its sample
    # certificates — with that single account, whichever way the slot is filled.
    # When a credential is attached here, its value is the administrator's
    # password; unattached, the self-hosted Recipes use the development default
    # `apppass`, the same for every reader of the catalog, which attaching a
    # credential replaces. `required` omitted → optional, so a bare `search: {}`
    # still loads. Transparent (inject: [env]) so the injected value reaches the
    # Recipe on the env pipe; the selector is secret-kind-pinned but
    # family-agnostic. The Helm Recipe reads the credential from the Secret it
    # names, and halts on a credential that names none; the Compose Recipe reads
    # the value its credential delivers.
    #
    # On the self-hosted Recipes the server reads the password from its own
    # environment each time it loads its security configuration, so a changed
    # credential takes effect when the server next starts. The account is marked
    # reserved, so it is not changed through the security plugin's REST API.
    #
    # The OpenSearch Service realizations make the account the domain's master
    # user in the service's internal user database. Each takes
    # core/random-password alone — terraform/opensearch-service handing the
    # service a Terraform reference to the password the apply draws,
    # cloudformation/opensearch-service a Secrets Manager dynamic reference to
    # the secret the stack generates — and halts with nothing attached: `apppass`
    # is shorter than the eight characters the service requires of a master
    # password. Each also halts unless the attachment sets `values.symbols:
    # true`, so the password holds an upper-case letter, a lower-case letter, a
    # digit and a punctuation character, which the service accepts whether or
    # not it requires them.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password of the server's administrator account, admin. When attached, the Kubernetes Recipe reads it from the credential's Secret by reference and the Compose Recipe writes the value the credential delivers; unattached, compose/opensearch and helm/opensearch-chart set it to the development literal `apppass`, which this catalog publishes, so every Release that leaves the slot unattached shares that password, and attaching a credential replaces it. The OpenSearch Service realizations take core/random-password alone, with values.symbols true so the password holds every character class — as a reference to the password Terraform draws at apply time on terraform, as a Secrets Manager dynamic reference to the secret the stack generates on CloudFormation — and halt on any other credential, on punctuation left off, or on none."
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9200
        description: >
          Port the server's REST API is published on. Most operators should omit
          this and let the Recipe assign the default (9200). The server listens
          on it on both self-hosted targets; on Kubernetes it is also the Service
          port. The OpenSearch Service realizations do not read it: the domain
          serves port 443 alone, and any other value than the default halts
          there.
      engine_version:
        type: string
        # Pinned by tag and by the digest of the image's index, so every platform
        # the project publishes resolves to the build read when this default was
        # set. A Release may name another tag, with or without a digest.
        default: "3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c"
        description: >
          Tag of the opensearchproject/opensearch image every Recipe runs,
          optionally followed by @ and the digest it must resolve to. It begins
          with the release's version number, which the Kubernetes Recipe reads its
          major version from. The Recipes configure the server through the
          settings of the 3.x releases; another release may need other ones.
          The OpenSearch Service realizations read the major and minor version
          the value begins with as the domain's engine version, among those
          Amazon OpenSearch Service offers; the default names a release it does
          not run, so it halts there and the Release sets one it offers, such
          as 3.5.
      source_version:
        type: string
        description: Version of the Helm chart the Kubernetes Recipe pulls. Read only by that Recipe; the Compose Recipe pulls no source artifact and ignores it, terraform/opensearch-service pins its module in its own lock and ignores it too, and cloudformation/opensearch-service, which pulls nothing, ignores it as well. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        # The server's Java heap is the image's own default of 1 GB, and the
        # product's guidance is a heap of half the memory the server has, so the
        # default memory is twice the heap. Less than that may stop it starting.
        cpu:
          type: string
          default: "1"
          description: CPU the server is given. The OpenSearch Service realizations do not read it; they size the data node by infra.overrides.instance_type (infra.overrides.InstanceType on CloudFormation).
        memory:
          type: string
          default: 2Gi
          description: Memory the server is given. The OpenSearch Service realizations do not read it; they size the data node by infra.overrides.instance_type (infra.overrides.InstanceType on CloudFormation).
      storage:
        type: object
        properties:
          size:
            type: string
            # The chart's own default for a node's volume.
            default: 8Gi
            description: >
              Size of the volume holding the server's indexes on Kubernetes. The
              Compose Recipe creates the volume and honors no size, the target
              having no volume-size concept. On the OpenSearch Service
              realizations it is the data node's EBS volume, in whole gibibytes
              and at least 10Gi, so the default halts there.
          type:
            type: string
            description: >
              Storage class the server's volume is provisioned from on Kubernetes.
              Leave it unset to take the cluster's default storage class; set it
              to name another class the cluster offers. The Compose Recipe names no
              class. On the OpenSearch Service realizations it is the EBS volume
              type, gp3, gp2 or standard, and gp3 when unset; io1 halts there,
              since no key carries the IOPS figure it takes, and so does a type
              the instance type cannot take, such as anything but gp3 on a
              Graviton3 family like the default m7g.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a client connects to. On Kubernetes it is the Service's DNS
          name, and on Compose the service name; on the OpenSearch Service
          realizations a pointer string Terraform or CloudFormation resolves to
          the domain's endpoint, or the DNS name the Release sets in
          infra.overrides.host instead, so a consumer on another target
          receives an address it can resolve. That name becomes the domain's
          custom endpoint, which presents the AWS Certificate Manager
          certificate the Release names beside it, in
          infra.overrides.custom_endpoint_certificate_arn on terraform and
          infra.overrides.CustomEndpointCertificateArn on CloudFormation, so a
          client checking the certificate reaches the domain by that name; a
          name without a certificate halts, and so does a certificate without
          a name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server's REST API answers on. On the self-hosted Recipes
          it follows the port an operator set in the Release, so a consumer
          reads it rather than assuming 9200; on the OpenSearch Service
          realizations it is 443, the one port the domain serves.
      user:
        type: string
        description: >
          Name of the account a client signs in as — `admin`, the server's one
          account, which on Amazon OpenSearch Service is the domain's master
          user. The matching password arrives through the credential attached
          to the component, never through this contract.
      protocol:
        type: string
        description: >
          Scheme a client composes the server's address with — `http` on the
          self-hosted Recipes, as in http://<host>:<port>, where the REST API is
          served over plain HTTP, and `https` on the OpenSearch Service
          realizations, whose domain accepts HTTPS alone. A client composing
          the address from its parts reads this key rather than assuming
          either.
      endpoint:
        type: string
        description: >
          The server's address as one URI, for a client that takes one address
          rather than its parts: http://<host>:<port> on the self-hosted
          Recipes, and https://<host> on the OpenSearch Service realizations,
          the scheme's own port 443. It carries no credential.
