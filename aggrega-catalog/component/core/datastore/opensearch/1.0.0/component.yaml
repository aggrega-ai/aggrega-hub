apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/opensearch
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    An OpenSearch search and analytics engine. Indexes documents for full-text
    and analytical queries and indexes embedding vectors beside them, answering
    similarity searches through its k-NN plugin, so a component that retrieves
    by similarity can be wired here. Indexes are created through OpenSearch's own
    API at runtime; the component declares the server, not its contents. It runs
    as one node.

    Exports its host, port, protocol, an endpoint joining them and the account a
    client signs in as. The security plugin stays on with one account, the
    administrator: its password is the attached credential, which the Kubernetes
    Recipe reads from its Secret by reference, and with none attached it is a
    development default that attaching one replaces. No demonstration account or
    certificate is installed: each node generates its own transport key when it
    starts. The API is served over plain HTTP, not encrypted, and is reachable
    only inside the Release.

    Realized by the product's own Helm chart on Kubernetes, fetched at build
    time, and by a Compose Recipe for local development. Its Recipes are verified
    by their rendered output, not by a started server.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: OpenSearch is a search and analytics engine whose identity is
    # search over the documents it indexes, and no value supplied makes it
    # something else. That is why it sits on the component itself. Every
    # vector-store socket in the standard library admits `search` beside `vector`
    # and `semantic-memory`, because the engine answers similarity searches too.
    datastore.aggrega.ai/engine: search
    # Both Recipes run the server as a container in the Release's own boundary,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot: the password of `admin`, the one account
    # the server holds. The security plugin is never switched off, and every
    # Recipe replaces the image's demonstration security setup — its sample
    # accounts, whose passwords are published, and its sample certificates — with
    # that single account, whichever way the slot is filled. When a credential is
    # attached here, its value is the administrator's password; unattached, the
    # password is the development default `apppass`, the same for every reader of
    # the catalog, which attaching a credential replaces. `required` omitted →
    # optional, so a bare `search: {}` still loads. Transparent (inject: [env]) so
    # the injected value reaches the Recipe on the env pipe; the selector is
    # secret-kind-pinned but family-agnostic. The Helm Recipe reads the credential
    # from the Secret it names, and halts on a credential that names none; the
    # Compose Recipe reads the value its credential delivers.
    #
    # The server reads the password from its own environment each time it loads
    # its security configuration, so a changed credential takes effect when the
    # server next starts. The account is marked reserved, so it is not changed
    # through the security plugin's REST API.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password of the server's administrator account, admin. When attached, the Kubernetes Recipe reads it from the credential's Secret by reference and the Compose Recipe writes the value the credential delivers; unattached, the password is a development default every reader of the catalog knows, which attaching a credential replaces."
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9200
        description: >
          Port the server's REST API is published on. Most operators should omit
          this and let the Recipe assign the default (9200). The server listens
          on it on both targets; on Kubernetes it is also the Service port.
      engine_version:
        type: string
        # Pinned by tag and by the digest of the image's index, so every platform
        # the project publishes resolves to the build read when this default was
        # set. A Release may name another tag, with or without a digest.
        default: "3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c"
        description: >
          Tag of the opensearchproject/opensearch image every Recipe runs,
          optionally followed by @ and the digest it must resolve to. It begins
          with the release's version number, which the Kubernetes Recipe reads its
          major version from. The Recipes configure the server through the
          settings of the 3.x releases; another release may need other ones.
      source_version:
        type: string
        description: Version of the Helm chart the Kubernetes Recipe pulls. Read only by that Recipe; the Compose Recipe pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        # The server's Java heap is the image's own default of 1 GB, and the
        # product's guidance is a heap of half the memory the server has, so the
        # default memory is twice the heap. Less than that may stop it starting.
        cpu:
          type: string
          default: "1"
        memory:
          type: string
          default: 2Gi
      storage:
        type: object
        properties:
          size:
            type: string
            # The chart's own default for a node's volume.
            default: 8Gi
            description: >
              Size of the volume holding the server's indexes on Kubernetes. The
              Compose Recipe creates the volume and honors no size, the target
              having no volume-size concept.
          type:
            type: string
            description: >
              Storage class the server's volume is provisioned from on Kubernetes.
              Leave it unset to take the cluster's default storage class; set it
              to name another class the cluster offers. The Compose Recipe names no
              class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client connects to. On Kubernetes it is the Service's DNS name, and on Compose the service name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server's REST API answers on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 9200.
      user:
        type: string
        description: >
          Name of the account a client signs in as — `admin`, the server's one
          account. The matching password arrives through the credential attached
          to the component, never through this contract.
      protocol:
        type: string
        description: >
          Scheme a client composes the server's address with — `http`, as in
          http://<host>:<port>; the REST API is served over HTTP.
      endpoint:
        type: string
        description: >
          The server's address as one URI, http://<host>:<port>, for a client
          that takes one address rather than its parts. It carries no
          credential.
