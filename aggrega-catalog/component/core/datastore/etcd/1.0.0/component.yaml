apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/etcd
  version: 1.0.0
  license: Apache-2.0
  description: >
    etcd, a distributed, strongly-consistent key-value store. This component
    runs a single-node etcd for development and lightweight coordination,
    holding its data on a persistent volume. It serves the v3 client API over
    HTTP with no authentication, suited to in-cluster consumers that need a
    simple consistent key-value store or configuration backend. Provider-
    agnostic: the same component is implemented by a Helm Recipe (synthesized
    manifests on Kubernetes). Exports its host and client port to consumers via
    the uses topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      name:
        type: string
        default: node1
        description: etcd member name (ETCD_NAME). Names the single node in the initial cluster.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      client_port:
        type: integer
        min: 1024
        max: 65535
        default: 2379
        description: Client API port consumers connect to. Most operators should omit this and let the Recipe assign the default (2379).
      peer_port:
        type: integer
        min: 1024
        max: 65535
        default: 2380
        description: Peer port used for intra-cluster communication. Most operators should omit this and let the Recipe assign the default (2380).
      engine_version:
        type: string
        default: "v3.5.32"
        description: etcd version (the etcd image tag).
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 256Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 8Gi
          type:
            type: string
            default: gp3
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
