apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/azure-ai-search
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure AI Search is a hosted
  # service the reader contracts for with Microsoft, under Azure's terms,
  # which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure AI Search service: Microsoft's managed search engine, which
    indexes documents for full-text, vector and hybrid queries and answers
    them over its own REST API. A consumer reads the service's host, port and
    endpoint. Indexes, indexers and their data sources are created through
    that API by the application at runtime; this Component declares the
    service, not its contents.

    The service takes requests authenticated with Microsoft Entra ID alone:
    its API keys are turned off, so no key reaches a consumer and no
    credential slot is declared. A consumer authenticates as the managed
    identity it runs under, and the role assignment granting that identity
    access to the service is the operator's.

    Its engine label is search, so a socket selecting search engines admits
    it, as the vector-store sockets of the catalog's agent frameworks and
    core/ai-tool/retrieval do. Whether a consumer can query it is that
    consumer's own: the service answers its own API, not Elasticsearch's or
    OpenSearch's.

    Each Recipe's description says which keys it honours, which it refuses
    by name, and which its service has no setting for and it does not read.
    The service keeps no backup of its own, so no realization configures one
    and a core/backup attachment halts the build: an index is rebuilt from
    the data it was loaded from.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: search
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      semantic_search:
        type: string
        enum: [disabled, free, standard]
        default: disabled
        description: >
          Whether, and on which billing plan, the service's semantic ranker
          re-ranks query results: disabled turns it off; free answers a
          monthly allowance of requests at no charge and refuses those past
          it; standard bills each request past the allowance. The values are
          the service's own. A realization halts the build, naming the
          service tier, on a plan the service or the tool it deploys with
          does not offer on that tier.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The service's DNS name, which its REST API answers under. A
          realization publishes a pointer string the provisioning tool
          resolves once the service exists, so a consumer reads this rather
          than deriving one, or the DNS name the Release sets in
          infra.overrides.host instead.
      port:
        type: integer
        required: true
        description: TCP port the service's REST API answers on, 443, the one port it serves, over HTTPS alone.
      endpoint:
        type: string
        description: >
          The service's URL, https:// followed by host, as a client library
          takes it to reach the service. It carries no credential.
