apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/postgres
  version: 1.0.0
  description: >
    A PostgreSQL relational database. Provider-agnostic: the same component is
    implemented by Compose Recipes (local development), Helm Recipes
    (Kubernetes), Terraform Recipes (AWS RDS, Azure Database), and
    CloudFormation Recipes. Exports its host and port to consumers via the uses
    topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: ["env"]
  secretsSchema:
    # Optional password credential slot. When a deployment attaches a credential
    # here, the Recipe wires the database password through the credential
    # subsystem; when unattached, the Recipe falls back to its inline default.
    # `required` omitted → optional, so a bare `db: {}` deployment still loads.
    # Transparent (inject: [env]) so a synthesized Workload may reference it as
    # an env secret; the selector is secret-kind-pinned but family-agnostic so
    # either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional database password credential. When attached, supplies POSTGRES_PASSWORD via the credential subsystem; unattached, the Recipe uses its inline default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Defaults
      # match the Recipe's historical inline values, so a bare `db: {}` is
      # unchanged while these become configurable.
      database:
        type: string
        default: appdb
        description: Logical database name created on startup (POSTGRES_DB).
      user:
        type: string
        default: appuser
        description: Application database user created on startup (POSTGRES_USER).
      encoding:
        type: string
        description: Database encoding passed to initdb (e.g. UTF8). Omit to use the image default.
      locale:
        type: string
        description: Database locale passed to initdb (e.g. en_US.utf8). Omit to use the image default.
      init_scripts:
        type: object
        valuesType: string
        description: SQL scripts executed on first database initialization. Each key is a filename, each value is the SQL content. Scripts run in alphabetical key order. Honored by the Bitnami chart-wrap Recipe; the synthesized-Helm and Compose Recipes do not run initialization scripts.
      custom_config:
        type: string
        description: Raw server configuration block (postgresql.conf format). Injected verbatim into the server configuration. Honored by the Bitnami chart-wrap Recipe; the synthesized-Helm and Compose Recipes do not accept a custom configuration block.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5432
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (5432).
      engine_version:
        type: string
        default: "16"
        description: PostgreSQL major version (the postgres image tag).
      source_version:
        type: string
        description: Source artifact version (Helm chart, Terraform module, etc.). Overrides the Recipe's default source version. Changing from default does not guarantee value mapping compatibility.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            default: gp3
      ha:
        enabled:
          type: boolean
          default: false
          description: Enable read-replica high availability. Honored by the Bitnami chart-wrap Recipe (renders the chart's replication architecture with read replicas); the synthesized-Helm and Compose Recipes deploy a single instance and ignore it.
        read_replicas:
          type: integer
          min: 0
          default: 0
          description: Number of read replicas to deploy when high availability is enabled.
      backup:
        enabled:
          type: boolean
          default: true
          description: Enable scheduled backups. Honored by managed-service Recipes, which map it onto the managed database's native backup window; the self-managed Recipes (Bitnami chart-wrap, synthesized-Helm, Compose) do not schedule backups.
        retention_days:
          type: integer
          min: 0
          default: 7
          description: Number of days to retain backups when backups are enabled. Honored by managed-service Recipes alongside backup.enabled.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      user: { type: string }
      database: { type: string }
      protocol: { type: string }
