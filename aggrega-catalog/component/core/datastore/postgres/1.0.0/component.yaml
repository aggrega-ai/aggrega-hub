apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/postgres
  version: 1.0.0
  description: >
    A PostgreSQL relational database. Provider-agnostic: the same component is
    implemented by Compose Recipes (local development), Helm Recipes
    (Kubernetes), Terraform Recipes (AWS RDS, Azure Database), and
    CloudFormation Recipes. Exports its host and port to consumers via the uses
    topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: ["env"]
  secretsSchema:
    # Optional password credential slot. When a deployment attaches a credential
    # here, the Recipe wires the database password through the credential
    # subsystem; when unattached, the Recipe falls back to its inline default.
    # `required` omitted → optional, so a bare `db: {}` deployment still loads.
    # Transparent (inject: [env]) so a synthesized Workload may reference it as
    # an env secret; the selector is secret-kind-pinned but family-agnostic so
    # either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional database password credential. When attached, supplies POSTGRES_PASSWORD via the credential subsystem; unattached, the Recipe uses its inline default."
    # Optional application-user credential slot. When a deployment attaches a
    # credential here, the helm Recipe creates a distinct non-superuser login role
    # (named by values.app_user) with this credential as its password, via a
    # role-creation script on the first-initialization path. Optional and
    # transparent, mirroring the superuser `password` slot; unattached, no
    # application role is created and the render is byte-identical. Realized on the
    # helm target only — the Compose Recipe has no first-init role-creation path.
    app_user_password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional application-user password credential. When attached, the helm Recipe creates a non-superuser login role (named by values.app_user) with this password; unattached, no application role is created."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Defaults
      # match the Recipe's historical inline values, so a bare `db: {}` is
      # unchanged while these become configurable.
      database:
        type: string
        default: appdb
        description: Logical database name created on startup (POSTGRES_DB).
      user:
        type: string
        default: appuser
        description: Bootstrap superuser role created on startup (POSTGRES_USER), owner of the initial database. For an additional non-superuser application role, see app_user.
      app_user:
        type: string
        default: app
        description: >
          Name of an optional non-superuser application login role. The role is
          created only when an application-user credential is attached to the
          app_user_password slot (helm target only); the bootstrap superuser is
          named by `user`.
      encoding:
        type: string
        description: Database encoding passed to initdb (e.g. UTF8). Omit to use the image default.
      locale:
        type: string
        description: Database locale passed to initdb (e.g. en_US.utf8). Omit to use the image default.
      init_scripts:
        type: object
        valuesType: string
        description: SQL or shell scripts executed on first database initialization from /docker-entrypoint-initdb.d. Each key is a filename, each value is the file content. Scripts run once, when the data directory is empty, in alphabetical key order.
      custom_config:
        type: string
        description: Raw server configuration block (postgresql.conf format). Applied verbatim as the server's configuration file; unspecified settings keep their built-in defaults.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5432
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (5432).
      engine_version:
        type: string
        default: "16"
        description: PostgreSQL major version (the postgres image tag).
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            default: gp3
      ha:
        enabled:
          type: boolean
          default: false
          description: Enable read-replica high availability. The synthesized-Helm and Compose Recipes deploy a single instance and do not implement read-replica high availability.
        read_replicas:
          type: integer
          min: 0
          default: 0
          description: Number of read replicas to deploy when high availability is enabled.
      backup:
        enabled:
          type: boolean
          default: true
          description: Enable scheduled backups. Managed-service Recipes map it onto the managed database's native backup window; the synthesized-Helm and Compose Recipes do not schedule backups.
        retention_days:
          type: integer
          min: 0
          default: 7
          description: Number of days to retain backups when backups are enabled. Honored by managed-service Recipes alongside backup.enabled.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      user: { type: string }
      database: { type: string }
      protocol: { type: string }
