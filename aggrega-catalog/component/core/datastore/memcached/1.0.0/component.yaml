apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/memcached
  version: 1.0.0
  description: >
    A Memcached in-memory key-value cache. Non-persistent by design: entries
    live in memory and are not durably stored, so the component renders as a
    stateless workload rather than a stateful one and declares no storage.
    Provider-agnostic: the same component is implemented by a Helm Recipe
    (Workload synthesis to native Kubernetes resources) and a Compose Recipe (local development).
    Exports its host and port to consumers via the uses topology.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  secretsSchema:
    # Optional password credential slot. Memcached authentication is off by
    # default; when a deployment attaches a credential here, the Recipe enables
    # SASL authentication and wires the password through the credential
    # subsystem. When unattached, the cache runs without authentication,
    # byte-identically to a Recipe with no slot at all. `required` omitted →
    # optional, so a bare `cache: {}` deployment still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional cache authentication credential. When attached, enables Memcached SASL authentication and supplies the password; unattached, the cache runs without authentication."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      username:
        type: string
        default: cache
        description: SASL authentication username. Applies only when a password credential is attached; ignored when the cache runs without authentication.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 11211
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (11211).
      engine_version:
        type: string
        default: "1.6-alpine"
        description: Memcached container image tag. Selects the image tag on container targets; the chart-backed target pins its own engine version in the chart.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of cache nodes in the standalone deployment.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      protocol: { type: string }
