apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/memcached
  version: 1.0.0
  description: >
    A Memcached in-memory key-value cache. Non-persistent by design: entries
    live in memory and are not durably stored, so the component renders as a
    stateless workload rather than a stateful one and declares no storage.
    Provider-agnostic: the same component is implemented by a Helm Recipe
    (Workload synthesis to native Kubernetes resources) and a Compose Recipe (local development).
    Exports its host and port to consumers via the uses topology.

    Encrypted client connections are an operator setting, `infra.client_tls`,
    off by default. Turned on, the cache serves TLS alone on its port and
    publishes `protocol` `memcached-tls`, so a consumer reading `protocol`
    learns that it must connect over TLS. The certificate and key the server
    presents are the Secret attached to the `server_certificate` slot, and the
    server asks no client for a certificate. The Kubernetes realization serves
    TLS from that Secret, mounted as files; the Compose realization refuses the
    setting by name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. Memcached authentication is off by
    # default; when a credential is attached here, the Recipe enables
    # SASL authentication and wires the password through the credential
    # subsystem. When unattached, the cache runs without authentication,
    # byte-identically to a Recipe with no slot at all. `required` omitted →
    # optional, so a bare `cache: {}` still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional cache authentication credential. When attached, enables Memcached SASL authentication and supplies the password; unattached, the cache runs without authentication."
    # Optional server certificate, read only while infra.client_tls is true. It
    # reaches the container as files (inject: [file]), so its fill must name a
    # Secret the workload mounts — core/referenced-secret, whose realization names
    # one that already exists. Unattached with client_tls off, nothing renders for
    # it; each realization halts on the two mismatched pairings.
    server_certificate:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [file]
      description: "Optional certificate the cache presents to its clients while infra.client_tls is true: a Secret holding tls.crt, the certificate followed by any intermediate certificates, and tls.key, its private key, the two keys a kubernetes.io/tls Secret holds. The certificate names every address a client dials: the published host, and its namespace-qualified forms where clients in other namespaces connect. Mounted as files, so attach a Feature that names an existing Secret, such as core/referenced-secret. Required while client_tls is true; a build halts on it attached while client_tls is false."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The cache
      # tuning knobs are optional and unset by default, so a bare `cache: {}`
      # is byte-identical to a component that exposes only `user`;
      # each maps to a memcached server flag only when the developer sets it.
      user:
        type: string
        default: cache
        description: SASL authentication username. Applies only when a password credential is attached; ignored when the cache runs without authentication.
      memory_limit:
        type: integer
        min: 1
        description: Maximum memory for item storage, in megabytes (the memcached -m flag). Omit to use the memcached default (64).
      max_connections:
        type: integer
        min: 1
        description: Maximum number of simultaneous connections (the memcached -c flag). Omit to use the memcached default (1024).
      threads:
        type: integer
        min: 1
        description: Number of worker threads (the memcached -t flag). Omit to use the memcached default (4).
      max_item_size:
        type: string
        description: Maximum size of a single item (the memcached -I flag, e.g. 1m). Omit to use the memcached default (1m).
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 11211
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (11211).
      client_tls:
        type: boolean
        default: false
        description: >
          Serve client connections over TLS alone. Off by default, which serves
          plaintext and renders exactly as a cache without the setting. On, the
          server serves TLS on `port`, presents the certificate attached to
          `server_certificate` (required while this is on), requests no client
          certificate, and the published `protocol` is `memcached-tls`. Served
          by the `memcached` Kubernetes realization; the Compose realization
          refuses it.
      engine_version:
        type: string
        default: "1.6-alpine"
        description: Memcached container image tag. Selects the image tag on container targets.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of cache nodes in the standalone deployment.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the cache. A consumer
          puts this name in its client's server list together with `port`.
      port:
        type: integer
        required: true
        description: >
          TCP port the cache accepts connections on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming 11211.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `memcached`, which is
          what a consumer selects a client for, while `infra.client_tls` is off,
          and `memcached-tls` while it is on, when the address accepts TLS
          connections alone. A client that reads only `host` and `port` reads
          this key too to learn that TLS is required: a plaintext client
          reaching a TLS listener fails its handshake and exchanges no command.
