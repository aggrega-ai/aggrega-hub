apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/memcached
  version: 1.0.0
  description: >
    A Memcached in-memory key-value cache. Non-persistent by design: entries
    live in memory and are not durably stored, so the component renders as a
    stateless workload rather than a stateful one and declares no storage.
    Realized by a Helm Recipe (Workload synthesis to native Kubernetes
    resources), a Compose Recipe (local development), on Amazon ElastiCache
    and on Google Cloud Memorystore for Memcached. Exports its host and port to
    consumers via the uses topology.

    Reach for terraform/memcached-elasticache, or
    cloudformation/memcached-elasticache in a CloudFormation stack, where the
    cache is an ElastiCache service in the operator's AWS account; each halts
    naming each value ElastiCache cannot apply, and takes infra.engine_version
    as a full version ElastiCache offers, such as 1.6.22.

    Reach for terraform/memcached-memorystore where the cache is a Memorystore
    instance in the operator's Google Cloud project, whose VPC network has a
    private services access connection: one node, its address published, with
    no TLS and no authentication. Google is deprecating that service, which it
    shuts down on January 31, 2029.

    Encrypted client connections are an operator setting, `infra.client_tls`,
    off by default. Turned on, the cache serves TLS alone on its port and
    publishes `protocol` `memcached-tls`, so a consumer reading `protocol`
    learns that it must connect over TLS. On Kubernetes the server presents the
    Secret attached to the `server_certificate` slot, mounted as files, and asks
    no client for a certificate; ElastiCache presents a certificate AWS issues;
    the Compose and Memorystore realizations refuse the setting by name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    datastore.aggrega.ai/engine: kv
    # Realized self-hosted (helm, compose) and managed (ElastiCache,
    # Memorystore), so no single hosting posture is its identity; the posture
    # of a Release follows the Recipe the Manifest selects. Selector-only:
    # never stamped onto output.
    component.aggrega.ai/hosting: mixed
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. No realization in the catalog can
    # enforce a Memcached password, so each halts on an attachment by name
    # rather than render a password that protects nothing; unattached, the
    # cache runs without authentication. `required` omitted → optional, so a
    # bare `cache: {}` still loads. Transparent (inject: [env]); the selector is
    # secret-kind-pinned but family-agnostic.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional cache authentication credential. Every realization halts on an attachment, since none can enforce it: the memcached image the Kubernetes and Compose realizations run authenticates only through SASL over the binary protocol or an ASCII authentication file, which the catalog's Memcached clients do not use, and neither ElastiCache nor Memorystore for Memcached offers Memcached authentication. Unattached, the cache runs without authentication."
    # Optional server certificate, read only while infra.client_tls is true. It
    # reaches the container as files (inject: [file]), so its fill must name a
    # Secret the workload mounts — core/referenced-secret, whose realization names
    # one that already exists. Unattached with client_tls off, nothing renders for
    # it; each realization halts on the two mismatched pairings.
    server_certificate:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [file]
      description: "Optional certificate the cache presents to its clients while infra.client_tls is true: a Secret holding tls.crt, the certificate followed by any intermediate certificates, and tls.key, its private key, the two keys a kubernetes.io/tls Secret holds. The certificate names every address a client dials: the published host, and its namespace-qualified forms where clients in other namespaces connect. Mounted as files, so attach a Feature that names an existing Secret, such as core/referenced-secret. Required by the Kubernetes realization while client_tls is true; a build halts on it attached while client_tls is false. ElastiCache presents a certificate AWS issues and Memorystore serves no TLS, so their realizations halt on any attachment here."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. The cache
      # tuning knobs are optional and unset by default, so a bare `cache: {}`
      # is byte-identical to a component that exposes only `user`;
      # each maps to a memcached server flag only when the developer sets it.
      user:
        type: string
        default: cache
        description: SASL authentication username. No realization reads it, since every one halts on an attached password.
      memory_limit:
        type: integer
        min: 1
        description: Maximum memory for item storage, in megabytes (the memcached -m flag). Omit to use the memcached default (64). ElastiCache fixes it by the node type, so its realizations halt on it. Memorystore sets the limit to the node's memory, so terraform/memcached-memorystore sizes the node by it, 1024 to 262144 in whole GB, 1024 when omitted.
      max_connections:
        type: integer
        min: 1
        description: Maximum number of simultaneous connections (the memcached -c flag). Omit to use the memcached default (1024). ElastiCache and Memorystore fix it at 65000, so their realizations halt on it.
      threads:
        type: integer
        min: 1
        description: Number of worker threads (the memcached -t flag). Omit to use the memcached default (4). ElastiCache sets it by the node type, so its realizations halt on it. Memorystore sets the thread count to the node's vCPUs, so terraform/memcached-memorystore sizes the node by it, 1 to 32, 1 when omitted.
      max_item_size:
        type: string
        description: Maximum size of a single item (the memcached -I flag, e.g. 1m). Omit to use the memcached default (1m). ElastiCache takes it as a parameter, a whole multiple of 512k, and Memorystore too, up to 128m.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 11211
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (11211). Memorystore serves 11211 alone, so terraform/memcached-memorystore halts on any other value.
      client_tls:
        type: boolean
        default: false
        description: >
          Serve client connections over TLS alone. Off by default, which serves
          plaintext and renders exactly as a cache without the setting. On, the
          server serves TLS on `port`, presents the certificate attached to
          `server_certificate` (required while this is on), requests no client
          certificate, and the published `protocol` is `memcached-tls`. Served
          by the `memcached` Kubernetes realization; the Compose realization
          refuses it. On ElastiCache it turns on the service's in-transit
          encryption, from Memcached 1.6.12, whose certificate AWS issues and
          clients trust without a `server_ca`. Memorystore offers no
          encryption in transit, so its realization refuses it.
      engine_version:
        type: string
        default: "1.6-alpine"
        description: Memcached container image tag. Selects the image tag on container targets. The ElastiCache realizations read the version number the value begins with as the engine version, which ElastiCache takes in full, so the default halts there and the Release sets a version it offers, such as 1.6.22. Memorystore runs 1.5.16 and 1.6.15, the one release of each line it offers, so terraform/memcached-memorystore reads 1.6, the default's, as 1.6.15.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of cache nodes the cache runs; on ElastiCache, the cluster's node count. Memorystore gives each node an address of its own, and this component publishes one, so terraform/memcached-memorystore runs one node and halts above 1.
      compute:
        cpu:
          type: string
          default: 100m
          description: CPU the cache server is given. The ElastiCache realizations do not read it; they size the node by infra.overrides.node_type (CacheNodeType on CloudFormation). terraform/memcached-memorystore does not read it either; it sizes the node by values.threads and values.memory_limit.
        memory:
          type: string
          default: 128Mi
          description: Memory the cache server is given. The ElastiCache realizations do not read it; they size the node by infra.overrides.node_type (CacheNodeType on CloudFormation). terraform/memcached-memorystore does not read it either; it sizes the node by values.threads and values.memory_limit.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          Address a consumer puts in its client's server list, together with
          `port`: the in-cluster DNS name of the Service fronting the cache on
          Kubernetes, and on ElastiCache a pointer string Terraform or
          CloudFormation resolves to the cluster's configuration endpoint, on Memorystore a pointer Terraform resolves to the node's address, or the DNS name the Release sets
          in infra.overrides.host instead, so a consumer on another target
          receives an address it can resolve.
      port:
        type: integer
        required: true
        description: >
          TCP port the cache accepts connections on. It follows the port an
          operator set in the Release, or the one port the service serves on
          Memorystore, so a consumer reads it rather than assuming 11211.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `memcached`, which is
          what a consumer selects a client for, while `infra.client_tls` is off,
          and `memcached-tls` while it is on, when the address accepts TLS
          connections alone. A client that reads only `host` and `port` reads
          this key too to learn that TLS is required: a plaintext client
          reaching a TLS listener fails its handshake and exchanges no command.
