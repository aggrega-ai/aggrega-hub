apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/cloud-healthcare-api
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: the Cloud Healthcare API is
  # a hosted service the reader contracts for with Google Cloud, under
  # Google Cloud's terms, which no SPDX identifier names. That is the
  # situation component.aggrega.ai/upstream-licensing records as
  # proprietary. No realization pins an artifact of the service, so the
  # catalog distributes and brokers none, and the standard library's
  # admission test, which reads the artifacts an entity pins, finds nothing
  # to refuse.
  #
  # The dataset's behaviour follows the Cloud Healthcare API's REST
  # reference: the service endpoint healthcare.googleapis.com and the v1
  # paths of a dataset and its stores; the rule for a FHIR and an HL7v2
  # store's ID, and the length of a DICOM store's; a FHIR store's version,
  # required and fixed when the store is created; and the methods of a
  # store, none of them a backup.
  description: >
    One Cloud Healthcare API dataset and the FHIR, DICOM and HL7v2 stores
    its values declare: Google Cloud's managed store for clinical data,
    which a client reads and writes through the Healthcare API at
    healthcare.googleapis.com in the standard each store speaks, FHIR
    resources over the FHIR REST API, DICOM studies over DICOMweb, HL7v2
    messages. A consumer reads the API's host and port, and endpoint, the
    dataset's URL, beneath which each store answers at
    fhirStores/<name>/fhir, dicomStores/<name>/dicomWeb or
    hl7V2Stores/<name>.

    The Healthcare API takes no password: a client signs each request as
    the Google identity it runs under, and the IAM role granting that
    identity access to the dataset is the operator's, so no credential slot
    is declared, and no protocol is published.

    Reach for it where an application keeps patient records, medical images
    or clinical messages in Google Cloud. Consent stores, notifications,
    streaming to BigQuery and the stores' validation and parser settings
    are not offered.

    Each Recipe's description says which keys it honours and which it
    refuses by name. The Healthcare API keeps no backup of a dataset, so a
    core/backup attachment halts, naming it.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `catalog: {}` keeps a working contract: a
      # dataset holding no store.
      fhir_stores:
        type: object
        default: {}
        additionalProperties:
          type: object
          properties:
            version:
              type: string
              enum: [DSTU2, STU3, R4, R5]
              description: >
                The FHIR release the store serves, spelt as the Healthcare API
                spells it: DSTU2, STU3, R4 or R5. The service requires it and
                fixes it when it creates the store, so a changed release takes
                a new, empty store.
          required: [version]
          additionalProperties: false
        description: >
          The dataset's FHIR stores, a map from each store's name to its
          settings, created with the dataset. A client reaches a store's
          FHIR REST API at fhirStores/<name>/fhir beneath endpoint. Left
          empty, the dataset holds none.
      dicom_stores:
        type: array
        items:
          type: string
        default: []
        description: >
          The names of the dataset's DICOM stores, created with the dataset.
          A client reaches a store's DICOMweb API at
          dicomStores/<name>/dicomWeb beneath endpoint. Each name is 1 to
          256 letters, digits, underscores, hyphens and periods, the rule of
          a FHIR and an HL7v2 store's name, which keeps it one segment of
          the store's URL. Left empty, the dataset holds none.
      hl7_v2_stores:
        type: array
        items:
          type: string
        default: []
        description: >
          The names of the dataset's HL7v2 stores, created with the dataset.
          A client reaches a store's messages at hl7V2Stores/<name>/messages
          beneath endpoint. Left empty, the dataset holds none.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The name of the Healthcare API's endpoint,
          healthcare.googleapis.com, which every dataset answers at, the
          service's own and none of the operator's choosing; a client tells
          its dataset from another by the path endpoint carries.
      port:
        type: integer
        required: true
        description: TCP port the endpoint answers on, 443, over HTTPS.
      endpoint:
        type: string
        required: true
        description: >
          The dataset's URL,
          https://healthcare.googleapis.com/v1/projects/<project>/locations/<location>/datasets/<dataset>,
          beneath which each store answers. It carries no credential.

  # A store's name is one segment of its URL beneath the dataset's. The
  # Healthcare API takes 1 to 256 letters, digits, underscores, hyphens and
  # periods as a FHIR or an HL7v2 store's ID, and any string of up to 256
  # characters as a DICOM store's; this Component holds a DICOM store to the
  # first rule too, which keeps its name one segment of its URL, and its
  # message says that reason rather than the API's. A list naming a store
  # twice would name one store, so it halts.
  assertions:
    store_names: >-
      {{- $kinds := dict "fhir_stores" (sortAlpha (keys (default dict (optional .values "fhir_stores" dict)))) "dicom_stores" (default list (optional .values "dicom_stores" list)) "hl7_v2_stores" (default list (optional .values "hl7_v2_stores" list)) -}}
      {{- range $kind := list "fhir_stores" "dicom_stores" "hl7_v2_stores" -}}
      {{- $seen := dict -}}
      {{- range $name := get $kinds $kind -}}
      {{- if not (regexMatch `^[\p{L}\p{N}_.-]{1,256}$` (toString $name)) -}}
      {{- if eq $kind "dicom_stores" -}}
      {{- fail (printf "values.dicom_stores names a store %q, and this Component keeps a DICOM store's name to 1 to 256 letters, digits, underscores, hyphens and periods, so that it stays one segment of the store's URL: rename it in the Aggregate" (toString $name)) -}}
      {{- end -}}
      {{- fail (printf "values.%s names a store %q, and the Healthcare API takes a store's name of 1 to 256 letters, digits, underscores, hyphens and periods: rename it in the Aggregate" $kind (toString $name)) -}}
      {{- end -}}
      {{- if hasKey $seen (toString $name) -}}
      {{- fail (printf "values.%s names the store %q twice, and a dataset holds one store of a name of each kind: remove one of the two from the Aggregate" $kind (toString $name)) -}}
      {{- end -}}
      {{- $_ := set $seen (toString $name) true -}}
      {{- end -}}
      {{- end -}}
