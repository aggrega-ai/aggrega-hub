apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/mariadb-operator
  version: 1.0.0
  license: MIT
  description: >
    The mariadb-operator control plane, declared as an explicit component so a
    controller-driven MariaDB realization can ship its runtime prerequisite
    alongside the MariaDB custom resource it emits, rather than assuming an ambient
    install. The control plane is the controller that reconciles MariaDB custom
    resources into running database servers, their client Services and their
    credential Secrets. Declare this component in the same Aggregate as a
    controller-driven MariaDB to satisfy the MariaDB component's control-plane
    prerequisite; the operator affirms the prerequisite on the database in the same
    Release.

    Realized on Kubernetes by two Helm Recipes. `mariadb-operator-chart`
    renders the project's own chart, custom-resource definitions, certificate
    controller and admission webhook included: reach for it for a full install,
    where the chart repository is reachable from the build. `mariadb-operator`
    is a minimal bootstrap installing the controller alone: reach for it where
    the definitions are already installed in the cluster and the build must
    fetch nothing.

    The controller serves its own metrics on its pod. With
    `values.metrics_enabled` true each Recipe puts their port on a ClusterIP
    Service in the control plane's namespace and publishes the address as
    `metrics_endpoint`; false, that key is empty.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # The controller's own metrics, in the Prometheus format: /metrics on
      # port 8080, the metrics address the Recipe starts it with, over plain
      # HTTP on every address of its pod, from a listener serving those metrics
      # and nothing else. They are served whatever this value says, so false
      # only keeps their address unpublished; true puts the port on a ClusterIP
      # Service of its own in infra.namespace, reachable inside the cluster.
      metrics_enabled:
        type: boolean
        default: false
        description: Publishes the address of the controller's own metrics, in the Prometheus format, as `metrics_endpoint`, putting their port on a ClusterIP Service of its own; while false that key is empty. The metrics port checks no caller, so anything that reaches it can read them.
    infra:
      image:
        type: string
        default: "ghcr.io/mariadb-operator/mariadb-operator:26.10.0"
        description: mariadb-operator image the control-plane Deployment runs. Pinned to a release tag so the rendered workload references an immutable version.
      namespace:
        type: string
        default: "mariadb-system"
        description: Namespace the control plane is installed into. It watches MariaDB custom resources across the whole cluster, so this names where the controller runs rather than what it reconciles. The `mariadb-operator-chart` realization requires the Release to declare the same namespace for the component.
      # Read by the chart realization alone; the bootstrap pulls no chart.
      source_version:
        type: string
        description: Version of the mariadb-operator chart the `mariadb-operator-chart` realization pulls. Its default is the release whose application version is the tag of the image default above; changing it away from that default does not guarantee value-mapping compatibility with the new chart, and the image follows it only where it is set too.
      # Provider-specific overrides. Each Recipe documents which keys it reads;
      # the bootstrap reads none.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides; each Recipe documents the keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # Nothing reaches the control plane at an address — it reconciles the
      # MariaDB custom resources a controller-driven MariaDB emits — so the one
      # key is the address a Prometheus server scrapes the controller's own
      # metrics at, while values.metrics_enabled is true. The Recipe publishes
      # it spelled out in full, its host qualified with infra.namespace, because
      # the Service lives in the control plane's own namespace rather than the
      # Release's.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>.<namespace>:8080/metrics`,
          the host qualified with the namespace the control plane runs in.
          Empty while values.metrics_enabled is false.
