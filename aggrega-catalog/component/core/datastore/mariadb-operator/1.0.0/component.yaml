apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/mariadb-operator
  version: 1.0.0
  license: MIT
  description: >
    The mariadb-operator control plane, declared as an explicit component so a
    controller-driven MariaDB realization can ship its runtime prerequisite
    alongside the MariaDB custom resource it emits, rather than assuming an ambient
    install. The control plane is the controller that reconciles MariaDB custom
    resources into running database servers, their client Services and their
    credential Secrets. Declare this component in the same Aggregate as a
    controller-driven MariaDB to satisfy the MariaDB component's control-plane
    prerequisite; the operator affirms the prerequisite on the database in the same
    Release. Realized on Kubernetes via its Helm Recipe.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      image:
        type: string
        default: "ghcr.io/mariadb-operator/mariadb-operator:26.10.0"
        description: mariadb-operator image the control-plane Deployment runs. Pinned to a release tag so the rendered workload references an immutable version.
      namespace:
        type: string
        default: "mariadb-system"
        description: Namespace the control plane is installed into. It watches MariaDB custom resources across the whole cluster, so this names where the controller runs rather than what it reconciles.
