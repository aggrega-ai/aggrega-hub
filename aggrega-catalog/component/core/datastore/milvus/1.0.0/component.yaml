apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/milvus
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    A Milvus vector database. Stores embedding vectors with their scalar fields
    and answers similarity searches over them, so a component that retrieves
    by similarity is wired here. Collections are created through Milvus's own
    API at runtime; the component declares the server, not its contents. It runs
    as one standalone server holding its metadata store and its data on one
    volume, with no separate etcd or object store to deploy.

    Exports its host, port, protocol, an endpoint joining them and the account a
    client signs in as. Authentication is off unless a password is attached;
    attached, it is switched on for the API and for the management endpoints the
    metrics port serves, whose health check and metrics stay open, and the
    password is delivered by reference.

    Realized by the product's own Helm chart on Kubernetes, fetched at build
    time, and by a Compose Recipe for local development. Its Recipes are verified
    by their rendered output, not by a started server.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: Milvus is a vector database, and no value supplied makes it
    # something else. That is why it sits on the component itself, as it does on
    # core/datastore/qdrant.
    datastore.aggrega.ai/engine: vector
    # Both Recipes run the server as a container in the Release's own boundary,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional password credential slot. Milvus serves without authentication by
    # default. When a credential is attached here, every Recipe switches the
    # server's authentication on — for its API, and for the management endpoints
    # its metrics port serves, whose health check and metrics stay open — and
    # supplies the credential as the password of the `root` account the server
    # creates at its first start; unattached, every Recipe switches both off
    # explicitly, so the server's built-in `root` password is never the one in
    # force — not even when a custom_config block asks for authentication.
    # `required` omitted → optional, so a bare `vectors: {}` still loads. Transparent (inject: [env]) so the injected value
    # reaches the Recipe on the env pipe; the selector is secret-kind-pinned but
    # family-agnostic. The Helm Recipe reads the credential from the Secret it
    # names, and halts on a credential that names none; the Compose Recipe reads
    # the value its credential delivers.
    #
    # The password takes effect when the server first starts on an empty volume:
    # that is when the root account is created with it. A later change to the
    # attached credential does not change the account's password; Milvus rotates
    # it through its own credential API. Milvus's documentation asks for at least
    # 6 characters, and its configuration caps this password at 72.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional password of the server's root account. When attached, authentication is switched on for the API and for the management endpoints on the metrics port, and the password is delivered by reference; unattached, authentication is off on both and the server accepts unauthenticated requests."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Unset by
      # default, so a bare `vectors: {}` renders no configuration file of its own
      # and the server keeps its built-in settings.
      custom_config:
        type: string
        description: >
          Raw server configuration block (milvus.yaml format), delivered to the
          server as its user.yaml, which it reads over its built-in settings, so a
          setting the block omits keeps its default. The settings the Recipes make
          themselves take precedence over the block: the listen port, the
          embedded metadata store and local storage, and authentication, which
          follows the password slot alone.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 19530
        description: >
          Port the server's API is published on — the gRPC API and the RESTful
          API share it. Most operators should omit this and let the Recipe assign
          the default (19530). On Kubernetes it is the Service port, forwarding to
          the port the chart's container listens on; on Compose the server listens
          on it.
      engine_version:
        type: string
        # Pinned by tag and by the digest of the image's index, so every platform
        # the project publishes resolves to the build read when this default was
        # set. A Release may name another tag, with or without a digest.
        default: "v3.0.3@sha256:08747249b27c64f158db79a53ba008f89314ee240c731e585a7ec4fb7140731e"
        description: >
          Tag of the milvusdb/milvus image every Recipe runs, optionally followed
          by @ and the digest it must resolve to. The Recipes configure the
          server through the settings of the 3.0 release; another release may
          need other ones.
      source_version:
        type: string
        description: Version of the Helm chart the Kubernetes Recipe pulls. Read only by that Recipe; the Compose Recipe pulls no source artifact and ignores it. Changing it away from the Recipe's default does not guarantee value-mapping compatibility with the new chart.
      compute:
        # The defaults are the minimum the product's own requirements name for a
        # standalone server: 8 GB of memory, and 2 virtual CPUs for the container
        # it runs in. Less memory may stop it starting.
        cpu:
          type: string
          default: "2"
        memory:
          type: string
          default: 8Gi
      storage:
        type: object
        properties:
          size:
            type: string
            # The chart's own default for the standalone server's volume.
            default: 50Gi
            description: >
              Size of the volume holding the server's metadata store and its
              data on Kubernetes. The Compose Recipe creates the volume and
              honors no size, the target having no volume-size concept.
          type:
            type: string
            description: >
              Storage class the server's volume is provisioned from on Kubernetes.
              Leave it unset to take the cluster's default storage class; set it
              to name another class the cluster offers. The Compose Recipe names no
              class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client connects to. On Kubernetes it is the Service's DNS name, and on Compose the service name.
      port:
        type: integer
        required: true
        description: >
          TCP port the server's API answers on. It follows the port an operator
          set in the Release, so a consumer reads it rather than assuming 19530.
      user:
        type: string
        description: >
          Name of the account a client signs in as when a password is attached —
          `root`, the account the server creates at its first start. The matching
          password arrives through the credential attached to the component,
          never through this contract. With no password attached the server
          checks no credential.
      protocol:
        type: string
        description: >
          Scheme a client composes the server's address with — `http`, as in
          http://<host>:<port>, the form Milvus's own clients take.
      endpoint:
        type: string
        description: >
          The server's address as one URI, http://<host>:<port>, for a client
          that takes one address rather than its parts. It carries no
          credential.
