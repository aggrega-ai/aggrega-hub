apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/chroma
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: Apache-2.0
  description: >
    A Chroma vector database. Stores embeddings with their documents and
    metadata in named collections and answers nearest-neighbour queries over
    them through Chroma's HTTP API, so an application that retrieves reference
    material by similarity is wired here rather than to a general-purpose store.
    Collections are created through that API at runtime; the component declares
    the server, not its contents. Exports its host, port and protocol via the
    uses topology.

    The server checks no credential: at 1.5.9, the release this component runs
    by default, any client that reaches its address reads and writes every
    collection. Both
    Recipes therefore publish it only inside the Release — a ClusterIP Service
    on Kubernetes, the compose network locally — and a Release that exposes it
    further puts something that authenticates clients in front of it.

    Realized two ways, both self-hosted and both fetching nothing: reach for the
    Helm Recipe on Kubernetes, which synthesizes a StatefulSet with a persistent
    volume, and for the Compose Recipe for local development. Its Recipes are
    verified by their rendered output, not by a started server storing and
    querying vectors.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: Chroma is a vector search engine, and no value supplied makes it
    # something else, so it sits on the component itself.
    datastore.aggrega.ai/engine: vector
    # Both Recipes run the server as a container in the Release's own boundary,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  # No credential slot is declared, because the server has nothing to check one
  # against: at 1.5.9, the default engine_version, the server reads no
  # authentication setting from its configuration and grants every request the
  # default tenant and database. A slot here would be one a Release could fill
  # with no effect.
  #
  # engine_version names an image tag. The Recipes configure the server through
  # the settings its 1.x releases read — its port and server options from
  # CHROMA_-prefixed environment variables, its data path from the configuration
  # file the image ships — and a release of another major series reads a
  # different configuration. The build therefore halts, naming the key, on a
  # value that is not a 1.x release, rather than rendering a server that does
  # not take the settings it is handed. It holds whichever Recipe binds, so it is
  # stated once, here.
  assertions:
    engine_version_names_a_1x_release: >-
      {{- $tag := optional .infra "engine_version" "" -}}
      {{- if not (regexMatch "^1\\.[0-9]+\\.[0-9]+" $tag) -}}
      {{- fail (printf "infra.engine_version is %q, which is not a Chroma 1.x release: the Recipes configure the server the way its 1.x releases read their settings, so set a release tag such as 1.5.9" $tag) -}}
      {{- end -}}
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each knob
      # keeps the server's own default unless the Aggregate sets it, so a bare
      # `vectors: {}` renders no server settings beyond the port.
      allow_reset:
        type: boolean
        default: false
        description: >
          Let a client wipe every collection through the server's reset call.
          Off by default, matching the server's own default; since the server
          checks no credential, turning it on lets any client that reaches the
          address do so.
      max_payload_size_bytes:
        type: integer
        min: 1
        description: Largest request body the server accepts, in bytes. Omit to use the server default (41943040, which is 40 MiB).
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: >
          HTTP listen port. Most operators should omit this and let the Recipe
          assign the default (8000). Every Recipe hands it to the server as its
          own port, so the server, its health check and the published address
          all follow it.
      engine_version:
        type: string
        default: "1.5.9"
        description: >
          Tag of the chromadb/chroma image the Recipes run, a Chroma release
          such as 1.5.9. The build halts on a value that is not a 1.x release,
          because the Recipes configure the server the way its 1.x releases read
          their settings.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
            description: >
              Size of the volume holding the collections on Kubernetes. The
              Compose Recipe creates the volume and honors no size, the target
              having no volume-size concept.
          type:
            type: string
            description: >
              Storage class the volume is provisioned from on Kubernetes. Leave
              it unset to take the cluster's default storage class; set it to
              name another class the cluster offers. The Compose Recipe names no
              class.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: Address a client calls the server's HTTP API at. On Kubernetes it is the Service's DNS name, and on Compose the service name.
      port:
        type: integer
        required: true
        description: >
          TCP port the HTTP API is served on. It follows the port an operator
          set in the Release, so a consumer reads it rather than assuming a
          default.
      protocol:
        type: string
        description: >
          How the published address is spoken to on `port` — `http`, so a
          consumer composes its address on that scheme.
