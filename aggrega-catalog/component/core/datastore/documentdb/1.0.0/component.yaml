apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/documentdb
  version: 1.0.0
  license: MIT
  description: >
    A PostgreSQL-backed document store: PostgreSQL 17 with the DocumentDB
    extension. It presents the standard PostgreSQL wire contract
    (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB) and persists data on a
    volume, so it is a stateful server. It is the storage backend for a
    document proxy that speaks a document-database wire protocol on top of it;
    the proxy connects over the exported host, port, user, and database. Exports
    its host, port, user, database, and protocol to consumers via the uses
    topology.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: ["env"]
  featuresSchema:
    # Optional password credential slot. When a deployment attaches a credential
    # here, the Recipe wires the database password through the credential
    # subsystem; when unattached, the Recipe falls back to its inline default.
    # `required` omitted → optional, so a bare `backend: {}` deployment still
    # loads. Transparent (inject: [env]) so a synthesized Workload may reference
    # it as an env secret; the selector is secret-kind-pinned but family-agnostic
    # so either an inject-value or a referenceable credential may fill it.
    password:
      selector: "feature.aggrega.ai/kind=secret"
      inject: [env]
      description: "Optional database password credential. When attached, supplies POSTGRES_PASSWORD via the credential subsystem; unattached, the Recipe uses its inline default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      user:
        type: string
        default: postgres
        description: Application database user created on startup (POSTGRES_USER).
      database:
        type: string
        default: postgres
        description: Logical database name created on startup (POSTGRES_DB).
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 5432
        description: Server listen port. Most operators should omit this and let the Recipe assign the default (5432).
      engine_version:
        type: string
        default: "17-0.107.0-ferretdb-2.7.0"
        description: Backend image tag (PostgreSQL major version plus the DocumentDB extension build).
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 512Mi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
          type:
            type: string
            default: gp3
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host: { type: string, required: true }
      port: { type: integer, required: true }
      user: { type: string }
      database: { type: string }
      protocol: { type: string }
