apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/datastore/weaviate
  version: 1.0.0
  # metadata.license records the licence of the wrapped product, which is a
  # different field from the licence of this catalog file itself (the SPDX header
  # above) and from the upstream-licensing class label below.
  license: BSD-3-Clause
  description: >
    A Weaviate vector database. Stores objects together with their embedding
    vectors and answers nearest-neighbour and hybrid queries over them, so an
    application that retrieves reference material by similarity is wired to
    this component rather than to a general-purpose store. Collections are created
    through Weaviate's own API at runtime; the component declares the server, not
    its contents. Where the application supplies its own vectors the vectorizer
    module is left unset, which is the default; naming a module makes the server
    compute vectors for incoming objects. Provider-agnostic: the same component
    is implemented by a Helm Recipe (Workload synthesis to native Kubernetes
    resources, running the official upstream image with no external chart) and a
    Compose Recipe (local development). Exports its host, its HTTP port and its
    gRPC port to consumers via the uses topology.

    With `values.metrics_enabled` true each Recipe turns on Weaviate's metrics,
    served at /metrics on port 2112, and publishes that address as
    `metrics_endpoint`; false, that key is empty. The port checks no caller,
    even where an API key is attached, and also answers /tenant-activity,
    listing each collection's tenants with their last read and write.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: datastore
    # The engine value is an objective, configuration-independent fact about this
    # product: Weaviate is a vector search engine, and no value supplied makes
    # it something else. That is why it sits on the component
    # rather than on a specialization — the same standing the operational
    # primitive has. A general-purpose store whose vector capability arrives with
    # an extension is the opposite case, and carries the value on a
    # specialization or through the label-transform role instead.
    datastore.aggrega.ai/engine: vector
    # Both Recipes run the server as containers in the deployment's own cluster,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  annotations:
    # How the store's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. Weaviate serves its metrics on a
    # listener of its own, port 2112, which checks no caller; the api_key slot's
    # key guards the REST and gRPC APIs alone, so a scrape presents no
    # credential whether or not a key is attached.
    observability.aggrega.ai/metrics-credential: none
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional API-key credential slot. When a credential is attached
    # here, the Recipe turns anonymous access off, enables API-key authentication
    # and supplies the key, which is then bound to the identity named by
    # values.api_key_user. `required` omitted → optional, so a bare
    # `vectors: {}` still loads and serves anonymous requests. The
    # Recipes state the access posture in the rendered output either way, so an
    # unattached deployment renders an explicit anonymous-access setting rather
    # than leaving the posture to a server default a reader of the output cannot
    # see. Transparent (inject: [env]) so the injected value reaches the Recipe on
    # the env pipe; the selector is secret-kind-pinned but family-agnostic, so
    # either a referenceable Secret (helm secretKeyRef) or an inject-value
    # (compose inject pipe) may fill it.
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional API-key credential. When attached, anonymous access is turned off and every request must present this key, which is bound to the user named by values.api_key_user; unattached, the server accepts anonymous requests."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      vectorizer_module:
        type: string
        description: Name of the server-side module that computes vectors for incoming objects (for example text2vec-openai). Omit where the application supplies its own vectors, which is the default.
      enable_modules:
        type: string
        description: Comma-separated list of server modules to load. Omit for a server with no modules loaded. A named vectorizer_module must appear in this list for the server to load it.
      query_defaults_limit:
        type: integer
        min: 1
        description: Default number of results a query returns when it names no limit of its own. Omit to use the server default (100).
      api_key_user:
        type: string
        default: weaviate-admin
        description: Identity the attached API key authenticates as. Read only when a credential is attached to the api_key slot; with none attached it is never read.
      # Weaviate's own metrics, in the Prometheus format.
      # PROMETHEUS_MONITORING_ENABLED switches them on, and Weaviate then starts a
      # listener of its own on every interface, port 2112, apart from its API.
      # That listener serves /metrics and also /tenant-activity, which answers
      # with every collection's tenants and when each was last read and written.
      # Neither checks a caller: the API key the api_key slot turns on guards the
      # REST and gRPC APIs, not this port. The metrics come as one set per shard,
      # and a tenant is a shard. The Recipes deliver the variable only while this
      # value is true, so false leaves the listener off and its address
      # unpublished.
      metrics_enabled:
        type: boolean
        default: false
        description: Turns on Weaviate's own metrics, in the Prometheus format, on a port of their own, 2112, and publishes their address as `metrics_endpoint`; while false that key is empty. The port checks no caller, even with an API key attached, and also answers /tenant-activity with each collection's tenant names and when each was last read and written.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: HTTP (REST and GraphQL) listen port. Most operators should omit this and let the Recipe assign the default (8080).
      grpc_port:
        type: integer
        min: 1024
        max: 65535
        default: 50051
        description: gRPC listen port, published alongside the HTTP port for clients that prefer it. Most operators should omit this and let the Recipe assign the default (50051).
      engine_version:
        type: string
        default: "1.39.2"
        description: Weaviate container image tag.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
      storage:
        type: object
        properties:
          size:
            type: string
            default: 32Gi
            description: Persistent volume size for the vector data. Realized on the synthesized-Helm target; the Compose flavor is ephemeral.
          type:
            type: string
            description: >
              Persistent volume storage class for the vector data. Realized on
              the synthesized-Helm target; the Compose flavor is ephemeral. Leave
              it unset to take the cluster's default storage class; set it to
              name another class the cluster offers.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # host and port are the pair an ai-agent's knowledge-base socket reads.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the vector database. A
          consumer dials this name together with whichever of the two
          published ports its client speaks.
      port:
        type: integer
        required: true
        description: >
          TCP port the REST and GraphQL APIs are served on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming a default.
      grpc_port:
        type: integer
        description: >
          TCP port the gRPC API is served on, published beside the HTTP port
          for a client that prefers it. It is a second listener on the same
          server, not an alternative address.
      protocol:
        type: string
        description: >
          How the published address is spoken to on `port` — `http`, so a
          consumer reaching the REST or GraphQL API composes its address on
          that scheme.
      # The address a Prometheus server scrapes the store's own metrics at,
      # while values.metrics_enabled is true: /metrics on port 2112 of the name
      # each Recipe's Service carries. Every Recipe publishes it spelled out in
      # full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:2112/metrics`, the host
          being the store's Service name. Empty while values.metrics_enabled
          is false.
