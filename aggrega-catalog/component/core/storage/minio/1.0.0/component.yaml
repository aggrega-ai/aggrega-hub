apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/storage/minio
  version: 1.0.0
  license: AGPL-3.0
  description: >
    A MinIO S3-compatible object-storage server. The upstream distribution this
    component installs no longer receives updates; a maintained distribution is
    expected to replace it in a later version of this component. MinIO stores
    objects on a local data volume and serves them over an S3-compatible API
    endpoint, so it renders as a self-hosted running server backed by a
    persistent volume — not a managed-cloud storage resource. Its operational
    type is therefore `server`:
    the deployment runs and owns the MinIO process, rather than pointing at a
    provider-managed bucket. A root account is always present: its username is a
    developer value and its password is wired through the optional `root_password`
    credential slot. When a credential is attached its value becomes the root
    password; when none is attached the Recipe supplies a deterministic
    development default, so the render stays byte-identical across runs rather
    than depending on a server-generated random password. This component ships a
    single standalone object store; distributed/erasure-coded topologies and
    bucket provisioning are future refinements not modelled here. Provider-agnostic:
    the same component is implemented by a Helm Recipe (a synthesized Kubernetes
    workload running the upstream `quay.io/minio/minio` image) and a Compose
    Recipe (local development). Exports its S3 API endpoint, host, port and
    protocol to consumers via the uses topology. The packaged MinIO
    server is AGPL-3.0; deployments that link or distribute it inherit that
    license's terms.

    Each Recipe publishes where MinIO serves its Prometheus metrics as
    `metrics_endpoint`; a scrape presents a token of their own, which `mc admin
    prometheus generate` mints.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    component.aggrega.ai/upstream-licensing: osi-approved
  annotations:
    # How the store's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. MinIO answers its metrics only
    # to a bearer token of their own, a JWT minted for an account allowed the
    # admin:Prometheus action, never to the root password the root_password
    # slot holds, so a scrape presents that token.
    observability.aggrega.ai/metrics-credential: separate-token
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved credential values
  # into the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional root-password credential slot. The MinIO root account is always
    # present; when a credential is attached here, the Recipe wires its
    # value as the root password through the credential subsystem. When
    # unattached, the Recipe falls back to a deterministic inline development
    # default rather than letting MinIO's chart generate a random password (which
    # would make the rendered output non-deterministic). `required` omitted →
    # optional, so a bare `store: {}` still loads. Transparent
    # (inject: [env]) so the injected value reaches the Recipe on the env pipe;
    # the selector is secret-kind-pinned but family-agnostic so either an
    # inject-value or a referenceable credential may fill it.
    # To replace the Recipe's development default, attach core/random-password: the
    # cluster generates it, and slots sharing it take it by core/referenced-secret.
    root_password:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional MinIO root-password credential. When attached, supplies the root password via the credential subsystem; unattached, the Recipe uses a deterministic development default."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      root_user:
        type: string
        default: admin
        description: MinIO root account username. The account is always created; its password is wired through the optional `root_password` credential slot.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 9000
        description: TCP port the MinIO S3 API endpoint listens on. Most operators should omit this and let the Recipe assign the default (9000).
      external_base_url:
        type: string
        description: >
          Externally reachable address of the S3 API, as assembled at the ingress
          tier — scheme, host and, where it is not the scheme's default, port,
          with no path; for example https://s3.example.com. The server
          advertises this as its own endpoint: it is the origin endpoint every
          bucket event notification carries, the host of the presigned address
          it hands an Object Lambda target, and the API address it reports. The
          server drops a path from this setting, so the Recipes halt the build on
          an address carrying one. Omitted, the server advertises the addresses
          it listens on.
      engine_version:
        type: string
        default: "RELEASE.2025-07-23T15-54-02Z"
        description: The `quay.io/minio/minio` image tag both the Kubernetes and Compose Recipes render on the synthesized MinIO workload.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 512Mi
      storage:
        size:
          type: string
          default: 8Gi
          description: Size of the persistent volume backing MinIO's object data.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the S3 API. A consumer
          that composes its own address dials this name together with `port`;
          one that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts S3 API requests on. It follows the
          port an operator set in the Release, so a consumer reads it rather
          than assuming 9000.
      endpoint:
        type: string
        required: true
        description: >
          Full in-cluster base URL of the S3 API — scheme, host and port
          composed — the address a consumer points its S3 client at. The scheme
          is the one this server is reached over, so a consumer takes the
          address as published rather than assuming http.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `s3`, so a consumer
          knows to reach it with an S3 client rather than a plain HTTP one.
      # The address a Prometheus server scrapes the store's own metrics at:
      # /minio/v2/metrics/cluster on the S3 API port, the cluster-wide metrics
      # MinIO serves by default. Every Recipe publishes it spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path,
          `http://<host>:<port>/minio/v2/metrics/cluster`, the cluster-wide
          metrics MinIO serves by default on its S3 API port.
      # Whether a scrape of metrics_endpoint presents a credential. MinIO checks
      # a bearer token on its metrics in every configuration these Recipes
      # render, so each publishes true. `mc admin prometheus generate` mints the
      # token from the account the mc alias signs in as, so an alias for an
      # account allowed admin:Prometheus and nothing else gives the scraper a
      # token that reads the metrics and nothing more.
      metrics_credential_required:
        type: boolean
        description: >
          Whether a scrape of `metrics_endpoint` must present a credential:
          always true. MinIO answers its metrics only to a bearer token, a JWT
          signed for an account allowed the `admin:Prometheus` action, which
          `mc admin prometheus generate` mints. Mint it for an account allowed
          that action alone, so the scraper's token reads the metrics and
          nothing else.
