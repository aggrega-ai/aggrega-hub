apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/azure-blob-storage
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Azure Blob Storage is a
  # hosted service the reader contracts for with Microsoft, under Azure's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  description: >
    One Azure Storage account holding blob containers: Microsoft's managed
    object storage, holding the containers values.containers names, each a
    flat namespace of blobs, or, with values.is_hns_enabled, the directories
    and files of Azure Data Lake Storage. A consumer reads the account's
    blob host name and endpoint and its Data Lake Storage endpoint, and calls
    the account through an Azure Storage client library over HTTPS.

    The account takes requests authenticated with Microsoft Entra ID alone:
    its Shared Key authorization is off, so its account keys authorize no
    request, no key or connection string reaches a consumer, and no
    credential slot is declared. A client authenticates as the managed
    identity it runs under, and the role assignment granting that identity
    a Storage Blob Data role is the operator's. No container takes an
    anonymous request.

    Reach for it where an application in Azure keeps objects or files that
    Azure's own client libraries and analytics engines read, and for
    core/storage/s3-object-store where a consumer speaks the S3 API. Each
    Recipe's description says which keys it honours and which it refuses
    by name. Microsoft's Azure Backup protects blobs through a Backup vault
    and a backup instance created apart from the account, so no backup is
    configured, and a core/backup attachment halts, since that Feature
    applies to stateful servers.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: storage
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. Each value
      # carries a default, so a bare `files: {}` keeps a working contract: an
      # account holding no container, with a flat namespace.
      containers:
        type: object
        default: {}
        propertyNames:
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          minLength: 3
          maxLength: 63
        additionalProperties:
          type: object
          additionalProperties: false
        description: >
          The account's blob containers, a map from each container's name to
          its settings, of which this version declares none, so each takes
          an empty map. Microsoft documents a container's name as 3 to 63
          lowercase letters, digits and hyphens, beginning and ending with a
          letter or a digit, each hyphen between two of them; the build
          halts on another, naming this key. With the hierarchical namespace
          on, each container is a Data Lake Storage file system. Left empty,
          the account holds no container.
      is_hns_enabled:
        type: boolean
        default: false
        description: >
          Whether the account has the hierarchical namespace of Azure Data
          Lake Storage, false unless set: directories and files with access
          control lists of their own, reached at dfs_endpoint as well as at
          endpoint, the account an analytics engine reads through the Hadoop
          ABFS driver. Microsoft documents turning it on for an existing
          account as a one-way upgrade, so it is chosen when the account is
          created.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      host:
        type: string
        required: true
        description: >
          The DNS name of the account's blob service,
          <account>.blob.core.windows.net in Azure's public cloud. A
          realization publishes a pointer string the provisioning tool
          resolves once the account exists, so a consumer reads this rather
          than deriving one, or the DNS name the Release sets in
          infra.overrides.host instead.
      endpoint:
        type: string
        description: >
          The URL of the account's blob service, https:// followed by host
          and a slash, which an Azure Blob Storage client library takes as
          the account's service URL. It carries no credential.
      dfs_endpoint:
        type: string
        description: >
          The URL of the account's Data Lake Storage endpoint as the service
          reports it, https://<account>.dfs.core.windows.net/ in Azure's
          public cloud, which a Data Lake Storage client library and the
          Hadoop ABFS driver reach the hierarchical namespace at while
          values.is_hns_enabled is true; without the namespace, a client
          reaches the account's blobs at endpoint. It carries no credential.
