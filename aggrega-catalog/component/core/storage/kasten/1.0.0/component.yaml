apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/kasten
  version: 1.0.0
  description: >
    Veeam Kasten, a backup controller for Kubernetes, installed once per
    cluster in the namespace kasten-io. On the policies written for it, it
    snapshots the resources and volumes of the workloads they select and
    exports them to a location profile: a bucket reached over the S3 API, or
    a volume claim. It restores them from there.

    It backs nothing up by itself. A datastore is backed up by attaching
    core/backup to it in the Release, with the Manifest binding the
    helm/backup-kasten FeatureRecipe, which writes the policy and its location
    profile into kasten-io. The Release declares the namespace kasten-io for
    this component.

    Kasten is Veeam's software, run under Veeam's end-user licence agreement,
    which whoever installs it accepts. Its chart carries a free edition
    licence, for five worker nodes after the first 30 days, and a Kasten
    licence of the reader's own goes into a Secret in kasten-io. The compiler
    validates no licence and contacts no vendor.

    Kasten's data mover serves its repository over TLS with a certificate and
    key it reads from two Secrets in kasten-io, kopia-tls-cert and
    kopia-tls-key, which the operator creates in the cluster. The required
    data_mover_cert and data_mover_key slots name them, each filled by a
    credential naming that existing Secret, so no key is in a rendered file;
    the build halts while either is unfilled.

    Realized on Kubernetes by helm/kasten-chart, Kasten's own chart, whose
    chart repository must be reachable from the build.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    # Kasten is Veeam's proprietary software: its chart and images are
    # published under Veeam's end-user licence agreement, and no source licence
    # is granted. Its images are built on Red Hat's Universal Base Image, under
    # Red Hat's own terms. No single licence identifier applies, so
    # metadata.license is left absent.
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Kasten's licence. The chart carries a free edition licence of Veeam's own
  # and writes it into a Secret beside the controller; Veeam's documentation
  # says it allows a cluster of at most 50 worker nodes in the first 30 days
  # and 5 after them. The licence each chart release carries is dated to run
  # for a year from that release — the default release's to 22 October 2027 —
  # and the same documentation says staying on the free edition may need
  # regular updates to a newer release. A reader holding a Kasten licence of
  # their own creates a Secret in kasten-io whose data key license holds it:
  # Kasten reads every such Secret in its namespace and uses whichever is
  # valid, so the licence never passes through the build and is written into
  # no rendered file. Nothing in the build checks what licence a cluster runs
  # under.
  #
  # The data mover's certificate and key. Kasten's data mover serves the
  # repositories it exports to over TLS, and Kasten reads its certificate from
  # the Secret kopia-tls-cert, under the data key tls.crt, and its private key
  # from the Secret kopia-tls-key, under tls.key, both in kasten-io: those names
  # are Kasten's own and no chart value changes them. The certificate is for
  # data-mover-svc.kasten-io and data-mover-svc.kasten-io.svc. Kasten's chart
  # would generate a new pair on every render, so its realization leaves the
  # chart's pair out and these two slots name the Secrets instead. Fill each
  # with core/referenced-secret bound to k8s-existing-secret, which names a
  # Secret that already exists in kasten-io: data_mover_cert names
  # kopia-tls-cert with values.key tls.crt, and data_mover_key names
  # kopia-tls-key with values.key tls.key, declared in the Aggregate, since an
  # attachment the Release alone makes publishes the key value. The material
  # travels by reference and is in no rendered file. Both are required: a
  # Release that binds nothing to either halts the build, naming the slot, and
  # a credential naming another Secret or data key halts it too, since Kasten
  # reads no other. A private key every reader of this catalog held would let
  # anyone impersonate the data mover, so no default is supplied. What the
  # build cannot see is whether the two Secrets exist and hold a matching
  # certificate and key.
  featuresSchema:
    data_mover_cert:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      required: true
      inject: []
      description: "The certificate Kasten's data mover serves over TLS, for data-mover-svc.kasten-io and data-mover-svc.kasten-io.svc, held in the Secret kopia-tls-cert in kasten-io under the data key tls.crt: Kasten reads that Secret by its own fixed name. Fill it with a credential naming that Secret, such as core/referenced-secret bound to k8s-existing-secret. Required: the build halts when nothing binds it, and when the credential names another Secret or data key."
    data_mover_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      required: true
      inject: []
      description: "The private key of the data mover's certificate, held in the Secret kopia-tls-key in kasten-io under the data key tls.key: Kasten reads that Secret by its own fixed name. Fill it with a credential naming that Secret, such as core/referenced-secret bound to k8s-existing-secret, so the key is in no rendered file. Required: the build halts when nothing binds it, and when the credential names another Secret or data key."
  schema:
    infra:
      # Read by the chart realization. The chart release decides every image
      # Kasten runs: each is gcr.io/kasten-images/<service> at the release's
      # own application version, so the chart and its images move together.
      source_version:
        type: string
        description: >
          Version of Kasten's chart the `kasten-chart` realization pulls; the
          chart release decides every image Kasten runs, each tagged with the
          release's own version. Its default is the release the realization
          was read against; changing it does not guarantee that the
          realization's value mapping still fits the chart. A newer release
          also carries a newer free edition licence.
