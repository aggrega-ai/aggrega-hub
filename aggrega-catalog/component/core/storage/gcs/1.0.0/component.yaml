apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/gcs
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Google Cloud Storage is a
  # hosted service the reader contracts for with Google Cloud, under Google
  # Cloud's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary.
  description: >
    One Google Cloud Storage bucket, with the settings only Cloud Storage has,
    reached through Google's own API. A consumer reads the published bucket
    name, its gs:// address and its location, and calls the bucket with
    Google's client libraries as its own Google identity.

    There is no key slot: Google's API authenticates the caller's own Google
    identity, a service account or a workload identity, and access to the
    bucket is granted to that identity by IAM, outside the build.

    Reach for it where the consumer uses Google's client libraries with a
    Google identity, or needs a setting only Cloud Storage has, such as its
    storage class; and for core/storage/s3-object-store where the consumer
    speaks the S3 API with an access key, wherever it runs.

    Realized by terraform/gcs: the bucket is never public, because public
    access prevention is enforced and uniform bucket-level access is on, so
    access is granted by IAM alone and a request setting an object ACL is
    refused.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: storage
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      bucket:
        type: string
        required: true
        description: >
          Name of the bucket, published as `bucket`. A bucket name is unique
          across the whole of Cloud Storage and publicly visible, so it carries
          nothing confidential; the Recipe refuses a name Cloud Storage does
          not take, naming the rule.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      location:
        type: string
        description: >
          Where the bucket's data is stored, published as `location`: a region
          such as europe-west1, a dual-region such as EUR4 or a multi-region
          such as EU. There is no default: the build halts without one,
          because where the data lives is the operator's choice.
      # The storage classes Cloud Storage offers: STANDARD, NEARLINE, COLDLINE
      # and ARCHIVE, which differ in storage price, retrieval cost and minimum
      # storage duration. STANDARD is the cloud-storage module's own default.
      storage_class:
        type: string
        default: STANDARD
        description: >
          The bucket's default storage class, given to every object written
          without one of its own: STANDARD, NEARLINE, COLDLINE or ARCHIVE.
      versioning:
        type: boolean
        default: false
        description: >
          Whether the bucket keeps a noncurrent version of an object each time
          the object is replaced or deleted. Off by default, as the
          cloud-storage module leaves it.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      bucket:
        type: string
        required: true
        description: >
          The bucket's name, the one a consumer passes to Google's client
          libraries.
      url:
        type: string
        required: true
        description: >
          The bucket's gs:// address, gs:// followed by the bucket's name, the
          form Google's tools and many data libraries take.
      location:
        type: string
        description: >
          Where the bucket's data is stored, as the Release names it.
