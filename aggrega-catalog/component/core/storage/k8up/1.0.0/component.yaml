apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/k8up
  version: 1.0.0
  license: Apache-2.0
  description: >
    K8up, the backup operator built on restic. On the schedules written for
    it, it copies the files of a namespace's persistent volume claims into a
    restic repository, here one in a bucket reached over the S3 API or on a
    volume claim in the cluster, and restores them from there. It is
    installed once per cluster and acts on the K8up resources of every
    namespace.

    It backs nothing up by itself. A datastore is backed up by attaching
    core/backup to it in the Release, with the Manifest binding the
    helm/backup-k8up FeatureRecipe, which writes a K8up Schedule beside the
    datastore; the schedule runs only where this component is deployed. That
    FeatureRecipe names on each Schedule the Secret holding its repository
    password, and for a bucket its key.

    Realized on Kubernetes by helm/k8up-chart, the project's own chart, whose
    chart repository must be reachable from the build.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # K8up takes no key at install: each Schedule names the Secrets its backup
  # jobs read the bucket's key and the repository's password from, so this
  # component declares no credential slot. The operator also reads a key and a
  # password from its own environment, as a fallback for a Schedule naming
  # none; the chart realization sets neither, so every repository's password
  # is the one its own Schedule names.
  schema:
    infra:
      # Read by the chart realization; the chart's version decides the
      # custom-resource definitions it installs.
      source_version:
        type: string
        description: >
          Version of the K8up chart the `k8up-chart` realization pulls. Its
          default is the release whose image default is the tag below;
          changing it away from that default does not guarantee value-mapping
          compatibility with the new chart, and the image follows it only where
          it is set too.
      # One image runs the operator and every job it starts: the backup and
      # prune jobs run the same image, which carries restic beside K8up.
      image:
        type: string
        default: "ghcr.io/k8up-io/k8up:v2.16.1"
        description: >
          K8up image the operator Deployment runs, and the backup and prune
          jobs it starts. Pinned to the release the chart's default names; a
          Release pulling from its own registry mirror sets this to that
          reference instead, written with its registry host.
