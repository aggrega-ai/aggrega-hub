apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/barman-cloud-plugin
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Barman Cloud plugin for CloudNativePG, installed once per cluster in
    the namespace the CloudNativePG operator runs in. Through it, a
    PostgreSQL Cluster that CloudNativePG runs archives its write-ahead log
    and takes base backups into a bucket, and is restored from there.

    It backs nothing up by itself. A PostgreSQL database realized by
    helm/postgres-cloudnative-pg is backed up by attaching core/backup to it
    in the Release, with the Manifest binding helm/backup-cloudnative-pg;
    the backups run only where this component is deployed.

    The CloudNativePG operator, 1.26 or later, and cert-manager must already
    run in the cluster: the plugin talks to the operator over TLS with
    certificates cert-manager issues. Realized on Kubernetes by
    helm/barman-cloud-plugin-chart, the project's own chart, whose chart
    repository must be reachable from the build.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Nothing is published: the plugin is reached by the CloudNativePG operator,
  # which finds it by the label on its Service, and by no component of the
  # Release. A database's backup names the plugin by its own name in the
  # resources helm/backup-cloudnative-pg writes, never through a connection.
  #
  # The plugin's own requirements, from its documentation at v0.15.1: it runs
  # in the CloudNativePG operator's namespace, the operator is 1.26 or later,
  # and cert-manager issues the certificates the two present to each other.
  # core/security/cert-manager installs cert-manager where the cluster runs
  # none. Nothing in the build checks either: the operator is not a component
  # of this catalog, and cert-manager may be installed outside the Release.
  schema:
    infra:
      # Read by the chart realization; the chart's version decides the
      # custom-resource definition it installs.
      source_version:
        type: string
        description: >
          Version of the plugin's chart the `barman-cloud-plugin-chart`
          realization pulls. Its default is the release whose application version is the
          tag of the image defaults below; changing it away from that default
          does not guarantee value-mapping compatibility with the new chart,
          and the images follow it only where they are set too.
      # The plugin is two images: the one its Deployment runs, and the one the
      # CloudNativePG operator adds to each PostgreSQL instance pod of a Cluster
      # that names the plugin, which runs the archiving and the backups there.
      # The project publishes both at the same version.
      image:
        type: string
        default: "ghcr.io/cloudnative-pg/plugin-barman-cloud:v0.15.1"
        description: >
          Image the plugin's Deployment runs. Pinned to the release the chart's
          application version names; a Release pulling from its own registry
          mirror sets this to that reference instead.
      sidecar_image:
        type: string
        default: "ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.1"
        description: >
          Image the CloudNativePG operator runs beside each PostgreSQL instance
          of a Cluster that names the plugin, which archives the write-ahead
          log and takes the base backups. Pinned to the same release as image.
