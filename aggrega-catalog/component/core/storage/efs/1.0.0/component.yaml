apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/efs
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Amazon EFS is a hosted service
  # the reader contracts for with AWS, under AWS's terms, which no SPDX
  # identifier names. That is the situation component.aggrega.ai/upstream-licensing
  # records as proprietary. No realization pins an artifact of the service, so
  # the catalog distributes and brokers none, and the standard library's
  # admission test, which reads the artifacts an entity pins, finds nothing to
  # refuse.
  #
  # What the description states follows the Amazon EFS User Guide: "Managing
  # mount targets" (one mount target in each Availability Zone, in one VPC),
  # "Mounting on Amazon EC2 with a DNS name" (the DNS name resolves to the
  # mount target in the client's Availability Zone, inside the VPC, and needs
  # inbound NFS on port 2049 in the mount target's security groups), "Using
  # IAM to control access to file systems" (with no file system policy, Amazon
  # EFS grants full access to any client that can connect through a mount
  # target), "Encrypting data at rest" (file contents under the KMS key named,
  # file names, directory names and directory contents under a key Amazon EFS
  # manages internally) and "Backing up EFS file systems" (a file system
  # created through the API has automatic backups on by default only when it
  # is a One Zone file system).
  description: >
    One Amazon EFS file system: AWS's managed NFS file system, Regional,
    storing its data redundantly across several Availability Zones of its
    Region, and mounted over NFS version 4 through a mount target in each
    subnet the Release names. A consumer reads the file system's ID, the DNS
    name it is mounted at, and its ARN.

    The subnets and security groups are the operator's: one mount target in
    each subnet, at most one in each Availability Zone, all in one VPC, in
    the security groups named, which must admit NFS on TCP port 2049 from
    each client. They are the only gate: no file system policy is set, so
    Amazon EFS grants full access to any client reaching a mount target, and
    no access point is created. Inside the VPC the DNS name resolves to the
    mount target in the client's own Availability Zone, so a client mounts
    from a zone holding one.

    The file system is encrypted at rest, the contents of its files under
    the operator's KMS key where the Release names one, else under the key
    for Amazon EFS that AWS provides, and runs in the General Purpose
    performance mode and the Bursting throughput mode unless the Release
    sets others. No lifecycle policy moves files out of the Standard storage
    class, no replication is set up, and automatic backups stay off, as
    Amazon EFS creates a Regional file system through its API. The file
    system holds no credential. Each Recipe's description says which keys
    it honours and which it refuses by name.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: storage
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # No values: no access point is offered, and the performance and
    # throughput a file system runs at, its subnets, security groups and KMS
    # key are the operator's, under infra.overrides.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      file_system_id:
        type: string
        required: true
        description: >
          The file system's ID, fs- followed by hexadecimal digits, which Amazon
          EFS assigns when it creates the file system: what a mount names, such
          as an Amazon ECS task's EFS volume or the EFS mount helper. A
          realization publishes a pointer string the provisioning tool resolves
          once the file system exists, so a consumer reads this rather than
          deriving one.
      host:
        type: string
        required: true
        description: >
          The DNS name the file system is mounted at,
          <file_system_id>.efs.<region>. followed by the domain suffix of the
          Region's partition, such as amazonaws.com, which resolves inside the
          file system's VPC to the mount target in the client's own
          Availability Zone; or the name the Release sets in
          infra.overrides.host instead. A client mounts it over NFS on port
          2049.
      arn:
        type: string
        required: true
        description: >
          The file system's ARN,
          arn:<partition>:elasticfilesystem:<region>:<account>:file-system/<file_system_id>,
          which an IAM policy names as the resource it grants access to.
