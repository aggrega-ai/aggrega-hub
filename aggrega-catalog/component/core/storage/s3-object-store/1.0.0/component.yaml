apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/s3-object-store
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares the S3 API as a
  # contract, which several object stores realize, each under its own terms.
  # There is no single product whose licence could be stated, which is the same
  # fact component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    One object-storage bucket reached over the S3 API with an access key. A
    consumer points its S3 client at the published endpoint, signs for the
    published region and reads the published bucket, which is the bucket the
    store holds, so a consumer naming a bucket of its own checks it against
    this one.

    A consumer holds the key it presents on its own connection. The two key
    slots are a self-hosted server's own account, which SeaweedFS requires; a
    managed service issues its keys to its own principals outside the build,
    and its realization refuses an attached slot by name.

    Reach for it where the consumer speaks the S3 API with an access key,
    wherever it runs; and for core/storage/gcs where it uses Google's client
    libraries with a Google identity, or needs a setting only Cloud Storage
    has.

    Realized on Amazon S3, in an AWS account, by
    terraform/s3-object-store-amazon-s3 through Terraform and by
    cloudformation/s3-object-store-amazon-s3 in a CloudFormation stack: every
    public access is blocked, ACLs are disabled, and a consumer brings an IAM
    principal's access key. Realized on Google Cloud Storage, in a Google Cloud
    project, by terraform/s3-object-store-gcs, over its XML API: the bucket is
    never public, a consumer brings a Cloud Storage HMAC key, and an object ACL
    is refused under uniform bucket-level access. Realized on SeaweedFS, run in
    a cluster by helm/s3-object-store or on a Compose host by
    compose/s3-object-store with nothing else in place: the server creates the
    bucket, serves plain HTTP, and a consumer brings the key pair the slots
    hold.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: storage
    # The realizations span two postures: the Amazon S3 and Cloud Storage
    # Recipes provision a bucket in a managed service the operator contracts
    # for, and the SeaweedFS Recipes run the server in the Release's own
    # cluster or Compose host. So the posture follows the Recipe the Manifest
    # selects.
    component.aggrega.ai/hosting: mixed
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved credential values
  # into the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # The store's own key pair, for a store that takes one: a self-hosted
    # server is set up with the account these two slots hold, and SeaweedFS,
    # whose Recipes halt naming an empty one, takes the pair as its S3
    # identity. A managed service takes no key from a bucket — Cloud Storage
    # issues an HMAC key to a service account, and Amazon S3 authenticates by
    # the access key of an IAM principal, both outside the build — so a managed
    # realization halts naming either slot when something is attached to it.
    # Each consumer presents its own key on its own connection, whichever
    # realization this is. Both slots are optional, so a managed Release
    # attaches nothing here.
    # Transparent (inject: [env]) so a realization that takes them receives
    # the values on the env pipe; the selector is secret-kind-pinned but
    # family-agnostic, so either an inject-value or a referenceable credential
    # may fill them.
    access_key_id:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Access key identifier of the store's own account, for a store that takes a key pair of its own: SeaweedFS takes the pair as its S3 identity, and its realizations halt when this slot is empty. A managed service issues its keys to its own principals outside the build, so the Amazon S3 and Cloud Storage realizations refuse an attachment here by name. A consumer presents its own key on its own connection."
    secret_access_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Secret access key of the store's own account, the pair of access_key_id, for a store that takes a key pair of its own: SeaweedFS takes the pair as its S3 identity, and its realizations halt when this slot is empty. A managed service issues its keys to its own principals outside the build, so the Amazon S3 and Cloud Storage realizations refuse an attachment here by name. A consumer presents its own key on its own connection."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      bucket:
        type: string
        required: true
        description: >
          Name of the bucket the store holds, published as `bucket`. Each
          realization refuses a name its service does not take, naming the
          rule; on Cloud Storage a bucket name is unique across the whole
          service, and on Amazon S3 across its partition, and on both it is
          publicly visible, so it carries nothing confidential.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      region:
        type: string
        description: >
          Where the bucket is placed, published as `region`, the region a
          consumer's S3 client signs for. There is no default: a managed
          realization halts without one, because where the data lives is the
          operator's choice. On Amazon S3 it is the bucket's Region code, such
          as eu-west-1, and a CloudFormation stack is held to that Region. On
          Cloud Storage it is the bucket's location — a region such as
          europe-west1, a dual-region such as EUR4 or a multi-region such as
          EU — and Cloud Storage accepts any region in a signature. SeaweedFS
          reads none, so its realizations halt when it is set and publish
          us-east-1, which S3 clients read from a server reporting no region.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      bucket:
        type: string
        required: true
        description: >
          The bucket the store holds. A consumer reads its objects from this
          bucket; one that names a bucket of its own checks it against this
          one.
      region:
        type: string
        description: >
          The region a consumer's S3 client signs its requests for: on a
          managed service the bucket's own location as the Release names it,
          and on SeaweedFS us-east-1, since the server reads none.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the S3 API — scheme, host and, where it is not the
          scheme's default, port — the address a consumer points its S3 client
          at. The scheme is the one the store is reached over, so a consumer
          takes the address as published rather than assuming http.
      host:
        type: string
        required: true
        description: >
          Host name of the S3 API. A consumer that composes its own address
          dials this name together with `port`; one that does not reads
          `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the S3 API accepts requests on, the one `endpoint` names or
          implies.
      protocol:
        type: string
        description: >
          Wire protocol the published address speaks — `s3`, so a consumer
          knows to reach it with an S3 client rather than a plain HTTP one.
