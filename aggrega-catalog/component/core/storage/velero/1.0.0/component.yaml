apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/velero
  version: 1.0.0
  license: Apache-2.0
  description: >
    Velero, the cluster backup controller, installed once per cluster in the
    namespace velero. On the schedules written for it, it copies Kubernetes
    resources, and the data of the volumes their pods mount, into a bucket
    reached over the S3 API, and restores them from there.

    It backs nothing up by itself. A datastore is backed up by attaching
    core/backup to it in the Release, with the Manifest binding the
    helm/backup-velero FeatureRecipe, which writes the schedule and its
    storage location into the velero namespace; they run only where this
    component is deployed. The Release declares the namespace velero for it.

    Velero signs its requests to the bucket with the key pair in the
    credentials file the cloud_credentials slot names; with the slot empty it
    uses whatever identity its pods' environment offers, such as the role of
    the node they run on.

    Realized on Kubernetes by helm/velero-chart, the project's own chart,
    whose chart repository must be reachable from the build.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    component.aggrega.ai/upstream-licensing: osi-approved
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  featuresSchema:
    # The key Velero presents to every bucket it writes backups to, held the
    # way Velero's own install reads it: an AWS shared credentials file, a
    # [default] section carrying aws_access_key_id and aws_secret_access_key.
    # A bucket's own connection carries no key, so the key a backup bucket
    # takes is Velero's to hold, as every consumer of a bucket holds its own.
    # Velero's server and its node agent both read the file. Optional: where
    # the pods' environment already carries an identity the bucket accepts,
    # such as the role of the node they run on, Velero needs no key.
    cloud_credentials:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [file]
      description: "The credentials file Velero signs its requests to every backup bucket with: an AWS shared credentials file, a [default] section carrying aws_access_key_id and aws_secret_access_key, held in a Secret in the velero namespace under the key the attached credential names. Velero's server and its node agent read it. Empty, Velero uses whatever identity its pods' environment offers."
  schema:
    infra:
      # Read by the chart realization; the chart's version decides the
      # custom-resource definitions it installs.
      source_version:
        type: string
        description: >
          Version of the Velero chart the `velero-chart` realization pulls. Its
          default is the release whose application version is the tag of the
          image default below; changing it away from that default does not
          guarantee value-mapping compatibility with the new chart, and the
          image follows it only where it is set too.
      # One image runs both the server Deployment and the node-agent DaemonSet:
      # the project publishes them as one binary.
      image:
        type: string
        default: "velero/velero:v1.18.2"
        description: >
          Velero image the server Deployment and the node-agent DaemonSet run.
          Pinned to the release the chart's application version names; a
          Release pulling from its own registry mirror sets this to that
          reference instead.
      # Velero reaches an S3 API through this plugin, which the server loads
      # from an init container at start. The plugin's own compatibility table
      # pairs its v1.14 releases with Velero v1.18.
      aws_plugin_image:
        type: string
        default: "velero/velero-plugin-for-aws:v1.14.4"
        description: >
          Image of Velero's plugin for the S3 API, which the server loads at
          start to read and write its backup buckets. Its v1.14 releases pair
          with Velero v1.18.
