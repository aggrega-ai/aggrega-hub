apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/storage/kubestash
  version: 1.0.0
  description: >
    KubeStash, AppsCode's backup operator for Kubernetes, built on restic. It
    backs up the volumes of a workload into a restic repository in a bucket
    or on a Kubernetes volume, on the schedules its own resources declare,
    and restores them. It is installed once per cluster and acts on the
    KubeStash resources of every namespace.

    It backs nothing up by itself. A datastore is backed up by attaching
    core/backup to it in the Release, with the Manifest binding the
    helm/backup-kubestash FeatureRecipe, which writes a KubeStash
    BackupConfiguration, its BackupStorage and its RetentionPolicy beside the
    datastore; the backup runs only where this component is deployed.

    The Release supplies what KubeStash runs: AppsCode publishes KubeStash
    under its own terms and runs it only under a licence it issues, so the
    Release names the chart release in infra.source_version and the catalog
    names none. The licence reaches the operator by reference to a Secret
    bound to the required license slot. The compiler validates no licence and
    contacts no vendor, so a clean build says nothing about one.

    Realized on Kubernetes by helm/kubestash-chart, AppsCode's own chart,
    whose chart repository must be reachable from the build; cert-manager
    must already run in the cluster.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: storage
    # KubeStash is distributed under AppsCode's own terms: AppsCode publishes
    # its chart under the AppsCode Community License 1.0.0, the operator's
    # source is not published, and the operator runs under a licence AppsCode
    # issues for each cluster. No single licence identifier applies, so
    # metadata.license is left absent.
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The KubeStash licence. AppsCode's chart reads it from an existing Secret
  # by name, mounts that Secret into the operator and hands the operator the
  # file its data key key.txt becomes; the Recipe names the Secret this slot's
  # attachment publishes, so the licence travels by reference and is in no
  # rendered file. Fill it with core/referenced-secret bound to
  # k8s-existing-secret, which names a Secret that already exists in the
  # namespace the operator runs in, and publish the data key key.txt: declare
  # the attachment in the Aggregate with values.key set to key.txt, and name
  # the Secret in values.origin there or in infra.origin in the Release, since
  # an attachment the Release alone makes publishes the key value. A
  # credential publishing no Secret name and data key, or a data key other
  # than key.txt, halts the build naming it. Required: a Release that binds
  # nothing here halts the build, naming the slot.
  #
  # AppsCode issues a licence for one cluster, named by the UID of its
  # kube-system namespace, through its licence server, which asks for a name,
  # a work email and agreement to its terms. Its installation guide calls the
  # licence free, and its site describes it as a 30-day licence, extended or
  # purchased through AppsCode. What the build cannot see is whether the
  # Secret holds a valid licence for the cluster it is applied to.
  featuresSchema:
    license:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      required: true
      inject: []
      description: "The KubeStash licence AppsCode issues for the cluster, held in a Kubernetes Secret this attachment names under the data key key.txt, in the namespace the operator runs in: the operator reads it by reference to that Secret, never as a value written into the Release or the rendered output. Required: the build halts when no attachment binds it, and when the attachment publishes a data key other than key.txt."
  schema:
    infra:
      # Read by the chart realization. No default: the chart release decides
      # every image KubeStash runs — the operator's, at the release's own
      # version, and those of the backup and restore jobs its addons name —
      # and access to them is governed by AppsCode's terms rather than by the
      # catalog, so the catalog names none and the Release names the release
      # it runs.
      source_version:
        type: string
        required: true
        description: >
          Version of AppsCode's KubeStash chart the `kubestash-chart`
          realization pulls, such as v2026.10.12; the chart release decides
          the operator's image and every backup job's image. There is no
          default, because access to KubeStash is governed by AppsCode's
          terms rather than by the catalog, and the catalog therefore names
          none. A build that omits it halts. The realization's value mapping
          was read against v2026.10.12, and a release that changes the chart's
          values may not take it.
