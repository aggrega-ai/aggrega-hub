apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/filesystem
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a file-tree tool
  # whose access mode is a value the Aggregate chooses, served by an image the
  # Release names. There is no upstream product whose licence could be
  # stated, which is the same fact component.aggrega.ai/upstream-licensing
  # records as not-applicable.
  description: >
    A tool that gives an agent a file tree it can work in, listing, reading and,
    where the Aggregate allows it, writing files. Access is chosen by the
    developer and defaults to read-only, so the ability to write is granted
    deliberately rather than inherited, and the declared effect can be narrowed
    to match. Marked mutating by default, because a writable file tree outlives
    the invocation that changed it. The tree sits on a disk this component
    carries, so a file written in one call is still there for the next — which
    is why an agent that needs a working area to survive between calls is
    wired to this component rather than to a tool that keeps nothing. One
    instance holds that disk, so every call reaches the same files. Realized on
    Kubernetes via its Helm Recipe, which synthesizes that one instance with
    its own disk and a ClusterIP Service fronting it; helm-only. Exports the
    Service's host, port, endpoint and protocol to consumers via the uses
    topology, so an agent wires to the tool the same way it wires to any other
    service. An edge from the tool, on a socket the author names, delivers
    what its `inject:` block dictates, as variables or as files outside the
    tree, on every realization that runs the tool. The image serving the tool
    is the Release's, because this component packages no upstream product.
    Nothing renders until the Release sets `infra.image`.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: stateful-server
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    # The Recipe runs the tool as a container in the deployment's own cluster,
    # so a single posture is this component's identity. Selector-only: never
    # stamped onto rendered output.
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # FILESYSTEM_TOOL_* variable the realization otherwise delivers it under; an
  # entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        access_mode: { type: string, enum: [read_only, read_write], default: read_only }
        side_effects: { type: string, enum: [mutating, read_only], default: mutating }
      required: [access_mode, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the file-tree tool over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers.
      mount_path:
        type: string
        default: /data
        description: >
          Directory inside the container where the tool's file tree is mounted.
          The image the Release names decides where it reads and writes, so
          this follows that image rather than the other way round.
      storage:
        size:
          type: string
          default: 10Gi
          description: Size of the disk holding the file tree.
      compute:
        cpu:
          type: string
          default: 250m
        memory:
          type: string
          default: 256Mi
          description: >
            Memory request and limit. The defaults cover a tool that lists and
            streams files rather than one that loads them whole; a Release
            whose files are large raises them for what it actually handles.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. All four describe
    # where to reach the running tool; nothing about the file tree itself
    # crosses an edge.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to work in the file tree. A
          consumer that composes its own address dials this name; one that
          does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the file-tree API is accepted on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent sends list, read and write requests to, with
          the host and the port already composed. A consumer hands it to its
          tool client as the address it calls.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
