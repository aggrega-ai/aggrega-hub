apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/mcp
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a Model Context
  # Protocol server whose software the Release names — an image, a package
  # run behind the bridge a bridge realization pins, or a server someone else
  # runs at an address. There is no single upstream product whose licence
  # could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable. A
  # bridge realization states the bridge's own licence on its Recipe.
  #
  # The bridge realizations are checked by building them, and no run of either
  # has been observed. A remote server's credential is held by each consumer
  # on its connection to the tool, as provides.credential_header describes.
  description: >
    A tool that attaches a Model Context Protocol server to an agent, so the
    tools that server publishes become available to the agent without each one
    being declared separately in the catalog. The server is reached over HTTP,
    and the software behind it is the Release's, so a server can be wired to an
    agent without a catalog entity of its own. Marked mutating, because what an
    attached server exposes is decided by that server rather than by this
    declaration. Every realization publishes a host, port, endpoint, protocol
    and credential header, so an agent wires to the tool the same way whichever
    one answers it.

    Which realization to reach for follows how the server is published. Where
    it ships as a container image serving the protocol over HTTP, reach for
    helm/mcp, which runs the image infra.image names. Where it is an npm or
    PyPI package speaking only stdio, reach for helm/mcp-stdio-bridge on
    Kubernetes or compose/mcp-stdio-bridge for local development, which run the
    command line infra.stdio_command names inside a pinned bridge serving it
    over HTTP. Where someone else already runs it, reach for helm/mcp-remote or
    compose/mcp-remote, which run nothing and publish the address infra.endpoint
    names.

    A bridged server's credentials arrive through the server_env slot, on
    helm/mcp-stdio-bridge only. An edge from the tool, on a socket
    the author names, delivers what its `inject:` block dictates, as variables
    or as files, under helm/mcp and both bridge realizations; the mcp-remote
    realizations run nothing and refuse one. helm/mcp alone delivers the
    component's own `inject:` block, an entry reading a tool value alone
    replacing its default name; the others refuse it.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    # The transport a consumer speaks to reach this tool. A consuming agent's
    # socket selects on it — a selector reads labels — so an agent that speaks
    # only one transport admits only the servers carrying it.
    tool.aggrega.ai/transport: http
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two helm/mcp delivers, as it renders no command line.
  # Under helm/mcp each env entry reaches the container under the name the
  # developer gives it and each file entry at the path it gives, and an entry
  # reading one of the tool's own values alone replaces that value's default
  # name, the MCP_TOOL_* variable helm/mcp otherwise delivers it under; an entry
  # reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing. The bridge and mcp-remote
  # realizations deliver no such entry: each halts the build on one, naming it,
  # so no entry the developer writes is dropped.
  inject: [env, file]

  # The environment a server published as a stdio package reads its
  # credentials from. Read by helm/mcp-stdio-bridge alone: it imports every
  # data key of the Secret the attachment publishes as its name into the
  # bridge's environment, one variable per key named as the key, by reference,
  # and the bridge starts the server with that environment, so the server
  # inherits each variable. compose/mcp-stdio-bridge halts the build on an
  # attachment here, because the compose target has no secret reference to
  # deliver it through. helm/mcp and the mcp-remote realizations halt the
  # build on an attachment here too, as they do on the two stdio keys below:
  # helm/mcp delivers nothing from the slot to the image it runs, and the
  # mcp-remote realizations run no server at all.
  featuresSchema:
    server_env:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: >
        Environment variables a server run behind the bridge reads its
        credentials from, held in one Secret with one data key per variable,
        each key named as the variable the server reads. Read only by
        helm/mcp-stdio-bridge, which imports every data key of the Secret the
        attachment names into the bridge's environment by reference. Attach
        core/referenced-secret mapped to helm/k8s-existing-secret to name a
        Secret that already exists, and the credential stays out of every
        rendered file; core/referenced-secret-set's realization writes the
        values into a Secret the build renders, which suits evaluation.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. The tool's own surface is the
    # shared tool contract and nothing beyond it: what a protocol server
    # exposes is the server's, so there is nothing here for a developer to
    # declare about it that the server does not already answer.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: it stands for whichever protocol server a Release runs, so
      # the Release names an image it already holds the right to run, its
      # tag included. That is also why no engine_version knob appears here —
      # the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      #
      # Read by helm/mcp, which requires it. The bridge realizations run the
      # bridge image they pin for the runtime stdio_runtime names, and halt
      # the build naming this key when a Release sets it, so the image they
      # run never moves without the Recipe moving with it. The mcp-remote
      # realizations run nothing, and halt the build naming it too.
      image:
        type: string
        description: Container image serving the Model Context Protocol over HTTP. Read by helm/mcp, which requires it; the mcp-stdio-bridge realizations run the bridge image they pin, and the mcp-remote realizations run nothing, so both refuse this key.
      # The two keys below describe a server published as a package speaking
      # the protocol over stdio, and only the mcp-stdio-bridge realizations
      # read them. Neither carries a default, because the server is the
      # Release's: each bridge realization halts the build naming the key
      # while it is unset, and helm/mcp and the mcp-remote realizations halt
      # it naming the key while it is set.
      #
      # The bridge runs the command line through a shell, so each bridge
      # realization quotes every item before handing the line over: an item
      # reaches the server exactly as written, with no variable expanded and no
      # word split inside it, as a client launching the server from a list of
      # arguments would hand it over.
      stdio_command:
        type: array
        min: 1
        items:
          type: string
          min: 1
        description: >
          The server's command line, one list item per argument, for example
          [npx, -y, "@modelcontextprotocol/server-everything"] for an npm package or
          [uvx, mcp-server-fetch] for a PyPI package. Each item reaches the server
          exactly as written. Read only by the mcp-stdio-bridge realizations;
          the others refuse it.
      stdio_runtime:
        type: string
        enum: [npm, pypi]
        description: >
          The package ecosystem the command line runs from, selecting the bridge
          image that carries its launcher: npm runs on Node.js with npm and npx;
          pypi adds Python, uv and uvx. Read only by the mcp-stdio-bridge
          realizations; the others refuse it.
      # The address of a server someone else already runs. It carries no
      # default, because the server is the Release's: each mcp-remote
      # realization halts the build naming the key while it is unset, and
      # every realization that runs a server halts it naming the key while it
      # is set. It is a deterministic pointer string the runtime resolves; the
      # compiler never contacts it.
      endpoint:
        type: string
        description: >
          The http or https URL a client connects to a server someone else
          already runs at, for example https://mcp.example.com/mcp, without any
          part that carries a key: at least its scheme and host. Read only by
          the mcp-remote realizations, which publish it as written and read
          host, port and protocol from it; the others refuse it. A consumer
          whose server reads its key from the address supplies the whole
          address through the endpoint slot on its own connection to the tool.
      # Which header a server checks a caller's credential in is the server's,
      # so the Release states it. The default is the header the protocol's
      # authorization specification has a client send. The bridge checks no
      # caller's credential, so the bridge realizations publish an empty
      # header whatever this says.
      credential_header:
        type: string
        default: Authorization
        description: >
          The request header the server reads a caller's credential from, which
          the realization publishes for a consumer to present its credential
          under. Read by helm/mcp and the mcp-remote realizations; the
          mcp-stdio-bridge realizations publish an empty header instead.
      # Every realization that runs a server listens on this port and
      # publishes it. The mcp-remote realizations run nothing and publish the
      # port infra.endpoint names, so they read neither this key nor
      # infra.compute.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers. The mcp-remote realizations publish the port infra.endpoint names instead.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 256Mi
          description: >
            Memory request and limit. The defaults are a floor for a small
            server process rather than a sizing recommendation: the server is
            the Release's, so what it actually needs is known on that side
            and raised there. Under a bridge realization the limit also holds
            the bridge and the launcher that fetches the package.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The first four
    # describe where to reach the server, and the fifth which header a
    # consumer presents its credential under; what that server publishes over
    # the protocol is answered on the connection rather than across the edge.
    # Every realization publishes all five.
    provides:
      host:
        type: string
        required: true
        description: >
          DNS name an agent calls to reach the protocol server: the Service's
          name on Kubernetes, the service's name on the compose network, or the
          host infra.endpoint names under the mcp-remote realizations. A
          consumer that composes its own address dials this name; one that
          does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the protocol server is reached on. It follows the port an
          operator set in the Release — under the mcp-remote realizations, the
          port infra.endpoint names, or its scheme's default port where it
          names none — so a consumer reads it rather than assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent connects to the protocol server at, with the
          host and the port already composed, and the path too where the
          realization fixes the one the server answers at, as the bridge
          realizations do; under the mcp-remote realizations it is
          infra.endpoint as the Release wrote it, the address without any part
          that carries a key. It is the address a client library needs in order
          to discover the tools that server publishes. Where the server reads
          its key from its address, a consumer reads the whole address from the
          endpoint slot on its own connection to the tool instead.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      credential_header:
        type: string
        description: >
          The request header a consumer presents its credential under, where the
          server checks one: Authorization unless the Release names another in
          infra.credential_header. The credential itself is the consumer's, held
          on its own connection to the tool. Empty under the mcp-stdio-bridge
          realizations, whose bridge checks no caller's credential.
