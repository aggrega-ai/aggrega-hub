apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/mcp
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a Model Context
  # Protocol server whose software the Release names — an image, or a package
  # run behind the bridge a bridge realization pins. There is no single
  # upstream product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable. A
  # bridge realization states the bridge's own licence on its Recipe.
  description: >
    A tool that attaches a Model Context Protocol server to an agent, so the
    tools that server publishes become available to the agent without each one
    being declared separately in the catalog. The server is reached over HTTP,
    and the software behind it is the Release's, so a server can be wired to an
    agent without a catalog entity of its own. Marked mutating, because what an
    attached server exposes is decided by that server rather than by this
    declaration. Every realization publishes a host, port, endpoint and
    protocol, so an agent wires to the tool the same way whichever one runs it.

    Which realization to reach for follows how the server is published. Where
    it ships as a container image serving the protocol over HTTP, reach for
    helm/mcp, which runs the image infra.image names. Where it is an npm or
    PyPI package speaking only stdio, reach for mcp-stdio-bridge — on helm for
    Kubernetes, on compose for local development — which runs the command line
    infra.stdio_command names inside a pinned bridge serving it over HTTP.
    Variables the server reads its credentials from arrive through the
    server_env slot, on helm/mcp-stdio-bridge only. The bridge realizations
    are checked by building them, and no run of either has been observed.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    # The transport a consumer speaks to reach this tool. A consuming agent's
    # socket selects on it — a selector reads labels — so an agent that speaks
    # only one transport admits only the servers carrying it.
    tool.aggrega.ai/transport: http
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The environment a server published as a stdio package reads its
  # credentials from. Read by helm/mcp-stdio-bridge alone: it imports every
  # data key of the Secret the attachment publishes as its name into the
  # bridge's environment, one variable per key named as the key, by reference,
  # and the bridge starts the server with that environment, so the server
  # inherits each variable. compose/mcp-stdio-bridge halts the build on an
  # attachment here, because the compose target has no secret reference to
  # deliver it through; helm/mcp reads neither this slot nor the two stdio
  # keys below.
  featuresSchema:
    server_env:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: >
        Environment variables the server reads its credentials from, held in one
        secret: core/referenced-secret-set with one data key per variable, each
        key named as the variable the server reads. Read only by
        helm/mcp-stdio-bridge, which delivers every key by reference.
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate. The tool's own surface is the
    # shared tool contract and nothing beyond it: what a protocol server
    # exposes is the server's, so there is nothing here for a developer to
    # declare about it that the server does not already answer.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: it stands for whichever protocol server a Release runs, so
      # the Release names an image it already holds the right to run, its
      # tag included. That is also why no engine_version knob appears here —
      # the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      #
      # Read by helm/mcp, which requires it. The bridge realizations run the
      # bridge image they pin for the runtime stdio_runtime names, and halt
      # the build naming this key when a Release sets it, so the image they
      # run never moves without the Recipe moving with it.
      image:
        type: string
        description: Container image serving the Model Context Protocol over HTTP. Read by helm/mcp, which requires it; the mcp-stdio-bridge realizations run the bridge image they pin and refuse this key.
      # The two keys below describe a server published as a package speaking
      # the protocol over stdio, and only the mcp-stdio-bridge realizations
      # read them. Neither carries a default, because the server is the
      # Release's: each bridge realization halts the build naming the key
      # while it is unset.
      #
      # The bridge runs the command line through a shell, so each bridge
      # realization quotes every item before handing the line over: an item
      # reaches the server exactly as written, with no variable expanded and no
      # word split inside it, as a client launching the server from a list of
      # arguments would hand it over.
      stdio_command:
        type: array
        min: 1
        items:
          type: string
          min: 1
        description: >
          The server's command line, one list item per argument, for example
          [npx, -y, "@modelcontextprotocol/server-everything"] for an npm package or
          [uvx, mcp-server-fetch] for a PyPI package. Each item reaches the server
          exactly as written. Read only by the mcp-stdio-bridge realizations.
      stdio_runtime:
        type: string
        enum: [npm, pypi]
        description: >
          The package ecosystem the command line runs from, selecting the bridge
          image that carries its launcher: npm runs on Node.js with npm and npx;
          pypi adds Python, uv and uvx. Read only by the mcp-stdio-bridge
          realizations.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 256Mi
          description: >
            Memory request and limit. The defaults are a floor for a small
            server process rather than a sizing recommendation: the server is
            the Release's, so what it actually needs is known on that side
            and raised there. Under a bridge realization the limit also holds
            the bridge and the launcher that fetches the package.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. All four describe
    # where to reach the running server; what that server publishes over the
    # protocol is answered on the connection rather than across the edge.
    provides:
      host:
        type: string
        required: true
        description: >
          DNS name an agent calls to reach the protocol server: the Service's
          name on Kubernetes, the service's name on the compose network. A
          consumer that composes its own address dials this name; one that
          does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the protocol server is reached on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent connects to the protocol server at, with the
          host and the port already composed, and the path too where the
          realization fixes the one the server answers at, as the bridge
          realizations do. It is the address a client library needs in order
          to discover the tools that server publishes.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
