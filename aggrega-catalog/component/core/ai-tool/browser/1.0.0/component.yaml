apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/browser
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a browser-driving
  # tool whose automation engine and browser build are values the Aggregate
  # chooses, served by an image the Release names. There is no upstream
  # product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A tool that drives a real web browser on an agent's behalf, navigating
    pages, reading rendered content and interacting with page elements, so a
    deployment can reach sites that offer no API of their own. Automation runs
    through a browser-automation engine, defaulting to Playwright, against a
    browser build defaulting to Chromium, headless unless the Aggregate asks for
    a visible session. Marked mutating: a browsing session can submit forms and
    trigger actions on the sites it visits. Realized on Kubernetes as a
    long-running Deployment fronted by a ClusterIP Service, publishing that
    Service's host, port, endpoint and protocol so an agent wires to the tool
    the same way it wires to any other service. An edge from the tool, on a
    socket the author names, delivers what its `inject:` block dictates, as
    variables or as files, on every realization that runs the tool. The
    catalog pins no image, so nothing renders until the Release sets
    `infra.image`.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # BROWSER_TOOL_* variable the realization otherwise delivers it under; an
  # entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        automation_engine: { type: string, default: playwright }
        browser_type: { type: string, default: chromium }
        headless: { type: boolean, default: true }
      required: [automation_engine, browser_type, headless]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the browser-automation tool over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers.
      compute:
        cpu:
          type: string
          default: 500m
        memory:
          type: string
          default: 1Gi
          description: >
            Memory request and limit. The defaults are a floor for one browser
            process rather than a sizing recommendation: a page-heavy workload
            raises them for what it actually loads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. All four describe
    # where to reach the running tool; nothing about the browsing session
    # itself crosses an edge.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to drive the browser. A consumer
          that composes its own address dials this name; one that does not
          reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the automation API is accepted on. It follows the port an
          operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent sends navigation and interaction requests to,
          with the host and the port already composed. A consumer hands it to
          its tool client as the address it calls.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
