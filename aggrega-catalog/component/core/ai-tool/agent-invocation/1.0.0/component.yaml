apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/agent-invocation
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a delegation
  # capability over an agent-to-agent protocol, reaching whichever agent is
  # wired to it, and the image serving the delegation is named by
  # the Release. There is no upstream product whose licence could be
  # stated, which is the same fact component.aggrega.ai/upstream-licensing
  # records as not-applicable.
  description: >
    A tool that lets one agent invoke another as a delegated step. The wired
    agent is reached over an agent-to-agent protocol, defaulting to A2A, and
    the caller chooses how it waits: synchronously for a returned result,
    asynchronously for a handle it polls later, or fire-and-forget where the
    delegation needs no answer. It declares a required socket onto an agent
    component, so the target is resolved in the topology rather than named in
    a prompt. Marked mutating, since a delegated agent may act in the world.
    Realized on Kubernetes as a Knative Service, which admits an inbound call
    while the tool is running no replicas, so the tool occupies no compute
    between the calls that invoke it. It publishes a host, port, endpoint and
    protocol, and a consumer wires to those without naming how the tool runs.

    The connection to the agent may hold a credential, which the tool presents
    under the request header the agent publishes as credential_header; that is
    how it reaches an agent another party runs, such as
    core/ai-agent/a2a-remote. A connection to an agent labelled managed holds a
    credential or states unauthenticated: true, and otherwise the build halts.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    target_agent:
      selector: "component.aggrega.ai/category=ai-agent"
      required: true
      # A statement about this connection's target, authored on the connection:
      # the agent it reaches takes no credential. It changes nothing this
      # component renders.
      valueSchema:
        unauthenticated:
          type: boolean
          default: false
          description: Declares that the agent this connection reaches takes no credential, so a connection carrying none is intended rather than an omission. It changes nothing this component renders.
      # The credential the tool presents to the agent is held on the connection
      # it is presented on, so each connection names its own fill. Optional (an
      # agent may take no credential: an A2A agent's card need declare no
      # security scheme); transparent (inject: [env]) because the Recipe
      # delivers it into the tool's own container; secret-kind-pinned so a
      # referenceable Secret fills it.
      featuresSchema:
        credential:
          selector: "feature.aggrega.ai/kind=secret"
          sensitive: true
          inject: [env]
          description: "Optional credential the tool presents to the agent this connection reaches, under the request header that agent publishes as credential_header. When attached, the Recipe delivers it to the tool's container as AGENT_TOOL_TARGET_CREDENTIAL, a Kubernetes secretKeyRef to the Secret the credential publishes, and the header as AGENT_TOOL_TARGET_CREDENTIAL_HEADER where the agent publishes one; a credential publishing no Secret name and data key halts the build. Fill it with core/referenced-secret mapped to helm/k8s-existing-secret, naming a Secret the namespace already holds: a realization that names its Secret after the tool, such as k8s-external-secret or k8s-secret-from-parameter, halts the build here, because the Recipe renders its Service from an artifacts template and gives the tool no rendered name. Unattached, the tool runs without an injected credential."
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        protocol: { type: string, default: a2a }
        execution_mode: { type: string, enum: [synchronous, asynchronous, fire_and_forget], default: synchronous }
      required: [protocol, execution_mode]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the delegation over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use, and a control plane that fronts the tool routes from its
          own port to this one.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between
          calls, which the realization reaches through its control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          realization needs, is installed in the target cluster. The build
          halts unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The realization
    # publishes all four, so a consumer reads the tool's address off these keys
    # rather than off anything specific to how the tool runs.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to delegate a step to the wired
          agent. A consumer that composes its own address dials this name; one
          that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the delegation is accepted on. The realization fronts the
          tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent posts a delegation to, with the host and the
          port already composed. A consumer hands it to its tool client as the
          address it calls.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.

  # A connection to a target its catalog labels a managed service
  # (component.aggrega.ai/hosting: managed) carries a credential, or says on the
  # connection that its target takes none. The rule reads the target's labels,
  # the connection's unauthenticated value and its credential slot, all known
  # before a Recipe binds, so it holds whichever Recipe renders this component;
  # a self-hosted or external target draws nothing — an agent another party
  # runs need not check a credential, since an A2A agent's card need declare no
  # security scheme. The list names every socket of this component that
  # declares unauthenticated.
  assertions:
    managed_target_needs_a_credential: >-
      {{- range $socket := list "target_agent" -}}
      {{- range $alias, $connection := (optional $.uses $socket dict) -}}
      {{- $managed := eq (optional $connection.labels "component.aggrega.ai/hosting" "") "managed" -}}
      {{- $optedOut := optional $connection.values "unauthenticated" false -}}
      {{- if and $managed (not (hasKey $connection.features "credential")) (not $optedOut) -}}
      {{- fail (printf "the %s connection %s of %q reaches %q, whose component.aggrega.ai/hosting label is managed, with no credential: attach one under credential on that connection, or set unauthenticated: true in its values" $socket $alias $.metadata.instance_id $connection.target) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
