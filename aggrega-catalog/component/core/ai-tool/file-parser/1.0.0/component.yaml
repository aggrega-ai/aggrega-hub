apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/file-parser
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none. The parsing engine is a value
  # the developer sets rather than a product this Component wraps — the name
  # it defaults to selects an engine for the tool to use, and the image
  # carrying that engine is named by the Release — so no one licence covers
  # what a deployment ends up running. That is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A read-only tool that turns a document into text an agent can read, so a
    deployment can put contracts, reports and scanned records in front of an
    agent without teaching it each file format. The parsing engine is chosen
    by the developer, and the extraction mode selects how much structure
    survives — text only by default, where layout is discarded and prose is
    kept. Its effect is pinned read-only in its own schema: parsing never
    alters the source document. Realized on Kubernetes as a Knative Service,
    which admits an inbound call while the tool is running no replicas, so the
    tool occupies no compute between the calls that invoke it. It publishes a
    host, port, endpoint and protocol, and a consumer wires to those without
    naming how the tool runs. An edge from the tool, on a socket the author
    names, delivers what its `inject:` block dictates, as variables or as
    files, on every realization that runs the tool. The catalog pins no image,
    so nothing renders until the Release sets `infra.image`.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # PARSER_TOOL_* variable the realization otherwise delivers it under; an entry
  # reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        engine: { type: string, default: unstructured }
        extraction_mode: { type: string, default: text_only }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [engine, extraction_mode, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the parse over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use, and a control plane that fronts the tool routes from its
          own port to this one.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between
          calls, which the realization reaches through its control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          realization needs, is installed in the target cluster. The build
          halts unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The realization
    # publishes all four, so a consumer reads the tool's address off these keys
    # rather than off anything specific to how the tool runs.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to turn a document into readable
          text. A consumer that composes its own address dials this name; one
          that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the parse request is accepted on. The realization fronts
          the tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent posts a document to, with the host and the
          port already composed. A consumer hands it to its tool client as the
          address it calls.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
