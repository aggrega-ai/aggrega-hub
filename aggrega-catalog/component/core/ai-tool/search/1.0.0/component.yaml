apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/search
  version: 1.0.0
  # metadata.license is deliberately absent. The field carries the SPDX
  # identifier of the software the entity describes, and there is none to carry:
  # the search service is hosted by its provider and no source licence is
  # granted for it, so no single identifier expresses the situation. The class it
  # falls into is stated instead through component.aggrega.ai/upstream-licensing
  # below.
  description: >
    A read-only tool that answers an agent's question from the public web through
    a managed search API, so a deployment can reach current information without
    operating a crawler or an index of its own. The developer names the search
    provider, defaulting to Tavily, and how many results a query returns,
    defaulting to five. Declared as a resource: the search service is operated
    outside the deployment, which consumes it rather than running it. Its effect
    is pinned read-only in its own schema. Realized on Kubernetes and on Docker
    Compose as a reference realization, selected in the Manifest: neither
    provisions anything and no container runs for the tool. On Kubernetes the
    helm provider emits an ExternalName Service mapping an in-cluster name onto
    the search API's base address; on Compose no service is defined for it, and
    the address reaches the consuming service through the injection context
    instead. Both publish the same base address, provider name and result count,
    so a consumer wires to either unchanged.
  labels:
    # A hosted search service the deployment calls rather than runs: nothing in
    # the cluster serves it, so the operational primitive is a resource, and the
    # trust boundary sits with the provider.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        provider: { type: string, default: tavily }
        max_results: { type: integer, default: 5 }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [provider, max_results, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The base address defaults to the public address of the provider the
      # values default names, so taking both defaults needs no operator input.
      # The two travel together: naming another provider means repointing this
      # at that provider's address, since the address and
      # the provider are one choice made in two places. It is sourced from infra
      # rather than fixed in a Recipe so an operator may also repoint it at a
      # regional address or at a proxy the deployment routes egress through. A
      # deterministic pointer string the runtime resolves; the compiler never
      # contacts it.
      endpoint: { type: string, default: "https://api.tavily.com" }

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. A consumer calls the
    # search API itself, so it reads all three from one place rather than each of
    # its own containers carrying a copy: where to call, which provider's dialect
    # to speak, and how many results to ask for. Both realizations publish all
    # three, so a consumer's wiring does not change when the realization does.
    # The API key is not published and is not held here: the environment-variable
    # name a credential arrives under belongs to the consuming application, so a
    # consumer that needs one declares it as `credential` on the socket that
    # reaches this API and delivers it from its own container.
    provides:
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the managed search API the tool queries. The Release
          supplies it, so an operator may point it at a different host without
          the Aggregate changing.
      provider:
        type: string
        required: true
        description: >
          Name of the search service behind the endpoint, carried through from
          the value the Aggregate declared. A consumer reads it to know whose
          results it is reading and whose terms it is bound by.
      max_results:
        type: integer
        required: true
        description: >
          How many results a single query returns, carried through from the
          value the Aggregate declared. A consumer reads it to size the
          material it will put in front of a model.
