apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/document-ai
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: Document AI is a hosted
  # service the reader contracts for with Google Cloud, under Google Cloud's
  # terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # What the description states follows Document AI's documentation: the
  # processor list (each processor's type in the API, such as
  # OCR_PROCESSOR, FORM_PARSER_PROCESSOR, LAYOUT_PARSER_PROCESSOR and
  # INVOICE_PROCESSOR, some of whose versions are offered to allowlisted
  # projects or in some locations alone); "Send a processing request"
  # (process and batchProcess at https://LOCATION-documentai.googleapis.com,
  # under /v1/ followed by the processor's resource name, LOCATION being
  # the processor's, batchProcess writing its results into the Cloud
  # Storage folder the request names); "Document AI locations"
  # (the multi-regions us and eu, and a few regions); and the REST
  # reference's service endpoints, https://us-documentai.googleapis.com and
  # https://eu-documentai.googleapis.com.
  description: >
    One Document AI processor: a model that reads the documents a caller
    sends it and returns their text, layout and the fields it extracts.
    values declare its type, such as OCR_PROCESSOR, which reads text,
    FORM_PARSER_PROCESSOR, which also reads forms' fields and tables, or
    INVOICE_PROCESSOR.

    A consumer reads endpoint, the Document AI endpoint of the processor's
    location, https://<location>-documentai.googleapis.com, and processor,
    the processor's resource name,
    projects/<project>/locations/<location>/processors/<processor ID>,
    which a process or batchProcess call names at the endpoint. A caller
    signs each request as the Google identity it runs under, so no
    credential is published.

    Processor versions, training and human review are not offered, so
    the processor serves its type's default version. Documents a caller
    sends are processed and returned; a batch call writes its results into
    the caller's Cloud Storage location, and the processor keeps no data to
    back up. Each Recipe's description says which keys it honours and
    refuses by name.
  labels:
    # A service the Release calls rather than runs: nothing in the Release
    # serves it, so the operational primitive is a resource.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-tool
    # A process call returns its results, while a batchProcess call writes
    # them into the Cloud Storage folder the request names ("Send a
    # processing request"), so a call through it can change state.
    tool.aggrega.ai/impact: mutating
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # values is written as an object with its properties, because a property
  # named type is read as a schema keyword in the compact form. type is not
  # held to a list: the types Document AI offers differ by project and
  # location, some versions to allowlisted projects alone, so the service
  # is what holds a processor to them.
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      type: object
      properties:
        type:
          type: string
          required: true
          description: >
            The processor's type, as Document AI's processor list spells it
            in the API, such as OCR_PROCESSOR, FORM_PARSER_PROCESSOR,
            LAYOUT_PARSER_PROCESSOR, INVOICE_PROCESSOR or
            CUSTOM_EXTRACTION_PROCESSOR. The types a project may create in a
            location are the ones Document AI offers it there, and Document
            AI refuses any other when it creates the processor.
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          The Document AI endpoint of the processor's location,
          https://<location>-documentai.googleapis.com, such as
          https://eu-documentai.googleapis.com, which a process or
          batchProcess call goes to. A realization publishes a pointer
          string the provisioning tool resolves once the processor exists.
      processor:
        type: string
        required: true
        description: >
          The processor's resource name,
          projects/<project>/locations/<location>/processors/<processor ID>,
          the ID being the one Document AI assigns, which a process or
          batchProcess call names at the endpoint. A realization publishes a
          pointer string the provisioning tool resolves once the processor
          exists.
