apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/model-invocation
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares an invocation
  # capability whose model is a component wired onto its socket, and the
  # image serving the invocation is named by the Release. There is no
  # upstream product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A read-only tool that lets an agent call a model as a step in its own
    work — turning text into speech, transcribing audio, or whatever task the
    wired model performs — rather than as the agent's own reasoning engine. It
    declares a required socket onto a model component, so the model is resolved
    in the topology. The task the invocation performs is named by the developer
    and defaults to text-to-speech. Its effect is pinned read-only in its own
    schema. Realized on Kubernetes as a Knative Service, which admits an
    inbound call while the tool is running no replicas, so the tool occupies no
    compute between the calls that invoke it. It publishes a host, port,
    endpoint and protocol, and a consumer wires to those without naming how the
    tool runs.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The selector admits a model component, or a gateway serving a model API
    # in front of several: both carry model.aggrega.ai/api and publish an
    # endpoint and a model name, so the Recipe reads either the same way.
    # Through a gateway the model name is the one alias the gateway publishes.
    target_model:
      selector: "component.aggrega.ai/category in (ai-model, gateway), model.aggrega.ai/api"
      required: true
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        task_type: { type: string, default: text_to_speech }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [task_type, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the invocation over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use, and a control plane that fronts the tool routes from its
          own port to this one.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between
          calls, which the realization reaches through its control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          realization needs, is installed in the target cluster. The build
          halts unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The realization
    # publishes all four, so a consumer reads the tool's address off these keys
    # rather than off anything specific to how the tool runs.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to have the wired model perform a
          task. A consumer that composes its own address dials this name; one
          that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the invocation is accepted on. The realization fronts the
          tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent posts an invocation to, with the host and the
          port already composed. It addresses the tool, not the model, which
          the tool reaches over its own socket.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
