apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/telephony
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
spec:
  featuresSchema:
    voip_credentials:
      required: true
      inject: []
      description: VoIP provider credentials. Multi-key secret (account SID, auth token); the attached Feature's key selects within it. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
