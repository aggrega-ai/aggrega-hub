apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/cloud-vision
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: the Cloud Vision API is a
  # hosted service the reader contracts for with Google, under Google
  # Cloud's terms, which no SPDX identifier names. That is the situation
  # component.aggrega.ai/upstream-licensing records as proprietary. No
  # realization pins an artifact of the service, so the catalog distributes
  # and brokers none, and the standard library's admission test, which reads
  # the artifacts an entity pins, finds nothing to refuse.
  #
  # The endpoints follow Google's Cloud Vision documentation: the REST
  # reference names the service endpoint https://vision.googleapis.com, and
  # "Multi-regional support for Vision API OCR" names eu-vision.googleapis.com
  # and us-vision.googleapis.com, through which text detection stores and
  # processes data in the European Union or the United States alone, while
  # the client libraries call the global endpoint unless one is set.
  description: >
    Google Cloud's Vision API, reached as an external reference: no compute
    runs and nothing is provisioned. The Vision API detects text and other
    features in the images and files a caller sends or names, and its
    Product Search methods keep products and their reference images in a
    project and find them in an image.

    The operator supplies the API's address in the Release: the global
    endpoint, https://vision.googleapis.com, or
    https://eu-vision.googleapis.com or https://us-vision.googleapis.com,
    through which Google stores and processes the data of text detection in
    the European Union or the United States alone. A consumer reads it over a
    uses edge.

    Authentication is the consumer's concern: a workload calls with Google
    credentials of its own, such as the identity its platform gives it, and
    receives none from this realization. The products a caller creates
    through Product Search are kept by the service, outside the Release, and
    no backup is configured.
  labels:
    # A service the Release calls rather than runs: nothing in the Release
    # serves it, so the operational primitive is a resource.
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-tool
    # The Vision API's Product Search methods create, change and delete
    # products, product sets and reference images in the project, and its
    # asynchronous annotation methods write their results as JSON files into
    # the Cloud Storage location the request names (the REST reference's
    # images.asyncBatchAnnotate and files.asyncBatchAnnotate), so a call
    # through it can change state.
    tool.aggrega.ai/impact: mutating
    # Every realization is a managed service, so the one hosting posture is
    # this Component's identity. Selector-only: never stamped onto output.
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # No values are declared: the Vision API holds no setting a developer
  # chooses for the application; what a request asks the API to detect is
  # the caller's, in each request. Which endpoint is reached is the
  # operator's, under infra.endpoint.
  schema:
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      #
      # The global endpoint and the European Union and United States ones
      # differ in where Google stores and processes a request's data, which
      # is the operator's choice, so the address is operator-supplied rather
      # than a fixed host.
      endpoint:
        type: string
        description: >
          Address of the Vision API a consumer sends its requests to:
          https://vision.googleapis.com, https://eu-vision.googleapis.com or
          https://us-vision.googleapis.com.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads and halts the build on any other.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      endpoint:
        type: string
        required: true
        description: >
          Address of the Vision API, as the Release supplies it, which a
          consumer sends its annotation and Product Search requests to with
          its own Google credentials.
