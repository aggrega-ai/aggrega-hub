apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/http-request
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a generic HTTP
  # client, and the image serving it is named by the deployment. There is no
  # upstream product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A tool that lets an agent make an HTTP request, for reaching a service that
    has no more specific tool of its own. The developer fixes the method the
    tool may use, defaulting to POST, and may reference a schema the request
    body is expected to satisfy. Fixing the method at authoring time keeps one
    tool from being repurposed as another: a tool declared for GET cannot be
    directed to write. Marked mutating, since a request may change state in the
    service it reaches. Realized on Kubernetes two ways, selected in the
    Manifest: as a Knative Service, or as a Deployment KEDA scales from a
    declared event source. Both publish the same host, port, endpoint and
    protocol, so a consumer wires to either unchanged.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        method: { type: string, enum: [POST, GET, PUT], default: POST }
        payload_schema_ref: { type: string }
      required: [method]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the deployment names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the tool over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between
          calls; each realization reaches zero through its own control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the control plane the selected realization
          needs — Knative Serving for the Knative realization, KEDA for the
          event-driven one — is installed in the target cluster. Both halt the
          build unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. Both realizations
    # publish all four, with the same meanings and different values, so a
    # consumer's wiring does not change when the realization does.
    provides:
      host: { type: string, required: true }
      port: { type: integer, required: true }
      endpoint: { type: string, required: true }
      protocol: { type: string }
