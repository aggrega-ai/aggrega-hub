apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/retrieval
  version: 1.0.1
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a similarity-lookup
  # capability whose store is a component wired onto its socket, and the
  # image serving the lookup is named by the Release. There is no upstream
  # product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A read-only tool that fetches reference material by similarity, so an agent
    can ground an answer in the documents its store holds rather than only in
    what the model already holds. It declares a required socket onto a
    datastore whose engine serves similarity search — vector, semantic-memory
    or search — so the store is resolved in the topology rather than
    configured in a prompt. The developer sets how many matches a lookup
    returns, defaulting to five. Its effect is pinned read-only in its own
    schema. Realized on Kubernetes as a Knative Service, which admits an
    inbound call while the tool is running no replicas, so the tool occupies no
    compute between the calls that invoke it, and on Docker Compose as one
    service that runs while the stack runs. It publishes a host, port,
    endpoint and protocol, and a consumer wires to those without naming how the
    tool runs. The catalog pins no image, so nothing renders until the
    Release sets `infra.image`. The store's address reaches the tool's code
    under default variable names; an `inject:` block on the connection
    delivers instead, as variables or files, the names that code reads.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # RETRIEVAL_TOOL_* variable the realization otherwise delivers it under; an
  # entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  usesSchema:
    # The store the tool searches. A connection writing no inject block hands
    # the tool's code the store's host and port as RETRIEVAL_TOOL_STORE_HOST and
    # RETRIEVAL_TOOL_STORE_PORT, and its protocol as
    # RETRIEVAL_TOOL_STORE_PROTOCOL where the store publishes one; only one
    # such connection is accepted. A connection writing an inject block receives
    # instead what it dictates, as variables (env) or as files (file) at the
    # paths it names, since the image is the tool's own code: any key the store
    # publishes, under the names that code reads.
    target_datastore:
      selector: "datastore.aggrega.ai/engine in (vector, semantic-memory, search)"
      required: true
      inject: [env, file]
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        top_k: { type: integer, default: 5 }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [top_k, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the lookup over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use. On Kubernetes the control plane fronting the tool routes
          from its own port to this one; on Docker Compose callers reach this
          port directly.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. On Kubernetes, zero is what lets the tool run no
          replicas between calls, which the realization reaches through its
          control plane. Docker Compose runs one container throughout and
          refuses a floor above one.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: >
          Replica ceiling the Kubernetes realization's autoscaler may reach. On
          Docker Compose the one container never passes it.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          Kubernetes realization needs, is installed in the target cluster.
          That realization halts the build unless this is set true, so a custom
          resource is never emitted as an orphan into a cluster that cannot
          reconcile it. Docker Compose involves no control plane and does not
          read it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The realization
    # publishes all four, so a consumer reads the tool's address off these keys
    # rather than off anything specific to how the tool runs.
    provides:
      host:
        type: string
        required: true
        description: >
          Name an agent calls to fetch reference material by similarity: the
          tool's in-cluster DNS name on Kubernetes, its service name on the
          Compose network on Docker Compose. A consumer that composes its own
          address dials this name; one that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the lookup is accepted on. On Kubernetes the realization
          fronts the tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set; on Docker Compose it is infra.port.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent posts a lookup to, with the host and the port
          already composed. It addresses the tool, not the datastore behind
          it, which the tool reaches over its own socket.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
