apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/datastore-query
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a query capability
  # whose store is a component wired onto its socket, and the image
  # serving the query is named by the Release. There is no upstream product
  # whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A read-only tool that answers an agent's questions by querying a datastore
    the topology has wired to it. The query dialect is chosen by the developer
    and defaults to SQL. It declares a required socket onto a datastore
    component, so the store it reads is resolved as a topology edge rather than
    supplied as a connection string in a prompt, and its effect is pinned
    read-only in its own schema — it cannot be widened to write.
    Realized on Kubernetes as a Knative Service, which admits an inbound call
    while the tool is running no replicas, so the tool occupies no compute
    between the calls that invoke it. It publishes a host, port, endpoint and
    protocol, and a consumer wires to those without naming how the tool
    runs. The catalog pins no image, so nothing renders until the Release
    sets `infra.image`. The store's address reaches the tool's code under
    default variable names; an `inject:` block on the connection delivers
    instead, as variables or files, the names that code reads. A store served
    over TLS alone halts the build on a connection writing none.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: read-only
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # QUERY_TOOL_* variable the realization otherwise delivers it under; an entry
  # reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  usesSchema:
    # The store the tool queries. A connection writing no inject block hands the
    # tool's code the store's host and port as QUERY_TOOL_STORE_HOST and
    # QUERY_TOOL_STORE_PORT, and its protocol, user and database as
    # QUERY_TOOL_STORE_PROTOCOL, QUERY_TOOL_STORE_USER and
    # QUERY_TOOL_STORE_DATABASE where the store publishes them; only one such
    # connection is accepted. Such a connection hands the code no authority to
    # check a certificate against, so on it a store served over TLS alone,
    # publishing a protocol ending in -tls such as valkey-tls, halts the build,
    # naming the connection. A connection writing an inject block receives
    # instead what it dictates, as variables (env) or as files (file) at the
    # paths it names, since the image is the tool's own code: any key the store
    # publishes, under the names that code reads. It is not refused for TLS,
    # checking the store's certificate being that code's.
    target_datastore:
      selector: "component.aggrega.ai/category=datastore"
      required: true
      inject: [env, file]
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        dialect: { type: string, default: sql }
        side_effects: { type: string, enum: [read_only], default: read_only }
      required: [dialect, side_effects]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the query over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use, and a control plane that fronts the tool routes from its
          own port to this one.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between
          calls, which the realization reaches through its control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          realization needs, is installed in the target cluster. The build
          halts unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. The realization
    # publishes all four, so a consumer reads the tool's address off these keys
    # rather than off anything specific to how the tool runs.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to query the wired datastore. A
          consumer that composes its own address dials this name; one that
          does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the query request is accepted on. The realization fronts
          the tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent posts a query to, with the host and the port
          already composed. A consumer hands it to its tool client as the
          address it calls.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
