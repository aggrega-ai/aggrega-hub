apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-tool/openapi
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares a client driven by
  # whichever OpenAPI document the developer points it at, and the image serving
  # it is named by the Release. There is no upstream product whose licence
  # could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A tool built from an API's own description: the developer supplies the
    location of an OpenAPI document, and the operations that document declares
    become what the agent may call. An Aggregate adds a whole HTTP API to an
    agent by pointing at its specification, rather than declaring one tool per
    endpoint. Marked mutating, since the described operations may include ones
    that write. Realized on Kubernetes as a Knative Service, which admits an
    inbound call while the tool is running no replicas, so the tool occupies no
    compute between the calls that invoke it. It publishes a host, port,
    endpoint and protocol, and a consumer wires to those without naming how the
    tool runs. An edge from the tool, on a socket the author names, delivers
    what its `inject:` block dictates, as variables or as files, on every
    realization that runs the tool. The catalog pins no image, so nothing
    renders until the Release sets `infra.image`.
    The component's own `inject:` block takes `env` and `file` entries too, and
    one reading a value of the tool alone replaces that value's default variable
    name.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # The mechanisms the developer's own inject block on the component may name:
  # env and file, the two its realization delivers, as it renders no command
  # line. Each env entry reaches the container under the name the developer
  # gives it and each file entry at the path it gives. An entry reading one of
  # the tool's own values alone replaces that value's default name, the
  # OPENAPI_TOOL_* variable the realization otherwise delivers it under; an
  # entry reading it beside another value, or beside infra, metadata or the
  # component's identity, replaces nothing.
  inject: [env, file]

  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        spec_uri: { type: string }
      required: [spec_uri]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the tool over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: >
          Port the tool's own container listens on. A consumer does not
          necessarily connect here: the realization publishes the address
          callers use, and a control plane that fronts the tool routes from its
          own port to this one.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between the
          calls that invoke it, which the realization reaches through its
          control plane.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that Knative Serving, the control plane the
          realization needs, is installed in the target cluster. The build
          halts unless this is set true, so a custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. They are the
    # coordinates an agent needs in order to reach the tool, and the realization
    # publishes all four. They describe the tool's own address, not the address
    # of the API the OpenAPI document describes: where that API lives is settled
    # by the document the developer supplied.
    provides:
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name an agent calls to reach the described API
          through this tool. A consumer that composes its own address dials
          this name; one that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the tool accepts an agent's calls on. The realization
          fronts the tool on the control plane's own port rather than the tool
          container's, so a consumer reads this rather than the port an
          operator set.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL an agent calls the tool at, with the host and the port
          already composed. It addresses the tool, not the API the
          specification describes, which the tool reaches on the agent's
          behalf.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
