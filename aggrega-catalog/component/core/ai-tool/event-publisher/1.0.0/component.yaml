apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-tool/event-publisher
  version: 1.0.0
  # metadata.license carries the SPDX identifier of the software a Component
  # packages, and this Component packages none: it declares an event-publishing
  # capability whose broker is a component wired onto its socket. There is
  # no upstream product whose licence could be stated, which is the same fact
  # component.aggrega.ai/upstream-licensing records as not-applicable.
  description: >
    A tool that lets an agent emit an event rather than call for a result, so a
    deployment can hand work off to whatever consumes the stream instead of
    waiting on a reply. The developer names the topic the event is published
    to, and may reference a schema the payload is expected to satisfy. It
    declares a required socket onto a message broker the deployment runs, so
    the broker it publishes to is resolved in the topology. Marked mutating:
    a published event is visible to its consumers and cannot be withdrawn.
    Realized on Kubernetes as a Knative Service: the control plane admits a
    call while the revision runs no replicas and sets the replica count from
    the concurrency it observes, so the tool occupies no compute between the
    calls that invoke it. It publishes the host, port, endpoint and protocol
    an agent reaches it on.
  labels:
    component.aggrega.ai/type: function
    component.aggrega.ai/category: ai-tool
    tool.aggrega.ai/impact: mutating
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  usesSchema:
    # The tool delivers the broker's host, port and protocol into its own
    # container, so the socket accepts a messaging component that runs as a
    # server and publishes those coordinates. The type requirement is what
    # keeps an external messaging service — one the deployment calls rather
    # than runs, and which publishes a different contract — from satisfying
    # the socket: such a target resolves no address the tool could publish
    # to, so the build halts on the selector rather than emitting a container
    # whose broker coordinates are blank.
    target_messaging:
      selector: "component.aggrega.ai/category=messaging, component.aggrega.ai/type in (server, stateful-server)"
      required: true
  schema:
    # values — Developer Intent
    # Filled by the Developer in the Aggregate.
    values:
      $ref: "BaseComponents#/schemas/BaseToolParameter"
      properties:
        target_topic: { type: string }
        payload_schema_ref: { type: string }
      required: [target_topic]

    # infra — Operational Sizing
    # Filled by Ops in the Release. Developer never sees this.
    infra:
      # The image carries no default because this Component wraps no upstream
      # product: the Release names an image it already holds the right to
      # run, its tag included. That is also why no engine_version knob appears
      # here — the reference is supplied whole rather than assembled from a
      # catalog-held name and an operator-held version.
      image:
        type: string
        description: Container image serving the tool over HTTP.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8080
        description: Port the tool listens on, and the port it publishes to consumers.
      compute:
        cpu:
          type: string
          default: 100m
        memory:
          type: string
          default: 128Mi
      min_replicas:
        type: integer
        min: 0
        default: 0
        description: >
          Replica floor. Zero is what lets the tool run no replicas between the
          calls that invoke it.
      max_replicas:
        type: integer
        min: 1
        default: 5
        description: Replica ceiling the realization's autoscaler may reach.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the Knative Serving control plane the
          realization needs is installed in the target cluster. The build halts
          unless this is set true, so a custom resource is never emitted as an
          orphan into a cluster that cannot reconcile it.
      overrides:
        type: object
        additionalProperties: true
        description: Realization-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges. They are the
    # coordinates a caller needs in order to reach the tool, and the
    # realization publishes all four.
    provides:
      host: { type: string, required: true }
      port: { type: integer, required: true }
      endpoint: { type: string, required: true }
      protocol: { type: string }
