apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/litellm
  version: 1.0.0
  description: >
    LiteLLM running in-cluster as a self-hosted, OpenAI-compatible model proxy.
    A Recipe synthesizes the proxy directly and fronts its API behind a
    ClusterIP Service; the proxy forwards each request to an upstream provider
    model named by a deterministic pointer string, which the runtime resolves
    when it serves a request and the compiler never contacts. The published
    alias in values.model is the name the proxy serves under, so a consumer
    reaches one stable in-cluster endpoint and name while the upstream target
    behind it changes independently. The proxy holds the upstream credential
    attached to its provider_key slot and presents it on a caller's behalf, so
    both its Recipes forward from a caller only the request fields the proxy
    declares for the route the request took, and refuse the rest — so a caller
    cannot point the proxy at an address of its own through a request-body
    model list, inject an upstream header, or pass an unrecognised field
    through to the model server behind it, nor send a provider key of its own
    to be used in place of the proxy's, even one it holds legitimately; the
    request is answered with an error naming the field and nothing is
    forwarded. Further fields a caller must send are admitted by the Release,
    through infra.admitted_request_fields. For the same reason both Recipes
    answer only the routes the proxy serves — the model request routes, where
    those fields are checked, in the spellings it serves whatever the model
    alias; the model listing; its health checks; and, of its administrative
    routes, key management — and refuse every other path without forwarding
    it. So its token-count routes, its pass-through routes to providers' own
    APIs, its other administrative routes (organizations, teams, users,
    budgets, spend and request logs among them) and its administrative console
    are not available through either, nor is a model route whose path carries
    the model name, as an Azure-style path does; a caller that needs a token
    count computes it on its own side. Exports its host, port,
    endpoint, model, and protocol to consumers via the uses topology, the same
    contract every other model component publishes, so an agent reaches the
    proxy without hardcoding an endpoint.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Both slots are optional and transparent (`required` omitted → optional;
    # inject: [env] so a synthesized Workload may reference them as env
    # secrets). The selector is secret-kind-pinned but family-agnostic, so a
    # referenceable credential fills the slot on helm and an inject-value
    # credential fills it on compose. Neither credential's value ever reaches
    # the proxy's configuration body — the recipes deliver both as environment
    # variables and the configuration names the variable, never the value.
    master_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional administrative key guarding the proxy's own API. When attached, the Recipe delivers it as the environment variable the proxy reads at startup, so callers and the management API must present it. Unattached, the proxy starts with no administrative key and treats every caller as an unprivileged internal user, which suits a development deployment and not a shared one."
    provider_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional credential the proxy presents to the upstream provider it routes to, delivered as the environment variable named in values.provider_key_variable. Unattached, the proxy runs and serves its API but holds no upstream credential, so a routed request fails at the provider; attach one for any deployment that must actually reach a model."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. `model` is
      # the alias the proxy publishes: it is the name the proxy serves under and
      # the name a consumer asks for, and it is deliberately independent of the
      # upstream target so the target can change without a consumer changing.
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        upstream_model:
          type: string
          description: The provider-qualified upstream model the proxy forwards to, in the proxy's own provider/model notation (for example openai/gpt-4o or anthropic/claude-sonnet-4). A deterministic pointer string the runtime resolves per request; the compiler never contacts the provider.
        provider_key_variable:
          type: string
          default: OPENAI_API_KEY
          description: Name of the environment variable under which the upstream provider's credential is delivered, and the variable the proxy's configuration names in its place. The correct name follows the provider chosen in upstream_model — the default suits an OpenAI-notation target; an Anthropic target uses ANTHROPIC_API_KEY, and so on per the provider's own convention.
      required: [upstream_model]
    infra:
      # admitted_request_fields comes from the LiteLLMGuardSchemas library, which
      # declares it once for every Component running this proxy behind the
      # shared request guard; the keys under properties are this Component's
      # own.
      $ref: "LiteLLMGuardSchemas#/schemas/RequestGuardInfra"
      properties:
        # Operational Sizing — filled by the Operator in the Release. Developer
        # never sees this.
        port:
          type: integer
          min: 1024
          max: 65535
          default: 4000
          description: Server listen port for the proxy API. Most operators should omit this and let the Recipe assign the default (4000).
        external_base_url:
          type: string
          description: >
            Externally reachable origin of the proxy, as assembled at the ingress
            tier — scheme, host and, where it is not the scheme's default, port,
            with no path; for example https://llm.example.com. The proxy composes
            from this the sign-in callback address it hands an identity provider,
            the address of its admin console it sends a browser to after sign-in,
            and the proxy address it writes into every alert it sends. The product
            documents this setting as an origin only, so the Recipes halt the build
            on an address carrying a path. Omitted, the proxy composes each of
            those addresses from the request that arrives, which is correct for a
            proxy nobody signs in to from outside the cluster.
        engine_version:
          type: string
          default: "v1.85.1"
          description: LiteLLM proxy image tag. Selects the image tag on the synthesized proxy container.
        compute:
          cpu:
            type: string
            default: "1"
          memory:
            type: string
            default: 2Gi
        database_url:
          type: string
          description: Optional connection string for the proxy's own bookkeeping database, which backs key management, spend tracking and request logs. A deterministic pointer string the runtime resolves; the compiler never connects to it. Omit it and the proxy runs stateless — it serves and routes normally, and the features that need persistence are simply inactive.
        overrides:
          type: object
          additionalProperties: true
          description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads;
      # host, port, and protocol expose the raw in-cluster serving location.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the proxy. A consumer
          that composes its own address dials this name; one that does not
          reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxy requests on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the OpenAI-compatible API the proxy serves, with
          the host, the port and the API path already composed. A consumer
          hands it to a client library as its base URL.
      model:
        type: string
        required: true
        description: >
          Name a request must ask the proxy for. The proxy maps it onto
          whichever upstream provider it is configured to forward to, so a
          consumer names this rather than an upstream model.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
