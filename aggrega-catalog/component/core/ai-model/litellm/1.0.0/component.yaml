apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/litellm
  version: 1.0.0
  description: >
    LiteLLM running in-cluster as a self-hosted, OpenAI-compatible model proxy.
    The published alias in values.model is the name the proxy serves under, and
    it forwards each request to the provider-qualified upstream model in
    values.upstream_model, so a consumer reaches one stable in-cluster endpoint
    and name while the target behind it changes independently. The proxy holds
    the upstream credential attached to its provider_key slot and presents it
    on a caller's behalf. Exports its host, port, endpoint, model and protocol,
    the contract every other model component publishes.

    Because it holds that credential, its Recipes forward only the request
    fields the proxy declares for the route, plus any the Release admits
    through infra.admitted_request_fields, and refuse the rest with an error
    naming the field. They answer only the model routes, the model listing,
    the health checks and key management, and refuse every other path, so its
    token-count, pass-through and other administrative routes, its console and
    model paths carrying the model name are not available through any.

    On Kubernetes, reach for helm/litellm, which synthesizes the proxy, where
    the build must fetch nothing, and for helm/litellm-chart, BerriAI's chart,
    where its registry is reachable; for local development, the compose Recipe.

    With `values.metrics_enabled` true each Recipe has the proxy serve its
    Prometheus metrics, its path allowlist forwarding a GET of /metrics alone
    to them from port 9090, and publishes that address as `metrics_endpoint`;
    false, that key is empty. The port checks no caller, and the metrics name
    the hashed keys, key aliases and user emails the proxy attributes spend
    to.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: the proxy's OpenAI-compatible API answers at the endpoint
    # published here, whichever upstream the published alias resolves to.
    model.aggrega.ai/api: openai
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: open-core
  annotations:
    # How the proxy's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. The address published as
    # metrics_endpoint is port 9090 of the path allowlist in front of the
    # proxy, which forwards a GET of /metrics alone to the proxy's own metrics
    # listener and asks no key, so a scrape presents no credential whether or
    # not the api_key slot is filled.
    observability.aggrega.ai/metrics-credential: none
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Every slot is optional and transparent (`required` omitted → optional;
    # inject: [env] so a synthesized Workload may reference them as env
    # secrets). The selector is secret-kind-pinned but family-agnostic, so a
    # referenceable credential fills a slot on helm and an inject-value
    # credential fills it on compose. No credential's value reaches the
    # proxy's configuration body — the recipes deliver each as an environment
    # variable, and the configuration names the variable where it reads one,
    # never the value.
    #
    # The key the proxy requires of its callers, which LiteLLM calls its master
    # key: every Recipe delivers it as LITELLM_MASTER_KEY, the variable the
    # proxy reads it from at startup, and the proxy compares a presented key
    # with it exactly. Unlike a server that holds one key, the proxy also
    # accepts the keys it has issued through its key-management API, which it
    # keeps in its bookkeeping database; with no database_url attached it
    # refuses every key but this one.
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional administrative key guarding the proxy's own API, which LiteLLM calls its master key. When attached, the Recipe delivers it as LITELLM_MASTER_KEY, the environment variable the proxy reads at startup, so callers and the management API must present it. Unlike a server that checks one key, the proxy also accepts the keys it issues through its key-management API and keeps in its bookkeeping database: with database_url attached a caller may present such a key instead, and with none the proxy accepts this key alone. Unattached, the proxy starts with no administrative key and treats every caller as an unprivileged internal user, which suits a development Release and not a shared one."
    provider_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional credential the proxy presents to the upstream provider it routes to, delivered as the environment variable named in values.provider_key_variable. Unattached, the proxy runs and serves its API but holds no upstream credential, so a routed request fails at the provider; attach one for any Release that must actually reach a model."
    # The connection string names the database's user and usually its
    # password, so it is a credential and arrives through a slot like the two
    # above. On helm the Recipe renders a reference to the secret holding it,
    # so the string is never written into the proxy's own resources; whether it
    # appears anywhere else in the output is decided by the credential
    # realization the Manifest binds, and one pointing at a secret that already
    # exists renders none of it. On compose the Recipe writes the value its
    # credential delivers, as it does for the two slots above, so a credential
    # written as a Compose variable reference keeps the string out of the file.
    database_url:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional connection string for the proxy's own bookkeeping database, which backs key management, spend tracking and request logs. When attached, the Recipe delivers it as DATABASE_URL, the environment variable the proxy reads at startup — on helm referenced from the secret that holds it, so the proxy's Deployment carries the reference and never the string; on compose as the value its credential delivers under that name, which a Compose variable reference keeps out of the file. The compiler never connects to the database. Unattached, the proxy runs stateless — it serves and routes normally, and the features that need persistence are simply inactive."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. `model` is
      # the alias the proxy publishes: it is the name the proxy serves under and
      # the name a consumer asks for, and it is deliberately independent of the
      # upstream target so the target can change without a consumer changing.
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        upstream_model:
          type: string
          description: The provider-qualified upstream model the proxy forwards to, in the proxy's own provider/model notation (for example openai/gpt-4o or anthropic/claude-sonnet-4). A deterministic pointer string the runtime resolves per request; the compiler never contacts the provider.
        provider_key_variable:
          type: string
          default: OPENAI_API_KEY
          description: Name of the environment variable under which the upstream provider's credential is delivered, and the variable the proxy's configuration names in its place. The correct name follows the provider chosen in upstream_model — the default suits an OpenAI-notation target; an Anthropic target uses ANTHROPIC_API_KEY, and so on per the provider's own convention.
        # The proxy's own metrics, in the Prometheus format. LiteLLM records them
        # with its Prometheus callback and serves them on a listener of its own,
        # which checks no key and binds to the proxy's own address, the loopback
        # one. With this value true each Recipe turns both on, and its path
        # allowlist listens on port 9090 of the service as well, forwarding a GET
        # of /metrics alone to that listener and answering everything else 403.
        # The metrics carry the identities the proxy attributes spend to, the
        # hashed keys, the key aliases and the user emails, as labels, so anything
        # that reaches the port reads them; the port sits on the ClusterIP
        # Service on Kubernetes and on the compose network on Compose. The main
        # port still answers /metrics 403. False leaves all of it off and the
        # address unpublished.
        metrics_enabled:
          type: boolean
          default: false
          description: Has the proxy serve its own Prometheus metrics through its path allowlist on port 9090, where a GET of /metrics alone is forwarded, and publishes their address as `metrics_endpoint`; while false that key is empty. The port checks no caller, and the metrics name the hashed keys, key aliases and user emails the proxy attributes spend to, so anything that reaches the port reads them.
      required: [upstream_model]
    infra:
      # The request guard. The proxy holds the upstream credential attached to
      # its provider_key slot and presents it on a caller's behalf, so all its
      # Recipes forward from a caller only the request fields the proxy
      # declares for the route the request took, and refuse the rest — so a
      # caller cannot point the proxy at an address of its own through a
      # request-body model list, inject an upstream header, or pass an
      # unrecognised field through to the model server behind it, nor send a
      # provider key of its own to be used in place of the proxy's, even one it
      # holds legitimately; the request is answered with an error naming the
      # field and nothing is forwarded. Further fields a caller must send are
      # admitted by the Release, through infra.admitted_request_fields. The
      # proxy itself writes the identity it knows a request by — the hash of the
      # key it verified, that key's team and organization, and the end user the
      # request names — into one of the request's two metadata mappings, chosen
      # by route. Where that mapping is the caller's own metadata, the proxy's
      # value replaces any the caller wrote; where the proxy keeps the caller's
      # metadata apart, as on the responses and messages routes, it removes the
      # team, organization and end user fields a caller wrote there, and a
      # request naming the key's hash there, metadata.user_api_key, is refused
      # the same way. So no caller can pass for another key.
      #
      # admitted_request_fields comes from the LiteLLMGuardSchemas library, which
      # declares it once for every Component running this proxy behind the
      # shared request guard; the keys under properties are this Component's
      # own.
      $ref: "LiteLLMGuardSchemas#/schemas/RequestGuardInfra"
      properties:
        # Operational Sizing — filled by the Operator in the Release. Developer
        # never sees this.
        #
        # The routes answered on this port. For the same reason as the request
        # guard above, all its Recipes answer only the routes the proxy serves —
        # the model request routes, where the guard checks the fields, in the
        # spellings it serves whatever the model alias; the model listing; its
        # health checks; and, of its administrative routes, key management —
        # and refuse every other path without forwarding it. So its token-count
        # routes, its pass-through routes to providers' own APIs, its other
        # administrative routes (organizations, teams, users, budgets, spend and
        # request logs among them) and its administrative console are not
        # available through any, nor is a model route whose path carries the
        # model name, as an Azure-style path does; a caller that needs a token
        # count computes it on its own side.
        port:
          type: integer
          min: 1024
          max: 65535
          default: 4000
          description: Server listen port for the proxy API. Most operators should omit this and let the Recipe assign the default (4000).
        external_base_url:
          type: string
          description: >
            Externally reachable origin of the proxy, as assembled at the ingress
            tier — scheme, host and, where it is not the scheme's default, port,
            with no path; for example https://llm.example.com. The proxy composes
            from this the sign-in callback address it hands an identity provider,
            the address of its admin console it sends a browser to after sign-in,
            and the proxy address it writes into every alert it sends. The product
            documents this setting as an origin only, so the Recipes halt the build
            on an address carrying a path. Omitted, the proxy composes each of
            those addresses from the request that arrives, which is correct for a
            proxy nobody signs in to from outside the cluster.
        engine_version:
          type: string
          default: "v1.103.1"
          description: LiteLLM proxy image tag. Selects the image tag of the proxy container on every Recipe.
        # Selects the version of BerriAI's litellm-helm chart the chart-backed
        # Recipe pulls; the workload-synthesis and compose Recipes pull no chart
        # and read nothing here. Changing it away from that Recipe's default
        # does not guarantee value-mapping compatibility with the other chart
        # version.
        source_version:
          type: string
          description: Version of BerriAI's litellm-helm chart the chart-backed Recipe pulls, defaulting to the version that Recipe was checked against. The workload-synthesis and compose Recipes pull no chart and read nothing here.
        compute:
          cpu:
            type: string
            default: "1"
          memory:
            type: string
            default: 2Gi
        overrides:
          type: object
          additionalProperties: true
          description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads;
      # host, port, and protocol expose the raw in-cluster serving location. It
      # is the same contract every other model component publishes, so an agent
      # reaches the proxy without hardcoding an endpoint.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the proxy. A consumer
          that composes its own address dials this name; one that does not
          reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts proxy requests on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the OpenAI-compatible API the proxy serves, with
          the host, the port and the API path already composed. A consumer
          hands it to a client library as its base URL.
      model:
        type: string
        required: true
        description: >
          Name a request must ask the proxy for. The proxy maps it onto
          whichever upstream provider it is configured to forward to, so a
          consumer names this rather than an upstream model.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # The address a Prometheus server scrapes the proxy's own metrics at,
      # while values.metrics_enabled is true: /metrics on port 9090 of the
      # service each Recipe serves them on, which the path allowlist forwards
      # to the proxy's metrics listener — the proxy's own service on the
      # synthesis and compose Recipes, and the chart's metrics Service, its
      # name followed by -metrics, on helm/litellm-chart. Every Recipe
      # publishes it spelled out in full.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this component's metrics at —
          scheme, host, port and path, `http://<host>:9090/metrics`, the host
          being the name of the Service the Recipe serves them on. Empty while
          values.metrics_enabled is false.
