apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/sagemaker
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/hosting: local
spec:
  secretsSchema:
    aws_credentials:
      required: true
      inject: []
      description: AWS credentials for the SageMaker endpoint. Multi-key secret (access key ID, secret access key); the attached Feature's key selects within it. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        endpoint_name: { type: string }
      required: [endpoint_name]
