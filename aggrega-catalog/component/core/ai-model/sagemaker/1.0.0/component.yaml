apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/sagemaker
  version: 1.0.0
  description: >
    Amazon SageMaker managed model serving endpoint, realized as an external reference (no in-cluster compute). The regional endpoint is operator-supplied. Authentication is the consumer's concern: workloads use ambient AWS IAM (for example EKS IRSA) or inject their own credentials, rather than a static key delivered by the realization.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    # Model API: the SageMaker runtime's own invocation API answers at the
    # regional endpoint published here, a request's body being whatever the
    # deployed model accepts. It is not the OpenAI API.
    model.aggrega.ai/api: native
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        endpoint_name: { type: string }
      required: [endpoint_name]
    infra:
      # The SageMaker runtime host is regional (runtime.sagemaker.<region>.
      # amazonaws.com), so the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Regional SageMaker runtime URL a consumer sends invocation requests
          to. The region is the operator's choice, so the Release supplies it.
      model:
        type: string
        required: true
        description: Name of the serving endpoint an invocation is addressed to, carried through from the value the Aggregate declared.
