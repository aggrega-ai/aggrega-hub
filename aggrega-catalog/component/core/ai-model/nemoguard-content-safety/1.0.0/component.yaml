apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/nemoguard-content-safety
  version: 1.0.0
  # NVIDIA describes the microservice as one that "serves a GPU-accelerated LLM
  # model that performs content moderation" and states that it "is based on
  # NVIDIA NIM for LLMs", which is why it is the NIM component with a name of its
  # own rather than a component with Recipes of its own.
  #
  # The image the Release names is the content-safety NIM's, published by NVIDIA
  # as nvcr.io/nim/nvidia/llama-3.1-nemoguard-8b-content-safety, 1.10.1 being
  # the tag NVIDIA's getting-started page pulls. Pulling it takes a registry login
  # to nvcr.io with the NGC API key, which on Kubernetes is the Secret
  # infra.image_pull_secret names.
  #
  # NVIDIA's own configuration page for this NIM names NIM_HTTP_API_PORT as the
  # variable that moves the port it serves on, where the NIM for LLMs
  # documentation names NIM_SERVER_PORT, the one the base's Recipes set. At the
  # default port, 8000, the two agree whichever the image reads; another port
  # has not been proved on this image.
  description: >
    NVIDIA's NemoGuard content-safety model, Llama 3.1 NemoGuard 8B
    ContentSafety, served by its NIM: a model that reads a conversation, judges
    the user's message safe or unsafe against a taxonomy of harm categories
    and names the categories it breaks. core/security/nemo-guardrails points its
    content-safety rail at it through its content_safety socket.

    It is core/ai-model/nvidia-nim under a name of its own: it extends that
    component and takes its values, infra and provides exactly, so every Recipe
    of the NIM realizes it — helm/nvidia-nim, helm/nvidia-nim-chart and
    helm/nvidia-nim-service on Kubernetes, compose/nvidia-nim on Docker — and a
    Manifest maps it to one of them.

    Running it requires an NVIDIA AI Enterprise licence or NVIDIA Developer
    Program membership, and an NGC API key: NVIDIA restricts access to the image
    and the model. The Release names the image in infra.image and the catalog
    names none, so nothing renders until it is set. NVIDIA states that the model
    needs 48 GB of GPU memory, on one GPU or two.
  labels:
    # The operational type and the cognitive category are the base's values,
    # restated here: every Component document declares
    # component.aggrega.ai/type, and the category mirrors this entity's
    # directory segment. The base's other labels are inherited as they are:
    # the model serves the OpenAI-compatible API (model.aggrega.ai/api openai),
    # it generates its verdict as text (model.aggrega.ai/capability
    # generative), and the Release runs it (component.aggrega.ai/hosting
    # self-hosted).
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    # Restated for this NIM's own terms. NVIDIA publishes the container under
    # the NVIDIA Software License Agreement and the Product-Specific Terms for
    # NVIDIA AI Products, and the model under the NVIDIA Community Model License
    # Agreement and the Llama 3.1 Community License Agreement; no single SPDX
    # identifier names them, so metadata.license is absent.
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  extends: core/ai-model/nvidia-nim:1.0.0

  # The three data pillars are the base's, inherited exactly as
  # core/ai-model/nvidia-nim authored them. values.model is the name the server
  # answers to: this NIM takes it from its own model manifest unless told
  # otherwise, and no Recipe tells it otherwise, so a reader confirms it on the
  # running server's model listing, /v1/models. The guard's Recipes write it,
  # with provides.endpoint, into the content-safety model they declare.
  #
  # What this name adds over the base is the identity a consumer reads: the
  # guard's realizations take a target of this type on their content_safety
  # socket and no other, because the prompt and the verdict parser they write are
  # NVIDIA's for this model.
  schema: inherited
