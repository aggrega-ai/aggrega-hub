apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/gemini
  version: 1.0.0
  description: >
    Google's managed Gemini API, reached as an external reference: no compute
    runs in-cluster and the compiler never calls the provider. Its host is
    fixed, so the realization publishes the endpoint itself and a Release
    supplies none — declaring the component and choosing a model is the whole
    of what an Aggregate writes. Consumers read that endpoint and the model
    name over a `uses` edge, the contract every model here publishes, so an
    agent reaches it with no endpoint in its own code. The API key is the
    consumer's to attach: the environment-variable name it arrives under
    belongs to the application rather than to the model.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: the Gemini API, Google's own, answers at the host published
    # here, the one Google's Gen AI client sends a request to when it is given
    # a Gemini API key. A consumer reaches it through that client or the Gemini
    # API's request shape.
    model.aggrega.ai/api: gemini
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the Gemini API. The host is fixed, so the realization
          publishes it and a consumer points its client here without a Release
          supplying anything.
      model:
        type: string
        required: true
        description: Name of the Gemini model a request asks for, carried through from the model the Aggregate declared.
