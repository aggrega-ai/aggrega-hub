apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/openai
  version: 1.0.0
  description: >
    OpenAI's managed chat-completions API, reached as an external reference:
    no compute runs in-cluster and the compiler never calls the provider. Two
    realizations ship and a Manifest picks between them — a direct reference
    that maps an in-cluster name onto the managed host, and a gateway-mediated
    one that registers the model behind an in-cluster AI gateway so the
    gateway holds the provider credential and the application never sees it.
    The endpoint defaults to the managed host, so a bare declaration is
    enough, and it sits on `infra` rather than inside a Recipe so an operator
    may repoint it at a gateway or proxy without editing the Aggregate.
    Consumers read the endpoint and the model name over a `uses` edge — the
    contract every model here publishes — so an agent reaches it with no
    endpoint in its own code.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  featuresSchema:
    api_key:
      required: false
      sensitive: true
      inject: []
      description: >
        Optional OpenAI API key. Recipe controls delivery (Black-Box): a
        gateway-mediated realization binds it into the backend security policy
        it emits, while a direct reference realization delivers no credential,
        so nothing is attached here under that realization.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        strict_response_format: { type: boolean, default: false }
      required: [strict_response_format]
    infra:
      # OpenAI's managed API has a fixed host, so the endpoint defaults to it and
      # an operator need not supply one. It is sourced from infra (not hardcoded
      # in the Recipe) so an operator may repoint it at a gateway or proxy.
      endpoint: { type: string, default: "https://api.openai.com" }
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the AI gateway control plane is installed in
          the target cluster. A gateway-mediated realization halts the build
          unless this is set true, so a gateway custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it. The direct
          reference recipe ignores this flag.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL a consumer sends chat-completion requests to. It follows
          the endpoint set in the Release, so the gateway-mediated realization
          publishes the in-cluster gateway here and the direct one publishes
          the managed host, with no change to the application.
      model:
        type: string
        required: true
        description: >
          Name of the model a request asks for, carried through from the model
          the Aggregate declared. A consumer sends it as the model field of
          each request.
