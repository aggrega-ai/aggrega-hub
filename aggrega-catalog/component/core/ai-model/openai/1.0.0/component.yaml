apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/openai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
spec:
  featuresSchema:
    api_key:
      required: false
      sensitive: true
      inject: []
      description: >
        Optional OpenAI API key. Recipe controls delivery (Black-Box): a
        gateway-mediated realization binds it into the backend security policy
        it emits, while a direct reference realization delivers no credential,
        so a deployment on one attaches nothing here.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        strict_response_format: { type: boolean, default: false }
      required: [strict_response_format]
    infra:
      # OpenAI's managed API has a fixed host, so the endpoint defaults to it and
      # an operator need not supply one. It is sourced from infra (not hardcoded
      # in the Recipe) so an operator may repoint it at a gateway or proxy.
      endpoint: { type: string, default: "https://api.openai.com" }
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the AI gateway control plane is installed in
          the target cluster. A gateway-mediated realization halts the build
          unless this is set true, so a gateway custom resource is never emitted
          as an orphan into a cluster that cannot reconcile it. The direct
          reference recipe ignores this flag.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint: { type: string, required: true }
      model: { type: string, required: true }
