apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/bedrock-embedding
  version: 1.0.0
  description: >
    Amazon Bedrock managed embedding model endpoint, realized as an external reference (no in-cluster compute). The regional endpoint is operator-supplied. Authentication is the consumer's concern: workloads use ambient AWS IAM (for example EKS IRSA) or inject their own credentials, rather than a static key delivered by the realization.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: embedding
    component.aggrega.ai/hosting: managed
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # The Bedrock runtime host is regional (bedrock-runtime.<region>.
      # amazonaws.com), so the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
