apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/azure-openai-embedding
  version: 1.0.0
  description: >
    Azure OpenAI's managed embeddings API, reached as an external reference:
    no compute runs in-cluster and the compiler never calls the provider. Its
    host belongs to the resource an organisation provisions, so the endpoint
    is operator-supplied in the Release and a model is addressed by the
    deployment name given to it inside that resource, together with the API
    version a request is made against and, where an Aggregate wants vectors
    narrower than the model's own default, the output width. It publishes the
    same endpoint-and-model contract the generative models publish, so an
    application that embeds text reads exactly the keys it would read to
    generate it. The API key is the consumer's to attach: the
    environment-variable name it arrives under belongs to the application
    rather than to the model.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: embedding
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        deployment_name: { type: string }
        api_version: { type: string, default: "2024-02-15-preview" }
        dimensions: { type: integer, exclusiveMinimum: 0 }
      required: [deployment_name, api_version]
    infra:
      # The Azure OpenAI resource host is per-resource (https://<resource>.openai.
      # azure.com), so the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract a consumer reads.
      endpoint: { type: string, required: true }
      model: { type: string, required: true }
