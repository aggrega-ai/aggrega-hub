apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/azure-openai-embedding
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: embedding
    model.aggrega.ai/hosting: saas
spec:
  secretsSchema:
    azure_credentials:
      required: true
      inject: []
      description: Azure credentials for the Azure OpenAI endpoint. Multi-key secret (endpoint key, optional AD fields); the attached Feature's key selects within it. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        deployment_name: { type: string }
        api_version: { type: string, default: "2024-02-15-preview" }
        dimensions: { type: integer, exclusiveMinimum: 0 }
      required: [deployment_name, api_version]
