apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/gemini
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    model.aggrega.ai/hosting: saas
spec:
  secretsSchema:
    api_key:
      required: true
      inject: []
      description: Google AI Studio API key for the Gemini API. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        temperature: { type: number, min: 0.0, max: 2.0 }
        top_p: { type: number, min: 0.0, max: 1.0 }
        top_k: { type: integer, min: 0 }
