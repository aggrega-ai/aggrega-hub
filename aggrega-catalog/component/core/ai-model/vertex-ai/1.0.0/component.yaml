apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/vertex-ai
  version: 1.0.0
  description: >
    Google Vertex AI managed generative model endpoint, realized as an external reference (no in-cluster compute). The regional endpoint is operator-supplied. Authentication is the consumer's concern: workloads use ambient GCP workload identity or inject their own credentials, rather than a static key delivered by the realization.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # The Vertex AI host is regional (<region>-aiplatform.googleapis.com), so
      # the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
