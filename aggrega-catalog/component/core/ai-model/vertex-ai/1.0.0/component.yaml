apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/vertex-ai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
spec:
  secretsSchema:
    gcp_credentials:
      required: true
      inject: []
      description: GCP service-account credentials for Vertex AI. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
