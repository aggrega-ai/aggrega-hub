apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/nvidia-nim
  version: 1.0.0
  description: >
    NVIDIA Inference Microservice (NIM) running in-cluster as a self-hosted,
    GPU-native inference server. A Recipe synthesizes the runtime directly: the
    NIM container resolves the model profile into a model-cache volume at start
    and serves the OpenAI-compatible API behind a ClusterIP Service. The model
    value is a deterministic pointer resolved at pod start, never fetched at
    compile time. GPU-native — the serving container always requests a GPU, so a
    GPU-capable cluster is required. The serving image is supplied by the
    operator: NIM images are distributed under NVIDIA's own terms, so the
    Release names an image the operator is entitled to pull rather than one
    from the catalog. Nothing renders until the Release sets
    `infra.image`. Exports its host, port, endpoint, model, and protocol
    to
    consumers via the uses topology, so an agent reaches the model without
    hardcoding an endpoint.

    It also publishes where Prometheus finds the server's metrics: one address
    as `metrics_endpoint`, or, while it runs more than one replica, the Service
    a scraper discovers every replica behind. On a cluster running the
    Prometheus Operator, `core/prometheus-exporter` attached with its port set
    to `http` and its path to `/v1/metrics` emits a ServiceMonitor for it
    instead.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: the OpenAI-compatible API the NIM container serves answers at
    # the endpoint published here, under the /v1 path it carries.
    model.aggrega.ai/api: openai
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # NGC API key for authenticating the model-profile download from NVIDIA GPU
    # Cloud. When a credential is attached here, the Recipe delivers it
    # to the serving container as an environment variable; when unattached, the
    # container starts without it, byte-identically to a Recipe with no slot (a
    # profile that needs authentication then fails at pod start, not compile
    # time). `required` omitted → optional. Transparent (inject: [env]); the
    # selector is secret-kind-pinned but family-agnostic.
    ngc_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional NGC API key for authenticating the model-profile download. When attached, the serving container receives it as an environment variable; unattached, the container starts without it."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. `model` is
      # the deterministic model pointer (a NIM model identifier such as
      # meta/llama-3.1-8b-instruct); the runtime resolves it at pod start.
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Server listen port for the model API. Most operators should omit this and let the Recipe assign the default (8000).
      image:
        type: string
        description: Full reference of the NIM serving image, including its tag — the image the operator is entitled to pull. NIM images are model-specific, so the reference must be the one for the model named in values.model. There is no default, because access to NIM images is governed by NVIDIA's terms rather than by the catalog, and the catalog therefore names none.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of serving replicas. Each replica holds its own model-cache volume and resolves the model profile independently.
      min_replicas:
        type: integer
        min: 1
        description: Lower bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — the synth recipe serves a fixed replica count and does not yet emit an autoscaler; set it to record the intended lower bound.
      max_replicas:
        type: integer
        min: 1
        description: Upper bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — the synth recipe serves a fixed replica count and does not yet emit an autoscaler; set it to record the intended upper bound.
      compute:
        cpu:
          type: string
          default: "4"
        memory:
          type: string
          default: 16Gi
      model_cache:
        type: object
        description: Per-replica model-profile cache volume. Sized for the resolved profile; each serving replica gets its own claim.
        properties:
          size:
            type: string
            default: 50Gi
          class:
            type: string
      model_artifact:
        type: string
        description: Optional OCI reference to the model weights, an alternative weights source to the model id in values.model. A deterministic pointer the runtime resolves at pod start; the compiler never fetches it. Declared ahead of rendering — the synth recipe resolves the model from values.model and does not yet consume this pointer.
      gpu:
        type: object
        description: GPU scheduling for the serving container. NIM is GPU-native, so the serving container always requests at least one GPU; this object tunes the count and selects a GPU runtime class. Requires a GPU-capable cluster and, for runtime_class, a matching RuntimeClass configured in the cluster.
        properties:
          count:
            type: integer
            min: 1
            default: 1
            description: Number of GPUs requested for the serving container, delivered as the extended resource nvidia.com/gpu. Defaults to 1 GPU.
          runtime_class:
            type: string
            description: Name of the RuntimeClass selecting the GPU-enabled container runtime (for example nvidia). Omit to use the cluster default runtime.
      image_pull_secret:
        type: string
        description: Name of a pre-created image-pull Secret granting access to the NIM container registry. Set this when the NIM image is pulled from a private registry; omit when the cluster can pull it without credentials.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads;
      # host, port, and protocol expose the raw in-cluster serving location.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the inference server. A
          consumer that composes its own address dials this name; one that
          does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts model requests on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the OpenAI-compatible API the server serves, with
          the host, the port and the API path already composed. A consumer
          hands it to a client library as its base URL.
      model:
        type: string
        required: true
        description: Name a request must ask this server for, which is the model profile it loaded rather than a provider catalogue name.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # Where Prometheus finds the server's own metrics. NIM serves them at
      # /v1/metrics on the port the API is served on, as NVIDIA documents for
      # its LLM images; the image is the one the Release names, and the keys
      # assume it is one of those. The Recipe publishes exactly one of two
      # shapes and leaves the other empty:
      #   - metrics_endpoint, one address, while infra.replicas is 1;
      #   - metrics_service, metrics_service_port and metrics_path while it is
      #     above 1: the Service balances across the replicas, so one address
      #     would reach a single replica per scrape, and a scraper instead
      #     discovers every endpoint behind that Service.
      # None of the keys carries a namespace: a scraper reads where the target
      # runs from its own connection.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this server's metrics at —
          scheme, host, port and path, `http://<host>:<port>/v1/metrics`, on
          the port the API is served on. Empty while infra.replicas is above
          one, when `metrics_service` is published instead.
      metrics_service:
        type: string
        description: >
          Name of the Service every replica's metrics sit behind, for a scraper
          that discovers each endpoint of that Service rather than scraping
          one address. Set while infra.replicas is above one, beside
          `metrics_service_port` and `metrics_path`; empty otherwise.
      metrics_service_port:
        type: string
        description: >
          Name of the port of `metrics_service` that carries the metrics,
          `http`. Set and empty together with `metrics_service`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at, `/v1/metrics`, published beside
          `metrics_service`. Empty where the server publishes
          `metrics_endpoint`, which carries its own path.
