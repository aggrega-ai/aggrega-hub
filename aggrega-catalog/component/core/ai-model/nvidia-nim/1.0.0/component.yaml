apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/nvidia-nim
  version: 1.0.0
  # On every realization the NIM container resolves the model profile into a
  # model-cache volume at start. The model value is a deterministic pointer the
  # container resolves there, never fetched at compile time. The serving
  # container always requests at least one GPU, so Kubernetes needs a
  # GPU-capable cluster, and Docker Compose a host whose NVIDIA GPUs Docker can
  # hand to containers through the NVIDIA Container Toolkit, serving the model
  # on the compose network. Where pulling the image needs
  # credentials, Kubernetes pulls it with the Secret infra.image_pull_secret
  # names, and Docker Compose with the Docker host's own registry login.
  #
  # Each Kubernetes realization runs the image the Release names and nothing
  # the catalog names in its place: NIM images are distributed under NVIDIA's
  # own terms, so the Release names an image its reader is entitled to pull.
  # NVIDIA's NIM Operator documentation lists the NIM container under the
  # NVIDIA AI Enterprise Software License Agreement, and NVIDIA's nim-llm chart
  # carries the licence identifier LicenseRef-NvidiaProprietary; each build
  # fetches the chart from NVIDIA, and the catalog distributes neither.
  #
  # On a cluster running the Prometheus Operator, core/prometheus-exporter
  # attached to the synthesized Kubernetes realization, with its port set to
  # http and its path to /v1/metrics, emits a ServiceMonitor for it in place of
  # the published metrics keys; on the chart realization that port is named
  # http-openai.
  description: >
    NVIDIA Inference Microservice (NIM) as a self-hosted, GPU-native inference
    server serving the OpenAI-compatible API. Using it needs an NVIDIA account
    and an NGC API key, under NVIDIA's licence terms: every realization runs a
    NIM image the reader must be entitled to pull, named by the Release in
    `infra.image`. The catalog names none, and nothing renders until it is set.

    On Kubernetes three Recipes realize it. `helm/nvidia-nim` assembles the
    workload itself and fetches nothing at build time: reach for it where no
    NIM Operator runs. `helm/nvidia-nim-chart` renders NVIDIA's `nim-llm`
    chart: reach for it where that chart is wanted and NVIDIA's chart
    repository is reachable from the build. `helm/nvidia-nim-service` emits a
    `NIMService` for NVIDIA's NIM Operator: reach for it where the operator
    runs, or is declared beside it as `core/ai-model/nvidia-nim-operator`,
    and affirm that with `infra.control_plane_present`. On a single Docker
    host, `compose/nvidia-nim` serves it through the NVIDIA Container Toolkit.

    Exports its host, port, endpoint, model, and protocol to consumers via the
    uses topology, so an agent reaches the model without hardcoding an
    endpoint, and where Prometheus finds the server's metrics: one address as
    `metrics_endpoint`, or, while it runs more than one replica on Kubernetes,
    the Service a scraper discovers every replica behind.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: the OpenAI-compatible API the NIM container serves answers at
    # the endpoint published here, under the /v1 path it carries.
    model.aggrega.ai/api: openai
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # NGC API key for authenticating the model-profile download from NVIDIA GPU
    # Cloud. When a credential is attached here, the Recipe delivers it
    # to the serving container as an environment variable; when unattached, the
    # container starts without it, byte-identically to a Recipe with no slot (a
    # profile that needs authentication then fails when the container starts,
    # not at compile time). `required` omitted → optional. Transparent
    # (inject: [env]); the selector is secret-kind-pinned but family-agnostic.
    # On Kubernetes the slot takes a credential the container reads from a
    # Secret by reference; on Docker Compose it takes one whose value is
    # delivered, written into the compose file as delivered, so a Compose
    # variable reference such as ${NGC_API_KEY} keeps the key out of the file.
    # NVIDIA's chart takes the Secret's name and data key and reads the key
    # from it as the synthesis does. The NIM Operator's NIMService names one
    # Secret on every service and reads the key from it under the data key
    # NGC_API_KEY alone, so that realization halts the build while the slot is
    # unattached, or while the credential publishes another data key.
    ngc_api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional NGC API key for authenticating the model-profile download. When attached, the serving container receives it as the NGC_API_KEY environment variable — on Kubernetes read from a Secret by reference, on Docker Compose written into the compose file as delivered, so attach a Compose variable reference such as ${NGC_API_KEY} there to keep the key out of the file. Unattached, the container starts without it. The NIM Operator realization requires it, published under the data key NGC_API_KEY."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. `model` is
      # the deterministic model pointer (a NIM model identifier such as
      # meta/llama-3.1-8b-instruct); the runtime resolves it at pod start.
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Server listen port for the model API. Most operators should omit this and let the Recipe assign the default (8000).
      image:
        type: string
        description: Full reference of the NIM serving image, including its tag — the image the operator is entitled to pull. NIM images are model-specific, so the reference must be the one for the model named in values.model. There is no default, because access to NIM images is governed by NVIDIA's terms rather than by the catalog, and the catalog therefore names none.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of serving replicas on Kubernetes, where each replica holds its own model-cache volume and resolves the model profile independently. The NIM Operator realization gives its service one model-cache claim, so it serves one replica and halts the build on more. Docker Compose runs one instance, and the build reports a replica count there as a setting the target omitted.
      min_replicas:
        type: integer
        min: 1
        description: Lower bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — each Recipe serves a fixed replica count and none emits an autoscaler yet; set it to record the intended lower bound.
      max_replicas:
        type: integer
        min: 1
        description: Upper bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — each Recipe serves a fixed replica count and none emits an autoscaler yet; set it to record the intended upper bound.
      compute:
        cpu:
          type: string
          default: "4"
        memory:
          type: string
          default: 16Gi
      model_cache:
        type: object
        description: Model-profile cache volume. On Kubernetes it is per replica, sized for the resolved profile, and each serving replica gets its own claim of this size and class. On Docker Compose it is one named volume, which the host creates at its own default, since compose has no volume-size or storage-class concept.
        properties:
          size:
            type: string
            default: 50Gi
          class:
            type: string
      model_artifact:
        type: string
        description: Optional OCI reference to the model weights, an alternative weights source to the model id in values.model. A deterministic pointer the runtime resolves at start; the compiler never fetches it. Declared ahead of rendering — each Recipe resolves the model from values.model and none consumes this pointer yet.
      gpu:
        type: object
        description: GPU scheduling for the serving container. NIM is GPU-native, so the serving container always requests at least one GPU; this object tunes the count and selects a GPU runtime class. Requires a GPU-capable cluster and, for runtime_class, a matching RuntimeClass configured in the cluster; on Docker Compose, a host whose NVIDIA GPUs Docker can hand to containers.
        properties:
          count:
            type: integer
            min: 1
            default: 1
            description: Number of GPUs requested for the serving container, delivered as the extended resource nvidia.com/gpu on Kubernetes and as a reservation of that many NVIDIA GPUs on Docker Compose. Defaults to 1 GPU.
          runtime_class:
            type: string
            description: Name of the RuntimeClass selecting the GPU-enabled container runtime (for example nvidia). Omit to use the cluster default runtime. NVIDIA's nim-llm chart offers no runtime-class setting, so the chart realization halts the build while this is set. Docker Compose has no runtime class, and the build reports one set there as a setting the target omitted.
      image_pull_secret:
        type: string
        description: Name of a pre-created Kubernetes image-pull Secret granting access to the NIM container registry. Set this when the NIM image is pulled from a private registry; omit when the cluster can pull it without credentials. On Docker Compose the host pulls with its own registry login, so a Release setting this halts the build there.
      # Read by the chart realization alone; the others pull no chart.
      source_version:
        type: string
        description: Version of NVIDIA's nim-llm chart the `nvidia-nim-chart` realization pulls. Changing it away from that Recipe's default does not guarantee value-mapping compatibility with the new chart. The other realizations pull no chart and ignore it.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that NVIDIA's NIM Operator (its controller and
          its custom-resource definitions) is installed in the target cluster,
          or is declared beside this component as
          core/ai-model/nvidia-nim-operator. The NIMService realization halts
          the build unless this is set true, so a NIMService is never emitted
          as an orphan into a cluster that cannot reconcile it. The synthesis
          and chart realizations ignore this flag.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads;
      # host, port, and protocol expose the raw serving location.
      host:
        type: string
        required: true
        description: >
          Name the inference server is reached at: the in-cluster DNS name of
          the Service fronting it on Kubernetes, and the compose service name on
          Docker Compose. A consumer that composes its own address dials this
          name; one that does not reads `endpoint` instead.
      port:
        type: integer
        required: true
        description: >
          TCP port the server accepts model requests on. It follows the port
          an operator set in the Release, so a consumer reads it rather than
          assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the OpenAI-compatible API the server serves, with
          the host, the port and the API path already composed. A consumer
          hands it to a client library as its base URL.
      model:
        type: string
        required: true
        description: Name a request must ask this server for, which is the model profile it loaded rather than a provider catalogue name.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # Where Prometheus finds the server's own metrics. NIM serves them at
      # /v1/metrics on the port the API is served on, as NVIDIA documents for
      # its LLM images; the image is the one the Release names, and the keys
      # assume it is one of those. Each Recipe publishes exactly one of two
      # shapes and leaves the other empty:
      #   - metrics_endpoint, one address, while infra.replicas is 1, and always
      #     on Docker Compose, which runs one instance;
      #   - metrics_service, metrics_service_port and metrics_path while it is
      #     above 1 on Kubernetes: the Service balances across the replicas, so
      #     one address would reach a single replica per scrape, and a scraper
      #     instead discovers every endpoint behind that Service.
      # None of the keys carries a namespace: a scraper reads where the target
      # runs from its own connection.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this server's metrics at —
          scheme, host, port and path, `http://<host>:<port>/v1/metrics`, on
          the port the API is served on. Empty while infra.replicas is above
          one on Kubernetes, when `metrics_service` is published instead;
          always set on Docker Compose, which runs one instance.
      metrics_service:
        type: string
        description: >
          Name of the Service every replica's metrics sit behind, for a scraper
          that discovers each endpoint of that Service rather than scraping
          one address. Set while infra.replicas is above one on Kubernetes,
          beside `metrics_service_port` and `metrics_path`; empty otherwise, and
          always empty on Docker Compose.
      metrics_service_port:
        type: string
        description: >
          Name of the port of `metrics_service` that carries the metrics:
          `http` on the synthesis, `http-openai` on NVIDIA's chart. Set and
          empty together with `metrics_service`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at, `/v1/metrics`, published beside
          `metrics_service`. Empty where the server publishes
          `metrics_endpoint`, which carries its own path.
