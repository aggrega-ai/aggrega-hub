apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/huggingface
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
spec:
  featuresSchema:
    hf_token:
      required: true
      sensitive: true
      inject: []
      description: Hugging Face access token. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        task: { type: string, enum: [text-generation, text2text-generation, feature-extraction], default: text-generation }
      required: [task]
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint: { type: string, required: true }
      model: { type: string, required: true }
