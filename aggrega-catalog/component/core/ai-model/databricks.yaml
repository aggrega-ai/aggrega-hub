apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/databricks
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/hosting: local
spec:
  secretsSchema:
    databricks_token:
      required: true
      inject: []
      description: Databricks personal access token. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        endpoint_name: { type: string }
      required: [endpoint_name]
