apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/vllm
  version: 1.0.0
  description: >
    vLLM running in-cluster as a self-hosted inference server. A Recipe
    synthesizes the runtime directly: a weights-pull initContainer resolves the
    model pointer into a model-cache volume the serving container mounts, and a
    ClusterIP Service fronts the OpenAI-compatible API. The model value is a
    deterministic pointer resolved at pod start, never fetched at compile time.
    Exports its host, port, endpoint, model, and protocol to consumers via the
    uses topology, so an agent reaches the model without hardcoding an endpoint.

    Each realization also publishes where Prometheus finds the server's
    metrics: one address as `metrics_endpoint`, or, where one address cannot
    reach every replica, the Service or the pod labels a scraper discovers them
    by. On KServe the cluster's serving runtime decides the metrics port and
    path, so nothing is published there. On a cluster running the Prometheus
    Operator, `core/prometheus-exporter` attached to the synthesized Kubernetes
    realization, its port set to `http`, emits a ServiceMonitor for it instead.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: vLLM's OpenAI-compatible server answers at the endpoint
    # published here, under the /v1 path it carries.
    model.aggrega.ai/api: openai
    component.aggrega.ai/hosting: self-hosted
    component.aggrega.ai/upstream-licensing: osi-approved
  annotations:
    # How the server's Prometheus metrics authenticate, which `aggrega lint`
    # reads on a connection that scrapes them. vLLM serves its metrics at
    # /metrics, outside the /v1 path the api_key slot's key guards, so a scrape
    # presents no credential whether or not a key is attached.
    observability.aggrega.ai/metrics-credential: none
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject its own provides keys into
  # the env delivery mechanism.
  inject: [env]
  featuresSchema:
    # Optional model-registry pull credential for gated model weights. When a
    # credential is attached here, the Recipe delivers it to the
    # weights-pull initContainer as an environment variable; when unattached,
    # weights are pulled anonymously, byte-identically to a Recipe with no slot.
    model_pull_token:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional model-registry pull credential for gated model weights. When attached, the weights-pull initContainer receives it as an environment variable; unattached, weights are pulled anonymously."
    # The key the server requires of its callers. When a credential is attached
    # here, every Recipe delivers it to the serving container as VLLM_API_KEY,
    # the variable vLLM reads its key from at startup, and the server then
    # answers a request under /v1 only when its Authorization header carries
    # that key as a bearer token; /health sits outside /v1 and stays open. The
    # server holds one key and compares it exactly, so it cannot tell one
    # caller from another. Unattached, the server checks no key,
    # byte-identically to a Recipe with no slot.
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: "Optional key the server requires of every caller. When attached, the Recipe delivers it as VLLM_API_KEY, the variable vLLM reads at startup, and each request under /v1 must then carry it as a bearer token in the Authorization header. The server checks this one key, so every caller must present the same key. Unattached, the server requires none."
  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate. `model` is
      # the deterministic weights pointer (a Hugging Face model id); the runtime
      # resolves it at pod start.
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        served_model_name: { type: string }
    infra:
      # Operational Sizing — filled by the Operator in the Release. Developer
      # never sees this.
      port:
        type: integer
        min: 1024
        max: 65535
        default: 8000
        description: Server listen port for the model API. Most operators should omit this and let the Recipe assign the default (8000).
      engine_version:
        type: string
        default: "v0.6.3"
        description: vLLM runtime image tag. Selects the image tag on the synthesized serving and weights-pull containers.
      replicas:
        type: integer
        min: 1
        default: 1
        description: Number of serving replicas. Each replica holds its own model-cache volume and pulls the weights independently.
      min_replicas:
        type: integer
        min: 1
        description: Lower bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — the synth recipes serve a fixed replica count and do not yet emit an autoscaler; set it to record the intended lower bound.
      max_replicas:
        type: integer
        min: 1
        description: Upper bound for the replica count when horizontal autoscaling is configured. Declared ahead of rendering — the synth recipes serve a fixed replica count and do not yet emit an autoscaler; set it to record the intended upper bound.
      compute:
        cpu:
          type: string
          default: "2"
        memory:
          type: string
          default: 8Gi
      model_cache:
        type: object
        description: Per-replica model-weights cache volume. Sized for the pulled model; each serving replica gets its own claim.
        properties:
          size:
            type: string
            default: 50Gi
          class:
            type: string
      model_artifact:
        type: string
        description: Optional OCI reference to the model weights, an alternative weights source to the Hugging Face model id in values.model. A deterministic pointer the runtime resolves at pod start; the compiler never fetches it. Declared ahead of rendering — the synth recipes resolve weights from values.model and do not yet consume this pointer.
      control_plane_present:
        type: boolean
        default: false
        description: >
          Operator affirmation that the model-serving control plane (the KServe or
          KubeAI controller and its custom-resource definitions) is installed in the
          target cluster. A controller-driven realization halts the build unless this
          is set true, so a serving custom resource is never emitted as an orphan into
          a cluster that cannot reconcile it. The direct synthesis recipes ignore this
          flag.
      overrides:
        type: object
        additionalProperties: true
        description: Provider-specific overrides. Accepts any nested structure. Each Recipe documents which keys it reads.
      gpu:
        type: object
        description: Optional GPU scheduling for the serving container. When set, the Recipe requests GPUs as the extended resource nvidia.com/gpu and, when a runtime class is named, schedules the pod under it. Requires a GPU-capable cluster and, for runtime_class, a matching RuntimeClass configured in the cluster. Omit the whole object to serve on CPU.
        properties:
          count:
            type: integer
            min: 1
            description: Number of GPUs requested for the serving container, delivered as the extended resource nvidia.com/gpu. Set this to enable GPU serving; omit to serve on CPU.
          runtime_class:
            type: string
            description: Name of the RuntimeClass selecting the GPU-enabled container runtime (for example nvidia). Omit to use the cluster default runtime.
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads;
      # host, port, and protocol expose the raw in-cluster serving location.
      host:
        type: string
        required: true
        description: >
          In-cluster DNS name of the Service fronting the inference server.
          Which Service that is follows the realization the Manifest selected,
          so a consumer reads this rather than deriving a name.
      port:
        type: integer
        required: true
        description: >
          TCP port that Service accepts model requests on. A controller-driven
          realization fronts the server on its own port, so a consumer reads
          this rather than assuming a default.
      endpoint:
        type: string
        required: true
        description: >
          Full base URL of the OpenAI-compatible API the server serves, with
          the host, the port and the API path already composed. A consumer
          hands it to a client library as its base URL.
      model:
        type: string
        required: true
        description: >
          Name a request must ask this server for. It is the served name the
          realization registered, which is not always the weights id the
          Aggregate declared.
      protocol:
        type: string
        description: URL scheme to reach `host` and `port` over, for a consumer composing its own address rather than reading `endpoint`.
      # Where Prometheus finds the server's own metrics. vLLM serves them at
      # /metrics on the port the API is served on, outside the /v1 path the
      # api_key slot's key guards, so a scrape presents no key. A realization
      # publishes exactly one of three shapes and leaves the others empty:
      #   - metrics_endpoint, one address, where one address reaches all of the
      #     server: the Kubernetes synthesis while infra.replicas is 1, and
      #     compose, which runs one instance whatever the replica count says;
      #   - metrics_service, metrics_service_port and metrics_path, where the
      #     synthesis runs more than one replica: its Service balances across
      #     them, so one address would reach a single replica per scrape, and a
      #     scraper instead discovers every endpoint behind that Service;
      #   - metrics_pod_selector, metrics_pod_port and metrics_path on KubeAI,
      #     whose published address is the operator's shared proxy and whose
      #     model pods no Service of this realization carries; the operator
      #     creates them in the Model's namespace, which is the one the Release
      #     names for this component.
      # On KServe the metrics port and path belong to whichever serving runtime
      # the cluster registered for vLLM, which the catalog does not know, so
      # every key is published empty. None of the keys carries a namespace: a
      # scraper reads where the target runs from its own connection.
      metrics_endpoint:
        type: string
        description: >
          The full address Prometheus scrapes this server's metrics at —
          scheme, host, port and path, `http://<host>:<port>/metrics`, on the
          port the API is served on. Empty where one address cannot reach
          every replica, which then publishes the service or pod facts
          instead, and on KServe, which publishes none.
      metrics_service:
        type: string
        description: >
          Name of the Service every replica's metrics sit behind, for a scraper
          that discovers each endpoint of that Service rather than scraping
          one address. Set by the Kubernetes synthesis while infra.replicas is
          above one, beside `metrics_service_port` and `metrics_path`; empty
          otherwise.
      metrics_service_port:
        type: string
        description: >
          Name of the port of `metrics_service` that carries the metrics,
          `http`. Set and empty together with `metrics_service`.
      metrics_pod_selector:
        type: string
        description: >
          Kubernetes label selector matching every pod that serves this
          server's metrics, for a scraper that discovers those pods directly
          because no Service of the realization carries them. Set by the
          KubeAI realization, beside `metrics_pod_port` and `metrics_path`;
          empty otherwise.
      metrics_pod_port:
        type: string
        description: >
          Name of the container port on those pods that carries the metrics,
          `http`. Set and empty together with `metrics_pod_selector`.
      metrics_path:
        type: string
        description: >
          Path the metrics are served at, `/metrics`, published beside the
          service or the pod facts. Empty where the server publishes
          `metrics_endpoint`, which carries its own path.
