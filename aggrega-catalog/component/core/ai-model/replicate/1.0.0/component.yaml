apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/replicate
  version: 1.0.0
  description: >
    Replicate's managed prediction API, reached as an external reference: no
    compute runs in-cluster and the compiler never calls the provider.
    Replicate addresses a specific published build of a model rather than a
    moving name, so beside the model the component exposes the version an
    Aggregate pins to, and whether a prediction is streamed back as it is
    produced or returned once it is complete. Its host is fixed, so the
    realization publishes the endpoint itself and a Release supplies none. The
    API key is the consumer's to attach: the environment-variable name it
    arrives under belongs to the application rather than to the model.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    # Model API: Replicate's own prediction API answers at the host published
    # here. It is not the OpenAI API, so a consumer reaches it through
    # Replicate's client or request shape.
    model.aggrega.ai/api: native
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        version: { type: string }
        stream: { type: boolean, default: false }
      required: [stream]
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the Replicate API. The host is fixed, so the realization
          publishes it and a consumer points its client here without a Release
          supplying anything.
      model:
        type: string
        required: true
        description: >
          Owner-and-name of the model a prediction is created against, carried
          through from the model the Aggregate declared. The pinned build is a
          separate value, so a consumer sends both.
