apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/openai-embedding
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: embedding
    component.aggrega.ai/hosting: managed
spec:
  secretsSchema:
    api_key:
      required: true
      inject: []
      description: OpenAI API key. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        dimensions: { type: integer, exclusiveMinimum: 0 }
    infra:
      # OpenAI's managed API has a fixed host, so the endpoint defaults to it and
      # an operator need not supply one. It is sourced from infra (not hardcoded
      # in the Recipe) so an operator may repoint it at a gateway or proxy.
      endpoint: { type: string, default: "https://api.openai.com" }
