apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/nvidia-nim-operator
  version: 1.0.0
  # No licence identifier is stated. The operator's source is published under
  # Apache-2.0, and NVIDIA's NIM Operator documentation lists its Helm chart
  # and its container, the artifacts a Release runs, under the NVIDIA AI
  # Enterprise Software License Agreement, which no single identifier names.
  # Its install page lists as a prerequisite "An active subscription to an
  # NVIDIA AI Enterprise product or be an NVIDIA Developer Program member."
  description: >
    NVIDIA's NIM Operator, declared as an explicit component so the
    `NIMService` realization of `core/ai-model/nvidia-nim` can ship its
    runtime prerequisite in the same Aggregate rather than assuming an ambient
    install. The control plane is the operator that reconciles NIMService
    custom resources into running NIM servers. Declare this component beside
    the NIM model and affirm the prerequisite on the model with
    `infra.control_plane_present` in the Release.

    Using it needs an NVIDIA account and an NGC API key, under NVIDIA's
    licence terms: NVIDIA publishes the operator's chart and image on its own
    registries, and every NIM server it runs pulls a NIM image the reader
    must be entitled to pull.

    The cluster must already run NVIDIA's GPU Operator, which NVIDIA names as
    the operator's prerequisite; the catalog does not install it and no build
    checks for it.

    Realized on Kubernetes by `helm/nvidia-nim-operator`, which renders
    NVIDIA's own `k8s-nim-operator` chart, its custom-resource definitions and
    roles included; its chart repository must be reachable from the build. The
    chart names its roles and accounts itself, so one installation runs per
    cluster, and the operator watches every namespace.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
    # The terms covering the artifacts a Release runs: NVIDIA's NIM Operator
    # documentation lists the chart and the container under NVIDIA's own
    # licence agreement, while their source is Apache-2.0.
    component.aggrega.ai/upstream-licensing: proprietary
    # No model.aggrega.ai/api label: it serves no model. A gateway whose models
    # socket selects the ai-model category alone admits it at selection, and
    # the gateway's own check then halts the build naming the missing label.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      # Operator container image the control-plane Deployment runs. The default
      # is the image NVIDIA's 3.1.2 chart names, the chart release the Recipe
      # defaults to, so the chart and the operator run one release. Read by the
      # chart realization, the only one.
      image:
        type: string
        default: "nvcr.io/nvidia/cloud-native/k8s-nim-operator:v3.1.2"
        description: NIM Operator image the control-plane Deployment runs. Pinned to a published release tag so the rendered workload names one version; a Release pulling from its own registry mirror sets this to that reference instead, tag or digest included.
      # Read by the chart realization, the only one.
      source_version:
        type: string
        description: Version of NVIDIA's k8s-nim-operator chart the `nvidia-nim-operator` realization pulls. Its default is the release whose application version is the tag of the image default above; changing it away from that default does not guarantee value-mapping compatibility with the new chart, and the image follows it only where it is set too.
