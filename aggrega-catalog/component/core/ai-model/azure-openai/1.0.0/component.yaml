apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/azure-openai
  version: 1.0.0
  description: >
    Azure OpenAI's managed chat API. Its host belongs to the Azure OpenAI
    resource an organisation runs rather than to the provider, and a model is
    addressed by the deployment name given to it inside that resource rather
    than by the model's own name — both of which this component exposes,
    together with the API version a request is made against. Consumers read
    the endpoint and the model name over a `uses` edge, the contract every
    model here publishes, so an application moved onto this provider reads
    the same two keys it read before. The API key is the consumer's to attach:
    the environment-variable name it arrives under belongs to the application
    rather than to the model.

    The helm and compose realizations reference a resource that already
    exists: no compute runs, the compiler never calls the provider, and the
    Release supplies the endpoint in infra.endpoint. terraform/azure-openai
    creates the resource and the model deployment in the resource group,
    region and subdomain the Release names in infra.overrides, and
    publishes the endpoint composed from that subdomain. Reach for a
    reference where the resource exists outside the Release; reach for
    terraform where the Release is to create it.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: Azure OpenAI's own API answers at the resource endpoint
    # published here. It addresses a model by its deployment name and each
    # request by an API version, so a consumer reaches it through an Azure
    # OpenAI client rather than by handing the endpoint to a plain OpenAI one.
    model.aggrega.ai/api: native
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      # model is the model's own name, which the terraform realization deploys;
      # deployment_name is the name of the model deployment serving it, which
      # every realization publishes as provides.model because a request
      # addresses it. The reference realizations read deployment_name alone,
      # since the model deployment already exists in the resource.
      properties:
        deployment_name: { type: string }
        api_version: { type: string, default: "2024-02-15-preview" }
      required: [deployment_name, api_version]
    infra:
      # The Azure OpenAI resource host is per-resource (https://<resource>.openai.
      # azure.com), so the endpoint is operator-supplied rather than a fixed host.
      # The helm and compose realizations read it; the terraform realization
      # composes it from the subdomain of the resource it creates and refuses
      # this key.
      endpoint: { type: string }
      # Provider-specific overrides. Accepts any nested structure.
      # Each Recipe documents which keys it reads: the terraform realization
      # reads where it creates the resource and how it deploys the model; the
      # helm and compose realizations read none.
      overrides:
        type: object
        additionalProperties: true
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the Azure OpenAI resource a consumer sends chat requests
          to. The host belongs to the resource, so the Release supplies it where
          the resource already exists, and the terraform realization composes
          it from the subdomain of the resource it creates.
      model:
        type: string
        required: true
        description: >
          The name a request addresses, which on this provider is the
          deployment name given to a model inside the resource rather than the
          model's own name. A consumer sends it where it would otherwise send
          a model name.
