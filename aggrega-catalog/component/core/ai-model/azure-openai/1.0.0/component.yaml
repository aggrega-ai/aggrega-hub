apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/azure-openai
  version: 1.0.0
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
spec:
  secretsSchema:
    api_key:
      required: true
      inject: []
      description: Azure OpenAI API key. Recipe controls delivery (Black-Box).
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        deployment_name: { type: string }
        api_version: { type: string, default: "2024-02-15-preview" }
      required: [deployment_name, api_version]
    infra:
      # The Azure OpenAI resource host is per-resource (https://<resource>.openai.
      # azure.com), so the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
