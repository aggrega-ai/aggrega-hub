apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/azure-openai
  version: 1.0.0
  description: >
    Azure OpenAI's managed chat API, reached as an external reference: no
    compute runs in-cluster and the compiler never calls the provider. Its
    host belongs to the resource an organisation provisions rather than to the
    provider, so the endpoint is operator-supplied in the Release, and a model
    is addressed by the deployment name given to it inside that resource
    rather than by the model's own name — both of which this component
    exposes, together with the API version a request is made against.
    Consumers read the endpoint and the model name over a `uses` edge, the
    contract every model here publishes, so an application moved onto this
    provider reads the same two keys it read before. The API key is the
    consumer's to attach: the environment-variable name it arrives under
    belongs to the application rather than to the model.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: Azure OpenAI's own API answers at the resource endpoint
    # published here. It addresses a model by its deployment name and each
    # request by an API version, so a consumer reaches it through an Azure
    # OpenAI client rather than by handing the endpoint to a plain OpenAI one.
    model.aggrega.ai/api: native
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        deployment_name: { type: string }
        api_version: { type: string, default: "2024-02-15-preview" }
      required: [deployment_name, api_version]
    infra:
      # The Azure OpenAI resource host is per-resource (https://<resource>.openai.
      # azure.com), so the endpoint is operator-supplied rather than a fixed host.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the Azure OpenAI resource a consumer sends chat requests
          to. The host belongs to the resource an organisation provisioned, so
          the Release supplies it.
      model:
        type: string
        required: true
        description: >
          The name a request addresses, which on this provider is the
          deployment name given to a model inside the resource rather than the
          model's own name. A consumer sends it where it would otherwise send
          a model name.
