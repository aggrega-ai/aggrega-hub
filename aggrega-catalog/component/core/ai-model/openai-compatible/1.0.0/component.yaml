apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/openai-compatible
  version: 1.0.0
  description: >
    A broker speaking the OpenAI API, reached as an external reference: no
    compute runs in-cluster, and what answers behind the endpoint is whatever
    a Release points it at — a proxy running in the cluster, a gateway, or any
    service serving that API. It is the component to reach for when an
    application should not name a provider at all: the endpoint is
    operator-supplied in the Release and the model is an alias the broker
    resolves, so which provider actually answers can change with neither the
    Aggregate nor the application changing. The provider name it carries
    records which broker sits behind it, for a reader and for a selector to
    match on rather than for the compiler, which pipes the strings and reads
    neither. Consumers read the endpoint and the model name over a `uses`
    edge, the contract every model here publishes.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Optional API key for the broker gateway: a managed or authenticated gateway
  # attaches one; a no-auth self-hosted gateway attaches none. Transparent slot
  # so it may be delivered as an env var.
  featuresSchema:
    api_key:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject: [env]
      description: Optional broker API key delivered to consumers as an env var.
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
      properties:
        provider_name: { type: string }
      required: [provider_name]
    infra:
      # The broker gateway's own endpoint. Unlike a per-provider model with a
      # fixed managed host, a broker endpoint is deployment-specific (the gateway
      # the deployment routes through), so it is operator-supplied.
      endpoint: { type: string }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL a consumer sends requests to. What answers behind it is
          whatever the Release points at, so an application reads this instead
          of naming a provider.
      model:
        type: string
        required: true
        description: >
          Name a request asks the broker for. It is an alias the broker
          resolves, so which provider serves it can change without the
          consumer changing.
      provider:
        type: string
        required: true
        description: >
          Name of the broker answering behind the endpoint. A consumer reads it
          to record or label which service its requests reached, since the
          endpoint alone does not say.
