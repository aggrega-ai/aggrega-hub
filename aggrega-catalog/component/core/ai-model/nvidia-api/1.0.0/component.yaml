apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/nvidia-api
  version: 1.0.0
  description: >
    The managed NVIDIA API (integrate.api.nvidia.com) generative model endpoint,
    realized as an external reference (no in-cluster compute). Distinct from the
    self-hosted NVIDIA Inference Microservice component: this consumes NVIDIA's
    hosted, OpenAI-compatible API rather than running an inference server.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: NVIDIA's hosted, OpenAI-compatible API answers at the endpoint
    # published here.
    model.aggrega.ai/api: openai
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # The managed NVIDIA API has a fixed address, so the endpoint defaults to
      # it and an operator need not supply one. The default is the base URL
      # NVIDIA documents for its hosted, OpenAI-compatible API, version path
      # included, which is what an OpenAI client takes as its base URL: the
      # client appends only the route, such as /chat/completions, so an address
      # without the version path would be posted to at the wrong path. It is
      # sourced from infra (not hardcoded in the Recipe) so an operator may
      # repoint it at a gateway or proxy.
      endpoint: { type: string, default: "https://integrate.api.nvidia.com/v1" }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the hosted NVIDIA API a consumer sends requests to,
          version path included, so a client appends only the route. It
          follows the endpoint set in the Release, so an operator may point it
          at a different host without the application changing.
      model:
        type: string
        required: true
        description: >
          Name of the hosted model a request asks for, carried through from
          the model the Aggregate declared. The API is OpenAI-compatible, so a
          consumer sends it as the model field.
