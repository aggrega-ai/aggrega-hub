apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/ai-model/nvidia-api
  version: 1.0.0
  description: >
    The managed NVIDIA API (integrate.api.nvidia.com) generative model endpoint,
    realized as an external reference (no in-cluster compute). Distinct from the
    self-hosted NVIDIA Inference Microservice component: this consumes NVIDIA's
    hosted, OpenAI-compatible API rather than running an inference server.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    infra:
      # The managed NVIDIA API has a fixed host, so the endpoint defaults to it
      # and an operator need not supply one. It is sourced from infra (not
      # hardcoded in the Recipe) so an operator may repoint it at a gateway or
      # proxy.
      endpoint: { type: string, default: "https://integrate.api.nvidia.com" }
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint: { type: string, required: true }
      model: { type: string, required: true }
