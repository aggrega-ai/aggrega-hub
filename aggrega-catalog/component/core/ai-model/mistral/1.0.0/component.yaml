apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/mistral
  version: 1.0.0
  description: >
    Mistral AI's managed chat API, reached as an external reference: no
    compute runs in-cluster and the compiler never calls the provider. Its
    host is fixed, so the realization publishes the endpoint itself and a
    Release supplies none — declaring the component and choosing a model is
    the whole of what an Aggregate writes. Consumers read that endpoint and
    the model name over a `uses` edge, the contract every model here
    publishes, so moving an application onto this provider is a change of
    component type and nothing else. The API key is the consumer's to attach:
    the environment-variable name it arrives under belongs to the application
    rather than to the model.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: ai-model
    model.aggrega.ai/capability: generative
    # Model API: Mistral AI's own API answers at the host published here, and a
    # consumer reaches it through Mistral's client or request shape rather
    # than by handing that host to an OpenAI client.
    model.aggrega.ai/api: native
    component.aggrega.ai/hosting: managed
    component.aggrega.ai/upstream-licensing: proprietary
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      $ref: "BaseComponents#/schemas/BaseModelParameter"
    provides:
      # Public API Contract — keys exported to consumers via uses topology edges.
      # endpoint and model are the family contract an ai-agent consumer reads.
      endpoint:
        type: string
        required: true
        description: >
          Base URL of the Mistral API. The host is fixed, so the realization
          publishes it and a consumer points its client here without a Release
          supplying anything.
      model:
        type: string
        required: true
        description: Name of the Mistral model a request asks for, carried through from the model the Aggregate declared.
