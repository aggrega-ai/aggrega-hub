apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/gateway/nginx-reviewed
  version: 1.0.0
  description: >
    An NGINX gateway in the shape an organization's own architecture review
    settled on, published once so every team deploys that shape instead of
    restating it. It extends core/gateway/nginx and adds only what the review
    produced: the reviewed-tier identity a selector can discriminate on, the
    data zone the review covers, who to ask about it, and one extra topology
    socket whose selector admits only components carrying the same reviewed-tier
    label. Its contract — values, infra and provides — is the base's, inherited
    exactly as the base authored it, so every Recipe written for
    core/gateway/nginx serves this component unchanged and it needs no Recipe of
    its own. Consuming it takes one Manifest mapping line and
    nothing else.
  labels:
    # The operational type and the cognitive category are the base's values,
    # restated here: every Component document declares
    # component.aggrega.ai/type, and the category mirrors this entity's
    # directory segment. The structural inheritance this wrapper demonstrates is
    # visible instead on the pieces it never mentions — the base's `upstream`
    # socket, its self-inject allowlist, and its three data pillars.
    component.aggrega.ai/type: server
    component.aggrega.ai/category: gateway
    # Added here: the reviewed-tier identity a selector discriminates on, and
    # the data zone the review covers. Both are opaque metadata — the compiler
    # reads neither value; a selector matches on them and a policy may read them.
    gateway.example.com/audit-tier: reviewed
    gateway.example.com/data-zone: eu-west
  annotations:
    # Added here: which body settled the shape, and who to ask about it.
    governance.example.com/review-board: platform-architecture
    governance.example.com/contact: platform-architecture@example.com
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  extends: core/gateway/nginx:1.0.0

  # The three data pillars are the base's, inherited exactly as
  # core/gateway/nginx authored them. A Component that extends another writes
  # this marker and authors no pillar content of its own, so the base and
  # everything extending it validate against one contract.
  schema: inherited

  usesSchema:
    # Added here. The base's `upstream` socket admits any server; this one
    # admits only a component carrying the reviewed-tier label above, so an edge
    # wired into it cannot leave the reviewed tier. The base's socket is
    # inherited alongside this one — extending adds a socket rather than
    # replacing the set.
    reviewed_upstream:
      selector: "gateway.example.com/audit-tier=reviewed"
      inject: [env]
