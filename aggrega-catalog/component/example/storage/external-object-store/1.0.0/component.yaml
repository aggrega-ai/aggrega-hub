apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/storage/external-object-store
  version: 1.0.0
  description: >
    An object-storage bucket operated outside this deployment, reached with a
    static access-key pair. The deployment provisions nothing: it records which
    bucket it uses and holds the credential it presents. Because the bucket's
    operator is not a cloud API this deployment talks to, there is no managed
    secret to delegate the credential to, so the secret half of the key pair is
    supplied as a value and declared sensitive here. That declaration is what a
    Terraform realization turns into the engine's own sensitivity attribute on
    the matching module input.
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/category: storage
    component.aggrega.ai/hosting: external
    component.aggrega.ai/upstream-licensing: not-applicable
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  schema:
    # values — Developer Intent
    #
    # The three leaves are deliberately a mix: two carry public identifiers and
    # one carries secret material. Only the third declares `sensitive: true`, so
    # a reader can see which rendered inputs a marking reaches and which it
    # leaves alone.
    values:
      bucket:
        type: string
        required: true
        description: >
          Name of the externally-operated bucket this deployment reads and
          writes. A bucket name is public: it appears in URLs and in logs.
      access_key_id:
        type: string
        required: true
        description: >
          Identifier of the access-key pair. It names the credential rather than
          being it, so it is not declared sensitive — the same distinction a
          secret's name and data key carry.
      secret_access_key:
        type: string
        required: true
        sensitive: true
        description: >
          Secret half of the access-key pair. This is the credential material,
          so it is declared sensitive: a target that offers a native sensitivity
          primitive renders it on this input, and the surfaces a developer reads
          while debugging withhold it.

    # infra — Operational Sizing
    # Filled by Ops in the Release.
    infra:
      endpoint:
        type: string
        default: "https://objects.example.net"
        description: >
          Base URL of the storage service. It is sourced from infra rather than
          fixed in the Recipe so an operator may repoint the deployment at a
          different endpoint per environment.

    # provides — Public API Contract
    # Keys exported to consumers via `uses` topology edges.
    provides:
      bucket:
        type: string
        description: Name of the bucket a consumer reads and writes.
      endpoint:
        type: string
        description: Base URL a consumer addresses the bucket through.
