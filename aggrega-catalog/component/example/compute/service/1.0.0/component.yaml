apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/service
  version: "1.0.0"
  description: >
    A generic HTTP service exposing an application port and a named `metrics`
    port. Components of this type must be monitored: the requiredType annotation
    below states that every instance carries an attachment of the exporter
    Feature, satisfied here by the monitoring annotation the Operator sets rather
    than by a per-component features: block.
  labels:
    component.aggrega.ai/type: "server"
    component.aggrega.ai/category: compute
  annotations:
    # A presence mandate: every instance of this type must carry at least one
    # attachment of core/prometheus-exporter, at any scope. The `monitoring`
    # suffix names the requirement in the diagnostic an unmet mandate produces;
    # it is not a slot name and nothing dereferences it.
    features.aggrega.ai/requiredType.monitoring: core/prometheus-exporter
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    infra:
      image:
        type: string
        default: "nginx:alpine"
        description: Container image for the demo service.
