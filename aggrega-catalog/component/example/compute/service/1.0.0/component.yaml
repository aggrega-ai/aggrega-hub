apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: example/compute/service
  version: "1.0.0"
  description: >
    A generic HTTP service exposing an application port and a named `metrics`
    port. Components of this type are monitored by attaching core/scrape-target
    (here, via the monitoring annotation rather than a per-component features: block).
  labels:
    component.aggrega.ai/type: "server"
    component.aggrega.ai/category: compute
spec:
  schema:
    infra:
      image:
        type: string
        default: "nginx:alpine"
        description: Container image for the demo service.
