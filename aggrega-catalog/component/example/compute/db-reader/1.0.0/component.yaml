apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/db-reader
  version: 1.0.0
  description: >
    A minimal application that consumes a database connection. It declares a
    `database` uses-socket for any stateful-server datastore and injects the
    matched database's published host onto its injection context. Its Recipe
    stores that host as a whole-scalar value, so a CloudFormation Recipe can
    receive the database endpoint as an intrinsic reference — an intra-stack
    Fn::GetAtt when the database assembles into the same stack, or a cross-stack
    import when the database assembles into another stack.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  # Self-inject allowlist: the component may inject resolved uses-edge
  # values into the env delivery mechanism.
  inject: [env]

  usesSchema:
    database:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: [env]

  schema:
    values:
      # Developer Intent — filled by the Developer in the Aggregate.
      parameter_name:
        type: string
        default: /app/db-host
        description: Name of the parameter the application stores the database host under.
    infra:
      # Operational Sizing — filled by the Operator in the Release.
      tier:
        type: string
        default: Standard
        description: Parameter store tier.
