apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/greeter
  version: 1.0.0
  description: >
    A trivial HTTP greeter service. It exists to demonstrate one capability:
    the Manifest per-instance recipe override. Two instances of this single
    component type can resolve to two different Recipes — the developer authors
    identical intent for both, and Ops decides per instance which physical
    implementation each gets.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  schema:
    values:
      message:
        type: string
        default: "hello"
        description: Greeting text the service announces.
    infra:
      port:
        type: integer
        default: 8080
        description: Container HTTP port.
