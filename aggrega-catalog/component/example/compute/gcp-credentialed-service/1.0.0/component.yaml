apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/compute/gcp-credentialed-service
  version: 1.0.0
  description: >
    A service that authenticates to Google Cloud with a static service-account
    JSON key delivered as a mounted file. It declares a `gcp_key` secret slot
    whose attached credential materializes as a referenceable Secret; the Recipe
    mounts that Secret as a file and points GOOGLE_APPLICATION_CREDENTIALS at the
    mounted path, the location the Google client libraries read the key from. The
    credential is supplied by attaching a referenceable-secret to the slot, so
    the key material is never authored on the component and the same slot works
    with any secret backend the target maps it to.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: compute
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  featuresSchema:
    gcp_key:
      required: true
      # File delivery: the slot allowlists the `as: file` mount the Recipe's
      # workload performs. The attached referenceable-secret publishes the
      # Secret's locator; the whole Secret mounts at the Recipe's path and the
      # secret's data key becomes the credential file name.
      sensitive: true
      inject: [file]
      description: >
        The Google Cloud service-account JSON key, materialized as a
        referenceable Secret and mounted as a file into the container.
  schema:
    infra:
      image:
        type: string
        default: "google/cloud-sdk:slim"
        description: Container image for the service.
