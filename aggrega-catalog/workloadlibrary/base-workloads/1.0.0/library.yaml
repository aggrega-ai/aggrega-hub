apiVersion: aggrega.ai/v1beta1
kind: WorkloadLibrary
metadata:
  name: BaseWorkloads
  version: 1.0.0
  description: |
    Reusable Workload template fragments shared across recipes that synthesize
    provider-native manifests from a Workload body. A recipe consumes an entry
    with `workload: { $import: BaseWorkloads#/workloads/<Entry> }`; the version
    is supplied by the per-Release lockfile and no registry host enters the
    reference. Each entry is a Go template evaluated in the consuming recipe's
    render context (.values, .infra, .features), so a single authored shape
    serves every recipe that imports it.
spec:
  workloads:
    # StatelessService is the canonical stateless HTTP service shape: a single
    # main container, a configurable replica count and port, and CPU/memory
    # requests+limits sourced from the recipe's infra. Recipes that only differ
    # in image and values import this instead of restating the whole body.
    #
    # The compute block is read through a hoisted `$compute`, because `default`
    # falls back for a missing *leaf* and not for a missing *parent*: a consuming
    # component that declares no `infra.compute` at all leaves the parent absent,
    # and reading `.infra.compute.cpu` off it halts before the fallback is
    # reached. `optional .infra "compute" dict` yields an empty block in that
    # case, so each leaf's declared fallback applies as written. The replica
    # count and the port need no such hoist — they sit directly under `infra`,
    # with no intermediate block that can be absent.
    #
    # The replica count and the port are read with `optional`, which falls back
    # only when the key is absent and otherwise renders what was authored.
    # `default` would also replace an authored zero, so a Release scaling the
    # service to zero with `replicas: 0` would render one replica.
    StatelessService: |
      apiVersion: aggrega.ai/v1beta1
      kind: Workload
      {{- $compute := optional .infra "compute" dict }}
      replicas: {{ optional .infra "replicas" 1 }}
      containers:
        main:
          image: "{{ .values.image }}"
          ports:
            http: {{ optional .infra "port" 8080 }}
          resources:
            requests:
              cpu: "{{ $compute.cpu | default "100m" }}"
              memory: "{{ $compute.memory | default "128Mi" }}"
            limits:
              cpu: "{{ $compute.cpu | default "100m" }}"
              memory: "{{ $compute.memory | default "128Mi" }}"
      services:
        svc:
          type: ClusterIP
          ports:
            http: {{ optional .infra "port" 8080 }}
