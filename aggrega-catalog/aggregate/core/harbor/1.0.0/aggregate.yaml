apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/harbor
  version: 1.0.0
  description: >
    A self-contained container-registry stack packaged as a reusable module. It
    composes six single-workload components — a Harbor core (the API and
    token-service control plane), a distribution registry (the OCI blob store), a
    portal (the static web UI), a job service (the asynchronous worker tier), a
    PostgreSQL backend, and a Redis-compatible cache — wired by internal edges:
    the core reaches the backend, cache, registry, job service, and portal; the
    registry and the job service reach the cache; and the job service reaches the
    core. Each edge carries the target's in-cluster host and port (and, for the
    backend, its user and database) into the consumer, which composes them into
    connection strings and service URLs. The compiler routes the strings without
    interpreting them.

    The core is the sole token issuer and validator: it holds the RSA signing
    key and basic-authenticates to the registry, whose own authentication is a
    bundled htpasswd file. The whole stack shares one set of pinned development
    credentials — the backend password, the registry basic-auth pair, the
    internal service secrets, the attribute encryption key, and the admin
    password — so it runs self-contained with no external secret. These defaults
    are for evaluation and local development; a production deployment overrides
    them with real credentials.

    This module is the working-registry core. Several Harbor subsystems are
    deliberately out of scope: the registry controller and scheduled
    garbage-collection, vulnerability scanning, and the metrics exporter are not
    included, so garbage collection is a documented non-function of this module.
    The module also ships no internal reverse proxy; a single external endpoint
    is assembled at the ingress tier, which routes the browser path `/` to the
    portal and the registry and API paths (`/v2/`, `/api/`, `/service/`, `/c/`)
    to the core. The module exports the core as `registry`, the endpoint image
    clients and the API talk to, and the portal as `ui`, the web endpoint.
spec:
  components:
    db:
      type: core/datastore/postgres
      values:
        user: harbor
        database: registry
    cache:
      type: core/datastore/valkey
    core:
      type: core/devtool/harbor-core
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: POSTGRESQL_HOST, from: host }
                - { in: POSTGRESQL_PORT, from: port }
                - { in: POSTGRESQL_USERNAME, from: user }
                - { in: POSTGRESQL_DATABASE, from: database }
        cache:
          redis:
            target: cache
            values:
              db_index: 0
            inject:
              env:
                - { in: HARBOR_REDIS_HOST, from: host }
                - { in: HARBOR_REDIS_PORT, from: port }
        registry:
          reg:
            target: registry
            inject:
              env:
                - { in: HARBOR_REGISTRY_HOST, from: host }
                - { in: HARBOR_REGISTRY_PORT, from: port }
        jobservice:
          jobsvc:
            target: jobservice
            inject:
              env:
                - { in: HARBOR_JOBSERVICE_HOST, from: host }
                - { in: HARBOR_JOBSERVICE_PORT, from: port }
        portal:
          ui:
            target: portal
            inject:
              env:
                - { in: HARBOR_PORTAL_HOST, from: host }
                - { in: HARBOR_PORTAL_PORT, from: port }
    registry:
      type: core/devtool/harbor-registry
      uses:
        cache:
          redis:
            target: cache
            values:
              db_index: 1
            inject:
              env:
                - { in: HARBOR_REDIS_HOST, from: host }
                - { in: HARBOR_REDIS_PORT, from: port }
    jobservice:
      type: core/devtool/harbor-jobservice
      uses:
        cache:
          redis:
            target: cache
            values:
              db_index: 2
              key_namespace: harbor_job_service_namespace
            inject:
              env:
                - { in: HARBOR_REDIS_HOST, from: host }
                - { in: HARBOR_REDIS_PORT, from: port }
        core:
          core:
            target: core
            inject:
              env:
                - { in: HARBOR_CORE_HOST, from: host }
                - { in: HARBOR_CORE_PORT, from: port }
    portal:
      type: core/devtool/harbor-portal
  exportedComponents:
    registry: core
    ui: portal
