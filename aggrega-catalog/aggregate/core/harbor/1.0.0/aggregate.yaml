apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/harbor
  version: 1.0.0
  description: >
    A Harbor container registry packaged as a reusable module. It composes one
    component, `core/devtool/harbor`, which describes the registry as a whole:
    the API and token-service control plane, the OCI blob store and its
    controller, the web console, the asynchronous worker tier, the vulnerability
    scanner, the relational backend, the key-value cache, and the reverse proxy
    that fronts them. Those services are parts of one unit rather than separate
    components, so the module declares no edges of its own and needs nothing
    declared beside it.

    A single in-cluster address fronts the whole registry. The reverse proxy
    behind it routes the console path to the web console and the registry and
    API paths to the control plane, so a container client logs in, pushes and
    pulls against the same host a browser reaches the console on. The module
    exports that one address under both of its public names — `registry`, the
    endpoint image clients and the API talk to, and `ui`, the web endpoint — so a
    consumer wires to whichever name describes its intent and reaches the address
    that serves both.

    The module's component is addressed as `registry`, so an operator sizing it
    from a Release names the module-scoped id `<module-instance>.registry` and
    sets `infra` there: the port the published address accepts traffic on, the
    image tag every one of the registry's services runs at, the control plane's
    compute, and the size and storage class of the volume holding image layers
    and manifests. The component's own schema defaults cover every one of them,
    so a Release that sets none of them still renders.

    Every credential the registry needs has a value and every one of them can be
    replaced. Those the running software can be pointed at a secret for — the
    administrator account, the cross-site-request-forgery key, the worker tier's
    shared secret, and the blob store's upload-state secret — are credential
    slots on the component, filled from the credential subsystem when a Release
    attaches one, so the material never reaches the rendered output. The rest are
    operational settings a Release sets on the component's `infra`. Unattached
    and unset, each takes a development value stated in the Recipe, so the module
    runs self-contained for evaluation and local development. Those values are
    shared and published in this catalog: a Release serving real traffic replaces
    them.
spec:
  components:
    registry:
      type: core/devtool/harbor
  exportedComponents:
    registry: registry
    ui: registry
