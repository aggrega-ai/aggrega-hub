apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/agenta
  version: 1.0.0
  description: >
    A self-contained Agenta installation packaged as a reusable module — the
    workspace in which a team builds agents that do work, by describing the job
    in chat, connecting the applications the agent needs, setting what it may do
    on its own, and correcting it through feedback. It composes fourteen
    single-workload components: a control-plane API, a model-facing service, an
    agent runner, a browser console, a small-screen front end, a stream-consuming
    worker, a queue-consuming worker, a scheduler, a schema-migration step, a
    PostgreSQL backend, two Redis-compatible instances, an S3-compatible object
    store, and the authentication core the platform holds its accounts in.

    Two of those are worth naming against the other things a team might reach
    for. This module is not a trace store: `core/observability/langfuse`, in the
    catalogue's observability category, is the self-hosted platform whose
    identity is tracing and evaluating what a language-model application did,
    and an Aggregate that wants that and only that wires there. Nor is it a
    prompt registry: `core/devtool/promptlayer`, in the devtool category, is the
    hosted registry whose identity is authoring and versioning prompts an
    application fetches at run time, and an Aggregate that wants that wires
    there. This module is where an agent itself is built, configured and run —
    it records traces and runs evaluations of its own, as material for improving
    an agent, rather than as the product it offers. All three are worth having
    for different reasons, and an Aggregate may wire more than one.

    The relational edges are what make the platform stateful. Six components
    reach the backend — the API, the model-facing service, both workers, the
    scheduler and the migration step — and each edge carries the backend's
    in-cluster host and port along with its user, and names two databases on the
    edge itself: one for the platform's own model, one for the traces it
    records. Naming them on the edge rather than in the backend's own values is
    what lets one server hold both without either name being fixed in a
    component. The migration step is the one that creates their tables; the
    other five expect them to exist, which is why the module sequences it
    first. The backend's own initialization creates all three databases the
    module needs, including the authentication core's.

    The two cache-family edges are separate on purpose. Five components reach
    the volatile instance for sessions, cached reads and rate-limit counters,
    and five reach the durable instance, which is where work is put and taken:
    the API, the model-facing service and the scheduler write to it, and the two
    worker tiers read from it. They are two instances of one component rather
    than two components, because it is one engine deployed twice with different
    durability, and keeping them apart means a discardable cache can be sized,
    evicted and lost without touching queued work.

    The authentication edge is the one the platform cannot start without. Four
    components — the API, the model-facing service and both front ends — reach
    `core/security/supertokens` and each carries that core's own base URL, not a
    protocol endpoint: the platform addresses the core by its URI rather than
    speaking OpenID Connect to it, so an identity provider is not a substitute
    here. The core keeps its own accounts in a database on the same backend the
    rest of the module uses.

    The object-store edges hold what agents produce. The API, the model-facing
    service and the object store are wired so that files written during a run
    are kept in a bucket named on each edge, which is what lets an agent's
    working directory survive the sandbox it ran in being torn down.

    The runner is the isolation boundary, and the module's shape reflects that.
    The model-facing service hands a run to it, and it starts the agent's
    harness as a process inside its own sandbox. It is wired to the API alone —
    no backend, no cache, no queue, no object store — because a locally
    sandboxed harness shares that container and can read its environment, so the
    platform's database password, its encryption key and the object store's keys
    are kept out of the one place an agent's own code could read them. That is a
    property of this topology rather than of any single component, and widening
    the runner's wiring removes it.

    Seven credentials hold the platform together, and each is a module parameter
    an importing Aggregate passes down: `db_password`, the password the backend
    is initialized with and every component reaching it authenticates with;
    `auth_key`, the key the platform signs its own internal tokens with;
    `crypt_key`, the key stored model-provider credentials are encrypted under;
    `services_internal_key`, the key the two API tiers and the queue-consuming
    worker present to each other; `runner_token`, the token the runner requires
    on every call; `store_secret_key`, the object store's root password, which
    the two API tiers present as their secret key; and `auth_core_api_key`, the
    key the authentication core requires of every caller. Each reaches every
    component that holds it through that component's own credential slot, so it
    is authored once and cannot drift between the components that must agree on
    it. The module attaches the `core/referenced-secret` Feature on each of those
    slots, so every workload carries a reference to a Secret rather than the
    value itself, and the Manifest of every Release whose Aggregate imports the
    module maps `core/referenced-secret`, or the build halts. The realization that
    mapping binds decides what the parameters mean: `k8s-secret-from-parameter`
    reads each as the credential itself and emits a Secret carrying it, while
    `k8s-existing-secret` reads each as the name of a Secret that already exists
    in the namespace, holding the credential under the data key its parameter's
    description names — one Secret may carry all seven. Every parameter carries a
    pinned default so the module renders self-contained. The defaults are
    development credentials every reader of this catalog holds, so they are for
    evaluation and local development. A Release carrying real traffic supplies
    its own through the importing Aggregate, which declares parameters of its own
    and passes them down through its `aggregates` entry for the Release to
    fulfill. While the runner's token is at its default, anything that can reach
    the runner can start an agent run.

    Attaching the authentication core's key changes what the core accepts. The
    core issues no key of its own and, with none attached, answers every caller
    that can reach it; this module attaches one, so the core refuses any call
    that does not present `auth_core_api_key`, and the API, the model-facing
    service and both front ends present it. The core also refuses to start on a
    key shorter than 20 characters or carrying anything but letters, digits, `=`
    and `-`. The default meets that rule and is still the one every reader
    holds, so it too is for evaluation.

    Three credentials are left unattached, each for a reason the module cannot
    work around. The volatile and the durable Redis-compatible instances both
    run without authentication: filling their credential slot switches
    authentication on, and none of the five components reaching either declares
    a slot to present a password, so every one of them would be refused. And the
    object store's access key stays its development value, the store's root user
    `admin`: the two API tiers take it through a credential slot, but the store
    takes it as a plain value, so one parameter would mean the name of a Secret
    on one side and the literal key on the other.

    Because the module fills the backend's credential slot, the backend is
    realized by a Recipe that reads that slot. `postgres-cloudnative-pg`, whose
    controller owns the database's credentials itself, halts the build when the
    slot is filled, so a Manifest importing this module maps the backend to
    another PostgreSQL realization.

    This module is the working platform core, and four parts of a full
    deployment are deliberately out of scope. It ships no internal reverse
    proxy: a single external endpoint is assembled at the ingress tier, which
    routes `/api` to the control-plane API, `/services` to the model-facing
    service, `/m` to the small-screen front end, and `/` to the console. It
    wires no remote sandbox provider — the runner uses the sandbox inside its own
    container, so a deployment that wants agent runs on separate compute
    contracts for a provider and configures the runner itself. It composes no
    model provider: which models an agent may use is configured in the platform
    at run time, against provider credentials a deployment supplies there rather
    than in its topology. And it carries no outbound-mail path, so the platform's
    invitations and notifications need a mail service this module does not
    compose.

    The module exports the control-plane API as `api`, the endpoint an external
    client and the ingress tier's API route talk to; the model-facing service as
    `services`, the endpoint the playground and the ingress tier's services
    route talk to; the console as `console`, the browser endpoint; and the
    small-screen front end as `mobile`.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  parameters:
    # Each parameter below is one credential the platform's components must agree
    # on, and fills every credential slot that holds it. They are module
    # parameters because an Aggregate importing this module hands it parameters
    # and nothing else, so a parameter is the one way a Release reaches a
    # credential slot on a component inside it — and one parameter per credential
    # means it is authored once and cannot drift between the components that must
    # agree on it.
    #
    # Each pinned default is what lets the module render self-contained. It is a
    # development credential: every reader of this catalog holds it, so a Release
    # carrying real traffic supplies its own through the importing Aggregate.
    # Each default is also a valid Kubernetes object name and meets what its
    # product requires of the credential, so it serves under either realization
    # of the Feature.
    db_password:
      type: string
      default: "agenta-db-password-for-evaluation-only"
      description: Password the PostgreSQL backend is initialized with, and the one the authentication core, the schema-migration step, both API tiers, both worker tiers and the scheduler authenticate to it with. What the value is depends on the core/referenced-secret realization the Manifest binds - the password itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the password under the data key db-password, with k8s-existing-secret. The platform's services place the password inside their connection URLs as it is, so keep it to characters a URL does not reserve. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    auth_key:
      type: string
      default: "agenta-auth-key-for-evaluation-only"
      description: Key the platform signs its own internal tokens with, held by both API tiers, both worker tiers, the scheduler and both front ends. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key auth-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    crypt_key:
      type: string
      default: "agenta-crypt-key-for-evaluation-only"
      description: Key the stored model-provider credentials and connected-application tokens are encrypted under, held by the same seven components as auth_key. Changing it makes what is already stored unreadable. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key crypt-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    services_internal_key:
      type: string
      default: "agenta-services-internal-key-for-evaluation-only"
      description: Key the control-plane API, the model-facing service and the queue-consuming worker present to each other on internal calls. The platform treats an empty value, or the placeholder replace-me its own examples ship, as no key at all. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key services-internal-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    runner_token:
      type: string
      default: "agenta-runner-token-for-evaluation-only"
      description: Token the runner requires on every incoming call, which both API tiers present. While it is at its default, anything that can reach the runner can start an agent run. What the value is depends on the core/referenced-secret realization the Manifest binds - the token itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the token under the data key runner-token, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    # The object store's root password is also the secret key both API tiers
    # present to it, because they authenticate as its root user. That user,
    # admin, is not a parameter: the store takes it as a plain value, so it is
    # not a credential the Feature can deliver on both sides.
    store_secret_key:
      type: string
      default: "agenta-store-secret-key-for-evaluation-only"
      description: Root password of the object store, and the S3 secret key both API tiers present to it as its root user. What the value is depends on the core/referenced-secret realization the Manifest binds - the secret itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the secret under the data key store-secret-key, with k8s-existing-secret. Keep it at least 8 characters, the shortest secret key the object store accepts. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    # Unattached, the authentication core issues no key and answers every caller
    # that can reach it. This module attaches one, so the core requires this key
    # of every caller, and both API tiers and both front ends present it.
    auth_core_api_key:
      type: string
      default: "agenta-auth-core-api-key-for-evaluation-only"
      description: API key the authentication core requires of every caller, and the one both API tiers and both front ends present to it. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key auth-core-api-key, with k8s-existing-secret. The core refuses to start unless the key is at least 20 characters of letters, digits, = and - alone, and the default meets that rule. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
  components:
    # The relational backend. Its initialization creates the three databases the
    # module needs: the platform's own model, its traces, and the authentication
    # core's accounts. The core's database is created here rather than by the
    # core itself, because the core is given one database name and this module
    # puts all three on one server.
    db:
      type: core/datastore/postgres
      values:
        user: agenta
        # The database published on this component's provides, and so the one
        # the authentication core is given — it is the only consumer in this
        # module that reads the published name. Every other consumer names the
        # database it wants on its own edge, which is why the platform's two are
        # not this value.
        database: agenta_supertokens
        init_scripts:
          10-agenta-databases.sql: |
            CREATE DATABASE agenta_core OWNER agenta;
            CREATE DATABASE agenta_tracing OWNER agenta;
      features:
        password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
    # The discardable instance: sessions, cached reads, rate-limit counters. No
    # credential is attached: see the description for why both instances run
    # without authentication.
    cache:
      type: core/datastore/redis
    # The instance work is put on and taken from. Separate from the cache above
    # so that losing a cache never loses queued work.
    queue:
      type: core/datastore/redis
    # Where the files an agent writes are kept. Its root user stays the
    # component's default, admin, which both API tiers name as their access key.
    store:
      type: core/storage/minio
      features:
        root_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.store_secret_key }}"
            key: store-secret-key
    # The authentication core. It holds its accounts in a database on the same
    # backend the rest of the module uses.
    auth:
      type: core/security/supertokens
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: POSTGRESQL_HOST, from: host }
                - { in: POSTGRESQL_PORT, from: port }
                - { in: POSTGRESQL_USER, from: user }
                - { in: POSTGRESQL_DATABASE_NAME, from: database }
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        api_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_core_api_key }}"
            key: auth-core-api-key
    # The schema-migration step. It creates the tables the five services below
    # expect, so the module sequences it ahead of them.
    migrations:
      type: core/ai-agent/agenta-migrations
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
    # The agent runner. Wired to the API alone, deliberately: see the isolation
    # paragraph in the description above. Its one credential is the token it
    # requires of its callers.
    runner:
      type: core/ai-agent/agenta-runner
      uses:
        api:
          api:
            target: api
            inject:
              env:
                - { in: API_ENDPOINT, from: endpoint }
      features:
        runner_token:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.runner_token }}"
            key: runner-token
    # The control-plane API: the platform's own data plane.
    api:
      type: core/ai-agent/agenta-api
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
        cache:
          volatile:
            target: cache
            inject:
              env:
                - { in: CACHE_HOST, from: host }
                - { in: CACHE_PORT, from: port }
        queue:
          durable:
            target: queue
            inject:
              env:
                - { in: QUEUE_HOST, from: host }
                - { in: QUEUE_PORT, from: port }
        auth_core:
          auth:
            target: auth
            inject:
              env:
                - { in: AUTH_CORE_ENDPOINT, from: endpoint }
        store:
          objects:
            target: store
            inject:
              env:
                - { in: STORE_HOST, from: host }
                - { in: STORE_PORT, from: port }
        runner:
          runner:
            target: runner
            inject:
              env:
                - { in: RUNNER_ENDPOINT, from: endpoint }
      # Every credential slot but the object store's access key, which stays the
      # store's root user: see the description.
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        auth_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_key }}"
            key: auth-key
        crypt_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.crypt_key }}"
            key: crypt-key
        services_internal_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.services_internal_key }}"
            key: services-internal-key
        runner_token:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.runner_token }}"
            key: runner-token
        store_secret_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.store_secret_key }}"
            key: store-secret-key
        auth_core_api_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_core_api_key }}"
            key: auth-core-api-key
    # The model-facing service: completions, chat, and starting an agent run.
    services:
      type: core/ai-agent/agenta-services
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
        cache:
          volatile:
            target: cache
            inject:
              env:
                - { in: CACHE_HOST, from: host }
                - { in: CACHE_PORT, from: port }
        queue:
          durable:
            target: queue
            inject:
              env:
                - { in: QUEUE_HOST, from: host }
                - { in: QUEUE_PORT, from: port }
        auth_core:
          auth:
            target: auth
            inject:
              env:
                - { in: AUTH_CORE_ENDPOINT, from: endpoint }
        store:
          objects:
            target: store
            inject:
              env:
                - { in: STORE_HOST, from: host }
                - { in: STORE_PORT, from: port }
        runner:
          runner:
            target: runner
            inject:
              env:
                - { in: RUNNER_ENDPOINT, from: endpoint }
      # The same credentials as the control-plane API, and for the same reason
      # the object store's access key is left out.
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        auth_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_key }}"
            key: auth-key
        crypt_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.crypt_key }}"
            key: crypt-key
        services_internal_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.services_internal_key }}"
            key: services-internal-key
        runner_token:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.runner_token }}"
            key: runner-token
        store_secret_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.store_secret_key }}"
            key: store-secret-key
        auth_core_api_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_core_api_key }}"
            key: auth-core-api-key
    # Drains the platform's continuous streams into the tracing database.
    worker_streams:
      type: core/ai-agent/agenta-worker-streams
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
        cache:
          volatile:
            target: cache
            inject:
              env:
                - { in: CACHE_HOST, from: host }
                - { in: CACHE_PORT, from: port }
        queue:
          durable:
            target: queue
            inject:
              env:
                - { in: QUEUE_HOST, from: host }
                - { in: QUEUE_PORT, from: port }
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        auth_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_key }}"
            key: auth-key
        crypt_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.crypt_key }}"
            key: crypt-key
    # Runs the platform's discrete background jobs: webhooks, triggers, agent
    # turns and evaluations.
    worker_queues:
      type: core/ai-agent/agenta-worker-queues
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
        cache:
          volatile:
            target: cache
            inject:
              env:
                - { in: CACHE_HOST, from: host }
                - { in: CACHE_PORT, from: port }
        queue:
          durable:
            target: queue
            inject:
              env:
                - { in: QUEUE_HOST, from: host }
                - { in: QUEUE_PORT, from: port }
        services:
          services:
            target: services
            inject:
              env:
                - { in: SERVICES_ENDPOINT, from: endpoint }
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        auth_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_key }}"
            key: auth-key
        crypt_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.crypt_key }}"
            key: crypt-key
        services_internal_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.services_internal_key }}"
            key: services-internal-key
    # Decides when a time-triggered thing is due and enqueues it.
    scheduler:
      type: core/ai-agent/agenta-cron
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: BACKEND_HOST, from: host }
                - { in: BACKEND_PORT, from: port }
                - { in: BACKEND_USER, from: user }
        cache:
          volatile:
            target: cache
            inject:
              env:
                - { in: CACHE_HOST, from: host }
                - { in: CACHE_PORT, from: port }
        queue:
          durable:
            target: queue
            inject:
              env:
                - { in: QUEUE_HOST, from: host }
                - { in: QUEUE_PORT, from: port }
      features:
        backend_password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
        auth_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.auth_key }}"
            key: auth-key
        crypt_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.crypt_key }}"
            key: crypt-key
    # The browser console.
    console:
      type: core/ai-agent/agenta-web
      uses:
        api:
          api:
            target: api
            inject:
              env:
                - { in: API_ENDPOINT, from: endpoint }
        services:
          services:
            target: services
