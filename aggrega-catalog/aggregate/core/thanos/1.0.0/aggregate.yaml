apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/thanos
  version: 1.0.0
  description: >
    A self-contained Thanos metrics read tier over an object-storage backend.
    Packaged as a reusable module composing three single-workload components — a
    MinIO object store, a Thanos Store Gateway that reads metric blocks from it,
    and a Thanos Query front end that fans PromQL requests out over the gateway's
    StoreAPI — wired by two internal edges: the store's `objstore` edge carries
    the object store's host and port into the S3 endpoint, and the query's `store`
    edge carries the gateway's host and port into the StoreAPI endpoint. The Store
    Gateway and the object store share one credential; the module uses a shared
    inline development default, so the stack runs self-contained with no external
    secret. This module is the read/query tier only: the S3 bucket must be
    pre-created and a writer (a Thanos Receive tier or a Prometheus sidecar) must
    feed metric blocks into the object store — both are runtime prerequisites,
    not module workloads. The module exports the query front end as `query`, the
    PromQL endpoint consumers connect to.
spec:
  components:
    objstore:
      type: core/storage/minio
      values:
        root_user: admin
    store:
      type: core/observability/thanos-store
      values:
        s3_access_key: admin
        bucket: thanos
      uses:
        objstore:
          s3:
            target: objstore
            inject:
              env:
                - { in: THANOS_S3_HOST, from: host }
                - { in: THANOS_S3_PORT, from: port }
    query:
      type: core/observability/thanos-query
      uses:
        store:
          api:
            target: store
            inject:
              env:
                - { in: THANOS_STORE_HOST, from: host }
                - { in: THANOS_STORE_PORT, from: port }
  exportedComponents:
    query: query
