apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/ferretdb
  version: 1.0.0
  description: >
    A self-contained document-database stack: a MongoDB-wire-compatible proxy in
    front of a PostgreSQL backend with the DocumentDB extension. Packaged as a
    reusable module composing two single-workload components — the proxy and its
    backend — wired by an internal edge that carries the backend's host, port,
    user, and database into the proxy's connection. The proxy delegates
    authentication to the backend, so both share one password; the module uses a
    shared inline development default. The module exports the proxy as `mongo`,
    the document-database endpoint consumers connect to.
spec:
  components:
    backend:
      type: core/datastore/documentdb
    proxy:
      type: core/datastore/ferretdb
      uses:
        backend:
          db:
            target: backend
            inject:
              env:
                - { in: FERRETDB_PG_HOST, from: host }
                - { in: FERRETDB_PG_PORT, from: port }
                - { in: FERRETDB_PG_USER, from: user }
                - { in: FERRETDB_PG_DB, from: database }
  exportedComponents:
    mongo: proxy
