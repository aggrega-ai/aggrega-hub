apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: core/ferretdb
  version: 1.0.0
  description: >
    A self-contained document-database stack: a MongoDB-wire-compatible proxy in
    front of a PostgreSQL backend with the DocumentDB extension. Packaged as a
    reusable module composing two single-workload components — the proxy and its
    backend — wired by an internal edge that carries the backend's host, port,
    user, and database into the proxy's connection. The proxy delegates
    authentication to the backend, so both share one password; the module uses a
    shared inline development default. The module exports the proxy as `mongo`,
    the document-database endpoint consumers connect to.

    The module attaches no credential Feature, because it builds on `compose` as
    well as on `helm`, and on `compose` the Feature that holds a credential by
    reference, `core/referenced-secret`, has no realization: the target gives a
    workload no way to read a Secret by name. So its two components run on the
    inline development password their Recipes carry, which every reader of this
    catalog holds, and the module is for evaluation and local development. An
    Aggregate whose Release needs a real password composes the proxy and its
    backend directly, rather than importing this module, and attaches a
    credential Feature to the credential slot of each.
spec:
  components:
    backend:
      type: core/datastore/documentdb
    proxy:
      type: core/datastore/ferretdb
      uses:
        backend:
          db:
            target: backend
            inject:
              env:
                - { in: FERRETDB_PG_HOST, from: host }
                - { in: FERRETDB_PG_PORT, from: port }
                - { in: FERRETDB_PG_USER, from: user }
                - { in: FERRETDB_PG_DB, from: database }
  exportedComponents:
    mongo: proxy
