apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: core/apisix
  version: 1.0.0
  description: >
    A self-contained API-gateway stack: a dynamic API gateway in front of an
    etcd configuration store. Packaged as a reusable module composing two
    single-workload components — the gateway and its store — wired by an internal
    edge that carries the store's host and client port into the gateway's
    configuration-store connection. The module exports the gateway as `proxy`,
    the API endpoint consumers connect to.

    The gateway administers its routes through an Admin API whose key is the
    module parameter `admin_key`, with no default: an importing Aggregate passes
    one down and its Release fulfills it, or the build halts. The module
    attaches `core/referenced-secret` to the gateway's `admin_key` slot with it,
    so the Manifest of every Release whose Aggregate imports the module maps
    `core/referenced-secret`, or the build halts.
spec:
  parameters:
    # The gateway's Admin API key, attached to its admin_key slot through
    # core/referenced-secret, so the gateway reads the key from a Secret
    # rather than carrying it. There is deliberately no default: a pinned one
    # would be a key every reader of this catalog holds, guarding the API that
    # writes the gateway's routes. An importing Aggregate declares a parameter of
    # its own and passes it down through its `aggregates` entry for the Release
    # to fulfill; under k8s-existing-secret that value is the name of a Secret
    # the operator creates, so no key passes through any file the build reads.
    admin_key:
      type: string
      required: true
      minLength: 1
      description: The gateway's Admin API key. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key admin-key, with k8s-existing-secret. There is no default, so the importing Aggregate passes one down and its Release fulfills it. The key must not be empty and must not be a value APISIX reads as a number or as true or false, such as an all-digit key, which APISIX never matches.
  components:
    store:
      type: core/datastore/etcd
    gateway:
      type: core/gateway/apisix
      uses:
        etcd:
          kv:
            target: store
            inject:
              env:
                - { in: APISIX_ETCD_HOST, from: host }
                - { in: APISIX_ETCD_PORT, from: port }
      features:
        admin_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.admin_key }}"
            key: admin-key
  exportedComponents:
    proxy: gateway
