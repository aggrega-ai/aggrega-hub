apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: core/apisix
  version: 1.0.0
  description: >
    A self-contained API-gateway stack: a dynamic API gateway in front of an
    etcd configuration store. Packaged as a reusable module composing two
    single-workload components — the gateway and its store — wired by an internal
    edge that carries the store's host and client port into the gateway's
    configuration-store connection. The gateway administers its routes through an
    Admin API authenticated by a static key; the module pins a deterministic
    development key so the stack renders self-contained. The module exports the
    gateway as `proxy`, the API endpoint consumers connect to.
spec:
  components:
    store:
      type: core/datastore/etcd
    gateway:
      type: core/gateway/apisix
      uses:
        etcd:
          kv:
            target: store
            inject:
              env:
                - { in: APISIX_ETCD_HOST, from: host }
                - { in: APISIX_ETCD_PORT, from: port }
  exportedComponents:
    proxy: gateway
