apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: core/livekit
  version: 1.0.0
  description: >
    A self-hosted realtime voice and video stack packaged as a reusable module:
    a LiveKit media server, a SIP bridge carrying telephone calls into and out
    of a room, an agent worker joining a room as a participant, and a Valkey
    key-value store the server and the bridge share. The module exports the
    media server as `server`, the endpoint clients open their sessions on, and
    the bridge as `telephony`, the endpoint a SIP trunk reaches.

    The agent tier needs one input the module cannot supply. Upstream publishes
    the agent framework as a language package rather than as a container image,
    so the catalog pins no image for it, and the Release names an image built
    from that framework together with its own agent code. Nothing renders until
    it does. The API secret the three LiveKit components share is `api_secret`,
    a module parameter an importing Aggregate passes down; it has no default,
    so the build halts until one is passed. The module attaches
    `core/referenced-secret` on the media server's credential slot and on the
    credential each connection to it carries, so the Manifest of every Release
    whose Aggregate imports the module maps `core/referenced-secret`, or the
    build halts.

    Each component publishes an in-cluster address only. The module ships no
    ingress, no TLS termination, no SIP trunk and no carrier account, which a
    Release supplies around it, and defines no rooms, dispatch rules or trunk
    configuration, which are settled at runtime through the media server's own
    APIs. A UDP media range carries traffic only where the pod uses the node's
    own network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  parameters:
    # The secret half of the API key pair, held identically by all three
    # LiveKit components: the media server signs and validates access tokens
    # with it, and the bridge and the worker authenticate to that server with
    # it, so two different secrets leave them unable to open a session. It is a
    # module parameter rather than three separate attachment values so that the
    # one secret is authored once and cannot drift between the components that
    # must agree on it. The module attaches core/referenced-secret on the media
    # server's credential slot and on the credential of each connection to it,
    # so each workload carries a reference to a Secret rather than the value
    # itself.
    #
    # It has no default: a signing secret every reader of this catalog holds
    # would let anyone mint an access token the media server accepts. The
    # importing Aggregate declares a parameter of its own and passes it down
    # through its `aggregates` entry for the Release to fulfill.
    api_secret:
      type: string
      required: true
      minLength: 1
      description: Secret half of the API key pair the media server signs client access tokens with and the bridge and the worker authenticate with. What the value is depends on the core/referenced-secret realization the Manifest binds - the secret itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the secret under the data key LIVEKIT_API_SECRET, with k8s-existing-secret. Keep the secret at least 32 characters, the length below which the media server reports it as too short at start-up. There is no default, so the importing Aggregate passes one down and its Release fulfills it.
  # Four single-workload components wired by internal edges: the media server
  # and the bridge both reach the store, and the bridge and the worker both
  # reach the media server. The store edges carry the store's in-cluster host
  # and port into each consumer, which composes them into the address of the
  # shared state the server and the bridge coordinate through and pass call
  # setup requests over. The media-server edges carry that server's host, its
  # signalling port and its public API key identifier to the bridge, through
  # the inject block on its edge, and to the worker, whose Recipe reads them
  # off its connection; each composes the WebSocket address it opens its own
  # client session on. The public half of the key pair travels them as an
  # ordinary string, and the secret half is the credential each of those edges
  # carries. The compiler routes the strings without interpreting them.
  components:
    # The Redis-compatible store the media server and the bridge share. It
    # carries the state of a call in progress and the requests that set a call
    # up, so both components must reach the same one — which is why it is a
    # component of this module rather than something each tier brings.
    store:
      type: core/datastore/valkey

    # The media server: the selective forwarding unit carrying audio and video
    # between the participants of a room, and the component every other tier
    # here holds a client session with. The module defines no rooms, no
    # dispatch rules and no trunk configuration; those are settled at runtime
    # through this server's own APIs rather than at build time.
    #
    # It multiplexes media onto one declared UDP port until a Release sets both
    # bounds of a range for it. A contiguous UDP media range is configuration
    # the process reads rather than ports the module declares, so it carries
    # traffic only where the pod uses the node's own network.
    media:
      type: core/messaging/livekit-server
      uses:
        state_store:
          store:
            target: store
            inject:
              env:
                - { in: LIVEKIT_STATE_STORE_HOST, from: host }
                - { in: LIVEKIT_STATE_STORE_PORT, from: port }
      features:
        api_secret:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.api_secret }}"
            key: LIVEKIT_API_SECRET

    # The SIP bridge: telephony ingress and egress. It reaches the media server
    # to join calls to rooms and the store to keep the state of a call in
    # progress, which is also how it and the server exchange call setup.
    #
    # The module ships no SIP trunk and no carrier account: the bridge
    # terminates a trunk the Release brings. It always draws its per-call RTP
    # socket from a contiguous UDP range, which carries traffic only where the
    # pod uses the node's own network.
    bridge:
      type: core/messaging/livekit-sip
      uses:
        media_server:
          media:
            target: media
            inject:
              env:
                - { in: LIVEKIT_MEDIA_SERVER_HOST, from: host }
                - { in: LIVEKIT_MEDIA_SERVER_PORT, from: port }
                - { in: LIVEKIT_MEDIA_SERVER_API_KEY, from: api_key }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.api_secret }}"
                  key: LIVEKIT_API_SECRET
        state_store:
          store:
            target: store
            inject:
              env:
                - { in: LIVEKIT_STATE_STORE_HOST, from: host }
                - { in: LIVEKIT_STATE_STORE_PORT, from: port }

    # The agent worker: a participant rather than a carrier of media. It
    # registers with the media server and waits to be handed rooms, and it
    # reaches nothing else — no store edge, because a session's state lives in
    # the worker's memory for as long as that session lasts.
    #
    # Its image is the one input the module cannot supply: upstream publishes
    # the agent framework as a language package rather than as a container
    # image, so the catalog pins no image for it, and the worker's image is an
    # operational value the Release sets to a reference it has built from that
    # framework together with its own agent code and published where the
    # cluster can pull it. Nothing renders until it does.
    agent:
      type: core/ai-agent/livekit-agent-worker
      uses:
        media_server:
          media:
            target: media
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.api_secret }}"
                  key: LIVEKIT_API_SECRET
  exportedComponents:
    # The two components something outside the module addresses. The store is
    # internal to the fleet, and the worker publishes no address at all — it
    # opens its connection outward and nothing reaches it.
    #
    # Several things are deliberately out of scope, and a Release supplies them
    # around the module. It ships no ingress and no TLS termination: each
    # component that publishes an address does so as an in-cluster ClusterIP
    # Service, so reaching a client outside the cluster is the ingress tier's
    # concern, and external-address discovery is off on both the server and the
    # bridge.
    server: media
    telephony: bridge
