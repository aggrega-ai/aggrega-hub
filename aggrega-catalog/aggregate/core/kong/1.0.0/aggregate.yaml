apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: core/kong
  version: 1.0.0
  description: >
    A self-contained API-gateway stack: a database-backed gateway in front of a
    PostgreSQL backend. Packaged as a reusable module composing two
    single-workload components — the gateway and its backend — wired by an
    internal edge that carries the backend's host, port, user, and database into
    the gateway's connection. The gateway provisions its database schema through
    a migrations step that runs to completion before it serves. The gateway and
    the backend share one password; the module uses a shared inline development
    default. The module exports the gateway as `proxy`, the API endpoint
    consumers connect to.

    The module attaches no credential Feature, because it builds on `compose` as
    well as on `helm`, and on `compose` the Feature that holds a credential by
    reference, `core/referenced-secret`, has no realization: the target gives a
    workload no way to read a Secret by name. So its two components run on the
    inline development password their Recipes carry, which every reader of this
    catalog holds, and the module is for evaluation and local development. An
    Aggregate whose Release needs a real password composes the gateway and its
    backend directly, rather than importing this module, and attaches a
    credential Feature to the credential slot of each.
spec:
  components:
    backend:
      type: core/datastore/postgres
      values:
        user: kong
        database: kong
    gateway:
      type: core/gateway/kong
      uses:
        backend:
          db:
            target: backend
            inject:
              env:
                - { in: KONG_PG_HOST, from: host }
                - { in: KONG_PG_PORT, from: port }
                - { in: KONG_PG_USER, from: user }
                - { in: KONG_PG_DATABASE, from: database }
  exportedComponents:
    proxy: gateway
