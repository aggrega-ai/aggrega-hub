apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: core/dify
  version: 1.0.0
  description: >
    A self-contained Dify installation packaged as a reusable module: the
    platform on which an application author builds retrieval-augmented
    assistants and agent workflows from a browser. It composes ten
    single-workload components: an API and console server, a task worker, a
    task scheduler, a web front end, a code sandbox, a plugin runtime, an egress
    proxy, a PostgreSQL backend, a Redis-compatible cache, and a Weaviate vector
    datastore. Every address a workflow fetches leaves through the proxy, which
    refuses private destinations.

    Five credentials are module parameters an importing Aggregate passes down,
    each attached through core/referenced-secret. secret_key, the application
    secret, has no default, so an importer passes it down and its Release
    fulfills it, or the build halts naming the parameter; the other four have
    development defaults every reader holds, for evaluation only. The cache and
    the vector datastore run without authentication.

    Its app_definition parameter carries an application in Dify's export
    format, imported at deploy. A Release filling it sets infra.owner_email and
    attaches owner_password on the api component, or the build halts.

    Realized on helm: its Dify components have no compose Recipe. The Manifest
    of every Release importing it maps core/referenced-secret, or the build
    halts, and maps the backend to a PostgreSQL Recipe other than
    postgres-cloudnative-pg.

    It ships no reverse proxy, no agent shell-workspace tier and no real-time
    workflow collaboration, and it wires no shared file storage, so document
    upload and dataset indexing, which hand a file from the API server to the
    worker, need a storage backend this module does not compose.
spec:
  parameters:
    # The first five parameters below are the platform's credentials. Each is one
    # credential the platform's components must agree on, and fills every
    # credential slot that holds it. They are module parameters because one
    # parameter per credential is authored once and cannot drift between the
    # components that must agree on it. An Aggregate importing this module hands
    # it parameters and nothing else; a Release can also attach a credential to a
    # component inside it directly, through the routing entry that places this
    # module, which is how it attaches the owner password app_definition needs.
    #
    # The module attaches core/referenced-secret on each of those slots — on a
    # component that verifies the credential or uses it itself, its own slot; on
    # a component that presents it to another, the credential of the connection
    # it presents it on — so every workload carries a reference to a Secret
    # rather than the value itself. What a parameter means follows the
    # realization the Manifest binds for that Feature, as each parameter's
    # description says; under k8s-existing-secret one Secret may carry all five,
    # each under its own data key.
    #
    # secret_key has deliberately no default: a pinned one would be a key every
    # reader of this catalog holds, letting anyone forge the installation's
    # session cookies or decrypt the model-provider credentials in its database. An
    # importing Aggregate declares a parameter of its own for it and passes it
    # down through its aggregates entry for the Release to fulfill.
    #
    # Each other parameter's pinned default is what lets the module render
    # without a value for it. It is a development credential: every reader of
    # this catalog holds it, so it is for evaluation and local development, and
    # a Release carrying real traffic supplies its own through the importing
    # Aggregate, which declares parameters of its own and passes them down
    # through its aggregates entry for the Release to fulfill.
    # Each default is also a valid Kubernetes object name, so it serves under
    # either realization of the Feature.
    db_password:
      type: string
      default: "dify-db-password-for-evaluation-only"
      description: Password the PostgreSQL backend is initialized with, and the one the API server, the task worker, the scheduler and the plugin runtime authenticate to it with. What the value is depends on the core/referenced-secret realization the Manifest binds - the password itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the password under the data key db-password, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    secret_key:
      type: string
      required: true
      minLength: 1
      description: Application secret the API server signs session cookies with and encrypts stored model-provider credentials under, and the one the task worker decrypts them with. What the value is depends on the core/referenced-secret realization the Manifest binds - the secret itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the secret under the data key secret-key, with k8s-existing-secret. There is no default, so the importing Aggregate passes one down and its Release fulfills it.
    code_execution_key:
      type: string
      default: "dify-code-execution-key-for-evaluation-only"
      description: Key the code sandbox requires on every execution request, which the API server and the task worker present. While it is at its default, any workload that can reach the sandbox can execute code through it. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key code-execution-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    plugin_daemon_key:
      type: string
      default: "dify-plugin-daemon-key-for-evaluation-only"
      description: Key the plugin runtime requires of every caller, which the API server and the task worker present on every call they make to it. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key plugin-daemon-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    inner_api_key:
      type: string
      default: "dify-inner-api-key-for-evaluation-only"
      description: Key the plugin runtime presents on every call back into the internal API, which the API server and the task worker compare against their own. What the value is depends on the core/referenced-secret realization the Manifest binds - the key itself with k8s-secret-from-parameter, which emits a Secret carrying it; the name of a Secret already in the namespace, holding the key under the data key inner-api-key, with k8s-existing-secret. The default is a development credential shipped so the module renders self-contained, for evaluation only; pass your own down from the importing Aggregate for any Release carrying real traffic.
    # The application the installation is seeded with, carried verbatim into the
    # API server's values.app_definition. It is written there through toJson:
    # this module's text is evaluated as a template before it is read, and toJson
    # writes the definition as one quoted string, so its quotes, its line breaks
    # and Dify's own double-brace references arrive as written. Its default is
    # empty, which imports nothing and leaves the rendered output as it is
    # without it.
    #
    # Importing it needs an owner account, and the owner is the Release's to
    # name: an Aggregate sets no infra on a component, and the owner password has
    # no default, so this module writes neither. A Release filling app_definition
    # sets both on the api component, in the routing entry that places this
    # module, and the build halts when either is missing:
    #
    #   boundaries:
    #     <boundary>:
    #       aggregates:
    #         <this module's instance name>:
    #           components:
    #             api:
    #               infra:
    #                 owner_email: owner@example.com
    #               features:
    #                 owner_password:
    #                   type: core/referenced-secret
    #                   infra:
    #                     origin: <the password, or an existing Secret's name>
    app_definition:
      type: string
      default: ""
      description: An application to seed the installation with, in Dify's own DSL - the YAML Dify exports for an application - carried verbatim into the API server's values.app_definition. The default, empty, imports nothing and renders nothing for it. When set, the API server's helm Recipe renders a one-shot step that imports it at deploy under the installation's owner account, and the Release names that owner on this module's api component through the routing entry that places the module - under components.api in the boundary's aggregates entry for this module, it sets infra.owner_email and attaches owner_password with type core/referenced-secret and an infra.origin, which is the password itself with k8s-secret-from-parameter, or the name of a Secret already in the namespace holding the password under the data key value with k8s-existing-secret. The build halts when either is missing. A definition may carry Dify's own double-brace variable references, and an Aggregate's text is evaluated as a template before it is read, so an importing Aggregate declares a string parameter of its own, passes it down in its aggregates entry through toJson, spelled as this module writes it on its api component, and its Release fills it; the definition then arrives as written.
  components:
    # This module is the working platform core. The three datastore edges are
    # what make the platform stateful, and five internal edges complete it; each
    # is stated beside the component it reaches. The compiler routes all of
    # these strings without interpreting them.
    #
    # Three parts of a full Dify installation are deliberately out of scope: the
    # reverse proxy, stated beside exportedComponents; shared file storage,
    # stated beside api; and the agent shell-workspace tier, the agent session
    # backend, its shell sandbox and that sandbox's own dedicated egress proxy.
    # That tier is not composed because its isolation is a property of the
    # network topology between those three workloads rather than of any one of
    # them, and a module that rendered the workloads without the topology would
    # present an isolation it does not deliver.

    # The backend. The API server, the worker, the scheduler and the plugin
    # runtime each reach it; the edge carries its in-cluster host and port along
    # with its user and database name, and each composes them into a PostgreSQL
    # connection.
    db:
      type: core/datastore/postgres
      values:
        user: dify
        database: dify
      # Because the module fills the backend's credential slot, the backend is
      # realized by a Recipe that reads that slot. postgres-cloudnative-pg, whose
      # controller owns the database's credentials itself, halts the build when
      # the slot is filled, so a Manifest importing this module maps the backend
      # to another PostgreSQL realization.
      features:
        password:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.db_password }}"
            key: db-password
    # The cache. The same four components reach it; the edge carries its host
    # and port, and each edge names two logical-database indices, one for the
    # application cache and one for the Celery broker, so the two keyspaces stay
    # apart on one cache.
    #
    # No credential is attached to the cache or to the vector datastore below,
    # and the stores behind them run without authentication: the cache's
    # password and the vector datastore's API key. Filling either slot switches
    # authentication on at that store, and no component reaching it declares a
    # slot to present the credential, so the store would refuse every one of
    # its clients.
    cache:
      type: core/datastore/redis
    # The vector datastore. The API server and the worker reach it; the edge
    # carries its host, its HTTP port and its gRPC port, and each edge names the
    # client driver to speak on it, so wiring a different store is a change of
    # target and driver name rather than a change of component.
    vector:
      type: core/datastore/weaviate
    # The egress proxy, an internal edge that carries a security property rather
    # than a convenience. A Dify workflow fetches whatever address its author or
    # its end user supplied (a page to crawl, a file to load, an HTTP request
    # node's target), so the API server, the worker and the sandbox all send
    # those requests through the proxy, which refuses any destination in
    # private, loopback, link-local or multicast address space. A supplied
    # address therefore reaches the public internet and cannot reach this
    # module's own services or the node's metadata endpoint. The proxy's
    # allowlist of private destinations is empty, and widening it is an
    # explicit act.
    proxy:
      type: core/ai-agent/dify-ssrf-proxy
    # The code sandbox. The API server and the worker reach it, and it runs the
    # Python and JavaScript of a workflow's code nodes, so that an application
    # author's code never runs inside the platform's own process.
    sandbox:
      type: core/ai-agent/dify-sandbox
      uses:
        ssrf_proxy:
          proxy:
            target: proxy
            inject:
              env:
                - { in: SSRF_PROXY_HOST, from: host }
                - { in: SSRF_PROXY_PORT, from: port }
      features:
        code_execution_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.code_execution_key }}"
            key: code-execution-key
    # The plugin runtime. The API server and the worker reach it, and every
    # model call and tool invocation is dispatched through it: a platform with
    # no plugin runtime can edit a workflow but cannot run one. The runtime
    # reaches back into the API server over the internal API to resolve
    # workspace and credential context, and it keeps its plugin catalogue in a
    # database of its own on the backend's server.
    plugins:
      type: core/ai-agent/dify-plugin-daemon
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: DB_HOST, from: host }
                - { in: DB_PORT, from: port }
                - { in: DB_USERNAME, from: user }
                - { in: DB_DATABASE, from: database }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.db_password }}"
                  key: db-password
        cache:
          redis:
            target: cache
            values:
              db_index: 0
            inject:
              env:
                - { in: REDIS_HOST, from: host }
                - { in: REDIS_PORT, from: port }
        api:
          api:
            target: api
            inject:
              env:
                - { in: API_HOST, from: host }
                - { in: API_PORT, from: port }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.inner_api_key }}"
                  key: inner-api-key
      features:
        plugin_daemon_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.plugin_daemon_key }}"
            key: plugin-daemon-key
    # The API and console server. The module wires no shared file storage: the
    # API server and the worker each keep uploaded files on their own ephemeral
    # volume, so features that hand a file from one to the other, document
    # upload and dataset indexing among them, need a shared storage backend
    # this module does not compose. Real-time workflow collaboration, which
    # needs a second API process serving websockets, is likewise not included.
    api:
      type: core/ai-agent/dify
      # The application to seed, empty unless the app_definition parameter is
      # set; that parameter says what a Release then sets on this component.
      # The value is the parameter's toJson encoding with its outer quotes cut
      # off, inside quotes of its own: evaluated, it reads exactly as the JSON
      # string toJson writes, and unevaluated it is still a plain YAML string, so
      # a tool that reads this file before evaluating it can parse it.
      values:
        app_definition: "{{ $definition := toJson .parameters.app_definition }}{{ substr 1 (int (sub (len $definition) 1)) $definition }}"
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: DB_HOST, from: host }
                - { in: DB_PORT, from: port }
                - { in: DB_USERNAME, from: user }
                - { in: DB_DATABASE, from: database }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.db_password }}"
                  key: db-password
        cache:
          redis:
            target: cache
            values:
              db_index: 0
              broker_db_index: 1
            inject:
              env:
                - { in: REDIS_HOST, from: host }
                - { in: REDIS_PORT, from: port }
        vector_store:
          vdb:
            target: vector
            values:
              engine: weaviate
            inject:
              env:
                - { in: VDB_HOST, from: host }
                - { in: VDB_PORT, from: port }
                - { in: VDB_GRPC_PORT, from: grpc_port }
        sandbox:
          sandbox:
            target: sandbox
            inject:
              env:
                - { in: SANDBOX_HOST, from: host }
                - { in: SANDBOX_PORT, from: port }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.code_execution_key }}"
                  key: code-execution-key
        plugin_daemon:
          plugins:
            target: plugins
            inject:
              env:
                - { in: PLUGIN_DAEMON_HOST, from: host }
                - { in: PLUGIN_DAEMON_PORT, from: port }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.plugin_daemon_key }}"
                  key: plugin-daemon-key
        ssrf_proxy:
          proxy:
            target: proxy
            inject:
              env:
                - { in: SSRF_PROXY_HOST, from: host }
                - { in: SSRF_PROXY_PORT, from: port }
      features:
        secret_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.secret_key }}"
            key: secret-key
        inner_api_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.inner_api_key }}"
            key: inner-api-key
    worker:
      type: core/ai-agent/dify-worker
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: DB_HOST, from: host }
                - { in: DB_PORT, from: port }
                - { in: DB_USERNAME, from: user }
                - { in: DB_DATABASE, from: database }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.db_password }}"
                  key: db-password
        cache:
          redis:
            target: cache
            values:
              db_index: 0
              broker_db_index: 1
            inject:
              env:
                - { in: REDIS_HOST, from: host }
                - { in: REDIS_PORT, from: port }
        vector_store:
          vdb:
            target: vector
            values:
              engine: weaviate
            inject:
              env:
                - { in: VDB_HOST, from: host }
                - { in: VDB_PORT, from: port }
                - { in: VDB_GRPC_PORT, from: grpc_port }
        sandbox:
          sandbox:
            target: sandbox
            inject:
              env:
                - { in: SANDBOX_HOST, from: host }
                - { in: SANDBOX_PORT, from: port }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.code_execution_key }}"
                  key: code-execution-key
        plugin_daemon:
          plugins:
            target: plugins
            inject:
              env:
                - { in: PLUGIN_DAEMON_HOST, from: host }
                - { in: PLUGIN_DAEMON_PORT, from: port }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.plugin_daemon_key }}"
                  key: plugin-daemon-key
        ssrf_proxy:
          proxy:
            target: proxy
            inject:
              env:
                - { in: SSRF_PROXY_HOST, from: host }
                - { in: SSRF_PROXY_PORT, from: port }
      features:
        secret_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.secret_key }}"
            key: secret-key
        inner_api_key:
          type: core/referenced-secret
          values:
            origin: "{{ .parameters.inner_api_key }}"
            key: inner-api-key
    scheduler:
      type: core/ai-agent/dify-worker-beat
      uses:
        backend:
          db:
            target: db
            inject:
              env:
                - { in: DB_HOST, from: host }
                - { in: DB_PORT, from: port }
                - { in: DB_USERNAME, from: user }
                - { in: DB_DATABASE, from: database }
            features:
              credential:
                type: core/referenced-secret
                values:
                  origin: "{{ .parameters.db_password }}"
                  key: db-password
        cache:
          redis:
            target: cache
            values:
              db_index: 0
              broker_db_index: 1
            inject:
              env:
                - { in: REDIS_HOST, from: host }
                - { in: REDIS_PORT, from: port }
    # The web front end, which reaches the API server for every piece of data it
    # renders.
    console:
      type: core/ai-agent/dify-web
      uses:
        api:
          api:
            target: api
            inject:
              env:
                - { in: API_HOST, from: host }
                - { in: API_PORT, from: port }
  # The module exports the API server as api, the endpoint an API client and
  # the ingress tier's API routes talk to; the front end as console, the
  # browser endpoint; and the plugin runtime as plugins, the endpoint the
  # plugin path routes to.
  #
  # It ships no internal reverse proxy: a single external endpoint is assembled
  # at the ingress tier, which routes the console and API paths (/console/api,
  # /api, /v1, /openapi, /files, /mcp, /triggers) to the API server, the plugin
  # endpoint path (/e/) to the plugin runtime, and the browser paths (/explore
  # and /) to the front end.
  exportedComponents:
    api: api
    console: console
    plugins: plugins
