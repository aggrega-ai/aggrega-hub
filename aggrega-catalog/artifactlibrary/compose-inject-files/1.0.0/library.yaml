apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: ComposeInjectFiles
  version: 1.0.0
  description: >
    The compose configs that carry the files a component's inject blocks
    dictate, as one bundle compose Recipes import, so every file entry reaches
    a Docker Compose service the same way whichever of them renders it.

    Configs writes one compose config per file entry a connection's inject
    block, or the component's own, dictates: numbered in path order and named
    after the component instance, each holding the entry's content with every $
    doubled, so the file holds the value itself rather than a variable Docker
    Compose would substitute. It writes nothing while no file is dictated, so a
    build with none renders what it would without the bundle.

    The importing Recipe mounts each config by name from its own workload,
    which a bundle cannot write, so it declares the name's prefix as the local
    inject_file_config_prefix, and the bundle stops the build when that local is
    missing or differs from its own.
spec:
  artifacts:
    # The bundle. The compose configs holding the file entries the component's
    # connections and its own inject block dictate, written once for the
    # compose Recipes importing it rather than as a copy in each, which a later
    # edit could leave behind. Compose Recipes that carry a copy of their own
    # keep it until their next version.
    #
    # What it reads. The importing Recipe's context: each connection's inject
    # directives under .context.uses, the component's own block under
    # .context.self_inject, the value each file entry delivers under
    # .context.inject.file, and .context.instance_id. Whether a dictated path is
    # acceptable — absolute, and not beneath another — is the importing Recipe's
    # to refuse, in its workload, where it names who dictated the path; this
    # bundle refuses nothing about a path. DELIBERATE NEAR-DUPLICATE: its reading
    # of the connections' file directives and of the own block's file entries is
    # the second reading of them that every compose Recipe of a tool or an agent
    # carries, in the importer's own workload for the mounts and inline in the
    # artifact of a Recipe that does not import this bundle; a change to one is
    # made to all of them.
    #
    # What it writes. A compose config per dictated file, named
    # <instance>-file-<n>, n counting from 0 over the dictated paths in path
    # order, its content the delivered value with each $ doubled, since Docker
    # Compose substitutes a variable reference, $NAME or ${NAME}, in a config's
    # content and reads $$ as one literal $. A Recipe that delivers none of the
    # component's own block — a realization refusing it — still reads it here,
    # and its own refusal stops the build before such a file could reach a
    # service. While no file is dictated the template renders only whitespace,
    # and an artifact rendering only whitespace emits no file.
    #
    # What the importing Recipe declares. Its workload mounts each config by the
    # same name, counting the same paths in the same order, so the Recipe
    # declares the name's prefix as the local inject_file_config_prefix,
    # "{{ .context.instance_id }}-file-", and the bundle stops the build, naming
    # the local, when it is missing or differs from its own. A local the
    # Recipe does not declare reads as empty here rather than stopping the build,
    # so it is checked before anything is written.
    Configs:
      inject-files.compose-fragment.yaml: |
        {{- $bundle := "ComposeInjectFiles#/artifacts/Configs" }}
        {{- $prefix := printf "%s-file-" .context.instance_id }}
        {{- $have := toString (optional .locals "inject_file_config_prefix" "") }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local inject_file_config_prefix, which begins the name of each compose config its workload mounts a dictated file from, which this bundle emits; declare it as %q" $bundle $prefix) }}
        {{- else if ne $have $prefix }}
        {{- fail (printf "the Recipe importing %s declares the local inject_file_config_prefix as %q, but that local begins the name of each compose config its workload mounts a dictated file from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $prefix $prefix) }}
        {{- end }}
        {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
        {{- $files := dict }}
        {{- range $alias, $edge := .context.uses }}
        {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
        {{- $_ := set $files $path (optional $pipeFiles $path "") }}
        {{- end }}
        {{- end }}
        {{- range $mechanism, $names := default dict .context.self_inject }}
        {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
        {{- end }}
        {{- if $files }}
        configs:
          {{- $i := 0 }}
          {{- range $path, $v := $files }}
          {{ printf "%s%d" $prefix $i | toJson }}:
            content: {{ toJson (replace "$" "$$" (toString $v)) }}
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
