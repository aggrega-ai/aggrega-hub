apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: LangflowFlow
  version: 1.0.0
  description: >
    The flow a Langflow platform loads at each start, as one bundle every
    Recipe running core/ai-agent/langflow imports, so the flow, and the
    addresses its tool connections write into it, are written once, whichever
    target the platform runs on.

    FlowFile writes nothing unless the Component's values.flow_definition is
    set. With no tools connection wired it carries the definition as written.
    With tools connections wired, each MCP Tools node whose server is named
    for a connection's alias gets the address the tool publishes as the url
    of its server configuration and, where the connection carries a
    credential, the name of the variable holding it under the header the tool
    publishes: AGGREGA_TOOL_<ALIAS>_AUTHORIZATION, holding Bearer and the
    credential, under Authorization, and AGGREGA_TOOL_<ALIAS>_CREDENTIAL under
    any other. The flow is then written back as JSON with its keys sorted.

    The importing Recipe picks the delivery with the local flow_file_delivery
    — config_map, a ConfigMap holding the flow as flow.json, for a Kubernetes
    target, or compose_config, a compose config with every $ doubled — and
    declares as a local the name it mounts the flow by, which stops the build
    when it is missing or differs. The bundle is authored against
    langflow-base 0.11.0.
spec:
  artifacts:
    # The bundle. The flow a Langflow platform loads from its flows directory
    # at each start, written once for every Recipe running
    # core/ai-agent/langflow. It reads the flow and the wired connections and
    # rewrites the one from the other, which is logic rather than
    # configuration, so it lives here once rather than as a copy in each Recipe
    # that a later edit could leave behind.
    #
    # What it writes. Langflow's MCP Tools component reads a server's address
    # from the server configuration written into the flow, or from a server of
    # that name stored in Langflow's settings, and from no variable. So each
    # `tools` connection is written into the flow: every MCP Tools node whose
    # mcp_server value names a connection's alias — as a name alone, or as an
    # object carrying a name and a server configuration — has the address the
    # tool publishes set as the url of that configuration, a node naming the
    # server alone getting a configuration holding the name and the address. A
    # connection carrying a credential also writes, under the header the tool
    # publishes, replacing a header of that name in any letter case, the name
    # of the variable the importing Recipe delivers for it: under
    # Authorization, AGGREGA_TOOL_<ALIAS>_AUTHORIZATION, which holds Bearer and
    # the credential, the value a server reading that header expects; under any
    # other header, AGGREGA_TOOL_<ALIAS>_CREDENTIAL, which holds the credential.
    # Langflow presents a header's value from the stored global variable whose
    # name is that whole value, so the credential itself is written into no
    # file. Every other key the definition carries is kept, and the definition
    # is written back as JSON with its keys sorted, which is deterministic but
    # not the authored text byte for byte: numbers are read as double-precision
    # values, and <, > and & are written as \u escapes, all of which Langflow
    # reads as the same JSON. With no tools connection the definition is
    # written as authored. Three things outside the flow can still change what
    # a node reaches: a server of the same name stored in Langflow's settings,
    # a header of the same name written in the node's own Headers field, and
    # global variables a run's request supplies each take precedence over what
    # is written here.
    #
    # The walk from a node to the server it names is held in two places on
    # purpose: here, where it rewrites the flow, and in core/ai-agent/langflow's
    # assertion tools_connections_reach_the_flow, where it checks the flow and
    # the connections against each other — every connection named by a node,
    # every node naming a connection, and no node a connection reaches keeping
    # a configuration that starts a server of its own. The check has to hold
    # before any Recipe binds, whichever Recipe renders the component, and a
    # Component's assertion imports no library; the rewrite needs the address
    # each tool publishes, which an assertion does not read. So neither can
    # stand in for the other, and both read a node the same way: the nodes
    # listed under data.nodes, each carrying its mcp_server field under
    # data.node.template, whose value names the server as a name alone or as an
    # object carrying a name. A change to how a node names its server is made
    # in both. The assertion has already halted every mismatch when this
    # bundle renders, so the bundle checks nothing about the flow itself.
    #
    # What the importing Recipe delivers. The variables a node's header names
    # are delivered by the importing Recipe's workload, which a bundle cannot
    # write: the credential as AGGREGA_TOOL_<ALIAS>_CREDENTIAL and, under
    # Authorization, AGGREGA_TOOL_<ALIAS>_AUTHORIZATION, each named for the
    # alias upper-cased with every character other than a letter or a digit an
    # underscore, as this bundle names them, with the name each header carries
    # listed in LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT.
    #
    # How the flow reaches the platform. The importing Recipe chooses through
    # the local flow_file_delivery. With config_map the bundle emits a
    # ConfigMap carrying the flow under the key flow.json, which a workload
    # mounting the ConfigMap as the flows directory reads as one file in it.
    # The ConfigMap carries the namespace the Release, or else the Aggregate, declares for the
    # component through the aggrega.ai/namespace annotation, as the
    # component's own workload does, and none where it declares none, because
    # the pod mounts it by name and a name resolves only in the pod's own
    # namespace. With compose_config it emits one compose config carrying the
    # flow, which the compose target delivers as one file at the path the
    # workload mounts it at. Compose reads a $ in a config's content as the
    # start of a variable of its own, so there every $ of the flow is written
    # as $$, the compose file's spelling of a literal $, and the platform reads
    # the flow as written. Any other value, or none, stops the build.
    #
    # What the importing Recipe declares. Its workload mounts what this bundle
    # emits by name, so it declares that name as a local, and the bundle stops
    # the build, naming the local, when it is missing or differs from its own.
    # With config_map it declares flow_file_config_map_suffix (-flow): the
    # ConfigMap is named after the name the Recipe's provider gives the
    # component, followed by that suffix, and since a local cannot read that
    # name, the Recipe composes the two where it names the ConfigMap. With
    # compose_config it declares flow_file_config_name, the config's name (the
    # instance name followed by -flow).
    #
    # The template reads the importing Recipe's context: .values.flow_definition
    # from the Component, .context.uses for the tools connections and what each
    # tool publishes, .context.instance_id, and, with config_map,
    # .context.rendered_name and .context.annotations.release, and the locals
    # listed above. It checks every local before it writes anything, whether or
    # not a definition is set, because a local the importing Recipe does not
    # declare reads as empty here rather than stopping the build, and a name
    # that differs on the two sides would leave a workload mounting a flow
    # nothing emits.
    FlowFile:
      langflow-flow.yaml: |
        {{- /* The values this bundle shares with the Recipe importing it. Each has its home here, and the importing
          Recipe restates it as a local because its own workload, which this bundle cannot write, reads it too. A
          local the Recipe does not declare reads as empty here, so each is checked before anything is written:
          absent, or not the value below, and the build stops naming it. */}}
        {{- $bundle := "LangflowFlow#/artifacts/FlowFile" }}
        {{- $mapSuffix := "-flow" }}
        {{- $configName := printf "%s-flow" .context.instance_id }}
        {{- $have := "" }}
        {{- /* How the flow reaches the importing Recipe's workload, which that Recipe chooses because its workload
          mounts it: "config_map", a ConfigMap, for a Kubernetes target; or "compose_config", a compose config, for the
          compose target. Any other value stops the build. */}}
        {{- $have = optional .locals "flow_file_delivery" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local flow_file_delivery, which takes \"config_map\" or \"compose_config\": whether this bundle delivers the Langflow flow as a ConfigMap, for a Kubernetes target, or as a compose config, for the compose target; declare it as one of the two" $bundle) }}
        {{- else if not (has $have (list "config_map" "compose_config")) }}
        {{- fail (printf "the Recipe importing %s declares the local flow_file_delivery as %q, but it takes \"config_map\" or \"compose_config\": whether this bundle delivers the Langflow flow as a ConfigMap, for a Kubernetes target, or as a compose config, for the compose target; declare it as one of the two" $bundle $have) }}
        {{- end }}
        {{- $compose := eq $have "compose_config" }}
        {{- /* The name the importing Recipe's workload mounts the flow by: the compose config's, or the ConfigMap's.
          The ConfigMap is named after the name the Recipe's provider gives the component, which a local cannot read,
          so the Recipe declares the part after it and composes the two where it names the ConfigMap. */}}
        {{- if $compose }}
        {{- $have = optional .locals "flow_file_config_name" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local flow_file_config_name, which is the name of the compose config its workload mounts the Langflow flow from, which this bundle emits; declare it as %q" $bundle $configName) }}
        {{- else if ne $have $configName }}
        {{- fail (printf "the Recipe importing %s declares the local flow_file_config_name as %q, but that local is the name of the compose config its workload mounts the Langflow flow from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $configName $configName) }}
        {{- end }}
        {{- else }}
        {{- $have = optional .locals "flow_file_config_map_suffix" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local flow_file_config_map_suffix, which follows the component's rendered name in the name of the ConfigMap its workload mounts the Langflow flow from, which this bundle emits; declare it as %q" $bundle $mapSuffix) }}
        {{- else if ne $have $mapSuffix }}
        {{- fail (printf "the Recipe importing %s declares the local flow_file_config_map_suffix as %q, but that local follows the component's rendered name in the name of the ConfigMap its workload mounts the Langflow flow from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $mapSuffix $mapSuffix) }}
        {{- end }}
        {{- if not .context.rendered_name }}
        {{- fail (printf "the Recipe importing %s declares the local flow_file_delivery as \"config_map\", but its provider reports no rendered name for %q, and the ConfigMap is named after it; declare \"compose_config\" on the compose target, or import this bundle from a Recipe whose provider names the component" $bundle .context.instance_id) }}
        {{- end }}
        {{- end }}
        {{- if .values.flow_definition }}
        {{- $definition := .values.flow_definition }}
        {{- /* The tools connections, by alias. With none, the definition is written as authored. */}}
        {{- $tools := dict }}
        {{- range $alias, $edge := .context.uses }}
        {{- if eq $edge.socket "tools" }}
        {{- $_ := set $tools $alias $edge }}
        {{- end }}
        {{- end }}
        {{- if $tools }}
        {{- $flow := fromJson $definition }}
        {{- range $node := optional (optional $flow "data" dict) "nodes" list }}
        {{- $field := $node }}
        {{- range $key := list "data" "node" "template" "mcp_server" }}
        {{- if kindIs "map" $field }}{{ $field = optional $field $key dict }}{{ else }}{{ $field = dict }}{{ end }}
        {{- end }}
        {{- if kindIs "map" $field }}
        {{- $value := optional $field "value" "" }}
        {{- $server := "" }}
        {{- if kindIs "string" $value }}{{ $server = $value }}{{ else if kindIs "map" $value }}{{ $name := optional $value "name" "" }}{{ if kindIs "string" $name }}{{ $server = $name }}{{ end }}{{ end }}
        {{- if and $server (hasKey $tools $server) }}
        {{- $edge := index $tools $server }}
        {{- if not (kindIs "map" $value) }}
        {{- $value = dict "name" $server }}
        {{- $_ := set $field "value" $value }}
        {{- end }}
        {{- $config := optional $value "config" dict }}
        {{- if not (kindIs "map" $config) }}{{ $config = dict }}{{ end }}
        {{- $_ := set $value "config" $config }}
        {{- $_ := set $config "url" $edge.provides.endpoint }}
        {{- if hasKey (default dict $edge.features) "credential" }}
        {{- $header := optional $edge.provides "credential_header" "" }}
        {{- /* Under Authorization the header's value is Bearer and the credential, which the importing Recipe
          delivers whole in a variable of its own; under any other header it is the credential itself. */}}
        {{- $held := "CREDENTIAL" }}
        {{- if eq (lower $header) "authorization" }}{{ $held = "AUTHORIZATION" }}{{ end }}
        {{- $variable := printf "AGGREGA_TOOL_%s_%s" (regexReplaceAll "[^A-Z0-9]" (upper $server) "_") $held }}
        {{- $headers := optional $config "headers" dict }}
        {{- if kindIs "slice" $headers }}
        {{- $kept := list }}
        {{- range $item := $headers }}{{ if not (and (kindIs "map" $item) (eq (lower (toString (optional $item "key" ""))) (lower $header))) }}{{ $kept = append $kept $item }}{{ end }}{{ end }}
        {{- $headers = append $kept (dict "key" $header "value" $variable) }}
        {{- else }}
        {{- if not (kindIs "map" $headers) }}{{ $headers = dict }}{{ end }}
        {{- range $name := keys $headers | sortAlpha }}{{ if eq (lower $name) (lower $header) }}{{ $_ := unset $headers $name }}{{ end }}{{ end }}
        {{- $_ := set $headers $header $variable }}
        {{- end }}
        {{- $_ := set $config "headers" $headers }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- $definition = toJson $flow }}
        {{- end }}
        {{- /* The envelope the importing Recipe chose: a compose config's content, with every $ doubled, or a
          ConfigMap key. */}}
        {{- if $compose }}
        configs:
          {{ $configName }}:
            content: |
        {{ $definition | replace "$" "$$" | indent 6 }}
        {{- else }}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: {{ .context.rendered_name }}{{ $mapSuffix }}
          {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
          namespace: "{{ . }}"
          {{- end }}
        data:
          flow.json: |
        {{ $definition | indent 6 }}
        {{- end }}
        {{- end }}
