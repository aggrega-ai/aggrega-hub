apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: LiteLLMGuard
  version: 1.0.0
  description: >
    The request guard and the path allowlist a LiteLLM proxy runs behind, as
    one bundle every Recipe running that proxy imports, so the text that stops
    a caller changing where the proxy sends a request, or with which
    credential, lives here once.

    RequestGuard carries two texts. A module the proxy loads as a callback
    forwards only the request fields the proxy declares for the route, the keys
    the proxy adds on it and any the Release names in
    infra.admitted_request_fields, and refuses every other field with an error
    naming it; the fields that would re-target or re-key a call are refused even
    where the proxy declares them, and a Release admitting one stops the build.
    An nginx configuration on infra.port forwards only the routes the module
    checks, the model listing, the health routes, key management and, where
    the importing Recipe turns them on, the organization routes, and answers
    every other path 403. With the Component's values.metrics_enabled true it
    also listens on port 9090, forwarding a GET of /metrics alone to the
    proxy's own metrics listener on its loopback address, port 9091, with no
    caller check.

    The importing Recipe picks the delivery with the local
    request_guard_delivery — config_map, one ConfigMap for a Kubernetes target,
    or compose_configs, two compose configs — and declares as locals the names,
    the address and the ports it shares with the bundle, which stops the build
    when one is missing or differs. A Feature's realization can make the module
    refuse more by writing a policy into the proxy's callback settings; a
    policy only tightens. The bundle is authored against LiteLLM v1.103.1.
spec:
  artifacts:
    # The bundle. The request guard and the path allowlist a LiteLLM proxy runs
    # behind, as one bundle every Recipe running that proxy imports. Together
    # they are what stops a caller of the proxy from changing where it sends a
    # request or with which credential, so the text that draws that line lives
    # here once, rather than as a copy in each Recipe that a later edit could
    # leave behind.
    #
    # One file holding both texts: the module and the reverse proxy's
    # configuration are only meaningful together, and a Recipe that imports the
    # bundle gets both or neither. The file is one ConfigMap or one compose
    # fragment declaring two configs, as the importing Recipe's
    # request_guard_delivery names, and the two texts are written once below and
    # wrapped by whichever envelope is chosen, so neither target carries a copy.
    #
    # RequestGuard carries two texts. The first is a module the proxy loads as a
    # callback: on every request it forwards only the request fields the proxy
    # itself declares for the route the request took, the keys the proxy adds
    # to a request on that route, and any the Release names in
    # infra.admitted_request_fields, and it refuses every other field with an
    # error naming it, forwarding nothing. The fields that would let a caller
    # re-target or re-key a call are refused even where the proxy declares them,
    # and a Release naming one of them in infra.admitted_request_fields stops
    # the build, naming the field. A request naming one of the identity fields
    # the proxy sets itself on every request — the hash of the key it verified,
    # that key's team and organization, and the end user — in a metadata mapping
    # the proxy did not fill is refused the same way, naming the field as the
    # caller wrote it, such as metadata.user_api_key: the proxy fills one of a
    # request's two metadata mappings by route and leaves the other to the
    # caller, and the gateway's semantic cache keeps its replies apart by those
    # fields, reading the caller's mapping first on the responses and messages
    # routes. The proxy removes every one of them but the key's hash from both
    # mappings before the module sees a request, so a request naming the team,
    # the organization or the end user field is answered without it, and
    # metadata.user_api_key is the field a caller is refused for in practice;
    # the module checks all four, so a proxy that stopped removing them would
    # see them refused rather than read. The second text configures an nginx
    # reverse proxy that listens on infra.port in front of the LiteLLM proxy:
    # it forwards only the routes the module checks, the model listing, the
    # health routes and key management, and, where the importing Recipe turns
    # them on, the routes that create, read, update and delete an organization;
    # every other path is answered 403 with nothing forwarded.
    #
    # The proxy's metrics. With the importing Component's values.metrics_enabled
    # true, the importing Recipe starts the proxy with its Prometheus callback
    # and its own metrics listener, which binds to the proxy's address, the
    # loopback one, on gateway_metrics_port (9091) and checks no key. The nginx
    # configuration then carries a second server, on metrics_port (9090) on
    # every interface, that forwards a GET of /metrics, matched exactly as the
    # caller sent it, to that listener as /metrics/, the path it answers
    # without redirecting; every other request, the listener's health route
    # included, is answered 403 with nothing forwarded. So the proxy stays on
    # the loopback address and the allowlist stays the one way in. A caller
    # reaching the metrics port is asked for no key, and the metrics name the
    # hashed keys, key aliases and user emails the proxy attributes spend to.
    # The bundle stops the build, naming infra.port, when infra.port or the
    # gateway port after it is one of the two metrics ports, since no two
    # listeners share a port. With the value false nothing of this is written.
    #
    # The module reads each route's field list, and the identity fields, from
    # the proxy when it loads, so a list that cannot be read stops the proxy
    # from starting. The bundle is authored against LiteLLM v1.103.1.
    #
    # How the two texts reach the workload. The importing Recipe chooses through
    # the local request_guard_delivery. With config_map the bundle emits one
    # ConfigMap carrying both as files, for a Kubernetes target. With
    # compose_configs it emits two compose configs, one per text, for the
    # compose target, which delivers a config as one file at the path it is
    # mounted at. Compose reads a $ in a config's content as the start of a
    # variable of its own, so there each literal $ of the two texts is written
    # as $$, the compose file's spelling of a literal $. Either way the workload
    # receives the same two texts. Any other value, or none, stops the build.
    #
    # What the importing Recipe declares. The importing Recipe runs both. It
    # registers the module under litellm_settings.callbacks, mounts the module
    # into the proxy's container and the reverse proxy's configuration into the
    # reverse proxy's, starts the proxy on the loopback address and the reverse
    # proxy on this configuration. Those are its own configuration and
    # workload, which a bundle cannot write, so it declares as locals the values
    # they share with this bundle, and the bundle stops the build, naming the
    # local, when one is missing or differs from its own. Every importing
    # Recipe declares request_filter_module (request_field_filter),
    # gateway_address (127.0.0.1), gateway_port (the port after infra.port,
    # or the one before it when infra.port is 65535), metrics_port (9090), the
    # port its published metrics address, the allowlist's container port and
    # its Service read, and gateway_metrics_port (9091), the port its proxy's
    # metrics listener is started on; it declares the two metrics ports
    # whatever values.metrics_enabled says. With config_map it also
    # declares path_allowlist_file (path-allowlist.conf), the file the
    # ConfigMap carries the reverse proxy's configuration as, and
    # request_guard_config_map_name (the instance name followed by
    # -request-guard). With compose_configs it declares
    # request_guard_module_config_name and request_guard_allowlist_config_name
    # instead, the names of the two configs (the instance name followed by
    # -request-guard-module and by -request-guard-allowlist); the file each is
    # mounted as is the Recipe's own. It also declares
    # forward_organization_routes, "true" or "false", choosing whether the
    # organization routes are forwarded; any other value stops the build.
    # LiteLLM v1.103.1 serves those routes only under an enterprise licence and
    # answers them 403 without one, so a Recipe running its open-source image
    # declares "false". The
    # importing Component declares infra.port, and
    # infra.admitted_request_fields where a Release may admit further fields.
    #
    # The template reads the importing Recipe's context: .infra.port,
    # .infra.admitted_request_fields and .values.metrics_enabled from the
    # Component, .context.instance_id, and the locals listed above. It checks
    # every local before it writes anything, because a local the importing
    # Recipe does not declare
    # reads as empty here rather than stopping the build, and a module name, a
    # file name, a config name or a port that differs on the two sides would
    # leave a proxy that loads no guard, a reverse proxy with no configuration,
    # or one forwarding to a port nothing listens on.
    RequestGuard:
      # Policies a Feature's realization writes. A Feature's realization can
      # make the module refuse more, as data rather than as a hook of its own:
      # it writes one or more policies into the proxy's callback settings, under
      # the module's name, or under the module's name followed by a dot and a
      # name of the realization's own, so that one attachment's policy never
      # replaces another's. A policy only tightens: it never admits a field the
      # module refuses. Its keys are served_request_types, the request types
      # served, every other refused (chat completions are acompletion,
      # completions atext_completion, embeddings aembedding, responses
      # aresponses, messages anthropic_messages, and image_generation,
      # moderation, transcription and rerank the rest); served_fields, the
      # top-level fields a request may carry besides the ones the proxy itself
      # adds on its route; served_parts, the kinds of part a request's
      # conversation may carry, a kind being a part's type followed by its
      # source's type where it has one, a chat turn's own field as message. and
      # the field's name, a responses input item as item. and its type, and a
      # prompt or input written as token numbers as tokens; served_tools, the
      # types of tool a request may declare, a messages-route tool of the
      # caller's own reading as client; refuse_fields, fields refused by name;
      # refuse_streamed, the request types on which a request asking for a
      # streamed reply is refused; max_streamed_choices, the most choices a
      # streamed request may ask for; refuse_output_modalities, output
      # modalities a request may not ask for; and reason, the clause each
      # refusal gives as the policy's purpose. A key a policy leaves out
      # restricts nothing. A request a policy refuses is answered with HTTP 400
      # saying why and what to change, and nothing is forwarded; a policy
      # carrying a key the module does not know, or a value of another shape,
      # refuses every request with HTTP 500 until it is corrected.
      request-guard.yaml: |
        {{- /* The values this bundle shares with the Recipe importing it. Each has its home here, as a constant or
          computed from the Component's infra.port, and the importing Recipe restates it as a local because its own
          configuration and workload, which this bundle cannot write, read it too. A local the Recipe does not declare
          reads as empty here, so each is checked before anything is written: absent, or not the value below, and the
          build stops naming it. */}}
        {{- $bundle := "LiteLLMGuard#/artifacts/RequestGuard" }}
        {{- $module := "request_field_filter" }}
        {{- $allowlistFile := "path-allowlist.conf" }}
        {{- $address := "127.0.0.1" }}
        {{- $port := add1 (int .infra.port) }}
        {{- if eq (int .infra.port) 65535 }}{{ $port = 65534 }}{{ end }}
        {{- /* The two ports of the proxy's metrics, used while the importing Component's values.metrics_enabled is
          true: the one the path allowlist serves them on, on every interface, and the one the proxy serves them on, on
          its loopback address, where the allowlist forwards a scrape. */}}
        {{- $metricsPort := "9090" }}
        {{- $gatewayMetricsPort := "9091" }}
        {{- $configMapName := printf "%s-request-guard" .context.instance_id }}
        {{- $moduleConfigName := printf "%s-request-guard-module" .context.instance_id }}
        {{- $allowlistConfigName := printf "%s-request-guard-allowlist" .context.instance_id }}
        {{- $have := "" }}
        {{- /* How the two texts reach the importing Recipe's workload, which that Recipe chooses because its workload
          mounts them: "config_map", one ConfigMap carrying both as files, for a Kubernetes target; or
          "compose_configs", two compose configs, one per text, for the compose target, which delivers a config as one
          file at the path it is mounted at. Any other value stops the build. */}}
        {{- $have = optional .locals "request_guard_delivery" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local request_guard_delivery, which takes \"config_map\" or \"compose_configs\": whether this bundle delivers the request guard and the path allowlist's configuration as one ConfigMap, for a Kubernetes target, or as two compose configs, one per file, for the compose target; declare it as one of the two" $bundle) }}
        {{- else if not (has $have (list "config_map" "compose_configs")) }}
        {{- fail (printf "the Recipe importing %s declares the local request_guard_delivery as %q, but it takes \"config_map\" or \"compose_configs\": whether this bundle delivers the request guard and the path allowlist's configuration as one ConfigMap, for a Kubernetes target, or as two compose configs, one per file, for the compose target; declare it as one of the two" $bundle $have) }}
        {{- end }}
        {{- $compose := eq $have "compose_configs" }}
        {{- $have = optional .locals "request_filter_module" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local request_filter_module, which is the module name its configuration registers under litellm_settings.callbacks and this bundle delivers the request guard under; declare it as %q" $bundle $module) }}
        {{- else if ne $have $module }}
        {{- fail (printf "the Recipe importing %s declares the local request_filter_module as %q, but that local is the module name its configuration registers under litellm_settings.callbacks and this bundle delivers the request guard under, and this bundle's side of it is %q; declare it as %q" $bundle $have $module $module) }}
        {{- end }}
        {{- /* The file name the ConfigMap carries the allowlist's configuration as. A compose config has no file name
          of its own, the path it is mounted at being the Recipe's, so only the ConfigMap delivery shares one. */}}
        {{- if not $compose }}
        {{- $have = optional .locals "path_allowlist_file" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local path_allowlist_file, which is the file name its path allowlist container is pointed at and this bundle delivers the allowlist's configuration under; declare it as %q" $bundle $allowlistFile) }}
        {{- else if ne $have $allowlistFile }}
        {{- fail (printf "the Recipe importing %s declares the local path_allowlist_file as %q, but that local is the file name its path allowlist container is pointed at and this bundle delivers the allowlist's configuration under, and this bundle's side of it is %q; declare it as %q" $bundle $have $allowlistFile $allowlistFile) }}
        {{- end }}
        {{- end }}
        {{- $have = optional .locals "gateway_address" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local gateway_address, which is the address its gateway listens on and the path allowlist forwards to; declare it as %q" $bundle $address) }}
        {{- else if ne $have $address }}
        {{- fail (printf "the Recipe importing %s declares the local gateway_address as %q, but that local is the address its gateway listens on and the path allowlist forwards to, and this bundle's side of it is %q; declare it as %q" $bundle $have $address $address) }}
        {{- end }}
        {{- $have = optional .locals "gateway_port" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local gateway_port, which is the port its gateway listens on and the path allowlist forwards to, the one after infra.port or the one before it when infra.port is 65535; declare it as %q" $bundle (toString $port)) }}
        {{- else if ne $have (toString $port) }}
        {{- fail (printf "the Recipe importing %s declares the local gateway_port as %q, but that local is the port its gateway listens on and the path allowlist forwards to, the one after infra.port or the one before it when infra.port is 65535, and this bundle's side of it is %q; declare it as %q" $bundle $have (toString $port) (toString $port)) }}
        {{- end }}
        {{- /* The two metrics ports. The importing Recipe's provides, container ports and Service read the first, and its
          gateway's listen arguments the second, so both are declared whatever values.metrics_enabled says. */}}
        {{- $have = optional .locals "metrics_port" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local metrics_port, which is the port its path allowlist serves the gateway's metrics on while values.metrics_enabled is true, the port its published metrics address names; declare it as %q" $bundle $metricsPort) }}
        {{- else if ne $have $metricsPort }}
        {{- fail (printf "the Recipe importing %s declares the local metrics_port as %q, but that local is the port its path allowlist serves the gateway's metrics on while values.metrics_enabled is true, the port its published metrics address names, and this bundle's side of it is %q; declare it as %q" $bundle $have $metricsPort $metricsPort) }}
        {{- end }}
        {{- $have = optional .locals "gateway_metrics_port" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local gateway_metrics_port, which is the port its gateway serves its metrics on, on its loopback address, while values.metrics_enabled is true, and the path allowlist forwards a scrape to; declare it as %q" $bundle $gatewayMetricsPort) }}
        {{- else if ne $have $gatewayMetricsPort }}
        {{- fail (printf "the Recipe importing %s declares the local gateway_metrics_port as %q, but that local is the port its gateway serves its metrics on, on its loopback address, while values.metrics_enabled is true, and the path allowlist forwards a scrape to, and this bundle's side of it is %q; declare it as %q" $bundle $have $gatewayMetricsPort $gatewayMetricsPort) }}
        {{- end }}
        {{- /* While values.metrics_enabled is true the two metrics ports are listeners beside infra.port and the gateway's
          port after it, and no two listeners share a port: so a Release whose infra.port, or the port after it, is
          one of them stops the build here, naming infra.port. */}}
        {{- $metrics := optional .values "metrics_enabled" false }}
        {{- if $metrics }}
        {{- $metricsPorts := list $metricsPort $gatewayMetricsPort }}
        {{- if or (has (toString (int .infra.port)) $metricsPorts) (has (toString $port) $metricsPorts) }}
        {{- fail (printf "%q sets infra.port to %s and values.metrics_enabled to true, but the gateway's metrics are served on ports %s and %s, and infra.port or the port the gateway listens on beside it, %s, would be one of them, while no two listeners can share a port; set infra.port to another port" .context.instance_id (toString (int .infra.port)) $metricsPort $gatewayMetricsPort (toString $port)) }}
        {{- end }}
        {{- end }}
        {{- /* The names the importing Recipe's workload mounts what this bundle emits by: the ConfigMap's, or the two
          compose configs'. */}}
        {{- if $compose }}
        {{- $have = optional .locals "request_guard_module_config_name" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local request_guard_module_config_name, which is the name of the compose config its workload mounts the request guard from, which this bundle emits; declare it as %q" $bundle $moduleConfigName) }}
        {{- else if ne $have $moduleConfigName }}
        {{- fail (printf "the Recipe importing %s declares the local request_guard_module_config_name as %q, but that local is the name of the compose config its workload mounts the request guard from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $moduleConfigName $moduleConfigName) }}
        {{- end }}
        {{- $have = optional .locals "request_guard_allowlist_config_name" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local request_guard_allowlist_config_name, which is the name of the compose config its workload mounts the path allowlist's configuration from, which this bundle emits; declare it as %q" $bundle $allowlistConfigName) }}
        {{- else if ne $have $allowlistConfigName }}
        {{- fail (printf "the Recipe importing %s declares the local request_guard_allowlist_config_name as %q, but that local is the name of the compose config its workload mounts the path allowlist's configuration from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $allowlistConfigName $allowlistConfigName) }}
        {{- end }}
        {{- else }}
        {{- $have = optional .locals "request_guard_config_map_name" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local request_guard_config_map_name, which is the name of the ConfigMap its workload mounts, which this bundle emits; declare it as %q" $bundle $configMapName) }}
        {{- else if ne $have $configMapName }}
        {{- fail (printf "the Recipe importing %s declares the local request_guard_config_map_name as %q, but that local is the name of the ConfigMap its workload mounts, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $configMapName $configMapName) }}
        {{- end }}
        {{- end }}
        {{- /* Whether the path allowlist forwards the routes that create, read, update and delete an organization. The
          importing Recipe chooses, "true" or "false"; any other value stops the build. */}}
        {{- $have = optional .locals "forward_organization_routes" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local forward_organization_routes, which takes \"true\" or \"false\": whether the path allowlist forwards the routes that create, read, update and delete an organization; declare it as one of the two" $bundle) }}
        {{- else if not (has $have (list "true" "false")) }}
        {{- fail (printf "the Recipe importing %s declares the local forward_organization_routes as %q, but it takes \"true\" or \"false\": whether the path allowlist forwards the routes that create, read, update and delete an organization; declare it as one of the two" $bundle $have) }}
        {{- end }}
        {{- $organizations := eq $have "true" }}
        {{- /* The one home of the request fields the guard refuses even where LiteLLM declares them for the route: each
          re-targets a call, re-keys it, re-routes it, re-prices it, or carries an arbitrary field to the model server
          behind the gateway. The module below renders it into its deny set, and the check after it reads the same
          list, so a field a Release admits and a field the guard refuses are checked against one source. */}}
        {{- $deny := list "additional_drop_params" "api_base" "api_key" "api_version" "base_url" "configurable_clientside_auth_params" "custom_llm_provider" "default_headers" "deployment_id" "extra_body" "extra_headers" "fallbacks" "guardrails" "headers" "litellm_credential_name" "max_retries" "mock_response" "model_list" "num_retries" "organization" "request_timeout" "tags" "use_litellm_proxy" }}
        {{- /* Every other field LiteLLM declares for a route is forwarded, so a field a LiteLLM release declares is
          judged against the criterion above before this bundle is authored against that release. These are forwarded
          on that judgement, each with what it does, so the judgement is not taken again:
          - include_server_side_tool_invocations, on chat completions: a switch only LiteLLM's Gemini providers read,
            which then keep the server-side search tools a request declares beside its own functions instead of
            dropping them, and set includeServerSideToolInvocations in the request they send. It names no address,
            credential, upstream target, retry or price; the tools it acts on arrive in tools and web_search_options,
            which are forwarded anyway; and for a provider that does not take it LiteLLM refuses the request.
          - prompt_cache_options, on responses: the mode and the retention of the provider's prompt cache for the
            request's own prompt, the same kind of setting as prompt_cache_key and prompt_cache_retention, which are
            forwarded. LiteLLM passes it to the provider as sent and reads it only to choose how to mark that prompt
            for the provider's cache; it names no address, credential, upstream target, retry or price, and it is one
            setting the provider defines, unlike extra_body, which passes fields of the caller's own choosing to the
            provider. */}}
        {{- /* The request fields the Release admits on top of each route's own, from infra.admitted_request_fields. It
          widens what a caller may send and must not re-open what the guard refuses on every Release, so a field the
          deny set names stops the build, naming the field, rather than being admitted. */}}
        {{- $admitted := optional .infra "admitted_request_fields" list }}
        {{- range $field := $admitted }}
        {{- if has $field $deny }}
        {{- fail (printf "infra.admitted_request_fields names %q, which the gateway refuses on every Release because it lets a caller change where a request is sent or with which credential; admit only fields that are safe to forward, and remove %q" $field $field) }}
        {{- end }}
        {{- end }}
        {{- /* One path segment of a model name or a key in a route below: it opens with a letter or a digit, so no
          segment is a dot segment, and it carries no percent sign, so nothing in it is decoded further on. */}}
        {{- $segment := "[A-Za-z0-9][A-Za-z0-9._:@+~-]*" -}}
        {{- /* How a literal dollar sign is written in the two texts. Compose reads a $ anywhere in the file it is given,
          a config's content included, as the start of a variable of its own, and a compose file spells a literal $ as
          $$, while a ConfigMap carries its data as written. So each literal $ of both texts, and each field name the
          module is given from a list, is written through $dollar, which is $ in a ConfigMap and $$ in a compose
          config, and the workload receives the same text on either delivery. A $ added to either text is written
          through $dollar too. */}}
        {{- $dollar := "$" }}
        {{- if $compose }}{{ $dollar = "$$" }}{{ end }}
        {{- /* The envelope. Each text below is written once and wrapped by the envelope the importing Recipe chose:
          a ConfigMap key or a compose config's content. Both are block scalars holding the text at one indentation,
          so in the compose fragment each config's content key sits one column deeper than its name, the shallowest
          place a block scalar of that indentation can hang from; the compose target reads the fragment's configs and
          writes them into the compose file, so that column reaches no emitted byte. */ -}}
        {{- if $compose -}}
        configs:
          {{ $moduleConfigName }}:
           content: |
        {{- else -}}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: {{ $configMapName }}
        data:
          {{ $module }}.py: |
        {{- end }}
            """Refuse a request field the gateway was not configured to forward.

            Mounted beside the gateway's configuration and registered on every Release
            as the first entry of litellm_settings.callbacks, so it runs before any hook
            that reads the body. On every request it forwards only the fields LiteLLM
            itself declares for the route the request took, the keys the proxy adds to a
            request on that route while processing it, and any the Release admits; every
            other field is refused with HTTP 400 naming it, and nothing is forwarded. This
            is what stops a caller changing where the gateway sends a request or with which
            credential: a request-body model_list, api_key, extra_body,
            additional_drop_params, fallbacks or an unknown field is refused rather than
            passed on, so a caller cannot send a provider key of its own. The fields the
            gateway refuses are read from the one deny set the bundle carrying it holds;
            further fields the Release names in infra.admitted_request_fields are admitted
            on every route. A request naming, in a metadata mapping the gateway did not
            fill, one of the identity fields the gateway sets itself on every request — the
            hash of the key it verified, that key's team and organization, and the end user
            — is refused the same way, naming the field; the gateway itself removes every
            one of them but the key's hash before this hook runs. So a caller cannot name
            another key's identity where the gateway reads it. The refusal is checked at the
            pre-call hook, where a caller's field is visible as a caller's field, and again
            at the per-deployment hook that sees fallbacks, as defence in depth. Every list
            this reads from LiteLLM is read when the module loads, so a list that cannot be
            read stops the gateway from starting rather than letting it serve with a
            narrower or a wider guard.

            A policy an attachment's realization writes into this module's settings refuses
            more, and never admits a field refused here: it can name the request types
            served, the fields and the kinds of conversation part and tool a request may
            carry, the request types whose streamed requests are refused, the most choices a
            streamed request may ask for, and output modalities refused. A request a policy
            refuses is answered with HTTP 400 saying why and what to change, and nothing is
            forwarded; a policy this module cannot read refuses every request with HTTP 500.
            """
            import inspect

            import litellm
            from fastapi import HTTPException
            from litellm.caching.caching import Cache
            from litellm.integrations.custom_logger import CustomLogger
            from litellm.proxy._types import UserAPIKeyAuth
            from litellm.types.llms.anthropic import ANTHROPIC_API_HEADERS, AnthropicMessagesRequest
            from litellm.types.llms.openai import ResponsesAPIOptionalRequestParams

            # The fields refused even where LiteLLM declares them for the route, rendered
            # from the bundle's single home for the set, so this guard and the check
            # that keeps them out of the admitted list refuse the same fields.
            DENY = frozenset([{{ range $i, $f := $deny }}{{ if $i }}, {{ end }}{{ $f | toJson | replace "$" $dollar }}{{ end }}])

            # The fields the Release admits on top of each route's own, from
            # infra.admitted_request_fields. Empty unless the Release sets it, and a field
            # in the deny set never reaches here — the bundle halts the build on one.
            ADMITTED = frozenset([{{ range $i, $f := $admitted }}{{ if $i }}, {{ end }}{{ $f | toJson | replace "$" $dollar }}{{ end }}])

            # The identity fields the proxy sets on every request: the hash of the key the
            # caller presented, that key's team and organization, and the end user it took
            # from the request. The gateway's semantic cache keeps its replies apart by
            # them, reading each from the request's metadata first and its
            # litellm_metadata second, so a caller writing one of them into a mapping the
            # proxy did not fill would be served the replies kept for whatever it named.
            # Read from LiteLLM's cache when the module loads.
            IDENTITY_FIELDS = frozenset(Cache._SEMANTIC_CACHE_TENANT_SCOPE_FIELDS) | frozenset(
                [Cache._SEMANTIC_CACHE_END_USER_SCOPE_FIELD]
            )

            # Where the proxy writes those fields. It fills one of the request's two
            # metadata mappings, metadata or litellm_metadata, the one its route uses, and
            # strips every user_api_key_ field a caller sent from both, so the bare
            # user_api_key a caller writes into the other mapping is what reaches this
            # hook: on the responses and messages routes the proxy fills litellm_metadata
            # and leaves the caller's metadata beside it, while on the others no second
            # mapping remains. Beside the identity fields the proxy places the verified
            # key's own record under this name, an object no request body can carry, so
            # the mapping holding it is the proxy's and any other is the caller's.
            KEY_RECORD = "user_api_key_auth"

            # One key the proxy adds on every route is a caller-injection vector under the
            # same name, so it is neither admitted nor refused by name:
            # provider_specific_header. When a request arrives with the anthropic-version
            # header the official Anthropic client always sends, the proxy folds that
            # protocol header into data["provider_specific_header"], overwriting any body
            # value, and its extra_headers then carry only the protocol headers the proxy
            # itself forwards — safe, and the Anthropic client's default request depends on
            # it. But a caller can also put provider_specific_header in the request body,
            # and on a request without that header the proxy leaves it, so its
            # extra_headers reach the upstream verbatim: a header-injection path. So on
            # every route this key passes only when its extra_headers carry nothing but
            # those protocol headers, read from the same LiteLLM set the proxy folds them
            # from; anything else is refused like any other field a caller was not
            # configured to send.
            PROVIDER_SPECIFIC_HEADER = "provider_specific_header"


            def _provider_specific_header_is_proxys(value):
                # True only for the shape the proxy synthesizes: a mapping whose extra_headers
                # name nothing but the proxy's own protocol headers. A caller-supplied value
                # carrying any other header returns False and is refused.
                if not isinstance(value, dict):
                    return False
                extra = value.get("extra_headers")
                if extra is None:
                    return True
                if not isinstance(extra, dict):
                    return False
                safe = {h.lower() for h in ANTHROPIC_API_HEADERS}
                return all(isinstance(k, str) and k.lower() in safe for k in extra)


            # The key a further policy is written into this module under, as data rather
            # than as a second hook: a FeatureRecipe writes callback_settings.<this name>,
            # or callback_settings.<this name>.<a name of its own>, through the
            # gateway-config pipeline step; LiteLLM loads callback_settings at start-up,
            # and this module reads every such member in _policies. A member of its own
            # per writer keeps one writer from replacing another's policy, because the
            # step replaces a member it rewrites whole. It is this callback's own name, so
            # only this one refusal hook is ever registered.
            POLICY_KEY = "{{ $module }}"

            # The request types a policy names, as a caller reads them.
            ROUTE_NAMES = {
                "acompletion": "chat completions",
                "atext_completion": "completions",
                "aembedding": "embeddings",
                "aresponses": "responses",
                "anthropic_messages": "messages",
                "image_generation": "image generation",
                "moderation": "moderation",
                "transcription": "transcription",
                "rerank": "rerank",
            }

            # The keys a policy may carry whose value is a list of names. A policy may also
            # carry max_streamed_choices, a whole number of at least one, and reason, the
            # clause its refusals give as its purpose. A key absent from a policy restricts
            # nothing; a key this module does not know, or a value of another shape, refuses
            # every request, because a policy that cannot be read must not pass for one that
            # restricts nothing.
            _LIST_KEYS = frozenset([
                "refuse_fields", "served_request_types", "served_fields", "served_parts", "served_tools",
                "refuse_streamed", "refuse_output_modalities",
            ])

            POLICY_UNREADABLE = (
                "This gateway is configured with a request policy it cannot read, so it refuses "
                "every request until that configuration is corrected."
            )

            UNKNOWN_CALL_TYPE = (
                "This gateway forwards only the request types it is configured for and does "
                "not recognise this one, so the request is refused. Use the chat "
                "completions, completions, embeddings, responses, messages, image, "
                "moderation, transcription or rerank route."
            )


            def _declared(fn):
                # The named parameters of one of LiteLLM's own entry points. The async entry
                # points are (*args, **kwargs) wrappers that declare nothing, so each route
                # reads its sync function.
                return frozenset(p.name for p in inspect.signature(fn).parameters.values()
                                 if p.kind in (p.POSITIONAL_OR_KEYWORD, p.KEYWORD_ONLY))


            def _keys(typed_request):
                # The fields a typed request object of LiteLLM's declares. The responses and
                # messages payload fields travel in these rather than as parameters.
                return frozenset(typed_request.__annotations__)


            # Every request type the gateway serves, keyed by the name the proxy hands this
            # hook for it, each with two sets. The first is the fields LiteLLM declares for
            # that route, read from LiteLLM itself. The second is the keys the proxy adds to
            # a request on that route before this hook sees it — the call's own
            # bookkeeping, the request as it arrived, and on some routes a field it
            # synthesizes. LiteLLM declares these nowhere they could be read from, so each
            # set is the one observed on that route of the pinned proxy, streamed and not;
            # refusing one would refuse a request the gateway itself shaped, and a key the
            # proxy adds on one route is not admitted on another. A request type absent
            # from this table is refused: a route the guard cannot vet is where an
            # unchecked field would slip through.
            _ROUTES = {
                "acompletion": (
                    # On a streamed request the proxy asks the model for its usage itself,
                    # writing stream_options and a flag telling it to strip that usage from
                    # the reply before the caller sees it.
                    frozenset(litellm.OPENAI_CHAT_COMPLETION_PARAMS) | _declared(litellm.completion),
                    frozenset(["_litellm_strip_stream_usage", "litellm_call_id", "litellm_logging_obj", "metadata", "proxy_server_request", "secret_fields", "stream_options"]),
                ),
                "atext_completion": (
                    _declared(litellm.text_completion),
                    frozenset(["litellm_call_id", "litellm_logging_obj", "metadata", "proxy_server_request", "secret_fields"]),
                ),
                "aembedding": (
                    _declared(litellm.embedding),
                    frozenset(["litellm_call_id", "litellm_logging_obj", "metadata", "proxy_server_request", "secret_fields"]),
                ),
                "aresponses": (
                    _declared(litellm.responses) | _keys(ResponsesAPIOptionalRequestParams),
                    frozenset(["litellm_call_id", "litellm_logging_obj", "litellm_metadata", "proxy_server_request", "secret_fields"]),
                ),
                "anthropic_messages": (
                    _declared(litellm.anthropic_messages) | _keys(AnthropicMessagesRequest),
                    frozenset(["litellm_call_id", "litellm_logging_obj", "litellm_metadata", "proxy_server_request", "secret_fields"]),
                ),
                "image_generation": (
                    # The proxy writes an image request's prompt into messages for the
                    # hooks, and turns it back into the prompt before the call is made.
                    _declared(litellm.image_generation),
                    frozenset(["litellm_call_id", "messages", "metadata", "proxy_server_request", "secret_fields"]),
                ),
                "moderation": (
                    _declared(litellm.moderation),
                    frozenset(["litellm_call_id", "metadata", "proxy_server_request", "secret_fields"]),
                ),
                "transcription": (
                    # The proxy names the user of the key it verified here when that key
                    # has one.
                    _declared(litellm.transcription),
                    frozenset(["litellm_call_id", "metadata", "proxy_server_request", "secret_fields", "user"]),
                ),
                "rerank": (
                    _declared(litellm.rerank),
                    frozenset(["litellm_call_id", "metadata", "proxy_server_request", "secret_fields"]),
                ),
            }

            # What each route forwards, computed once when the module loads.
            _ALLOWED = {
                name: (declared | added | ADMITTED) - DENY
                for name, (declared, added) in _ROUTES.items()
            }


            def _canonical(call_type):
                name = str(call_type)
                if "." in name:
                    name = name.rsplit(".", 1)[-1]
                return name


            def _allowed(call_type):
                return _ALLOWED.get(_canonical(call_type))


            def _readable(policy):
                if not isinstance(policy, dict):
                    raise HTTPException(status_code=500, detail=POLICY_UNREADABLE)
                for key, value in policy.items():
                    if key in _LIST_KEYS:
                        ok = isinstance(value, list) and all(isinstance(v, str) for v in value)
                    elif key == "max_streamed_choices":
                        ok = isinstance(value, int) and not isinstance(value, bool) and value >= 1
                    elif key == "reason":
                        ok = isinstance(value, str) and bool(value.strip())
                    else:
                        ok = False
                    if not ok:
                        raise HTTPException(status_code=500, detail=POLICY_UNREADABLE)
                return policy


            def _policies():
                # A further policy is data, never a second hook: a FeatureRecipe writes
                # callback_settings.<POLICY_KEY>, or callback_settings.<POLICY_KEY>.<its own
                # name>, as a mapping carrying a policies list, through the gateway-config
                # step; LiteLLM loads it into litellm.callback_settings at start-up, and this
                # reads every such member, in the order of their names. Each policy only
                # tightens what the gateway forwards: it refuses more, and never admits a
                # field the always-on allowlist refuses.
                settings = getattr(litellm, "callback_settings", None)
                if not isinstance(settings, dict):
                    return []
                found = []
                for key in sorted(k for k in settings if isinstance(k, str) and (k == POLICY_KEY or k.startswith(POLICY_KEY + "."))):
                    member = settings[key]
                    policies = member.get("policies") if isinstance(member, dict) else None
                    if not isinstance(policies, list):
                        raise HTTPException(status_code=500, detail=POLICY_UNREADABLE)
                    found += [_readable(policy) for policy in policies]
                return found


            def _part_kinds(part, kinds):
                # What a part of a conversation is: its type, followed by its source's type
                # where it carries a source that has one (an image or a document on the
                # messages route). A part carrying citations or annotations of an earlier
                # reply adds a kind for them. A tool result's own parts, on the messages
                # route, and a function call's output parts, on the responses route, are
                # parts too.
                if not isinstance(part, dict) or not isinstance(part.get("type"), str):
                    kinds.add("untyped")
                    return
                kind = part["type"]
                source = part.get("source")
                if isinstance(source, dict) and isinstance(source.get("type"), str):
                    kind += "." + source["type"]
                kinds.add(kind)
                for extra in ("citations", "annotations"):
                    if isinstance(part.get(extra), list) and part.get(extra):
                        kinds.add(part["type"] + "." + extra)
                for nested in ("content", "output"):
                    inner = part.get(nested) if part["type"] in ("tool_result", "function_call_output") else None
                    for inner_part in inner if isinstance(inner, list) else []:
                        _part_kinds(inner_part, kinds)


            def _conversation_kinds(data, route):
                # Every kind of part a request's conversation carries, where its route puts
                # them: a chat or messages turn's content parts, and a chat turn's fields
                # beyond its role and content as message.<field>; the messages route's
                # system blocks; a responses input's items as item.<type>, and the parts of
                # its messages and of its function call outputs; a responses prompt's
                # variables that are parts; a chat prediction's parts; and a completions
                # prompt or an embeddings input written as token numbers, as tokens.
                kinds = set()
                for message in data.get("messages") or [] if route in ("acompletion", "anthropic_messages") else []:
                    if not isinstance(message, dict):
                        kinds.add("message.untyped")
                        continue
                    for key, value in message.items():
                        if key not in ("role", "content") and value is not None and value != "" and value != [] and value != {}:
                            kinds.add("message." + str(key))
                    content = message.get("content")
                    if isinstance(content, list):
                        for part in content:
                            _part_kinds(part, kinds)
                    elif content is not None and not isinstance(content, str):
                        kinds.add("content.untyped")
                if route == "anthropic_messages":
                    system = data.get("system")
                    if isinstance(system, list):
                        for part in system:
                            _part_kinds(part, kinds)
                    elif system is not None and not isinstance(system, str):
                        kinds.add("system.untyped")
                if route == "aresponses":
                    items = data.get("input")
                    for item in items if isinstance(items, list) else []:
                        if not isinstance(item, dict):
                            kinds.add("item.untyped")
                            continue
                        item_type = item.get("type") or ("message" if "role" in item else "untyped")
                        kinds.add("item." + str(item_type))
                        inner = item.get("content") if item_type == "message" else item.get("output") if item_type == "function_call_output" else None
                        for part in inner if isinstance(inner, list) else []:
                            _part_kinds(part, kinds)
                    if items is not None and not isinstance(items, (str, list)):
                        kinds.add("input.untyped")
                    instructions = data.get("instructions")
                    if instructions is not None and not isinstance(instructions, str):
                        kinds.add("instructions.untyped")
                    prompt = data.get("prompt")
                    variables = prompt.get("variables") if isinstance(prompt, dict) else None
                    for value in variables.values() if isinstance(variables, dict) else []:
                        if isinstance(value, dict):
                            _part_kinds(value, kinds)
                if route == "acompletion":
                    prediction = data.get("prediction")
                    content = prediction.get("content") if isinstance(prediction, dict) else None
                    for part in content if isinstance(content, list) else []:
                        _part_kinds(part, kinds)
                if route in ("atext_completion", "aembedding"):
                    text = data.get("prompt" if route == "atext_completion" else "input")
                    for value in text if isinstance(text, list) else [text]:
                        if value is not None and not isinstance(value, str):
                            kinds.add("tokens")
                return kinds


            def _tool_kinds(data, route):
                # The type of each tool a request declares; a messages-route tool declaring no
                # type, or "custom", is the caller's own tool and reads as client.
                kinds = set()
                for tool in data.get("tools") or []:
                    tool_type = tool.get("type") if isinstance(tool, dict) else None
                    if route == "anthropic_messages" and tool_type in (None, "custom"):
                        kinds.add("client")
                    else:
                        kinds.add(tool_type if isinstance(tool_type, str) else "untyped")
                return kinds


            def _listed(names):
                names = list(names)
                return names[0] if len(names) == 1 else ", ".join(names[:-1]) + " and " + names[-1]


            def _policy_refusal(data, call_type):
                # The first refusal a policy makes of this request, as the message it is
                # answered with, or None when every policy serves it.
                route = _canonical(call_type)
                name = ROUTE_NAMES.get(route, route)
                added = _ROUTES[route][1] if route in _ROUTES else frozenset()
                streamed = data.get("stream") is True
                for policy in _policies():
                    why = "This gateway " + policy.get("reason", "applies a policy to the requests it forwards") + ", and "
                    served = policy.get("served_request_types")
                    if served is not None and route not in served:
                        return (why + "it does not serve " + name + " requests while it does, so the request was not "
                                "forwarded. It serves " + _listed(ROUTE_NAMES.get(r, r) for r in served) + " requests.")
                    fields = {key for key in policy.get("refuse_fields", []) if key in data}
                    served = policy.get("served_fields")
                    if served is not None:
                        fields |= {key for key in data if key not in served and key not in added and key != PROVIDER_SPECIFIC_HEADER}
                    if fields:
                        named = ", ".join(sorted(fields))
                        return (why + "it does not forward a request carrying " + named + " while it does, so the "
                                "request was not forwarded. Remove: " + named + ".")
                    served = policy.get("served_parts")
                    if served is not None:
                        parts = sorted(_conversation_kinds(data, route) - set(served))
                        if parts:
                            return (why + "it does not forward a request whose conversation carries parts of these "
                                    "kinds while it does: " + ", ".join(parts) + ", so the request was not forwarded. "
                                    "Remove them. A kind is a part's type, followed by its source's type where it has "
                                    "one; message.<field> is a field of a chat turn, and item.<type> an item of a "
                                    "responses input.")
                    served = policy.get("served_tools")
                    if served is not None:
                        tools = sorted(_tool_kinds(data, route) - set(served))
                        if tools:
                            return (why + "it does not forward a request declaring tools of these types while it does: "
                                    + ", ".join(tools) + ", so the request was not forwarded. Remove them.")
                    if streamed and route in policy.get("refuse_streamed", []):
                        return (why + "it does not stream the reply to a " + name + " request while it does, so the "
                                "request was not forwarded. Send it with stream set to false, or without stream, to "
                                "receive the whole reply in one piece.")
                    limit = policy.get("max_streamed_choices")
                    choices = data.get("n")
                    if streamed and limit is not None and choices is not None and not (
                        isinstance(choices, int) and not isinstance(choices, bool) and choices <= limit
                    ):
                        return (why + "it streams at most " + str(limit) + " choice" + ("" if limit == 1 else "s") +
                                " of a reply while it does, so the request was not forwarded. Send it with n set to " +
                                str(limit) + ", or without stream.")
                    # The outputs a request asks for, as the proxy hands them to this hook: a list
                    # of names, or one name written as a string, which asks for that one output.
                    # A value of any other shape names no output this guard can read, so while the
                    # policy refuses an output it refuses such a request too, rather than forward
                    # what it could not read. A null asks for nothing: the proxy drops it.
                    refusing = policy.get("refuse_output_modalities", [])
                    modalities = data.get("modalities")
                    if isinstance(modalities, str):
                        modalities = [modalities]
                    if refusing and modalities is not None and not (
                        isinstance(modalities, list) and all(isinstance(m, str) for m in modalities)
                    ):
                        return (why + "it does not forward a request whose modalities it cannot read while it does: "
                                "modalities is neither a name nor a list of names, so the request was not forwarded. "
                                "Write modalities as a list of names, such as [\"text\"].")
                    refused = [m for m in refusing if isinstance(modalities, list) and m in modalities]
                    if refused:
                        return (why + "it does not return " + _listed(refused) + " output while it does, so the request "
                                "was not forwarded. Remove " + _listed(refused) + " from modalities.")
                return None


            def _identity_fields_sent(data):
                # The identity fields a request carries in a metadata mapping the proxy did
                # not fill, each named as the caller wrote it, such as metadata.user_api_key.
                # A mapping holding the verified key's record is the proxy's and passes. Were
                # neither to hold it, both would be read as the caller's and every identity
                # field in them refused, so a proxy that stopped placing the record would
                # refuse requests rather than let a caller's field through.
                named = []
                for mapping_name in ("metadata", "litellm_metadata"):
                    mapping = data.get(mapping_name)
                    if not isinstance(mapping, dict) or isinstance(mapping.get(KEY_RECORD), UserAPIKeyAuth):
                        continue
                    named += [mapping_name + "." + field for field in IDENTITY_FIELDS if field in mapping]
                return named


            def _refuse(fields):
                named = ", ".join(sorted(set(fields)))
                raise HTTPException(
                    status_code=400,
                    detail=(
                        "This gateway forwards only the request fields it is configured for, "
                        "and refuses the rest rather than dropping them, so the request was "
                        "not forwarded. Remove: " + named + "."
                    ),
                )


            class RequestFieldFilter(CustomLogger):
                async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                    if not isinstance(data, dict):
                        return data
                    allowed = _allowed(call_type)
                    if allowed is None:
                        raise HTTPException(status_code=400, detail=UNKNOWN_CALL_TYPE)
                    refused = []
                    for key in data:
                        if key == PROVIDER_SPECIFIC_HEADER:
                            if _provider_specific_header_is_proxys(data[key]):
                                continue
                        elif key in allowed:
                            continue
                        refused.append(key)
                    refused += _identity_fields_sent(data)
                    if refused:
                        _refuse(refused)
                    refusal = _policy_refusal(data, call_type)
                    if refusal is not None:
                        raise HTTPException(status_code=400, detail=refusal)
                    return data

                async def async_pre_call_deployment_hook(self, kwargs, call_type):
                    # Defence in depth. The pre-call hook above is the site that refuses a
                    # caller's field, where it is still visible as the caller's. By the time
                    # a call reaches this per-deployment hook the gateway's own resolved
                    # credential and the routing table's own target are present, and a caller
                    # cannot reach an upstream through this hook without first passing the
                    # pre-call hook. A caller-shaped routing field surviving to here would
                    # mean that check was bypassed, so it is refused rather than forwarded.
                    if isinstance(kwargs, dict):
                        surviving = [key for key in ("model_list", "fallbacks") if key in kwargs]
                        if surviving:
                            _refuse(surviving)
                    return kwargs


            filter = RequestFieldFilter()
        {{- if $compose }}
          {{ $allowlistConfigName }}:
           content: |
        {{- else }}
          {{ $allowlistFile }}: |
        {{- end }}
            # The path allowlist in front of the gateway. The gateway listens on its
            # loopback address inside the pod only; this reverse proxy listens on the
            # port callers reach and forwards a request only when its method and path
            # are one of the routes the gateway serves, listed below. It matches the
            # request target exactly as the caller sent it, which is also exactly what
            # it forwards, so no encoded character, dot segment, doubled slash or change
            # of letter case can make a refused path look like an allowed one. Every
            # other request is answered 403 and nothing of it is forwarded.
            worker_processes 1;
            error_log /dev/stderr notice;
            events {
                worker_connections 4096;
            }
            http {
                access_log /dev/stdout;
                server_tokens off;
                map "{{ $dollar }}request_method {{ $dollar }}request_uri" {{ $dollar }}gateway_route {
                    default 0;
                    # The request types the gateway's request guard checks, each in
                    # the spellings the gateway serves whatever the model alias: chat
                    # completions, completions, embeddings, responses, messages, image
                    # generation, moderation, transcription and rerank. A spelling
                    # that carries the model name in its path, as the engine-style and
                    # Azure-style paths do, is not among them: there the proxy reads
                    # words in the path, the alias included, to decide how it records
                    # a request, so the guard would serve some alias names and refuse
                    # others.
                    "~^(POST|OPTIONS) /(v1/)?chat/completions(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /cursor/chat/completions(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/)?completions(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/)?embeddings(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/|openai/v1/)?responses(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /v1/messages(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/)?images/generations(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/)?moderations(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/)?audio/transcriptions(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v1/|v2/)?rerank(\?|{{ $dollar }})" 1;
                    # The model listing of the OpenAI-compatible API, and one model's
                    # entry in it. Neither calls an upstream.
                    "~^(GET|OPTIONS) /(v1/)?models(/{{ $segment }})?(\?|{{ $dollar }})" 1;
                    # Key management, which the gateway guards with its administrative
                    # key and keeps in its bookkeeping database. None calls an upstream.
                    "~^(GET|OPTIONS) /key/(info|list|aliases)(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /key/(generate|service-account/generate|update|bulk_update|delete|regenerate|block|unblock)(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /key/{{ $segment }}/(regenerate|reset_spend)(\?|{{ $dollar }})" 1;
                    "~^(POST|OPTIONS) /(v2/key/info|team/key/bulk_update)(\?|{{ $dollar }})" 1;
            {{- if $organizations }}
                    # Creating, reading, updating and deleting an organization, which a
                    # key naming an organization needs, since the organization must
                    # exist before a key can name it. The gateway answers these to its
                    # administrative key, and reading also to an administrator of that
                    # organization; none calls an upstream. The listing of
                    # organizations is not forwarded, because the gateway answers it
                    # for other keys too.
                    "~^(POST|OPTIONS) /organization/new(\?|{{ $dollar }})" 1;
                    "~^(GET|OPTIONS) /organization/info(\?|{{ $dollar }})" 1;
                    "~^(PATCH|OPTIONS) /organization/update(\?|{{ $dollar }})" 1;
                    "~^(DELETE|OPTIONS) /organization/delete(\?|{{ $dollar }})" 1;
            {{- end }}
                    # The health routes the pod's readiness probe and its operators read.
                    "~^(GET|OPTIONS) /health/(readiness|liveliness)(\?|{{ $dollar }})" 1;
                }
            {{- if $metrics }}
                # The one request the metrics listener below forwards: a GET of
                # /metrics, with or without a query, matched exactly as the
                # caller sent it, as the routes above are.
                map "{{ $dollar }}request_method {{ $dollar }}request_uri" {{ $dollar }}metrics_route {
                    default 0;
                    "~^GET /metrics(\?|{{ $dollar }})" 1;
                }
            {{- end }}
                server {
                    listen {{ .infra.port }};
                    # What is forwarded passes as it arrived: header names carrying an
                    # underscore are kept, no body size is imposed, a request body and a
                    # streamed reply are passed on as they are read rather than held,
                    # and a reply is waited for as long as the gateway itself waits for
                    # its upstream by default. The Host header is the caller's, so an
                    # address the gateway composes from the request is the one the
                    # caller used.
                    underscores_in_headers on;
                    client_max_body_size 0;
                    default_type application/json;
                    location / {
                        if ({{ $dollar }}gateway_route = 0) {
                            return 403 '{"error": {"message": "This gateway serves its model routes, the model listing, its health checks{{ if $organizations }}, key management and the creating, reading, updating and deleting of organizations{{ else }} and key management{{ end }}, and refuses every other path, the rest of its administrative routes included, without forwarding it.", "type": "invalid_request_error", "param": null, "code": "path_not_served"} }';
                        }
                        proxy_pass http://{{ $address }}:{{ $port }};
                        proxy_http_version 1.1;
                        proxy_set_header Host {{ $dollar }}http_host;
                        proxy_pass_header Server;
                        proxy_redirect off;
                        proxy_request_buffering off;
                        proxy_buffering off;
                        proxy_read_timeout 6000s;
                        proxy_send_timeout 6000s;
                    }
                }
            {{- if $metrics }}
                # The gateway's metrics. The gateway serves them on a listener of
                # its own on its loopback address, which checks no caller. This
                # server listens on the metrics port on every interface and
                # forwards a GET of /metrics to that listener, as /metrics/, the
                # path it answers without redirecting, and nothing else: every
                # other request, its health route included, is answered 403 with
                # nothing forwarded. No key is asked of a caller here, and the
                # metrics name the hashed keys, key aliases and user emails the
                # gateway attributes its spend to.
                server {
                    listen {{ $metricsPort }};
                    default_type application/json;
                    location / {
                        if ({{ $dollar }}metrics_route = 0) {
                            return 403 '{"error": {"message": "This port serves the metrics of the gateway behind it, to a GET of /metrics, and refuses every other request without forwarding it.", "type": "invalid_request_error", "param": null, "code": "path_not_served"} }';
                        }
                        rewrite ^ /metrics/ break;
                        proxy_pass http://{{ $address }}:{{ $gatewayMetricsPort }};
                        proxy_http_version 1.1;
                        proxy_redirect off;
                    }
                }
            {{- end }}
            }
