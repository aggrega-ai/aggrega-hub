        {{- if not $guardBase }}{{ fail "core/prompt-injection-shield is attached to the gateway, but nothing is wired to its guard socket, so its model map would be sent to no guard; wire a core/security/nemo-guardrails to the guard socket" }}{{ end }}
        {{- if $wired }}{{ fail (printf "core/prompt-injection-shield is attached to the gateway, which sends its model map to the guard, but its models socket holds %s, whose entries would be sent to each model's own endpoint past the guard; remove those connections, or the shield attachment" (join ", " $wired)) }}{{ end }}
