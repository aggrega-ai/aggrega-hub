apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: LiteLLMGatewayConfig
  version: 1.0.0
  description: >
    The configuration a LiteLLM gateway runs on, as one bundle every Recipe
    realizing core/gateway/litellm imports, so the routing table and the code
    several Features rely on live here once rather than as a copy in each
    Recipe.

    GatewayConfig is one ConfigMap, named after the gateway's rendered name
    followed by -config, or on Docker Compose one compose config per file.
    Its first file is the gateway's configuration: the
    model map, from the hand-typed entries of values.models and the models
    wired to the models socket, the registration of the request guard the
    LiteLLMGuard bundle delivers, and the settings values.metrics_enabled and
    values.log_masking turn on. Beside it, as the attachments and values ask,
    it carries the caller-identity hook core/context-propagation relies on, the
    masking module core/data-masking's guardrails are loaded from, and the
    log-masking module values.log_masking relies on. While
    core/prompt-injection-shield is attached every map entry is sent to the
    guard on the guard socket, and while core/concurrency-limit is attached
    every entry carries its cap. A Feature's realization writes the rest into
    the configuration through the gateway's pipeline step.

    The importing Recipe consumes the bundle under the key
    litellm-gateway-config, the directory its one file, configmap.yaml, is
    rendered in, and declares as locals the file, module, class and variable
    names the configuration and its workload share; the bundle stops the
    build naming any local it reads that the Recipe does not declare. The
    modules rest on the proxy's internals, so each importing Recipe states the
    LiteLLM releases they are proven at and halts on any other.
  # The pipeline step runs on Kubernetes alone. On Docker Compose this bundle
  # writes core/prompt-deny-patterns and core/fallback-chain itself, from the
  # attachments, as the template below states.
spec:
  artifacts:
    # The bundle. The gateway's configuration and the modules delivered beside
    # it, as one bundle every Recipe realizing core/gateway/litellm imports.
    # Every Feature realized on this gateway relies on what the configuration
    # holds, and most write into it, so the text the gateway runs on lives here
    # once, rather than as a copy in each Recipe that a later edit could leave
    # behind.
    #
    # The gateway's routing table. Every hand-typed entry of values.models
    # becomes one published alias and the upstream target it resolves to; then
    # every connection on the models socket becomes one more, published under
    # the connection's alias, in alias order. This body is the reason the
    # component's capability label is true of what is rendered rather than only
    # of what is authored: a reader of this artifact can see the models the
    # gateway serves.
    #
    # The body declares no router_settings section. The proxy's router
    # settings are what attachments write — the routing strategy
    # core/target-selection sets, the retry count core/retry-policy sets, the
    # fallbacks core/fallback-chain sets — and the step that writes them adds
    # the section, after the rest of the body, when the body has none. With
    # none attached the proxy's router takes its own defaults, and picks among
    # entries that publish the same alias at random. An empty section is not
    # written in its place, because the proxy reads an empty section as no
    # value at all, and its router-settings route then fails reading it.
    #
    # A wired entry is written from what its model publishes: the model name,
    # as the entry's model, and the endpoint, as its api_base — strings piped
    # through, never resolved. Its notation follows its credential. With a
    # credential on the connection, the entry is written openai/<model> and
    # names the variable the importing Recipe's workload delivers that
    # credential under, so the proxy presents it to the model; with none, it is
    # written hosted_vllm/<model>, the proxy's notation for an OpenAI-API server
    # it reaches presenting no credential, because an openai/ entry with no key
    # is refused by the proxy on every request. A wired entry never names
    # provider_key's variable. The component's own assertions have already
    # halted the build on a wired model that does not speak the OpenAI API, on
    # an alias a connection and values.models both publish, and on a managed
    # model reached with no credential and no unauthenticated: true. With no
    # entry in values.models and nothing on the models socket, this body halts
    # the build, naming the gateway, since its table would hold no model; that
    # check is here rather than among the component's assertions because
    # validating a Recipe that imports this bundle on its own places the
    # component in a build that wires no connection and gives it no values.
    #
    # The body is rendered as a ConfigMap beside the gateway's Deployment, and
    # that ConfigMap is where the realization earns the gateway's capability:
    # the rendered artifact shows which models the gateway serves rather than
    # leaving it to the running process to reveal. The importing Recipe's proxy
    # container reads that file through the --config flag.
    #
    # No credential value appears here. Each upstream credential is named
    # through the proxy's own environment indirection — an entry carries the
    # variable name and the runtime reads the value from the environment — and
    # the administrative key is not named here at all, because the proxy reads
    # its variable directly from the environment at startup. A hand-typed entry
    # names provider_key's variable and a wired entry its own connection's,
    # rather than carrying the credential, which is what keeps every credential
    # inside the gateway and out of the calling application.
    #
    # While a core/context-propagation attachment is present, the same ConfigMap
    # also carries the caller-identity hook as a second data key, and the body
    # registers it under litellm_settings.callbacks. The importing Recipe mounts
    # the whole ConfigMap as the directory the proxy is pointed at, and the
    # proxy loads a module its configuration names from the directory that
    # configuration sits in, so the file lands where it is looked for. The hook
    # sends the identity to the aliases every such attachment lists in
    # infra.destinations. With no such attachment, neither the registration nor
    # the file is emitted. The hook is the one that attachment's realization
    # relies on, it is registered after the guard, and what it does is stated
    # on that realization.
    #
    # While a core/data-masking attachment lists entities or patterns, the
    # ConfigMap carries the masking module the attachment's realization names
    # in its guardrail entries. The realization decides the same condition from
    # the same attachment to write its entries, because the choice of file here
    # cannot be handed to it; should the two ever disagree, it fails closed: an
    # entry naming a module absent here stops the gateway from starting. What
    # the attachment refuses before forwarding is not a hook of that module's:
    # the realization writes it as a policy into the request guard's settings.
    # With no such attachment, the module is not emitted. The module is a
    # further file beside the configuration, the one that attachment's
    # guardrails are loaded from, and what it does is stated on that
    # realization. What such an attachment refuses before a request is
    # forwarded — request types, fields, parts, tools, streamed requests and
    # output options its masking does not reach — is refused by the request
    # guard, from that policy, so the guard stays the one hook that refuses.
    #
    # While values.log_masking lists entities or patterns, the ConfigMap
    # carries the log-masking module, and the body registers the module's
    # failure callback right after the request guard and writes the one
    # guardrail entry that loads its class and two settings:
    # redact_messages_in_exceptions under litellm_settings, the entry under
    # guardrails, and disable_error_logs under general_settings. The module,
    # the registration, the entry and the settings are decided from the one
    # value in this one template, so none can be emitted without the others.
    # They are written here rather than by a pipeline step of the importing
    # Recipe's own: the step that writes this gateway's configuration edits the
    # body a host component renders, and a Recipe's own step has no host. A
    # step an attachment runs afterwards writes into the same sections, beside
    # these. With the value listing nothing, none of them is emitted.
    #
    # The entry. Its name is the gateway's instance name followed by
    # .log-masking. A step writing the guardrails section replaces an entry
    # carrying the name of one it writes, and every entry an attachment's
    # realization writes here is named from the gateway's instance name
    # followed by a hyphen, so none of them can take this entry's name and
    # replace it, whatever an attachment is called. mode logging_only is the
    # gateway's own mode for a guardrail that runs where a finished call is
    # handed to its logs and nowhere else, and the class keeps to it whatever
    # an entry names, so nothing it does reaches a request or a reply.
    # default_on runs it on every call, where without it the entry runs only
    # for a call that names it, so a caller cannot switch it off from the
    # request, a request asking to disable the gateway's always-on guardrails
    # included; an administrator
    # can exempt a key or a team from the gateway's always-on guardrails in
    # that key's or team's own settings. Each pattern and each entity type is
    # written as a JSON string, so its backslashes and quotes reach the
    # gateway exactly as authored.
    #
    # What is masked. The copies of a successful call the gateway hands to its
    # logs are the messages, the standard logging payload's messages and
    # reply, a streamed reply as assembled, the request and reply as the
    # provider saw them, the request the spend logs keep, and the reply each
    # logging integration receives. In each, the class masks the text a
    # caller or a model wrote: the text of messages, prompts and inputs and of
    # their parts, tool-call arguments and tool results, a system prompt or
    # instructions, reasoning and thinking, a refusal, and a reply's text and
    # output. Patterns are matched by the gateway's content filter, with no
    # other service, ignoring letter case, and every match is replaced for
    # good by the pattern's name in capitals in brackets,
    # [PROJECT_CODE_REDACTED] for a pattern named project_code; the gateway
    # compiles each expression when it starts, and one that does not compile
    # stops it starting. Entity types are then found and replaced by the
    # recognizers. Tool-call arguments are masked as one text, so the names of
    # their keys are masked as well, and a match spanning the JSON around a
    # value can leave a logged copy no longer valid JSON. The words that say
    # what a part is, the identifiers that tie parts together and parts that
    # are not text, an image, a file or audio, pass as they are. Each copy is
    # replaced by a masked copy: nothing the call holds is changed, so the
    # request the provider receives and the reply the caller is answered with
    # are exactly as they would be without the value.
    #
    # What is not masked. The copies are masked where a finished call is
    # handed to the logs, so the gateway's debug output and its printing of
    # the logging payload, which the importing Recipe turns on neither of, are
    # not masked. A request's metadata, its user field, tool definitions and
    # headers are logged as sent.
    #
    # When a copy cannot be masked, because a recognizer cannot be reached or
    # answers with an error among other reasons, no copy is handed on masked
    # in part: the class builds every copy again with each text it would have
    # masked replaced by [TEXT_WITHHELD], calling no recognizer, and hands
    # that record on, so each integration and the spend logs still receive the
    # call and the gateway still counts its cost against the caller's key and
    # budget. The gateway's own log records that the call's text was withheld
    # and why masking failed, naming the kind of error and no text. Only if
    # withholding fails as well is no record of the call written.
    #
    # A failed call. The gateway calls no logging guardrail for a call that
    # fails, so what it hands its logs for one is withheld rather than masked.
    # The failure callback, registered right after the request guard, is
    # handed a failed call's record before every callback after it, and puts
    # in place of each entry carrying text a copy in which every text a caller
    # or a model wrote is [TEXT_WITHHELD], matched or not, and the error's
    # text is [ERROR_TEXT_WITHHELD]; it edits nothing the call holds, so a
    # retried attempt is sent exactly as it would be without it. While the
    # module is loaded, an error line the gateway's own loggers write at
    # warning or above, carrying its exception or written for a failed call,
    # keeps the kind of error and loses its text.
    #
    # The two settings cover what that callback cannot reach, and neither
    # changes what the provider receives or what the caller is answered with.
    # disable_error_logs keeps failed calls out of the spend logs, where a
    # failed call's row would carry the error the provider returned, which can
    # quote the request: so the spend logs, and the daily spend totals per key
    # and user, per team and per tag, count successful calls only, while the
    # gateway's daily count of failed requests still counts them. These spend
    # logs are the request log core/audit-logging turns on, so beside that
    # attachment the request log keeps answered requests only: a failed or
    # refused request — a provider's error, an unreachable provider, a
    # refusal by the request guard, a key the gateway did not issue — is
    # counted in the gateway's daily request count, which names the day and
    # the route, and no row records its key, model or caller.
    # redact_messages_in_exceptions keeps the request's messages out of the
    # details the gateway attaches to an error's exception, which an
    # integration would otherwise read on a failed call's record and, for a
    # call that fails once and then succeeds, on its successful one.
    #
    # Left as it came: the exception a failed call carries, because the
    # caller's error reply is built from it, so an integration configured
    # outside the catalog can still read a provider's own error message
    # there; and an integration registered in the gateway's callbacks ahead
    # of the failure callback is handed a failed call's record before its
    # text is withheld.
    #
    # While a core/prompt-injection-shield attachment is present, every entry
    # of the model map is sent to the guard wired to the guard socket: its
    # api_base is the endpoint the guard publishes, and it presents the fixed
    # word in guard_api_key as its credential, because the guard authenticates
    # upstream with its own. The target stays as the developer wrote it, so the
    # guard is asked for the model the target names. The guard checks each chat
    # request and forwards what it admits to the model behind it; what it does
    # not admit, it answers itself, and nothing of it reaches that model. The
    # attachment's realization checks the guard and the map before any file is
    # written; with the shield attached and nothing on the guard socket this
    # body stops the build too, so the map is never written unguarded under an
    # attached shield. It stops the build as well, naming them, while the
    # shield is attached and the models socket holds a connection, because a
    # wired entry is sent to its own model's endpoint and would pass the guard
    # by. With no such attachment, no hand-typed entry carries an api_base.
    #
    # While a core/concurrency-limit attachment is present, which
    # concurrency-limit-litellm realizes and checks, every entry of the model
    # map, typed by hand and wired alike, carries the attachment's
    # max_in_flight as its max_parallel_requests: the proxy sends at most that
    # many requests to the entry at once and answers a request finding it full
    # with HTTP 429, or sends it on along the alias's fallbacks where
    # core/fallback-chain lists some. The entry's own setting is the one
    # written, rather than the router's default for every entry, because the
    # proxy ranks an entry's rpm or tpm above that default, and only the
    # entry's own max_parallel_requests above both. The proxy keeps each
    # entry's count in an in-memory cache, with no lifetime of its own, where
    # a record lapses ten minutes after it is made, and then starts a fresh
    # count at zero while the requests the old one counted are still in
    # flight. So the same attachment sets litellm_settings.default_in_memory_ttl,
    # the lifetime that cache gives a record written with none, to a century,
    # 3153600000 seconds, which keeps every count as long as the proxy runs;
    # what else that lifetime reaches, and what the realization refuses
    # because of it, is stated on concurrency-limit-litellm. This is the one
    # place the cap is written. With no such attachment, no entry carries a
    # max_parallel_requests and the lifetime is the proxy's own.
    #
    # Each of those attachments is found by its type with any version it was
    # authored with set aside, so core/context-propagation and
    # core/context-propagation:1.0.0 are both read, as are core/data-masking
    # and core/data-masking:1.0.0, core/prompt-injection-shield and
    # core/prompt-injection-shield:1.0.0, and core/concurrency-limit and
    # core/concurrency-limit:1.0.0.
    #
    # On every Release the body registers the request guard first, before any
    # hook that reads the request. Its module is not a file of this ConfigMap:
    # the LiteLLMGuard bundle, which the importing Recipe imports as well,
    # delivers it in a ConfigMap of its own, mounted at request_guard_dir
    # beside this one's directory, so the registration names the module by the
    # full path of its file there. The proxy loads a module named by a full
    # path from that path, and one named without a directory, as the other
    # hooks below are, from beside the configuration.
    #
    # While values.metrics_enabled is true the body also registers the
    # gateway's Prometheus callback, last, after the guard and the hooks above,
    # so the guard still runs first and the log-masking failure callback still
    # precedes it; it records the metrics the gateway's own metrics listener
    # serves.
    #
    # The analyzer answer check. Both masking modules this bundle delivers put
    # one check in front of the gateway's Presidio integration, bound once as
    # $analyzerAnswerCheck at the top of the file and written into whichever of
    # the two is delivered, so the two cannot accept different answers. The
    # integration fails a call when the analyzer answers with an HTTP error,
    # with a body that is not JSON, with an error object or with neither a list
    # nor an object; but it skips, with a warning, every item of a list it
    # cannot read as a detection, so a list holding only such items reads as
    # finding nothing and the text would pass on unmasked. The check accepts an
    # answer that is a list, or an object other than an error, only when every
    # item in it is a detection — an entity type, where it starts and where it
    # ends, and a score — and otherwise fails the call as the integration fails
    # it for an answer it cannot read, so a request or a reply carrying the
    # text fails rather than travel on, and a logged copy has its text
    # withheld. It wraps the one function the integration reads the analyzer's
    # answer through, for every guardrail calling the analyzer, the gateway's
    # own Presidio guardrail included, once per process however often the
    # proxy runs the module. An empty list is a legitimate answer, finding
    # nothing, and passes. It is code of the same kind as the modules, so it is
    # proven at the releases each importing Recipe lists.
    #
    # What the importing Recipe declares. The configuration names files,
    # modules, classes and variables that the importing Recipe's workload, or
    # an attachment's realization, reads as well, so the Recipe holds each as
    # a local and this bundle reads it from there. A local the Recipe does not
    # declare reads as empty here rather than stopping the build, which would
    # leave a configuration registering a module by no name, or an entry
    # naming a variable nothing delivers; so the file checks every local it
    # reads before it writes anything, and stops the build naming one the
    # Recipe does not declare. The checks at the top of the file are the list.
    #
    # The template reads the importing Recipe's context: .values and .features
    # from the component, .context.uses, .context.rendered_name and
    # .context.instance_id, and those locals.
    #
    # The bundle's one file, configmap.yaml, is the ConfigMap, or on the compose
    # target the compose fragment holding one config per file: the
    # configuration, and the log-masking module while values.log_masking lists
    # something. The importing Recipe chooses through request_guard_delivery,
    # the local the LiteLLMGuard bundle reads for the same choice, and on
    # compose declares gateway_config_name and log_masking_config_name, the
    # names its workload mounts those configs by. It is rendered in the
    # directory the importing Recipe's consumption key names.
    GatewayConfig:
      configmap.yaml: |
        {{- /* The locals this file reads, each the importing Recipe's own: a name its workload, or an attachment's
          realization, reads as well. One the Recipe does not declare reads as empty here, so each is checked before
          anything is written, and an absent or empty one stops the build naming it. */}}
        {{- $bundle := "LiteLLMGatewayConfig#/artifacts/GatewayConfig" }}
        {{- $analyzerAnswerCheck := `from litellm.exceptions import GuardrailRaisedException
        from litellm.proxy.guardrails.guardrail_hooks import presidio as _presidio_integration
        ANALYZER_ANSWER_UNREADABLE = (
            "Presidio analyzer returned invalid response; cannot verify PII when PII protection is configured: "
            "its answer holds an item that is not a detection result"
        )
        def _is_detection(item):
            # One detection as the analyzer reports it: the entity type, where it starts and ends, and a score.
            if not isinstance(item, dict) or not isinstance(item.get("entity_type"), str) or not item["entity_type"]:
                return False
            start, end, score = item.get("start"), item.get("end"), item.get("score")
            placed = all(isinstance(value, int) and not isinstance(value, bool) for value in (start, end))
            scored = isinstance(score, (int, float)) and not isinstance(score, bool)
            return placed and scored and 0 <= start <= end
        def _checked_analyzer_answer(read):
            async def checked(response):
                answer = await read(response)
                if isinstance(answer, list):
                    items = answer
                elif isinstance(answer, dict) and "error" not in answer:
                    items = [answer]
                else:
                    items = []
                if not all(_is_detection(item) for item in items):
                    raise GuardrailRaisedException(message=ANALYZER_ANSWER_UNREADABLE, should_wrap_with_default_message=False)
                return answer
            checked.checks_analyzer_answer = True
            return checked
        if not getattr(_presidio_integration._json_body, "checks_analyzer_answer", False):
            _presidio_integration._json_body = _checked_analyzer_answer(_presidio_integration._json_body)` }}
        {{- if not (optional .locals "config_file" "") }}{{ fail (printf "the Recipe importing %s does not declare the local config_file, which is the data key the gateway's configuration is carried under and the file its proxy is pointed at; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "provider_key_variable" "") }}{{ fail (printf "the Recipe importing %s does not declare the local provider_key_variable, which is the variable the hand-typed entries of the model map name for their upstream credential and the one the provider_key slot is delivered under; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "connection_key_variable_prefix" "") }}{{ fail (printf "the Recipe importing %s does not declare the local connection_key_variable_prefix, which is the fixed part before a models connection's alias in the variable its credential is delivered under and its entry names; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "connection_key_variable_suffix" "") }}{{ fail (printf "the Recipe importing %s does not declare the local connection_key_variable_suffix, which is the fixed part after a models connection's alias in the variable its credential is delivered under and its entry names; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "guard_api_key" "") }}{{ fail (printf "the Recipe importing %s does not declare the local guard_api_key, which is the word every entry of the model map presents as its credential while core/prompt-injection-shield sends it to the guard; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "request_guard_dir" "") }}{{ fail (printf "the Recipe importing %s does not declare the local request_guard_dir, which is the directory the request guard's ConfigMap is mounted at, by whose full path the configuration registers the guard; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "request_filter_module" "") }}{{ fail (printf "the Recipe importing %s does not declare the local request_filter_module, which is the module name the configuration registers the request guard under; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "caller_identity_module" "") }}{{ fail (printf "the Recipe importing %s does not declare the local caller_identity_module, which is the module the caller-identity hook is delivered as and registered under while core/context-propagation is attached; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "masking_module" "") }}{{ fail (printf "the Recipe importing %s does not declare the local masking_module, which is the module the guardrail entries core/data-masking's realization writes are loaded from; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "field_entity_masking_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local field_entity_masking_class, which is a class the masking module defines and core/data-masking's guardrail entries name; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "reply_masking_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local reply_masking_class, which is a class the masking module defines and core/data-masking's guardrail entries name; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "buffered_reply_masking_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local buffered_reply_masking_class, which is a class the masking module defines and core/data-masking's guardrail entries name; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "field_pattern_masking_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local field_pattern_masking_class, which is a class the masking module defines and core/data-masking's guardrail entries name; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "held_reply_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local held_reply_class, which is a class the masking module defines and core/data-masking's guardrail entries name; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "log_masking_module" "") }}{{ fail (printf "the Recipe importing %s does not declare the local log_masking_module, which is the module the log-masking guardrail is loaded from while values.log_masking lists something; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "log_masking_class" "") }}{{ fail (printf "the Recipe importing %s does not declare the local log_masking_class, which is the class the log-masking module defines and its guardrail entry names; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- if not (optional .locals "log_masking_failure_callback" "") }}{{ fail (printf "the Recipe importing %s does not declare the local log_masking_failure_callback, which is the callback the log-masking module defines to withhold a failed call's text and the configuration registers; declare it among the Recipe's locals" $bundle) }}{{ end }}
        {{- /* How the files reach the importing Recipe's workload: "config_map", one ConfigMap carrying every file, for a
          Kubernetes target; or "compose_configs", one compose config per file, for the compose target, which delivers a
          config as one file at the path it is mounted at. It is read from request_guard_delivery, the local the
          LiteLLMGuard bundle reads for the same choice, because both bundles land on the one target the importing
          Recipe renders for. Any other value, or none, stops the build. */}}
        {{- $delivery := optional .locals "request_guard_delivery" "" }}
        {{- if not (has $delivery (list "config_map" "compose_configs")) }}{{ fail (printf "the Recipe importing %s declares the local request_guard_delivery as %q, but it takes \"config_map\" or \"compose_configs\": whether the gateway's configuration and the modules beside it are delivered as one ConfigMap, for a Kubernetes target, or as one compose config per file, for the compose target; declare it as one of the two" $bundle $delivery) }}{{ end }}
        {{- $compose := eq $delivery "compose_configs" }}
        {{- /* A literal dollar sign in what the configuration carries from an author — a pattern, a fallback alias — is
          written through $dollar: $ in a ConfigMap, which carries its data as written, and $$ in a compose config,
          whose content Docker Compose reads a $ in as the start of a variable of its own. So the gateway reads the
          same text on either delivery. */}}
