                  api_base: {{ $edge.provides.endpoint | toJson }}
                  api_key: os.environ/{{ $.locals.connection_key_variable_prefix }}{{ regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}{{ $.locals.connection_key_variable_suffix }}
        {{- else }}
                  model: {{ printf "hosted_vllm/%s" $edge.provides.model | toJson }}
                  api_base: {{ $edge.provides.endpoint | toJson }}
        {{- end }}
        {{- with $cap }}
                  max_parallel_requests: {{ . }}
        {{- end }}
        {{- end }}
