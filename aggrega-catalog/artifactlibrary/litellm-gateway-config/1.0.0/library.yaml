                    await blocks(_field(reply, "output"))

                async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                    # Takes the place of the gateway's own masking of a streamed reply.
                    # Raised before anything is yielded, so none of the reply is sent.
                    raise HTTPException(status_code=400, detail=STREAM_REFUSED)
                    yield


            class {{ .locals.buffered_reply_masking_class }}({{ .locals.reply_masking_class }}):
                async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                    # The whole reply is held and masked as one piece, because entities are
                    # found over the whole text and a piece sent early could carry part of
                    # one. Nothing is yielded until all of it is masked, and any failure is
                    # raised before that one yield, while the gateway can still answer with
                    # an error rather than with part of a reply. An error the provider raises
                    # while the reply arrives is raised as it came, so the gateway answers
                    # with that error, and without the provider's message unless the entry
                    # sets allow_unmasked_reply_parts. Where the attachment refuses, a
                    # detected entity type is raised as the refusal it is.
                    chunks = []
                    async for chunk in response:
                        chunks.append(chunk)
                    try:
                        if not chunks:
                            return
                        whole = _assembled_reply(chunks, request_data)
                        # The gateway's own masking of an assembled reply masks its text and
                        # its tool-call arguments as one text each; the tool calls are held
                        # out of it and masked value by value instead.
                        held = []
                        for choice in whole.choices:
                            message = getattr(choice, "message", None)
                            for name in ("tool_calls", "function_call"):
                                if message is not None and getattr(message, name, None):
                                    held.append((message, name, getattr(message, name)))
                                    setattr(message, name, None)
                        await self._process_response_for_pii(response=whole, request_data=request_data, mode="mask")
                        for message, name, value in held:
                            setattr(message, name, value)
                        await self._mask_tool_calls(whole, request_data)
                        await _mask_reply_parts(whole, _masker(self, request_data), self.withholds)
                        if self.mask_reasoning:
                            await self._mask_reasoning(whole, request_data)
                        masked = convert_model_response_to_streaming(whole)
                    except (NotJson, BlockedPiiEntityError):
                        raise
                    except Exception as e:
                        raise Exception(
                            "The reply was not sent: masking it failed (" + str(e) + "), and a streamed "
                            "reply is sent only once all of it is masked."
                        ) from e
                    yield masked


            class _HeldToolCalls:
                # The tool-call parts of one choice of a streamed reply, put back together.

                def __init__(self):
                    self.calls = {}
                    self.function = None

                def add(self, delta):
                    for part in _field(delta, "tool_calls") or []:
                        index = _field(part, "index") or 0
                        call = self.calls.setdefault(index, {"id": None, "type": None, "name": None, "arguments": ""})
                        function = _field(part, "function")
                        call["id"] = call["id"] or _field(part, "id")
                        call["type"] = call["type"] or _field(part, "type")
                        call["name"] = call["name"] or _field(function, "name")
                        call["arguments"] += _field(function, "arguments") or ""
                    part = _field(delta, "function_call")
                    if part is not None:
                        if self.function is None:
                            self.function = {"name": None, "arguments": ""}
                        self.function["name"] = self.function["name"] or _field(part, "name")
                        self.function["arguments"] += _field(part, "arguments") or ""

                async def masked(self, mask):
                    # The fields of one delta carrying every held call whole, its arguments masked
                    # value by value; NotJson when any of them is not JSON.
                    fields = {}
                    if self.calls:
                        fields["tool_calls"] = []
                        for index in sorted(self.calls):
                            call = self.calls[index]
                            arguments = await _masked_json(call["arguments"], mask)
                            fields["tool_calls"].append(
                                {
                                    "index": index,
                                    "id": call["id"],
                                    "type": call["type"] or "function",
                                    "function": {"name": call["name"], "arguments": arguments},
                                }
                            )
                    if self.function is not None:
                        arguments = await _masked_json(self.function["arguments"], mask)
                        fields["function_call"] = {"name": self.function["name"], "arguments": arguments}
                    return fields


            class {{ .locals.field_pattern_masking_class }}(ContentFilterGuardrail):
                # Masks with the entry's listed patterns, through the content filter's own
                # masking of one text, what the gateway's own content filter entry beside it does
                # not read: the tool calls a request's earlier turns carry, the results of them,
                # and the request fields _mask_request_fields names; and a reply's tool calls and
                # the parts _mask_reply_parts names. That entry masks the text of the messages.
                # This class does not declare apply_guardrail itself, so the gateway hands it the
                # whole request and the whole reply.

                def __init__(self, allow_unmasked_reply_parts=False, **kwargs):
                    # allow_unmasked_reply_parts comes from the entry's own settings; only true lets
                    # what masking cannot read, and a provider's error message, through. Whether the
                    # entry refuses is read from the marks of its patterns.
                    refuses = _refuses(_field(pattern, "action") for pattern in kwargs.get("patterns") or [])
                    super().__init__(**kwargs)
                    self.withholds = _withholds(allow_unmasked_reply_parts)
                    self.refuses = refuses

                async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                    mask = _pattern_masker(self)
                    try:
                        await _mask_tool_call_arguments(data, mask)
                    except NotJson:
                        raise HTTPException(status_code=400, detail=HISTORY_NOT_JSON) from None
                    await _mask_tool_results(data, mask)
                    await _mask_request_fields(data, call_type, mask)
                    return data

                async def async_post_call_success_hook(self, data, user_api_key_dict, response):
                    try:
                        await _mask_tool_call_arguments(response, _pattern_masker(self))
                    except NotJson:
                        raise NotJson(REPLY_NOT_JSON) from None
                    await _mask_reply_parts(response, _pattern_masker(self), self.withholds)
                    return response

                async def async_post_call_failure_hook(self, request_data, original_exception, user_api_key_dict, traceback_str=None):
                    # While this entry masks replies, an error the call to the model raised
                    # reaches the caller without the message the provider returned with it,
                    # unless the entry sets allow_unmasked_reply_parts.
                    if self.withholds and self.should_run_guardrail(data=request_data or {}, event_type=GuardrailEventHooks.post_call):
                        _withhold_provider_message(original_exception, self.refuses)
                    return None

                async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                    # The content filter masks a streamed reply's text and never its tool calls, so
                    # their parts are held here: each chunk goes on without them, and when the
                    # choice they belong to finishes they are masked whole, value by value, and sent
                    # in one piece just before the chunk that finishes it. When their arguments are
                    # not JSON none of them is sent, and the stream ends with an error. The parts
                    # _mask_reply_parts names are masked in each chunk as it passes. The chunks
                    # arrive here already held whole by the entry written first for the attachment,
                    # so a reply passes as one chunk.
                    held = {}
                    async for chunk in response:
                        if isinstance(chunk, ModelResponseStream):
                            await _mask_reply_parts(chunk, _pattern_masker(self), self.withholds)
                            for choice in chunk.choices or []:
                                delta = getattr(choice, "delta", None)
                                if delta is not None and (getattr(delta, "tool_calls", None) or getattr(delta, "function_call", None)):
                                    held.setdefault(getattr(choice, "index", 0) or 0, _HeldToolCalls()).add(delta)
                                    delta.tool_calls = None
                                    delta.function_call = None
                            for choice in chunk.choices or []:
                                index = getattr(choice, "index", 0) or 0
                                if getattr(choice, "finish_reason", None) and index in held:
                                    yield await self._held_chunk(chunk, index, held.pop(index))
                        yield chunk
                    for index in sorted(held):
                        yield await self._held_chunk(None, index, held[index])

                async def _held_chunk(self, like, index, calls):
                    try:
                        fields = await calls.masked(_pattern_masker(self))
                    except NotJson:
                        raise NotJson(STREAMED_TOOL_CALLS_NOT_JSON) from None
                    return ModelResponseStream(
                        id=getattr(like, "id", None),
                        created=getattr(like, "created", None),
                        model=getattr(like, "model", None),
                        choices=[StreamingChoices(index=index, delta=Delta(**fields))],
                    )


            class {{ .locals.held_reply_class }}(CustomGuardrail):
                # Written first among the entries of an attachment masking replies by pattern, so it
                # receives a streamed chat reply as the provider sends it, before the gateway's
                # content filter. It holds every chunk until the reply has arrived and hands the
                # reply on as one chunk, its last, so the content filter and the entries after it
                # read the reply whole: no part of a match can be sent before the rest of it has
                # arrived, and where the attachment refuses, nothing of a reply carrying a match is
                # sent. It masks nothing, and acts on no request and no reply sent in one piece. A
                # reply it cannot put back together is not sent, and an error the provider raises
                # while the reply arrives is raised as it came, before any of the reply is sent.

                async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                    chunks = []
                    async for chunk in response:
                        chunks.append(chunk)
                    if not chunks:
                        return
                    try:
                        whole = _assembled_reply(chunks, request_data)
                    except Exception as e:
                        raise Exception(REPLY_NOT_HELD.format(reason=str(e))) from e
                    yield convert_model_response_to_streaming(whole)
