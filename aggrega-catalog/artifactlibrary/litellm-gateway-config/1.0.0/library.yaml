        {{- end }}
        {{- /* Compose only: one guardrail entry per core/prompt-deny-patterns attachment, the entry
          prompt-deny-patterns-litellm's step writes on a Kubernetes target. It turns on the gateway's built-in
          content filter before a request is forwarded, on every request, with one blocking rule per expression,
          named by its position in the list; each expression is written as a JSON string, its $ written through
