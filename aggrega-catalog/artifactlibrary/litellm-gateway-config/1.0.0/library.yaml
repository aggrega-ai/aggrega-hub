            litellm_settings:
        {{- if $cap }}
              default_in_memory_ttl: 3153600000
        {{- end }}
              callbacks:
                - {{ .locals.request_guard_dir }}/{{ .locals.request_filter_module }}.filter
        {{- if $logMasking }}
                - {{ .locals.log_masking_module }}.{{ .locals.log_masking_failure_callback }}
