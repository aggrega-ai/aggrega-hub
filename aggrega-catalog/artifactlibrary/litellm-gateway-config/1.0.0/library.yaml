        {{- if $identity }}
          {{ .locals.caller_identity_module }}.py: |
            """Caller identity for the requests this gateway sends upstream.

            Delivered beside the gateway's configuration and registered there under
            litellm_settings.callbacks while core/context-propagation is attached. On
            every request it removes each header whose name begins x-litellm- from the
            parts of the request body the gateway turns into upstream headers, so a
            caller cannot supply an identity of its own. On a request for a listed model
            alias it then adds the user and the team of the virtual key the gateway
            verified, and its organization where the key names one, and nothing else
            about that key. A request made with the master key names nobody and
            carries none of them.
            """
            from litellm.constants import LITELLM_PROXY_MASTER_KEY_ALIAS
            from litellm.integrations.custom_logger import CustomLogger
            from litellm.proxy._types import UserAPIKeyAuth

            # The model aliases whose upstream receives the caller's identity.
            LISTED = frozenset([{{ range $i, $alias := $listed }}{{ if $i }}, {{ end }}{{ toJson $alias }}{{ end }}])

            # The header each verified field travels under. These are the names the
            # gateway's own header forwarding uses, so a service reading them reads one
            # set of names whichever part of the gateway wrote them.
            IDENTITY = (
                ("x-litellm-user_api_key_user_id", "user_id"),
                ("x-litellm-user_api_key_team_id", "team_id"),
                ("x-litellm-user_api_key_org_id", "org_id"),
            )

            # The request fields the gateway turns into upstream headers. It merges them
            # in this order, the later winning, and provider_specific_header.extra_headers
            # over both; a model_list entry's litellm_params carries the same two.
            HEADER_FIELDS = ("headers", "extra_headers")

            # The name under which the gateway places the verified key's own record in the
            # one metadata mapping it fills for a request. A request body cannot carry that
            # object, so the mapping holding it is the gateway's and any other the caller's.
            KEY_RECORD = "user_api_key_auth"


            def _is_gateway_header(name):
                # Header names are matched loosely further on, so they are compared the
                # same way here: surrounding space trimmed, letter case ignored, and an
                # underscore read as a hyphen.
                if not isinstance(name, str):
                    return False
                return name.strip().lower().replace("_", "-").startswith("x-litellm-")


            def _without_gateway_headers(headers):
                if not isinstance(headers, dict):
                    return headers
                return dict((k, v) for k, v in headers.items() if not _is_gateway_header(k))


            def _strip(fields):
                # Each part is replaced by a filtered copy rather than edited in place, so
                # a request the gateway retries or falls back with is not changed under it.
                for key in HEADER_FIELDS:
                    if key in fields:
                        fields[key] = _without_gateway_headers(fields[key])
                specific = fields.get("provider_specific_header")
                if isinstance(specific, dict) and "extra_headers" in specific:
                    specific = dict(specific)
                    specific["extra_headers"] = _without_gateway_headers(specific["extra_headers"])
                    fields["provider_specific_header"] = specific
                entries = fields.get("model_list")
                if isinstance(entries, list):
                    for entry in entries:
                        params = entry.get("litellm_params") if isinstance(entry, dict) else None
                        if isinstance(params, dict):
                            _strip(params)


            def _listed(alias):
                return isinstance(alias, str) and alias in LISTED


            def _model_group(kwargs):
                # The alias is read only from the gateway's own mapping, the one holding the
                # key's record, and only the two top-level mappings are looked at: copies of
                # the request nested deeper hold the record too and, on a fallback, still
                # name the alias the request first asked for. Where neither holds the
                # record, no alias is read, so the call is treated as one to an alias that
                # is not listed.
                for key in ("metadata", "litellm_metadata"):
                    meta = kwargs.get(key)
                    if isinstance(meta, dict) and isinstance(meta.get(KEY_RECORD), UserAPIKeyAuth):
                        return meta.get("model_group")
                return None


            class CallerIdentity(CustomLogger):
                async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                    _strip(data)
                    if not _listed(data.get("model")):
                        return data
                    if user_api_key_dict.api_key == LITELLM_PROXY_MASTER_KEY_ALIAS:
                        return data
                    identity = []
                    for header, field in IDENTITY:
                        value = getattr(user_api_key_dict, field, None)
                        if value:
                            identity.append((header, str(value)))
                    if identity:
                        headers = data.get("headers")
                        headers = dict(headers) if isinstance(headers, dict) else {}
                        headers.update(identity)
                        data["headers"] = headers
                    return data

                async def async_pre_call_deployment_hook(self, kwargs, call_type):
                    # Runs on every call to a model, fallbacks included, after the call's
                    # model alias is known. A call to an alias that is not listed loses
                    # the identity written for the alias the request first asked for.
                    if not _listed(_model_group(kwargs)):
                        _strip(kwargs)
                    return kwargs


            hook = CallerIdentity()
        {{- end }}
        {{- if $masking }}
          {{ .locals.masking_module }}.py: |
            """Masking of the gateway's traffic by entity type and by listed pattern.

            Delivered beside the gateway's configuration while core/data-masking lists
            entity types or patterns. Every text the entity classes below mask goes
            through check_pii, the gateway's own Presidio integration's masking of one
            text, which fails the request when a recognizer cannot be reached or
            answers with an error; every text {{ .locals.field_pattern_masking_class }} masks goes through
            the gateway's own content filter's masking of one text, with the entry's
            patterns. The check right after the imports makes an analyzer answer
            holding an item that is not a detection such an error too, for every
            guardrail calling the analyzer, the gateway's own included. Where the
            attachment refuses rather than masks, its entries mark each pattern and
            entity type BLOCK, and those same two functions then raise on a match
            instead of replacing it, so every class here refuses what it would have
            masked: a request is not forwarded, and a reply is not sent. None of them
            refuses a request for its route, its parts or its options: that is the
            request guard's, which refuses, before anything here runs, every request
            the attachment's policy does not serve.
            {{ .locals.field_entity_masking_class }} runs before a request is forwarded and before the
            gateway's own Presidio guardrail, which masks the text of the request's
            messages but passes on the tool calls of its earlier turns as they came,
            and which the configuration keeps off the chat route's tool turns, where
            it would mask a result as one text: it masks the arguments of those tool
            calls, and the results of them the conversation carries, a result that is
            JSON value by value and any other result as one text; and it masks the
            request fields that guardrail does not read, in _mask_request_fields.
            {{ .locals.field_pattern_masking_class }} masks with the listed patterns the same tool calls,
            tool results and fields a request carries, and a reply's tool calls and
            the parts _mask_reply_parts names, beside the gateway's own content filter,
            which masks the text of the messages and which the configuration keeps off
            the chat route's tool turns on requests. In a streamed chat reply it holds
            the tool-call parts until the choice they belong to finishes and sends them
            masked, in one piece, just before the chunk that finishes it.
            {{ .locals.held_reply_class }} runs only on a streamed chat reply masked by pattern, where
            its entry comes first, so it receives the provider's chunks before the
            gateway's content filter does. The content filter masks a streamed reply's
            text piece by piece, sending all of it but its last characters as it goes,
            so a match whose earlier part arrived far enough ahead of the rest would
            leave that part sent before the match is found. {{ .locals.held_reply_class }} holds the whole
            reply and hands it on as one piece, so the content filter and the entries
            after it read and mask the reply whole and the caller receives it all at
            once at the end; it masks nothing itself.
            {{ .locals.reply_masking_class }} and {{ .locals.buffered_reply_masking_class }} mask a reply: its text,
            through the gateway's own handler for its kind of reply, its tool-call
            arguments, the parts _mask_reply_parts names, and, unless the entry sets
            mask_reasoning to false, its reasoning text, in the fields _mask_reasoning
            names. They differ on a streamed reply, whose masking the gateway would
            otherwise do in a way that passes the reply on unmasked when a recognizer
            cannot be reached.
            {{ .locals.reply_masking_class }} refuses a streamed reply before any of it is sent; the request
            guard has already refused a request asking for one.
            {{ .locals.buffered_reply_masking_class }} holds a streamed reply until all of it has arrived,
            masks it as one piece and sends it as one piece; when masking it fails, it
            refuses the request before any of the reply is sent, and an error the
            provider raises while the reply arrives reaches the caller as that error.
            A reply also carries parts its model or provider adds on its own: a refusal,
            citations and annotations, a web search's query and its results, and fields
            under names of the provider's own, on the reply, a choice, a message or a
            streamed chunk, or as an output item or a content block of a kind of its
            own. Where an entry masks replies, _mask_reply_parts masks every string in
            them, value by value, and leaves as they are the words that say what a part
            is, the identifiers that tie parts together and a provider's encrypted
            tokens; in a streamed chat reply masked by pattern, the parts of the one
            piece {{ .locals.held_reply_class }} hands on are masked as it passes. What masking cannot
            read — spoken audio and its transcript, an image, and the probabilities of
            the tokens the model chose — is withheld: _withhold_unreadable takes it out
            of the reply, one piece or streamed, and the caller receives the rest. And
            an error the model call raises reaches the caller without the message the
            provider wrote in it, which can quote text the masking never saw: the
            message is replaced on the exception the gateway answers from, by one
            saying that the gateway masks sensitive text in its replies or, where the
            entry refuses, that it refuses the replies that carry it, and the
            error keeps its status code and its type. An entry that sets
            allow_unmasked_reply_parts does neither: what masking cannot read reaches
            the caller as the provider sent it, and so does the provider's message.
            Tool-call arguments are masked value by value, never as one text: they are
            read as JSON, every string value at any depth and every number whose
            digits are recognized or matched are masked, the keys are not, and the
            JSON is written back, such a number becoming the placeholder as a string.
            Arguments that are not JSON, other than empty ones, are never passed on: a
            reply carrying them is refused before any of it is sent, a streamed reply
            masked by pattern sends none of its tool calls and ends with an error, and
            a request carrying them in its conversation is refused before it is
            forwarded.
            """
            import json

            import openai
            from fastapi import HTTPException
            from litellm.exceptions import BlockedPiiEntityError
            from litellm.integrations.custom_guardrail import CustomGuardrail
            from litellm.llms.base_llm.base_model_iterator import convert_model_response_to_streaming
            from litellm.llms.base_llm.chat.transformation import BaseLLMException
            from litellm.main import stream_chunk_builder
            from litellm.proxy.guardrails.guardrail_hooks.litellm_content_filter.content_filter import ContentFilterGuardrail
            from litellm.proxy.guardrails.guardrail_hooks.presidio import _OPTIONAL_PresidioPIIMasking
            from litellm.types.guardrails import GuardrailEventHooks
            from litellm.types.utils import Delta, ModelResponse, ModelResponseStream, StreamingChoices
            {{- $analyzerAnswerCheck | nindent 4 }}

            STREAM_REFUSED = (
                "This gateway masks the entities in its replies and does not stream a reply "
                "it masks that way, so a request asking for a streamed reply is refused. "
                "Send it with stream set to false, or without stream, to receive the whole "
                "reply masked, in one piece."
            )

            REPLY_NOT_JSON = (
                "The reply was not sent: the model returned tool-call arguments that are not "
                "JSON, and this gateway masks tool-call arguments only value by value, so it "
                "sends none of the reply."
            )

            HISTORY_NOT_JSON = (
                "The request was not forwarded: a tool call in its conversation carries "
                "arguments that are not JSON, and this gateway masks tool-call arguments only "
                "value by value. Send each tool call's arguments as the JSON it was made with."
            )

            STREAMED_TOOL_CALLS_NOT_JSON = (
                "The reply's tool calls were not sent: the model returned tool-call arguments "
                "that are not JSON, and this gateway masks tool-call arguments only value by "
                "value, so it sends none of them."
            )

            REPLY_NOT_HELD = (
                "The reply was not sent: holding it whole failed ({reason}), and this gateway "
                "sends a streamed reply it masks by pattern only once all of it has arrived."
            )

            PROVIDER_ERROR_WITHHELD = (
                "The call to the model failed{status}. This gateway {what}, so it does not pass "
                "on the message the model provider returned with the error, which can quote text "
                "from the request or from the reply."
            )

            # What the fixed message says the gateway does with its replies: what an entry does
            # where its marks are MASK, and where they are BLOCK.
            MASKS_REPLIES = "masks sensitive text in its replies"
            REFUSES_REPLIES = "refuses the replies that carry sensitive text"


            class NotJson(ValueError):
                pass


            def _field(holder, name):
                return holder.get(name) if isinstance(holder, dict) else getattr(holder, name, None)


            def _set_field(holder, name, value):
                if isinstance(holder, dict):
                    holder[name] = value
                else:
                    setattr(holder, name, value)


            class _Number(str):
                # A JSON number exactly as the text wrote it: the recognizer reads the digits
                # as written, and a number it does not flag is written back as it was.
                pass


            class _Members(list):
                # A JSON object's members as (key, value) pairs, in the order written.
                pass


            def _refuse_constant(name):
                raise ValueError(name + " is not JSON")


            def _read_json(text):
                try:
                    return json.loads(
                        text, parse_int=_Number, parse_float=_Number, parse_constant=_refuse_constant, object_pairs_hook=_Members
                    )
                except ValueError:
                    raise NotJson() from None


            def _write_json(value):
                if isinstance(value, _Members):
                    return "{" + ", ".join(json.dumps(key) + ": " + _write_json(item) for key, item in value) + "}"
                if isinstance(value, list):
                    return "[" + ", ".join(_write_json(item) for item in value) + "]"
                if isinstance(value, _Number):
                    return str(value)
