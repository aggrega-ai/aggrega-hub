        {{- if $logPatterns }}
                  patterns:
        {{- range $p := $logPatterns }}
                    - pattern_type: regex
                      name: {{ $p.name | toJson | replace "$" $dollar }}
                      pattern: {{ $p.regex | toJson | replace "$" $dollar }}
                      action: MASK
        {{- end }}
        {{- end }}
        {{- if $logEntities }}
