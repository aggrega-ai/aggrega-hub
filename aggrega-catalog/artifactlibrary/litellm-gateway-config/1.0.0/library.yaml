        {{- end }}
        {{- $logPatterns := optional (optional .values "log_masking" dict) "patterns" list }}
        {{- $logEntities := optional (optional .values "log_masking" dict) "entities" list }}
        {{- if or $logPatterns $logEntities }}{{ $logMasking = true }}{{ end }}
        {{- $guardBase := "" }}
        {{- $wired := list }}
        {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "models" }}{{ $wired = append $wired $alias }}{{ end }}{{ end }}
