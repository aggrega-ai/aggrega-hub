apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: TempoConfig
  version: 1.0.0
  description: >
    The configuration of a Grafana Tempo server run in its single-binary shape,
    as one bundle every Recipe synthesizing core/observability/tempo from the
    grafana/tempo image imports, so the server is configured alike whichever
    target it runs on.

    ServerConfig writes the server's whole configuration: the HTTP query API on
    port 3200, the OTLP receiver for gRPC on 4317 and for HTTP on 4318, the
    compactor's block retention from the developer's retention_period, and a
    local trace store with its write-ahead log under /var/tempo.

    The importing Recipe picks the delivery with the local
    server_config_delivery — config_map, one ConfigMap holding the
    configuration under the key tempo.yaml, for a Kubernetes target, or
    compose_configs, one compose config — and declares as a local the name it
    shares with the bundle, which stops the build when it is missing or
    differs.
spec:
  artifacts:
    # The bundle. The configuration a single-binary Tempo server runs, as one
    # bundle every Recipe synthesizing core/observability/tempo imports. The
    # server reads everything it does from this one file — what it listens on,
    # how long it keeps traces and where it stores them — so the text lives here
    # once rather than as a copy in each Recipe that a later edit could leave
    # behind.
    #
    # What it writes. The HTTP server on port 3200, which serves the query API
    # and the readiness endpoint at /ready. The OTLP receiver, listening for gRPC
    # on 4317 and for HTTP on 4318, both bound on every address so a producer
    # elsewhere in the cluster or on the compose network reaches it. The
    # ingester cuts a block at most every five minutes. The in-process compactor
    # deletes stored trace blocks once they age past the developer's
    # retention_period. Traces and the write-ahead log live on the local backend
    # under /var/tempo, where the importing Recipe mounts its data volume. The
    # ports are the ones each importing Recipe's workload publishes and its
    # readiness check asks, and provides.port names the gRPC receiver's.
    #
    # How the configuration reaches the workload. The importing Recipe chooses
    # through the local server_config_delivery. With config_map the bundle emits
    # one ConfigMap carrying the configuration under the key tempo.yaml, which a
    # workload mounting the ConfigMap as a directory finds as the file
    # tempo.yaml. With compose_configs it emits one compose config, for the
    # compose target, which delivers a config as one file at the path it is
    # mounted at. The configuration carries no literal $; compose reads a $ in a
    # config's content as the start of a variable of its own, so a $ added to it
    # is written as $$ in the compose delivery. Any other value, or none, stops
    # the build.
    #
    # What the importing Recipe declares. Its workload mounts what this bundle
    # emits, by name, and a bundle cannot write a workload, so the Recipe
    # declares that name as a local and the bundle stops the build, naming the
    # local, when it is missing or differs from its own. With config_map it
    # declares server_config_map_suffix (-config): the ConfigMap is named after
    # the name the Recipe's provider gives the component, followed by that
    # suffix, and since a local cannot read that name, the Recipe composes the
    # two where it names the ConfigMap. With compose_configs it declares
    # server_config_name instead, the config's name (the instance name followed
    # by -config); the file it is mounted as, and the path the server is started
    # on, are the Recipe's own.
    #
    # The template reads the importing Recipe's context: .values.retention_period
    # from the Component, .context.instance_id, .context.rendered_name with
    # config_map, and the locals listed above. It checks every local before it
    # writes anything, because a local the importing Recipe does not declare
    # reads as empty here rather than stopping the build, and a name that
    # differs on the two sides would leave a server with no configuration.
    ServerConfig:
      server-config.yaml: |
        {{- /* The names this bundle shares with the Recipe importing it. Each has its home here, and the importing
          Recipe restates it as a local because its own workload, which this bundle cannot write, mounts what this
          bundle emits by it. A local the Recipe does not declare reads as empty here, so each is checked before
          anything is written: absent, or not the value below, and the build stops naming it. */}}
        {{- $bundle := "TempoConfig#/artifacts/ServerConfig" }}
        {{- $mapSuffix := "-config" }}
        {{- $configName := printf "%s-config" .context.instance_id }}
        {{- $have := "" }}
        {{- /* How the configuration reaches the importing Recipe's workload, which that Recipe chooses because its
          workload mounts it: "config_map", one ConfigMap carrying it under the key tempo.yaml, for a Kubernetes
          target; or "compose_configs", one compose config, for the compose target, which delivers a config as one
          file at the path it is mounted at. Any other value stops the build. */}}
        {{- $have = optional .locals "server_config_delivery" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local server_config_delivery, which takes \"config_map\" or \"compose_configs\": whether this bundle delivers the Tempo server's configuration as a ConfigMap, for a Kubernetes target, or as a compose config, for the compose target; declare it as one of the two" $bundle) }}
        {{- else if not (has $have (list "config_map" "compose_configs")) }}
        {{- fail (printf "the Recipe importing %s declares the local server_config_delivery as %q, but it takes \"config_map\" or \"compose_configs\": whether this bundle delivers the Tempo server's configuration as a ConfigMap, for a Kubernetes target, or as a compose config, for the compose target; declare it as one of the two" $bundle $have) }}
        {{- end }}
        {{- $compose := eq $have "compose_configs" }}
        {{- /* The name the importing Recipe's workload mounts what this bundle emits by: the compose config's, or
          the ConfigMap's. The ConfigMap is named after the name the Recipe's provider gives the component, which a
          local cannot read, so the Recipe declares the part after it and composes the two where it names the
          ConfigMap. */}}
        {{- if $compose }}
        {{- $have = optional .locals "server_config_name" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local server_config_name, which is the name of the compose config its workload mounts the Tempo server's configuration from, which this bundle emits; declare it as %q" $bundle $configName) }}
        {{- else if ne $have $configName }}
        {{- fail (printf "the Recipe importing %s declares the local server_config_name as %q, but that local is the name of the compose config its workload mounts the Tempo server's configuration from, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $configName $configName) }}
        {{- end }}
        {{- else }}
        {{- $have = optional .locals "server_config_map_suffix" "" }}
        {{- if not $have }}
        {{- fail (printf "the Recipe importing %s does not declare the local server_config_map_suffix, which follows the component's rendered name in the name of the ConfigMap its workload mounts, which this bundle emits; declare it as %q" $bundle $mapSuffix) }}
        {{- else if ne $have $mapSuffix }}
        {{- fail (printf "the Recipe importing %s declares the local server_config_map_suffix as %q, but that local follows the component's rendered name in the name of the ConfigMap its workload mounts, which this bundle emits, and this bundle's side of it is %q; declare it as %q" $bundle $have $mapSuffix $mapSuffix) }}
        {{- end }}
        {{- if not .context.rendered_name }}
        {{- fail (printf "the Recipe importing %s declares the local server_config_delivery as \"config_map\", but its provider reports no rendered name for %q, and the ConfigMap is named after it; declare \"compose_configs\" on the compose target, or import this bundle from a Recipe whose provider names the component" $bundle .context.instance_id) }}
        {{- end }}
        {{- end }}
        {{- /* The envelope. The configuration below is written once and wrapped by the envelope the importing Recipe
          chose: a compose config's content or a ConfigMap key. Both are block scalars holding it at one indentation,
          so in the compose fragment the config's content key sits one column deeper than its name, the shallowest
          place a block scalar of that indentation can hang from; the compose target reads the fragment's configs and
          writes them into the compose file, so that column reaches no emitted byte. */}}
        {{- if $compose -}}
        configs:
          {{ $configName }}:
           content: |
        {{- else -}}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: {{ .context.rendered_name }}{{ $mapSuffix }}
        data:
          tempo.yaml: |
        {{- end }}
            server:
              http_listen_port: 3200
            distributor:
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: "0.0.0.0:4317"
                    http:
                      endpoint: "0.0.0.0:4318"
            ingester:
              max_block_duration: 5m
            compactor:
              compaction:
                block_retention: "{{ .values.retention_period }}"
            storage:
              trace:
                backend: local
                wal:
                  path: /var/tempo/wal
                local:
                  path: /var/tempo/blocks
