apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: TargetProtocol
  version: 1.0.0
  description: >
    A check that every connection on one of a component's uses-sockets reaches a
    target speaking the protocol the component's client is written for, as one
    bundle the Recipes of such a component import.

    Check reads the protocol each connection's target publishes and stops the
    build on any other, or on none, with a sentence naming the component, the
    connection, the target and what it publishes, saying why the component needs
    the protocol, and naming a catalog component that publishes it. It writes no
    file, so a build whose connections are all right, or with nothing wired,
    renders what it would without the bundle.

    The importing Recipe names, as its locals, the socket (check_socket), the
    protocol (check_protocol, or a JSON list of the protocols its client
    speaks), why its client needs it (check_reason) and a component publishing
    it (check_example); the bundle stops the build naming any of the four that
    is missing.
spec:
  artifacts:
    # The bundle. A Recipe writing a client for one protocol — a forward output,
    # a memcached client, a StoreAPI endpoint — to whatever is wired on a socket
    # builds green and fails at run time when the socket's selector admits a
    # target speaking something else. A target says what it speaks in its
    # published protocol, so this bundle reads it and stops the build on the
    # wrong one. The check lives here once rather than as a copy in each
    # importing Recipe that a later edit could leave behind.
    #
    # Why a render template. A Component's assertions evaluate before any Recipe
    # renders, so their view of a connection carries nothing its target
    # published. The protocol is read where a Recipe's render templates read
    # what a target publishes, under .context.uses.<alias>.provides.
    #
    # What it reads. Every connection on the socket the importing Recipe names,
    # by alias, and the protocol its target publishes. A target publishing the
    # required protocol passes. One publishing another, or none — a target with
    # no provides at all included — stops the build with one sentence naming
    # the component instance, the connection, the target and what the target
    # publishes, then the importing Recipe's reason, and a component publishing
    # the protocol. A socket with nothing wired passes: whether a connection must
    # be there is the socket's own required flag's to say.
    #
    # What it writes. Nothing. The template renders only whitespace, and an
    # artifact rendering only whitespace emits no file, so when every connection
    # passes, the build's output is byte-identical to one without the bundle, on
    # every target. Like any import, the library is pinned in the Release's
    # lockfile.
    #
    # What the importing Recipe declares. Four locals, because the bundle serves
    # components that each speak one protocol to one socket:
    #   check_socket    the uses-socket whose connections are checked, as the
    #                   importing Component's usesSchema names it;
    #   check_protocol  the protocol the client speaks, as a target publishes it
    #                   in provides.protocol — or, where the client reaches
    #                   targets publishing more than one value, such as a
    #                   protocol's plaintext value and the one a target
    #                   publishes while it serves TLS, a JSON list of them,
    #                   written as a list local is written elsewhere in the
    #                   catalog, '["memcached", "memcached-tls"]'. A local is a
    #                   string, so the list is the string's content; one reading
    #                   as no list of non-empty strings stops the build naming
    #                   the local, and the halt names every value listed;
    #   check_reason    why the component needs that protocol, the clause the
    #                   halt carries after "but";
    #   check_example   a catalog component publishing that protocol, which the
    #                   halt names as the one to wire instead.
    # A local the Recipe does not declare reads as empty here rather than
    # stopping the build, so each is checked before any connection is read, and
    # the build stops naming the one that is missing. A socket the importing
    # Component does not declare matches no connection, and nothing a template
    # reads lists a Component's sockets, so a misspelled check_socket checks
    # nothing and the bundle cannot refuse it.
    Check:
      check.yaml: |
        {{- /* The four values the importing Recipe names as its locals: the socket, the protocol and the sentence
          differ per component. A local the Recipe does not declare reads as empty here, so each is checked before any
          connection is read: absent, and the build stops naming it. */}}
        {{- $bundle := "TargetProtocol#/artifacts/Check" }}
        {{- $socket := toString (optional .locals "check_socket" "") }}
        {{- if not $socket }}
        {{- fail (printf "the Recipe importing %s does not declare the local check_socket, which names the uses-socket whose connections this bundle checks; declare it as that socket's name in the Component's usesSchema" $bundle) }}
        {{- end }}
        {{- $protocol := toString (optional .locals "check_protocol" "") }}
        {{- if not $protocol }}
        {{- fail (printf "the Recipe importing %s does not declare the local check_protocol, which is the protocol the component's client speaks to the %s socket, as a target publishes it in provides.protocol; declare it" $bundle $socket) }}
        {{- end }}
        {{- /* check_protocol names one protocol, or, written as a JSON list, every protocol the client speaks — its
          plaintext value and the one a target publishes while it serves TLS, say. Every entry of a list must be a
          protocol: a list that does not read as one, or holds none, stops the build naming the local. */}}
        {{- $accepted := list $protocol }}
        {{- if hasPrefix "[" $protocol }}
        {{- $accepted = list }}
        {{- $parsed := fromJson $protocol }}
        {{- if kindIs "slice" $parsed }}
        {{- range $entry := $parsed }}
        {{- if and (kindIs "string" $entry) $entry }}{{ $accepted = append $accepted $entry }}{{ else }}{{ $accepted = list }}{{ break }}{{ end }}
        {{- end }}
        {{- end }}
        {{- if not $accepted }}
        {{- fail (printf "the Recipe importing %s declares the local check_protocol as %s, which reads as neither one protocol nor a JSON list of protocols, each a non-empty string; write the one protocol the component's client speaks to the %s socket, or a JSON list of them" $bundle $protocol $socket) }}
        {{- end }}
        {{- end }}
        {{- $protocol = join " or " $accepted }}
        {{- $reason := toString (optional .locals "check_reason" "") }}
        {{- if not $reason }}
        {{- fail (printf "the Recipe importing %s does not declare the local check_reason, which says why the component needs the protocol %s on the %s socket, in the sentence that stops a build wiring a target publishing another; declare it" $bundle $protocol $socket) }}
        {{- end }}
        {{- $example := toString (optional .locals "check_example" "") }}
        {{- if not $example }}
        {{- fail (printf "the Recipe importing %s does not declare the local check_example, which names a catalog component publishing the protocol %s, the one the sentence stopping a build tells its author to wire to the %s socket instead; declare it" $bundle $protocol $socket) }}
        {{- end }}
        {{- /* Each connection on the socket, by alias. The target's provides are read through an empty map when it
          publishes none, so a target with no provides at all reads as publishing no protocol. */}}
        {{- range $alias, $edge := .context.uses }}
        {{- if eq $edge.socket $socket }}
        {{- $published := toString (optional (default dict $edge.provides) "protocol" "") }}
        {{- if not (has $published $accepted) }}
        {{- $what := "publishes no protocol" }}
        {{- with $published }}{{ $what = printf "publishes the protocol %q" . }}{{ end }}
        {{- fail (printf "the %s connection %s of %q is wired to %q, which %s, but %s; wire a component publishing %s, such as %s, to the %s socket instead" $socket $alias $.context.instance_id $edge.target $what $reason $protocol $example $socket) }}
        {{- end }}
        {{- end }}
        {{- end }}
