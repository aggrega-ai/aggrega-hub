apiVersion: aggrega.ai/v1beta1
kind: ArtifactLibrary
metadata:
  name: ControllerRBAC
  version: 1.0.0
  description: |
    Permission bundles for a recipe that installs a controller: the identity the
    controller runs as, and the grants that let it watch and reconcile the
    resources it owns. A recipe consumes a bundle with
    `artifacts: { <key>: { $import: ControllerRBAC#/artifacts/<Bundle> } }`; the
    version is supplied by the per-Release lockfile and no registry host enters
    the reference. One import expands into one output file per file in the
    bundle, each nested under the key it was imported at as `<key>/<filename>`,
    so objects that are only meaningful together arrive together.

    Each bundle reads two keys the consuming component declares on its own
    `infra` surface: `namespace`, the namespace the controller is installed
    into, and `controller_rules`, the permission list to grant. Carrying the
    rules as data rather than as text is what lets one bundle serve controllers
    that watch entirely different resources — the wiring between an identity, a
    role and a binding is the part every controller shares, and the permission
    list is the part none of them share.

    The two bundles compose. A controller confined to one namespace imports
    NamespacedController alone. A controller that also needs a cluster-scoped
    grant imports both, at two keys: NamespacedController declares the identity
    and ClusterScopedBinding grants to that same identity rather than declaring
    a second one.
spec:
  artifacts:
    # The identity and the namespace-scoped grant for a controller that watches
    # only the namespace it runs in.
    #
    # Every object here is named from `.context.instance_id`. A namespaced
    # object could have taken a fixed name instead, because the namespace
    # already separates one installation from another — but a cluster-scoped
    # object cannot, since two installations in one cluster would collide on it.
    # Deriving both from the instance keeps one naming rule for the whole set
    # instead of one rule per scope, and the ClusterScopedBinding subject below
    # then names this ServiceAccount without either side restating the rule.
    NamespacedController:
      serviceaccount.yaml: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
      role.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
        rules: {{ toJson .infra.controller_rules }}
      rolebinding.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: {{ .context.instance_id }}
        subjects:
          - kind: ServiceAccount
            name: {{ .context.instance_id }}
            namespace: {{ .infra.namespace }}
    # The cluster-scoped grant for a controller that watches across namespaces.
    #
    # It declares no ServiceAccount: the subject is the one NamespacedController
    # declares, so importing both bundles yields one identity holding both
    # grants. Importing this bundle alone grants to a ServiceAccount the recipe
    # is expected to declare itself, under the same instance-derived name.
    #
    # `controller_rules` is read here too. A controller needing a different
    # permission list at each scope declares a second `infra` key for the
    # cluster-scoped list and adapts this bundle rather than importing it, since
    # a bundle file's body is terminal content and takes no further indirection.
    ClusterScopedBinding:
      clusterrole.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: {{ .context.instance_id }}
        rules: {{ toJson .infra.controller_rules }}
      clusterrolebinding.yaml: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: {{ .context.instance_id }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: {{ .context.instance_id }}
        subjects:
          - kind: ServiceAccount
            name: {{ .context.instance_id }}
            namespace: {{ .infra.namespace }}
