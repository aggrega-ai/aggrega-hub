# Content pins for this entity's external inputs, written by `aggrega pin`.
# Commit it beside the entity. Run `aggrega pin` on the entity again to bring it up to date.
version: 1
localSourceDigests:
  - path: module/main.tf
    digest: sha256:10ab79ab9d6d840fb11967e094b79d0078ba8edb72273df405c42020dfede9a8
  - path: module/variables.tf
    digest: sha256:d35dff260cb0accf1e6ecc0eaec7cb5dd4884f0dccfaafd619380566142609de
ignore:
  plugin:
    name: provider/terraform
    patterns:
      - .git/
      - .hg/
      - .svn/
      - .bzr/
      - .terraform/
    files:
      - .terraformignore
  rules:
    - pattern: .git/
      within: module
      from: plugin
    - pattern: .hg/
      within: module
      from: plugin
    - pattern: .svn/
      within: module
      from: plugin
    - pattern: .bzr/
      within: module
      from: plugin
    - pattern: .terraform/
      within: module
      from: plugin
