apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mariadb-rds
  version: 1.0.0
  description: >
    MariaDB via AWS RDS, rendered as a Terraform HCL body. Authored as a
    full-body artifact named main.tf that emits verbatim as a standalone
    file alongside any other artifacts contributed at the same boundary.

    host publishes a Terraform reference to the instance's hostname, an output
    of this component's module, and port publishes the port infra.port
    configures. The reference resolves only for a consumer authored as a
    source: Recipe in the same Terraform root configuration; a consumer on
    another target receives it as text. It names this component's module, so
    it resolves only where the Aggregate the Release deploys declares this
    component, not where it is composed in from another Aggregate.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/mariadb:1.0.0

  locals:
    db_identifier: "{{ .context.instance_id }}"
    secret_target_root_password: "{{ .context.instance_id }}-root-password"

  # The String Pipe (Invariant 3): the compiler does not know
  # host is a Terraform reference. It pipes the string.
  # Terraform resolves it at `terraform apply` time. user is the
  # RDS master username (admin, set below); database mirrors the
  # developer value, so a consumer reads the same connection identity
  # the instance exposes.
  #
  # host names the address output the body below declares, through this
  # component's module call: the body renders into the component's own module
  # directory, and the boundary's root configuration declares that directory as
  # a module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. A reference to the resource itself would
  # name nothing the root declares. The output is the instance's address
  # attribute, its bare hostname; the provider's endpoint attribute is
  # address:port.
  #
  # port is the value the body sets on the instance, so it is known ahead of
  # time and published as that value: a consumer on any target can use it.
  provides:
    host: "${module.{{ .context.instance_id }}.address}"
    port: "{{ .infra.port }}"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mariadb"

  # This Recipe reads from infra.overrides:
  #   instance_class      - string (instance_class; default "db.t3.small")
  #   multi_az            - bool (multi_az; defaults to infra.ha.enabled)
  #   subnet_group        - string (db_subnet_group_name)
  #   parameter_group     - string (parameter_group_name)
  #   vpc_security_groups - []string (vpc_security_group_ids)
  #   kms_key_id          - string (kms_key_id; also sets storage_encrypted true)
  #   deletion_protection - bool (deletion_protection)
  #   tags                - map[string]string (tags)
  #
  # The key names are the Terraform argument names rather than a separate Aggrega
  # spelling, because each is passed through to the resource unchanged and the
  # argument name is what a reader matches against provider documentation.
  # instance_class and multi_az have defaults; the remaining keys emit nothing
  # when unset.
  #
  # infra.storage.type is the RDS storage type here, not a storage class. The
  # Component declares no default for it, because on Kubernetes an unset class
  # leaves the volume to the cluster's default storage class; this Recipe
  # supplies its own instead, so a Release that names none provisions gp3.
  #
  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  artifacts:
    main.tf: |
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_db_instance" "{{ .locals.db_identifier }}" {
        identifier     = "{{ .locals.db_identifier }}"
        engine         = "mariadb"
        engine_version = "{{ .infra.engine_version }}"
        port           = {{ .infra.port }}

        ## ── Compute ──────────────────────────────────────────────
        {{- if .infra.overrides }}
        {{- if .infra.overrides.instance_class }}
        instance_class = "{{ .infra.overrides.instance_class }}"
        {{- else }}
        instance_class = "db.t3.small"
        {{- end }}
        {{- else }}
        instance_class = "db.t3.small"
        {{- end }}

        ## ── Storage ──────────────────────────────────────────────
        allocated_storage = {{ trimSuffix "Gi" .infra.storage.size }}
        storage_type      = "{{ .infra.storage.type | default "gp3" }}"

        ## ── Database ─────────────────────────────────────────────
        db_name  = "{{ .values.database }}"
        username = "admin"

        ## Black-Box: RDS manages the password via Secrets Manager.
        manage_master_user_password = true

        ## ── HA ───────────────────────────────────────────────────
        {{- if .infra.overrides }}
        multi_az = {{ .infra.overrides.multi_az | default .infra.ha.enabled }}
        {{- else }}
        multi_az = {{ .infra.ha.enabled }}
        {{- end }}

        ## ── Backup ───────────────────────────────────────────────
        backup_retention_period = {{ .infra.backup.retention_days }}
        {{- if not .infra.backup.enabled }}
        skip_final_snapshot     = true
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        {{- if .infra.overrides }}
        {{- if .infra.overrides.subnet_group }}
        db_subnet_group_name = "{{ .infra.overrides.subnet_group }}"
        {{- end }}
        {{- if .infra.overrides.parameter_group }}
        parameter_group_name = "{{ .infra.overrides.parameter_group }}"
        {{- end }}
        {{- if .infra.overrides.vpc_security_groups }}
        vpc_security_group_ids = {{ toJson .infra.overrides.vpc_security_groups }}
        {{- end }}
        {{- if .infra.overrides.kms_key_id }}
        storage_encrypted = true
        kms_key_id        = "{{ .infra.overrides.kms_key_id }}"
        {{- end }}
        {{- if .infra.overrides.deletion_protection }}
        deletion_protection = {{ .infra.overrides.deletion_protection }}
        {{- end }}
        {{- if .infra.overrides.tags }}
        tags = {{ toJson .infra.overrides.tags }}
        {{- end }}
        {{- end }}
      }

      output "address" {
        value = aws_db_instance.{{ .locals.db_identifier }}.address
      }

      {{- if gt (int .infra.ha.read_replicas) 0 }}
      {{- range $i := until (int .infra.ha.read_replicas) }}
      resource "aws_db_instance" "{{ $.locals.db_identifier }}_replica_{{ $i }}" {
        identifier          = "{{ $.locals.db_identifier }}-replica-{{ $i }}"
        replicate_source_db = aws_db_instance.{{ $.locals.db_identifier }}.identifier
        instance_class      = aws_db_instance.{{ $.locals.db_identifier }}.instance_class
      }
      {{- end }}
      {{- end }}
