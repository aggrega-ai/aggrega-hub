apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: redis-elasticache
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # ElastiCache module: the third-party code this Recipe pins and writes into
  # the output. The ElastiCache replication group it provisions is a service
  # the reader contracts for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Redis OSS on Amazon ElastiCache, as one replication group with cluster mode
    disabled, realized by the published ElastiCache module of the
    terraform-aws-modules project, terraform-aws-modules/elasticache/aws at
    v1.11.2, Apache-2.0, fetched from its git repository at that tag, vendored,
    and pinned in the entity.lock beside this Recipe.

    ElastiCache runs Redis OSS up to 7.1, so infra.engine_version takes 7.1,
    7.0, 6.2, 6.0, 5.0.6 or 4.0.10, read off the start of the value; from 8 on
    it halts naming the key, the Component's default included, so the Release
    sets the version on this target. ElastiCache serves vector search on Valkey
    alone, so vector_search is empty and a gateway's semantic cache halts on
    this store.

    Reach for this realization where the cache is an ElastiCache service in the
    operator's AWS account; reach for valkey-elasticache for a newer engine,
    or redis on helm or compose where it runs as a container.

    host is a Terraform reference to the module's primary endpoint, or
    infra.overrides.host while set; port is infra.port.
    infra.overrides.subnet_group is required. maxmemory_policy and databases
    are set through a parameter group. maxmemory, appendonly, persistence,
    infra.overrides.image, and databases below 6.0 halt naming the key;
    compute and storage are not read. With infra.client_tls the service
    encrypts in transit and protocol is redis-tls; an attached password becomes
    the AUTH token, and needs client_tls.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/redis:1.0.0

  # The published module, at the tag the registry publishes as version 1.11.2.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root, which declares no module call of its
  # own: the configuration Terraform loads from it calls no registry module, so
  # initialising it fetches providers and nothing else. The repository's
  # modules/, examples/ and wrappers/ directories are vendored with it and never
  # loaded.
  #
  # The module declares hashicorp/aws >= 5.93 and hashicorp/random >= 3.0 in its
  # own required_providers and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS provider
  # constraint for every AWS body" section says how it composes with the
  # catalog's authored AWS bodies.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-elasticache.git
    ref: v1.11.2

  locals:
    # The major version infra.engine_version begins with: 7 from 7.1, 8 from the
    # Component's default image tag 8.8.2-alpine.
    engine_major: '{{ regexFind `^[0-9]+` (toString .infra.engine_version) }}'
    # The engine version in the spelling ElastiCache and the AWS provider take
    # for Redis OSS: the major and minor version alone from 6 on (6.0, 6.2, 7.0,
    # 7.1; a patch is refused, and ElastiCache runs the newest patch of that
    # version), and the whole major.minor.patch below 6 (4.0.10, 5.0.6).
    engine_version: '{{ $t := toString .infra.engine_version }}{{ if and .locals.engine_major (ge (atoi .locals.engine_major) 6) }}{{ regexFind `^[0-9]+\.[0-9]+` $t }}{{ else }}{{ regexFind `^[0-9]+\.[0-9]+\.[0-9]+` $t }}{{ end }}'
    # The parameter group family of that version: redis7 for 7.0 and 7.1,
    # redis6.x for 6.0 and 6.2, redis5.0 for 5.0.6, redis4.0 for 4.0.10.
    family: '{{ $m := .locals.engine_major }}{{ if eq $m "6" }}redis6.x{{ else if and $m (ge (atoi $m) 7) }}redis{{ $m }}{{ else }}redis{{ regexFind `^[0-9]+\.[0-9]+` .locals.engine_version }}{{ end }}'
    # The name the Release gives the cache under infra.overrides.host, or empty
    # while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   subnet_group        - string (subnet_group_name), required
  #   vpc_security_groups - []string (security_group_ids)
  #   node_type           - string (node_type; default "cache.t3.small")
  #   host                - string (published as provides.host; not passed to the module)
  #   image               - refused: no container image runs on this target
  #
  # subnet_group, vpc_security_groups, node_type and host are the keys, under
  # the same names, that valkey-elasticache and the RDS Recipes read for the
  # same concepts. subnet_group is required: a cache subnet group places the
  # replication group in the operator's network, and this Recipe never chooses
  # a network for the operator. The module's own subnet group and security
  # group creation is left off, because both are the operator's. The default
  # node type is offered from Redis OSS 4.0.10 on, so for every version below.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # Three are worth knowing: it encrypts the cache's data at rest, with the
  # service's own key; it sends the slow log to a CloudWatch log group it
  # creates under /aws/elasticache/; and it creates one node, with no replica
  # and no automatic failover.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against ElastiCache's own documentation:
  #   honoured — values.maxmemory_policy ("Modifiable: Yes"), as the
  #     maxmemory-policy parameter of a parameter group the module creates for
  #     the version's family; values.databases, as the databases parameter,
  #     from Redis OSS 6.0 on, where it is "Modifiable: Yes"; infra.port;
  #     infra.engine_version (among the versions ElastiCache offers);
  #     infra.client_tls; and the overrides above.
  #   refused — values.maxmemory ("The maxmemory parameter cannot be
  #     modified": the node type fixes it); values.databases on 5.0.6 and
  #     4.0.10, where the parameter is "Modifiable: No" and the parameter group
  #     the module creates takes its parameters as a modification;
  #     values.appendonly true ("Redis OSS configuration variables appendonly
  #     and appendfsync are not supported"); values.persistence.enabled true
  #     (ElastiCache provisions no volume, and offers its durability, a
  #     Multi-AZ transaction log, on no Redis OSS version);
  #     infra.overrides.image; an attachment to server_certificate; and a
  #     password as set out below.
  #   not read — infra.compute.cpu and infra.compute.memory, and
  #     infra.storage.size and infra.storage.type, whose Component defaults
  #     size a container and its volume: ElastiCache sizes the node by
  #     infra.overrides.node_type and provisions no volume, and a Recipe cannot
  #     tell those defaults from a value the Release wrote.
  #     infra.image_serves_vector_search, which speaks of an image no build on
  #     this target runs.
  #
  # With infra.client_tls true the module turns on in-transit encryption, and
  # the port accepts TLS alone. ElastiCache presents a certificate AWS
  # Certificate Manager issues, which is publicly trusted, so a consumer checks
  # it against its system trust store and needs no server_ca. That certificate
  # carries the replication group's name, which AWS records in public
  # Certificate Transparency logs.
  #
  # An attached password becomes the replication group's AUTH token, which
  # ElastiCache accepts only with in-transit encryption on, so it halts while
  # infra.client_tls is false. The token reaches the service as a Terraform
  # reference to the password core/random-password's terraform/random-password
  # realization draws at apply time, so no password is written into the
  # rendered configuration; the apply keeps it in the Terraform state. Another
  # credential either carries its value as text, which would be written into
  # the configuration, or carries none the service could take, so it halts, and
  # so do a password with punctuation or one shorter than 16 characters, which
  # an AUTH token may not be.
  assertions:
    subnet_group_supplied: >-
      {{- if not (and (hasKey .infra "overrides") (optional .infra.overrides "subnet_group" "")) -}}
      {{- fail "this Release places its cache in a cache subnet group that already exists in the target account, and the published ElastiCache module this Recipe sources would otherwise create one from subnets the Release does not name, but infra.overrides.subnet_group carries none: set infra.overrides.subnet_group in the Release to the name of an existing ElastiCache subnet group" -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this cache reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    # ElastiCache's last Redis OSS release is 7.1; Redis 8 and later run only
    # where the server runs as a container, and Valkey is the engine
    # ElastiCache develops past it.
    engine_version_below_8: >-
      {{- if and .locals.engine_major (ge (atoi .locals.engine_major) 8) -}}
      {{- fail (printf "infra.engine_version is %q, and ElastiCache runs Redis OSS up to 7.1; set infra.engine_version to 7.1 or earlier, or realize the cache as core/datastore/valkey" (toString .infra.engine_version)) -}}
      {{- end -}}
    # The Redis OSS versions ElastiCache offers a new replication group, read
    # off its engine-versions page; the deprecated 5.0.0 to 5.0.5 and the
    # versions past their end of life are not among them.
    engine_version_offered: >-
      {{- if not (has .locals.engine_version (list "7.1" "7.0" "6.2" "6.0" "5.0.6" "4.0.10")) -}}
      {{- fail (printf "infra.engine_version is %q, and ElastiCache runs Redis OSS 7.1, 7.0, 6.2, 6.0, 5.0.6 and 4.0.10, which this Recipe reads off the major and minor version the value begins with, and the patch as well below 6: set infra.engine_version to one of them, such as 7.1" (toString .infra.engine_version)) -}}
      {{- end -}}
    # A number written as the image, 0 included, is refused like any other
    # value: an assertion reads a 0 as empty, so the key's presence is tested.
    no_image_runs: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $image := optional $o "image" "" -}}
      {{- if or $image (and (hasKey $o "image") (has (kindOf $image) (list "int64" "float64"))) -}}
      {{- fail (printf "infra.overrides.image is %q, and ElastiCache runs the Redis OSS server itself, so no container image runs on this target: remove infra.overrides.image from the Release, or map this component to redis on helm or compose, which run the image it names" (toString $image)) -}}
      {{- end -}}
    values_elasticache_cannot_apply: >-
      {{- with optional .values "maxmemory" "" -}}
      {{- fail (printf "values.maxmemory is %q, and ElastiCache fixes the memory a Redis OSS node may use by its node type; its maxmemory parameter cannot be modified: remove values.maxmemory from the Aggregate and size the cache with infra.overrides.node_type in the Release" (toString .)) -}}
      {{- end -}}
      {{- if and (optional .values "databases" "") (lt (atoi (default "0" .locals.engine_major)) 6) -}}
      {{- fail (printf "values.databases is %v, and on Redis OSS %s ElastiCache's databases parameter cannot be modified, so a parameter group cannot set it: remove values.databases from the Aggregate, or set infra.engine_version to 6.0 or later, where it can" .values.databases .locals.engine_version) -}}
      {{- end -}}
      {{- if .values.appendonly -}}
      {{- fail "values.appendonly is true, and ElastiCache does not support the appendonly configuration on Redis OSS, so no append-only file is written: remove values.appendonly from the Aggregate, or map this component to a realization that runs the server itself" -}}
      {{- end -}}
      {{- if .values.persistence.enabled -}}
      {{- fail "values.persistence.enabled is true, and ElastiCache provisions no volume for a Redis OSS cache and offers its durability, a Multi-AZ transaction log, on no Redis OSS version: remove values.persistence.enabled from the Aggregate, or map this component to redis on helm, which keeps the data on a persistent volume" -}}
      {{- end -}}
    tls_and_credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "server_certificate" -}}
      {{- fail "a certificate is attached to the server_certificate slot, and ElastiCache presents a certificate AWS issues for the cache, which consumers trust without one: remove the attachment; infra.client_tls alone turns TLS on here" -}}
      {{- end -}}
      {{- if hasKey $f "password" -}}
      {{- if not .infra.client_tls -}}
      {{- fail "a password is attached to the password slot, and ElastiCache accepts an AUTH token only with in-transit encryption on, but infra.client_tls is false: set infra.client_tls to true, which serves the cache over TLS alone and publishes protocol redis-tls, or remove the attachment" -}}
      {{- end -}}
      {{- $p := $f.password -}}
      {{- if ne (toString (optional $p "type" "")) "core/random-password" -}}
      {{- fail (printf "the password slot is filled by %s, and this Recipe hands ElastiCache its AUTH token as a Terraform reference to a password drawn at apply time, which core/random-password publishes through terraform/random-password; another credential either carries its value as text, which would be written into the rendered configuration, or carries none the service could take: attach core/random-password to the password slot instead" (toString (optional $p "type" "an attachment of no type"))) -}}
      {{- end -}}
      {{- $pv := optional $p "values" dict -}}
      {{- if optional $pv "symbols" false -}}
      {{- fail "the password attached to the password slot sets values.symbols to true, and the punctuation the random provider draws includes characters an ElastiCache AUTH token may not hold, which permits only !, &, #, $, ^, <, > and -: set values.symbols to false" -}}
      {{- end -}}
      {{- if lt (int (optional $pv "length" 32)) 16 -}}
      {{- fail (printf "the password attached to the password slot sets values.length to %v, and an ElastiCache AUTH token is 16 to 128 characters: set values.length to at least 16" (optional $pv "length" 32)) -}}
      {{- end -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. host names
  # the module's replication_group_primary_endpoint_address output — the
  # address of the endpoint for the primary node — through this component's
  # module call, which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the Release
  # deploys. Terraform resolves it at apply time, so it resolves only for a
  # consumer authored as a source: Recipe in the same root configuration; a
  # consumer on another target receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record or alias for it, so the operator points the name at the cache
  # outside the Release. A consumer in the same root configuration receives the
  # name as well, and a name carries no reference for Terraform to order its
  # module after this one by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  #
  # port is the value the mapping below passes to the module, so it is known
  # ahead of time and published as that value. protocol is redis, or redis-tls
  # while infra.client_tls is on, when the port accepts TLS alone.
  # vector_search is empty: ElastiCache offers vector search on Valkey 8.2 and
  # later alone, and on no Redis OSS version, so a gateway wired to this
  # instance on its cache_store socket halts the build.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.replication_group_primary_endpoint_address}{{ end }}"
    port: "{{ .infra.port }}"
    protocol: "{{ if .infra.client_tls }}redis-tls{{ else }}redis{{ end }}"
    vector_search: ""

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # replication group's identifier is the component's name, as the RDS Recipes
  # name their instances. The module turns in-transit encryption on unless told
  # otherwise, so the mapping always passes infra.client_tls. The AUTH token is
  # the attachment's module output joined with a dot and wrapped in an
  # interpolation, as terraform/random-password publishes it.
  valuesMapping: |
    replication_group_id: "{{ .context.instance_id }}"
    engine: "redis"
    engine_version: "{{ .locals.engine_version }}"
    node_type: "{{ optional .infra.overrides "node_type" "cache.t3.small" }}"
    port: {{ .infra.port }}
    transit_encryption_enabled: {{ .infra.client_tls }}
    {{- with (default dict .features).password }}
    {{- $prov := optional . "provides" dict }}
    {{- if not (and (kindIs "map" $prov) (optional $prov "name" "") (optional $prov "key" "")) }}
    {{- fail (printf "the password slot of %q is filled by an attachment that publishes no module output, and the AUTH token is handed to ElastiCache as a reference to one: bind core/random-password to terraform/random-password in the Manifest" $.context.instance_id) }}
    {{- end }}
    auth_token: "{{ printf "${%s.%s}" $prov.name $prov.key }}"
    {{- end }}
    create_subnet_group: false
    subnet_group_name: "{{ .infra.overrides.subnet_group }}"
    create_security_group: false
    {{- with optional .infra.overrides "vpc_security_groups" "" }}
    security_group_ids: {{ toJson . }}
    {{- end }}
    {{- if or .values.maxmemory_policy .values.databases }}
    create_parameter_group: true
    parameter_group_family: "{{ .locals.family }}"
    parameters:
    {{- with .values.maxmemory_policy }}
      - name: "maxmemory-policy"
        value: "{{ . }}"
    {{- end }}
    {{- with .values.databases }}
      - name: "databases"
        value: "{{ . }}"
    {{- end }}
    {{- end }}
