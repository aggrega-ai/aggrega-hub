apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloudfront
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # CloudFront module: the third-party code this Recipe pins and writes into
  # the output. The distribution it declares is a service the reader
  # contracts for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon CloudFront, realized by the published CloudFront module of the
    terraform-aws-modules project, terraform-aws-modules/cloudfront/aws at
    v6.8.0, Apache-2.0, fetched from its git repository at that tag and
    pinned by the commit it names in the entity.lock beside this Recipe: one
    distribution with one origin and its default cache behaviour. The origin
    is the host the upstream connection publishes, reached over HTTPS on the
    port it publishes or 443, or, where infra.overrides.vpc_origin_id names
    the operator's VPC origin, through that origin. infra.waf_policy_id is
    the distribution's web_acl_id.

    host and endpoint publish the module's
    cloudfront_distribution_domain_name output. infra.overrides.host
    publishes the operator's DNS name instead and adds it as the
    distribution's alternate domain name, presenting the certificate
    infra.overrides.custom_endpoint_certificate_arn names; the DNS record is
    the operator's. price_class and cache_policy_id replace PriceClass_All
    and the managed CachingDisabled policy; tags label the distribution. The
    module's origin access control is off; no cache or origin request
    policy, function, log delivery, web ACL, certificate or DNS record is
    created. The apply waits until CloudFront has deployed the distribution,
    and a destroy disables it before deleting it.

    An upstream publishing no host, an IP literal or a port CloudFront does
    not take halts the build, as do host or custom_endpoint_certificate_arn
    without the other, a name the distribution cannot take, a certificate
    outside us-east-1, a vpc_origin_id, price_class (None included) or
    cache_policy_id of another form, tags not a map of strings and any
    infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/network/cloudfront:1.0.0

  # The published module, at the tag the registry publishes as version 6.8.0.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/, wrappers/ and modules/ directories are
  # vendored with it and never loaded, since nothing the root declares
  # reaches them.
  #
  # The module declares hashicorp/aws >= 6.51 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-cloudfront.git
    ref: v6.8.0

  locals:
    # The name the Release gives the distribution under infra.overrides.host,
    # or empty while it gives none. Only a string is read here; any other
    # value is refused by the assertions below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The ARN of the certificate the alternate domain name is served with,
    # under infra.overrides.custom_endpoint_certificate_arn, or empty while
    # the Release gives none. Only a string is read here.
    certificate_arn: '{{ $c := optional (optional .infra "overrides" dict) "custom_endpoint_certificate_arn" "" }}{{ if typeIs "string" $c }}{{ $c }}{{ end }}'
    # The ID of the operator's VPC origin under
    # infra.overrides.vpc_origin_id, or empty while the Release names none.
    # Only a string is read here.
    vpc_origin_id: '{{ $v := optional (optional .infra "overrides" dict) "vpc_origin_id" "" }}{{ if typeIs "string" $v }}{{ $v }}{{ end }}'

  # The String Pipe: the compiler does not interpret these strings. host
  # names the module's cloudfront_distribution_domain_name output, the
  # distribution's domain_name, such as d111111abcdef8.cloudfront.net,
  # through this component's module call, which the boundary's root
  # configuration declares under .context.instance_id for a component
  # declared in the Aggregate the Release deploys, and endpoint joins
  # https:// to it. Terraform resolves them once the distribution exists, and
  # only for a consumer authored as a source: Recipe in the same root
  # configuration, which is applied after the distribution; a consumer on
  # another target receives them as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, and endpoint joins the scheme to it. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and a consumer reading it carries no reference for Terraform
  # to apply it after this distribution by. CloudFront answers a request for
  # that name only as an alternate domain name of the distribution, served
  # with a certificate carrying it, so the mapping adds both, as set out
  # below.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.cloudfront_distribution_domain_name}{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}{{ else }}https://${module.{{ .context.instance_id }}.cloudfront_distribution_domain_name}{{ end }}"

  # This Recipe reads from infra.overrides:
  #   host                            - string (published as provides.host; aliases)
  #   custom_endpoint_certificate_arn - string (viewer_certificate.acm_certificate_arn)
  #   vpc_origin_id                   - string (origin.<k>.vpc_origin_config.vpc_origin_id)
  #   price_class                     - string (price_class)
  #   cache_policy_id                 - string (default_cache_behavior.cache_policy_id)
  #   tags                            - map[string]string (tags)
  # Any other key halts the build by name.
  #
  # vpc_origin_id, price_class and cache_policy_id are named by the module
  # input they set. host is the key the catalog's Recipes of managed services
  # read for the name a consumer reaches one at,
  # custom_endpoint_certificate_arn the key the catalog's OpenSearch Service
  # and API Gateway Recipes read for the certificate served for that name,
  # and tags the key the catalog's terraform AWS Recipes read for a
  # resource's tags, so a Release names each the same way whichever Recipe
  # it configures.
  #
  # host and custom_endpoint_certificate_arn, set together or not at all.
  # Set, host is published as the distribution's name and written as its one
  # alternate domain name, and the viewer certificate is the AWS Certificate
  # Manager certificate custom_endpoint_certificate_arn names, served to
  # clients that send the name by Server Name Indication (sni-only, which
  # the CloudFront Developer Guide's "Distribution settings" recommends;
  # the other method, vip, carries a monthly charge) with the security
  # policy TLSv1.2_2021, so TLS 1.2 is the oldest protocol a client may use
  # (the Developer Guide's "Supported protocols and ciphers between viewers
  # and CloudFront"). CloudFront takes an alternate domain name only with a
  # certificate covering it, and an alternate domain name only in lower
  # case (the Developer Guide's "Use custom URLs by adding alternate domain
  # names"), and an ACM certificate only from US East (N. Virginia),
  # us-east-1 (the CloudFront API Reference's ViewerCertificate). The name
  # is a DNS name of two labels or more and 253 characters at most, the DNS
  # standard's longest name, each label 1 to 63 lower-case letters, digits
  # and hyphens neither beginning nor ending with a hyphen, the last two
  # characters or more, and without the wildcard first label CloudFront also
  # takes, since a wildcard is no name a consumer can reach. The certificate
  # is named by its ARN, arn:aws:acm:us-east-1:<account>:certificate/<id>. A
  # name without a certificate would be published to clients that cannot
  # reach the distribution under it, and a certificate without a name
  # configures nothing, so either alone halts, as do a name not bare or not
  # of that form, an ARN of another form and a certificate in another
  # Region. Whether the certificate covers the name is CloudFront's to check
  # when it creates the distribution: the compiler looks no certificate up.
  # CloudFront refuses an alternate domain name another distribution
  # already holds, in any account (the same page). The certificate, and the
  # DNS record pointing the name at the distribution's domain name, are the
  # operator's: this Recipe creates neither. While no name is set, the
  # distribution serves HTTPS on its own name with CloudFront's default
  # certificate, *.cloudfront.net, with which CloudFront sets the security
  # policy TLSv1 itself (the Developer Guide's "Distribution settings"); the
  # mapping writes minimum_protocol_version TLSv1 then, in place of the
  # module's default TLSv1.2_2025, so the configuration says what CloudFront
  # applies.
  #
  # vpc_origin_id names the operator's VPC origin, an aws_cloudfront_vpc_origin
  # in front of an Application Load Balancer, Network Load Balancer or EC2
  # instance in private subnets (the Developer Guide's "Restrict access with
  # VPC origins"), so the origin carries vpc_origin_config in place of
  # custom_origin_config: the VPC origin's own settings decide the protocol
  # and port CloudFront connects with, and the upstream's port is not read.
  # The origin's domain name is still the host the upstream publishes, and
  # that guide gives it as the load balancer's DNS name or the instance's
  # private IP DNS name: which name the upstream publishes, and which
  # resource the VPC origin stands in front of, are the operator's to keep
  # true. The module's own vpc_origin input stays unset, so the VPC origin,
  # its load balancer or instance and their security groups are the
  # operator's, named here and never created. A vpc_origin_id that is empty
  # or not a string halts the build.
  #
  # price_class is one of PriceClass_100, PriceClass_200 and PriceClass_All,
  # the price classes the CloudFront API Reference describes for
  # DistributionConfig, which also lists None without saying what it serves;
  # None and any other value halt the build. Unset, PriceClass_All,
  # CloudFront's default and the AWS provider's: every edge location serves
  # the distribution.
  #
  # cache_policy_id names the cache policy of the default cache behaviour, a
  # managed policy or one of the operator's, such as
  # 658327ea-f89d-4fab-a63d-7e88639e58f6, the managed CachingOptimized
  # (the Developer Guide's "Use managed cache policies"). Unset, the managed
  # CachingDisabled, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad, whose TTLs are
  # all 0, so CloudFront caches nothing and forwards every request. The
  # module's cache_policies input stays unset, so a cache policy of the
  # operator's is theirs, named here and never created; with a cache policy
  # named, the module writes no forwarded_values. A cache_policy_id that is
  # empty or not a string halts the build.
  #
  # tags is a map from each tag name to a string, written on the
  # distribution, the one resource the module creates here.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the upstream connection's host, and its port while no VPC
  #     origin is named; infra.waf_policy_id, as web_acl_id; and the
  #     overrides above. The Component declares no values.
  #   refused — an upstream target publishing no host, or a host written as
  #     an IP literal, or a port written as a number CloudFront does not
  #     take; host or custom_endpoint_certificate_arn without the other, a
  #     host that is not a bare DNS name the distribution takes, and a
  #     certificate ARN of another form or another Region; a vpc_origin_id
  #     or a cache_policy_id that is empty or not a string; a price_class
  #     outside those listed; tags that are not a map of strings; and any
  #     infra.overrides key not listed above.
  #   held by the Component — a second connection on the upstream socket,
  #     and a waf_policy_id that is not the ARN of a CLOUDFRONT web ACL.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the mapping writes beside these, so the distribution is the one the
  # CloudFormation Recipe of this Component creates, where the module's
  # defaults or the AWS provider's differ:
  #   enabled true, so the distribution takes requests once deployed.
  #   http_version http2, the module's and the provider's default, which the
  #     CloudFront API Reference gives as the default for a new distribution.
  #   is_ipv6_enabled true, the module's default, where the provider's is
  #     false, so the distribution answers IPv6 viewers as well, as the API
  #     Reference advises in general; a Route 53 alias record pointing the
  #     custom domain at the distribution then needs an AAAA record beside
  #     the A record, while a CNAME record needs nothing more.
  #   The origin, keyed by the upstream component's name, which is its
  #     origin_id and the default cache behaviour's target_origin_id. While
  #     no VPC origin is named, its custom_origin_config: origin_protocol_policy
  #     https-only, https_port the upstream's port or 443, http_port 80,
  #     which an https-only origin does not use but the module requires, and
  #     origin_ssl_protocols TLSv1.2 alone, the module's default, written
  #     out. CloudFront takes 80, 443 and 1024 to 65535 as an origin's port
  #     (the Developer Guide's "Origin settings").
  #   The default cache behaviour: viewer_protocol_policy redirect-to-https,
  #     where the module's default is https-only, so a request over HTTP is
  #     answered with a 301 to its HTTPS URL; allowed_methods GET, HEAD,
  #     OPTIONS, PUT, PATCH, POST and DELETE, where the module's default
  #     stops at OPTIONS, so every method reaches the origin; cached_methods
  #     GET and HEAD, the module's default; compress false, CloudFront's and
  #     the provider's default, where the module's is true, so CloudFront
  #     compresses nothing itself; and origin_request_policy_id
  #     b689b0a8-53d0-40ab-baf2-68738e2966ac, the managed
  #     AllViewerExceptHostHeader, so every viewer header but Host, every
  #     cookie and every query string reach the origin, and CloudFront sends
  #     the origin's domain name as Host (the Developer Guide's "Use managed
  #     origin request policies").
  #   The module's toggles that would create something beside the
  #     distribution: origin_access_control an empty map, where the module's
  #     default creates an origin access control for an Amazon S3 origin;
  #     create_monitoring_subscription, create_connection_function and
  #     enable_v2_logging false, each its default, written out. Its
  #     vpc_origin, cache_policies, origin_request_policies,
  #     response_headers_policies and cloudfront_functions inputs stay
  #     unset, so it creates none of those.
  #   retain_on_delete false and wait_for_deployment true, the provider's
  #     defaults, written out: below.
  #   Nothing else: the module's restrictions default, no geographic
  #     restriction; no logging_config; no default root object, custom error
  #     response, function, Lambda@Edge association or ordered cache
  #     behaviour; no comment.
  #
  # Waiting, the name and deletion. With wait_for_deployment true, the AWS
  # provider at 6.73.0 waits after each create and update until CloudFront
  # reports the distribution Deployed, up to 90 minutes
  # (internal/service/cloudfront/distribution.go). Every key above changes
  # the distribution in place. Renaming the component renames its module
  # block, so Terraform destroys the distribution and creates a new one,
  # with a new domain name; CloudFront refuses an alternate domain name
  # another distribution holds, and the order of that creation and
  # destruction is not set, so with infra.overrides.host set the creation can
  # fail on the name the old distribution still carries, which stops the
  # apply. A destroy, or
  # removing the component, deletes the distribution: CloudFront deletes a
  # distribution only once it is disabled (the API Reference's
  # DeleteDistribution), and the provider at 6.73.0 disables it, waits until
  # CloudFront reports it Deployed again, disabled, and deletes it, so a
  # destroy waits for that change to reach CloudFront's edge locations;
  # retain_on_delete true would leave it disabled instead.
  # The web ACL, the certificate, the VPC origin, the cache policy and the
  # DNS record are the operator's and stay, the record then naming a
  # distribution that no longer exists.
  #
  # Credentials. CloudFront holds no credential a consumer needs: clients
  # reach the distribution anonymously, and authenticating them is the
  # origin's work. The origin is reached without one, so nothing is
  # published but the distribution's address. Terraform authenticates to AWS
  # with the credentials in the environment it runs in, so the rendered
  # configuration names none. Backup. CloudFront keeps nothing to back up:
  # its cache holds copies of the origin's responses, and its configuration
  # is this mapping.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "host" "custom_endpoint_certificate_arn" "vpc_origin_id" "price_class" "cache_policy_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads host, custom_endpoint_certificate_arn, vpc_origin_id, price_class, cache_policy_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The name a consumer reaches the distribution at is a host name alone,
    # with no scheme, path, user or port: the distribution serves HTTPS on
    # 443.
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this distribution reaches it at, given as a DNS name alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the distribution serves HTTPS on 443` $h) -}}
      {{- end -}}
      {{- end -}}
    # CloudFront answers a request for the operator's name only as an
    # alternate domain name served with a certificate covering it, so host
    # and the certificate are set together, the name follows the rule given
    # above, and the certificate is named by its AWS Certificate Manager ARN
    # in us-east-1. The cloudformation Recipe of this Component holds the
    # same rules on host and CustomEndpointCertificateArn: each target reads
    # the certificate under its own spelling, so the rules cannot sit in the
    # Component.
    custom_domain: >-
      {{- $c := optional (optional .infra "overrides" dict) "custom_endpoint_certificate_arn" "" -}}
      {{- if not (or (kindIs "invalid" $c) (eq (toJson $c) `""`) (and (typeIs "string" $c) (regexMatch `^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[A-Za-z0-9-]+$` $c))) -}}
      {{- fail (printf "infra.overrides.custom_endpoint_certificate_arn is %s, and it is the ARN of the AWS Certificate Manager certificate the distribution serves its alternate domain name with, arn:aws:acm:us-east-1:<account>:certificate/<id>: set it in the Release to that ARN" (toJson $c)) -}}
      {{- end -}}
      {{- if and .locals.certificate_arn (not (regexMatch `^arn:aws:acm:us-east-1:` .locals.certificate_arn)) -}}
      {{- fail (printf "infra.overrides.custom_endpoint_certificate_arn is %q, and Amazon CloudFront takes an AWS Certificate Manager certificate only from US East (N. Virginia), us-east-1: request or import the certificate in us-east-1 and set infra.overrides.custom_endpoint_certificate_arn in the Release to its ARN" .locals.certificate_arn) -}}
      {{- end -}}
      {{- $h := .locals.operator_host -}}
      {{- if and $h (not .locals.certificate_arn) -}}
      {{- fail (printf "infra.overrides.host is %q, and Amazon CloudFront takes an alternate domain name only with a certificate covering it; without one, no client can reach the distribution by that name: set infra.overrides.custom_endpoint_certificate_arn in the Release to the ARN of an AWS Certificate Manager certificate in us-east-1 carrying the name, or remove infra.overrides.host to publish the distribution's own domain name" $h) -}}
      {{- end -}}
      {{- if and .locals.certificate_arn (not $h) -}}
      {{- fail "infra.overrides.custom_endpoint_certificate_arn is set, and it is the certificate of the distribution's alternate domain name, which is infra.overrides.host, which the Release leaves unset or empty: set infra.overrides.host in the Release to the DNS name the certificate carries, or remove infra.overrides.custom_endpoint_certificate_arn" -}}
      {{- end -}}
      {{- if $h -}}
      {{- if regexMatch `^[0-9]+(\.[0-9]+){3}$` $h -}}
      {{- fail (printf "infra.overrides.host is %q, an IP literal, and the distribution's alternate domain name is a DNS name, one the certificate it is served with carries: set infra.overrides.host in the Release to the DNS name the certificate in infra.overrides.custom_endpoint_certificate_arn carries" $h) -}}
      {{- end -}}
      {{- $labels := splitList "." $h -}}
      {{- $ok := and (ge (len $labels) 2) (le (len $h) 253) (ge (len (last $labels)) 2) -}}
      {{- range $labels }}{{ if not (regexMatch `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` .) }}{{ $ok = false }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.host is %q, and the distribution's alternate domain name is a DNS name of two labels or more and 253 characters at most, each label 1 to 63 lower-case letters, digits and hyphens neither beginning nor ending with a hyphen, the last two characters or more, with no upper-case letter, which CloudFront does not take in an alternate domain name, and no wildcard, which names no host a consumer can reach: set infra.overrides.host in the Release to such a name, one the certificate in infra.overrides.custom_endpoint_certificate_arn carries" $h) -}}
      {{- end -}}
      {{- end -}}
    # The operator's VPC origin, the price class and the cache policy, each
    # passed to the module as written, so one of another shape would render
    # an argument the AWS provider or CloudFront refuses. The cloudformation
    # Recipe of this Component holds the same rules on VpcOriginId,
    # PriceClass and CachePolicyId, for the reason given above.
    distribution_settings: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "vpc_origin_id" -}}
      {{- if not (and (typeIs "string" $o.vpc_origin_id) $o.vpc_origin_id) -}}
      {{- fail (printf "infra.overrides.vpc_origin_id is %s, and it is the ID of the operator's CloudFront VPC origin, given as a string: set it in the Release to that ID, or remove it to reach the upstream's host over the internet" (toJson $o.vpc_origin_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "price_class" -}}
      {{- if not (has $o.price_class (list "PriceClass_100" "PriceClass_200" "PriceClass_All")) -}}
      {{- fail (printf "infra.overrides.price_class is %s, and this Recipe takes PriceClass_100, PriceClass_200 or PriceClass_All, the price classes the CloudFront API Reference describes: set it in the Release to one of them, or remove it for PriceClass_All" (toJson $o.price_class)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "cache_policy_id" -}}
      {{- if not (and (typeIs "string" $o.cache_policy_id) $o.cache_policy_id) -}}
      {{- fail (printf "infra.overrides.cache_policy_id is %s, and it is the ID of a CloudFront cache policy, managed or the operator's, given as a string such as 658327ea-f89d-4fab-a63d-7e88639e58f6: set it in the Release to that ID, or remove it to cache nothing" (toJson $o.cache_policy_id)) -}}
      {{- end -}}
      {{- end -}}
    # The module types tags as a map of strings.
    tags_map: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the distribution takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # upstream connection is read first: the target it reaches must publish a
  # host, which becomes the origin's domain_name. The host is copied as the
  # target publishes it: a name, or a reference to another module's output,
  # which resolves in the boundary's root configuration for a target in the
  # same boundary. A host written as an IPv4 or IPv6 literal halts, since an
  # origin's domain name is a publicly resolvable DNS name (the Developer
  # Guide's "Origin settings"); a reference is resolved by Terraform and not
  # judged here. While no VPC origin is named, the port the target publishes
  # is the origin's https_port, and 443 where it publishes none; a port
  # written as a number other than 80, 443 or 1024 to 65535 halts, and a
  # port given as a reference is passed as written and not judged here. The
  # VPC origin's ID, the web ACL's ARN, the cache policy's ID and each tag
  # reach CloudFront as written: Terraform would read ${ and %{ inside a
  # string as the start of an interpolation or a directive. The mapping
  # writes ${ as $${, which Terraform turns back into the characters written;
  # the terraform provider writes every module argument with %{ already
  # escaped as %%{, so the mapping leaves %{ as it is.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    {{- $id := .context.instance_id }}
    {{- $vpc := .locals.vpc_origin_id }}
    {{- $host := "" }}
    {{- $port := "443" }}
    {{- $origin := "" }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "upstream" }}
    {{- $p := optional $edge "provides" dict }}
    {{- if not (hasKey $p "host") }}
    {{- fail (printf "the upstream connection %q of %q reaches %q, which publishes no host, and Amazon CloudFront forwards every request to the host its origin names: wire upstream in the Aggregate to a component that publishes host" $alias $id $edge.target) }}
    {{- end }}
    {{- $host = printf "%v" $p.host }}
    {{- $origin = $edge.target }}
    {{- if or (regexMatch `^[0-9]+(\.[0-9]+){3}$` $host) (and (contains ":" $host) (not (contains "${" $host))) }}
    {{- fail (printf "the upstream connection %q of %q reaches %q, which publishes the host %q, an IP literal, and an Amazon CloudFront origin is a publicly resolvable DNS name: wire upstream in the Aggregate to a component that publishes a DNS name, or give that component a DNS name as its host in the Release" $alias $id $edge.target $host) }}
    {{- end }}
    {{- if and (not $vpc) (hasKey $p "port") }}
    {{- $port = printf "%v" $p.port }}
    {{- if regexMatch `^[0-9]+$` $port }}
    {{- $n := atoi $port }}
    {{- if not (or (eq $n 80) (eq $n 443) (and (ge $n 1024) (le $n 65535))) }}
    {{- fail (printf "the upstream connection %q of %q reaches %q, which publishes the port %s, and Amazon CloudFront connects to an origin on port 80, 443 or 1024 to 65535: wire upstream in the Aggregate to a component serving HTTPS on such a port" $alias $id $edge.target $port) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $originConfig := dict "domain_name" $host }}
    {{- if $vpc }}
    {{- $_ := set $originConfig "vpc_origin_config" (dict "vpc_origin_id" (replace "${" "$${" $vpc)) }}
    {{- else }}
    {{- $_ := set $originConfig "custom_origin_config" (dict "origin_protocol_policy" "https-only" "http_port" 80 "https_port" (ternary (atoi $port) $port (regexMatch `^[0-9]+$` $port)) "origin_ssl_protocols" (list "TLSv1.2")) }}
    {{- end }}
    create: true
    enabled: true
    http_version: "http2"
    is_ipv6_enabled: true
    price_class: {{ toJson (optional $o "price_class" "PriceClass_All") }}
    {{- with .infra.waf_policy_id }}
    web_acl_id: {{ toJson . | replace "${" "$${" }}
    {{- end }}
    origin: {{ toJson (dict $origin $originConfig) }}
    default_cache_behavior: {{ toJson (dict "target_origin_id" $origin "viewer_protocol_policy" "redirect-to-https" "allowed_methods" (list "GET" "HEAD" "OPTIONS" "PUT" "PATCH" "POST" "DELETE") "cached_methods" (list "GET" "HEAD") "compress" false "cache_policy_id" (replace "${" "$${" (optional $o "cache_policy_id" "4135ea2d-6df8-44a3-9df3-4b5a84be39ad")) "origin_request_policy_id" "b689b0a8-53d0-40ab-baf2-68738e2966ac") }}
    {{- if .locals.operator_host }}
    aliases: [{{ toJson .locals.operator_host }}]
    viewer_certificate: {{ toJson (dict "acm_certificate_arn" .locals.certificate_arn "ssl_support_method" "sni-only" "minimum_protocol_version" "TLSv1.2_2021") }}
    {{- else }}
    viewer_certificate: {{ toJson (dict "cloudfront_default_certificate" true "minimum_protocol_version" "TLSv1") }}
    {{- end }}
    origin_access_control: {}
    create_monitoring_subscription: false
    create_connection_function: false
    enable_v2_logging: false
    retain_on_delete: false
    wait_for_deployment: true
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}
