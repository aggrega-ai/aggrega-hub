# Content pins for this entity's external inputs, written by `aggrega pin`.
# Commit it beside the entity. Run `aggrega pin` on the entity again to bring it up to date.
version: 1
localSourceDigests:
  - path: module/main.tf
    digest: sha256:801788f24c7fa52719bddeec49ac00a257e8cb8dca4b71b4050e2d76250835f7
  - path: module/variables.tf
    digest: sha256:b6600cb4bc6cd4297c35a959f00018c32fcf92e1534973d640364240530c4032
ignore:
  plugin:
    name: provider/terraform
    patterns:
      - .git/
      - .hg/
      - .svn/
      - .bzr/
      - .terraform/
    files:
      - .terraformignore
  rules:
    - pattern: .git/
      within: module
      from: plugin
    - pattern: .hg/
      within: module
      from: plugin
    - pattern: .svn/
      within: module
      from: plugin
    - pattern: .bzr/
      within: module
      from: plugin
    - pattern: .terraform/
      within: module
      from: plugin
