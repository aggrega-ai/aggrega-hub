apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-event-hubs
  version: 1.0.0
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Event Hubs: one namespace, with the event hubs values.eventhubs
    declares, rendered as Terraform for the azurerm provider by a module
    kept beside this Recipe, not by Microsoft's Azure Verified Modules
    module Azure/avm-res-eventhub-namespace/azurerm, whose root calls a
    module from the Terraform registry.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-event-hubs where it deploys an Azure Resource Manager
    template. It needs hashicorp/azurerm 5.14 or later, so it goes in a
    boundary apart from Recipes whose modules admit azurerm 4 alone.
    infra.overrides names the operator's resource group and region. The
    namespace runs on the Standard tier unless infra.overrides.sku_name
    names Premium, on one throughput or processing unit unless
    infra.overrides.sku_capacity names more. Public network access is on
    unless infra.overrides.public_network_access_enabled is false; the
    private endpoint is the operator's. Each event hub keeps its events one
    day and takes 2 partitions unless values.eventhubs.<name>.partition_count
    sets another count.

    Shared access signature authentication is off, so the namespace takes
    Microsoft Entra ID alone. host is a reference to the namespace's name
    under servicebus.windows.net, or infra.overrides.host; endpoint is the
    URL on host and bootstrap_servers host with port 9093. A value or an
    infra.overrides key the service cannot take halts naming it, as do the
    Basic tier, which serves no Kafka endpoint, and more event hubs or
    partitions than the tier takes.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/azure-event-hubs:1.0.0

  # The module beside this Recipe, module/main.tf and module/variables.tf,
  # declares the namespace as an azurerm_eventhub_namespace and each event hub
  # as an azurerm_eventhub, and nothing else. `aggrega pin` records the digest
  # of each file in entity.lock, and every build reads exactly those bytes.
  #
  # Microsoft's Azure Verified Modules programme publishes a Terraform module
  # for the service, Azure/avm-res-eventhub-namespace/azurerm, MIT, at v0.2.0
  # its newest version. Its root configuration calls the registry module
  # Azure/avm-utl-interfaces/azure for its private endpoints, whatever the
  # caller passes, so initialising a configuration that sources it fetches a
  # module from the Terraform registry, which the catalog's sourced modules do
  # not do. The module is therefore not sourced, and no module telemetry
  # exists to turn off.
  #
  # The module declares hashicorp/azurerm "~> 5.14", the catalog's one Azure
  # provider constraint, so a Release places this namespace in a terraform
  # boundary whose bodies install azurerm 5, apart from any module admitting
  # azurerm 4 alone.
  source: ./module

  locals:
    # The tier, infra.overrides.sku_name or Standard. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # Each event hub's partition count, values.eventhubs.<name>.partition_count
    # or 2, the default of Microsoft's Verified Module for an event hub, as a
    # JSON object from name to count, which the assertions and the mapping
    # read.
    partitions: '{{ $m := dict }}{{ range $name, $h := (default dict .values.eventhubs) }}{{ $_ := set $m $name (int (optional $h "partition_count" 2)) }}{{ end }}{{ toJson $m }}'
    # The name the Release gives the namespace under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name            - string (resource_group_name), required
  #   location                       - string (location), required
  #   sku_name                       - string (sku, Standard or Premium; default Standard)
  #   sku_capacity                   - integer (capacity: throughput units, 1 to 40, on
  #                                    Standard; processing units, 1, 2, 4, 6, 8, 10, 12
  #                                    or 16, on Premium; default 1)
  #   public_network_access_enabled  - bool (public_network_access_enabled; default true)
  #   tags                           - map[string]string (tags of the namespace)
  #   host                           - string (published as provides.host and in provides.endpoint
  #                                    and provides.bootstrap_servers; not passed to the module)
  # enable_telemetry halts by name: the module is this catalog's own, with no
  # telemetry to turn on or off. Any other key halts naming it.
  #
  # Each is named by the resource argument it sets, given in brackets, save
  # sku_name and sku_capacity, which every Azure Recipe reads for the tier a
  # service is provisioned at and the units it is provisioned with, and host,
  # which every managed Recipe reads for the address it publishes.
  # arm/azure-event-hubs reads each of them but resource_group_name under the
  # same spelling: its template deploys into the group it is deployed to.
  # resource_group_name and location are required: they place the namespace
  # in the operator's subscription, and this Recipe never chooses either. The
  # namespace takes the resource group by its name, so nothing is composed
  # from the subscription Terraform runs against.
  #
  # sku_name. Microsoft documents the tiers in its quotas and limits for the
  # service: Basic, Standard, Premium, with resources isolated per tenant, and
  # Dedicated, a cluster of the reader's own, which this Recipe does not
  # offer. Microsoft documents that the Basic tier serves no Kafka endpoint,
  # which this Recipe publishes in bootstrap_servers, so Basic halts below by
  # name. Unset, the namespace runs on Standard, the lowest tier serving every
  # key the Component publishes; any other spelling halts below. The provider
  # replaces a namespace moved to or from Premium.
  #
  # sku_capacity. Microsoft documents that a Standard namespace takes up to 40
  # throughput units and a Premium namespace 1, 2, 4, 6, 8, 10, 12 or 16
  # processing units. Unset, the namespace runs on one, the provider's own
  # default; another number halts below. Auto-inflate is off, so the units
  # stay as set.
  #
  # The event hubs. Microsoft documents what each tier takes: on Standard, up
  # to 10 event hubs in a namespace and 32 partitions in each; on Premium, 100
  # partitions in each, and 100 event hubs and 200 partitions across the
  # namespace for each processing unit. An event hub's partition count is 2
  # unless values.eventhubs.<name>.partition_count sets it, and a count or a
  # number of event hubs beyond the tier's halts below, naming it. Microsoft
  # documents that an event hub's partition count on Standard never changes
  # once it is created, and on Premium only grows; the provider halts when it
  # applies a lower count, or a changed one off Premium.
  #
  # public_network_access_enabled. A namespace takes requests over its public
  # endpoint, from every network unless IP rules restrict it, or over a
  # private endpoint in a virtual network, which Microsoft offers on Standard
  # and above. Unset or true, the provider's own default and the service's,
  # public network access is on, and since this Recipe passes no network rule
  # set the public endpoint takes requests from every network, each still
  # authenticated with Microsoft Entra ID; false turns it off, and the
  # namespace takes requests through a private endpoint alone. This Recipe
  # emits no private endpoint: it is the operator's, created for the namespace
  # outside the Release, the way a virtual network's subnets and private DNS
  # zones are.
  #
  # The module sets these beside the arguments the keys above set:
  # local_authentication_enabled false, whose default is true, so the contract
  # that no key reaches a consumer stands in the configuration itself;
  # minimum_tls_version 1.2; and auto_inflate_enabled false. Each event hub
  # takes message_retention 1, one day: the provider requires the argument,
  # every tier takes that retention, and arm/azure-event-hubs writes the same
  # one; no key changes it. The
  # service's own defaults stand for every argument the module leaves out:
  # the Kafka endpoint, which Microsoft documents as enabled on its own on a
  # namespace of every tier but Basic; zone redundancy, which Microsoft
  # documents as automatic in a region with availability zones; and no
  # managed identity, network rule set, private endpoint, consumer group
  # beyond $Default, Capture or authorization rule.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # provider's resource schema:
  #   honoured — values.eventhubs, as the namespace's event hubs, each with
  #     its partition_count; and the overrides above.
  #   refused — a namespace name the service refuses; two event hubs whose
  #     names differ only in case; the Basic tier; more event hubs, more
  #     partitions in an event hub or, on Premium, more partitions across the
  #     namespace than the tier takes; an
  #     infra.overrides.resource_group_name or location left out or given as
  #     anything but a string; and any infra.overrides key not listed above,
  #     or a value of one the service cannot take. An event hub name and a
  #     partition count outside what the service takes on any tier are
  #     refused by the Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Backup. Microsoft documents Event Hubs as no long-term store; its guidance
  # on backup and restore names each event hub's retention and Capture rather
  # than a backup, so this Recipe configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the namespace is created in, by its name, such as example-rg" "location" "the one Azure region the namespace is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its Event Hubs namespace in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "sku_name" "sku_capacity" "public_network_access_enabled" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the Event Hubs namespace in a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, sku_name, sku_capacity, public_network_access_enabled, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the namespace's public network access as a boolean: set it to false to turn it off, or to true or remove it to keep it on" $p) -}}
      {{- end -}}
    # The tiers and their units, read off Microsoft's quotas and limits for
    # the service and its scalability guide: Standard and Premium, spelt so,
    # with Basic refused for the Kafka endpoint it does not serve; up to 40
    # throughput units on Standard; 1, 2, 4, 6, 8, 10, 12 or 16 processing
    # units on Premium. The provider checks neither count.
    sku: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := optional $o "sku_name" "Standard" -}}
      {{- if eq (toString $s) "Basic" -}}
      {{- fail "infra.overrides.sku_name is Basic, a tier Microsoft documents as serving no Kafka endpoint, which this Recipe publishes in bootstrap_servers: set infra.overrides.sku_name to Standard or Premium, or remove it for Standard" -}}
      {{- end -}}
      {{- if not (has $s (list "Standard" "Premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and this Recipe provisions an Event Hubs namespace on the Standard or the Premium tier, spelt so: set infra.overrides.sku_name to one of them, or remove it for Standard" $s) -}}
      {{- end -}}
      {{- $c := optional $o "sku_capacity" 1 -}}
      {{- $whole := or (kindIs "int" $c) (kindIs "int64" $c) (and (kindIs "float64" $c) (eq (float64 (int $c)) $c)) -}}
      {{- if eq $s "Standard" -}}
      {{- if not (and $whole (ge (int $c) 1) (le (int $c) 40)) -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and Microsoft documents a Standard Event Hubs namespace as taking 1 to 40 throughput units: set infra.overrides.sku_capacity to a whole number in that range, or remove it for one" $c) -}}
      {{- end -}}
      {{- else if not (and $whole (has (int $c) (list 1 2 4 6 8 10 12 16))) -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and Microsoft documents a Premium Event Hubs namespace as taking 1, 2, 4, 6, 8, 10, 12 or 16 processing units: set infra.overrides.sku_capacity to one of them, or remove it for one" $c) -}}
      {{- end -}}
    # What each tier takes, read off Microsoft's quotas and limits for the
    # service: on Standard, 10 event hubs in a namespace and 32 partitions in
    # each; on Premium, 100 partitions in each, and 100 event hubs and 200
    # partitions across the namespace for each processing unit. The provider
    # checks a partition count against 1,024 alone, a Dedicated cluster's
    # limit.
    eventhub_limits: >-
      {{- $s := .locals.sku -}}
      {{- $parts := fromJson .locals.partitions -}}
      {{- $n := len $parts -}}
      {{- if eq $s "Standard" -}}
      {{- if gt $n 10 -}}
      {{- fail (printf "values.eventhubs declares %d event hubs, and Microsoft documents a Standard Event Hubs namespace as holding 10: declare at most 10 in the Aggregate, or set infra.overrides.sku_name to Premium in the Release" $n) -}}
      {{- end -}}
      {{- range $name, $p := $parts -}}
      {{- if gt (int $p) 32 -}}
      {{- fail (printf "values.eventhubs.%s.partition_count is %d, and Microsoft documents an event hub on the Standard tier as taking 32 partitions at most: set partition_count to 32 or fewer in the Aggregate, or infra.overrides.sku_name to Premium in the Release" $name (int $p)) -}}
      {{- end -}}
      {{- end -}}
      {{- else if eq $s "Premium" -}}
      {{- $pu := int (optional (optional .infra "overrides" dict) "sku_capacity" 1) -}}
      {{- if gt $n (mul 100 $pu) -}}
      {{- fail (printf "values.eventhubs declares %d event hubs, and Microsoft documents a Premium Event Hubs namespace as holding 100 for each processing unit, %d on the %d infra.overrides.sku_capacity gives: declare fewer in the Aggregate, or raise infra.overrides.sku_capacity in the Release" $n (mul 100 $pu) $pu) -}}
      {{- end -}}
      {{- $total := 0 -}}
      {{- range $name, $p := $parts -}}
      {{- if gt (int $p) 100 -}}
      {{- fail (printf "values.eventhubs.%s.partition_count is %d, and Microsoft documents an event hub on the Premium tier as taking 100 partitions at most: set partition_count to 100 or fewer in the Aggregate" $name (int $p)) -}}
      {{- end -}}
      {{- $total = add $total (int $p) -}}
      {{- end -}}
      {{- if gt $total (mul 200 $pu) -}}
      {{- fail (printf "values.eventhubs asks for %d partitions across its event hubs, and Microsoft documents a Premium Event Hubs namespace as taking 200 for each processing unit, %d on the %d infra.overrides.sku_capacity gives: ask for fewer in the Aggregate, or raise infra.overrides.sku_capacity in the Release" $total (mul 200 $pu) $pu) -}}
      {{- end -}}
      {{- end -}}
    # Microsoft documents that Azure resource names are case-insensitive
    # unless noted, and its naming rules note nothing else for an event hub,
    # so two event hubs whose names differ only in case name one.
    eventhub_name_shared: >-
      {{- $seen := dict -}}
      {{- range $name, $_ := (default dict .values.eventhubs) -}}
      {{- if hasKey $seen (lower $name) -}}
      {{- fail (printf "values.eventhubs.%s and values.eventhubs.%s name one event hub, since Azure resource names are case-insensitive: rename one of them in the Aggregate" (get $seen (lower $name)) $name) -}}
      {{- end -}}
      {{- $_ := set $seen (lower $name) $name -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a consumer of this namespace reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the namespace answers HTTPS on port 443 and Kafka on 9093, and endpoint and bootstrap_servers are built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The namespace is named after the component, and its name is also the
    # first label of the address the service gives it under
    # servicebus.windows.net, so it is unique across Azure. Microsoft's naming
    # rules give a namespace name 6 to 50 letters, digits and hyphens,
    # beginning with a letter and ending with a letter or a digit, the rule
    # the provider's own validation holds too; it is checked here, where the
    # name is known.
    namespace_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z][A-Za-z0-9-]{4,48}[A-Za-z0-9]$` $n) -}}
      {{- fail (printf "the component %q names its Event Hubs namespace, and Microsoft documents a namespace name as 6 to 50 letters, digits and hyphens, beginning with a letter and ending with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # azurerm provider reports no address for a namespace, so the module forms
  # host from the namespace's name and servicebus.windows.net, the domain
  # Azure's public cloud gives every Event Hubs namespace: the fully qualified
  # namespace an Event Hubs client library connects to. endpoint is
  # https://<host>:443/, the form in which the service reports a namespace's
  # endpoint, and bootstrap_servers is <host>:9093, the namespace's Kafka
  # endpoint. Each reads the module output of the same name from this
  # component's module call, which the boundary's root configuration declares
  # under .context.instance_id for a component declared in the Aggregate the
  # Release deploys, and which waits for every event hub. Terraform resolves
  # it at apply time, so it resolves only for a consumer authored as a source:
  # Recipe in the same root configuration; a consumer on another target
  # receives it as text. In another Azure cloud the namespace sits under that
  # cloud's own domain, and the Release names it in infra.overrides.host.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, endpoint is https://<name>:443/ and
  # bootstrap_servers <name>:9093. It is the operator's deterministic pointer:
  # the compiler pipes it as text and looks nothing up, and this Recipe emits
  # no DNS record for it, so the operator points the name at the namespace
  # outside the Release. A client checking the namespace's certificate needs a
  # name the certificate carries, which is the namespace's own name under
  # servicebus.windows.net or the private link name that resolves to it. A
  # consumer in the same root configuration receives the name as well, and a
  # name carries no reference for Terraform to order its module after this one
  # by; a later syncWave on the consumer's boundary, sharing this boundary's
  # directory, orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.host}{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}:443/{{ else }}${module.{{ .context.instance_id }}.endpoint}{{ end }}"
    bootstrap_servers: "{{ if .locals.operator_host }}{{ .locals.operator_host }}:9093{{ else }}${module.{{ .context.instance_id }}.bootstrap_servers}{{ end }}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable. The
  # namespace is named after the component, as the other managed Recipes name
  # theirs. Each event hub is one entry of eventhubs, keyed by its name, with
  # its partition count, 2 unless set.
  #
  # The resource group's name, the region and each tag reach Azure as written:
  # each is written as its JSON text, which keeps a double quote inside it a
  # character of the value, and the root configuration writes a module
  # argument's %{ as %%{ itself and keeps ${, which a reference to another
  # module's output needs, so ${ inside them is written $${ here, which
  # Terraform turns back into the characters written.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name | replace "${" "$${" }}
    location: {{ toJson $o.location | replace "${" "$${" }}
    sku: "{{ .locals.sku }}"
    capacity: {{ int (optional $o "sku_capacity" 1) }}
    public_network_access_enabled: {{ if optional $o "public_network_access_enabled" true }}true{{ else }}false{{ end }}
    eventhubs:
    {{- range $name, $p := (fromJson .locals.partitions) }}
      {{ toJson $name }}:
        partition_count: {{ int $p }}
    {{- else }} {}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The azurerm provider refuses to plan
  # without its features block, and the module carries no provider block of
  # its own, so it inherits this configuration; the provider reads its
  # credentials and subscription from the environment Terraform runs in.
  # Terraform destroys the module's resources with it, so the file stays while
  # any component declaring it does: remove the last of them from a Release
  # only after destroying what their modules created, because with the file
  # gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
