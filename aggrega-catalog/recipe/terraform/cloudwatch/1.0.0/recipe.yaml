apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloudwatch
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # CloudWatch module: the third-party code this Recipe pins and writes into
  # the output. The log group it declares is a service the reader contracts
  # for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon CloudWatch Logs, realized by the log-group module of the
    terraform-aws-modules project's CloudWatch package,
    terraform-aws-modules/cloudwatch/aws//modules/log-group at v6.0.0,
    Apache-2.0, fetched from its git repository at that tag and pinned by
    the commit it names in the entity.lock beside this Recipe: one log group
    named after the component, in the Standard log class, keeping each event
    for infra.retention_days or, unset, with no expiry. log_group_name and
    arn publish the module's outputs, as Terraform references that resolve
    for a consumer authored as a source: Recipe in the same root
    configuration.

    CloudWatch Logs encrypts the events it ingests with the operator's KMS
    key where kms_key_id names the key by its ARN, and tags label the
    group. No log stream, filter, policy, role or key is created. Renaming
    the component replaces the group, and a destroy, or removing the group
    from the configuration, deletes it, each with every event it holds.

    infra.overrides.host halts the build, since a writer names the group
    rather than an address, as do a log_group_class other than STANDARD, a
    kms_key_id other than a key's ARN, tags that are not a map of strings
    and any infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/observability/cloudwatch:1.0.0

  # The published module, at the tag the registry publishes as version 6.0.0.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # module_subdir names the repository's modules/log-group directory, the
  # module for one log group. The repository's root module is not loaded:
  # the package publishes each CloudWatch resource as a module of its own
  # under modules/. That directory is whole: none of its files reaches
  # outside it, and it declares no module call, so the configuration
  # Terraform loads from it calls no registry module and initialising it
  # fetches providers and nothing else. It declares one resource,
  # aws_cloudwatch_log_group, and nothing else.
  #
  # The module declares hashicorp/aws >= 6.25 and Terraform >= 1.0 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-cloudwatch.git
    ref: v6.0.0
    module_subdir: modules/log-group

  # The String Pipe: the compiler does not interpret these strings.
  # log_group_name and arn name the module's cloudwatch_log_group_name and
  # cloudwatch_log_group_arn outputs, through this component's module call,
  # which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The ARN is the group's ARN with no trailing :*, the form
  # CloudWatch Logs calls logGroupArn: the AWS provider removes the :* the
  # service appends to the other form when it reads the group back (aws
  # provider 6.73.0, internal/service/logs/group.go and arn.go). Terraform
  # resolves both
  # at apply time, so they resolve only for a consumer authored as a source:
  # Recipe in the same root configuration, which, reading either, is applied
  # after the group; a consumer on another target receives them as text.
  provides:
    log_group_name: "${module.{{ .context.instance_id }}.cloudwatch_log_group_name}"
    arn: "${module.{{ .context.instance_id }}.cloudwatch_log_group_arn}"

  # This Recipe reads from infra.overrides:
  #   log_group_class - string (log_group_class), STANDARD alone
  #   kms_key_id      - string (kms_key_id)
  #   tags            - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # log_group_class is the module's input, and the AWS provider's argument,
  # of the same name; kms_key_id and tags are the keys, under the same names,
  # that the catalog's terraform AWS Recipes read for the KMS key a resource
  # is encrypted with and for its tags, so a Release names each once
  # whichever Recipe it configures.
  #
  # log_group_class is STANDARD, which is written whether the key is set or
  # not, so the group supports every CloudWatch Logs feature (the Amazon
  # CloudWatch Logs User Guide's "Log classes"). Every other class is refused
  # by name, each for its own reason:
  #   INFREQUENT_ACCESS, the class CloudWatch Logs also calls Essentials:
  #     from December 2026 CloudWatch Logs reports such a group's class as
  #     ESSENTIALS, a change of name alone ("Log classes"), and the AWS
  #     provider reads the class back from the group and replaces the group
  #     whenever the class it reads differs from the one configured (aws
  #     provider 6.73.0: log_group_class forces a new resource, with no rule
  #     treating the names as one), so a group configured as
  #     INFREQUENT_ACCESS would be planned for replacement, which deletes
  #     every event it holds.
  #   ESSENTIALS: the AWS provider refuses it at plan, since its check takes
  #     STANDARD, INFREQUENT_ACCESS and DELIVERY alone (aws provider 6.73.0
  #     and 6.74.0, on the AWS SDK for Go's cloudwatchlogs module 1.90.2).
  #   DELIVERY: CloudWatch Logs reserves that class for delivering AWS
  #     Lambda logs to Amazon S3 or Amazon Data Firehose and keeps its events
  #     for a fixed short period of its own (the API Reference's
  #     CreateLogGroup and "Log classes"), which infra.retention_days could
  #     not set; the provider then sets no retention at all.
  # Any other value halts the build too. CloudWatch Logs fixes a group's
  # class when it creates the group ("Log classes": "After a log group is
  # created, its log class can't be changed").
  #
  # kms_key_id names the operator's KMS key by its ARN,
  # arn:<partition>:kms:<region>:<account>:key/<key id>, the key ID a UUID
  # or, for a multi-Region key, mrk- and 32 hexadecimal digits: CloudWatch
  # Logs takes the ARN of a key for this field (the API Reference's
  # CreateLogGroup and AssociateKmsKey), and does not document an alias for
  # it, so an alias ARN, an alias name such as alias/example-key and a bare
  # key ID halt the build. The AWS provider passes the string to CloudWatch
  # Logs unchecked and keeps what the service reports back, so a value of
  # another form would fail only at apply, or differ from what is read back
  # at every plan. The key encrypts every log event the group ingests while
  # it is associated, through the event's retention period; CloudWatch Logs
  # Insights query results over the group are not encrypted with this key: an
  # account-level query-result association, where one exists, or CloudWatch
  # Logs' default encryption encrypts them (AssociateKmsKey).
  # CloudWatch Logs takes a symmetric key alone, and a key in the group's
  # Region whose key policy lets the service principal
  # logs.<region>.amazonaws.com use it (the Amazon CloudWatch Logs User
  # Guide's "Encrypt log data in CloudWatch Logs using AWS Key Management
  # Service"); the key, its policy and the permissions of the roles that
  # write and read the group are the operator's, named here and never
  # created. CloudWatch Logs refuses a key that does not exist or is
  # disabled when it associates it. Unset, CloudWatch Logs encrypts the
  # events at rest with its own AES-GCM encryption and no KMS key.
  #
  # Changing or removing kms_key_id updates the group in place: the AWS
  # provider associates the new key or disassociates the old one (aws
  # provider 6.73.0), which takes up to five minutes to take effect. Events
  # ingested before stay encrypted under the key they were ingested with,
  # CloudWatch Logs can return them only while that key stays enabled and
  # usable by it, and deleting that key leaves them unusable
  # (AssociateKmsKey; "Encrypt log data").
  #
  # tags is a map from each tag name to a string, written on the group, the
  # one resource the module creates here, as the module writes it: the
  # module adds no tag of its own.
  #
  # host is refused by name. CloudWatch Logs publishes no address of a log
  # group of its own: a writer calls the service's endpoint in the group's
  # Region and names the group, so this Component publishes no host for the
  # name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — infra.retention_days (retention_in_days, left out while
  #     unset, so the module passes none and events never expire), and the
  #     overrides above.
  #   refused — a log_group_class of INFREQUENT_ACCESS, of ESSENTIALS, of
  #     DELIVERY or of any value but STANDARD; a kms_key_id other than a key's
  #     ARN; tags that are not a map of strings; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — infra.retention_days to the periods CloudWatch
  #     Logs takes, and the component's name, which names the group, to the
  #     service's rule for a group name.
  #   not read — none; the Component declares no other value or infra key.
  #
  # Retention. While infra.retention_days is unset the AWS provider sets no
  # retention policy, and removing it from a deployed group deletes the
  # group's retention policy, so events no longer expire (aws provider
  # 6.73.0). Where an account-level retention policy applies to the group,
  # CloudWatch Logs reports that policy's period as the group's (the API
  # Reference's PutRetentionPolicy), and the provider, which reads the
  # period back, plans to set the configured one again at each run while the
  # policy applies.
  #
  # The module's other inputs keep their defaults, each leaving the setting
  # to the AWS provider's or the service's own: create, so the group is
  # created; name_prefix, unset, as the exact name is written;
  # deletion_protection_enabled, unset, so deletion protection stays off as
  # CloudWatch Logs creates a group by default (CreateLogGroup); and
  # skip_destroy, unset, so a destroy deletes the group rather than leaving
  # it outside Terraform's state. The Region is that of the AWS provider the
  # root configures.
  #
  # The name. The group is named after the component, and the AWS provider
  # replaces the group when its name changes (aws provider 6.73.0: name
  # forces a new resource). Renaming the component makes Terraform destroy
  # the old group, with every event it holds, before creating one under the
  # new name, Terraform's order for a replacement unless the module asks for
  # the reverse, which this one does not. A group's name is unique within
  # its account and Region (CreateLogGroup), so an apply naming a group that
  # already exists there fails to create it.
  #
  # Deletion. A destroy, or removing the component, deletes the group, and
  # CloudWatch Logs "permanently deletes all the archived log events
  # associated with the log group" (the API Reference's DeleteLogGroup).
  # CloudWatch Logs keeps no backup to restore them from.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "log_group_class" "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon CloudWatch Logs publishes no address of a log group: a writer calls the service's endpoint in the group's Region and names the group by log_group_name: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads log_group_class, kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # log_group_class is STANDARD as the header says, kms_key_id the ARN of a
    # key, and tags the map of strings the module's tags input is typed as.
    # The same refusal of DELIVERY and of any value but the admitted ones,
    # and the same key ARN check, stand in cloudformation/cloudwatch: the
    # override key is spelt differently per target, so the checks cannot sit
    # in the realization-neutral Component, and a MappingLibrary imports a
    # whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "log_group_class" -}}
      {{- $c := get $o "log_group_class" -}}
      {{- if eq (toString $c) "INFREQUENT_ACCESS" -}}
      {{- fail "infra.overrides.log_group_class is \"INFREQUENT_ACCESS\", and from December 2026 CloudWatch Logs reports that class as ESSENTIALS, which the AWS provider reads back as a change of class and answers by replacing the group, deleting every event it holds: remove it from the Release for STANDARD" -}}
      {{- else if eq (toString $c) "ESSENTIALS" -}}
      {{- fail "infra.overrides.log_group_class is \"ESSENTIALS\", the name CloudWatch Logs also gives the Infrequent Access class, and the AWS provider refuses it when it plans, taking STANDARD, INFREQUENT_ACCESS and DELIVERY alone, of which this Recipe creates STANDARD: remove it from the Release" -}}
      {{- else if eq (toString $c) "DELIVERY" -}}
      {{- fail "infra.overrides.log_group_class is \"DELIVERY\", and CloudWatch Logs reserves the Delivery class for delivering AWS Lambda logs to Amazon S3 or Amazon Data Firehose, keeping its events for a fixed short period that infra.retention_days cannot set: remove it from the Release for STANDARD" -}}
      {{- else if not (and (typeIs "string" $c) (eq $c "STANDARD")) -}}
      {{- fail (printf "infra.overrides.log_group_class is %s, and this Recipe creates a log group in the class STANDARD, spelt so: set it to STANDARD in the Release, or remove it" (toJson $c)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32})$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and CloudWatch Logs takes the KMS key a log group is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/<key id>, not an alias or a bare key ID: set it to the key's ARN in the Release, or remove it to encrypt the events without a KMS key" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input.
  # infra.retention_days reaches the mapping as the Component's schema and
  # assertions hold it, one of the periods CloudWatch Logs takes, written as
  # a whole number. Each tag reaches CloudWatch Logs as written: Terraform
  # would read ${ and %{ inside a string as the start of an interpolation or
  # a directive, so they are written $${ and %%{, which Terraform turns back
  # into the characters written.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    name: {{ toJson .context.instance_id }}
    log_group_class: "STANDARD"
    {{- with optional .infra "retention_days" nil }}
    retention_in_days: {{ int64 . }}
    {{- end }}
    {{- with optional $o "kms_key_id" "" }}
    kms_key_id: {{ toJson . }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
    {{- end }}
