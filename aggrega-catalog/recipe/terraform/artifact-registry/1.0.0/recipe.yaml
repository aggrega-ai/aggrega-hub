apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: artifact-registry
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Artifact Registry, rendered as an authored Terraform body, main.tf: one
    standard google_artifact_registry_repository named after the component,
    in the operator's project and location. host and repository_uri publish
    outputs of this component's module, which Terraform resolves when it
    applies. The published
    GoogleCloudPlatform/artifact-registry/google module is not sourced: its
    outputs carry the repository's resource name, not its registry_uri, the
    address the Component publishes.

    The project and the Cloud KMS key are the operator's: none is created,
    nor any IAM binding. infra.overrides.cleanup_policies sets the policies
    Artifact Registry deletes or keeps versions by. A destroy deletes the
    repository with what it holds.

    A project_id or location missing; a location, kms_key_name or cleanup
    policy of another form; and any infra.overrides key not listed halt the
    build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/devtool/artifact-registry:1.0.0

  locals:
    # values.format in the upper case Artifact Registry's REST reference
    # spells its formats in; the Component holds it to those formats.
    format: '{{ upper (toString .values.format) }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this repository, and resolves
  # none of them.
  #
  # Each is a reference to an output of this component's module call: the
  # body renders into the component's own module directory, and the
  # boundary's root configuration declares that directory as a module block
  # named .context.instance_id for a component declared in the Aggregate the
  # Release deploys. repository_uri is the repository's registry_uri, which
  # the provider describes as the repository endpoint, such as
  # us-docker.pkg.dev/my-proj/my-repo; host is its first part, before the
  # first slash. The references resolve only for a consumer authored as a
  # source: Recipe in the same Terraform root configuration, which Terraform
  # then applies after this module, once the repository exists; a consumer
  # on another target receives them as text.
  provides:
    host: "${module.{{ .context.instance_id }}.host}"
    repository_uri: "${module.{{ .context.instance_id }}.repository_uri}"

  # This Recipe reads from infra.overrides:
  #   project_id       - string, required (project)
  #   location         - string, required (location)
  #   kms_key_name     - string (kms_key_name)
  #   cleanup_policies - list of maps (cleanup_policies blocks), each with
  #                      id, action, and condition or most_recent_versions
  #
  # project_id and kms_key_name are the names the catalog's terraform Google
  # Recipes read for the project a resource is created in and the
  # customer-managed key it is encrypted with; location is the provider's
  # word for where a service takes a region or a multi-region; cleanup_policies
  # is the provider's block, its fields spelt as the provider spells them.
  # host halts, as any key not listed does: the registry answers under
  # Google's name alone, whose certificate a name of the operator's would
  # not match.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Artifact Registry API is enabled. location
  # is where Artifact Registry keeps the repository: a region, such as
  # europe-west1, or one of the multi-regions asia, europe and us, the
  # provider's description of location; it is fixed when the repository is
  # created and names the registry, <location>-<format>.pkg.dev. Each is a
  # string with no value this Recipe could choose for the operator, so each
  # halts the build when it is missing, and a location that is not written
  # as lowercase letters, digits and hyphens halts too. Artifact Registry
  # refuses a location it does not offer when it creates the repository.
  #
  # kms_key_name names the operator's Cloud KMS key Artifact Registry
  # encrypts the repository's contents with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's description gives; the key is in the
  # repository's location, and the project's Artifact Registry service agent
  # may use it, grants that are the operator's. The provider's description
  # says it may not be changed after the repository is created, and the
  # provider replaces the repository when it changes. Unset, Artifact
  # Registry encrypts the contents with a key Google manages. A value of
  # another form halts.
  #
  # cleanup_policies is a list of the policies Artifact Registry deletes old
  # versions by, each a map:
  #   id                    the policy's ID, a string under 128 characters,
  #                         unique within the repository (the REST reference
  #                         of a repository);
  #   action                DELETE or KEEP, the provider's values;
  #   condition             the versions the policy matches, every field
  #                         given holding: tag_state, TAGGED, UNTAGGED or
  #                         ANY; tag_prefixes, version_name_prefixes and
  #                         package_name_prefixes, each a list of strings
  #                         matching on any prefix; older_than and
  #                         newer_than, a duration;
  #   most_recent_versions  the versions a KEEP policy keeps: keep_count, the
  #                         number of the newest versions kept, and
  #                         package_name_prefixes.
  # The REST reference takes condition or most_recent_versions in a policy,
  # one of the two, and most_recent_versions with a KEEP action alone. The
  # google provider, at 8.11.0, reads older_than and newer_than as a whole
  # number followed by s, m, h or d, such as 30d, and refuses any other form
  # (its expand functions for both fields). Each rule halts the build, as do
  # a key no level of a policy takes and a value of another type. The
  # policies run, since cleanup_policy_dry_run is not written and keeps the
  # provider's false: Artifact Registry deletes the versions a DELETE policy
  # matches unless a KEEP policy matches them. Unset, no policy is written
  # and no version is deleted by one.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema and assertions, or not read:
  #   honoured — values.format, in upper case, as the repository's format;
  #     values.immutable_tags, as docker_config.immutable_tags, written while
  #     it is set; and the overrides above.
  #   refused — project_id or location missing or not a string; a location
  #     of another form; a kms_key_name of another form; a cleanup_policies
  #     that is not a list of maps, or a policy breaking a rule above; and
  #     any infra.overrides key not listed above.
  #   held by the Component — values.format, to the formats Artifact
  #     Registry's documentation names; values.immutable_tags, to a Docker
  #     repository.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: mode STANDARD_REPOSITORY, the
  # provider's default written out so it is read; no labels, description,
  # vulnerability scanning settings or IAM binding, so the project's
  # settings decide scanning and the project's IAM roles decide access. The
  # provider replaces the repository when project_id, location, kms_key_name,
  # the format or the component's name changes, and changes it in place when
  # immutable_tags or cleanup_policies changes. A destroy, or removing the
  # component, deletes the repository: Artifact Registry's page on deleting
  # repositories asks for the packages to keep to be available elsewhere
  # first, and says data recovery is not a feature of Artifact Registry.
  # deletion_policy is not written, so the provider's DELETE stands.
  # Credentials. A repository holds none: a client authenticates as its own
  # Google identity, and Terraform authenticates with the credentials in the
  # environment it runs in, so the rendered configuration names none.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "kms_key_name" "cleanup_policies" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location, kms_key_name and cleanup_policies from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "project_id" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail "this Release creates its Artifact Registry repository in the operator's own Google Cloud project, which this Recipe does not choose, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release" -}}
      {{- end -}}
    location: >-
      {{- $l := optional (optional .infra "overrides" dict) "location" "" -}}
      {{- if not (and (typeIs "string" $l) (regexMatch `^[a-z][a-z0-9-]*[a-z0-9]$` $l)) -}}
      {{- fail (printf "infra.overrides.location is %s, and Artifact Registry keeps a repository in a region, such as europe-west1, or a multi-region, asia, europe or us, written in lower case, which this Recipe does not choose: set infra.overrides.location in the Release" (toJson $l)) -}}
      {{- end -}}
    kms_key_name_form: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Artifact Registry takes the Cloud KMS key it encrypts a repository's contents with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
    # The rules the comment above sets out for each cleanup policy, each from
    # the REST reference of a repository or the provider at 8.11.0.
    cleanup_policies: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "cleanup_policies" -}}
      {{- $cp := $o.cleanup_policies -}}
      {{- if not (kindIs "slice" $cp) -}}
      {{- fail (printf "infra.overrides.cleanup_policies is %s, and this Recipe reads cleanup_policies as a list of policies, each a map, whose condition and most_recent_versions are maps too: set it so in the Release, or remove it" (toJson $cp)) -}}
      {{- end -}}
      {{- $levels := dict "" (list "id" "action" "condition" "most_recent_versions") "condition" (list "tag_state" "tag_prefixes" "version_name_prefixes" "package_name_prefixes" "older_than" "newer_than") "most_recent_versions" (list "keep_count" "package_name_prefixes") -}}
      {{- $seen := dict -}}
      {{- range $i, $p := $cp -}}
      {{- $at := printf "infra.overrides.cleanup_policies[%d]" $i -}}
      {{- if not (kindIs "map" $p) -}}
      {{- fail (printf "%s is %s, and this Recipe reads cleanup_policies as a list of policies, each a map, whose condition and most_recent_versions are maps too: set it so in the Release" $at (toJson $p)) -}}
      {{- end -}}
      {{- range $sub := list "condition" "most_recent_versions" -}}
      {{- if and (hasKey $p $sub) (not (kindIs "map" (get $p $sub))) -}}
      {{- fail (printf "%s.%s is %s, and this Recipe reads cleanup_policies as a list of policies, each a map, whose condition and most_recent_versions are maps too: set it so in the Release" $at $sub (toJson (get $p $sub))) -}}
      {{- end -}}
      {{- end -}}
      {{- range $lvl := list "" "condition" "most_recent_versions" -}}
      {{- $m := $p -}}{{- $path := $at -}}
      {{- if $lvl }}{{ $m = default dict (get $p $lvl) }}{{ $path = printf "%s.%s" $at $lvl }}{{ end -}}
      {{- $allowed := get $levels $lvl -}}
      {{- range $k, $_ := $m -}}
      {{- if not (has $k $allowed) -}}
      {{- fail (printf "%s.%s is set, and an Artifact Registry cleanup policy takes %s there and no other key: correct its spelling, or remove it from the Release" $path $k (join ", " $allowed)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $id := optional $p "id" "" -}}
      {{- if not (and (typeIs "string" $id) $id (lt (len (splitList "" $id)) 128)) -}}
      {{- fail (printf "%s.id is %s, and Artifact Registry takes a cleanup policy's ID as a string under 128 characters: set it in the Release" $at (toJson $id)) -}}
      {{- end -}}
      {{- if hasKey $seen $id -}}
      {{- fail (printf "%s.id is %q, as an earlier policy's is, and Artifact Registry holds a cleanup policy's ID unique within a repository: give each policy an ID of its own in the Release" $at $id) -}}
      {{- end -}}
      {{- $_ := set $seen $id true -}}
      {{- if and (hasKey $p "action") (not (has $p.action (list "DELETE" "KEEP"))) -}}
      {{- fail (printf "%s.action is %s, and Artifact Registry takes a cleanup policy's action as DELETE or KEEP: set it to one of them in the Release" $at (toJson $p.action)) -}}
      {{- end -}}
      {{- if and (hasKey $p "condition") (hasKey $p "most_recent_versions") -}}
      {{- fail (printf "%s sets both condition and most_recent_versions, and Artifact Registry takes one of the two in a cleanup policy: write the two as policies of their own in the Release" $at) -}}
      {{- end -}}
      {{- if and (hasKey $p "most_recent_versions") (ne (toString (optional $p "action" "")) "KEEP") -}}
      {{- fail (printf "%s sets most_recent_versions with action %s, and Artifact Registry takes most_recent_versions in a cleanup policy whose action is KEEP alone: set action to KEEP in the Release" $at (toJson (optional $p "action" nil))) -}}
      {{- end -}}
      {{- $c := default dict (optional $p "condition" dict) -}}
      {{- if and (hasKey $c "tag_state") (not (has $c.tag_state (list "TAGGED" "UNTAGGED" "ANY"))) -}}
      {{- fail (printf "%s.condition.tag_state is %s, and Artifact Registry matches versions by the tag state TAGGED, UNTAGGED or ANY: set it to one of them in the Release" $at (toJson $c.tag_state)) -}}
      {{- end -}}
      {{- range $d := list "older_than" "newer_than" -}}
      {{- if hasKey $c $d -}}
      {{- $v := get $c $d -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^[0-9]+[smhd]$` $v)) -}}
      {{- fail (printf "%s.condition.%s is %s, and the google provider takes a cleanup policy's duration as a whole number followed by s, m, h or d, such as 30d: write it so in the Release" $at $d (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $r := default dict (optional $p "most_recent_versions" dict) -}}
      {{- range $pair := list (list "condition" $c "tag_prefixes") (list "condition" $c "version_name_prefixes") (list "condition" $c "package_name_prefixes") (list "most_recent_versions" $r "package_name_prefixes") -}}
      {{- $m := index $pair 1 -}}{{- $k := index $pair 2 -}}
      {{- if hasKey $m $k -}}
      {{- $v := get $m $k -}}
      {{- $ok := kindIs "slice" $v -}}
      {{- if $ok }}{{ range $v }}{{ if not (typeIs "string" .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "%s.%s.%s is %s, and Artifact Registry takes it as a list of prefixes, each a string: write it so in the Release" $at (index $pair 0) $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $r "keep_count" -}}
      {{- $n := $r.keep_count -}}
      {{- $whole := or (kindIs "int" $n) (kindIs "int64" $n) (and (kindIs "float64" $n) (eq (float64 (int64 $n)) $n)) -}}
      {{- if not (and $whole (ge (int64 $n) 0)) -}}
      {{- fail (printf "%s.most_recent_versions.keep_count is %s, and Artifact Registry keeps a whole number of the newest versions, 0 or more: set it so in the Release" $at (toJson $n)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary. The published artifact-registry module,
  # GoogleCloudPlatform/artifact-registry/google at 0.9.0, outputs
  # artifact_id, the repository's resource name, artifact_name, create_time
  # and update_time, and none carries the registry_uri the Component
  # publishes, so it is not sourced. The resource is named this, since each
  # component's body renders into a module directory of its own. Each string
  # the Release gives reaches Artifact Registry as written: Terraform would
  # read ${ and %{ inside a string as the start of an interpolation or a
  # directive, so they are written $${ and %%{, which Terraform turns back
  # into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_artifact_registry_repository" "this" {
        repository_id = "{{ .context.instance_id }}"
        format        = "{{ .locals.format }}"
        mode          = "STANDARD_REPOSITORY"
        {{- $immutable := optional .values "immutable_tags" "" }}
        {{- if kindIs "bool" $immutable }}

        docker_config {
          immutable_tags = {{ $immutable }}
        }
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        project  = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        location = "{{ $o.location }}"
        {{- with optional $o "kms_key_name" "" }}
        kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- range $p := (optional $o "cleanup_policies" list) }}

        cleanup_policies {
          id = {{ toJson $p.id | replace "${" "$${" | replace "%{" "%%{" }}
          {{- with optional $p "action" "" }}
          action = "{{ . }}"
          {{- end }}
          {{- with optional $p "condition" "" }}

          condition {
            {{- with optional . "tag_state" "" }}
            tag_state = "{{ . }}"
            {{- end }}
            {{- range $k := list "tag_prefixes" "version_name_prefixes" "package_name_prefixes" }}
            {{- if hasKey $p.condition $k }}
            {{ $k }} = {{ toJson (get $p.condition $k) | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
            {{- end }}
            {{- range $k := list "older_than" "newer_than" }}
            {{- if hasKey $p.condition $k }}
            {{ $k }} = "{{ get $p.condition $k }}"
            {{- end }}
            {{- end }}
          }
          {{- end }}
          {{- with optional $p "most_recent_versions" "" }}

          most_recent_versions {
            {{- if hasKey . "keep_count" }}
            keep_count = {{ int64 .keep_count }}
            {{- end }}
            {{- if hasKey . "package_name_prefixes" }}
            package_name_prefixes = {{ toJson .package_name_prefixes | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
          }
          {{- end }}
        }
        {{- end }}
      }

      output "host" {
        value = split("/", google_artifact_registry_repository.this.registry_uri)[0]
      }

      output "repository_uri" {
        value = google_artifact_registry_repository.this.registry_uri
      }
