apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-managed
  version: 1.0.0
  description: >
    An Azure managed online endpoint as a reference realization on
    Terraform: the module this Recipe writes declares no resource and
    reaches no provider, so applying it creates nothing, and it carries the
    scoring endpoint the Release supplies and the model's name as outputs
    of the module.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-managed where it deploys an Azure Resource Manager template.
    Declaring no provider, the module shares a root with a module at any
    azurerm version. A consumer reads each value as the text the Release
    and the Aggregate give, and nothing is looked up when the configuration
    is applied. A missing infra.endpoint halts naming it. No credential is
    delivered by this Recipe: a consumer that needs a key or a token to call
    the endpoint holds its own, because how it authenticates belongs to the
    consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-model/azure-managed:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts at pull, before this
  # Recipe renders, its schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.model, published as provides.model; infra.endpoint,
  #     published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.context_window, a hint for sizing the server that
  #     serves a model, which the operator's endpoint already does;
  #     values.display_name and values.description, which describe the
  #     component to its readers.
  #
  # The azurerm provider declares no resource for a managed online endpoint,
  # and the Component is a reference to an endpoint an organisation already
  # runs, so this Recipe declares none.
  #
  # Backup. The endpoint is the operator's, and this Recipe creates nothing
  # to back up.
  assertions:
    # A managed online endpoint's scoring host belongs to the endpoint an
    # organisation created, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint this model is served from.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches an Azure managed online endpoint, and its scoring host belongs to the endpoint an organisation created, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the scoring URL of that endpoint" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the model's name from the
  # developer's values, each published as written, so a consumer in this
  # root or on another target reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"

  # The module this component becomes: no resource and no provider, so
  # applying it creates nothing and it takes no azurerm version, and an
  # output for each value the component publishes, so the state records what
  # the configuration was given. Each value is written as a JSON string,
  # with Terraform's own template sequences ${ and %{ escaped as $${ and
  # %%{, so Terraform reads back exactly the text the Release and the
  # Aggregate give.
  artifacts:
    main.tf: |
      output "endpoint" {
        value = {{ .infra.endpoint | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }

      output "model" {
        value = {{ .values.model | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }
