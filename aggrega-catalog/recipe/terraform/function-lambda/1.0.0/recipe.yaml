apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: function-lambda
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # Lambda module: the third-party code this Recipe pins and writes into the
  # output. The Lambda function it provisions is a service the reader contracts
  # for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    The generic event-driven compute primitive as one AWS Lambda function run
    from a container image, by the terraform-aws-modules project's Lambda
    module, terraform-aws-modules/lambda/aws at v8.12.0, Apache-2.0, fetched
    from its git repository at that tag and pinned in the entity.lock beside
    this Recipe. Its packaging, which runs Python on the applying machine, is
    off, as an image function has no package. Reach for it where the target is
    an AWS account; reach for helm/function-knative or helm/function-keda on
    Kubernetes.

    Only the function is emitted, with provisioned concurrency for a floor — no
    role, log group, trigger, URL or event source mapping: what invokes it,
    its role and its log group are the operator's, the last two required
    under infra.overrides.

    The image is in Amazon ECR, in the function's Region, and implements
    Lambda's runtime API — an AWS base image for Lambda, or a linux/amd64
    image with a runtime interface client; one serving HTTP carries an adapter
    forwarding Lambda's invocations. An image outside ECR is refused by name.
    compute.memory is the function's memory, max_replicas its reserved
    concurrency, and a min_replicas above zero provisioned concurrency on the
    published version, serving invocations of that version. port,
    compute.cpu, control_plane_present and scaler are not read; the comment
    above the assertions gives each reason.

    Each env entry an edge or the component's own inject block dictates
    becomes a variable of the function's environment, its value written whole;
    runtime arrives by default as FUNCTION_RUNTIME. A name Lambda reserves or
    cannot take, or FUNCTION_RUNTIME while it is that default, is refused by
    name, and so are file, arg and other entries.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/function:1.0.0

  # The published module, at the tag the registry publishes as version 8.12.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root, which declares no module call of its
  # own: the configuration Terraform loads from it calls no registry module, so
  # initialising it fetches providers and nothing else. The repository's
  # modules/, examples/ and wrappers/ directories are vendored with it and never
  # loaded.
  #
  # The module builds a .zip package of code by running a Python program on the
  # machine applying the configuration, through an external data source and a
  # local-exec provisioner, and each is declared only while create_package is
  # true. This Recipe sets it false, since an image function has no package to
  # build, so neither is planned and no Python interpreter is needed. The
  # module still declares the hashicorp/external, hashicorp/local and
  # hashicorp/null providers beside hashicorp/aws >= 6.28 in its own
  # required_providers, so initialising the configuration installs all four.
  # It is vendored byte for byte, so this Recipe adds no provider constraint of
  # its own; the catalog conventions' "One AWS provider constraint for every AWS
  # body" section says how it composes with the catalog's authored AWS bodies.
  #
  # Whenever it creates a function, the module either creates the function's
  # CloudWatch log group or reads one that already exists. This Recipe has it
  # read one, so the log group stays the operator's, as the catalog's Amazon ECS
  # Recipes leave theirs, and nothing is emitted for it.
  #
  # The tag is written out rather than read from infra.source_version: a source
  # whose coordinates come from a template is pinned per Release instead of in
  # this Recipe's own entity.lock, and this Recipe's pin is the one stated
  # above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-lambda.git
    ref: v8.12.0

  # This Recipe reads from infra.overrides:
  #   lambda_role         - string (lambda_role), required
  #   logging_log_group   - string (logging_log_group), required
  #   timeout             - integer (timeout; seconds, 1 to 900; default 3)
  #   subnet_ids          - []string (vpc_subnet_ids)
  #   vpc_security_groups - []string (vpc_security_group_ids)
  #
  # Each is passed to the module input named in brackets. Two keys reuse a
  # spelling another Recipe already reads for the same concept, so an operator
  # writes each under one name across the catalog's terraform AWS Recipes:
  # subnet_ids, as terraform/server-ecs reads the subnets it places its tasks
  # in, and vpc_security_groups, as the RDS and ElastiCache Recipes read the
  # security groups.
  #
  # lambda_role is the function's execution role, which Lambda assumes to run
  # it and which the function's code calls AWS with; it must be allowed to pull
  # the image from its ECR repository and to write to the log group.
  # logging_log_group names the CloudWatch Logs log group the function writes
  # to, which must already exist in the function's Region, since the module
  # reads it. Neither has a default: both are provisioned outside this Release,
  # no account-independent value exists for either, and this Recipe never
  # creates a role or a log group for the operator. timeout is how long Lambda
  # lets one invocation run before stopping it, and Lambda's own default of
  # three seconds stands while it is unset. subnet_ids and vpc_security_groups
  # place the function in the operator's VPC, so it reaches what lives there,
  # and are set together or not at all; with neither, the function runs outside
  # any VPC of the operator's.
  #
  # The module's own defaults stand for every input this mapping leaves out:
  # among them, the function runs on x86_64, so the image is built for
  # linux/amd64, and no tracing, dead-letter target or file system is set.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's runtime value. It is
  # delivered under the name the Kubernetes realizations deliver it under, for
  # the application's own code to read; that name is a default, which the
  # component's own inject block may replace, as the comment above
  # valuesMapping describes.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.runtime as above; infra.image (required, in ECR);
  #     infra.compute.memory as memory_size; infra.max_replicas as
  #     reserved_concurrent_executions; infra.min_replicas above zero as
  #     provisioned_concurrent_executions on the version publish creates; and
  #     the overrides above.
  #   refused — an image outside ECR; a memory this Recipe cannot read or
  #     Lambda cannot give; a floor above the ceiling; an env entry of an edge
  #     or of the component's own inject block under a name Lambda reserves or
  #     cannot take, or under FUNCTION_RUNTIME while the runtime is delivered
  #     under that default name; and an edge's file, arg or custom-mechanism
  #     entry, as the comment above valuesMapping describes.
  #   not read — infra.port, as Lambda reaches the image through its runtime
  #     API rather than a port; infra.compute.cpu, as Lambda allots CPU from
  #     memory; and infra.control_plane_present and infra.scaler, as Lambda
  #     needs no control plane or scaler.
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image serving the function in the Release" -}}
      {{- end -}}
    # Lambda creates a function only from an image in an Amazon ECR repository
    # in the function's own Region, and not through ECR's FIPS endpoints. The
    # Region is the provider configuration's, which a build does not know, so
    # the repository's Region is the operator's to match.
    image_in_ecr: >-
      {{- $i := toString (optional .infra "image" "") -}}
      {{- if not (regexMatch `^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9._/-]+(:[A-Za-z0-9._-]{1,128}|@sha256:[a-f0-9]{64})?$` $i) -}}
      {{- fail (printf "infra.image is %q, and AWS Lambda runs a container image only from an Amazon ECR repository in the function's own Region, named as 123456789012.dkr.ecr.us-east-1.amazonaws.com/repository:tag: push the image to such a repository and set infra.image in the Release to its URI" $i) -}}
      {{- end -}}
    memory_fits_lambda: >-
      {{- $m := toString (optional (optional .infra "compute" dict) "memory" "") -}}
      {{- if not .locals.memory_mib -}}
      {{- fail (printf "infra.compute.memory is %q, and this Recipe reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms" $m) -}}
      {{- end -}}
      {{- if or (lt (atoi .locals.memory_mib) 128) (gt (atoi .locals.memory_mib) 10240) -}}
      {{- fail (printf "infra.compute.memory is %q, and a Lambda function takes from 128 to 10240 MB of memory: set infra.compute.memory in the Release to a quantity between 128Mi and 10Gi" $m) -}}
      {{- end -}}
    # Provisioned concurrency is drawn from the function's reserved concurrency
    # and cannot exceed it, so a floor above the ceiling cannot be deployed.
    floor_within_ceiling: >-
      {{- if gt (int .infra.min_replicas) (int .infra.max_replicas) -}}
      {{- fail (printf "infra.min_replicas is %d and infra.max_replicas %d, and on Lambda the floor is provisioned concurrency, which cannot exceed the reserved concurrency the ceiling sets: set infra.min_replicas in the Release to at most infra.max_replicas" (int .infra.min_replicas) (int .infra.max_replicas)) -}}
      {{- end -}}
    lambda_role_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "lambda_role" "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release runs its function under an execution role that already exists, which Lambda assumes to run it and which must be allowed to pull the image and write the function's logs, but infra.overrides.lambda_role is %s: set infra.overrides.lambda_role in the Release to the ARN of an existing role" (toJson $v)) -}}
      {{- end -}}
    logging_log_group_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "logging_log_group" "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release has its function write to a CloudWatch Logs log group that already exists, which the module reads when the configuration is planned, but infra.overrides.logging_log_group is %s: set infra.overrides.logging_log_group in the Release to the name of an existing log group in the function's Region" (toJson $v)) -}}
      {{- end -}}
    optional_overrides_typed: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "timeout" -}}
      {{- $t := index $o "timeout" -}}
      {{- if not (and (not (typeIs "string" $t)) (regexMatch `^[0-9]+$` (toString $t)) (ge (int $t) 1) (le (int $t) 900)) -}}
      {{- fail (printf "infra.overrides.timeout is %s, and Lambda takes a function's time limit in whole seconds from 1 to 900: set it in the Release to such a number, or remove it to take Lambda's default of 3" (toJson $t)) -}}
      {{- end -}}
      {{- end -}}
      {{- if ne (hasKey $o "subnet_ids") (hasKey $o "vpc_security_groups") -}}
      {{- fail "this Release names only one of infra.overrides.subnet_ids and infra.overrides.vpc_security_groups, and a Lambda function joins a VPC through both: set the two together in the Release, or remove both to run the function outside the operator's VPC" -}}
      {{- end -}}
      {{- range $k, $max := dict "subnet_ids" 16 "vpc_security_groups" 5 -}}
      {{- if hasKey $o $k -}}
      {{- $s := index $o $k -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) $max) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as a list of one to %d IDs of existing resources in the operator's VPC: set it in the Release to such a list, or remove it together with its pair" $k (toJson $s) $max) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # The requested memory in MiB, or empty when it is not a quantity this Recipe
  # reads: whole Mi or Gi. Lambda's memory setting is in MB, one per MiB
  # requested. This local is the one cloudformation/function-lambda declares,
  # word for word, and a change to it is made to both.
  locals:
    memory_mib: >-
      {{- $m := toString (optional (optional .infra "compute" dict) "memory" "") -}}
      {{- if regexMatch `^[0-9]+Mi$` $m -}}{{ atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m -}}{{ mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end -}}

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # function is named after the component, so the name is checked here against
  # what Lambda accepts for one.
  #
  # The environment is read off the inject pipe as a map, and every variable on
  # it becomes one variable of the function's environment, under the name the
  # Aggregate gave it on the edge; this Recipe expects no name of its own, so
  # none is missing whatever the edges deliver. Each value is written whole as
  # the map's value, so a Terraform reference a neighbour publishes, such as
  # ${module.db.address}, reaches the root configuration as an interpolation
  # the engine evaluates there, where the neighbour's module is declared. The
  # developer's runtime joins that map as FUNCTION_RUNTIME, unless the
  # component's own inject block delivers it, and an edge or that block
  # delivering that name as well halts, naming which, rather than one value
  # silently replacing the other. Lambda sets a list of variables itself
  # and refuses a function configuration naming any of them, and takes a name
  # only when it starts with a letter, is two characters long at least and
  # holds letters, digits and underscores alone, so an edge or that block
  # dictating any other name halts here, naming which, rather than when the
  # configuration is applied.
  #
  # Every other mechanism on the pipe is refused, naming the entry, its
  # mechanism and the connection that dictated it, so none is dropped: a file
  # entry, because a Lambda function's configuration offers no way to write a
  # file's content into the container; an arg entry, because this Recipe
  # renders no command line, and a function's command on Lambda replaces the
  # image's default one, which is the Release's; and any custom mechanism. This
  # block is the one cloudformation/function-lambda declares, word for word; a
  # change to it is made to both.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the function with every other env entry. The
  # name this Recipe gives the runtime is a default: it is rendered only while
  # no entry of that block, in any mechanism, delivers the runtime. The template
  # reads that at .context.self_inject, which maps each name the developer wrote
  # to values.<key> for an entry whose template reads that one own value. A
  # refusal naming a variable that block delivers names the block, rather than
  # an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  valuesMapping: |
    {{- if not (regexMatch `^[A-Za-z0-9_-]{1,64}$` .context.instance_id) }}
    {{- fail (printf "the component %q names its Lambda function, and Lambda takes up to 64 letters, digits, hyphens and underscores for one: rename the component in the Aggregate to such a name" .context.instance_id) }}
    {{- end }}
    {{- range $mechanism, $entries := default dict .context.inject }}
    {{- if not (has $mechanism (list "all" "env")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "file" }}
    {{- fail (printf "the component %q is handed a file at %q by %s, and a Lambda function's configuration offers no way to write a file's content into the container: dictate the value as an env entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Lambda takes a function's command in place of the image's default one, and that command is the Release's. Dictate the value as an env entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $env := dict }}
    {{- range $k, $v := optional (default dict .context.inject) "env" dict }}{{ $_ := set $env $k $v }}{{ end }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $runtimeByDefault := not (hasKey $named "values.runtime") }}
    {{- range $k, $_ := $env }}
    {{- $by := "an attachment on the component" }}
    {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if and $runtimeByDefault (eq $k "FUNCTION_RUNTIME") }}
    {{- fail (printf "the component %q delivers its developer value runtime to the container as FUNCTION_RUNTIME, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $.context.instance_id $by) }}
    {{- end }}
    {{- if has $k (list "_HANDLER" "_X_AMZN_TRACE_ID" "AWS_DEFAULT_REGION" "AWS_REGION" "AWS_EXECUTION_ENV" "AWS_LAMBDA_FUNCTION_NAME" "AWS_LAMBDA_FUNCTION_MEMORY_SIZE" "AWS_LAMBDA_FUNCTION_VERSION" "AWS_LAMBDA_INITIALIZATION_TYPE" "AWS_LAMBDA_LOG_GROUP_NAME" "AWS_LAMBDA_LOG_STREAM_NAME" "AWS_ACCESS_KEY" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "AWS_SESSION_TOKEN" "AWS_LAMBDA_RUNTIME_API" "LAMBDA_TASK_ROOT" "LAMBDA_RUNTIME_DIR" "AWS_LAMBDA_MAX_CONCURRENCY" "AWS_LAMBDA_METADATA_API" "AWS_LAMBDA_METADATA_TOKEN") }}
    {{- fail (printf "the component %q is handed the variable %q by %s, and Lambda reserves that name and sets it in every function itself, so it refuses a function naming it: rename the variable in that inject block" $.context.instance_id $k $by) }}
    {{- end }}
    {{- if not (regexMatch `^[A-Za-z][A-Za-z0-9_]+$` $k) }}
    {{- fail (printf "the component %q is handed the variable %q by %s, and Lambda takes a variable name that starts with a letter, is two characters long at least and holds only letters, digits and underscores: rename the variable in that inject block" $.context.instance_id $k $by) }}
    {{- end }}
    {{- end }}
    {{- if $runtimeByDefault }}{{ $_ := set $env "FUNCTION_RUNTIME" (toString .values.runtime) }}{{ end }}
    {{- $o := optional .infra "overrides" dict }}
    function_name: "{{ .context.instance_id }}"
    create_package: false
    create_role: false
    lambda_role: {{ toJson $o.lambda_role }}
    package_type: "Image"
    image_uri: {{ toJson .infra.image }}
    memory_size: {{ .locals.memory_mib }}
    reserved_concurrent_executions: {{ .infra.max_replicas }}
    {{- if gt (int .infra.min_replicas) 0 }}
    publish: true
    provisioned_concurrent_executions: {{ .infra.min_replicas }}
    {{- end }}
    environment_variables: {{ toJson $env }}
    use_existing_cloudwatch_log_group: true
    logging_log_group: {{ toJson $o.logging_log_group }}
    ignore_source_code_hash: true
    {{- with optional $o "timeout" "" }}
    timeout: {{ . }}
    {{- end }}
    {{- if hasKey $o "subnet_ids" }}
    vpc_subnet_ids: {{ toJson $o.subnet_ids }}
    vpc_security_group_ids: {{ toJson $o.vpc_security_groups }}
    {{- end }}
