apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: google-cloud-kms
  version: 1.0.0
  # The licence of the vendored module, the terraform-google-modules
  # project's KMS module: the third-party code this Recipe pins and writes
  # into the output. The key ring and keys it provisions are a service the
  # reader contracts for directly with Google Cloud, under Google Cloud's
  # terms.
  license: Apache-2.0
  description: >
    Cloud KMS on Google Cloud, as one key ring named after the component and
    its keys, in the operator's project at infra.overrides.location,
    realized by the terraform-google-modules project's published KMS module,
    terraform-google-modules/kms/google at v4.2.1, Apache-2.0, fetched from
    its git repository at that tag; entity.lock pins the tag's commit and
    archive digest. key_ring publishes a reference to the ring's resource
    name, which Terraform resolves when it applies.

    The module creates the ring and the keys and nothing else: no IAM
    binding, since it is given no member to grant a role on a key, and no
    service account. The project is the operator's and is not created.
    Keys of purpose ENCRYPT_DECRYPT rotate every 90 days unless the Release
    sets another period; keys of other purposes do not rotate. Keys are
    created at the SOFTWARE protection level unless the Release asks for
    HSM.

    prevent_destroy is true unless the Release sets it false: Terraform then
    refuses every plan that destroys or replaces a key, a destroy among them,
    and the keys stay in the project.
    A project_id or location missing, a protection level other than SOFTWARE
    or HSM or one the algorithm is not offered at, an algorithm that needs an
    external key, a rotation period of another form or on a key that does not
    rotate, a prevent_destroy that is not a boolean, and any infra.overrides
    key not listed halt the build.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/security/google-cloud-kms:1.0.0

  # The published module, at the tag the registry publishes as version 4.2.1.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The repository root is the module, and no module_subdir is written. The
  # root's configuration files — main.tf, variables.tf, outputs.tf and
  # versions.tf — declare no module call, so the configuration Terraform loads
  # from it calls no registry module and initialising it fetches providers and
  # nothing else. Its modules/autokey directory, its examples/ and test/
  # directories are vendored and never loaded, since nothing the root declares
  # reaches them. It keeps to the Terraform 1.5 language.
  #
  # The module declares hashicorp/google ">= 5.31.0, < 9" in its own
  # required_providers, and a provider_meta block naming itself to Google, and
  # is vendored byte for byte, so this Recipe adds no provider constraint of
  # its own; beside the catalog's Google bodies, at "~> 8.8", Terraform
  # installs one release from 8.8 below 9. The boundary's root configuration
  # declares no provider block for Google: the provider reads its credentials
  # from the environment the plan runs in — GOOGLE_CREDENTIALS, or Application
  # Default Credentials — and the module names the project on the ring.
  #
  # The tag is written out rather than read from a template: a source whose
  # coordinates come from a template is pinned per Release instead of in this
  # Recipe's own entity.lock, and this Recipe's pin is the one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-google-modules/terraform-google-kms.git
    ref: v4.2.1

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this key ring, and resolves
  # none of it.
  #
  # key_ring is a reference to the module's keyring output, the ring's id,
  # which the provider gives as
  # projects/<project>/locations/<location>/keyRings/<name>, through this
  # component's module call, which the boundary's root configuration declares
  # under .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves it at apply time, after the ring
  # exists, so it resolves only for a consumer authored as a source: Recipe
  # in the same root configuration; a consumer on another target receives it
  # as text. A key's ID is that name followed by /cryptoKeys/<key>. The
  # module's keys output maps each key's name to its ID, and a provides value
  # reaches a consumer as one string, so the ring's name is what is
  # published. No address is published: a client calls the Cloud KMS
  # endpoint and names the key by its ID.
  provides:
    key_ring: "${module.{{ .context.instance_id }}.keyring}"

  # This Recipe reads from infra.overrides:
  #   project_id           - string, required (the module's project_id,
  #                          the ring's project)
  #   location             - string, required (the module's location, the
  #                          ring's location)
  #   key_protection_level - string (the module's key_protection_level,
  #                          each key's version_template.protection_level;
  #                          default SOFTWARE)
  #   key_rotation_period  - string (the module's key_rotation_period, each
  #                          key's rotation_period; default 7776000s)
  #   prevent_destroy      - bool (the module's prevent_destroy, each key's
  #                          lifecycle; default true)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # project_id is the name every terraform Google Recipe of this catalog reads
  # for the project a resource is created in; location is the provider's word
  # for where a service takes a region or a multi-region; key_protection_level,
  # key_rotation_period and prevent_destroy are the module's inputs they set.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Cloud KMS API is enabled. location is where
  # Cloud KMS keeps the ring and its keys: a region such as europe-west1, a
  # multi-region such as europe or us, or global ("Cloud KMS locations"); Cloud
  # KMS refuses one it does not offer when it creates the ring, and keeps the
  # ring there for good. Each is a string and neither has a value this Recipe
  # could choose for the operator, so each halts the build when it is missing.
  #
  # key_protection_level is where each key's material is kept: SOFTWARE,
  # unless set, or HSM, a Cloud HSM key, which Cloud KMS offers in most of its
  # locations and refuses, when it creates the key, in one that has none.
  # HSM_SINGLE_TENANT halts by name: such a key names a single-tenant Cloud HSM
  # instance as its backend, which the module is not given. So do EXTERNAL and
  # EXTERNAL_VPC: such a key is created with no version and its versions name a
  # key in the operator's external key manager, while the module creates each
  # key with a first version of its own and no external key. Any other value
  # halts. Cloud KMS offers some algorithms at one protection level alone (the
  # "Key purposes and algorithms" page), among the levels this Recipe
  # creates: EC_SIGN_ED25519, the PQ_SIGN_ algorithms, KEM_XWING, ML_KEM_768
  # and ML_KEM_1024 at SOFTWARE; EC_SIGN_SECP256K1_SHA256 at HSM, which the
  # page lists with HSM_SINGLE_TENANT. AES_256_KWP, KEM_ECDH_P256 and
  # KEM_ECDH_P384 appear on no protection-level table of that page, so Cloud
  # KMS decides at creation whether it offers them at the level chosen.
  # values.algorithm at a protection level that does not offer it halts.
  # EXTERNAL_SYMMETRIC_ENCRYPTION names a key held in an external key
  # manager, which this Recipe does not create, and halts whatever the
  # protection level.
  #
  # key_rotation_period is how often Cloud KMS creates a new version of each
  # key and makes it the primary one, as a number of seconds followed by s,
  # with up to nine digits after a decimal point, from 86400s, one day, the
  # google provider's floor, to 3153600000s, 876,000 hours, Cloud KMS's
  # ceiling; unset, the module's 7776000s, 90 days, stands. Earlier versions
  # stay, so data encrypted under them still decrypts. Cloud KMS rotates a key
  # of purpose ENCRYPT_DECRYPT alone and requires the field left out on every
  # other key (CryptoKey's rotationPeriod), so with any other values.purpose
  # the mapping writes the module an empty period, which the provider sends as
  # none, and key_rotation_period set halts. A period of another form halts.
  # A key of purpose ENCRYPT_DECRYPT always rotates: no value turns its
  # rotation off.
  #
  # prevent_destroy is true or false, true unless set, the module's default,
  # under which the module declares each key with lifecycle prevent_destroy,
  # and Terraform refuses every plan that would destroy or replace a key: a
  # destroy, removing or renaming the component, changing values.purpose,
  # key_protection_level, location or project_id, and removing or moving a
  # name in values.crypto_keys, since the module creates the keys by their
  # position in that list. Appending a name creates one more key. The module
  # declares keys kept so, and keys not kept so, in two resource blocks, so
  # changing prevent_destroy once the keys exist plans to destroy each key and
  # create it anew: from true, Terraform refuses the plan as above; from false,
  # it destroys every version of every key and then fails to create keys under
  # names Cloud KMS still holds. Under true, a key leaves the Terraform state
  # only by terraform state rm, and stays in the project. Any other value
  # halts.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema and assertions, or not read:
  #   honoured — values.crypto_keys, as the module's keys, a key of each name
  #     in the ring; values.purpose, as the module's purpose; values.algorithm,
  #     as the module's key_algorithm, each key's version_template.algorithm;
  #     and the overrides above.
  #   refused — project_id or location missing or not a string; a
  #     key_protection_level other than SOFTWARE or HSM, or one that does not
  #     offer values.algorithm; a values.algorithm of
  #     EXTERNAL_SYMMETRIC_ENCRYPTION; a key_rotation_period of another form or
  #     outside its range, or set while values.purpose is not ENCRYPT_DECRYPT;
  #     a prevent_destroy that is not a boolean; and any infra.overrides key
  #     not listed above.
  #   held by the Component — each key's name, to Cloud KMS's rule; the ring's
  #     name, the component's, to the same rule; values.algorithm to the ones
  #     values.purpose takes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the module writes beside these: the ring named after the component,
  # keyring; set_owners_for, set_decrypters_for and set_encrypters_for, which
  # the mapping writes empty, the module's defaults, so none of the
  # google_kms_crypto_key_iam_binding resources the module counts from them is
  # created and no role is granted on a key; the operator grants Cloud KMS
  # roles, and a Google Cloud service's agent the CryptoKey Encrypter/Decrypter
  # role on a key it encrypts with, outside the Release. Its other inputs keep
  # their defaults: each key created with a first version (import_only and
  # skip_initial_version_creation false), no crypto_key_backend, no labels,
  # and key_destroy_scheduled_duration unset, so a destroyed version is
  # scheduled for destruction for Cloud KMS's 30 days, during which it can be
  # restored, before it is destroyed. Two Releases of one Aggregate deployed
  # into one project and location name one ring, and the second fails when it
  # applies.
  #
  # Deletion. The google provider, as its 8.11.0 documentation describes, does
  # not delete a ring or a key from Cloud KMS: for google_kms_key_ring it says
  # "KeyRings cannot be deleted from Google Cloud Platform. Destroying a
  # Terraform-managed KeyRing will remove it from state but will not delete
  # the resource from the project", and for google_kms_crypto_key that
  # destroying one "will remove it from state and delete all
  # CryptoKeyVersions, rendering the key unusable, but will not delete the
  # resource from the project". So Terraform destroying the ring removes it
  # from the state alone, and destroying a key, which prevent_destroy false
  # allows, destroys each of its versions and removes the key from the state,
  # after which data encrypted under it can no longer be decrypted. The ring
  # and the keys remain in Cloud KMS, so applying the Release again in that
  # project and location fails until the ring and every key are imported into
  # the state: a key's name is never reused in its ring ("Delete Cloud KMS
  # resources"). Changing values.algorithm changes each key's template in
  # place: new versions take it, existing ones keep theirs.
  #
  # Credentials. A key ring holds none: a client signs each call with its own
  # Google identity, and Terraform authenticates with the credentials in the
  # environment it runs in, so the rendered configuration names none.
  # Backup. Cloud KMS keeps no data of these keys' beyond their key material,
  # which never leaves it unencrypted, so no backup is configured.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "key_protection_level" "key_rotation_period" "prevent_destroy" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location, key_protection_level, key_rotation_period and prevent_destroy from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_location_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Cloud KMS key ring in the operator's own Google Cloud project, at a location the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The protection levels at which Cloud KMS creates a key's material
    # itself, with the first version the module creates.
    protection_level: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "key_protection_level" -}}
      {{- if not (has $o.key_protection_level (list "SOFTWARE" "HSM")) -}}
      {{- fail (printf "infra.overrides.key_protection_level is %s, and this Recipe creates keys at SOFTWARE or HSM: a HSM_SINGLE_TENANT key names a single-tenant Cloud HSM instance as its backend, and an EXTERNAL or EXTERNAL_VPC key names a key in an external key manager, neither of which the KMS module this Recipe sources is given: set it to SOFTWARE or HSM in the Release, or remove it for SOFTWARE" (toJson $o.key_protection_level)) -}}
      {{- end -}}
      {{- end -}}
    # The algorithms the "Key purposes and algorithms" page offers at one
    # protection level alone.
    algorithm_at_protection_level: >-
      {{- $level := toString (optional (optional .infra "overrides" dict) "key_protection_level" "SOFTWARE") -}}
      {{- $alg := toString .values.algorithm -}}
      {{- $only := "" -}}
      {{- if or (eq $alg "EC_SIGN_ED25519") (hasPrefix "PQ_SIGN_" $alg) (has $alg (list "KEM_XWING" "ML_KEM_768" "ML_KEM_1024")) }}{{ $only = "SOFTWARE" }}
      {{- else if eq $alg "EC_SIGN_SECP256K1_SHA256" }}{{ $only = "HSM" }}
      {{- end -}}
      {{- if and $only (ne $only $level) -}}
      {{- fail (printf "values.algorithm is %s, which Cloud KMS offers at %s alone among the protection levels this Recipe creates, while the keys are created at %s: set infra.overrides.key_protection_level in the Release, or choose another values.algorithm in the Aggregate" $alg $only $level) -}}
      {{- end -}}
    # An algorithm that names a key held in an external key manager.
    external_algorithm: >-
      {{- if eq (toString .values.algorithm) "EXTERNAL_SYMMETRIC_ENCRYPTION" -}}
      {{- fail "values.algorithm is EXTERNAL_SYMMETRIC_ENCRYPTION, which names a key held in an external key manager, and this Recipe creates no external key: choose another values.algorithm in the Aggregate" -}}
      {{- end -}}
    # The rotation period's form, as the google provider validates it, and
    # the range Cloud KMS takes.
    rotation_period_form: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "key_rotation_period" -}}
      {{- $v := $o.key_rotation_period -}}
      {{- $ok := and (typeIs "string" $v) (regexMatch `^[0-9]+(\.[0-9]{1,9})?s$` $v) -}}
      {{- if $ok }}{{ $n := float64 (trimSuffix "s" $v) }}{{ $ok = and (ge $n 86400.0) (le $n 3153600000.0) }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.key_rotation_period is %s, and Cloud KMS rotates a key every period written as seconds followed by s, with up to nine digits after a decimal point, from 86400s, one day, to 3153600000s, 876,000 hours: set it so in the Release, or remove it for 7776000s, 90 days" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
    # Cloud KMS rotates a key of purpose ENCRYPT_DECRYPT alone.
    rotation_period_purpose: >-
      {{- if and (hasKey (optional .infra "overrides" dict) "key_rotation_period") (ne (toString .values.purpose) "ENCRYPT_DECRYPT") -}}
      {{- fail (printf "infra.overrides.key_rotation_period is set while values.purpose is %s, and Cloud KMS rotates a key of purpose ENCRYPT_DECRYPT alone, refusing a rotation period on any other: remove key_rotation_period from the Release" (toString .values.purpose)) -}}
      {{- end -}}
    prevent_destroy: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (hasKey $o "prevent_destroy") (not (kindIs "bool" $o.prevent_destroy)) -}}
      {{- fail (printf "infra.overrides.prevent_destroy is %s, and it keeps Terraform from destroying the keys while true: set it to true or false in the Release, or remove it for true" (toJson $o.prevent_destroy)) -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable.
  # Each string the Release gives reaches Cloud KMS as written: the root
  # configuration writes a module argument's %{ as %%{ itself and keeps ${,
  # which a reference to another module's output needs, so ${ inside such a
  # string is written $${ here, which Terraform turns back into the
  # characters written. The key names, the purpose and the algorithm are
  # held by the Component's schema to characters that need no escaping.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    project_id: {{ toJson $o.project_id | replace "${" "$${" }}
    location: {{ toJson $o.location | replace "${" "$${" }}
    keyring: {{ toJson .context.instance_id }}
    keys: {{ toJson .values.crypto_keys }}
    purpose: {{ toJson .values.purpose }}
    key_algorithm: {{ toJson .values.algorithm }}
    key_protection_level: {{ toJson (optional $o "key_protection_level" "SOFTWARE") }}
    {{- if eq (toString .values.purpose) "ENCRYPT_DECRYPT" }}
    key_rotation_period: {{ toJson (optional $o "key_rotation_period" "7776000s") }}
    {{- else }}
    key_rotation_period: ""
    {{- end }}
    prevent_destroy: {{ if eq (toJson (optional $o "prevent_destroy" true)) "false" }}false{{ else }}true{{ end }}
    set_owners_for: []
    set_decrypters_for: []
    set_encrypters_for: []
