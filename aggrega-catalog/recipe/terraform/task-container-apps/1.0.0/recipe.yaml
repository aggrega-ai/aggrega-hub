apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: task-container-apps
  version: 1.0.0
  description: >
    The generic ephemeral compute primitive as an Azure Container Apps job
    running the Release's image to completion, on the catalog's shared
    Container Apps body. Reach for it in an Azure subscription with a
    Container Apps environment; for terraform/task-ecs or
    cloudformation/task-ecs in an AWS account, and helm/task on Kubernetes,
    which also runs a task with no schedule once.

    A scheduled task runs on its schedule, evaluated in UTC. A task with no
    schedule carrying core/manual-trigger is deployed without starting, and
    the operator starts each run with az containerapp job start; any other
    unscheduled task is refused by name, as nothing on Azure starts it.

    The environment, resource group and region are the operator's, each
    required under infra.overrides; user-assigned identities and a private
    registry are optional. Only the job is emitted: no environment, network,
    identity, registry, Key Vault or log workspace, each the operator's.

    Each env entry an inject block dictates becomes a container variable and
    each file entry a secret mounted alone at its path; timeout arrives by
    default as TASK_TIMEOUT, for the code to honour. Container Apps stops a
    run at the job's replica timeout, 30 minutes unless
    infra.overrides.replica_timeout_in_seconds sets another, whatever
    timeout says. The job runs at the smallest Consumption size meeting
    infra.compute; an infra.overrides key this Recipe does not read halts.

    Its body takes hashicorp/azurerm 4.18 and later below 6, so it shares a
    terraform boundary with terraform/postgres-flexible-server, which admits
    azurerm 4 alone, or with bodies at azurerm 5.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/task:1.0.1

  # The module beside this Recipe is the fixed pass-through every container
  # Recipe of this catalog carries byte for byte: its one input, config, goes
  # to the service module the artifacts below import, and that module comes
  # back out as its service output. entity.lock pins it. The Job body declares
  # hashicorp/azurerm as ">= 4.18, < 6", the range the catalog conventions'
  # "One Azure provider constraint for every Azure body" section keeps for the
  # shared Container Apps bodies. A root takes the highest version every
  # constraint in it admits: with terraform/postgres-flexible-server, whose
  # module declares "~> 4.12", the root takes azurerm 4; with bodies at the
  # catalog's "~> 5.14", the newest azurerm 5.
  #
  # Microsoft's Azure Verified Modules programme publishes a Container Apps
  # job module, Azure/avm-res-app-job/azurerm, at v0.3.0 its newest version,
  # MIT. Its root declares hashicorp/azurerm ">= 4.73.0, < 5.0.0", which
  # admits no azurerm 5 release, so a Recipe sourcing it could share no
  # terraform boundary with the catalog's bodies at "~> 5.14". It is not
  # sourced: the job is the catalog's own Job body, the one every Container
  # Apps Recipe of this catalog running a job imports, which holds the files,
  # identities and registry this Recipe hands it.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   resource_group_name          - string (config.resource_group_name), required
  #   container_app_environment_id - string (config.container_app_environment_id), required
  #   location                     - string (config.location), required
  #   identity_ids                 - []string (config.identity_ids)
  #   registry_server              - string (config.registry_server)
  #   registry_identity            - string (config.registry_identity)
  #   registry_username            - string (config.registry_username)
  #   registry_password_secret_id  - string (config.registry_password_secret_id)
  #   registry_password_identity   - string (config.registry_password_identity)
  #   replica_timeout_in_seconds   - integer (config.replica_timeout_in_seconds; default 1800)
  #   registry_password            - refused: the password is read from Key Vault
  #
  # Each is passed to the key of the body's config named in brackets, which
  # ContainerAppModule's Job body documents. Each key of config is named for
  # the argument of azurerm_container_app_job it sets, an argument inside a
  # block by the block's name and its own joined with an underscore;
  # identity_ids sets the job's identity block, and registry_password_secret_id
  # and registry_password_identity the Key Vault reference of the secret the
  # registry password is read from. resource_group_name,
  # container_app_environment_id, identity_ids and the registry keys are the
  # ones terraform/server-container-apps and terraform/worker-container-apps
  # read, under the same names and meanings, so an operator writes one set of
  # overrides across them; location is the key terraform/server-app-service
  # and terraform/redis-azure-managed read for the region, and
  # replica_timeout_in_seconds is named for the argument it sets.
  #
  # resource_group_name, container_app_environment_id and location are
  # required and none has a default: the resource group and the Container
  # Apps environment the job runs in are provisioned outside this Release, no
  # subscription-independent value exists for either, and this Recipe never
  # chooses an environment, and with it a network, for the operator.
  # container_app_environment_id is the environment's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>,
  # and location the region the environment is in, which
  # azurerm_container_app_job requires. The environment decides the network
  # the job's egress leaves through and where its logs go: Container Apps sets
  # a log destination on the environment, and a job takes none of its own, so
  # this Recipe reads none.
  #
  # identity_ids are the resource IDs of user-assigned managed identities that
  # already exist, which the task's code calls Azure with. A private image is
  # pulled from registry_server, the registry's host name, either with
  # registry_identity, a user-assigned identity granted pull on the registry, or
  # with registry_username and a password Container Apps reads from the Key
  # Vault secret registry_password_secret_id names, with the user-assigned
  # identity registry_password_identity names. Each identity named for the
  # registry is given to the job as well, since Container Apps takes them only
  # from the job's own identities. A password written as text would be written
  # into the rendered configuration, so it is taken only by that reference, and
  # a system-assigned identity, which Azure creates with the job, is not one
  # this Recipe names. With no registry key set the image is pulled as a public
  # one.
  #
  # How a run starts. With values.schedule set, the job's trigger is a
  # schedule: Container Apps starts an execution on it, reading it as a cron
  # expression of the fields minute, hour, day of the month, month and day of
  # the week, evaluated in UTC, and Container Apps offers no other time zone
  # for a job. The expression is passed as it is written, and Container Apps
  # judges it when Terraform applies. With no schedule the job's trigger is
  # manual, and Terraform creates the job without starting an execution: a
  # task carrying core/manual-trigger, which a Manifest binds to
  # terraform/manual-trigger, asked for exactly that, and the operator
  # starts each run with az containerapp job start --name <component>
  # --resource-group <resource_group_name>, which takes a role allowed to
  # start the job. A scheduled job can be started that way too, attached or
  # not. A task with no schedule and no core/manual-trigger attachment asks
  # for a run when the Release deploys, which nothing here starts, so it is
  # refused by name.
  #
  # The deadline. Container Apps requires a replica timeout of every job and
  # stops a replica still running when it passes: replica_timeout_in_seconds,
  # a whole number of seconds, 1 or more, as the azurerm provider takes it,
  # and 1800 seconds, 30 minutes, where it is unset. It is independent of
  # values.timeout, which reaches the container as a variable for the code to
  # honour and sets no deadline of its own: an operator wanting Container Apps
  # to stop a run when the code's own timeout passes sets
  # replica_timeout_in_seconds to match it. Each
  # execution runs one replica, and no replica retry limit is set, so whether a
  # failed replica is retried is left to Container Apps.
  #
  # Files. Each file entry an edge's inject block dictates is mounted at its
  # path, as ContainerAppModule describes: one secret of the job per file,
  # file-0, file-1 and so on in path order, and one Secret volume mounted by
  # sub path at each path, so the file appears alone there and the rest of its
  # directory stays as the image holds it. That a Secret volume honours a sub
  # path is unverified against a running environment, which no build reaches.
  # A file's content is held in the secret and in Terraform state. No file, no
  # secret.
  #
  # Every Component value and infra key is honoured, refused by name in
  # ContainerAppArguments#/mappings/JobArguments and the assertions below, or
  # not read:
  #   honoured — values.schedule as the job's schedule; values.timeout as the
  #     locals below say; infra.image (required); infra.compute.cpu and
  #     infra.compute.memory as the Consumption size that entry chooses; the
  #     overrides above; and env and file entries.
  #   refused — a task with no schedule and no core/manual-trigger
  #     attachment; any infra.overrides key not listed above, and
  #     registry_password; an override that is not of the form above; a
  #     compute quantity that entry cannot read, and a pair larger than the
  #     largest size; a component name Container Apps does not take for a
  #     job; an edge or the component's own inject block injecting a variable
  #     under a name Container Apps sets in every job itself, or under
  #     TASK_TIMEOUT while the timeout is delivered under that default name; a
  #     file path that is not absolute or lies beneath another file's; and an
  #     edge's arg or custom-mechanism entry.
  #   not read — values.display_name and values.description, documentation
  #     knobs no Azure setting takes.
  assertions:
    overrides_known: >-
      {{- $known := list "resource_group_name" "container_app_environment_id" "location" "identity_ids" "registry_server" "registry_identity" "registry_username" "registry_password_secret_id" "registry_password_identity" "replica_timeout_in_seconds" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (or (has $k $known) (eq $k "registry_password")) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, container_app_environment_id, location, identity_ids, registry_server, registry_identity, registry_username, registry_password_secret_id, registry_password_identity and replica_timeout_in_seconds from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # A run that happens once has nothing on Azure to start it, so it halts
    # here. A task carrying core/manual-trigger asked for a run nothing starts
    # until the operator does, so it is not refused for having no schedule.
    # The attachment is found by its Feature's type, with any version it was
    # authored with set aside. Nothing else reads it: a scheduled task renders
    # alike with the attachment or without. registry_password passes the
    # assertion above and is refused by name in
    # ContainerAppArguments#/mappings/JobArguments.
    run_is_started: >-
      {{- $s := trim (toString (optional .values "schedule" "")) -}}
      {{- $manual := false -}}
      {{- range $name, $attachment := optional . "features" dict -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/manual-trigger" }}{{ $manual = true }}{{ end -}}
      {{- end -}}
      {{- if and (not $s) (not $manual) -}}
      {{- fail (printf "the component %q has no schedule and carries no core/manual-trigger attachment, so it runs once, and nothing on Azure starts a run that happens once: Terraform creates a Container Apps job with no schedule without starting an execution, so the run would never happen. Give the component a schedule in the Aggregate; or attach core/manual-trigger to it there, with the Manifest binding it to terraform/manual-trigger, to deploy the job alone for the operator to start each run with az containerapp job start" .metadata.instance_id) -}}
      {{- end -}}

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's timeout value. It is
  # delivered under the name helm/task delivers it under, and only when the
  # developer set it: a value set, even empty, renders its variable, and an
  # unset value renders none. That name is a default: it is rendered only while
  # no entry of the component's own inject block, in any mechanism, delivers the
  # timeout, and an edge or that block delivering that name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # schedule is not delivered as a variable: it becomes the job's schedule. The
  # component packages no upstream product, so no other local
  # ContainerAppArguments reads is declared: no default image, so the Release
  # names the one it runs; no port, so the job's container is probed on none;
  # no probe path, no GPU and no socket.
  locals:
    value_env: '{"values.timeout": "TASK_TIMEOUT"}'

  artifacts:
    # The Job body: the Container Apps job, holding each file as one of its
    # secrets.
    service:
      $import: ContainerAppModule#/artifacts/Job

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: ContainerAppArguments#/mappings/JobArguments

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name, such as
  # terraform/server-container-apps. The same name with other bytes halts the
  # build. The azurerm provider refuses to plan without its features block, and
  # a vendored module carries no provider block of its own, so the module
  # inherits this configuration; the provider reads its credentials and
  # subscription from the environment Terraform runs in. Terraform destroys the
  # module's resources with it, so the file stays while any component declaring
  # it does: remove the last of them from a Release only after destroying what
  # their modules created, because with the file gone Terraform refuses to plan,
  # asking for a provider block with the features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
