apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vertex-ai-embedding
  version: 1.0.0
  description: >
    Google Vertex AI's managed embedding API as a reference realization on
    Terraform: the module this Recipe writes declares no resource and
    reaches no provider, so applying it creates nothing, and it carries the
    regional endpoint the Release supplies and the embedding model's name as
    outputs of the module.

    Reach for it where the Release deploys Terraform;
    helm/vertex-ai-embedding and compose/vertex-ai-embedding realize the
    same Component on Kubernetes and Docker Compose. Declaring no provider,
    the module shares a root with a module at any google version. A
    consumer reads each value as the text the Release and the Aggregate
    give, and nothing is looked up when the configuration is applied. A
    missing infra.endpoint halts naming it. No credential is delivered by
    this Recipe: consumers authenticate with their own Google identity, such
    as the service account a Cloud Run service runs as, or inject their own
    credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-model/vertex-ai-embedding:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts before this Recipe
  # renders, the Component's schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.model, published as provides.model; infra.endpoint,
  #     published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.dimensionality, the size of the embeddings the
  #     developer means to ask for, which the Component publishes under no
  #     provides key and a consumer sets in each request it sends, as
  #     Vertex AI takes it (outputDimensionality, among the request's
  #     parameters); values.context_window, a hint for sizing the server
  #     that serves a model, which Vertex AI already does;
  #     values.display_name and values.description, which describe the
  #     component to its readers.
  #
  # Vertex AI serves its embedding models at a regional endpoint with no
  # resource of the project's own behind it, so this Recipe declares none.
  # The google provider's google_vertex_ai_endpoint creates an endpoint a
  # project deploys its own models to, which this Component does not
  # declare.
  #
  # Backup. The model is Vertex AI's, and this Recipe creates nothing to back
  # up.
  assertions:
    # The Vertex AI host carries the region, and the region is the operator's
    # choice, so no address exists for the catalog to hold as a default: the
    # Release names the host of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches Vertex AI in a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the Vertex AI host of that region (<region>-aiplatform.googleapis.com)" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the model's name from the
  # developer's values, each published as written, so a consumer in this
  # root or on another target reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"

  # The module this component becomes: no resource and no provider, so
  # applying it creates nothing and it takes no google version, and an
  # output for each value the component publishes, so the state records what
  # the configuration was given. Each value is written as a JSON string, with
  # Terraform's own template sequences ${ and %{ escaped as $${ and %%{, so
  # Terraform reads back exactly the text the Release and the Aggregate give.
  artifacts:
    main.tf: |
      output "endpoint" {
        value = {{ .infra.endpoint | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }

      output "model" {
        value = {{ .values.model | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }
