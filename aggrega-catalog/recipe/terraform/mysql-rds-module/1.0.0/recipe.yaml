apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql-rds-module
  version: 1.0.0
  description: >
    MySQL via AWS RDS, rendered by vendoring a local Terraform module and
    supplying its input variables.

    host publishes a Terraform reference to the instance's hostname, an output
    of the vendored module, and port publishes the port infra.port configures.
    The reference resolves only for a consumer authored as a source: Recipe in
    the same Terraform root configuration; a consumer on another target
    receives it as text. It names this component's module, so it resolves only
    where the Aggregate the Release deploys declares this component, not where
    it is composed in from another Aggregate.

    Set infra.overrides.host in the Release to the DNS name or IP literal the
    instance is reached at, and host publishes that name instead, which a
    consumer on any target can use. The Recipe emits nothing for it — no DNS
    record, no alias — so pointing the name at the instance is the operator's.
    A consumer in the same root configuration then receives the name too, and
    Terraform no longer orders it after the instance: order the two with the
    boundaries' syncWave.

    Reach for this realization where nothing may be fetched; reach for
    terraform/mysql-rds-terraform-aws-modules, the terraform-aws-modules
    project's published RDS module, where the pull may fetch it from its git
    repository, and for terraform/mysql-rds where the instance needs read
    replicas. A value RDS cannot apply — an application user, init scripts, a
    raw configuration file, read replicas — halts the build naming the key;
    compute, charset and collation are not read.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/mysql:1.0.0
  # This Recipe reads from infra.overrides:
  #   instance_class      - string (instance_class; default "db.t3.small")
  #   subnet_group        - string (db_subnet_group_name), required
  #   host                - string (published as provides.host; not passed to the module)
  #
  # instance_class and subnet_group are the names the inline RDS Recipes already
  # use for these values, so an operator states each once under one spelling
  # whichever shape of Recipe renders it. instance_class has a default, and the default lives here
  # rather than on the module's own variable: the module is also consumable
  # directly by a Terraform author, and a default in both places would be two
  # homes for one value.
  #
  # subnet_group has no default and none is invented: the group is provisioned
  # outside this deployment, no account-independent name exists, and a guessed one
  # would plan against the wrong network.
  #
  # The module declares its subnet_id input with no default, so the value is not
  # optional the way an inline Recipe's overrides are — an inline Recipe can leave
  # the argument out and let the service pick the account default, while a mapping
  # always renders the key and would render it empty. The assertion below is what
  # makes that omission a halt instead of an empty group name reaching the plan.
  #
  # host is no input of the module but the address a consumer reaches the
  # database at, under the name the inline RDS Recipes and the catalog's
  # referenced realization, helm/postgres-external, read for the same address.
  # It is a bare DNS name or IP literal: the assertion below refuses a value
  # carrying a scheme, a path, a user, a port or whitespace, because a consumer
  # composes its connection from host and port and would compose a broken one;
  # the port is infra.port. A value carrying exactly one colon is a name or an
  # IPv4 literal with a port; an IPv6 literal carries several and is accepted.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.database, infra.port, infra.engine_version,
  #     infra.storage.size, infra.storage.type (gp3 when unset),
  #     infra.ha.enabled, infra.backup.enabled (no automated backups and no
  #     final snapshot when false), infra.backup.retention_days, and the
  #     overrides above.
  #   refused — values.user, values.init_scripts, values.custom_config and
  #     infra.ha.read_replicas above zero.
  #   not read — infra.compute.cpu and infra.compute.memory, whose Component
  #     defaults would size a container: RDS sizes the instance by its instance
  #     class. values.charset and values.collation, whose defaults would set the
  #     server's character set: this Recipe sets no parameter group setting, so
  #     the instance takes its parameter group's. A Recipe cannot tell those
  #     defaults from a value written explicitly, so the Component's
  #     descriptions say so instead.
  assertions:
    subnet_group_supplied: >-
      {{- if not (and (hasKey .infra "overrides") (optional .infra.overrides "subnet_group" "")) -}}
      {{- fail "this Release places its database in a DB subnet group that already exists in the target account, and the Terraform module it renders requires that group's name, but infra.overrides.subnet_group carries none: set infra.overrides.subnet_group in the Release to the name of an existing DB subnet group" -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    # This Recipe provisions one instance, so a replica count is refused rather
    # than dropped. terraform/mysql-rds provisions replicas beside the primary.
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions one instance: set infra.ha.read_replicas to 0, or map this component to terraform/mysql-rds, which provisions read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}
    # RDS creates only its master user, admin, which provides.user publishes,
    # and runs no initialisation scripts and no configuration file of the
    # reader's.
    values_rds_cannot_apply: >-
      {{- if optional .values "user" "" -}}
      {{- fail "values.user asks for an application user beside the administrator, and RDS creates only the master user, admin, whose password it manages: remove values.user from the Aggregate and connect as admin, or create the user against the instance once it exists" -}}
      {{- end -}}
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and an RDS instance runs none: remove values.init_scripts from the Aggregate and run them against the instance once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and an RDS instance reads none: its server settings come from a DB parameter group, which terraform/mysql-rds attaches from infra.overrides.parameter_group and this Recipe does not; remove values.custom_config from the Aggregate" -}}
      {{- end -}}

  # The module files copy into the node's output verbatim, in that component's
  # own directory; the developer and operator pillars become the arguments of
  # the component's module block in the boundary's root configuration, which is
  # a position Terraform evaluates.
  #
  # The vendored module lives beside this Recipe. A local source is copied
  # verbatim into the node output — no fetch, no lockfile pin. Its main.tf pins
  # hashicorp/aws by the one range every AWS body in this catalog declares, and
  # says why.
  source: ./module

  locals:
    # The name the Release gives the instance under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # The String Pipe: the compiler does not interpret these strings. It pipes
  # whatever the module's outputs name; Terraform resolves them at apply time.
  # user is the module's RDS master username (admin); database mirrors the
  # developer value the module provisions.
  #
  # host names the module's address output through this component's module
  # call, which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the Release
  # deploys; a reference to the module's resource would name nothing the root
  # declares.
  # address is the instance's bare hostname; the module's endpoint output is
  # address:port. port is the value the mapping below passes to the module, so
  # it is known ahead of time and published as that value.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record or alias for it, so the operator points the name at the instance
  # outside the Release. A consumer in the same root configuration receives
  # the name as well, and a name carries no reference for Terraform to order
  # its module after this one by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.address}{{ end }}"
    port: "{{ .infra.port }}"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mysql"

  # This mapping supplies the module's input variables from the developer and
  # operator pillars. Each rendered key becomes an argument of this component's
  # module block in the boundary's root configuration, emitted in deterministic
  # key order. The subnet_id value is the DB subnet group name the operator
  # supplies, which is what the module's own declaration asks of its caller: the
  # group is provisioned outside this deployment and its name differs per
  # environment, so it is the operator's to state.
  #
  # A value that IS a Terraform interpolation stays available here and behaves
  # the way the String Pipe describes: the compiler pipes the ${...} through
  # untouched as a deterministic ahead-of-time pointer. A module argument is a
  # position Terraform evaluates, so a pointer written here resolves — what it
  # still needs is a referent the configuration declares.
  #
  # infra.storage.type is the RDS storage type here, not a storage class; the
  # Component declares no default for it, so this mapping supplies gp3. A
  # Release that turns backups off sets the retention to zero, which stops
  # automated backups, and skips the final snapshot with them.
  valuesMapping: |
    db_name: "{{ .values.database }}"
    engine_version: "{{ .infra.engine_version }}"
    instance_class: "{{ optional .infra.overrides "instance_class" "db.t3.small" }}"
    allocated_storage: {{ trimSuffix "Gi" .infra.storage.size }}
    storage_type: "{{ .infra.storage.type | default "gp3" }}"
    multi_az: {{ .infra.ha.enabled }}
    backup_retention_period: {{ if .infra.backup.enabled }}{{ .infra.backup.retention_days }}{{ else }}0{{ end }}
    skip_final_snapshot: {{ not .infra.backup.enabled }}
    port: {{ .infra.port }}
    subnet_id: "{{ .infra.overrides.subnet_group }}"
