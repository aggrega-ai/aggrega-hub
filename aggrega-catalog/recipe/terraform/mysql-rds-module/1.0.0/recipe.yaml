apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql-rds-module
  version: 1.0.0
  description: >
    MySQL via AWS RDS, rendered by vendoring a local Terraform module and
    supplying its input variables. The module files copy into the node's output
    verbatim, in that component's own directory; the developer and operator
    pillars become the arguments of the component's module block in the
    boundary's root configuration, which is a position Terraform evaluates.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/mysql:1.0.0
  # This Recipe reads from infra.overrides:
  #   instance_class      - string (instance_class; default "db.t3.small")
  #   subnet_group        - string (db_subnet_group_name), required
  #
  # Both key names are the ones the inline RDS Recipes already use for these
  # values, so an operator states each once under one spelling whichever shape of
  # Recipe renders it. instance_class has a default, and the default lives here
  # rather than on the module's own variable: the module is also consumable
  # directly by a Terraform author, and a default in both places would be two
  # homes for one value.
  #
  # subnet_group has no default and none is invented: the group is provisioned
  # outside this deployment, no account-independent name exists, and a guessed one
  # would plan against the wrong network.
  #
  # The module declares its subnet_id input with no default, so the value is not
  # optional the way an inline Recipe's overrides are — an inline Recipe can leave
  # the argument out and let the service pick the account default, while a mapping
  # always renders the key and would render it empty. The assertion below is what
  # makes that omission a halt instead of an empty group name reaching the plan.
  assertions:
    subnet_group_required: >-
      {{- if not (and (hasKey .infra "overrides") (optional .infra.overrides "subnet_group" "")) -}}
      {{- fail "this deployment places its database in a DB subnet group that already exists in the target account, and the Terraform module it renders requires that group's name, but infra.overrides.subnet_group carries none: set infra.overrides.subnet_group in the Release to the name of an existing DB subnet group" -}}
      {{- end -}}

  # The vendored module lives beside this Recipe. A local source is copied
  # verbatim into the node output — no fetch, no lockfile pin.
  source: ./module

  # The String Pipe: the compiler does not interpret these strings. It pipes
  # whatever the module's outputs name; Terraform resolves them at apply time.
  # user is the module's RDS master username (admin); database mirrors the
  # developer value the module provisions.
  provides:
    host: "aws_db_instance.this.endpoint"
    port: "aws_db_instance.this.port"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mysql"

  # This mapping supplies the module's input variables from the developer and
  # operator pillars. Each rendered key becomes an argument of this component's
  # module block in the boundary's root configuration, emitted in deterministic
  # key order. The subnet_id value is the DB subnet group name the operator
  # supplies, which is what the module's own declaration asks of its caller: the
  # group is provisioned outside this deployment and its name differs per
  # environment, so it is the operator's to state.
  #
  # A value that IS a Terraform interpolation stays available here and behaves
  # the way the String Pipe describes: the compiler pipes the ${...} through
  # untouched as a deterministic ahead-of-time pointer. A module argument is a
  # position Terraform evaluates, so a pointer written here resolves — what it
  # still needs is a referent the configuration declares.
  valuesMapping: |
    db_name: "{{ .values.database }}"
    engine_version: "{{ .infra.engine_version }}"
    instance_class: "{{ optional .infra.overrides "instance_class" "db.t3.small" }}"
    allocated_storage: {{ trimSuffix "Gi" .infra.storage.size }}
    multi_az: {{ .infra.ha.enabled }}
    subnet_id: "{{ .infra.overrides.subnet_group }}"
