apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql-rds-module
  version: 1.0.0
  description: >
    MySQL via AWS RDS, rendered by vendoring a local Terraform module and
    overlaying its input variables. The module files copy into the node's
    output verbatim; the developer and operator pillars flow into a generated
    aggrega.auto.tfvars.json overlay that Terraform loads automatically.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/mysql:1.0.0

  # The vendored module lives beside this Recipe. A local source is copied
  # verbatim into the node output — no fetch, no lockfile pin.
  source: ./module

  # The String Pipe: the compiler does not interpret these strings. It pipes
  # whatever the module's outputs name; Terraform resolves them at apply time.
  # user is the module's RDS master username (admin); database mirrors the
  # developer value the module provisions.
  provides:
    host: "aws_db_instance.this.endpoint"
    port: "aws_db_instance.this.port"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mysql"

  # The overlay maps developer and operator pillars onto the module's input
  # variables. The rendered map becomes aggrega.auto.tfvars.json, with keys
  # emitted in deterministic order. The subnet_id value is a Terraform
  # interpolation supplied as a deterministic pointer string: the compiler
  # pipes the ${...} through untouched, and Terraform resolves it at apply time.
  valuesMapping: |
    db_name: "{{ .values.database }}"
    engine_version: "{{ .infra.engine_version }}"
    allocated_storage: {{ trimSuffix "Gi" .infra.storage.size }}
    multi_az: {{ .infra.ha.enabled }}
    subnet_id: "${data.aws_db_subnet_group.default.name}"
