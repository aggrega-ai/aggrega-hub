apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-api-management
  version: 1.0.0
  description: >
    Adds an API serving a model to an Azure API Management instance that
    already exists, rendered as Terraform for the azurerm provider: the API,
    its chat completions operation, the backend it forwards to and its policy.
    Reach for it where the instance exists and the Release is to configure the
    API; reach for the helm or compose reference where the API is configured
    outside the Release. It never creates the instance, so a Release without
    one creates it outside first.

    The policy sends each request to the backend, removes the caller's
    subscription key from what it forwards, and authenticates as
    infra.backend_authentication says; what an attached core/semantic-caching,
    core/period-budget, core/prompt-injection-shield or core/retry-policy sets
    is written into the same policy. Terraform authenticates to Azure with the
    credentials in the environment it runs in, and a provider key reaches the
    configuration only as the identifier of the Key Vault secret holding it, so
    the rendered files carry no credential.

    The azurerm provider, which does not plan without its features block, is
    configured in one file beside the boundary's root configuration, shared by
    every component there that declares it. So a Release that removes the
    last of them destroys what their modules created first: once the file is
    gone, Terraform has no provider configuration left to destroy those
    resources with. It needs hashicorp/azurerm 5 and
    terraform/postgres-flexible-server azurerm 4, so the two go in different
    terraform boundaries.

    Applying it is outside any build: whether the API then behaves as
    Microsoft documents is not observed by the compiler.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/gateway/azure-api-management:1.0.0

  # The API's name in the instance, derived once from its path, which the
  # instance already holds unique: a slash becomes a hyphen. The backend and the
  # named value are named after it. The gateway's host defaults to the one Azure
  # gives the instance.
  locals:
    api_name: '{{ .infra.api_path | replace "/" "-" }}'
    gateway_url: '{{ default (printf "https://%s.azure-api.net" .infra.api_management_name) (optional .infra "gateway_url" "") }}'

  # The address is composed from values the operator names, so it is a fixed
  # string a consumer on any target can use, not a Terraform reference.
  provides:
    endpoint: "{{ .locals.gateway_url }}/{{ .infra.api_path }}"
    model: "{{ .values.model }}"

  # Each halts before anything renders, naming what to set.
  assertions:
    resource_group_name_supplied: >-
      {{- if not (optional .infra "resource_group_name" "") -}}
      {{- fail (printf "%q sets no infra.resource_group_name, but the terraform realization of core/gateway/azure-api-management reads the API Management instance %s in the resource group it names before adding the API to it; set infra.resource_group_name in the Release" .metadata.instance_id .infra.api_management_name) -}}
      {{- end -}}
    backend_url_supplied: >-
      {{- if not (optional .infra "backend_url" "") -}}
      {{- fail (printf "%q sets no infra.backend_url, but the terraform realization of core/gateway/azure-api-management writes the backend the API forwards model requests to from it; set infra.backend_url in the Release to the base address of the model API, such as https://<resource>.openai.azure.com/openai/v1" .metadata.instance_id) -}}
      {{- end -}}
    # No default, because a managed identity token sent to the wrong backend
    # is a token that backend can use; the operator says which it is.
    backend_authentication_supplied: >-
      {{- if not (optional .infra "backend_authentication" "") -}}
      {{- fail (printf "%q sets no infra.backend_authentication, but the terraform realization of core/gateway/azure-api-management has to know how the gateway authenticates to the model API at %s: managed_identity for Azure OpenAI or another Microsoft Foundry model the instance's identity holds a role on, provider_key with the provider_key slot attached, or none for a model API taking no credential; set it in the Release" .metadata.instance_id (optional .infra "backend_url" "infra.backend_url")) -}}
      {{- end -}}
    provider_key_follows_the_authentication: >-
      {{- $attached := hasKey (optional . "features" dict) "provider_key" -}}
      {{- $mode := optional .infra "backend_authentication" "" -}}
      {{- if and (eq $mode "provider_key") (not $attached) -}}
      {{- fail (printf "%q sets infra.backend_authentication to provider_key with nothing attached to its provider_key slot, so the gateway would have no key to present; attach the identifier of the Key Vault secret holding the key to provider_key, or choose another backend_authentication" .metadata.instance_id) -}}
      {{- else if and $attached (ne $mode "provider_key") -}}
      {{- fail (printf "%q carries an attachment on its provider_key slot while infra.backend_authentication is %q, so the key would be written and never sent; set backend_authentication to provider_key, or remove the attachment" .metadata.instance_id $mode) -}}
      {{- end -}}
    # The external cache, affirmed rather than hoped for. Azure's semantic
    # cache looks a prompt up by vector proximity in the external cache
    # configured on the instance, which Microsoft requires to be a Redis cache
    # with RediSearch enabled, and that cache is configured outside the
    # Release. The compiler runs ahead of time and cannot look, so it asks the
    # operator to affirm the cache and halts when core/semantic-caching is
    # attached and nobody has.
    cache_serves_vector_search_affirmed: >-
      {{- $caches := list -}}
      {{- range $name, $attachment := (default dict .features) -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/semantic-caching" -}}
      {{- $caches = append $caches (printf "%q" $name) -}}
      {{- end -}}
      {{- end -}}
      {{- if and $caches (not (optional .infra "cache_serves_vector_search" false)) -}}
      {{- fail (printf "%q carries core/semantic-caching attachment %s, which the terraform realization of core/gateway/azure-api-management writes as Azure's semantic cache, and Azure looks a prompt up by vector proximity in the external cache of the API Management instance %s, which has to be a Redis cache with RediSearch enabled; that cache is configured outside the Release, where no build can see it. Set infra.cache_serves_vector_search to true on this component in the Release to affirm that the instance's external cache serves RediSearch's vector search, or remove the attachment" .metadata.instance_id (join ", " $caches) .infra.api_management_name) -}}
      {{- end -}}

  # The body renders into this component's own module directory.
  #
  # required_providers names the provider by its full source address and pins
  # its version, so Terraform installs the provider whose resource schema this
  # body was written against. The body configures no provider. The azurerm
  # provider refuses to plan without a features block in its configuration,
  # and that block is a file of the boundary below, written beside the root
  # configuration, which this module inherits. A module carrying its own
  # provider block cannot be called with depends_on, which the root writes on
  # this module whenever another component composed into the same root carries
  # an earlier syncWave. The provider reads its credentials and subscription
  # from the environment Terraform runs in.
  #
  # The instance is read, never created: a data source fails the plan when it
  # does not exist. The API is named after its path, its backend and named
  # value after the API.
  #
  # provider_key arrives as the value its attachment delivers on this node's
  # inject pipe, under the key the attachment names; terraform/variable-secret
  # delivers the attachment's origin there unchanged. It is written as the
  # identifier of a Key Vault secret, so the instance reads the key from Key
  # Vault and the key itself appears nowhere in this configuration. Anything
  # else delivered there halts the build, and the message does not repeat it.
  # The secret named value is referenced in the backend's header as {{name}},
  # API Management's own notation, which the template writes as a quoted
  # literal.
  #
  # The policy removes the caller's subscription key from the request it
  # forwards, in the header and in the query string, so the model API never
  # receives the key a caller presents to the gateway; Microsoft's policy
  # reference does not say whether the gateway would forward it otherwise.
  #
  # An attached FeatureRecipe delivers its policy element on the
  # azure_api_management mechanism of this node's inject pipe, and this body
  # places it as delivered:
  #   prompt_shield               - core/prompt-injection-shield is attached:
  #                                 this body writes Azure's content safety
  #                                 check with its prompt shield on, through
  #                                 the backend infra.content_safety_backend_id
  #                                 names, first in inbound after the
  #                                 authentication, and halts while that key
  #                                 is unset
  #   semantic_cache_lookup       - core/semantic-caching's lookup, in inbound
  #   token_limit.<name>          - one token limit per core/period-budget
  #                                 attachment, in inbound after the lookup,
  #                                 in the order of their names
  #   semantic_cache_store        - core/semantic-caching's store, in outbound
  #   retry                       - core/retry-policy's retry around the
  #                                 forwarding, as the backend section's one
  #                                 element in place of <base />; empty for a
  #                                 single send, which keeps <base />
  #   subscription_scoped.<name>  - names an attachment that keys on the
  #                                 caller's API Management subscription
  # The token limits follow the cache lookup, the order Microsoft's reference
  # recommends for a limit beside a cache. A backend section holds one element,
  # so with a retry in it the API no longer inherits the forwarding of a
  # broader scope and forwards with forward-request's defaults. With nothing
  # attached nothing is written. An element's policy expressions keep their double quotes
  # unescaped, the form Microsoft's reference writes them in: the provider
  # sends xml_content to Azure as raw XML. The build halts on a delivered
  # element carrying ${ or %{, which Terraform would read inside the heredoc
  # as its own template syntax, and while infra.subscription_required is false
  # under an attachment keyed on the subscription, because a request then need
  # present no subscription key, so there is no verified subscription to key
  # on.
  artifacts:
    main.tf: |
      {{- $set := dict }}
      {{- with .context.inject }}{{ with optional . "azure_api_management" "" }}{{ $set = . }}{{ end }}{{ end }}
      {{- $limits := list }}
      {{- $keyed := list }}
      {{- range $name, $element := $set }}
      {{- if or (contains "${" $element) (contains "%{" $element) }}
      {{- fail (printf "the element delivered as %q for the policy of %q carries ${ or %%{, which Terraform reads inside the policy's heredoc as its own template syntax, so the terraform realization of core/gateway/azure-api-management does not write it" $name $.context.instance_id) }}
      {{- end }}
      {{- if hasPrefix "token_limit." $name }}{{ $limits = append $limits $element }}{{ end }}
      {{- if hasPrefix "subscription_scoped." $name }}{{ $keyed = append $keyed (printf "%s attachment %q" $element (trimPrefix "subscription_scoped." $name)) }}{{ end }}
      {{- end }}
      {{- if and $keyed (not .infra.subscription_required) }}
      {{- fail (printf "%q sets infra.subscription_required to false, but its %s keys on the API Management subscription whose key the gateway verifies, and a request need then present no subscription key, so there is no verified subscription to key on; set infra.subscription_required to true, or change what the attachment keys on" .context.instance_id (join " and " $keyed)) }}
      {{- end }}
      {{- $shield := "" }}
      {{- if optional $set "prompt_shield" "" }}
      {{- $shield = optional .infra "content_safety_backend_id" "" }}
      {{- if not $shield }}
      {{- fail (printf "%q carries core/prompt-injection-shield, which the terraform realization of core/gateway/azure-api-management writes as Azure's content safety check, and that check calls Azure AI Content Safety through a backend of the instance, but infra.content_safety_backend_id names none; set it in the Release to the id of the instance's backend for its Azure AI Content Safety resource" .context.instance_id) }}
      {{- end }}
      {{- end }}
      {{- $nv := printf "%s-provider-key" .locals.api_name }}
      {{- $key := "" }}
      {{- with (optional . "features" dict).provider_key }}
      {{- $env := dict }}
      {{- with $.context.inject }}{{ with optional . "env" "" }}{{ $env = . }}{{ end }}{{ end }}
      {{- $key = optional $env .values.key "" }}
      {{- if not (regexMatch "^https://[a-z0-9-]+(\\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$" $key) }}
      {{- fail (printf "the provider_key attachment on %q delivers a value that is not the identifier of a Key Vault secret, https://<vault>.vault.azure.net/secrets/<name>, so the terraform realization of core/gateway/azure-api-management does not write it; store the key in Key Vault and attach the secret's identifier, which the instance reads with its managed identity" $.context.instance_id) }}
      {{- end }}
      {{- end }}
      terraform {
        required_providers {
          azurerm = {
            source  = "hashicorp/azurerm"
            version = "5.9.0"
          }
        }
      }

      data "azurerm_api_management" "this" {
        name                = "{{ .infra.api_management_name }}"
        resource_group_name = "{{ .infra.resource_group_name }}"
      }
      {{- if $key }}

      resource "azurerm_api_management_named_value" "provider_key" {
        name                = "{{ $nv }}"
        api_management_name = data.azurerm_api_management.this.name
        resource_group_name = data.azurerm_api_management.this.resource_group_name
        display_name        = "{{ $nv }}"
        secret              = true

        value_from_key_vault {
          secret_id = "{{ $key }}"
        }
      }
      {{- end }}

      resource "azurerm_api_management_backend" "model" {
        name                = "{{ .locals.api_name }}-backend"
        api_management_name = data.azurerm_api_management.this.name
        resource_group_name = data.azurerm_api_management.this.resource_group_name
        protocol            = "http"
        url                 = "{{ .infra.backend_url }}"
      {{- if $key }}

        credentials {
          header = {
            "{{ .infra.provider_key_header }}" = "{{ printf "{{%s}}" $nv }}"
          }
        }

        depends_on = [azurerm_api_management_named_value.provider_key]
      {{- end }}
      }

      resource "azurerm_api_management_api" "this" {
        name                  = "{{ .locals.api_name }}"
        api_management_name   = data.azurerm_api_management.this.name
        resource_group_name   = data.azurerm_api_management.this.resource_group_name
        revision              = "1"
        display_name          = "{{ .locals.api_name }}"
        path                  = "{{ .infra.api_path }}"
        protocols             = ["https"]
        subscription_required = {{ .infra.subscription_required }}
      }

      resource "azurerm_api_management_api_operation" "chat_completions" {
        operation_id        = "chat-completions"
        api_name            = azurerm_api_management_api.this.name
        api_management_name = data.azurerm_api_management.this.name
        resource_group_name = data.azurerm_api_management.this.resource_group_name
        display_name        = "Chat completions"
        method              = "POST"
        url_template        = "/chat/completions"
      }

      resource "azurerm_api_management_api_policy" "this" {
        api_name            = azurerm_api_management_api.this.name
        api_management_name = data.azurerm_api_management.this.name
        resource_group_name = data.azurerm_api_management.this.resource_group_name

        xml_content = <<XML
      <policies>
        <inbound>
          <base />
          <set-backend-service backend-id="${azurerm_api_management_backend.model.name}" />
          <set-header name="Ocp-Apim-Subscription-Key" exists-action="delete" />
          <set-query-parameter name="subscription-key" exists-action="delete" />
      {{- if eq .infra.backend_authentication "managed_identity" }}
          <authentication-managed-identity resource="https://cognitiveservices.azure.com" />
      {{- end }}
      {{- if $shield }}
          <llm-content-safety backend-id="{{ $shield }}" shield-prompt="true" />
      {{- end }}
      {{- with optional $set "semantic_cache_lookup" "" }}{{ . | nindent 4 }}{{ end }}
      {{- range $limits }}{{ . | nindent 4 }}{{ end }}
        </inbound>
        <backend>
      {{- with optional $set "retry" "" }}{{ . | nindent 4 }}{{ else }}
          <base />
      {{- end }}
        </backend>
        <outbound>
      {{- with optional $set "semantic_cache_store" "" }}{{ . | nindent 4 }}{{ end }}
          <base />
        </outbound>
        <on-error>
          <base />
        </on-error>
      </policies>
      XML
      }

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The module inherits this configuration,
  # and Terraform destroys the module's resources with it, so the file stays
  # while any component declaring it does: remove the last of them from a
  # Release only after destroying what their modules created, because with the
  # file gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
