apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-ecs
  version: 1.1.0
  description: >
    The generic background-worker primitive as one Amazon ECS service on
    Fargate, running infra.replicas tasks of the Release's image, on the
    catalog's shared Amazon ECS body. Reach for it where the target is an AWS
    account with an ECS cluster and a VPC; reach for helm/worker on a
    Kubernetes cluster.

    The cluster, subnets, security groups and execution role come from the
    operator, under infra.overrides, and each is required; a task role, a
    public IP and a log group are optional, and nothing is emitted for one
    left unset. Only a task definition and a service are emitted — no
    cluster, role, security group, log group or load balancer, each of which
    the operator already runs — and the container maps no port, so nothing
    connects to the worker. No container health check is declared, because
    ECS runs one inside an image this Recipe does not name.

    Each env entry an edge's inject block, or the component's own, dictates
    becomes an entry of the container's environment under that name, its value
    written whole, so a Terraform reference a neighbour publishes is evaluated
    by the engine; concurrency and queue_depth_hint arrive by default as
    WORKER_CONCURRENCY and WORKER_QUEUE_DEPTH_HINT, which no edge may dictate
    while they are the defaults. File, arg and other entries are refused by
    name: Fargate writes no file, and no command line is rendered. The task
    runs at the smallest Fargate size meeting both infra.compute.cpu and
    infra.compute.memory, so the Component's defaults run at 0.25 vCPU and
    512 MiB.

    The terraform-aws-modules ECS module is not sourced: its root runs
    services only in a cluster it creates itself, so it is not complete for a
    service in the operator's cluster.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/worker:1.0.0

  # AWS App Runner is not used: it is no longer open to new customers.

  # The module beside this Recipe is the fixed pass-through every container
  # Recipe of this catalog carries byte for byte: its one input, config, goes
  # to the service module the artifacts below import, and that module comes
  # back out as its service output. entity.lock pins it.
  #
  # The terraform-aws-modules project publishes an ECS module,
  # terraform-aws-modules/ecs/aws, and at v7.6.1 it is not complete for this
  # component: its root module passes every service it declares the ARN of the
  # cluster the root itself creates, declares no input naming an existing one,
  # and turns its services off with its cluster. Its service sub-module does take
  # an existing cluster, but it calls a sibling directory, which a source
  # narrowed to the sub-module would leave behind. Where the operator runs the
  # cluster, the catalog's own Service body, declaring a task definition and a
  # service, is what fits.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   cluster             - string (config.cluster), required
  #   subnet_ids          - []string (config.subnet_ids), required
  #   vpc_security_groups - []string (config.security_groups), required
  #   execution_role_arn  - string (config.execution_role_arn), required
  #   task_role_arn       - string (config.task_role_arn)
  #   assign_public_ip    - bool (config.assign_public_ip; default false)
  #   awslogs_group       - string (config.awslogs_group)
  #
  # Each is passed to the key of the body's config named in brackets, which
  # EcsFargateModule's Service body documents. Each key of config is named for
  # the resource argument it sets, the awslogs_group one for the awslogs-group
  # option of the container's log configuration, except subnet_ids, which
  # carries its key's name to the service's subnets. Some keys reuse a spelling
  # another Recipe already reads for the same concept, so an operator writes
  # each under one name across the catalog's terraform AWS Recipes: subnet_ids,
  # as terraform/opensearch-service reads the subnets it places its domain in,
  # and vpc_security_groups, as the RDS and ElastiCache Recipes read the
  # security groups. These are the keys terraform/server-ecs reads, under the
  # same names, less target_group_arn.
  #
  # cluster, subnet_ids, vpc_security_groups and execution_role_arn are
  # required and none has a default: the cluster, the network and the role ECS
  # pulls the image and writes logs with are provisioned outside this Release,
  # no account-independent value exists for any of them, and this Recipe never
  # chooses a network or a role for the operator. The cluster is named by its
  # name or its ARN. The execution role is what Amazon ECS pulls a private
  # image and writes the container's logs with; it is required whichever the
  # image is, so a Release that later names a private image or a log group
  # changes no role. assign_public_ip gives each task a public IP address,
  # which a task in a public subnet needs to reach the internet with no NAT
  # gateway; it is off unless the Release turns it on. awslogs_group names a
  # log group that already exists, in the Region the service runs in, to which
  # the container's output is written under the stream prefix of the
  # component's name; the execution role must be allowed to write to it.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # EcsFargateArguments#/mappings/ServiceArguments:
  #   honoured — values.concurrency and values.queue_depth_hint as the locals
  #     below say, infra.image (required), infra.replicas as the service's
  #     desired count, infra.compute.cpu and infra.compute.memory as the
  #     Fargate size that entry chooses, the overrides above, and env entries.
  #   refused — infra.overrides.target_group_arn, since the worker's container
  #     maps no port and nothing connects to a worker; a compute quantity that
  #     entry cannot read, and a pair larger than the largest Fargate task; a
  #     component name ECS does not take for a service; an edge or the
  #     component's own inject block injecting a variable under one of the two
  #     default names the developer values are delivered under; and an edge's
  #     file, arg or custom-mechanism entry.

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the two developer values. They are
  # delivered under the names helm/worker delivers them under, and only when
  # the developer set them, so an unset value renders no variable rather than
  # an empty one. Those names are defaults: each is rendered only while no
  # entry of the component's own inject block, in any mechanism, delivers its
  # value, and an edge or that block delivering either name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # component packages no upstream product, so no other local
  # EcsFargateArguments reads is declared: no default image, so the Release
  # names the one it runs; no port, so the container maps none; no probe, no
  # GPU and no socket.
  locals:
    value_env: '{"values.concurrency": "WORKER_CONCURRENCY", "values.queue_depth_hint": "WORKER_QUEUE_DEPTH_HINT"}'

  artifacts:
    # The Service body: the task definition and the service.
    service:
      $import: EcsFargateModule#/artifacts/Service
    # A configuration applied with terraform/worker-ecs 1.0.0 holds the task
    # definition at aws_ecs_task_definition.this and the service at
    # aws_ecs_service.this in this component's module, the addresses that
    # version declares them at; this version declares them in the service
    # module. The blocks move them there, so Terraform keeps the running
    # service and its task definition rather than replacing them.
    moved.tf: |
      moved {
        from = aws_ecs_task_definition.this
        to   = module.service.aws_ecs_task_definition.this
      }

      moved {
        from = aws_ecs_service.this
        to   = module.service.aws_ecs_service.this
      }

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: EcsFargateArguments#/mappings/ServiceArguments
