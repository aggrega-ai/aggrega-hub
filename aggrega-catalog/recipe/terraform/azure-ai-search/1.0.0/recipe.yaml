apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-ai-search
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # search service module: the third-party code this Recipe pins and writes
  # into the output. The search service it provisions is a service the reader
  # contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values, attachments and infra.overrides keys this Recipe refuses are
  # listed, with their reasons, in the comments above the assertions.
  description: >
    Azure AI Search: one search service, realized by Microsoft's Azure
    Verified Modules module Azure/avm-res-search-searchservice/azurerm at
    v0.4.0, MIT, pinned by commit and archive digest in entity.lock.

    Reach for it where the service lives in the operator's subscription and
    the Release deploys Terraform; reach for arm/azure-ai-search where it
    deploys an Azure Resource Manager template. The resource group and region
    are the operator's, named in infra.overrides. Public network access is off
    unless infra.overrides.public_network_access_enabled is true; the private
    endpoint or the IP rules a client reaches the service through are the
    operator's, and none is emitted.

    The service's API keys are off, so it takes requests authenticated with
    Microsoft Entra ID alone, and no key is written into the configuration or
    published; the role assignment granting a consumer's identity access is
    the operator's, and none is emitted. host publishes a reference to the
    service's DNS name, or infra.overrides.host; port is 443; endpoint is
    https:// followed by host. infra.overrides.sku_name sets the service tier,
    standard unless set, and infra.overrides.replica_count and partition_count
    its replicas and partitions, 1 each unless set. values.semantic_search
    sets the semantic ranker's plan. A value or an infra.overrides key the
    service, the module or its provider cannot take halts naming it, as do a
    replica or partition count the tier does not take, more than the 36 search
    units a service is given, and any semantic ranker plan on the free tier.
    The service keeps no backup of its own, so this Recipe configures none,
    and a core/backup attachment bound to terraform/backup-native halts on
    that.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/azure-ai-search:1.0.0

  # The published module, at the tag the registry publishes as version 0.4.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root, which declares the search service
  # and calls no module, so the configuration Terraform loads from it calls no
  # registry module and initialising it fetches providers and nothing else.
  # The repository's examples/ and tests/ directories are vendored with it and
  # never loaded.
  #
  # The module declares hashicorp/azurerm "~> 4.0" and Azure/azapi "~> 2.12"
  # in its own required_providers, and Terraform ">= 1.9, < 2.0". It creates
  # the service as an azurerm_search_service. It is vendored byte for byte, so
  # this Recipe adds no provider constraint of its own. "~> 4.0" admits no
  # azurerm 5 release, while the catalog's own Azure bodies declare "~> 5.14"
  # and terraform/azure-api-management pins azurerm at exactly 5.9.0, so one
  # root configuration cannot install a provider satisfying both: a Release
  # places this service in a terraform boundary apart from those bodies. The
  # Container Apps bodies of the generic compute Recipes admit azurerm 4 and 5
  # alike, so they share its boundary.
  source:
    kind: git-repository
    url: https://github.com/Azure/terraform-azurerm-avm-res-search-searchservice.git
    ref: v0.4.0

  locals:
    # The service tier, infra.overrides.sku_name or standard, the module's own
    # default. Only a string is read here; any other value is refused by the
    # assertion below rather than passed on.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The name the Release gives the service under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name            - string (resource_group_name), required
  #   location                       - string (location), required
  #   sku_name                       - string (sku; default "standard")
  #   replica_count                  - integer (replica_count; default 1)
  #   partition_count                - integer (partition_count; default 1)
  #   public_network_access_enabled  - bool (public_network_access_enabled; default false,
  #                                    where the module's own default is true)
  #   enable_telemetry               - bool (enable_telemetry; false unless set to true here,
  #                                    where the module's own default is true)
  #   tags                           - map[string]string (tags)
  #   host                           - string (published as provides.host and in
  #                                    provides.endpoint; not passed to the module)
  #
  # Each is named by the module input it sets, given in brackets, save
  # sku_name, which every Azure Recipe reads for the size class a service is
  # provisioned at, and host, which every managed datastore Recipe reads for
  # the address it publishes. arm/azure-ai-search reads each of them but
  # resource_group_name under the same spelling, and admits enable_telemetry
  # only as false: its template deploys into the group it is deployed to, and
  # always turns the module's telemetry off. resource_group_name and location
  # are required: they place the service in the operator's subscription, and
  # this Recipe never chooses either.
  #
  # sku_name names the service tier as the service spells it: free, basic,
  # standard, standard2, standard3, storage_optimized_l1 or
  # storage_optimized_l2, the values the module's sku input takes. The service
  # checks whether the region offers the tier when Terraform applies.
  #
  # replica_count and partition_count. Each replica holds a copy of the
  # service's indexes and answers queries; partitions divide the indexes'
  # storage. Unset, each is 1, the module's default and the count Microsoft's
  # documentation gives a service when it starts. Two replicas or more give a
  # read service level agreement and spread the replicas across availability
  # zones where the region has them; three give a read-write one. The service
  # tier bounds both counts, which the assertions below check.
  #
  # public_network_access_enabled. A search service takes requests over its
  # public endpoint, subject to its IP rules, or over a private endpoint in a
  # virtual network. Unset or false, public network access is off and a
  # client reaches the service only through a private endpoint; true turns it
  # on. This Recipe passes neither the module's private_endpoints nor its
  # allowed_ips: each is the operator's, created for the service outside the
  # Release, the way a virtual network's subnets and private DNS zones are.
  #
  # While enable_telemetry is true, the module's default, the module submits
  # an empty Azure Resource Manager template to the subscription, in the
  # service's region, which Microsoft counts as usage of the module. This
  # Recipe passes false unless infra.overrides.enable_telemetry is true; any
  # value that is not a boolean is refused below.
  #
  # Any other key under infra.overrides halts the build naming it, so a key
  # misspelt, or meant for another Recipe, is never passed over unread.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: the hosting mode is the provider's default, so a
  # standard3 service runs no high-density partitions; the service carries no
  # managed identity, customer-managed key, network rule bypass, private
  # endpoint, role assignment, diagnostic setting or lock. These are replaced:
  # local_authentication_enabled, which the provider defaults to true, is
  # false, so the service's API keys are off, and public_network_access_enabled
  # and enable_telemetry, which the module defaults to true, are false unless
  # set.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation, the
  # module's inputs and the azurerm provider's resource:
  #   honoured — values.semantic_search, as the semantic ranker's plan; and the
  #     overrides above.
  #   refused — values.semantic_search free or standard on the free tier; a
  #     replica count or partition count the tier does not take; more than 36
  #     search units; a service name the service refuses; a core/backup
  #     attachment, as the comment below says; and any infra.overrides key not
  #     listed above.
  #   not read — none.
  #
  # The semantic ranker's plans. The azurerm provider's semantic_search_sku
  # takes free or standard; left unset, the provider sends disabled, the value
  # the management API version it deploys with, 2025-05-01, takes for the
  # ranker off, so values.semantic_search disabled renders no
  # semantic_search_sku. Microsoft documents that a service holding disabled
  # is treated as on the free plan, and that management API versions from
  # 2026-03-01-preview take no disabled. The provider refuses either plan on
  # the free tier when Terraform applies, so this Recipe refuses both there.
  #
  # Backup. Azure AI Search keeps no backup of its own: Microsoft's
  # reliability documentation for the service says it offers no self-service
  # backup and restore, since it is not a primary data store, and that an
  # index is rebuilt from its source data. So this Recipe declares no backup
  # it configures, and a core/backup attachment bound to
  # terraform/backup-native, the FeatureRecipe that leaves the backup to the
  # service, halts there, saying that the Recipe realizing the component
  # configures no backup of its service.
  #
  # Credentials. The module publishes the service whole, keys included, in
  # its resource output, which it declares sensitive; this Recipe keeps the
  # keys off and reads from that output the endpoint alone.
  assertions:
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release places its search service in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "sku_name" "replica_count" "partition_count" "public_network_access_enabled" "enable_telemetry" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, sku_name, replica_count, partition_count, public_network_access_enabled, enable_telemetry, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (kindIs "bool" $t) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and it is passed to the module as a boolean: set it to true to turn the module's telemetry on, or to false or remove it to keep it off" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" false -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the search service's public network access as a boolean: set it to true to turn it on, or to false or remove it to keep it off" $p) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "standard" -}}
      {{- if not (has $s (list "free" "basic" "standard" "standard2" "standard3" "storage_optimized_l1" "storage_optimized_l2")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and the module this Recipe deploys takes a service tier of free, basic, standard, standard2, standard3, storage_optimized_l1 or storage_optimized_l2: set infra.overrides.sku_name to one, or remove it for standard" $s) -}}
      {{- end -}}
      {{- $r := optional $o "replica_count" 1 -}}
      {{- if not (and (or (kindIs "int" $r) (kindIs "int64" $r) (and (kindIs "float64" $r) (eq (float64 (int $r)) $r))) (ge (int $r) 1) (le (int $r) 12)) -}}
      {{- fail (printf "infra.overrides.replica_count is %v, and a search service takes 1 to 12 replicas: set infra.overrides.replica_count to a whole number in that range, or remove it for 1" $r) -}}
      {{- end -}}
      {{- $n := optional $o "partition_count" 1 -}}
      {{- if not (and (or (kindIs "int" $n) (kindIs "int64" $n) (and (kindIs "float64" $n) (eq (float64 (int $n)) $n))) (has (int $n) (list 1 2 3 4 6 12))) -}}
      {{- fail (printf "infra.overrides.partition_count is %v, and a search service takes 1, 2, 3, 4, 6 or 12 partitions: set infra.overrides.partition_count to one of them, or remove it for 1" $n) -}}
      {{- end -}}
    # The service's limits by tier, read off Microsoft's documentation of the
    # service's limits and of creating a service, which the azurerm provider
    # also checks for the free and basic tiers when Terraform applies: the
    # free tier runs on shared infrastructure and takes no replicas or
    # partitions beyond its one; the basic tier takes up to 3 replicas and 3
    # partitions; the other tiers take up to 12 of each, and up to 36 search
    # units, a search unit being one replica of one partition. The provider
    # sets no semantic ranker plan on the free tier.
    tier_limits: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := .locals.sku -}}
      {{- $r := int (optional $o "replica_count" 1) -}}
      {{- $n := int (optional $o "partition_count" 1) -}}
      {{- if and (eq $s "free") (gt $r 1) -}}
      {{- fail (printf "infra.overrides.replica_count is %d, and infra.overrides.sku_name is free, a tier Azure AI Search runs on shared infrastructure with one replica, which no setting scales: remove infra.overrides.replica_count, or set infra.overrides.sku_name to basic or above" $r) -}}
      {{- end -}}
      {{- if and (eq $s "free") (gt $n 1) -}}
      {{- fail (printf "infra.overrides.partition_count is %d, and infra.overrides.sku_name is free, a tier Azure AI Search runs on shared infrastructure with one partition, which no setting scales: remove infra.overrides.partition_count, or set infra.overrides.sku_name to basic or above" $n) -}}
      {{- end -}}
      {{- if and (eq $s "basic") (gt $r 3) -}}
      {{- fail (printf "infra.overrides.replica_count is %d, and infra.overrides.sku_name is basic, a tier Azure AI Search gives up to 3 replicas: set infra.overrides.replica_count to 3 or fewer, or infra.overrides.sku_name to standard or above" $r) -}}
      {{- end -}}
      {{- if and (eq $s "basic") (gt $n 3) -}}
      {{- fail (printf "infra.overrides.partition_count is %d, and infra.overrides.sku_name is basic, a tier Azure AI Search gives up to 3 partitions: set infra.overrides.partition_count to 3 or fewer, or infra.overrides.sku_name to standard or above" $n) -}}
      {{- end -}}
      {{- if gt (mul $r $n) 36 -}}
      {{- fail (printf "infra.overrides.replica_count is %d and infra.overrides.partition_count is %d, %d search units, and Azure AI Search gives a service up to 36 search units, one for each replica of each partition: lower either count so that their product is 36 or less" $r $n (mul $r $n)) -}}
      {{- end -}}
      {{- if and (eq $s "free") (ne (toString .values.semantic_search) "disabled") -}}
      {{- fail (printf "values.semantic_search is %s, and infra.overrides.sku_name is free, a tier on which the azurerm provider this Recipe's module deploys with sets no semantic ranker plan, refusing one when Terraform applies: set values.semantic_search in the Aggregate to disabled, or infra.overrides.sku_name in the Release to basic or above" (toString .values.semantic_search)) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a consumer of this search service reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the service answers HTTPS on port 443, and endpoint is https:// followed by the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The service is named after the component, and its name is also the first
    # label of the address the service gives it under search.windows.net, so it
    # is unique across Azure; the rule Microsoft's documentation of creating a
    # service gives a service name, 2 to 60 lowercase letters, digits and
    # hyphens, no hyphen among the first two characters or last, and no two
    # hyphens together, is checked here, where the name is known.
    service_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[a-z0-9][a-z0-9]+(-[a-z0-9]+)*$` $n) (le (len $n) 60)) -}}
      {{- fail (printf "the component %q names its search service, and a service name holds 2 to 60 lowercase letters, digits and hyphens, with no hyphen among its first two characters or as its last, and no two hyphens together: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # service reports its endpoint as https://<service>.search.windows.net/ in
  # the public cloud, under its cloud's own domain elsewhere, and the azurerm
  # provider reads it into the search service's endpoint attribute. The module
  # publishes the service whole as its resource output, which it marks
  # sensitive, because the service it carries holds the admin keys, and the
  # endpoint alone is not: nonsensitive() takes the mark off the one
  # attribute, so a consumer's configuration carries it as the plain address
  # it is. host takes the DNS name between https:// and the path, splitting
  # the endpoint on the slash the module's resource_id output begins with, so
  # it holds whichever domain the service's cloud gives; endpoint is https://
  # followed by that name. Each reads this component's module call, which the
  # boundary's root configuration declares under .context.instance_id for a
  # component declared in the Aggregate the Release deploys. Terraform
  # resolves it at apply time, so it resolves only for a consumer authored as
  # a source: Recipe in the same root configuration; a consumer on another
  # target receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, and endpoint is built on it. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the service outside the Release. A client checking the
  # service's certificate needs a name the certificate carries, which is the
  # service's own name under search.windows.net or the private link name that
  # resolves to it. A consumer in the same root configuration receives the
  # name as well, and a name carries no reference for Terraform to order its
  # module after this one by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  #
  # port is 443, the one port the service serves, over HTTPS alone.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${split(substr(module.{{ .context.instance_id }}.resource_id, 0, 1), nonsensitive(module.{{ .context.instance_id }}.resource.endpoint))[2]}{{ end }}"
    port: "443"
    endpoint: "https://{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${split(substr(module.{{ .context.instance_id }}.resource_id, 0, 1), nonsensitive(module.{{ .context.instance_id }}.resource.endpoint))[2]}{{ end }}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # search service is named after the component, as the other managed Recipes
  # name theirs. semantic_search_sku is rendered only while
  # values.semantic_search is free or standard; for disabled it is left out,
  # and the provider sends disabled itself, as the comment above the
  # assertions says. local_authentication_enabled is always false.
  #
  # enable_telemetry is always rendered: false, unless
  # infra.overrides.enable_telemetry is true.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    resource_group_name: "{{ $o.resource_group_name }}"
    location: "{{ $o.location }}"
    sku: "{{ .locals.sku }}"
    replica_count: {{ int (optional $o "replica_count" 1) }}
    partition_count: {{ int (optional $o "partition_count" 1) }}
    {{- if ne (toString .values.semantic_search) "disabled" }}
    semantic_search_sku: "{{ .values.semantic_search }}"
    {{- end }}
    local_authentication_enabled: false
    public_network_access_enabled: {{ if optional $o "public_network_access_enabled" false }}true{{ else }}false{{ end }}
    {{- $t := optional $o "enable_telemetry" false }}
    enable_telemetry: {{ and (kindIs "bool" $t) $t }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes: another component bound to this Recipe, or
  # one whose Recipe configures azurerm the same way under the same name. The
  # same name with other bytes halts the build. The azurerm provider refuses
  # to plan without its features block, and a vendored module carries no
  # provider block of its own, so the module inherits this configuration; the
  # provider reads its credentials and subscription from the environment
  # Terraform runs in. Terraform destroys the module's resources with it, so
  # the file stays while any component declaring it does: remove the last of
  # them from a Release only after destroying what their modules created,
  # because with the provider file gone Terraform refuses to plan, asking for
  # a provider block with the features argument. The azapi provider the
  # module also declares is left to its default configuration, since no
  # provider block names it.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
