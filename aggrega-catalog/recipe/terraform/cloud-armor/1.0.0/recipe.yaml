apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloud-armor
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Google Cloud Armor, rendered as an authored Terraform body, main.tf: one
    google_compute_security_policy named after the component, in the
    operator's project, holding a rule for each of the component's rules.
    The policy is a backend policy, or an edge policy where type says so;
    it is attached to nothing this Recipe creates, as a backend service or
    backend bucket names it. security_policy is the policy's self link, an
    output of this component's module.

    The body is the catalog's own: the published cloud-armor module
    10.0.0 fails a test the catalog holds Google bodies to, keeping to the
    Terraform 1.5 language. Its variable validations need the short-circuit
    || of Terraform 1.12, so Terraform 1.5.7 rejects its defaults.

    A project_id missing, a type other than CLOUD_ARMOR or CLOUD_ARMOR_EDGE,
    a rule description over 64 characters and any infra.overrides key not
    listed halt the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/security/cloud-armor:1.0.0

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this policy, and resolves
  # none of it. It is a reference to an output of this component's module
  # call: the body renders into the component's own module directory, and
  # the boundary's root configuration declares that directory as a module
  # block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The reference resolves only for a
  # consumer authored as a source: Recipe in the same Terraform root
  # configuration, which Terraform then applies after this module; a
  # consumer on another target receives it as text.
  #
  # security_policy is the policy's self_link, the URI Compute Engine gives
  # the resource, which google_compute_backend_service takes as
  # security_policy, and a backend service or backend bucket as
  # edge_security_policy for an edge policy.
  provides:
    security_policy: "${module.{{ .context.instance_id }}.security_policy}"

  # This Recipe reads from infra.overrides:
  #   project_id - string, required (project)
  #   type       - string (type)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread. region and location halt as any
  # key not listed does: a policy of either type is global.
  #
  # project_id is the name every terraform Google Recipe of this catalog
  # reads for the project a resource is created in; type is the provider's
  # argument.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates, with the Compute Engine API enabled. It is a string with
  # no value this Recipe could choose for the operator, so it halts the
  # build when it is missing.
  #
  # type is CLOUD_ARMOR, a backend policy, which filters requests before
  # they reach a backend service, or CLOUD_ARMOR_EDGE, an edge policy, which
  # filters them before Google's cache serves them and is the one a backend
  # bucket takes; unset, the body writes CLOUD_ARMOR. An edge policy filters
  # on origin.asn, origin.ip, origin.region_code and the request's headers,
  # method, path, query and scheme alone (Cloud Armor's "Security policy
  # overview"); Cloud Armor checks a rule's expression against its policy's
  # type when the policy is applied.
  # CLOUD_ARMOR_NETWORK, a policy filtering packets for network load
  # balancing, is regional, and the google provider's 8.11.0 schema refuses
  # it on this resource; CLOUD_ARMOR_INTERNAL_SERVICE, which the provider
  # admits, is marked preview only and is absent from the type values of
  # the Compute Engine API's v1 reference, the API version the provider
  # calls, and it attaches to a Cloud Service Mesh endpoint policy rather
  # than a backend service. Either halts, as any other value does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.rules, each entry as one rule block: action,
  #     priority, match, as a match block holding versioned_expr with a
  #     config block holding src_ip_ranges, or an expr block holding
  #     expression, description while set, and preview, false while unset;
  #     and the overrides above.
  #   refused — project_id missing or not a string; a type other than
  #     CLOUD_ARMOR or CLOUD_ARMOR_EDGE; a rule's description over 64
  #     characters, which the google provider's schema gives as a rule
  #     description's maximum size; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the component's name, which names the policy;
  #     the keys of a rule and of its match, the actions, the priorities'
  #     range and uniqueness, the source ranges' count and form, how a match
  #     is formed, and the default rule a list of rules includes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: no policy description, labels,
  # advanced options, adaptive protection or reCAPTCHA options, and no rate
  # limit, redirect, header action or WAF exclusion on a rule. The provider
  # keeps what the policy holds for the blocks it computes and the body
  # leaves out. With no rules, the body writes no rule block, and Compute
  # Engine adds its default rule, allowing every request, when it creates
  # the policy; the provider reads that rule back as the policy's, so it
  # is kept at every later apply. A list of rules is written whole: a rule
  # added outside the Release, at a priority no rule of the component holds,
  # is removed at the next apply.
  #
  # Changes. A changed rule is patched in place at its priority, a rule
  # added is added, and a rule removed is removed; the default rule is
  # patched, never removed. The policy's name, project and type are fixed
  # when Compute Engine creates it, and the provider replaces the policy
  # when one changes: renaming the component, changing project_id or type,
  # after which consumers read a new self link.
  #
  # Deletion. A destroy, or removing the component, deletes the policy:
  # the body leaves the provider's deletion_policy at its default, DELETE.
  # A policy holds no data, so this Recipe configures no backup and declares
  # no native backup.
  #
  # Credentials. A policy holds none, and Terraform authenticates with the
  # credentials in the environment it runs in, so the rendered configuration
  # names none.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "type" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id and type from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "project_id" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail "this Release creates its Cloud Armor policy in the operator's own Google Cloud project, which this Recipe does not choose, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release" -}}
      {{- end -}}
    type_offered: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "type" -}}
      {{- if not (has $o.type (list "CLOUD_ARMOR" "CLOUD_ARMOR_EDGE")) -}}
      {{- fail (printf "infra.overrides.type is %s, and this Recipe creates a global policy of type CLOUD_ARMOR, a backend policy, or CLOUD_ARMOR_EDGE, an edge policy: set it to one of them in the Release, or remove it for CLOUD_ARMOR" (toJson $o.type)) -}}
      {{- end -}}
      {{- end -}}
    # The google provider's schema gives a rule's description a maximum size
    # of 64 characters.
    rule_description: >-
      {{- range $i, $r := (default list (optional .values "rules" list)) -}}
      {{- if hasKey $r "description" -}}
      {{- if gt (len (toString $r.description)) 64 -}}
      {{- fail (printf "values.rules[%d].description is %d characters long, and the google provider takes a rule description of at most 64: shorten it in the Aggregate" $i (len (toString $r.description))) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary. The resource is named this, since each
  # component's body renders into a module directory of its own. Each rule
  # is written in the Aggregate's order; the provider holds the rules as a
  # set keyed by priority, so the order changes nothing it applies. Each
  # string the Aggregate or the Release gives reaches Compute Engine as
  # written: Terraform would read ${ and %{ inside a string as the start of
  # an interpolation or a directive, so they are written $${ and %%{, which
  # Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_compute_security_policy" "this" {
        name = "{{ .context.instance_id }}"
        type = {{ toJson (optional $o "type" "CLOUD_ARMOR") }}
        {{- range $r := (default list (optional .values "rules" list)) }}
        {{- $m := $r.match }}

        rule {
          action   = {{ toJson $r.action }}
          priority = {{ toJson $r.priority }}

          match {
            {{- if hasKey $m "expr" }}
            expr {
              expression = {{ toJson $m.expr.expression | replace "${" "$${" | replace "%{" "%%{" }}
            }
            {{- else }}
            versioned_expr = {{ toJson $m.versioned_expr }}

            config {
              src_ip_ranges = {{ toJson $m.config.src_ip_ranges | replace "${" "$${" | replace "%{" "%%{" }}
            }
            {{- end }}
          }
          {{- if hasKey $r "description" }}

          description = {{ toJson $r.description | replace "${" "$${" | replace "%{" "%%{" }}
          {{- end }}
          preview     = {{ if eq (toJson (optional $r "preview" false)) "true" }}true{{ else }}false{{ end }}
        }
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
      }

      output "security_policy" {
        value = google_compute_security_policy.this.self_link
      }
