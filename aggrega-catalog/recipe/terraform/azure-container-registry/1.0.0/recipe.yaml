apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-container-registry
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # container registry module: the third-party code this Recipe pins and
  # writes into the output. The registry it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Azure Container Registry: one registry, realized by Microsoft's Azure
    Verified Modules module Azure/avm-res-containerregistry-registry/azurerm
    at v0.9.0, MIT, its tag's commit pinned in entity.lock.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-container-registry where it deploys an Azure Resource Manager
    template. The module admits hashicorp/azurerm 4 alone, so this Recipe
    goes in a boundary apart from the Azure Recipes that need azurerm 5.
    infra.overrides names the operator's resource group and region. The
    registry runs on the Standard tier unless infra.overrides.sku_name names
    Basic or Premium. Public network access is on unless
    infra.overrides.public_network_access_enabled is false, which the
    service takes on Premium alone. The admin account is off, Microsoft
    Entra tokens issued for Azure Resource Manager are accepted, AcrPull
    and AcrPush assignments are honoured at the registry's scope, and
    untagged manifests are kept. Module telemetry is off unless
    infra.overrides.enable_telemetry is true. Microsoft documents the
    API's reported zone redundancy value as about to change; when it does,
    Terraform plans to replace the registry and its content, and a plan
    proposing that replacement must not be applied.

    host is a reference to the login server the service reports. A registry
    name the service refuses halts naming the component; a key the service
    or the module cannot take halts naming it, as does infra.overrides.host.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/devtool/azure-container-registry:1.0.0

  # The published module, at the tag the registry publishes as version 0.9.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root. The root calls the repository's
  # own credential-set, cache-rule and scope-map modules by relative path,
  # each once per entry of an input this Recipe leaves empty, and no module
  # from a registry, so initialising it fetches providers and nothing else.
  # The repository's examples/ and tests/ directories are vendored with it
  # and never loaded.
  #
  # The module declares hashicorp/azurerm ">= 4.81.0, < 5.0.0" and
  # Azure/azapi "~> 2.12" in its own required_providers, and Terraform
  # ">= 1.8". It creates the registry as the azurerm provider's
  # azurerm_container_registry resource. It is vendored byte for byte, so
  # this Recipe adds no provider constraint of its own. "< 5.0.0" admits no
  # azurerm 5 release, so a Release places this registry in a terraform
  # boundary whose bodies install azurerm 4.
  source:
    kind: git-repository
    url: https://github.com/Azure/terraform-azurerm-avm-res-containerregistry-registry.git
    ref: v0.9.0

  locals:
    # The tier, infra.overrides.sku_name or Standard. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name           - string (resource_group_name), required
  #   location                      - string (location), required
  #   sku_name                      - string (sku: Basic, Standard or Premium; default Standard)
  #   public_network_access_enabled - bool (public_network_access_enabled; default true)
  #   enable_telemetry              - bool (enable_telemetry; false unless set to true here,
  #                                   where the module's own default is true)
  #   tags                          - map[string]string (tags)
  # host halts by name, as any key not listed does: the registry answers at
  # the login server the service gives it, as the comment over `provides`
  # below says.
  #
  # Each is named by the module input it sets, given in brackets, save
  # sku_name, which every Azure Recipe reads for the tier a service is
  # provisioned at. arm/azure-container-registry reads each of them but
  # resource_group_name under the same spelling, and refuses
  # enable_telemetry true: its template deploys into the group it is
  # deployed to, and every arm Recipe wrapping a Verified Module turns the
  # module's telemetry off. resource_group_name and location are required:
  # they place the registry in the operator's subscription, and this Recipe
  # never chooses either. Azure's naming rules take a resource group name of
  # 1 to 90 letters, digits, underscores, hyphens, periods and parentheses,
  # not ending in a period, which the azurerm provider checks when it plans
  # and which is checked below.
  #
  # sku_name. Microsoft's page on the registry's tiers describes Basic as a
  # cost-optimized entry point for developers, Standard as satisfying the
  # needs of many production scenarios, with more included storage and
  # image throughput, and Premium as adding geo-replication, private link
  # with private endpoints, IP network rules and higher limits; every tier
  # serves the same data plane, and Microsoft's reliability guidance
  # recommends Premium for production workloads. Unset, the registry runs on
  # Standard, where the module's own default is Premium. The module takes
  # the tier spelt Basic, Standard or Premium, and any other value halts
  # below by name. Microsoft documents that a registry moves between tiers
  # without downtime once its content fits the new tier's storage limit, and
  # that features Premium alone offers are turned off on leaving it.
  #
  # public_network_access_enabled. Unset or true, the registry takes
  # requests at its public endpoint; false, it takes them through private
  # endpoints alone. Microsoft offers private endpoints on Premium alone,
  # and the azurerm provider's registry resource refuses public access
  # disabled on another tier, so false halts below unless sku_name is
  # Premium. The private endpoint and the private DNS zone
  # privatelink.azurecr.io are the operator's, created for the registry
  # outside the Release, and with them the login server resolves to a
  # private address.
  #
  # The network rule set. The module writes one only from its
  # network_rule_set input, which this Recipe leaves unset, and the azurerm
  # provider keeps whatever rule set the registry has while the
  # configuration names none. So a Premium registry keeps the service's
  # own, under which Microsoft documents that a registry accepts connections
  # from any network, and IP rules the operator makes outside the
  # configuration stay as they are; Basic and Standard offer none. Trusted
  # Microsoft services bypass network restrictions: this Recipe passes
  # network_rule_bypass_option AzureServices, the azurerm provider's own
  # default, where the module's is None. ACR Tasks do not
  # (network_rule_bypass_for_tasks_enabled false, the module's default).
  #
  # The module deploys a telemetry resource while its enable_telemetry input
  # is true, its default: it reports the module and its version to
  # Microsoft. This Recipe passes false unless the Release sets
  # infra.overrides.enable_telemetry to true.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: Microsoft Entra tokens issued for Azure
  # Resource Manager accepted as well as tokens issued for the registry
  # (azuread_authentication_as_arm_policy_enabled true), the service's own
  # default, since Microsoft documents that App Service web apps pull images
  # with the former and fail without it; LegacyRegistryPermissions as the
  # role assignment mode, under which AcrPull and AcrPush assigned at the
  # registry's scope authorize pulls and pushes (Microsoft marks disabling
  # ARM-audience tokens as recommended and ships built-in Azure Policies
  # that deny or modify both settings; the module writes the values it
  # holds on every apply, so an apply reverts a policy remediation made
  # outside it and fails under a Deny policy); export allowed, the
  # service's own default; anonymous pull off; no dedicated data endpoint;
  # on Premium, the quarantine and content trust policies off; no managed
  # identity, customer-managed key, geo-replication, scope map, token, cache
  # rule, credential set, private endpoint, role assignment, diagnostic
  # setting or lock.
  #
  # These are replaced: sku, whose default is Premium, by sku_name,
  # Standard unless set; admin_enabled is passed false, its default, so the
  # registry's admin account, a user name and two passwords the service
  # generates, stays off; network_rule_bypass_option, as above;
  # retention_policy_in_days, whose default enables a policy on Premium
  # deleting untagged manifests after 7 days, by null, which the module
  # takes as no policy, the service's own default, so no manifest is deleted
  # that a client did not delete; and zone_redundancy_enabled, which the
  # module passes on Premium alone and whose default there is true, by
  # false. Microsoft documents that every registry in a region with
  # availability zones is zone-redundant, on every tier, whatever the
  # registry's zone redundancy property says, and that setting it Disabled
  # has no effect there; and the azurerm provider replaces a registry, with
  # its content, when zone_redundancy_enabled changes, which the module's
  # default would do whenever the registry moved to or from Premium.
  # Writing false does not make the registry stable: Microsoft documents
  # that the property might still show as false and that the portal and API
  # surfaces are being updated to reflect the default behaviour. When the
  # API reports Enabled, the azurerm provider reads true, sees a difference
  # against false and, the attribute being replaced on change, plans to
  # replace the registry and its content, on every tier. A plan proposing
  # that replacement must not be applied. Basic and Standard have no way
  # out: the module passes false off Premium and refuses true there, an
  # upstream gap this Recipe does not work around.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's inputs:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — a registry name the service refuses; a resource group name
  #     Azure refuses; infra.overrides.host; sku_name given as anything but
  #     Basic, Standard or Premium; public_network_access_enabled as
  #     anything but a boolean, or false on a tier other than Premium;
  #     enable_telemetry as anything but a boolean; tags as anything but a
  #     map of strings; resource_group_name and location left out or given
  #     as anything but a string; and any infra.overrides key not listed
  #     above.
  #   not read — none.
  #
  # Credentials. The registry publishes none, and nothing here creates or
  # delivers one: a client authenticates as a Microsoft Entra ID identity,
  # the operator's, authorized by the role assignments the operator makes
  # on the registry, such as AcrPull to pull and AcrPush to push. The admin
  # account stays off; the module's admin_username and admin_password
  # outputs, which the module marks sensitive, are empty while it is off,
  # and this Recipe reads neither. Backup. Microsoft documents that
  # geo-replication creates no independent recovery point, and recommends
  # copying critical images and artifacts to another registry or to external
  # storage, which is the operator's, outside the Release; this Recipe
  # configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out; a resource group name
    # is held to Azure's naming rules.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the registry is created in, by its name, such as example-rg" "location" "the one Azure region the registry is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its container registry in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `^[\p{L}\p{Nd}_.()-]{0,89}[\p{L}\p{Nd}_()-]$` $o.resource_group_name) -}}
      {{- fail (printf "infra.overrides.resource_group_name is %q, and Azure takes a resource group name of 1 to 90 letters, digits, underscores, hyphens, periods and parentheses, not ending in a period: set it to the name of the operator's resource group" $o.resource_group_name) -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "sku_name" "public_network_access_enabled" "enable_telemetry" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Azure Container Registry serves a registry at the login server it gives it, under a certificate for that name, which a private endpoint resolves to a private address under the same name; a custom domain is a private preview Microsoft admits a Premium registry to, outside any configuration: remove infra.overrides.host from the Release, and read the host the registry publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, sku_name, public_network_access_enabled, enable_telemetry and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (kindIs "bool" $t) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and it is passed to the module as a boolean: set it to true to turn the module's telemetry on, or to false or remove it to keep it off" $t) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "Standard" -}}
      {{- if not (has $s (list "Basic" "Standard" "Premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Microsoft offers a container registry on the tiers Basic, Standard and Premium, spelt so, which the module takes alone: set infra.overrides.sku_name to one of them, or remove it for Standard" $s) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the registry's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}
    # Microsoft offers private endpoints on Premium alone, and the azurerm
    # provider's registry resource refuses public access disabled on another
    # tier (internal/services/containers/container_registry_resource.go,
    # v4.81.0).
    public_network_access: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (eq (toString (optional $o "public_network_access_enabled" true)) "false") (ne .locals.sku "Premium") -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is false, and a registry takes requests through private endpoints alone on the Premium tier, which Microsoft offers private endpoints on, while this registry runs on %s: set infra.overrides.sku_name to Premium in the Release, or remove public_network_access_enabled" .locals.sku) -}}
      {{- end -}}
    # The registry is named after the component, and its name is also the
    # first label of its login server, so it is unique across Azure.
    # Microsoft's documentation of Azure resource names gives a container
    # registry 5 to 50 letters and digits, which the module's own validation
    # of its name input holds too; it is checked here, where the name is
    # known.
    registry_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9]{5,50}$` $n) -}}
      {{- fail (printf "the component %q names its container registry, and Azure takes a registry name of 5 to 50 letters and digits, with no hyphen: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret this string. A consumer
  # receives it as written. The service gives the registry its login server
  # when it creates it, <registry>.azurecr.io in lower case in Azure's public
  # cloud, under its cloud's own domain elsewhere; the azurerm provider
  # reads it into the registry's login_server attribute, which the module
  # publishes as its login_server output, a host name with no scheme. host
  # refers to that output; Terraform resolves the reference when it applies
  # the configuration, after the registry exists, so a consumer in the same
  # boundary receives the name itself.
  #
  # No infra.overrides.host: the registry answers at its login server, under
  # a certificate the service issues for that name, and a private endpoint
  # resolves the same name to a private address through the operator's
  # private DNS zone. A custom domain is a private preview: Microsoft admits
  # a Premium registry to it outside any configuration, and the registry then
  # serves the domain with a certificate the operator keeps in Azure Key
  # Vault.
  provides:
    host: "${module.{{ .context.instance_id }}.login_server}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # registry is named after the component, as the other managed Recipes name
  # theirs.
  #
  # enable_telemetry is always rendered: false, unless
  # infra.overrides.enable_telemetry is true.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name }}
    location: {{ toJson $o.location }}
    sku: "{{ .locals.sku }}"
    admin_enabled: false
    public_network_access_enabled: {{ if eq (toString (optional $o "public_network_access_enabled" true)) "false" }}false{{ else }}true{{ end }}
    network_rule_bypass_option: "AzureServices"
    retention_policy_in_days: null
    zone_redundancy_enabled: false
    {{- $t := optional $o "enable_telemetry" false }}
    enable_telemetry: {{ and (kindIs "bool" $t) $t }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes: another component bound to this Recipe, or
  # one whose Recipe configures azurerm the same way under the same name. The
  # same name with other bytes halts the build. The azurerm provider refuses
  # to plan without its features block, and a vendored module carries no
  # provider block of its own, so the module inherits this configuration; the
  # provider reads its credentials and subscription from the environment
  # Terraform runs in. Terraform destroys the module's resources with it, so
  # the file stays while any component declaring it does: remove the last of
  # them from a Release only after destroying what their modules created,
  # because with the provider file gone Terraform refuses to plan, asking for
  # a provider block with the features argument. The azapi provider, which
  # the module declares for its telemetry and for the modules it calls, is
  # left to its default configuration, since no provider block names it; it
  # reads the same environment.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
