apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres-rds
  version: 1.0.0
  description: >
    PostgreSQL via AWS RDS, rendered as an authored Terraform body, main.tf.
    The managed-service realization: RDS operates the instance, so the operator's
    ha and backup sizing map onto the instance's native multi-AZ, read-replica,
    and backup-window settings, and RDS owns the master password.

    host publishes a Terraform reference to the instance's hostname, an output
    of this component's module, and port publishes the port infra.port
    configures. The reference resolves only for a consumer authored as a
    source: Recipe in the same Terraform root configuration; a consumer on
    another target receives it as text. It names this component's module, so
    it resolves only where the Aggregate the Release deploys declares this
    component, not where it is composed in from another Aggregate.

    Set infra.overrides.host in the Release to the DNS name or IP literal the
    instance is reached at, and host publishes that name instead, which a
    consumer on any target can use. The Recipe emits nothing for it — no DNS
    record, no alias — so pointing the name at the instance is the operator's.
    A consumer in the same root configuration then receives the name too, and
    Terraform no longer orders it after the instance: order the two with the
    boundaries' syncWave.

    Reach for this realization where nothing may be fetched or where the
    instance needs read replicas; reach for
    terraform/postgres-rds-terraform-aws-modules, the terraform-aws-modules
    project's published RDS module, where the pull may fetch it from its git
    repository. A value RDS cannot apply — an encoding, a locale, init
    scripts, a raw configuration file — halts the build naming the key;
    compute.cpu and compute.memory are not read.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/postgres:1.0.0

  locals:
    db_identifier: "{{ .context.instance_id }}"
    # The name the Release gives the instance under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # The String Pipe (Invariant 3): the compiler does not know host is a
  # Terraform reference. It pipes the string; Terraform resolves it at
  # `terraform apply` time. user/database mirror the developer values so a
  # consumer reads the same connection identity the synth realization exports.
  #
  # host names the address output the body below declares, through this
  # component's module call: the body renders into the component's own module
  # directory, and the boundary's root configuration declares that directory as
  # a module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. A reference to the resource itself would
  # name nothing the root declares. The output is the instance's address
  # attribute, its bare hostname; the provider's endpoint attribute is
  # address:port.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record or alias for it, so the operator points the name at the instance
  # outside the Release. A consumer in the same root configuration receives
  # the name as well, and a name carries no reference for Terraform to order
  # its module after this one by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  #
  # port is the value the body sets on the instance, so it is known ahead of
  # time and published as that value: a consumer on any target can use it.
  #
  # The metrics keys are published empty: the instance is a managed service with
  # no pods to discover, and RDS publishes its metrics to the cloud provider's
  # own monitoring rather than to a Prometheus endpoint.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.address}{{ end }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""

  # This Recipe reads from infra.overrides:
  #   instance_class      - string (instance_class; default "db.t3.small")
  #   multi_az            - bool (multi_az; defaults to infra.ha.enabled)
  #   subnet_group        - string (db_subnet_group_name)
  #   parameter_group     - string (parameter_group_name)
  #   vpc_security_groups - []string (vpc_security_group_ids)
  #   kms_key_id          - string (kms_key_id; also sets storage_encrypted true)
  #   deletion_protection - bool (deletion_protection)
  #   tags                - map[string]string (tags)
  #   host                - string (published as provides.host; renders nothing)
  #
  # The key names are the Terraform argument names rather than a separate Aggrega
  # spelling, because each is passed through to the resource unchanged and the
  # argument name is what a reader matches against provider documentation.
  # instance_class and multi_az have defaults; the remaining keys emit nothing
  # when unset. host is the exception to the naming: it is no argument of the
  # resource but the address a consumer reaches the database at, under the name
  # the catalog's referenced realization, helm/postgres-external, reads for the
  # same address.
  #
  # host is a bare DNS name or IP literal. The assertion below refuses a value
  # carrying a scheme, a path, a user, a port or whitespace, because a consumer
  # composes its connection from host and port and would compose a broken one;
  # the port is infra.port. A value carrying exactly one colon is a name or an
  # IPv4 literal with a port; an IPv6 literal carries several and is accepted.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.database, values.user, infra.port,
  #     infra.engine_version, infra.storage.size, infra.storage.type (gp3
  #     when unset), infra.ha.enabled, infra.ha.read_replicas,
  #     infra.backup.enabled (no automated backups and no final snapshot when
  #     false), infra.backup.retention_days, and the overrides above.
  #   refused — values.encoding, values.locale, values.init_scripts and
  #     values.custom_config: RDS creates the database itself and runs no
  #     initdb, no initialisation scripts and no configuration file of the
  #     reader's; its server settings come from the instance's parameter group.
  #   not read — infra.compute.cpu and infra.compute.memory, whose Component
  #     defaults would size a container: RDS sizes the instance by
  #     infra.overrides.instance_class, and a Recipe cannot tell those defaults
  #     from a value the Release wrote, so the Component's description says so
  #     instead. values.app_user, infra.control_plane_present,
  #     infra.credentials and infra.credentials_secret configure other
  #     realizations, as their descriptions say.
  assertions:
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    values_rds_cannot_apply: >-
      {{- if optional .values "encoding" "" -}}
      {{- fail "values.encoding asks for the encoding initdb creates the database with, and an RDS instance takes no such setting when it is created: remove values.encoding from the Aggregate, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "locale" "" -}}
      {{- fail "values.locale asks for the locale initdb creates the database with, and an RDS instance takes no such setting when it is created: remove values.locale from the Aggregate, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and an RDS instance runs none: remove values.init_scripts from the Aggregate and run them against the instance once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and an RDS instance reads none: its server settings come from a DB parameter group, which the Release names in infra.overrides.parameter_group; remove values.custom_config from the Aggregate" -}}
      {{- end -}}

  # infra.storage.type is the RDS storage type here, not a storage class. The
  # Component declares no default for it, because on Kubernetes an unset class
  # leaves the volume to the cluster's default storage class; this Recipe
  # supplies its own instead, so a Release that names none provisions gp3.
  #
  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is a full-body artifact named main.tf that emits verbatim as a
  # standalone file alongside any other artifacts contributed at the same
  # boundary.
  artifacts:
    main.tf: |
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_db_instance" "{{ .locals.db_identifier }}" {
        identifier     = "{{ .locals.db_identifier }}"
        engine         = "postgres"
        engine_version = "{{ .infra.engine_version }}"
        port           = {{ .infra.port }}

        ## ── Compute ──────────────────────────────────────────────
        {{- if .infra.overrides }}
        {{- if .infra.overrides.instance_class }}
        instance_class = "{{ .infra.overrides.instance_class }}"
        {{- else }}
        instance_class = "db.t3.small"
        {{- end }}
        {{- else }}
        instance_class = "db.t3.small"
        {{- end }}

        ## ── Storage ──────────────────────────────────────────────
        allocated_storage = {{ trimSuffix "Gi" .infra.storage.size }}
        storage_type      = "{{ .infra.storage.type | default "gp3" }}"

        ## ── Database ─────────────────────────────────────────────
        db_name  = "{{ .values.database }}"
        username = "{{ .values.user }}"

        ## Black-Box: RDS manages the password via Secrets Manager.
        manage_master_user_password = true

        ## ── HA ───────────────────────────────────────────────────
        {{- if .infra.overrides }}
        multi_az = {{ .infra.overrides.multi_az | default .infra.ha.enabled }}
        {{- else }}
        multi_az = {{ .infra.ha.enabled }}
        {{- end }}

        ## ── Backup ───────────────────────────────────────────────
        backup_retention_period = {{ if .infra.backup.enabled }}{{ .infra.backup.retention_days }}{{ else }}0{{ end }}
        {{- if not .infra.backup.enabled }}
        skip_final_snapshot     = true
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        {{- if .infra.overrides }}
        {{- if .infra.overrides.subnet_group }}
        db_subnet_group_name = "{{ .infra.overrides.subnet_group }}"
        {{- end }}
        {{- if .infra.overrides.parameter_group }}
        parameter_group_name = "{{ .infra.overrides.parameter_group }}"
        {{- end }}
        {{- if .infra.overrides.vpc_security_groups }}
        vpc_security_group_ids = {{ toJson .infra.overrides.vpc_security_groups }}
        {{- end }}
        {{- if .infra.overrides.kms_key_id }}
        storage_encrypted = true
        kms_key_id        = "{{ .infra.overrides.kms_key_id }}"
        {{- end }}
        {{- if .infra.overrides.deletion_protection }}
        deletion_protection = {{ .infra.overrides.deletion_protection }}
        {{- end }}
        {{- if .infra.overrides.tags }}
        tags = {{ toJson .infra.overrides.tags }}
        {{- end }}
        {{- end }}
      }

      output "address" {
        value = aws_db_instance.{{ .locals.db_identifier }}.address
      }

      {{- if gt (int .infra.ha.read_replicas) 0 }}
      {{- range $i := until (int .infra.ha.read_replicas) }}
      resource "aws_db_instance" "{{ $.locals.db_identifier }}_replica_{{ $i }}" {
        identifier          = "{{ $.locals.db_identifier }}-replica-{{ $i }}"
        replicate_source_db = aws_db_instance.{{ $.locals.db_identifier }}.identifier
        instance_class      = aws_db_instance.{{ $.locals.db_identifier }}.instance_class
      }
      {{- end }}
      {{- end }}
