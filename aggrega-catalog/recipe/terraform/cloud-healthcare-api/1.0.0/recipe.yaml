apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloud-healthcare-api
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    The Cloud Healthcare API, rendered as an authored Terraform body,
    main.tf: one google_healthcare_dataset of the instance's name, in the
    operator's project at infra.overrides.location, and a
    google_healthcare_fhir_store, google_healthcare_dicom_store or
    google_healthcare_hl7_v2_store for each store the values name. host
    and port publish the Healthcare API's endpoint, and endpoint an output
    of this component's module, the dataset's URL, which Terraform resolves
    when it applies.

    The project and the KMS key are the operator's: none is created, nor
    any IAM binding. Deletion is prevented unless
    infra.overrides.deletion_protection is false: while it holds, a
    destroy, a store's removal from the values, or a change that replaces
    the dataset or a store fails at apply. Set it false to allow one; the
    data the dataset and its stores hold is then deleted, and so is a
    store's when its FHIR version, or the dataset's location or
    kms_key_name, changes.

    A project_id or location missing, a kms_key_name or a
    deletion_protection of another form, a FHIR release the google provider
    does not create a store of, an instance name longer than a dataset's
    name may be,
    infra.overrides.host, since the API answers under the service's name
    alone, and any infra.overrides key not listed halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/cloud-healthcare-api:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this dataset, and resolves
  # none of them.
  #
  # host is the name of the Healthcare API's service endpoint,
  # healthcare.googleapis.com (the REST reference). Every dataset answers
  # there, so the name is known when the Release is built and published as
  # text, with port 443. The endpoint offers no custom domain, so every name
  # it answers under is one of the service's own and none is the operator's
  # choice; infra.overrides.host is refused by the assertion below rather
  # than published.
  #
  # endpoint is a reference to the endpoint output of this component's
  # module call, https://healthcare.googleapis.com/v1/ joined to the
  # dataset's id, projects/<project>/locations/<location>/datasets/<name>,
  # the path the provider composes from the dataset's arguments; its
  # self_link, the name the service returns, carries the same path. The body
  # renders into the component's own module directory, and the boundary's
  # root configuration declares that directory as a module block named
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The reference resolves only for a consumer authored as
  # a source: Recipe in the same Terraform root configuration, which
  # Terraform then applies after this module, once the dataset and its
  # stores exist; a consumer on another target receives it as text.
  provides:
    host: healthcare.googleapis.com
    port: "443"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"

  # This Recipe reads from infra.overrides:
  #   project_id   - string, required (project, on the dataset)
  #   location     - string, required (location, on the dataset)
  #   kms_key_name - string (encryption_spec.kms_key_name, on the dataset)
  #   deletion_protection - bool (deletion_policy, dataset and stores; default true)
  # host halts by name, as any key not listed does.
  #
  # project_id, deletion_protection and kms_key_name are the names the
  # catalog's terraform Google Recipes read for the project a resource is
  # created in, whether a destroy of it is refused and the customer-managed
  # key it is encrypted with; location is the provider's
  # word for where a service takes a region or a multi-region.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Cloud Healthcare API is enabled. location
  # is where the Healthcare API keeps the dataset and every store in it, a
  # region such as europe-west4 or the multi-region us or eu (the
  # Healthcare API's regions page); the service refuses one it does not
  # offer when it creates the dataset. Each is a string and neither has a
  # value this Recipe could choose for the operator, so each halts the build
  # when it is missing.
  #
  # kms_key_name names the operator's Cloud KMS key the dataset and its
  # stores are encrypted with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's encryption_spec takes; the key is in the
  # dataset's location (the provider's description of the key), and the
  # Healthcare service agent may use it, both of which the service checks
  # when it creates the dataset. Unset, the service encrypts the dataset
  # with a key Google manages. A value of another form halts.
  #
  # deletion_protection is true or false, true when unset: the body writes
  # deletion_policy "PREVENT" on the dataset and on every store when it is
  # true, and "DELETE" when it is false. The provider's description of the
  # argument, on each of the four resource types: "the command will fail if
  # this field is set to "PREVENT" in Terraform state", and "When set to
  # "DELETE", deleting the resource is allowed". So while it is true a
  # destroy, a store's removal from the values, or a change that replaces
  # the dataset or a store fails at apply. The state records the policy of
  # the last apply, so a Release sets it false and applies before it makes
  # the change. Any other value halts.
  #
  # host is refused by name: the Healthcare API answers at a Google API
  # endpoint, which offers no custom domain, so no name of the operator's
  # can stand for it.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.fhir_stores, a google_healthcare_fhir_store of each
  #     name at its version; values.dicom_stores, a
  #     google_healthcare_dicom_store of each name; values.hl7_v2_stores, a
  #     google_healthcare_hl7_v2_store of each name; and the overrides above.
  #   refused — project_id or location missing or not a string; a
  #     kms_key_name or a deletion_protection of another form; a FHIR store
  #     of version R5, which the Healthcare API serves and the google
  #     provider's version argument does not take (it takes DSTU2, STU3 and
  #     R4); an instance name longer
  #     than the 256 characters a dataset's name takes; infra.overrides.host;
  #     and any infra.overrides key not listed above.
  #   held by the Component — each store's name, to the Healthcare API's
  #     rule, and each list naming a store once.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: the instance's name as the dataset's,
  # within the characters the Healthcare API takes for one; no time_zone,
  # so the dataset reads a time without a zone as UTC, the service's
  # default; each store with the service's own settings, so a FHIR store
  # keeps referential integrity and the history of each resource, and
  # assigns the ID of a resource it creates; no labels, notification,
  # streaming, validation or parser settings; and each resource's
  # deletion_policy set from deletion_protection, as above, so with it false
  # a destroy, or removing a store from the values, deletes the resource with
  # its data. The provider replaces the dataset when project_id, location or
  # kms_key_name changes, and a FHIR store when its version changes:
  # Terraform deletes it, with its data, and creates a new, empty one. The
  # dataset's name is the instance's, which Healthcare API holds unique
  # within a project and location, so two Releases deploying the same
  # instance name of one Aggregate into one project and location collide
  # when the second applies.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "kms_key_name" "deletion_protection" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and the Cloud Healthcare API answers at a Google API endpoint, healthcare.googleapis.com, which offers no custom domain, so every name it answers under is one of the service's own: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location, kms_key_name and deletion_protection from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_location_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Cloud Healthcare API dataset in the operator's own Google Cloud project, at a location the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    kms_key_name_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (hasKey $o "deletion_protection") (not (kindIs "bool" $o.deletion_protection)) -}}
      {{- fail (printf "infra.overrides.deletion_protection is %s, and it sets whether Terraform may delete the dataset and its stores: set it to true or false in the Release, or remove it for true" (toJson $o.deletion_protection)) -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and the Cloud Healthcare API takes the Cloud KMS key it encrypts a dataset with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
    # The google provider's version argument of a FHIR store takes DSTU2,
    # STU3 and R4 (its validation, and its description: Possible values:
    # ["DSTU2", "STU3", "R4"]), while the Healthcare API serves R5 as well.
    fhir_version_supported: >-
      {{- range $name, $store := (default dict (optional .values "fhir_stores" dict)) -}}
      {{- if eq (toString $store.version) "R5" -}}
      {{- fail (printf "values.fhir_stores.%s.version is R5, and the google provider this Recipe renders for creates a FHIR store of DSTU2, STU3 or R4 alone, though the Healthcare API serves R5: set the store's version to one of them in the Aggregate, or map this Component to a Recipe that creates an R5 store" $name) -}}
      {{- end -}}
      {{- end -}}
    # The dataset takes the instance's name, and the Healthcare API takes a
    # dataset ID of 1 to 256 letters, digits, underscores, hyphens and
    # periods (the REST reference of datasets.create); the Aggregate already
    # holds an instance's name to letters, digits, underscores and hyphens.
    dataset_name: >-
      {{- if gt (len .metadata.instance_id) 256 -}}
      {{- fail (printf "the dataset takes the instance's name, %d characters long, and the Healthcare API takes a dataset's name of up to 256 characters: rename the instance in the Aggregate" (len .metadata.instance_id)) -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Cloud Healthcare API module. The resources are named this, since each
  # component's body renders into a module directory of its own, and the
  # stores of a kind are one resource taking each name by for_each. Each
  # string the Release gives reaches the service as written: Terraform would
  # read ${ and %{ inside a string as the start of an interpolation or a
  # directive, so they are written $${ and %%{, which Terraform turns back
  # into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $policy := ternary "PREVENT" "DELETE" (optional $o "deletion_protection" true) -}}
      {{- $fhir := default dict (optional .values "fhir_stores" dict) -}}
      {{- $dicom := default list (optional .values "dicom_stores" list) -}}
      {{- $hl7 := default list (optional .values "hl7_v2_stores" list) -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_healthcare_dataset" "this" {
        name            = "{{ .context.instance_id }}"
        deletion_policy = "{{ $policy }}"

        ## ── Provider-specific overrides ──────────────────────────
        project  = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        location = {{ toJson $o.location | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "kms_key_name" "" }}

        encryption_spec {
          kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }
      {{- if $fhir }}

      {{- $width := 0 }}
      {{- range $name, $_ := $fhir }}{{ $width = max $width (len (toJson $name)) }}{{ end }}

      resource "google_healthcare_fhir_store" "this" {
        for_each = {
          {{- range $name, $store := $fhir }}
          {{ printf "%-*s" (int $width) (toJson $name) }} = {{ toJson $store.version }}
          {{- end }}
        }

        dataset         = google_healthcare_dataset.this.id
        name            = each.key
        version         = each.value
        deletion_policy = "{{ $policy }}"
      }
      {{- end }}
      {{- if $dicom }}

      resource "google_healthcare_dicom_store" "this" {
        for_each = toset([
          {{- range $i, $name := $dicom }}{{ if $i }}, {{ end }}{{ toJson $name }}{{ end -}}
        ])

        dataset         = google_healthcare_dataset.this.id
        name            = each.key
        deletion_policy = "{{ $policy }}"
      }
      {{- end }}
      {{- if $hl7 }}

      resource "google_healthcare_hl7_v2_store" "this" {
        for_each = toset([
          {{- range $i, $name := $hl7 }}{{ if $i }}, {{ end }}{{ toJson $name }}{{ end -}}
        ])

        dataset         = google_healthcare_dataset.this.id
        name            = each.key
        deletion_policy = "{{ $policy }}"
      }
      {{- end }}

      output "endpoint" {
        value = "https://healthcare.googleapis.com/v1/${google_healthcare_dataset.this.id}"
      }
