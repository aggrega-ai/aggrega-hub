apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: eventbridge
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # EventBridge module: the third-party code this Recipe pins and writes into
  # the output. The event bus it provisions is a service the reader contracts
  # for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon EventBridge, realized by the published EventBridge module of the
    terraform-aws-modules project, terraform-aws-modules/eventbridge/aws at
    v4.4.1, Apache-2.0, fetched from its git repository at that tag and
    pinned by the commit it names in the entity.lock beside this Recipe: one
    custom event bus named after the component. arn publishes the module's
    output, as a Terraform reference that resolves for a consumer authored
    as a source: Recipe in the same root configuration.

    EventBridge encrypts the events on the bus with the operator's KMS key
    where kms_key_id names one, and with a key AWS owns otherwise; tags
    label the bus. The module's role, log delivery, rules, targets,
    permissions, archives, connections, API destinations, schema
    discoverer, schedules and pipes stay off, and no key is created. A
    destroy, or removing the bus from the configuration, deletes the bus,
    which needs every rule on it deleted first.

    infra.overrides.host halts the build, since a publisher reaches every
    bus at EventBridge's endpoint in its Region and names the bus by its
    ARN, as do a kms_key_id EventBridge cannot take, tags that are not a map
    of strings and any infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/eventbridge:1.0.0

  # The published module, at the tag the registry publishes as version 4.4.1.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ directory is vendored with it and never
  # loaded, since nothing the root declares reaches it.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-eventbridge.git
    ref: v4.4.1

  # The String Pipe: the compiler does not interpret this string. arn names
  # the module's eventbridge_bus_arn output, the bus's ARN, through this
  # component's module call, which the boundary's root configuration declares
  # under .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves it at apply time, so it resolves only
  # for a consumer authored as a source: Recipe in the same root
  # configuration, which reading it is applied after the bus; a consumer on
  # another target receives it as text.
  provides:
    arn: "${module.{{ .context.instance_id }}.eventbridge_bus_arn}"

  # This Recipe reads from infra.overrides:
  #   kms_key_id - string (kms_key_identifier)
  #   tags       - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # kms_key_id and tags are the keys, under the same names, that the
  # catalog's terraform AWS Recipes read for the KMS key a resource is
  # encrypted with and for its tags, so a Release names each once whichever
  # Recipe it configures.
  #
  # kms_key_id names the operator's KMS key, set as the module's
  # kms_key_identifier, by one of the forms the CreateEventBus API reference
  # gives KmsKeyIdentifier: a key ID (a UUID, or mrk- and 32 hexadecimal
  # digits for a multi-Region key), an alias name (alias/ followed by its
  # name), or the ARN of a key or of an alias, which a key of another account
  # is named by. The AWS provider checks the string's length alone, so a
  # value of another form halts the build here rather than at apply.
  # EventBridge then encrypts the custom and partner events stored on the bus
  # under that key, and the event pattern and target settings of every rule
  # on the bus; events from AWS services stay under a key AWS owns.
  # EventBridge takes a symmetric key alone. The key, and its key policy,
  # which lets EventBridge use it, are the operator's, named here and never
  # created. EventBridge runs no schema discovery on a bus encrypted under
  # such a key. Unset, the module's kms_key_identifier keeps its default,
  # null, and EventBridge encrypts the bus's events under a key AWS owns.
  #
  # tags is a map from each tag name to a string, written on the bus, the one
  # resource the module creates here, as the module writes it: the module
  # adds no tag of its own to the bus.
  #
  # host is refused by name. EventBridge publishes no address of an event
  # bus of its own: a client calls EventBridge's endpoint in the bus's
  # Region, an endpoint the service names and offers no custom domain for,
  # and names the bus by its ARN in each call, so this Component publishes no
  # host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the overrides above.
  #   refused — a kms_key_id of another form; tags that are not a map of
  #     strings; infra.overrides.host; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the component's name, which names the bus.
  #   not read — none; the Component declares no value and no other infra
  #     key.
  #
  # The name. The module's bus_name defaults to default, the name of the
  # event bus every account already holds, so the component's name is
  # always passed, and the Component's assertion holds it to EventBridge's
  # rule for a custom event bus's name. The AWS provider replaces the bus
  # when its name changes, so renaming the component makes Terraform delete
  # the old bus, which needs every rule on it deleted first, and create a new
  # one under the new name.
  #
  # The module's toggles that would create something beside the bus are
  # written off, so the module creates the bus alone whatever its other
  # inputs default to: create_role, an IAM role EventBridge would assume to
  # reach targets; create_log_delivery, which on by default creates a log
  # delivery source on the bus; create_rules, create_targets and
  # create_permissions, the rules, their targets and the resource policy
  # statements its rules, targets and permissions inputs list;
  # create_archives, create_connections, create_api_destinations and
  # create_schemas_discoverer, each off by default and written off with the
  # rest; and create_schedule_groups, create_schedules and create_pipes, the
  # EventBridge Scheduler and EventBridge Pipes resources its inputs list.
  # The bus itself is written with the module's defaults for everything else,
  # as the cloudformation Recipe writes it: no event source name, which
  # would make it a partner event bus; no log_config, so the bus writes no
  # logs; no dead_letter_config, so an event EventBridge cannot encrypt or
  # decrypt under the operator's key is not kept in a queue; no description;
  # and the Region of the AWS provider the root configures. The module reads
  # the provider's Region and partition and the caller's account through
  # data sources whatever it creates.
  #
  # Deletion. A destroy, or removing the component, deletes the bus, and the
  # DeleteEventBus API reference asks that every rule on it be deleted
  # first. An event on the bus is passed to the targets of the rules matching
  # it and kept by no archive, so the bus holds none to back up.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon EventBridge publishes no address of an event bus: a client calls EventBridge's endpoint in the bus's Region, which offers no custom domain, and names the bus by arn: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # kms_key_id is passed to the module's kms_key_identifier in one of the
    # forms the CreateEventBus API reference gives KmsKeyIdentifier, each
    # within the letters, digits, hyphens, underscores, slashes and colons it
    # admits, and tags as the map of strings the module's tags input is typed
    # as. The cloudformation Recipe of this Component holds the same key rule
    # on KmsKeyId: each target reads the key under its own spelling, so the
    # rule cannot sit in the Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/[a-zA-Z0-9/_-]+)$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and EventBridge takes the KMS key an event bus is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to encrypt the bus under a key AWS owns" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    bus_name: "{{ .context.instance_id }}"
    create_role: false
    create_log_delivery: false
    create_rules: false
    create_targets: false
    create_permissions: false
    create_archives: false
    create_connections: false
    create_api_destinations: false
    create_schemas_discoverer: false
    create_schedule_groups: false
    create_schedules: false
    create_pipes: false
    {{- with optional $o "kms_key_id" "" }}
    kms_key_identifier: {{ toJson . }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
