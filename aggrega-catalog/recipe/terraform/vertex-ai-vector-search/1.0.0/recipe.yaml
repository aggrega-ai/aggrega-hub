apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vertex-ai-vector-search
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Vertex AI Vector Search, rendered as an authored Terraform body, main.tf:
    a google_vertex_ai_index of the values' length, distance and update
    method, a google_vertex_ai_index_endpoint, and a
    google_vertex_ai_index_endpoint_deployed_index serving the index from
    it, in the operator's project at infra.overrides.region. The endpoint is
    public unless infra.overrides.private_network names the VPC network to
    peer it with. host, endpoint, deployed_index_id, index_endpoint and
    index publish outputs of this component's module, which Terraform
    resolves when it applies; port is 443 on a public endpoint and 10000 on
    a private one.

    The project, the network and its private services access, the Cloud
    Storage files a batch update reads and the KMS key are the operator's:
    none is created, nor any IAM binding. A destroy deletes the deployed
    index, the endpoint and the index.

    A project_id or region missing, a network not named by its project's
    number, an allocated_ip_range without one, a shard size, machine type or
    replica count Vertex AI does not take, a contents_delta_uri or
    kms_key_name of another form, an instance name no deployed index ID is
    made from, infra.overrides.host, and any infra.overrides key not listed
    halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/vertex-ai-vector-search:1.0.0

  locals:
    # The ID the index is deployed under: the instance's name with each
    # hyphen written as an underscore, since a deployed index ID takes
    # letters, digits and underscores alone. The assertion deployed_index_id
    # below holds it to the rest of the rule.
    deployed_index_id: "{{ .context.instance_id | replace \"-\" \"_\" }}"

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this index, and resolves none
  # of them.
  #
  # host, endpoint, deployed_index_id, index_endpoint and index are
  # references to outputs of this component's module call: the body renders
  # into the component's own module directory, and the boundary's root
  # configuration declares that directory as a module block named
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. A reference resolves only for a consumer authored as a
  # source: Recipe in the same Terraform root configuration, which Terraform
  # then applies after this module, once the endpoint serves the index; a
  # consumer on another target receives it as text.
  #
  # On a public endpoint, host is the endpoint's public_endpoint_domain_name,
  # the name Vertex AI gives it under vdb.vertexai.goog, which answers REST
  # and gRPC over TLS on 443, and endpoint is https:// followed by it. On a
  # private endpoint, host is the deployed index's
  # private_endpoints[0].match_grpc_address, the IP address Vertex AI
  # assigns it in the peered range, which answers gRPC on 10000 ("Query an
  # index over VPC Network Peering"), and endpoint is that address followed
  # by :10000. Each port is the service's own, so port is published as text.
  # The public name is Google's, whose certificate a name of the operator's
  # would not match, and the private address is the one Vertex AI assigns
  # and publishes no name for, so infra.overrides.host is refused by the
  # assertion below rather than published.
  provides:
    host: "${module.{{ .context.instance_id }}.host}"
    port: "{{ if optional (optional .infra \"overrides\" dict) \"private_network\" \"\" }}10000{{ else }}443{{ end }}"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
    deployed_index_id: "${module.{{ .context.instance_id }}.deployed_index_id}"
    index_endpoint: "${module.{{ .context.instance_id }}.index_endpoint}"
    index: "${module.{{ .context.instance_id }}.index}"

  # This Recipe reads from infra.overrides:
  #   project_id          - string, required (project, on the index and the endpoint)
  #   region              - string, required (region, on the index, the endpoint and the deployed index)
  #   private_network     - string (the endpoint's network; unset, public_endpoint_enabled)
  #   allocated_ip_range  - string (the deployed index's reserved_ip_ranges, with private_network)
  #   machine_type        - string (dedicated_resources.machine_spec.machine_type; unset, automatic_resources)
  #   min_replica_count   - integer (dedicated_resources or automatic_resources min_replica_count)
  #   max_replica_count   - integer (dedicated_resources or automatic_resources max_replica_count)
  #   shard_size          - string (metadata.config.shard_size; default "SHARD_SIZE_MEDIUM")
  #   contents_delta_uri  - string (metadata.contents_delta_uri)
  #   kms_key_name        - string (encryption_spec.kms_key_name, on the index and the endpoint)
  # host halts by name, as any key not listed does.
  #
  # project_id, region, private_network, allocated_ip_range and kms_key_name
  # are the names the catalog's terraform Google Recipes read for the
  # project a resource is created in, the region it runs in, the VPC network
  # it takes a private address in, the range of that network's private
  # services access the address is drawn from, and the customer-managed key
  # it is encrypted with; machine_type, min_replica_count,
  # max_replica_count, shard_size and contents_delta_uri are the provider's
  # arguments.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Vertex AI API is enabled. region is where
  # Vertex AI keeps the index and serves it, such as europe-west1; Vertex AI
  # refuses one it does not offer when it creates the index. Each is a
  # string and neither has a value this Recipe could choose for the
  # operator, so each halts the build when it is missing.
  #
  # private_network names the operator's VPC network the endpoint is peered
  # with, as projects/<project number>/global/networks/<name>: the google
  # provider's description of the endpoint's network names the project by
  # its number, so a project ID there halts. The network has private
  # services access already, an allocated range and a private connection to
  # servicenetworking.googleapis.com, which this Recipe emits none of,
  # because the connection is the network's and every Google service using
  # private services access shares it. The endpoint then answers in that
  # network alone, on 10000, and takes no authentication, since the body
  # writes no deployed_index_auth_config: any client the network routes to
  # it may query. Unset, the endpoint is public, public_endpoint_enabled.
  # allocated_ip_range names one range of that private services access, a
  # Compute Engine address name, the deployed index's address is drawn
  # from; without private_network it would reach nothing, so it halts, as a
  # value of another form does.
  #
  # shard_size is SHARD_SIZE_SMALL, SHARD_SIZE_MEDIUM or SHARD_SIZE_LARGE,
  # 2, 20 or 50 GiB a shard, and any other value halts. The provider's
  # description says the size must be given when the index is created, and
  # SHARD_SIZE_MEDIUM is the size the Vertex AI SDK for Python documents as
  # the default, so the body writes it when the key is unset. machine_type
  # deploys the index on dedicated machines of that type, which Vertex AI
  # offers by shard size ("Create and manage your index", and the provider's
  # description of dedicated_resources): n1-standard-32, e2-highmem-16 and
  # n2d-standard-32 for every size, n1-standard-16 and e2-standard-16 for
  # SHARD_SIZE_SMALL and SHARD_SIZE_MEDIUM, e2-standard-2 for
  # SHARD_SIZE_SMALL alone. Another type, or one the shard size does not
  # take, halts. Unset, Vertex AI decides the resources,
  # automatic_resources.
  #
  # min_replica_count and max_replica_count bound the replicas serving the
  # index: integers of at least 1 and at most 1000 (the provider's
  # description of both blocks), the maximum not below the minimum, which is
  # 2 when unset, and any other value halts. With machine_type the service
  # requires the minimum, and the body writes 2 when it is unset, the
  # replicas Vertex AI keeps when it decides the resources, below which its
  # documentation states no service level; without machine_type each is
  # written only when set, and Vertex AI's defaults, 2 for each, hold
  # otherwise.
  #
  # contents_delta_uri names the Cloud Storage directory, gs://<bucket> with
  # an optional path, whose files the index is built from, the form the
  # provider's metadata block takes. Unset, the index is created empty, as
  # Vertex AI admits for either update method. A batch update reads the
  # directory each time this value changes: the files changing under an
  # unchanged value send no update. A value of another form halts.
  #
  # kms_key_name names the operator's Cloud KMS key the index and the
  # endpoint are encrypted with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's encryption_spec takes; the key is in the region
  # the index is in, and the Vertex AI service agent may use it, both of
  # which Vertex AI checks when it creates them. Unset, Vertex AI encrypts
  # them with a key Google manages. A value of another form halts.
  #
  # host is refused by name: the public endpoint answers under a name of
  # Google's and the private one at the address Vertex AI assigns, as the
  # comment above provides says.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.dimensions, values.distance_measure_type,
  #     values.approximate_neighbors_count and values.index_update_method,
  #     as the index's arguments of the same names; and the overrides above.
  #   refused — project_id or region missing or not a string; a
  #     private_network of another form; an allocated_ip_range without
  #     private_network or of another form; a shard_size not offered; a
  #     machine_type not offered or not offered for the shard size; a
  #     replica count not an integer from 1 to 1000, or a maximum below the
  #     minimum, 2 when unset; a contents_delta_uri or a kms_key_name of another form; an
  #     instance name no deployed index ID is made from;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: the instance's name as the index's
  # and the endpoint's display_name, and the deployed index ID the locals
  # make from it, which Vertex AI holds unique within the project, so two
  # Releases deploying the same instance name into one project collide when
  # the second applies; the tree-AH algorithm, algorithm_config.tree_ah_config,
  # with the service's own leaf settings, under which Vertex AI requires the
  # approximate neighbour count values.approximate_neighbors_count gives; no
  # feature_norm_type, so no normalization is applied, the service's
  # default; no labels or access logs, and the deployed index in the group
  # Vertex AI names default; and each resource's deletion_policy left at the
  # provider's DELETE. The provider
  # replaces the index when project_id, region, a value, shard_size or
  # kms_key_name changes, the endpoint when project_id, region,
  # private_network or kms_key_name changes, and the deployed index when
  # either of those is replaced or allocated_ip_range or machine_type
  # changes: Terraform undeploys and deletes, then creates anew, and the
  # endpoint serves nothing between the two. A changed replica count is
  # sent to Vertex AI as an update of the deployed index.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "region" "private_network" "allocated_ip_range" "machine_type" "min_replica_count" "max_replica_count" "shard_size" "contents_delta_uri" "kms_key_name" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Vertex AI Vector Search answers under a name of Google's on a public endpoint, whose certificate a name of the operator's would not match, and at the address Vertex AI assigns the deployed index on a private one: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, region, private_network, allocated_ip_range, machine_type, min_replica_count, max_replica_count, shard_size, contents_delta_uri and kms_key_name from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_region_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "region" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Vertex AI Vector Search index in the operator's own Google Cloud project, in a region the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    network_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "private_network" -}}
      {{- if not (and (typeIs "string" $o.private_network) (regexMatch `^projects/[0-9]+/global/networks/[^/\s]+$` $o.private_network)) -}}
      {{- fail (printf "infra.overrides.private_network is %s, and Vertex AI peers an index endpoint with a VPC network named projects/<project number>/global/networks/<name>, the project by its number, as the google provider's description of the endpoint's network states: set it to one in the Release, or remove it for a public endpoint" (toJson $o.private_network)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "allocated_ip_range" -}}
      {{- if not (hasKey $o "private_network") -}}
      {{- fail "infra.overrides.allocated_ip_range is set without infra.overrides.private_network, and it names a range of the peered network's private services access, which a public endpoint has none of: set infra.overrides.private_network beside it, or remove it" -}}
      {{- end -}}
      {{- if not (and (typeIs "string" $o.allocated_ip_range) (regexMatch `^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $o.allocated_ip_range)) -}}
      {{- fail (printf "infra.overrides.allocated_ip_range is %s, and Vertex AI takes the range a deployed index's address is drawn from by the name of its Compute Engine address, a lowercase letter followed by up to 62 lowercase letters, digits and hyphens, not ending with a hyphen: set it to that name in the Release, or remove it" (toJson $o.allocated_ip_range)) -}}
      {{- end -}}
      {{- end -}}
    resources_offered: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $shard := optional $o "shard_size" "SHARD_SIZE_MEDIUM" -}}
      {{- if not (has $shard (list "SHARD_SIZE_SMALL" "SHARD_SIZE_MEDIUM" "SHARD_SIZE_LARGE")) -}}
      {{- fail (printf "infra.overrides.shard_size is %s, and Vertex AI Vector Search splits an index into shards of SHARD_SIZE_SMALL, SHARD_SIZE_MEDIUM or SHARD_SIZE_LARGE: set it to one of them, or remove it for SHARD_SIZE_MEDIUM" (toJson $shard)) -}}
      {{- end -}}
      {{- if hasKey $o "machine_type" -}}
      {{- $byShard := dict "SHARD_SIZE_SMALL" (list "e2-standard-2" "e2-standard-16" "n1-standard-16" "n1-standard-32" "e2-highmem-16" "n2d-standard-32") "SHARD_SIZE_MEDIUM" (list "e2-standard-16" "n1-standard-16" "n1-standard-32" "e2-highmem-16" "n2d-standard-32") "SHARD_SIZE_LARGE" (list "n1-standard-32" "e2-highmem-16" "n2d-standard-32") -}}
      {{- if not (has $o.machine_type (get $byShard "SHARD_SIZE_SMALL")) -}}
      {{- fail (printf "infra.overrides.machine_type is %s, and Vertex AI Vector Search deploys an index on e2-standard-2, e2-standard-16, n1-standard-16, n1-standard-32, e2-highmem-16 or n2d-standard-32 machines: set it to one of them, or remove it to let Vertex AI decide the resources" (toJson $o.machine_type)) -}}
      {{- end -}}
      {{- if not (has $o.machine_type (get $byShard $shard)) -}}
      {{- fail (printf "infra.overrides.machine_type is %s, and Vertex AI Vector Search deploys an index of %s shards on %s machines alone: set infra.overrides.machine_type to one of them, or infra.overrides.shard_size to a size %s takes" (toJson $o.machine_type) $shard (join ", " (get $byShard $shard)) $o.machine_type) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "min_replica_count" "max_replica_count" -}}
      {{- if hasKey $o $k -}}
      {{- $v := get $o $k -}}
      {{- if not (and (or (kindIs "int" $v) (kindIs "int64" $v) (kindIs "float64" $v)) (regexMatch `^[0-9]+$` (toString $v)) (ge (int64 $v) 1) (le (int64 $v) 1000)) -}}
      {{- fail (printf "infra.overrides.%s is %s, and Vertex AI serves a deployed index from 1 to 1000 replicas: set it to an integer in that range, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "max_replica_count" -}}
      {{- $min := optional $o "min_replica_count" 2 -}}
      {{- if lt (int64 $o.max_replica_count) (int64 $min) -}}
      {{- fail (printf "infra.overrides.max_replica_count is %v, and the deployed index keeps at least %v replicas, infra.overrides.min_replica_count or else the 2 Vertex AI keeps: set max_replica_count to that minimum or more" $o.max_replica_count $min) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "contents_delta_uri" -}}
      {{- if not (and (typeIs "string" $o.contents_delta_uri) (regexMatch `^gs://[a-z0-9][a-z0-9._-]{1,220}[a-z0-9](/\S*)?$` $o.contents_delta_uri)) -}}
      {{- fail (printf "infra.overrides.contents_delta_uri is %s, and Vertex AI Vector Search builds an index from the files in a Cloud Storage directory named gs://<bucket>/<path>: set it to one in the Release, or remove it for an empty index" (toJson $o.contents_delta_uri)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Vertex AI takes the Cloud KMS key it encrypts an index and an endpoint with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
    # A deployed index ID is up to 128 letters, digits and underscores,
    # beginning with a letter (the provider's description of
    # deployed_index_id, and "Deploy an index to a public endpoint"). The
    # locals make it from the instance's name, whose characters the
    # Aggregate already holds to letters, digits, underscores and hyphens.
    deployed_index_id: >-
      {{- if not (regexMatch `^[A-Za-z][A-Za-z0-9_]{0,127}$` .locals.deployed_index_id) -}}
      {{- fail (printf "the index is deployed under an ID made from the instance's name, %q, with each hyphen written as an underscore, and Vertex AI takes a deployed index ID of up to 128 letters, digits and underscores beginning with a letter: rename the instance in the Aggregate" .metadata.instance_id) -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Vertex AI Vector Search module. An endpoint serves an index only through
  # a deployed index, so the body declares all three. The resources are
  # named this, since each component's body renders into a module directory
  # of its own. Each string the Release gives reaches Vertex AI as written:
  # Terraform would read ${ and %{ inside a string as the start of an
  # interpolation or a directive, so they are written $${ and %%{, which
  # Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $private := hasKey $o "private_network" -}}
      {{- $dedicated := hasKey $o "machine_type" -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_vertex_ai_index" "this" {
        display_name        = "{{ .context.instance_id }}"
        index_update_method = "{{ .values.index_update_method }}"

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        region  = {{ toJson $o.region | replace "${" "$${" | replace "%{" "%%{" }}

        metadata {
          {{- with optional $o "contents_delta_uri" "" }}
          contents_delta_uri = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
          {{- printf "\n" }}
          {{- end }}
          config {
            dimensions                  = {{ .values.dimensions }}
            distance_measure_type       = "{{ .values.distance_measure_type }}"
            approximate_neighbors_count = {{ .values.approximate_neighbors_count }}
            shard_size                  = "{{ optional $o "shard_size" "SHARD_SIZE_MEDIUM" }}"

            algorithm_config {
              tree_ah_config {}
            }
          }
        }
        {{- with optional $o "kms_key_name" "" }}

        encryption_spec {
          kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }

      resource "google_vertex_ai_index_endpoint" "this" {
        display_name = "{{ .context.instance_id }}"

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        region  = {{ toJson $o.region | replace "${" "$${" | replace "%{" "%%{" }}
        {{- if $private }}
        network = {{ toJson $o.private_network | replace "${" "$${" | replace "%{" "%%{" }}
        {{- else }}

        public_endpoint_enabled = true
        {{- end }}
        {{- with optional $o "kms_key_name" "" }}

        encryption_spec {
          kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }

      resource "google_vertex_ai_index_endpoint_deployed_index" "this" {
        index_endpoint    = google_vertex_ai_index_endpoint.this.id
        index             = google_vertex_ai_index.this.id
        deployed_index_id = "{{ .locals.deployed_index_id }}"

        ## ── Provider-specific overrides ──────────────────────────
        region = {{ toJson $o.region | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "allocated_ip_range" "" }}

        reserved_ip_ranges = [{{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}]
        {{- end }}
        {{- if $dedicated }}

        dedicated_resources {
          machine_spec {
            machine_type = {{ toJson $o.machine_type }}
          }
          min_replica_count = {{ optional $o "min_replica_count" 2 }}
          {{- with optional $o "max_replica_count" "" }}
          max_replica_count = {{ . }}
          {{- end }}
        }
        {{- else if or (hasKey $o "min_replica_count") (hasKey $o "max_replica_count") }}

        automatic_resources {
          {{- with optional $o "min_replica_count" "" }}
          min_replica_count = {{ . }}
          {{- end }}
          {{- with optional $o "max_replica_count" "" }}
          max_replica_count = {{ . }}
          {{- end }}
        }
        {{- end }}
      }

      output "host" {
        {{- if $private }}
        value = google_vertex_ai_index_endpoint_deployed_index.this.private_endpoints[0].match_grpc_address
        {{- else }}
        value = google_vertex_ai_index_endpoint.this.public_endpoint_domain_name
        {{- end }}
      }

      output "endpoint" {
        {{- if $private }}
        value = "${google_vertex_ai_index_endpoint_deployed_index.this.private_endpoints[0].match_grpc_address}:10000"
        {{- else }}
        value = "https://${google_vertex_ai_index_endpoint.this.public_endpoint_domain_name}"
        {{- end }}
      }

      output "deployed_index_id" {
        value = google_vertex_ai_index_endpoint_deployed_index.this.deployed_index_id
      }

      output "index_endpoint" {
        value = google_vertex_ai_index_endpoint.this.id
      }

      output "index" {
        value = google_vertex_ai_index.this.id
      }
