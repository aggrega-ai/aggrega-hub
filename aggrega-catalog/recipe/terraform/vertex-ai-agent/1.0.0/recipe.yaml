apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vertex-ai-agent
  version: 1.0.0
  description: >
    A Vertex AI agent as a reference realization on Terraform: the module
    this Recipe writes declares no resource and reaches no provider, so
    applying it creates nothing, and it carries the regional endpoint the
    Release supplies and the agent's identifier as outputs of the module.
    The google provider's google_vertex_ai_reasoning_engine deploys an agent
    from its code (package_spec, source_code_spec or container_spec under
    spec), which the Component's values do not carry, so this Recipe creates
    no agent: the agent and its instructions live in Vertex AI.

    Reach for it where the Release deploys Terraform; helm/vertex-ai-agent
    and compose/vertex-ai-agent realize the same Component on Kubernetes and
    Docker Compose. Declaring no provider, the module shares a root with a
    module at any google version. A consumer reads each value as the text
    the Release and the Aggregate give, the identifier empty while the
    Aggregate sets none, and nothing is looked up when the configuration is
    applied. A missing infra.endpoint halts naming it. No credential is
    delivered by this Recipe: consumers authenticate with their own Google
    identity, such as the service account a Cloud Run service runs as, or
    inject their own credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-agent/vertex-ai:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts before this Recipe
  # renders, the Component's schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.agent_id, published as provides.agent_id, empty
  #     while unset; infra.endpoint, published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.instructions, which live with the agent in Vertex
  #     AI, and this Recipe creates no agent to set them on;
  #     values.models, values.tools_allowed, values.datastores and
  #     values.agents_allowed, which name the catalog components the agent
  #     works with and set no field of a resource this Recipe declares, since
  #     it declares no agent for them to configure; values.display_name and
  #     values.description, which describe the component to its readers and
  #     set no such field either.
  #
  # A data_store connection is not read: the data stores an agent searches
  # are part of the agent Vertex AI holds, as its instructions are, and this
  # Recipe creates no agent to give one to.
  #
  # Why no agent. The google provider's google_vertex_ai_reasoning_engine
  # requires display_name alone, but the agent it deploys is code, named
  # under spec by package_spec, source_code_spec or container_spec, and it
  # takes no field for instructions. The Component's values carry no code,
  # so this Recipe declares no agent.
  #
  # Backup. The agent lives in Vertex AI, and this Recipe creates nothing to
  # back up.
  assertions:
    # The Vertex AI host carries the region, and the region is the operator's
    # choice, so no address exists for the catalog to hold as a default: the
    # Release names the host of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches a Vertex AI agent in a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the Vertex AI host of that region (<region>-aiplatform.googleapis.com)" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the agent's identifier from
  # the developer's values, each published as written, so a consumer in this
  # root or on another target reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_id: '{{ optional .values "agent_id" "" }}'

  # The module this component becomes: no resource and no provider, so
  # applying it creates nothing and it takes no google version, and an
  # output for each value the component publishes, so the state records what
  # the configuration was given. Each value is written as a JSON string, with
  # Terraform's own template sequences ${ and %{ escaped as $${ and %%{, so
  # Terraform reads back exactly the text the Release and the Aggregate give.
  artifacts:
    main.tf: |
      output "endpoint" {
        value = {{ .infra.endpoint | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }

      output "agent_id" {
        value = {{ optional .values "agent_id" "" | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }
