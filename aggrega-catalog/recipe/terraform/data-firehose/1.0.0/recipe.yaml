apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: data-firehose
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Data Firehose, rendered as an authored Terraform body, main.tf:
    one aws_kinesis_firehose_delivery_stream named after the component,
    taking records put to it directly and delivering them to the S3 bucket
    bucket_arn names, assuming the IAM role role_arn names, under
    values.prefix and compressed as values.compression_format says.
    delivery_stream_name and arn publish Terraform references to the
    stream's name and ARN, outputs of this component's module, which
    Terraform resolves when it applies.

    The bucket and the role are the operator's: neither is created, nor any
    key, log group or policy. Firehose encrypts the records it holds in
    interim storage with AWS KMS, and the objects take the bucket's default
    encryption. Tags label the stream. A destroy, or removing the stream
    from the configuration, deletes the stream and leaves the bucket's
    objects in place.

    A bucket_arn or role_arn missing or of another form halts the build, as
    do infra.overrides.host, since a producer reaches the stream at
    Firehose's endpoint in its Region, a key setting another source or
    destination, tags that are not a map of strings and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/messaging/data-firehose:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this stream, and resolves none
  # of them. Each is a reference to an output of this component's module
  # call: the body renders into the component's own module directory, and
  # the boundary's root configuration declares that directory as a module
  # block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The references resolve only for a consumer
  # authored as a source: Recipe in the same Terraform root configuration,
  # which Terraform then applies after this module; a consumer on another
  # target receives them as text. The outputs are the stream's name and ARN.
  provides:
    delivery_stream_name: "${module.{{ .context.instance_id }}.delivery_stream_name}"
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   bucket_arn - string, required (extended_s3_configuration.bucket_arn)
  #   role_arn   - string, required (extended_s3_configuration.role_arn)
  #   tags       - map[string]string (the stream's tags)
  # host halts by name, as does a key setting another source or destination
  # and any key not listed.
  #
  # bucket_arn and role_arn are the AWS provider's own argument names, which
  # is what a reader matches against the provider documentation; role_arn is
  # also the name the catalog's terraform AWS Recipes read for the IAM role a
  # service assumes. tags is the key, under the same name, that the
  # catalog's terraform AWS Recipes read for a resource's tags, so a Release
  # names them once whichever Recipe it configures.
  #
  # bucket_arn names the S3 bucket Firehose delivers to, as the ARN of the
  # bucket, arn:aws:s3::: followed by its name: the form the Firehose API
  # reference's BucketARN pattern admits, letters, digits, underscores,
  # periods and hyphens, up to 255 of them, after arn:<partition>:s3:::. The
  # bucket, its policy and its default encryption are the operator's, named
  # here and never created. The AWS provider checks only that the value is
  # an ARN, so a value of another form, or none, halts the build here rather
  # than at apply.
  #
  # role_arn names the IAM role Firehose assumes to deliver, as the ARN of
  # the role, arn:aws:iam::<account>:role/ followed by its path and name:
  # the form, and the 512 characters at most, the Firehose API reference's
  # RoleARN gives. The role is the operator's, named here and never created.
  # Its trust policy lets firehose.amazonaws.com assume it, and its
  # permissions allow s3:AbortMultipartUpload, s3:GetBucketLocation,
  # s3:GetObject, s3:ListBucket, s3:ListBucketMultipartUploads and
  # s3:PutObject on the bucket and its objects (the Firehose Developer
  # Guide's "Grant Firehose access to an Amazon S3 destination"), or
  # Firehose cannot deliver, retries for up to 24 hours and then loses the
  # records. A value of another form, or none, halts the build.
  #
  # tags tag the stream, as a map from each tag name to a string.
  #
  # host is refused by name. Firehose publishes no address of a stream of
  # its own: a producer calls the service's endpoint in the stream's Region,
  # an endpoint the service names and offers no custom domain for, and names
  # the stream by delivery_stream_name in each call, so this Component
  # publishes no host for the name to replace.
  #
  # A key setting another source or destination is refused by name:
  # destination and every argument ending in _configuration, the provider's
  # source and destination blocks. The stream takes records put to it
  # directly and delivers them to the bucket alone, which is what this
  # Component offers; a Kinesis data stream or an Amazon MSK cluster as its
  # source, and Firehose's other destinations, are not offered.
  #
  # kms_key_id is not read, and halts as any key not listed does: Firehose
  # encrypts the records it holds in interim storage with AWS KMS (the
  # Firehose Developer Guide's "Data protection in Amazon Data Firehose"),
  # the body writes no server_side_encryption, so no server-side encryption
  # under a key of the operator's is turned on, and no kms_key_arn, so the
  # AWS provider asks Firehose for no encryption of its own for the objects
  # it writes, and each object takes the bucket's default encryption.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.prefix (prefix, written where set),
  #     values.error_output_prefix (error_output_prefix, written where set),
  #     values.compression_format (compression_format), and the overrides
  #     above.
  #   refused — a bucket_arn or a role_arn not set or of another form; tags
  #     that are not a map of strings; infra.overrides.host; a key setting
  #     another source or destination; and any infra.overrides key not
  #     listed above.
  #   held by the Component — the component's name, which names the stream;
  #     a prefix or an error prefix longer than 1,024 characters or holding
  #     an expression Firehose does not evaluate there; an error prefix
  #     holding an expression without !{firehose:error-output-type}; a prefix
  #     holding an expression with no error prefix; and a compression format
  #     Firehose does not list.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The name. The AWS provider replaces the stream when its name changes, so
  # renaming the component makes Terraform delete the old stream and create
  # a new one under the new name.
  #
  # What the body writes beside the name, the destination, the bucket, the
  # role, the prefixes, the compression and the tags: nothing else of the
  # stream's own, so the AWS provider's defaults hold, each of which is
  # Firehose's own, which the cloudformation Recipe of this Component leaves
  # to Firehose, so both targets create the same stream. The provider
  # creates the stream with records put to it directly, the source it takes
  # with no source block. buffering_size 5 and buffering_interval 300, so
  # Firehose delivers an object once it has buffered 5 MiB or 300 seconds of
  # records (the BufferingHints API reference); custom_time_zone UTC, so its
  # time prefix and expressions read UTC; no file_extension, so each object
  # ends in the extension its compression gives; s3_backup_mode Disabled, so
  # no backup copy is written; no processing, data format conversion or
  # dynamic partitioning, so records are delivered as they arrive; and no
  # cloudwatch_logging_options, so no delivery errors are logged to
  # CloudWatch Logs, which takes a log group of the operator's and a role
  # permission. The Region is the one the root configures for the AWS
  # provider.
  #
  # Deletion. A destroy, or removing the component, deletes the stream and
  # its data (the DeleteDeliveryStream API reference): while it is being
  # deleted Firehose may still take records and no longer guarantees their
  # delivery, so producers stop first. The bucket and the objects already
  # delivered to it are the operator's and stay.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "bucket_arn" "role_arn" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon Data Firehose publishes no address of a stream: a producer calls the service's endpoint in the stream's Region, which offers no custom domain, and names the stream by delivery_stream_name: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if regexMatch `^(destination|.*_configuration)$` $k -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe's Amazon Data Firehose stream takes records put to it directly and delivers them to the S3 bucket bucket_arn names, with no other source or destination: remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads bucket_arn, role_arn and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The AWS provider requires a bucket and a role for an S3 destination,
    # and neither has a value this Recipe could choose for the operator. The
    # cloudformation Recipe of this Component holds the same rule on
    # BucketARN and RoleArn: each target reads the keys under its own
    # spelling, so the rule cannot sit in the Component.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "bucket_arn") -}}
      {{- fail "infra.overrides.bucket_arn is not set, and an Amazon Data Firehose stream delivers to the S3 bucket the operator names by its ARN: set infra.overrides.bucket_arn in the Release, such as arn:aws:s3:::example-bucket" -}}
      {{- end -}}
      {{- if not (hasKey $o "role_arn") -}}
      {{- fail "infra.overrides.role_arn is not set, and an Amazon Data Firehose stream delivers to its bucket under the IAM role the operator names by its ARN: set infra.overrides.role_arn in the Release, such as arn:aws:iam::123456789012:role/example-firehose-role" -}}
      {{- end -}}
    # Each override is passed to the resource as written, so one of another
    # shape would render an argument the AWS provider or Firehose refuses.
    # bucket_arn takes the bucket ARN form and role_arn the role ARN form the
    # Firehose API reference gives each field, and tags the map of strings
    # the provider types them as. The cloudformation Recipe of this Component
    # holds the same bucket and role rules on BucketARN and RoleArn, for the
    # reason given above.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "bucket_arn" -}}
      {{- if not (and (typeIs "string" $o.bucket_arn) (regexMatch `^arn:aws[a-zA-Z-]*:s3:::[a-zA-Z0-9_.-]{1,255}$` $o.bucket_arn)) -}}
      {{- fail (printf "infra.overrides.bucket_arn is %s, and Amazon Data Firehose takes the S3 bucket it delivers to as the bucket's ARN, arn:aws:s3::: followed by the bucket's name: set it to such an ARN in the Release" (toJson $o.bucket_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "role_arn" -}}
      {{- if not (and (typeIs "string" $o.role_arn) (le (len $o.role_arn) 512) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.role_arn)) -}}
      {{- fail (printf "infra.overrides.role_arn is %s, and Amazon Data Firehose takes the IAM role it delivers under as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 512 characters at most: set it to such an ARN in the Release" (toJson $o.role_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the stream takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Amazon Data Firehose module. The resource is named this, since each
  # component's body renders into a module directory of its own. The values
  # reach it as the Component's schema and assertions hold them: a
  # compression format Firehose lists, and prefixes of at most 1,024
  # characters whose expressions Firehose evaluates. Each prefix and tag
  # reaches Firehose as written: Terraform would read ${ and %{ inside a
  # string as the start of an interpolation or a directive, so they are
  # written $${ and %%{, which Terraform turns back into the characters
  # written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_kinesis_firehose_delivery_stream" "this" {
        name        = "{{ .context.instance_id }}"
        destination = "extended_s3"

        extended_s3_configuration {
          compression_format  = "{{ .values.compression_format }}"
          {{- with optional .values "prefix" "" }}
          prefix              = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
          {{- end }}
          {{- with optional .values "error_output_prefix" "" }}
          error_output_prefix = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
          {{- end }}

          ## ── Provider-specific overrides ──────────────────────────
          bucket_arn = {{ toJson $o.bucket_arn }}
          role_arn   = {{ toJson $o.role_arn }}
        }
        {{- with optional $o "tags" "" }}

        tags = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      output "delivery_stream_name" {
        value = aws_kinesis_firehose_delivery_stream.this.name
      }

      output "arn" {
        value = aws_kinesis_firehose_delivery_stream.this.arn
      }
