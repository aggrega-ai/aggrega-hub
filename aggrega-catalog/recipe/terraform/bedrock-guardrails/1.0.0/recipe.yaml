apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-guardrails
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Bedrock Guardrails, rendered as an authored Terraform body,
    main.tf: one aws_bedrock_guardrail named after the component, holding
    the messages and the policies its values declare, and one
    aws_bedrock_guardrail_version, a numbered snapshot of it.
    guardrail_id, guardrail_version and arn are outputs of this component's
    module, which Terraform resolves when it applies. Where kms_key_id names
    a KMS key, the guardrail is encrypted with it; no key is created. Tags
    label the guardrail.

    A change of a message or a policy updates the guardrail in place and
    replaces the version: Terraform creates the new one, then deletes the
    old one. A change of the key or the tags does not create one. Removing
    the component deletes the guardrail with every version.

    A kms_key_id other than a KMS key's ARN halts the build, as do tags that
    are not a map of strings Amazon Bedrock takes, infra.overrides.host,
    since a guardrail publishes no address, and any infra.overrides key not
    listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/security/bedrock-guardrails:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this guardrail, and resolves
  # none of them. Each is a reference to an output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a
  # module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The references resolve only for a
  # consumer authored as a source: Recipe in the same Terraform root
  # configuration, which Terraform then applies after this module; a
  # consumer on another target receives them as text.
  #
  # guardrail_id and arn are the guardrail's ID and ARN, and
  # guardrail_version the number of the version the body creates. A model
  # call such as Converse or InvokeModel, and ApplyGuardrail, names the
  # guardrail by its ID and the version by its number.
  provides:
    guardrail_id: "${module.{{ .context.instance_id }}.guardrail_id}"
    guardrail_version: "${module.{{ .context.instance_id }}.guardrail_version}"
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   kms_key_id - string (kms_key_arn)
  #   tags       - map[string]string (the guardrail's tags)
  # host halts by name, as any key not listed does.
  #
  # kms_key_id and tags are the keys, under those names, that the catalog's
  # terraform AWS Recipes read for the KMS key a resource is encrypted with
  # and for a resource's tags, so a Release names each once whichever
  # Recipe it configures; here the key's argument is kms_key_arn.
  #
  # kms_key_id names the operator's symmetric KMS key as the key's ARN,
  # arn:<partition>:kms:<region>:<account>:key/ followed by the key's
  # 36-character ID. Amazon Bedrock takes a key ID or an alias in the field
  # too, but the AWS provider reads the guardrail's key back as the key's
  # ARN, the one form GetGuardrail returns (the Amazon Bedrock API
  # Reference's GetGuardrail kmsKeyArn), and writes that into the state, so
  # any other form differs from the configuration at every plan; it halts
  # the build. Amazon Bedrock then encrypts the guardrail with that key
  # rather than with a key AWS manages, its default. The key's policy lets
  # the identity that applies the configuration use kms:Decrypt,
  # kms:GenerateDataKey, kms:DescribeKey and kms:CreateGrant, and every
  # consumer calling the guardrail kms:Decrypt (the Amazon Bedrock User
  # Guide's "Create a customer managed key for your guardrail for additional
  # security"). The key is the operator's, named here and never created.
  # Setting, changing or removing it updates the guardrail in place, the
  # provider replacing it for no argument this body writes, and creates no
  # new version.
  #
  # tags tag the guardrail, as a map from each tag name to a string, in the
  # form the Amazon Bedrock API Reference's Tag gives: a name of 1 to 128 and
  # a value of at most 256 letters, digits, spaces and the characters
  # . _ : / = + @ -. The version takes no tags.
  #
  # host is refused by name. A guardrail publishes no address of its own: a
  # caller reaches Amazon Bedrock's runtime endpoint in the guardrail's
  # Region, which the service names, and names the guardrail by its ID in
  # each call, so this Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.blocked_input_messaging (blocked_input_messaging),
  #     values.blocked_outputs_messaging (blocked_outputs_messaging),
  #     values.content_policy_config (content_policy_config),
  #     values.topic_policy_config (topic_policy_config),
  #     values.word_policy_config (word_policy_config),
  #     values.sensitive_information_policy_config
  #     (sensitive_information_policy_config) and
  #     values.contextual_grounding_policy_config
  #     (contextual_grounding_policy_config), each a block of the same name
  #     holding a block per list entry, every key of the subset written as
  #     the argument of the same name; and the overrides above.
  #   refused — a kms_key_id other than a KMS key's ARN; tags that are not a
  #     map of strings, or of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the subset's keys, the keys each list's
  #     entries require, the counts, the values, the lengths and the ranges
  #     Amazon Bedrock takes, a custom pattern's lookaround, and the
  #     component's name, which names the guardrail.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside the values, the key and the tags: no
  # description; no tier_config, so Amazon Bedrock applies the Classic tier;
  # no cross_region_config, which the Standard tier needs; and no
  # per-direction action, switch or modality on a filter, topic, word,
  # entity or pattern, so Amazon Bedrock's own defaults for them hold. The
  # version takes no description, and skip_destroy is left unset. These are
  # the settings the cloudformation Recipe of this Component writes, so both
  # targets create the same guardrail. The Region is the one the root
  # configures for the AWS provider.
  #
  # Why a version. A call names the guardrail and a version beside it; the
  # guardrail's own version attribute is its working draft, DRAFT, which
  # changes with every update, while a numbered version is a snapshot that
  # does not (the User Guide's "Deploy your guardrail"). The
  # aws_bedrock_guardrail_version creates that snapshot from the draft once
  # the guardrail is created.
  #
  # A change. The AWS provider creates a version only when it creates the
  # version's resource, which it replaces when guardrail_arn changes; no
  # other argument the body writes creates one. The version therefore
  # names, in replace_triggered_by, the guardrail's messages and each of its
  # policies: a change Terraform plans to any of them replaces the version
  # (the Terraform language's lifecycle meta-argument). The guardrail itself
  # changes in place, the provider replacing it for no argument this body
  # writes, and the version, which names it, is created after the
  # guardrail's update. Under create_before_destroy Terraform creates the
  # new version before deleting the old one, which DeleteGuardrail with a
  # version deletes alone; a caller still naming the old number then names
  # a version that no longer exists. A change of kms_key_id or tags alone
  # replaces no version. That Terraform plans the replacement for each such
  # change is what the Terraform language documents for
  # replace_triggered_by, and is not measured against an account.
  #
  # The name. The guardrail is named after the component, whose name is the
  # module's too. Renaming the component renames the module, so Terraform
  # deletes the old guardrail and creates a new one under the new name,
  # unordered, and consumers read new IDs.
  #
  # Deletion. A destroy, or removing the component, deletes the version and
  # then the guardrail, which deletes all of its versions (DeleteGuardrail).
  # A guardrail holds no data, so this Recipe configures no backup and
  # declares no native backup.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Bedrock guardrail publishes no address of its own: a caller reaches the Amazon Bedrock runtime endpoint in its Region and names the guardrail by guardrail_id and its version by guardrail_version: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k (list "kms_key_id" "tags")) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # kms_key_id the ARN of a KMS key, of at most 2,048 characters, the form
    # GetGuardrail returns; tags the map of strings Amazon Bedrock's Tag
    # takes. The override keys are spelt for this target, so the checks sit
    # in this Recipe and not in the realization-neutral Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (le (len $o.kms_key_id) 2048) (regexMatch `^arn:aws(-[^:]+)?:kms:[a-zA-Z0-9-]*:[0-9]{12}:key/[a-zA-Z0-9-]{36}$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and the AWS provider reads a guardrail's KMS key back as the key's ARN, arn:aws:kms:<region>:<account>:key/ followed by the key's 36-character ID, so another form changes at every plan: set it to such an ARN in the Release, or remove it to encrypt with a key AWS manages" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the guardrail takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- range $k, $v := $g -}}
      {{- if not (and (regexMatch `^[a-zA-Z0-9\s._:/=+@-]{1,128}$` $k) (regexMatch `^[a-zA-Z0-9\s._:/=+@-]{0,256}$` $v)) -}}
      {{- fail (printf "infra.overrides.tags holds %s: %s, and Amazon Bedrock takes a tag name of 1 to 128 and a value of at most 256 letters, digits, spaces and the characters . _ : / = + @ -: correct it in the Release" (toJson $k) (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Amazon Bedrock Guardrails module. The resources are named this, since
  # each component's body renders into a module directory of its own. The
  # values reach it as the Component's schema and assertions hold them: the
  # Component's keys inside each policy are the provider's own argument and
  # block names, so each policy is written as a block of its name, each
  # list entry as a block of the list's name, and each key of an entry as
  # the argument of its name. Each string the Aggregate or the Release gives
  # reaches Amazon Bedrock as written: Terraform would read ${ and %{ inside
  # a string as the start of an interpolation or a directive, so they are
  # written $${ and %%{, which Terraform turns back into the characters
  # written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_bedrock_guardrail" "this" {
        name                      = "{{ .context.instance_id }}"
        blocked_input_messaging   = {{ toJson .values.blocked_input_messaging | replace "${" "$${" | replace "%{" "%%{" }}
        blocked_outputs_messaging = {{ toJson .values.blocked_outputs_messaging | replace "${" "$${" | replace "%{" "%%{" }}
        {{- range $p := list "content_policy_config" "topic_policy_config" "word_policy_config" "sensitive_information_policy_config" "contextual_grounding_policy_config" }}
        {{- if hasKey $.values $p }}

        {{ $p }} {
          {{- range $l, $items := get $.values $p }}
          {{- range $items }}
          {{ $l }} {
            {{- range $f, $v := . }}
            {{ $f }} = {{ toJson $v | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
          }
          {{- end }}
          {{- end }}
        }
        {{- end }}
        {{- end }}
        {{- if or (hasKey $o "kms_key_id") (hasKey $o "tags") }}

        ## ── Provider-specific overrides ──────────────────────────
        {{- with optional $o "kms_key_id" "" }}
        kms_key_arn = {{ toJson . }}
        {{- end }}
        {{- with optional $o "tags" "" }}
        tags        = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- end }}
      }

      resource "aws_bedrock_guardrail_version" "this" {
        guardrail_arn = aws_bedrock_guardrail.this.guardrail_arn

        # A version is a snapshot of the guardrail's draft, so a change of a
        # message or a policy takes a new one, created before the old one is
        # deleted.
        lifecycle {
          create_before_destroy = true
          replace_triggered_by = [
            aws_bedrock_guardrail.this.blocked_input_messaging,
            aws_bedrock_guardrail.this.blocked_outputs_messaging,
            aws_bedrock_guardrail.this.content_policy_config,
            aws_bedrock_guardrail.this.topic_policy_config,
            aws_bedrock_guardrail.this.word_policy_config,
            aws_bedrock_guardrail.this.sensitive_information_policy_config,
            aws_bedrock_guardrail.this.contextual_grounding_policy_config,
          ]
        }
      }

      output "guardrail_id" {
        value = aws_bedrock_guardrail.this.guardrail_id
      }

      output "guardrail_version" {
        value = aws_bedrock_guardrail_version.this.version
      }

      output "arn" {
        value = aws_bedrock_guardrail.this.guardrail_arn
      }
