apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sqs
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # SQS module: the third-party code this Recipe pins and writes into the
  # output. The queue it provisions is a service the reader contracts for
  # directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon SQS, realized by the published SQS module of the
    terraform-aws-modules project, terraform-aws-modules/sqs/aws at v5.2.2,
    Apache-2.0, fetched from its git repository at that tag and pinned by
    the commit it names in the entity.lock beside this Recipe: one queue
    named after the component, with .fifo appended on a FIFO queue, carrying
    every value of the Component. queue_url and arn publish the module's
    outputs, as Terraform references that resolve for a consumer authored as
    a source: Recipe in the same root configuration.

    SQS encrypts the queue with keys it owns, or with the operator's KMS
    key where kms_key_id names one, and tags label it. The module's
    dead-letter queue and queue policy stay off, and no key or role is
    created. A destroy, or removing the queue from the configuration,
    deletes the queue with every message it holds.

    infra.overrides.host halts the build, since a client reaches every
    queue at SQS's endpoint in its Region and names the queue by its URL, as
    do a kms_key_id SQS cannot take, tags that are not a map of strings and
    any infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/sqs:1.0.0

  # The published module, at the tag the registry publishes as version 5.2.2.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ and wrappers/ directories are vendored
  # with it and never loaded, since nothing the root declares reaches them.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-sqs.git
    ref: v5.2.2

  locals:
    # The queue's name: the instance's name, followed by .fifo on a FIFO
    # queue, as SQS requires of a FIFO queue's name. The module trims a .fifo
    # suffix from its name input and appends it again on a FIFO queue, so the
    # name passed is the name the queue takes. The Component's assertion holds
    # the instance's name to SQS's rule for a queue name, the suffix counted.
    queue_name: '{{ .context.instance_id }}{{ if .values.fifo_queue }}.fifo{{ end }}'

  # The String Pipe: the compiler does not interpret these strings. queue_url
  # and arn name the module's queue_url and queue_arn outputs, the queue's URL
  # and ARN, through this component's module call, which the boundary's root
  # configuration declares under .context.instance_id for a component
  # declared in the Aggregate the Release deploys. Terraform resolves them at
  # apply time, so they resolve only for a consumer authored as a source:
  # Recipe in the same root configuration, which, reading either, is applied
  # after the queue; a consumer on another target receives them as text.
  provides:
    queue_url: "${module.{{ .context.instance_id }}.queue_url}"
    arn: "${module.{{ .context.instance_id }}.queue_arn}"

  # This Recipe reads from infra.overrides:
  #   kms_key_id - string (kms_master_key_id)
  #   tags       - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # kms_key_id and tags are the keys, under the same names, that the
  # catalog's terraform AWS Recipes read for the KMS key a resource is
  # encrypted with and for its tags, so a Release names each once whichever
  # Recipe it configures.
  #
  # kms_key_id names the operator's KMS key, set as the module's
  # kms_master_key_id, by one of the forms SQS takes for KmsMasterKeyId (the
  # CreateQueue API reference, which refers to KMS's KeyId): a key ID (a UUID,
  # or mrk- and 32 hexadecimal digits for a multi-Region key), an alias name
  # (alias/ followed by its name), or the ARN of a key or of an alias. The AWS
  # provider passes the string to SQS unchecked, so a value of another form
  # halts the build here rather than at apply. The queue is then encrypted
  # with SSE-KMS under that key, and SQS reuses a data key for 300 seconds,
  # the service's default, before calling KMS again. The key, and its key
  # policy, which lets the queue's producers and consumers use it, are the
  # operator's, named here and never created. Unset, the module's
  # sqs_managed_sse_enabled keeps its default, true, and SQS encrypts the
  # queue with keys it owns (SSE-SQS); with a key named, the module leaves it
  # unset, since a queue takes one of the two.
  #
  # tags is a map from each tag name to a string, written on the queue, the
  # one resource the module creates here, as the module writes it: the module
  # adds no tag of its own.
  #
  # host is refused by name. SQS publishes no address of a queue of its own:
  # a client calls SQS's endpoint in the queue's Region, an endpoint the
  # service names and offers no custom domain for, and names the queue by its
  # URL in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.fifo_queue (fifo_queue, and the .fifo suffix on the
  #     name), values.content_based_deduplication
  #     (content_based_deduplication, on a FIFO queue),
  #     values.visibility_timeout (visibility_timeout_seconds),
  #     values.message_retention_period (message_retention_seconds),
  #     values.delay_seconds (delay_seconds), values.maximum_message_size
  #     (max_message_size), values.receive_message_wait_time_seconds
  #     (receive_wait_time_seconds), and the overrides above.
  #   refused — a kms_key_id of another form; tags that are not a map of
  #     strings; infra.overrides.host; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the component's name, which names the queue,
  #     and values.content_based_deduplication true on a standard queue.
  #   not read — none; the Component declares no other value or infra key.
  #
  # Each value is written, so the queue takes the Component's value rather
  # than the AWS provider's default where the two differ: the provider
  # defaults max_message_size to 262,144 bytes, where SQS, and the
  # Component, take 1,048,576.
  #
  # The name and the queue's type. SQS fixes both when it creates the queue,
  # and the AWS provider replaces the queue when either changes. Renaming the
  # component, or changing values.fifo_queue, which moves the name to or from
  # its .fifo suffix, makes Terraform delete the old queue, with every message
  # it holds, and create a new one under the new name.
  #
  # The module's toggles that would create something beyond the queue are
  # written off: create_dlq, its dead-letter queue, and create_queue_policy,
  # a queue policy. With create_dlq off, the module creates no redrive policy
  # and no redrive allow policy either, since both inputs keep their empty
  # defaults. The module's other defaults stand: the exact name rather than
  # a name prefix, no high-throughput setting on a FIFO queue
  # (deduplication_scope, fifo_throughput_limit), so SQS keeps its normal
  # throughput, and the Region of the AWS provider the root configures. Its
  # data sources for the Region, the caller's account and the partition read
  # and create nothing.
  #
  # Deletion. A destroy, or removing the component, deletes the queue, and
  # SQS deletes every message in it, regardless of the queue's contents (the
  # DeleteQueue API reference); SQS keeps no backup to restore it from, and
  # refuses a queue under a name deleted less than 60 seconds before.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon SQS publishes no address of a queue: a client calls SQS's endpoint in the queue's Region, which offers no custom domain, and names the queue by queue_url: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # kms_key_id is passed to the module's kms_master_key_id in one of the
    # forms SQS takes for it, and tags as the map of strings the module's tags
    # input is typed as.
    # The same KMS key form check stands in the SQS and SNS Recipes of both
    # targets (terraform/sns, cloudformation/sqs, cloudformation/sns): the override key is spelt differently per
    # target, so the check cannot sit in the realization-neutral Component,
    # and a MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9:/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/\S+)$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and SQS takes the KMS key a queue is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to encrypt the queue with keys SQS owns" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # values reach the mapping as the Component's schema holds them: each
  # integer within the range SQS takes, each written as a whole number.
  # fifo_queue is written on every queue, false on a standard one, which the
  # module and the AWS provider default to; content_based_deduplication on a
  # FIFO queue alone, since SQS takes it on a FIFO queue alone.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    name: "{{ .locals.queue_name }}"
    fifo_queue: {{ .values.fifo_queue }}
    {{- if .values.fifo_queue }}
    content_based_deduplication: {{ .values.content_based_deduplication }}
    {{- end }}
    visibility_timeout_seconds: {{ int64 .values.visibility_timeout }}
    message_retention_seconds: {{ int64 .values.message_retention_period }}
    delay_seconds: {{ int64 .values.delay_seconds }}
    max_message_size: {{ int64 .values.maximum_message_size }}
    receive_wait_time_seconds: {{ int64 .values.receive_message_wait_time_seconds }}
    create_dlq: false
    create_queue_policy: false
    {{- with optional $o "kms_key_id" "" }}
    kms_master_key_id: {{ toJson . }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
