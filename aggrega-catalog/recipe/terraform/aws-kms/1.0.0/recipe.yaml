apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: aws-kms
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # KMS module: the third-party code this Recipe pins and writes into the
  # output. The key it provisions is a service the reader contracts for
  # directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    AWS KMS, realized by the published KMS module of the
    terraform-aws-modules project, terraform-aws-modules/kms/aws at v4.2.2,
    Apache-2.0, fetched from its git repository at that tag and pinned by
    the commit it names in the entity.lock beside this Recipe: one KMS key of
    the component's key spec and key usage, and its alias where the
    Aggregate sets alias_name. No grant, replica or external key, role or
    policy beyond the key's own key policy is created.

    key_id and arn publish the module's key_id and key_arn outputs, as
    Terraform references that resolve for a consumer authored as a source:
    Recipe in the same root configuration. The key policy is
    infra.overrides.policy where the Release sets it, else the module's one
    statement giving the account that owns the key every KMS action, as
    KMS's default key policy does; the lockout safety check is never
    bypassed.

    enable_key_rotation turns on yearly rotation, deletion_window_in_days
    sets the days KMS waits before deleting a destroyed key, 30 unless set,
    and tags label the key. A destroy, renaming the component, or changing
    key_spec or key_usage schedules the key's deletion. An ML-KEM key spec,
    which the AWS provider at 6.74.0 and earlier does not take, rotation not a boolean or on a key
    other than a symmetric encryption key, a waiting period outside 7 to 30
    days, a policy that is not a mapping, tags not a map of strings,
    infra.overrides.host, and any infra.overrides key not listed halt the
    build naming the key.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/security/aws-kms:1.0.0

  # The published module, at the tag the registry publishes as version 4.2.2.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ and wrappers/ directories are vendored
  # with it and never loaded, since nothing the root declares reaches them.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-kms.git
    ref: v4.2.2

  # The String Pipe: the compiler does not interpret these strings. key_id
  # and arn name the module's key_id and key_arn outputs, through this
  # component's module call, which the boundary's root configuration declares
  # under .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves them at apply time, so they resolve
  # only for a consumer authored as a source: Recipe in the same root
  # configuration, which is applied after the key; a consumer on another
  # target receives them as text. No address is published: a client calls
  # the KMS endpoint of the key's Region and names the key by its ID, its ARN
  # or its alias.
  provides:
    key_id: "${module.{{ .context.instance_id }}.key_id}"
    arn: "${module.{{ .context.instance_id }}.key_arn}"

  # This Recipe reads from infra.overrides:
  #   enable_key_rotation     - boolean (enable_key_rotation)
  #   deletion_window_in_days - integer (deletion_window_in_days)
  #   policy                  - object (policy, as JSON text), the key policy document
  #   tags                    - map[string]string (tags)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # enable_key_rotation and deletion_window_in_days are named by the module
  # inputs they set. policy is the name the catalog's terraform Recipes read
  # for a resource policy document, here the module's policy input, and tags
  # the key, under the same name, that the catalog's terraform Recipes for
  # AWS read for a resource's tags, so a Release names each once whichever
  # Recipe it configures.
  #
  # enable_key_rotation is true or false, false unless set, and the mapping
  # writes it either way: the module turns rotation on unless told
  # otherwise, while KMS leaves it off, so writing false keeps the key as
  # KMS creates it and as the CloudFormation Recipe of this Component does.
  # True turns on automatic rotation: KMS creates new key material for the
  # key every 365 days from the day rotation is turned on, keeps every
  # earlier key material to decrypt what it encrypted, and the key keeps its
  # ID and ARN ("Rotate AWS KMS keys"). KMS rotates a symmetric encryption
  # key whose key material it generates alone; an HMAC or asymmetric key is
  # rotated by creating another key, and KMS refuses to turn rotation on for
  # one, which the AWS provider asks of it only at apply, so true with a
  # key_spec other than SYMMETRIC_DEFAULT halts here instead.
  #
  # deletion_window_in_days is the number of days, 7 to 30, that KMS waits
  # before deleting the key once Terraform schedules its deletion, the range
  # the AWS provider validates and the "Delete an AWS KMS key" page gives;
  # unset, the mapping writes none, the provider sends none and KMS waits 30
  # days, its default. It is read when the key is destroyed, not when it is
  # created, so changing it changes nothing in AWS until then.
  #
  # policy is the operator's key policy, written as a mapping, the JSON
  # policy document in YAML or JSON form, with its Version and Statement
  # keys, and passed to the module as JSON text, which the module writes as
  # the key's policy as it stands; this Recipe adds no statement of its own
  # to it. The text reaches KMS exactly as written: Terraform would read ${
  # and %{ inside a string as the start of an interpolation or a directive,
  # so the mapping writes ${ as $${, which Terraform turns back into the
  # characters written; the terraform provider writes every module argument
  # with %{ already escaped as %%{, so the mapping leaves %{ as it is. An
  # IAM policy variable such as ${aws:username} is written in the Release as
  # it is in any policy. Unset,
  # the module writes the key policy it builds from its statement inputs,
  # with enable_default_policy, written true, its only statement: Sid
  # "Default", allowing the account principal
  # arn:<partition>:iam::<account>:root, the AWS account the AWS provider
  # runs as, every action (kms:*) on the key, with the partition and account
  # the module reads at plan. That is the one statement of KMS's default key
  # policy ("Default key policy") under another Sid, so the account's IAM
  # policies grant access to the key and the account's administrators keep
  # control of it; every other statement input of the module (key owners,
  # administrators, users, service users, key_statements, source and
  # override documents, the Route 53 DNSSEC statements) stays empty. The
  # mapping never writes bypass_policy_lockout_safety_check, so the AWS
  # provider sends false and KMS runs its policy lockout safety check: it
  # refuses, when the key is created or its policy changed, a key policy that
  # does not allow the principal making the request to call PutKeyPolicy on
  # the key later, so the policy cannot lock that principal out of the key. A
  # principal the policy names that does not exist, a statement without a
  # principal, and a policy longer than 32,768 characters are refused by KMS
  # at apply.
  #
  # tags is a map from each tag name to a string, written on the key, the
  # one resource the module creates here that takes tags: a KMS alias takes
  # none.
  #
  # host is not read: the Component publishes no address, since a client
  # reaches every key through the KMS endpoint of its Region and KMS offers
  # no custom domain, so infra.overrides.host halts the build naming it.
  #
  # The key spec. The AWS provider validates customer_master_key_spec and
  # key_usage against the key specs and key usages its AWS SDK lists, which
  # at 6.73.0 and at 6.74.0 name no ML-KEM key spec (ML_KEM_512, ML_KEM_768,
  # ML_KEM_1024) and not ENCAPSULATE_DECAPSULATE, the usage such a key takes;
  # so an ML-KEM key_spec, which the Component admits and KMS creates, halts
  # here by name rather than at plan. The CloudFormation Recipe of this
  # Component creates one. The module's key_spec input sets an external key
  # alone, which this Recipe does not create; the key's spec is
  # customer_master_key_spec.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.key_spec, as customer_master_key_spec;
  #     values.key_usage, as key_usage; values.alias_name, without its
  #     alias/ prefix, as the one entry of aliases, from which the module
  #     creates an alias alias/<name> targeting the key, while it is set; and
  #     the overrides above. The Component refuses a key usage the key spec
  #     does not take and an alias under alias/aws/, for every realization.
  #   refused — an ML-KEM key_spec; enable_key_rotation not a boolean, or
  #     true with a key_spec other than SYMMETRIC_DEFAULT;
  #     deletion_window_in_days not a whole number from 7 to 30; policy that
  #     is not a mapping; tags that are not a map of strings;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The CloudFormation Recipe of this Component holds the same rules on
  # EnableKeyRotation, PendingWindowInDays and policy: each target reads the
  # keys under its own spelling, so the rules cannot sit in the Component.
  #
  # What the mapping writes beside these: customer_master_key_spec and
  # key_usage, always, from the Component's values, and enable_key_rotation,
  # false unless set; the CloudFormation Recipe of this Component writes the
  # same, so both targets agree whatever their tools default to.
  # create_external, create_replica and create_replica_external are written
  # false, each the module's default, so the module creates the key of
  # aws_kms_key, key material KMS generates, and no external or replica key;
  # enable_default_policy is written true, the module's default, as set out
  # above. The module's other defaults stand: no grant (grants unset), no
  # alias beyond aliases (computed_aliases empty) and the alias named
  # exactly (aliases_use_name_prefix false); a single-Region key
  # (multi_region false), enabled, with no description, in the Region the
  # AWS provider is configured for; no custom key store; and, while
  # rotation is on, a rotation period of 365 days, KMS's.
  #
  # Deletion and replacement. A destroy, or removing the component, deletes
  # the alias and schedules the key's deletion: the key is in the Pending
  # deletion state, in which it encrypts and decrypts nothing, for
  # deletion_window_in_days days, after which KMS deletes it, and data
  # encrypted under it can no longer be decrypted. Within the waiting period
  # the deletion is cancelled through KMS itself, its CancelKeyDeletion
  # operation or its console, and the key is then imported back into the
  # Terraform state or left outside it. customer_master_key_spec and
  # key_usage force a new key in the AWS provider, so changing key_spec or
  # key_usage on a key that exists makes Terraform schedule the old key's
  # deletion and create a new key, with a new ID and ARN, that its alias then
  # names; data encrypted under the old key can no longer be decrypted once
  # the waiting period ends. Renaming the component, which changes the
  # module's address, does the same. Terraform orders nothing between the
  # deletion of the old alias and the creation of a new one of the same
  # name, which KMS refuses while the old one exists, so a rename keeping
  # alias_name can fail the apply on the alias; a second apply completes it.
  # enable_key_rotation, policy and tags change
  # in place; changing alias_name deletes the old alias and creates the new
  # one, and unsetting it deletes the alias; the key stays.
  #
  # Credentials. A KMS key holds no credential a consumer presents: a client
  # calls KMS with its own AWS credentials, which the key policy and the
  # account's IAM policies admit, so nothing is published but the key's ID
  # and ARN. Backup. KMS keeps no data of this key's beyond its key material,
  # which never leaves KMS unencrypted, so no backup is configured.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "enable_key_rotation" "deletion_window_in_days" "policy" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a KMS key has no address of its own: a client calls the KMS endpoint of the key's Region and names the key by its ID, ARN or alias, and KMS offers no custom domain: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads enable_key_rotation, deletion_window_in_days, policy and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The key specs and key usages the AWS provider validates
    # customer_master_key_spec and key_usage against, which name no ML-KEM
    # spec and not ENCAPSULATE_DECAPSULATE.
    key_spec_supported: >-
      {{- $spec := toString .values.key_spec -}}
      {{- if or (hasPrefix "ML_KEM_" $spec) (eq (toString .values.key_usage) "ENCAPSULATE_DECAPSULATE") -}}
      {{- fail (printf "values.key_spec is %s, and the AWS provider, at 6.74.0 and earlier, takes no ML-KEM key spec for a KMS key, nor the key usage ENCAPSULATE_DECAPSULATE such a key takes: choose another values.key_spec in the Aggregate, or route this component to the CloudFormation Recipe of AWS KMS, which creates ML-KEM keys" $spec) -}}
      {{- end -}}
    # enable_key_rotation is written to the module as a boolean, and KMS
    # rotates a symmetric encryption key alone.
    key_rotation: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "enable_key_rotation" -}}
      {{- if not (kindIs "bool" $o.enable_key_rotation) -}}
      {{- fail (printf "infra.overrides.enable_key_rotation is %s, and a KMS key takes true or false for its automatic rotation: set it to true or false in the Release, or remove it to leave rotation off" (toJson $o.enable_key_rotation)) -}}
      {{- end -}}
      {{- if and $o.enable_key_rotation (ne (toString .values.key_spec) "SYMMETRIC_DEFAULT") -}}
      {{- fail (printf "infra.overrides.enable_key_rotation is true while values.key_spec is %s, and AWS KMS rotates a symmetric encryption key, SYMMETRIC_DEFAULT, alone: an HMAC or asymmetric key is rotated by creating another key. Remove enable_key_rotation from the Release, or set it to false" (toString .values.key_spec)) -}}
      {{- end -}}
      {{- end -}}
    # deletion_window_in_days, the waiting period the AWS provider and KMS
    # take: a whole number of days from 7 to 30.
    deletion_window: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "deletion_window_in_days" -}}
      {{- $v := $o.deletion_window_in_days -}}
      {{- $ok := and (not (typeIs "string" $v)) (regexMatch `^[0-9]+$` (toString $v)) -}}
      {{- if $ok }}{{ $ok = and (ge (int $v) 7) (le (int $v) 30) }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.deletion_window_in_days is %s, and AWS KMS waits a whole number of days from 7 to 30 before deleting a key: set it to one in the Release, or remove it to wait 30 days" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
    # policy is passed to the module as a policy document.
    key_policy: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "policy" -}}
      {{- if not (and (kindIs "map" $o.policy) $o.policy) -}}
      {{- fail (printf "infra.overrides.policy is %s, and it is the key policy document, written as a mapping with its Version and Statement keys: set infra.overrides.policy in the Release to the policy document as a mapping, or remove it for the account's default statement" (toJson $o.policy)) -}}
      {{- end -}}
      {{- end -}}
    # tags is passed as the map of strings the module's tags input is typed
    # as.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input.
  # Each tag reaches KMS as written: the root configuration writes a module
  # argument's %{ as %%{ itself and keeps ${, which a reference to another
  # module's output needs, so ${ inside a tag is written $${ here, which
  # Terraform turns back into the characters written.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    customer_master_key_spec: {{ toJson .values.key_spec }}
    key_usage: {{ toJson .values.key_usage }}
    enable_key_rotation: {{ if optional $o "enable_key_rotation" false }}true{{ else }}false{{ end }}
    enable_default_policy: true
    create_external: false
    create_replica: false
    create_replica_external: false
    {{- with optional .values "alias_name" "" }}
    aliases: {{ toJson (list (trimPrefix "alias/" .)) }}
    {{- end }}
    {{- if hasKey $o "deletion_window_in_days" }}
    deletion_window_in_days: {{ int $o.deletion_window_in_days }}
    {{- end }}
    {{- with optional $o "policy" "" }}
    policy: {{ toJson (replace "${" "$${" (toJson .)) }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}
