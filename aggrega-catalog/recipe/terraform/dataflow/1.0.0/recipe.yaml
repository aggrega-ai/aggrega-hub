apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dataflow
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Dataflow, rendered as an authored Terraform body, main.tf: one
    google_dataflow_flex_template_job of the instance's name, launched from
    infra.container_spec_gcs_path with values.parameters in the operator's
    project and region, its workers running as the operator's service
    account. job_id publishes an output of this component's module, which
    Terraform resolves when it applies. The published
    terraform-google-modules/dataflow/google module is not sourced: it
    admits a hashicorp/google or google-beta release below 7 alone, and the
    catalog's Google bodies install one from 8.8 below 9.

    The project, the template file, the network, the service account, the
    Cloud Storage locations and the KMS key are the operator's: none is
    created, nor any IAM binding. A batch job that finishes is launched
    again at the next apply; a destroy cancels the job.

    A project_id, region or service_account missing; a template file path,
    network, subnetwork, Cloud Storage location, key, machine type, worker
    count, IP configuration or Streaming Engine setting of another form; a
    network of another project or a subnet of another region; a parameter
    naming a launch option of Dataflow's own; an instance name
    Dataflow does not take for a job; and any infra.overrides key not
    listed halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/bigdata/dataflow:1.0.0

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this job, and resolves none of
  # it.
  #
  # job_id is a reference to the job_id output of this component's module
  # call: the body renders into the component's own module directory, and
  # the boundary's root configuration declares that directory as a module
  # block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The reference resolves only for a consumer
  # authored as a source: Recipe in the same Terraform root configuration,
  # which Terraform then applies after this module, once the job is
  # launched; a consumer on another target receives it as text. A job
  # launched again, as below, takes a new ID, which the next apply hands
  # such a consumer.
  provides:
    job_id: "${module.{{ .context.instance_id }}.job_id}"

  # This Recipe reads from infra.overrides:
  #   project_id              - string, required (project)
  #   region                  - string, required (region)
  #   service_account         - string, required (service_account_email)
  #   private_network         - string (network, as the network's name)
  #   subnetwork              - string (subnetwork, as its complete URL)
  #   temp_location           - string (temp_location)
  #   staging_location        - string (staging_location)
  #   kms_key_name            - string (kms_key_name)
  #   machine_type            - string (machine_type)
  #   max_workers             - integer (max_workers)
  #   num_workers             - integer (num_workers)
  #   ip_configuration        - string (ip_configuration)
  #   enable_streaming_engine - bool (enable_streaming_engine)
  #
  # project_id, region, private_network, subnetwork, service_account and
  # kms_key_name are the names the catalog's terraform Google Recipes read
  # for the project a resource is created in, the region it runs in, the VPC
  # network and subnet it joins, the identity it runs as and the
  # customer-managed key it is encrypted with; the others are the provider's
  # arguments.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Dataflow API is enabled; region is where
  # the job and its workers run, such as europe-west1; service_account is
  # the email of the service account the workers run as,
  # <name>@<project>.iam.gserviceaccount.com, which the operator grants the
  # Dataflow Worker role and access to what the pipeline reads and writes,
  # and which the identity applying the configuration needs leave to act
  # as. Unset, Dataflow would run the workers as the project's Compute Engine
  # default service account, so it is required. Each is a string with no
  # value this Recipe could choose for the operator, so each halts the build
  # when it is missing, and a service_account that is not such an email
  # halts.
  #
  # private_network is the network's resource link,
  # projects/<project>/global/networks/<name>, as the catalog's other Google
  # Recipes take it. Dataflow takes a network by its name in the job's
  # project (its page on specifying a network), so the body writes the name,
  # and a link of another form, or to a network of another project, halts: a
  # Shared VPC network of a host project is reached through subnetwork
  # alone. subnetwork is the subnet's resource name,
  # projects/<project>/regions/<region>/subnetworks/<name>; Dataflow takes a
  # subnet by its complete URL, the only form it takes for a Shared VPC
  # subnet, so the body writes
  # https://www.googleapis.com/compute/v1/ joined to it. Dataflow runs
  # workers in a subnet of the job's region alone, so a subnet of another
  # region halts, and so does a value of another form. With subnetwork set
  # Dataflow takes the network from it; with neither set, it uses the
  # project's network named default, and the launch fails where there is
  # none.
  #
  # temp_location and staging_location are gs:// paths in the operator's
  # bucket where the job keeps temporary files and stages its own; a value
  # that is not a gs:// path halts. Unset, temp_location takes
  # staging_location's value, and with neither set the template's SDK
  # chooses, which for a Java pipeline is a bucket Dataflow creates in the
  # project (Dataflow's reference of pipeline options).
  #
  # kms_key_name names the operator's Cloud KMS key the job's data at rest
  # is encrypted with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's argument takes; the project's Dataflow and
  # Compute Engine service agents may use it, which Dataflow checks when it
  # launches the job. Unset, Dataflow uses a key Google manages. A value of
  # another form halts.
  #
  # machine_type is the workers' Compute Engine machine type, such as
  # n2-standard-4; a value that is not such a name halts, and Dataflow
  # refuses one the region does not offer when it launches the job. Unset,
  # Dataflow chooses one for the job. max_workers is the most workers the
  # job scales to, 1 to 1000 (the provider's description of the argument),
  # and num_workers the number it starts with, 1 or more; a value that is
  # not such a whole number halts. Unset, Dataflow decides each.
  # ip_configuration is WORKER_IP_PRIVATE or WORKER_IP_PUBLIC (the
  # provider's validation of the argument), whether the workers take
  # internal addresses alone or external ones too; with WORKER_IP_PRIVATE a
  # worker reaches Google APIs through the subnet's Private Google Access,
  # which the operator turns on. Any other value halts; unset, the workers
  # take external addresses. enable_streaming_engine is true or false,
  # whether a streaming job runs its steps on Dataflow's Streaming Engine or
  # on the workers alone; any other value halts. Unset, Dataflow and the
  # template decide.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema, or not read:
  #   honoured — infra.container_spec_gcs_path, as the template file the job
  #     is launched from; values.parameters, as the job's parameters; and the
  #     overrides above.
  #   refused — a container_spec_gcs_path that is not a gs:// path;
  #     project_id, region or service_account missing or not a
  #     string, and a service_account that is not an email; a
  #     private_network of another form or another project; a subnetwork of
  #     another form or another region; a temp_location or staging_location
  #     that is not a gs:// path; a kms_key_name of another form; a
  #     machine_type, max_workers, num_workers, ip_configuration or
  #     enable_streaming_engine Dataflow does not take; a parameter naming a
  #     launch option of Dataflow's own; an instance name Dataflow does not
  #     take as a job's name; and any infra.overrides key not listed above.
  #   held by the Component's schema — container_spec_gcs_path, present;
  #     each parameter's value, a string.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: the instance's name as the job's; no
  # labels, autoscaling algorithm, additional experiments or pipeline
  # options, launcher machine type, SDK container image or transform name
  # mapping, so the template's and Dataflow's defaults hold; no on_delete,
  # so a destroy, or removing the component, cancels the job, the provider's
  # default: the job stops and the data it wrote stays where it is. The
  # provider's note on destroy and apply: a job exists for Terraform while it
  # has not reached a terminal state, so a batch job that finishes, or any
  # job that fails or is cancelled, is launched again at the next apply. A
  # change to any argument cancels a batch job and launches a new one; on a
  # streaming job it launches a replacement job that takes over the running
  # one's state, Dataflow's update of a job, which Dataflow refuses where the
  # change is not compatible with the running pipeline. The job's name is the
  # instance's, and Dataflow runs one active job of a name within a project
  # and region (the REST reference of a job), so two Releases deploying the
  # same instance name of one Aggregate into one project and region collide
  # when the second applies.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "region" "service_account" "private_network" "subnetwork" "temp_location" "staging_location" "kms_key_name" "machine_type" "max_workers" "num_workers" "ip_configuration" "enable_streaming_engine" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, region, service_account, private_network, subnetwork, temp_location, staging_location, kms_key_name, machine_type, max_workers, num_workers, ip_configuration and enable_streaming_engine from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    required_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "region" "service_account" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release launches its Dataflow job in the operator's own Google Cloud project, in a region the operator chooses, with workers running as a service account of the operator's, and this Recipe chooses none of them, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `^[^@\s/:]+@[^@\s/:]+\.gserviceaccount\.com$` $o.service_account) -}}
      {{- fail (printf "infra.overrides.service_account is %s, and Dataflow takes the service account its workers run as by its email, <name>@<project>.iam.gserviceaccount.com, with no prefix: set it to one in the Release" (toJson $o.service_account)) -}}
      {{- end -}}
    network_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "private_network" -}}
      {{- $n := $o.private_network -}}
      {{- if not (and (typeIs "string" $n) (regexMatch `^projects/[^/\s]+/global/networks/[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $n) (eq (index (splitList "/" $n) 1) (toString $o.project_id))) -}}
      {{- fail (printf "infra.overrides.private_network is %s, and Dataflow takes a network of the job's project by its name, which this Recipe writes from projects/%s/global/networks/<name>: set it to that form in the Release, or, for a Shared VPC network of another project, remove it and name the subnet in infra.overrides.subnetwork" (toJson $n) (toString $o.project_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "subnetwork" -}}
      {{- $s := $o.subnetwork -}}
      {{- if not (and (typeIs "string" $s) (regexMatch `^projects/[^/\s]+/regions/[^/\s]+/subnetworks/[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $s)) -}}
      {{- fail (printf "infra.overrides.subnetwork is %s, and this Recipe takes the subnet as its resource name, projects/<project>/regions/<region>/subnetworks/<name>, and writes the complete URL Dataflow takes: set it to that form in the Release" (toJson $s)) -}}
      {{- end -}}
      {{- if ne (index (splitList "/" $s) 3) (toString $o.region) -}}
      {{- fail (printf "infra.overrides.subnetwork is in the region %s, and Dataflow runs the job's workers in a subnet of the job's region, %s: name a subnet of that region in the Release" (index (splitList "/" $s) 3) (toString $o.region)) -}}
      {{- end -}}
      {{- end -}}
    locations_shape: >-
      {{- $t := .infra.container_spec_gcs_path -}}
      {{- if not (and (typeIs "string" $t) (regexMatch `^gs://[a-z0-9][a-z0-9._-]*[a-z0-9]/\S+$` $t)) -}}
      {{- fail (printf "infra.container_spec_gcs_path is %s, and Dataflow reads the Flex Template file a job is launched from at a Cloud Storage path, gs://<bucket>/<object>: set it to the template file's path in the Release" (toJson $t)) -}}
      {{- end -}}
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "temp_location" "staging_location" -}}
      {{- if hasKey $o $k -}}
      {{- $v := get $o $k -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^gs://[a-z0-9][a-z0-9._-]*[a-z0-9](/\S*)?$` $v)) -}}
      {{- fail (printf "infra.overrides.%s is %s, and Dataflow takes it as a Cloud Storage path, gs://<bucket>/<path>, in a bucket of the operator's: set it to one in the Release, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Dataflow takes the Cloud KMS key it encrypts a job's data with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
    workers_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "machine_type" -}}
      {{- if not (and (typeIs "string" $o.machine_type) (regexMatch `^[a-z][-a-z0-9]*[a-z0-9]$` $o.machine_type)) -}}
      {{- fail (printf "infra.overrides.machine_type is %s, and Dataflow takes the workers' machine type by its Compute Engine name, such as n2-standard-4: set it to one in the Release, or remove it to let Dataflow choose" (toJson $o.machine_type)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "max_workers" -}}
      {{- $m := $o.max_workers -}}
      {{- $whole := or (kindIs "int" $m) (kindIs "int64" $m) (and (kindIs "float64" $m) (eq (float64 (int64 $m)) $m)) -}}
      {{- if not (and $whole (ge (int64 $m) 1) (le (int64 $m) 1000)) -}}
      {{- fail (printf "infra.overrides.max_workers is %s, and Dataflow scales a job to 1 to 1000 workers: set it to a whole number in that range in the Release, or remove it to let Dataflow decide" (toJson $m)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "num_workers" -}}
      {{- $n := $o.num_workers -}}
      {{- $whole := or (kindIs "int" $n) (kindIs "int64" $n) (and (kindIs "float64" $n) (eq (float64 (int64 $n)) $n)) -}}
      {{- if not (and $whole (ge (int64 $n) 1)) -}}
      {{- fail (printf "infra.overrides.num_workers is %s, and it is the number of workers the job starts with, one or more: set it to a whole number of at least 1 in the Release, or remove it to let Dataflow decide" (toJson $n)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "ip_configuration" -}}
      {{- if not (has $o.ip_configuration (list "WORKER_IP_PRIVATE" "WORKER_IP_PUBLIC")) -}}
      {{- fail (printf "infra.overrides.ip_configuration is %s, and the google provider takes WORKER_IP_PRIVATE or WORKER_IP_PUBLIC for the workers' addresses: set it to one of them in the Release, or remove it for external addresses" (toJson $o.ip_configuration)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (hasKey $o "enable_streaming_engine") (not (kindIs "bool" $o.enable_streaming_engine)) -}}
      {{- fail (printf "infra.overrides.enable_streaming_engine is %s, and it turns Dataflow's Streaming Engine on or off for the job: set it to true or false in the Release, or remove it" (toJson $o.enable_streaming_engine)) -}}
      {{- end -}}
    # The google provider takes each of these names out of the parameters
    # and launches the job with it as a setting of the job's environment
    # (its handling of parameters, and its documentation: Dataflow options
    # are not configured in parameters), so a parameter of such a name
    # would set the job's network, identity, locations or workers from the
    # Aggregate, over the Release.
    parameters_not_options: >-
      {{- $options := list "autoscalingAlgorithm" "enableStreamingEngine" "ipConfiguration" "kmsKeyName" "launcherMachineType" "maxNumWorkers" "network" "numWorkers" "sdkContainerImage" "serviceAccountEmail" "stagingLocation" "subnetwork" "tempLocation" "workerMachineType" -}}
      {{- range $name, $_ := (default dict (optional .values "parameters" dict)) -}}
      {{- if has $name $options -}}
      {{- fail (printf "values.parameters names %s, a launch option of Dataflow's own, which the google provider takes out of the parameters and sets on the job's environment, over what the Release sets: remove it from the Aggregate; the Release sets the job's settings under infra.overrides" $name) -}}
      {{- end -}}
      {{- end -}}
    # The job takes the instance's name, and Dataflow takes a job name
    # matching [a-z]([-a-z0-9]{0,1022}[a-z0-9])? (the REST reference of a
    # job); the Aggregate already holds an instance's name to letters,
    # digits, underscores and hyphens.
    job_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[a-z]([-a-z0-9]*[a-z0-9])?$` $n) (le (len $n) 1024)) -}}
      {{- fail (printf "the job takes the instance's name, %q, and Dataflow takes a job name of 1 to 1024 lowercase letters, digits and hyphens, beginning with a letter and ending with a letter or a digit: rename the instance in the Aggregate" $n) -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: the published dataflow module's
  # modules declare hashicorp/google or google-beta below 7, which no release
  # satisfies beside the catalog's constraint, so their init fails;
  # google_dataflow_flex_template_job is a hashicorp/google type. The
  # resource is named this, since each component's body renders into a
  # module directory of its own. Each string the Release or the Aggregate
  # gives reaches Dataflow as written, a parameter's name and value
  # included: Terraform would read ${ and %{ inside a string as the start
  # of an interpolation or a directive, so they are written $${ and %%{,
  # which Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $params := default dict (optional .values "parameters" dict) -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_dataflow_flex_template_job" "this" {
        name                    = "{{ .context.instance_id }}"
        container_spec_gcs_path = {{ toJson .infra.container_spec_gcs_path | replace "${" "$${" | replace "%{" "%%{" }}
        {{- if $params }}

        parameters = {
          {{- range $name, $value := $params }}
          {{ toJson $name | replace "${" "$${" | replace "%{" "%%{" }} = {{ toJson $value | replace "${" "$${" | replace "%{" "%%{" }}
          {{- end }}
        }
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        project               = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        region                = {{ toJson $o.region | replace "${" "$${" | replace "%{" "%%{" }}
        service_account_email = {{ toJson $o.service_account | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "private_network" "" }}
        network               = "{{ index (splitList "/" .) 4 }}"
        {{- end }}
        {{- with optional $o "subnetwork" "" }}
        subnetwork            = {{ printf "https://www.googleapis.com/compute/v1/%s" . | toJson | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with optional $o "temp_location" "" }}
        temp_location         = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with optional $o "staging_location" "" }}
        staging_location      = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with optional $o "kms_key_name" "" }}
        kms_key_name          = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with optional $o "machine_type" "" }}
        machine_type          = "{{ . }}"
        {{- end }}
        {{- if hasKey $o "max_workers" }}
        max_workers           = {{ int64 $o.max_workers }}
        {{- end }}
        {{- if hasKey $o "num_workers" }}
        num_workers           = {{ int64 $o.num_workers }}
        {{- end }}
        {{- with optional $o "ip_configuration" "" }}
        ip_configuration      = "{{ . }}"
        {{- end }}
        {{- if hasKey $o "enable_streaming_engine" }}
        enable_streaming_engine = {{ $o.enable_streaming_engine }}
        {{- end }}
      }

      output "job_id" {
        value = google_dataflow_flex_template_job.this.job_id
      }
