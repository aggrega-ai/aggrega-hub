apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: step-functions
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # Step Functions module: the third-party code this Recipe pins and writes
  # into the output. The state machine it declares is a service the reader
  # contracts for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    AWS Step Functions, realized by the terraform-aws-modules project's Step
    Functions module, terraform-aws-modules/step-functions/aws at v5.1.1,
    Apache-2.0, fetched from its git repository at that tag and pinned by the
    commit it names in the entity.lock beside this Recipe: one state machine
    named after the component, running the definition and of the type its
    values set, as the IAM role role_arn names. arn publishes the state
    machine's ARN as a Terraform reference that resolves for a consumer
    authored as a source: Recipe in the same root configuration.

    Step Functions encrypts the definition and execution history with keys
    AWS owns, and adds the operator's KMS key where kms_key_id names one; it
    logs executions to the operator's log group, which
    cloudwatch_log_group_name names, where logging_configuration sets a
    level, and tags label the state machine. No role, log group or key is
    created. Changing values.state_machine_type destroys the state machine
    and creates it again; renaming the component destroys it under the old
    name and creates one under the new. Removing logging_configuration
    leaves a deployed state machine's logging as it is.

    A role_arn not set or other than a role's ARN halts the build, as do a
    kms_key_id other than a KMS key's ARN, a logging_configuration
    outside the shape the module takes or at level OFF, a log group name
    missing beside it or set without it, tags that are not a map of strings,
    infra.overrides.host and any infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-pipeline/step-functions:1.0.0

  # The published module, at the tag the registry publishes as version 5.1.1.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which declares the state machine,
  # its optional role and policies and its optional log group, and calls no
  # module: its examples/ directory is vendored with it and never loaded. So
  # initialising it fetches providers and nothing else.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-step-functions.git
    ref: v5.1.1

  # The String Pipe: the compiler does not interpret this string. arn names
  # the module's state_machine_arn output, the AWS provider's arn of the
  # state machine, through this component's module call, which the
  # boundary's root configuration declares under .context.instance_id for a
  # component declared in the Aggregate the Release deploys. Terraform
  # resolves it at apply time, so it resolves only for a consumer authored as
  # a source: Recipe in the same root configuration, which, reading it, is
  # applied after the state machine; a consumer on another target receives
  # it as text.
  provides:
    arn: "${module.{{ .context.instance_id }}.state_machine_arn}"

  # This Recipe reads from infra.overrides:
  #   role_arn                  - string, required (role_arn, with
  #                               use_existing_role true)
  #   logging_configuration     - map (logging_configuration)
  #   cloudwatch_log_group_name - string (cloudwatch_log_group_name, with
  #                               use_existing_cloudwatch_log_group true)
  #   kms_key_id                - string (encryption_configuration.kms_key_id,
  #                               with type CUSTOMER_MANAGED_KMS_KEY)
  #   tags                      - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # role_arn, kms_key_id and tags are the keys, under the same names, that
  # the catalog's terraform AWS Recipes read for the IAM role a service
  # assumes, for the KMS key a resource is encrypted with and for its tags,
  # so a Release names each once whichever Recipe it configures;
  # logging_configuration and cloudwatch_log_group_name are the module's
  # inputs of the same names.
  #
  # role_arn names the IAM role Step Functions assumes to run the state
  # machine's states, as the ARN of a role,
  # arn:<partition>:iam::<account>:role/ followed by its path and name, at
  # most 256 characters (the API Reference's CreateStateMachine), and is
  # required: the AWS provider requires role_arn, and a state machine calls
  # every service its definition names as that role. The role, with a trust
  # policy letting Step Functions assume it and the permissions its states
  # need, is the operator's, named here and never created. Changing it
  # updates the state machine in place.
  #
  # kms_key_id names the operator's symmetric KMS key by the key's ARN,
  # arn:<partition>:kms:<region>:<account>:key/ followed by the key's ID. Step
  # Functions takes an alias, an alias ARN and a key ID as well (the API
  # Reference's EncryptionConfiguration: "An alias, alias ARN, key ID, or key
  # ARN"), but on every update that changes the key the AWS provider waits
  # until DescribeStateMachine returns exactly the string configured, one
  # minute by default, and fails the apply when it does not (aws provider
  # 6.73.0), so a key named in any other form can fail the apply; the
  # provider's own acceptance tests take an update through the key's ARN
  # alone, and this Recipe admits that form alone, so an alias, an alias ARN
  # or a key ID halts the build. Step Functions then adds a layer of encryption under that key over the one it
  # always applies with keys AWS owns, encrypting the definition and the
  # execution history (the AWS Step Functions Developer Guide's "Data at rest
  # encryption"), and reuses a data key for 300 seconds, the service's
  # default, before calling KMS again. That page lists the permissions:
  # kms:DescribeKey and kms:GenerateDataKey for the identity creating or
  # updating the state machine; kms:Decrypt and kms:GenerateDataKey for the
  # role role_arn names, to run a Standard or asynchronous Express
  # execution, and kms:Decrypt to run a synchronous Express one; and, while
  # logging is on, kms:Decrypt for delivery.logs.amazonaws.com in the key's
  # policy and kms:GenerateDataKey for the role. It also says that while the
  # key is disabled, or deleted or scheduled for deletion, running
  # executions fail and new ones cannot start. The key is the operator's,
  # named here and never created. Unset, this Recipe passes type
  # AWS_OWNED_KEY, the encryption Step Functions always applies, so removing
  # kms_key_id from a deployed state machine takes the key away. Setting,
  # changing or removing it updates the state machine in place (aws provider
  # 6.73.0: kms_key_id forces no new resource).   #
  # logging_configuration is the module's map of the state machine's logging:
  # level, one of ALL, ERROR and FATAL, the events each logs being those the
  # Developer Guide's "Log levels" table lists, and include_execution_data,
  # a boolean, whether the input and output of each event are logged.
  # cloudwatch_log_group_name names the operator's log group, by its name,
  # which logging needs and which is read only beside a level. While
  # logging_configuration is set, the module reads the log group by that
  # name as a data source when Terraform plans, so the group exists by
  # then, and writes its ARN followed by :* as the destination, the form
  # Step Functions takes (the API Reference's CloudWatchLogsLogGroup: "The
  # ARN must end with :*"). The module writes no logging configuration for
  # level OFF, or for a map without a level, so level OFF halts the build,
  # as do a log_destination entry, which the log group's name already
  # gives, a logging_configuration outside this shape, a missing or
  # malformed cloudwatch_log_group_name beside it, and a
  # cloudwatch_log_group_name without it. The log group and the permissions
  # logging needs are the operator's, named here and never created: the role
  # role_arn names needs the CloudWatch Logs actions the Developer Guide's
  # "Using CloudWatch Logs to log execution history in Step Functions" lists,
  # logs:CreateLogDelivery among them, on every resource, and that page
  # advises a log group name beginning /aws/vendedlogs/states, so that
  # CloudWatch Logs' resource policy stays within its 5,120-character limit.
  # An Express state machine records its executions nowhere else (the
  # Developer Guide's "Choosing workflow type in Step Functions": "Execution
  # history is not captured by Step Functions"). Setting or changing logging
  # updates the state machine in place. Removing logging_configuration from
  # a Release whose state machine already logs does not turn its logging
  # off: the module then writes no logging block, and the AWS provider keeps
  # a deployed logging configuration the configuration leaves out (aws
  # provider 6.73.0: logging_configuration suppresses the difference when the
  # block is absent), so turning a deployed state machine's logging off is
  # the operator's, outside the Release.
  #
  # tags is a map from each tag name to a string, written on the state
  # machine, the one resource the module creates here, beside the tag Name,
  # holding the state machine's name, which the module adds and a tag of the
  # same name in tags replaces.
  #
  # host is refused by name. A state machine publishes no address of its
  # own: a caller reaches the Step Functions endpoint in the state machine's
  # Region, which the service names, and names the state machine by its ARN
  # in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.definition (definition, as JSON text),
  #     values.state_machine_type (type, written as the Component's default
  #     when unset), and the overrides above.
  #   refused — a role_arn not set or other than a role's ARN; a kms_key_id
  #     other than a KMS key's ARN; a logging_configuration outside the
  #     shape above or at level OFF; a cloudwatch_log_group_name missing or
  #     malformed beside it, or set without it; tags that are not a map of
  #     strings; infra.overrides.host; and any infra.overrides key not
  #     listed above.
  #   held by the Component — values.state_machine_type to STANDARD and
  #     EXPRESS; values.definition to holding States and a StartAt naming one
  #     of them; and the component's name, which names the state machine, to
  #     Step Functions' 80 characters.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The definition. values.definition is passed as the module's definition,
  # the JSON text of the object, which Step Functions reads as the state
  # machine's Amazon States Language definition. The AWS provider has Step
  # Functions validate it, through ValidateStateMachineDefinition, whenever a
  # plan changes it (aws provider 6.73.0), so terraform plan reaches the Step
  # Functions API under the operator's credentials, and Step Functions judges
  # the states again when it creates or updates the state machine. Changing
  # the definition updates the state machine in place.
  #
  # The module's toggles. By default the module creates the IAM role the
  # state machine runs as, with policies for the services its integrations
  # name (create_role, true), and, while logging is on, a log group
  # (use_existing_cloudwatch_log_group, false). This Recipe passes
  # use_existing_role true with role_arn, so no role, policy or policy
  # attachment is created and the module reads no Region for a role's trust
  # policy, and use_existing_cloudwatch_log_group true, so no log group is
  # created and the operator's is read by cloudwatch_log_group_name while
  # logging is on.
  #
  # The module's other inputs keep their defaults, each declaring nothing
  # beyond the one state machine: create, so it is created; publish, false,
  # so no version of the state machine is published; service_integrations,
  # empty, so AWS X-Ray tracing stays off, the service's default;
  # encryption_configuration's kms_data_key_reuse_period_seconds, unset, so
  # the service's 300 seconds hold; sfn_state_machine_timeouts, empty, so the
  # provider's own timeouts hold; and region, unset, so the state machine is
  # in the Region of the AWS provider the root configures. The module's
  # inputs for a role or log group it creates are not read, as it creates
  # neither. The module also reads the caller's identity as a data source,
  # which declares nothing.
  #
  # The type. Step Functions fixes a state machine's type when it creates it
  # (the API Reference's CreateStateMachine: "You cannot update the type of a
  # state machine once it has been created"), and the AWS provider replaces
  # the state machine when its type changes (aws provider 6.73.0: type
  # forces a new resource). The module sets no create_before_destroy, so
  # changing values.state_machine_type on a deployed state machine makes
  # Terraform destroy it, stopping its running executions as below, and
  # create it again under the same name.
  #
  # The name. The state machine is named after the component, and the AWS
  # provider replaces it when its name changes (aws provider 6.73.0: name
  # forces a new resource), and the module block and name both follow the
  # instance name, which is the component's. Renaming the component
  # therefore changes the resource address, so Terraform plans a destroy of
  # module.<old name>... and an unrelated create of module.<new name>..., not
  # a replacement of one resource; nothing orders the two. Deleting a state
  # machine, as a rename, a type change, removing the component or a destroy
  # does, stops its running executions: Step Functions sets it DELETING, and
  # "On the next state transition, the state machine's executions are
  # terminated" (the API Reference's DeleteStateMachine); an execution
  # started on the old ARN does not move to the new one.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "role_arn" "logging_configuration" "cloudwatch_log_group_name" "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a Step Functions state machine publishes no address of its own: a caller reaches the Step Functions endpoint in its Region and names the state machine by its ARN: remove infra.overrides.host from the Release, and read the arn the state machine publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads role_arn, logging_configuration, cloudwatch_log_group_name, kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The role a state machine runs as is the operator's, and the AWS
    # provider requires it.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "role_arn") -}}
      {{- fail "infra.overrides.role_arn is not set, and a Step Functions state machine runs as the IAM role the operator names by its ARN: set infra.overrides.role_arn in the Release, such as arn:aws:iam::123456789012:role/example-state-machine-role" -}}
      {{- end -}}
    # role_arn the ARN of a role, kms_key_id the ARN of a key,
    # logging_configuration and cloudwatch_log_group_name the shape the
    # header gives, and tags the map of strings the module's tags input is
    # typed as. The same role check stands in cloudformation/step-functions,
    # over its own key, which also takes the key forms this target refuses:
    # the override keys are spelt differently per target, so the checks
    # cannot sit in the realization-neutral Component, and a MappingLibrary
    # imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "role_arn" -}}
      {{- if not (and (typeIs "string" $o.role_arn) (le (len $o.role_arn) 256) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.role_arn)) -}}
      {{- fail (printf "infra.overrides.role_arn is %s, and Step Functions takes the IAM role a state machine runs as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 256 characters at most: set it to such an ARN in the Release" (toJson $o.role_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (le (len $o.kms_key_id) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/\S+$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and this Recipe takes the KMS key a state machine is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/ followed by the key's ID, because the AWS provider's update wait compares the configured string with what Step Functions reports and fails the apply when they differ: set it to such an ARN in the Release, or remove it to encrypt with keys AWS owns alone" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "logging_configuration" -}}
      {{- $l := get $o "logging_configuration" -}}
      {{- if and (kindIs "map" $l) (eq (toString (get $l "level")) "OFF") -}}
      {{- fail "infra.overrides.logging_configuration.level is OFF, and the module writes no logging configuration for it, so Terraform leaves a deployed state machine's logging as it is: remove logging_configuration from the Release for a state machine that logs nothing" -}}
      {{- end -}}
      {{- $ok := kindIs "map" $l -}}
      {{- if $ok -}}
      {{- range $k, $_ := $l }}{{ if not (has $k (list "level" "include_execution_data")) }}{{ $ok = false }}{{ end }}{{ end -}}
      {{- if not (has (get $l "level") (list "ALL" "ERROR" "FATAL")) }}{{ $ok = false }}{{ end -}}
      {{- if and (hasKey $l "include_execution_data") (not (typeIs "bool" (get $l "include_execution_data"))) }}{{ $ok = false }}{{ end -}}
      {{- end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.logging_configuration is %s, and this Recipe takes a logging configuration of level, one of ALL, ERROR and FATAL, and an optional include_execution_data boolean, the log group being the one cloudwatch_log_group_name names: set it in the Release to such a map, or remove it to log nothing" (trunc 200 (toJson $l))) -}}
      {{- end -}}
      {{- $n := get $o "cloudwatch_log_group_name" -}}
      {{- if not (and (typeIs "string" $n) (regexMatch `^[.\-_/#A-Za-z0-9]{1,512}$` $n)) -}}
      {{- fail (printf "infra.overrides.cloudwatch_log_group_name is %s, and the module reads the log group a state machine logs to by its name from cloudwatch_log_group_name, 1 to 512 letters, digits, underscores, hyphens, slashes, periods and number signs: set it in the Release to the name of the operator's log group" (toJson $n)) -}}
      {{- end -}}
      {{- else if hasKey $o "cloudwatch_log_group_name" -}}
      {{- fail "infra.overrides.cloudwatch_log_group_name is set, and no logging_configuration turns logging on, so the name would reach no state machine: set logging_configuration in the Release, or remove cloudwatch_log_group_name" -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # values reach the mapping as the Component's schema and assertions hold
  # them: the definition a map holding States and a StartAt naming one of
  # them, passed as its JSON text; state_machine_type STANDARD or EXPRESS,
  # defaulted. The definition, the key and each tag reach Step Functions as
  # written: Terraform would read ${ inside a string as the start of an
  # interpolation, so it is written $${, which Terraform turns back into the
  # characters written; the terraform provider writes every module argument
  # with %{, the start of a directive, already escaped as %%{, so this
  # mapping leaves %{ as it is.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    name: {{ toJson .context.instance_id }}
    type: {{ toJson .values.state_machine_type }}
    definition: {{ toJson (toJson .values.definition) | replace "${" "$${" }}
    use_existing_role: true
    role_arn: {{ toJson $o.role_arn }}
    use_existing_cloudwatch_log_group: true
    encryption_configuration:
      {{- with optional $o "kms_key_id" "" }}
      type: "CUSTOMER_MANAGED_KMS_KEY"
      kms_key_id: {{ toJson . | replace "${" "$${" }}
      {{- else }}
      type: "AWS_OWNED_KEY"
      {{- end }}
    {{- with optional $o "logging_configuration" "" }}
    logging_configuration: {{ toJson . }}
    cloudwatch_log_group_name: {{ toJson $o.cloudwatch_log_group_name }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}
