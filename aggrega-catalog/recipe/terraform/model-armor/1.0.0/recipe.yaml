apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: model-armor
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Model Armor, rendered as an authored Terraform body, main.tf: one
    google_model_armor_template named after the component, in the
    operator's project and location, holding the filters its values
    declare. Nothing else is created: no floor setting, Sensitive Data
    Protection template or IAM binding.

    endpoint and template are outputs of this component's module: the
    Model Armor endpoint of the template's location,
    https://modelarmor.<location>.rep.googleapis.com, composed from the
    location, and the template's resource name.

    A change of the filters updates the template in place; a change of the
    location or the project, or renaming the component, replaces it, and
    consumers read a new template name. A project_id or location missing
    and any infra.overrides key not listed halt the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/security/model-armor:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this template, and resolves
  # none of them. Each is a reference to an output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a
  # module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The references resolve only for a
  # consumer authored as a source: Recipe in the same Terraform root
  # configuration, which Terraform then applies after this module; a
  # consumer on another target receives them as text.
  #
  # endpoint joins https://modelarmor., the template's location and
  # .rep.googleapis.com: Model Armor's "Sanitize prompts and responses"
  # says a sanitize call goes to a regional endpoint,
  # https://modelarmor.LOCATION.rep.googleapis.com, LOCATION being the
  # template's, and the google provider reaches the template at the same
  # endpoint. template is the resource's id,
  # projects/<project>/locations/<location>/templates/<template ID>, the
  # name a sanitizeUserPrompt or sanitizeModelResponse call names.
  provides:
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
    template: "${module.{{ .context.instance_id }}.template}"

  # This Recipe reads from infra.overrides:
  #   project_id - string, required (project)
  #   location   - string, required (location)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # project_id is the name every terraform Google Recipe of this catalog
  # reads for the project a resource is created in; location is the name
  # the catalog's Google Recipes read where a service takes a multi-region
  # as well as a region, and it is the provider's argument.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates, with the Model Armor API enabled. location is one of
  # Model Armor's locations: a region, such as europe-west4 or us-central1,
  # or the multi-region eu or us ("Model Armor locations"), which Model
  # Armor checks when it creates the template. Neither has a value this
  # Recipe could choose for the operator, so each halts the build when it
  # is missing.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.filter_config, as the filter_config block:
  #     rai_settings, as a block holding a rai_filters block per entry, with
  #     filter_type and, while set, confidence_level; sdp_settings, as a
  #     block holding a basic_config block with filter_enforcement while
  #     set; pi_and_jailbreak_filter_settings and
  #     malicious_uri_filter_settings, each as a block of its keys while
  #     set; and the overrides above.
  #   refused — project_id or location missing or not a string, and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which is the template
  #     ID; the keys of filter_config and of each setting, the values each
  #     takes, and the Responsible AI filters a rai_settings requires.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: no labels, no template_metadata and
  # no filter_rule_settings or sdp_settings.advanced_config. The provider
  # computes template_metadata, so the template keeps the metadata Model
  # Armor holds for it: its defaults for the enforcement type, messages,
  # logging, multi-language detection and filter versions, or what is set
  # outside the Release. It computes nothing inside filter_config, which is
  # written whole: a setting the Aggregate leaves out is written as no
  # block, so Model Armor applies none of that filter, and a setting
  # changed outside the Release, a custom rule set among them, is reverted
  # or cleared at the next apply.
  #
  # Changes. A change of filter_config updates the template in place. The
  # template's ID, location and project are fixed when Model Armor creates
  # it, and the provider replaces the template when one changes: renaming
  # the component, or changing location or project_id. A caller still
  # naming the old template, or its location's endpoint, then names a
  # template that no longer exists.
  #
  # Deletion. A destroy, or removing the component, deletes the template:
  # the body leaves the provider's deletion_policy at its default, DELETE.
  # Model Armor's "Create and manage templates" asks that a template being
  # deleted be used by no model. A template holds no data, so this Recipe
  # configures no backup and declares no native backup.
  #
  # Credentials. A template holds none: a caller signs each sanitize call as
  # the Google identity it runs under, and Terraform authenticates with the
  # credentials in the environment it runs in, so the rendered configuration
  # names none.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id and location from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_location_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Model Armor template in the operator's own Google Cloud project, at a location the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Model Armor module. The resource is named this, since each component's
  # body renders into a module directory of its own. The Component's keys
  # inside filter_config are the provider's own block and argument names,
  # and its schema holds each to the values Model Armor takes, so each is
  # written as the block or argument of its name. Each string the Release
  # gives reaches Model Armor as written: Terraform would read ${ and %{
  # inside a string as the start of an interpolation or a directive, so they
  # are written $${ and %%{, which Terraform turns back into the characters
  # written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $f := default dict .values.filter_config -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_model_armor_template" "this" {
        template_id = "{{ .context.instance_id }}"
        location    = {{ toJson $o.location | replace "${" "$${" | replace "%{" "%%{" }}

        filter_config {
          {{- if hasKey $f "rai_settings" }}
          rai_settings {
            {{- range $r := (get (default dict (get $f "rai_settings")) "rai_filters") }}
            rai_filters {
              filter_type      = {{ toJson (get $r "filter_type") }}
              {{- with get $r "confidence_level" }}
              confidence_level = {{ toJson . }}
              {{- end }}
            }
            {{- end }}
          }
          {{- end }}
          {{- if hasKey $f "sdp_settings" }}
          {{- $sdp := default dict (get $f "sdp_settings") }}
          sdp_settings {
            {{- if hasKey $sdp "basic_config" }}
            {{- $basic := default dict (get $sdp "basic_config") }}
            basic_config {
              {{- with get $basic "filter_enforcement" }}
              filter_enforcement = {{ toJson . }}
              {{- end }}
            }
            {{- end }}
          }
          {{- end }}
          {{- if hasKey $f "pi_and_jailbreak_filter_settings" }}
          {{- $pi := default dict (get $f "pi_and_jailbreak_filter_settings") }}
          pi_and_jailbreak_filter_settings {
            {{- with get $pi "filter_enforcement" }}
            filter_enforcement = {{ toJson . }}
            {{- end }}
            {{- with get $pi "confidence_level" }}
            confidence_level   = {{ toJson . }}
            {{- end }}
          }
          {{- end }}
          {{- if hasKey $f "malicious_uri_filter_settings" }}
          {{- $uri := default dict (get $f "malicious_uri_filter_settings") }}
          malicious_uri_filter_settings {
            {{- with get $uri "filter_enforcement" }}
            filter_enforcement = {{ toJson . }}
            {{- end }}
          }
          {{- end }}
        }

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
      }

      output "endpoint" {
        value = "https://modelarmor.${google_model_armor_template.this.location}.rep.googleapis.com"
      }

      output "template" {
        value = google_model_armor_template.this.id
      }
