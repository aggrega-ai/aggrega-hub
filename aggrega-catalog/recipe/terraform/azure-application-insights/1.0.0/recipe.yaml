apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-application-insights
  version: 1.0.0
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Application Insights: one workspace-based component storing its
    telemetry in the operator's Log Analytics workspace, rendered as
    Terraform for the azurerm provider by a module kept beside this Recipe,
    not by Microsoft's Azure Verified Modules module
    Azure/avm-res-insights-component/azurerm, whose root calls a module from
    the Terraform registry.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-application-insights where it deploys an Azure Resource
    Manager template. It needs hashicorp/azurerm 5.14 or later, so it goes in
    a boundary apart from Recipes whose modules admit azurerm 4 alone.
    infra.overrides names the operator's resource group, region and
    workspace; the Release creates no workspace. The application type is web
    unless infra.overrides.application_type is other, every item is kept
    unless infra.overrides.sampling_percentage samples a share, and local
    authentication is on unless infra.overrides.local_authentication_enabled
    is false. Client IP addresses are masked.

    connection_string is a reference to the string the provider reports,
    which Terraform holds as sensitive: a consumer in the same root
    configuration receives it marked so. A component name the service
    refuses halts naming the component; any infra.overrides key not listed,
    host and enable_telemetry halt naming the key, as do
    resource_group_name, location and workspace_id left out, and those keys,
    application_type, sampling_percentage and local_authentication_enabled
    given in a form they do not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/observability/azure-application-insights:1.0.0

  # The module beside this Recipe, module/main.tf and module/variables.tf,
  # declares the component as an azurerm_application_insights, and nothing
  # else. `aggrega pin` records the digest of each file in entity.lock, and
  # every build reads exactly those bytes.
  #
  # Microsoft's Azure Verified Modules programme publishes a Terraform module
  # for the service, Azure/avm-res-insights-component/azurerm, MIT, at v0.5.0
  # its newest version. Its root configuration calls the registry module
  # Azure/avm-utl-interfaces/azure, whatever the caller passes, so
  # initialising a configuration that sources it fetches a module from the
  # Terraform registry, which the catalog's sourced modules do not do. The
  # module is therefore not sourced, and no module telemetry exists to turn
  # off.
  #
  # The module declares hashicorp/azurerm "~> 5.14", the catalog's one Azure
  # provider constraint, so a Release places this component in a terraform
  # boundary whose bodies install azurerm 5, apart from any module admitting
  # azurerm 4 alone.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   resource_group_name           - string (resource_group_name), required
  #   location                      - string (location), required
  #   workspace_id                  - string (workspace_id), required
  #   application_type              - string (application_type: web or other; default web)
  #   sampling_percentage           - number (sampling_percentage: 0 to 100; default 100)
  #   local_authentication_enabled  - bool (local_authentication_enabled; default true)
  #   tags                          - map[string]string (tags of the component)
  # enable_telemetry halts by name: the module is this catalog's own, with no
  # telemetry to turn on or off. host halts by name too: the component
  # publishes no host, since the ingestion address travels inside the
  # connection string. Any other key halts naming it.
  #
  # Each is named by the resource argument it sets, given in brackets.
  # arm/azure-application-insights reads each of them but resource_group_name
  # under the same spelling: its template deploys into the group it is
  # deployed to. resource_group_name and location are required: they place
  # the component in the operator's subscription, and this Recipe never
  # chooses either. The component takes the resource group by its name, so
  # nothing is composed from the subscription Terraform runs against.
  #
  # workspace_id. The resource ID of the Log Analytics workspace the
  # component stores its telemetry in,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.OperationalInsights/workspaces/<workspace>.
  # The provider takes it only with its fixed segments cased exactly so: it
  # validates the argument with the workspace ID parser of its Azure SDK,
  # which compares those segments case-sensitively. The workspace is the
  # operator's, created outside the Release; this Recipe creates none.
  # Microsoft documents classic Application Insights, which kept telemetry
  # outside a workspace, as retired, and documents that a component created
  # with no workspace named gets a new workspace created with it, so the key
  # is required, although the provider leaves the argument optional. A
  # workspace in another subscription is taken; Microsoft documents that the
  # identity Terraform runs as then needs the workspace's sharedKeys action
  # there. How long telemetry is kept, and the workspace's daily cap, are set
  # on the workspace.
  #
  # application_type. Microsoft's API for the component, version
  # 2020-02-02, which the provider calls, defines the application types web
  # and other. The provider's own validation admits java, MobileCenter,
  # phone, store, ios and Node.JS besides, which this Recipe refuses below by
  # name, so both Recipes take the same types. azurerm requires the argument;
  # unset here it is web, the type Microsoft's own examples create. The
  # provider writes it to the component's kind as well, and changing it
  # replaces the component.
  #
  # sampling_percentage. The share of the telemetry the service keeps when
  # it ingests it, ingestion sampling: 100 unless set, so every item an
  # application sends is kept. The provider takes a number from 0 to 100,
  # and any other value halts below by name. An SDK that samples before it
  # sends is unaffected.
  #
  # local_authentication_enabled. Unset or true, the provider's default,
  # telemetry carrying the instrumentation key alone is ingested. false: the
  # component then ingests only telemetry authenticated with Microsoft Entra
  # ID, so a sender also presents a token for an identity holding the
  # Monitoring Metrics Publisher role on the component, a role assignment
  # that is the operator's.
  #
  # The module sets these beside the arguments the keys above set:
  # ip_masking_enabled true, the provider's default, so the service masks the
  # client IP address of the telemetry it ingests rather than storing it; and
  # retention_in_days 90, the provider's default, which
  # arm/azure-application-insights writes too. The provider's own defaults
  # stand for every argument the module leaves out. These are worth knowing:
  # ingestion and query over the public network both on, so an Azure Monitor
  # Private Link Scope restricting them is the operator's; and the
  # component's daily cap, which the provider writes as 100 GB a day, the
  # cap the Azure portal gives a new component, with its notification on.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # provider's resource schema:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — a component name the service refuses; an
  #     infra.overrides.resource_group_name, location or workspace_id left
  #     out, the first two given as anything but a string and workspace_id
  #     as anything but a Log Analytics workspace's resource ID cased as the
  #     provider reads it; application_type given as anything but web or
  #     other; sampling_percentage as anything but a number from 0 to 100;
  #     local_authentication_enabled as anything but a boolean; host;
  #     enable_telemetry; and any infra.overrides key not listed above.
  #   not read — none.
  #
  # Credentials. The component publishes its connection string, which holds
  # its instrumentation key. The provider marks the attribute sensitive, and
  # the module's output is marked so, so Terraform shows it in no plan and
  # keeps it marked in every expression of a consumer that reads it, while
  # holding it in state in the clear, as it holds every sensitive value. The
  # service returns it among the component's properties to whoever can read
  # the component.
  # Backup. The component keeps no data of its own: its telemetry is in the
  # workspace, so this Recipe configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the component is created in, by its name, such as example-rg" "location" "the one Azure region the component is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its Application Insights component in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    # The workspace's resource ID, with its fixed segments cased as the
    # provider's parser compares them.
    workspace_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "workspace_id") -}}
      {{- fail "this Release stores the Application Insights component's telemetry in the operator's own Log Analytics workspace, which this Recipe never creates, but infra.overrides.workspace_id carries none: set infra.overrides.workspace_id in the Release to the workspace's resource ID" -}}
      {{- end -}}
      {{- $w := index $o "workspace_id" -}}
      {{- $ok := typeIs "string" $w -}}
      {{- if $ok }}{{ $ok = regexMatch `^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.OperationalInsights/workspaces/[^/]+$` $w }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.workspace_id is %v, and the azurerm provider reads the Log Analytics workspace the component stores its telemetry in by its resource ID, with its fixed segments cased exactly as /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.OperationalInsights/workspaces/<workspace>: set it in the Release to such an ID" $w) -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "workspace_id" "application_type" "sampling_percentage" "local_authentication_enabled" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the Application Insights component in a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and the Application Insights component publishes no host: a sender finds the ingestion address in the connection string it publishes: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, workspace_id, application_type, sampling_percentage, local_authentication_enabled and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $a := optional $o "application_type" "web" -}}
      {{- if not (has $a (list "web" "other")) -}}
      {{- fail (printf "infra.overrides.application_type is %v, and Microsoft's API for an Application Insights component, version 2020-02-02, defines the application types web and other, spelt in lower case: set infra.overrides.application_type to one of them, or remove it for web" $a) -}}
      {{- end -}}
      {{- $s := optional $o "sampling_percentage" 100 -}}
      {{- $num := or (kindIs "int" $s) (kindIs "int64" $s) (kindIs "float64" $s) -}}
      {{- if not (and $num (ge (float64 $s) 0.0) (le (float64 $s) 100.0)) -}}
      {{- fail (printf "infra.overrides.sampling_percentage is %v, and the azurerm provider takes the share of telemetry the service keeps as a number from 0 to 100: set infra.overrides.sampling_percentage to such a number, or remove it to keep every item" $s) -}}
      {{- end -}}
      {{- $la := optional $o "local_authentication_enabled" true -}}
      {{- if not (kindIs "bool" $la) -}}
      {{- fail (printf "infra.overrides.local_authentication_enabled is %v, and it switches the component's local authentication as a boolean: set it to false to ingest only telemetry authenticated with Microsoft Entra ID, or to true or remove it to keep it on" $la) -}}
      {{- end -}}
    # The component is named after the component instance. Microsoft's
    # documentation of Azure resource names gives an Application Insights
    # component 1 to 260 characters, none of them %, &, \, ?, / or a control
    # character, and no space or period at the end; a component name in an
    # Aggregate holds letters, digits, hyphens and underscores alone, so its
    # length is what is checked here, where the name is known. The provider
    # validates no name.
    component_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if gt (len $n) 260 -}}
      {{- fail (printf "the component %q names its Application Insights component, and Microsoft documents that name as 1 to 260 characters, and this one has %d: rename the component in the Aggregate to a shorter name" $n (len $n)) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret this string. The
  # provider reports the component's connection string as the service gives
  # it, and the module publishes it as its connection_string output.
  # connection_string reads that output from this component's module call,
  # which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves it at apply time, after the component
  # exists, so it resolves only for a consumer authored as a source: Recipe
  # in the same root configuration; a consumer on another target receives it
  # as text. No infra.overrides key replaces it: the string is the
  # component's own.
  provides:
    connection_string: "${module.{{ .context.instance_id }}.connection_string}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable. The
  # component is named after the component instance, as the other managed
  # Recipes name theirs.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    name: "{{ .context.instance_id }}"
    resource_group_name: "{{ $o.resource_group_name }}"
    location: "{{ $o.location }}"
    workspace_id: "{{ $o.workspace_id }}"
    application_type: "{{ optional $o "application_type" "web" }}"
    sampling_percentage: {{ optional $o "sampling_percentage" 100 }}
    local_authentication_enabled: {{ if optional $o "local_authentication_enabled" true }}true{{ else }}false{{ end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The azurerm provider refuses to plan
  # without its features block, and the module carries no provider block of
  # its own, so it inherits this configuration; the provider reads its
  # credentials and subscription from the environment Terraform runs in.
  # Terraform destroys the module's resources with it, so the file stays while
  # any component declaring it does: remove the last of them from a Release
  # only after destroying what their modules created, because with the file
  # gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
