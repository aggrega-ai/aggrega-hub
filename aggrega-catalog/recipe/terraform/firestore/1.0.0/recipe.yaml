apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: firestore
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Firestore, rendered as an authored Terraform body, main.tf: one
    google_firestore_database of the type values.type names, in the
    operator's project at infra.overrides.location, and, with a core/backup
    attachment, a google_firestore_backup_schedule taking a daily backup.
    host and endpoint publish the endpoint of the API the type serves, and
    database an output of this component's module, which Terraform resolves
    when it applies.

    The project and the KMS key are the operator's: none is created, nor
    any index, rule or IAM binding. Delete protection is on unless
    infra.overrides.deletion_protection is false, and a destroy then deletes
    the database; its backups stay until they expire.

    A core/backup attachment bound to terraform/backup-native sets the daily
    backups' retention, and point-in-time recovery when it asks for it. A
    project_id or location missing, an edition Firestore does not offer or
    pairs otherwise, a deletion_protection or kms_key_name of another form, a
    retention or schedule Firestore does not keep, infra.overrides.host,
    since the endpoint answers under the service's name alone, and any
    infra.overrides key not listed halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/firestore:1.0.0

  locals:
    # The database's ID: values.database, or else the instance's name, which
    # the Component's assertions hold to Firestore's rule.
    database: "{{ default .context.instance_id (optional .values \"database\" \"\") }}"
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Firestore scheduled backups"

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this database, and resolves
  # none of them.
  #
  # host is the name of the endpoint of the API the database's type serves:
  # firestore.googleapis.com for FIRESTORE_NATIVE and datastore.googleapis.com
  # for DATASTORE_MODE, the service endpoints of the Firestore and Datastore
  # REST references. Every database answers there, so the name is known when
  # the Release is built and published as text. endpoint is the same name
  # after https://, reached on port 443. The endpoint offers no custom
  # domain, so every name it answers under is one of the service's own and
  # none is the operator's choice; infra.overrides.host is refused by the
  # assertion below rather than published.
  #
  # database is a reference to the database output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a
  # module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The reference resolves only for a consumer
  # authored as a source: Recipe in the same Terraform root configuration,
  # which Terraform then applies after this module; a consumer on another
  # target receives it as text.
  provides:
    host: "{{ if eq (toString .values.type) \"DATASTORE_MODE\" }}datastore.googleapis.com{{ else }}firestore.googleapis.com{{ end }}"
    port: "443"
    endpoint: "https://{{ if eq (toString .values.type) \"DATASTORE_MODE\" }}datastore.googleapis.com{{ else }}firestore.googleapis.com{{ end }}"
    database: "${module.{{ .context.instance_id }}.database}"

  # This Recipe reads from infra.overrides:
  #   project_id          - string, required (project, on the database and the backup schedule)
  #   location            - string, required (location_id)
  #   edition             - string (database_edition; default "STANDARD")
  #   deletion_protection - bool (delete_protection_state; default true)
  #   kms_key_name        - string (cmek_config.kms_key_name)
  # host halts by name, as any key not listed does.
  #
  # project_id and deletion_protection are the names every terraform Google
  # Recipe of this catalog reads for the project a resource is created in
  # and for the protection against deleting it; edition is the name the
  # Cloud SQL Recipes read for the edition a Google service is provisioned
  # at; location is the provider's word for where a service takes a region
  # or a multi-region; kms_key_name is the provider's argument, the leaf of
  # cmek_config.kms_key_name, under which the catalog's Google bodies read a
  # customer-managed key.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Firestore API is enabled. location is
  # where Firestore keeps the database, a region such as europe-west1 or a
  # multi-region such as nam5 or eur3 (Firestore's locations page); Firestore
  # refuses one it does not offer when it creates the database. Each is a
  # string and neither has a value this Recipe could choose for the
  # operator, so each halts the build when it is missing.
  #
  # edition is the database's edition, STANDARD or ENTERPRISE, STANDARD when
  # unset, as Firestore creates a database naming none. The google provider
  # takes ENTERPRISE with type FIRESTORE_NATIVE alone, so ENTERPRISE with
  # values.type DATASTORE_MODE halts, and so does any other value. An
  # ENTERPRISE database leaves the Firestore API off unless it is asked for
  # (the REST reference of a database: firestoreDataAccessMode defaults to
  # DATA_ACCESS_MODE_DISABLED on that edition), so the body turns it on,
  # since host names that API; its MongoDB compatible API keeps Firestore's
  # default for the edition, on.
  #
  # deletion_protection is true or false, true when unset: the body writes
  # delete_protection_state DELETE_PROTECTION_ENABLED or
  # DELETE_PROTECTION_DISABLED from it. Firestore refuses to delete a
  # protected database, so a destroy, or removing the component, fails until
  # a Release sets it false and applies. Any other value halts.
  #
  # kms_key_name names the operator's Cloud KMS key the database is encrypted
  # with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's cmek_config takes; the key is in the location
  # Firestore keeps the database in (us for nam5, europe for eur3), and the
  # Firestore service agent may use it, both of which Firestore checks when
  # it creates the database. Unset, Firestore encrypts the database with a
  # key Google manages. A value of another form halts.
  #
  # host is refused by name: Firestore answers at a Google API endpoint,
  # which offers no custom domain, so no name of the operator's can stand
  # for it.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.database, as the database's name; values.type, as
  #     type and as the endpoint host names; a core/backup attachment, as the
  #     comment above the body says; and the overrides above.
  #   refused — project_id or location missing or not a string; an edition
  #     not offered, or ENTERPRISE with DATASTORE_MODE; a deletion_protection
  #     that is not a boolean; a kms_key_name of another form; a retention, a
  #     schedule or a second attachment of core/backup Firestore does not
  #     keep; infra.overrides.host; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the database's ID, values.database or the
  #     instance's name, to Firestore's rule.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: deletion_policy DELETE, so a destroy
  # asks Firestore to delete the database, which delete protection refuses
  # while it is on (the provider's default, ABANDON, would leave the
  # database in the project unmanaged); no app_engine_integration_mode,
  # concurrency_mode or realtime_updates_mode, so Firestore's defaults hold;
  # no resource manager tags. The provider replaces the database when
  # project_id, location, values.database, edition or kms_key_name changes,
  # each of which Firestore fixes when it creates the database: Terraform
  # deletes it, which delete protection refuses while it is on, and creates
  # a new, empty one. A changed values.type is sent to Firestore as an
  # update of the database, as is deletion_protection.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "edition" "deletion_protection" "kms_key_name" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Firestore answers at a Google API endpoint, firestore.googleapis.com or datastore.googleapis.com, which offers no custom domain, so every name it answers under is one of the service's own: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location, edition, deletion_protection and kms_key_name from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_location_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Firestore database in the operator's own Google Cloud project, at a location the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    edition_offered: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "edition" -}}
      {{- if not (has $o.edition (list "STANDARD" "ENTERPRISE")) -}}
      {{- fail (printf "infra.overrides.edition is %s, and Firestore offers the STANDARD and ENTERPRISE editions: set it to one of them, or remove it for STANDARD" (toJson $o.edition)) -}}
      {{- end -}}
      {{- if and (eq (toString $o.edition) "ENTERPRISE") (eq (toString .values.type) "DATASTORE_MODE") -}}
      {{- fail "infra.overrides.edition is ENTERPRISE, and the google provider creates an ENTERPRISE database with type FIRESTORE_NATIVE alone, while values.type is DATASTORE_MODE: set infra.overrides.edition to STANDARD, or remove it" -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (hasKey $o "deletion_protection") (not (kindIs "bool" $o.deletion_protection)) -}}
      {{- fail (printf "infra.overrides.deletion_protection is %s, and it sets the database's delete protection on or off: set it to true or false in the Release, or remove it for true" (toJson $o.deletion_protection)) -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Firestore takes the Cloud KMS key it encrypts a database with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Firestore module. The resources are named this, since each component's
  # body renders into a module directory of its own. Each string the Release
  # gives reaches Firestore as written: Terraform would read ${ and %{ inside
  # a string as the start of an interpolation or a directive, so they are
  # written $${ and %%{, which Terraform turns back into the characters
  # written.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside, and kept as the
  # database's own scheduled backups and point-in-time recovery:
  #   - With none attached, Firestore takes no scheduled backup, and
  #     point-in-time recovery is off, as Firestore creates a database:
  #     reads reach the past hour of the data alone.
  #   - An attachment carrying no infra.role_arn, bound to
  #     terraform/backup-native, adds a google_firestore_backup_schedule with
  #     daily_recurrence: Firestore takes one backup of the database a day,
  #     at a time it chooses, since a daily schedule takes no time of day
  #     (the provider's daily_recurrence block has no field). Any
  #     infra.schedule therefore halts naming it. infra.retention_days is
  #     retention, in seconds, how long each backup is kept; Firestore keeps
  #     a backup for up to 14 weeks (the provider's retention argument), so
  #     a value above 98 days halts naming the attachment.
  #   - infra.point_in_time_recovery true turns point-in-time recovery on,
  #     point_in_time_recovery_enablement POINT_IN_TIME_RECOVERY_ENABLED:
  #     reads then reach any version of the past 7 days, a window Firestore
  #     fixes. Left out or false, it stays off, Firestore's default.
  #   - Two attachments carrying no infra.role_arn halt naming both:
  #     Firestore takes one daily backup schedule on a database.
  #   - An attachment carrying infra.role_arn asks AWS Backup to back the
  #     database up, and halts in the FeatureRecipe it is bound to:
  #     terraform/backup-native refuses the role, and
  #     terraform/backup-aws-backup backs up Amazon RDS instances alone.
  #   - A destroy deletes the schedule with the database; the backups it
  #     took stay until their retention ends (the provider's documentation of
  #     the backup schedule).
  artifacts:
    main.tf: |
      {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
      {{- $backup := "" -}}{{- $backupInfra := dict -}}
      {{- range $name, $attachment := (default dict .features) -}}
      {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
      {{- $in := default dict (optional $attachment "infra" dict) -}}
      {{- if not (trim (toString (optional $in "role_arn" ""))) -}}
      {{- if $backup -}}
      {{- fail (printf "core/backup attachments %q and %q on %q both ask Firestore for a daily backup schedule, and Firestore takes one daily schedule on a database: remove one of the two" $backup $name $.context.instance_id) -}}
      {{- end -}}
      {{- $backup = $name -}}{{- $backupInfra = $in -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $backupDays := 0 -}}{{- $backupPitr := false -}}
      {{- if $backup -}}
      {{- with trim (toString (optional $backupInfra "schedule" "")) -}}
      {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and Firestore takes a daily backup at a time it chooses, with no time of day to set: remove infra.schedule from the attachment" $backup $.context.instance_id .) -}}
      {{- end -}}
      {{- $backupDays = int (optional $backupInfra "retention_days" 7) -}}
      {{- if or (lt $backupDays 1) (gt $backupDays 98) -}}
      {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and Firestore keeps a backup for up to 14 weeks, 98 days: set infra.retention_days to 98 or fewer" $backup .context.instance_id $backupDays) -}}
      {{- end -}}
      {{- if eq (toString (optional $backupInfra "point_in_time_recovery" "")) "true" }}{{ $backupPitr = true }}{{ end -}}
      {{- end -}}
      {{- $o := optional .infra "overrides" dict -}}
      {{- $edition := toString (optional $o "edition" "STANDARD") -}}
      {{- $dp := optional $o "deletion_protection" true -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_firestore_database" "this" {
        name = "{{ .locals.database }}"
        type = "{{ .values.type }}"

        ## ── Provider-specific overrides ──────────────────────────
        project          = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        location_id      = {{ toJson $o.location | replace "${" "$${" | replace "%{" "%%{" }}
        database_edition = "{{ $edition }}"
        {{- if eq $edition "ENTERPRISE" }}

        # The Firestore API, which host names, is off on an ENTERPRISE
        # database unless it is asked for.
        firestore_data_access_mode = "DATA_ACCESS_MODE_ENABLED"
        {{- end }}

        point_in_time_recovery_enablement = "{{ if $backupPitr }}POINT_IN_TIME_RECOVERY_ENABLED{{ else }}POINT_IN_TIME_RECOVERY_DISABLED{{ end }}"
        delete_protection_state           = "{{ if $dp }}DELETE_PROTECTION_ENABLED{{ else }}DELETE_PROTECTION_DISABLED{{ end }}"
        deletion_policy                   = "DELETE"
        {{- with optional $o "kms_key_name" "" }}

        cmek_config {
          kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }
      {{- if $backup }}

      resource "google_firestore_backup_schedule" "this" {
        project   = google_firestore_database.this.project
        database  = google_firestore_database.this.name
        retention = "{{ mul $backupDays 86400 }}s"

        daily_recurrence {}
      }
      {{- end }}

      output "database" {
        value = google_firestore_database.this.name
      }
