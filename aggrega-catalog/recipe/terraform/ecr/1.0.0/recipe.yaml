apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ecr
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # ECR module: the third-party code this Recipe pins and writes into the
  # output. The repository it declares is a service the reader contracts for
  # directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon ECR, realized by the terraform-aws-modules project's ECR module,
    terraform-aws-modules/ecr/aws at v3.2.1, Apache-2.0, fetched from its
    git repository at that tag and pinned by the commit it names in the
    entity.lock beside this Recipe: one private repository named after the
    component, with the tag mutability and scan on push its values set.
    host, repository_uri and arn publish the registry's name, the
    repository's URL and its ARN, as Terraform references that resolve for a
    consumer authored as a source: Recipe in the same root configuration.

    Amazon ECR encrypts the images with Amazon S3-managed keys unless
    kms_key_id names the operator's KMS key by its ARN, expires images by the
    lifecycle policy repository_lifecycle_policy gives, or by none, and tags
    label the repository. No repository policy, registry setting, role or
    key is created. A destroy, removing the component or changing kms_key_id
    deletes the repository first, which fails while it holds an image;
    renaming the component destroys the repository under the old name and
    creates one under the new, and the destroy fails the same way.

    infra.overrides.host halts the build, since the registry answers at the
    name Amazon ECR gives it, as do a kms_key_id other than a key's ARN, a
    repository_lifecycle_policy other than a JSON object of 100 to 30,720
    characters, tags that are not a map of strings and any infra.overrides
    key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/devtool/ecr:1.0.0

  # The published module, at the tag the registry publishes as version 3.2.1.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which declares the repository's
  # resources and calls no module: its modules/repository-template directory
  # is a separate module the root does not load, and the examples/ and
  # wrappers/ directories are vendored with it and never loaded. So
  # initialising it fetches providers and nothing else.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-ecr.git
    ref: v3.2.1

  # The String Pipe: the compiler does not interpret these strings.
  # repository_uri and arn name the module's repository_url and
  # repository_arn outputs, the AWS provider's repository_url and arn of the
  # repository, through this component's module call, which the boundary's
  # root configuration declares under .context.instance_id for a component
  # declared in the Aggregate the Release deploys. host is the part of
  # repository_url before the slash that precedes the repository's name, the
  # registry's name: the name is the component's, so that slash is the
  # character one past the name's length from the end, which substr reads
  # from the URL itself, so that no quoted string stands inside the
  # interpolation. Terraform resolves each at apply time, so they
  # resolve only for a consumer authored as a source: Recipe in the same
  # root configuration, which, reading any of them, is applied after the
  # repository; a consumer on another target receives them as text.
  provides:
    host: "${split(substr(module.{{ .context.instance_id }}.repository_url, -{{ add1 (len .context.instance_id) }}, 1), module.{{ .context.instance_id }}.repository_url)[0]}"
    repository_uri: "${module.{{ .context.instance_id }}.repository_url}"
    arn: "${module.{{ .context.instance_id }}.repository_arn}"

  # This Recipe reads from infra.overrides:
  #   kms_key_id                  - string (repository_kms_key, with
  #                                 repository_encryption_type KMS)
  #   repository_lifecycle_policy - string (repository_lifecycle_policy, with
  #                                 create_lifecycle_policy true)
  #   tags                        - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # kms_key_id and tags are the keys, under the same names, that the
  # catalog's terraform AWS Recipes read for the KMS key a resource is
  # encrypted with and for its tags, so a Release names each once whichever
  # Recipe it configures; repository_lifecycle_policy is the module's input
  # of the same name.
  #
  # kms_key_id names the operator's KMS key by its ARN,
  # arn:<partition>:kms:<region>:<account>:key/<key id>, the key ID a UUID
  # or, for a multi-Region key, mrk- and 32 hexadecimal digits, and makes
  # Amazon ECR encrypt the repository's image layers and manifests with that
  # key (the Amazon ECR User Guide's "Encryption at rest": each push asks
  # AWS KMS for a data key under it "for encrypting the image layer and
  # manifest"). Amazon ECR takes an alias, a key ID or a key ARN for the
  # field (the API Reference's EncryptionConfiguration) and records the
  # key's ARN when it creates the repository ("Encryption at rest": it calls
  # DescribeKey "to validate and retrieve the Amazon Resource Name (ARN)" of
  # the key; the CloudFormation resource schema's propertyTransform for
  # EncryptionConfiguration.KmsKey likewise matches a key ID it was given
  # against the key ARN it reads back, which shows the ARN is what comes
  # back). That an alias is recorded as the key's ARN is an inference from
  # these two sources, not observed. The AWS provider keeps the key it reads
  # back from the repository and replaces the repository when that differs from the one
  # configured (aws provider 6.73.0: kms_key, read back from the repository,
  # forces a new resource), so this Recipe, as cloudformation/ecr, takes the
  # ARN alone, and an alias ARN, an alias name such as alias/example-key and
  # a bare key ID halt the build. The key is the operator's, in the
  # repository's Region ("Encryption at rest": "the key must exist in the
  # same Region as your repository"), with the permissions "Encryption at
  # rest" lists: kms:CreateGrant and kms:DescribeKey in the key's policy or in
  # an IAM policy, and kms:RetireGrant in the IAM policy of the identities
  # that create and delete the repository ("The kms:RetireGrant permission
  # must be added to the IAM policy of the user or role creating the
  # repository"; the identity that deletes it needs it to retire the grants).
  # Amazon ECR creates grants on it for the repository and retires them when
  # the repository is deleted. It is named here and never created. Unset, this
  # Recipe passes repository_encryption_type AES256, the service's own
  # default: Amazon ECR encrypts the images with Amazon S3-managed keys
  # (SSE-S3). The AWS managed key aws/ecr and dual-layer encryption
  # (KMS_DSSE, offered in the AWS GovCloud (US) Regions alone) are not
  # offered.
  #
  # Amazon ECR fixes a repository's encryption when it creates it
  # ("Encryption at rest": "Repository Encryption Configuration can't be
  # changed after a repository is created"), and the AWS provider replaces
  # the repository when its encryption changes (aws provider 6.73.0:
  # encryption_configuration forces a new resource). So setting, changing or
  # removing kms_key_id on a deployed repository makes Terraform destroy it
  # and create it again, the destroy failing while it holds an image, as
  # below.
  #
  # repository_lifecycle_policy is a lifecycle policy, a JSON object of rules
  # Amazon ECR applies to the repository's images (the Amazon ECR User
  # Guide's "Lifecycle policy template"), written as text: a policy expires,
  # and so deletes, the images its rules select. Amazon ECR takes the text
  # at 100 to 30,720 characters (the API Reference's PutLifecyclePolicy), and
  # this Recipe halts the build on text outside that length or not holding a
  # JSON object; the rules inside are Amazon ECR's to judge when it applies
  # the policy. While it is set, create_lifecycle_policy is passed true, so
  # the module declares the policy; unset, false, so the repository carries
  # no lifecycle policy and keeps every image until a client deletes it. The
  # AWS provider replaces the policy, not the repository, when its text
  # changes (aws provider 6.73.0: the lifecycle policy's policy forces a new
  # resource, a JSON text equal to the one deployed planning no change).
  #
  # tags is a map from each tag name to a string, written on the
  # repository, the one resource the module creates here that takes tags,
  # as the module writes it: the module adds no tag of its own.
  #
  # host is refused by name. The registry answers at the name Amazon ECR
  # gives it, <account>.dkr.ecr.<region>.amazonaws.com (the Amazon ECR User
  # Guide's "Amazon ECR private registry"), under a certificate for that
  # name, so a client checking the certificate would refuse any other name.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.image_tag_mutability
  #     (repository_image_tag_mutability) and values.scan_on_push
  #     (repository_image_scan_on_push), each written as the Component's
  #     default when unset, and the overrides above.
  #   refused — a kms_key_id other than a key's ARN; a
  #     repository_lifecycle_policy that is not a JSON object of 100 to
  #     30,720 characters; tags that are not a map of strings;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   held by the Component — values.image_tag_mutability to IMMUTABLE and
  #     MUTABLE, and the component's name, which names the repository, to
  #     Amazon ECR's rule for a repository name.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The module's toggles. By default the module also attaches a repository
  # policy it writes, granting the account's root principal read access
  # (attach_repository_policy and create_repository_policy, each true), and
  # creates a lifecycle policy (create_lifecycle_policy, true, with an empty
  # policy text). This Recipe passes attach_repository_policy and
  # create_repository_policy false, so no repository policy is attached and
  # the policy document is not computed, and create_lifecycle_policy as
  # above. The repository carries no repository policy, and access to it is
  # granted through the IAM policies of identities in its account, which
  # alone has access to a repository without one (the Amazon ECR User
  # Guide's "Private repository policies in Amazon ECR"), so access from
  # another account is not offered.
  #
  # The module's other inputs keep their defaults, each declaring nothing
  # beyond the one repository: create and create_repository, so the
  # repository is created; repository_type private, so it is a private
  # repository and no Amazon ECR Public repository or policy is declared;
  # repository_image_tag_mutability_exclusion_filter, unset, which the
  # Component's tag mutability settings use none of; create_registry_policy,
  # manage_registry_scanning_configuration and
  # create_registry_replication_configuration false and
  # registry_pull_through_cache_rules empty, so no registry-wide setting is
  # written, those being the operator's; and region, unset, so the
  # repository is in the Region of the AWS provider the root configures. The
  # module also reads the caller's identity and partition as data sources,
  # which declare nothing.
  #
  # The name. The repository is named after the component, and the AWS
  # provider replaces the repository when its name changes (aws provider
  # 6.73.0: name forces a new resource), and the module block and
  # repository_name both follow the instance name, which is the component's.
  # Renaming the component therefore changes the resource address, so
  # Terraform plans a destroy of module.<old name>... and an unrelated create
  # of module.<new name>..., not a replacement of one resource; nothing
  # orders the two. The new repository is created; the old one's destroy
  # fails while it holds an image, as below, and the apply ends in error with
  # both repositories present (a lifecycle policy set on the old one is
  # destroyed before its repository's destroy fails). What the apply does
  # beyond that is not verified. A repository's name
  # is unique within its registry (CreateRepository:
  # RepositoryAlreadyExistsException), so an apply naming a repository that
  # already exists there fails to create it.
  #
  # Deletion. This Recipe passes repository_force_delete false, the AWS
  # provider's own default for force_delete, so Amazon ECR deletes the
  # repository only while it holds no image: DeleteRepository's force "If
  # false, the repository must be empty before attempting to delete it", and
  # Amazon ECR refuses with RepositoryNotEmptyException otherwise (the API
  # Reference's DeleteRepository), which the provider reports as "not empty,
  # consider using force_delete" (aws provider 6.73.0). A destroy, or
  # removing the component, therefore deletes an empty repository and fails
  # at one holding an image, so no image is deleted with it; the images are
  # the operator's to delete first. cloudformation/ecr holds the same rule.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "kms_key_id" "repository_lifecycle_policy" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon ECR registry answers at the name Amazon ECR gives it, under a certificate for that name, so a client checking the certificate refuses any other name: remove infra.overrides.host from the Release, and read the host the repository publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads kms_key_id, repository_lifecycle_policy and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # kms_key_id the ARN of a key, repository_lifecycle_policy a JSON object
    # of the length Amazon ECR takes, and tags the map of strings the module's
    # tags input is typed as. The same key and policy checks stand in
    # cloudformation/ecr: the override keys are spelt differently per target,
    # so the checks cannot sit in the realization-neutral Component, and a
    # MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32})$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and this Recipe takes the KMS key an Amazon ECR repository is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/<key id>, the form Amazon ECR records, not an alias or a bare key ID: set it to the key's ARN in the Release, or remove it to encrypt the images with Amazon S3-managed keys" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "repository_lifecycle_policy" -}}
      {{- $p := get $o "repository_lifecycle_policy" -}}
      {{- if not (and (typeIs "string" $p) (ge (len $p) 100) (le (len $p) 30720) (kindIs "map" (fromJson $p))) -}}
      {{- fail (printf "infra.overrides.repository_lifecycle_policy is %s, and Amazon ECR takes a lifecycle policy as the text of a JSON object of 100 to 30,720 characters: set it in the Release to such a policy, or remove it to keep every image" (trunc 120 (toJson $p))) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # values reach the mapping as the Component's schema and assertions hold
  # them: image_tag_mutability IMMUTABLE or MUTABLE, scan_on_push a boolean,
  # each defaulted. Each tag and the lifecycle policy reach Amazon ECR as
  # written: Terraform would read ${ and %{ inside a string as the start of
  # an interpolation or a directive. The mapping writes ${ as $${, which
  # Terraform turns back into the characters written; the terraform provider
  # writes every module argument with %{ already escaped as %%{, so the
  # mapping leaves %{ as it is.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    repository_name: {{ toJson .context.instance_id }}
    repository_image_tag_mutability: {{ toJson .values.image_tag_mutability }}
    repository_image_scan_on_push: {{ toJson .values.scan_on_push }}
    repository_force_delete: false
    attach_repository_policy: false
    create_repository_policy: false
    {{- with optional $o "kms_key_id" "" }}
    repository_encryption_type: "KMS"
    repository_kms_key: {{ toJson . }}
    {{- else }}
    repository_encryption_type: "AES256"
    {{- end }}
    {{- with optional $o "repository_lifecycle_policy" "" }}
    create_lifecycle_policy: true
    repository_lifecycle_policy: {{ toJson . | replace "${" "$${" }}
    {{- else }}
    create_lifecycle_policy: false
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}
