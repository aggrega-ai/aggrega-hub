apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-cloud-run
  version: 1.1.0
  description: >
    The generic background-worker primitive as one Cloud Run worker pool
    running infra.replicas instances of the Release's image, on the catalog's
    shared Cloud Run body. Reach for it in a Google Cloud project with a VPC
    network; for terraform/worker-ecs or cloudformation/worker-ecs in an AWS
    account, and helm/worker on Kubernetes.

    A worker pool is Cloud Run's resource for continuous background work: it
    has no endpoint or URL, the container declares no port, and it runs a
    fixed instance count with no autoscaling. The project, region, VPC network
    and service account are the operator's, each required under
    infra.overrides; a subnet and network tags are optional. Beside the worker
    pool, only a Secret Manager secret and its version for each file the
    component is handed are emitted — no service account, IAM binding,
    network, subnet or firewall rule.

    Each env entry an edge's inject block, or the component's own, dictates
    becomes a container variable under that name, written whole, so
    a Terraform reference a neighbour publishes is evaluated by the engine;
    concurrency and queue_depth_hint arrive by default as WORKER_CONCURRENCY
    and WORKER_QUEUE_DEPTH_HINT. Each file entry is mounted at its path from a
    secret volume holding it alone. No edge may dictate those two names while
    they are the defaults, a name Cloud Run reserves or refuses, or a file
    path it cannot mount; arg and other entries are refused by name. The
    container runs at the smallest worker pool size meeting infra.compute, so
    the Component's defaults run at 1 vCPU and 512 MiB.

    GoogleCloudPlatform/cloud-run/google is not sourced: at v0.34.2, its
    newest version, it declares no worker pool; only the hashicorp/google
    provider's resource does.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/worker:1.0.0

  # The module beside this Recipe is the fixed pass-through every container
  # Recipe of this catalog carries byte for byte: its one input, config, goes
  # to the service module the artifacts below import, and that module comes
  # back out as its service output. entity.lock pins it.
  #
  # Google's Cloud Run module, GoogleCloudPlatform/cloud-run/google, at v0.34.2,
  # the newest version its registry entry and its repository's tags carry,
  # declares a Cloud Run service in its v2 directory and a service in its root,
  # and nowhere a worker pool. The worker pool is therefore the catalog's own
  # WorkerPool body.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   project_id          - string (config.project_id), required
  #   region              - string (config.location), required
  #   private_network     - string (config.network), required
  #   service_account     - string (config.service_account), required
  #   subnetwork          - string (config.subnetwork)
  #   network_tags        - []string (config.tags)
  #   deletion_protection - bool (config.deletion_protection; default true)
  #
  # Each is passed to the key of the body's config named in brackets, which
  # CloudRunModule's WorkerPool body documents; network, subnetwork and tags
  # set the worker pool's one network interface. Some keys reuse a spelling
  # other Recipes already read for the same concept, so an operator writes
  # each under one name across the catalog's terraform Google Recipes:
  # project_id, region and private_network, as the Cloud SQL and Memorystore
  # Recipes read them, and deletion_protection, as the Cloud SQL Recipes read
  # it. These are the keys terraform/server-cloud-run reads, under the same
  # names.
  #
  # project_id, region, private_network and service_account are required and
  # none has a default: the project, the network and the identity the worker
  # runs as are provisioned outside this Release, no project-independent value
  # exists for any of them, and this Recipe never chooses a network or an
  # identity for the operator. private_network is the network's resource link,
  # projects/<project>/global/networks/<name>; the worker pool takes addresses
  # from subnetwork, or from the subnet named as the network while subnetwork
  # is unset, which must be a /26 or larger for Direct VPC egress. Egress is
  # private ranges only: traffic to a private address goes through the network
  # by Direct VPC egress, so a Cloud SQL or Memorystore address there is
  # reached, and other traffic leaves as it would with no network named.
  # service_account is the email of the account the worker runs as, which the
  # worker's code calls Google Cloud with, and which reads each file's secret
  # volume, so the operator grants it the Secret Manager Secret Accessor role on
  # those secrets; no IAM binding is emitted. The identity applying the
  # configuration needs leave to act as it. network_tags are matched by the
  # operator's egress firewall rules. deletion_protection is the provider's own
  # guard, true unless the Release turns it off, under which Terraform refuses
  # to destroy or replace the worker pool.
  #
  # Files. Each file entry an edge's inject block dictates is mounted at its
  # path, as CloudRunModule describes: one Secret Manager secret per file,
  # replicated automatically in project_id, holding the content in one
  # version, mounted as a secret volume at the file's directory with the file
  # alone in it, so whatever the image holds in that directory is hidden. A
  # file's content is held in the secret version and in Terraform state. No
  # file, no secret.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # CloudRunArguments#/mappings/WorkerPoolArguments:
  #   honoured — values.concurrency and values.queue_depth_hint as the locals
  #     below say, infra.image (required), infra.replicas as the worker pool's
  #     instance count, infra.compute.cpu and infra.compute.memory as the size
  #     that entry chooses, the overrides above, and env and file entries.
  #   refused — a compute quantity that entry cannot read, and a pair larger
  #     than the largest worker pool size; a component name Cloud Run does not
  #     take for a worker pool; an edge or the component's own inject block
  #     injecting a variable under one of the two default names the developer
  #     values are delivered under, or under a name Cloud Run reserves or
  #     refuses; a file path Cloud Run cannot mount; and an edge's arg or
  #     custom-mechanism entry.

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the two developer values. They are
  # delivered under the names helm/worker delivers them under, and only when
  # the developer set them, so an unset value renders no variable rather than
  # an empty one. Those names are defaults: each is rendered only while no
  # entry of the component's own inject block, in any mechanism, delivers its
  # value, and an edge or that block delivering either name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # component packages no upstream product, so no other local
  # CloudRunArguments reads is declared: no default image, so the Release
  # names the one it runs; no port, no probe, no GPU and no socket.
  locals:
    value_env: '{"values.concurrency": "WORKER_CONCURRENCY", "values.queue_depth_hint": "WORKER_QUEUE_DEPTH_HINT"}'

  artifacts:
    # The WorkerPool body: the worker pool and the secrets holding its files.
    service:
      $import: CloudRunModule#/artifacts/WorkerPool
    # A configuration applied with terraform/worker-cloud-run 1.0.0 holds the
    # worker pool at google_cloud_run_v2_worker_pool.this in this component's
    # module, the address that version declares it at; this version declares
    # it in the service module. The block moves it there, so Terraform keeps the running
    # worker pool rather than replacing it.
    moved.tf: |
      moved {
        from = google_cloud_run_v2_worker_pool.this
        to   = module.service.google_cloud_run_v2_worker_pool.this
      }

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: CloudRunArguments#/mappings/WorkerPoolArguments
