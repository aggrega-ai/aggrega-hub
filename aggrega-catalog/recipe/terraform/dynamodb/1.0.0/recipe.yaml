apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dynamodb
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # DynamoDB table module: the third-party code this Recipe pins and writes
  # into the output. The table it provisions is a service the reader
  # contracts for directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon DynamoDB, realized by the published DynamoDB table module of the
    terraform-aws-modules project, terraform-aws-modules/dynamodb-table/aws
    at v5.5.2, Apache-2.0, fetched from its git repository at that tag and
    pinned by the commit it names in the entity.lock beside this Recipe: one
    table, keyed, typed and indexed as the Component's values declare and
    billed as infra.billing_mode says, with read_capacity and write_capacity
    under PROVISIONED. An attached core/backup turns on the table's
    point-in-time recovery; one asking AWS Backup, through infra.role_arn,
    halts the build, in the FeatureRecipe it is bound to, since the catalog's
    AWS Backup realization backs up an Amazon RDS DB instance alone.

    host and endpoint publish DynamoDB's endpoint in the table's Region, and
    table_name and arn the module's outputs, as Terraform references that
    resolve for a consumer authored as a source: Recipe in the same root
    configuration. infra.overrides.host halts the build: the endpoint
    answers under the service's name alone.

    The operator's KMS key encrypts the table where kms_key_id names the
    key's ARN, an alias's ARN halting the build,
    deletion_protection protects it from deletion, and tags label it beside
    the Name tag the module writes on every table, its name. Capacity under PAY_PER_REQUEST, PROVISIONED without it, and any other
    key under infra.overrides halt the build naming the key. The module
    creates no role, key, bucket or network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/dynamodb:1.0.0

  # The published module, at the tag the registry publishes as version 5.5.2.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ and wrappers/ directories are vendored
  # with it and never loaded, since nothing the root declares reaches them.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-dynamodb-table.git
    ref: v5.5.2

  locals:
    # The table's name: values.table_name, or the instance's name, which the
    # Component's assertion holds to DynamoDB's rule for a table name.
    table_name: '{{ optional .values "table_name" .context.instance_id }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Amazon DynamoDB point-in-time recovery"

  # The String Pipe: the compiler does not interpret these strings. table_name
  # and arn name the module's dynamodb_table_id output, the table's name, and
  # its dynamodb_table_arn output, through this component's module call, which
  # the boundary's root configuration declares under .context.instance_id for
  # a component declared in the Aggregate the Release deploys. Terraform
  # resolves them at apply time, so they resolve only for a consumer authored
  # as a source: Recipe in the same root configuration, which reading either
  # is applied after the table; a consumer on another target receives them as
  # text.
  #
  # host is DynamoDB's endpoint in the table's Region, dynamodb.<region>.
  # followed by the domain suffix of the partition, such as amazonaws.com or
  # amazonaws.com.cn. The Region is the fourth field of the table's ARN,
  # arn:<partition>:dynamodb:<region>:<account>:table/<name>, split on the
  # colon the ARN carries as its fourth character, since a published string
  # reaches a consumer's module arguments inside a quoted template where a
  # quoted ":" of its own would end it. The suffix is the dns_suffix of the
  # aws_partition data source the boundary declares in aws-partition.tf,
  # below, which reads the partition of the AWS provider the module inherits.
  # endpoint is the same address after https://, reached on port 443.
  #
  # host is the service's own name. DynamoDB offers no custom domain, so every
  # name it answers under is one of the service's own and none is the
  # operator's choice; infra.overrides.host is refused by the assertion below
  # rather than published.
  provides:
    host: "dynamodb.${split(substr(module.{{ .context.instance_id }}.dynamodb_table_arn, 3, 1), module.{{ .context.instance_id }}.dynamodb_table_arn)[3]}.${data.aws_partition.current.dns_suffix}"
    port: "443"
    endpoint: "https://dynamodb.${split(substr(module.{{ .context.instance_id }}.dynamodb_table_arn, 3, 1), module.{{ .context.instance_id }}.dynamodb_table_arn)[3]}.${data.aws_partition.current.dns_suffix}"
    table_name: "${module.{{ .context.instance_id }}.dynamodb_table_id}"
    arn: "${module.{{ .context.instance_id }}.dynamodb_table_arn}"

  # This Recipe reads from infra.overrides:
  #   read_capacity       - integer (read_capacity, and each index's read_capacity), required
  #                         with infra.billing_mode PROVISIONED
  #   write_capacity      - integer (write_capacity, and each index's write_capacity), required
  #                         with infra.billing_mode PROVISIONED
  #   kms_key_id          - string (server_side_encryption_kms_key_arn, with
  #                         server_side_encryption_enabled true)
  #   deletion_protection - bool (deletion_protection_enabled)
  #   tags                - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # read_capacity and write_capacity are named by the module inputs they set.
  # kms_key_id, deletion_protection and tags are the keys, under the same
  # names, that the RDS Recipes of this catalog read for the KMS key a
  # resource is encrypted with, its deletion protection and its tags, so a
  # Release names each once whichever Recipe it configures.
  #
  # read_capacity and write_capacity are the table's capacity under
  # PROVISIONED, each a whole number from 1, and every global secondary index
  # is provisioned with the same: DynamoDB requires a capacity for each index
  # of a provisioned table, and the Component declares no index capacity of
  # its own. Under PAY_PER_REQUEST DynamoDB takes no capacity, so either key
  # set halts the build, as does PROVISIONED without both. The capacity is
  # fixed: the module's autoscaling_enabled input keeps its default, false,
  # so it writes no Application Auto Scaling target or policy.
  #
  # kms_key_id is the ARN of the operator's customer managed key the table
  # is encrypted with: the AWS provider takes the key by an ARN alone, its
  # kms_key_arn argument validated as one, so a key ID or an alias name
  # halts the build here. An alias's ARN halts by name too: the AWS provider
  # 6.73.0 reads kms_key_arn back from the table's KMSMasterKeyArn, the key
  # ARN DynamoDB reports, which the CloudFormation resource schema's
  # propertyTransform for KMSMasterKeyId also gives as a key's ARN, so an
  # alias's ARN would differ from what Terraform reads back and plan an
  # update of the table at every apply. Unset, the module's
  # server_side_encryption_enabled stays false and DynamoDB encrypts the table
  # with a key AWS owns. The key and its key policy are the operator's, named
  # here and never created.
  #
  # deletion_protection takes true or false; unset, the table is created
  # without deletion protection, as DynamoDB creates it, and a destroy
  # deletes the table, which deletion protection makes fail while it is on.
  # tags is a map from each tag name to a string, written on the table, the
  # one resource the module creates here. The module tags every table Name,
  # with the table's name as the value, after merging tags, so a Name key in
  # tags would be overwritten and halts the build instead.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: no stream, no time to live, no local secondary
  # index, no replica Region, no resource policy, no import from S3 and no
  # restore; the table class left unset, which the AWS provider reads as STANDARD; and the timeouts it sets, 10 minutes to
  # create and delete and 60 to update.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.table_name, values.key_schema,
  #     values.attribute_definitions, values.global_secondary_indexes,
  #     infra.billing_mode, a core/backup attachment, as the comment above the
  #     mapping says, and the overrides above.
  #   refused — capacity under PAY_PER_REQUEST, PROVISIONED without both
  #     capacity keys, a capacity that is not a whole number from 1, a
  #     deletion_protection that is not true or false, a kms_key_id that is
  #     not a key's ARN, tags that are not a map of strings,
  #     infra.overrides.host and any other key under infra.overrides, each as
  #     the comment above its
  #     assertion says; and, as the comment above the mapping says, a second
  #     core/backup attachment, a retention outside 1 to 35 days,
  #     infra.schedule, and infra.point_in_time_recovery false. A core/backup
  #     attachment carrying infra.role_arn is refused by the FeatureRecipe it
  #     is bound to, as the same comment says. The Component's own assertions
  #     hold the keys and indexes to DynamoDB's rules.
  #   not read — none: the Component declares no key this Recipe has no
  #     setting for.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "read_capacity" "write_capacity" "kms_key_id" "deletion_protection" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and DynamoDB answers at its own endpoint in the table's Region alone, offers no custom domain, and every name it answers under is one of the service's own, none of them the operator's choice: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads read_capacity, write_capacity, kms_key_id, deletion_protection and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # DynamoDB requires a read and a write capacity on a PROVISIONED table, a
    # whole number from 1 each, and takes none on a PAY_PER_REQUEST table
    # (the CreateTable reference: "If you set BillingMode as PROVISIONED, you
    # must specify this property. If you set BillingMode as PAY_PER_REQUEST,
    # you cannot specify this property"); the AWS provider refuses a capacity
    # below 1 under PROVISIONED and any other than 0 under PAY_PER_REQUEST.
    capacity_follows_billing_mode: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $set := list -}}
      {{- range $k := list "read_capacity" "write_capacity" }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end -}}
      {{- if eq .infra.billing_mode "PAY_PER_REQUEST" -}}
      {{- with $set -}}
      {{- fail (printf "infra.overrides.%s is set, and infra.billing_mode is PAY_PER_REQUEST, under which DynamoDB bills each request and takes no provisioned capacity: remove it from the Release, or set infra.billing_mode to PROVISIONED" (first .)) -}}
      {{- end -}}
      {{- else -}}
      {{- range $k := list "read_capacity" "write_capacity" -}}
      {{- if not (hasKey $o $k) -}}
      {{- fail (printf "infra.billing_mode is PROVISIONED, and DynamoDB requires a provisioned table's read and write capacity, but infra.overrides.%s carries none: set infra.overrides.read_capacity and infra.overrides.write_capacity in the Release, or set infra.billing_mode to PAY_PER_REQUEST" $k) -}}
      {{- end -}}
      {{- if not (regexMatch `^[1-9][0-9]*$` (toString (get $o $k))) -}}
      {{- fail (printf "infra.overrides.%s is %v, and DynamoDB takes a provisioned capacity as a whole number of capacity units from 1: set it to one in the Release" $k (get $o $k)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # deletion_protection is passed to the module as a boolean, kms_key_id as
    # the ARN the AWS provider validates its kms_key_arn argument as, and tags
    # as the map of strings the module's tags input is typed as.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "deletion_protection" -}}
      {{- if not (kindIs "bool" $o.deletion_protection) -}}
      {{- fail (printf "infra.overrides.deletion_protection is %v, and DynamoDB takes true or false for a table's deletion protection: set it to true or false in the Release, or remove it to create the table without deletion protection" $o.deletion_protection) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^arn:[^:\s]+:kms:[^:\s]*:[0-9]{12}:(key|alias)/\S+$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and the AWS provider takes the KMS key a DynamoDB table is encrypted with by its ARN, arn:<partition>:kms:<region>:<account>:key/<id>: set it to the key's ARN in the Release, or remove it to encrypt the table with a key AWS owns" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- if contains ":alias/" $o.kms_key_id -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, an alias's ARN, and the AWS provider records the key's own ARN that DynamoDB reports in place of an alias's and would plan an update of the table at every apply: set it to the key's ARN, arn:<partition>:kms:<region>:<account>:key/<id>, in the Release" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if and $ok (hasKey $g "Name") -}}
      {{- fail "infra.overrides.tags carries a Name key, and the module tags every table Name with the table's name, overwriting any value set here: remove Name from infra.overrides.tags in the Release" -}}
      {{- end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # key maps onto the module's hash_key and range_key, the partition and sort
  # key's attributes, and attribute_definitions onto its attributes, each a
  # name and a type. Each index is the module's global_secondary_indexes
  # entry of name, hash_key, range_key where the index has a sort key,
  # projection_type and non_key_attributes under INCLUDE, with read_capacity
  # and write_capacity under PROVISIONED. The module writes each index's
  # hash_key and range_key arguments, which the AWS provider marks as
  # deprecated in favour of key_schema and still applies: a deprecation
  # warning Terraform may print for them changes nothing in the table.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside, and kept as the
  # table's point-in-time recovery, which this Recipe sets through the module
  # inputs point_in_time_recovery_enabled and
  # point_in_time_recovery_period_in_days:
  #   - With none attached, point-in-time recovery is off, as DynamoDB creates
  #     a table, and point_in_time_recovery_enabled is written false.
  #   - An attachment carrying no infra.role_arn, bound to
  #     terraform/backup-native, turns it on. DynamoDB then backs the table up
  #     continuously, and a restore reaches any point of the recovery period,
  #     up to about five minutes before the present. infra.retention_days is
  #     point_in_time_recovery_period_in_days, the length of that period, 1 to
  #     35 days, the range DynamoDB keeps, and a value outside it halts naming
  #     the attachment. Point-in-time recovery takes no backup at a time of
  #     day, so infra.schedule halts naming it. A restore is made to a new
  #     table, outside the Release. When a table with point-in-time recovery
  #     on is deleted, DynamoDB keeps a backup of it for 35 days.
  #   - An attachment carrying infra.role_arn asks AWS Backup to back the
  #     table up, and halts naming it before this mapping is read: bound to
  #     terraform/backup-native, that FeatureRecipe refuses the role, and
  #     bound to terraform/backup-aws-backup, which selects an Amazon RDS DB
  #     instance, that FeatureRecipe refuses a host of another type.
  #   - Two attachments halt naming both: a table has one point-in-time
  #     recovery setting.
  #   - Point-in-time recovery is what the attachment turns on, so
  #     infra.point_in_time_recovery left out or true is what the table gives,
  #     and false halts naming it.
  # A Recipe's locals cannot read its attachments, so the reading sits at the
  # top of the mapping below. cloudformation/dynamodb declares it in the same
  # words, for the resource's properties: a change to it is made to both.
  #
  # Every string the Aggregate writes reaches the mapping as a JSON string.
  # Each attribute name, the key and each tag reach DynamoDB as written: the
  # root configuration writes a module argument's %{ as %%{ itself and keeps
  # ${, which a reference to another module's output needs, so ${ inside
  # them is written $${ here, which Terraform turns back into the characters
  # written.
  valuesMapping: |
    {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
    {{- $backup := "" -}}{{- $backupInfra := dict -}}
    {{- range $name, $attachment := (default dict .features) -}}
    {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
    {{- if $backup -}}
    {{- fail (printf "core/backup attachments %q and %q on %q both turn on the table's point-in-time recovery, and a DynamoDB table has one point-in-time recovery setting: remove one of the two" $backup $name $.context.instance_id) -}}
    {{- end -}}
    {{- $backup = $name -}}{{- $backupInfra = default dict (optional $attachment "infra" dict) -}}
    {{- end -}}
    {{- end -}}
    {{- $recoveryDays := 0 -}}
    {{- if $backup -}}
    {{- if eq (toString (optional $backupInfra "point_in_time_recovery" "")) "false" -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and the backup the attachment configures on a DynamoDB table is its point-in-time recovery: remove infra.point_in_time_recovery from the attachment, or set it to true" $backup .context.instance_id) -}}
    {{- end -}}
    {{- with trim (toString (optional $backupInfra "schedule" "")) -}}
    {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and DynamoDB's point-in-time recovery backs the table up continuously, taking no backup at a time of day: remove infra.schedule from the attachment" $backup $.context.instance_id .) -}}
    {{- end -}}
    {{- $recoveryDays = int (optional $backupInfra "retention_days" 7) -}}
    {{- if or (lt $recoveryDays 1) (gt $recoveryDays 35) -}}
    {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and DynamoDB's point-in-time recovery keeps a recovery period of 1 to 35 days: set infra.retention_days to 35 or fewer" $backup .context.instance_id $recoveryDays) -}}
    {{- end -}}
    {{- end -}}
    {{- $o := optional .infra "overrides" dict -}}
    {{- $provisioned := eq .infra.billing_mode "PROVISIONED" -}}
    {{- $attributes := list -}}
    {{- range .values.attribute_definitions }}{{ $attributes = append $attributes (dict "name" .attribute_name "type" .attribute_type) }}{{ end -}}
    {{- $indexes := list -}}
    {{- range .values.global_secondary_indexes -}}
    {{- $i := dict "name" .index_name "projection_type" .projection.projection_type -}}
    {{- range .key_schema }}{{ $_ := set $i (ternary "hash_key" "range_key" (eq .key_type "HASH")) .attribute_name }}{{ end -}}
    {{- with optional .projection "non_key_attributes" list }}{{ $_ := set $i "non_key_attributes" . }}{{ end -}}
    {{- if $provisioned }}{{ $_ := set $i "read_capacity" $o.read_capacity }}{{ $_ := set $i "write_capacity" $o.write_capacity }}{{ end -}}
    {{- $indexes = append $indexes $i -}}
    {{- end -}}
    name: {{ toJson .locals.table_name }}
    billing_mode: "{{ .infra.billing_mode }}"
    {{- range .values.key_schema }}
    {{ ternary "hash_key" "range_key" (eq .key_type "HASH") }}: {{ toJson .attribute_name | replace "${" "$${" }}
    {{- end }}
    attributes: {{ toJson $attributes | replace "${" "$${" }}
    {{- if $provisioned }}
    read_capacity: {{ $o.read_capacity }}
    write_capacity: {{ $o.write_capacity }}
    {{- end }}
    {{- with $indexes }}
    global_secondary_indexes: {{ toJson . | replace "${" "$${" }}
    {{- end }}
    point_in_time_recovery_enabled: {{ if $backup }}true{{ else }}false{{ end }}
    {{- if $backup }}
    point_in_time_recovery_period_in_days: {{ $recoveryDays }}
    {{- end }}
    {{- with optional $o "kms_key_id" "" }}
    server_side_encryption_enabled: true
    server_side_encryption_kms_key_arn: {{ toJson . | replace "${" "$${" }}
    {{- end }}
    {{- if hasKey $o "deletion_protection" }}
    deletion_protection_enabled: {{ $o.deletion_protection }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes; the same name with other bytes halts the
  # build. The aws_partition data source reads the partition of the AWS
  # provider the root configures, which the module inherits, and host and
  # endpoint above read its dns_suffix. It creates nothing. The file declares
  # no required_providers block, unlike the AWS bodies the catalog authors as
  # modules: it belongs to the root configuration, where Terraform takes one
  # such block, and a second, from another component's file, would fail init.
  # The provider version the root installs is the one every module's own
  # constraint admits, this Recipe's module's hashicorp/aws >= 6.28 among
  # them, and every version of that provider the module admits carries the data source.
  boundary:
    artifacts:
      aws-partition.tf: |
        data "aws_partition" "current" {}
