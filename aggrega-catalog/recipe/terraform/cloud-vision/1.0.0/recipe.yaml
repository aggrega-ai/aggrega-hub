apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloud-vision
  version: 1.0.0
  description: >
    Google Cloud's Vision API as a reference realization on Terraform: the
    module this Recipe writes declares no resource and reaches no provider,
    so applying it creates nothing, and it carries the endpoint the Release
    supplies as an output of the module.

    Reach for it where the Release deploys Terraform to Google Cloud.
    Declaring no provider, the module shares a root with a module at any
    google version. A consumer reads the endpoint as the text the Release
    gives, and nothing is looked up when the configuration is applied. A
    missing infra.endpoint halts naming it, and so does any infra.overrides
    key, since this Recipe reads none. No credential is delivered: a
    consumer calls with its own Google identity, such as the service account
    a Cloud Run service runs as.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-tool/cloud-vision:1.0.0

  # This Recipe reads no infra.overrides key. Each one halts naming it,
  # project_id, region and location among them: the module declares no
  # resource to place in a project or a location, and the endpoint the
  # Release supplies already names where a request's data is processed.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — infra.endpoint, published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint, and any infra.overrides
  #     key.
  #   not read — none; the Component declares no values and no other infra
  #     key.
  #
  # The google provider declares no resource for the Vision API: the API is
  # Google's, called in a project where the operator has enabled it, and the
  # products a caller keeps through Product Search are created by its own
  # requests. So this Recipe declares no resource.
  #
  # Backup. The Vision API is Google's, and this Recipe creates nothing to
  # back up.
  assertions:
    # The global endpoint and the European Union and United States ones
    # differ in where Google stores and processes a request's data, which is
    # the operator's choice, so no address exists for the catalog to hold as
    # a default: the Release names the endpoint it calls.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches the Vision API at the global endpoint or at one that keeps a request's data in the European Union or the United States, as the operator chooses, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to https://vision.googleapis.com, https://eu-vision.googleapis.com or https://us-vision.googleapis.com" -}}
      {{- end -}}
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads no key from infra.overrides: it reaches the Vision API at the endpoint the Release supplies and declares no resource a key could set: remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret this string. The
  # endpoint comes from the operator's infra and is published as written, so
  # a consumer in this root or on another target reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"

  # The module this component becomes: no resource and no provider, so
  # applying it creates nothing and it takes no google version, and an
  # output for the value the component publishes, so the state records what
  # the configuration was given. The value is written as a JSON string, with
  # Terraform's own template sequences ${ and %{ escaped as $${ and %%{, so
  # Terraform reads back exactly the text the Release gives.
  artifacts:
    main.tf: |
      output "endpoint" {
        value = {{ .infra.endpoint | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }
