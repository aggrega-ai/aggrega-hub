apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-service-bus
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Service Bus namespace module: the third-party code this Recipe pins and
  # writes into the output. The namespace it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Service Bus: one namespace, with the queues values.queues
    declares and the topics and subscriptions values.topics declares,
    realized by Microsoft's Azure Verified Modules module
    Azure/avm-res-servicebus-namespace/azurerm at v0.5.0, MIT, its tag's
    commit pinned in entity.lock.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-service-bus where it deploys an Azure Resource Manager
    template. The module admits hashicorp/azurerm 4 alone, so this Recipe
    goes in a boundary apart from the Azure Recipes that need azurerm 5.
    infra.overrides names the operator's resource group and region. The
    namespace runs on the Standard tier unless infra.overrides.sku_name
    names Basic or Premium, a Premium namespace on one messaging unit
    unless infra.overrides.sku_capacity names more. Public network access
    is on unless infra.overrides.public_network_access_enabled is false;
    the private endpoint, which the service offers on the Premium tier
    alone, is the operator's. The module's telemetry is off unless
    infra.overrides.enable_telemetry is true.

    Shared access signature authentication is off and no authorization
    rule is declared, so the namespace takes Microsoft Entra ID alone. host
    is a reference to the DNS name in the endpoint the service reports, or
    infra.overrides.host; endpoint is that URL, or one built on
    infra.overrides.host. A value or an infra.overrides key the service or
    the module cannot take halts naming it, as do topics, and a queue
    requiring sessions, on the Basic tier, which the module would drop.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/azure-service-bus:1.0.0

  # The published module, at the tag the registry publishes as version 0.5.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root. The root calls no module, so the
  # configuration Terraform loads from it calls no registry module and
  # initialising it fetches providers and nothing else. The repository's
  # examples/ and tests/ directories are vendored with it and never loaded.
  #
  # The module declares hashicorp/azurerm "~> 4.14" and Azure/azapi "~> 2.12"
  # in its own required_providers, and Terraform ">= 1.9, < 2.0". It creates
  # the namespace as an azurerm_servicebus_namespace, each queue as an
  # azurerm_servicebus_queue, each topic as an azurerm_servicebus_topic and
  # each subscription as an azurerm_servicebus_subscription. It is vendored
  # byte for byte, so this Recipe adds no provider constraint of its own.
  # "~> 4.14" admits no azurerm 5 release, while the catalog's own Azure
  # bodies declare "~> 5.14" and terraform/azure-api-management pins azurerm
  # at exactly 5.9.0, so one root configuration cannot install a provider
  # satisfying both: a Release places this namespace in a terraform boundary
  # apart from those bodies. The Container Apps bodies of the generic compute
  # Recipes admit azurerm 4 and 5 alike, so they share its boundary.
  source:
    kind: git-repository
    url: https://github.com/Azure/terraform-azurerm-avm-res-servicebus-namespace.git
    ref: v0.5.0

  locals:
    # The name the Release gives the namespace under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The tier, infra.overrides.sku_name or Standard. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name            - string (resource_group_name), required
  #   location                       - string (location), required
  #   sku_name                       - string (sku, Basic, Standard or Premium; default Standard)
  #   sku_capacity                   - integer (capacity, the messaging units of a Premium
  #                                    namespace, 1, 2, 4, 8 or 16; default 1)
  #   public_network_access_enabled  - bool (public_network_access_enabled; default true)
  #   enable_telemetry               - bool (enable_telemetry; false unless set to true here,
  #                                    where the module's own default is true)
  #   tags                           - map[string]string (tags)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  #
  # Each is named by the module input it sets, given in brackets, save
  # sku_name and sku_capacity, which every Azure Recipe reads for the tier a
  # service is provisioned at and the units it is provisioned with, and host,
  # which every managed Recipe reads for the address it publishes.
  # arm/azure-service-bus reads each of them but resource_group_name under the
  # same spelling: its template deploys into the group it is deployed to.
  # resource_group_name and location are required: they place the namespace
  # in the operator's subscription, and this Recipe never chooses either. The
  # module takes the resource group by its name, so nothing is composed from
  # the subscription Terraform runs against.
  #
  # sku_name. Microsoft documents three tiers: Basic, queues alone; Standard,
  # which adds topics and subscriptions, sessions, transactions and duplicate
  # detection on shared capacity billed per operation; and Premium, dedicated
  # messaging units with private endpoints and messages up to 100 MB. Unset,
  # the namespace runs on Standard, the lowest tier offering every value the
  # Component declares, where the module's own default is Premium. The module
  # takes the tier as Basic, Standard or Premium, spelt so, by its own
  # validation, which the assertions below check first. On Basic the module
  # creates no topic and passes no queue's requires_session, so any topic
  # and any queue requiring sessions halt below, naming the key and the tier,
  # rather than being dropped.
  #
  # sku_capacity. Microsoft gives a Premium namespace 1, 2, 4, 8 or 16
  # messaging units, and the other tiers none; the module takes the same
  # numbers and writes no units on another tier, whatever it is given. Unset,
  # a Premium namespace runs on one, the module's own default; set beside
  # another tier, or to another number, it halts below.
  #
  # public_network_access_enabled. A namespace takes requests over its public
  # endpoint, from every network unless IP rules restrict it, or over a
  # private endpoint in a virtual network. Unset or true, the module's own
  # default and the service's, public network access is on, and since this
  # Recipe passes the module's network rules with no IP rule, the public
  # endpoint takes requests from every network, each still authenticated with
  # Microsoft Entra ID; false turns it off, and the namespace takes requests
  # through a private endpoint alone. This Recipe passes no private_endpoints:
  # each is the operator's, created for the namespace outside the Release,
  # the way a virtual network's subnets and private DNS zones are, and
  # Microsoft offers private endpoints on the Premium tier alone, so a Basic
  # or Standard namespace with public network access off takes requests from
  # no network.
  #
  # While enable_telemetry is true, the module's default, the module submits
  # an empty Azure Resource Manager template to the subscription, in the
  # namespace's region, which Microsoft counts as usage of the module. This
  # Recipe passes false unless infra.overrides.enable_telemetry is true; any
  # value that is not a boolean is refused below.
  #
  # Any other key under infra.overrides halts the build naming it, so a key
  # misspelt, or meant for another Recipe, is never passed over unread.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: TLS 1.2 at least; one messaging partition on
  # Premium; a network rule set whose default action is Allow, with no IP or
  # virtual network rule; and no managed identity, customer-managed key,
  # authorization rule, private endpoint, role assignment, diagnostic setting
  # or lock. Each queue keeps the module's settings: a peek-lock of one
  # minute, a maximum size of 1,024 MB, the service's own message lifetime, no
  # dead-lettering of an expired message and no duplicate detection. Each
  # topic keeps them too: 1,024 MB, the service's own message lifetime and no
  # duplicate detection. Each subscription keeps the service's own message
  # lifetime and a peek-lock of one minute, and dead-letters a message its
  # filter fails on but not an expired one. arm/azure-service-bus keeps
  # another module's settings, which differ in these: a queue's and a
  # topic's messages there are kept 14 days, a queue dead-letters an expired
  # message, a topic detects duplicates over a ten-minute window, and a
  # subscription does not dead-letter a message its filter fails on.
  # local_auth_enabled, whose default is true, is written as false, so the
  # contract that no key reaches a consumer stands in the configuration
  # itself.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's inputs:
  #   honoured — values.queues, as the namespace's queues, each with its
  #     requires_session and max_delivery_count; values.topics, as its
  #     topics, each with its subscriptions and theirs; and the overrides
  #     above.
  #   refused — a namespace name the service refuses; any topic, and any
  #     queue requiring sessions, on the Basic tier; an
  #     infra.overrides.resource_group_name or location left out or given as
  #     anything but a string; and any infra.overrides key not listed above,
  #     or a value of one the service or the module cannot take. A queue,
  #     topic or subscription name and a delivery count outside what the
  #     service takes are refused by the Component's own schema before this
  #     Recipe renders.
  #   not read — none.
  #
  # Backup. Microsoft documents that Service Bus keeps replicas of message
  # data but offers no backup or restore of it, so this Recipe configures
  # none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the namespace is created in, by its name, such as example-rg" "location" "the one Azure region the namespace is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its Service Bus namespace in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "sku_name" "sku_capacity" "public_network_access_enabled" "enable_telemetry" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, sku_name, sku_capacity, public_network_access_enabled, enable_telemetry, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (kindIs "bool" $t) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and it is passed to the module as a boolean: set it to true to turn the module's telemetry on, or to false or remove it to keep it off" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the namespace's public network access as a boolean: set it to false to turn it off, or to true or remove it to keep it on" $p) -}}
      {{- end -}}
    # The tier and its messaging units, read off Microsoft's documentation of
    # the tiers and the module's own validation: Basic, Standard and Premium,
    # spelt so; and 1, 2, 4, 8 or 16 messaging units, on Premium alone.
    sku: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := optional $o "sku_name" "Standard" -}}
      {{- if not (has $s (list "Basic" "Standard" "Premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Azure Service Bus offers the Basic, Standard and Premium tiers, which the module this Recipe deploys takes spelt so: set infra.overrides.sku_name to one of them, or remove it for Standard" $s) -}}
      {{- end -}}
      {{- if hasKey $o "sku_capacity" -}}
      {{- $c := get $o "sku_capacity" -}}
      {{- if ne $s "Premium" -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and infra.overrides.sku_name gives the %s tier, to which Azure Service Bus allocates no messaging units, which it gives the Premium tier alone: remove infra.overrides.sku_capacity, or set infra.overrides.sku_name to Premium" $c $s) -}}
      {{- end -}}
      {{- if not (and (or (kindIs "int" $c) (kindIs "int64" $c) (and (kindIs "float64" $c) (eq (float64 (int $c)) $c))) (has (int $c) (list 1 2 4 8 16))) -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and Azure Service Bus gives a Premium namespace 1, 2, 4, 8 or 16 messaging units: set infra.overrides.sku_capacity to one of them, or remove it for one" $c) -}}
      {{- end -}}
      {{- end -}}
    # Microsoft documents that the Basic tier supports queues alone, with no
    # topics and subscriptions, and no sessions; on Basic the module drops
    # every topic and every queue's requires_session without a word, so both
    # are refused here.
    basic_tier: >-
      {{- if eq (toString (optional (optional .infra "overrides" dict) "sku_name" "Standard")) "Basic" -}}
      {{- range $name, $_ := (default dict .values.topics) -}}
      {{- fail (printf "values.topics declares the topic %q, and infra.overrides.sku_name is Basic, a tier Microsoft documents as offering queues alone, with no topics and subscriptions: remove the topics from the Aggregate, or set infra.overrides.sku_name to Standard or Premium in the Release" $name) -}}
      {{- end -}}
      {{- range $name, $q := (default dict .values.queues) -}}
      {{- if eq (toString (optional $q "requires_session" false)) "true" -}}
      {{- fail (printf "values.queues.%s.requires_session is true, and infra.overrides.sku_name is Basic, a tier Microsoft documents as offering no sessions: set requires_session to false in the Aggregate, or infra.overrides.sku_name to Standard or Premium in the Release" $name) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a consumer of this namespace reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the namespace answers HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The namespace is named after the component, and its name is also the
    # first label of the address the service gives it under
    # servicebus.windows.net, so it is unique across Azure. Microsoft's
    # documentation of Azure resource names and of creating a namespace gives
    # a namespace name 6 to 50 letters, digits and hyphens, beginning with a
    # letter, ending with a letter or a digit, and not ending in -sb or -mgmt,
    # a narrower rule than the module's own validation, which admits a name
    # beginning with a digit; it is checked here, where the name is known.
    namespace_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if or (not (regexMatch `^[A-Za-z][A-Za-z0-9-]{4,48}[A-Za-z0-9]$` $n)) (hasSuffix "-sb" (lower $n)) (hasSuffix "-mgmt" (lower $n)) -}}
      {{- fail (printf "the component %q names its Service Bus namespace, and Microsoft documents a namespace name as 6 to 50 letters, digits and hyphens, beginning with a letter, ending with a letter or a digit, and not ending in -sb or -mgmt: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # service reports the namespace's endpoint as
  # https://<namespace>.servicebus.windows.net:443/ in the public cloud, under
  # its cloud's own domain elsewhere, and the azurerm provider reads it into
  # the namespace's endpoint attribute. The module publishes the namespace
  # whole as its resource output, which it marks sensitive, and the endpoint
  # alone is not: nonsensitive() takes the mark off the one attribute, so a
  # consumer's configuration carries it as the plain address it is. host
  # takes the DNS name between https:// and the port, splitting the endpoint
  # on the slash the module's resource_id output begins with and on the colon
  # the endpoint carries itself, its sixth character, so that no quoted string
  # stands inside the interpolation; it holds whichever domain the service's
  # cloud gives, the fully qualified namespace a Service Bus client library
  # connects to. endpoint is the attribute as the service reports it. Each
  # reads this component's module call, which the boundary's root
  # configuration declares under .context.instance_id for a component
  # declared in the Aggregate the Release deploys. Terraform resolves it at
  # apply time, so it resolves only for a consumer authored as a source:
  # Recipe in the same root configuration; a consumer on another target
  # receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, and endpoint is https://<name>:443/. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the namespace outside the Release. A client checking
  # the namespace's certificate needs a name the certificate carries, which is
  # the namespace's own name under servicebus.windows.net or the private link
  # name that resolves to it. A consumer in the same root configuration
  # receives the name as well, and a name carries no reference for Terraform
  # to order its module after this one by; a later syncWave on the consumer's
  # boundary, sharing this boundary's directory, orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${split(substr(nonsensitive(module.{{ .context.instance_id }}.resource.endpoint), 5, 1), split(substr(module.{{ .context.instance_id }}.resource_id, 0, 1), nonsensitive(module.{{ .context.instance_id }}.resource.endpoint))[2])[0]}{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}:443/{{ else }}${nonsensitive(module.{{ .context.instance_id }}.resource.endpoint)}{{ end }}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # namespace is named after the component, as the other managed Recipes name
  # theirs.
  #
  # Each queue is one entry of the module's queues, and each topic one of its
  # topics, with its subscriptions, each keyed by its name. A queue or
  # subscription requires sessions while its requires_session is true, and
  # takes max_delivery_count, 10 unless set, the service's default.
  #
  # enable_telemetry is always rendered: false, unless
  # infra.overrides.enable_telemetry is true.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    resource_group_name: "{{ $o.resource_group_name }}"
    location: "{{ $o.location }}"
    sku: "{{ .locals.sku }}"
    {{- if eq .locals.sku "Premium" }}
    capacity: {{ int (optional $o "sku_capacity" 1) }}
    {{- end }}
    local_auth_enabled: false
    public_network_access_enabled: {{ if optional $o "public_network_access_enabled" true }}true{{ else }}false{{ end }}
    queues:
    {{- range $name, $q := (default dict .values.queues) }}
      {{ toJson $name }}:
        requires_session: {{ if eq (toString (optional $q "requires_session" false)) "true" }}true{{ else }}false{{ end }}
        max_delivery_count: {{ int (optional $q "max_delivery_count" 10) }}
    {{- else }} {}
    {{- end }}
    topics:
    {{- range $name, $t := (default dict .values.topics) }}
      {{ toJson $name }}:
        subscriptions:
        {{- range $sub, $s := (default dict (optional $t "subscriptions" dict)) }}
          {{ toJson $sub }}:
            requires_session: {{ if eq (toString (optional $s "requires_session" false)) "true" }}true{{ else }}false{{ end }}
            max_delivery_count: {{ int (optional $s "max_delivery_count" 10) }}
        {{- else }} {}
        {{- end }}
    {{- else }} {}
    {{- end }}
    {{- $t := optional $o "enable_telemetry" false }}
    enable_telemetry: {{ and (kindIs "bool" $t) $t }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes: another component bound to this Recipe, or
  # one whose Recipe configures azurerm the same way under the same name. The
  # same name with other bytes halts the build. The azurerm provider refuses
  # to plan without its features block, and a vendored module carries no
  # provider block of its own, so the module inherits this configuration; the
  # provider reads its credentials and subscription from the environment
  # Terraform runs in. Terraform destroys the module's resources with it, so
  # the file stays while any component declaring it does: remove the last of
  # them from a Release only after destroying what their modules created,
  # because with the provider file gone Terraform refuses to plan, asking for
  # a provider block with the features argument. The azapi provider the
  # module also declares is left to its default configuration, since no
  # provider block names it.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
