apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: aws-certificate-manager
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # ACM module: the third-party code this Recipe pins and writes into the
  # output. The certificate it requests is a service the reader contracts for
  # directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    AWS Certificate Manager, realized by the published ACM module of the
    terraform-aws-modules project, terraform-aws-modules/acm/aws at v6.3.1,
    Apache-2.0, fetched from its git repository at that tag and pinned by
    the commit it names in the entity.lock beside this Recipe: one
    certificate for the component's names, validated through DNS. The
    module writes each name's validation record into the operator's Route 53
    hosted zone, infra.overrides.zone_id, and waits for ACM to issue the
    certificate; no zone or role is created.

    arn publishes the module's acm_certificate_arn output, which resolves
    once ACM has issued the certificate, for a consumer authored as a
    source: Recipe in the same root configuration; the apply waits up to 75
    minutes. A validation record already in the zone is taken over, and a
    destroy deletes the records. Changing a name replaces the certificate,
    the new one issued before the old one is deleted, which ACM refuses
    while another AWS service uses it. tags label the certificate.
    zone_id unset or not a string, tags not a map of strings,
    infra.overrides.host, and any infra.overrides key not listed halt the
    build naming the key.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/security/aws-certificate-manager:1.0.0

  # The published module, at the tag the registry publishes as version 6.3.1.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ and wrappers/ directories are vendored
  # with it and never loaded, since nothing the root declares reaches them.
  #
  # The module declares hashicorp/aws >= 6.28 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-acm.git
    ref: v6.3.1

  # The String Pipe: the compiler does not interpret this string. arn names
  # the module's acm_certificate_arn output, through this component's module
  # call, which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The module gives that output from its
  # aws_acm_certificate_validation resource, so Terraform resolves it once
  # ACM has issued the certificate, and only for a consumer authored as a
  # source: Recipe in the same root configuration, which is applied after
  # the certificate is issued; a consumer on another target receives it as
  # text. No address is published: a certificate has none.
  provides:
    arn: "${module.{{ .context.instance_id }}.acm_certificate_arn}"

  # This Recipe reads from infra.overrides:
  #   zone_id - string, required (zone_id), the ID of the operator's Route 53
  #             public hosted zone
  #   tags    - map[string]string (tags)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # zone_id is named by the module input it sets, and tags is the key, under
  # the same name, that the catalog's terraform Recipes for AWS read for a
  # resource's tags, so a Release names it once whichever Recipe it
  # configures.
  #
  # zone_id is the operator's Route 53 public hosted zone, the one serving
  # every name the certificate carries, given by its ID, such as
  # Z0123456789ABCDEFGHIJ; the AWS provider, at 6.73.0, also takes it with
  # the /hostedzone/ prefix the Route 53 API returns, which it removes. The
  # module writes one validation record, a CNAME with a TTL of 60 seconds,
  # its default, for each distinct name with any leading *. removed, so a
  # wildcard name and its base name, which ACM gives one record (ACM User
  # Guide, "AWS Certificate Manager DNS validation"), take one record; every
  # record goes into zone_id, since the mapping writes no zone for any name
  # of its own (the module's zones input stays empty). ACM looks for each
  # record in public DNS, so a private hosted zone, or a zone not serving a
  # name, leaves that name unvalidated, and ACM marks the certificate as
  # timed out after 72 hours (the same guide, "Troubleshoot DNS validation
  # problems").
  #
  # A validation record already in the zone. ACM gives a name the same
  # record for every certificate its account requests for it, in any Region
  # (the same page), so a name the account has validated before may already
  # have its record in the zone. The mapping writes
  # validation_allow_overwrite_records true, the module's default, so the
  # AWS provider writes each record by UPSERT and takes over one already
  # there, whose name and value are those it writes; with false the
  # provider's CREATE fails the apply on it. A record taken over is deleted
  # on a destroy like the others, and ACM then stops renewing any other
  # certificate of the account that still carries its name.
  #
  # tags is a map from each tag name to a string, written on the
  # certificate, the one resource the module creates here that takes tags:
  # a Route 53 record takes none.
  #
  # host is not read: a certificate has no address, so
  # infra.overrides.host halts the build naming it.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.domain_name, as domain_name;
  #     values.subject_alternative_names, as subject_alternative_names, an
  #     empty list while it is unset, the module's default; and the
  #     overrides above. The Component refuses more than 100 names and a
  #     name that is not a fully qualified domain name, for every
  #     realization, and its schema the names ACM does not take.
  #   refused — zone_id unset, not a string or empty; tags that are not a
  #     map of strings; infra.overrides.host; and any infra.overrides key not
  #     listed above.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The CloudFormation Recipe of this Component holds the same rule on
  # HostedZoneId, and refuses there the /hostedzone/ prefix CloudFormation
  # does not take: each target reads the key under its own spelling, so the
  # rule cannot sit in the Component.
  #
  # What the mapping writes beside these: validation_method DNS, always,
  # since the module passes none unless set and the AWS provider requests no
  # certificate without a validation method or a private certificate
  # authority, as the CloudFormation Recipe of this Component writes
  # ValidationMethod DNS; and the module's toggles that create the
  # certificate, write the validation records and wait for the validation,
  # create_certificate, create_route53_records, validate_certificate and
  # wait_for_validation, each true, its default, and
  # create_route53_records_only false, its default, so the module creates the
  # certificate and its records together. The module's other defaults stand,
  # and ACM's with them: no key_algorithm, so an RSA_2048 key pair, ACM's
  # default; certificate transparency logging, which the module writes
  # ENABLED and ACM no longer lets a public certificate opt out of
  # (RequestCertificate); no export, which leaves the certificate as ACM
  # requests it, not exportable; no private certificate authority, no email
  # validation domain, no region of its own, so the Region the AWS provider
  # is configured for; and no validation_timeout, so the AWS provider's
  # default, below. The CloudFormation Recipe of this Component writes the
  # same, so both targets agree. Nothing beside the certificate, its
  # validation records and the validation is declared: no hosted zone, IAM
  # role or policy.
  #
  # Waiting for validation. aws_acm_certificate_validation, which the module
  # declares while wait_for_validation is true, waits for ACM to issue the
  # certificate, up to 75 minutes, the default create timeout of that
  # resource in the AWS provider at 6.73.0; past it the apply fails, and the
  # next apply waits again, while ACM keeps validating until its 72 hours
  # end. ACM's User Guide says a certificate may stay pending validation for
  # up to 30 minutes after its records are written.
  #
  # Deletion and replacement. A destroy, or removing the component, deletes
  # the validation records and the certificate. The AWS provider, at 6.73.0,
  # forces a new certificate when domain_name or subject_alternative_names
  # changes, and the module creates the certificate before it destroys the
  # one it replaces (create_before_destroy), so changing
  # values.domain_name or values.subject_alternative_names creates and
  # validates a new certificate, under a new ARN, before the old one is
  # deleted. Renaming the component, which changes the module's address,
  # creates a new certificate and destroys the old one. zone_id forces a new
  # record, so changing it moves the validation records into the new zone;
  # the certificate stays. ACM refuses to delete a certificate another AWS
  # service uses (DeleteCertificate); the AWS provider retries the deletion
  # for 20 minutes, then fails the apply, so a load balancer, API Gateway
  # domain name or CloudFront distribution outside the configuration that
  # still names the old certificate has its association removed first.
  #
  # Credentials. A certificate holds no credential a consumer presents: its
  # private key cannot be exported, and the AWS services ACM integrates with
  # use it under the consumer's own configuration, so nothing is published
  # but the ARN. Backup. ACM keeps nothing to back up: a certificate is
  # requested again from its names.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "zone_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a certificate has no address of its own: a consumer names it by its ARN and presents it at the consumer's own address: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads zone_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # zone_id is required and passed to the module as the string its zone_id
    # input is typed as.
    zone_id: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "zone_id") -}}
      {{- fail "infra.overrides.zone_id is unset, and this Recipe validates every name of the certificate through DNS, writing each name's validation record into the operator's Route 53 public hosted zone: set infra.overrides.zone_id in the Release to the ID of the hosted zone serving those names" -}}
      {{- end -}}
      {{- $z := $o.zone_id -}}
      {{- if not (and (typeIs "string" $z) $z) -}}
      {{- fail (printf "infra.overrides.zone_id is %s, and it is the ID of a Route 53 hosted zone, a string such as Z0123456789ABCDEFGHIJ: set it in the Release to the ID of the hosted zone serving the certificate's names" (toJson $z)) -}}
      {{- end -}}
    # tags is passed as the map of strings the module's tags input is typed
    # as.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    domain_name: {{ toJson .values.domain_name }}
    subject_alternative_names: {{ toJson (optional .values "subject_alternative_names" list) }}
    validation_method: "DNS"
    zone_id: {{ toJson $o.zone_id }}
    create_certificate: true
    create_route53_records: true
    create_route53_records_only: false
    validate_certificate: true
    wait_for_validation: true
    validation_allow_overwrite_records: true
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
