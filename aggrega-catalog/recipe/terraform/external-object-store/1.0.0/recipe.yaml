apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: external-object-store
  version: 1.0.0
  description: >
    An externally-operated object-storage bucket, realized by vendoring a local
    Terraform module and binding its input variables from the developer's values.
    The module files copy into the node's output verbatim, in that component's
    own directory; the values pillar becomes the arguments of the component's
    module block in the boundary's root configuration.

    This Recipe declares a source and NO valuesMapping, and that combination is
    what makes the sensitivity marking reach the output. Without a mapping, the
    argument names ARE the value leaf paths the Component declared, so the
    Component's `sensitive: true` on a leaf names one of the module's inputs
    exactly. A mapping's output keys are invented inside its template, which no
    declaration names, so a Recipe that declared one would render the same
    values with no marking at all.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: example/storage/external-object-store:1.0.0
  # This Recipe reads no infra.overrides keys.

  # The vendored module lives beside this Recipe. A local source is copied
  # verbatim into the node output — no fetch, no lockfile pin. The module
  # declares one variable per value leaf, under the same names, so every input
  # binds by name without wrapper wiring.
  source: ./module

  # No valuesMapping. The values pillar flows to the module's inputs under the
  # names the Component declared them with, which is the condition the marking
  # depends on. Adding a mapping here would rename the inputs and cost the
  # marking; see the description above.

  # The String Pipe: the compiler does not interpret these strings. The bucket
  # name mirrors the developer's own value, and the endpoint comes from the
  # operator's infra so both sides of the address read one declaration.
  provides:
    bucket: "{{ .values.bucket }}"
    endpoint: "{{ .infra.endpoint }}"
