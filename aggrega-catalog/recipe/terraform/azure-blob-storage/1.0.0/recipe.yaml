apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-blob-storage
  version: 1.0.0
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Blob Storage: one standard general-purpose v2 storage account,
    with the containers values.containers declares, rendered as Terraform
    for the azurerm provider by a module kept beside this Recipe, not by
    Microsoft's Azure Verified Modules module
    Azure/avm-res-storage-storageaccount/azurerm, whose submodules call a
    module from the Terraform registry.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-blob-storage where it deploys an Azure Resource Manager
    template. It needs hashicorp/azurerm 5.14 or later, so it goes in a
    boundary apart from Recipes whose modules admit azurerm 4 alone.
    infra.overrides names the operator's resource group and region. The
    account is locally redundant unless infra.overrides.sku_name names
    another standard SKU, and new blobs go to the Hot tier unless
    infra.overrides.access_tier names Cool or Cold. Public network access
    is Enabled, from every network, unless
    infra.overrides.public_network_access says otherwise; network rules
    and the private endpoint are the operator's.

    Shared Key authorization is off, so the account takes Microsoft Entra
    ID alone. host is a reference to the blob service's DNS name the
    provider reports, or infra.overrides.host; endpoint is its URL, or one
    built on infra.overrides.host; dfs_endpoint is the Data Lake Storage
    endpoint. An account name, SKU, access tier, public network access
    value or infra.overrides key the Recipe does not take halts naming it,
    as do enable_telemetry, resource_group_name and location left out, and
    resource_group_name, location and host given in a form they do not
    take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/storage/azure-blob-storage:1.0.0

  # The module beside this Recipe, module/main.tf and module/variables.tf,
  # declares the account as an azurerm_storage_account and each container as
  # an azurerm_storage_container, and nothing else. `aggrega pin` records the
  # digest of each file in entity.lock, and every build reads exactly those
  # bytes.
  #
  # Microsoft's Azure Verified Modules programme publishes a Terraform module
  # for the service, Azure/avm-res-storage-storageaccount/azurerm, MIT, at
  # v0.11.0 its newest version. Its root configuration calls only modules of
  # its own, but its role_assignments and diagnostic_setting submodules,
  # which the root and its container, queue, share, table and private
  # endpoint submodules call, call the registry module
  # Azure/avm-utl-interfaces/azure, so initialising a configuration that
  # sources it fetches a module from the Terraform registry, which the
  # catalog's sourced modules do not do. The module is therefore not sourced,
  # and no module telemetry exists to turn off.
  #
  # The module declares hashicorp/azurerm "~> 5.14", the catalog's one Azure
  # provider constraint, so a Release places this account in a terraform
  # boundary whose bodies install azurerm 5, apart from any module admitting
  # azurerm 4 alone. Every call the provider makes for the account and its
  # containers goes to Azure Resource Manager, so the provider manages them
  # with Shared Key authorization off and needs no setting of its own for it.
  source: ./module

  locals:
    # The SKU, infra.overrides.sku_name or Standard_LRS; the access tier,
    # infra.overrides.access_tier or Hot; and public network access,
    # infra.overrides.public_network_access or Enabled. Only a string is
    # read for each; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard_LRS" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    access_tier: '{{ $s := optional (optional .infra "overrides" dict) "access_tier" "Hot" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    public_network_access: '{{ $s := optional (optional .infra "overrides" dict) "public_network_access" "Enabled" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The name the Release gives the blob service under infra.overrides.host,
    # or empty while it gives none. Only a string is read here; any other
    # value is refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name    - string (resource_group_name), required
  #   location               - string (location), required
  #   sku_name               - string (account_tier and account_replication_type, the
  #                            parts before and after the underscore of Standard_LRS,
  #                            Standard_ZRS, Standard_GRS, Standard_GZRS, Standard_RAGRS
  #                            or Standard_RAGZRS; default Standard_LRS)
  #   access_tier            - string (access_tier: Hot, Cool or Cold; default Hot)
  #   public_network_access  - string (public_network_access: Enabled, Disabled or
  #                            SecuredByPerimeter; default Enabled)
  #   tags                   - map[string]string (tags of the account)
  #   host                   - string (published as provides.host and in provides.endpoint;
  #                            not passed to the module)
  # enable_telemetry halts by name: the module is this catalog's own, with no
  # telemetry to turn on or off. Any other key halts naming it.
  #
  # Each is named by the resource argument it sets, given in brackets, save
  # sku_name, which every Azure Recipe reads for what a service is
  # provisioned at and which this Recipe derives both arguments from, as
  # Azure Resource Manager spells the SKU, and host, which every managed
  # Recipe reads for the address it publishes. public_network_access is the
  # argument azurerm 5.14 reads for the account's public access, in place of
  # the boolean public_network_access_enabled it deprecates.
  # arm/azure-blob-storage reads each of them but resource_group_name under
  # the same spelling: its template deploys into the group it is deployed to.
  # resource_group_name and location are required: they place the account in
  # the operator's subscription, and this Recipe never chooses either. The
  # account takes the resource group by its name, so nothing is composed from
  # the subscription Terraform runs against.
  #
  # sku_name. Microsoft documents a standard general-purpose v2 account, the
  # kind this Recipe creates, as locally redundant (LRS), zone-redundant
  # (ZRS), geo-redundant (GRS) or geo-zone-redundant (GZRS), each geo option
  # also with read access in the secondary region (RA-GRS, RA-GZRS); the
  # Standard_ SKU of each is taken, and any other halts below: neither the
  # premium nor the V2 SKUs name a standard general-purpose v2 account.
  # Unset, the account is Standard_LRS, Microsoft's lowest-cost redundancy,
  # which needs neither the availability zones zone redundancy replicates
  # across nor the paired region geo redundancy copies to; Microsoft
  # recommends zone or geo redundancy where more durability is wanted, and
  # documents each as available in the regions that have what it needs.
  # The provider replaces the account, and with it every blob, to move
  # between a locally or geo-redundant SKU and a zone-redundant one other
  # than its own counterpart (LRS and ZRS, GRS and GZRS, RA-GRS and RA-GZRS),
  # and to change values.is_hns_enabled.
  #
  # access_tier. Microsoft documents an account's default access tier, the
  # online tier a new blob is created in unless the client names one, as
  # Hot, Cool or Cold, and the archive tier as no default. Unset, it is Hot,
  # the service's own default; any other value halts below.
  #
  # public_network_access. An account takes requests over its public
  # endpoint or over a private endpoint in a virtual network. Unset or
  # Enabled, public network access is on, and the provider creates the
  # account with the service's default network rule set, allowing every
  # network, so each request is still authenticated with Microsoft Entra ID;
  # Disabled turns it off, and the account takes requests through a private
  # endpoint alone; SecuredByPerimeter leaves public access to the access
  # rules of the network security perimeter the operator associates with the
  # account. This Recipe emits no private endpoint, perimeter or IP or
  # virtual network rule: each is the operator's, created outside the
  # Release, the way a virtual network's subnets and private DNS zones are.
  # The module declares no network_rules block, so the provider leaves the
  # rule set alone after creating the account, and the operator's
  # azurerm_storage_account_network_rules, or rules set outside Terraform,
  # stand.
  #
  # The module sets these beside the arguments the keys above set:
  # account_kind StorageV2; is_hns_enabled from values.is_hns_enabled;
  # shared_access_key_enabled false, whose default is true, so the contract
  # that no key reaches a consumer stands in the configuration itself;
  # allow_nested_items_to_be_public false, so no container takes an
  # anonymous request; cross_tenant_replication_enabled false;
  # local_user_enabled false, whose default is true; min_tls_version TLS1_2;
  # and https_traffic_only_enabled true. The blob service keeps a deleted
  # blob and a deleted container seven days, the retention Microsoft
  # recommends at least, and each container takes container_access_type
  # private. The service's own defaults stand for every argument the module
  # leaves out: encryption at rest with Microsoft-managed keys; and no
  # managed identity, customer-managed key, blob versioning, change feed,
  # point-in-time restore, lifecycle rule, SFTP, NFS, file share, queue,
  # table, private endpoint, role assignment, diagnostic setting or lock.
  # Microsoft documents that blob soft delete blocks the Data Lake Storage
  # endpoint of an account without the hierarchical namespace, so with
  # values.is_hns_enabled false a client reaches the account at endpoint.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # provider's resource schema:
  #   honoured — values.containers, as the account's containers;
  #     values.is_hns_enabled, as its hierarchical namespace; and the
  #     overrides above.
  #   refused — an account name the service refuses; an
  #     infra.overrides.resource_group_name or location left out or given as
  #     anything but a string; a SKU, an access tier or a public network
  #     access value outside those listed above; enable_telemetry; host given
  #     as anything but a bare DNS name; and any infra.overrides key not
  #     listed above. A container name the service refuses is refused by the
  #     Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. The provider reads the account's access keys and
  # connection strings into its state as sensitive attributes; with Shared
  # Key authorization off they authorize no request, the module publishes no
  # output from them, and nothing reads them. Backup. Microsoft's Azure
  # Backup protects blobs through a Backup vault and a backup instance
  # created apart from the account, so this Recipe configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the account is created in, by its name, such as example-rg" "location" "the one Azure region the account is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its storage account in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "sku_name" "access_tier" "public_network_access" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the storage account in a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, sku_name, access_tier, public_network_access, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := optional $o "sku_name" "Standard_LRS" -}}
      {{- if not (has $s (list "Standard_LRS" "Standard_ZRS" "Standard_GRS" "Standard_GZRS" "Standard_RAGRS" "Standard_RAGZRS")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and this Recipe creates a standard general-purpose v2 account, which Microsoft offers as Standard_LRS, Standard_ZRS, Standard_GRS, Standard_GZRS, Standard_RAGRS or Standard_RAGZRS: set infra.overrides.sku_name to one of them, or remove it for Standard_LRS" $s) -}}
      {{- end -}}
      {{- $t := optional $o "access_tier" "Hot" -}}
      {{- if not (has $t (list "Hot" "Cool" "Cold")) -}}
      {{- fail (printf "infra.overrides.access_tier is %v, and Microsoft documents an account's default access tier as Hot, Cool or Cold: set infra.overrides.access_tier to one of them, or remove it for Hot" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access" "Enabled" -}}
      {{- if not (has $p (list "Enabled" "Disabled" "SecuredByPerimeter")) -}}
      {{- fail (printf "infra.overrides.public_network_access is %v, and the account takes Enabled, Disabled or SecuredByPerimeter: set it to Disabled to turn off access from every network, or remove it to keep it Enabled" $p) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a client of this account's blob service reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the blob service answers HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The account is named after the component, and its name is also the
    # first label of every address the service gives it under
    # core.windows.net, so it is unique across Azure. Microsoft documents a
    # storage account name as 3 to 24 lowercase letters and digits, the rule
    # the provider's own validation holds too; it is checked here, where the
    # name is known.
    account_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z0-9]{3,24}$` $n) -}}
      {{- fail (printf "the component %q names its storage account, and Microsoft documents a storage account name as 3 to 24 lowercase letters and digits, with no hyphen: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # provider reports the account's endpoints as the service gives them:
  # https://<account>.blob.core.windows.net/ for the blob service and
  # https://<account>.dfs.core.windows.net/ for Data Lake Storage in the
  # public cloud, under its cloud's own domain elsewhere, and the blob
  # service's DNS name alone as primary_blob_host. The module publishes them
  # as its host, endpoint and dfs_endpoint outputs, each once every container
  # exists. Each provides key reads the module output of the same name from
  # this component's module call, which the boundary's root configuration
  # declares under .context.instance_id for a component declared in the
  # Aggregate the Release deploys. Terraform resolves it at apply time, after
  # the account and its containers exist, so it resolves only for a consumer
  # authored as a source: Recipe in the same root configuration; a consumer
  # on another target receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, and endpoint is https://<name>/. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the account's blob service outside the Release. A
  # client checking the service's certificate needs a name the certificate
  # carries, which is the account's own name under blob.core.windows.net or
  # the private link name that resolves to it. The name is the blob
  # service's, so dfs_endpoint stays the reference. A consumer in the same
  # root configuration receives the name as well, and a name carries no
  # reference for Terraform to order its module after this one by; a later
  # syncWave on the consumer's boundary, sharing this boundary's directory,
  # orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.host}{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}/{{ else }}${module.{{ .context.instance_id }}.endpoint}{{ end }}"
    dfs_endpoint: "${module.{{ .context.instance_id }}.dfs_endpoint}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable. The
  # account is named after the component, as the other managed Recipes name
  # theirs, and the containers are passed by name, in the order of the names.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    {{- $sku := splitList "_" (default "Standard_LRS" .locals.sku) }}
    name: "{{ .context.instance_id }}"
    resource_group_name: "{{ $o.resource_group_name }}"
    location: "{{ $o.location }}"
    account_tier: "{{ first $sku }}"
    account_replication_type: "{{ last $sku }}"
    access_tier: "{{ .locals.access_tier }}"
    public_network_access: "{{ .locals.public_network_access }}"
    is_hns_enabled: {{ if .values.is_hns_enabled }}true{{ else }}false{{ end }}
    containers: {{ keys (default dict .values.containers) | sortAlpha | toJson }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The azurerm provider refuses to plan
  # without its features block, and the module carries no provider block of
  # its own, so it inherits this configuration; the provider reads its
  # credentials and subscription from the environment Terraform runs in.
  # Terraform destroys the module's resources with it, so the file stays while
  # any component declaring it does: remove the last of them from a Release
  # only after destroying what their modules created, because with the file
  # gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
