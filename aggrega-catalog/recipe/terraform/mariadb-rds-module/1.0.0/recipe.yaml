apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mariadb-rds-module
  version: 1.0.0
  description: >
    MariaDB via AWS RDS, rendered by vendoring a local Terraform module and
    supplying its input variables.

    host publishes a Terraform reference to the instance's hostname, an output
    of the vendored module, and port publishes the port infra.port configures.
    The reference resolves only for a consumer authored as a source: Recipe in
    the same Terraform root configuration; a consumer on another target
    receives it as text. It names this component's module, so it resolves only
    where the Aggregate the Release deploys declares this component, not where
    it is composed in from another Aggregate.

    Set infra.overrides.host in the Release to the DNS name or IP literal the
    instance is reached at, and host publishes that name instead, which a
    consumer on any target can use. The Recipe emits nothing for it — no DNS
    record, no alias — so pointing the name at the instance is the operator's.

    Reach for this realization where nothing may be fetched; reach for
    terraform/mariadb-rds-terraform-aws-modules, the terraform-aws-modules
    project's published RDS module, where the pull may fetch it from its git
    repository, and for terraform/mariadb-rds where the instance needs read
    replicas. RDS owns the master password, in AWS Secrets Manager:
    root_password takes core/generated-secret, and any other credential there
    or on user_password halts the build. A value RDS cannot apply — an
    application user, init scripts, a raw configuration file, read replicas —
    halts the build naming the key;
    compute, charset and collation are not read. Point-in-time recovery comes
    with the automated backups, so infra.point_in_time_recovery: false on
    core/backup halts by name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/mariadb:1.0.0
  # This Recipe reads from infra.overrides:
  #   instance_class      - string (instance_class; default "db.t3.small")
  #   subnet_group        - string (db_subnet_group_name), required
  #   host                - string (published as provides.host; not passed to the module)
  #
  # instance_class and subnet_group are the names the inline RDS Recipes already
  # use for these values, so an operator states each once under one spelling
  # whichever shape of Recipe renders it. instance_class has a default, and the default lives here
  # rather than on the module's own variable: the module is also consumable
  # directly by a Terraform author, and a default in both places would be two
  # homes for one value.
  #
  # subnet_group has no default and none is invented: the group is provisioned
  # outside this deployment, no account-independent name exists, and a guessed one
  # would plan against the wrong network.
  #
  # The module declares its subnet_id input with no default, so the value is not
  # optional the way an inline Recipe's overrides are — an inline Recipe can leave
  # the argument out and let the service pick the account default, while a mapping
  # always renders the key and would render it empty. The assertion below is what
  # makes that omission a halt instead of an empty group name reaching the plan.
  #
  # host is no input of the module but the address a consumer reaches the
  # database at, under the name the inline RDS Recipes and the catalog's
  # referenced realization, helm/postgres-external, read for the same address.
  # It is a bare DNS name or IP literal: the assertion below refuses a value
  # carrying a scheme, a path, a user, a port or whitespace, because a consumer
  # composes its connection from host and port and would compose a broken one;
  # the port is infra.port. A value carrying exactly one colon is a name or an
  # IPv4 literal with a port; an IPv6 literal carries several and is accepted.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.database, infra.port, infra.engine_version,
  #     infra.storage.size, infra.storage.type (gp3 when unset),
  #     infra.ha.enabled, a core/backup attachment, as the comment above the
  #     mapping says, core/generated-secret on root_password, and the
  #     overrides above.
  #   refused — values.user, values.init_scripts, values.custom_config,
  #     infra.ha.read_replicas above zero, any other credential on
  #     root_password and any on user_password, as the comment above the
  #     credentials assertion says, and infra.credentials supplied and any
  #     infra.credentials_secret, which configure the controller-driven
  #     realization, as the comment above the infra_credentials assertion
  #     says.
  #   not read — infra.compute.cpu and infra.compute.memory, whose Component
  #     defaults would size a container: RDS sizes the instance by its instance
  #     class. values.charset and values.collation, whose defaults would set the
  #     server's character set: this Recipe sets no parameter group setting, so
  #     the instance takes its parameter group's. A Recipe cannot tell those
  #     defaults from a value written explicitly, so the Component's
  #     descriptions say so instead. infra.control_plane_present configures the
  #     controller-driven realization, as its description says.
  #     infra.credentials and infra.credentials_secret while they hold the
  #     Component's defaults.
  assertions:
    subnet_group_supplied: >-
      {{- if not (and (hasKey .infra "overrides") (optional .infra.overrides "subnet_group" "")) -}}
      {{- fail "this Release places its database in a DB subnet group that already exists in the target account, and the Terraform module it renders requires that group's name, but infra.overrides.subnet_group carries none: set infra.overrides.subnet_group in the Release to the name of an existing DB subnet group" -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    # This Recipe provisions one instance, so a replica count is refused rather
    # than dropped. terraform/mariadb-rds provisions replicas beside the primary.
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions one instance: set infra.ha.read_replicas to 0, or map this component to terraform/mariadb-rds, which provisions read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}
    # RDS creates only its master user, admin, which provides.user publishes,
    # and runs no initialisation scripts and no configuration file of the
    # reader's.
    values_rds_cannot_apply: >-
      {{- if optional .values "user" "" -}}
      {{- fail "values.user asks for an application user beside the administrator, and RDS creates only the master user, admin, whose password it manages: remove values.user from the Aggregate and connect as admin, or create the user against the instance once it exists" -}}
      {{- end -}}
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and an RDS instance runs none: remove values.init_scripts from the Aggregate and run them against the instance once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and an RDS instance reads none: its server settings come from a DB parameter group, which terraform/mariadb-rds attaches from infra.overrides.parameter_group and this Recipe does not; remove values.custom_config from the Aggregate" -}}
      {{- end -}}
    # RDS generates the password of the master user, admin, and keeps it in
    # AWS Secrets Manager, and creates no other user, so a credential attached
    # to either slot would reach no byte of the output while the build reads as
    # if it had set the password. The required root_password slot takes
    # core/generated-secret, which says the service owns the password and
    # renders nothing; any other credential there, and any on user_password,
    # halts naming the slot and what filled it. The type is compared with any
    # version set aside. Every MySQL and MariaDB RDS Recipe of this catalog, on
    # terraform and CloudFormation, declares this assertion word for word but
    # for the generated-secret realization it names: a change to it is made to
    # each of them.
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "user_password" -}}
      {{- fail "a credential is attached to the user_password slot, and Amazon RDS creates only the master user, admin, whose password it generates and keeps in AWS Secrets Manager: remove the attachment when deploying to this target, and create an application user against the instance once it exists" -}}
      {{- end -}}
      {{- if hasKey $f "root_password" -}}
      {{- $ty := toString (optional $f.root_password "type" "") -}}
      {{- if ne (first (splitList ":" $ty)) "core/generated-secret" -}}
      {{- fail (printf "the root_password slot is filled by %s, and Amazon RDS generates the password of the master user, admin, itself and keeps it in AWS Secrets Manager, so the attachment would set nothing: attach core/generated-secret to the root_password slot instead, bound to terraform/generated-secret in the Manifest, which says the service owns the password" (default "an attachment of no type" $ty)) -}}
      {{- end -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. RDS generates the password of the
    # master user, admin, itself, keeps it in AWS Secrets Manager and reads no
    # Secret, so supplied, or any Secret name, would reach no byte of the
    # output while the build reads as if it had chosen who owns the password:
    # each halts naming the key, and the Component's defaults, generated and
    # empty, pass. Every MariaDB RDS Recipe of this catalog, on terraform and
    # CloudFormation, declares this assertion word for word: a change to it is
    # made to each of them.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and Amazon RDS generates the password of the master user, admin, itself and keeps it in AWS Secrets Manager: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database credentials from, and Amazon RDS generates the password of the master user, admin, itself and keeps it in AWS Secrets Manager, reading no Secret: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}

  # The module files copy into the node's output verbatim, in that component's
  # own directory; the developer and operator pillars become the arguments of
  # the component's module block in the boundary's root configuration, which is
  # a position Terraform evaluates.
  #
  # The vendored module lives beside this Recipe. A local source is copied
  # verbatim into the node output — no fetch, no lockfile pin. Its main.tf pins
  # hashicorp/aws by the one range every AWS body in this catalog declares, and
  # says why.
  source: ./module

  locals:
    # The name the Release gives the instance under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Amazon RDS automated backups"

  # The String Pipe: the compiler does not interpret these strings. It pipes
  # whatever the module's outputs name; Terraform resolves them at apply time.
  # user is the module's RDS master username (admin); database mirrors the
  # developer value the module provisions.
  #
  # host names the module's address output through this component's module
  # call, which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the Release
  # deploys; a reference to the module's resource would name nothing the root
  # declares.
  # address is the instance's bare hostname; the module's endpoint output is
  # address:port. port is the value the mapping below passes to the module, so
  # it is known ahead of time and published as that value.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record or alias for it, so the operator points the name at the instance
  # outside the Release. A consumer in the same root configuration receives
  # the name as well, and a name carries no reference for Terraform to order
  # its module after this one by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.address}{{ end }}"
    port: "{{ .infra.port }}"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mariadb"

  # This mapping supplies the module's input variables from the developer and
  # operator pillars. Each rendered key becomes an argument of this component's
  # module block in the boundary's root configuration, emitted in deterministic
  # key order. The subnet_id value is the DB subnet group name the operator
  # supplies, which is what the module's own declaration asks of its caller: the
  # group is provisioned outside this deployment and its name differs per
  # environment, so it is the operator's to state.
  #
  # A value that IS a Terraform interpolation stays available here and behaves
  # the way the String Pipe describes: the compiler pipes the ${...} through
  # untouched as a deterministic ahead-of-time pointer. A module argument is a
  # position Terraform evaluates, so a pointer written here resolves — what it
  # still needs is a referent the configuration declares.
  #
  # infra.storage.type is the RDS storage type here, not a storage class; the
  # Component declares no default for it, so this mapping supplies gp3.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside, and kept as the
  # instance's own automated backups, which this Recipe sets through the
  # vendored module's inputs backup_retention_period and backup_window:
  #   - With none attached, RDS keeps automated backups for 7 days, in a
  #     window it chooses.
  #   - An attachment carrying no infra.role_arn, bound to
  #     terraform/backup-native, configures them. infra.retention_days is
  #     backup_retention_period, 1 to 35 days, the range RDS keeps, and a value
  #     outside it halts naming the attachment. infra.schedule, where set,
  #     must name one minute and one hour of every day, such as 30 2 * * *:
  #     RDS takes one automated backup a day, in a window it reads in UTC, so
  #     that time opens backup_window, 30 minutes long, the shortest
  #     window RDS takes, 02:30-03:00 here; any other expression halts
  #     naming it. Unset, RDS chooses the window.
  #   - An attachment carrying infra.role_arn is AWS Backup's, which backs the
  #     instance up on a schedule of its own. The instance keeps its
  #     automated backups beside it as with none attached, unless that
  #     attachment sets infra.keep_automated_backups to false, which sets the
  #     retention to zero, turning them off, and skips the final snapshot.
  #   - Two attachments carrying no infra.role_arn, or one beside an AWS
  #     Backup attachment setting infra.keep_automated_backups to false, halt
  #     naming both: an instance runs one automated backup.
  #   - Point-in-time recovery is Amazon RDS's for as long as the instance
  #     keeps automated backups, with no setting of its own, so left out or
  #     true, infra.point_in_time_recovery is what the instance gives, and
  #     false on an attachment carrying no infra.role_arn halts naming it. On
  #     an AWS Backup attachment, true asks AWS Backup for a continuous backup,
  #     which takes over the instance's automated backups and keeps them for
  #     as many days as its own, so the retention written here is then that
  #     attachment's infra.retention_days and no window is written; another
  #     attachment configuring the automated backups or turning them off halts
  #     naming both, and so do two asking for a continuous backup. false there
  #     is AWS Backup's to keep, as without the option.
  # A Recipe's locals cannot read its attachments, so the reading sits at the
  # top of the template below, and every RDS Recipe of this catalog, on
  # terraform and CloudFormation, declares it word for word: a change to it
  # is made to each of them.
  valuesMapping: |
    {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
    {{- $backupNative := "" -}}{{- $backupNativeInfra := dict -}}{{- $backupKeepOn := "" -}}{{- $backupKeepOff := "" -}}{{- $backupContinuous := "" -}}{{- $backupContinuousInfra := dict -}}
    {{- range $name, $attachment := (default dict .features) -}}
    {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
    {{- $in := default dict (optional $attachment "infra" dict) -}}
    {{- if trim (toString (optional $in "role_arn" "")) -}}
    {{- if hasKey $in "keep_automated_backups" -}}
    {{- if $in.keep_automated_backups }}{{ $backupKeepOn = $name }}{{ else }}{{ $backupKeepOff = $name }}{{ end -}}
    {{- end -}}
    {{- if eq (toString (optional $in "point_in_time_recovery" "")) "true" -}}
    {{- if $backupContinuous -}}
    {{- fail (printf "core/backup attachments %q and %q on %q both set infra.point_in_time_recovery to true, each asking AWS Backup for a continuous backup of the instance, and AWS Backup keeps one continuous backup of a resource: set it on one of the two" $backupContinuous $name $.context.instance_id) -}}
    {{- end -}}
    {{- $backupContinuous = $name -}}{{- $backupContinuousInfra = $in -}}
    {{- end -}}
    {{- else if $backupNative -}}
    {{- fail (printf "core/backup attachments %q and %q on %q both leave its backup to Amazon RDS, which runs one automated backup on an instance: remove one of the two, or bind one to AWS Backup in the Manifest" $backupNative $name $.context.instance_id) -}}
    {{- else -}}
    {{- $backupNative = $name -}}{{- $backupNativeInfra = $in -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- if and $backupNative $backupKeepOff -}}
    {{- fail (printf "core/backup attachment %q on %q has Amazon RDS keep automated backups of the instance, and core/backup attachment %q sets infra.keep_automated_backups to false, turning them off: remove one of the two attachments, or infra.keep_automated_backups" $backupNative .context.instance_id $backupKeepOff) -}}
    {{- end -}}
    {{- if and $backupKeepOn $backupKeepOff -}}
    {{- fail (printf "core/backup attachments %q and %q on %q set infra.keep_automated_backups to true and to false, and the instance either keeps its automated backups or does not: set the option on one of the two" $backupKeepOn $backupKeepOff .context.instance_id) -}}
    {{- end -}}
    {{- if eq (toString (optional $backupNativeInfra "point_in_time_recovery" "")) "false" -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and Amazon RDS keeps point-in-time recovery for as long as it keeps automated backups, which this attachment configures, with no setting that turns it off: remove infra.point_in_time_recovery from the attachment, or set it to true" $backupNative .context.instance_id) -}}
    {{- end -}}
    {{- if and $backupContinuous $backupNative -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, so AWS Backup keeps a continuous backup of the instance and takes over its automated backups, their window and how many days they are kept, and core/backup attachment %q configures those automated backups too: remove one of the two attachments, or infra.point_in_time_recovery" $backupContinuous .context.instance_id $backupNative) -}}
    {{- end -}}
    {{- if and $backupContinuous $backupKeepOff (ne $backupContinuous $backupKeepOff) -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, and AWS Backup's continuous backup keeps the instance's automated backups on, for as many days as its own, while core/backup attachment %q sets infra.keep_automated_backups to false, turning them off: remove one of the two attachments, or one of the two options" $backupContinuous .context.instance_id $backupKeepOff) -}}
    {{- end -}}
    {{- $backupRetention := 7 -}}{{- $backupWindow := "" -}}
    {{- if $backupKeepOff }}{{ $backupRetention = 0 }}{{ end -}}
    {{- if $backupContinuous }}{{ $backupRetention = int (optional $backupContinuousInfra "retention_days" 7) }}{{ end -}}
    {{- if $backupNative -}}
    {{- $backupRetention = int (optional $backupNativeInfra "retention_days" 7) -}}
    {{- if or (lt $backupRetention 1) (gt $backupRetention 35) -}}
    {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and Amazon RDS keeps automated backups for 1 to 35 days: set infra.retention_days to 35 or fewer, or bind the attachment to AWS Backup in the Manifest, which keeps backups longer" $backupNative .context.instance_id $backupRetention) -}}
    {{- end -}}
    {{- with trim (toString (optional $backupNativeInfra "schedule" "")) -}}
    {{- $f := regexSplit `\s+` . -1 -}}
    {{- if not (and (eq (len $f) 5) (regexMatch `^[0-9]{1,2}$` (index $f 0)) (regexMatch `^[0-9]{1,2}$` (index $f 1)) (lt (atoi (index $f 0)) 60) (lt (atoi (index $f 1)) 24) (has (index $f 2) (list "*" "?")) (has (index $f 3) (list "*" "?")) (has (index $f 4) (list "*" "?"))) -}}
    {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and Amazon RDS takes one automated backup a day, in a window opening at a time of day it reads in UTC: write a schedule naming one minute and one hour of every day, such as 30 2 * * *, or remove infra.schedule to let RDS choose the time" $backupNative $.context.instance_id .) -}}
    {{- end -}}
    {{- $start := add (mul (atoi (index $f 1)) 60) (atoi (index $f 0)) -}}
    {{- $end := mod (add $start 30) 1440 -}}
    {{- $backupWindow = printf "%02d:%02d-%02d:%02d" (div $start 60) (mod $start 60) (div $end 60) (mod $end 60) -}}
    {{- end -}}
    {{- end -}}
    db_name: "{{ .values.database }}"
    engine_version: "{{ .infra.engine_version }}"
    instance_class: "{{ optional .infra.overrides "instance_class" "db.t3.small" }}"
    allocated_storage: {{ trimSuffix "Gi" .infra.storage.size }}
    storage_type: "{{ .infra.storage.type | default "gp3" }}"
    multi_az: {{ .infra.ha.enabled }}
    backup_retention_period: {{ $backupRetention }}
    {{- if $backupWindow }}
    backup_window: "{{ $backupWindow }}"
    {{- end }}
    skip_final_snapshot: {{ not $backupRetention }}
    port: {{ .infra.port }}
    subnet_id: "{{ .infra.overrides.subnet_group }}"
