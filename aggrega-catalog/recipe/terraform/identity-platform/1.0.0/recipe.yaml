apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: identity-platform
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Identity Platform, rendered as an authored Terraform body, main.tf: one
    google_identity_platform_config in the operator's project, with every
    sign-in method and the multi-factor state written from the component's
    values. Nothing else is created: no identity provider, tenant, blocking
    function or IAM binding.

    The configuration is a project's one, and the provider's documentation
    says Identity Platform creates it once and never deletes it, in a
    project with billing enabled alone: a destroy removes it from the
    Terraform state, and Identity Platform keeps the users and the
    configuration last applied.

    api_key, firebase_subdomain and oidc_discovery_url publish Terraform
    references to outputs of this component's module, api_key's marked
    sensitive. The API key is kept in the Terraform state as plain text, as
    the provider's documentation warns. A project_id missing, authorized
    domains not a list of names, and any infra.overrides key not listed halt
    the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/security/identity-platform:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this configuration, and
  # resolves none of them. Each is a reference to an output of this
  # component's module call: the body renders into the component's own
  # module directory, and the boundary's root configuration declares that
  # directory as a module block named .context.instance_id for a component
  # declared in the Aggregate the Release deploys. The references resolve only
  # for a consumer authored as a source: Recipe in the same Terraform root
  # configuration, which Terraform then applies after this module; a consumer
  # on another target receives them as text.
  #
  # api_key is the configuration's client.api_key, which the provider marks
  # sensitive, and its output is marked sensitive too, so Terraform shows it
  # in no plan and keeps it marked in every expression of a consumer that
  # reads it. firebase_subdomain is client.firebase_subdomain.
  # oidc_discovery_url joins https://securetoken.google.com/, the
  # configuration's project and /.well-known/openid-configuration: the
  # discovery document of the issuer Google Cloud's "Using Firebase to
  # authenticate users" gives for the project's tokens,
  # https://securetoken.google.com/<project ID>.
  provides:
    api_key: "${module.{{ .context.instance_id }}.api_key}"
    firebase_subdomain: "${module.{{ .context.instance_id }}.firebase_subdomain}"
    oidc_discovery_url: "${module.{{ .context.instance_id }}.oidc_discovery_url}"

  # This Recipe reads from infra.overrides:
  #   project_id         - string, required (project)
  #   authorized_domains - []string (authorized_domains)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread. region and location halt as any
  # key not listed does: the configuration is the project's, in no region.
  #
  # project_id is the name every terraform Google Recipe of this catalog
  # reads for the project a resource is created in; authorized_domains is the
  # provider's argument.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates, with billing enabled and the Identity Toolkit API,
  # identitytoolkit.googleapis.com, enabled. It is a string with no value
  # this Recipe could choose for the operator, so it halts the build when it
  # is missing.
  #
  # authorized_domains is the list of domains Identity Platform lets a
  # sign-in redirect to, each a domain name such as app.example.com, written
  # as the whole list: the domains the project holds and the list does not
  # name are removed. Unset, the body writes none, and the list the project
  # holds stays as it is; the provider reads an empty list as unset, so a
  # value that is not a non-empty list of names without spaces halts.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema, or not read:
  #   honoured — values.sign_in, as the sign_in block: email.enabled,
  #     email.password_required, phone_number.enabled, anonymous.enabled and
  #     allow_duplicate_emails, each written with the Component's default
  #     while unset, false, save password_required, true; values.mfa, as the
  #     mfa block: state, DISABLED while unset, and enabled_providers while
  #     set; and the overrides above.
  #   refused — project_id missing or not a string; authorized_domains not a
  #     list of names; and any infra.overrides key not listed above.
  #   held by the Component's schema — every key under values.sign_in and
  #     values.mfa, and the values each takes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: nothing else of the configuration.
  # The provider keeps what the project holds for the blocks it computes and
  # the body leaves out, SMS regions, multi-tenancy, monitoring and the
  # client's permissions; it holds to the body the ones it does not compute,
  # anonymous users' automatic deletion, blocking functions and the sign-up
  # quota, and, inside the blocks the body writes, the TOTP provider
  # configurations of mfa.provider_configs and the test phone numbers of
  # sign_in.phone_number.test_phone_numbers, so any set outside the Release
  # are cleared at the next apply.
  # Phone sign-in and an SMS second factor send a code only to the regions
  # the project's SMS region policy allows, which the operator sets outside
  # the Release.
  #
  # Deletion and replacement. Creating the resource initializes Identity
  # Platform in the project, which Google offers to billing-enabled projects
  # alone. Destroying it, or removing or renaming the component, removes it
  # from the Terraform state and deletes nothing, since the provider's
  # documentation gives the configuration as created once, when Identity
  # Platform is initialized, and never deleted: Identity Platform stays on
  # in the project with its users and the configuration last applied, and a
  # method is turned off by applying the component with it off. Changing
  # project_id, which the provider replaces the resource on, configures
  # the other project and leaves the first as it stands. Every other change
  # is applied in place. Two components of this type deployed into one
  # project configure the same configuration, and the last applied wins.
  #
  # Credentials. The configuration's API key is generated by Identity
  # Platform and reaches a consumer through the sensitive api_key output,
  # never as a literal in a rendered file; the provider's documentation warns
  # that it is stored in the raw Terraform state as plain text, where it is
  # protected with the state. How a consumer receives it is the consumer's
  # injection: this Recipe does not refuse an env injection of api_key on
  # terraform, which carries the key in the consuming service's
  # configuration, and a file injection keeps it out of that configuration.
  # Users' passwords stay in Identity Platform.
  # Terraform authenticates with the credentials in the environment it runs
  # in, so the rendered configuration names none.
  # Backup. Identity Platform offers no backup of a project's users for this
  # Recipe to configure, so none is.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "authorized_domains" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id and authorized_domains from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "project_id" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail "this Release configures Identity Platform in the operator's own Google Cloud project, which this Recipe does not choose, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release" -}}
      {{- end -}}
    # The provider types authorized_domains as a list of strings.
    authorized_domains: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "authorized_domains" -}}
      {{- $d := $o.authorized_domains -}}
      {{- $ok := and (kindIs "slice" $d) (gt (len $d) 0) -}}
      {{- if $ok }}{{ range $d }}{{ if not (and (typeIs "string" .) (regexMatch `^\S+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.authorized_domains is %s, and Identity Platform takes the domains a sign-in may redirect to as a non-empty list of domain names, such as [app.example.com]: set it so in the Release, or remove it to keep the project's list" (toJson $d)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Identity Platform module. The resource is named this, since each
  # component's body renders into a module directory of its own. Each string
  # the Release gives reaches Identity Platform as written: Terraform would
  # read ${ and %{ inside a string as the start of an interpolation or a
  # directive, so they are written $${ and %%{, which Terraform turns back
  # into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := default dict (optional .values "sign_in" dict) -}}
      {{- $email := default dict (optional $s "email" dict) -}}
      {{- $phone := default dict (optional $s "phone_number" dict) -}}
      {{- $anon := default dict (optional $s "anonymous" dict) -}}
      {{- $mfa := default dict (optional .values "mfa" dict) -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_identity_platform_config" "this" {
        sign_in {
          allow_duplicate_emails = {{ if eq (toJson (optional $s "allow_duplicate_emails" false)) "true" }}true{{ else }}false{{ end }}

          email {
            enabled           = {{ if eq (toJson (optional $email "enabled" false)) "true" }}true{{ else }}false{{ end }}
            password_required = {{ if eq (toJson (optional $email "password_required" true)) "false" }}false{{ else }}true{{ end }}
          }

          phone_number {
            enabled = {{ if eq (toJson (optional $phone "enabled" false)) "true" }}true{{ else }}false{{ end }}
          }

          anonymous {
            enabled = {{ if eq (toJson (optional $anon "enabled" false)) "true" }}true{{ else }}false{{ end }}
          }
        }

        mfa {
          state = "{{ optional $mfa "state" "DISABLED" }}"
          {{- with optional $mfa "enabled_providers" "" }}
          enabled_providers = {{ toJson . }}
          {{- end }}
        }

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "authorized_domains" "" }}
        authorized_domains = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      output "api_key" {
        value     = google_identity_platform_config.this.client[0].api_key
        sensitive = true
      }

      output "firebase_subdomain" {
        value = google_identity_platform_config.this.client[0].firebase_subdomain
      }

      output "oidc_discovery_url" {
        value = "https://securetoken.google.com/${google_identity_platform_config.this.project}/.well-known/openid-configuration"
      }
