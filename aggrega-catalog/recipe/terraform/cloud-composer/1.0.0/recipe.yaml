apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloud-composer
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Cloud Composer, rendered as an authored Terraform body, main.tf: one
    google_composer_environment of the instance's name, a Gen 3
    environment, which Google Cloud's documentation calls Managed Airflow
    (Gen 3), in the operator's project and region, running the Airflow
    version infra.engine_version names. host, endpoint and dag_gcs_prefix
    publish outputs of this component's module, which Terraform resolves
    when it applies. The published terraform-google-modules/composer/google
    module is not sourced: each of its environment modules admits a
    hashicorp/google release below 8 alone, and the catalog's Google bodies
    install one from 8.8 below 9.

    The project, the network, the service account, the bucket and the KMS
    key are the operator's: none is created, nor any IAM binding. Without
    infra.overrides.bucket the service creates the environment's own bucket,
    which a destroy of the environment leaves in the project.

    A project_id or region missing; a network, subnet, service account,
    bucket, key, environment size, private environment setting or Airflow
    version of another form; a network or subnet of another project, a
    subnet of another region or without its network; an environment variable the service reserves; an
    instance name the provider does not take for an environment;
    infra.overrides.host, since the web server answers under the service's
    name alone; and any infra.overrides key not listed halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/ai-pipeline/cloud-composer:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this environment, and
  # resolves none of them.
  #
  # host, endpoint and dag_gcs_prefix are references to the outputs of this
  # component's module call of those names: endpoint is the environment's
  # airflow_uri, the URL of its Airflow web server; host is the name in that
  # URL; dag_gcs_prefix is the environment's dag_gcs_prefix. The service
  # chooses the web server's name and the bucket's when it creates the
  # environment, so none is known when the Release is built. The body
  # renders into the component's own module directory, and the boundary's
  # root configuration declares that directory as a module block named
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Each reference resolves only for a consumer authored as
  # a source: Recipe in the same Terraform root configuration, which
  # Terraform then applies after this module, once the environment exists; a
  # consumer on another target receives it as text. The web server answers
  # under the service's name alone, whose certificate a name of the
  # operator's would not match, so infra.overrides.host is refused by the
  # assertion below rather than published.
  provides:
    host: "${module.{{ .context.instance_id }}.host}"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
    dag_gcs_prefix: "${module.{{ .context.instance_id }}.dag_gcs_prefix}"

  # This Recipe reads from infra.overrides:
  #   project_id                 - string, required (project)
  #   region                     - string, required (region)
  #   private_network            - string (config.node_config.network)
  #   subnetwork                 - string (config.node_config.subnetwork)
  #   service_account            - string
  #                                (config.node_config.service_account)
  #   bucket                     - string (storage_config.bucket)
  #   kms_key_name               - string
  #                                (config.encryption_config.kms_key_name)
  #   environment_size           - string (config.environment_size)
  #   enable_private_environment - bool
  #                                (config.enable_private_environment)
  # and infra.engine_version - string
  #                            (config.software_config.image_version).
  # host halts by name, as any key not listed does.
  #
  # project_id, region, private_network, subnetwork, service_account and
  # kms_key_name are the names the catalog's terraform Google Recipes read
  # for the project a resource is created in, the region it runs in, the VPC
  # network and subnet it joins, the identity it runs as and the
  # customer-managed key it is encrypted with; bucket is the name
  # core/storage/gcs gives a bucket's name; the others are the provider's
  # arguments.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Cloud Composer API is enabled; region is
  # where the environment runs, such as europe-west1. Each is a string with
  # no value this Recipe could choose for the operator, so each halts the
  # build when it is missing.
  #
  # private_network and subnetwork attach the environment to the operator's
  # VPC network, through a network attachment the service creates: the
  # network's resource link, projects/<project>/global/networks/<name>, and
  # the subnet's resource name,
  # projects/<project>/regions/<region>/subnetworks/<name>, forms the
  # provider takes for each. The service takes a network of the
  # environment's project (the provider's description of the argument), a
  # subnet of the environment's project and region, and a subnet only with
  # its network (the REST reference of an environment's node configuration),
  # so a network of another project, a subnet of another project or region,
  # a subnetwork without private_network, or a value of another form halts. A network alone is taken for an auto mode
  # network, and the service refuses a custom mode network without its
  # subnet when it creates the environment. Unset, the body names none, and
  # no network attachment is asked for. Terraform cannot detach a
  # network once attached (the provider's documentation); removing the keys
  # leaves the attachment as it is.
  #
  # service_account is the email of the service account the environment
  # runs its Airflow components and DAGs as,
  # <name>@<project>.iam.gserviceaccount.com, which the operator grants the
  # Composer Worker role and access to what the DAGs call, and which the
  # identity applying the configuration needs leave to act as. A value that
  # is not such an email halts. Unset, the environment runs as the project's
  # Compute Engine default service account.
  #
  # bucket names the operator's Cloud Storage bucket the environment keeps
  # its DAGs, plugins, data and logs in, by its name without gs://, the form
  # the service takes; a name Cloud Storage does not take for a bucket
  # halts. Unset, the service creates a bucket of its own for the
  # environment, which a destroy leaves in the project (the provider's
  # documentation of an environment).
  #
  # kms_key_name names the operator's Cloud KMS key the environment and its
  # data are encrypted with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's encryption_config takes; the service checks the
  # key's location and its service agents' access when it creates the
  # environment. Unset, a key Google manages. A value of another form halts.
  #
  # environment_size is ENVIRONMENT_SIZE_SMALL, ENVIRONMENT_SIZE_MEDIUM,
  # ENVIRONMENT_SIZE_LARGE or ENVIRONMENT_SIZE_EXTRA_LARGE (the REST
  # reference's EnvironmentSize and the provider's validation), the size of
  # the environment's managed infrastructure, its Airflow database
  # included; any other value halts. Unset, the service's default.
  # enable_private_environment is true or false, whether the environment
  # runs with private IP networking; any other value halts. Unset, the
  # service's default.
  #
  # infra.engine_version is the Airflow version: the body writes
  # composer-3-airflow-<engine_version>, the Gen 3 image version, whose
  # Airflow part is a major, major.minor or major.minor.patch version, each
  # taking the newest build of it, or major.minor.patch-build.<n> for one
  # build (the service's versioning overview, and the provider's
  # composer-...-airflow-... rule). Gen 3 runs Airflow 2 and 3, so a value
  # of another form or major halts; the service refuses a version it does
  # not offer when it creates or upgrades the environment, and an upgrade to
  # another major version of Airflow (the provider's documentation). Unset,
  # no image version is written, and the service creates the environment
  # with its default Gen 3 build.
  #
  # host is refused by name: the web server answers under a name of the
  # service's own, whose certificate a name of the operator's would not
  # match.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.pypi_packages, values.env_variables and
  #     values.airflow_config_overrides, as the software configuration's
  #     maps of those names; infra.engine_version, as above; and the
  #     overrides above.
  #   refused — project_id or region missing or not a string; a
  #     private_network or subnetwork of another form, a network of another
  #     project, a subnet of another project or region, and a subnetwork
  #     without private_network; a
  #     service_account that is not an email; a bucket name Cloud Storage
  #     does not take; a kms_key_name of another form; an environment_size
  #     or enable_private_environment the service does not take; an
  #     engine_version of another form or major; an environment variable a
  #     Gen 3 environment reserves; an instance name the provider does not
  #     take for an environment; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — each package's name and specifier, each
  #     variable's name, and each Airflow option's key, to the service's
  #     rules.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: the instance's name as the
  # environment's; no labels, workloads, maintenance window, recovery,
  # data retention, lineage or web server settings, so the service's
  # defaults for the environment's size hold; no deletion_policy, so a
  # destroy, or removing the component, deletes the environment, the
  # provider's default, and leaves its bucket. The provider replaces the
  # environment when project_id, region, service_account, bucket or
  # kms_key_name changes: Terraform deletes it and creates a new one, whose
  # web server's name and bucket the service chooses again. The environment's
  # name is the instance's, which the service holds unique within a project
  # and region, so two Releases deploying the same instance name of one
  # Aggregate into one project and region collide when the second applies.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "region" "private_network" "subnetwork" "service_account" "bucket" "kms_key_name" "environment_size" "enable_private_environment" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a Cloud Composer environment's Airflow web server answers under a name of the service's own, whose certificate a name of the operator's would not match: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, region, private_network, subnetwork, service_account, bucket, kms_key_name, environment_size and enable_private_environment from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_region_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "region" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Cloud Composer environment in the operator's own Google Cloud project, in a region the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    network_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "private_network" -}}
      {{- $project := toString (optional $o "project_id" "") -}}
      {{- if not (and (typeIs "string" $o.private_network) (regexMatch `^projects/[^/\s]+/global/networks/[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $o.private_network) (eq (index (splitList "/" $o.private_network) 1) $project)) -}}
      {{- fail (printf "infra.overrides.private_network is %s, and this Recipe takes the network as its resource link, projects/<project>/global/networks/<name>, and Cloud Composer a network of the environment's project, %s: set it to that form in the Release" (toJson $o.private_network) $project) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "subnetwork" -}}
      {{- $s := $o.subnetwork -}}
      {{- if not (and (typeIs "string" $s) (regexMatch `^projects/[^/\s]+/regions/[^/\s]+/subnetworks/[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` $s)) -}}
      {{- fail (printf "infra.overrides.subnetwork is %s, and this Recipe takes the subnet as its resource name, projects/<project>/regions/<region>/subnetworks/<name>: set it to that form in the Release" (toJson $s)) -}}
      {{- end -}}
      {{- $parts := splitList "/" $s -}}
      {{- $project := toString (optional $o "project_id" "") -}}{{- $region := toString (optional $o "region" "") -}}
      {{- if or (ne (index $parts 1) $project) (ne (index $parts 3) $region) -}}
      {{- fail (printf "infra.overrides.subnetwork is %s, and Cloud Composer takes a subnet of the environment's project and region, %s and %s: name a subnet there in the Release" $s $project $region) -}}
      {{- end -}}
      {{- if not (hasKey $o "private_network") -}}
      {{- fail "infra.overrides.subnetwork is set without infra.overrides.private_network, and Cloud Composer takes a subnet only with the network it belongs to: set infra.overrides.private_network in the Release" -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "service_account" -}}
      {{- if not (and (typeIs "string" $o.service_account) (regexMatch `^[^@\s/:]+@[^@\s/:]+\.gserviceaccount\.com$` $o.service_account)) -}}
      {{- fail (printf "infra.overrides.service_account is %s, and Cloud Composer takes the service account an environment runs as by its email, <name>@<project>.iam.gserviceaccount.com: set it to one in the Release, or remove it" (toJson $o.service_account)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "bucket" -}}
      {{- $b := $o.bucket -}}
      {{- if not (and (typeIs "string" $b) (regexMatch `^[a-z0-9][a-z0-9._-]*[a-z0-9]$` $b) (ge (len $b) 3) (le (len $b) (ternary 222 63 (contains "." $b)))) -}}
      {{- fail (printf "infra.overrides.bucket is %s, and Cloud Composer takes the bucket by its name, without gs://, which Cloud Storage keeps to 3 to 63 lowercase letters, digits, hyphens, underscores and periods, up to 222 with periods, beginning and ending with a letter or a digit: set it to the bucket's name in the Release, or remove it" (toJson $b)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Cloud Composer takes the Cloud KMS key it encrypts an environment with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "environment_size" -}}
      {{- if not (has $o.environment_size (list "ENVIRONMENT_SIZE_SMALL" "ENVIRONMENT_SIZE_MEDIUM" "ENVIRONMENT_SIZE_LARGE" "ENVIRONMENT_SIZE_EXTRA_LARGE")) -}}
      {{- fail (printf "infra.overrides.environment_size is %s, and Cloud Composer sizes an environment ENVIRONMENT_SIZE_SMALL, ENVIRONMENT_SIZE_MEDIUM, ENVIRONMENT_SIZE_LARGE or ENVIRONMENT_SIZE_EXTRA_LARGE: set it to one of them in the Release, or remove it" (toJson $o.environment_size)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (hasKey $o "enable_private_environment") (not (kindIs "bool" $o.enable_private_environment)) -}}
      {{- fail (printf "infra.overrides.enable_private_environment is %s, and it turns the environment's private IP networking on or off: set it to true or false in the Release, or remove it" (toJson $o.enable_private_environment)) -}}
      {{- end -}}
    engine_version_offered: >-
      {{- with optional .infra "engine_version" "" -}}
      {{- if not (and (typeIs "string" .) (regexMatch `^[23](\.[0-9]+(\.[0-9]+(-build\.[0-9]+)?)?)?$` .)) -}}
      {{- fail (printf "infra.engine_version is %s, and a Gen 3 Cloud Composer environment runs Airflow 2 or 3, named as a major, major.minor or major.minor.patch version, or major.minor.patch-build.<n>, such as 2.10.5 or 2.10.5-build.52: set it to one the service's versions page lists in the Release, or remove it for the service's default" (toJson .)) -}}
      {{- end -}}
      {{- end -}}
    # The names a Gen 3 environment keeps for its own variables (Cloud
    # Composer's page on environment variables, for Gen 3).
    env_variables_not_reserved: >-
      {{- $reserved := list "AIRFLOW_DATABASE_VERSION" "AIRFLOW_HOME" "AIRFLOW_SRC_DIR" "AIRFLOW_WEBSERVER" "AUTO_GKE" "CLOUDSDK_METRICS_ENVIRONMENT" "CLOUD_LOGGING_ONLY" "COMPOSER_AGENT_BUILD_SERVICE_ACCOUNT" "COMPOSER_ENVIRONMENT" "COMPOSER_ENVIRONMENT_SIZE" "COMPOSER_GKE_LOCATION" "COMPOSER_GKE_NAME" "COMPOSER_GKE_ZONE" "COMPOSER_LOCATION" "COMPOSER_OPERATION_UUID" "COMPOSER_PYTHON_VERSION" "COMPOSER_VERSION" "CONTAINER_NAME" "C_FORCE_ROOT" "DAGS_FOLDER" "GCE_METADATA_TIMEOUT" "GCP_PROJECT" "GCP_TENANT_PROJECT" "GCSFUSE_EXTRACTED" "GCS_BUCKET" "GKE_CLUSTER_NAME" "GKE_IN_TENANT" "GOOGLE_APPLICATION_CREDENTIALS" "GOOGLE_CLOUD_PROJECT" "MAJOR_VERSION" "MINOR_VERSION" "PATH" "PIP_DISABLE_PIP_VERSION_CHECK" "PORT" "PROJECT_ID" "PYTHONPYCACHEPREFIX" "PYTHONWARNINGS" "REDIS_PASSWORD" "REDIS_PORT" "REDIS_USER" "SQL_DATABASE" "SQL_HOST" "SQL_INSTANCE" "SQL_PASSWORD" "SQL_PROJECT" "SQL_REGION" "SQL_USER" -}}
      {{- range $name, $_ := (default dict (optional .values "env_variables" dict)) -}}
      {{- if has $name $reserved -}}
      {{- fail (printf "values.env_variables names %s, which a Gen 3 Cloud Composer environment reserves for a variable of its own: rename it in the Aggregate" $name) -}}
      {{- end -}}
      {{- end -}}
    # The environment takes the instance's name, and the provider takes an
    # environment's name as a Compute Engine name, 1 to 63 lowercase
    # letters, digits and hyphens, beginning with a letter and ending with a
    # letter or a digit (its validation of the argument).
    environment_name: >-
      {{- if not (regexMatch `^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$` .metadata.instance_id) -}}
      {{- fail (printf "the environment takes the instance's name, %q, and the google provider takes an environment's name of 1 to 63 lowercase letters, digits and hyphens, beginning with a letter and ending with a letter or a digit: rename the instance in the Aggregate" .metadata.instance_id) -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: the published composer module's root
  # builds a Gen 1 environment, and each of its environment modules declares
  # hashicorp/google below 8, which no release satisfies beside the
  # catalog's constraint, so their init fails. The resource is named this,
  # since each component's body renders into a module directory of its own.
  # Each string the Release or the Aggregate gives reaches the service as
  # written, the maps' keys and values included: Terraform would read ${ and
  # %{ inside a string as the start of an interpolation or a directive, so
  # they are written $${ and %%{, which Terraform turns back into the
  # characters written. Each map is written in its keys' sorted order.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $ev := optional .infra "engine_version" "" -}}
      {{- $pypi := default dict (optional .values "pypi_packages" dict) -}}
      {{- $env := default dict (optional .values "env_variables" dict) -}}
      {{- $airflow := default dict (optional .values "airflow_config_overrides" dict) -}}
      {{- $node := or (hasKey $o "private_network") (hasKey $o "subnetwork") (hasKey $o "service_account") -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_composer_environment" "this" {
        name = "{{ .context.instance_id }}"

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        region  = {{ toJson $o.region | replace "${" "$${" | replace "%{" "%%{" }}

        config {
          {{- if or $ev $pypi $env $airflow }}
          software_config {
            {{- with $ev }}
            image_version = "composer-3-airflow-{{ . }}"
            {{- end }}
            {{- if $pypi }}
            pypi_packages = {
              {{- range $name, $spec := $pypi }}
              {{ toJson $name | replace "${" "$${" | replace "%{" "%%{" }} = {{ toJson $spec | replace "${" "$${" | replace "%{" "%%{" }}
              {{- end }}
            }
            {{- end }}
            {{- if $env }}
            env_variables = {
              {{- range $name, $value := $env }}
              {{ toJson $name | replace "${" "$${" | replace "%{" "%%{" }} = {{ toJson $value | replace "${" "$${" | replace "%{" "%%{" }}
              {{- end }}
            }
            {{- end }}
            {{- if $airflow }}
            airflow_config_overrides = {
              {{- range $key, $value := $airflow }}
              {{ toJson $key | replace "${" "$${" | replace "%{" "%%{" }} = {{ toJson $value | replace "${" "$${" | replace "%{" "%%{" }}
              {{- end }}
            }
            {{- end }}
          }
          {{- end }}
          {{- if $node }}

          node_config {
            {{- with optional $o "private_network" "" }}
            network         = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
            {{- with optional $o "subnetwork" "" }}
            subnetwork      = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
            {{- with optional $o "service_account" "" }}
            service_account = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
          }
          {{- end }}
          {{- with optional $o "environment_size" "" }}

          environment_size = "{{ . }}"
          {{- end }}
          {{- if hasKey $o "enable_private_environment" }}

          enable_private_environment = {{ $o.enable_private_environment }}
          {{- end }}
          {{- with optional $o "kms_key_name" "" }}

          encryption_config {
            kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
          }
          {{- end }}
        }
        {{- with optional $o "bucket" "" }}

        storage_config {
          bucket = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }

      output "endpoint" {
        value = google_composer_environment.this.config[0].airflow_uri
      }

      output "host" {
        value = regex("^https?://([^/:]+)", google_composer_environment.this.config[0].airflow_uri)[0]
      }

      output "dag_gcs_prefix" {
        value = google_composer_environment.this.config[0].dag_gcs_prefix
      }
