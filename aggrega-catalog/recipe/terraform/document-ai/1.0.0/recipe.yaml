apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: document-ai
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Document AI, rendered as an authored Terraform body, main.tf: one
    google_document_ai_processor of the component's type, displayed under
    the component's name, in the operator's project and location, and
    encrypted with the operator's Cloud KMS key where kms_key_name names
    one. Nothing else is created: no processor version, key or IAM binding.

    endpoint and processor are outputs of this component's module: the
    Document AI endpoint of the processor's location,
    https://<location>-documentai.googleapis.com, composed from the
    location, and the processor's resource name.

    Every argument of the processor is fixed when Document AI creates it,
    so any change, renaming the component among them, replaces it, and
    consumers read a new processor name. A project_id or location missing,
    a kms_key_name not a key's resource ID and any infra.overrides key not
    listed halt the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/ai-tool/document-ai:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this processor, and resolves
  # none of them. Each is a reference to an output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a
  # module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The references resolve only for a
  # consumer authored as a source: Recipe in the same Terraform root
  # configuration, which Terraform then applies after this module; a
  # consumer on another target receives them as text.
  #
  # endpoint joins https://, the processor's location and
  # -documentai.googleapis.com: Document AI's "Send a processing request"
  # sends process and batchProcess to
  # https://LOCATION-documentai.googleapis.com, LOCATION being the
  # processor's, and the google provider reaches the processor at the same
  # endpoint. processor is the resource's id,
  # projects/<project>/locations/<location>/processors/<processor ID>, the
  # name a process or batchProcess call names.
  provides:
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
    processor: "${module.{{ .context.instance_id }}.processor}"

  # This Recipe reads from infra.overrides:
  #   project_id   - string, required (project)
  #   location     - string, required (location)
  #   kms_key_name - string (kms_key_name)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # project_id is the name every terraform Google Recipe of this catalog
  # reads for the project a resource is created in; location is the name
  # the catalog's Google Recipes read where a service takes a multi-region
  # as well as a region; kms_key_name is the name the catalog's Google
  # bodies read for a Cloud KMS key, and the provider's argument.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates, with the Document AI API enabled. location is one of
  # Document AI's locations: the multi-region us or eu, or one of the
  # regions "Document AI locations" lists, such as europe-west2, which
  # Document AI checks when it creates the processor. Neither has a value
  # this Recipe could choose for the operator, so each halts the build when
  # it is missing.
  #
  # kms_key_name names the operator's Cloud KMS key the processor is
  # encrypted with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>.
  # Document AI's "Customer-managed encryption keys" asks that the key's
  # location match the processor's, us-central1 for the us multi-region and
  # europe-west4 for eu, and that the Document AI service agent hold the
  # Cloud KMS CryptoKey Encrypter/Decrypter role on it, which Document AI
  # checks when it creates the processor. Unset, Google encrypts the
  # processor's data with a key it manages. A value of another form halts.
  # The key is the operator's, named here and never created.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema, or not read:
  #   honoured — values.type, as type; the component's name, as
  #     display_name, which the provider's schema asks to be unique; and the
  #     overrides above.
  #   refused — project_id or location missing or not a string; a
  #     kms_key_name of another form; and any infra.overrides key not listed
  #     above.
  #   held by the Component's schema — type's presence; which types a
  #     project may create in a location is Document AI's to check when it
  #     creates the processor.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: nothing else of the processor; it
  # serves its type's default version, and no processor version is trained,
  # deployed or set as the default.
  #
  # Changes. The provider replaces the processor when any argument the body
  # writes changes, since Document AI fixes each when it creates the
  # processor, its encryption among them ("Once a processor has been
  # created, you cannot change its encryption settings"): renaming the
  # component, or changing values.type, location, project_id or
  # kms_key_name. The new processor takes a new ID Document AI assigns, so
  # a caller still naming the old one names a processor that no longer
  # exists.
  #
  # Deletion. A destroy, or removing the component, deletes the processor:
  # the body leaves the provider's deletion_policy at its default, DELETE.
  # A processor keeps no document a caller sends, and a batch call's
  # results stay in the caller's Cloud Storage location, so this Recipe
  # configures no backup and declares no native backup.
  #
  # Credentials. A processor holds none: a caller signs each call as the
  # Google identity it runs under, and Terraform authenticates with the
  # credentials in the environment it runs in, so the rendered configuration
  # names none.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "kms_key_name" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location and kms_key_name from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_and_location_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "project_id" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail (printf "this Release creates its Document AI processor in the operator's own Google Cloud project, at a location the operator chooses, and this Recipe chooses neither, but infra.overrides.%s carries none: set infra.overrides.%s in the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    kms_key_name: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Document AI takes the Cloud KMS key it encrypts a processor with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-google-modules publishes no
  # Document AI module. The resource is named this, since each component's
  # body renders into a module directory of its own. Each string the
  # Aggregate or the Release gives reaches Document AI as written: Terraform
  # would read ${ and %{ inside a string as the start of an interpolation
  # or a directive, so they are written $${ and %%{, which Terraform turns
  # back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_document_ai_processor" "this" {
        display_name = "{{ .context.instance_id }}"
        type         = {{ toJson .values.type | replace "${" "$${" | replace "%{" "%%{" }}
        location     = {{ toJson $o.location | replace "${" "$${" | replace "%{" "%%{" }}

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "kms_key_name" "" }}
        kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      output "endpoint" {
        value = "https://${google_document_ai_processor.this.location}-documentai.googleapis.com"
      }

      output "processor" {
        value = google_document_ai_processor.this.id
      }
