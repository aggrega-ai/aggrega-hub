apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-front-door
  version: 1.0.0
  # No metadata.license: this Recipe pins and vendors no third-party module.
  # The module beside it is the catalog's own, and the Front Door profile it
  # declares is a service the reader contracts for directly with Microsoft,
  # under Azure's terms.
  description: >
    Azure Front Door: one Standard or Premium profile with one endpoint
    routing every path to one origin, rendered as Terraform for the azurerm
    provider by a module kept beside this Recipe, not by Microsoft's Azure
    Verified Modules module Azure/avm-res-cdn-profile/azurerm, which at
    v0.2.0 attaches only a web application firewall policy it creates
    itself, never the operator's policy infra.waf_policy_id names.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-front-door where it deploys an Azure Resource Manager
    template. It needs hashicorp/azurerm 5.14 or later, so it goes in a
    boundary apart from Recipes whose modules admit azurerm 4 alone.
    infra.overrides names the operator's resource group. The profile runs on
    Standard_AzureFrontDoor unless infra.overrides.sku_name is
    Premium_AzureFrontDoor, at the location global. The origin's host name
    is the host the upstream connection publishes; Front Door forwards to it
    over HTTPS on port 443, redirects HTTP to HTTPS and caches nothing.
    infra.waf_policy_id associates the operator's web application firewall
    policy with the endpoint.

    host is a reference to the host name the provider reports for the
    endpoint; endpoint is https:// and that name. A component name the
    provider refuses halts naming the component, an upstream publishing no
    host halts naming the connection, and any infra.overrides key not
    listed, location, enable_telemetry and host halt naming the key, as do
    resource_group_name left out, and resource_group_name, sku_name and a
    policy ID not cased as the provider requires given in a form they do
    not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/network/azure-front-door:1.0.0

  # Why the module is the catalog's own. Microsoft's Azure Verified Modules
  # module Azure/avm-res-cdn-profile/azurerm at v0.2.0, MIT, declares a
  # security policy for each entry of its front_door_security_policies input
  # and writes its firewall policy as
  # azurerm_cdn_frontdoor_firewall_policy.wafs[<key>].id, a policy the module
  # itself creates from its front_door_firewall_policies input
  # (main.cdn_frontdoor_wafandsecuritypolicy.tf), so it cannot associate the
  # existing policy the operator names in infra.waf_policy_id, which the
  # Component's contract requires. The resources below are the azurerm
  # provider's own, the ones that module declares for one endpoint.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   resource_group_name - string (the profile's resource_group_name), required
  #   sku_name            - string (the profile's sku_name:
  #                         Standard_AzureFrontDoor or Premium_AzureFrontDoor;
  #                         default Standard_AzureFrontDoor)
  #   tags                - map[string]string (the profile's and the endpoint's
  #                         tags)
  # host halts by name, as any key not listed does: the route serves only
  # the endpoint's own host name, and this Recipe offers no custom domain,
  # so a name set here would be one Front Door refuses a request for.
  # location halts by name: a Front Door profile
  # and its endpoint sit at the location global, which the provider writes
  # for both, and in no region. enable_telemetry halts by name: the module is
  # the catalog's own and carries no telemetry to turn on or off.
  #
  # sku_name and tags are the keys arm/azure-front-door reads for the same
  # concepts, under the same spelling; that Recipe refuses
  # resource_group_name, since its template creates the profile in the group
  # it is deployed to, and refuses host by name as this one does.
  # resource_group_name is the key every azurerm Recipe reads for the
  # operator's resource group, sku_name the key every Azure Recipe reads for
  # the tier a service is provisioned at.
  #
  # sku_name. Microsoft offers Azure Front Door in two tiers, spelt as the
  # service spells them: Standard_AzureFrontDoor, unless set, and
  # Premium_AzureFrontDoor, which adds managed rule sets in a web
  # application firewall policy, bot protection and Private Link connections
  # to origins. The provider takes these two alone, and any other value halts
  # below by name. Changing sku_name from Standard_AzureFrontDoor to
  # Premium_AzureFrontDoor replaces the profile, since the provider marks
  # sku_name as forcing a new resource, and the provider refuses the change
  # from Premium_AzureFrontDoor to Standard_AzureFrontDoor when it plans
  # (azurerm v5.14.0, internal/services/cdn/resources/cdn_frontdoor_profile/resource.go),
  # as Microsoft documents no downgrade.
  #
  # Infra keys of the Component:
  #   waf_policy_id. Unset, the module declares no security policy, and no
  #   web application firewall inspects the endpoint's requests. Set, it
  #   declares one associating the policy the ID names with the endpoint's
  #   own domain for every path, /*. The policy is the operator's: the module
  #   references it and never creates or changes it, so an ID naming no
  #   policy fails when Terraform applies, and the policy has to be of the
  #   profile's tier: Microsoft's tier-upgrade page implies a policy and its
  #   profile share one. The Component refuses an ID not of
  #   a policy's form. The provider parses the ID with its fixed
  #   segments cased exactly as subscriptions, resourceGroups, providers,
  #   Microsoft.Network and frontDoorWebApplicationFirewallPolicies, and
  #   refuses any other casing when it plans, though Azure Resource Manager
  #   reads resource IDs without regard to case, so an ID cased otherwise
  #   halts below by name.
  #
  # The upstream connection. The Component's one_upstream assertion keeps a
  # single connection on the socket, and the compiler refuses none, as the
  # socket is required. The origin takes the host that connection's target
  # publishes as its host name, and the same name as the Host header Front
  # Door sends, which origins such as Web Apps and Blob Storage require by
  # default. The origin is reached over HTTPS on port 443, plain HTTP on port
  # 80 being unused, and Front Door checks that the certificate it presents
  # carries that name. The host is copied into the module's arguments as the
  # target publishes it: a name, or a reference to another module's output,
  # which resolves in the boundary's root configuration for a target in the
  # same boundary. A target that publishes no host, such as
  # core/compute/server, halts the build naming the connection.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's documentation and the
  # azurerm provider's schema at 5.14.0:
  #   honoured — infra.waf_policy_id, the upstream connection's host and the
  #     overrides above. The Component declares no values.
  #   refused — a component name the provider refuses; an upstream target
  #     publishing no host; infra.overrides.location, enable_telemetry and
  #     host; resource_group_name left out or given as anything but a string;
  #     sku_name given as anything but Standard_AzureFrontDoor or
  #     Premium_AzureFrontDoor;
  #     infra.waf_policy_id with its fixed segments cased otherwise than the
  #     provider requires; and any infra.overrides key not listed above.
  #   not read — none.
  #
  # Credentials. Front Door holds no credential a consumer needs: clients
  # reach the endpoint anonymously over HTTPS, and authenticating them is the
  # origin's work or the web application firewall policy's. The origin is
  # reached without one, so nothing is published but the endpoint's address.
  # Backup. Front Door keeps no data of its own, only its configuration,
  # which this module declares, so no backup is configured.
  assertions:
    placement_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "resource_group_name" "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.resource_group_name is %v, and it names the operator's resource group the Front Door profile is created in, by its name, such as example-rg, as a string: set infra.overrides.resource_group_name in the Release to such a name" $v) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail "this Release places its Front Door profile in the operator's own Azure resource group, and this Recipe never chooses one, but infra.overrides.resource_group_name carries none: set infra.overrides.resource_group_name in the Release" -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "sku_name" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "location" -}}
      {{- fail "infra.overrides.location is set, and an Azure Front Door profile and its endpoint sit at the location global, which the provider writes, in no region: remove infra.overrides.location from the Release" -}}
      {{- end -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the Front Door profile in a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and this Recipe's route serves only the endpoint's own host name and offers no custom domain, so a name set here would be one Front Door refuses a request for: remove infra.overrides.host from the Release, and read the host the endpoint publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, sku_name and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $s := optional (optional .infra "overrides" dict) "sku_name" "Standard_AzureFrontDoor" -}}
      {{- if not (has $s (list "Standard_AzureFrontDoor" "Premium_AzureFrontDoor")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Microsoft offers Azure Front Door in the tiers Standard_AzureFrontDoor and Premium_AzureFrontDoor, spelt as written here, which the provider takes alone: set infra.overrides.sku_name to one of them, or remove it for Standard_AzureFrontDoor" $s) -}}
      {{- end -}}
    # The Component has already held the ID to a policy's form, without
    # regard to case.
    waf_policy_id_casing: >-
      {{- $w := optional .infra "waf_policy_id" "" -}}
      {{- if and (typeIs "string" $w) $w (not (regexMatch `^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/frontDoorWebApplicationFirewallPolicies/[^/]+$` $w)) -}}
      {{- fail (printf "infra.waf_policy_id is %s, and the azurerm provider reads a Front Door web application firewall policy's ID with its fixed segments cased exactly as /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/frontDoorWebApplicationFirewallPolicies/<policy>: write those segments so in the Release" $w) -}}
      {{- end -}}
    # The profile, its endpoint, origin group, origin, route and security
    # policy are all named after the component. The azurerm provider's
    # validation (internal/services/cdn/validate, v5.14.0) gives an endpoint
    # 2 to 46 letters, digits and hyphens, starting and ending with a letter
    # or digit, the profile, origin group, origin and route the same
    # characters in up to 90, and the security policy the same characters in
    # any length. The endpoint's host name is its name, a hyphen and a
    # 16-character hash, so 46 + 1 + 16 = 63 fills the DNS label limit; it is
    # checked here, where the name is known.
    front_door_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9][A-Za-z0-9-]{0,44}[A-Za-z0-9]$` $n) -}}
      {{- fail (printf "the component %q names its Front Door profile, endpoint, origin group, origin, route and security policy, and the azurerm provider takes an endpoint name of 2 to 46 letters, digits and hyphens, starting and ending with a letter or digit (the endpoint's host name adds a hyphen and a 16-character hash, which keeps it within the 63 characters of a DNS label): rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service gives the endpoint a host name of
  # its own, the endpoint's name followed by a hash Front Door generates,
  # under its environment's domain, z01.azurefd.net in the public cloud, and
  # the provider reports it as the endpoint's host_name. The module outputs
  # it as host, and endpoint as https:// followed by it; each reference
  # resolves in the boundary's root configuration once Terraform applies.
  #
  # No infra.overrides.host: Front Door refuses a request whose host is not
  # one of its route's domains, and this route's one domain is the
  # endpoint's own, so no other name would reach it.
  provides:
    host: "${module.{{ .context.instance_id }}.host}"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"

  # Each key becomes an argument of this component's module block in the
  # boundary's root configuration, named for the module's own variable.
  #
  # The resource group's name, the firewall policy's ID and each tag reach
  # Azure as written: each is written as its JSON text, which keeps a double
  # quote inside it a character of the value, and the root configuration
  # writes a module argument's %{ as %%{ itself and keeps ${, which a
  # reference to another module's output needs, so ${ inside them is written
  # $${ here, which Terraform turns back into the characters written.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    {{- $n := .context.instance_id }}
    {{- $origin := "" }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "upstream" }}
    {{- $p := optional $edge "provides" dict }}
    {{- if not (hasKey $p "host") }}
    {{- fail (printf "the upstream connection %q of %q reaches %q, which publishes no host, and Azure Front Door forwards every request to the host its upstream publishes: wire upstream in the Aggregate to a component that publishes host" $alias $n $edge.target) }}
    {{- end }}
    {{- $origin = $p.host }}
    {{- end }}
    {{- end }}
    name: "{{ $n }}"
    resource_group_name: {{ toJson $o.resource_group_name | replace "${" "$${" }}
    sku_name: "{{ optional $o "sku_name" "Standard_AzureFrontDoor" }}"
    origin_host_name: "{{ $origin }}"
    {{- with optional .infra "waf_policy_id" "" }}
    waf_policy_id: {{ toJson (toString .) | replace "${" "$${" }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}

  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
