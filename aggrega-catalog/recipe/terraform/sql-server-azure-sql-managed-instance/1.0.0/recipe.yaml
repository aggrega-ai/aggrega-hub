apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sql-server-azure-sql-managed-instance
  version: 1.0.0
  # The values, attachments and infra.overrides keys this Recipe refuses are
  # listed, with their reasons, in the comments above the assertions.
  description: >
    SQL Server on Azure SQL Managed Instance: one managed instance in the
    operator's delegated subnet and the one database values.database names,
    rendered as Terraform for the azurerm provider by a module kept beside
    this Recipe. The module Microsoft's Azure Verified Modules programme
    publishes for the service, Azure/avm-res-sql-managedinstance/azurerm at
    v0.3.2, is not sourced: its root module calls a module from the Terraform
    registry, Azure/avm-utl-interfaces/azure, and the catalog sources no
    module whose configuration loads one.

    Reach for it where the Release deploys Terraform and the database needs a
    whole SQL Server instance in the operator's virtual network; reach for
    arm/sql-server-azure-sql-managed-instance where the Release deploys an
    Azure Resource Manager template, and
    terraform/sql-server-azure-sql-database for a database on a logical
    server. It needs hashicorp/azurerm 5.14 or later, so it goes in a
    terraform boundary apart from terraform/sql-server-azure-sql-database,
    terraform/postgres-flexible-server and terraform/azure-api-management.

    The resource group, region and delegated subnet are the operator's, named
    in infra.overrides; no network, route table, network security group,
    identity or DNS zone is emitted, and the instance's public endpoint stays
    off. The administrator values.user names takes the core/random-password
    attachment on the password slot as a Terraform reference, so the
    rendered files carry no password; with nothing attached, or another
    credential, the build halts naming the slot.

    host publishes a reference to the instance's FQDN, or
    infra.overrides.host; port is 1433. infra.engine_version 2022 or 2025
    sets the instance's update policy, and any other halts naming it;
    infra.overrides.sku_name and infra.overrides.vcores size the instance,
    infra.ha.enabled makes it zone redundant, and a value or an
    infra.overrides key the service cannot take halts naming it. A
    core/backup attachment bound to terraform/backup-native sets how long the
    service keeps the database's backups.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/datastore/sql-server:1.0.0

  # The instance is declared by the module beside this Recipe, with the
  # azurerm provider's azurerm_mssql_managed_instance and
  # azurerm_mssql_managed_database resources.
  #
  # Microsoft's Azure Verified Modules programme publishes a module for this
  # service, Azure/avm-res-sql-managedinstance/azurerm, MIT, at v0.3.2. Its
  # root module calls Azure/avm-utl-interfaces/azure, a module of the
  # Terraform registry, so initialising a configuration that loads it fetches
  # a registry module, which the catalog's published-module test refuses: a
  # module the catalog sources loads providers and nothing else. The module is
  # therefore not sourced.
  #
  # source names that directory, ./module, rather than rendering the body as
  # artifacts: a consumer in the same root configuration reads the instance's
  # address as the module's fqdn output, and that reference resolves in the
  # boundary's root configuration, where this Recipe's valuesMapping becomes
  # the arguments of its module block. Each file of the directory is pinned in
  # entity.lock.
  source: ./module

  locals:
    # The SKU, infra.overrides.sku_name or GP_Gen5: the General Purpose tier
    # on standard-series (Gen5) hardware. Only a string is read here; any
    # other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "GP_Gen5" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The update policy infra.engine_version names, in the service's spelling:
    # SQLServer2022 for 2022, SQLServer2025 for 2025, and empty for any other,
    # which the assertion below refuses.
    database_format: '{{ get (dict "2022" "SQLServer2022" "2025" "SQLServer2025") (toString .infra.engine_version) }}'
    # The name the Release gives the instance under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Azure SQL Managed Instance automated backups"

  # This Recipe reads from infra.overrides:
  #   resource_group_name  - string (resource_group_name of the instance), required
  #   location             - string (location), required
  #   delegated_subnet_id  - string (subnet_id), required
  #   sku_name             - string (sku_name; default "GP_Gen5")
  #   vcores               - integer (vcores; default 4)
  #   license_type         - string (license_type; default "LicenseIncluded")
  #   tags                 - map[string]string (tags of the instance)
  #   host                 - string (published as provides.host; renders nothing)
  # enable_telemetry halts by name: the body is this catalog's own, with no
  # module telemetry to turn on or off. Any other key halts naming it, so a
  # key misspelt, or meant for another Recipe, is never passed over unread.
  #
  # Each is the key arm/sql-server-azure-sql-managed-instance reads for the
  # same concept, under the same spelling, save resource_group_name, which
  # that Recipe refuses, since a template deploys into the resource group it
  # is deployed to; the argument each sets is given in brackets.
  # delegated_subnet_id is the key the flexible-server Recipes read for the
  # delegated subnet a managed database server is placed in, sku_name the key
  # every Azure Recipe reads for the size class a service is provisioned at,
  # and host the key every managed datastore Recipe reads for the address it
  # publishes.
  #
  # resource_group_name, location and delegated_subnet_id are required: they
  # place the instance in the operator's subscription and network, and this
  # Recipe never chooses any of them. delegated_subnet_id is the resource ID
  # of a subnet of the operator's virtual network, delegated to
  # Microsoft.Sql/managedInstances, with the route table and network security
  # group the service requires associated with it, none of which this Recipe
  # creates; location is that virtual network's region.
  #
  # sku_name names the tier and the hardware as the azurerm provider spells
  # them: GP_Gen5, GP_Gen8IM or GP_Gen8IH for General Purpose, BC_Gen5,
  # BC_Gen8IM or BC_Gen8IH for Business Critical, on standard-series (Gen5),
  # premium-series (Gen8IM) or memory-optimized premium-series (Gen8IH)
  # hardware, the SKUs the service's template reference lists, where it
  # spells premium-series G8IM and G8IH. vcores is one of the counts the provider
  # and the template reference list, 4, 6, 8, 10, 12, 16, 20, 24, 32, 40, 48,
  # 56, 64, 80, 96 and 128; which of them a hardware and tier take, the
  # service checks when Terraform applies. license_type is LicenseIncluded,
  # the price including a SQL Server licence, or BasePrice, the discounted
  # price for a licence the operator brings; the provider requires one, and
  # this Recipe passes LicenseIncluded while it is unset.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # provider's resources:
  #   honoured — values.database, as the database the module creates;
  #     values.user, as the administrator login; values.collation, as the
  #     instance's collation (see the collation note below); the password
  #     attachment, as
  #     the administrator's password; infra.engine_version, 2022 or 2025, as
  #     the instance's update policy (database_format, SQLServer2022 or
  #     SQLServer2025); infra.storage.size, as the instance's storage in whole
  #     gibibytes; infra.ha.enabled, as the instance's zone redundancy; a
  #     core/backup attachment, as the comment above the mapping says; and
  #     the overrides above.
  #   refused — infra.engine_version other than 2022 and 2025; infra.port
  #     other than 1433; infra.compute.cpu and infra.compute.memory, since
  #     infra.overrides.sku_name and infra.overrides.vcores size the instance;
  #     infra.storage.type, since the service tier fixes the storage;
  #     infra.storage.size outside what the service takes; a component name
  #     the service refuses for the instance; a database name the service
  #     refuses, a system database's among them; values.user naming a
  #     principal SQL Server keeps; a credential on the password slot other
  #     than core/random-password, or none; and any infra.overrides key not
  #     listed above.
  #   not read — infra.port while it is 1433, the Component's default: the
  #     instance serves 1433 on its endpoint inside the virtual network, and
  #     a Recipe cannot tell a default from a value the Release wrote.
  #
  # The update policy. The service aligns an instance's databases with a
  # SQL Server release through its update policy: SQL Server 2022, SQL Server
  # 2025, or Always-up-to-date, which follows the service's newest engine
  # features and names no release, so no year selects it and this Recipe does
  # not offer it. Raising infra.engine_version from 2022 to 2025 on an
  # instance that exists upgrades its databases' format, which the service
  # never undoes; the service refuses the change back.
  #
  # Collation. The azurerm provider sets no collation on a managed database, so
  # values.collation is the instance's collation, its server collation, and
  # the database is created with none of its own. Microsoft's documentation of
  # collations, for SQL Server and SQL Managed Instance alike, states that the
  # server collation is the default collation of every user database created
  # on the instance, and that a database created without a collation uses the
  # server collation, so the database takes values.collation. The server
  # collation is fixed when the instance is created, as the provider marks it:
  # changing values.collation replaces the instance.
  #
  # The administrator's password is the module's administrator_login_password:
  # the password core/random-password's terraform/random-password realization
  # draws at apply time, handed over as a Terraform reference, so no password
  # is written into the rendered configuration; the apply keeps it in the
  # Terraform state, where an operator can read it. Neither the service nor
  # the module draws one, so with nothing attached the build halts.
  # core/generated-secret states the service owns the credential, which it
  # does not, and another credential either carries its value as text, which
  # would be written into the configuration, or carries none the service could
  # take, so both halt. The service takes a password of at least 16 characters
  # holding three of upper-case letters, lower-case letters, digits and other
  # characters; terraform/random-password draws at least one upper-case
  # letter, one lower-case letter and one digit in every password, and an
  # attachment whose values.length is under 16 halts naming it.
  assertions:
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "resource_group_name" "location" "delegated_subnet_id" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release places its managed instance in the operator's own Azure resource group, region and delegated subnet, and this Recipe never chooses any of them, but infra.overrides.%s carries none: set infra.overrides.resource_group_name, infra.overrides.location and infra.overrides.delegated_subnet_id in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/virtualNetworks/[^/]+/subnets/[^/]+$` $o.delegated_subnet_id) -}}
      {{- fail (printf "infra.overrides.delegated_subnet_id is %q, and the managed instance takes the subnet it is placed in as the subnet's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>, a subnet delegated to Microsoft.Sql/managedInstances" $o.delegated_subnet_id) -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "delegated_subnet_id" "sku_name" "vcores" "license_type" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the managed instance with a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, delegated_subnet_id, sku_name, vcores, license_type, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $skus := list "GP_Gen5" "GP_Gen8IM" "GP_Gen8IH" "BC_Gen5" "BC_Gen8IM" "BC_Gen8IH" -}}
      {{- $s := optional $o "sku_name" "GP_Gen5" -}}
      {{- if not (and (typeIs "string" $s) (has $s $skus)) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Azure SQL Managed Instance takes as its SKU the tier and the hardware, which the azurerm provider spells as one of %s: set infra.overrides.sku_name to one, or remove it for GP_Gen5" $s (join ", " $skus)) -}}
      {{- end -}}
      {{- $counts := list 4 6 8 10 12 16 20 24 32 40 48 56 64 80 96 128 -}}
      {{- $v := optional $o "vcores" 4 -}}
      {{- if not (and (or (kindIs "int" $v) (kindIs "int64" $v) (and (kindIs "float64" $v) (eq (float64 (int $v)) $v))) (has (int $v) $counts)) -}}
      {{- fail (printf "infra.overrides.vcores is %v, and Azure SQL Managed Instance takes as its vCores one of %s, as many as the hardware and tier allow: set infra.overrides.vcores to one, or remove it for 4" $v (join ", " $counts)) -}}
      {{- end -}}
      {{- $l := optional $o "license_type" "LicenseIncluded" -}}
      {{- if not (and (typeIs "string" $l) (has $l (list "LicenseIncluded" "BasePrice"))) -}}
      {{- fail (printf "infra.overrides.license_type is %v, and Azure SQL Managed Instance takes LicenseIncluded, a price including the SQL Server licence, or BasePrice, a discounted price for a licence the operator brings: set infra.overrides.license_type to one, or remove it for LicenseIncluded" $l) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the instance serves port 1433` $h) -}}
      {{- end -}}
      {{- end -}}
    # The managed instance is named after the component, and its name is also
    # the first label of the address the service gives it; the rule the
    # provider checks it against is checked here, where the name is known.
    instance_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` $n) -}}
      {{- fail (printf "the component %q names its managed instance, and an instance name holds 1 to 63 lowercase letters, digits and hyphens, beginning and ending with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The database names the service refuses: one over 128 characters, one
    # holding < > * % & : \ / ? or a control character, one ending in a period
    # or a space, and the system databases every instance holds, master,
    # model, msdb and tempdb.
    database_name: >-
      {{- $d := toString .values.database -}}
      {{- if or (eq $d "") (gt (len $d) 128) (regexMatch `[<>*%&:\\/?[:cntrl:]]` $d) (hasSuffix "." $d) (hasSuffix " " $d) (has (lower $d) (list "master" "model" "msdb" "tempdb")) -}}
      {{- fail (printf "values.database is %q, and Azure SQL Managed Instance takes a database name of 1 to 128 characters holding none of < > * %% & : \\ / ? or a control character, not ending in a period or a space, and other than master, model, msdb and tempdb, the system databases every instance holds: set values.database in the Aggregate to such a name" $d) -}}
      {{- end -}}
    # The names of the principals SQL Server keeps on every instance, read off
    # its documentation of the Database Engine's principals and of server-level
    # roles, both of which apply to SQL Managed Instance: the sa login; the dbo,
    # guest, INFORMATION_SCHEMA and sys users every database holds; and the
    # fixed server roles, sysadmin, serveradmin, securityadmin, processadmin,
    # setupadmin, bulkadmin, diskadmin, dbcreator and public. A login cannot
    # take a server role's name: sys.server_principals lists logins and server
    # roles alike, under a name unique within the server. The service's own
    # guide to creating an instance names serveradmin as reserved for the
    # administrator login. The administrator login is named once, when the
    # instance is created, and this Recipe refuses each of these names for it,
    # and an empty name, which names no login.
    administrator_login: >-
      {{- $u := toString .values.user -}}
      {{- if or (eq $u "") (has (lower $u) (list "sa" "dbo" "guest" "information_schema" "sys" "sysadmin" "serveradmin" "securityadmin" "processadmin" "setupadmin" "bulkadmin" "diskadmin" "dbcreator" "public")) -}}
      {{- fail (printf "values.user is %q, the managed instance's administrator login, and SQL Server keeps sa, dbo, guest, INFORMATION_SCHEMA and sys, and the fixed server roles sysadmin, serveradmin, securityadmin, processadmin, setupadmin, bulkadmin, diskadmin, dbcreator and public, for principals of its own, while an empty name names no login: set values.user in the Aggregate to another name" $u) -}}
      {{- end -}}
    engine_version_offered: >-
      {{- if not .locals.database_format -}}
      {{- fail (printf "infra.engine_version is %q, and Azure SQL Managed Instance aligns its databases with SQL Server 2022 or SQL Server 2025, the update policies that name a release, which this Recipe sets from it: set infra.engine_version in the Release to 2022 or 2025" (toString .infra.engine_version)) -}}
      {{- end -}}
    port_is_the_service_port: >-
      {{- if ne (int .infra.port) 1433 -}}
      {{- fail (printf "infra.port is %v, and Azure SQL Managed Instance serves SQL Server on port 1433 on its endpoint inside the virtual network, which this Recipe publishes as port, and does not move it: remove infra.port from the Release" .infra.port) -}}
      {{- end -}}
    compute_not_taken: >-
      {{- $c := optional .infra "compute" dict -}}
      {{- range $k := list "cpu" "memory" -}}
      {{- with optional $c $k "" -}}
      {{- fail (printf "infra.compute.%s is %v, and Azure SQL Managed Instance sizes the instance by its SKU and its vCores, which this Recipe reads from infra.overrides.sku_name and infra.overrides.vcores, not by a CPU or memory figure: remove infra.compute.%s from the Release and set those two" $k . $k) -}}
      {{- end -}}
      {{- end -}}
    # The template reference for Microsoft.Sql/managedInstances takes the
    # instance's storage from 32 to 32768 GB in steps of 32, which the provider
    # checks only for the range; the largest a hardware, tier and vCore count
    # take, the service checks when Terraform applies.
    storage: >-
      {{- $size := toString .infra.storage.size -}}
      {{- $gi := regexFind `^[0-9]+` $size -}}
      {{- if not (and (regexMatch `^[0-9]+Gi$` $size) (ge (int $gi) 32) (le (int $gi) 32768) (eq (mod (int $gi) 32) 0)) -}}
      {{- fail (printf "infra.storage.size is %q, and Azure SQL Managed Instance takes the instance's storage in whole gibibytes from 32 to 32768, in steps of 32: set infra.storage.size in the Release to such a size, such as 32Gi" $size) -}}
      {{- end -}}
      {{- with optional .infra.storage "type" "" -}}
      {{- fail (printf "infra.storage.type is %q, and Azure SQL Managed Instance chooses the instance's storage by its service tier and takes no storage type: remove infra.storage.type from the Release" (toString .)) -}}
      {{- end -}}
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if not (hasKey $f "password") -}}
      {{- fail "the password slot is empty, and neither Azure SQL Managed Instance nor this Recipe draws a password for the administrator values.user names: attach core/random-password to the password slot, bound to terraform/random-password in the Manifest" -}}
      {{- end -}}
      {{- $ty := first (splitList ":" (toString (optional $f.password "type" ""))) -}}
      {{- if ne $ty "core/random-password" -}}
      {{- fail (printf "the password slot is filled by %s, and this Recipe hands the managed instance its administrator's password as a Terraform reference to one drawn at apply time, which core/random-password publishes through terraform/random-password; neither the service nor this Recipe draws one, and another credential either carries its value as text, which would be written into the rendered configuration, or carries none the service could take: attach core/random-password to the password slot instead" (default "an attachment of no type" $ty)) -}}
      {{- end -}}
      {{- $n := int (optional (optional .features.password "values" dict) "length" 32) -}}
      {{- if lt $n 16 -}}
      {{- fail (printf "the password attached to the password slot sets values.length to %d, and Azure SQL Managed Instance takes an administrator's password of at least 16 characters: set values.length on the password attachment to 16 or more, or remove it for 32" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. host names
  # the fqdn output of this component's module — the instance's name under
  # database.windows.net, which resolves to its address inside the virtual
  # network — through the module call the boundary's root configuration
  # declares under .context.instance_id for a component declared in the
  # Aggregate the Release deploys. Terraform resolves it at apply time, so it
  # resolves only for a consumer authored as a source: Recipe in the same
  # root configuration; a consumer on another target receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record for it, so the operator points the name at the instance outside
  # the Release. A consumer in the same root configuration receives the name as
  # well, and a name carries no reference for Terraform to order its module
  # after this one by; a later syncWave on the consumer's boundary, sharing
  # this boundary's directory, orders the two.
  #
  # port is 1433, where the instance serves SQL Server inside the virtual
  # network. user and database are the developer values the module creates;
  # protocol is sqlserver.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.fqdn}{{ end }}"
    port: "1433"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "sqlserver"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable. The
  # instance is named after the component, as the other managed Recipes name
  # theirs, and its storage is given in whole gibibytes.
  #
  # The administrator's password is the attachment's module output joined with
  # a dot and wrapped in an interpolation, as terraform/random-password
  # publishes it.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside. Azure SQL Managed
  # Instance backs up every database: a full backup each week, a differential
  # one every 12 or 24 hours and a log backup about every 10 minutes, on a
  # schedule the service sets, and keeps them for point-in-time restore 1 to
  # 35 days, 7 by default; no setting turns them off and no time reaches them:
  #   - With none attached, the database keeps its backups 7 days.
  #   - An attachment carrying no infra.role_arn, bound to
  #     terraform/backup-native, sets short_term_retention_days from
  #     infra.retention_days, and a value outside 1 to 35 halts naming the
  #     attachment; infra.schedule halts naming it, since the service takes no
  #     backup time. The service keeps point-in-time restore for every
  #     database across that window, and no setting turns it off, so
  #     infra.point_in_time_recovery left out or true is what it gives, and
  #     false halts naming the attachment rather than being ignored.
  #   - An attachment carrying infra.role_arn is AWS Backup's, whose
  #     realizations refuse a host that is no Amazon RDS instance; this Recipe
  #     configures nothing from it.
  #   - Two attachments carrying no infra.role_arn halt naming both: a database
  #     runs one automated backup.
  # A Recipe's locals cannot read its attachments, so the reading sits at the
  # top of the mapping below.
  valuesMapping: |
    {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
    {{- $backupNative := "" -}}{{- $backupNativeInfra := dict -}}
    {{- range $name, $attachment := (default dict .features) -}}
    {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
    {{- $in := default dict (optional $attachment "infra" dict) -}}
    {{- if not (trim (toString (optional $in "role_arn" ""))) -}}
    {{- if $backupNative -}}
    {{- fail (printf "core/backup attachments %q and %q on %q both leave its backup to Azure SQL Managed Instance, which runs one automated backup on a database: remove one of the two" $backupNative $name $.context.instance_id) -}}
    {{- end -}}
    {{- $backupNative = $name -}}{{- $backupNativeInfra = $in -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $backupRetention := 7 -}}
    {{- if $backupNative -}}
    {{- with trim (toString (optional $backupNativeInfra "schedule" "")) -}}
    {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and Azure SQL Managed Instance takes each backup on a schedule it sets, which no setting moves: remove infra.schedule from the attachment" $backupNative $.context.instance_id .) -}}
    {{- end -}}
    {{- $backupRetention = int (optional $backupNativeInfra "retention_days" 7) -}}
    {{- if or (lt $backupRetention 1) (gt $backupRetention 35) -}}
    {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and Azure SQL Managed Instance keeps a database's backups for point-in-time restore 1 to 35 days, which this Recipe sets from it: set infra.retention_days to a number in that range" $backupNative .context.instance_id $backupRetention) -}}
    {{- end -}}
    {{- if eq (toString (optional $backupNativeInfra "point_in_time_recovery" "")) "false" -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and Azure SQL Managed Instance keeps point-in-time restore for every database, across the retention window, with no setting that turns it off: remove infra.point_in_time_recovery from the attachment, or set it to true" $backupNative .context.instance_id) -}}
    {{- end -}}
    {{- end -}}
    {{- $prov := optional (default dict .features).password "provides" dict }}
    {{- if not (and (kindIs "map" $prov) (optional $prov "name" "") (optional $prov "key" "")) }}
    {{- fail (printf "the password slot of %q is filled by an attachment that publishes no module output, and the administrator's password is handed to the managed instance as a reference to one: bind core/random-password to terraform/random-password in the Manifest" .context.instance_id) }}
    {{- end }}
    {{- $o := .infra.overrides }}
    name: "{{ .context.instance_id }}"
    resource_group_name: "{{ $o.resource_group_name }}"
    location: "{{ $o.location }}"
    subnet_id: "{{ $o.delegated_subnet_id }}"
    sku_name: "{{ .locals.sku }}"
    vcores: {{ int (optional $o "vcores" 4) }}
    license_type: "{{ optional $o "license_type" "LicenseIncluded" }}"
    storage_size_in_gb: {{ int (trimSuffix "Gi" (toString .infra.storage.size)) }}
    administrator_login: "{{ .values.user }}"
    administrator_login_password: "{{ printf "${%s.%s}" $prov.name $prov.key }}"
    {{- with optional .values "collation" "" }}
    collation: "{{ . }}"
    {{- end }}
    database_format: "{{ .locals.database_format }}"
    zone_redundant_enabled: {{ if .infra.ha.enabled }}true{{ else }}false{{ end }}
    database_name: "{{ .values.database }}"
    short_term_retention_days: {{ $backupRetention }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The azurerm provider refuses to plan
  # without its features block, and the module carries no provider block of
  # its own, so it inherits this configuration; the provider reads its
  # credentials and subscription from the environment Terraform runs in.
  # Terraform destroys the module's resources with it, so the file stays while
  # any component declaring it does: remove the last of them from a Release
  # only after destroying what their modules created, because with the file
  # gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
