# Content pins for this entity's external inputs, written by `aggrega pin`.
# Commit it beside the entity. Run `aggrega pin` on the entity again to bring it up to date.
version: 1
localSourceDigests:
  - path: module/main.tf
    digest: sha256:ada1a9a8ee9b9421d9eeeee65703e62871745945c85c45718b4f076cfb11d73b
  - path: module/variables.tf
    digest: sha256:93e02329d38464c76c904ad736d8b7e8c23d8417272458c35dd4eefed18f0424
ignore:
  plugin:
    name: provider/terraform
    patterns:
      - .git/
      - .hg/
      - .svn/
      - .bzr/
      - .terraform/
    files:
      - .terraformignore
  rules:
    - pattern: .git/
      within: module
      from: plugin
    - pattern: .hg/
      within: module
      from: plugin
    - pattern: .svn/
      within: module
      from: plugin
    - pattern: .bzr/
      within: module
      from: plugin
    - pattern: .terraform/
      within: module
      from: plugin
