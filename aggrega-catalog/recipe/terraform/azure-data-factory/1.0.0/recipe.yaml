apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-data-factory
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Data Factory module: the third-party code this Recipe pins and writes into
  # the output. The factory it provisions is a service the reader contracts
  # for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Data Factory: one factory, realized by Microsoft's Azure Verified
    Modules module Azure/avm-res-datafactory-factory/azurerm at v0.3.0,
    MIT, its tag's commit pinned in entity.lock, with the global parameters
    values.global_parameters declares, and the pipelines values.pipelines
    declares written beside the module as azurerm_data_factory_pipeline
    resources, which the module does not declare.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-data-factory where it deploys an Azure Resource Manager
    template. The module admits hashicorp/azurerm 4 alone, so this Recipe
    goes in a boundary apart from the Azure Recipes that need azurerm 5.
    infra.overrides names the operator's resource group and region. Public
    network access is on unless infra.overrides.public_network_access_enabled
    is false. The factory takes the user-assigned managed identities
    infra.overrides.identity_ids names, and no system-assigned identity.
    Module telemetry is off unless infra.overrides.enable_telemetry is true.

    Each pipeline is created after the factory's pipelines it runs by name.
    The azurerm provider writes every pipeline parameter and variable as a
    String with a default, and takes no runDimensions, no annotation but
    text and no concurrency above 50, so a definition holding another halts
    naming it, as does a backspace or form feed character in a definition.
    The factory publishes nothing. A component name, an
    infra.overrides key the Recipe does not take, or a value given in a
    form it does not take halts naming it, as does infra.overrides.host.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/bigdata/azure-data-factory:1.0.0

  # The published module, at the tag the registry publishes as version 0.3.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root. The root calls no module, so the
  # configuration Terraform loads from it calls no registry module and
  # initialising it fetches providers and nothing else. The repository's
  # examples/ and tests/ directories are vendored with it and never loaded.
  #
  # The module declares hashicorp/azurerm "~> 4.0" and Azure/azapi "~> 2.12"
  # in its own required_providers, and Terraform ">= 1.9, < 2.0". It creates
  # the factory as azurerm_data_factory.this, with its global parameters,
  # and declares no pipeline. It is vendored byte for byte, so this Recipe
  # adds no provider constraint of its own. "~> 4.0" admits no azurerm 5
  # release, so a Release places this factory in a terraform boundary whose
  # bodies install azurerm 4.
  source:
    kind: git-repository
    url: https://github.com/Azure/terraform-azurerm-avm-res-datafactory-factory.git
    ref: v0.3.0

  # This Recipe reads from infra.overrides:
  #   resource_group_name           - string (resource_group_name), required
  #   location                      - string (location), required
  #   identity_ids                  - []string (managed_identities.user_assigned_resource_ids)
  #   public_network_access_enabled - bool (public_network_enabled; default true)
  #   enable_telemetry              - bool (enable_telemetry; false unless set to true here,
  #                                   where the module's own default is true)
  #   tags                          - map[string]string (tags)
  # host halts by name, as any key not listed does: the factory has no
  # address for it to name.
  #
  # Each is named by the module input it sets, given in brackets, save
  # identity_ids, the key every Azure Recipe reads for the user-assigned
  # managed identities a resource takes, and public_network_access_enabled,
  # the key for a boolean switch of public access. arm/azure-data-factory
  # reads each of them but resource_group_name and enable_telemetry under
  # the same spelling: its template deploys into the group it is deployed
  # to, and is the catalog's own, with no module telemetry.
  # resource_group_name and location are required: they place the factory in
  # the operator's subscription, and this Recipe never chooses either.
  #
  # identity_ids. Each is the resource ID of a user-assigned managed identity
  # the operator created outside the Release. Data Factory uses one through a
  # credential of the factory, created outside the Release and named by a
  # linked service, to reach a store as that identity, under role
  # assignments the operator makes on the store. Microsoft documents that a
  # factory created through the Azure Resource Manager API takes a
  # system-assigned managed identity only when the request asks for one;
  # the module asks for one only when its system_assigned input is true,
  # which this Recipe leaves false, so the factory has no system-assigned
  # identity, and no linked service can authenticate as it. Microsoft also
  # documents that an update naming no identity, made to a factory that
  # holds a system-assigned one, is refused, so a factory given one outside
  # the Release fails its next apply here. Unset, the factory has no
  # managed identity.
  #
  # public_network_access_enabled. Unset or true, the factory takes requests,
  # those of Data Factory Studio and of a self-hosted integration runtime
  # among them, over the internet; false turns that off, and it takes them
  # through private endpoints alone, the operator's, created outside the
  # Release with their private DNS zones.
  #
  # The module deploys a telemetry resource while its enable_telemetry input
  # is true, its default: it reports the module and its version to
  # Microsoft. This Recipe passes false unless the Release sets
  # infra.overrides.enable_telemetry to true.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: no Git configuration, managed virtual network,
  # customer-managed key, Microsoft Purview account, linked service,
  # integration runtime, dataset, credential, private endpoint, role
  # assignment, diagnostic setting or lock. Terraform plans a Git
  # configuration set on the factory outside the Release as a change to undo
  # on the next apply. Activities run on the factory's default Azure
  # integration runtime, AutoResolveIntegrationRuntime, unless a linked
  # service names another.
  #
  # Global parameters. Each entry of values.global_parameters becomes one
  # element of the module's global_parameters input, in the order of the
  # names, which the module writes as a global_parameter block of the
  # factory. The azurerm provider takes each value as text and refuses empty
  # text (internal/services/datafactory/data_factory_resource.go, v4.81.0),
  # so a String value is passed as written, an Int, Float or Bool one as its
  # text, and an Array or Object one as its JSON, as the module's input
  # documents; a value whose text is empty halts below.
  #
  # Pipelines. The module declares none, so the file aggrega-pipelines.tf,
  # written into this component's module directory beside the module's own
  # files, declares one azurerm_data_factory_pipeline for each entry of
  # values.pipelines, named after the entry, in the factory the module
  # creates, azurerm_data_factory.this, and in the azurerm 4 provider the
  # module installs. Each is a resource of its own whose Terraform name is
  # pipeline_ and the first sixteen hexadecimal digits of the SHA-256 of the
  # pipeline's name, so its address follows its name alone, and each is
  # created after each pipeline of this component that one of its activities
  # names in a pipeline reference, so the reference resolves when the
  # pipeline is created; two pipelines naming each other are a cycle, which
  # Terraform refuses. The linked services, datasets, data flows,
  # integration runtimes and credentials a pipeline names are the
  # operator's, created in the factory outside the Release before the
  # pipeline is created, and so are the triggers that start pipelines;
  # nothing here creates one.
  # The resource takes a definition as follows (internal/services/datafactory/
  # data_factory_pipeline_resource.go, v4.81.0): activities as activities_json,
  # their JSON; description, folder.name as folder, and
  # policy.elapsedTimeMetric.duration as moniter_metrics_after_duration, each
  # as text; annotations as a list of text; concurrency as a whole number of
  # 1 to 50; and parameters and variables as maps of text, each entry written
  # as type String with the text as its default value. So a parameter or
  # variable of another type or with no text default, runDimensions, an
  # annotation that is not text, a concurrency above 50, a duration that is
  # not text and an empty folder name halt below, naming the pipeline, where
  # arm/azure-data-factory writes each as given. Every text written into the
  # file reaches Data Factory as written: ${ and %{, which Terraform reads as
  # the start of an interpolation or a directive, are written $${ and %%{.
  # Terraform plans a change made to a pipeline in Data Factory Studio as one
  # to undo, and deletes a pipeline removed from values.pipelines.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation, the
  # module's inputs and the azurerm provider's resources:
  #   honoured — values.pipelines, as the factory's pipelines;
  #     values.global_parameters, as its global parameters; and the overrides
  #     above.
  #   refused — a factory name Azure or the module refuses; a pipeline
  #     definition holding what the azurerm provider cannot write, as above;
  #     a global parameter whose value is empty text; infra.overrides.host;
  #     any infra.overrides key not listed above, and a listed one given in a
  #     form it does not take. A pipeline name or definition, or a global
  #     parameter, outside the shape Data Factory writes is refused by the
  #     Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. Nothing here creates or delivers one: the factory reaches a
  # store with the identity or credential its linked service names, and a
  # caller starting a run authenticates to Azure Resource Manager as its own
  # identity. Backup. The factory holds definitions rather than data, and
  # Terraform writes its pipelines and global parameters on every apply;
  # this Recipe configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the factory is created in, by its name, such as example-rg" "location" "the one Azure region the factory is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its data factory in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "identity_ids" "public_network_access_enabled" "enable_telemetry" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a data factory has no address for it to name: Azure Resource Manager manages the factory, and this Component publishes nothing: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, identity_ids, public_network_access_enabled, enable_telemetry and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (kindIs "bool" $t) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and it is passed to the module as a boolean: set it to true to turn the module's telemetry on, or to false or remove it to keep it off" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the factory's public network access as a boolean: set it to false to turn it off, or to true or remove it to keep it on" $p) -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := get $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
    # The factory is named after the component, and its name is unique across
    # Azure. Microsoft's naming rules for Data Factory give a factory name of
    # 3 to 63 letters, digits and hyphens, beginning and ending with a letter
    # or a digit, each hyphen between two of them, which the azurerm
    # provider's validation of a factory's name and the module's own
    # validation of its name input hold too; it is checked here, where the
    # name is known.
    factory_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$` $n) (ge (len $n) 3) (le (len $n) 63)) -}}
      {{- fail (printf "the component %q names its data factory, and Microsoft's naming rules for Data Factory take a factory name of 3 to 63 letters, digits and hyphens, beginning and ending with a letter or a digit, with no two hyphens together: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # What the azurerm provider's azurerm_data_factory_pipeline cannot write,
    # read in internal/services/datafactory/data_factory_pipeline_resource.go
    # at v4.81.0: it writes each parameter and variable as type String with
    # its text as the default value, and declares no runDimensions argument,
    # annotations as a list of text, concurrency as a whole number of 1 to
    # 50, the duration and the folder as text, the folder not empty.
    pipeline_parameters: >-
      {{- range $name, $def := (default dict .values.pipelines) -}}
      {{- range $p, $spec := (optional $def "parameters" dict) -}}
      {{- if ne $spec.type "String" -}}
      {{- fail (printf "values.pipelines.%s.parameters.%s is of type %s, and the azurerm provider's azurerm_data_factory_pipeline writes every parameter as type String: give the parameter type String in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name $p $spec.type) -}}
      {{- end -}}
      {{- if not (typeIs "string" (optional $spec "defaultValue" nil)) -}}
      {{- fail (printf "values.pipelines.%s.parameters.%s has no text default value, and the azurerm provider's azurerm_data_factory_pipeline writes every parameter with its text as the default value: give it a defaultValue of text in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name $p) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    pipeline_variables: >-
      {{- range $name, $def := (default dict .values.pipelines) -}}
      {{- range $p, $spec := (optional $def "variables" dict) -}}
      {{- if ne $spec.type "String" -}}
      {{- fail (printf "values.pipelines.%s.variables.%s is of type %s, and the azurerm provider's azurerm_data_factory_pipeline writes every variable as type String: give the variable type String in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name $p $spec.type) -}}
      {{- end -}}
      {{- if not (typeIs "string" (optional $spec "defaultValue" nil)) -}}
      {{- fail (printf "values.pipelines.%s.variables.%s has no text default value, and the azurerm provider's azurerm_data_factory_pipeline writes every variable with its text as the default value: give it a defaultValue of text in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name $p) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    pipeline_properties: >-
      {{- range $name, $def := (default dict .values.pipelines) -}}
      {{- if hasKey $def "runDimensions" -}}
      {{- fail (printf "values.pipelines.%s.runDimensions is set, and the azurerm provider's azurerm_data_factory_pipeline takes no run dimensions: remove runDimensions from the pipeline in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name) -}}
      {{- end -}}
      {{- range $a := (optional $def "annotations" list) -}}
      {{- if not (typeIs "string" $a) -}}
      {{- fail (printf "values.pipelines.%s.annotations holds %s, and the azurerm provider's azurerm_data_factory_pipeline takes annotations as a list of text: write each annotation as text in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name (toJson $a)) -}}
      {{- end -}}
      {{- end -}}
      {{- if gt (int (optional $def "concurrency" 1)) 50 -}}
      {{- fail (printf "values.pipelines.%s.concurrency is %v, and the azurerm provider's azurerm_data_factory_pipeline takes a concurrency of 1 to 50: set it to 50 or fewer in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name $def.concurrency) -}}
      {{- end -}}
      {{- $metric := optional (optional $def "policy" dict) "elapsedTimeMetric" dict -}}
      {{- if and (hasKey $metric "duration") (not (typeIs "string" $metric.duration)) -}}
      {{- fail (printf "values.pipelines.%s.policy.elapsedTimeMetric.duration is %s, and the azurerm provider's azurerm_data_factory_pipeline takes it as text, a timespan such as 0.00:10:00: write it so in the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" $name (toJson $metric.duration)) -}}
      {{- end -}}
      {{- if and (hasKey $def "folder") (not (optional $def.folder "name" "")) -}}
      {{- fail (printf "values.pipelines.%s.folder names no folder, and the azurerm provider's azurerm_data_factory_pipeline takes a folder by a name that is not empty: set folder.name in the Aggregate, or remove folder for the root" $name) -}}
      {{- end -}}
      {{- end -}}
    global_parameter_values: >-
      {{- range $name, $spec := (default dict .values.global_parameters) -}}
      {{- if eq (toString $spec.value) "" -}}
      {{- fail (printf "values.global_parameters.%s has an empty value, and the azurerm provider's azurerm_data_factory refuses a global parameter whose value is empty text: give it a value in the Aggregate, or remove it" $name) -}}
      {{- end -}}
      {{- end -}}
    # The JSON this Recipe writes into the Terraform files spells a backspace
    # (U+0008) and a form feed (U+000C) \b and \f, which a quoted string of
    # Terraform's configuration language does not read (it reads \n, \r, \t,
    # \", \\, \uNNNN and \UNNNNNNNN), so tofu validate refuses the file.
    # The check looks for either escape in the JSON of the definitions, after
    # taking out each escaped backslash, which a following b or f does not make
    # an escape.
    control_characters: >-
      {{- $t := replace "\\\\" "" (toJson (dict "pipelines" (default dict .values.pipelines) "global_parameters" (default dict .values.global_parameters))) -}}
      {{- if or (contains "\\b" $t) (contains "\\f" $t) -}}
      {{- fail "values.pipelines or values.global_parameters holds a backspace or form feed character, and the Terraform files this Recipe writes spell it with an escape that Terraform's quoted strings do not read: remove the character from the Aggregate, or realize the factory with arm/azure-data-factory, which writes it as given" -}}
      {{- end -}}

  # The Component publishes nothing.
  provides: {}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # factory is named after the component, as the other managed Recipes name
  # theirs. A global parameter's value is written as its text, an Array or
  # Object one as its JSON; ${ in it is written $${, which Terraform reads as
  # the text ${ rather than an interpolation, and the provider writes %{ as
  # %%{ itself.
  #
  # enable_telemetry is always rendered: false, unless
  # infra.overrides.enable_telemetry is true.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name }}
    location: {{ toJson $o.location }}
    public_network_enabled: {{ if eq (toString (optional $o "public_network_access_enabled" true)) "false" }}false{{ else }}true{{ end }}
    {{- with optional $o "identity_ids" list }}
    managed_identities:
      user_assigned_resource_ids: {{ toJson . }}
    {{- end }}
    {{- $globals := list }}
    {{- range $name, $spec := (default dict .values.global_parameters) }}
    {{- $text := toString $spec.value }}
    {{- if has $spec.type (list "Array" "Object") }}{{ $text = toJson $spec.value }}{{ end }}
    {{- $globals = append $globals (dict "name" $name "type" $spec.type "value" $text) }}
    {{- end }}
    {{- with $globals }}
    global_parameters: {{ toJson . | replace "${" "$${" }}
    {{- end }}
    {{- $t := optional $o "enable_telemetry" false }}
    enable_telemetry: {{ and (kindIs "bool" $t) $t }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written into this component's module directory, beside the module's own
  # files, so each pipeline reads the factory the module declares,
  # azurerm_data_factory.this, and uses the azurerm 4 provider the module
  # installs; an empty values.pipelines writes no file. Every value is
  # written as its JSON, which Terraform reads as the same text, with ${ and
  # %{ written $${ and %%{.
  artifacts:
    aggrega-pipelines.tf: |
      {{- range $name, $def := (default dict .values.pipelines) }}
      {{- $references := lower (toJson $def.activities) }}
      {{- $after := list }}
      {{- range $other, $_ := $.values.pipelines }}
      {{- if and (ne $other $name) (contains (lower (printf "\"referenceName\":%s,\"type\":\"PipelineReference\"" (toJson $other))) $references) }}
      {{- $after = append $after (printf "azurerm_data_factory_pipeline.pipeline_%s" (sha256sum $other | trunc 16)) }}
      {{- end }}
      {{- end }}

      resource "azurerm_data_factory_pipeline" "pipeline_{{ sha256sum $name | trunc 16 }}" {
        name            = {{ toJson $name | replace "${" "$${" | replace "%{" "%%{" }}
        data_factory_id = azurerm_data_factory.this.id
        activities_json = {{ toJson (toJson $def.activities) | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with $def.description }}
        description     = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with $def.parameters }}
        {{- $m := dict }}{{ range $p, $spec := . }}{{ $_ := set $m $p $spec.defaultValue }}{{ end }}
        parameters      = {{ toJson $m | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with $def.variables }}
        {{- $m := dict }}{{ range $p, $spec := . }}{{ $_ := set $m $p $spec.defaultValue }}{{ end }}
        variables       = {{ toJson $m | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with $def.annotations }}
        annotations     = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with $def.concurrency }}
        concurrency     = {{ . }}
        {{- end }}
        {{- with $def.folder }}
        folder          = {{ toJson .name | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with (optional (optional $def "policy" dict) "elapsedTimeMetric" dict).duration }}
        moniter_metrics_after_duration = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with $after }}
        depends_on      = [{{ join ", " . }}]
        {{- end }}
      }
      {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes: another component bound to this Recipe, or
  # one whose Recipe configures azurerm the same way under the same name. The
  # same name with other bytes halts the build. The azurerm provider refuses
  # to plan without its features block, and a vendored module carries no
  # provider block of its own, so the module inherits this configuration; the
  # provider reads its credentials and subscription from the environment
  # Terraform runs in. Terraform destroys the module's resources with it, so
  # the file stays while any component declaring it does: remove the last of
  # them from a Release only after destroying what their modules created,
  # because with the provider file gone Terraform refuses to plan, asking for
  # a provider block with the features argument. The azapi provider the
  # module also declares is left to its default configuration, since no
  # provider block names it; it reads the same environment.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
