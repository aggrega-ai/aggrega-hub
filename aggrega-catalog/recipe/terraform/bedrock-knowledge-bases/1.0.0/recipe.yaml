apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-knowledge-bases
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Bedrock Knowledge Bases, rendered as an authored Terraform body,
    main.tf: one aws_bedrockagent_knowledge_base of type VECTOR named after
    the component, embedding with the model embedding_model_arn names into
    the vector store storage_configuration describes, as the IAM role
    role_arn names. Where bucket_arn names an S3 bucket, an
    aws_bedrockagent_data_source over it, under inclusion_prefixes, is
    created too; its documents reach the store when the operator starts a
    sync. host and endpoint publish the Bedrock agent runtime endpoint in
    the knowledge base's Region, and knowledge_base_id and arn outputs of
    this component's module, which Terraform resolves when it applies.

    The store, the model, the role and the bucket are the operator's: none
    is created, nor any key, policy or index. Tags label the knowledge base.
    A destroy, or removing the component, deletes the data source, with the
    embeddings it wrote into the store, and then the knowledge base; the
    store, its index and the bucket stay.

    A role_arn, embedding_model_arn or storage_configuration missing or of
    another form halts the build, as do an Amazon Neptune Analytics store
    with a bucket, a bucket_arn or inclusion_prefixes of another form, tags
    that are not a map of strings Amazon Bedrock takes, infra.overrides.host,
    since the endpoint answers under the service's name alone, and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/datastore/bedrock-knowledge-bases:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this knowledge base, and
  # resolves none of them. Each is a reference to an output of this
  # component's module call: the body renders into the component's own
  # module directory, and the boundary's root configuration declares that
  # directory as a module block named .context.instance_id for a component
  # declared in the Aggregate the Release deploys. The references resolve
  # only for a consumer authored as a source: Recipe in the same Terraform
  # root configuration, which Terraform then applies after this module; a
  # consumer on another target receives them as text.
  #
  # host is the Bedrock agent runtime endpoint in the knowledge base's
  # Region, bedrock-agent-runtime.<region>. followed by the domain suffix of
  # the partition, such as amazonaws.com: the body composes it in its host
  # output from the Region, the fourth field of the knowledge base's ARN,
  # arn:<partition>:bedrock:<region>:<account>:knowledge-base/<id>, and the
  # dns_suffix of the aws_partition data source, which reads the partition
  # of the AWS provider the root configures. endpoint is the same address
  # after https://, reached on port 443. knowledge_base_id and arn are the
  # knowledge base's ID and ARN.
  #
  # host is the service's own name. The endpoint offers no custom domain, so
  # every name it answers under is one of the service's own and none is the
  # operator's choice; infra.overrides.host is refused by the assertion below
  # rather than published.
  provides:
    host: "${module.{{ .context.instance_id }}.host}"
    port: "443"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
    knowledge_base_id: "${module.{{ .context.instance_id }}.knowledge_base_id}"
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   role_arn              - string, required (role_arn)
  #   embedding_model_arn   - string, required
  #                           (knowledge_base_configuration.vector_knowledge_base_configuration.embedding_model_arn)
  #   storage_configuration - object, required (storage_configuration)
  #   bucket_arn            - string (the data source's data_source_configuration.s3_configuration.bucket_arn;
  #                           unset, no data source)
  #   inclusion_prefixes    - list of one string, with bucket_arn
  #                           (data_source_configuration.s3_configuration.inclusion_prefixes)
  #   tags                  - map[string]string (the knowledge base's tags)
  # host halts by name, as any key not listed does.
  #
  # embedding_model_arn, storage_configuration, bucket_arn and
  # inclusion_prefixes are the AWS provider's own argument names, which is
  # what a reader matches against the provider documentation; role_arn and
  # bucket_arn are also the names the catalog's terraform AWS Recipes read
  # for the IAM role a service assumes and the S3 bucket it reads from or
  # writes to. tags is the key, under the same name, that the catalog's
  # terraform AWS Recipes read for a resource's tags, so a Release names
  # them once whichever Recipe it configures.
  #
  # role_arn names the IAM role Amazon Bedrock assumes for the knowledge
  # base, as the ARN of the role, arn:aws:iam::<account>:role/ followed by
  # its path and name, 2,048 characters at most (CreateKnowledgeBase); the
  # path and the name take what the IAM API Reference's CreateRole gives
  # Path, a slash alone or printable ASCII between slashes, and RoleName, 1
  # to 64 letters, digits and +=,.@_-, and the body writes ${ and %{ inside
  # the ARN as $${ and %%{, which Terraform turns back into the characters
  # written. The role is the operator's, named here and never created. It
  # lets bedrock.amazonaws.com assume it, and allows bedrock:InvokeModel on
  # the embedding model, access to the vector store, and, with a bucket,
  # s3:ListBucket and s3:GetObject on it (the Amazon Bedrock User Guide's
  # "Create a service role for Amazon Bedrock Knowledge Bases"). The AWS
  # provider checks only that the value is an ARN, so a value of another
  # form, or none, halts the build here rather than at apply.
  #
  # embedding_model_arn names the model that turns each chunk into an
  # embedding, as the model's ARN, such as
  # arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0:
  # 20 to 2,048 characters, of the form the Amazon Bedrock API gives. Its
  # embeddings' dimensions are the store's index's, which the operator sets
  # up for that model. A value of another form, or none, halts the build.
  #
  # storage_configuration describes the operator's vector store, as the AWS
  # provider's storage_configuration block takes it: type, one of
  # OPENSEARCH_SERVERLESS, OPENSEARCH_MANAGED_CLUSTER, PINECONE, RDS,
  # REDIS_ENTERPRISE_CLOUD, NEPTUNE_ANALYTICS, S3_VECTORS and MONGO_DB_ATLAS,
  # and the one block of that store's own, such as
  # opensearch_serverless_configuration, holding the fields the Amazon
  # Bedrock API requires of it and no other, each a string of the form the
  # API gives it, and its field_mapping, the names of the fields or columns
  # Amazon Bedrock writes the vectors, the text and its metadata to. An
  # S3_VECTORS store names its index by index_arn, or by vector_bucket_arn
  # and index_name together, never both (the User Guide's "Prerequisites
  # for using a vector store you created for a knowledge base"), and
  # index_arn begins with vector_bucket_arn where both are given. The store,
  # its index and the secret holding a third-party store's credentials are
  # the operator's, set up as that guide describes, and never created. The
  # object is written as nested blocks, each field as it is given.
  #
  # bucket_arn names the S3 bucket holding the documents, as the ARN of the
  # bucket, arn:aws:s3::: followed by its name: the form the Amazon Bedrock
  # API admits, 3 to 63 lowercase letters, digits, periods and hyphens,
  # opening and closing with a letter or a digit. The bucket is the
  # operator's, named here and never created. Set, an aws_bedrockagent_data_source named after the component
  # reads it; unset, the knowledge base is created with no data source. A
  # value of another form halts the build.
  #
  # inclusion_prefixes limits the data source to the objects under one
  # prefix, as a list holding that prefix: the AWS provider and the API take
  # one prefix of 1 to 300 characters. Unset, every object of the bucket is
  # read. It halts the build without bucket_arn, and as a list of more or
  # fewer prefixes, or a prefix of another length.
  #
  # An Amazon Neptune Analytics store with bucket_arn is refused: Amazon
  # Bedrock builds a Neptune Analytics graph during ingestion with a
  # foundation model the data source names for graph construction (the User
  # Guide's "Build a knowledge base with Amazon Neptune Analytics graphs"),
  # and no key here carries that model. A Neptune Analytics store with no
  # bucket is admitted.
  #
  # tags tag the knowledge base, as a map from each tag name to a string, in
  # the form CreateKnowledgeBase takes: a name of 1 to 128 and a value of at
  # most 256 letters, digits, spaces and the characters . _ : / = + @ -. The
  # data source takes no tags.
  #
  # host is refused by name. The knowledge base answers at the Bedrock agent
  # runtime endpoint of its Region, which offers no custom domain, so no
  # name of the operator's can stand for it.
  #
  # kms_key_id is not read, and halts as any key not listed does: the body
  # writes no server_side_encryption_configuration on the data source, so
  # Amazon Bedrock encrypts the data it holds while ingesting with a key AWS
  # owns, and the store keeps the embeddings under its own encryption.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the overrides above.
  #   refused — a role_arn, embedding_model_arn or storage_configuration not
  #     set or of another form; a store type the API does not name, a block
  #     of another store, a field the store does not take or one it requires
  #     left out, a field of another form, an S3 Vectors index named both
  #     ways or neither; a Neptune Analytics store with bucket_arn; a
  #     bucket_arn of another form; inclusion_prefixes without bucket_arn, of
  #     another count or of another length; tags that are not a map of
  #     strings, or of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the
  #     knowledge base and the data source.
  #   not read — none; the Component declares no value and no other infra
  #     key.
  #
  # What the body writes beside the name, the role, the model, the store and
  # the tags: knowledge_base_configuration type VECTOR, a knowledge base over
  # a store of the operator's; no description; no
  # embedding_model_configuration, so the model's own default dimensions and
  # float32 embeddings hold, which the store's index takes; no
  # supplemental_data_storage_configuration, so no images are extracted from
  # the documents. On the data source: type S3, the bucket and the prefix;
  # data_deletion_policy DELETE, written so that removing the data source
  # removes the embeddings it wrote into the store (CreateDataSource); no
  # vector_ingestion_configuration, so Amazon Bedrock's default chunking and
  # parsing hold; no bucket_owner_account_id, which names the owner of a
  # bucket in another account. These are the settings the cloudformation Recipe of
  # this Component writes, so both targets create the same knowledge base.
  # The Region is the one the root configures for the AWS provider.
  #
  # Changes. role_arn, tags, bucket_arn and inclusion_prefixes change in
  # place. The AWS provider replaces the knowledge base when
  # embedding_model_arn or storage_configuration changes: Terraform deletes
  # the knowledge base and creates a new one under the same name, with a new
  # ID. The provider plans a changed knowledge_base_id on a data source as
  # an update in place, while UpdateDataSource addresses a data source
  # within the knowledge base it belongs to and cannot move it to another,
  # so the data source names the knowledge base's ID in
  # replace_triggered_by: Terraform deletes it before the old knowledge base
  # and creates a new one after the new knowledge base, empty until the
  # operator syncs it. Renaming the component renames the module,
  # so Terraform deletes the old knowledge base and creates a new one under
  # the new name, unordered.
  #
  # Deletion. A destroy, or removing the component, deletes the data source
  # first, as it names the knowledge base; under data_deletion_policy DELETE
  # Amazon Bedrock removes the embeddings it wrote from the store, and a
  # store it cannot reach leaves the data source in DELETE_UNSUCCESSFUL,
  # which fails the apply (the User Guide's "Delete a data source from your
  # Amazon Bedrock knowledge base"). The store, its index and the bucket are
  # the operator's and stay.
  #
  # Backup. A knowledge base keeps no documents or embeddings of its own:
  # the embeddings are the store's and the documents the bucket's, so this
  # Recipe configures no backup and declares no native backup.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "role_arn" "embedding_model_arn" "storage_configuration" "bucket_arn" "inclusion_prefixes" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Bedrock knowledge base answers at the Bedrock agent runtime endpoint of its Region, which offers no custom domain, so every name it answers under is one of the service's own: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads role_arn, embedding_model_arn, storage_configuration, bucket_arn, inclusion_prefixes and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The AWS provider requires a role, and a knowledge base of type VECTOR
    # an embedding model and a store, and none has a value this Recipe could
    # choose for the operator. The cloudformation Recipe of this Component
    # holds the same rule on RoleArn, EmbeddingModelArn and
    # StorageConfiguration: each target reads the keys under its own
    # spelling, so the rule cannot sit in the Component.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "role_arn") -}}
      {{- fail "infra.overrides.role_arn is not set, and an Amazon Bedrock knowledge base works as the IAM role the operator names by its ARN: set infra.overrides.role_arn in the Release, such as arn:aws:iam::123456789012:role/example-knowledge-base-role" -}}
      {{- end -}}
      {{- if not (hasKey $o "embedding_model_arn") -}}
      {{- fail "infra.overrides.embedding_model_arn is not set, and an Amazon Bedrock knowledge base over a vector store embeds its documents with the model the operator names by its ARN: set infra.overrides.embedding_model_arn in the Release, such as arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0" -}}
      {{- end -}}
      {{- if not (hasKey $o "storage_configuration") -}}
      {{- fail "infra.overrides.storage_configuration is not set, and an Amazon Bedrock knowledge base writes its embeddings to the operator's vector store, which it describes: set infra.overrides.storage_configuration in the Release to the store's type and its configuration" -}}
      {{- end -}}
    # Each override is passed to the resource as written, so one of another
    # shape would render an argument the AWS provider or Amazon Bedrock
    # refuses. role_arn takes the role ARN form, embedding_model_arn the
    # model ARN form the Amazon Bedrock API gives, bucket_arn the bucket ARN
    # form it gives bucketArn, inclusion_prefixes, with a bucket alone, one
    # prefix of 1 to 300 characters, and tags the map of strings the
    # provider types them as, in the form CreateKnowledgeBase takes. The
    # cloudformation Recipe of this Component holds the same rules but the
    # tags one on its own spellings, for the reason given above.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "role_arn" -}}
      {{- if not (and (typeIs "string" $o.role_arn) (le (len $o.role_arn) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/([\x21-\x7E]+/)?[\w+=,.@-]{1,64}$` $o.role_arn)) -}}
      {{- fail (printf "infra.overrides.role_arn is %s, and Amazon Bedrock takes the IAM role a knowledge base works as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 2,048 characters at most: set it to such an ARN in the Release" (toJson $o.role_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "embedding_model_arn" -}}
      {{- $m := get $o "embedding_model_arn" -}}
      {{- if not (and (typeIs "string" $m) (ge (len $m) 20) (le (len $m) 2048) (regexMatch `^arn:aws(-[^:]+)?:[a-z0-9-]+:[a-z0-9-]{1,20}:[0-9]{0,12}:[a-zA-Z0-9:/._+-]+$` $m)) -}}
      {{- fail (printf "infra.overrides.embedding_model_arn is %s, and Amazon Bedrock takes the embedding model as the model's ARN, such as arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0, 20 to 2,048 characters: set it to such an ARN in the Release" (toJson $m)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "bucket_arn" -}}
      {{- if not (and (typeIs "string" $o.bucket_arn) (regexMatch `^arn:aws(-cn|-us-gov|-eusc|-iso(-[b-f])?)?:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$` $o.bucket_arn)) -}}
      {{- fail (printf "infra.overrides.bucket_arn is %s, and an Amazon Bedrock data source takes the S3 bucket it reads as the bucket's ARN, arn:aws:s3::: followed by the bucket's name of 3 to 63 lowercase letters, digits, periods and hyphens: set it to such an ARN in the Release" (toJson $o.bucket_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "inclusion_prefixes" -}}
      {{- $p := get $o "inclusion_prefixes" -}}
      {{- if not (hasKey $o "bucket_arn") -}}
      {{- fail "infra.overrides.inclusion_prefixes is set without infra.overrides.bucket_arn, and the prefix limits the data source over the bucket bucket_arn names, which is created only with it: set infra.overrides.bucket_arn in the Release, or remove infra.overrides.inclusion_prefixes" -}}
      {{- end -}}
      {{- if not (and (kindIs "slice" $p) (eq (len $p) 1)) -}}
      {{- fail (printf "infra.overrides.inclusion_prefixes is %s, and an Amazon Bedrock data source takes one prefix, as a list holding it: set it to a list of one prefix in the Release, or remove it to read the whole bucket" (toJson $p)) -}}
      {{- end -}}
      {{- $first := index $p 0 -}}
      {{- if not (and (typeIs "string" $first) (ge (len $first) 1) (le (len $first) 300)) -}}
      {{- fail (printf "infra.overrides.inclusion_prefixes holds %s, and an Amazon Bedrock data source takes a prefix of 1 to 300 characters: correct it in the Release" (toJson $first)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the knowledge base takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- range $k, $v := $g -}}
      {{- if not (and (regexMatch `^[a-zA-Z0-9\s._:/=+@-]{1,128}$` $k) (regexMatch `^[a-zA-Z0-9\s._:/=+@-]{0,256}$` $v)) -}}
      {{- fail (printf "infra.overrides.tags holds %s: %s, and Amazon Bedrock takes a tag name of 1 to 128 and a value of at most 256 letters, digits, spaces and the characters . _ : / = + @ -: correct it in the Release" (toJson $k) (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # The vector store, held to what the Amazon Bedrock API describes, so that
    # a configuration it refuses halts here rather than at apply. $stores
    # gives, for each store type, the block describing it, its required and
    # optional fields, and its field_mapping's required and optional fields;
    # $forms the form of each field the API constrains beyond a line of at
    # most 2,048 characters, with its length limit, 0 where the API sets none.
    # The cloudformation Recipe of this Component holds the same rules on
    # CloudFormation's spellings, for the reason given above, without
    # REDIS_ENTERPRISE_CLOUD, which the CloudFormation resource type does not
    # describe.
    storage_configuration: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "storage_configuration" -}}
      {{- $s := get $o "storage_configuration" -}}
      {{- $stores := dict
        "OPENSEARCH_SERVERLESS" (list "opensearch_serverless_configuration" (list "collection_arn" "field_mapping" "vector_index_name") (list) (list "metadata_field" "text_field" "vector_field") (list))
        "OPENSEARCH_MANAGED_CLUSTER" (list "opensearch_managed_cluster_configuration" (list "domain_arn" "domain_endpoint" "field_mapping" "vector_index_name") (list) (list "metadata_field" "text_field" "vector_field") (list))
        "PINECONE" (list "pinecone_configuration" (list "connection_string" "credentials_secret_arn" "field_mapping") (list "namespace") (list "metadata_field" "text_field") (list))
        "RDS" (list "rds_configuration" (list "credentials_secret_arn" "database_name" "field_mapping" "resource_arn" "table_name") (list) (list "metadata_field" "primary_key_field" "text_field" "vector_field") (list "custom_metadata_field"))
        "REDIS_ENTERPRISE_CLOUD" (list "redis_enterprise_cloud_configuration" (list "credentials_secret_arn" "endpoint" "field_mapping" "vector_index_name") (list) (list "metadata_field" "text_field" "vector_field") (list))
        "NEPTUNE_ANALYTICS" (list "neptune_analytics_configuration" (list "field_mapping" "graph_arn") (list) (list "metadata_field" "text_field") (list))
        "S3_VECTORS" (list "s3_vectors_configuration" (list) (list "index_arn" "index_name" "vector_bucket_arn") (list) (list))
        "MONGO_DB_ATLAS" (list "mongo_db_atlas_configuration" (list "collection_name" "credentials_secret_arn" "database_name" "endpoint" "field_mapping" "vector_index_name") (list "endpoint_service_name" "text_index_name") (list "metadata_field" "text_field" "vector_field") (list)) -}}
      {{- $secret := list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):secretsmanager:[a-z0-9-]{1,20}:([0-9]{12}|):secret:[a-zA-Z0-9!/_+=.@-]{1,512}$` 0 "the ARN of an AWS Secrets Manager secret, arn:aws:secretsmanager:<region>:<account>:secret:<name>" -}}
      {{- $column := list `^[a-zA-Z0-9_\-]+$` 63 "a column name of 1 to 63 letters, digits, underscores and hyphens" -}}
      {{- $forms := dict
        "opensearch_serverless_configuration.collection_arn" (list `^arn:(?:aws(|-cn|-us-gov|-iso)|aws[a-z\-]*):aoss:[a-z]{2}(-gov)?-[a-z]+-\d{1}:\d{12}:collection/[a-z0-9-]{3,32}$` 2048 "the ARN of an OpenSearch Serverless collection, arn:aws:aoss:<region>:<account>:collection/<id>")
        "opensearch_managed_cluster_configuration.domain_arn" (list `^arn:aws(-cn|-us-gov|-eusc|-iso(-[b-f])?)?:es:([a-z]{2,}-){2,}\d:\d{12}:domain/[a-z][a-z0-9-]{3,28}$` 2048 "the ARN of an OpenSearch Service domain, arn:aws:es:<region>:<account>:domain/<name>")
        "opensearch_managed_cluster_configuration.domain_endpoint" (list `^https://.*$` 2048 "the domain's endpoint, https:// followed by its name")
        "opensearch_managed_cluster_configuration.vector_index_name" (list `^[a-z0-9][a-z0-9_.-]*$` 2048 "an index name of lowercase letters, digits, underscores, periods and hyphens, opening with a letter or a digit")
        "pinecone_configuration.credentials_secret_arn" $secret
        "rds_configuration.credentials_secret_arn" $secret
        "rds_configuration.database_name" (list `^[a-zA-Z0-9_\-]+$` 63 "a database name of 1 to 63 letters, digits, underscores and hyphens")
        "rds_configuration.resource_arn" (list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):rds:[a-zA-Z0-9-]*:[0-9]{12}:cluster:[a-zA-Z0-9-]{1,63}$` 0 "the ARN of an Amazon Aurora DB cluster, arn:aws:rds:<region>:<account>:cluster:<name>")
        "rds_configuration.table_name" (list `^[a-zA-Z0-9_.\-]+$` 63 "a table name of 1 to 63 letters, digits, underscores, periods and hyphens")
        "rds_configuration.field_mapping.custom_metadata_field" $column
        "rds_configuration.field_mapping.metadata_field" $column
        "rds_configuration.field_mapping.primary_key_field" $column
        "rds_configuration.field_mapping.text_field" $column
        "rds_configuration.field_mapping.vector_field" $column
        "redis_enterprise_cloud_configuration.credentials_secret_arn" $secret
        "neptune_analytics_configuration.graph_arn" (list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):neptune-graph:[a-zA-Z0-9-]*:[0-9]{12}:graph/g-[a-zA-Z0-9]{10}$` 255 "the ARN of a Neptune Analytics graph, arn:aws:neptune-graph:<region>:<account>:graph/g- followed by ten letters and digits")
        "s3_vectors_configuration.index_arn" (list `^.*$` 0 "the ARN of an S3 vector index, on one line")
        "s3_vectors_configuration.index_name" (list `^.{3,63}$` 63 "an index name of 3 to 63 characters")
        "s3_vectors_configuration.vector_bucket_arn" (list `^.*$` 0 "the ARN of an S3 vector bucket, on one line")
        "mongo_db_atlas_configuration.collection_name" (list `^.*$` 63 "a collection name of at most 63 characters, on one line")
        "mongo_db_atlas_configuration.credentials_secret_arn" $secret
        "mongo_db_atlas_configuration.database_name" (list `^.*$` 63 "a database name of at most 63 characters, on one line")
        "mongo_db_atlas_configuration.endpoint" (list `^[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.mongodb\.net$` 2048 "a MongoDB Atlas cluster's host name, <cluster>.<id>.mongodb.net")
        "mongo_db_atlas_configuration.endpoint_service_name" (list `^(?:arn:(?:aws(?:-us-gov|-cn|-iso|-iso-[a-z])*|aws[a-z\-]*):.+:.*:\d+:.+/.+$|[a-zA-Z0-9*]+[a-zA-Z0-9._-]*)$` 255 "a VPC endpoint service's name or ARN") -}}
      {{- if not (and (kindIs "map" $s) (hasKey $stores (toString (get $s "type")))) -}}
      {{- fail (printf "infra.overrides.storage_configuration is %s, and Amazon Bedrock takes the operator's vector store as an object whose type is OPENSEARCH_SERVERLESS, OPENSEARCH_MANAGED_CLUSTER, PINECONE, RDS, REDIS_ENTERPRISE_CLOUD, NEPTUNE_ANALYTICS, S3_VECTORS or MONGO_DB_ATLAS, beside that store's configuration: correct it in the Release" (toJson $s)) -}}
      {{- end -}}
      {{- $store := get $stores (toString (get $s "type")) -}}
      {{- $ck := index $store 0 -}}
      {{- $others := list -}}
      {{- range $k, $_ := $s }}{{ if not (has $k (list "type" $ck)) }}{{ $others = append $others $k }}{{ end }}{{ end -}}
      {{- if or $others (not (kindIs "map" (get $s $ck))) -}}
      {{- fail (printf "infra.overrides.storage_configuration is %s, and a store of type %s is described by an object under %s and nothing else beside type: correct it in the Release" (toJson $s) (get $s "type") $ck) -}}
      {{- end -}}
      {{- $c := get $s $ck -}}
      {{- $objects := list (list $ck $c (index $store 1) (index $store 2)) -}}
      {{- if index $store 3 }}{{ $objects = append $objects (list (printf "%s.field_mapping" $ck) (get $c "field_mapping") (index $store 3) (index $store 4)) }}{{ end -}}
      {{- range $obj := $objects -}}
      {{- $path := index $obj 0 -}}{{- $v := index $obj 1 -}}{{- $req := index $obj 2 -}}{{- $opt := index $obj 3 -}}
      {{- $ok := kindIs "map" $v -}}
      {{- if $ok }}{{ range $f := $req }}{{ if not (hasKey $v $f) }}{{ $ok = false }}{{ end }}{{ end }}{{ range $f, $_ := $v }}{{ if not (or (has $f $req) (has $f $opt)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.storage_configuration.%s is %s, and the Amazon Bedrock API describes it with the fields %s%s, and no other: correct it in the Release" $path (toJson $v) (join ", " $req) (ternary (printf ", and optionally %s" (join ", " $opt)) "" (gt (len $opt) 0))) -}}
      {{- end -}}
      {{- range $f, $fv := $v -}}
      {{- if ne $f "field_mapping" -}}
      {{- $form := get $forms (printf "%s.%s" $path $f) | default (list `^.*$` 2048 "a line of text of at most 2,048 characters") -}}
      {{- $max := index $form 1 -}}
      {{- if not (and (typeIs "string" $fv) (regexMatch (index $form 0) $fv) (or (eq $max 0) (le (len $fv) $max))) -}}
      {{- fail (printf "infra.overrides.storage_configuration.%s.%s is %s, and the Amazon Bedrock API takes it as %s: correct it in the Release" $path $f (toJson $fv) (index $form 2)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if eq $ck "s3_vectors_configuration" -}}
      {{- $byArn := and (hasKey $c "index_arn") (not (hasKey $c "index_name")) (or (not (hasKey $c "vector_bucket_arn")) (hasPrefix (toString (get $c "vector_bucket_arn")) (toString (get $c "index_arn")))) -}}
      {{- $byName := and (hasKey $c "vector_bucket_arn") (hasKey $c "index_name") (not (hasKey $c "index_arn")) -}}
      {{- if not (or $byArn $byName) -}}
      {{- fail (printf "infra.overrides.storage_configuration.s3_vectors_configuration is %s, and Amazon Bedrock takes an S3 vector index by index_arn alone, beginning with vector_bucket_arn where that is also given, or by vector_bucket_arn and index_name together, never by both: correct it in the Release" (toJson $c)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (eq $ck "neptune_analytics_configuration") (hasKey $o "bucket_arn") -}}
      {{- fail "infra.overrides.bucket_arn is set with an Amazon Neptune Analytics store, and Amazon Bedrock builds that store's graph during ingestion with a foundation model the data source names for graph construction, which this Recipe does not configure: remove infra.overrides.bucket_arn from the Release and connect the data source in Amazon Bedrock, or use another store" -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Amazon Bedrock Knowledge Bases module. The resources are named this,
  # since each component's body renders into a module directory of its own.
  # The overrides reach it as the assertions above hold them; the store's
  # configuration is written as the provider's nested blocks, each field
  # inside its block. Each string the Release gives reaches Amazon Bedrock as
  # written: Terraform would read ${ and %{ inside a string as the start of
  # an interpolation or a directive, so they are written $${ and %%{, which
  # Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := $o.storage_configuration -}}
      {{- $ck := "" -}}
      {{- range $k, $_ := $s }}{{ if ne $k "type" }}{{ $ck = $k }}{{ end }}{{ end -}}
      {{- $c := get $s $ck -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_bedrockagent_knowledge_base" "this" {
        name = "{{ .context.instance_id }}"

        knowledge_base_configuration {
          type = "VECTOR"
          vector_knowledge_base_configuration {
            embedding_model_arn = {{ toJson $o.embedding_model_arn }}
          }
        }

        ## ── Provider-specific overrides ──────────────────────────
        role_arn = {{ toJson $o.role_arn | replace "${" "$${" | replace "%{" "%%{" }}

        storage_configuration {
          type = "{{ $s.type }}"
          {{ $ck }} {
            {{- range $f, $v := $c }}{{ if ne $f "field_mapping" }}
            {{ $f }} = {{ toJson $v | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}{{ end }}
            {{- with get $c "field_mapping" }}
            field_mapping {
              {{- range $f, $v := . }}
              {{ $f }} = {{ toJson $v | replace "${" "$${" | replace "%{" "%%{" }}
              {{- end }}
            }
            {{- end }}
          }
        }
        {{- with optional $o "tags" "" }}

        tags = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }
      {{- with optional $o "bucket_arn" "" }}

      resource "aws_bedrockagent_data_source" "this" {
        name                 = "{{ $.context.instance_id }}"
        knowledge_base_id    = aws_bedrockagent_knowledge_base.this.id
        data_deletion_policy = "DELETE"

        data_source_configuration {
          type = "S3"
          s3_configuration {
            bucket_arn = {{ toJson . }}
            {{- with optional $o "inclusion_prefixes" "" }}
            inclusion_prefixes = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
            {{- end }}
          }
        }

        # A data source belongs to one knowledge base, so a replaced
        # knowledge base takes a new data source.
        lifecycle {
          replace_triggered_by = [aws_bedrockagent_knowledge_base.this.id]
        }
      }
      {{- end }}

      data "aws_partition" "current" {}

      output "host" {
        value = "bedrock-agent-runtime.${split(":", aws_bedrockagent_knowledge_base.this.arn)[3]}.${data.aws_partition.current.dns_suffix}"
      }

      output "endpoint" {
        value = "https://bedrock-agent-runtime.${split(":", aws_bedrockagent_knowledge_base.this.arn)[3]}.${data.aws_partition.current.dns_suffix}"
      }

      output "knowledge_base_id" {
        value = aws_bedrockagent_knowledge_base.this.id
      }

      output "arn" {
        value = aws_bedrockagent_knowledge_base.this.arn
      }
