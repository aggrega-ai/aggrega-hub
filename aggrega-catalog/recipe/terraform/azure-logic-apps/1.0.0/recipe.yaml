apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-logic-apps
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Logic Apps workflow module: the third-party code this Recipe pins and
  # writes into the output. The workflow it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Logic Apps: one Consumption workflow running the definition
    values.definition declares, realized by Microsoft's Azure Verified
    Modules module Azure/avm-res-logic-workflow/azurerm at v0.2.0, MIT,
    pinned by commit and archive digest in entity.lock, which creates the
    workflow through the Azure/azapi provider.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-logic-apps where it deploys an Azure Resource Manager
    template. The module admits hashicorp/azurerm 4 alone, so this Recipe
    goes in a boundary apart from the Azure Recipes that need azurerm 5.
    infra.overrides names the operator's resource group and region. The
    workflow is enabled and takes the user-assigned managed identities
    infra.overrides.identity_ids names. Module telemetry is off unless
    infra.overrides.enable_telemetry is true.

    The definition is passed whole, every string reaching Logic Apps as
    written; one naming no $schema or contentVersion takes the service's
    own. A backspace or form feed character in it halts, since the
    Terraform files cannot spell it. Terraform plans a change made in the
    designer as one to undo.

    The workflow publishes nothing. A component name, an infra.overrides
    key the Recipe does not take, or a value given in a form it does not
    take halts naming it, as does infra.overrides.host.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-pipeline/azure-logic-apps:1.0.0

  # The published module, at the tag the registry publishes as version 0.2.0.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The source names the repository root. The root calls no module, so the
  # configuration Terraform loads from it calls no registry module and
  # initialising it fetches providers and nothing else. The repository's
  # examples/, modules/ and tests/ directories are vendored with it and never
  # loaded.
  #
  # The module declares hashicorp/azurerm "~> 4.0, >= 4.8.0, >= 4.21.1,
  # < 5.0.0" and Azure/azapi "~> 2.12" in its own required_providers, and
  # Terraform ">= 1.9, < 2.0". It creates the workflow as an azapi_resource of
  # type Microsoft.Logic/workflows at API version 2019-05-01, a Consumption
  # workflow in multitenant Azure Logic Apps, taking the definition whole,
  # where azurerm's own workflow resource takes no definition. It is vendored
  # byte for byte, so this Recipe adds no provider constraint of its own.
  # "< 5.0.0" admits no azurerm 5 release, so a Release places this workflow
  # in a terraform boundary whose bodies install azurerm 4.
  source:
    kind: git-repository
    url: https://github.com/Azure/terraform-azurerm-avm-res-logic-workflow.git
    ref: v0.2.0

  # This Recipe reads from infra.overrides:
  #   resource_group_name - string (resource_group_name, which the module requires and
  #                         never reads, and resource_group_id, the group's resource ID,
  #                         composed at apply time from the subscription Terraform runs
  #                         against), required
  #   location            - string (location), required
  #   identity_ids        - []string (managed_identities.user_assigned_resource_ids)
  #   enable_telemetry    - bool (enable_telemetry; false unless set to true here, where the
  #                         module's own default is true)
  #   tags                - map[string]string (tags)
  # host halts by name, as any key not listed does: the workflow publishes no
  # address for it to name.
  #
  # Each is named by the module input it sets, given in brackets, save
  # identity_ids, the key every Azure Recipe reads for the user-assigned
  # managed identities a resource takes. arm/azure-logic-apps reads each of
  # them but resource_group_name under the same spelling, and refuses
  # enable_telemetry true: its template deploys into the group it is
  # deployed to, and every arm Recipe wrapping a Verified Module turns the
  # module's telemetry off. resource_group_name and location are required:
  # they place the workflow in the operator's subscription, and this Recipe
  # never chooses either.
  #
  # resource_group_name. The module creates the workflow in the resource
  # group named by its resource ID. The boundary's root configuration
  # declares the azurerm_client_config data source in client-config.tf, and
  # resource_group_id is
  # /subscriptions/<its subscription_id>/resourceGroups/<resource_group_name>,
  # so the group is the one of that name in the subscription Terraform runs
  # against, as for every other azurerm Recipe; Terraform reads the
  # subscription when it plans, and the build reads none. Azure's naming
  # rules take a resource group name of 1 to 90 letters, digits,
  # underscores, hyphens, periods and parentheses, not ending in a period,
  # which is checked below, since the name is written into that ID.
  #
  # identity_ids. Each is the resource ID of a user-assigned managed identity
  # the operator created outside the Release, under role assignments the
  # operator makes on each service the workflow calls. Microsoft documents
  # that a Consumption workflow may have several user-assigned identities and
  # uses one at a time, each trigger or action naming the identity it
  # authenticates as. The module asks for a system-assigned identity only
  # when its system_assigned input is true, which this Recipe leaves false,
  # so the workflow has none. Unset, the workflow has no managed identity.
  #
  # The module deploys a telemetry resource while its enable_telemetry input
  # is true, its default: it reports the module and its version to
  # Microsoft. This Recipe passes false unless the Release sets
  # infra.overrides.enable_telemetry to true.
  #
  # The module's own defaults stand for every input this mapping leaves out.
  # These are worth knowing: the workflow's state is Enabled, so its triggers
  # fire once Terraform applies; no access control, so a Request trigger
  # takes a call bearing its callback URL from any address; no integration
  # account, integration service environment or endpoints configuration; no
  # values for the definition's parameters, so each takes its default value;
  # and no customer-managed key, role assignment, diagnostic setting or lock.
  #
  # Definition. values.definition is the module's logic_app_definition, the
  # workflow's definition object, written whole: the developer's sections
  # over the module's own default definition, so one naming no $schema takes
  # the one schema version the Component admits, one naming no
  # contentVersion takes 1.0.0.0, the service's default, and triggers,
  # actions, outputs and parameters left out are empty maps. The API
  # connections a managed connector's action names, created outside the
  # Release, are the operator's; nothing here creates one, and the
  # workflow's parameter values, the resource's parameters property where
  # connection details are passed as $connections, are not set, so each
  # parameter of the definition, $connections included, takes the default
  # value the definition gives it. Every string of the definition reaches
  # Logic Apps as written: ${, which Terraform reads as the start of an
  # interpolation, is written $${, and the provider writes %{ as %%{. The
  # Terraform files spell a backspace or a form feed with an escape that a
  # quoted string of Terraform's configuration language does not read, so a
  # definition holding one halts below. Terraform plans a change made to the
  # workflow in the designer or code view as one to undo on the next apply.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's inputs:
  #   honoured — values.definition, as the workflow's definition, and the
  #     overrides above.
  #   refused — a workflow name Logic Apps refuses; a definition holding a
  #     backspace or form feed character; a resource group name Azure
  #     refuses; infra.overrides.host; any infra.overrides key not listed
  #     above, and a listed one given in a form it does not take. A
  #     definition outside the shape the Workflow Definition Language
  #     documents is refused by the Component's own schema before this
  #     Recipe renders.
  #   not read — none.
  #
  # Credentials. Nothing here creates or delivers one. A Request trigger's
  # callback URL carries a shared access signature the service generates,
  # which the operator reads from the workflow, through Azure Resource
  # Manager's List Callback Url operation or the Azure portal, and delivers
  # to a caller outside the Release; it is never written into the Terraform
  # files or their outputs. The workflow calls other services as a managed
  # identity named above, or through an API connection or the
  # authentication an action's definition names. Backup. The workflow holds
  # its definition, which Terraform writes on every apply; this Recipe
  # configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out; a resource group name
    # is held to Azure's naming rules, since it is written into the group's
    # resource ID.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the workflow is created in, by its name, such as example-rg" "location" "the one Azure region the workflow is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its logic app workflow in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `^[\p{L}\p{Nd}_.()-]{0,89}[\p{L}\p{Nd}_()-]$` $o.resource_group_name) -}}
      {{- fail (printf "infra.overrides.resource_group_name is %q, and Azure takes a resource group name of 1 to 90 letters, digits, underscores, hyphens, periods and parentheses, not ending in a period: set it to the name of the operator's resource group" $o.resource_group_name) -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "identity_ids" "enable_telemetry" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a logic app workflow publishes no address for it to name: a caller starts a run through a Request trigger's callback URL, a credential the operator delivers outside the Release, or through Azure Resource Manager: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, identity_ids, enable_telemetry and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (kindIs "bool" $t) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and it is passed to the module as a boolean: set it to true to turn the module's telemetry on, or to false or remove it to keep it off" $t) -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := get $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
    # The workflow is named after the component. Microsoft's limits reference
    # for Logic Apps gives a Consumption workflow's name at most 80
    # characters, and the workflow resource takes letters, digits, hyphens,
    # underscores, periods and parentheses, as the azurerm provider's
    # workflow resource checks; the module passes the name as given, so it is
    # checked here, where the name is known.
    workflow_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[-()_.A-Za-z0-9]{1,80}$` $n) -}}
      {{- fail (printf "the component %q names its logic app workflow, and Logic Apps takes a Consumption workflow's name of at most 80 letters, digits, hyphens, underscores, periods and parentheses: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The JSON this Recipe writes into the Terraform files spells a backspace
    # (U+0008) and a form feed (U+000C) \b and \f, which a quoted string of
    # Terraform's configuration language does not read (it reads \n, \r, \t,
    # \", \\, \uNNNN and \UNNNNNNNN), so tofu validate refuses the file.
    # The check looks for either escape in the JSON of the definition, after
    # taking out each escaped backslash, which a following b or f does not
    # make an escape.
    control_characters: >-
      {{- $t := replace "\\\\" "" (toJson (default dict .values.definition)) -}}
      {{- if or (contains "\\b" $t) (contains "\\f" $t) -}}
      {{- fail "values.definition holds a backspace or form feed character, and the Terraform files this Recipe writes spell it with an escape that Terraform's quoted strings do not read: remove the character from the Aggregate, or realize the workflow with arm/azure-logic-apps, which writes it as given" -}}
      {{- end -}}

  # The Component publishes nothing.
  provides: {}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # workflow is named after the component, as the other managed Recipes name
  # theirs. resource_group_id is the resource group's ID, composed at apply
  # time as the comment above the assertions says. The definition is the
  # module's default definition with the developer's sections written over
  # it, as its JSON, with ${ written $${, which Terraform reads as the text
  # ${ rather than an interpolation; the provider writes %{ as %%{ itself.
  #
  # enable_telemetry is always rendered: false, unless
  # infra.overrides.enable_telemetry is true.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    {{- $d := dict "$schema" "https://schema.management.azure.com/providers/Microsoft.Logic/schemas/2016-06-01/workflowdefinition.json#" "contentVersion" "1.0.0.0" "triggers" dict "actions" dict "outputs" dict "parameters" dict }}
    {{- range $k, $v := (default dict .values.definition) }}{{ $_ := set $d $k $v }}{{ end }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name }}
    resource_group_id: "/subscriptions/${data.azurerm_client_config.current.subscription_id}/resourceGroups/{{ $o.resource_group_name }}"
    location: {{ toJson $o.location }}
    logic_app_definition: {{ toJson $d | replace "${" "$${" }}
    {{- with optional $o "identity_ids" list }}
    managed_identities:
      user_assigned_resource_ids: {{ toJson . }}
    {{- end }}
    {{- $t := optional $o "enable_telemetry" false }}
    enable_telemetry: {{ and (kindIs "bool" $t) $t }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes: another component bound to this Recipe, or
  # one whose Recipe configures azurerm the same way under the same name, or
  # reads the same data source. The same name with other bytes halts the
  # build. The azurerm provider refuses to plan without its features block,
  # and a vendored module carries no provider block of its own, so the module
  # inherits this configuration; the provider reads its credentials and
  # subscription from the environment Terraform runs in, and the
  # azurerm_client_config data source reads that subscription back for
  # resource_group_id. Terraform destroys the module's resources with it, so
  # the files stay while any component declaring them does: remove the last
  # of them from a Release only after destroying what their modules created,
  # because with the provider file gone Terraform refuses to plan, asking for
  # a provider block with the features argument. The azapi provider, which
  # creates the workflow, is left to its default configuration, since no
  # provider block names it; it reads the same environment.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
      client-config.tf: |
        data "azurerm_client_config" "current" {}
