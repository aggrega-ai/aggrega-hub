apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: google-cloud-pub-sub
  version: 1.0.0
  # The licence of the vendored module, the terraform-google-modules project's
  # Pub/Sub module: the third-party code this Recipe pins and writes into the
  # output. The Pub/Sub topic it provisions is a service the reader contracts
  # for directly with Google Cloud, under Google Cloud's terms.
  license: Apache-2.0
  description: >
    Pub/Sub on Google Cloud, as one topic in the operator's project, realized
    by the terraform-google-modules project's published Pub/Sub module,
    terraform-google-modules/pubsub/google at v8.9.1, Apache-2.0, fetched
    from its git repository at that tag; entity.lock pins the tag's commit
    and archive digest. topic publishes a reference to the topic's resource
    name, which Terraform resolves when it applies.

    The module creates the topic and nothing else: it is given no
    subscription, and its project IAM binding granting the Pub/Sub service
    agent the Service Account Token Creator role, which it writes by
    default, is turned off. The project and the Cloud KMS key are the
    operator's, and neither is created. A destroy deletes the topic.

    A project_id missing, a kms_key_name or message_storage_policy of
    another form, enforce_in_transit, which the module does not pass to
    the topic, and any infra.overrides key not listed halt the build.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/google-cloud-pub-sub:1.0.0

  # The published module, at the tag the registry publishes as version 8.9.1.
  # A registry version of a module is a tag of its git repository, and the
  # registry's own download for this version answers with a git source at the
  # commit that tag names; Terraform's dependency lock file records providers
  # and no module. So the pin is taken here: `aggrega pin` resolves the tag to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes.
  #
  # The repository root is the module, and no module_subdir is written. The
  # root's configuration files — main.tf, variables.tf, outputs.tf and
  # versions.tf — declare no module call, so the configuration Terraform loads
  # from it calls no registry module and initialising it fetches providers and
  # nothing else. Its examples/ and test/ directories are vendored and never
  # loaded. It keeps to the Terraform 1.5 language.
  #
  # The module declares hashicorp/google ">= 6.2, < 9" in its own
  # required_providers, and a provider_meta block naming itself to Google, and
  # is vendored byte for byte, so this Recipe adds no provider constraint of
  # its own; beside the catalog's Google bodies, at "~> 8.8", Terraform
  # installs one release from 8.8 below 9. The boundary's root configuration
  # declares no provider block for Google: the provider reads its credentials
  # from the environment the plan runs in — GOOGLE_CREDENTIALS, or Application
  # Default Credentials — and the module names the project on what it
  # creates. It reads the project with data.google_project at every plan,
  # whatever it creates, so the identity Terraform runs as needs
  # resourcemanager.projects.get on the project.
  #
  # The tag is written out rather than read from a template: a source whose
  # coordinates come from a template is pinned per Release instead of in this
  # Recipe's own entity.lock, and this Recipe's pin is the one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-google-modules/terraform-google-pubsub.git
    ref: v8.9.1

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this topic, and resolves none
  # of it.
  #
  # topic is a reference to the module's id output, the topic's id, which the
  # provider gives as projects/<project>/topics/<name>, through this
  # component's module call, which the boundary's root configuration declares
  # under .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves it at apply time, after the topic
  # exists, so it resolves only for a consumer authored as a source: Recipe
  # in the same root configuration; a consumer on another target receives it
  # as text.
  provides:
    topic: "${module.{{ .context.instance_id }}.id}"

  # This Recipe reads from infra.overrides:
  #   project_id             - string, required (the module's project_id)
  #   kms_key_name           - string (the module's topic_kms_key_name, the
  #                            topic's kms_key_name)
  #   message_storage_policy - map with allowed_persistence_regions, a list
  #                            of region IDs (the module's
  #                            message_storage_policy, the topic's
  #                            message_storage_policy block)
  #
  # project_id and kms_key_name are the names the catalog's terraform Google
  # Recipes read for the project a resource is created in and the
  # customer-managed key it is encrypted with, whatever a module calls its
  # input; message_storage_policy is the module's input and the provider's
  # block. region and location halt, as any key not listed does: a topic is
  # global, and message_storage_policy says where its messages are stored.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the Pub/Sub API is enabled. It is a string
  # with no value this Recipe could choose for the operator, so it halts the
  # build when it is missing.
  #
  # kms_key_name names the operator's Cloud KMS key Pub/Sub encrypts the
  # topic's messages with, as the key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's description of the topic's kms_key_name gives; the
  # project's Pub/Sub service agent, service-<project
  # number>@gcp-sa-pubsub.iam.gserviceaccount.com, holds the Cloud KMS
  # CryptoKey Encrypter/Decrypter role on it, a grant that is the operator's
  # and that this Recipe does not write. Unset, Pub/Sub encrypts the messages
  # with a key Google manages. A value of another form halts.
  #
  # message_storage_policy limits the regions Pub/Sub stores the topic's
  # messages in to allowed_persistence_regions, a list of region IDs such as
  # europe-west1; a message published from elsewhere is routed to one of
  # them for storage. The provider's description calls an empty list no valid
  # configuration, so an empty list, a region ID that is not a string without
  # spaces, and any other key halt. enforce_in_transit, the provider's
  # argument refusing publishes and pulls in a region not listed, halts by
  # name: the module's main.tf writes allowed_persistence_regions alone into
  # the topic's block, so the value would reach no byte of the output. Unset,
  # the organisation's Resource Location Restriction policy, if any, decides
  # where messages are stored.
  #
  # The module's own inputs this Recipe sets and does not read: topic, the
  # component's name; create_subscriptions false and grant_token_creator
  # false. The module's default for grant_token_creator, true, writes a
  # google_project_iam_member granting the project's Pub/Sub service agent
  # roles/iam.serviceAccountTokenCreator across the project, an IAM binding
  # this Recipe never creates. Its push, pull, BigQuery and Cloud Storage
  # subscription lists keep their empty defaults, so none of the
  # subscriptions, subscription and topic IAM members or BigQuery and Cloud
  # Storage project roles counted from them is created, and its schema stays
  # null, so no schema is created.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema and assertions, or not read:
  #   honoured — values.message_retention_duration, as the module's
  #     topic_message_retention_duration, the topic's
  #     message_retention_duration; and the overrides above.
  #   refused — project_id missing or not a string; a kms_key_name of another
  #     form; a message_storage_policy that is not a map holding a non-empty
  #     list of region IDs under allowed_persistence_regions;
  #     enforce_in_transit by name; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the topic's name, the component's, to Pub/Sub's
  #     rule; the retention's form and range.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the module writes beside these: no labels, since topic_labels keeps
  # its empty default; the topic's name is the component's, so changing the
  # component's name, or project_id, creates a new topic and deletes the old
  # one. Pub/Sub holds a topic's name unique within a project, so two
  # Releases of one Aggregate deployed into one project collide when the
  # second applies. A destroy, or removing the component, deletes the topic.
  # Credentials. A topic holds none: a client signs each call with its own
  # Google identity, and Terraform authenticates with the credentials in the
  # environment it runs in, so the rendered configuration names none.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "kms_key_name" "message_storage_policy" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, kms_key_name and message_storage_policy from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "project_id" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail "this Release creates its Pub/Sub topic in the operator's own Google Cloud project, which this Recipe does not choose, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release" -}}
      {{- end -}}
    kms_key_name_form: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and Pub/Sub takes the Cloud KMS key it encrypts a topic's messages with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
    # The module writes allowed_persistence_regions alone into the topic's
    # message_storage_policy block; the provider requires that list and calls
    # an empty one no valid configuration.
    message_storage_policy: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "message_storage_policy" -}}
      {{- $p := $o.message_storage_policy -}}
      {{- if and (kindIs "map" $p) (hasKey $p "enforce_in_transit") -}}
      {{- fail "infra.overrides.message_storage_policy.enforce_in_transit is set, and the Pub/Sub module this Recipe sources writes allowed_persistence_regions alone into the topic's message storage policy, so enforce_in_transit would reach no byte of the output: remove it from the Release" -}}
      {{- end -}}
      {{- $ok := and (kindIs "map" $p) (eq (len $p) 1) (hasKey $p "allowed_persistence_regions") -}}
      {{- if $ok }}{{ $r := $p.allowed_persistence_regions }}{{ $ok = and (kindIs "slice" $r) (gt (len $r) 0) }}{{ if $ok }}{{ range $r }}{{ if not (and (typeIs "string" .) (regexMatch `^\S+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.message_storage_policy is %s, and this Recipe reads it as a map holding allowed_persistence_regions, a non-empty list of the region IDs Pub/Sub may store the topic's messages in, such as [europe-west1], and no other key: set it so in the Release, or remove it" (toJson $p)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable.
  # Each string the Release gives reaches Pub/Sub as written: the root
  # configuration writes a module argument's %{ as %%{ itself and keeps ${,
  # which a reference to another module's output needs, so ${ inside such a
  # string is written $${ here, which Terraform turns back into the
  # characters written rather than reading an interpolation.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    project_id: {{ toJson $o.project_id | replace "${" "$${" }}
    topic: {{ toJson .context.instance_id }}
    create_subscriptions: false
    grant_token_creator: false
    {{- with optional .values "message_retention_duration" "" }}
    topic_message_retention_duration: {{ toJson . }}
    {{- end }}
    {{- with optional $o "kms_key_name" "" }}
    topic_kms_key_name: {{ toJson . | replace "${" "$${" }}
    {{- end }}
    {{- with optional $o "message_storage_policy" "" }}
    message_storage_policy:
      allowed_persistence_regions: {{ toJson .allowed_persistence_regions | replace "${" "$${" }}
    {{- end }}
