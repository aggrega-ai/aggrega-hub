apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cognito
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Cognito, rendered as an authored Terraform body, main.tf: one
    aws_cognito_user_pool named after the component and one
    aws_cognito_user_pool_client in it, with no client secret. Nothing else
    is created: no domain, identity provider, resource server, Lambda
    trigger, IAM role or KMS key.

    user_pool_id, client_id, oidc_discovery_url and arn publish Terraform
    references to outputs of this component's module: the pool's and the
    client's IDs, the pool's ARN, and its endpoint joined into the URL of
    its discovery document. user_pool_tier sets the pool's feature plan,
    ESSENTIALS unless set, and tags the pool's tags.

    Deletion protection stays off: a destroy, or removing or renaming the
    component, deletes the pool and every user in it, and the AWS provider
    replaces the pool, with every user in it, when username_attributes
    change. A tier other than LITE, ESSENTIALS or PLUS, LITE with
    ALLOW_USER_AUTH, tags that are not a map of strings,
    infra.overrides.host, and any infra.overrides key not listed halt the
    build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/security/cognito:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this pool, and resolves none of
  # them. Each is a reference to an output of this component's module call:
  # the body renders into the component's own module directory, and the
  # boundary's root configuration declares that directory as a module block
  # named .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The references resolve only for a consumer authored as a
  # source: Recipe in the same Terraform root configuration, which Terraform
  # then applies after this module; a consumer on another target receives
  # them as text. user_pool_id is the pool's id, client_id the client's id,
  # arn the pool's arn, and oidc_discovery_url joins https://, the pool's
  # endpoint and /.well-known/openid-configuration. The AWS provider
  # computes the endpoint as cognito-idp.<region>.<partition's DNS
  # suffix>/<pool ID> (resource aws_cognito_user_pool at 6.73.0), so the URL
  # is the discovery endpoint the Amazon Cognito Developer Guide gives for a
  # pool ("Identity provider and relying party endpoints").
  provides:
    user_pool_id: "${module.{{ .context.instance_id }}.user_pool_id}"
    client_id: "${module.{{ .context.instance_id }}.client_id}"
    oidc_discovery_url: "${module.{{ .context.instance_id }}.oidc_discovery_url}"
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   user_pool_tier - string (aws_cognito_user_pool.user_pool_tier): LITE, ESSENTIALS or PLUS
  #   tags           - map[string]string (the pool's tags)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # user_pool_tier is the AWS provider's own argument name, which is what a
  # reader matches against the provider documentation, and tags the key the
  # catalog's terraform AWS Recipes read for a resource's tags.
  #
  # user_pool_tier is the pool's feature plan ("User pool feature plans" in
  # the Developer Guide), which decides the features the pool may use and
  # what Cognito charges for it. Unset, the body writes ESSENTIALS, the plan
  # Cognito applies when none is given, so the tier is always written. A
  # value other than LITE, ESSENTIALS or PLUS halts the build. Choice-based
  # sign-in, ALLOW_USER_AUTH in explicit_auth_flows, needs the Essentials
  # plan or higher (the CreateUserPoolClient reference), so LITE beside it
  # halts the build too. PLUS adds threat protection, which this Recipe does
  # not configure. The tier changes in place.
  #
  # tags tag the pool, as a map from each tag name to a string; the client
  # takes no tags.
  #
  # host is refused by name. The Component publishes no address of its own:
  # a client calls the user pools API at the Cognito endpoint of the pool's
  # Region, and a custom domain names the pool's managed login and OAuth 2.0
  # endpoints, which this Recipe does not set up.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.username_attributes and
  #     values.auto_verified_attributes, as the pool's arguments of those
  #     names, each written only while set; values.mfa_configuration, as its
  #     mfa_configuration, with software_token_mfa_configuration enabled, an
  #     authenticator app, while it is ON or OPTIONAL, and that block left
  #     out while it is OFF; values.explicit_auth_flows, as the client's
  #     explicit_auth_flows; and the overrides above. The Component refuses
  #     a client whose flows sign no one in, for every realization.
  #   refused — a user_pool_tier other than LITE, ESSENTIALS or PLUS; LITE
  #     with ALLOW_USER_AUTH; tags that are not a map of strings;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The cloudformation Recipe of this Component holds the same rules on
  # UserPoolTier: each target reads the key under its own spelling, so the
  # rules cannot sit in the Component.
  #
  # What the body writes beside these. On the pool: name, the instance's
  # name; user_pool_tier, as above; mfa_configuration, always; and
  # deletion_protection INACTIVE, the AWS provider's default and Cognito's,
  # written so the pool's deletion is stated rather than left to either. On
  # the client: user_pool_id, the pool; name, the instance's name; and
  # generate_secret false, so the client is public. The AWS provider at
  # 6.73.0 takes no issuer configuration for a pool, so the pool takes
  # Cognito's default issuer, the original one, which the Developer Guide
  # gives as the current default and whose discovery document
  # oidc_discovery_url names; the cloudformation Recipe of this Component
  # writes that issuer explicitly. Nothing else of either resource is
  # written, so Cognito's defaults hold, as they do for the pool and client
  # the cloudformation Recipe of this Component creates: no alias attributes,
  # no custom attributes and no attribute required at sign-up; users may sign
  # themselves up, as admin_create_user_config allows unless
  # allow_admin_create_user_only is set; Cognito's default password policy
  # and account recovery; email sent through Cognito's default email
  # configuration, from no-reply@verificationemail.com, which limits the
  # messages it sends each day below what the Developer Guide's "Email
  # settings" calls a typical production volume; no SMS configuration, so
  # Cognito sends no SMS message; no Lambda trigger, threat protection,
  # device tracking or KMS key of the operator's. On the client: no OAuth 2.0
  # feature, so users sign in only through the user pools API; access and ID
  # tokens valid for one hour and refresh tokens for 30 days; token
  # revocation on; and prevent_user_existence_errors LEGACY, Cognito's
  # default, so a sign-in or password recovery for a username that does not
  # exist answers UserNotFoundException. The Region is the one the root
  # configures for the AWS provider.
  #
  # Deletion and replacement. deletion_protection is INACTIVE, so a destroy,
  # removing the component, or renaming it, which renames its module block
  # and so destroys the pool and creates a new, empty one with a new ID,
  # client ID and discovery URL, deletes the old pool with every user in it,
  # their attributes and their passwords. The AWS provider forces the
  # replacement of a pool whose username_attributes change (resource
  # aws_cognito_user_pool at 6.73.0), as Cognito keeps them as created
  # ("Working with user attributes": "After you create a user pool, you
  # can't change this setting"), so changing username_attributes destroys
  # the pool with every user in it and creates a new, empty one; the plan
  # shows the pool as replaced. auto_verified_attributes,
  # mfa_configuration, user_pool_tier, tags and the client's
  # explicit_auth_flows change in place. The client is replaced, with a new
  # ID, only together with its pool, whose ID it takes.
  #
  # Credentials. The client is public: generate_secret is false, so Cognito
  # generates no client secret. A secret would reach a consumer only as the
  # client's client_secret, which Terraform keeps in its state and a
  # consumer would read through a module output, so none is offered. The
  # client's ID, the pool's ID and ARN and the discovery URL are no
  # credentials, and users' passwords stay in Cognito, so nothing secret is
  # published. Terraform authenticates to AWS with the credentials in the
  # environment it runs in, so the rendered configuration names none.
  # Backup. Amazon Cognito offers no backup of a user pool for this Recipe
  # to configure, so none is.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "user_pool_tier" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Cognito user pool publishes no address of its own: a client calls the user pools API at the Cognito endpoint of the pool's Region and names the pool by its ID, and this Recipe sets up no custom domain: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads user_pool_tier and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # user_pool_tier is one of the three feature plans the AWS provider and
    # Cognito take.
    user_pool_tier: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "user_pool_tier" -}}
      {{- $t := $o.user_pool_tier -}}
      {{- if not (and (typeIs "string" $t) (has $t (list "LITE" "ESSENTIALS" "PLUS"))) -}}
      {{- fail (printf "infra.overrides.user_pool_tier is %s, and an Amazon Cognito user pool takes the feature plan LITE, ESSENTIALS or PLUS: set it to one in the Release, or remove it for ESSENTIALS" (toJson $t)) -}}
      {{- end -}}
      {{- end -}}
    # Choice-based sign-in needs the Essentials feature plan or higher.
    user_pool_tier_user_auth: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (eq (toJson (optional $o "user_pool_tier" "")) `"LITE"`) (has "ALLOW_USER_AUTH" .values.explicit_auth_flows) -}}
      {{- fail "infra.overrides.user_pool_tier is LITE while values.explicit_auth_flows names ALLOW_USER_AUTH, and Amazon Cognito takes choice-based sign-in on the Essentials feature plan or higher: set user_pool_tier in the Release to ESSENTIALS or PLUS, or remove ALLOW_USER_AUTH from the Aggregate" -}}
      {{- end -}}
    # The AWS provider types tags as a map of strings.
    tags_map: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the pool takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Cognito module. The resources are named this, since each component's body
  # renders into a module directory of its own. Each tag reaches Cognito as
  # written: Terraform would read ${ and %{ inside a string as the start of an
  # interpolation or a directive, so they are written $${ and %%{, which
  # Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_cognito_user_pool" "this" {
        name                = "{{ .context.instance_id }}"
        deletion_protection = "INACTIVE"
        mfa_configuration   = "{{ .values.mfa_configuration }}"
        {{- with optional .values "username_attributes" "" }}
        username_attributes = {{ toJson . }}
        {{- end }}
        {{- with optional .values "auto_verified_attributes" "" }}
        auto_verified_attributes = {{ toJson . }}
        {{- end }}
        {{- if ne (toString .values.mfa_configuration) "OFF" }}

        software_token_mfa_configuration {
          enabled = true
        }
        {{- end }}

        ## ── Provider-specific overrides ──────────────────────────
        user_pool_tier = "{{ optional $o "user_pool_tier" "ESSENTIALS" }}"
        {{- with optional $o "tags" "" }}
        tags           = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      resource "aws_cognito_user_pool_client" "this" {
        name                = "{{ .context.instance_id }}"
        user_pool_id        = aws_cognito_user_pool.this.id
        generate_secret     = false
        explicit_auth_flows = {{ toJson .values.explicit_auth_flows }}
      }

      output "user_pool_id" {
        value = aws_cognito_user_pool.this.id
      }

      output "client_id" {
        value = aws_cognito_user_pool_client.this.id
      }

      output "oidc_discovery_url" {
        value = "https://${aws_cognito_user_pool.this.endpoint}/.well-known/openid-configuration"
      }

      output "arn" {
        value = aws_cognito_user_pool.this.arn
      }
