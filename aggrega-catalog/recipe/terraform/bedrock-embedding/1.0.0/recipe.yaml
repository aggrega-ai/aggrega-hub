apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-embedding
  version: 1.0.0
  description: >
    Amazon Bedrock's managed embedding API as a reference realization on
    Terraform: the module this Recipe writes declares no resource and
    reaches no provider, so applying it creates nothing, and it carries the
    regional endpoint the Release supplies and the embedding model's
    identifier as outputs of the module.

    Reach for it where the Release deploys Terraform; reach for
    cloudformation/bedrock-embedding where it deploys a CloudFormation
    stack. Declaring no provider, the module shares a root with a module at
    any aws version. A consumer reads each value as the text the Release and
    the Aggregate give, and nothing is looked up when the configuration is
    applied. A missing infra.endpoint halts naming it. No credential is
    delivered by this Recipe: consumers authenticate with ambient AWS IAM,
    such as the task role of an Amazon ECS task, or inject their own
    credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/ai-model/bedrock-embedding:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts before this Recipe
  # renders, the Component's schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.model, published as provides.model; infra.endpoint,
  #     published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.context_window, a hint for sizing the server that
  #     serves a model, which Amazon Bedrock already does;
  #     values.display_name and values.description, which describe the
  #     component to its readers.
  #
  # Amazon Bedrock serves its embedding models at a regional runtime
  # endpoint with no resource of the account's own behind it, so this Recipe
  # declares none.
  #
  # Backup. The model is Amazon Bedrock's, and this Recipe creates nothing to
  # back up.
  assertions:
    # The Bedrock runtime host carries the region, and the region is the
    # operator's choice, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches the Amazon Bedrock runtime of a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the Bedrock runtime endpoint of that region (bedrock-runtime.<region>.amazonaws.com)" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the model's identifier from
  # the developer's values, each published as written, so a consumer in this
  # root or on another target reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"

  # The module this component becomes: no resource and no provider, so
  # applying it creates nothing and it takes no aws version, and an output
  # for each value the component publishes, so the state records what the
  # configuration was given. Each value is written as a JSON string, with
  # Terraform's own template sequences ${ and %{ escaped as $${ and %%{, so
  # Terraform reads back exactly the text the Release and the Aggregate give.
  artifacts:
    main.tf: |
      output "endpoint" {
        value = {{ .infra.endpoint | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }

      output "model" {
        value = {{ .values.model | replace "${" "$${" | replace "%{" "%%{" | toJson }}
      }
