apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bigquery
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    BigQuery, rendered as an authored Terraform body, main.tf: one
    google_bigquery_dataset of the ID values.dataset_id gives, or the
    instance's name with each hyphen written as an underscore, in the
    operator's project. dataset_id publishes an output of this component's
    module, which Terraform resolves when it applies. The published
    terraform-google-modules/bigquery/google module is not sourced: it
    admits a hashicorp/google release below 8 alone, and the catalog's
    Google bodies install one from 8.8 below 9.

    The project and the KMS key are the operator's: none is created, nor
    any table, view, routine or IAM binding. A destroy deletes the dataset
    while it holds no table, and fails while it holds one.

    A project_id missing; a location, kms_key_name or storage billing model
    of another form; a default table expiration under an hour; a time
    travel window BigQuery does not keep; and any infra.overrides key not
    listed halt the build.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/bigdata/bigquery:1.0.0

  locals:
    # The dataset's ID: values.dataset_id, or else the instance's name with
    # each hyphen written as an underscore, which the Component's assertions
    # hold to BigQuery's rule.
    dataset_id: "{{ default (replace \"-\" \"_\" .context.instance_id) (optional .values \"dataset_id\" \"\") }}"

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this dataset, and resolves
  # none of it.
  #
  # dataset_id is a reference to the dataset_id output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a
  # module block named .context.instance_id for a component declared in the
  # Aggregate the Release deploys. The reference resolves only for a consumer
  # authored as a source: Recipe in the same Terraform root configuration,
  # which Terraform then applies after this module, once the dataset exists;
  # a consumer on another target receives it as text.
  provides:
    dataset_id: "${module.{{ .context.instance_id }}.dataset_id}"

  # This Recipe reads from infra.overrides:
  #   project_id                  - string, required (project)
  #   location                    - string (location; default US)
  #   kms_key_name                - string
  #                                 (default_encryption_configuration
  #                                 .kms_key_name)
  #   default_table_expiration_ms - integer (default_table_expiration_ms)
  #   max_time_travel_hours       - integer (max_time_travel_hours;
  #                                 default 168)
  #   storage_billing_model       - string (storage_billing_model;
  #                                 default LOGICAL)
  #
  # project_id and kms_key_name are the names the catalog's terraform Google
  # Recipes read for the project a resource is created in and the
  # customer-managed key it is encrypted with; location is the provider's
  # word for where a service takes a region or a multi-region; the others
  # are the provider's arguments.
  #
  # project_id names the operator's Google Cloud project, which this Recipe
  # never creates and in which the BigQuery API is enabled. It is a string
  # with no value this Recipe could choose for the operator, so it halts the
  # build when it is missing.
  #
  # location is where BigQuery keeps the dataset, a region such as
  # europe-west1 or a multi-region, US or EU (BigQuery's locations page);
  # BigQuery refuses one it does not offer when it creates the dataset.
  # Unset, BigQuery keeps the dataset in the US multi-region, its default. A
  # value that is not a string without spaces halts.
  #
  # kms_key_name names the operator's Cloud KMS key every table created in
  # the dataset is encrypted with unless its creation names another, as the
  # key's resource ID,
  # projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>,
  # the form the provider's default_encryption_configuration takes; the key
  # is in the dataset's location, and the project's BigQuery service account
  # may use it, both of which BigQuery checks when a table is created. Unset,
  # BigQuery encrypts the tables with a key Google manages. A value of
  # another form halts.
  #
  # default_table_expiration_ms is the lifetime, in milliseconds, a table
  # created in the dataset takes unless its creation names one; BigQuery
  # deletes the table when it ends. BigQuery takes one hour, 3600000, or
  # more (the REST reference of a dataset), so a value that is not a whole
  # number of at least 3600000 halts. A change reaches tables created after
  # it alone. Unset, tables do not expire.
  #
  # max_time_travel_hours is how far back, in hours, a query reads the
  # dataset's past data: 48 to 168 in multiples of 24 (BigQuery's page on
  # updating a dataset's properties), so any other value halts. Unset,
  # BigQuery keeps 168 hours, seven days.
  #
  # storage_billing_model is LOGICAL or PHYSICAL, whether BigQuery bills the
  # dataset's storage by logical or by physical, compressed, bytes (the REST
  # reference); any other value halts. BigQuery takes 24 hours to apply a
  # change and refuses another within 14 days, which it reports when
  # Terraform applies. Unset, BigQuery bills logical bytes.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema and assertions, or not read:
  #   honoured — values.dataset_id, as the dataset's ID; and the overrides
  #     above.
  #   refused — project_id missing or not a string; a location that is not a
  #     string without spaces; a kms_key_name of another form; a
  #     default_table_expiration_ms that is not a whole number of at least
  #     3600000; a max_time_travel_hours BigQuery does not keep; a
  #     storage_billing_model BigQuery does not offer; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the dataset's ID, values.dataset_id or the
  #     instance's name, to BigQuery's rule.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside these: no access block, so BigQuery grants
  # a dataset's default access, the project's readers, writers and owners by
  # their roles and the identity creating it as an owner (the REST reference
  # of a dataset); no labels, description, collation or default partition
  # expiration; delete_contents_on_destroy is left false, so a destroy, or
  # removing the component, fails while the dataset holds a table, the
  # provider's description of the argument, and deletes the dataset once it
  # holds none. The provider replaces the dataset when project_id, location
  # or the dataset's ID changes, each of which BigQuery fixes when it creates
  # the dataset: Terraform deletes it, which fails while it holds a table,
  # and creates a new, empty one.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "project_id" "location" "kms_key_name" "default_table_expiration_ms" "max_time_travel_hours" "storage_billing_model" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads project_id, location, kms_key_name, default_table_expiration_ms, max_time_travel_hours and storage_billing_model from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    project_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "project_id" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^\S+$` $v)) -}}
      {{- fail "this Release creates its BigQuery dataset in the operator's own Google Cloud project, which this Recipe does not choose, but infra.overrides.project_id carries none: set infra.overrides.project_id in the Release" -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "location" -}}
      {{- if not (and (typeIs "string" $o.location) (regexMatch `^\S+$` $o.location)) -}}
      {{- fail (printf "infra.overrides.location is %s, and BigQuery takes a dataset's location as the name of a region or a multi-region, such as europe-west1 or EU: set it to one in the Release, or remove it for the US multi-region" (toJson $o.location)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_name" -}}
      {{- if not (and (typeIs "string" $o.kms_key_name) (regexMatch `^projects/[^/\s]+/locations/[^/\s]+/keyRings/[^/\s]+/cryptoKeys/[^/\s]+$` $o.kms_key_name)) -}}
      {{- fail (printf "infra.overrides.kms_key_name is %s, and BigQuery takes the Cloud KMS key it encrypts a dataset's tables with as the key's resource ID, projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>: set it to one in the Release, or remove it to let Google manage the key" (toJson $o.kms_key_name)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "default_table_expiration_ms" -}}
      {{- $e := $o.default_table_expiration_ms -}}
      {{- $whole := or (kindIs "int" $e) (kindIs "int64" $e) (and (kindIs "float64" $e) (eq (float64 (int64 $e)) $e)) -}}
      {{- if not (and $whole (ge (int64 $e) 3600000)) -}}
      {{- fail (printf "infra.overrides.default_table_expiration_ms is %s, and BigQuery takes a default table lifetime of one hour, 3600000 milliseconds, or more: set it to a whole number of at least 3600000 in the Release, or remove it to let tables live until they are deleted" (toJson $e)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "max_time_travel_hours" -}}
      {{- $h := $o.max_time_travel_hours -}}
      {{- $whole := or (kindIs "int" $h) (kindIs "int64" $h) (and (kindIs "float64" $h) (eq (float64 (int64 $h)) $h)) -}}
      {{- if not (and $whole (has (int64 $h) (list (int64 48) (int64 72) (int64 96) (int64 120) (int64 144) (int64 168)))) -}}
      {{- fail (printf "infra.overrides.max_time_travel_hours is %s, and BigQuery keeps a time travel window of 48 to 168 hours, in multiples of 24: set it to 48, 72, 96, 120, 144 or 168 in the Release, or remove it for 168" (toJson $h)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "storage_billing_model" -}}
      {{- if not (has $o.storage_billing_model (list "LOGICAL" "PHYSICAL")) -}}
      {{- fail (printf "infra.overrides.storage_billing_model is %s, and BigQuery bills a dataset's storage by LOGICAL or PHYSICAL bytes: set it to one of them in the Release, or remove it for LOGICAL" (toJson $o.storage_billing_model)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/google so the engine installs a
  # provider whose resource schema this body was written against. It is a
  # range rather than an exact version because every Google body in a
  # boundary's root configuration shares one installed provider, and two
  # exact pins that differ fail init. The constraint string is the one the
  # catalog conventions' "One Google provider constraint for every Google
  # body" section states; each Google body repeats it deliberately, because a
  # library import cannot place a block inside an authored body. The body
  # keeps to the Terraform 1.5 language, as that section asks.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: the published bigquery module declares
  # hashicorp/google below 8, which no release satisfies beside the
  # catalog's constraint, so its init fails. The resource is named this,
  # since each component's body renders into a module directory of its own.
  # Each string the Release gives reaches BigQuery as written: Terraform
  # would read ${ and %{ inside a string as the start of an interpolation or
  # a directive, so they are written $${ and %%{, which Terraform turns back
  # into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          google = {
            source  = "hashicorp/google"
            version = "~> 8.8"
          }
        }
      }

      resource "google_bigquery_dataset" "this" {
        dataset_id = "{{ .locals.dataset_id }}"

        ## ── Provider-specific overrides ──────────────────────────
        project = {{ toJson $o.project_id | replace "${" "$${" | replace "%{" "%%{" }}
        {{- with optional $o "location" "" }}
        location = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- if hasKey $o "default_table_expiration_ms" }}
        default_table_expiration_ms = {{ int64 $o.default_table_expiration_ms }}
        {{- end }}
        {{- if hasKey $o "max_time_travel_hours" }}
        max_time_travel_hours = "{{ int64 $o.max_time_travel_hours }}"
        {{- end }}
        {{- with optional $o "storage_billing_model" "" }}
        storage_billing_model = "{{ . }}"
        {{- end }}
        {{- with optional $o "kms_key_name" "" }}

        default_encryption_configuration {
          kms_key_name = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }

      output "dataset_id" {
        value = google_bigquery_dataset.this.dataset_id
      }
