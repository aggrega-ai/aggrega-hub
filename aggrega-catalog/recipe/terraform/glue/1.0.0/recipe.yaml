apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: glue
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    The AWS Glue Data Catalog, rendered as an authored Terraform body,
    main.tf: one aws_glue_catalog_database, named by values.database, in
    the Data Catalog of the account the AWS provider's credentials belong
    to. database publishes a Terraform reference to the database's name,
    an output of this component's module, which Terraform resolves when it
    applies.

    location_uri names the database's location, an Amazon S3 location in
    the operator's bucket, and tags the database's tags. No table, job,
    crawler, bucket or role is created, and Lake Formation permissions are
    left to the account's settings. A changed name replaces the database,
    and deleting it deletes the tables it holds.

    infra.overrides.host halts the build, since a client reaches every
    database at AWS Glue's endpoint in its Region, as do a location or
    tags of another shape and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/bigdata/glue:1.0.0

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this database, and resolves none of it.
  # database is a reference to the database output of this component's module
  # call: the body renders into the component's own module directory, and the
  # boundary's root configuration declares that directory as a module block
  # named .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The reference resolves only for a consumer authored as a
  # source: Recipe in the same Terraform root configuration, which Terraform
  # then applies after this module; a consumer on another target receives it
  # as text. The output is the database's name.
  provides:
    database: "${module.{{ .context.instance_id }}.database}"

  # This Recipe reads from infra.overrides:
  #   location_uri - string (location_uri, the database's location, an s3:// location)
  #   tags         - map[string]string (the database's tags)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # A key is the Terraform argument name, which is what a reader matches
  # against provider documentation.
  #
  # location_uri is the database's location: an Amazon S3 location, s3://
  # followed by the operator's bucket and an optional prefix, which the Data
  # Catalog records on the database. The bucket is the operator's and this
  # Recipe neither creates it nor grants access to it. The bucket's name
  # follows Amazon S3's rule for a bucket name, 3 to 63 lowercase letters,
  # digits, periods and hyphens beginning and ending with a letter or a digit
  # (the Amazon S3 User Guide's bucket naming rules), and AWS Glue takes a
  # location of at most 1024 characters (the DatabaseInput structure of the AWS
  # Glue API); a location of another shape or length halts the build. Unset,
  # the body writes none, and the database has none when it is created. The
  # AWS provider keeps a location it is not given, so removing location_uri
  # from a Release leaves the location the database already holds.
  #
  # tags tag the database, as a map from each tag name to a string.
  #
  # The location and each tag reach AWS Glue as written: the body writes ${
  # and %{ inside them as $${ and %%{, which Terraform turns back into the
  # characters written rather than reading an interpolation or a directive.
  #
  # host is refused by name. A Data Catalog database has no address of its
  # own: a client calls AWS Glue's endpoint in the database's Region, an
  # endpoint the service names, and names the database in the call, so this
  # Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema, or not read:
  #   honoured — values.database, set as name; the overrides above.
  #   refused — a location_uri of another shape or length; tags that are not
  #     a map of strings; infra.overrides.host; and any infra.overrides key
  #     not listed above.
  #   held by the Component — the database name's rule, 1 to 255 lowercase
  #     letters, digits and underscores, which its schema declares; the AWS
  #     provider also refuses an upper-case letter in the name.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The account. catalog_id is not written: the AWS provider creates the
  # database in the Data Catalog of the account its credentials belong to,
  # in the provider's Region; it is not a key.
  #
  # The name. values.database is set as name, which the AWS provider replaces
  # the database to change. The Data Catalog renames no database (the Athena
  # User Guide's page on naming databases, tables and columns), so a changed
  # name creates a new, empty database and deletes the old one with its
  # tables.
  #
  # What the body does not write: description and parameters;
  # target_database and federated_database, which make the database a link
  # to another catalog's database or an external metastore's rather than a
  # database of its own; and create_table_default_permission, so the tables
  # created in the database take the default permissions the account's Lake
  # Formation settings give, which, as AWS Lake Formation starts, leave access
  # to IAM policies alone (the Lake Formation Developer Guide's page on
  # changing the default settings). Lake Formation permissions are the
  # operator's.
  #
  # Deletion. Destroying the database removes it from the Data Catalog, and
  # AWS Glue then deletes the tables, their versions and partitions, and the
  # user-defined functions it holds (the DeleteDatabase reference). The
  # objects at the database's location are in the operator's bucket, which
  # this Recipe does not touch.
  assertions:
    overrides_known: >-
      {{- $known := list "location_uri" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an AWS Glue Data Catalog database has no address of its own: a client calls AWS Glue's endpoint in the database's Region and names the database by database: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads location_uri and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # Each of these overrides is passed to the resource as written, and
    # location_uri names an Amazon S3 location in the operator's bucket, so a
    # location of another shape halts here rather than being recorded on the
    # database, and one longer than AWS Glue takes halts rather than failing
    # the apply. The length is counted in characters, as AWS Glue counts it.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "location_uri" -}}
      {{- if not (and (typeIs "string" $o.location_uri) (regexMatch `^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/\S*)?$` $o.location_uri)) -}}
      {{- fail (printf "infra.overrides.location_uri is %s, and the database takes its location as s3:// followed by an Amazon S3 bucket name, 3 to 63 lowercase letters, digits, periods and hyphens beginning and ending with a letter or a digit, and an optional /prefix: set it in the Release to such a location in the operator's bucket, or remove it for no location" (toJson $o.location_uri)) -}}
      {{- end -}}
      {{- if not (regexMatch `^.{0,1000}.{0,24}$` $o.location_uri) -}}
      {{- fail "infra.overrides.location_uri is longer than 1024 characters, and the database takes a location of at most 1024 characters: shorten it in the Release" -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the database takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # module for a Data Catalog database. The resource is named this, since each
  # component's body renders into a module directory of its own.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_glue_catalog_database" "this" {
        name = {{ toJson .values.database }}

        ## ── Provider-specific overrides ──────────────────────────
        {{- with optional $o "location_uri" "" }}
        location_uri = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
        {{- with optional $o "tags" "" }}

        tags = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      output "database" {
        value = aws_glue_catalog_database.this.name
      }
