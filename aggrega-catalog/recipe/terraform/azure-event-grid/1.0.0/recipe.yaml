apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-event-grid
  version: 1.0.0
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Event Grid: one custom topic taking events in the format
    values.input_schema names, rendered as Terraform for the azurerm
    provider by a module kept beside this Recipe, not by Microsoft's Azure
    Verified Modules module Azure/avm-res-eventgrid-topic/azurerm, whose
    root calls a module from the Terraform registry.

    Reach for it where the Release deploys Terraform; reach for
    arm/azure-event-grid where it deploys an Azure Resource Manager
    template. It needs hashicorp/azurerm 5.14 or later, so it goes in a
    boundary apart from Recipes whose modules admit azurerm 4 alone.
    infra.overrides names the operator's resource group and region. Public
    network access is on unless
    infra.overrides.public_network_access_enabled is false; the private
    endpoint is the operator's. The module declares no event subscription.

    Access key and shared access signature authentication is off, so the
    topic takes Microsoft Entra ID alone. host is a reference to the DNS
    name in the endpoint the provider reports, or infra.overrides.host;
    endpoint is that URL, or one built on infra.overrides.host. A topic
    name the service refuses halts naming the component; any
    infra.overrides key not listed, and enable_telemetry, halt naming the
    key, as do resource_group_name and location left out, and
    resource_group_name, location, public_network_access_enabled and host
    given in a form they do not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/azure-event-grid:1.0.0

  # The module beside this Recipe, module/main.tf and module/variables.tf,
  # declares the topic as an azurerm_eventgrid_topic, and nothing else.
  # `aggrega pin` records the digest of each file in entity.lock, and every
  # build reads exactly those bytes.
  #
  # Microsoft's Azure Verified Modules programme publishes a Terraform module
  # for the service, Azure/avm-res-eventgrid-topic/azurerm, MIT, at v0.2.0 its
  # newest version. Its root configuration calls the registry module
  # Azure/avm-utl-interfaces/azure for its private endpoints, whatever the
  # caller passes, so initialising a configuration that sources it fetches a
  # module from the Terraform registry, which the catalog's sourced modules do
  # not do. The module is therefore not sourced, and no module telemetry
  # exists to turn off.
  #
  # The module declares hashicorp/azurerm "~> 5.14", the catalog's one Azure
  # provider constraint, so a Release places this topic in a terraform
  # boundary whose bodies install azurerm 5, apart from any module admitting
  # azurerm 4 alone.
  source: ./module

  locals:
    # The name the Release gives the topic under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   resource_group_name            - string (resource_group_name), required
  #   location                       - string (location), required
  #   public_network_access_enabled  - bool (public_network_access_enabled; default true)
  #   tags                           - map[string]string (tags of the topic)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  # enable_telemetry halts by name: the module is this catalog's own, with no
  # telemetry to turn on or off. Any other key halts naming it.
  #
  # Each is named by the resource argument it sets, given in brackets, save
  # host, which every managed Recipe reads for the address it publishes.
  # arm/azure-event-grid reads each of them but resource_group_name under the
  # same spelling: its template deploys into the group it is deployed to.
  # resource_group_name and location are required: they place the topic in
  # the operator's subscription, and this Recipe never chooses either. The
  # topic takes the resource group by its name, so nothing is composed from
  # the subscription Terraform runs against.
  #
  # public_network_access_enabled. A topic takes events over its public
  # endpoint, from every network unless IP rules restrict it, or over a
  # private endpoint in a virtual network. Unset or true, the provider's own
  # default and the service's, public network access is on, and since this
  # Recipe passes no IP rule the public endpoint takes events from every
  # network, each request still authenticated with Microsoft Entra ID; false
  # turns it off, and the topic takes events through a private endpoint
  # alone. This Recipe emits no private endpoint: it is the operator's,
  # created for the topic outside the Release, the way a virtual network's
  # subnets and private DNS zones are.
  #
  # The module sets these beside the arguments the keys above set:
  # input_schema from values.input_schema, EventGridSchema unless set, which
  # the provider replaces the topic to change; local_auth_enabled false, whose
  # default is true, so the contract that no key reaches a consumer stands in
  # the configuration itself; and minimum_tls_version 1.2. The service's own
  # defaults stand for every argument the module leaves out: its data
  # residency boundary, which Microsoft documents as cross-geo, replicating
  # the topic's metadata to its region's pair where the region has one; and no
  # event subscription, managed identity, IP rule, input mapping or private
  # endpoint.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # provider's resource schema:
  #   honoured — values.input_schema, as the topic's input schema; and the
  #     overrides above.
  #   refused — a topic name the service refuses; an
  #     infra.overrides.resource_group_name or location left out or given as
  #     anything but a string; public_network_access_enabled given as
  #     anything but a boolean, and host as anything but a bare DNS name;
  #     enable_telemetry; and any infra.overrides key not listed above. An
  #     input schema the Component does not offer is refused by the
  #     Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. The provider reads the topic's access keys into its state as
  # sensitive attributes; with local authentication off they authenticate no
  # request, the module publishes no output from them, and nothing reads
  # them. Backup. Microsoft documents Event Grid as an event routing service
  # with no backup or restore of its own, so this Recipe configures none.
  assertions:
    # A placement key set to something other than a string is refused with
    # what the key names, apart from a key left out.
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict "resource_group_name" "the operator's resource group the topic is created in, by its name, such as example-rg" "location" "the one Azure region the topic is created in, such as westeurope" -}}
      {{- range $k := list "resource_group_name" "location" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (typeIs "string" $v) -}}
      {{- fail (printf "infra.overrides.%s is %v, and it names %s, as a string: set infra.overrides.%s in the Release to such a name" $k $v (get $names $k) $k) -}}
      {{- end -}}
      {{- if not $v -}}
      {{- fail (printf "this Release places its Event Grid topic in the operator's own Azure resource group and region, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.location in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "resource_group_name" "location" "public_network_access_enabled" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the Event Grid topic in a module of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads resource_group_name, location, public_network_access_enabled, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the topic's public network access as a boolean: set it to false to turn it off, or to true or remove it to keep it on" $p) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a publisher to this topic reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the topic takes events over HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The topic is named after the component, and its name is also the first
    # label of the address the service gives it, so it is unique within its
    # region. Microsoft's documentation of Azure resource names gives an Event
    # Grid topic name 3 to 50 letters, digits and hyphens, the rule the
    # provider's own validation holds too; it is checked here, where the name
    # is known.
    topic_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9-]{3,50}$` $n) -}}
      {{- fail (printf "the component %q names its Event Grid topic, and Microsoft documents a topic name as 3 to 50 letters, digits and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # provider reports the topic's endpoint, the URL a publisher sends events
  # to, as the service gives it:
  # https://<topic>.<region>-1.eventgrid.azure.net/api/events in the public
  # cloud, under its cloud's own domain elsewhere. The module publishes it as
  # its endpoint output, and its host output takes the DNS name between
  # https:// and the path. Each provides key reads the module output of the
  # same name from this component's module call, which the boundary's root
  # configuration declares under .context.instance_id for a component declared
  # in the Aggregate the Release deploys. Terraform resolves it at apply time,
  # after the topic exists, so it resolves only for a consumer authored as a
  # source: Recipe in the same root configuration; a consumer on another
  # target receives it as text.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the reference, and endpoint is https://<name>/api/events. It is
  # the operator's deterministic pointer: the compiler pipes it as text and
  # looks nothing up, and this Recipe emits no DNS record for it, so the
  # operator points the name at the topic outside the Release. A client
  # checking the topic's certificate needs a name the certificate carries,
  # which is the topic's own name under eventgrid.azure.net or the private
  # link name that resolves to it. A consumer in the same root configuration
  # receives the name as well, and a name carries no reference for Terraform
  # to order its module after this one by; a later syncWave on the consumer's
  # boundary, sharing this boundary's directory, orders the two.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}${module.{{ .context.instance_id }}.host}{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}/api/events{{ else }}${module.{{ .context.instance_id }}.endpoint}{{ end }}"

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own variable. The
  # topic is named after the component, as the other managed Recipes name
  # theirs.
  #
  # The resource group's name, the region and each tag reach Azure as written:
  # each is written as its JSON text, which keeps a double quote inside it a
  # character of the value, and the root configuration writes a module
  # argument's %{ as %%{ itself and keeps ${, which a reference to another
  # module's output needs, so ${ inside them is written $${ here, which
  # Terraform turns back into the characters written.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name | replace "${" "$${" }}
    location: {{ toJson $o.location | replace "${" "$${" }}
    input_schema: "{{ default "EventGridSchema" .values.input_schema }}"
    public_network_access_enabled: {{ if optional $o "public_network_access_enabled" true }}true{{ else }}false{{ end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . | replace "${" "$${" }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name. The same name
  # with other bytes halts the build. The azurerm provider refuses to plan
  # without its features block, and the module carries no provider block of
  # its own, so it inherits this configuration; the provider reads its
  # credentials and subscription from the environment Terraform runs in.
  # Terraform destroys the module's resources with it, so the file stays while
  # any component declaring it does: remove the last of them from a Release
  # only after destroying what their modules created, because with the file
  # gone Terraform refuses to plan, asking for a provider block with the
  # features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
