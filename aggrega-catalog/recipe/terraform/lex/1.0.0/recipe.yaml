apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: lex
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Lex, rendered as an authored Terraform body, main.tf: one
    aws_lexv2models_bot named after the component, running as the IAM role
    role_arn names, with an aws_lexv2models_bot_locale per locale and an
    aws_lexv2models_intent and aws_lexv2models_slot_type per intent and slot
    type its values declare, each in the bot's Draft. agent_id and arn
    publish Terraform references to the bot's ID and ARN, outputs of this
    component's module, which Terraform resolves when it applies.

    The AWS provider builds no locale and has no alias resource, so Lex
    answers no runtime request until the operator builds each locale and
    creates a version and an alias outside the Release; bot_alias_id is
    published empty. Lex adds its fallback intent to every locale. Tags
    label the bot. No role is created.

    An intent declaring slots halts the build, since the provider cannot
    give a slot the priority Lex requires to build; so do a locale_id not of
    the form Lex's locales take, a role_arn missing or of another form, tags
    that are not a map of strings, infra.overrides.host and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/ai-agent/lex:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this bot, and resolves none of
  # them. Each is a reference to an output of this component's module call:
  # the body renders into the component's own module directory, and the
  # boundary's root configuration declares that directory as a module block
  # named .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The references resolve only for a consumer authored as
  # a source: Recipe in the same Terraform root configuration, which
  # Terraform then applies after this module; a consumer on another target
  # receives them as text. The outputs are the bot's ID, which a call to
  # Amazon Lex's runtime API names as botId, and its ARN.
  #
  # bot_alias_id is published empty. A runtime call names an alias beside
  # the bot (RecognizeText's botAliasId), and the AWS provider at 6.73.0 has
  # no resource for an alias of a Lex V2 bot. The alias Lex creates with
  # every bot, TestBotAlias, runs the bot's Draft, and the Amazon Lex V2
  # Developer Guide's "Versioning and aliases with your Lex V2 bot" says it
  # "should only be used for manual testing", Lex limiting the runtime
  # requests it takes; the Draft this body writes is also not built (below).
  # Its ID is therefore no alias a request of a client application runs, and
  # no other value is published in its place: a consumer reading
  # bot_alias_id receives the empty string, and the alias it calls is the one
  # the operator creates outside the Release.
  provides:
    agent_id: "${module.{{ .context.instance_id }}.agent_id}"
    bot_alias_id: ""
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   role_arn - string, required (role_arn)
  #   tags     - map[string]string (the bot's tags)
  # host halts by name, as any key not listed does.
  #
  # role_arn is the AWS provider's own argument name, which is what a reader
  # matches against the provider documentation, and the name the catalog's
  # terraform AWS Recipes read for the IAM role a service assumes. tags is
  # the key, under the same name, that the catalog's terraform AWS Recipes
  # read for a resource's tags, so a Release names them once whichever
  # Recipe it configures.
  #
  # role_arn names the IAM role Amazon Lex uses to build and run the bot, as
  # the ARN of a role, arn:<partition>:iam::<account>:role/ followed by its
  # path and name, of 32 to 2,048 characters (the API Reference's
  # CreateBot). The role, with a trust policy letting lexv2.amazonaws.com
  # assume it and the permissions the bot needs, is the operator's, named
  # here and never created. The AWS provider checks only that the value is
  # an ARN, so a value of another form, or none, halts the build here rather
  # than at apply. Changing it updates the bot in place.
  #
  # tags tag the bot, as a map from each tag name to a string. The locales,
  # intents and slot types take no tags in the AWS provider.
  #
  # host is refused by name. A bot publishes no address of its own: a caller
  # reaches Amazon Lex's runtime endpoint in the bot's Region, which the
  # service names, and names the bot by its ID in each call, so this
  # Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.child_directed (data_privacy.child_directed),
  #     values.idle_session_ttl_in_seconds (idle_session_ttl_in_seconds), and
  #     values.bot_locales: each locale's locale_id and
  #     nlu_confidence_threshold (aws_lexv2models_bot_locale's locale_id and
  #     n_lu_intent_confidence_threshold), each intent's name and
  #     sample_utterances (aws_lexv2models_intent's name and sample_utterance
  #     blocks), and each slot type's name, slot_type_values with their
  #     synonyms and value_selection_setting.resolution_strategy
  #     (aws_lexv2models_slot_type's name, slot_type_values and
  #     value_selection_setting blocks, the strategy written as the Lex API
  #     and the AWS provider spell it: ORIGINAL_VALUE as OriginalValue,
  #     TOP_RESOLUTION as TopResolution, CONCATENATION as Concatenation); and
  #     the overrides above.
  #   refused — an intent declaring slots; a locale_id of another form than
  #     the locales Lex supports take; a role_arn not set or of another form;
  #     tags that are not a map of strings; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the session time's range; at least one locale;
  #     the subset's keys, each level's required keys, its names, its ranges
  #     and its values, and one locale per locale_id and one intent and slot
  #     type per name; and the component's name, which names the bot, to the
  #     names Lex takes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # Slots are refused. The AWS provider creates a slot as a resource of its
  # own, aws_lexv2models_slot, naming the intent it belongs to, while the
  # intent's slot priorities name the slot: the provider's documentation for
  # aws_lexv2models_intent says slot_priority "is ignored on create and only
  # valid for updates", and naming the slot there makes the two resources
  # depend on each other, which Terraform refuses as a cycle. Lex refuses to
  # build a locale whose intent holds a slot without a priority (the failure
  # it reports: "Slot ids [...] in intent ... don't define a slot priority";
  # the AWS provider's issues 36863 and 39948). No resource or step outside
  # the provider fills the gap, so an intent declaring slots halts the build.
  #
  # The build. Lex answers a locale only once it is built (the API
  # Reference's BuildBotLocale: "When the status is Built, the bot is ready
  # for use"), and no resource of the AWS provider at 6.73.0 builds one: a
  # locale it creates is left NotBuilt. A runtime call names an alias, and
  # the provider creates none. The operator therefore builds each locale and
  # creates a version and an alias outside the Release before a client
  # application calls the bot; each apply that changes the locales leaves
  # the Draft unbuilt again, and a version or alias made from an earlier
  # Draft keeps running what it was made from.
  #
  # What the body writes beside the values: bot_version DRAFT on each
  # locale, intent and slot type, the only version they can be created in.
  # Every other argument is left out, so Lex's defaults hold: the bot's type
  # Bot; no voice settings on a locale; no code hook, context, confirmation,
  # closing or Kendra setting on an intent; no parent, composite or external
  # source on a slot type. Lex adds its fallback intent, AMAZON.FallbackIntent,
  # to each locale the API creates (the Amazon Lex V2 Developer Guide's
  # "AMAZON.FallbackIntent"), so the body declares none. The Region is the
  # one the root configures for the AWS provider.
  #
  # Changes and the name. A changed threshold, utterance, slot type value,
  # role, session time or child_directed updates its resource in place; a
  # changed locale_id replaces the locale, as the provider marks locale_id
  # to force a new resource. Each locale, intent and slot type is declared
  # under a resource name made of its locale_id and its name, so renaming
  # one deletes it and creates another. The provider replaces the bot when
  # its name changes, so renaming the component makes Terraform delete the
  # old bot, which Lex deletes with its locales, versions and aliases (the
  # API Reference's DeleteBot), and create a new one; a bot name is unique in
  # the account (CreateBot).
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "role_arn" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Lex bot publishes no address of its own: a caller reaches the Amazon Lex runtime endpoint in its Region and names the bot by agent_id: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads role_arn and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The AWS provider requires a role, and the role is the operator's.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "role_arn") -}}
      {{- fail "infra.overrides.role_arn is not set, and an Amazon Lex bot is built and runs as the IAM role the operator names by its ARN: set infra.overrides.role_arn in the Release, such as arn:aws:iam::123456789012:role/example-lex-role" -}}
      {{- end -}}
    # role_arn the ARN of a role, of 32 to 2,048 characters (CreateBot's
    # roleArn), and tags the map of strings the provider types them as. The
    # cloudformation Recipe of this Component holds the same role check on
    # RoleArn: the override keys are spelt differently per target, so the
    # check cannot sit in the realization-neutral Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "role_arn" -}}
      {{- if not (and (typeIs "string" $o.role_arn) (ge (len $o.role_arn) 32) (le (len $o.role_arn) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.role_arn)) -}}
      {{- fail (printf "infra.overrides.role_arn is %s, and Amazon Lex takes the IAM role a bot runs as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 32 to 2048 characters: set it to such an ARN in the Release" (toJson $o.role_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the bot takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}
    # Slots, which the AWS provider cannot give the priority Lex requires
    # (the header above); and a locale_id of another form than every locale
    # the Amazon Lex V2 Developer Guide's "Supported languages" lists takes,
    # a language code and a region code joined by an underscore, such as
    # en_US or es_419, since the body names the locale's resources after it.
    bot_locales: >-
      {{- range $i, $l := .values.bot_locales -}}
      {{- if not (regexMatch `^[A-Za-z]+_[A-Za-z0-9]+$` $l.locale_id) -}}
      {{- fail (printf "values.bot_locales[%d].locale_id is %s, and Amazon Lex names each locale it supports by a language code and a region code joined by an underscore, such as en_US or es_419, the form this Recipe names the locale's Terraform resources by: set it to such a locale in the Aggregate" $i (toJson $l.locale_id)) -}}
      {{- end -}}
      {{- range $j, $in := (get $l "intents" | default list) -}}
      {{- if get $in "slots" -}}
      {{- fail (printf "values.bot_locales[%d].intents[%d] declares slots, and on Terraform the AWS provider cannot give a slot the priority Amazon Lex requires to build its locale, since the intent names its slots' priorities only once they exist: remove the slots from the Aggregate, or deploy the bot through CloudFormation" $i $j) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Amazon Lex module. The bot is named this, since each component's body
  # renders into a module directory of its own; each locale is named after
  # its locale_id, and each intent and slot type after its locale_id and its
  # name, joined by two hyphens, which no name Lex takes holds. The values
  # reach it as the Component's schema and assertions hold them: every key
  # in its place and every name of the letters, digits, hyphens and
  # underscores Lex takes. Each text and tag reaches Lex as written:
  # Terraform would read ${ and %{ inside a string as the start of an
  # interpolation or a directive, so they are written $${ and %%{, which
  # Terraform turns back into the characters written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_lexv2models_bot" "this" {
        name                        = "{{ .context.instance_id }}"
        idle_session_ttl_in_seconds = {{ toJson .values.idle_session_ttl_in_seconds }}

        data_privacy {
          child_directed = {{ toJson .values.child_directed }}
        }

        ## ── Provider-specific overrides ──────────────────────────
        role_arn = {{ toJson $o.role_arn }}
        {{- with optional $o "tags" "" }}

        tags = {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }
      {{- range $l := .values.bot_locales }}

      resource "aws_lexv2models_bot_locale" "{{ $l.locale_id }}" {
        bot_id                           = aws_lexv2models_bot.this.id
        bot_version                      = "DRAFT"
        locale_id                        = {{ toJson $l.locale_id }}
        n_lu_intent_confidence_threshold = {{ toJson $l.nlu_confidence_threshold }}
      }
      {{- range $st := (get $l "slot_types" | default list) }}

      resource "aws_lexv2models_slot_type" "{{ $l.locale_id }}--{{ $st.name }}" {
        bot_id      = aws_lexv2models_bot.this.id
        bot_version = "DRAFT"
        locale_id   = aws_lexv2models_bot_locale.{{ $l.locale_id }}.locale_id
        name        = {{ toJson $st.name }}
        {{- range $v := (get $st "slot_type_values" | default list) }}

        slot_type_values {
          sample_value {
            value = {{ toJson $v.sample_value.value | replace "${" "$${" | replace "%{" "%%{" }}
          }
          {{- range $sy := (get $v "synonyms" | default list) }}
          synonyms {
            value = {{ toJson $sy.value | replace "${" "$${" | replace "%{" "%%{" }}
          }
          {{- end }}
        }
        {{- end }}
        {{- with get $st "value_selection_setting" }}

        value_selection_setting {
          resolution_strategy = {{ get (dict "ORIGINAL_VALUE" "OriginalValue" "TOP_RESOLUTION" "TopResolution" "CONCATENATION" "Concatenation") .resolution_strategy | toJson }}
        }
        {{- end }}
      }
      {{- end }}
      {{- range $in := (get $l "intents" | default list) }}

      resource "aws_lexv2models_intent" "{{ $l.locale_id }}--{{ $in.name }}" {
        bot_id      = aws_lexv2models_bot.this.id
        bot_version = "DRAFT"
        locale_id   = aws_lexv2models_bot_locale.{{ $l.locale_id }}.locale_id
        name        = {{ toJson $in.name }}
        {{- range $u := (get $in "sample_utterances" | default list) }}

        sample_utterance {
          utterance = {{ toJson $u.utterance | replace "${" "$${" | replace "%{" "%%{" }}
        }
        {{- end }}
      }
      {{- end }}
      {{- end }}

      output "agent_id" {
        value = aws_lexv2models_bot.this.id
      }

      output "arn" {
        value = aws_lexv2models_bot.this.arn
      }
