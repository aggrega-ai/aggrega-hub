apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: lex
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Lex on Terraform through HashiCorp's AWS Cloud Control provider,
    hashicorp/awscc, rendered as an authored body, main.tf: one
    awscc_lex_bot named after the component, holding the locales, intents,
    slots and slot types its values declare, running as the IAM role
    role_arn names; an awscc_lex_bot_version, a numbered snapshot of the
    bot that Lex builds from it; and an awscc_lex_bot_alias named after the
    component and pointing to that version. agent_id, bot_alias_id and arn
    are outputs of this component's module, which Terraform resolves when
    it applies.

    Each locale also holds the intent FallbackIntent, built on
    AMAZON.FallbackIntent; an intent's slots are elicited in the order
    listed. A change of the locales, the role, the session time or
    child_directed updates the bot in place and replaces the version:
    Terraform creates the new one, moves the alias to it, then deletes the
    old one. The provider calls the Cloud Control API in the Region of the
    AWS provider, and the Cloud Control API calls Amazon Lex with the same
    credentials. Tags label the bot and the alias. No role is created.

    A role_arn not set or other than a role's ARN halts the build, as do an
    intent named FallbackIntent, tags that are not a map of strings Amazon
    Lex takes, infra.overrides.host and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/ai-agent/lex:1.0.0

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this bot, and resolves none of
  # them. Each is a reference to an output of this component's module call:
  # the body renders into the component's own module directory, and the
  # boundary's root configuration declares that directory as a module block
  # named .context.instance_id for a component declared in the Aggregate the
  # Release deploys. The references resolve only for a consumer authored as
  # a source: Recipe in the same Terraform root configuration, which
  # Terraform then applies after this module; a consumer on another target
  # receives them as text.
  #
  # agent_id is the bot's ID (awscc_lex_bot's bot_id), arn the bot's ARN and
  # bot_alias_id the alias's ID (awscc_lex_bot_alias's bot_alias_id). A call
  # to Amazon Lex's runtime API, such as RecognizeText, names the bot and the
  # alias by these two IDs.
  provides:
    agent_id: "${module.{{ .context.instance_id }}.agent_id}"
    bot_alias_id: "${module.{{ .context.instance_id }}.bot_alias_id}"
    arn: "${module.{{ .context.instance_id }}.arn}"

  # This Recipe reads from infra.overrides:
  #   role_arn - string, required (awscc_lex_bot's role_arn)
  #   tags     - map[string]string (the bot's bot_tags and the alias's
  #              bot_alias_tags)
  # host halts by name, as any key not listed does.
  #
  # role_arn is the provider's own argument name, which is what a reader
  # matches against the provider documentation, and the name the catalog's
  # terraform AWS Recipes read for the IAM role a service assumes. tags is
  # the key, under the same name, that the catalog's terraform AWS Recipes
  # read for a resource's tags, so a Release names them once whichever
  # Recipe it configures.
  #
  # role_arn names the IAM role Amazon Lex uses to build and run the bot, as
  # the ARN of a role, arn:<partition>:iam::<account>:role/ followed by its
  # path and name, of 32 to 2,048 characters (the API Reference's
  # CreateBot), and is required: the resource schema requires it. The role,
  # with a trust policy letting lexv2.amazonaws.com assume it and the
  # permissions the bot needs, such as polly:SynthesizeSpeech for a spoken
  # answer, is the operator's, named here and never created. Changing it
  # updates the bot in place and replaces the version, as below.
  #
  # tags tag the bot and the alias, as a map from each tag name to a string,
  # written as the list of key and value pairs bot_tags and bot_alias_tags
  # take: a name of 1 to 128 characters and a value of at most 256, neither
  # prefixed with aws: (the description of BotTags in the AWS::Lex::Bot
  # resource schema the provider is generated from; the API Reference's
  # TagResource), while how many a bot takes, at most 200, is Lex's to
  # judge. The version takes no tags (its resource schema marks it not
  # taggable). That description says tags "can only be added at bot
  # creation", while the resource schema's tagging section marks them
  # updatable, so what a change of the tags does to a deployed bot is not
  # verified.
  #
  # host is refused by name. A bot publishes no address of its own: a caller
  # reaches Amazon Lex's runtime endpoint in the bot's Region, which the
  # service names, and names the bot and the alias by their IDs in each
  # call, so this Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.child_directed (data_privacy.child_directed),
  #     values.idle_session_ttl_in_seconds (idle_session_ttl_in_seconds),
  #     values.bot_locales (bot_locales, whose keys are the Component's own:
  #     locale_id, nlu_confidence_threshold and so on down every key of the
  #     subset), and the overrides above.
  #   refused — a role_arn not set or other than a role's ARN; an intent
  #     named FallbackIntent; tags that are not a map of strings, or of
  #     another form; infra.overrides.host; and any infra.overrides key not
  #     listed above.
  #   held by the Component — the session time's range; at least one locale;
  #     the subset's keys, each level's required keys, its names, its ranges
  #     and its values, one locale per locale_id and one intent, slot and
  #     slot type per name; a slot's type naming a slot type of its locale or
  #     a built-in one; and the component's name, which names the bot and the
  #     alias, to the names Lex takes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the body writes beside the values. The provider creates the bot
  # through the Cloud Control API, which runs the handlers of the
  # CloudFormation resource type AWS::Lex::Bot, and the CloudFormation
  # reference for that type says: "You must configure an intent based on
  # the AMAZON.FallbackIntent built-in intent. If you don't add one,
  # creating the bot will fail." Each locale therefore also holds the
  # intent FallbackIntent, whose parent_intent_signature is
  # AMAZON.FallbackIntent: the intent Lex itself adds to a locale created
  # through its API (the Amazon Lex V2 Developer Guide's
  # "AMAZON.FallbackIntent"). An intent of the developer's under the same
  # name would make two intents of one name in a locale, which Lex refuses
  # (CreateIntent: "Intent names must be unique in the locale"), so it
  # halts the build. Lex refuses to build a locale whose intent holds a slot
  # without a priority. That is the failure reported in the AWS Terraform
  # provider's issue 39948 ("Slot ids [...] in intent ... don't define a
  # slot priority"), a report and not AWS text, so each intent holding slots
  # also takes slot_priorities, the first slot listed at priority 1 and each
  # next one a step after it. Every other argument is left out, so Lex's
  # defaults hold: no code hook, context, confirmation, closing, generative
  # AI or speech setting; auto_build_bot_locales unset; no
  # test_bot_alias_settings or test_bot_alias_tags. The alias takes no
  # bot_alias_locale_settings, so no Lambda code hook runs, and no
  # conversation logs or sentiment analysis. Tags aside, which no
  # CloudFormation Recipe of this catalog reads, these are the settings the
  # cloudformation Recipe of this Component writes, so both targets create
  # the same bot.
  #
  # Why a version and an alias. A runtime call names an alias beside the bot
  # (RecognizeText's botAliasId), and the Amazon Lex V2 Developer Guide's
  # "Versioning and aliases with your Lex V2 bot" says the alias Lex creates
  # with every bot, TestBotAlias, runs the Draft and "should only be used for
  # manual testing", Lex limiting its runtime requests, and recommends a
  # version and an alias pointing to it for a client application. The
  # version snapshots the bot's Draft into a numbered version, taking every
  # locale from DRAFT; a locale not yet built is built first (the
  # CloudFormation reference's example for AWS::Lex::Bot: "Locale builds are
  # also kicked off if you attempt to create a bot version that depends on
  # an unbuilt locale"), and a locale Lex cannot build fails the apply. The
  # alias, named after the component, points to the version.
  #
  # A change. A version is a snapshot that never changes: the resource type
  # AWS::Lex::BotVersion has no update handler, and the provider creates a
  # version only when it creates the version's resource. The version
  # therefore names, in replace_triggered_by, what a version holds of the
  # bot: the locales, the role, the session time and the data privacy
  # setting, each of which DescribeBotVersion returns for a version. A
  # change Terraform plans to any of them updates the bot in place, the
  # provider replacing it for no argument this body writes, and replaces
  # the version (the Terraform language's lifecycle meta-argument), which
  # names the bot and is created after the bot's update. Under
  # create_before_destroy Terraform creates the new version, updates the
  # alias to point to it, and then deletes the old one. Lex runs
  # in-progress sessions on the version they started on and new sessions on
  # the new one (the Developer Guide's same page); what happens to a session
  # still running on the old version when it is deleted is not documented
  # and not verified. That Terraform plans the replacement for each change
  # is what the Terraform language documents for replace_triggered_by, and
  # is not measured against an account. The Cloud Control API rolls back
  # nothing that fails part way (its User Guide's "Considerations when using
  # Cloud Control API"): a locale Lex cannot build leaves the bot updated,
  # the new version failed and the alias on the version before.
  #
  # The provider and its credentials. Terraform calls the Cloud Control API,
  # whose actions IAM names in the cloudformation: namespace, so the
  # identity applying the Release needs cloudformation:CreateResource,
  # GetResource, UpdateResource, DeleteResource and
  # GetResourceRequestStatus. The provider block names no service role
  # (its optional role_arn), so the Cloud Control API "creates a temporary
  # session using your AWS user credentials" and calls Amazon Lex with it,
  # for up to 24 hours (the Cloud Control API User Guide's "Specifying
  # credentials"): the same identity also needs the permissions the handlers
  # sections of the AWS::Lex::Bot, AWS::Lex::BotVersion and
  # AWS::Lex::BotAlias resource type schemas list, among them iam:PassRole
  # on the role above, lex:CreateBot, lex:BuildBotLocale,
  # lex:CreateBotVersion and lex:CreateBotAlias. The provider's own
  # documentation says it marks every optional argument computed, so it
  # detects no drift in an argument the body leaves unset; nor does it read
  # back the bot's locales or tags, which it treats as write-only, so a
  # change made to them outside Terraform is not detected.
  #
  # The name. The bot and the alias are named after the component, whose
  # name is the module's too. Renaming the component renames the module, so
  # Terraform deletes the old bot, version and alias and creates new ones
  # under the new name, unordered, and consumers read new IDs. A bot name is
  # unique in the account (CreateBot), so two Releases deploying a component
  # of one name into one account and Region collide.
  #
  # Deletion. A destroy, or removing the component, deletes the alias, then
  # the version, then the bot. A bot holds its definition, which the Release
  # writes each time it deploys, so this Recipe configures no backup.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Lex bot publishes no address of its own: a caller reaches the Amazon Lex runtime endpoint in its Region and names the bot by agent_id and its alias by bot_alias_id: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k (list "role_arn" "tags")) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads role_arn and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The role a bot runs as is the operator's, and the resource schema
    # requires it.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "role_arn") -}}
      {{- fail "infra.overrides.role_arn is not set, and an Amazon Lex bot is built and runs as the IAM role the operator names by its ARN: set infra.overrides.role_arn in the Release, such as arn:aws:iam::123456789012:role/example-lex-role" -}}
      {{- end -}}
    # role_arn the ARN of a role, of 32 to 2,048 characters (CreateBot's
    # roleArn); tags the map of strings, each name and value of the form the
    # resource schema describes. The override keys are spelt for this target,
    # so the checks sit in this Recipe and not in the realization-neutral
    # Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "role_arn" -}}
      {{- if not (and (typeIs "string" $o.role_arn) (ge (len $o.role_arn) 32) (le (len $o.role_arn) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.role_arn)) -}}
      {{- fail (printf "infra.overrides.role_arn is %s, and Amazon Lex takes the IAM role a bot runs as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 32 to 2048 characters: set it to such an ARN in the Release" (toJson $o.role_arn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the bot and its alias take tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- range $k, $v := $g -}}
      {{- if not (and (regexMatch `^(?s).{1,128}$` $k) (regexMatch `^(?s).{0,256}$` $v) (not (hasPrefix "aws:" $k)) (not (hasPrefix "aws:" $v))) -}}
      {{- fail (printf "infra.overrides.tags holds %s: %s, and Amazon Lex takes a tag name of 1 to 128 characters and a value of at most 256, neither prefixed with aws:, which the resource schema forbids: correct it in the Release" (toJson $k) (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # The body writes the intent FallbackIntent into every locale, and Lex
    # takes each intent name once in a locale (the header above).
    bot_locales: >-
      {{- range $i, $l := .values.bot_locales -}}
      {{- range $in := (get $l "intents" | default list) -}}
      {{- if eq $in.name "FallbackIntent" -}}
      {{- fail (printf "values.bot_locales[%d] declares an intent named FallbackIntent, and on Terraform this Recipe writes the intent FallbackIntent, built on AMAZON.FallbackIntent, into every locale, while Amazon Lex takes each intent name once in a locale: rename the intent in the Aggregate" $i) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/awscc, which declares the bot, its
  # version and its alias, at the string the catalog conventions' "One AWS
  # Cloud Control provider constraint for every body using it" section
  # states, and hashicorp/aws at the string of their "One AWS provider
  # constraint for every AWS body" section, for the aws_region data source
  # the provider file below reads; each body repeats them deliberately,
  # because a library import cannot place a block inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Amazon Lex module. The resources are named this, since each component's
  # body renders into a module directory of its own. The values reach it as
  # the Component's schema and assertions hold them: a whole number of
  # seconds from 60 to 86,400, a boolean, and locales in the subset, every
  # key in its place. The Component's keys are the provider's own attribute
  # names, so each locale is written as one object of them. Each text and
  # tag reaches Lex as written: Terraform would read ${ and %{ inside a
  # string as the start of an interpolation or a directive, so they are
  # written $${ and %%{, which Terraform turns back into the characters
  # written.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $locales := list -}}
      {{- range $l := .values.bot_locales -}}
      {{- $intents := list -}}
      {{- range $in := (get $l "intents" | default list) -}}
      {{- $i := dict "name" $in.name -}}
      {{- with get $in "sample_utterances" -}}
      {{- $us := list -}}
      {{- range . }}{{ $us = append $us (dict "utterance" .utterance) }}{{ end -}}
      {{- $_ := set $i "sample_utterances" $us -}}
      {{- end -}}
      {{- with get $in "slots" -}}
      {{- $ss := list }}{{ $pr := list -}}
      {{- range $n, $s := . -}}
      {{- $e := dict "slot_constraint" $s.value_elicitation_setting.slot_constraint -}}
      {{- with get $s.value_elicitation_setting "prompt_specification" -}}
      {{- $gs := list -}}
      {{- range .message_groups_list }}{{ $gs = append $gs (dict "message" (dict "plain_text_message" (dict "value" .message.plain_text_message.value))) }}{{ end -}}
      {{- $_ := set $e "prompt_specification" (dict "message_groups_list" $gs "max_retries" .max_retries) -}}
      {{- end -}}
      {{- $ss = append $ss (dict "name" $s.name "slot_type_name" $s.slot_type_name "value_elicitation_setting" $e) -}}
      {{- $pr = append $pr (dict "priority" (add $n 1) "slot_name" $s.name) -}}
      {{- end -}}
      {{- $_ := set $i "slots" $ss }}{{ $_ := set $i "slot_priorities" $pr -}}
      {{- end -}}
      {{- $intents = append $intents $i -}}
      {{- end -}}
      {{- $intents = append $intents (dict "name" "FallbackIntent" "parent_intent_signature" "AMAZON.FallbackIntent") -}}
      {{- $loc := dict "locale_id" $l.locale_id "nlu_confidence_threshold" $l.nlu_confidence_threshold "intents" $intents -}}
      {{- with get $l "slot_types" -}}
      {{- $sts := list -}}
      {{- range $st := . -}}
      {{- $t := dict "name" $st.name -}}
      {{- with get $st "slot_type_values" -}}
      {{- $vs := list -}}
      {{- range . -}}
      {{- $v := dict "sample_value" (dict "value" .sample_value.value) -}}
      {{- with get . "synonyms" }}{{ $sy := list }}{{ range . }}{{ $sy = append $sy (dict "value" .value) }}{{ end }}{{ $_ := set $v "synonyms" $sy }}{{ end -}}
      {{- $vs = append $vs $v -}}
      {{- end -}}
      {{- $_ := set $t "slot_type_values" $vs -}}
      {{- end -}}
      {{- with get $st "value_selection_setting" }}{{ $_ := set $t "value_selection_setting" (dict "resolution_strategy" .resolution_strategy) }}{{ end -}}
      {{- $sts = append $sts $t -}}
      {{- end -}}
      {{- $_ := set $loc "slot_types" $sts -}}
      {{- end -}}
      {{- $locales = append $locales $loc -}}
      {{- end -}}
      {{- $tags := list -}}
      {{- range $k, $v := (optional $o "tags" dict) }}{{ $tags = append $tags (dict "key" $k "value" $v) }}{{ end -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
          awscc = {
            source  = "hashicorp/awscc"
            version = "~> 1.110"
          }
        }
      }

      resource "awscc_lex_bot" "this" {
        name                        = {{ toJson .context.instance_id }}
        idle_session_ttl_in_seconds = {{ toJson .values.idle_session_ttl_in_seconds }}

        data_privacy = {
          child_directed = {{ toJson .values.child_directed }}
        }

        bot_locales = [
          {{- range $locales }}
          {{ toJson . | replace "${" "$${" | replace "%{" "%%{" }},
          {{- end }}
        ]

        ## ── Provider-specific overrides ──────────────────────────
        role_arn = {{ toJson $o.role_arn }}
        {{- if $tags }}
        bot_tags = {{ toJson $tags | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      resource "awscc_lex_bot_version" "this" {
        bot_id = awscc_lex_bot.this.bot_id

        bot_version_locale_specification = [
          {{- range $locales }}
          {
            locale_id = {{ toJson .locale_id | replace "${" "$${" | replace "%{" "%%{" }}
            bot_version_locale_details = {
              source_bot_version = "DRAFT"
            }
          },
          {{- end }}
        ]

        # A version is a snapshot of the bot's Draft, so a change of what it
        # holds takes a new one, created before the old one is deleted.
        lifecycle {
          create_before_destroy = true
          replace_triggered_by = [
            awscc_lex_bot.this.bot_locales,
            awscc_lex_bot.this.role_arn,
            awscc_lex_bot.this.idle_session_ttl_in_seconds,
            awscc_lex_bot.this.data_privacy,
          ]
        }
      }

      resource "awscc_lex_bot_alias" "this" {
        bot_alias_name = {{ toJson .context.instance_id }}
        bot_id         = awscc_lex_bot.this.bot_id
        bot_version    = awscc_lex_bot_version.this.bot_version
        {{- if $tags }}

        ## ── Provider-specific overrides ──────────────────────────
        bot_alias_tags = {{ toJson $tags | replace "${" "$${" | replace "%{" "%%{" }}
        {{- end }}
      }

      output "agent_id" {
        value = awscc_lex_bot.this.bot_id
      }

      output "bot_alias_id" {
        value = awscc_lex_bot_alias.this.bot_alias_id
      }

      output "arn" {
        value = awscc_lex_bot.this.arn
      }

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares the
  # same file with the same bytes; the same name with other bytes halts the
  # build. A provider is configured in the root, which the module inherits,
  # and the awscc provider reads no configuration of the AWS provider: it
  # requires a Region of its own, from its block, AWS_DEFAULT_REGION or the
  # shared configuration file (its documentation). Its block therefore sets
  # the Region the aws_region data source reads from the AWS provider the
  # root configures, so the bot is created in the Region every other AWS
  # resource of the root is; it reads its credentials from the environment
  # Terraform runs in, as the AWS provider does. The files declare no
  # required_providers block: they belong to the root configuration, where
  # a second such block, from another component's file, would fail init;
  # the module's own block above sets the versions the root installs.
  # Terraform destroys the module's resources with the provider this block
  # configures, so the files stay while any component declaring them does:
  # remove the last of them from a Release only after destroying what their
  # modules created, since without the block the provider takes no Region
  # from the AWS provider.
  boundary:
    artifacts:
      provider-awscc.tf: |
        provider "awscc" {
          region = data.aws_region.current.region
        }
      aws-region.tf: |
        data "aws_region" "current" {}
