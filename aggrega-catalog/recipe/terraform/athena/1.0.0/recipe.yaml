apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: athena
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Athena, rendered as an authored Terraform body, main.tf: one
    aws_athena_workgroup named after the component. work_group publishes a
    Terraform reference to the workgroup's name, an output of this
    component's module, which Terraform resolves when it applies.

    Query results go to the Amazon S3 location output_location names, in
    the operator's bucket, or, with none named, to storage Athena manages,
    which keeps them for 24 hours. kms_key_id names the operator's KMS key
    encrypting them, bytes_scanned_cutoff_per_query the most bytes one
    query may scan before Athena cancels it, and tags the workgroup's
    tags. The workgroup's settings
    override a client's own, it publishes query metrics to CloudWatch, and
    Athena chooses its engine version.

    A workgroup that has run a query holds query executions, and Athena
    refuses to delete it without force_destroy, which this Recipe leaves
    off: removing or renaming its component makes the destroy fail and the
    apply stop. No bucket, key or role is created. infra.overrides.host
    halts the build, since a client reaches every workgroup at Athena's endpoint in
    its Region, as do a value Athena or the AWS provider cannot take and
    any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: terraform
  implements: core/bigdata/athena:1.0.0

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this workgroup, and resolves none of it.
  # work_group is a reference to the work_group output of this component's
  # module call: the body renders into the component's own module directory,
  # and the boundary's root configuration declares that directory as a module
  # block named .context.instance_id for a component declared in the Aggregate
  # the Release deploys. The reference resolves only for a consumer authored
  # as a source: Recipe in the same Terraform root configuration, which
  # Terraform then applies after this module; a consumer on another target
  # receives it as text. The output is the workgroup's name.
  provides:
    work_group: "${module.{{ .context.instance_id }}.work_group}"

  # This Recipe reads from infra.overrides:
  #   output_location                - string (configuration.result_configuration.output_location, an s3:// location)
  #   bytes_scanned_cutoff_per_query - integer (configuration.bytes_scanned_cutoff_per_query, in bytes)
  #   kms_key_id                     - string (the results' KMS key ARN: result_configuration.encryption_configuration.kms_key_arn, or managed_query_results_configuration.encryption_configuration.kms_key)
  #   tags                           - map[string]string (the workgroup's tags)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # A key is the Terraform argument name, which is what a reader matches
  # against provider documentation, unless the catalog's AWS Recipes share one
  # spelling for a concept: kms_key_id is the name other AWS Recipes in the
  # catalog read for a KMS key, and the table gives the arguments it sets.
  #
  # output_location is where Athena writes each query's results: an Amazon S3
  # location, s3:// followed by the operator's bucket and an optional prefix,
  # set as configuration.result_configuration.output_location. The bucket is
  # the operator's and this Recipe never creates it. The bucket's name follows
  # Amazon S3's rule for a bucket name, 3 to 63 lowercase letters, digits,
  # periods and hyphens beginning and ending with a letter or a digit (the
  # Amazon S3 User Guide's bucket naming rules), and a location of another
  # shape halts the build. Unset, the body turns on
  # configuration.managed_query_results_configuration instead: Athena keeps
  # the results in storage it manages, for 24 hours, after which it deletes
  # them, and a client reads them through GetQueryResults and
  # GetQueryResultsStream (the Athena User Guide's page on managed query
  # results). The AWS provider refuses an output_location beside enabled
  # managed query results, so the body writes one or the other.
  #
  # kms_key_id is the ARN of the operator's KMS key: the AWS provider takes
  # both of the arguments it sets as an ARN alone and refuses a key ID or an
  # alias name. With output_location it sets
  # result_configuration.encryption_configuration, encryption_option SSE_KMS
  # and kms_key_arn, so Amazon S3 encrypts each result with the key; the
  # Athena API reference's EncryptionConfiguration names the key ARN or ID
  # there, so the ARN of an alias halts the build. With managed query results
  # it also takes the ARN of an alias naming the key, and sets
  # managed_query_results_configuration.encryption_configuration.kms_key,
  # whose key policy lets the service principal
  # encryption.athena.amazonaws.com use the key (the managed query results
  # page). Unset, results in the operator's bucket take the bucket's default
  # encryption and managed results are encrypted with a key AWS owns.
  #
  # bytes_scanned_cutoff_per_query is the most data, in bytes, one query in
  # the workgroup may scan; Athena cancels a query that scans more (the Athena
  # User Guide's page on data usage controls). The AWS provider takes a whole
  # number of at least 10485760, above the 10000000 Athena's API takes, or 0,
  # which it reads as no limit; this Recipe refuses 0 with a message of its
  # own, since leaving the key unset says that, and any other value halts the
  # build. Unset, the body writes none and a query's scan has no limit.
  #
  # tags tag the workgroup, as a map from each tag name to a string.
  #
  # host is refused by name. Athena publishes no address of a workgroup: a
  # client calls Athena's endpoint in the workgroup's Region, an endpoint the
  # service names and offers no custom domain for, and names the workgroup in
  # the call, so this Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the overrides above.
  #   refused — an override of the wrong shape; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the
  #     workgroup.
  #   not read — none; the Component declares no values and no other infra key.
  #
  # The name. The workgroup is named after the component, and its name is
  # fixed when it is created. A rename is a new workgroup under a new name,
  # which starts with no query history or saved queries, and Terraform
  # destroys the old one, which Athena refuses while it holds any (see
  # Deletion).
  #
  # The settings the body writes on every workgroup:
  # enforce_workgroup_configuration true, so the workgroup's results location
  # and encryption hold for every query run in it, whatever a client's own
  # settings name (the Athena User Guide's page on overriding client-side
  # settings), and publish_cloudwatch_metrics_enabled true, so the workgroup's
  # query metrics reach CloudWatch; both are the AWS provider's defaults,
  # written out so the body states every setting it relies on. The engine
  # version is not set, so Athena selects it (AUTO, the API's default)
  # and the workgroup's effective version is the one the service chooses. The
  # workgroup is an Athena SQL workgroup, which runs each query under its
  # caller's identity: execution_role applies to Apache Spark and IAM Identity
  # Center workgroups alone, and is not written.
  #
  # Deletion. The body sets no force_destroy, whose default is false and which
  # the AWS provider passes as the DeleteWorkGroup call's RecursiveDeleteOption.
  # The Athena API's DeleteWorkGroup reference says that option is what deletes
  # a workgroup "even if the workgroup contains any named queries, query
  # executions, or notebooks", so without it Athena refuses to delete a
  # workgroup that holds any, and a workgroup that has run a query holds query
  # executions. Removing the component from the Aggregate, or renaming it,
  # therefore makes the destroy of the old workgroup fail with Athena's error
  # and the apply stop, and an operator removes the workgroup outside
  # Terraform once its queries are gone. A workgroup that has run none is
  # destroyed cleanly. The data a query reads, and the results in the
  # operator's bucket, are not the workgroup's, and stay when it is destroyed.
  assertions:
    overrides_known: >-
      {{- $known := list "output_location" "bytes_scanned_cutoff_per_query" "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon Athena publishes no address of a workgroup: a client calls Athena's endpoint in the workgroup's Region, which offers no custom domain, and names the workgroup by work_group: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads output_location, bytes_scanned_cutoff_per_query, kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # Each of these overrides is passed to the resource as written, so one of
    # another shape would render an argument the AWS provider or Athena
    # refuses.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "output_location" -}}
      {{- if not (and (typeIs "string" $o.output_location) (regexMatch `^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/\S*)?$` $o.output_location)) -}}
      {{- fail (printf "infra.overrides.output_location is %s, and the workgroup takes its results location as s3:// followed by an Amazon S3 bucket name, 3 to 63 lowercase letters, digits, periods and hyphens beginning and ending with a letter or a digit, and an optional /prefix: set it in the Release to such a location in the operator's bucket, or remove it for results Athena keeps itself" (toJson $o.output_location)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "bytes_scanned_cutoff_per_query" -}}
      {{- $v := $o.bytes_scanned_cutoff_per_query -}}
      {{- $ok := or (kindIs "int" $v) (kindIs "int64" $v) (and (kindIs "float64" $v) (eq (float64 (int64 $v)) $v)) -}}
      {{- if and $ok (eq (int64 $v) 0) -}}
      {{- fail "infra.overrides.bytes_scanned_cutoff_per_query is 0, which the AWS provider reads as no limit, and this Recipe leaves the limit off by an unset key rather than a zero: remove it from the Release for no limit, or set it to a whole number of bytes, at least 10485760" -}}
      {{- end -}}
      {{- if $ok }}{{ $ok = ge (int64 $v) 10485760 }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.bytes_scanned_cutoff_per_query is %s, and the AWS provider takes the most data one query may scan as a whole number of bytes, at least 10485760: set it in the Release to such a number, or remove it for no limit" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^arn:[^:\s]+:kms:[^:\s]*:[0-9]{12}:(key|alias)/\S+$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and the AWS provider takes the KMS key the workgroup's query results are encrypted with by its ARN, arn:<partition>:kms:<region>:<account>:key/<id>, or the ARN of an alias naming it: set it to one in the Release, or remove it" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (hasKey $o "output_location") (hasKey $o "kms_key_id") (typeIs "string" $o.kms_key_id) (regexMatch `:alias/` $o.kms_key_id) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, the ARN of an alias, and with infra.overrides.output_location set the results are encrypted through Athena's S3 encryption configuration, which names the KMS key by its key ID or key ARN: set kms_key_id in the Release to the key's ARN, or remove output_location for results Athena keeps itself, which take an alias ARN" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the workgroup takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # required_providers pins hashicorp/aws so the engine installs a provider
  # whose resource schema this body was written against. It is a range rather
  # than an exact version because every AWS body in a boundary's root
  # configuration shares one installed provider, and two exact pins that differ
  # fail init. The constraint string is the one the catalog conventions'
  # "One AWS provider constraint for every AWS body" section states; each AWS
  # body repeats it deliberately, because a library import cannot place a block
  # inside an authored body.
  #
  # The body is the catalog's own, a full-body artifact named main.tf that
  # emits verbatim as a standalone file alongside any other artifacts
  # contributed at the same boundary: terraform-aws-modules publishes no
  # Athena module. The resource is named this, since each component's body
  # renders into a module directory of its own.
  artifacts:
    main.tf: |
      {{- $o := optional .infra "overrides" dict -}}
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.69"
          }
        }
      }

      resource "aws_athena_workgroup" "this" {
        name = "{{ .context.instance_id }}"

        configuration {
          enforce_workgroup_configuration    = true
          publish_cloudwatch_metrics_enabled = true

          ## ── Provider-specific overrides ──────────────────────────
          {{- if hasKey $o "bytes_scanned_cutoff_per_query" }}
          bytes_scanned_cutoff_per_query = {{ int64 $o.bytes_scanned_cutoff_per_query }}
          {{- end }}
          {{- with optional $o "output_location" "" }}

          result_configuration {
            output_location = {{ toJson . }}
            {{- with optional $o "kms_key_id" "" }}

            encryption_configuration {
              encryption_option = "SSE_KMS"
              kms_key_arn       = {{ toJson . }}
            }
            {{- end }}
          }
          {{- else }}

          managed_query_results_configuration {
            enabled = true
            {{- with optional $o "kms_key_id" "" }}

            encryption_configuration {
              kms_key = {{ toJson . }}
            }
            {{- end }}
          }
          {{- end }}
        }
        {{- with optional $o "tags" "" }}

        tags = {{ toJson . }}
        {{- end }}
      }

      output "work_group" {
        value = aws_athena_workgroup.this.name
      }
