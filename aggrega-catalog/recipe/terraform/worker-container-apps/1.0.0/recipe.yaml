apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-container-apps
  version: 1.0.0
  description: >
    The generic background-worker primitive as one Azure Container Apps app
    running the Release's image, through a Terraform module kept beside this
    Recipe. Reach for it in an Azure subscription with a Container Apps
    environment; for terraform/worker-ecs or cloudformation/worker-ecs in an
    AWS account, terraform/worker-cloud-run on Google Cloud, and helm/worker
    on Kubernetes.

    The app declares no ingress, so nothing reaches it. The environment and
    resource group are the operator's, each required under infra.overrides;
    user-assigned identities and a private registry, its password read from
    Key Vault by reference, are optional. Only the app is emitted — no
    environment, network, identity, registry, Key Vault or log workspace, each
    the operator's.

    Each env entry an edge's inject block, or the component's own, dictates
    becomes a container variable under that name, written whole, so a
    neighbour's Terraform reference is evaluated by the engine, and each file
    entry a secret mounted alone at the path named; concurrency and
    queue_depth_hint arrive by default as WORKER_CONCURRENCY and
    WORKER_QUEUE_DEPTH_HINT.
    No edge may dictate those while they are the defaults, or a name
    Container Apps sets itself; arg and
    other entries are refused by name. The app runs exactly infra.replicas
    replicas at the smallest Consumption size meeting infra.compute.cpu and
    infra.compute.memory, so the Component's defaults run at 0.25 vCPU and 0.5
    GiB.

    Azure/avm-res-app-containerapp/azurerm is not sourced: at 0.9.0, its
    newest, it calls Azure/avm-utl-interfaces/azure from the registry, which
    init fetches outside the pin.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/worker:1.0.0

  # The module this Recipe vendors lives beside it, and is copied verbatim into
  # the component's own directory; entity.lock pins its files. Its main.tf
  # constrains hashicorp/azurerm to 4.18 and later below 6, and says why: the
  # module sits in one root configuration beside the azurerm 4 flexible server,
  # terraform/postgres-flexible-server, or beside the azurerm 5 Recipes,
  # terraform/redis-azure-managed, azure-openai, azure-openai-embedding and
  # azure-api-management. It carries no provider block: the boundary file below
  # configures the provider at the root, and the module inherits it.
  #
  # Microsoft's Azure Verified Modules programme publishes a container app
  # module, Azure/avm-res-app-containerapp/azurerm, at 0.9.0 its newest version,
  # MIT. Its root calls Azure/avm-utl-interfaces/azure at 0.5.0 from the
  # registry, a module terraform init downloads at whatever it then resolves,
  # which neither the entity's lock nor Terraform's covers. The module is
  # therefore not sourced, and the app is declared here instead, as the one
  # resource the module beside this Recipe holds, with the azurerm provider's
  # azurerm_container_app resource.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   resource_group_name          - string (resource_group_name), required
  #   container_app_environment_id - string (container_app_environment_id), required
  #   identity_ids                 - []string (identity_ids)
  #   registry_server              - string (registry_server)
  #   registry_identity            - string (registry_identity)
  #   registry_username            - string (registry_username)
  #   registry_password_secret_id  - string (registry_password_secret_id)
  #   registry_password_identity   - string (registry_password_identity)
  #   registry_password            - refused: the password is read from Key Vault
  #
  # Each is passed to the module input named in brackets. Each module input is
  # named for the resource argument it sets, an argument inside a block by the
  # block's name and its own joined with an underscore; identity_ids sets the
  # app's identity block, and registry_password_secret_id and
  # registry_password_identity the Key Vault reference of the secret the
  # registry password is read from. resource_group_name is the spelling the
  # catalog's other terraform Azure Recipes read for the same concept, so an
  # operator writes it under one name across them. These are the keys
  # terraform/server-container-apps reads, under the same names.
  #
  # resource_group_name and container_app_environment_id are required and
  # neither has a default: the resource group and the Container Apps
  # environment the app runs in are provisioned outside this Release, no
  # subscription-independent value exists for either, and this Recipe never
  # chooses an environment, and with it a network, for the operator.
  # container_app_environment_id is the environment's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>;
  # the environment decides the network the app's egress leaves through and
  # where the app's logs go: Container Apps sets a log destination on the
  # environment, and an app takes none of its own, so this Recipe reads none.
  #
  # identity_ids are the resource IDs of user-assigned managed identities that
  # already exist, which the worker's code calls Azure with. A private image is
  # pulled from registry_server, the registry's host name, either with
  # registry_identity, a user-assigned identity granted pull on the registry, or
  # with registry_username and a password Container Apps reads from the Key
  # Vault secret registry_password_secret_id names, with the user-assigned
  # identity registry_password_identity names. Each identity named for the
  # registry is given to the app as well, since Container Apps takes them only
  # from the app's own identities. A password written as text would be written
  # into the rendered configuration, so it is taken only by that reference, and
  # a system-assigned identity, which Azure creates with the app, is not one
  # this Recipe names. With no registry key set the image is pulled as a public
  # one.
  #
  # The replica count. The app declares no ingress and no scale rule, and its
  # minimum and maximum replica count are both infra.replicas, so Container
  # Apps runs exactly that many; a minimum of one or more is what keeps an app
  # without ingress running at all. The azurerm provider takes 1 to 300.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the two developer values. They are
  # delivered under the names helm/worker delivers them under, and only when
  # the developer set them, so an unset value renders no variable rather than
  # an empty one; those names are defaults, which the component's own inject
  # block may replace, as the comment above valuesMapping describes.
  #
  # Every Component value and infra key is honoured or refused below by name:
  #   honoured — values.concurrency and values.queue_depth_hint as above,
  #     infra.image (required), infra.replicas as the replica count,
  #     infra.compute.cpu and infra.compute.memory as the size below, and the
  #     overrides above.
  #   refused — a compute quantity this Recipe cannot read, and a pair larger
  #     than the largest size; more than 300 replicas; a component name
  #     Container Apps does not take for an app; an edge or the component's own
  #     inject block injecting a variable under one of the two default names the
  #     developer values are delivered under, or under a name Container Apps
  #     sets itself; and an edge's arg or
  #     custom-mechanism entry, as the comment above valuesMapping describes.
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image running the worker loop in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; one the Release sets empty leaves the container
    # nothing to be sized by, so each must carry a quantity.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "infra.compute.cpu is empty, so the container app would have no CPU to be sized by: set infra.compute.cpu in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "infra.compute.memory is empty, so the container app would have no memory to be sized by: set infra.compute.memory in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
    compute_fits_container_apps: >-
      {{- if not .locals.cpu_millicores -}}
      {{- fail (printf "infra.compute.cpu is %q, and this Recipe reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms" (toString .infra.compute.cpu)) -}}
      {{- end -}}
      {{- if not .locals.memory_mib -}}
      {{- fail (printf "infra.compute.memory is %q, and this Recipe reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms" (toString .infra.compute.memory)) -}}
      {{- end -}}
      {{- if not .locals.size -}}
      {{- fail (printf "infra.compute asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" (toString .infra.compute.cpu) (toString .infra.compute.memory)) -}}
      {{- end -}}
    replicas_within_provider: >-
      {{- if gt (int .infra.replicas) 300 -}}
      {{- fail (printf "infra.replicas is %v, and the azurerm provider takes a container app's replica count from 1 to 300: set infra.replicas in the Release to 300 or fewer" .infra.replicas) -}}
      {{- end -}}
    environment_and_group_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "resource_group_name" "container_app_environment_id" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release runs its worker as an app in the operator's own Azure Container Apps environment and resource group, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.resource_group_name and infra.overrides.container_app_environment_id in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.App/managedEnvironments/[^/]+$` $o.container_app_environment_id) -}}
      {{- fail (printf "infra.overrides.container_app_environment_id is %q, and this Recipe takes the Container Apps environment the app runs in as the environment's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $o.container_app_environment_id) -}}
      {{- end -}}
    # Each identity is a user-assigned one that already exists, named by its
    # resource ID, and the registry password a Key Vault secret named by its ID,
    # so no identity is created and no credential's value is written.
    optional_overrides_typed: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` -}}
      {{- if hasKey $o "registry_password" -}}
      {{- fail "infra.overrides.registry_password is set, and this Recipe takes a registry password only by reference, so that its value is never written into the rendered configuration: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := index $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_identity" "registry_password_identity" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_server" "registry_username" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as a string: set it in the Release to one, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "registry_password_secret_id" -}}
      {{- $v := index $o "registry_password_secret_id" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) -}}
      {{- fail (printf "infra.overrides.registry_password_secret_id is %s, and this Recipe reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" -}}
      {{- $set := list -}}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end -}}
      {{- if and $set (not (hasKey $o "registry_server")) -}}
      {{- fail (printf "infra.overrides.%s is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set)) -}}
      {{- end -}}
      {{- if hasKey $o "registry_server" -}}
      {{- $missing := list -}}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end -}}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) 3) -}}
      {{- fail "infra.overrides sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" -}}
      {{- end -}}
      {{- if and (not (hasKey $o "registry_identity")) $missing -}}
      {{- fail (printf "infra.overrides.registry_server names a private registry, and this Recipe pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" (first $missing)) -}}
      {{- end -}}
      {{- end -}}

  # The app's size, read off the table of Container Apps' "vCPU and memory
  # allocation requirements", which every app on the Consumption plan meets:
  # 0.25 vCPU with 0.5 GiB, and each step of 0.25 vCPU with 0.5 GiB more, to 4
  # vCPU with 8 GiB. The app runs on the environment's Consumption workload
  # profile, the one Container Apps places an app on when it names none, at the
  # first size meeting both the CPU and the memory infra.compute asks for. Each
  # requested quantity is a floor: the container may be given more than was
  # written, and is billed for what it is given. The Component's defaults, 100m
  # and 128Mi, are below the smallest size, so they run at 0.25 vCPU and 0.5
  # GiB. An environment of the Consumption-only type takes 2 vCPU with 4 GiB at
  # most, which the build cannot see: a larger size fails when Terraform
  # applies. A size the table adds later is not chosen until it is listed here.
  # These locals are the ones terraform/server-container-apps declares, word for
  # word, and a change to the table is made to both; cpu_millicores and
  # memory_mib are also the locals the Amazon ECS and Cloud Run Recipes declare.
  locals:
    # The requested CPU in millicores, or empty when it is not a quantity this
    # Recipe reads: whole millicores, or vCPUs with at most three decimals.
    cpu_millicores: >-
      {{- $c := toString (optional (optional .infra "compute" dict) "cpu" "") -}}
      {{- if regexMatch `^[0-9]+m$` $c -}}{{ atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c -}}
      {{- $p := splitList "." $c -}}{{- $f := 0 -}}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end -}}
      {{- add (mul (atoi (index $p 0)) 1000) $f -}}
      {{- end -}}
    # The requested memory in MiB, or empty when it is not a quantity this
    # Recipe reads: whole Mi or Gi.
    memory_mib: >-
      {{- $m := toString (optional (optional .infra "compute" dict) "memory" "") -}}
      {{- if regexMatch `^[0-9]+Mi$` $m -}}{{ atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m -}}{{ mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end -}}
    # The first size meeting both, as vcpu/memory in the table's own spelling,
    # or empty when none does.
    size: >-
      {{- $found := "" -}}
      {{- if and .locals.cpu_millicores .locals.memory_mib -}}
      {{- $mc := atoi .locals.cpu_millicores -}}{{- $mib := atoi .locals.memory_mib -}}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") -}}
      {{- if and (not $found) (ge (index . 0) $mc) (ge (index . 1) $mib) -}}
      {{- $found = printf "%s/%s" (index . 2) (index . 3) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $found -}}
    size_cpu: '{{ if .locals.size }}{{ index (splitList "/" .locals.size) 0 }}{{ end }}'
    size_memory: '{{ if .locals.size }}{{ index (splitList "/" .locals.size) 1 }}{{ end }}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input. The
  # app is named after the component, so the name is checked here against what
  # Container Apps accepts for one.
  #
  # The environment is read off the inject pipe as a map, and every variable on
  # it becomes one variable of the container, under the name the Aggregate gave
  # it on the edge; this Recipe expects no name of its own, so none is missing
  # whatever the edges deliver. Each value is written whole as the map's value,
  # so a Terraform reference a neighbour publishes, such as
  # ${module.db.fqdn}, reaches the root configuration as an interpolation the
  # engine evaluates there, where the neighbour's module is declared. The two
  # developer values join that map under their default names, unless the
  # component's own inject block delivers them, and an edge or that block
  # delivering either name as well halts, naming which, rather than one value
  # silently replacing the other. Container Apps sets
  # CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME,
  # CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and
  # CONTAINER_APP_REPLICA_NAME in every app itself, so an edge or that block
  # dictating one would collide with the platform's own variable, and it halts
  # here, naming which.
  #
  # Every file entry becomes a file at the path the edge names: its content is
  # one secret of the app, file-0, file-1 and so on in path order, and one
  # Secret volume is mounted by sub path at each path, so the file appears alone
  # there and the rest of its directory stays as the image holds it. Container
  # Apps documents a sub-path mount of a file for a path the image does not
  # already hold, in a directory it does, and documents the sub path for an
  # Azure Files mount; that a Secret volume honours it as well is unverified
  # against a running environment, which no build reaches. A path that is not
  # absolute, or one lying beneath another entry's path, is refused. Container
  # Apps makes no new revision when only a secret changes, so a changed file
  # reaches the container when its replicas next restart. The content is
  # written into the root configuration as the edge resolves it, as an env
  # value is.
  #
  # Every other mechanism on the pipe is refused, naming the entry, its
  # mechanism and the connection that dictated it, so none is dropped: an arg
  # entry, because this Recipe renders no command line, and Container Apps
  # passes a container's arguments to its startup command in place of the
  # image's default ones, which are the Release's; and any custom mechanism.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the container with every other env entry. The
  # names this Recipe gives the two developer values are defaults: each is
  # rendered only while no entry of that block, in any mechanism, delivers its
  # value. The template reads that at .context.self_inject, which maps each name
  # the developer wrote to values.<key> for an entry whose template reads that
  # one own value. A refusal naming a variable that block delivers names the
  # block, rather than an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  valuesMapping: |
    {{- if not (and (regexMatch `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` .context.instance_id) (not (contains "--" .context.instance_id))) }}
    {{- fail (printf "the component %q names its Azure container app, and Container Apps takes a name of 2 to 32 lowercase letters, digits and hyphens that begins with a letter, ends with a letter or a digit and holds no two hyphens together: rename the component in the Aggregate to such a name" .context.instance_id) }}
    {{- end }}
    {{- $inject := default dict .context.inject }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, and those are the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := optional $inject "file" dict }}
    {{- range $path, $_ := $files }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "file" dict) $path }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q by %s, and a file is written at an absolute path inside the container: write that path in the inject block starting with /" $.context.instance_id $path $by) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $env := dict }}
    {{- range $k, $v := optional $inject "env" dict }}{{ $_ := set $env $k $v }}{{ end }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- range $k, $_ := $env }}
    {{- if has $k (list "CONTAINER_APP_NAME" "CONTAINER_APP_REVISION" "CONTAINER_APP_HOSTNAME" "CONTAINER_APP_ENV_DNS_SUFFIX" "CONTAINER_APP_PORT" "CONTAINER_APP_REPLICA_NAME") }}
    {{- $by := "an attachment on the component" }}
    {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- fail (printf "the component %q is handed the variable %q by %s, and Container Apps sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME, CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and CONTAINER_APP_REPLICA_NAME in every app itself, so the two would collide: rename the variable in that inject block" $.context.instance_id $k $by) }}
    {{- end }}
    {{- end }}
    {{- $developer := dict }}
    {{- if not (hasKey $named "values.concurrency") }}{{ with optional .values "concurrency" "" }}{{ $_ := set $developer "WORKER_CONCURRENCY" (toString .) }}{{ end }}{{ end }}
    {{- if and (hasKey .values "queue_depth_hint") (not (hasKey $named "values.queue_depth_hint")) }}{{ $_ := set $developer "WORKER_QUEUE_DEPTH_HINT" (toString (index .values "queue_depth_hint")) }}{{ end }}
    {{- range $k, $v := $developer }}
    {{- if hasKey $env $k }}
    {{- $by := "an attachment on the component" }}
    {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- fail (printf "the component %q delivers its developer value %s to the container as %s, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $.context.instance_id (index (dict "WORKER_CONCURRENCY" "concurrency" "WORKER_QUEUE_DEPTH_HINT" "queue_depth_hint") $k) $k $by) }}
    {{- end }}
    {{- $_ := set $env $k $v }}
    {{- end }}
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    resource_group_name: {{ toJson $o.resource_group_name }}
    container_app_environment_id: {{ toJson $o.container_app_environment_id }}
    image: {{ toJson .infra.image }}
    cpu: "{{ .locals.size_cpu }}"
    memory: "{{ .locals.size_memory }}"
    replicas: {{ .infra.replicas }}
    environment: {{ toJson $env }}
    {{- with $files }}
    files: {{ toJson . }}
    {{- end }}
    {{- with optional $o "identity_ids" "" }}
    identity_ids: {{ toJson . }}
    {{- end }}
    {{- range $k := list "registry_server" "registry_identity" "registry_username" "registry_password_secret_id" "registry_password_identity" }}
    {{- with optional $o $k "" }}
    {{ $k }}: {{ toJson . }}
    {{- end }}
    {{- end }}

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name, such as
  # terraform/postgres-flexible-server. The same name with other bytes halts the
  # build. The azurerm provider refuses to plan without its features block, and
  # a vendored module carries no provider block of its own, so the module
  # inherits this configuration; the provider reads its credentials and
  # subscription from the environment Terraform runs in. Terraform destroys the
  # module's resources with it, so the file stays while any component declaring
  # it does: remove the last of them from a Release only after destroying what
  # their modules created, because with the file gone Terraform refuses to plan,
  # asking for a provider block with the features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
