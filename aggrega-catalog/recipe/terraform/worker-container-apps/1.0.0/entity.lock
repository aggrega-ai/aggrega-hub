# Content pins for this entity's external inputs, written by `aggrega pin`.
# Commit it beside the entity. Run `aggrega pin` on the entity again to bring it up to date.
version: 1
localSourceDigests:
  - path: module/main.tf
    digest: sha256:be5a4fbde89ce18210737739a676bf24697f481d00410ed124e34268f1460b46
  - path: module/variables.tf
    digest: sha256:2591ba86aadf416406fb9764916bb1cbbaf73d96e883dda3d639e31796d7708f
ignore:
  plugin:
    name: provider/terraform
    patterns:
      - .git/
      - .hg/
      - .svn/
      - .bzr/
      - .terraform/
    files:
      - .terraformignore
  rules:
    - pattern: .git/
      within: module
      from: plugin
    - pattern: .hg/
      within: module
      from: plugin
    - pattern: .svn/
      within: module
      from: plugin
    - pattern: .bzr/
      within: module
      from: plugin
    - pattern: .terraform/
      within: module
      from: plugin
