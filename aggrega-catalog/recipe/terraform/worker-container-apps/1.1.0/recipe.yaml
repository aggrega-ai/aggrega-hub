apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-container-apps
  version: 1.1.0
  description: >
    The generic background-worker primitive as one Azure Container Apps app
    running the Release's image, on the catalog's shared Container Apps body.
    Reach for it in an Azure subscription with a Container Apps environment;
    for terraform/worker-ecs or cloudformation/worker-ecs in an AWS account,
    terraform/worker-cloud-run on Google Cloud, and helm/worker on
    Kubernetes.

    It has no ingress, so nothing reaches it. The environment and resource
    group are the operator's, each required under infra.overrides;
    user-assigned identities and a private registry are optional. Only the
    app is emitted — no environment, network, identity, registry, Key Vault
    or log workspace, each the operator's.

    Each env entry an inject block dictates becomes a container variable,
    written whole, and each file entry a secret mounted alone at its path;
    concurrency and queue_depth_hint arrive by default as WORKER_CONCURRENCY
    and WORKER_QUEUE_DEPTH_HINT. No edge may dictate those while they are the
    defaults, or a name Container Apps sets itself; arg and other entries are
    refused by name. It runs exactly infra.replicas replicas at the
    smallest Consumption size meeting infra.compute, so the Component's
    defaults run at 0.25 vCPU and 0.5 GiB.

    Its body takes hashicorp/azurerm ~> 5.14: it shares a terraform boundary
    with terraform/redis-azure-managed and the Azure OpenAI Recipes, not with
    terraform/postgres-flexible-server 1.0.0, which requires azurerm 4, or
    azure-api-management 1.0.0. A Release holding the previous version beside
    either in one boundary takes this version by moving the component, with
    its Terraform state, to another boundary, since moved.tf keeps an address
    within one root only; or it stays on the previous version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/compute/worker:1.0.0

  # The module beside this Recipe is the fixed pass-through every container
  # Recipe of this catalog carries byte for byte: its one input, config, goes
  # to the service module the artifacts below import, and that module comes
  # back out as its service output. entity.lock pins it. The App body declares
  # hashicorp/azurerm as "~> 5.14", the constraint the catalog conventions'
  # "One Azure provider constraint for every Azure body" section states, which
  # admits no azurerm 4 release: the module terraform/postgres-flexible-server
  # sources admits azurerm 4 alone, and terraform/azure-api-management 1.0.0
  # pins azurerm 5.9.0 exactly, so neither shares a root configuration with
  # this Recipe, while terraform/redis-azure-managed, azure-openai and
  # azure-openai-embedding, at "~> 5.9", do.
  #
  # Microsoft's Azure Verified Modules programme publishes a container app
  # module, Azure/avm-res-app-containerapp/azurerm, at 0.10.0 its newest
  # version, MIT. Its root calls Azure/avm-utl-interfaces/azure at 0.9.0 from
  # the registry, a module terraform init downloads at whatever it then
  # resolves, which neither the entity's lock nor Terraform's covers. The
  # module is therefore not sourced, and the app is the catalog's own App body.
  source: ./module

  # This Recipe reads from infra.overrides:
  #   resource_group_name          - string (config.resource_group_name), required
  #   container_app_environment_id - string (config.container_app_environment_id), required
  #   identity_ids                 - []string (config.identity_ids)
  #   registry_server              - string (config.registry_server)
  #   registry_identity            - string (config.registry_identity)
  #   registry_username            - string (config.registry_username)
  #   registry_password_secret_id  - string (config.registry_password_secret_id)
  #   registry_password_identity   - string (config.registry_password_identity)
  #   registry_password            - refused: the password is read from Key Vault
  #
  # Each is passed to the key of the body's config named in brackets, which
  # ContainerAppModule's App body documents. Each key of config is named for
  # the resource argument it sets, an argument inside a block by the block's
  # name and its own joined with an underscore; identity_ids sets the app's
  # identity block, and registry_password_secret_id and
  # registry_password_identity the Key Vault reference of the secret the
  # registry password is read from. resource_group_name is the spelling the
  # catalog's other terraform Azure Recipes read for the same concept, so an
  # operator writes it under one name across them. These are the keys
  # terraform/server-container-apps reads, under the same names.
  #
  # resource_group_name and container_app_environment_id are required and
  # neither has a default: the resource group and the Container Apps
  # environment the app runs in are provisioned outside this Release, no
  # subscription-independent value exists for either, and this Recipe never
  # chooses an environment, and with it a network, for the operator.
  # container_app_environment_id is the environment's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>;
  # the environment decides the network the app's egress leaves through and
  # where the app's logs go: Container Apps sets a log destination on the
  # environment, and an app takes none of its own, so this Recipe reads none.
  #
  # identity_ids are the resource IDs of user-assigned managed identities that
  # already exist, which the worker's code calls Azure with. A private image is
  # pulled from registry_server, the registry's host name, either with
  # registry_identity, a user-assigned identity granted pull on the registry, or
  # with registry_username and a password Container Apps reads from the Key
  # Vault secret registry_password_secret_id names, with the user-assigned
  # identity registry_password_identity names. Each identity named for the
  # registry is given to the app as well, since Container Apps takes them only
  # from the app's own identities. A password written as text would be written
  # into the rendered configuration, so it is taken only by that reference, and
  # a system-assigned identity, which Azure creates with the app, is not one
  # this Recipe names. With no registry key set the image is pulled as a public
  # one.
  #
  # The replica count. The Component declares no port, so the app declares no
  # ingress and no probe, and no scale rule; its minimum and maximum replica
  # count are both infra.replicas, so Container Apps runs exactly that many,
  # and a minimum of one or more is what keeps an app without ingress running
  # at all. The azurerm provider takes 1 to 300.
  #
  # Files. Each file entry an edge's inject block dictates is mounted at its
  # path, as ContainerAppModule describes: one secret of the app per file,
  # file-0, file-1 and so on in path order, and one Secret volume mounted by
  # sub path at each path, so the file appears alone there and the rest of its
  # directory stays as the image holds it. That a Secret volume honours a sub
  # path is unverified against a running environment, which no build reaches.
  # Container Apps makes no new revision when only a secret changes, so a
  # changed file reaches the container when its replicas next restart. A file's
  # content is held in the secret and in Terraform state. No file, no secret.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # ContainerAppArguments#/mappings/AppArguments:
  #   honoured — values.concurrency and values.queue_depth_hint as the locals
  #     below say, infra.image (required), infra.replicas as the replica count,
  #     infra.compute.cpu and infra.compute.memory as the Consumption size that
  #     entry chooses, the overrides above, and env and file entries.
  #   refused — a compute quantity that entry cannot read, and a pair larger
  #     than the largest size; more than 300 replicas; a component name
  #     Container Apps does not take for an app; an edge or the component's own
  #     inject block injecting a variable under a default name a developer
  #     value is delivered under, or under a name Container Apps sets itself; a
  #     file path that is not absolute or lies beneath another file's; an
  #     edge's arg or custom-mechanism entry; and an override that is not of the
  #     form above.

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer values. They are
  # delivered under the names helm/worker delivers them under, and only when
  # the developer set them, so an unset value renders no variable rather than
  # an empty one. Those names are defaults: each is rendered only while no
  # entry of the component's own inject block, in any mechanism, delivers its
  # value, and an edge or that block delivering either name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # component packages no upstream product, so no other local
  # ContainerAppArguments reads is declared: no default image, so the Release
  # names the one it runs; no port, so the app has no ingress; no probe path,
  # no GPU and no socket.
  locals:
    value_env: '{"values.concurrency": "WORKER_CONCURRENCY", "values.queue_depth_hint": "WORKER_QUEUE_DEPTH_HINT"}'

  artifacts:
    # The App body: the container app, holding each file as one of its secrets.
    service:
      $import: ContainerAppModule#/artifacts/App
    # A configuration applied with terraform/worker-container-apps 1.0.0 holds
    # the app at azurerm_container_app.this in this component's module, the
    # address that version declares it at; this version declares it in the
    # service module. The block moves it there, so Terraform keeps the running
    # app rather than replacing it.
    moved.tf: |
      moved {
        from = azurerm_container_app.this
        to   = module.service.azurerm_container_app.this
      }

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: ContainerAppArguments#/mappings/AppArguments

  # Written once, beside the boundary's root configuration rather than in the
  # module, and shared by every component of the boundary that declares this
  # file with these bytes: another component bound to this Recipe, or one whose
  # Recipe configures azurerm the same way under the same name, such as
  # terraform/redis-azure-managed. The same name with other bytes halts the
  # build. The azurerm provider refuses to plan without its features block, and
  # a vendored module carries no provider block of its own, so the module
  # inherits this configuration; the provider reads its credentials and
  # subscription from the environment Terraform runs in. Terraform destroys the
  # module's resources with it, so the file stays while any component declaring
  # it does: remove the last of them from a Release only after destroying what
  # their modules created, because with the file gone Terraform refuses to plan,
  # asking for a provider block with the features argument.
  boundary:
    artifacts:
      provider-azurerm.tf: |
        provider "azurerm" {
          features {}
        }
