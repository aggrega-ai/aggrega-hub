apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sns
  version: 1.0.0
  # The licence of the vendored module, the terraform-aws-modules project's
  # SNS module: the third-party code this Recipe pins and writes into the
  # output. The topic it provisions is a service the reader contracts for
  # directly with AWS, under AWS's terms.
  license: Apache-2.0
  description: >
    Amazon SNS, realized by the published SNS module of the
    terraform-aws-modules project, terraform-aws-modules/sns/aws at v7.2.0,
    Apache-2.0, fetched from its git repository at that tag and pinned by
    the commit it names in the entity.lock beside this Recipe: one topic
    named after the component, with .fifo appended on a FIFO topic, carrying
    every value of the Component. arn publishes the module's output, as a
    Terraform reference that resolves for a consumer authored as a source:
    Recipe in the same root configuration.

    SNS encrypts the topic's messages with the operator's KMS key where
    kms_key_id names one, and applies no server-side encryption otherwise;
    tags label the topic. The module's topic policy and subscriptions stay
    off, and no key or role is created. A destroy, or removing the topic
    from the configuration, deletes the topic with every subscription of it.

    infra.overrides.host halts the build, since a publisher reaches every
    topic at SNS's endpoint in its Region and names the topic by its ARN, as
    do a kms_key_id SNS cannot take, tags that are not a map of strings and
    any infra.overrides key not listed.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: terraform
  implements: core/messaging/sns:1.0.0

  # The published module, at the tag the registry publishes as version 7.2.0.
  # A registry version of a module is a tag of its git repository, and
  # Terraform's dependency lock file records providers and no module, so the
  # pin is taken here: `aggrega pin` resolves the tag to its commit and
  # records that commit and the archive's digest in entity.lock, and every
  # build vendors exactly those bytes.
  #
  # The source names the repository root, which is the module: the
  # configuration Terraform loads from it is that root's own files, which
  # declare no module call, so initialising it fetches providers and nothing
  # else. The repository's examples/ and wrappers/ directories are vendored
  # with it and never loaded, since nothing the root declares reaches them.
  #
  # The module declares hashicorp/aws >= 6.67 and Terraform >= 1.5.7 in its
  # own terraform block and is vendored byte for byte, so this Recipe adds no
  # provider constraint of its own; the catalog conventions' "One AWS
  # provider constraint for every AWS body" section says how it composes with
  # the catalog's authored AWS bodies.
  #
  # The tag is written out rather than read from infra.source_version: a
  # source whose coordinates come from a template is pinned per Release
  # instead of in this Recipe's own entity.lock, and this Recipe's pin is the
  # one stated above.
  source:
    kind: git-repository
    url: https://github.com/terraform-aws-modules/terraform-aws-sns.git
    ref: v7.2.0

  locals:
    # The topic's name: the instance's name, followed by .fifo on a FIFO
    # topic, as SNS requires of a FIFO topic's name. The module trims a .fifo
    # suffix from its name input and appends it again on a FIFO topic, so the
    # name passed is the name the topic takes. The Component's assertion holds
    # the instance's name to SNS's rule for a topic name, the suffix counted.
    topic_name: '{{ .context.instance_id }}{{ if .values.fifo_topic }}.fifo{{ end }}'

  # The String Pipe: the compiler does not interpret this string. arn names
  # the module's topic_arn output, the topic's ARN, through this component's
  # module call, which the boundary's root configuration declares under
  # .context.instance_id for a component declared in the Aggregate the
  # Release deploys. Terraform resolves it at apply time, so it resolves only
  # for a consumer authored as a source: Recipe in the same root
  # configuration, which reading it is applied after the topic; a consumer on
  # another target receives it as text.
  provides:
    arn: "${module.{{ .context.instance_id }}.topic_arn}"

  # This Recipe reads from infra.overrides:
  #   kms_key_id - string (kms_master_key_id)
  #   tags       - map[string]string (tags)
  # host halts by name, as any key not listed does.
  #
  # kms_key_id and tags are the keys, under the same names, that the
  # catalog's terraform AWS Recipes read for the KMS key a resource is
  # encrypted with and for its tags, so a Release names each once whichever
  # Recipe it configures.
  #
  # kms_key_id names the operator's KMS key, set as the module's
  # kms_master_key_id, by one of the forms SNS takes for KmsMasterKeyId (the
  # CreateTopic API reference, which refers to KMS's KeyId): a key ID (a UUID,
  # or mrk- and 32 hexadecimal digits for a multi-Region key), an alias name
  # (alias/ followed by its name), or the ARN of a key or of an alias. The AWS
  # provider passes the string to SNS unchecked, so a value of another form
  # halts the build here rather than at apply. SNS then encrypts the body of
  # each message published to the topic under that key as it receives it,
  # and decrypts it as it delivers it; SNS takes a symmetric encryption key
  # alone. The key, and its key policy, which lets the topic's publishers use
  # it, are the operator's, named here and never created. Unset, the module's
  # kms_master_key_id keeps its default, null, and SNS applies no server-side
  # encryption to the topic's messages.
  #
  # tags is a map from each tag name to a string, written on the topic, the
  # one resource the module creates here, as the module writes it: the module
  # adds no tag of its own.
  #
  # host is refused by name. SNS publishes no address of a topic of its own:
  # a client calls SNS's endpoint in the topic's Region, an endpoint the
  # service names and offers no custom domain for, and names the topic by its
  # ARN in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.fifo_topic (fifo_topic, and the .fifo suffix on the
  #     name), values.content_based_deduplication
  #     (content_based_deduplication, on a FIFO topic), and the overrides
  #     above.
  #   refused — a kms_key_id of another form; tags that are not a map of
  #     strings; infra.overrides.host; and any infra.overrides key not listed
  #     above.
  #   held by the Component — the component's name, which names the topic,
  #     and values.content_based_deduplication true on a standard topic.
  #   not read — none; the Component declares no other value or infra key.
  #
  # Each value is written. The module and the AWS provider default
  # fifo_topic and content_based_deduplication to false, as SNS and the
  # Component do, and leave every other attribute of the topic to SNS's own
  # default.
  #
  # The name and the topic's type. SNS fixes both when it creates the topic,
  # and the AWS provider replaces the topic when either changes. Renaming the
  # component, or changing values.fifo_topic, which moves the name to or from
  # its .fifo suffix, makes Terraform delete the old topic, with every
  # subscription of it, and create a new one under the new name.
  #
  # The module's toggles that would create something beyond the topic are
  # written off: create_topic_policy, a topic policy granting the module's
  # default statement or the statements its inputs list, and
  # create_subscription, a subscription for each entry of its subscriptions
  # input. With create_topic_policy off, the module writes its topic_policy
  # input, null by default, as the topic's policy, so SNS's default access
  # policy applies, under which only the account owning the topic can publish
  # to it or subscribe to it, and the data source reading the caller's
  # account is not read. The module's other defaults stand: the exact name
  # rather than a name prefix; no delivery-status logging, since every
  # feedback role input is empty, and the module creates no role for it; no
  # data protection policy; no archive policy, so a FIFO topic archives no
  # message; no FIFO throughput scope, so a FIFO topic deduplicates across
  # the topic; no maximum message size, so the topic takes messages of up to
  # 262,144 bytes; no signature version, tracing mode, display name or
  # delivery policy; and the Region of the AWS provider the root configures.
  #
  # Deletion. A destroy, or removing the component, deletes the topic, and SNS
  # deletes every subscription of it and may leave messages published shortly
  # before undelivered (the DeleteTopic API reference); SNS keeps no backup to
  # restore it from.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "kms_key_id" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon SNS publishes no address of a topic: a client calls SNS's endpoint in the topic's Region, which offers no custom domain, and names the topic by arn: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads kms_key_id and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # kms_key_id is passed to the module's kms_master_key_id in one of the
    # forms SNS takes for it, and tags as the map of strings the module's tags
    # input is typed as.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "kms_key_id" -}}
      {{- if not (and (typeIs "string" $o.kms_key_id) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9:/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/\S+)$` $o.kms_key_id)) -}}
      {{- fail (printf "infra.overrides.kms_key_id is %s, and SNS takes the KMS key a topic is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to leave the topic without server-side encryption" (toJson $o.kms_key_id)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "tags" -}}
      {{- $g := get $o "tags" -}}
      {{- $ok := kindIs "map" $g -}}
      {{- if $ok }}{{ range $_, $v := $g }}{{ if not (typeIs "string" $v) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.tags is %s, and the module takes tags as a map from each tag name to a string: set it in the Release to such a map, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}

  # Each rendered key becomes an argument of this component's module block in
  # the boundary's root configuration, named for the module's own input.
  # fifo_topic is written on every topic, false on a standard one, which the
  # module and the AWS provider default to; content_based_deduplication on a
  # FIFO topic alone, since SNS takes it on a FIFO topic alone.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict -}}
    name: "{{ .locals.topic_name }}"
    fifo_topic: {{ .values.fifo_topic }}
    {{- if .values.fifo_topic }}
    content_based_deduplication: {{ .values.content_based_deduplication }}
    {{- end }}
    create_topic_policy: false
    create_subscription: false
    {{- with optional $o "kms_key_id" "" }}
    kms_master_key_id: {{ toJson . }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
