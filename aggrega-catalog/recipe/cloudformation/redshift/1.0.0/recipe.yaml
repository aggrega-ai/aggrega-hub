apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: redshift
  version: 1.0.0
  # The values, infra keys and infra.overrides keys this Recipe refuses are
  # listed, with their reasons, in the comments above the assertions.
  description: >
    Amazon Redshift Serverless, rendered as a CloudFormation fragment: one
    AWS::RedshiftServerless::Namespace and one
    AWS::RedshiftServerless::Workgroup, both named after the component,
    which the cloudformation provider assembles into the boundary's stack.

    The namespace creates the database values.database names and the
    administrator values.user names. Amazon Redshift generates the
    administrator's password and keeps it in AWS Secrets Manager: the
    password slot stays empty or takes core/generated-secret, and any other
    credential halts the build.

    host publishes a CloudFormation reference to the workgroup's address,
    or infra.overrides.host; port publishes infra.port. No backup is
    configured: the service keeps the namespace's recovery points itself.
    Deleting the stack deletes the namespace and its data, with no final
    snapshot.

    The subnets, security groups, KMS key and IAM roles are the operator's,
    named in infra.overrides, and none is created. A value Amazon Redshift
    Serverless cannot take and any infra.overrides key not listed halt the
    build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/bigdata/redshift:1.0.0

  # The resources' logical ids, derived from this instance's own name so that
  # two warehouses deployed into one stack describe four resources rather than
  # two. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance sales-warehouse
  # names the resources SalesWarehouseNamespace and SalesWarehouseWorkgroup.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The name the Release gives the workgroup under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value
    # is refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The words Amazon Redshift reserves, which a database or user name
    # cannot take: the Amazon Redshift Database Developer Guide's list of
    # reserved words, in lower case.
    reserved_words: >-
      aes128 aes256 all allowoverwrite analyse analyze and any array as asc
      authorization az64 backup between binary blanksasnull both bytedict
      bzip2 case cast check collate column constraint create credentials
      cross current_date current_time current_timestamp current_user
      current_user_id default deferrable deflate defrag delta delta32k desc
      disable distinct do else emptyasnull enable encode encrypt encryption
      end except explicit false for foreign freeze from full globaldict256
      globaldict64k grant group gzip having identity ignore ilike in
      initially inner intersect interval into is isnull join leading left
      like limit localtime localtimestamp lun luns lzo lzop minus mostly16
      mostly32 mostly8 natural new not notnull null nulls off offline offset
      oid old on only open or order outer overlaps parallel partition
      percent permissions pivot placing primary raw readratio recover
      references rejectlog resort respect restore right select session_user
      similar snapshot some sysdate system table tag tdes text255 text32k
      then timestamp to top trailing true truncatecolumns union unique
      unnest unpivot user using verbose wallet when where with without

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this warehouse, and resolves
  # none of them. host is a CloudFormation intrinsic function reference to
  # the workgroup's Workgroup.Endpoint.Address attribute, which CloudFormation
  # resolves when it creates the stack. The provider projects the matching
  # provides block inside the fragment below into the assembled stack
  # Outputs; this recipe-level provides is the value-pipe contract, the
  # fragment provides is the Outputs source, and they carry the same values.
  #
  # While the Release sets infra.overrides.host, host publishes that name in
  # both provides blocks instead of the reference. It is the operator's
  # deterministic pointer: the compiler pipes it as text and looks nothing up,
  # and this Recipe emits no DNS record, alias or custom domain name for it,
  # so the operator points the name at the workgroup outside the Release. A
  # consumer in the same stack receives the name as well, and a name carries
  # no reference for CloudFormation to create that consumer after this
  # workgroup by; a later syncWave on the consumer's boundary, sharing this
  # boundary's directory, orders the two. A consumer in another stack imports
  # the name through the same export it imports the reference through.
  #
  # The workgroup presents a certificate carrying its own endpoint name. A
  # client that checks the server's name against the certificate
  # (sslmode=verify-full) accepts the operator's name only once that name is
  # the workgroup's custom domain name, associated with an AWS Certificate
  # Manager certificate carrying it; CloudFormation declares no resource for
  # that association, so the operator makes it outside the Release, after
  # which verify-full holds for the custom name alone. A client checking the
  # certificate's issuer alone (sslmode=verify-ca) connects under either name
  # (the Amazon Redshift Management Guide's pages on custom domain names).
  #
  # port is the value the fragment sets on the workgroup's Port property, so
  # it is known ahead of time and published as that value in both blocks. user
  # and database are the administrator and the database the namespace
  # creates, in lower case as the namespace keeps them, and protocol is
  # redshift.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}!GetAtt {{ .locals.logical_id }}Workgroup.Workgroup.Endpoint.Address{{ end }}"
    port: "{{ .infra.port }}"
    user: "{{ lower .values.user }}"
    database: "{{ lower .values.database }}"
    protocol: "redshift"

  # This Recipe reads from infra.overrides:
  #   BaseCapacity      - integer (the workgroup's BaseCapacity, in Redshift Processing Units)
  #   SubnetIds         - []string (the workgroup's SubnetIds)
  #   SecurityGroupIds  - []string (the workgroup's SecurityGroupIds)
  #   PubliclyAccessible - bool (the workgroup's PubliclyAccessible)
  #   KmsKeyId          - string (the namespace's KmsKeyId)
  #   IamRoles          - []string (the namespace's IamRoles, role ARNs)
  #   DefaultIamRoleArn - string (the namespace's DefaultIamRoleArn, one of IamRoles)
  #   host              - string (published as provides.host; renders nothing)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation. host is the exception to the naming: it is no property of
  # either resource but the address a consumer reaches the warehouse at, under
  # the name every managed datastore Recipe of this catalog reads for it. host
  # is a bare DNS name or IP literal. The assertion below refuses a value
  # carrying a scheme, a path, a user, a port or whitespace, because a
  # consumer composes its connection from host and port and would compose a
  # broken one; the port is infra.port.
  #
  # BaseCapacity is the compute the workgroup starts from, in Redshift
  # Processing Units. Amazon Redshift Serverless takes 4, every multiple of 8
  # from 8 to 512, and every multiple of 32 from 544 to 1024 (the Amazon
  # Redshift Management Guide's page on compute capacity), and any other value
  # halts the build. 4 and the values above 512 are offered in some AWS
  # Regions alone, which the service checks when the stack is created. Unset,
  # the fragment writes none and the service chooses the base capacity.
  #
  # SubnetIds, SecurityGroupIds, KmsKeyId and IamRoles name the operator's
  # subnets, security groups, KMS key and IAM roles, which this Recipe never
  # creates. A workgroup without enhanced VPC routing, which this Recipe does
  # not turn on, takes at least two subnets spanning two Availability Zones
  # (the Management Guide's considerations for Redshift Serverless), so
  # SubnetIds names at least two, each subnet- followed by hexadecimal digits
  # as the resource schema reads it; which zone each subnet sits in, the
  # service checks. SecurityGroupIds names one to 32 security groups, each
  # sg- followed by hexadecimal digits. Unset, the fragment writes neither and
  # the service chooses the subnets and the security group itself, as its
  # CreateWorkgroup reference's example shows.
  # PubliclyAccessible takes true or false, false as the service creates a
  # workgroup. KmsKeyId is the key the namespace's data is encrypted with, by
  # its ID, its ARN or an alias name; unset, Amazon Redshift encrypts it with
  # a key AWS owns (the Management Guide's page on database encryption).
  # IamRoles are the roles the warehouse loads and unloads data
  # with, each a role ARN, and DefaultIamRoleArn the one of them its SQL
  # commands take by default: the AWS provider's documentation of the same
  # setting states that the default role must be one of the namespace's roles,
  # a rule this Recipe applies, so DefaultIamRoleArn not among IamRoles halts.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.database, as the namespace's DbName; values.user, as
  #     its AdminUsername; infra.port, as the workgroup's Port; the password
  #     slot left empty or bound to core/generated-secret; and the overrides
  #     above.
  #   refused — a component name the service does not take as a namespace or
  #     workgroup name; any other credential on the password slot; a BaseCapacity the
  #     service does not offer; an override of the wrong shape; DefaultIamRoleArn not among
  #     IamRoles; and any infra.overrides key not listed above.
  #   not read — none.
  #
  # The names. The namespace and the workgroup are both named after the
  # component, and the service takes a name of 3 to 64 lowercase letters,
  # digits and hyphens for each (the CreateNamespace and CreateWorkgroup
  # references); a component name outside that rule halts the build. Both
  # names are fixed when the resources are created: CloudFormation replaces
  # them when the component is renamed.
  #
  # The database, the administrator and the port. The Component holds them to
  # Amazon Redshift's rules, a name's shape and reserved words and the ports
  # a workgroup is served on, so this Recipe re-checks none. Amazon Redshift
  # folds the letters of a name to lower case, so the fragment writes each name in
  # lower case and user and database publish the name the namespace keeps.
  #
  # The administrator's password. Amazon Redshift generates it and keeps it in
  # AWS Secrets Manager, in a secret it creates (ManageAdminPassword), so a
  # credential attached to the password slot would reach no byte of the
  # output while the build reads as if it had set it. The slot stays empty,
  # or takes core/generated-secret, which says the service owns the password
  # and renders nothing; any other credential halts naming what filled the
  # slot.
  # The type is compared with any version set aside.
  #
  # Backup. No backup is configured: Amazon Redshift Serverless keeps recovery
  # points of the namespace, taken at least every 30 minutes and kept for 24
  # hours, with no setting that changes either (the Management Guide's page on
  # snapshots and recovery points). The resources carry CloudFormation's
  # default deletion policy, Delete, and the fragment names no final snapshot,
  # so deleting the stack, or a change replacing the namespace, deletes it and
  # its data; a snapshot the operator takes outside the Release is kept.
  assertions:
    overrides_known: >-
      {{- $known := list "BaseCapacity" "SubnetIds" "SecurityGroupIds" "PubliclyAccessible" "KmsKeyId" "IamRoles" "DefaultIamRoleArn" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads BaseCapacity, SubnetIds, SecurityGroupIds, PubliclyAccessible, KmsKeyId, IamRoles, DefaultIamRoleArn and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this warehouse reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    resource_names: >-
      {{- $n := toString .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z0-9-]{3,64}$` $n) -}}
      {{- fail (printf "the component %q names its Amazon Redshift Serverless namespace and workgroup, and the service takes a name of 3 to 64 lowercase letters, digits and hyphens for each: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    base_capacity_offered: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "BaseCapacity" -}}
      {{- $s := toString $o.BaseCapacity -}}
      {{- $n := 0 }}{{ if regexMatch `^[0-9]+$` $s }}{{ $n = atoi $s }}{{ end -}}
      {{- if not (or (eq $n 4) (and (ge $n 8) (le $n 512) (eq (mod $n 8) 0)) (and (gt $n 512) (le $n 1024) (eq (mod $n 32) 0))) -}}
      {{- fail (printf "infra.overrides.BaseCapacity is %s, and Amazon Redshift Serverless starts a workgroup at 4 Redshift Processing Units, a multiple of 8 from 8 to 512, or a multiple of 32 from 544 to 1024: set it to one of them in the Release, or remove it to let the service choose" (toJson $o.BaseCapacity)) -}}
      {{- end -}}
      {{- end -}}
    # Each of these overrides is passed to its resource as written, so one of
    # another shape would render a property CloudFormation refuses.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "SubnetIds" -}}
      {{- $g := $o.SubnetIds -}}
      {{- $ok := and (kindIs "slice" $g) (ge (len $g) 2) (le (len $g) 32) -}}
      {{- if $ok }}{{ range $g }}{{ if not (and (typeIs "string" .) (regexMatch `^subnet-[0-9a-fA-F]{8,}$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.SubnetIds is %s, and the workgroup takes its subnets as a list of 2 to 32 subnet IDs, each subnet- followed by hexadecimal digits, spanning at least two Availability Zones: set it in the Release to such a list, or remove it to let the service choose" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "SecurityGroupIds" -}}
      {{- $g := $o.SecurityGroupIds -}}
      {{- $ok := and (kindIs "slice" $g) (ge (len $g) 1) (le (len $g) 32) -}}
      {{- if $ok }}{{ range $g }}{{ if not (and (typeIs "string" .) (regexMatch `^sg-[0-9a-fA-F]{8,}$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.SecurityGroupIds is %s, and the workgroup takes its security groups as a list of 1 to 32 security group IDs, each sg- followed by hexadecimal digits: set it in the Release to such a list, or remove it to let the service choose" (toJson $g)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (hasKey $o "PubliclyAccessible") (not (kindIs "bool" $o.PubliclyAccessible)) -}}
      {{- fail (printf "infra.overrides.PubliclyAccessible is %s, and the workgroup's PubliclyAccessible takes true or false: set it to true or false in the Release, or remove it" (toJson $o.PubliclyAccessible)) -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^\S+$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and the namespace takes the KMS key its data is encrypted with as one key ID, key ARN or alias name, written as a string with no space: set it to one in the Release, or remove it" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}
    iam_roles: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $roles := list -}}
      {{- if hasKey $o "IamRoles" -}}
      {{- $g := $o.IamRoles -}}
      {{- $ok := and (kindIs "slice" $g) (gt (len $g) 0) -}}
      {{- if $ok }}{{ range $g }}{{ if not (and (typeIs "string" .) (regexMatch `^arn:[^:\s]+:iam::[0-9]{12}:role/\S+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.IamRoles is %s, and the namespace takes the roles it loads and unloads data with as a list of IAM role ARNs, arn:<partition>:iam::<account>:role/<name>: set it in the Release to such a list, or remove it" (toJson $g)) -}}
      {{- end -}}
      {{- $roles = $g -}}
      {{- end -}}
      {{- if hasKey $o "DefaultIamRoleArn" -}}
      {{- if not (has $o.DefaultIamRoleArn $roles) -}}
      {{- fail (printf "infra.overrides.DefaultIamRoleArn is %s, and Amazon Redshift sets as the namespace's default role only one of the roles associated with it, which this Recipe reads from infra.overrides.IamRoles: add it to infra.overrides.IamRoles in the Release, or remove infra.overrides.DefaultIamRoleArn" (toJson $o.DefaultIamRoleArn)) -}}
      {{- end -}}
      {{- end -}}
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "password" -}}
      {{- $ty := toString (optional $f.password "type" "") -}}
      {{- if ne (first (splitList ":" $ty)) "core/generated-secret" -}}
      {{- fail (printf "the password slot is filled by %s, and Amazon Redshift generates this namespace's administrator password itself and keeps it in AWS Secrets Manager, so the attachment would set nothing: remove it from the password slot when deploying to this target, or attach core/generated-secret there, which says the service owns the password" (default "an attachment of no type" $ty)) -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Namespace:
          Type: AWS::RedshiftServerless::Namespace
          Properties:
            NamespaceName: "{{ .context.instance_id }}"
            DbName: "{{ lower .values.database }}"
            AdminUsername: "{{ lower .values.user }}"
            ManageAdminPassword: true

            ## ── Provider-specific overrides ─────────────────────────
            {{- with optional $o "KmsKeyId" "" }}
            KmsKeyId: {{ toJson . }}
            {{- end }}
            {{- with optional $o "IamRoles" "" }}
            IamRoles: {{ toJson . }}
            {{- end }}
            {{- with optional $o "DefaultIamRoleArn" "" }}
            DefaultIamRoleArn: {{ toJson . }}
            {{- end }}

        {{ .locals.logical_id }}Workgroup:
          Type: AWS::RedshiftServerless::Workgroup
          Properties:
            WorkgroupName: "{{ .context.instance_id }}"
            NamespaceName: !Ref {{ .locals.logical_id }}Namespace
            Port: {{ .infra.port }}

            ## ── Provider-specific overrides ─────────────────────────
            {{- if hasKey $o "BaseCapacity" }}
            BaseCapacity: {{ atoi (toString $o.BaseCapacity) }}
            {{- end }}
            {{- with optional $o "SubnetIds" "" }}
            SubnetIds: {{ toJson . }}
            {{- end }}
            {{- with optional $o "SecurityGroupIds" "" }}
            SecurityGroupIds: {{ toJson . }}
            {{- end }}
            {{- if hasKey $o "PubliclyAccessible" }}
            PubliclyAccessible: {{ $o.PubliclyAccessible }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # warehouses in one stack keep their connection identities apart. A
      # cross-stack consumer imports the host entry; an intra-stack consumer
      # receives it through the value-pipe above.
      provides:
        host: {{ if .locals.operator_host }}"{{ .locals.operator_host }}"{{ else }}!GetAtt {{ .locals.logical_id }}Workgroup.Workgroup.Endpoint.Address{{ end }}
        port: "{{ .infra.port }}"
        user: "{{ lower .values.user }}"
        database: "{{ lower .values.database }}"
        protocol: redshift
