apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sagemaker
  version: 1.0.0
  description: >
    Amazon SageMaker's managed model serving endpoint as a reference
    realization on CloudFormation: the fragment this Recipe writes declares
    no resource, so deploying it creates nothing, and the cloudformation
    provider writes the regional runtime endpoint the Release supplies and
    the model value the Aggregate gives as Outputs of the boundary's stack.

    Reach for it where the Release deploys a CloudFormation stack; reach for
    terraform/sagemaker where it deploys Terraform. CloudFormation takes no
    template without a resource, so this component shares its boundary with
    a component whose Recipe declares one, such as the server that invokes
    the model: a stack holding only reference realizations halts the build.
    A consumer reads each value as the text the Release and the Aggregate
    give, and nothing is looked up when the stack is created. A missing
    infra.endpoint halts naming it. No credential is delivered by this
    Recipe: consumers authenticate with ambient AWS IAM, such as the task
    role of an Amazon ECS task, or inject their own credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/ai-model/sagemaker:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts before this Recipe
  # renders, the Component's schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.model, published as provides.model; infra.endpoint,
  #     published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.endpoint_name: provides.model carries values.model,
  #     as the helm and compose realizations publish it, so a consumer reads
  #     the same text whichever target realizes the model;
  #     values.context_window, a hint for sizing the server that serves a
  #     model, which the operator's SageMaker endpoint already does;
  #     values.display_name and values.description, which describe the
  #     component to its readers.
  #
  # The SageMaker endpoint a model is served from, with its endpoint
  # configuration and its model, is the operator's, created outside the
  # Release, and the Component is a reference to it, so this Recipe declares
  # no resource.
  #
  # Backup. The endpoint is the operator's, and this Recipe creates nothing
  # to back up.
  assertions:
    # The SageMaker runtime host carries the region, and the region is the
    # operator's choice, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches a SageMaker serving endpoint through the runtime of a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the SageMaker runtime endpoint of that region (runtime.sagemaker.<region>.amazonaws.com)" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the model from the
  # developer's values, each published as written, so a consumer in this
  # stack or on another target reads the same text. The provider projects
  # the matching provides block inside the fragment below into the assembled
  # stack Outputs; this recipe-level provides is the value-pipe contract, the
  # fragment provides is the Outputs source, and they carry the same values.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"

  # The fragment this component becomes: no Resources, so deploying it
  # creates nothing, and a provides entry for each value the component
  # publishes. Each value is written as a JSON string, which YAML reads back
  # as the same text and CloudFormation takes as a literal.
  artifacts:
    template.yaml: |
      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs, named for this instance and the entry together, so two
      # models in one stack keep their identities apart. A cross-stack
      # consumer imports an entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        endpoint: {{ toJson .infra.endpoint }}
        model: {{ toJson .values.model }}
