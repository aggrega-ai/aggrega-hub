apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: glue
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    The AWS Glue Data Catalog on CloudFormation: one AWS::Glue::Database,
    named by values.database, in the Data Catalog of the account the stack
    is deployed in, which the cloudformation provider assembles into the
    boundary's stack. database publishes a CloudFormation reference to the
    database's name, which CloudFormation resolves when it creates the
    stack.

    LocationUri names the database's location, an Amazon S3 location in
    the operator's bucket; unset, the database has none. No table, job,
    crawler, bucket or role is created, and Lake Formation permissions are
    left to the account's settings. A changed name replaces the database,
    and deleting it deletes the tables it holds.

    infra.overrides.host halts the build, since a client reaches every
    database at AWS Glue's endpoint in its Region, as do a location of
    another shape and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/bigdata/glue:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two databases deployed into one stack describe two resources rather than
  # one. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance sales-catalog names
  # the resource SalesCatalogDatabase.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this database, and resolves none of it.
  # database is a CloudFormation intrinsic function reference to the database,
  # whose Ref is its name, which CloudFormation resolves when it creates the
  # stack, so a consumer in the same stack is created after the database. The
  # provider projects the matching provides block inside the fragment below
  # into the assembled stack Outputs; this recipe-level provides is the
  # value-pipe contract, the fragment provides is the Outputs source, and they
  # carry the same value. AWS::Glue::Database returns no attribute through
  # Fn::GetAtt, and the Component publishes nothing beyond the name.
  provides:
    database: "!Ref {{ .locals.logical_id }}Database"

  # This Recipe reads from infra.overrides:
  #   LocationUri - string (the database's DatabaseInput.LocationUri, an s3:// location)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # The key name is the CloudFormation property name rather than a separate
  # Aggrega spelling, because it is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation.
  #
  # LocationUri is the database's location: an Amazon S3 location, s3://
  # followed by the operator's bucket and an optional prefix, set as
  # DatabaseInput.LocationUri, which the Data Catalog records on the database.
  # The bucket is the operator's and this Recipe neither creates it nor grants
  # access to it. The bucket's name follows Amazon S3's rule for a bucket name,
  # 3 to 63 lowercase letters, digits, periods and hyphens beginning and ending
  # with a letter or a digit (the Amazon S3 User Guide's bucket naming rules),
  # and the resource schema takes a location of at most 1024 characters; a
  # location of another shape or length halts the build. Unset, the fragment
  # writes none and the database has no location.
  #
  # host is refused by name. A Data Catalog database has no address of its
  # own: a client calls AWS Glue's endpoint in the database's Region, an
  # endpoint the service names, and names the database in the call, so this
  # Component publishes no host for the name to replace.
  #
  # Tags are not read: AWS::Glue::Database takes no Tags property, and no
  # CloudFormation Recipe of the catalog reads Tags.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's schema, or not read:
  #   honoured — values.database, set as DatabaseInput.Name and as
  #     DatabaseName; the override above.
  #   refused — a LocationUri of another shape or length; infra.overrides.host;
  #     and any infra.overrides key not listed above.
  #   held by the Component — the database name's rule, 1 to 255 lowercase
  #     letters, digits and underscores, which its schema declares.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The account. CatalogId, which the resource requires, is the account the
  # stack is deployed in, AWS::AccountId, so the database is created in that
  # account's Data Catalog in the stack's Region; it is not a key.
  #
  # The name. values.database is set as DatabaseInput.Name and as
  # DatabaseName, the resource's identifier, which CloudFormation replaces the
  # resource to change. The Data Catalog renames no database (the Athena User
  # Guide's page on naming databases, tables and columns), so a changed name
  # creates a new, empty database and deletes the old one with its tables.
  #
  # What the fragment does not write: Description and Parameters; TargetDatabase
  # and FederatedDatabase, which make the database a link to another catalog's
  # database or an external metastore's rather than a database of its own;
  # and CreateTableDefaultPermissions, so the tables created in the database
  # take the default permissions the account's Lake Formation settings give,
  # which, as AWS Lake Formation starts, leave access to IAM policies alone
  # (the Lake Formation Developer Guide's page on changing the default
  # settings). Lake Formation permissions are the operator's.
  #
  # Deletion. Deleting the database removes it from the Data Catalog, and AWS
  # Glue then deletes the tables, their versions and partitions, and the
  # user-defined functions it holds (the DeleteDatabase reference). The
  # objects at the database's location are in the operator's bucket, which
  # this Recipe does not touch.
  assertions:
    overrides_known: >-
      {{- $known := list "LocationUri" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an AWS Glue Data Catalog database has no address of its own: a client calls AWS Glue's endpoint in the database's Region and names the database by database: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads LocationUri from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # LocationUri is passed to the resource as written, and the key names an
    # Amazon S3 location in the operator's bucket, so a location of another
    # shape halts here rather than being recorded on the database, and one
    # longer than the resource schema takes halts rather than failing the
    # stack. The length is counted in characters, as the schema counts it.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "LocationUri" -}}
      {{- if not (and (typeIs "string" $o.LocationUri) (regexMatch `^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/\S*)?$` $o.LocationUri)) -}}
      {{- fail (printf "infra.overrides.LocationUri is %s, and the database takes its location as s3:// followed by an Amazon S3 bucket name, 3 to 63 lowercase letters, digits, periods and hyphens beginning and ending with a letter or a digit, and an optional /prefix: set it in the Release to such a location in the operator's bucket, or remove it for no location" (toJson $o.LocationUri)) -}}
      {{- end -}}
      {{- if not (regexMatch `^.{0,1000}.{0,24}$` $o.LocationUri) -}}
      {{- fail "infra.overrides.LocationUri is longer than 1024 characters, and the database takes a location of at most 1024 characters: shorten it in the Release" -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Database:
          Type: AWS::Glue::Database
          Properties:
            CatalogId: !Ref AWS::AccountId
            DatabaseName: {{ toJson .values.database }}
            DatabaseInput:
              Name: {{ toJson .values.database }}

              ## ── Provider-specific overrides ─────────────────────────
              {{- with optional $o "LocationUri" "" }}
              LocationUri: {{ toJson . }}
              {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two
      # databases in one stack keep their names apart. A cross-stack consumer
      # imports the database entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        database: !Ref {{ .locals.logical_id }}Database
