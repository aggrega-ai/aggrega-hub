apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: aws-certificate-manager
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    AWS Certificate Manager on CloudFormation: one
    AWS::CertificateManager::Certificate for the component's names,
    validated through DNS, which the cloudformation provider assembles into
    the boundary's stack. infra.overrides.HostedZoneId names the operator's
    Route 53 public hosted zone, and each name's DomainValidationOptions
    entry carries it, so ACM writes the name's validation record into that
    zone; no zone, record set or role is declared.

    arn publishes a reference to the certificate, which CloudFormation
    resolves once ACM has issued it: the stack's creation waits for the
    validation. Deleting the stack or removing the component deletes the
    certificate, and renaming it or changing a name or HostedZoneId
    replaces it, a deletion ACM refuses while another AWS service uses the
    certificate. HostedZoneId unset, not a
    string, or written with the /hostedzone/ prefix, infra.overrides.host,
    and any infra.overrides key not listed halt the build naming the key.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/security/aws-certificate-manager:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two certificates deployed into one stack describe two resources rather
  # than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are
  # read as word boundaries and each word is capitalised: instance
  # site-certificate names the certificate SiteCertificateCertificate.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this certificate, and resolves
  # none of it. arn is a reference to the certificate, whose Ref returns its
  # ARN; CloudFormation resolves it once the certificate's creation
  # completes, which is when ACM has issued it, so a consumer in the same
  # stack is created after the certificate is issued. The provider projects
  # the matching provides block inside the fragment below into the assembled
  # stack Outputs; this recipe-level provides is the value-pipe contract, the
  # fragment provides is the Outputs source, and they carry the same value. A
  # consumer in another stack imports it through that Output. No address is
  # published: a certificate has none.
  provides:
    arn: "!Ref {{ .locals.logical_id }}Certificate"

  # This Recipe reads from infra.overrides:
  #   HostedZoneId - string, required (each DomainValidationOptions entry's
  #                  HostedZoneId), the ID of the operator's Route 53 public
  #                  hosted zone
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # HostedZoneId is the property's own name, which is what a reader matches
  # against the resource documentation. The zone is the operator's: the
  # Route 53 public hosted zone that serves every name the certificate
  # carries, given by its ID, such as Z0123456789ABCDEFGHIJ, without the
  # /hostedzone/ prefix the Route 53 ListHostedZones API returns, which the
  # DomainValidationOption reference says CloudFormation does not take. That
  # reference says the HostedZoneId "causes ACM to add your CNAME to the
  # domain record", and that it is required for a publicly trusted
  # certificate. The fragment writes one DomainValidationOptions entry for
  # each distinct name, domain_name first, then each of
  # subject_alternative_names in its order, each naming that zone, so every
  # name's validation record is written into it; the
  # AWS::CertificateManager::Certificate reference requires domain_name among
  # those entries for CloudFormation to validate the certificate itself. A
  # wildcard name and its base name share one validation record (ACM User
  # Guide, "AWS Certificate Manager DNS validation"), and both entries name
  # it. ACM looks for each record in public DNS, so a private hosted zone,
  # or a zone not serving a name, leaves that name unvalidated, and ACM marks
  # the certificate as timed out after 72 hours (the same guide,
  # "Troubleshoot DNS validation problems"). The CloudFormation reference
  # does not say what CloudFormation does with a validation record already
  # in the zone, nor whether it removes the records when it deletes the
  # certificate. A record left in the zone keeps validating its name for
  # every later certificate the account requests for it, in any Region, and
  # removing it stops ACM renewing a certificate that still carries the
  # name.
  #
  # host is not read: a certificate has no address, so
  # infra.overrides.host halts the build naming it. Tags is not read: no
  # CloudFormation Recipe of this catalog reads one, and it halts as any key
  # not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.domain_name, as the certificate's DomainName and the
  #     first DomainValidationOptions entry; values.subject_alternative_names,
  #     as its SubjectAlternativeNames, written only while set, and a
  #     DomainValidationOptions entry for each name not already listed; and
  #     the override above. The Component refuses more than 100 names, for
  #     every realization, and its schema the names ACM does not take.
  #   refused — HostedZoneId unset, not a string or empty, or beginning
  #     /hostedzone/; infra.overrides.host; and any infra.overrides key not
  #     listed above.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The terraform Recipe of this Component holds the same rule on zone_id:
  # each target reads the key under its own spelling, so the rule cannot sit
  # in the Component.
  #
  # What the fragment writes beside these: ValidationMethod DNS, always,
  # since the resource validates by email when none is given (the
  # AWS::CertificateManager::Certificate reference). It writes nothing else
  # of the certificate's own, so ACM's and CloudFormation's defaults hold:
  # an RSA_2048 key pair, ACM's default KeyAlgorithm; certificate
  # transparency logging, which ACM no longer lets a public certificate opt
  # out of (RequestCertificate); no export, the reference's default for a
  # certificate whose CertificateExport is not given; no private certificate
  # authority. The terraform Recipe of this Component writes the same, so
  # both targets agree. Nothing beside the certificate is declared: no
  # hosted zone, record set, IAM role or policy.
  #
  # Waiting for validation. CloudFormation completes the certificate's
  # creation once ACM has issued it, and until then the stack stays in
  # CREATE_IN_PROGRESS (the AWS::CertificateManager::Certificate reference);
  # the resource type's schema, as cfn-lint 1.60.1 carries it, gives its
  # creation 2,160 minutes. ACM's User Guide says a certificate may stay
  # pending validation for up to 30 minutes after its records are written.
  #
  # Deletion and replacement. The certificate keeps CloudFormation's own
  # deletion policy, Delete: deleting the stack or removing the component
  # deletes it, and renaming the component, which changes its logical id,
  # creates a new certificate and deletes the old one. DomainName,
  # SubjectAlternativeNames and DomainValidationOptions take Replacement on
  # update (the reference), so changing domain_name,
  # subject_alternative_names or HostedZoneId creates a new certificate,
  # issued under a new ARN, points the stack's references at it, and deletes
  # the old one, the order CloudFormation's "Update behaviors of stack
  # resources" gives for a replacement. ACM refuses to delete a certificate
  # another AWS service uses (DeleteCertificate), so a deletion fails while
  # a load balancer, API Gateway domain name or CloudFront distribution
  # outside the stack still names the old certificate: remove that
  # association first.
  #
  # Credentials. A certificate holds no credential a consumer presents: its
  # private key cannot be exported, and the AWS services ACM integrates with
  # use it under the consumer's own configuration, so nothing is published
  # but the ARN. Backup. ACM keeps nothing to back up: a certificate is
  # requested again from its names.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "HostedZoneId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a certificate has no address of its own: a consumer names it by its ARN and presents it at the consumer's own address: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads HostedZoneId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # HostedZoneId is required and written into each DomainValidationOptions
    # entry as a zone ID, the form the DomainValidationOption reference says
    # CloudFormation takes.
    hosted_zone_id: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "HostedZoneId") -}}
      {{- fail "infra.overrides.HostedZoneId is unset, and this Recipe validates every name of the certificate through DNS, writing each name's validation record into the operator's Route 53 public hosted zone: set infra.overrides.HostedZoneId in the Release to the ID of the hosted zone serving those names" -}}
      {{- end -}}
      {{- $z := $o.HostedZoneId -}}
      {{- if not (and (typeIs "string" $z) $z) -}}
      {{- fail (printf "infra.overrides.HostedZoneId is %s, and it is the ID of a Route 53 hosted zone, a string such as Z0123456789ABCDEFGHIJ: set it in the Release to the ID of the hosted zone serving the certificate's names" (toJson $z)) -}}
      {{- end -}}
      {{- if hasPrefix "/hostedzone/" $z -}}
      {{- fail (printf "infra.overrides.HostedZoneId is %s, and CloudFormation takes a hosted zone ID without the /hostedzone/ prefix the Route 53 API returns: set it in the Release to %s" $z (trimPrefix "/hostedzone/" $z)) -}}
      {{- end -}}

  # The fragment. Each name is written as a JSON string, so a wildcard name's
  # leading * stays a string in YAML.
  artifacts:
    template.yaml: |
      {{- $l := .locals.logical_id }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $sans := optional .values "subject_alternative_names" list }}
      Resources:
        {{ $l }}Certificate:
          Type: AWS::CertificateManager::Certificate
          Properties:
            DomainName: {{ toJson .values.domain_name }}
            {{- with $sans }}
            SubjectAlternativeNames: {{ toJson . }}
            {{- end }}
            ValidationMethod: DNS

            ## ── Provider-specific overrides ─────────────────────────
            DomainValidationOptions:
            {{- range uniq (prepend $sans (toString .values.domain_name)) }}
              - DomainName: {{ toJson . }}
                HostedZoneId: {{ toJson $o.HostedZoneId }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # certificates in one stack keep their identities apart. A cross-stack
      # consumer imports this entry; an intra-stack consumer receives it
      # through the value-pipe above.
      provides:
        arn: !Ref {{ $l }}Certificate
