apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: postgres-rds
  version: 1.0.0
  description: >
    PostgreSQL via AWS RDS, rendered as a CloudFormation fragment. The artifact
    emits only the RDS DBInstance resource under a Resources block; the
    cloudformation provider stamps the stack envelope and projects this recipe's
    provides entries into the stack Outputs when it assembles the boundary's
    fragments into one stack template. The managed-service realization: the
    operator's ha sizing maps onto the instance's native MultiAZ setting, an
    attached core/backup onto its automated backups, and RDS owns the master
    password, in AWS Secrets Manager: a credential on the password slot other
    than core/generated-secret, or any on app_user_password, halts the build.

    host publishes a CloudFormation reference to the instance's address, which
    resolves inside the stack and through its export; port publishes the port
    infra.port configures, which a consumer on any target can use. Set
    infra.overrides.host in the Release to the DNS name or IP literal the
    instance is reached at, and host publishes that name instead. The Recipe
    emits nothing for it — no DNS record, no alias — so pointing the name at
    the instance is the operator's.

    A value RDS cannot apply — an encoding, a locale, init scripts, a raw
    configuration file, read replicas — halts the build naming the key;
    compute.cpu and compute.memory are not read, because the instance class
    sizes the instance. On terraform the same component is also realized by
    terraform/postgres-rds-terraform-aws-modules, the terraform-aws-modules
    project's published RDS module. Point-in-time recovery comes with the
    automated backups, so infra.point_in_time_recovery: false on core/backup
    halts by name.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/datastore/postgres:1.0.0

  # The resource's logical id, derived from this instance's own name so that two
  # databases of the same type deployed into one stack describe two resources
  # rather than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance payments-db names the
  # resource PaymentsDb. The name carries only which instance the resource belongs
  # to, because the resource type below already says what it is — the same shape
  # the terraform realization of this database uses.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The name the Release gives the instance under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Amazon RDS automated backups"

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this database, and resolves none
  # of them. host is a CloudFormation intrinsic function reference, which
  # CloudFormation resolves at stack creation time. The provider projects the
  # matching provides block inside the fragment below into the assembled stack
  # Outputs; this recipe-level provides is the value-pipe contract, the fragment
  # provides is the Outputs source, and they carry the same values. user/database
  # mirror the developer values.
  #
  # host reads locals.logical_id rather than repeating the derivation it holds.
  # A node's locals resolve before its provides, so a provides template reads
  # .locals and receives the resolved value: the logical id is derived once, and
  # the fragment below and this entry all follow that one definition.
  #
  # While the Release sets infra.overrides.host, host publishes that name in
  # both provides blocks instead of the reference. It is the operator's
  # deterministic pointer: the compiler pipes it as text and looks nothing up,
  # and this Recipe emits no DNS record or alias for it, so the operator points
  # the name at the instance outside the Release. A consumer in the same
  # stack receives the name as well, and a name carries no reference for
  # CloudFormation to create that consumer after this instance by; a later
  # syncWave on the consumer's boundary, sharing this boundary's directory,
  # orders the two. A consumer in another stack imports the name through the
  # same export it imports the reference through.
  #
  # port is the value the fragment sets on the instance's Port property, so it
  # is known ahead of time and published as that value in both blocks: a
  # consumer on any target can use it.
  #
  # The metrics keys are published empty, here and not in the fragment's own
  # provides, which carries only the outputs the stack exports: the instance is
  # a managed service with no pods to discover, and RDS publishes its metrics to
  # the cloud provider's own monitoring rather than to a Prometheus endpoint.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}!GetAtt {{ .locals.logical_id }}.Endpoint.Address{{ end }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""

  # This Recipe reads from infra.overrides:
  #   DeletionPolicy       - string (the resource's DeletionPolicy; default "Snapshot")
  #   DBInstanceClass      - string (Properties.DBInstanceClass; default "db.t3.small")
  #   MultiAZ              - bool (Properties.MultiAZ; defaults to infra.ha.enabled)
  #   DBSubnetGroupName    - string (Properties.DBSubnetGroupName)
  #   VPCSecurityGroups    - []string (Properties.VPCSecurityGroups)
  #   DBParameterGroupName - string (Properties.DBParameterGroupName)
  #   StorageEncrypted     - bool (Properties.StorageEncrypted)
  #   KmsKeyId             - string (Properties.KmsKeyId; emitted only when StorageEncrypted is set)
  #   host                 - string (published as provides.host; renders nothing)
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged and
  # the property name is what a reader matches against the resource
  # documentation. The first three carry defaults; the rest emit nothing when
  # unset. host is the exception to the naming: it is no property of the
  # resource but the address a consumer reaches the database at, under the name
  # the catalog's referenced realization, helm/postgres-external, reads for the
  # same address.
  #
  # host is a bare DNS name or IP literal. The assertion below refuses a value
  # carrying a scheme, a path, a user, a port or whitespace, because a consumer
  # composes its connection from host and port and would compose a broken one;
  # the port is infra.port. A value carrying exactly one colon is a name or an
  # IPv4 literal with a port; an IPv6 literal carries several and is accepted.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.database, values.user, infra.port,
  #     infra.engine_version, infra.storage.size, infra.storage.type (gp3
  #     when unset), infra.ha.enabled, a core/backup attachment, as the
  #     comment above the fragment says, the password slot left empty or
  #     bound to core/generated-secret, and the overrides above.
  #   refused — values.encoding, values.locale, values.init_scripts,
  #     values.custom_config, infra.ha.read_replicas above zero, any other
  #     credential on the password slot and any on app_user_password, as the
  #     comment above the credentials assertion says, and infra.credentials
  #     supplied and any infra.credentials_secret, which configure the
  #     controller-driven realization, as the comment above the
  #     infra_credentials assertion says.
  #   not read — infra.compute.cpu and infra.compute.memory, whose Component
  #     defaults would size a container: RDS sizes the instance by its instance
  #     class, and a Recipe cannot tell those defaults from a value the Release
  #     wrote, so the Component's description says so instead.
  #     values.app_user and infra.control_plane_present configure other
  #     realizations, as their descriptions say. infra.credentials and
  #     infra.credentials_secret while they hold the Component's defaults.
  assertions:
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    # This fragment declares one instance, so a replica count is refused rather
    # than dropped. terraform/postgres-rds provisions replicas beside the
    # primary.
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions one instance: set infra.ha.read_replicas to 0, or map this component to terraform/postgres-rds, which provisions read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}
    # RDS creates the database itself and runs no initdb, no initialisation
    # scripts and no configuration file of the reader's; its server settings
    # come from the instance's parameter group.
    values_rds_cannot_apply: >-
      {{- if optional .values "encoding" "" -}}
      {{- fail "values.encoding asks for the encoding initdb creates the database with, and an RDS instance takes no such setting when it is created: remove values.encoding from the Aggregate, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "locale" "" -}}
      {{- fail "values.locale asks for the locale initdb creates the database with, and an RDS instance takes no such setting when it is created: remove values.locale from the Aggregate, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and an RDS instance runs none: remove values.init_scripts from the Aggregate and run them against the instance once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and an RDS instance reads none: its server settings come from a DB parameter group, which the Release names in infra.overrides.DBParameterGroupName; remove values.custom_config from the Aggregate" -}}
      {{- end -}}
    # RDS generates the master password and keeps it in AWS Secrets Manager,
    # and creates no user but the master user values.user names, so a
    # credential attached to either slot would reach no byte of the output
    # while the build reads as if it had set the password. The password slot
    # stays empty, or takes core/generated-secret, which says the service owns
    # the password and renders nothing; any other credential there, and any on
    # app_user_password, halts naming the slot and what filled it. The type is
    # compared with any version set aside. Every PostgreSQL RDS Recipe of this
    # catalog, on terraform and CloudFormation, declares this assertion word
    # for word: a change to it is made to each of them.
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "app_user_password" -}}
      {{- fail "a credential is attached to the app_user_password slot, and Amazon RDS creates the one master user values.user names, whose password it generates and keeps in AWS Secrets Manager: remove the attachment when deploying to this target, or map this component to the synthesized helm Recipe, which creates the application role" -}}
      {{- end -}}
      {{- if hasKey $f "password" -}}
      {{- $ty := toString (optional $f.password "type" "") -}}
      {{- if ne (first (splitList ":" $ty)) "core/generated-secret" -}}
      {{- fail (printf "the password slot is filled by %s, and Amazon RDS generates this database's master password itself and keeps it in AWS Secrets Manager, so the attachment would set nothing: remove it from the password slot when deploying to this target, or attach core/generated-secret there, which says the service owns the password" (default "an attachment of no type" $ty)) -}}
      {{- end -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. RDS generates the master password
    # itself, keeps it in AWS Secrets Manager and reads no Secret, so supplied,
    # or any Secret name, would reach no byte of the output while the build
    # reads as if it had chosen who owns the password: each halts naming the
    # key, and the Component's defaults, generated and empty, pass. Every
    # PostgreSQL RDS Recipe of this catalog, on terraform and CloudFormation,
    # declares this assertion word for word: a change to it is made to each of
    # them.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and Amazon RDS generates this database's master password itself and keeps it in AWS Secrets Manager: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database owner's credentials from, and Amazon RDS generates this database's master password itself and keeps it in AWS Secrets Manager, reading no Secret: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}

  # infra.storage.type is the RDS storage type here, not a storage class. The
  # Component declares no default for it, because on Kubernetes an unset class
  # leaves the volume to the cluster's default storage class; this Recipe
  # supplies its own instead, so a Release that names none provisions gp3.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside, and kept as the
  # instance's own automated backups, which this Recipe sets through the
  # properties BackupRetentionPeriod and PreferredBackupWindow:
  #   - With none attached, RDS keeps automated backups for 7 days, in a
  #     window it chooses.
  #   - An attachment carrying no infra.role_arn, bound to
  #     cloudformation/backup-native, configures them. infra.retention_days is
  #     BackupRetentionPeriod, 1 to 35 days, the range RDS keeps, and a value
  #     outside it halts naming the attachment. infra.schedule, where set,
  #     must name one minute and one hour of every day, such as 30 2 * * *:
  #     RDS takes one automated backup a day, in a window it reads in UTC, so
  #     that time opens PreferredBackupWindow, 30 minutes long, the shortest
  #     window RDS takes, 02:30-03:00 here; any other expression halts
  #     naming it. Unset, RDS chooses the window.
  #   - An attachment carrying infra.role_arn is AWS Backup's, which backs the
  #     instance up on a schedule of its own. The instance keeps its
  #     automated backups beside it as with none attached, unless that
  #     attachment sets infra.keep_automated_backups to false, which sets the
  #     retention to zero, turning them off.
  #   - Two attachments carrying no infra.role_arn, or one beside an AWS
  #     Backup attachment setting infra.keep_automated_backups to false, halt
  #     naming both: an instance runs one automated backup.
  #   - Point-in-time recovery is Amazon RDS's for as long as the instance
  #     keeps automated backups, with no setting of its own, so left out or
  #     true, infra.point_in_time_recovery is what the instance gives, and
  #     false on an attachment carrying no infra.role_arn halts naming it. On
  #     an AWS Backup attachment, true asks AWS Backup for a continuous backup,
  #     which takes over the instance's automated backups and keeps them for
  #     as many days as its own, so the retention written here is then that
  #     attachment's infra.retention_days and no window is written; another
  #     attachment configuring the automated backups or turning them off halts
  #     naming both, and so do two asking for a continuous backup. false there
  #     is AWS Backup's to keep, as without the option.
  # A Recipe's locals cannot read its attachments, so the reading sits at the
  # top of the template below, and every RDS Recipe of this catalog, on
  # terraform and CloudFormation, declares it word for word: a change to it
  # is made to each of them.
  artifacts:
    template.yaml: |
      {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
      {{- $backupNative := "" -}}{{- $backupNativeInfra := dict -}}{{- $backupKeepOn := "" -}}{{- $backupKeepOff := "" -}}{{- $backupContinuous := "" -}}{{- $backupContinuousInfra := dict -}}
      {{- range $name, $attachment := (default dict .features) -}}
      {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
      {{- $in := default dict (optional $attachment "infra" dict) -}}
      {{- if trim (toString (optional $in "role_arn" "")) -}}
      {{- if hasKey $in "keep_automated_backups" -}}
      {{- if $in.keep_automated_backups }}{{ $backupKeepOn = $name }}{{ else }}{{ $backupKeepOff = $name }}{{ end -}}
      {{- end -}}
      {{- if eq (toString (optional $in "point_in_time_recovery" "")) "true" -}}
      {{- if $backupContinuous -}}
      {{- fail (printf "core/backup attachments %q and %q on %q both set infra.point_in_time_recovery to true, each asking AWS Backup for a continuous backup of the instance, and AWS Backup keeps one continuous backup of a resource: set it on one of the two" $backupContinuous $name $.context.instance_id) -}}
      {{- end -}}
      {{- $backupContinuous = $name -}}{{- $backupContinuousInfra = $in -}}
      {{- end -}}
      {{- else if $backupNative -}}
      {{- fail (printf "core/backup attachments %q and %q on %q both leave its backup to Amazon RDS, which runs one automated backup on an instance: remove one of the two, or bind one to AWS Backup in the Manifest" $backupNative $name $.context.instance_id) -}}
      {{- else -}}
      {{- $backupNative = $name -}}{{- $backupNativeInfra = $in -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if and $backupNative $backupKeepOff -}}
      {{- fail (printf "core/backup attachment %q on %q has Amazon RDS keep automated backups of the instance, and core/backup attachment %q sets infra.keep_automated_backups to false, turning them off: remove one of the two attachments, or infra.keep_automated_backups" $backupNative .context.instance_id $backupKeepOff) -}}
      {{- end -}}
      {{- if and $backupKeepOn $backupKeepOff -}}
      {{- fail (printf "core/backup attachments %q and %q on %q set infra.keep_automated_backups to true and to false, and the instance either keeps its automated backups or does not: set the option on one of the two" $backupKeepOn $backupKeepOff .context.instance_id) -}}
      {{- end -}}
      {{- if eq (toString (optional $backupNativeInfra "point_in_time_recovery" "")) "false" -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and Amazon RDS keeps point-in-time recovery for as long as it keeps automated backups, which this attachment configures, with no setting that turns it off: remove infra.point_in_time_recovery from the attachment, or set it to true" $backupNative .context.instance_id) -}}
      {{- end -}}
      {{- if and $backupContinuous $backupNative -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, so AWS Backup keeps a continuous backup of the instance and takes over its automated backups, their window and how many days they are kept, and core/backup attachment %q configures those automated backups too: remove one of the two attachments, or infra.point_in_time_recovery" $backupContinuous .context.instance_id $backupNative) -}}
      {{- end -}}
      {{- if and $backupContinuous $backupKeepOff (ne $backupContinuous $backupKeepOff) -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to true, and AWS Backup's continuous backup keeps the instance's automated backups on, for as many days as its own, while core/backup attachment %q sets infra.keep_automated_backups to false, turning them off: remove one of the two attachments, or one of the two options" $backupContinuous .context.instance_id $backupKeepOff) -}}
      {{- end -}}
      {{- $backupRetention := 7 -}}{{- $backupWindow := "" -}}
      {{- if $backupKeepOff }}{{ $backupRetention = 0 }}{{ end -}}
      {{- if $backupContinuous }}{{ $backupRetention = int (optional $backupContinuousInfra "retention_days" 7) }}{{ end -}}
      {{- if $backupNative -}}
      {{- $backupRetention = int (optional $backupNativeInfra "retention_days" 7) -}}
      {{- if or (lt $backupRetention 1) (gt $backupRetention 35) -}}
      {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and Amazon RDS keeps automated backups for 1 to 35 days: set infra.retention_days to 35 or fewer, or bind the attachment to AWS Backup in the Manifest, which keeps backups longer" $backupNative .context.instance_id $backupRetention) -}}
      {{- end -}}
      {{- with trim (toString (optional $backupNativeInfra "schedule" "")) -}}
      {{- $f := regexSplit `\s+` . -1 -}}
      {{- if not (and (eq (len $f) 5) (regexMatch `^[0-9]{1,2}$` (index $f 0)) (regexMatch `^[0-9]{1,2}$` (index $f 1)) (lt (atoi (index $f 0)) 60) (lt (atoi (index $f 1)) 24) (has (index $f 2) (list "*" "?")) (has (index $f 3) (list "*" "?")) (has (index $f 4) (list "*" "?"))) -}}
      {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and Amazon RDS takes one automated backup a day, in a window opening at a time of day it reads in UTC: write a schedule naming one minute and one hour of every day, such as 30 2 * * *, or remove infra.schedule to let RDS choose the time" $backupNative $.context.instance_id .) -}}
      {{- end -}}
      {{- $start := add (mul (atoi (index $f 1)) 60) (atoi (index $f 0)) -}}
      {{- $end := mod (add $start 30) 1440 -}}
      {{- $backupWindow = printf "%02d:%02d-%02d:%02d" (div $start 60) (mod $start 60) (div $end 60) (mod $end 60) -}}
      {{- end -}}
      {{- end -}}
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::RDS::DBInstance
          DeletionPolicy: {{ if .infra.overrides }}{{ .infra.overrides.DeletionPolicy | default "Snapshot" }}{{ else }}Snapshot{{ end }}
          Properties:
            Engine: postgres
            EngineVersion: "{{ .infra.engine_version }}"
            Port: {{ .infra.port }}
            DBName: "{{ .values.database }}"
            MasterUsername: "{{ .values.user }}"
            ManageMasterUserPassword: true

            ## ── Compute ────────────────────────────────────────────
            DBInstanceClass: {{ if .infra.overrides }}{{ .infra.overrides.DBInstanceClass | default "db.t3.small" }}{{ else }}db.t3.small{{ end }}

            ## ── Storage ────────────────────────────────────────────
            AllocatedStorage: {{ trimSuffix "Gi" .infra.storage.size }}
            StorageType: "{{ .infra.storage.type | default "gp3" }}"

            ## ── HA ─────────────────────────────────────────────────
            MultiAZ: {{ if .infra.overrides }}{{ optional .infra.overrides "MultiAZ" .infra.ha.enabled }}{{ else }}{{ .infra.ha.enabled }}{{ end }}

            ## ── Backup ─────────────────────────────────────────────
            BackupRetentionPeriod: {{ $backupRetention }}
            {{- if $backupWindow }}
            PreferredBackupWindow: "{{ $backupWindow }}"
            {{- end }}

            ## ── Provider-specific overrides ─────────────────────────
            {{- if .infra.overrides }}
            {{- if .infra.overrides.DBSubnetGroupName }}
            DBSubnetGroupName: "{{ .infra.overrides.DBSubnetGroupName }}"
            {{- end }}
            {{- if .infra.overrides.VPCSecurityGroups }}
            VPCSecurityGroups: {{ toJson .infra.overrides.VPCSecurityGroups }}
            {{- end }}
            {{- if .infra.overrides.DBParameterGroupName }}
            DBParameterGroupName: "{{ .infra.overrides.DBParameterGroupName }}"
            {{- end }}
            {{- if .infra.overrides.StorageEncrypted }}
            StorageEncrypted: {{ .infra.overrides.StorageEncrypted }}
            KmsKeyId: "{{ .infra.overrides.KmsKeyId }}"
            {{- end }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two databases
      # of the same type in one stack keep their connection identities apart. A
      # cross-stack consumer imports the host entry; an intra-stack consumer
      # receives it through the value-pipe above.
      provides:
        host: {{ if .locals.operator_host }}"{{ .locals.operator_host }}"{{ else }}!GetAtt {{ .locals.logical_id }}.Endpoint.Address{{ end }}
        port: "{{ .infra.port }}"
        user: "{{ .values.user }}"
        database: "{{ .values.database }}"
        protocol: postgres
