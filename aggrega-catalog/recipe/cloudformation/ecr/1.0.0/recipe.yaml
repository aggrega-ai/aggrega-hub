apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ecr
  version: 1.0.0
  description: >
    Amazon ECR on CloudFormation: one AWS::ECR::Repository named after the
    component, which the cloudformation provider assembles into the
    boundary's stack, with the tag mutability and scan on push its values
    set. host, repository_uri and arn publish CloudFormation references to
    the registry's name, the repository's URI and its ARN, which
    CloudFormation resolves when it creates the stack.

    Amazon ECR encrypts the images with Amazon S3-managed keys unless
    KmsKeyId names the operator's KMS key by its ARN, and expires images by
    the lifecycle policy LifecyclePolicyText gives, or by none. No repository
    policy, registry setting, role or key is created. Deleting the stack, or
    removing the repository from it, fails while the repository holds an
    image; a stack update changing KmsKeyId fails, as Amazon ECR fixes a
    repository's encryption and CloudFormation replaces no repository whose
    name it sets.

    infra.overrides.host halts the build, since the registry answers at the
    name Amazon ECR gives it, as do a KmsKeyId other than a key's ARN, a
    LifecyclePolicyText other than a JSON object of 100 to 30,720 characters
    and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/devtool/ecr:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two repositories deployed into one stack describe two resources rather
  # than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are
  # read as word boundaries and each word is capitalised: instance api-images
  # names the resource ApiImagesRepository.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this repository, and resolves
  # none of them. repository_uri and arn are the resource's RepositoryUri and
  # Arn attributes (the CloudFormation reference for AWS::ECR::Repository:
  # 123456789012.dkr.ecr.us-west-2.amazonaws.com/repository and
  # arn:aws:ecr:eu-west-1:123456789012:repository/test-repository). host is
  # the part of RepositoryUri before its first slash, the registry's name,
  # which the repository's name, made of letters, digits, underscores and
  # hyphens, never adds a slash to. CloudFormation resolves each when it
  # creates the repository, so a consumer in the same stack reading any of
  # them is created after it. The provider projects the matching provides
  # block inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides
  # is the Outputs source, and they carry the same values.
  provides:
    host: "!Select [0, !Split [\"/\", !GetAtt {{ .locals.logical_id }}Repository.RepositoryUri]]"
    repository_uri: "!GetAtt {{ .locals.logical_id }}Repository.RepositoryUri"
    arn: "!GetAtt {{ .locals.logical_id }}Repository.Arn"

  # This Recipe reads from infra.overrides:
  #   KmsKeyId            - string (EncryptionConfiguration.KmsKey, with
  #                         EncryptionType KMS)
  #   LifecyclePolicyText - string (LifecyclePolicy.LifecyclePolicyText)
  # host halts by name, as any key not listed does.
  #
  # KmsKeyId is the name the catalog's CloudFormation Recipes read for the KMS
  # key a resource is encrypted with, so a Release names the operator's key
  # once whichever Recipe it encrypts; LifecyclePolicyText is the property's
  # own name, which is what a reader matches against the resource
  # documentation.
  #
  # KmsKeyId names the operator's KMS key by its ARN,
  # arn:<partition>:kms:<region>:<account>:key/<key id>, the key ID a UUID
  # or, for a multi-Region key, mrk- and 32 hexadecimal digits, and makes
  # Amazon ECR encrypt the repository's image layers and manifests with that
  # key (the Amazon ECR User Guide's "Encryption at rest": each push asks
  # AWS KMS for a data key under it "for encrypting the image layer and
  # manifest"). Amazon ECR takes an alias, a key ID or a key ARN for the
  # field (the API Reference's EncryptionConfiguration) and records the
  # key's ARN when it creates the repository ("Encryption at rest": it calls
  # DescribeKey "to validate and retrieve the Amazon Resource Name (ARN)" of
  # the key; the CloudFormation resource schema compares a key ID it was
  # given with the key ARN it reads back). On CloudFormation an alias or a
  # key ID would deploy without drift; the refusal holds this Recipe and
  # terraform/ecr to one rule, the key's ARN, the form Amazon ECR records and
  # the one Terraform needs to avoid replacing the repository, so an alias
  # ARN, an alias name such as alias/example-key and a bare key ID halt the
  # build. The key is the operator's, in the repository's Region ("Encryption
  # at rest": "the key must exist in the same Region as your repository"),
  # with the permissions "Encryption at rest" lists: kms:CreateGrant and
  # kms:DescribeKey in the key's policy or in an IAM policy, and
  # kms:RetireGrant in the IAM policy of the identities that create and
  # delete the repository ("The kms:RetireGrant permission must be added to
  # the IAM policy of the user or role creating the repository"; the identity
  # that deletes it needs it to retire the grants). Amazon ECR creates grants
  # on it for the repository and retires them when the repository is
  # deleted. It is named here and never created. Unset, the
  # fragment writes EncryptionType AES256, the service's own default: Amazon
  # ECR encrypts the images with Amazon S3-managed keys (SSE-S3). The AWS
  # managed key aws/ecr and dual-layer encryption (KMS_DSSE, offered in the
  # AWS GovCloud (US) Regions alone) are not offered.
  #
  # Amazon ECR fixes a repository's encryption when it creates it
  # ("Encryption at rest": "Repository Encryption Configuration can't be
  # changed after a repository is created"), and the CloudFormation reference
  # marks EncryptionConfiguration "Replacement" while, for a repository whose
  # RepositoryName the template sets, "you cannot perform updates that
  # require replacement of this resource". So a stack update that sets,
  # changes or removes KmsKeyId on a deployed repository fails; a repository
  # under the new encryption takes a new component name.
  #
  # LifecyclePolicyText is a lifecycle policy, a JSON object of rules Amazon
  # ECR applies to the repository's images (the Amazon ECR User Guide's
  # "Lifecycle policy template"), written as text: a policy expires, and so
  # deletes, the images its rules select. Amazon ECR takes the text at 100 to
  # 30,720 characters (the API Reference's PutLifecyclePolicy), and this
  # Recipe halts the build on text outside that length or not holding a JSON
  # object; the rules inside are Amazon ECR's to judge when it applies the
  # policy. Unset, the repository carries no lifecycle policy and keeps every
  # image until a client deletes it. Setting, changing or removing it updates
  # the repository in place (the CloudFormation reference: "No
  # interruption").
  #
  # host is refused by name. The registry answers at the name Amazon ECR
  # gives it, <account>.dkr.ecr.<region>.amazonaws.com (the Amazon ECR User
  # Guide's "Amazon ECR private registry"), under a certificate for that
  # name, so a client checking the certificate would refuse any other name.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.image_tag_mutability (ImageTagMutability) and
  #     values.scan_on_push (ImageScanningConfiguration.ScanOnPush), each
  #     written as the Component's default when unset, and the overrides
  #     above.
  #   refused — a KmsKeyId other than a key's ARN; a LifecyclePolicyText
  #     that is not a JSON object of 100 to 30,720 characters;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   held by the Component — values.image_tag_mutability to IMMUTABLE and
  #     MUTABLE, and the component's name, which names the repository, to
  #     Amazon ECR's rule for a repository name.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the fragment leaves out: RepositoryPolicyText, so the repository
  # carries no repository policy and access to it is granted through the IAM
  # policies of identities in its account, which alone has access to a
  # repository without one (the Amazon ECR User Guide's "Private repository
  # policies in Amazon ECR"), so access from another account is not offered;
  # ImageTagMutabilityExclusionFilters, which the Component's tag mutability
  # settings use none of; and Tags. No registry-wide setting is written: the
  # registry's scanning configuration, replication, pull through cache rules
  # and registry policy are the operator's.
  #
  # The name. The repository is named after the component, and the resource's
  # logical ID follows the name too (api-images is ApiImagesRepository).
  # Renaming the component therefore removes one resource from the template
  # and adds another, not a replacement of RepositoryName. CloudFormation
  # creates the new repository, and the cleanup deletes the old one (the
  # CloudFormation User Guide's stack status
  # UPDATE_COMPLETE_CLEANUP_IN_PROGRESS: it "creates the new resources first
  # and then deletes the old resources"), which fails while the old one
  # holds an image, as below; the images stay in it, and moving them is the
  # operator's. What the stack then does is not verified. A repository's name is unique within its registry
  # (CreateRepository: RepositoryAlreadyExistsException), so a stack naming
  # a repository that already exists there fails to create it.
  #
  # Deletion. The fragment writes EmptyOnDelete false, CloudFormation's own
  # default, so Amazon ECR deletes the repository only while it holds no
  # image: "If false, the repository must be empty before attempting to
  # delete it" (the CloudFormation reference's EmptyOnDelete), and Amazon
  # ECR refuses with RepositoryNotEmptyException otherwise (the API
  # Reference's DeleteRepository). Deleting the stack, or removing the
  # repository from it, therefore deletes an empty repository and fails at
  # one holding an image, so no image is deleted with it; the images are the
  # operator's to delete first. terraform/ecr holds the same rule.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "KmsKeyId" "LifecyclePolicyText" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon ECR registry answers at the name Amazon ECR gives it, under a certificate for that name, so a client checking the certificate refuses any other name: remove infra.overrides.host from the Release, and read the host the repository publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads KmsKeyId and LifecyclePolicyText from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # KmsKeyId the ARN of a key, and LifecyclePolicyText a JSON object of the
    # length Amazon ECR takes, as the header says. The same checks stand in
    # terraform/ecr: the override keys are spelt differently per target, so
    # the checks cannot sit in the realization-neutral Component, and a
    # MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32})$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and this Recipe takes the KMS key an Amazon ECR repository is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/<key id>, the form Amazon ECR records, not an alias or a bare key ID: set it to the key's ARN in the Release, or remove it to encrypt the images with Amazon S3-managed keys" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "LifecyclePolicyText" -}}
      {{- $p := get $o "LifecyclePolicyText" -}}
      {{- if not (and (typeIs "string" $p) (ge (len $p) 100) (le (len $p) 30720) (kindIs "map" (fromJson $p))) -}}
      {{- fail (printf "infra.overrides.LifecyclePolicyText is %s, and Amazon ECR takes a lifecycle policy as the text of a JSON object of 100 to 30,720 characters: set it in the Release to such a policy, or remove it to keep every image" (trunc 120 (toJson $p))) -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema and assertions
  # hold them: image_tag_mutability IMMUTABLE or MUTABLE, scan_on_push a
  # boolean, each defaulted. The lifecycle policy is written as one JSON
  # string, which Amazon ECR reads as the policy's text.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Repository:
          Type: AWS::ECR::Repository
          Properties:
            RepositoryName: {{ toJson .context.instance_id }}
            ImageTagMutability: {{ .values.image_tag_mutability }}
            ImageScanningConfiguration:
              ScanOnPush: {{ toJson .values.scan_on_push }}
            EmptyOnDelete: false

            ## ── Provider-specific overrides ─────────────────────────
            EncryptionConfiguration:
              {{- with optional $o "KmsKeyId" "" }}
              EncryptionType: KMS
              KmsKey: {{ toJson . }}
              {{- else }}
              EncryptionType: AES256
              {{- end }}
            {{- with optional $o "LifecyclePolicyText" "" }}
            LifecyclePolicy:
              LifecyclePolicyText: {{ toJson . }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # repositories in one stack keep their identities apart. A cross-stack
      # consumer imports an entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        host: !Select [0, !Split ["/", !GetAtt {{ .locals.logical_id }}Repository.RepositoryUri]]
        repository_uri: !GetAtt {{ .locals.logical_id }}Repository.RepositoryUri
        arn: !GetAtt {{ .locals.logical_id }}Repository.Arn
