apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sqs
  version: 1.0.0
  description: >
    Amazon SQS on CloudFormation: one AWS::SQS::Queue named after the
    component, with .fifo appended on a FIFO queue, which the cloudformation
    provider assembles into the boundary's stack. Every value of the
    Component is written onto the queue. queue_url and arn publish
    CloudFormation references to the queue's URL and ARN, which
    CloudFormation resolves when it creates the stack.

    SQS encrypts the queue with keys it owns, or with the operator's KMS
    key where KmsKeyId names one. No dead-letter queue, queue policy, key or
    role is created. Deleting the stack, or removing the queue from it,
    deletes the queue with every message it holds.

    infra.overrides.host halts the build, since a client reaches every
    queue at SQS's endpoint in its Region and names the queue by its URL, as
    do a KmsKeyId SQS cannot take and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/messaging/sqs:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two queues deployed into one stack describe two resources rather than one.
  # A logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance order-events names the
  # resource OrderEventsQueue.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The queue's name: the instance's name, followed by .fifo on a FIFO
    # queue, as SQS requires of a FIFO queue's name. The Component's assertion
    # holds the instance's name to SQS's rule for a queue name, the suffix
    # counted.
    queue_name: '{{ .context.instance_id }}{{ if .values.fifo_queue }}.fifo{{ end }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this queue, and resolves none of
  # them. queue_url is the queue's QueueUrl attribute and arn its Arn
  # attribute, each a reference CloudFormation resolves when it creates the
  # queue, so a consumer in the same stack reading either is created after
  # it. The provider projects the matching provides block inside the fragment
  # below into the assembled stack Outputs; this recipe-level provides is the
  # value-pipe contract, the fragment provides is the Outputs source, and they
  # carry the same values.
  provides:
    queue_url: "!GetAtt {{ .locals.logical_id }}Queue.QueueUrl"
    arn: "!GetAtt {{ .locals.logical_id }}Queue.Arn"

  # This Recipe reads from infra.overrides:
  #   KmsKeyId - string (Properties.KmsMasterKeyId)
  # host halts by name, as any key not listed does.
  #
  # KmsKeyId is the name the catalog's CloudFormation Recipes read for the KMS
  # key a resource is encrypted with, whatever the resource calls the field,
  # so a Release names the operator's key once whichever Recipe it encrypts;
  # here the field is KmsMasterKeyId.
  #
  # KmsKeyId names the operator's KMS key by one of the forms the resource
  # schema gives KmsMasterKeyId: a key ID (a UUID, or mrk- and 32 hexadecimal
  # digits for a multi-Region key), an alias name (alias/ followed by its
  # name), or the ARN of a key or of an alias. A value of another form halts
  # the build. The queue is then encrypted with SSE-KMS under that key, and
  # SQS reuses a data key for 300 seconds, the service's default, before
  # calling KMS again. The key, and its key policy, which lets the queue's
  # producers and consumers use it, are the operator's, named here and never
  # created. Unset, the fragment writes
  # SqsManagedSseEnabled true and SQS encrypts the queue with keys it owns
  # (SSE-SQS), as it does a queue created with no encryption setting. A queue
  # takes one of the two (the CreateQueue API reference), so the fragment
  # writes one or the other.
  #
  # host is refused by name. SQS publishes no address of a queue of its own:
  # a client calls SQS's endpoint in the queue's Region, an endpoint the
  # service names and offers no custom domain for, and names the queue by its
  # URL in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.fifo_queue (FifoQueue, and the .fifo suffix on the
  #     name), values.content_based_deduplication (ContentBasedDeduplication,
  #     on a FIFO queue), values.visibility_timeout (VisibilityTimeout),
  #     values.message_retention_period (MessageRetentionPeriod),
  #     values.delay_seconds (DelaySeconds), values.maximum_message_size
  #     (MaximumMessageSize), values.receive_message_wait_time_seconds
  #     (ReceiveMessageWaitTimeSeconds), and the override above.
  #   refused — a KmsKeyId of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the queue,
  #     and values.content_based_deduplication true on a standard queue.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The name and the queue's type. SQS fixes both when it creates the queue,
  # and both properties are create-only on the resource. Renaming the
  # component, or changing values.fifo_queue, which moves the name to or from
  # its .fifo suffix, makes CloudFormation create a new queue under the new
  # name and delete the old one, with every message it holds. SQS refuses a
  # queue under a name deleted less than 60 seconds before (the DeleteQueue
  # API reference).
  #
  # What the fragment writes beside the values: FifoQueue and
  # ContentBasedDeduplication on a FIFO queue alone, since SQS creates a
  # standard queue where FifoQueue is absent and takes
  # ContentBasedDeduplication on a FIFO queue alone; no RedrivePolicy, so the
  # queue moves no message to a dead-letter queue; no RedriveAllowPolicy, so
  # SQS's default lets any queue of the account in the same Region name this
  # one as its dead-letter queue; and no high-throughput setting on a FIFO
  # queue (DeduplicationScope, FifoThroughputLimit), so SQS keeps its normal
  # throughput and deduplicates across the queue.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy, Delete,
  # so deleting the stack, or removing the queue from it, deletes the queue,
  # and SQS deletes every message in it, regardless of the queue's contents
  # (the DeleteQueue API reference). SQS keeps no backup to restore it from.
  assertions:
    # The key this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon SQS publishes no address of a queue: a client calls SQS's endpoint in the queue's Region, which offers no custom domain, and names the queue by queue_url: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # KmsKeyId is passed to KmsMasterKeyId as written, in one of the forms the
    # resource schema gives that property: a key ID, an alias name, or a key
    # or alias ARN.
    # The same KMS key form check stands in the SQS and SNS Recipes of both
    # targets (cloudformation/sns, terraform/sqs, terraform/sns): the override key is spelt differently per
    # target, so the check cannot sit in the realization-neutral Component,
    # and a MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9:/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/\S+)$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and SQS takes the KMS key a queue is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to encrypt the queue with keys SQS owns" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema holds them: each
  # integer within the range SQS takes, each written as a whole number.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Queue:
          Type: AWS::SQS::Queue
          Properties:
            QueueName: "{{ .locals.queue_name }}"
            {{- if .values.fifo_queue }}
            FifoQueue: true
            ContentBasedDeduplication: {{ .values.content_based_deduplication }}
            {{- end }}
            VisibilityTimeout: {{ int64 .values.visibility_timeout }}
            MessageRetentionPeriod: {{ int64 .values.message_retention_period }}
            DelaySeconds: {{ int64 .values.delay_seconds }}
            MaximumMessageSize: {{ int64 .values.maximum_message_size }}
            ReceiveMessageWaitTimeSeconds: {{ int64 .values.receive_message_wait_time_seconds }}

            ## ── Provider-specific overrides ─────────────────────────
            {{- with optional $o "KmsKeyId" "" }}
            KmsMasterKeyId: {{ toJson . }}
            {{- else }}
            SqsManagedSseEnabled: true
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two queues
      # in one stack keep their identities apart. A cross-stack consumer imports
      # an entry; an intra-stack consumer receives it through the value-pipe
      # above.
      provides:
        queue_url: !GetAtt {{ .locals.logical_id }}Queue.QueueUrl
        arn: !GetAtt {{ .locals.logical_id }}Queue.Arn
