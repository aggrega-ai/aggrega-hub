apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: redis-elasticache
  version: 1.0.0
  description: >
    Redis OSS on Amazon ElastiCache, rendered as a CloudFormation fragment: one
    AWS::ElastiCache::ReplicationGroup with cluster mode disabled and one node,
    encrypted at rest, and a parameter group beside it where maxmemory_policy
    or databases is set. The cloudformation provider stamps the stack envelope
    and projects this Recipe's provides into the stack Outputs.

    ElastiCache runs Redis OSS up to 7.1, so infra.engine_version takes 7.1,
    7.0, 6.2, 6.0, 5.0.6 or 4.0.10, read off the start of the value; from 8 on
    it halts naming the key, the Component's default included, so the Release
    sets the version on this target. ElastiCache serves vector search on Valkey
    alone, so vector_search is empty and a gateway's semantic cache halts on
    this store.

    Reach for this realization where the cache is an ElastiCache service in a
    CloudFormation stack; reach for terraform/redis-elasticache on terraform,
    cloudformation/valkey-elasticache for a newer engine, or redis on helm or
    compose where it runs as a container.

    host is a reference to the primary endpoint's address, or
    infra.overrides.host while set; port is infra.port.
    infra.overrides.CacheSubnetGroupName is required. maxmemory, appendonly,
    persistence, infra.overrides.image, and databases below 6.0 halt naming
    the key; compute and storage are not read. With infra.client_tls the
    service encrypts in transit and protocol is redis-tls; an attached password
    becomes the AUTH token through a Secrets Manager dynamic reference, and
    needs client_tls.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/datastore/redis:1.0.0

  # The resource's logical id, derived from this instance's own name so that two
  # caches of the same type deployed into one stack describe two resources
  # rather than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance session-cache names
  # the resource SessionCache, and its parameter group SessionCacheParameterGroup.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The major version infra.engine_version begins with: 7 from 7.1, 8 from the
    # Component's default image tag 8.8.2-alpine.
    engine_major: '{{ regexFind `^[0-9]+` (toString .infra.engine_version) }}'
    # The engine version in the spelling ElastiCache takes for Redis OSS, which
    # CloudFormation passes to it unchanged: the major and minor version alone
    # from 6 on (6.0, 6.2, 7.0, 7.1; a patch is refused, and ElastiCache runs the
    # newest patch of that version), and the whole major.minor.patch below 6
    # (4.0.10, 5.0.6).
    engine_version: '{{ $t := toString .infra.engine_version }}{{ if and .locals.engine_major (ge (atoi .locals.engine_major) 6) }}{{ regexFind `^[0-9]+\.[0-9]+` $t }}{{ else }}{{ regexFind `^[0-9]+\.[0-9]+\.[0-9]+` $t }}{{ end }}'
    # The parameter group family of that version, as the ParameterGroup
    # resource names them: redis7 for 7.0 and 7.1, redis6.x for 6.0 and 6.2,
    # redis5.0 for 5.0.6, redis4.0 for 4.0.10.
    family: '{{ $m := .locals.engine_major }}{{ if eq $m "6" }}redis6.x{{ else if and $m (ge (atoi $m) 7) }}redis{{ $m }}{{ else }}redis{{ regexFind `^[0-9]+\.[0-9]+` .locals.engine_version }}{{ end }}'
    # The name the Release gives the cache under infra.overrides.host, or empty
    # while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this cache, and resolves none of
  # them. host is a CloudFormation intrinsic function reference to the
  # replication group's PrimaryEndPoint.Address, which CloudFormation resolves
  # at stack creation time. The provider projects the matching provides block
  # inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides is
  # the Outputs source, and they carry the same values but vector_search, which
  # the fragment leaves out of the stack outputs (below).
  #
  # While the Release sets infra.overrides.host, host publishes that name in
  # both provides blocks instead of the reference. It is the operator's
  # deterministic pointer: the compiler pipes it as text and looks nothing up,
  # and this Recipe emits no DNS record or alias for it, so the operator points
  # the name at the cache outside the Release. A consumer in the same stack
  # receives the name as well, and a name carries no reference for
  # CloudFormation to create that consumer after this cache by; a later
  # syncWave on the consumer's boundary, sharing this boundary's directory,
  # orders the two. A consumer in another stack imports the name through the
  # same export it imports the reference through.
  #
  # port is the value the fragment sets on the replication group's Port, so it
  # is known ahead of time and published as that value in both blocks. protocol
  # is redis, or redis-tls while infra.client_tls is on, when the port accepts
  # TLS alone. vector_search is empty: ElastiCache offers vector search on
  # Valkey 8.2 and later alone, and on no Redis OSS version, so a gateway wired
  # to this instance on its cache_store socket halts the build.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}!GetAtt {{ .locals.logical_id }}.PrimaryEndPoint.Address{{ end }}"
    port: "{{ .infra.port }}"
    protocol: "{{ if .infra.client_tls }}redis-tls{{ else }}redis{{ end }}"
    vector_search: ""

  # This Recipe reads from infra.overrides:
  #   CacheSubnetGroupName - string (Properties.CacheSubnetGroupName), required
  #   SecurityGroupIds     - []string (Properties.SecurityGroupIds)
  #   CacheNodeType        - string (Properties.CacheNodeType; default "cache.t3.small")
  #   host                 - string (published as provides.host; renders nothing)
  #   image                - refused: no container image runs on this target
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged and
  # the property name is what a reader matches against the resource
  # documentation, as cloudformation/valkey-elasticache and the CloudFormation
  # RDS Recipes name theirs. CacheSubnetGroupName is required: the subnet group
  # places the cache in the operator's network, in-transit encryption needs one,
  # and this Recipe never chooses a network for the operator. host is the
  # exception to the naming: it is no property of the resource but the address
  # a consumer reaches the cache at, under the name every managed datastore
  # Recipe reads for it. The default node type is offered from Redis OSS 4.0.10
  # on, so for every version below.
  #
  # The fragment sets no ReplicationGroupId, so CloudFormation names the
  # replication group, as the CloudFormation RDS Recipes leave the instance's
  # name to it; and no DeletionPolicy, so the stack deletes the cache with it.
  # It turns encryption at rest on, which the resource leaves off by default,
  # with the service's own key.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against ElastiCache's own documentation:
  #   honoured — values.maxmemory_policy ("Modifiable: Yes"), as the
  #     maxmemory-policy parameter of a parameter group the fragment declares
  #     for the version's family; values.databases, as the databases parameter,
  #     from Redis OSS 6.0 on, where it is "Modifiable: Yes"; infra.port;
  #     infra.engine_version (among the versions ElastiCache offers);
  #     infra.client_tls; and the overrides above.
  #   refused — values.maxmemory ("The maxmemory parameter cannot be
  #     modified": the node type fixes it); values.databases on 5.0.6 and
  #     4.0.10, where the parameter is "Modifiable: No" and a new parameter
  #     group takes its parameters as a modification; values.appendonly true
  #     ("Redis OSS configuration variables appendonly and appendfsync are not
  #     supported"); values.persistence.enabled true (ElastiCache provisions no
  #     volume, and offers its durability, a Multi-AZ transaction log, on no
  #     Redis OSS version); infra.overrides.image; an attachment to
  #     server_certificate; and a password as set out below.
  #   not read — infra.compute.cpu and infra.compute.memory, and
  #     infra.storage.size and infra.storage.type, whose Component defaults
  #     size a container and its volume: ElastiCache sizes the node by
  #     infra.overrides.CacheNodeType and provisions no volume, and a Recipe
  #     cannot tell those defaults from a value the Release wrote.
  #     infra.image_serves_vector_search, which speaks of an image no build on
  #     this target runs.
  #
  # With infra.client_tls true the fragment sets TransitEncryptionEnabled, and
  # the port accepts TLS alone. ElastiCache presents a certificate AWS
  # Certificate Manager issues, which is publicly trusted, so a consumer checks
  # it against its system trust store and needs no server_ca. That certificate
  # carries the replication group's name, which AWS records in public
  # Certificate Transparency logs.
  #
  # An attached password becomes the replication group's AuthToken, which
  # ElastiCache accepts only with in-transit encryption on, so it halts while
  # infra.client_tls is false. The token reaches the service as a Secrets
  # Manager dynamic reference to the secret core/random-password's
  # cloudformation/random-password realization creates in the same stack,
  # composed with Fn::Sub from that secret's published reference, as AWS's own
  # examples compose a database password: CloudFormation resolves it when it
  # creates the cache, so no password is written into the rendered template.
  # Another credential either carries its value as text, which would be
  # written into the template, or carries none the service could take, so it
  # halts, and so do a password with punctuation or one shorter than 16
  # characters, which an AUTH token may not be.
  assertions:
    cache_subnet_group_supplied: >-
      {{- if not (and (hasKey .infra "overrides") (optional .infra.overrides "CacheSubnetGroupName" "")) -}}
      {{- fail "this Release places its cache in a cache subnet group that already exists in the target account, and a Redis OSS replication group with in-transit encryption needs one, but infra.overrides.CacheSubnetGroupName carries none: set infra.overrides.CacheSubnetGroupName in the Release to the name of an existing ElastiCache subnet group" -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this cache reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the port is infra.port` $h) -}}
      {{- end -}}
      {{- end -}}
    # ElastiCache's last Redis OSS release is 7.1; Redis 8 and later run only
    # where the server runs as a container, and Valkey is the engine
    # ElastiCache develops past it.
    engine_version_below_8: >-
      {{- if and .locals.engine_major (ge (atoi .locals.engine_major) 8) -}}
      {{- fail (printf "infra.engine_version is %q, and ElastiCache runs Redis OSS up to 7.1; set infra.engine_version to 7.1 or earlier, or realize the cache as core/datastore/valkey" (toString .infra.engine_version)) -}}
      {{- end -}}
    # The Redis OSS versions ElastiCache offers a new replication group, read
    # off its engine-versions page; the deprecated 5.0.0 to 5.0.5 and the
    # versions past their end of life are not among them.
    engine_version_offered: >-
      {{- if not (has .locals.engine_version (list "7.1" "7.0" "6.2" "6.0" "5.0.6" "4.0.10")) -}}
      {{- fail (printf "infra.engine_version is %q, and ElastiCache runs Redis OSS 7.1, 7.0, 6.2, 6.0, 5.0.6 and 4.0.10, which this Recipe reads off the major and minor version the value begins with, and the patch as well below 6: set infra.engine_version to one of them, such as 7.1" (toString .infra.engine_version)) -}}
      {{- end -}}
    # A number written as the image, 0 included, is refused like any other
    # value: an assertion reads a 0 as empty, so the key's presence is tested.
    no_image_runs: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $image := optional $o "image" "" -}}
      {{- if or $image (and (hasKey $o "image") (has (kindOf $image) (list "int64" "float64"))) -}}
      {{- fail (printf "infra.overrides.image is %q, and ElastiCache runs the Redis OSS server itself, so no container image runs on this target: remove infra.overrides.image from the Release, or map this component to redis on helm or compose, which run the image it names" (toString $image)) -}}
      {{- end -}}
    values_elasticache_cannot_apply: >-
      {{- with optional .values "maxmemory" "" -}}
      {{- fail (printf "values.maxmemory is %q, and ElastiCache fixes the memory a Redis OSS node may use by its node type; its maxmemory parameter cannot be modified: remove values.maxmemory from the Aggregate and size the cache with infra.overrides.CacheNodeType in the Release" (toString .)) -}}
      {{- end -}}
      {{- if and (optional .values "databases" "") (lt (atoi (default "0" .locals.engine_major)) 6) -}}
      {{- fail (printf "values.databases is %v, and on Redis OSS %s ElastiCache's databases parameter cannot be modified, so a parameter group cannot set it: remove values.databases from the Aggregate, or set infra.engine_version to 6.0 or later, where it can" .values.databases .locals.engine_version) -}}
      {{- end -}}
      {{- if .values.appendonly -}}
      {{- fail "values.appendonly is true, and ElastiCache does not support the appendonly configuration on Redis OSS, so no append-only file is written: remove values.appendonly from the Aggregate, or map this component to a realization that runs the server itself" -}}
      {{- end -}}
      {{- if .values.persistence.enabled -}}
      {{- fail "values.persistence.enabled is true, and ElastiCache provisions no volume for a Redis OSS cache and offers its durability, a Multi-AZ transaction log, on no Redis OSS version: remove values.persistence.enabled from the Aggregate, or map this component to redis on helm, which keeps the data on a persistent volume" -}}
      {{- end -}}
    tls_and_credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "server_certificate" -}}
      {{- fail "a certificate is attached to the server_certificate slot, and ElastiCache presents a certificate AWS issues for the cache, which consumers trust without one: remove the attachment; infra.client_tls alone turns TLS on here" -}}
      {{- end -}}
      {{- if hasKey $f "password" -}}
      {{- if not .infra.client_tls -}}
      {{- fail "a password is attached to the password slot, and ElastiCache accepts an AUTH token only with in-transit encryption on, but infra.client_tls is false: set infra.client_tls to true, which serves the cache over TLS alone and publishes protocol redis-tls, or remove the attachment" -}}
      {{- end -}}
      {{- $p := $f.password -}}
      {{- if ne (toString (optional $p "type" "")) "core/random-password" -}}
      {{- fail (printf "the password slot is filled by %s, and this Recipe hands ElastiCache its AUTH token as a Secrets Manager dynamic reference to a secret the stack generates, which core/random-password creates through cloudformation/random-password; another credential either carries its value as text, which would be written into the rendered template, or carries none the service could take: attach core/random-password to the password slot instead" (toString (optional $p "type" "an attachment of no type"))) -}}
      {{- end -}}
      {{- $pv := optional $p "values" dict -}}
      {{- if optional $pv "symbols" false -}}
      {{- fail "the password attached to the password slot sets values.symbols to true, and the punctuation Secrets Manager draws includes characters an ElastiCache AUTH token may not hold, which permits only !, &, #, $, ^, <, > and -: set values.symbols to false" -}}
      {{- end -}}
      {{- if lt (int (optional $pv "length" 32)) 16 -}}
      {{- fail (printf "the password attached to the password slot sets values.length to %v, and an ElastiCache AUTH token is 16 to 128 characters: set values.length to at least 16" (optional $pv "length" 32)) -}}
      {{- end -}}
      {{- if contains ":" (toString (optional $pv "key" "")) -}}
      {{- fail (printf "the password attached to the password slot sets values.key to %q, and the JSON key of a Secrets Manager dynamic reference may not contain a colon: set values.key to a name without one" (toString (optional $pv "key" ""))) -}}
      {{- end -}}
      {{- end -}}

  # The AuthToken is a Secrets Manager dynamic reference, which CloudFormation
  # resolves when it creates the replication group: the attachment's published
  # name is its secret's Ref, which resolves to the secret's ARN, and Fn::Sub
  # writes that ARN into the reference with the JSON key the attachment
  # publishes. The reference's own braces are written through the template as
  # literal text.
  artifacts:
    template.yaml: |
      {{- $pw := optional (default dict .features) "password" dict }}
      {{- $pwp := optional $pw "provides" dict }}
      {{- if and (hasKey (default dict .features) "password") (not (and (kindIs "map" $pwp) (optional $pwp "name" "") (optional $pwp "key" ""))) }}
      {{- fail (printf "the password slot of %q is filled by an attachment that publishes no secret reference and key, and the AUTH token is a dynamic reference to one: bind core/random-password to cloudformation/random-password in the Manifest" .context.instance_id) }}
      {{- end }}
      {{- $params := or (optional .values "maxmemory_policy" "") (optional .values "databases" "") }}
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::ElastiCache::ReplicationGroup
          Properties:
            ReplicationGroupDescription: "Redis OSS cache {{ .context.instance_id }}"
            Engine: redis
            EngineVersion: "{{ .locals.engine_version }}"
            CacheNodeType: "{{ optional .infra.overrides "CacheNodeType" "cache.t3.small" }}"
            Port: {{ .infra.port }}
            NumCacheClusters: 1
            AtRestEncryptionEnabled: true
            TransitEncryptionEnabled: {{ .infra.client_tls }}
            {{- if hasKey (default dict .features) "password" }}
            AuthToken:
              Fn::Sub:
                - "{{ "{{" }}resolve:secretsmanager:${Secret}:SecretString:{{ $pwp.key }}{{ "}}" }}"
                - Secret: {{ $pwp.name }}
            {{- end }}
            CacheSubnetGroupName: "{{ .infra.overrides.CacheSubnetGroupName }}"
            {{- with optional .infra.overrides "SecurityGroupIds" "" }}
            SecurityGroupIds: {{ toJson . }}
            {{- end }}
            {{- if $params }}
            CacheParameterGroupName: !Ref {{ .locals.logical_id }}ParameterGroup
            {{- end }}
        {{- if $params }}
        {{ .locals.logical_id }}ParameterGroup:
          Type: AWS::ElastiCache::ParameterGroup
          Properties:
            Description: "Redis OSS parameters for {{ .context.instance_id }}"
            CacheParameterGroupFamily: "{{ .locals.family }}"
            Properties:
              {{- with optional .values "maxmemory_policy" "" }}
              maxmemory-policy: "{{ . }}"
              {{- end }}
              {{- with optional .values "databases" "" }}
              databases: "{{ . }}"
              {{- end }}
        {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two caches
      # of the same type in one stack keep their connection identities apart. A
      # cross-stack consumer imports the host entry; an intra-stack consumer
      # receives it through the value-pipe above. vector_search, always empty
      # here, is published on the value pipe alone and not as a stack output,
      # since an output is declared to carry a value.
      provides:
        host: {{ if .locals.operator_host }}"{{ .locals.operator_host }}"{{ else }}!GetAtt {{ .locals.logical_id }}.PrimaryEndPoint.Address{{ end }}
        port: "{{ .infra.port }}"
        protocol: {{ if .infra.client_tls }}redis-tls{{ else }}redis{{ end }}
