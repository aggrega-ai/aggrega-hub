apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-ecs
  version: 1.1.0
  description: >
    The generic background-worker primitive as one Amazon ECS service on
    Fargate, running infra.replicas tasks of the Release's image, rendered
    from the catalog's shared Amazon ECS fragment, which the provider
    assembles into the boundary's stack. Reach for it where the target is an
    AWS account with an ECS cluster and a VPC; reach for helm/worker on a
    Kubernetes cluster.

    The cluster, subnets, security groups and execution role come from the
    operator, under infra.overrides, and each is required; a task role, a
    public IP and a log group are optional, and nothing is emitted for one
    left unset. Only an AWS::ECS::TaskDefinition and an AWS::ECS::Service are
    emitted — no cluster, role, security group, log group or load balancer,
    each of which the operator already runs — and the container maps no
    port, so nothing connects to the worker. No container health check is
    declared, because ECS runs one inside an image this Recipe does not name.

    Each env entry an edge's inject block, or the component's own, dictates
    becomes an entry of the container's environment under that name, its value
    written whole, so a neighbour's address arrives as an Fn::GetAtt in the
    same stack and as an Fn::ImportValue from another; concurrency and
    queue_depth_hint arrive by default as WORKER_CONCURRENCY and
    WORKER_QUEUE_DEPTH_HINT, which no edge may dictate while they are the
    defaults. File, arg and other entries are refused by name: Fargate writes
    no file, and no command line is rendered. The task runs at the smallest
    Fargate size meeting both infra.compute.cpu and infra.compute.memory, so
    the Component's defaults run at 0.25 vCPU and 512 MiB.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/compute/worker:1.0.0

  # AWS App Runner is not used: it is closed to new customers.

  # This Recipe reads from infra.overrides:
  #   Cluster          - string (the service's Cluster), required
  #   Subnets          - []string (the service's AwsvpcConfiguration.Subnets), required
  #   SecurityGroups   - []string (the service's AwsvpcConfiguration.SecurityGroups), required
  #   ExecutionRoleArn - string (the task definition's ExecutionRoleArn), required
  #   TaskRoleArn      - string (the task definition's TaskRoleArn)
  #   AssignPublicIp   - string (AwsvpcConfiguration.AssignPublicIp, ENABLED or DISABLED; default DISABLED)
  #   awslogs-group    - string (the container's LogConfiguration option awslogs-group)
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation, as the CloudFormation RDS and ElastiCache Recipes name
  # theirs; awslogs-group is the log driver option's own name. AssignPublicIp
  # takes the property's own values, ENABLED and DISABLED. These are the keys
  # cloudformation/server-ecs reads, under the same names, less TargetGroupArn.
  #
  # Cluster, Subnets, SecurityGroups and ExecutionRoleArn are required and none
  # has a default: the cluster, the network and the role ECS pulls the image and
  # writes logs with are provisioned outside this Release, no
  # account-independent value exists for any of them, and this Recipe never
  # chooses a network or a role for the operator. The cluster is named by its
  # name or its ARN. The execution role is what Amazon ECS pulls a private image
  # and writes the container's logs with; it is required whichever the image is,
  # so a Release that later names a private image or a log group changes no
  # role. AssignPublicIp ENABLED gives each task a public IP address, which a
  # task in a public subnet needs to pull its image and reach the internet with
  # no NAT gateway; it is DISABLED unless the Release enables it. awslogs-group
  # names a log group that already exists, in the Region the stack deploys to,
  # to which the container's output is written under the stream prefix of the
  # component's name; the execution role must be allowed to write to it.
  #
  # The fragment sets no ServiceName, so CloudFormation names the service, as
  # the CloudFormation RDS Recipes leave the instance's name to it. The task
  # definition's Family is the component's name.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # EcsFargateFragment#/artifacts/Service:
  #   honoured — values.concurrency and values.queue_depth_hint as the locals
  #     below say, infra.image (required), infra.replicas as the service's
  #     DesiredCount, infra.compute.cpu and infra.compute.memory as the Fargate
  #     size that fragment chooses from its task-size table, the overrides
  #     above, and env entries.
  #   refused — infra.overrides.TargetGroupArn, since the worker's container
  #     maps no port and nothing connects to a worker; a compute quantity that
  #     fragment cannot read, and a pair larger than the largest Fargate task;
  #     a component name ECS does not take for a task definition family; an
  #     edge or the component's own inject block injecting a variable under a
  #     default name a developer value is delivered under; and an edge's file,
  #     arg or custom-mechanism entry.

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer values. They are
  # delivered under the names helm/worker delivers them under, each while it
  # has a value, set in the Aggregate or defaulted by the Component, so an
  # unset value renders no variable rather than an empty one. Those names are
  # defaults: each is rendered only while no entry of the component's own
  # inject block, in any mechanism, delivers its value, and an edge or that
  # block delivering either name as well halts, naming which, rather than one
  # value silently replacing the other. The component packages no upstream
  # product, so no other local EcsFargateFragment reads is declared: no default
  # image, so the Release names the one it runs; no port, so the container maps
  # none; no probe, no GPU and no socket.
  locals:
    value_env: '{"values.concurrency": "WORKER_CONCURRENCY", "values.queue_depth_hint": "WORKER_QUEUE_DEPTH_HINT"}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one, and the fragment carries no provides of its own.
  provides: {}

  artifacts:
    # The Service fragment: the task definition and the service. Their logical
    # IDs are derived from the component's name as cloudformation/worker-ecs
    # 1.0.0 derives them — instance invoice-jobs names the service InvoiceJobs
    # and its task definition InvoiceJobsTaskDefinition — so a stack deployed
    # with that version keeps both resources under the IDs it tracks them by
    # when it moves to this one: CloudFormation carries each across the
    # upgrade as the same resource, rather than creating a second service
    # beside the running one and deleting the first.
    service:
      $import: EcsFargateFragment#/artifacts/Service
