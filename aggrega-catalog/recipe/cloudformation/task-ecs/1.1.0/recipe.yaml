apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: task-ecs
  version: 1.1.0
  description: >
    The generic ephemeral compute primitive as an Amazon ECS task on Fargate
    that an EventBridge Scheduler schedule starts, rendered from the catalog's
    shared Amazon ECS fragment. Reach for it where the target is an AWS
    account with an ECS cluster and a VPC; reach for helm/task on Kubernetes,
    which also runs a task with no schedule once.

    A task with no schedule carrying core/manual-trigger is deployed without
    starting, its task definition alone; the operator starts each run with
    aws ecs run-task, giving the cluster, task definition and network
    configuration from infra.overrides. A scheduled task runs on its
    schedule, attached or not. Any other unscheduled task is refused by name,
    as nothing on AWS starts it. The cron fields become the scheduler's own
    expression where the two mean the same times, evaluated in UTC unless
    the Release names a time zone, and are refused by name where they do
    not, as for a schedule restricting both the day of the month and the day
    of the week.

    The cluster, subnets, security groups, execution role and, with a
    schedule, the scheduler's role come from infra.overrides and are
    required. Only an AWS::ECS::TaskDefinition and, with a schedule, an
    AWS::Scheduler::Schedule are emitted: no role, log group or network
    resource, each of which the operator already runs, and no service, as a
    run ends.

    Each env entry an edge or the component's own inject block dictates
    becomes a container variable; timeout arrives by default as TASK_TIMEOUT,
    which no edge may dictate while it is the default, for the code to
    honour, as ECS sets no deadline on a run. File, arg and other entries are
    refused by name. The task runs at the smallest Fargate size meeting
    infra.compute.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/compute/task:1.0.1

  # This Recipe reads from infra.overrides:
  #   Cluster                    - string (the schedule's Target.Arn), required
  #   RoleArn                    - string (the schedule's Target.RoleArn), required with a schedule
  #   Subnets                    - []string (Target.EcsParameters' AwsvpcConfiguration.Subnets), required
  #   SecurityGroups             - []string (AwsvpcConfiguration.SecurityGroups), required
  #   ExecutionRoleArn           - string (the task definition's ExecutionRoleArn), required
  #   TaskRoleArn                - string (the task definition's TaskRoleArn)
  #   AssignPublicIp             - string (AwsvpcConfiguration.AssignPublicIp, ENABLED or DISABLED; default DISABLED)
  #   awslogs-group              - string (the container's LogConfiguration option awslogs-group)
  #   ScheduleExpressionTimezone - string (the schedule's ScheduleExpressionTimezone; default UTC)
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation, as cloudformation/server-ecs names its keys; awslogs-group is
  # the log driver option's own name. One key is the exception: Cluster, which
  # the schedule sets as its target's Arn, is read under the spelling
  # cloudformation/server-ecs and cloudformation/worker-ecs read for the same
  # concept, so an operator writes it under one name across the catalog's
  # CloudFormation Amazon ECS Recipes. RoleArn is the target's own property, and
  # names the role the scheduler assumes, not a role of the task's.
  # AssignPublicIp takes the property's own two values.
  #
  # Cluster, Subnets, SecurityGroups, ExecutionRoleArn and, with a schedule,
  # RoleArn are required and none has a default: the cluster, the role the
  # scheduler calls ECS with, the network and the role ECS pulls the image and
  # writes logs with are provisioned outside this Release, no
  # account-independent value exists for any of them, and this Recipe never
  # chooses a network or a role for the operator. The cluster is named by its
  # ARN, since a schedule's target is the ARN of the resource it acts on; the
  # scheduler role must trust the scheduler and be allowed to run the task
  # definition and pass the task's roles to ECS. AssignPublicIp ENABLED gives
  # each run a public IP address, which a task in a public subnet needs to pull
  # its image and reach the internet with no NAT gateway; it is DISABLED unless
  # the Release enables it. awslogs-group names a log group that already
  # exists, in the Region the stack deploys to, to which the container's output
  # is written under the stream prefix of the component's name; the execution
  # role must be allowed to write to it. ScheduleExpressionTimezone names the
  # IANA time zone the schedule is evaluated in. The task definition names no
  # runtime platform, so Fargate runs the image as linux/amd64.
  #
  # A task carrying core/manual-trigger with no schedule renders no schedule,
  # so nothing assumes RoleArn or evaluates a time zone: both are refused by
  # name there rather than accepted and left unused, and RoleArn is required
  # only where a schedule is rendered. Cluster, Subnets, SecurityGroups and
  # AssignPublicIp stay required or checked all the same, though no resource
  # reads them then: they are what the operator gives aws ecs run-task, as its
  # --cluster and its --network-configuration, to start a run of the task
  # definition family named after the component.
  #
  # The fragment sets no schedule Name, so CloudFormation names the schedule,
  # as cloudformation/server-ecs leaves the service's name to it. The task
  # definition's Family is the component's name.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # EcsFargateFragment#/artifacts/Task and the assertion below:
  #   honoured — values.schedule as the schedule's expression, values.timeout
  #     as the locals below say, infra.image (required), infra.compute.cpu and
  #     infra.compute.memory as the Fargate size that fragment chooses from
  #     its task-size table, the overrides above, and env entries.
  #   refused — a task with no schedule and no core/manual-trigger
  #     attachment, by the assertion below; a schedule with no exact
  #     equivalent, as that fragment describes; RoleArn and
  #     ScheduleExpressionTimezone on a task rendering no schedule, as above;
  #     infra.overrides.TargetGroupArn, since nothing connects to a run; a
  #     compute quantity that fragment cannot read, and a pair larger than the
  #     largest Fargate task; a component name ECS does not take for a task
  #     definition family; an edge or the component's own inject block
  #     injecting a variable under TASK_TIMEOUT while the timeout is delivered
  #     under that default name; and an edge's file, arg or custom-mechanism
  #     entry.
  assertions:
    # A run that happens once has nothing on AWS to start it, so it halts
    # here. A task carrying core/manual-trigger asked for a run nothing starts
    # until the operator does, so it is not refused for having no schedule.
    # The attachment is found by its Feature's type, with any version it was
    # authored with set aside, and read here rather than in a local, which
    # cannot read the attachments. Nothing else reads it: a scheduled task
    # renders alike with the attachment or without. A schedule the scheduler
    # cannot carry exactly halts in EcsFargateFragment#/artifacts/Task.
    schedule_translates: >-
      {{- $s := trim (toString (optional .values "schedule" "")) -}}
      {{- $manual := false -}}
      {{- range $name, $attachment := optional . "features" dict -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/manual-trigger" }}{{ $manual = true }}{{ end -}}
      {{- end -}}
      {{- if and (not $s) (not $manual) -}}
      {{- fail (printf "the component %q has no schedule and carries no core/manual-trigger attachment, so it runs once, and nothing on AWS starts a run that happens once: neither CloudFormation nor Terraform runs an Amazon ECS task when it applies, so the run would never happen. Give the component a schedule in the Aggregate; attach core/manual-trigger to it there to deploy its task definition alone, for the operator to start each run with aws ecs run-task; or map core/compute/task to helm/task in the Manifest, which runs it once on Kubernetes" .metadata.instance_id) -}}
      {{- end -}}

  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's timeout value. It is
  # delivered under the name helm/task delivers it under, and only when the
  # developer set it: a value set, even empty, renders its variable, and an
  # unset value renders none. That name is a default: it is rendered only while
  # no entry of the component's own inject block, in any mechanism, delivers the
  # timeout, and an edge or that block delivering that name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # schedule is not delivered as a variable: it becomes the schedule's
  # expression. The component packages no upstream product, so no other local
  # EcsFargateFragment reads is declared: no default image, so the Release
  # names the one it runs; no port, so the container maps none; no probe, no GPU
  # and no socket.
  locals:
    value_env: '{"values.timeout": "TASK_TIMEOUT"}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one, and the fragment carries no provides of its own.
  provides: {}

  artifacts:
    # The Task fragment: the task definition and, with a schedule, the
    # schedule. Their logical IDs are derived from the component's name as
    # cloudformation/task-ecs 1.0.1 and 1.0.0 derive them — instance
    # nightly-report names the schedule NightlyReportSchedule and its task
    # definition NightlyReportTaskDefinition — so a stack deployed with either
    # version keeps both resources under the IDs it tracks them by when it
    # moves to this one: CloudFormation carries each across the upgrade as the
    # same resource, rather than creating a second schedule beside the first
    # and deleting it.
    service:
      $import: EcsFargateFragment#/artifacts/Task
