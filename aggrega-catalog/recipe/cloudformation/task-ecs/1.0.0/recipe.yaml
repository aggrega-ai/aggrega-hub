apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: task-ecs
  version: 1.0.0
  description: >
    The generic ephemeral compute primitive as an Amazon ECS task on Fargate
    that an EventBridge Scheduler schedule starts, rendered as a
    CloudFormation fragment the provider assembles into the boundary's stack.
    Reach for it where the target is an AWS account with an ECS cluster and a
    VPC; reach for helm/task on Kubernetes, which also runs a task with no
    schedule once.

    A task with no schedule carrying core/manual-trigger is deployed without
    starting, its task definition alone; the operator starts each run with
    aws ecs run-task, giving the cluster, task definition and network
    configuration from infra.overrides. A scheduled task runs on its
    schedule, attached or not, and can be started that way too. Any other
    unscheduled task is refused by name, as nothing on AWS starts it. The
    cron fields become the scheduler's own expression where the two mean the
    same times, evaluated in UTC unless the Release names a time zone, and
    are refused by name where they do not, as for a schedule restricting
    both the day of the month and the day of the week.

    The cluster, subnets, security groups, execution role and, with a
    schedule, the scheduler's role come from infra.overrides and are
    required. Only a task definition and a schedule are emitted: no role,
    log group or network resource, each of which the operator already runs,
    and no service, as a run ends.

    Each env entry an edge or the component's own inject block dictates
    becomes a container variable; timeout arrives by default as TASK_TIMEOUT,
    which no edge may dictate while it is the default, for the code to
    honour, as ECS sets no deadline on a run. File, arg and other entries are
    refused by name. The task runs at the smallest Fargate size meeting
    infra.compute.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/compute/task:1.0.0

  # The resources' logical ids, derived from this instance's own name so that
  # two tasks deployed into one stack describe two schedules rather than one. A
  # logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance nightly-report names the
  # schedule NightlyReportSchedule, and its task definition
  # NightlyReportTaskDefinition.
  #
  # The schedule's translation, from the five cron fields the Component's
  # schedule carries into the six fields of an EventBridge Scheduler cron
  # expression, or a refusal prefixed refuse: naming what the expression cannot
  # carry. The fields are read as Kubernetes reads a CronJob's schedule, the
  # helm/task realization's: minute, hour, day of the month, month and day of
  # the week, each a comma list of numbers, ranges and steps, or *; month and
  # day names in any case; ? as *; and the descriptors @hourly, @daily,
  # @midnight, @weekly, @monthly, @yearly and @annually as the fields they stand
  # for. The scheduler reads minute, hour, day of the month and month in the
  # same forms, so they pass through, with names written as numbers. It numbers
  # the days of the week 1 to 7 from Sunday and takes no step there, so that
  # field becomes the explicit list of the days it names. Both readers run a
  # field whose list holds * (or a step of 1 over it) as unrestricted; with
  # both day fields restricted, Kubernetes runs on a day matching either, which
  # the scheduler cannot express, since it requires one of the two to be ?, so
  # that schedule is refused, as are @every, which counts its interval from a
  # moment the scheduler cannot reproduce, a time zone written into the
  # expression, and any field in another form. The year field is *. These
  # locals are the ones terraform/task-ecs declares, word for word, and a
  # change to them is made to both.
  #
  # The Fargate task size, read off the task-size table of the Amazon ECS
  # developer guide ("Task CPU and memory" under Fargate): a CPU size in CPU
  # units, 1024 to a vCPU, and the memory sizes in MiB that each CPU size takes.
  # The task runs at the first pair in that table, by CPU and then by memory,
  # that meets both the CPU and the memory infra.compute asks for. Each
  # requested quantity is a floor: the task may be given more than was written,
  # and is billed for what it is given. The Component's defaults, 100m and
  # 128Mi, are below the smallest pair, so they run at 256 CPU units and 512 MiB.
  # A size the table adds later is not chosen until it is listed here. These
  # locals are the ones terraform/server-ecs, terraform/worker-ecs,
  # terraform/task-ecs, cloudformation/server-ecs and cloudformation/worker-ecs
  # declare, word for word, and a change to the table is made to all six.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The component's name, for the assertions' messages to name it.
    instance_id: '{{ .context.instance_id }}'
    schedule_translation: >-
      {{- $s := trim (toString (optional .values "schedule" "")) -}}
      {{- $out := "" -}}
      {{- if $s -}}
      {{- $f := regexSplit `\s+` $s -1 -}}
      {{- $descriptors := dict "@yearly" "0 0 1 1 *" "@annually" "0 0 1 1 *" "@monthly" "0 0 1 * *" "@weekly" "0 0 * * 0" "@daily" "0 0 * * *" "@midnight" "0 0 * * *" "@hourly" "0 * * * *" -}}
      {{- if and (eq (len $f) 1) (hasKey $descriptors (index $f 0)) -}}
      {{- $f = regexSplit `\s+` (index $descriptors (index $f 0)) -1 -}}
      {{- end -}}
      {{- if hasPrefix "@every" $s -}}
      {{- $out = "refuse:@every repeats at an interval counted from a moment Kubernetes chooses, which an EventBridge Scheduler schedule cannot reproduce: write the schedule as five cron fields" -}}
      {{- else if regexMatch `^(CRON_)?TZ=` (index $f 0) -}}
      {{- $out = "refuse:it names a time zone inside the expression, where an EventBridge Scheduler expression takes none: write the five fields alone, and name the time zone under infra.overrides in the Release" -}}
      {{- else if ne (len $f) 5 -}}
      {{- $out = printf "refuse:it has %d fields where a cron expression has five, minute, hour, day of the month, month and day of the week: write the schedule as those five fields" (len $f) -}}
      {{- else -}}
      {{- $item := `^(\*|\?|[0-9]+(-[0-9]+)?)(/[0-9]+)?$` -}}
      {{- $min := index $f 0 -}}{{- $hour := index $f 1 -}}{{- $dom := index $f 2 -}}
      {{- $mon := lower (index $f 3) -}}{{- $dow := lower (index $f 4) -}}
      {{- range $i, $n := list "jan" "feb" "mar" "apr" "may" "jun" "jul" "aug" "sep" "oct" "nov" "dec" }}{{ $mon = replace $n (toString (add1 $i)) $mon }}{{ end -}}
      {{- range $i, $n := list "sun" "mon" "tue" "wed" "thu" "fri" "sat" }}{{ $dow = replace $n (toString $i) $dow }}{{ end -}}
      {{- $badField := "" -}}{{- $badValue := "" -}}
      {{- range $pair := list (list "minute" $min (index $f 0)) (list "hour" $hour (index $f 1)) (list "day-of-month" $dom (index $f 2)) (list "month" $mon (index $f 3)) (list "day-of-week" $dow (index $f 4)) -}}
      {{- range splitList "," (index $pair 1) -}}
      {{- if and (not $badField) (not (regexMatch $item .)) }}{{ $badField = index $pair 0 }}{{ $badValue = index $pair 2 }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $domStar := false -}}{{- $dowStar := false -}}
      {{- range splitList "," $dom }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $domStar = true }}{{ end }}{{ end -}}
      {{- range splitList "," $dow }}{{ $p := splitList "/" . }}{{ if and (has (index $p 0) (list "*" "?")) (or (eq (len $p) 1) (le (atoi (index $p 1)) 1)) }}{{ $dowStar = true }}{{ end }}{{ end -}}
      {{- $days := list -}}{{- $dowBad := false -}}
      {{- if not $badField -}}
      {{- range splitList "," $dow -}}
      {{- $p := splitList "/" . -}}
      {{- $step := 1 -}}{{- if eq (len $p) 2 }}{{ $step = atoi (index $p 1) }}{{ end -}}
      {{- $lo := 0 -}}{{- $hi := 6 -}}
      {{- if not (has (index $p 0) (list "*" "?")) -}}
      {{- $lh := splitList "-" (index $p 0) -}}
      {{- $lo = atoi (index $lh 0) -}}
      {{- if eq (len $lh) 2 }}{{ $hi = atoi (index $lh 1) }}{{ else if eq (len $p) 1 }}{{ $hi = $lo }}{{ end -}}
      {{- end -}}
      {{- if or (gt $hi 6) (gt $lo $hi) (lt $step 1) }}{{ $dowBad = true }}{{ else }}{{ range untilStep $lo (int (add1 $hi)) $step }}{{ $days = append $days (toString (add1 .)) }}{{ end }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- if $badField -}}
      {{- $out = printf "refuse:its %s field %q is not a comma list of numbers, names, ranges, steps or *, the forms Kubernetes and EventBridge Scheduler both read alike: write that field in those forms" $badField $badValue -}}
      {{- else if $dowBad -}}
      {{- $out = printf "refuse:its day-of-week field %q names a day outside 0 to 6, Sunday to Saturday, or a range running backwards, which Kubernetes refuses as well: write the days from 0 for Sunday to 6 for Saturday" (index $f 4) -}}
      {{- else if and (not $domStar) (not $dowStar) -}}
      {{- $out = "refuse:it restricts both the day of the month and the day of the week, so a run happens on a day matching either, and an EventBridge Scheduler cron expression leaves one of the two unrestricted, so it cannot run on a day matching either: restrict one of the two fields only, and declare a second component for the other" -}}
      {{- else -}}
      {{- $domOut := $dom -}}{{- $dowOut := "?" -}}
      {{- if $domStar }}{{ $domOut = "?" }}{{ $dowOut = join "," (sortAlpha (uniq $days)) }}{{ end -}}
      {{- if and $domStar $dowStar }}{{ $domOut = "*" }}{{ $dowOut = "?" }}{{ end -}}
      {{- $out = printf "cron(%s %s %s %s %s *)" (replace "?" "*" $min) (replace "?" "*" $hour) $domOut (replace "?" "*" $mon) $dowOut -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $out -}}
    # The requested CPU in millicores, or empty when it is not a quantity this
    # Recipe reads: whole millicores, or vCPUs with at most three decimals.
    cpu_millicores: >-
      {{- $c := toString (optional (optional .infra "compute" dict) "cpu" "") -}}
      {{- if regexMatch `^[0-9]+m$` $c -}}{{ atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c -}}
      {{- $p := splitList "." $c -}}{{- $f := 0 -}}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end -}}
      {{- add (mul (atoi (index $p 0)) 1000) $f -}}
      {{- end -}}
    # The requested memory in MiB, or empty when it is not a quantity this
    # Recipe reads: whole Mi or Gi.
    memory_mib: >-
      {{- $m := toString (optional (optional .infra "compute" dict) "memory" "") -}}
      {{- if regexMatch `^[0-9]+Mi$` $m -}}{{ atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m -}}{{ mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end -}}
    # The first pair meeting both, as cpu/memory, or empty when none does.
    task_size: >-
      {{- $found := "" -}}
      {{- if and .locals.cpu_millicores .locals.memory_mib -}}
      {{- $mc := atoi .locals.cpu_millicores -}}{{- $mib := atoi .locals.memory_mib -}}
      {{- range list (list 256 (list 512 1024 2048)) (list 512 (untilStep 1024 4097 1024)) (list 1024 (untilStep 2048 8193 1024)) (list 2048 (untilStep 4096 16385 1024)) (list 4096 (untilStep 8192 30721 1024)) (list 8192 (untilStep 16384 61441 4096)) (list 16384 (untilStep 32768 122881 8192)) (list 32768 (list 61440 122880 249856)) -}}
      {{- $cpu := index . 0 -}}
      {{- if and (not $found) (ge (mul $cpu 1000) (mul $mc 1024)) -}}
      {{- range index . 1 }}{{ if and (not $found) (ge . $mib) }}{{ $found = printf "%d/%d" $cpu . }}{{ end }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $found -}}
    task_cpu: '{{ if .locals.task_size }}{{ index (splitList "/" .locals.task_size) 0 }}{{ end }}'
    task_memory: '{{ if .locals.task_size }}{{ index (splitList "/" .locals.task_size) 1 }}{{ end }}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one, and the fragment carries no provides of its own.
  provides: {}

  # This Recipe reads from infra.overrides:
  #   Cluster                    - string (the schedule's Target.Arn), required
  #   RoleArn                    - string (the schedule's Target.RoleArn), required with a schedule
  #   Subnets                    - []string (Target.EcsParameters' AwsvpcConfiguration.Subnets), required
  #   SecurityGroups             - []string (AwsvpcConfiguration.SecurityGroups), required
  #   ExecutionRoleArn           - string (the task definition's ExecutionRoleArn), required
  #   TaskRoleArn                - string (the task definition's TaskRoleArn)
  #   AssignPublicIp             - string (AwsvpcConfiguration.AssignPublicIp, ENABLED or DISABLED; default DISABLED)
  #   awslogs-group              - string (the container's LogConfiguration option awslogs-group)
  #   ScheduleExpressionTimezone - string (the schedule's ScheduleExpressionTimezone; default UTC)
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation, as cloudformation/server-ecs names its keys; awslogs-group is
  # the log driver option's own name. One key is the exception: Cluster, which
  # the schedule sets as its target's Arn, is read under the spelling
  # cloudformation/server-ecs and cloudformation/worker-ecs read for the same
  # concept, so an operator writes it under one name across the catalog's
  # CloudFormation Amazon ECS Recipes. RoleArn is the target's own property, and
  # names the role the scheduler assumes, not a role of the task's.
  # AssignPublicIp takes the property's own two values.
  #
  # The first five are required and none has a default: the cluster, the role
  # the scheduler calls ECS with, the network and the role ECS pulls the image
  # and writes logs with are provisioned outside this Release, no
  # account-independent value exists for any of them, and this Recipe never
  # chooses a network or a role for the operator. The cluster is named by its
  # ARN, since a schedule's target is the ARN of the resource it acts on; the
  # scheduler role must trust the scheduler and be allowed to run the task
  # definition and pass the task's roles to ECS. AssignPublicIp ENABLED gives
  # each run a public IP address, which a task in a public subnet needs to pull
  # its image and reach the internet with no NAT gateway; it is DISABLED unless
  # the Release enables it. awslogs-group names a log group that already
  # exists, in the Region the stack deploys to, to which the container's output
  # is written under the stream prefix of the component's name; the execution
  # role must be allowed to write to it. ScheduleExpressionTimezone names the
  # IANA time zone the schedule is evaluated in. The task definition names no
  # runtime platform, so Fargate runs the image as linux/amd64.
  #
  # A task carrying core/manual-trigger with no schedule renders no schedule,
  # so nothing assumes RoleArn or evaluates a time zone: both are refused by
  # name there rather than accepted and left unused, and RoleArn is required
  # only where a schedule is rendered. Cluster, Subnets, SecurityGroups and
  # AssignPublicIp stay required or checked as before, though no resource
  # reads them then: they are what the operator gives aws ecs run-task, as its
  # --cluster and its --network-configuration, to start a run of the task
  # definition family named after the component.
  #
  # The fragment sets no schedule Name, so CloudFormation names the schedule,
  # as cloudformation/server-ecs leaves the service's name to it. The task
  # definition's Family is the component's name, which ECS checks against the
  # alphabet below.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's timeout value. It is
  # delivered under the name helm/task delivers it under, and only when the
  # developer set it, so an unset value renders no variable rather than an empty
  # one; that name is a default, which the component's own inject block may
  # replace, as the comment above the artifact describes. The schedule is not
  # delivered as a variable: it becomes the schedule's expression.
  #
  # Every Component value and infra key is honoured or refused below by name:
  #   honoured — values.schedule as the schedule's expression, values.timeout
  #     as above, infra.image (required), infra.compute.cpu and
  #     infra.compute.memory as the Fargate size above, and the overrides
  #     above.
  #   refused — a task with no schedule and no core/manual-trigger
  #     attachment, and a schedule with no exact equivalent, as the comment
  #     above the locals describes; RoleArn and ScheduleExpressionTimezone on
  #     a task rendering no schedule, as above;
  #     infra.overrides.TargetGroupArn, since nothing connects to a run; a
  #     compute quantity this Recipe cannot read, and a pair larger than the
  #     largest Fargate task; an edge or the component's own inject block
  #     injecting a variable under TASK_TIMEOUT while the timeout is delivered
  #     under that default name; and an edge's file, arg or custom-mechanism
  #     entry, as the comment above the artifact describes.
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image the run executes in the Release" -}}
      {{- end -}}
    # A run that happens once has nothing on AWS to start it, and a schedule
    # the scheduler cannot carry exactly would run at other times than the
    # developer wrote, so both halt here. A task carrying core/manual-trigger
    # asked for a run nothing starts until the operator does, so it is not
    # refused for having no schedule. The attachment is found by its Feature's
    # type, with any version it was authored with set aside, and read here
    # rather than in a local, which cannot read the attachments. Nothing else
    # reads it: a scheduled task renders alike with the attachment or without.
    schedule_translates: >-
      {{- $s := trim (toString (optional .values "schedule" "")) -}}
      {{- $manual := false -}}
      {{- range $name, $attachment := optional . "features" dict -}}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/manual-trigger" }}{{ $manual = true }}{{ end -}}
      {{- end -}}
      {{- if and (not $s) (not $manual) -}}
      {{- fail (printf "the component %q has no schedule and carries no core/manual-trigger attachment, so it runs once, and nothing on AWS starts a run that happens once: neither CloudFormation nor Terraform runs an Amazon ECS task when it applies, so the run would never happen. Give the component a schedule in the Aggregate; attach core/manual-trigger to it there to deploy its task definition alone, for the operator to start each run with aws ecs run-task; or map core/compute/task to helm/task in the Manifest, which runs it once on Kubernetes" .locals.instance_id) -}}
      {{- end -}}
      {{- if hasPrefix "refuse:" .locals.schedule_translation -}}
      {{- fail (printf "the component %q is scheduled %q, and %s" .locals.instance_id $s (trimPrefix "refuse:" .locals.schedule_translation)) -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; one the Release sets empty leaves the task nothing to
    # be sized by, so each must carry a quantity.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "infra.compute.cpu is empty, so the task would have no CPU to be sized by: set infra.compute.cpu in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "infra.compute.memory is empty, so the task would have no memory to be sized by: set infra.compute.memory in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
    compute_fits_fargate: >-
      {{- if not .locals.cpu_millicores -}}
      {{- fail (printf "infra.compute.cpu is %q, and this Recipe reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms" (toString .infra.compute.cpu)) -}}
      {{- end -}}
      {{- if not .locals.memory_mib -}}
      {{- fail (printf "infra.compute.memory is %q, and this Recipe reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms" (toString .infra.compute.memory)) -}}
      {{- end -}}
      {{- if not .locals.task_size -}}
      {{- fail (printf "infra.compute asks for cpu %q and memory %q, and no Fargate task size meets both: the largest is 32 vCPU with 244 GB, and each CPU size takes a bounded range of memory, up to 120 GB at 16 vCPU and 30 GB at 4 vCPU; set infra.compute in the Release to a pair one Fargate size meets" (toString .infra.compute.cpu) (toString .infra.compute.memory)) -}}
      {{- end -}}
    cluster_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "Cluster" "" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]{1,255}$` $v)) -}}
      {{- fail (printf "this Release starts its task's runs in an Amazon ECS cluster that already exists in the target account, and a schedule names the cluster by its ARN, but infra.overrides.Cluster is %s: set infra.overrides.Cluster in the Release to the ARN of an existing ECS cluster, such as arn:aws:ecs:us-east-1:123456789012:cluster/example" (toJson $v)) -}}
      {{- end -}}
    # Only a schedule calls Amazon ECS under this role, so it is required where
    # one is rendered and refused where none is.
    role_arn_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $v := optional $o "RoleArn" "" -}}
      {{- if trim (toString (optional .values "schedule" "")) -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release starts its task's runs from an EventBridge Scheduler schedule, which calls Amazon ECS under a role that already exists, trusts the scheduler and may run the task definition, but infra.overrides.RoleArn is %s: set infra.overrides.RoleArn in the Release to the ARN of an existing role" (toJson $v)) -}}
      {{- end -}}
      {{- else if hasKey $o "RoleArn" -}}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and nothing starts a run under infra.overrides.RoleArn: each run is the one the operator starts with aws ecs run-task. Remove infra.overrides.RoleArn from the Release" .locals.instance_id) -}}
      {{- end -}}
    subnets_supplied: >-
      {{- $s := optional (optional .infra "overrides" dict) "Subnets" "" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 16) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "this Release places its task's runs in subnets of the operator's VPC, one to sixteen of them, but infra.overrides.Subnets is %s: set infra.overrides.Subnets in the Release to a list of the IDs of existing subnets" (toJson $s)) -}}
      {{- end -}}
    security_groups_supplied: >-
      {{- $s := optional (optional .infra "overrides" dict) "SecurityGroups" "" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) (le (len $s) 5) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) .) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "this Release attaches its task's runs to security groups of the operator's VPC, one to five of them, which decide what a run may reach, but infra.overrides.SecurityGroups is %s: set infra.overrides.SecurityGroups in the Release to a list of the IDs of existing security groups" (toJson $s)) -}}
      {{- end -}}
    execution_role_arn_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "ExecutionRoleArn" "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release runs its task under a task execution role that already exists, with which Amazon ECS pulls the image and writes the container's logs, but infra.overrides.ExecutionRoleArn is %s: set infra.overrides.ExecutionRoleArn in the Release to the ARN of an existing role" (toJson $v)) -}}
      {{- end -}}
    optional_overrides_typed: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "TargetGroupArn" -}}
      {{- fail "infra.overrides.TargetGroupArn names a load balancer target group for the task's runs, and a run maps no container port and ends, so nothing could be registered with it: remove infra.overrides.TargetGroupArn from the Release, or map this component as core/compute/server, which serves inbound traffic" -}}
      {{- end -}}
      {{- range $k := list "TaskRoleArn" "awslogs-group" "ScheduleExpressionTimezone" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as a non-empty string: set it in the Release to that string, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if and (hasKey $o "ScheduleExpressionTimezone") (not (trim (toString (optional .values "schedule" "")))) -}}
      {{- fail (printf "the component %q has no schedule, so no EventBridge Scheduler schedule is rendered and infra.overrides.ScheduleExpressionTimezone names the time zone of nothing: remove it from the Release" .locals.instance_id) -}}
      {{- end -}}
      {{- if and (hasKey $o "AssignPublicIp") (not (has (index $o "AssignPublicIp") (list "ENABLED" "DISABLED"))) -}}
      {{- fail (printf "infra.overrides.AssignPublicIp is %s, and the property takes ENABLED or DISABLED: set it in the Release to ENABLED to give each run a public IP address, or remove it" (toJson (index $o "AssignPublicIp"))) -}}
      {{- end -}}

  # The environment is read off the inject pipe as a map, and every variable on
  # it becomes one entry of the container's environment, under the name the
  # Aggregate gave it on the edge; this Recipe expects no name of its own, so
  # none is missing whatever the edges deliver. Each value is written as the
  # entry's whole Value. A value that is a CloudFormation short-form intrinsic
  # — the Fn::GetAtt a neighbour in the same stack publishes — is written bare,
  # so the template reads it as that intrinsic; the provider replaces a value a
  # neighbour publishes from another stack with an Fn::ImportValue, and it can
  # replace only a whole value. Any other value is written as a quoted
  # string, so text such as a port number reaches the String property as text.
  # The developer's timeout joins that map as TASK_TIMEOUT, unless the
  # component's own inject block delivers it, and an edge or that block
  # delivering that name as well halts, naming which, rather than one value
  # silently replacing the other.
  #
  # Every other mechanism on the pipe is refused, naming the entry, its
  # mechanism and the connection that dictated it, so none is dropped: a file
  # entry, because a Fargate task definition has no volume whose content it
  # supplies itself; an arg entry, because this Recipe renders no command line,
  # and a container's command on ECS replaces the image's default one, which is
  # the Release's; and any custom mechanism. This block is the one
  # terraform/server-ecs, terraform/worker-ecs, terraform/task-ecs,
  # cloudformation/server-ecs and cloudformation/worker-ecs declare, word for
  # word; a change to it is made to all six.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the container with every other env entry. The
  # name this Recipe gives the timeout is a default: it is rendered only while
  # no entry of that block, in any mechanism, delivers the timeout. The template
  # reads that at .context.self_inject, which maps each name the developer wrote
  # to values.<key> for an entry whose template reads that one own value. A
  # refusal naming a variable that block delivers names the block, rather than
  # an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  #
  # The template is written here as a fragment, as the catalog writes its
  # CloudFormation Recipes, rather than sourced from a published template.
  #
  # The schedule starts one task of the definition, which it references by its
  # logical id, resolving to its ARN, on Fargate in the operator's network. Its
  # flexible time window is off, so a run starts within the minute the
  # expression names rather than within a window after it, and its retry policy
  # is the scheduler's own default. The log Region is the stack's own, read
  # through the AWS::Region pseudo parameter when the stack deploys. The
  # schedule is rendered only for a task with a schedule, and
  # core/manual-trigger changes nothing in it, so a scheduled task carrying
  # it runs on its schedule as one without it does.
  artifacts:
    template.yaml: |
      {{- if not (regexMatch `^[A-Za-z0-9_-]{1,255}$` .context.instance_id) }}
      {{- fail (printf "the component %q names its Amazon ECS task definition family, and ECS takes up to 255 letters, digits, hyphens and underscores for one: rename the component in the Aggregate to such a name" .context.instance_id) }}
      {{- end }}
      {{- range $mechanism, $entries := default dict .context.inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and an Amazon ECS task definition on Fargate offers no way to write a file's content into the container: dictate the value as an env entry in that inject block instead" $.context.instance_id $name $by) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Amazon ECS takes a container's command in place of the image's default one, and that command is the Release's. Dictate the value as an env entry in that inject block instead" $.context.instance_id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $env := dict }}
      {{- range $k, $v := optional (default dict .context.inject) "env" dict }}{{ $_ := set $env $k $v }}{{ end }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- $timeout := "" }}
      {{- if not (hasKey $named "values.timeout") }}{{ $timeout = optional .values "timeout" "" }}{{ end }}
      {{- with $timeout }}
      {{- if hasKey $env "TASK_TIMEOUT" }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv "TASK_TIMEOUT" }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) "TASK_TIMEOUT" }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- fail (printf "the component %q delivers its developer value timeout to the container as TASK_TIMEOUT, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $.context.instance_id $by) }}
      {{- end }}
      {{- $_ := set $env "TASK_TIMEOUT" (toString .) }}
      {{- end }}
      Resources:
        {{- if .locals.schedule_translation }}
        {{ .locals.logical_id }}Schedule:
          Type: AWS::Scheduler::Schedule
          Properties:
            ScheduleExpression: {{ toJson .locals.schedule_translation }}
            ScheduleExpressionTimezone: {{ toJson (optional $o "ScheduleExpressionTimezone" "UTC") }}
            FlexibleTimeWindow:
              Mode: "OFF"
            Target:
              Arn: {{ toJson $o.Cluster }}
              RoleArn: {{ toJson $o.RoleArn }}
              EcsParameters:
                TaskDefinitionArn: !Ref {{ .locals.logical_id }}TaskDefinition
                LaunchType: FARGATE
                TaskCount: 1
                NetworkConfiguration:
                  AwsvpcConfiguration:
                    Subnets: {{ toJson $o.Subnets }}
                    SecurityGroups: {{ toJson $o.SecurityGroups }}
                    AssignPublicIp: {{ optional $o "AssignPublicIp" "DISABLED" }}
        {{- end }}
        {{ .locals.logical_id }}TaskDefinition:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Family: "{{ .context.instance_id }}"
            RequiresCompatibilities:
              - FARGATE
            NetworkMode: awsvpc
            Cpu: "{{ .locals.task_cpu }}"
            Memory: "{{ .locals.task_memory }}"
            ExecutionRoleArn: {{ toJson $o.ExecutionRoleArn }}
            {{- with optional $o "TaskRoleArn" "" }}
            TaskRoleArn: {{ toJson . }}
            {{- end }}
            ContainerDefinitions:
              - Name: main
                Image: {{ toJson .infra.image }}
                Essential: true
                {{- if $env }}
                Environment:
                  {{- range $k, $v := $env }}
                  - Name: {{ toJson $k }}
                    Value: {{ if regexMatch `^!(Ref|GetAtt|Sub|ImportValue|GetStackOutput|Join|Select|Split|FindInMap|Base64|Cidr|GetAZs|If) ` (toString $v) }}{{ $v }}{{ else }}{{ toJson (toString $v) }}{{ end }}
                  {{- end }}
                {{- end }}
                {{- with optional $o "awslogs-group" "" }}
                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: {{ toJson . }}
                    awslogs-region: !Ref AWS::Region
                    awslogs-stream-prefix: "{{ $.context.instance_id }}"
                {{- end }}
