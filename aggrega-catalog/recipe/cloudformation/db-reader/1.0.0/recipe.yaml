apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: db-reader
  version: 1.0.0
  description: >
    A database-consuming application rendered as a CloudFormation fragment. The
    artifact emits a single SSM parameter whose value is the database host the
    `database` uses-edge injects, stored as a whole scalar. When the database
    assembles into the same stack the value is an intra-stack Fn::GetAtt; when
    it assembles into another stack the provider replaces the injected value
    with a cross-stack reference. The provider stamps the stack envelope when it
    assembles the boundary.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: example/compute/db-reader:1.0.0

  # The resource's logical id, derived from this instance's own name so that two
  # applications of this type deployed into one stack describe two parameters
  # rather than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance payments-app names the
  # resource PaymentsApp. The name carries only which instance the resource
  # belongs to, because the resource type below already says what it is.
  locals:
    logical_id: '{{ regexReplaceAll "[^A-Za-z0-9]+" .context.instance_id " " | title | nospace }}'

  artifacts:
    template.yaml: |
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::SSM::Parameter
          Properties:
            Name: "{{ .values.parameter_name }}"
            Type: String
            Tier: "{{ .infra.tier }}"
            # Whole-scalar injection: the database host arrives on the
            # injection context and is stored as the parameter value. A
            # cross-stack reference can only replace a whole value, so this
            # value is never interpolated into a larger string.
            Value: {{ .context.inject.env.DB_HOST }}
