apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: athena
  version: 1.0.0
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Amazon Athena on CloudFormation: one AWS::Athena::WorkGroup named after
    the component, which the cloudformation provider assembles into the
    boundary's stack. work_group publishes a CloudFormation reference to
    the workgroup's name, which CloudFormation resolves when it creates the
    stack.

    Query results go to the Amazon S3 location OutputLocation names, in the
    operator's bucket, or, with none named, to storage Athena manages,
    which keeps them for 24 hours. KmsKeyId names the operator's KMS key
    encrypting them, and BytesScannedCutoffPerQuery cancels a query that
    scans more. The workgroup's settings override a client's own, it
    publishes query metrics to CloudWatch, and Athena chooses its engine
    version.

    No bucket, key or role is created. infra.overrides.host halts the
    build, since a client reaches every workgroup at Athena's endpoint in
    its Region, as do a value Athena cannot take and any infra.overrides
    key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/bigdata/athena:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two workgroups deployed into one stack describe two resources rather than
  # one. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance sales-queries names
  # the resource SalesQueriesWorkGroup.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this workgroup, and resolves none of it.
  # work_group is a CloudFormation intrinsic function reference to the
  # workgroup, whose Ref is its name, which CloudFormation resolves when it
  # creates the stack, so a consumer in the same stack is created after the
  # workgroup. The provider projects the matching provides block inside the
  # fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same value.
  provides:
    work_group: "!Ref {{ .locals.logical_id }}WorkGroup"

  # This Recipe reads from infra.overrides:
  #   OutputLocation             - string (the workgroup's ResultConfiguration.OutputLocation, an s3:// location)
  #   BytesScannedCutoffPerQuery - integer (the workgroup's BytesScannedCutoffPerQuery, in bytes)
  #   KmsKeyId                   - string (KmsKey of the results' EncryptionConfiguration)
  # Any other key halts naming it, so a key misspelt, or meant for another
  # Recipe, is never passed over unread.
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation. KmsKeyId is the name the catalog's CloudFormation Recipes
  # read for a KMS key, whatever the resource calls the field; here the field
  # is KmsKey.
  #
  # OutputLocation is where Athena writes each query's results: an Amazon S3
  # location, s3:// followed by the operator's bucket and an optional prefix,
  # set as the workgroup's ResultConfiguration.OutputLocation. The bucket is
  # the operator's and this Recipe never creates it. The bucket's name follows
  # Amazon S3's rule for a bucket name, 3 to 63 lowercase letters, digits,
  # periods and hyphens beginning and ending with a letter or a digit (the
  # Amazon S3 User Guide's bucket naming rules), and a location of another
  # shape halts the build. Unset, the workgroup turns on
  # ManagedQueryResultsConfiguration instead: Athena keeps the results in
  # storage it manages, for 24 hours, after which it deletes them, and a
  # client reads them through GetQueryResults and GetQueryResultsStream (the
  # Athena User Guide's page on managed query results). Athena takes no
  # OutputLocation beside managed query results, so the fragment writes one or
  # the other.
  #
  # KmsKeyId is the operator's KMS key, by its key ID, key ARN, alias name or
  # alias ARN, written as a string with no space. With OutputLocation it sets
  # ResultConfiguration.EncryptionConfiguration, EncryptionOption SSE_KMS and
  # KmsKey, so Amazon S3 encrypts each result with the key; with managed query
  # results it sets ManagedQueryResultsConfiguration.EncryptionConfiguration's
  # KmsKey, whose key policy lets the service principal
  # encryption.athena.amazonaws.com use the key (the managed query results
  # page). Unset, results in the operator's bucket take the bucket's default
  # encryption and managed results are encrypted with a key AWS owns.
  #
  # BytesScannedCutoffPerQuery is the most data, in bytes, one query in the
  # workgroup may scan; Athena cancels a query that scans more (the Athena
  # User Guide's page on data usage controls). The resource schema takes a
  # whole number of at least 10000000, and any other value halts the build.
  # Unset, the fragment writes none and a query's scan has no limit.
  #
  # host is refused by name. Athena publishes no address of a workgroup: a
  # client calls Athena's endpoint in the workgroup's Region, an endpoint the
  # service names and offers no custom domain for, and names the workgroup in
  # the call, so this Component publishes no host for the name to replace.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the overrides above.
  #   refused — an override of the wrong shape; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the
  #     workgroup.
  #   not read — none; the Component declares no values and no other infra key.
  #
  # The name. The workgroup is named after the component, and its name is
  # fixed when it is created: CloudFormation replaces the workgroup when the
  # component is renamed, and the new one starts with no query history or
  # saved queries.
  #
  # The settings the fragment writes on every workgroup:
  # EnforceWorkGroupConfiguration true, so the workgroup's results location
  # and encryption hold for every query run in it, whatever a client's own
  # settings name (the Athena User Guide's page on overriding client-side
  # settings), and PublishCloudWatchMetricsEnabled true, so the workgroup's
  # query metrics reach CloudWatch, as the AWS provider's realization writes
  # by default. The engine version is not set, so Athena selects it (AUTO, the
  # API's default) and the workgroup's effective version is the one the
  # service chooses. The workgroup is an Athena SQL workgroup, which runs each
  # query under its caller's identity: ExecutionRole applies to Apache Spark
  # and IAM Identity Center workgroups alone, and is not written.
  #
  # Deletion. The fragment sets no RecursiveDeleteOption, which the
  # DeleteWorkGroup reference describes as the option to delete a workgroup
  # and its contents even if it holds named queries, query executions or
  # notebooks. The data a query reads, and the results in the operator's
  # bucket, are not the workgroup's, and stay when it is deleted.
  assertions:
    overrides_known: >-
      {{- $known := list "OutputLocation" "BytesScannedCutoffPerQuery" "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon Athena publishes no address of a workgroup: a client calls Athena's endpoint in the workgroup's Region, which offers no custom domain, and names the workgroup by work_group: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads OutputLocation, BytesScannedCutoffPerQuery and KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # Each of these overrides is passed to the resource as written, so one of
    # another shape would render a property CloudFormation or Athena refuses.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "OutputLocation" -}}
      {{- if not (and (typeIs "string" $o.OutputLocation) (regexMatch `^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](/\S*)?$` $o.OutputLocation)) -}}
      {{- fail (printf "infra.overrides.OutputLocation is %s, and the workgroup takes its results location as s3:// followed by an Amazon S3 bucket name, 3 to 63 lowercase letters, digits, periods and hyphens beginning and ending with a letter or a digit, and an optional /prefix: set it in the Release to such a location in the operator's bucket, or remove it for results Athena keeps itself" (toJson $o.OutputLocation)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "BytesScannedCutoffPerQuery" -}}
      {{- $v := $o.BytesScannedCutoffPerQuery -}}
      {{- $ok := or (kindIs "int" $v) (kindIs "int64" $v) (and (kindIs "float64" $v) (eq (float64 (int64 $v)) $v)) -}}
      {{- if $ok }}{{ $ok = ge (int64 $v) 10000000 }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.BytesScannedCutoffPerQuery is %s, and the workgroup takes the most data one query may scan as a whole number of bytes, at least 10000000: set it in the Release to such a number, or remove it for no limit" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^\S+$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and the workgroup takes the KMS key its query results are encrypted with as one key ID, key ARN, alias name or alias ARN, written as a string with no space: set it to one in the Release, or remove it" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}WorkGroup:
          Type: AWS::Athena::WorkGroup
          Properties:
            Name: "{{ .context.instance_id }}"
            WorkGroupConfiguration:
              EnforceWorkGroupConfiguration: true
              PublishCloudWatchMetricsEnabled: true

              ## ── Provider-specific overrides ─────────────────────────
              {{- if hasKey $o "BytesScannedCutoffPerQuery" }}
              BytesScannedCutoffPerQuery: {{ int64 $o.BytesScannedCutoffPerQuery }}
              {{- end }}
              {{- with optional $o "OutputLocation" "" }}
              ResultConfiguration:
                OutputLocation: {{ toJson . }}
                {{- with optional $o "KmsKeyId" "" }}
                EncryptionConfiguration:
                  EncryptionOption: SSE_KMS
                  KmsKey: {{ toJson . }}
                {{- end }}
              {{- else }}
              ManagedQueryResultsConfiguration:
                Enabled: true
                {{- with optional $o "KmsKeyId" "" }}
                EncryptionConfiguration:
                  KmsKey: {{ toJson . }}
                {{- end }}
              {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two
      # workgroups in one stack keep their names apart. A cross-stack consumer
      # imports the work_group entry; an intra-stack consumer receives it
      # through the value-pipe above.
      provides:
        work_group: !Ref {{ .locals.logical_id }}WorkGroup
