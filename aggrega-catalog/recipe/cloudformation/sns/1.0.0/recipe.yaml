apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sns
  version: 1.0.0
  description: >
    Amazon SNS on CloudFormation: one AWS::SNS::Topic named after the
    component, with .fifo appended on a FIFO topic, which the cloudformation
    provider assembles into the boundary's stack. Every value of the
    Component is written onto the topic. arn publishes a CloudFormation
    reference to the topic's ARN, which CloudFormation resolves when it
    creates the stack.

    SNS encrypts the topic's messages with the operator's KMS key where
    KmsKeyId names one, and applies no server-side encryption otherwise.
    No subscription, topic policy, delivery-status logging, key or role is
    created. Deleting the stack, or removing the topic from it, deletes the
    topic with every subscription of it.

    infra.overrides.host halts the build, since a publisher reaches every
    topic at SNS's endpoint in its Region and names the topic by its ARN, as
    do a KmsKeyId SNS cannot take and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/messaging/sns:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two topics deployed into one stack describe two resources rather than one.
  # A logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance order-updates names the
  # resource OrderUpdatesTopic.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The topic's name: the instance's name, followed by .fifo on a FIFO
    # topic, as SNS requires of a FIFO topic's name. The Component's assertion
    # holds the instance's name to SNS's rule for a topic name, the suffix
    # counted.
    topic_name: '{{ .context.instance_id }}{{ if .values.fifo_topic }}.fifo{{ end }}'

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this topic, and resolves none of it. arn is
  # the topic's TopicArn attribute, a reference CloudFormation resolves when
  # it creates the topic, so a consumer in the same stack reading it is
  # created after it. The provider projects the matching provides block inside
  # the fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same value.
  provides:
    arn: "!GetAtt {{ .locals.logical_id }}Topic.TopicArn"

  # This Recipe reads from infra.overrides:
  #   KmsKeyId - string (Properties.KmsMasterKeyId)
  # host halts by name, as any key not listed does.
  #
  # KmsKeyId is the name the catalog's CloudFormation Recipes read for the KMS
  # key a resource is encrypted with, whatever the resource calls the field,
  # so a Release names the operator's key once whichever Recipe it encrypts;
  # here the field is KmsMasterKeyId.
  #
  # KmsKeyId names the operator's KMS key by one of the forms the resource
  # schema gives KmsMasterKeyId: a key ID (a UUID, or mrk- and 32 hexadecimal
  # digits for a multi-Region key), an alias name (alias/ followed by the
  # letters, digits, slashes, underscores and hyphens the pattern of KMS's
  # CreateAlias AliasName admits), or the ARN of a key or of such an alias. A
  # value of another form halts the build. SNS then encrypts the body of each
  # message published to the topic under that key as it receives it, and
  # decrypts it as it delivers it; SNS takes a symmetric encryption key alone.
  # The key, and its key policy, which lets the topic's publishers use it, are
  # the operator's, named here and never created. Unset, the fragment writes
  # no KmsMasterKeyId, and SNS applies no server-side encryption to the
  # topic's messages.
  #
  # host is refused by name. SNS publishes no address of a topic of its own:
  # a client calls SNS's endpoint in the topic's Region, an endpoint the
  # service names and offers no custom domain for, and names the topic by its
  # ARN in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.fifo_topic (FifoTopic, and the .fifo suffix on the
  #     name), values.content_based_deduplication (ContentBasedDeduplication,
  #     on a FIFO topic), and the override above.
  #   refused — a KmsKeyId of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the topic,
  #     and values.content_based_deduplication true on a standard topic.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The name and the topic's type. SNS fixes both when it creates the topic,
  # and both properties are create-only on the resource. Renaming the
  # component, or changing values.fifo_topic, which moves the name to or from
  # its .fifo suffix, makes CloudFormation create a new topic under the new
  # name and delete the old one, with every subscription of it.
  #
  # What the fragment writes beside the values: FifoTopic and
  # ContentBasedDeduplication on a FIFO topic alone, since SNS creates a
  # standard topic where FifoTopic is absent and takes
  # ContentBasedDeduplication on a FIFO topic alone. It writes no
  # Subscription, so the topic delivers to no endpoint until a subscriber
  # subscribes; no DeliveryStatusLogging, which would name a role SNS writes
  # delivery logs to CloudWatch Logs with; and none of the properties whose
  # SNS default stands: ArchivePolicy, so a FIFO topic archives no message;
  # FifoThroughputScope, so a FIFO topic deduplicates across the topic;
  # MaximumMessageSize, so the topic takes messages of up to 262,144 bytes;
  # SignatureVersion, TracingConfig, DisplayName and DataProtectionPolicy.
  # The resource declares no topic policy, so SNS's default access policy
  # applies, under which only the account owning the topic can publish to it
  # or subscribe to it.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy, Delete,
  # so deleting the stack, or removing the topic from it, deletes the topic,
  # and SNS deletes every subscription of it and may leave messages published
  # shortly before undelivered (the DeleteTopic API reference). SNS keeps no
  # backup to restore it from.
  assertions:
    # The key this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon SNS publishes no address of a topic: a client calls SNS's endpoint in the topic's Region, which offers no custom domain, and names the topic by arn: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # KmsKeyId is passed to KmsMasterKeyId as written, in one of the forms the
    # resource schema gives that property: a key ID, an alias name, or a key
    # or alias ARN.
    # The same KMS key form check stands in the SQS and SNS Recipes of both
    # targets (cloudformation/sqs, terraform/sqs, terraform/sns): the override key is spelt differently per
    # target, so the check cannot sit in the realization-neutral Component,
    # and a MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key/\S+|alias/[a-zA-Z0-9/_-]+))$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and SNS takes the KMS key a topic is encrypted with as a key ID, an alias name, alias/ followed by letters, digits, slashes, underscores and hyphens, or the ARN of a key or of such an alias: set it to one of them in the Release, or remove it to leave the topic without server-side encryption" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Topic:
          Type: AWS::SNS::Topic
          Properties:
            TopicName: "{{ .locals.topic_name }}"
            {{- if .values.fifo_topic }}
            FifoTopic: true
            ContentBasedDeduplication: {{ .values.content_based_deduplication }}
            {{- end }}

            ## ── Provider-specific overrides ─────────────────────────
            {{- with optional $o "KmsKeyId" "" }}
            KmsMasterKeyId: {{ toJson . }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two topics
      # in one stack keep their identities apart. A cross-stack consumer imports
      # the entry; an intra-stack consumer receives it through the value-pipe
      # above.
      provides:
        arn: !GetAtt {{ .locals.logical_id }}Topic.TopicArn
