apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: kinesis-data-streams
  version: 1.0.0
  description: >
    Amazon Kinesis Data Streams on CloudFormation: one AWS::Kinesis::Stream
    named after the component, keeping records for
    values.retention_period_hours, which the cloudformation provider
    assembles into the boundary's stack. arn publishes a CloudFormation
    reference to the stream's ARN, which CloudFormation resolves when it
    creates the stack.

    The stream runs in on-demand capacity mode, where Kinesis Data Streams
    manages its shards, unless StreamMode is PROVISIONED, which takes the
    ShardCount the operator sets. Kinesis Data Streams encrypts each record's
    data and partition key at rest under the KMS key KmsKeyId names, the operator's or the key AWS
    manages for Kinesis, alias/aws/kinesis; with none named the stream has
    no server-side encryption. No consumer, resource policy, key or role is
    created. Deleting the stack, or removing the stream from it, deletes the
    stream with every record it holds. The resource reference states no
    outcome for a deletion while an enhanced fan-out consumer is registered.

    infra.overrides.host halts the build, since a client reaches every
    stream at Kinesis Data Streams' endpoint in its Region and names the
    stream by its ARN, as do a StreamMode, ShardCount or KmsKeyId the
    stream cannot take, a ShardCount without PROVISIONED, PROVISIONED
    without a ShardCount, and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/messaging/kinesis-data-streams:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two streams deployed into one stack describe two resources rather than
  # one. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance page-views names
  # the resource PageViewsStream.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The stream's capacity mode: infra.overrides.StreamMode, or ON_DEMAND
    # where the Release names none. Only a string is read here; any other
    # value is refused by the assertion below rather than written.
    stream_mode: '{{ $m := optional (optional .infra "overrides" dict) "StreamMode" "ON_DEMAND" }}{{ if typeIs "string" $m }}{{ $m }}{{ end }}'

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this stream, and resolves none of it. arn
  # is the stream's Arn attribute, a reference CloudFormation resolves when it
  # creates the stream, so a consumer in the same stack reading it is created
  # after it. The provider projects the matching provides block inside the
  # fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same value.
  provides:
    arn: "!GetAtt {{ .locals.logical_id }}Stream.Arn"

  # This Recipe reads from infra.overrides:
  #   StreamMode - string (Properties.StreamModeDetails.StreamMode; ON_DEMAND or PROVISIONED; default ON_DEMAND)
  #   ShardCount - integer (Properties.ShardCount, with StreamMode PROVISIONED alone)
  #   KmsKeyId   - string (Properties.StreamEncryption.KeyId, with EncryptionType KMS)
  # host halts by name, as any key not listed does.
  #
  # StreamMode and ShardCount are the resource's own property names, which is
  # what a reader matches against the resource documentation. KmsKeyId is the
  # name the catalog's CloudFormation Recipes read for the KMS key a resource
  # is encrypted with, whatever the resource calls the field, so a Release
  # names the operator's key once whichever Recipe it encrypts; here the
  # field is StreamEncryption.KeyId.
  #
  # StreamMode is the stream's capacity mode. ON_DEMAND, also written where
  # the Release names none, needs no capacity setting: Kinesis Data Streams
  # manages the stream's shards and scales them with the throughput it
  # receives (the CreateStream API reference). PROVISIONED gives the stream
  # the number of shards ShardCount names, each taking up to 1 MiB or 1,000
  # records a second of writes and 2 MiB a second of reads, and the operator
  # changes that number to change its capacity. The resource type's schema
  # takes a stream with no StreamModeDetails as PROVISIONED, which needs a
  # ShardCount, so the fragment writes the mode on every stream, as the
  # terraform Recipe of this Component does, and both targets create the same
  # stream. Any other mode halts the build.
  #
  # ShardCount is the number of shards of a PROVISIONED stream, a whole
  # number from 1 to 100000, the range the resource type's schema gives it;
  # the account's shard quota, which the operator's account sets, also bounds
  # it and is not read at build. PROVISIONED without a ShardCount halts the
  # build, since the resource type requires one with that mode, and so does a
  # ShardCount without PROVISIONED, which an on-demand stream would not take.
  #
  # KmsKeyId names the KMS key by one of the forms the resource type's
  # StreamEncryption.KeyId documents: a key ID (a UUID, or, for a
  # multi-Region key, mrk- and 32 hexadecimal digits, the key ID KMS gives
  # it), an alias name (alias/ followed by its name), or the ARN of a key or
  # of an alias. A value of another form halts the build. alias/aws/kinesis
  # names the key AWS manages for Kinesis Data Streams in the account, whose
  # use needs no IAM permission of the operator's own; any other key, and its
  # key policy, are the operator's, named here and never created. The
  # fragment then writes StreamEncryption with EncryptionType KMS, and
  # Kinesis Data Streams encrypts each record's data and partition key under
  # that key before it writes the record to the stream's storage, and
  # decrypts it as a consumer reads it, so the stream's records are encrypted
  # at rest. With a key of the operator's, a producer needs
  # kms:GenerateDataKey and a consumer kms:Decrypt on it, or their writes and
  # reads fail (the Kinesis Data Streams Developer Guide's page on
  # permissions to use user-generated KMS keys). Naming a key on a stream
  # that already exists encrypts the records written from then on and not
  # those it already holds, and removing KmsKeyId turns the encryption off.
  # Unset, the fragment writes no StreamEncryption and the stream has no
  # server-side encryption.
  #
  # host is refused by name. Kinesis Data Streams publishes no address of a
  # stream of its own: a client calls the service's endpoint in the stream's
  # Region, an endpoint the service names and offers no custom domain for,
  # and names the stream by its ARN in each call, so this Component publishes
  # no host for the name to replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.retention_period_hours (RetentionPeriodHours), and
  #     the overrides above.
  #   refused — a StreamMode other than ON_DEMAND or PROVISIONED; a
  #     ShardCount that is not a whole number from 1 to 100000; a ShardCount
  #     without StreamMode PROVISIONED; StreamMode PROVISIONED without a
  #     ShardCount; a KmsKeyId of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the stream,
  #     and values.retention_period_hours outside 24 to 8,760.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The name. Name is create-only on the resource, so renaming the component
  # makes CloudFormation create a new stream under the new name and delete
  # the old one, with every record it holds.
  #
  # What the fragment writes beside the name, the retention period, the
  # capacity and the key: nothing else of the stream's own. It writes no
  # DesiredShardLevelMetrics, so the stream publishes no shard-level metrics;
  # no MaxRecordSizeInKiB, so the stream takes the service's default record
  # size; no RecordDistributionStrategy, so an on-demand stream places each
  # record by its partition key, the service's default; and no
  # WarmThroughputMiBps, so the stream is given no target warm throughput.
  # It declares no consumer and no
  # resource policy, each a resource of its own: enhanced fan-out consumers
  # are the subscribers', and with no resource policy only identities of the
  # account owning the stream, as their IAM permissions allow, write to it or
  # read from it.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy, Delete,
  # so deleting the stack, or removing the stream from it, deletes the
  # stream, its shards and every record they hold (the DeleteStream API
  # reference). Kinesis Data Streams keeps no backup to restore it from. The
  # CloudFormation resource reference states no outcome for deleting a stream
  # while an enhanced fan-out consumer is registered on it, and this Recipe
  # never deregisters a subscriber's consumer.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "StreamMode" "ShardCount" "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon Kinesis Data Streams publishes no address of a stream: a client calls the service's endpoint in the stream's Region, which offers no custom domain, and names the stream by arn: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads StreamMode, ShardCount and KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # Each override is passed to the resource as written, so one of another
    # shape would render a property CloudFormation refuses. StreamMode takes
    # the modes the resource type's schema lists; ShardCount the whole
    # numbers its schema admits; KmsKeyId the forms StreamEncryption.KeyId
    # documents, each within the letters, digits, hyphens, underscores,
    # slashes and colons they use, an alias name being held to KMS's own
    # CreateAlias AliasName pattern (alias/ then letters, digits, slashes,
    # underscores and hyphens, no colon; only the ARN forms carry one). The
    # terraform Recipe of this Component holds the same rules on stream_mode,
    # shard_count and kms_key_id: each target reads the keys under its own
    # spelling, so the rules cannot sit in the Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "StreamMode" -}}
      {{- if not (and (typeIs "string" $o.StreamMode) (has $o.StreamMode (list "ON_DEMAND" "PROVISIONED"))) -}}
      {{- fail (printf "infra.overrides.StreamMode is %s, and a Kinesis data stream runs in capacity mode ON_DEMAND or PROVISIONED: set it to one of them in the Release, or remove it for an on-demand stream" (toJson $o.StreamMode)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "ShardCount" -}}
      {{- $v := $o.ShardCount -}}
      {{- $ok := or (kindIs "int" $v) (kindIs "int64" $v) (and (kindIs "float64" $v) (eq (float64 (int64 $v)) $v)) -}}
      {{- if $ok }}{{ $ok = and (ge (int64 $v) 1) (le (int64 $v) 100000) }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.ShardCount is %s, and the AWS::Kinesis::Stream resource takes the number of shards of a provisioned stream as a whole number from 1 to 100000: set it in the Release to such a number" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/[a-zA-Z0-9/_-]+)$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and Kinesis Data Streams takes the KMS key a stream is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, such as alias/aws/kinesis, or remove it" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}
    # A provisioned stream takes its number of shards, and an on-demand one
    # none. The terraform Recipe of this Component holds the same pairing on
    # stream_mode and shard_count, for the reason given above.
    capacity_mode: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (eq .locals.stream_mode "PROVISIONED") (not (hasKey $o "ShardCount")) -}}
      {{- fail "infra.overrides.StreamMode is PROVISIONED, and a provisioned Kinesis data stream takes its number of shards, which infra.overrides.ShardCount names and the Release does not set: set infra.overrides.ShardCount in the Release, or remove StreamMode for an on-demand stream" -}}
      {{- end -}}
      {{- if and (hasKey $o "ShardCount") (ne .locals.stream_mode "PROVISIONED") -}}
      {{- fail "infra.overrides.ShardCount is set while infra.overrides.StreamMode is not PROVISIONED, and an on-demand Kinesis data stream takes no number of shards, which the service manages: set infra.overrides.StreamMode to PROVISIONED in the Release, or remove ShardCount" -}}
      {{- end -}}

  # The value reaches the fragment as the Component's schema holds it: a
  # whole number of hours within the range Kinesis Data Streams takes.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}Stream:
          Type: AWS::Kinesis::Stream
          Properties:
            Name: "{{ .context.instance_id }}"
            RetentionPeriodHours: {{ int64 .values.retention_period_hours }}

            ## ── Provider-specific overrides ─────────────────────────
            StreamModeDetails:
              StreamMode: {{ .locals.stream_mode }}
            {{- if eq .locals.stream_mode "PROVISIONED" }}
            ShardCount: {{ int64 $o.ShardCount }}
            {{- end }}
            {{- with optional $o "KmsKeyId" "" }}
            StreamEncryption:
              EncryptionType: KMS
              KeyId: {{ toJson . }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two
      # streams in one stack keep their identities apart. A cross-stack
      # consumer imports the entry; an intra-stack consumer receives it
      # through the value-pipe above.
      provides:
        arn: !GetAtt {{ .locals.logical_id }}Stream.Arn
