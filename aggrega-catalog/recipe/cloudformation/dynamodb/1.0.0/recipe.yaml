apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dynamodb
  version: 1.0.0
  description: >
    Amazon DynamoDB on CloudFormation: one AWS::DynamoDB::Table, which the
    cloudformation provider assembles into the boundary's stack, keyed,
    typed and indexed as the Component's values declare and billed as
    infra.billing_mode says, with ReadCapacityUnits and WriteCapacityUnits
    under PROVISIONED. An attached core/backup turns on the table's
    point-in-time recovery; one asking AWS Backup, through infra.role_arn,
    halts the build, in the FeatureRecipe it is bound to, since the catalog's
    AWS Backup realization backs up an Amazon RDS DB instance alone.

    host and endpoint publish DynamoDB's endpoint in the stack's Region,
    composed from the AWS::Region and AWS::URLSuffix pseudo parameters, and
    table_name and arn references to the table, which CloudFormation
    resolves when it creates the stack. infra.overrides.host halts the
    build: the endpoint answers under the service's name alone.

    The operator's KMS key encrypts the table where KmsKeyId names one, and
    DeletionProtectionEnabled protects it from deletion. Capacity under
    PAY_PER_REQUEST, PROVISIONED without it, and any other key under
    infra.overrides halt the build naming the key. The table creates no
    role, key, bucket or network.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/datastore/dynamodb:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two tables deployed into one stack describe two resources rather than one.
  # A logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance orders-table names the
  # resource OrdersTable.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The table's name: values.table_name, or the instance's name, which the
    # Component's assertion holds to DynamoDB's rule for a table name.
    table_name: '{{ optional .values "table_name" .context.instance_id }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # The FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Amazon DynamoDB point-in-time recovery"

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this table, and resolves none of
  # them. host is an Fn::Sub joining dynamodb. to the AWS::Region pseudo
  # parameter, the Region the stack is deployed to and so the table's, and the
  # AWS::URLSuffix pseudo parameter, the domain suffix of the stack's
  # partition, such as amazonaws.com or amazonaws.com.cn: DynamoDB's endpoint
  # in that Region, reached over HTTPS on port 443. endpoint is the same
  # address after https://. table_name is the table's Ref, its name, and arn
  # its Arn attribute, each a reference CloudFormation resolves when it
  # creates the table, so a consumer in the same stack reading either is
  # created after it. The provider projects the matching provides block
  # inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides is
  # the Outputs source, and they carry the same values.
  #
  # host is the service's own name. DynamoDB offers no custom domain, so every
  # name it answers under is one of the service's own and none is the
  # operator's choice; infra.overrides.host is refused by the assertion below
  # rather than published.
  provides:
    host: "!Sub dynamodb.${AWS::Region}.${AWS::URLSuffix}"
    port: "443"
    endpoint: "!Sub https://dynamodb.${AWS::Region}.${AWS::URLSuffix}"
    table_name: "!Ref {{ .locals.logical_id }}"
    arn: "!GetAtt {{ .locals.logical_id }}.Arn"

  # This Recipe reads from infra.overrides:
  #   ReadCapacityUnits         - integer (Properties.ProvisionedThroughput.ReadCapacityUnits, and each
  #                               index's), required with infra.billing_mode PROVISIONED
  #   WriteCapacityUnits        - integer (Properties.ProvisionedThroughput.WriteCapacityUnits, and each
  #                               index's), required with infra.billing_mode PROVISIONED
  #   KmsKeyId                  - string (Properties.SSESpecification.KMSMasterKeyId, with SSEEnabled
  #                               true and SSEType KMS)
  #   DeletionProtectionEnabled - bool (Properties.DeletionProtectionEnabled)
  # host halts by name, as any key not listed does.
  #
  # The key names are the CloudFormation property names rather than a separate
  # Aggrega spelling, because each is passed through to the resource unchanged
  # and the property name is what a reader matches against the resource
  # documentation. KmsKeyId is the exception: it is the name the RDS Recipes
  # of this catalog read for the KMS key a resource is encrypted with, kept
  # here for the property AWS::DynamoDB::Table spells KMSMasterKeyId, so a
  # Release names the operator's key once whichever Recipe it encrypts.
  #
  # ReadCapacityUnits and WriteCapacityUnits are the table's capacity under
  # PROVISIONED, each a whole number from 1, and every global secondary index
  # is provisioned with the same: DynamoDB requires a capacity for each index
  # of a provisioned table, and the Component declares no index capacity of
  # its own. Under PAY_PER_REQUEST DynamoDB takes no capacity, so either key
  # set halts the build, as does PROVISIONED without both. The capacity is
  # fixed: this Recipe writes no Application Auto Scaling policy.
  #
  # KmsKeyId names the operator's customer managed key, as its key ID, its
  # ARN, an alias name or an alias ARN, which the table is encrypted with;
  # unset, no SSESpecification is written and DynamoDB encrypts the table with
  # a key AWS owns. The key and its key policy are the operator's, named here
  # and never created.
  #
  # DeletionProtectionEnabled takes true or false; unset, the table is created
  # without deletion protection, as DynamoDB creates it. The resource keeps
  # CloudFormation's own deletion policy, Delete, so deleting the stack, or
  # removing the table from it, deletes the table, which deletion protection
  # makes fail while it is on.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.table_name, values.key_schema,
  #     values.attribute_definitions, values.global_secondary_indexes,
  #     infra.billing_mode, a core/backup attachment, as the comment above the
  #     fragment says, and the overrides above.
  #   refused — capacity under PAY_PER_REQUEST, PROVISIONED without both
  #     capacity keys, a capacity that is not a whole number from 1, a
  #     DeletionProtectionEnabled that is not true or false, a KmsKeyId that
  #     is not one string, infra.overrides.host and any other key under
  #     infra.overrides, each as the comment above its assertion says; and,
  #     as the comment above the fragment says, a second core/backup
  #     attachment, a retention outside 1 to 35 days, infra.schedule, and
  #     infra.point_in_time_recovery false. A core/backup attachment carrying
  #     infra.role_arn is refused by the FeatureRecipe it is bound to, as the
  #     same comment says. The Component's own assertions hold the keys and
  #     indexes to DynamoDB's rules.
  #   not read — none: the Component declares no key this Recipe has no
  #     setting for.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "ReadCapacityUnits" "WriteCapacityUnits" "KmsKeyId" "DeletionProtectionEnabled" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and DynamoDB answers at its own endpoint in the table's Region alone, offers no custom domain, and every name it answers under is one of the service's own, none of them the operator's choice: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads ReadCapacityUnits, WriteCapacityUnits, KmsKeyId and DeletionProtectionEnabled from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # DynamoDB requires a read and a write capacity on a PROVISIONED table, a
    # whole number from 1 each, and takes none on a PAY_PER_REQUEST table
    # (the CreateTable reference: "If you set BillingMode as PROVISIONED, you
    # must specify this property. If you set BillingMode as PAY_PER_REQUEST,
    # you cannot specify this property").
    capacity_follows_billing_mode: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $set := list -}}
      {{- range $k := list "ReadCapacityUnits" "WriteCapacityUnits" }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end -}}
      {{- if eq .infra.billing_mode "PAY_PER_REQUEST" -}}
      {{- with $set -}}
      {{- fail (printf "infra.overrides.%s is set, and infra.billing_mode is PAY_PER_REQUEST, under which DynamoDB bills each request and takes no provisioned capacity: remove it from the Release, or set infra.billing_mode to PROVISIONED" (first .)) -}}
      {{- end -}}
      {{- else -}}
      {{- range $k := list "ReadCapacityUnits" "WriteCapacityUnits" -}}
      {{- if not (hasKey $o $k) -}}
      {{- fail (printf "infra.billing_mode is PROVISIONED, and DynamoDB requires a provisioned table's read and write capacity, but infra.overrides.%s carries none: set infra.overrides.ReadCapacityUnits and infra.overrides.WriteCapacityUnits in the Release, or set infra.billing_mode to PAY_PER_REQUEST" $k) -}}
      {{- end -}}
      {{- if not (regexMatch `^[1-9][0-9]*$` (toString (get $o $k))) -}}
      {{- fail (printf "infra.overrides.%s is %v, and DynamoDB takes a provisioned capacity as a whole number of capacity units from 1: set it to one in the Release" $k (get $o $k)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # DeletionProtectionEnabled is a boolean, and KmsKeyId a key ID, a key
    # ARN, an alias name or an alias ARN, as the resource takes them.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "DeletionProtectionEnabled" -}}
      {{- if not (kindIs "bool" $o.DeletionProtectionEnabled) -}}
      {{- fail (printf "infra.overrides.DeletionProtectionEnabled is %v, and DynamoDB takes true or false for a table's deletion protection: set it to true or false in the Release, or remove it to create the table without deletion protection" $o.DeletionProtectionEnabled) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^\S+$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %v, and DynamoDB names the KMS key a table is encrypted with by its key ID, its ARN, an alias name or an alias ARN, written as one string: set it to one of them in the Release, or remove it to encrypt the table with a key AWS owns" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside, and kept as the
  # table's point-in-time recovery, which this Recipe sets through the
  # property PointInTimeRecoverySpecification:
  #   - With none attached, point-in-time recovery is off, as DynamoDB creates
  #     a table, and PointInTimeRecoveryEnabled is written false.
  #   - An attachment carrying no infra.role_arn, bound to
  #     cloudformation/backup-native, turns it on. DynamoDB then backs the
  #     table up continuously, and a restore reaches any point of the
  #     recovery period, up to about five minutes before the present.
  #     infra.retention_days is RecoveryPeriodInDays, the length of that
  #     period, 1 to 35 days, the range DynamoDB keeps, and a value outside it
  #     halts naming the attachment. Point-in-time recovery takes no backup at
  #     a time of day, so infra.schedule halts naming it. A restore is made to
  #     a new table, outside the Release. When a table with point-in-time
  #     recovery on is deleted, DynamoDB keeps a backup of it for 35 days.
  #   - An attachment carrying infra.role_arn asks AWS Backup to back the
  #     table up, and halts naming it before this template is read: bound to
  #     cloudformation/backup-native, that FeatureRecipe refuses the role, and
  #     bound to cloudformation/backup-aws-backup, which selects an Amazon RDS
  #     DB instance, that FeatureRecipe refuses a host of another type.
  #   - Two attachments halt naming both: a table has one point-in-time
  #     recovery setting.
  #   - Point-in-time recovery is what the attachment turns on, so
  #     infra.point_in_time_recovery left out or true is what the table gives,
  #     and false halts naming it.
  # A Recipe's locals cannot read its attachments, so the reading sits at the
  # top of the template below. terraform/dynamodb declares it in the same
  # words, for the module's inputs: a change to it is made to both.
  #
  # Every string the Aggregate writes reaches the template as a JSON string,
  # which YAML reads as written whatever characters it holds.
  artifacts:
    template.yaml: |
      {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
      {{- $backup := "" -}}{{- $backupInfra := dict -}}
      {{- range $name, $attachment := (default dict .features) -}}
      {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
      {{- if $backup -}}
      {{- fail (printf "core/backup attachments %q and %q on %q both turn on the table's point-in-time recovery, and a DynamoDB table has one point-in-time recovery setting: remove one of the two" $backup $name $.context.instance_id) -}}
      {{- end -}}
      {{- $backup = $name -}}{{- $backupInfra = default dict (optional $attachment "infra" dict) -}}
      {{- end -}}
      {{- end -}}
      {{- $recoveryDays := 0 -}}
      {{- if $backup -}}
      {{- if eq (toString (optional $backupInfra "point_in_time_recovery" "")) "false" -}}
      {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and the backup the attachment configures on a DynamoDB table is its point-in-time recovery: remove infra.point_in_time_recovery from the attachment, or set it to true" $backup .context.instance_id) -}}
      {{- end -}}
      {{- with trim (toString (optional $backupInfra "schedule" "")) -}}
      {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and DynamoDB's point-in-time recovery backs the table up continuously, taking no backup at a time of day: remove infra.schedule from the attachment" $backup $.context.instance_id .) -}}
      {{- end -}}
      {{- $recoveryDays = int (optional $backupInfra "retention_days" 7) -}}
      {{- if or (lt $recoveryDays 1) (gt $recoveryDays 35) -}}
      {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and DynamoDB's point-in-time recovery keeps a recovery period of 1 to 35 days: set infra.retention_days to 35 or fewer" $backup .context.instance_id $recoveryDays) -}}
      {{- end -}}
      {{- end -}}
      {{- $o := optional .infra "overrides" dict -}}
      {{- $provisioned := eq .infra.billing_mode "PROVISIONED" -}}
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::DynamoDB::Table
          Properties:
            TableName: {{ toJson .locals.table_name }}
            BillingMode: {{ .infra.billing_mode }}
            KeySchema:
              {{- range .values.key_schema }}
              - AttributeName: {{ toJson .attribute_name }}
                KeyType: {{ .key_type }}
              {{- end }}
            AttributeDefinitions:
              {{- range .values.attribute_definitions }}
              - AttributeName: {{ toJson .attribute_name }}
                AttributeType: {{ .attribute_type }}
              {{- end }}
            {{- if $provisioned }}
            ProvisionedThroughput:
              ReadCapacityUnits: {{ $o.ReadCapacityUnits }}
              WriteCapacityUnits: {{ $o.WriteCapacityUnits }}
            {{- end }}
            {{- with .values.global_secondary_indexes }}
            GlobalSecondaryIndexes:
              {{- range . }}
              - IndexName: {{ toJson .index_name }}
                KeySchema:
                  {{- range .key_schema }}
                  - AttributeName: {{ toJson .attribute_name }}
                    KeyType: {{ .key_type }}
                  {{- end }}
                Projection:
                  ProjectionType: {{ .projection.projection_type }}
                  {{- with optional .projection "non_key_attributes" list }}
                  NonKeyAttributes: {{ toJson . }}
                  {{- end }}
                {{- if $provisioned }}
                ProvisionedThroughput:
                  ReadCapacityUnits: {{ $o.ReadCapacityUnits }}
                  WriteCapacityUnits: {{ $o.WriteCapacityUnits }}
                {{- end }}
              {{- end }}
            {{- end }}
            PointInTimeRecoverySpecification:
              PointInTimeRecoveryEnabled: {{ if $backup }}true{{ else }}false{{ end }}
              {{- if $backup }}
              RecoveryPeriodInDays: {{ $recoveryDays }}
              {{- end }}
            {{- with optional $o "KmsKeyId" "" }}
            SSESpecification:
              SSEEnabled: true
              SSEType: KMS
              KMSMasterKeyId: {{ toJson . }}
            {{- end }}
            {{- if hasKey $o "DeletionProtectionEnabled" }}
            DeletionProtectionEnabled: {{ $o.DeletionProtectionEnabled }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two tables
      # in one stack keep their identities apart.
      provides:
        host: !Sub "dynamodb.${AWS::Region}.${AWS::URLSuffix}"
        port: "443"
        endpoint: !Sub "https://dynamodb.${AWS::Region}.${AWS::URLSuffix}"
        table_name: !Ref {{ .locals.logical_id }}
        arn: !GetAtt {{ .locals.logical_id }}.Arn
