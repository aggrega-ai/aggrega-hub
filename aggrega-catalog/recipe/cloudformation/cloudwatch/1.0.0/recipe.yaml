apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloudwatch
  version: 1.0.0
  description: >
    Amazon CloudWatch Logs on CloudFormation: one AWS::Logs::LogGroup named
    after the component, which the cloudformation provider assembles into
    the boundary's stack, keeping each event for infra.retention_days or,
    unset, with no expiry. log_group_name and arn publish CloudFormation
    references to the group's name and ARN, which CloudFormation resolves
    when it creates the stack.

    The group is in the Standard log class unless LogGroupClass names
    INFREQUENT_ACCESS, and CloudWatch Logs encrypts the events it ingests
    with the operator's KMS key where KmsKeyId names the key by its ARN. No
    log stream, filter, policy, role or key is created. Renaming the
    component replaces the group, and deleting the stack, or removing the
    group from it, deletes the group, each with every event it holds.

    infra.overrides.host halts the build, since a writer names the group
    rather than an address, as do a LogGroupClass other than STANDARD or
    INFREQUENT_ACCESS, a KmsKeyId other than a key's ARN and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/observability/cloudwatch:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two log groups deployed into one stack describe two resources rather than
  # one. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance api-logs names the
  # resource ApiLogsLogGroup.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this log group, and resolves
  # none of them. log_group_name is the resource's Ref, which returns the
  # group's name (the CloudFormation reference for AWS::Logs::LogGroup). arn
  # is composed from that name in the form CloudWatch Logs gives a group's
  # logGroupArn, arn:<partition>:logs:<region>:<account>:log-group:<name>
  # (the CloudWatch Logs API Reference's LogGroup and AssociateKmsKey), the
  # partition, Region and account being the stack's own pseudo parameters:
  # the resource's Arn attribute carries the other form, followed by :*,
  # which the Component does not publish. CloudFormation resolves both when
  # it creates the group, so a consumer in the same stack reading either is
  # created after it. The provider projects the matching provides block
  # inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides
  # is the Outputs source, and they carry the same values.
  provides:
    log_group_name: "!Ref {{ .locals.logical_id }}LogGroup"
    arn: "!Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ {{- .locals.logical_id }}LogGroup}"

  # This Recipe reads from infra.overrides:
  #   LogGroupClass - string (LogGroupClass)
  #   KmsKeyId      - string (KmsKeyId)
  # host halts by name, as any key not listed does.
  #
  # LogGroupClass is the resource's own property name, which is what a
  # reader matches against the resource documentation; KmsKeyId is that
  # property's name too, and the name the catalog's CloudFormation Recipes
  # read for the KMS key a resource is encrypted with, so a Release names
  # the operator's key once whichever Recipe it encrypts.
  #
  # LogGroupClass is STANDARD or INFREQUENT_ACCESS, and STANDARD, which
  # CloudFormation also defaults to, is written while it is unset. The
  # Standard class supports every CloudWatch Logs feature. INFREQUENT_ACCESS,
  # which CloudWatch Logs now calls Essentials, charges less for ingestion
  # and supports a subset: no metric filters, subscription filters, Live
  # Tail, embedded metric format or GetLogEvents and FilterLogEvents, so its
  # events are read through CloudWatch Logs Insights (the Amazon CloudWatch
  # Logs User Guide's "Log classes"). From December 2026 CloudWatch Logs
  # reports such a group's class as ESSENTIALS, a change of name alone (the
  # same page); the CloudFormation reference does not say how a later stack
  # update or drift detection treats it. ESSENTIALS is refused by name: it
  # names the same class, and the AWS::Logs::LogGroup resource schema this
  # catalog checks the stack against, cfn-lint 1.60.1's, lists STANDARD,
  # INFREQUENT_ACCESS and DELIVERY alone. DELIVERY is refused by name:
  # CloudWatch Logs reserves that class for delivering AWS Lambda logs to
  # Amazon S3 or Amazon Data Firehose and keeps its events for a fixed short
  # period of its own (the API Reference's CreateLogGroup and the "Log
  # classes" page), which infra.retention_days could not set. Any other value
  # halts the build too. CloudWatch Logs fixes a group's class when it
  # creates the group ("Log classes": "After a log group is created, its log
  # class can't be changed"), and the CloudFormation reference marks the
  # property "Updates are not supported", so a stack update changing the
  # class of a deployed group is not supported.
  #
  # KmsKeyId names the operator's KMS key by its ARN,
  # arn:<partition>:kms:<region>:<account>:key/<key id>, the key ID a UUID
  # or, for a multi-Region key, mrk- and 32 hexadecimal digits: CloudWatch
  # Logs takes the ARN of a key for this field (the API Reference's
  # CreateLogGroup and AssociateKmsKey, and the CloudFormation reference's
  # KmsKeyId: "specify the ARN of that KMS key here"). The resource schema's
  # pattern also admits the ARN of an alias, which CloudWatch Logs does not
  # document for the field, so an alias ARN, an alias name such as
  # alias/example-key and a bare key ID halt the build. The key encrypts
  # every log event the group ingests while it is associated, through the
  # event's retention period; the results of CloudWatch Logs Insights
  # queries over the group are encrypted by an association of the account's
  # own, not by this key (AssociateKmsKey). CloudWatch Logs takes a
  # symmetric key alone, and a key in the group's Region whose key policy
  # lets the service principal logs.<region>.amazonaws.com use it (the
  # Amazon CloudWatch Logs User Guide's "Encrypt log data in CloudWatch Logs
  # using AWS Key Management Service"); the key, its policy and the
  # permissions of the roles that write and read the group are the
  # operator's, named here and never created. CloudWatch Logs refuses a key
  # that does not exist or is disabled when it associates it. Unset,
  # CloudWatch Logs encrypts the events at rest with its own AES-GCM
  # encryption and no KMS key.
  #
  # Changing or removing KmsKeyId is an update in place (the CloudFormation
  # reference: "No interruption"), which takes up to five minutes to take
  # effect: events ingested before stay encrypted under the key they were
  # ingested with, CloudWatch Logs can return them only while that key stays
  # enabled and usable by it, and deleting that key leaves them unusable
  # (AssociateKmsKey; "Encrypt log data").
  #
  # host is refused by name. CloudWatch Logs publishes no address of a log
  # group of its own: a writer calls the service's endpoint in the group's
  # Region and names the group, so this Component publishes no host for the
  # name to replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — infra.retention_days (RetentionInDays, left out while unset,
  #     so events never expire), and the overrides above.
  #   refused — a LogGroupClass of ESSENTIALS, of DELIVERY or of any value
  #     but STANDARD and INFREQUENT_ACCESS; a KmsKeyId other than a key's
  #     ARN; infra.overrides.host; and any infra.overrides key not listed
  #     above.
  #   held by the Component — infra.retention_days to the periods CloudWatch
  #     Logs takes, and the component's name, which names the group, to the
  #     service's rule for a group name.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the fragment leaves out, each property off or absent as the
  # resource schema defaults it: DeletionProtectionEnabled, so deletion
  # protection stays off; BearerTokenAuthenticationEnabled, so the group
  # takes no bearer token; and DataProtectionPolicy, FieldIndexPolicies and
  # ResourcePolicyDocument, so the group masks no data, indexes no field and
  # carries no resource policy.
  #
  # The name. The group is named after the component, and LogGroupName is a
  # property whose change replaces the resource. Renaming the component makes
  # CloudFormation create a group under the new name and then delete the old
  # one with every event it holds (the CloudFormation User Guide's stack
  # status UPDATE_COMPLETE_CLEANUP_IN_PROGRESS: it "creates the new resources
  # first and then deletes the old resources"). A group's name is unique
  # within its account and Region (CreateLogGroup), so a stack naming a group
  # that already exists there fails to create it.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy,
  # Delete, so deleting the stack, or removing the group from it, deletes the
  # group, and CloudWatch Logs "permanently deletes all the archived log
  # events associated with the log group" (the API Reference's
  # DeleteLogGroup). CloudWatch Logs keeps no backup to restore them from.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "LogGroupClass" "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon CloudWatch Logs publishes no address of a log group: a writer calls the service's endpoint in the group's Region and names the group by log_group_name: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads LogGroupClass and KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # LogGroupClass is one of the two classes written as the header says, and
    # KmsKeyId the ARN of a key. The same class refusals of DELIVERY and of
    # any value but the admitted ones, and the same key ARN check, stand in
    # terraform/cloudwatch: the override key is spelt differently per target,
    # so the checks cannot sit in the realization-neutral Component, and a
    # MappingLibrary imports a whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "LogGroupClass" -}}
      {{- $c := get $o "LogGroupClass" -}}
      {{- if eq (toString $c) "ESSENTIALS" -}}
      {{- fail "infra.overrides.LogGroupClass is \"ESSENTIALS\", the name CloudWatch Logs now gives the Infrequent Access class, and the CloudFormation resource schema this Recipe is checked against takes that class as INFREQUENT_ACCESS: set it to INFREQUENT_ACCESS in the Release" -}}
      {{- else if eq (toString $c) "DELIVERY" -}}
      {{- fail "infra.overrides.LogGroupClass is \"DELIVERY\", and CloudWatch Logs reserves the Delivery class for delivering AWS Lambda logs to Amazon S3 or Amazon Data Firehose, keeping its events for a fixed short period that infra.retention_days cannot set: set it to STANDARD or INFREQUENT_ACCESS in the Release, or remove it" -}}
      {{- else if not (and (typeIs "string" $c) (has $c (list "STANDARD" "INFREQUENT_ACCESS"))) -}}
      {{- fail (printf "infra.overrides.LogGroupClass is %s, and this Recipe creates a log group in the class STANDARD or INFREQUENT_ACCESS, spelt so: set it to one of the two in the Release, or remove it for STANDARD" (toJson $c)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32})$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and CloudWatch Logs takes the KMS key a log group is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/<key id>, not an alias or a bare key ID: set it to the key's ARN in the Release, or remove it to encrypt the events without a KMS key" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  # infra.retention_days reaches the fragment as the Component's schema holds
  # it, one of the periods CloudWatch Logs takes, written as a whole number.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}LogGroup:
          Type: AWS::Logs::LogGroup
          Properties:
            LogGroupName: {{ toJson .context.instance_id }}
            {{- with optional .infra "retention_days" nil }}
            RetentionInDays: {{ int64 . }}
            {{- end }}

            ## ── Provider-specific overrides ─────────────────────────
            LogGroupClass: {{ optional $o "LogGroupClass" "STANDARD" }}
            {{- with optional $o "KmsKeyId" "" }}
            KmsKeyId: {{ toJson . }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two log
      # groups in one stack keep their identities apart. A cross-stack consumer
      # imports an entry; an intra-stack consumer receives it through the
      # value-pipe above.
      provides:
        log_group_name: !Ref {{ .locals.logical_id }}LogGroup
        arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ {{- .locals.logical_id }}LogGroup}"
