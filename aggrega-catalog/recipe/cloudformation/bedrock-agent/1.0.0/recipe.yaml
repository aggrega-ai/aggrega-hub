apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-agent
  version: 1.0.0
  description: >
    An Amazon Bedrock agent as a reference realization on CloudFormation:
    the fragment this Recipe writes declares no resource, so deploying it
    creates nothing, and the cloudformation provider writes the regional
    agent-runtime endpoint the Release supplies and the agent's name as
    Outputs of the boundary's stack. Amazon Bedrock prepares an agent only
    once it names a foundation model (FoundationModel), which the
    Component's values do not carry, so this Recipe creates no agent: the
    agent, its instruction and its action groups are configured in Amazon
    Bedrock and addressed by the agent name.

    Reach for it where the Release deploys a CloudFormation stack; reach for
    terraform/bedrock-agent where it deploys Terraform. CloudFormation takes
    no template without a resource, so this component shares its boundary
    with a component whose Recipe declares one, such as the server that
    reads the agent: a stack holding only reference realizations halts the
    build. A consumer reads each value as the text the Release and the
    Aggregate give, and nothing is looked up when the stack is created. A
    missing infra.endpoint halts naming it. No credential is delivered by
    this Recipe: consumers authenticate with ambient AWS IAM, such as the
    task role of an Amazon ECS task, or inject their own credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/ai-agent/bedrock:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts before this Recipe
  # renders, the Component's schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.agent_name, published as provides.agent_name;
  #     infra.endpoint, published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.instruction and values.action_groups, which are
  #     configured on the agent in Amazon Bedrock, where it lives, and this
  #     Recipe creates no agent to set them on; values.models,
  #     values.tools_allowed, values.datastores and values.agents_allowed,
  #     which name the catalog components the agent works with as a
  #     convention for its readers; values.display_name and
  #     values.description, which describe the component to its readers.
  #
  # A knowledge_base connection is not read: an agent's knowledge bases are
  # associated with it in Amazon Bedrock, as its instruction and action
  # groups are, and this Recipe creates no agent to associate one with.
  #
  # Why no agent. Amazon Bedrock prepares an agent, so that it can be
  # tested or deployed, only once the agent names an agent resource role, a
  # foundation model and instructions (Amazon Bedrock User Guide, "Create
  # and configure agent manually"), and the CloudFormation reference for
  # AWS::Bedrock::Agent lists AgentName, AgentResourceRoleArn and
  # FoundationModel as what a template specifies at least. The Component's
  # values carry no foundation model, so an AWS::Bedrock::Agent this Recipe
  # declared could never be prepared: it declares none.
  #
  # Backup. The agent is configured in Amazon Bedrock, and this Recipe
  # creates nothing to back up.
  assertions:
    # The Bedrock agent-runtime host carries the region, and the region is the
    # operator's choice, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches a Bedrock agent through the agent runtime of a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the Bedrock agent-runtime endpoint of that region (bedrock-agent-runtime.<region>.amazonaws.com)" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the agent's name from the
  # developer's values, each published as written, so a consumer in this
  # stack or on another target reads the same text. The provider projects
  # the matching provides block inside the fragment below into the assembled
  # stack Outputs; this recipe-level provides is the value-pipe contract, the
  # fragment provides is the Outputs source, and they carry the same values.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_name: "{{ .values.agent_name }}"

  # The fragment this component becomes: no Resources, so deploying it
  # creates nothing, and a provides entry for each value the component
  # publishes. Each value is written as a JSON string, which YAML reads back
  # as the same text and CloudFormation takes as a literal.
  artifacts:
    template.yaml: |
      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs, named for this instance and the entry together, so two
      # agents in one stack keep their identities apart. A cross-stack
      # consumer imports an entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        endpoint: {{ toJson .infra.endpoint }}
        agent_name: {{ toJson .values.agent_name }}
