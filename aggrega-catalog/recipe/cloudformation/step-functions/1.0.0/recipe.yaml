apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: step-functions
  version: 1.0.0
  description: >
    AWS Step Functions on CloudFormation: one AWS::StepFunctions::StateMachine
    named after the component, which the cloudformation provider assembles
    into the boundary's stack, running the definition and of the type its
    values set, as the IAM role RoleArn names. arn publishes a
    CloudFormation reference to the state machine's ARN, which
    CloudFormation resolves when it creates the stack.

    Step Functions encrypts the definition and execution history with keys
    AWS owns, and adds the operator's KMS key where KmsKeyId names one; it
    logs executions to the operator's log group where LoggingConfiguration
    names one, and logs nothing otherwise. No role, log group or key is
    created. A stack update changing values.state_machine_type fails, as
    Step Functions fixes a state machine's type and CloudFormation replaces
    no state machine whose name it sets; renaming the component creates a
    state machine under the new name and deletes the old one.

    A RoleArn not set or other than a role's ARN halts the build, as do a
    KmsKeyId in no form Step Functions takes, a LoggingConfiguration outside
    the shape Step Functions takes or naming a log group ARN not ending in
    :*, infra.overrides.host and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/ai-pipeline/step-functions:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two state machines deployed into one stack describe two resources rather
  # than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are
  # read as word boundaries and each word is capitalised: instance
  # order-workflow names the resource OrderWorkflowStateMachine.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes this string verbatim into a
  # consumer's injection context when it uses this state machine, and
  # resolves none of it. arn is the resource's Ref, which the CloudFormation
  # reference for AWS::StepFunctions::StateMachine gives as the state
  # machine's ARN, arn:aws:states:us-east-1:111122223333:stateMachine:HelloWorld-StateMachine,
  # the same value as its Arn attribute. CloudFormation resolves it when it
  # creates the state machine, so a consumer in the same stack reading it is
  # created after it. The provider projects the matching provides block
  # inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides
  # is the Outputs source, and they carry the same value.
  provides:
    arn: "!Ref {{ .locals.logical_id }}StateMachine"

  # This Recipe reads from infra.overrides:
  #   RoleArn              - string, required (RoleArn)
  #   LoggingConfiguration - object (LoggingConfiguration)
  #   KmsKeyId             - string (EncryptionConfiguration.KmsKeyId, with
  #                          Type CUSTOMER_MANAGED_KMS_KEY)
  # host halts by name, as any key not listed does.
  #
  # RoleArn and KmsKeyId are the names the catalog's CloudFormation Recipes
  # read for the IAM role a service assumes and for the KMS key a resource is
  # encrypted with, so a Release names each once whichever Recipe it
  # configures; LoggingConfiguration is the property's own name, which is
  # what a reader matches against the resource documentation.
  #
  # RoleArn names the IAM role Step Functions assumes to run the state
  # machine's states, as the ARN of a role,
  # arn:<partition>:iam::<account>:role/ followed by its path and name, at
  # most 256 characters (the API Reference's CreateStateMachine), and is
  # required: the resource schema requires RoleArn, and a state machine
  # calls every service its definition names as that role. The role, with a
  # trust policy letting Step Functions assume it and the permissions its
  # states need, is the operator's, named here and never created. Changing
  # it updates the state machine in place (the CloudFormation reference:
  # "No interruption").
  #
  # KmsKeyId names the operator's symmetric KMS key in one of the forms Step
  # Functions takes for the field (the API Reference's EncryptionConfiguration:
  # "An alias, alias ARN, key ID, or key ARN"): a key ID (a UUID, or mrk-
  # and 32 hexadecimal digits for a multi-Region key), an alias name (alias/
  # followed by its name), or the ARN of a key or of an alias, the two forms
  # a key of another account takes. Step Functions then adds a layer of
  # encryption under that key over the one it always applies with keys AWS
  # owns, encrypting the definition and the execution history (the AWS Step
  # Functions Developer Guide's "Data at rest encryption"), and reuses a
  # data key for 300 seconds, the service's default, before calling KMS
  # again. That page lists the permissions: kms:DescribeKey and
  # kms:GenerateDataKey for the identity creating or updating the state
  # machine; kms:Decrypt and kms:GenerateDataKey for the role RoleArn names,
  # to run a Standard or asynchronous Express execution, and kms:Decrypt to
  # run a synchronous Express one; and, while logging is on, kms:Decrypt for
  # delivery.logs.amazonaws.com in the key's policy and kms:GenerateDataKey
  # for the role. It also says that while the key is disabled, or deleted or
  # scheduled for deletion, running executions fail and new ones cannot
  # start. The key is the operator's, named here and never created. Unset,
  # the fragment writes Type AWS_OWNED_KEY, the encryption Step Functions
  # always applies, so removing KmsKeyId from a deployed state machine takes
  # the key away. Setting, changing or removing it updates the state machine
  # in place (the CloudFormation reference: "No interruption").
  #
  # LoggingConfiguration is the resource's logging configuration, written as
  # the CloudFormation reference spells it: Level, one of ALL, ERROR, FATAL
  # and OFF (the service's default), the events each logs being those the
  # Developer Guide's "Log levels" table lists; IncludeExecutionData, a
  # boolean, whether the input and output of each event are logged; and
  # Destinations, one CloudWatchLogsLogGroup whose LogGroupArn is the ARN of
  # the operator's log group, which a Level other than OFF needs (the API
  # Reference's LoggingConfiguration: "Limited to size 1. Required, if your
  # log level is not set to OFF"). Step Functions takes that ARN only ending
  # in :* (the API Reference's CloudWatchLogsLogGroup: "The ARN must end
  # with :*"), the form a log group's Arn attribute takes on CloudFormation,
  # so a LogGroupArn in another form halts the build, as does a
  # LoggingConfiguration outside this shape. The log group and the
  # permissions logging needs are the operator's, named here and never
  # created: the role RoleArn names needs the CloudWatch Logs actions the
  # Developer Guide's "Using CloudWatch Logs to log execution history in Step
  # Functions" lists, logs:CreateLogDelivery among them, on every resource,
  # and that page advises a log group name beginning
  # /aws/vendedlogs/states, so that CloudWatch Logs' resource policy stays
  # within its 5,120-character limit. An Express state machine records its
  # executions nowhere else (the Developer Guide's "Choosing workflow type in
  # Step Functions": "Execution history is not captured by Step Functions").
  # Unset, the fragment writes Level OFF, so removing LoggingConfiguration
  # from a deployed state machine turns its logging off. Setting, changing or
  # removing it updates the state machine in place (the CloudFormation
  # reference: "No interruption").
  #
  # host is refused by name. A state machine publishes no address of its
  # own: a caller reaches the Step Functions endpoint in the state machine's
  # Region, which the service names, and names the state machine by its ARN
  # in each call, so this Component publishes no host for the name to
  # replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.definition (Definition), values.state_machine_type
  #     (StateMachineType, written as the Component's default when unset),
  #     and the overrides above.
  #   refused — a RoleArn not set or other than a role's ARN; a KmsKeyId in
  #     no form Step Functions takes; a LoggingConfiguration outside the
  #     shape above, or whose LogGroupArn does not end in :*;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   held by the Component — values.state_machine_type to STANDARD and
  #     EXPRESS; values.definition to holding States and a StartAt naming one
  #     of them; and the component's name, which names the state machine, to
  #     Step Functions' 80 characters.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The definition. values.definition is written as the Definition property,
  # a JSON object in the stack, which Step Functions reads as the state
  # machine's Amazon States Language definition; Step Functions judges the
  # states when it creates or updates the state machine (the API Reference's
  # CreateStateMachine: InvalidDefinition). CloudFormation reads an object
  # inside it whose one key is Ref or begins Fn:: as an intrinsic function,
  # as it does anywhere in a resource's properties. Changing the definition
  # updates the state machine in place (the CloudFormation reference: "No
  # interruption").
  #
  # What the fragment leaves out: DefinitionString, DefinitionS3Location and
  # DefinitionSubstitutions, as the definition is the value above;
  # EncryptionConfiguration.KmsDataKeyReusePeriodSeconds, which keeps the
  # service's 300 seconds; TracingConfiguration, so AWS X-Ray tracing stays
  # off, the service's default; and Tags.
  #
  # The type. Step Functions fixes a state machine's type when it creates it
  # (the API Reference's CreateStateMachine: "You cannot update the type of a
  # state machine once it has been created"), and the CloudFormation
  # reference marks StateMachineType "Replacement" while, for a state
  # machine whose StateMachineName the template sets, "you cannot perform
  # updates that require replacement of this resource". So a stack update
  # changing values.state_machine_type on a deployed state machine fails; a
  # state machine of the other type takes a new component name.
  #
  # The name. The state machine is named after the component, and the
  # resource's logical ID follows the name too (order-workflow is
  # OrderWorkflowStateMachine). Renaming the component therefore removes one
  # resource from the template and adds another, not a replacement of
  # StateMachineName. CloudFormation creates the new state machine first and
  # then deletes the old one (the CloudFormation User Guide's stack status
  # UPDATE_COMPLETE_CLEANUP_IN_PROGRESS: it "creates the new resources first
  # and then deletes the old resources"). Deleting a state machine, as a
  # rename, removing it from the stack or deleting the stack does, stops its
  # running executions: Step Functions sets it DELETING, and "On the next
  # state transition, the state machine's executions are terminated" (the API
  # Reference's DeleteStateMachine); an execution started on the old ARN does
  # not move to the new one.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "RoleArn" "LoggingConfiguration" "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a Step Functions state machine publishes no address of its own: a caller reaches the Step Functions endpoint in its Region and names the state machine by its ARN: remove infra.overrides.host from the Release, and read the arn the state machine publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads RoleArn, LoggingConfiguration and KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The role a state machine runs as is the operator's, and the resource
    # schema requires it.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "RoleArn") -}}
      {{- fail "infra.overrides.RoleArn is not set, and a Step Functions state machine runs as the IAM role the operator names by its ARN: set infra.overrides.RoleArn in the Release, such as arn:aws:iam::123456789012:role/example-state-machine-role" -}}
      {{- end -}}
    # RoleArn the ARN of a role, KmsKeyId one of the forms Step Functions
    # takes, and LoggingConfiguration the shape the header gives, its log
    # group ARN ending in :*. The same role and key checks stand in
    # terraform/step-functions, over its own keys, which holds its logging
    # keys to the module's own shape: the override keys are spelt
    # differently per target, so the checks cannot sit in the
    # realization-neutral Component, and a MappingLibrary imports a whole
    # valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "RoleArn" -}}
      {{- if not (and (typeIs "string" $o.RoleArn) (le (len $o.RoleArn) 256) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.RoleArn)) -}}
      {{- fail (printf "infra.overrides.RoleArn is %s, and Step Functions takes the IAM role a state machine runs as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 256 characters at most: set it to such an ARN in the Release" (toJson $o.RoleArn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (le (len $o.KmsKeyId) 2048) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9:/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/\S+)$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and Step Functions takes the KMS key a state machine is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to encrypt with keys AWS owns alone" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "LoggingConfiguration" -}}
      {{- $l := get $o "LoggingConfiguration" -}}
      {{- $ok := kindIs "map" $l -}}
      {{- $arn := "" -}}
      {{- if $ok -}}
      {{- range $k, $_ := $l }}{{ if not (has $k (list "Level" "IncludeExecutionData" "Destinations")) }}{{ $ok = false }}{{ end }}{{ end -}}
      {{- $lv := "OFF" }}{{ if hasKey $l "Level" }}{{ $lv = get $l "Level" }}{{ end -}}
      {{- if not (has $lv (list "ALL" "ERROR" "FATAL" "OFF")) }}{{ $ok = false }}{{ end -}}
      {{- if and (hasKey $l "IncludeExecutionData") (not (typeIs "bool" (get $l "IncludeExecutionData"))) }}{{ $ok = false }}{{ end -}}
      {{- if hasKey $l "Destinations" -}}
      {{- $ds := get $l "Destinations" -}}
      {{- if and (kindIs "slice" $ds) (eq (len $ds) 1) (kindIs "map" (index $ds 0)) (eq (len (index $ds 0)) 1) (kindIs "map" (get (index $ds 0) "CloudWatchLogsLogGroup")) -}}
      {{- $g := get (index $ds 0) "CloudWatchLogsLogGroup" -}}
      {{- if and (eq (len $g) 1) (typeIs "string" (get $g "LogGroupArn")) }}{{ $arn = get $g "LogGroupArn" }}{{ else }}{{ $ok = false }}{{ end -}}
      {{- else }}{{ $ok = false }}{{ end -}}
      {{- else if ne $lv "OFF" }}{{ $ok = false }}{{ end -}}
      {{- end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.LoggingConfiguration is %s, and Step Functions takes a logging configuration of Level, one of ALL, ERROR, FATAL and OFF, an optional IncludeExecutionData boolean, and Destinations, a list of one CloudWatchLogsLogGroup holding a LogGroupArn, which a Level other than OFF needs: set it in the Release to such an object, or remove it to log nothing" (trunc 200 (toJson $l))) -}}
      {{- end -}}
      {{- if and (ne $arn "") (not (and (le (len $arn) 256) (regexMatch `^arn:aws[a-zA-Z-]*:logs:[a-z0-9-]+:[0-9]{12}:log-group:[a-zA-Z0-9_./#-]+:\*$` $arn))) -}}
      {{- fail (printf "infra.overrides.LoggingConfiguration names the log group %s, and Step Functions takes a log group's ARN ending in :*, arn:aws:logs:<region>:<account>:log-group:<name>:*, 256 characters at most: set LogGroupArn to such an ARN in the Release" (toJson $arn)) -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema and assertions
  # hold them: the definition a map holding States and a StartAt naming one
  # of them, written as one JSON object; state_machine_type STANDARD or
  # EXPRESS, defaulted. The logging configuration is written as the Release
  # gives it, as one JSON object.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}StateMachine:
          Type: AWS::StepFunctions::StateMachine
          Properties:
            StateMachineName: {{ toJson .context.instance_id }}
            StateMachineType: {{ toJson .values.state_machine_type }}
            Definition: {{ toJson .values.definition }}

            ## ── Provider-specific overrides ─────────────────────────
            RoleArn: {{ toJson $o.RoleArn }}
            EncryptionConfiguration:
              {{- with optional $o "KmsKeyId" "" }}
              Type: CUSTOMER_MANAGED_KMS_KEY
              KmsKeyId: {{ toJson . }}
              {{- else }}
              Type: AWS_OWNED_KEY
              {{- end }}
            {{- if hasKey $o "LoggingConfiguration" }}
            LoggingConfiguration: {{ toJson $o.LoggingConfiguration }}
            {{- else }}
            LoggingConfiguration:
              Level: "OFF"
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # state machines in one stack keep their identities apart. A
      # cross-stack consumer imports an entry; an intra-stack consumer
      # receives it through the value-pipe above.
      provides:
        arn: !Ref {{ .locals.logical_id }}StateMachine
