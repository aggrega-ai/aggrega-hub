apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: data-firehose
  version: 1.0.0
  description: >
    Amazon Data Firehose on CloudFormation: one
    AWS::KinesisFirehose::DeliveryStream named after the component, taking
    records put to it directly and delivering them to the S3 bucket
    BucketARN names, assuming the IAM role RoleArn names, under
    values.prefix and compressed as values.compression_format says, which
    the cloudformation provider assembles into the boundary's stack.
    delivery_stream_name and arn publish CloudFormation references to the
    stream's name and ARN, which CloudFormation resolves when it creates the
    stack.

    The bucket and the role are the operator's: neither is created, nor any
    key, log group or policy. Firehose encrypts the records it holds in
    interim storage with AWS KMS, and the objects take the bucket's default
    encryption.
    Deleting the stack, or removing the stream from it, deletes the stream
    and leaves the bucket's objects in place.

    A BucketARN or RoleArn missing or of another form halts the build, as do
    infra.overrides.host, since a producer reaches the stream at Firehose's
    endpoint in its Region, a key setting another source or destination,
    and any infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/messaging/data-firehose:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two streams deployed into one stack describe two resources rather than
  # one. A logical id is unique within a CloudFormation template and admits
  # only letters and digits, so the instance name's separators are read as
  # word boundaries and each word is capitalised: instance page-views names
  # the resource PageViewsDeliveryStream.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this stream, and resolves none
  # of them. delivery_stream_name is the resource's Ref, which returns the
  # stream's name, and arn its Arn attribute, references CloudFormation
  # resolves when it creates the stream, so a consumer in the same stack
  # reading either is created after it. The provider projects the matching
  # provides block inside the fragment below into the assembled stack
  # Outputs; this recipe-level provides is the value-pipe contract, the
  # fragment provides is the Outputs source, and they carry the same values.
  provides:
    delivery_stream_name: "!Ref {{ .locals.logical_id }}DeliveryStream"
    arn: "!GetAtt {{ .locals.logical_id }}DeliveryStream.Arn"

  # This Recipe reads from infra.overrides:
  #   BucketARN - string, required (Properties.ExtendedS3DestinationConfiguration.BucketARN)
  #   RoleArn   - string, required (Properties.ExtendedS3DestinationConfiguration.RoleARN)
  # host halts by name, as does a key setting another source or destination
  # and any key not listed.
  #
  # BucketARN is the resource's own property name, which is what a reader
  # matches against the resource documentation. RoleArn is the name the
  # catalog's CloudFormation Recipes read for the IAM role a service assumes,
  # whatever the resource calls the field, so a Release names a role the same
  # way whichever Recipe it configures; here the field is RoleARN.
  #
  # BucketARN names the S3 bucket Firehose delivers to, as the ARN of the
  # bucket, arn:aws:s3::: followed by its name: the form the Firehose API
  # reference's BucketARN pattern admits, letters, digits, underscores,
  # periods and hyphens, up to 255 of them, after arn:<partition>:s3:::. The
  # bucket, its policy and its default encryption are the operator's, named
  # here and never created. A value of another form, or none, halts the
  # build.
  #
  # RoleArn names the IAM role Firehose assumes to deliver, as the ARN of the
  # role, arn:aws:iam::<account>:role/ followed by its path and name: the
  # form, and the 512 characters at most, the Firehose API reference's
  # RoleARN gives. The role is the operator's, named here and never created.
  # Its trust policy lets firehose.amazonaws.com assume it, and its
  # permissions allow s3:AbortMultipartUpload, s3:GetBucketLocation,
  # s3:GetObject, s3:ListBucket, s3:ListBucketMultipartUploads and
  # s3:PutObject on the bucket and its objects (the Firehose Developer
  # Guide's "Grant Firehose access to an Amazon S3 destination"), or
  # Firehose cannot deliver, retries for up to 24 hours and then loses the
  # records. A value of another form, or none, halts the build.
  #
  # host is refused by name. Firehose publishes no address of a stream of
  # its own: a producer calls the service's endpoint in the stream's Region,
  # an endpoint the service names and offers no custom domain for, and names
  # the stream by delivery_stream_name in each call, so this Component
  # publishes no host for the name to replace.
  #
  # A key setting another source or destination is refused by name:
  # DeliveryStreamType and every property ending in SourceConfiguration or
  # DestinationConfiguration. ExtendedS3DestinationConfiguration, the property
  # this Recipe writes itself from the keys and values above, and
  # DirectPutSourceConfiguration, the throughput hint of the source it takes,
  # are refused with their own reasons. The stream takes records put to it
  # directly and delivers them to the bucket alone, which is what this
  # Component offers; a Kinesis data stream, an Amazon MSK cluster or a
  # database as its source, and Firehose's other destinations, are not
  # offered.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does. KmsKeyId is not read either, and
  # halts the same way: Firehose encrypts the records it holds in interim
  # storage with AWS KMS (the Firehose Developer Guide's "Data protection in
  # Amazon Data Firehose"), the fragment writes no
  # DeliveryStreamEncryptionConfigurationInput, so no server-side encryption
  # under a key of the operator's is turned on, and no EncryptionConfiguration,
  # which Firehose then takes as no encryption of its own for the objects it
  # writes, so each object takes the bucket's default encryption.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — values.prefix (Prefix, written where set),
  #     values.error_output_prefix (ErrorOutputPrefix, written where set),
  #     values.compression_format (CompressionFormat), and the overrides
  #     above.
  #   refused — a BucketARN or a RoleArn not set or of another form;
  #     infra.overrides.host; a key setting another source or destination;
  #     and any infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the stream;
  #     a prefix or an error prefix longer than 1,024 characters or holding
  #     an expression Firehose does not evaluate there; an error prefix
  #     holding an expression without !{firehose:error-output-type}; a prefix
  #     holding an expression with no error prefix; and a compression format
  #     Firehose does not list.
  #   not read — none; the Component declares no other value or infra key.
  #
  # The name. DeliveryStreamName is create-only on the resource, so renaming
  # the component makes CloudFormation create a new stream under the new name
  # and delete the old one.
  #
  # What the fragment writes beside the name, the source, the bucket, the
  # role, the prefixes and the compression: nothing else of the stream's own,
  # so Firehose's defaults hold, the same settings the AWS provider sends as
  # its own defaults for the terraform Recipe of this Component, so both
  # targets create the same stream. No BufferingHints, so Firehose takes its
  # default hints, 5 MiB or 300 seconds of records, and delivers an object
  # when either is reached, at its discretion (the BufferingHints API
  # reference calls them hints); no CustomTimeZone, so its time prefix and
  # expressions read UTC; no FileExtension, so each object ends in the
  # extension its compression gives; no S3BackupMode, so no backup copy is
  # written; no ProcessingConfiguration, DataFormatConversionConfiguration or
  # DynamicPartitioningConfiguration, so records are delivered as they arrive;
  # no CloudWatchLoggingOptions, so no delivery errors are logged to
  # CloudWatch Logs, which takes a log group of the operator's and a role
  # permission; and no DirectPutSourceConfiguration, so no throughput hint is
  # given.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy,
  # Delete, so deleting the stack, or removing the stream from it, deletes
  # the stream and its data (the DeleteDeliveryStream API reference): while
  # it is being deleted Firehose may still take records and no longer
  # guarantees their delivery, so producers stop first. The bucket and the
  # objects already delivered to it are the operator's and stay.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "BucketARN" "RoleArn" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon Data Firehose publishes no address of a stream: a producer calls the service's endpoint in the stream's Region, which offers no custom domain, and names the stream by delivery_stream_name: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if eq $k "ExtendedS3DestinationConfiguration" -}}
      {{- fail "infra.overrides.ExtendedS3DestinationConfiguration is set, and this Recipe writes the stream's ExtendedS3DestinationConfiguration itself, from BucketARN, RoleArn, values.prefix, values.error_output_prefix and values.compression_format: set those, and remove infra.overrides.ExtendedS3DestinationConfiguration from the Release" -}}
      {{- end -}}
      {{- if eq $k "DirectPutSourceConfiguration" -}}
      {{- fail "infra.overrides.DirectPutSourceConfiguration is set, and this Recipe's Amazon Data Firehose stream takes records put to it directly with Firehose's own throughput hint for that source, which no key of this Recipe sets: remove infra.overrides.DirectPutSourceConfiguration from the Release" -}}
      {{- end -}}
      {{- if regexMatch `^(DeliveryStreamType|.*SourceConfiguration|.*DestinationConfiguration)$` $k -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe's Amazon Data Firehose stream takes records put to it directly and delivers them to the S3 bucket BucketARN names, with no other source or destination: remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads BucketARN and RoleArn from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The resource type requires a bucket and a role for an S3 destination,
    # and neither has a value this Recipe could choose for the operator. The
    # terraform Recipe of this Component holds the same rule on bucket_arn
    # and role_arn: each target reads the keys under its own spelling, so the
    # rule cannot sit in the Component.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "BucketARN") -}}
      {{- fail "infra.overrides.BucketARN is not set, and an Amazon Data Firehose stream delivers to the S3 bucket the operator names by its ARN: set infra.overrides.BucketARN in the Release, such as arn:aws:s3:::example-bucket" -}}
      {{- end -}}
      {{- if not (hasKey $o "RoleArn") -}}
      {{- fail "infra.overrides.RoleArn is not set, and an Amazon Data Firehose stream delivers to its bucket under the IAM role the operator names by its ARN: set infra.overrides.RoleArn in the Release, such as arn:aws:iam::123456789012:role/example-firehose-role" -}}
      {{- end -}}
    # Each override is passed to the resource as written, so one of another
    # shape would render a property Firehose refuses. BucketARN takes the
    # bucket ARN form and RoleArn the role ARN form the Firehose API
    # reference gives each field. The terraform Recipe of this Component
    # holds the same rules on bucket_arn and role_arn, for the reason given
    # above.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "BucketARN" -}}
      {{- if not (and (typeIs "string" $o.BucketARN) (regexMatch `^arn:aws[a-zA-Z-]*:s3:::[a-zA-Z0-9_.-]{1,255}$` $o.BucketARN)) -}}
      {{- fail (printf "infra.overrides.BucketARN is %s, and Amazon Data Firehose takes the S3 bucket it delivers to as the bucket's ARN, arn:aws:s3::: followed by the bucket's name: set it to such an ARN in the Release" (toJson $o.BucketARN)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "RoleArn" -}}
      {{- if not (and (typeIs "string" $o.RoleArn) (le (len $o.RoleArn) 512) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.RoleArn)) -}}
      {{- fail (printf "infra.overrides.RoleArn is %s, and Amazon Data Firehose takes the IAM role it delivers under as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 512 characters at most: set it to such an ARN in the Release" (toJson $o.RoleArn)) -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema and assertions
  # hold them: a compression format Firehose lists, and prefixes of at most
  # 1,024 characters whose expressions Firehose evaluates. Each prefix is
  # written as a JSON string, so its characters reach the stack as written.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}DeliveryStream:
          Type: AWS::KinesisFirehose::DeliveryStream
          Properties:
            DeliveryStreamName: "{{ .context.instance_id }}"
            DeliveryStreamType: DirectPut
            ExtendedS3DestinationConfiguration:
              CompressionFormat: {{ .values.compression_format }}
              {{- with optional .values "prefix" "" }}
              Prefix: {{ toJson . }}
              {{- end }}
              {{- with optional .values "error_output_prefix" "" }}
              ErrorOutputPrefix: {{ toJson . }}
              {{- end }}

              ## ── Provider-specific overrides ─────────────────────────
              BucketARN: {{ toJson $o.BucketARN }}
              RoleARN: {{ toJson $o.RoleArn }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two
      # streams in one stack keep their identities apart. A cross-stack
      # consumer imports the entry; an intra-stack consumer receives it
      # through the value-pipe above.
      provides:
        delivery_stream_name: !Ref {{ .locals.logical_id }}DeliveryStream
        arn: !GetAtt {{ .locals.logical_id }}DeliveryStream.Arn
