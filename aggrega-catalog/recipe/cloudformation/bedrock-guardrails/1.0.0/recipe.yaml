apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-guardrails
  version: 1.0.0
  description: >
    Amazon Bedrock Guardrails on CloudFormation: one AWS::Bedrock::Guardrail
    named after the component, holding the messages and the policies its
    values declare, and one AWS::Bedrock::GuardrailVersion, a numbered
    snapshot of it, which the cloudformation provider assembles into the
    boundary's stack. guardrail_id, guardrail_version and arn publish
    references CloudFormation resolves when it creates them. Where KmsKeyId
    names a KMS key, the guardrail is encrypted with it; no key is created.

    A change of a message or a policy updates the guardrail in place and
    creates a new version, which consumers in the stack read, then deletes
    the old one; a change of the key does not create one. Renaming the
    component replaces the guardrail and its version. Removing it deletes
    the guardrail with every version.

    A KmsKeyId other than a KMS key's ARN halts the build, as do
    infra.overrides.host, since a guardrail publishes no address, and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/security/bedrock-guardrails:1.0.0

  # The resources' logical ids, derived from this instance's own name so that
  # two guardrails deployed into one stack describe distinct resources. A
  # logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance support-guardrail
  # names the resources SupportGuardrailGuardrail and
  # SupportGuardrailGuardrailVersion followed by a digest of the values,
  # which the header below explains.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    version_id: '{{ capitalizedWords .context.instance_id }}GuardrailVersion{{ trunc 12 (sha256sum (toJson .values)) }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this guardrail, and resolves
  # none of them. guardrail_id is the guardrail's GuardrailId attribute and
  # arn its GuardrailArn attribute; guardrail_version is the
  # GuardrailVersion's Version attribute, the version's number. A model call
  # such as Converse or InvokeModel, and ApplyGuardrail, names the guardrail
  # by its ID and the version by its number. CloudFormation resolves them
  # when it creates the resources, so a consumer in the same stack reading
  # them is created after them. The provider projects the matching provides
  # block inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides
  # is the Outputs source, and they carry the same values.
  provides:
    guardrail_id: "!GetAtt {{ .locals.logical_id }}Guardrail.GuardrailId"
    guardrail_version: "!GetAtt {{ .locals.version_id }}.Version"
    arn: "!GetAtt {{ .locals.logical_id }}Guardrail.GuardrailArn"

  # This Recipe reads from infra.overrides:
  #   KmsKeyId - string (KmsKeyArn)
  # host halts by name, as any key not listed does.
  #
  # KmsKeyId is the name the catalog's CloudFormation Recipes read for the
  # KMS key a resource is encrypted with, so a Release names a key once
  # whichever Recipe it configures; here the property is KmsKeyArn.
  #
  # KmsKeyId names the operator's symmetric KMS key as the key's ARN,
  # arn:<partition>:kms:<region>:<account>:key/ followed by the key's
  # 36-character ID: the one form the resource schema's KmsKeyArn pattern
  # admits, so a key ID, an alias or an alias's ARN halts the build. Amazon
  # Bedrock then encrypts the guardrail with that key rather than with a key
  # AWS manages, its default. The key's policy lets the identity that
  # deploys the stack use kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey
  # and kms:CreateGrant, and every consumer calling the guardrail
  # kms:Decrypt (the Amazon Bedrock User Guide's "Create a customer managed
  # key for your guardrail for additional security"). The key is the
  # operator's, named here and never created. Setting, changing or removing
  # it updates the guardrail in place (the CloudFormation reference: "No
  # interruption") and creates no new version.
  #
  # host is refused by name. A guardrail publishes no address of its own: a
  # caller reaches Amazon Bedrock's runtime endpoint in the guardrail's
  # Region, which the service names, and names the guardrail by its ID in
  # each call, so this Component publishes no host for the name to replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.blocked_input_messaging (BlockedInputMessaging),
  #     values.blocked_outputs_messaging (BlockedOutputsMessaging),
  #     values.content_policy_config (ContentPolicyConfig),
  #     values.topic_policy_config (TopicPolicyConfig),
  #     values.word_policy_config (WordPolicyConfig),
  #     values.sensitive_information_policy_config
  #     (SensitiveInformationPolicyConfig) and
  #     values.contextual_grounding_policy_config
  #     (ContextualGroundingPolicyConfig), each written in the property's
  #     spelling down every key of the subset ($names in the fragment), and
  #     the override above.
  #   refused — a KmsKeyId other than a KMS key's ARN;
  #     infra.overrides.host; and any infra.overrides key not listed above.
  #   held by the Component — the subset's keys, the keys each list's
  #     entries require, the counts, the values, the lengths and the ranges
  #     Amazon Bedrock takes, a custom pattern's lookaround, and the
  #     component's name, which names the guardrail.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the fragment writes beside the values: no Description; no tier
  # configuration, so Amazon Bedrock applies the Classic tier; no
  # CrossRegionConfig, which the Standard tier needs; no
  # AutomatedReasoningPolicyConfig; and no per-direction action, switch or
  # modality on a filter, topic, word, entity or pattern, so Amazon
  # Bedrock's own defaults for them hold. The GuardrailVersion takes no
  # Description.
  #
  # Why a version. A call names the guardrail and a version beside it; the
  # guardrail's own Version attribute is its working draft, DRAFT, which
  # changes with every update, while a numbered version is a snapshot that
  # does not (the User Guide's "Deploy your guardrail"). The
  # GuardrailVersion creates that snapshot from the draft after the
  # guardrail is created.
  #
  # A change. CloudFormation creates a version only when it creates the
  # version's resource: the GuardrailVersion takes no update, its
  # properties each requiring replacement. Its logical id therefore ends in
  # a digest of the component's values, the messages and the policies a
  # version holds. A change of any of them updates the guardrail in place
  # (the CloudFormation reference: "No interruption" for each property),
  # names a new GuardrailVersion, which CloudFormation creates after the
  # guardrail's update, so a consumer in the stack reads the new number, and
  # deletes the old version once the update completes (DeleteGuardrail with
  # a version deletes that version alone), so a caller still naming the old
  # number names a version that no longer exists. A stack importing
  # guardrail_version through the stack's exports holds it: CloudFormation
  # does not modify an exported
  # output value another stack imports (the CloudFormation User Guide's "Get
  # exported outputs from a deployed CloudFormation stack"), so such a
  # change fails the update until that import is removed.
  #
  # The name. The guardrail is named after the component, and the resources'
  # logical ids follow the name too. Renaming the component therefore
  # removes the guardrail and its version from the template and adds new
  # ones: CloudFormation creates the new guardrail and version first and then
  # deletes the old ones, so consumers read new IDs.
  #
  # Deletion. The resources keep CloudFormation's own deletion policy,
  # Delete. Deleting the guardrail deletes all of its versions
  # (DeleteGuardrail). A guardrail holds no data, so this Recipe configures
  # no backup and declares no native backup.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Bedrock guardrail publishes no address of its own: a caller reaches the Amazon Bedrock runtime endpoint in its Region and names the guardrail by guardrail_id and its version by guardrail_version: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if ne $k "KmsKeyId" -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # KmsKeyId the ARN of a KMS key, of at most 2,048 characters: the form
    # the AWS::Bedrock::Guardrail resource schema's KmsKeyArn pattern admits.
    # The override key is spelt for this target, so the check sits in this
    # Recipe and not in the realization-neutral Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (le (len $o.KmsKeyId) 2048) (regexMatch `^arn:aws(-[^:]+)?:kms:[a-zA-Z0-9-]*:[0-9]{12}:key/[a-zA-Z0-9-]{36}$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and CloudFormation's AWS::Bedrock::Guardrail takes the KMS key a guardrail is encrypted with as the key's ARN, arn:aws:kms:<region>:<account>:key/ followed by the key's 36-character ID, and no key ID or alias: set it to such an ARN in the Release, or remove it to encrypt with a key AWS manages" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema and assertions
  # hold them. Each policy is rebuilt in the property's spelling, $names
  # mapping each key of the subset to it, and written as one JSON object, the
  # developer's text inside JSON strings, so no text a developer writes is
  # read by CloudFormation as an intrinsic function.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $names := dict
        "content_policy_config" "ContentPolicyConfig"
        "topic_policy_config" "TopicPolicyConfig"
        "word_policy_config" "WordPolicyConfig"
        "sensitive_information_policy_config" "SensitiveInformationPolicyConfig"
        "contextual_grounding_policy_config" "ContextualGroundingPolicyConfig"
        "filters_config" "FiltersConfig"
        "topics_config" "TopicsConfig"
        "words_config" "WordsConfig"
        "managed_word_lists_config" "ManagedWordListsConfig"
        "pii_entities_config" "PiiEntitiesConfig"
        "regexes_config" "RegexesConfig"
        "type" "Type"
        "input_strength" "InputStrength"
        "output_strength" "OutputStrength"
        "name" "Name"
        "definition" "Definition"
        "examples" "Examples"
        "text" "Text"
        "action" "Action"
        "pattern" "Pattern"
        "description" "Description"
        "threshold" "Threshold" -}}
      {{- $policies := dict -}}
      {{- range $p := list "content_policy_config" "topic_policy_config" "word_policy_config" "sensitive_information_policy_config" "contextual_grounding_policy_config" -}}
      {{- if hasKey $.values $p -}}
      {{- $pol := dict -}}
      {{- range $l, $items := get $.values $p -}}
      {{- $out := list -}}
      {{- range $items }}{{ $e := dict }}{{ range $f, $v := . }}{{ $_ := set $e (get $names $f) $v }}{{ end }}{{ $out = append $out $e }}{{ end -}}
      {{- $_ := set $pol (get $names $l) $out -}}
      {{- end -}}
      {{- $_ := set $policies (get $names $p) $pol -}}
      {{- end -}}
      {{- end -}}
      Resources:
        {{ .locals.logical_id }}Guardrail:
          Type: AWS::Bedrock::Guardrail
          Properties:
            Name: "{{ .context.instance_id }}"
            BlockedInputMessaging: {{ toJson .values.blocked_input_messaging }}
            BlockedOutputsMessaging: {{ toJson .values.blocked_outputs_messaging }}
            {{- range $k, $v := $policies }}
            {{ $k }}: {{ toJson $v }}
            {{- end }}
            {{- with optional $o "KmsKeyId" "" }}

            ## ── Provider-specific overrides ─────────────────────────
            KmsKeyArn: {{ toJson . }}
            {{- end }}

        {{ .locals.version_id }}:
          Type: AWS::Bedrock::GuardrailVersion
          Properties:
            GuardrailIdentifier: !GetAtt {{ .locals.logical_id }}Guardrail.GuardrailId

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # guardrails in one stack keep their identities apart. A cross-stack
      # consumer imports an entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        guardrail_id: !GetAtt {{ .locals.logical_id }}Guardrail.GuardrailId
        guardrail_version: !GetAtt {{ .locals.version_id }}.Version
        arn: !GetAtt {{ .locals.logical_id }}Guardrail.GuardrailArn
