apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: s3-object-store-amazon-s3
  version: 1.0.0
  description: >
    An S3-compatible object store on Amazon S3, rendered as a CloudFormation
    fragment: one AWS::S3::Bucket, a general purpose bucket in the account and
    Region the stack is deployed to, and an AWS::S3::BucketPolicy beside it
    where infra.overrides.policy supplies one. The cloudformation provider
    stamps the stack envelope and projects this Recipe's provides into the
    stack Outputs.

    Reach for it where a consumer speaks the S3 API to a bucket in a
    CloudFormation stack; for terraform/s3-object-store-amazon-s3 through
    Terraform; for terraform/s3-object-store-gcs on Google Cloud; and for
    helm/s3-object-store or compose/s3-object-store where the Release runs the
    store itself, on SeaweedFS, in a cluster or on a Compose host.

    Every public access is blocked: all four S3 Block Public Access settings
    are on and ACLs are disabled, and no key a Release sets changes either, so
    S3 rejects a public ACL or a public bucket policy. S3 takes no key from a
    bucket: each consumer brings the access key of an IAM principal, created
    outside the build, on its own connection, and an attachment on
    access_key_id or secret_access_key halts naming the slot. The fragment
    declares no IAM resource.

    infra.region is required, and a template rule stops the stack unless it
    is deployed to that Region. It publishes the bucket and the Region as
    references, the Regional endpoint https://s3.<region> under the
    partition's domain suffix, its host, port 443 and protocol s3. A bucket
    name S3 does not take halts naming values.bucket.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: cloudformation
  implements: core/storage/s3-object-store:1.0.0

  # The resource's logical id, derived from this instance's own name so that two
  # buckets deployed into one stack describe two resources rather than one. A
  # logical id is unique within a CloudFormation template and admits only
  # letters and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance order-archive names the
  # bucket OrderArchive, its policy OrderArchivePolicy and its Region rule
  # OrderArchiveRegion.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'
    # The Region the stack must be deployed to, infra.region as written.
    region: '{{ toString (optional .infra "region" "") }}'

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this bucket, and resolves none of
  # them. bucket is a reference to the bucket, whose Ref is the bucket's name —
  # values.bucket as written, since the fragment sets BucketName — and which
  # CloudFormation resolves when it creates the bucket, so a consumer in the
  # same stack is created after it. region is the AWS::Region pseudo parameter,
  # the Region the stack is deployed to, which the rule below holds to
  # infra.region. endpoint is an Fn::Sub joining https://s3. to that Region and
  # the AWS::URLSuffix pseudo parameter, the domain suffix of the stack's
  # partition, such as amazonaws.com or amazonaws.com.cn: the Regional endpoint,
  # reached over TLS on port 443, where a client addresses the bucket by path,
  # which S3 serves in every Region. host is the same address without the
  # scheme. The provider projects the matching provides block inside the
  # fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same values.
  provides:
    bucket: "!Ref {{ .locals.logical_id }}"
    region: "!Ref AWS::Region"
    endpoint: "!Sub https://s3.${AWS::Region}.${AWS::URLSuffix}"
    host: "!Sub s3.${AWS::Region}.${AWS::URLSuffix}"
    port: "443"
    protocol: "s3"

  # This Recipe reads from infra.overrides:
  #   policy - object (the BucketPolicy's Properties.PolicyDocument), the bucket policy document
  #
  # It is the key terraform/s3-object-store-amazon-s3 reads for the same
  # document, under the name the module input there takes. It is the operator's
  # own policy, written as a mapping — the JSON policy document in YAML or JSON
  # form — and written into an AWS::S3::BucketPolicy on this bucket; this
  # Recipe adds no statement of its own, so the bucket's ARN is written out in
  # it, arn:aws:s3:::<bucket>. The policy references the bucket, so
  # CloudFormation puts it after the bucket and its Block Public Access
  # settings exist, and S3 rejects a policy that grants public access;
  # RestrictPublicBuckets blocks the cross-account access a public policy
  # would grant. Any other key under infra.overrides halts the build naming it.
  #
  # The fragment sets no DeletionPolicy, so the bucket takes CloudFormation's
  # default for the resource, and it writes no versioning and no encryption
  # configuration of its own. BucketName is set, so CloudFormation cannot
  # replace the bucket on an update that would need a new one.
  #
  # Every Component value and infra key is honoured or refused by name:
  #   honoured — values.bucket, as BucketName, exactly as written;
  #     infra.region, by the template rule; and infra.overrides.policy.
  #   refused — a bucket name S3 does not take; infra.region unset, or not a
  #     Region code of the aws, aws-cn, aws-us-gov or aws-eusc partition;
  #     infra.overrides.policy that is not a mapping; any other
  #     infra.overrides key; and an attachment on either key slot, as set out
  #     below.
  #
  # The Region. A stack creates its resources in the Region it is deployed to,
  # and a template cannot place a bucket elsewhere. So infra.region is held by
  # a rule in the template's Rules section, which CloudFormation evaluates
  # before it creates anything: the rule asserts that AWS::Region equals
  # infra.region, and a stack deployed to another Region is refused with the
  # rule's description. The provider carries a fragment's Rules section into
  # the assembled stack under the name written.
  #
  # The key slots. S3 authenticates a request by the access key of an IAM
  # principal — an IAM user, or a role's temporary credentials — and a bucket
  # takes none. So nothing this Recipe could be given in access_key_id or
  # secret_access_key would be read, and an attachment on either halts the
  # build naming the slot, rather than leaving the Release believing the bucket
  # holds that key. Create the principal and its access key outside the build,
  # allow it the bucket in an IAM policy or in infra.overrides.policy, and
  # attach the key to each consumer's own connection; the consumer presents it
  # there, with the endpoint and Region this Recipe publishes. No credential
  # reaches a rendered file.
  assertions:
    key_slots_unattached: >-
      {{- $f := default dict .features -}}
      {{- range $slot := list "access_key_id" "secret_access_key" -}}
      {{- if hasKey $f $slot -}}
      {{- fail (printf "a credential is attached to the %s slot, and Amazon S3 takes no key from a bucket: it authenticates each request by the access key of an IAM principal, and each consumer presents that key on its own connection. Remove the attachment, create the IAM principal and its access key outside the build, allow it the bucket, and attach the key to each consumer's connection instead" $slot) -}}
      {{- end -}}
      {{- end -}}
    # The Region codes of the four partitions S3 serves, by the patterns the
    # AWS SDKs publish for them: the standard Regions, AWS GovCloud (US) (us-gov-),
    # China (cn-) and the European Sovereign Cloud (eusc-de-).
    region_is_a_region: >-
      {{- $r := .locals.region -}}
      {{- if not $r -}}
      {{- fail "this Recipe holds the stack to the AWS Region infra.region names, because a stack creates its bucket in the Region it is deployed to, but infra.region carries none: set infra.region in the Release to the Region code the stack is deployed to, such as eu-west-1" -}}
      {{- end -}}
      {{- if not (regexMatch `^((us|eu|ap|sa|ca|me|af|il|mx|cn)-[a-z]+|us-gov-[a-z]+|eusc-de-[a-z]+)-[0-9]+$` $r) -}}
      {{- fail (printf "infra.region is %q, and this Recipe holds the stack to a Region of the aws, aws-cn, aws-us-gov or aws-eusc partition, named by its Region code, such as eu-west-1, cn-north-1, us-gov-west-1 or eusc-de-east-1: set infra.region in the Release to one" $r) -}}
      {{- end -}}
    # The general purpose bucket naming rules of the Amazon S3 User Guide. A
    # name ending -an is taken only in an account's regional namespace, which
    # this Recipe does not create buckets in.
    bucket_name_s3_takes: >-
      {{- $b := toString .values.bucket -}}
      {{- $rule := "" -}}
      {{- if not (regexMatch `^[a-z0-9.-]*$` $b) -}}
      {{- $rule = "S3 takes lowercase letters, numbers, periods and hyphens alone in a bucket name" -}}
      {{- else if or (lt (len $b) 3) (gt (len $b) 63) -}}
      {{- $rule = "S3 takes a bucket name of 3 to 63 characters" -}}
      {{- else if not (regexMatch `^[a-z0-9].*[a-z0-9]$` $b) -}}
      {{- $rule = "S3 takes a bucket name only where it begins and ends with a letter or a number" -}}
      {{- else if contains ".." $b -}}
      {{- $rule = "S3 takes no bucket name holding two adjacent periods" -}}
      {{- else if regexMatch `^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$` $b -}}
      {{- $rule = "S3 takes no bucket name in the form of an IP address" -}}
      {{- else if regexMatch `^(xn--|sthree-|amzn-s3-demo-)` $b -}}
      {{- $rule = "S3 takes no bucket name beginning with xn--, sthree- or amzn-s3-demo-" -}}
      {{- else if regexMatch `(-s3alias|--ol-s3|\.mrap|--x-s3|--table-s3)$` $b -}}
      {{- $rule = "S3 reserves the suffixes -s3alias, --ol-s3, .mrap, --x-s3 and --table-s3 for other kinds of resource" -}}
      {{- else if hasSuffix "-an" $b -}}
      {{- $rule = "S3 takes a bucket name ending -an only in an account's regional namespace, which this Recipe does not create buckets in" -}}
      {{- end -}}
      {{- if $rule -}}
      {{- fail (printf "values.bucket is %q, and %s: set values.bucket in the Aggregate to another name" $b $rule) -}}
      {{- end -}}
    overrides_this_recipe_reads: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k, $v := $o -}}
      {{- if ne $k "policy" -}}
      {{- fail (printf "infra.overrides.%s is not a setting this Recipe reads: it reads policy alone from infra.overrides, keeps every S3 Block Public Access setting on and ACLs disabled, and declares no IAM resource; remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "policy" -}}
      {{- if not (and (kindIs "map" $o.policy) $o.policy) -}}
      {{- fail (printf "infra.overrides.policy is %v, and it is the bucket policy document, written as a mapping with its Version and Statement keys: set infra.overrides.policy in the Release to the policy document as a mapping, or remove it" $o.policy) -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $policy := optional (optional .infra "overrides" dict) "policy" dict }}
      Rules:
        {{ .locals.logical_id }}Region:
          Assertions:
            - Assert:
                Fn::Equals:
                  - !Ref AWS::Region
                  - "{{ .locals.region }}"
              AssertDescription: "The bucket {{ .values.bucket }} is placed in {{ .locals.region }}: deploy this stack to {{ .locals.region }}, or set infra.region in the Release to the Region it is deployed to"
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::S3::Bucket
          Properties:
            BucketName: "{{ .values.bucket }}"
            PublicAccessBlockConfiguration:
              BlockPublicAcls: true
              BlockPublicPolicy: true
              IgnorePublicAcls: true
              RestrictPublicBuckets: true
            OwnershipControls:
              Rules:
                - ObjectOwnership: BucketOwnerEnforced
        {{- if $policy }}
        {{ .locals.logical_id }}Policy:
          Type: AWS::S3::BucketPolicy
          Properties:
            Bucket: !Ref {{ .locals.logical_id }}
            PolicyDocument: {{ toJson $policy }}
        {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two buckets
      # in one stack keep their connection identities apart. A cross-stack
      # consumer imports these entries; an intra-stack consumer receives them
      # through the value-pipe above.
      provides:
        bucket: !Ref {{ .locals.logical_id }}
        region: !Ref AWS::Region
        endpoint: !Sub "https://s3.${AWS::Region}.${AWS::URLSuffix}"
        host: !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"
        port: "443"
        protocol: s3
