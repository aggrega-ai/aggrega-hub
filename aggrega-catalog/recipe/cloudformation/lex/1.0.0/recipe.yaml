apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: lex
  version: 1.0.0
  description: >
    Amazon Lex on CloudFormation: one AWS::Lex::Bot named after the
    component, holding the locales, intents, slots and slot types its values
    declare, running as the IAM role RoleArn names; an AWS::Lex::BotVersion,
    a numbered snapshot of the bot that Lex builds from it; and an
    AWS::Lex::BotAlias named after the component and pointing to that
    version, which the cloudformation provider assembles into the
    boundary's stack. agent_id, bot_alias_id and arn publish CloudFormation
    references to the bot's ID, the alias's ID and the bot's ARN.

    Each locale also holds the intent FallbackIntent, built on
    AMAZON.FallbackIntent, as CloudFormation requires; an intent's slots are
    elicited in the order listed. A change of the locales, the role, the
    session time or child_directed updates the bot in place and creates a
    new version, to which the alias moves, then deletes the old one;
    renaming the component replaces the bot. No role is created.

    A RoleArn not set or other than a role's ARN halts the build, as do an
    intent named FallbackIntent, infra.overrides.host and any
    infra.overrides key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/ai-agent/lex:1.0.0

  # The resources' logical ids, derived from this instance's own name so that
  # two bots deployed into one stack describe distinct resources. A logical
  # id is unique within a CloudFormation template and admits only letters
  # and digits, so the instance name's separators are read as word
  # boundaries and each word is capitalised: instance order-bot names the
  # resources OrderBotBot, OrderBotBotAlias and OrderBotBotVersion followed
  # by a digest.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes these strings verbatim into a
  # consumer's injection context when it uses this bot, and resolves none of
  # them. agent_id is the bot's Id attribute and arn its Arn attribute;
  # bot_alias_id is the alias's BotAliasId attribute (the CloudFormation
  # reference for AWS::Lex::Bot and AWS::Lex::BotAlias). A call to Amazon
  # Lex's runtime API, such as RecognizeText, names the bot and the alias by
  # these two IDs. CloudFormation resolves them when it creates the
  # resources, so a consumer in the same stack reading them is created after
  # them. The provider projects the matching provides block inside the
  # fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the
  # Outputs source, and they carry the same values.
  provides:
    agent_id: "!GetAtt {{ .locals.logical_id }}Bot.Id"
    bot_alias_id: "!GetAtt {{ .locals.logical_id }}BotAlias.BotAliasId"
    arn: "!GetAtt {{ .locals.logical_id }}Bot.Arn"

  # This Recipe reads from infra.overrides:
  #   RoleArn - string, required (RoleArn)
  # host halts by name, as any key not listed does.
  #
  # RoleArn is the name the catalog's CloudFormation Recipes read for the IAM
  # role a service assumes, so a Release names it once whichever Recipe it
  # configures; it is also the property's own name on AWS::Lex::Bot.
  #
  # RoleArn names the IAM role Amazon Lex uses to build and run the bot, as
  # the ARN of a role, arn:<partition>:iam::<account>:role/ followed by its
  # path and name, of 32 to 2,048 characters (the API Reference's CreateBot),
  # and is required: the resource schema requires RoleArn. The role, with a
  # trust policy letting lexv2.amazonaws.com assume it and the permissions
  # the bot needs, such as polly:SynthesizeSpeech for a spoken answer, is the
  # operator's, named here and never created. Changing it updates the bot in
  # place (the CloudFormation reference: "No interruption") and creates a new
  # version, as below.
  #
  # host is refused by name. A bot publishes no address of its own: a caller
  # reaches Amazon Lex's runtime endpoint in the bot's Region, which the
  # service names, and names the bot and the alias by their IDs in each
  # call, so this Component publishes no host for the name to replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions or schema, or not read:
  #   honoured — values.child_directed (DataPrivacy.ChildDirected),
  #     values.idle_session_ttl_in_seconds (IdleSessionTTLInSeconds),
  #     values.bot_locales (BotLocales, in the property's spelling: locale_id
  #     as LocaleId, nlu_confidence_threshold as NluConfidenceThreshold, and
  #     so on down every key of the subset), and the overrides above.
  #   refused — a RoleArn not set or other than a role's ARN; an intent named
  #     FallbackIntent; infra.overrides.host; and any infra.overrides key not
  #     listed above.
  #   held by the Component — the session time's range; at least one locale;
  #     the subset's keys, each level's required keys, its names, its ranges
  #     and its values, one locale per locale_id and one intent, slot and
  #     slot type per name; a slot's type naming a slot type of its locale or
  #     a built-in one; and the component's name, which names the bot and the
  #     alias, to the names Lex takes.
  #   not read — none; the Component declares no other value or infra key.
  #
  # What the fragment writes beside the values. The CloudFormation reference
  # for AWS::Lex::Bot: "You must configure an intent based on the
  # AMAZON.FallbackIntent built-in intent. If you don't add one, creating the
  # bot will fail." Each locale therefore also holds the intent
  # FallbackIntent, whose ParentIntentSignature is AMAZON.FallbackIntent: the
  # intent Lex itself adds to a locale created through its API (the Amazon
  # Lex V2 Developer Guide's "AMAZON.FallbackIntent"), named as the
  # reference's examples name it. An intent of the developer's under the
  # same name would make two intents of one name in a locale, which Lex
  # refuses (CreateIntent: "Intent names must be unique in the locale"), so
  # it halts the build. Lex refuses to build a locale whose intent holds a
  # slot without a priority (the failure it reports, as the AWS Terraform
  # provider's issue 39948 records it: "Slot ids [...] in intent ... don't
  # define a slot priority"), so each intent holding slots
  # also takes SlotPriorities, the first slot listed at priority 1 and each
  # next one a step after it: Lex prompts for slot values in priority order
  # (the CloudFormation reference's SlotPriority). Every other property of
  # the bot is left out, so Lex's defaults hold: no code hook, context,
  # confirmation, closing, generative AI or speech setting; BotType Bot;
  # AutoBuildBotLocales unset; no TestBotAliasSettings, BotTags,
  # ErrorLogSettings or Replication. The alias takes no
  # BotAliasLocaleSettings, so no Lambda code hook runs, and no conversation
  # logs or sentiment analysis.
  #
  # Why a version and an alias. A runtime call names an alias beside the bot
  # (RecognizeText's botAliasId), and the Amazon Lex V2 Developer Guide's
  # "Versioning and aliases with your Lex V2 bot" says the alias Lex creates
  # with every bot, TestBotAlias, runs the Draft and "should only be used for
  # manual testing", Lex limiting its runtime requests, and recommends a
  # version and an alias pointing to it for a client application. The
  # BotVersion snapshots the bot's Draft into a numbered version, taking
  # every locale from DRAFT; a locale not yet built is built first (the
  # CloudFormation reference's example for AWS::Lex::Bot: "Locale builds are
  # also kicked off if you attempt to create a bot version that depends on
  # an unbuilt locale"), and a locale Lex cannot build fails the stack
  # operation. The alias, named after the component, points to the version.
  #
  # A change. A version is a snapshot that never changes, and CloudFormation
  # creates a version only when it creates the version's resource. The
  # BotVersion's logical id therefore ends in a digest of what a version
  # holds of the bot: the locales as written to BotLocales, the role,
  # IdleSessionTTLInSeconds and ChildDirected, each of which DescribeBotVersion
  # returns for a version. A change of any of them updates the bot in place
  # (the CloudFormation reference: "No interruption" for each), names a new
  # BotVersion, which CloudFormation creates after the bot's update, moves
  # the alias to it in place ("No interruption" for its BotVersion), and
  # deletes the old version once the update completes. Lex then runs
  # in-progress sessions on the version they started on and new sessions on
  # the new one (the Developer Guide's same page); what happens to a session
  # still running on the old version when it is deleted is not documented
  # and not verified. Lex creates no new version when the Draft has not
  # changed since the last one (the CloudFormation reference for
  # AWS::Lex::BotVersion), so a digest that changes while the Draft does not,
  # as when the locales are written in another order alone, is a case whose
  # outcome is not verified.
  #
  # The name. The bot and the alias are named after the component, and the
  # resources' logical ids follow the name too. Renaming the component
  # therefore removes the bot, its version and its alias from the template
  # and adds new ones: CloudFormation creates the new bot first and then
  # deletes the old one, with its versions and aliases (the CloudFormation
  # User Guide's stack status UPDATE_COMPLETE_CLEANUP_IN_PROGRESS; the API
  # Reference's DeleteBot), so consumers read new IDs. A bot name is unique
  # in the account (CreateBot), so two Releases deploying a component of one
  # name into one account and Region collide.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Lex bot publishes no address of its own: a caller reaches the Amazon Lex runtime endpoint in its Region and names the bot by agent_id and its alias by bot_alias_id: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if ne $k "RoleArn" -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads RoleArn from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The role a bot runs as is the operator's, and the resource schema
    # requires it.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "RoleArn") -}}
      {{- fail "infra.overrides.RoleArn is not set, and an Amazon Lex bot is built and runs as the IAM role the operator names by its ARN: set infra.overrides.RoleArn in the Release, such as arn:aws:iam::123456789012:role/example-lex-role" -}}
      {{- end -}}
    # RoleArn the ARN of a role, of 32 to 2,048 characters (CreateBot's
    # roleArn). The same check stands in terraform/lex, over its own key: the
    # override keys are spelt differently per target, so the check cannot sit
    # in the realization-neutral Component, and a MappingLibrary imports a
    # whole valuesMapping, not an assertion.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "RoleArn" -}}
      {{- if not (and (typeIs "string" $o.RoleArn) (ge (len $o.RoleArn) 32) (le (len $o.RoleArn) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$` $o.RoleArn)) -}}
      {{- fail (printf "infra.overrides.RoleArn is %s, and Amazon Lex takes the IAM role a bot runs as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 32 to 2048 characters: set it to such an ARN in the Release" (toJson $o.RoleArn)) -}}
      {{- end -}}
      {{- end -}}
    # The fragment writes the intent FallbackIntent into every locale, and
    # Lex takes each intent name once in a locale (the header above).
    bot_locales: >-
      {{- range $i, $l := .values.bot_locales -}}
      {{- range $in := (get $l "intents" | default list) -}}
      {{- if eq $in.name "FallbackIntent" -}}
      {{- fail (printf "values.bot_locales[%d] declares an intent named FallbackIntent, and on CloudFormation this Recipe writes the intent FallbackIntent, built on AMAZON.FallbackIntent, into every locale, while Amazon Lex takes each intent name once in a locale: rename the intent in the Aggregate" $i) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}

  # The values reach the fragment as the Component's schema and assertions
  # hold them: a whole number of seconds from 60 to 86,400, a boolean, and
  # locales in the subset, every key in its place. The locales are rebuilt in
  # the property's spelling and written as one JSON object per locale, the
  # developer's text inside JSON strings, so no text a developer writes is
  # read by CloudFormation as an intrinsic function.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- $locales := list -}}
      {{- range $l := .values.bot_locales -}}
      {{- $intents := list -}}
      {{- range $in := (get $l "intents" | default list) -}}
      {{- $i := dict "Name" $in.name -}}
      {{- with get $in "sample_utterances" -}}
      {{- $us := list -}}
      {{- range . }}{{ $us = append $us (dict "Utterance" .utterance) }}{{ end -}}
      {{- $_ := set $i "SampleUtterances" $us -}}
      {{- end -}}
      {{- with get $in "slots" -}}
      {{- $ss := list }}{{ $pr := list -}}
      {{- range $n, $s := . -}}
      {{- $e := dict "SlotConstraint" $s.value_elicitation_setting.slot_constraint -}}
      {{- with get $s.value_elicitation_setting "prompt_specification" -}}
      {{- $gs := list -}}
      {{- range .message_groups_list }}{{ $gs = append $gs (dict "Message" (dict "PlainTextMessage" (dict "Value" .message.plain_text_message.value))) }}{{ end -}}
      {{- $_ := set $e "PromptSpecification" (dict "MessageGroupsList" $gs "MaxRetries" .max_retries) -}}
      {{- end -}}
      {{- $ss = append $ss (dict "Name" $s.name "SlotTypeName" $s.slot_type_name "ValueElicitationSetting" $e) -}}
      {{- $pr = append $pr (dict "Priority" (add $n 1) "SlotName" $s.name) -}}
      {{- end -}}
      {{- $_ := set $i "Slots" $ss }}{{ $_ := set $i "SlotPriorities" $pr -}}
      {{- end -}}
      {{- $intents = append $intents $i -}}
      {{- end -}}
      {{- $intents = append $intents (dict "Name" "FallbackIntent" "ParentIntentSignature" "AMAZON.FallbackIntent") -}}
      {{- $loc := dict "LocaleId" $l.locale_id "NluConfidenceThreshold" $l.nlu_confidence_threshold "Intents" $intents -}}
      {{- with get $l "slot_types" -}}
      {{- $sts := list -}}
      {{- range $st := . -}}
      {{- $t := dict "Name" $st.name -}}
      {{- with get $st "slot_type_values" -}}
      {{- $vs := list -}}
      {{- range . -}}
      {{- $v := dict "SampleValue" (dict "Value" .sample_value.value) -}}
      {{- with get . "synonyms" }}{{ $sy := list }}{{ range . }}{{ $sy = append $sy (dict "Value" .value) }}{{ end }}{{ $_ := set $v "Synonyms" $sy }}{{ end -}}
      {{- $vs = append $vs $v -}}
      {{- end -}}
      {{- $_ := set $t "SlotTypeValues" $vs -}}
      {{- end -}}
      {{- with get $st "value_selection_setting" }}{{ $_ := set $t "ValueSelectionSetting" (dict "ResolutionStrategy" .resolution_strategy) }}{{ end -}}
      {{- $sts = append $sts $t -}}
      {{- end -}}
      {{- $_ := set $loc "SlotTypes" $sts -}}
      {{- end -}}
      {{- $locales = append $locales $loc -}}
      {{- end -}}
      {{- $version := printf "%sBotVersion%s" .locals.logical_id (trunc 12 (sha256sum (toJson (list $locales $o.RoleArn .values.idle_session_ttl_in_seconds .values.child_directed)))) -}}
      Resources:
        {{ .locals.logical_id }}Bot:
          Type: AWS::Lex::Bot
          Properties:
            Name: {{ toJson .context.instance_id }}
            DataPrivacy:
              ChildDirected: {{ toJson .values.child_directed }}
            IdleSessionTTLInSeconds: {{ toJson .values.idle_session_ttl_in_seconds }}
            BotLocales:
            {{- range $locales }}
              - {{ toJson . }}
            {{- end }}

            ## ── Provider-specific overrides ─────────────────────────
            RoleArn: {{ toJson $o.RoleArn }}

        {{ $version }}:
          Type: AWS::Lex::BotVersion
          Properties:
            BotId: !GetAtt {{ .locals.logical_id }}Bot.Id
            BotVersionLocaleSpecification:
            {{- range $locales }}
              - LocaleId: {{ toJson .LocaleId }}
                BotVersionLocaleDetails:
                  SourceBotVersion: DRAFT
            {{- end }}

        {{ .locals.logical_id }}BotAlias:
          Type: AWS::Lex::BotAlias
          Properties:
            BotAliasName: {{ toJson .context.instance_id }}
            BotId: !GetAtt {{ .locals.logical_id }}Bot.Id
            BotVersion: !GetAtt {{ $version }}.BotVersion

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two bots
      # in one stack keep their identities apart. A cross-stack consumer
      # imports an entry; an intra-stack consumer receives it through the
      # value-pipe above.
      provides:
        agent_id: !GetAtt {{ .locals.logical_id }}Bot.Id
        bot_alias_id: !GetAtt {{ .locals.logical_id }}BotAlias.BotAliasId
        arn: !GetAtt {{ .locals.logical_id }}Bot.Arn
