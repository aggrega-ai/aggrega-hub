apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bedrock-knowledge-bases
  version: 1.0.0
  description: >
    Amazon Bedrock Knowledge Bases on CloudFormation: one
    AWS::Bedrock::KnowledgeBase of type VECTOR named after the component,
    embedding with the model EmbeddingModelArn names into the vector store
    StorageConfiguration describes, as the IAM role RoleArn names, which the
    cloudformation provider assembles into the boundary's stack. Where
    BucketARN names an S3 bucket, an AWS::Bedrock::DataSource over it, under
    InclusionPrefixes, is created too; its documents reach the store when
    the operator starts a sync. host and endpoint publish the Bedrock agent
    runtime endpoint in the stack's Region, and knowledge_base_id and arn
    publish references CloudFormation resolves when it creates the stack.

    The store, the model, the role and the bucket are the operator's: none
    is created, nor any key, policy or index. Deleting the stack, or
    removing the knowledge base from it, deletes the data source, with the
    embeddings it wrote into the store, and then the knowledge base; the
    store, its index and the bucket stay.

    A RoleArn, EmbeddingModelArn or StorageConfiguration missing or of
    another form halts the build, as do a store CloudFormation does not
    describe, an Amazon Neptune Analytics store with a bucket, a BucketARN
    or InclusionPrefixes of another form, infra.overrides.host, since the
    endpoint answers under the service's name alone, and any infra.overrides
    key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/datastore/bedrock-knowledge-bases:1.0.0

  # The resources' logical ids, derived from this instance's own name so that
  # two knowledge bases deployed into one stack describe two pairs of
  # resources rather than one. A logical id is unique within a CloudFormation
  # template and admits only letters and digits, so the instance name's
  # separators are read as word boundaries and each word is capitalised:
  # instance product-docs names the resources ProductDocsKnowledgeBase and
  # ProductDocsDataSource.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes each of these strings verbatim into a
  # consumer's injection context when it uses this knowledge base, and
  # resolves none of them. host is an Fn::Sub joining bedrock-agent-runtime.
  # to the AWS::Region pseudo parameter, the Region the stack is deployed to
  # and so the knowledge base's, and the AWS::URLSuffix pseudo parameter, the
  # domain suffix of the stack's partition, such as amazonaws.com: the
  # endpoint where Retrieve and RetrieveAndGenerate are called, reached over
  # HTTPS on port 443. endpoint is the same address after https://.
  # knowledge_base_id is the resource's KnowledgeBaseId attribute and arn its
  # KnowledgeBaseArn attribute, references CloudFormation resolves when it
  # creates the knowledge base, so a consumer in the same stack reading
  # either is created after it. The provider projects the matching provides
  # block inside the fragment below into the assembled stack Outputs; this
  # recipe-level provides is the value-pipe contract, the fragment provides
  # is the Outputs source, and they carry the same values.
  #
  # host is the service's own name. The endpoint offers no custom domain, so
  # every name it answers under is one of the service's own and none is the
  # operator's choice; infra.overrides.host is refused by the assertion below
  # rather than published.
  provides:
    host: "!Sub bedrock-agent-runtime.${AWS::Region}.${AWS::URLSuffix}"
    port: "443"
    endpoint: "!Sub https://bedrock-agent-runtime.${AWS::Region}.${AWS::URLSuffix}"
    knowledge_base_id: "!GetAtt {{ .locals.logical_id }}KnowledgeBase.KnowledgeBaseId"
    arn: "!GetAtt {{ .locals.logical_id }}KnowledgeBase.KnowledgeBaseArn"

  # This Recipe reads from infra.overrides:
  #   RoleArn              - string, required (RoleArn)
  #   EmbeddingModelArn    - string, required
  #                          (KnowledgeBaseConfiguration.VectorKnowledgeBaseConfiguration.EmbeddingModelArn)
  #   StorageConfiguration - object, required (StorageConfiguration)
  #   BucketARN            - string (the data source's DataSourceConfiguration.S3Configuration.BucketArn;
  #                          unset, no data source)
  #   InclusionPrefixes    - list of one string, with BucketARN
  #                          (DataSourceConfiguration.S3Configuration.InclusionPrefixes)
  # host halts by name, as any key not listed does.
  #
  # EmbeddingModelArn, StorageConfiguration and InclusionPrefixes are the
  # resource's own property names, which is what a reader matches against
  # the resource documentation. RoleArn is the name the catalog's
  # CloudFormation Recipes read for the IAM role a service assumes, and
  # BucketARN the name they read for the S3 bucket a service writes to or
  # reads from, whatever the resource calls the field, so a Release names a
  # role or a bucket the same way whichever Recipe it configures; here the
  # bucket's field is BucketArn.
  #
  # RoleArn names the IAM role Amazon Bedrock assumes for the knowledge base,
  # as the ARN of the role, arn:aws:iam::<account>:role/ followed by its path
  # and name, 2,048 characters at most (CreateKnowledgeBase); the path and
  # the name take what the IAM API Reference's CreateRole gives Path, a slash
  # alone or printable ASCII between slashes, and RoleName, 1 to 64 letters,
  # digits and +=,.@_-. The role is the operator's, named here and never
  # created. It lets bedrock.amazonaws.com assume it, and allows
  # bedrock:InvokeModel on the embedding model, access to the vector store,
  # and, with a bucket, s3:ListBucket and s3:GetObject on it (the Amazon
  # Bedrock User Guide's "Create a service role for Amazon Bedrock Knowledge
  # Bases"). A value of another form, or none, halts the build.
  #
  # EmbeddingModelArn names the model that turns each chunk into an
  # embedding, as the model's ARN, such as
  # arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0:
  # 20 to 2,048 characters, of the form the resource schema's pattern gives.
  # Its embeddings' dimensions are the store's index's, which the operator
  # sets up for that model. A value of another form, or none, halts the
  # build.
  #
  # StorageConfiguration describes the operator's vector store, as the
  # resource takes it: Type, one of OPENSEARCH_SERVERLESS,
  # OPENSEARCH_MANAGED_CLUSTER, PINECONE, RDS, NEPTUNE_ANALYTICS, S3_VECTORS
  # and MONGO_DB_ATLAS, and the one object of that store's own, such as
  # OpensearchServerlessConfiguration, holding the fields the
  # AWS::Bedrock::KnowledgeBase resource schema requires of it and no other,
  # each a string of the form the schema gives it, and its FieldMapping, the
  # names of the fields or columns Amazon Bedrock writes the vectors, the
  # text and its metadata to. An S3_VECTORS store names its index by
  # IndexArn, or by VectorBucketArn and IndexName together, never both
  # (the User Guide's "Prerequisites for using a vector store you created
  # for a knowledge base"), and IndexArn begins with VectorBucketArn where
  # both are given. The store, its index and the secret holding a
  # third-party store's credentials are the operator's, set up as that
  # guide describes, and never created. The object is written as it is
  # given. Redis Enterprise Cloud, which the Amazon Bedrock API takes, is
  # refused: the resource schema's StorageConfiguration does not describe
  # it, so CloudFormation cannot create a knowledge base over it.
  #
  # BucketARN names the S3 bucket holding the documents, as the ARN of the
  # bucket, arn:aws:s3::: followed by its name: the form the resource
  # schema's BucketArn pattern admits, 3 to 63 lowercase letters, digits,
  # periods and hyphens, opening and closing with a letter or a digit. The
  # bucket is the operator's, named here and never created. Set, an
  # AWS::Bedrock::DataSource named after the component reads it; unset, the
  # knowledge base is created with no data source. A value of another form
  # halts the build.
  #
  # InclusionPrefixes limits the data source to the objects under one
  # prefix, as a list holding that prefix: the resource schema takes one
  # prefix of 1 to 300 characters. Unset, every object of the bucket is
  # read. It halts the build without BucketARN, and as a list of more or
  # fewer prefixes, or a prefix of another length.
  #
  # An Amazon Neptune Analytics store with BucketARN is refused: Amazon
  # Bedrock builds a Neptune Analytics graph during ingestion with a
  # foundation model the data source names for graph construction (the User
  # Guide's "Build a knowledge base with Amazon Neptune Analytics graphs"),
  # and no key here carries that model. A Neptune Analytics store with no
  # bucket is admitted.
  #
  # host is refused by name. The knowledge base answers at the Bedrock agent
  # runtime endpoint of its Region, which offers no custom domain, so no
  # name of the operator's can stand for it.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does. KmsKeyId is not read either, and
  # halts the same way: the fragment writes no
  # ServerSideEncryptionConfiguration on the data source, so Amazon Bedrock
  # encrypts the data it holds while ingesting with a key AWS owns, and the
  # store keeps the embeddings under its own encryption.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the overrides above.
  #   refused — a RoleArn, EmbeddingModelArn or StorageConfiguration not set
  #     or of another form; a store type the resource does not describe, an
  #     object of another store, a field the store does not take or one it
  #     requires left out, a field of another form, an S3 Vectors index named
  #     both ways or neither; a Neptune Analytics store with BucketARN; a
  #     BucketARN of another form; InclusionPrefixes without BucketARN, of
  #     another count or of another length; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the
  #     knowledge base and the data source.
  #   not read — none; the Component declares no value and no other infra
  #     key.
  #
  # What the fragment writes beside the name, the role, the model and the
  # store: KnowledgeBaseConfiguration Type VECTOR, a knowledge base over a
  # store of the operator's; no Description; no EmbeddingModelConfiguration,
  # so the model's own default dimensions and float32 embeddings hold, which
  # the store's index takes; no SupplementalDataStorageConfiguration, so no
  # images are extracted from the documents. On the data source: Type S3, the
  # bucket and the prefix; DataDeletionPolicy DELETE, written so that
  # removing the data source removes the embeddings it wrote into the store
  # (CreateDataSource); no VectorIngestionConfiguration, so Amazon Bedrock's
  # default chunking and parsing hold; no BucketOwnerAccountId, which names
  # the owner of a bucket in another account.
  #
  # Changes. RoleArn, BucketARN and InclusionPrefixes change in place, except
  # that removing BucketARN deletes the data source, with the embeddings it
  # wrote into the store, as the paragraph on deletion says.
  # EmbeddingModelArn and StorageConfiguration are create-only on the
  # resource, so a changed one makes CloudFormation create a replacement
  # knowledge base under the same name, with a new ID and a new data source,
  # and then delete the old pair; Amazon Bedrock's documentation does not
  # say whether it admits two knowledge bases of one name meanwhile. The
  # new data source starts empty until the operator syncs it. Renaming the
  # component renames the logical ids, so CloudFormation creates a new pair
  # under the new name and deletes the old one.
  #
  # Deletion. The resources keep CloudFormation's own deletion policy,
  # Delete. The data source depends on the knowledge base, so CloudFormation
  # deletes it first; under DataDeletionPolicy DELETE Amazon Bedrock removes
  # the embeddings it wrote from the store, and a store it cannot reach
  # leaves the data source in DELETE_UNSUCCESSFUL, which fails the stack
  # operation (the User Guide's "Delete a data source from your Amazon
  # Bedrock knowledge base"). The store, its index and the bucket are the
  # operator's and stay.
  #
  # Backup. A knowledge base keeps no documents or embeddings of its own:
  # the embeddings are the store's and the documents the bucket's, so this
  # Recipe configures no backup and declares no native backup.
  assertions:
    # The keys this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "RoleArn" "EmbeddingModelArn" "StorageConfiguration" "BucketARN" "InclusionPrefixes" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and an Amazon Bedrock knowledge base answers at the Bedrock agent runtime endpoint of its Region, which offers no custom domain, so every name it answers under is one of the service's own: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads RoleArn, EmbeddingModelArn, StorageConfiguration, BucketARN and InclusionPrefixes from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The resource type requires a role, an embedding model and a store, and
    # none has a value this Recipe could choose for the operator. The
    # terraform Recipe of this Component holds the same rule on role_arn,
    # embedding_model_arn and storage_configuration: each target reads the
    # keys under its own spelling, so the rule cannot sit in the Component.
    overrides_required: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "RoleArn") -}}
      {{- fail "infra.overrides.RoleArn is not set, and an Amazon Bedrock knowledge base works as the IAM role the operator names by its ARN: set infra.overrides.RoleArn in the Release, such as arn:aws:iam::123456789012:role/example-knowledge-base-role" -}}
      {{- end -}}
      {{- if not (hasKey $o "EmbeddingModelArn") -}}
      {{- fail "infra.overrides.EmbeddingModelArn is not set, and an Amazon Bedrock knowledge base over a vector store embeds its documents with the model the operator names by its ARN: set infra.overrides.EmbeddingModelArn in the Release, such as arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0" -}}
      {{- end -}}
      {{- if not (hasKey $o "StorageConfiguration") -}}
      {{- fail "infra.overrides.StorageConfiguration is not set, and an Amazon Bedrock knowledge base writes its embeddings to the operator's vector store, which it describes: set infra.overrides.StorageConfiguration in the Release to the store's Type and its configuration" -}}
      {{- end -}}
    # Each override is passed to the resource as written, so one of another
    # shape would render a property Amazon Bedrock refuses. RoleArn takes the
    # role ARN form, EmbeddingModelArn the model ARN form the resource
    # schema gives, BucketARN the bucket ARN form it gives BucketArn, and
    # InclusionPrefixes, with a bucket alone, one prefix of 1 to 300
    # characters. The terraform Recipe of this Component holds the same
    # rules on its own spellings, for the reason given above.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "RoleArn" -}}
      {{- if not (and (typeIs "string" $o.RoleArn) (le (len $o.RoleArn) 2048) (regexMatch `^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/([\x21-\x7E]+/)?[\w+=,.@-]{1,64}$` $o.RoleArn)) -}}
      {{- fail (printf "infra.overrides.RoleArn is %s, and Amazon Bedrock takes the IAM role a knowledge base works as as the role's ARN, arn:aws:iam::<account>:role/ followed by the role's path and name, 2,048 characters at most: set it to such an ARN in the Release" (toJson $o.RoleArn)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "EmbeddingModelArn" -}}
      {{- $m := get $o "EmbeddingModelArn" -}}
      {{- if not (and (typeIs "string" $m) (ge (len $m) 20) (le (len $m) 2048) (regexMatch `^arn:aws(-[^:]+)?:[a-z0-9-]+:[a-z0-9-]{1,20}:[0-9]{0,12}:[a-zA-Z0-9:/._+-]+$` $m)) -}}
      {{- fail (printf "infra.overrides.EmbeddingModelArn is %s, and Amazon Bedrock takes the embedding model as the model's ARN, such as arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0, 20 to 2,048 characters: set it to such an ARN in the Release" (toJson $m)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "BucketARN" -}}
      {{- if not (and (typeIs "string" $o.BucketARN) (regexMatch `^arn:aws(-cn|-us-gov|-eusc|-iso(-[b-f])?)?:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$` $o.BucketARN)) -}}
      {{- fail (printf "infra.overrides.BucketARN is %s, and an Amazon Bedrock data source takes the S3 bucket it reads as the bucket's ARN, arn:aws:s3::: followed by the bucket's name of 3 to 63 lowercase letters, digits, periods and hyphens: set it to such an ARN in the Release" (toJson $o.BucketARN)) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "InclusionPrefixes" -}}
      {{- $p := get $o "InclusionPrefixes" -}}
      {{- if not (hasKey $o "BucketARN") -}}
      {{- fail "infra.overrides.InclusionPrefixes is set without infra.overrides.BucketARN, and the prefix limits the data source over the bucket BucketARN names, which is created only with it: set infra.overrides.BucketARN in the Release, or remove infra.overrides.InclusionPrefixes" -}}
      {{- end -}}
      {{- if not (and (kindIs "slice" $p) (eq (len $p) 1)) -}}
      {{- fail (printf "infra.overrides.InclusionPrefixes is %s, and an Amazon Bedrock data source takes one prefix, as a list holding it: set it to a list of one prefix in the Release, or remove it to read the whole bucket" (toJson $p)) -}}
      {{- end -}}
      {{- $first := index $p 0 -}}
      {{- if not (and (typeIs "string" $first) (ge (len $first) 1) (le (len $first) 300)) -}}
      {{- fail (printf "infra.overrides.InclusionPrefixes holds %s, and an Amazon Bedrock data source takes a prefix of 1 to 300 characters: correct it in the Release" (toJson $first)) -}}
      {{- end -}}
      {{- end -}}
    # The vector store, held to what the AWS::Bedrock::KnowledgeBase resource
    # schema describes, so that a store CloudFormation cannot create a
    # knowledge base over, or a configuration it refuses, halts here rather
    # than when the stack is deployed. $stores gives, for each store type,
    # the object describing it, its required and optional fields, and its
    # FieldMapping's required and optional fields; $forms the form of each
    # field the schema constrains beyond a line of at most 2,048 characters,
    # with its length limit, 0 where the schema sets none. The terraform
    # Recipe of this Component holds the same rules on the AWS provider's
    # spellings, for the reason given above.
    storage_configuration: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "StorageConfiguration" -}}
      {{- $s := get $o "StorageConfiguration" -}}
      {{- $stores := dict
        "OPENSEARCH_SERVERLESS" (list "OpensearchServerlessConfiguration" (list "CollectionArn" "FieldMapping" "VectorIndexName") (list) (list "MetadataField" "TextField" "VectorField") (list))
        "OPENSEARCH_MANAGED_CLUSTER" (list "OpensearchManagedClusterConfiguration" (list "DomainArn" "DomainEndpoint" "FieldMapping" "VectorIndexName") (list) (list "MetadataField" "TextField" "VectorField") (list))
        "PINECONE" (list "PineconeConfiguration" (list "ConnectionString" "CredentialsSecretArn" "FieldMapping") (list "Namespace") (list "MetadataField" "TextField") (list))
        "RDS" (list "RdsConfiguration" (list "CredentialsSecretArn" "DatabaseName" "FieldMapping" "ResourceArn" "TableName") (list) (list "MetadataField" "PrimaryKeyField" "TextField" "VectorField") (list "CustomMetadataField"))
        "NEPTUNE_ANALYTICS" (list "NeptuneAnalyticsConfiguration" (list "FieldMapping" "GraphArn") (list) (list "MetadataField" "TextField") (list))
        "S3_VECTORS" (list "S3VectorsConfiguration" (list) (list "IndexArn" "IndexName" "VectorBucketArn") (list) (list))
        "MONGO_DB_ATLAS" (list "MongoDbAtlasConfiguration" (list "CollectionName" "CredentialsSecretArn" "DatabaseName" "Endpoint" "FieldMapping" "VectorIndexName") (list "EndpointServiceName" "TextIndexName") (list "MetadataField" "TextField" "VectorField") (list)) -}}
      {{- $secret := list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):secretsmanager:[a-z0-9-]{1,20}:([0-9]{12}|):secret:[a-zA-Z0-9!/_+=.@-]{1,512}$` 0 "the ARN of an AWS Secrets Manager secret, arn:aws:secretsmanager:<region>:<account>:secret:<name>" -}}
      {{- $column := list `^[a-zA-Z0-9_\-]+$` 63 "a column name of 1 to 63 letters, digits, underscores and hyphens" -}}
      {{- $forms := dict
        "OpensearchServerlessConfiguration.CollectionArn" (list `^arn:(?:aws(|-cn|-us-gov|-iso)|aws[a-z\-]*):aoss:[a-z]{2}(-gov)?-[a-z]+-\d{1}:\d{12}:collection/[a-z0-9-]{3,32}$` 2048 "the ARN of an OpenSearch Serverless collection, arn:aws:aoss:<region>:<account>:collection/<id>")
        "OpensearchManagedClusterConfiguration.DomainArn" (list `^arn:aws(-cn|-us-gov|-eusc|-iso(-[b-f])?)?:es:([a-z]{2,}-){2,}\d:\d{12}:domain/[a-z][a-z0-9-]{3,28}$` 2048 "the ARN of an OpenSearch Service domain, arn:aws:es:<region>:<account>:domain/<name>")
        "OpensearchManagedClusterConfiguration.DomainEndpoint" (list `^https://.*$` 2048 "the domain's endpoint, https:// followed by its name")
        "OpensearchManagedClusterConfiguration.VectorIndexName" (list `^[a-z0-9][a-z0-9_.-]*$` 2048 "an index name of lowercase letters, digits, underscores, periods and hyphens, opening with a letter or a digit")
        "PineconeConfiguration.CredentialsSecretArn" $secret
        "RdsConfiguration.CredentialsSecretArn" $secret
        "RdsConfiguration.DatabaseName" (list `^[a-zA-Z0-9_\-]+$` 63 "a database name of 1 to 63 letters, digits, underscores and hyphens")
        "RdsConfiguration.ResourceArn" (list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):rds:[a-zA-Z0-9-]*:[0-9]{12}:cluster:[a-zA-Z0-9-]{1,63}$` 0 "the ARN of an Amazon Aurora DB cluster, arn:aws:rds:<region>:<account>:cluster:<name>")
        "RdsConfiguration.TableName" (list `^[a-zA-Z0-9_.\-]+$` 63 "a table name of 1 to 63 letters, digits, underscores, periods and hyphens")
        "RdsConfiguration.FieldMapping.CustomMetadataField" $column
        "RdsConfiguration.FieldMapping.MetadataField" $column
        "RdsConfiguration.FieldMapping.PrimaryKeyField" $column
        "RdsConfiguration.FieldMapping.TextField" $column
        "RdsConfiguration.FieldMapping.VectorField" $column
        "NeptuneAnalyticsConfiguration.GraphArn" (list `^arn:(?:aws(|-cn|-us-gov)|aws[a-z\-]*):neptune-graph:[a-zA-Z0-9-]*:[0-9]{12}:graph/g-[a-zA-Z0-9]{10}$` 255 "the ARN of a Neptune Analytics graph, arn:aws:neptune-graph:<region>:<account>:graph/g- followed by ten letters and digits")
        "S3VectorsConfiguration.IndexArn" (list `^.*$` 0 "the ARN of an S3 vector index, on one line")
        "S3VectorsConfiguration.IndexName" (list `^.{3,63}$` 63 "an index name of 3 to 63 characters")
        "S3VectorsConfiguration.VectorBucketArn" (list `^.*$` 0 "the ARN of an S3 vector bucket, on one line")
        "MongoDbAtlasConfiguration.CollectionName" (list `^.*$` 63 "a collection name of at most 63 characters, on one line")
        "MongoDbAtlasConfiguration.CredentialsSecretArn" $secret
        "MongoDbAtlasConfiguration.DatabaseName" (list `^.*$` 63 "a database name of at most 63 characters, on one line")
        "MongoDbAtlasConfiguration.Endpoint" (list `^[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.mongodb\.net$` 2048 "a MongoDB Atlas cluster's host name, <cluster>.<id>.mongodb.net")
        "MongoDbAtlasConfiguration.EndpointServiceName" (list `^(?:arn:(?:aws(?:-us-gov|-cn|-iso|-iso-[a-z])*|aws[a-z\-]*):.+:.*:\d+:.+/.+$|[a-zA-Z0-9*]+[a-zA-Z0-9._-]*)$` 255 "a VPC endpoint service's name or ARN") -}}
      {{- if not (and (kindIs "map" $s) (hasKey $stores (toString (get $s "Type")))) -}}
      {{- fail (printf "infra.overrides.StorageConfiguration is %s, and CloudFormation's AWS::Bedrock::KnowledgeBase takes the operator's vector store as an object whose Type is OPENSEARCH_SERVERLESS, OPENSEARCH_MANAGED_CLUSTER, PINECONE, RDS, NEPTUNE_ANALYTICS, S3_VECTORS or MONGO_DB_ATLAS, beside that store's configuration: correct it in the Release" (toJson $s)) -}}
      {{- end -}}
      {{- $store := get $stores (toString (get $s "Type")) -}}
      {{- $ck := index $store 0 -}}
      {{- $others := list -}}
      {{- range $k, $_ := $s }}{{ if not (has $k (list "Type" $ck)) }}{{ $others = append $others $k }}{{ end }}{{ end -}}
      {{- if or $others (not (kindIs "map" (get $s $ck))) -}}
      {{- fail (printf "infra.overrides.StorageConfiguration is %s, and a store of Type %s is described by an object under %s and nothing else beside Type: correct it in the Release" (toJson $s) (get $s "Type") $ck) -}}
      {{- end -}}
      {{- $c := get $s $ck -}}
      {{- $objects := list (list $ck $c (index $store 1) (index $store 2)) -}}
      {{- if index $store 3 }}{{ $objects = append $objects (list (printf "%s.FieldMapping" $ck) (get $c "FieldMapping") (index $store 3) (index $store 4)) }}{{ end -}}
      {{- range $obj := $objects -}}
      {{- $path := index $obj 0 -}}{{- $v := index $obj 1 -}}{{- $req := index $obj 2 -}}{{- $opt := index $obj 3 -}}
      {{- $ok := kindIs "map" $v -}}
      {{- if $ok }}{{ range $f := $req }}{{ if not (hasKey $v $f) }}{{ $ok = false }}{{ end }}{{ end }}{{ range $f, $_ := $v }}{{ if not (or (has $f $req) (has $f $opt)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.StorageConfiguration.%s is %s, and the AWS::Bedrock::KnowledgeBase resource schema describes it with the fields %s%s, and no other: correct it in the Release" $path (toJson $v) (join ", " $req) (ternary (printf ", and optionally %s" (join ", " $opt)) "" (gt (len $opt) 0))) -}}
      {{- end -}}
      {{- range $f, $fv := $v -}}
      {{- if ne $f "FieldMapping" -}}
      {{- $form := get $forms (printf "%s.%s" $path $f) | default (list `^.*$` 2048 "a line of text of at most 2,048 characters") -}}
      {{- $max := index $form 1 -}}
      {{- if not (and (typeIs "string" $fv) (regexMatch (index $form 0) $fv) (or (eq $max 0) (le (len $fv) $max))) -}}
      {{- fail (printf "infra.overrides.StorageConfiguration.%s.%s is %s, and the AWS::Bedrock::KnowledgeBase resource schema takes it as %s: correct it in the Release" $path $f (toJson $fv) (index $form 2)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if eq $ck "S3VectorsConfiguration" -}}
      {{- $byArn := and (hasKey $c "IndexArn") (not (hasKey $c "IndexName")) (or (not (hasKey $c "VectorBucketArn")) (hasPrefix (toString (get $c "VectorBucketArn")) (toString (get $c "IndexArn")))) -}}
      {{- $byName := and (hasKey $c "VectorBucketArn") (hasKey $c "IndexName") (not (hasKey $c "IndexArn")) -}}
      {{- if not (or $byArn $byName) -}}
      {{- fail (printf "infra.overrides.StorageConfiguration.S3VectorsConfiguration is %s, and Amazon Bedrock takes an S3 vector index by IndexArn alone, beginning with VectorBucketArn where that is also given, or by VectorBucketArn and IndexName together, never by both: correct it in the Release" (toJson $c)) -}}
      {{- end -}}
      {{- end -}}
      {{- if and (eq $ck "NeptuneAnalyticsConfiguration") (hasKey $o "BucketARN") -}}
      {{- fail "infra.overrides.BucketARN is set with an Amazon Neptune Analytics store, and Amazon Bedrock builds that store's graph during ingestion with a foundation model the data source names for graph construction, which this Recipe does not configure: remove infra.overrides.BucketARN from the Release and connect the data source in Amazon Bedrock, or use another store" -}}
      {{- end -}}
      {{- end -}}

  # The overrides reach the fragment as the assertions above hold them. The
  # store's configuration is written as JSON, which YAML reads back as the
  # same object, each of its fields a string as written; the bucket's ARN
  # and the prefix likewise.
  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}KnowledgeBase:
          Type: AWS::Bedrock::KnowledgeBase
          Properties:
            Name: "{{ .context.instance_id }}"
            KnowledgeBaseConfiguration:
              Type: VECTOR
              VectorKnowledgeBaseConfiguration:
                EmbeddingModelArn: {{ toJson $o.EmbeddingModelArn }}

            ## ── Provider-specific overrides ─────────────────────────
            RoleArn: {{ toJson $o.RoleArn }}
            StorageConfiguration: {{ toJson $o.StorageConfiguration }}
      {{- with optional $o "BucketARN" "" }}

        {{ $.locals.logical_id }}DataSource:
          Type: AWS::Bedrock::DataSource
          Properties:
            Name: "{{ $.context.instance_id }}"
            KnowledgeBaseId: !GetAtt {{ $.locals.logical_id }}KnowledgeBase.KnowledgeBaseId
            DataDeletionPolicy: DELETE
            DataSourceConfiguration:
              Type: S3
              S3Configuration:
                BucketArn: {{ toJson . }}
                {{- with optional $o "InclusionPrefixes" "" }}
                InclusionPrefixes: {{ toJson . }}
                {{- end }}
      {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. Each
      # output is named for this instance and the entry together, so two
      # knowledge bases in one stack keep their identities apart. A cross-stack
      # consumer imports the entry; an intra-stack consumer receives it through
      # the value-pipe above.
      provides:
        host: !Sub "bedrock-agent-runtime.${AWS::Region}.${AWS::URLSuffix}"
        port: "443"
        endpoint: !Sub "https://bedrock-agent-runtime.${AWS::Region}.${AWS::URLSuffix}"
        knowledge_base_id: !GetAtt {{ .locals.logical_id }}KnowledgeBase.KnowledgeBaseId
        arn: !GetAtt {{ .locals.logical_id }}KnowledgeBase.KnowledgeBaseArn
