apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: eventbridge
  version: 1.0.0
  description: >
    Amazon EventBridge on CloudFormation: one AWS::Events::EventBus named
    after the component, which the cloudformation provider assembles into
    the boundary's stack. arn publishes a CloudFormation reference to the
    bus's ARN, which CloudFormation resolves when it creates the stack.

    EventBridge encrypts the custom and partner events on the bus with the
    operator's KMS key
    where KmsKeyId names one; events from AWS services use a key AWS owns,
    as do all events where it names none. With a key set, an event hit by a
    non-retriable key error, such as a disabled or deleted key, is not
    kept, since no dead-letter queue key exists. No rule,
    target, archive, resource policy, logging, dead-letter queue, key or
    role is created. Deleting the stack, or removing the bus from it,
    deletes the bus, which needs every rule on it deleted first.

    infra.overrides.host halts the build, since a publisher reaches every
    bus at EventBridge's endpoint in its Region and names the bus by its
    ARN, as do a KmsKeyId EventBridge cannot take and any infra.overrides
    key not listed.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/messaging/eventbridge:1.0.0

  # The resource's logical id, derived from this instance's own name so that
  # two event buses deployed into one stack describe two resources rather
  # than one. A logical id is unique within a CloudFormation template and
  # admits only letters and digits, so the instance name's separators are
  # read as word boundaries and each word is capitalised: instance
  # commerce-events names the resource CommerceEventsEventBus.
  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  # The String Pipe: the compiler pipes this string verbatim into a consumer's
  # injection context when it uses this bus, and resolves none of it. arn is
  # the bus's Arn attribute, a reference CloudFormation resolves when it
  # creates the bus, so a consumer in the same stack reading it is created
  # after it. The provider projects the matching provides block inside the
  # fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same value.
  provides:
    arn: "!GetAtt {{ .locals.logical_id }}EventBus.Arn"

  # This Recipe reads from infra.overrides:
  #   KmsKeyId - string (Properties.KmsKeyIdentifier)
  # host halts by name, as any key not listed does.
  #
  # KmsKeyId is the name the catalog's CloudFormation Recipes read for the KMS
  # key a resource is encrypted with, whatever the resource calls the field,
  # so a Release names the operator's key once whichever Recipe it encrypts;
  # here the field is KmsKeyIdentifier.
  #
  # KmsKeyId names the operator's KMS key by one of the forms the
  # CreateEventBus API reference gives KmsKeyIdentifier: a key ID (a UUID, or
  # mrk- and 32 hexadecimal digits for a multi-Region key), an alias name
  # (alias/ followed by its name), or the ARN of a key or of an alias, which
  # a key of another account is named by. A value of another form halts the
  # build. EventBridge then encrypts the custom and partner events stored on
  # the bus under that key, and the event pattern and target settings of
  # every rule on the bus; events from AWS services stay under a key AWS
  # owns. EventBridge takes a symmetric key alone. The key, and its key
  # policy, which lets EventBridge use it, are the operator's, named here and
  # never created. EventBridge runs no schema discovery on a bus encrypted
  # under such a key. Unset, the fragment writes no KmsKeyIdentifier, and
  # EventBridge encrypts the bus's events under a key AWS owns.
  #
  # host is refused by name. EventBridge publishes no address of an event
  # bus of its own: a client calls EventBridge's endpoint in the bus's
  # Region, an endpoint the service names and offers no custom domain for,
  # and names the bus by its ARN in each call, so this Component publishes no
  # host for the name to replace.
  #
  # Tags is not read: no CloudFormation Recipe of this catalog reads one, and
  # it halts as any key not listed does.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # held by the Component's assertions, or not read:
  #   honoured — the override above.
  #   refused — a KmsKeyId of another form; infra.overrides.host; and any
  #     infra.overrides key not listed above.
  #   held by the Component — the component's name, which names the bus.
  #   not read — none; the Component declares no value and no other infra
  #     key.
  #
  # The name. Name is create-only on the resource, so renaming the component
  # makes CloudFormation create a new bus under the new name and delete the
  # old one, which needs every rule on the old bus deleted first.
  #
  # What the fragment writes beside the name: nothing else of the bus's own.
  # It writes no EventSourceName, which would make the bus a partner event
  # bus receiving a SaaS partner's events; no Policy, so the bus carries no
  # resource policy and only identities of the account owning it, as their
  # IAM permissions allow, send events to it or add rules to it; no LogConfig,
  # so the bus writes no logs; no DeadLetterConfig, so an event EventBridge
  # cannot encrypt or decrypt under the operator's key is not kept in a
  # queue; and no Description. It declares no rule, target or archive, each
  # of which is a resource of its own, and the rules that route the bus's
  # events are the subscribers'.
  #
  # Deletion. The resource keeps CloudFormation's own deletion policy, Delete,
  # so deleting the stack, or removing the bus from it, deletes the bus, and
  # the DeleteEventBus API reference asks that every rule on it be deleted
  # first. An event on the bus is passed to the targets of the rules matching
  # it and kept by no archive, so the bus holds none to back up.
  assertions:
    # The key this Recipe reads under infra.overrides, and no other: a key
    # spelt otherwise, or meant for another Recipe, would reach no byte of the
    # output while the build reads as if it had been applied.
    overrides_known: >-
      {{- $known := list "KmsKeyId" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Amazon EventBridge publishes no address of an event bus: a client calls EventBridge's endpoint in the bus's Region, which offers no custom domain, and names the bus by arn: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads KmsKeyId from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # KmsKeyId is passed to KmsKeyIdentifier as written, in one of the forms
    # the CreateEventBus API reference gives that property: a key ID, an alias
    # name, or a key or alias ARN, each within the letters, digits, hyphens,
    # underscores, slashes and colons it admits. An alias name is held to
    # KMS's own CreateAlias AliasName pattern, alias/ then letters, digits,
    # slashes, underscores and hyphens, so it takes no colon; only the ARN
    # forms carry one. The terraform Recipe of this
    # Component holds the same rule on kms_key_id: each target reads the key
    # under its own spelling, so the rule cannot sit in the Component.
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "KmsKeyId" -}}
      {{- if not (and (typeIs "string" $o.KmsKeyId) (regexMatch `^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|mrk-[0-9a-f]{32}|alias/[a-zA-Z0-9/_-]+|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:(key|alias)/[a-zA-Z0-9/_-]+)$` $o.KmsKeyId)) -}}
      {{- fail (printf "infra.overrides.KmsKeyId is %s, and EventBridge takes the KMS key an event bus is encrypted with as a key ID, an alias name beginning alias/, or the ARN of a key or an alias: set it to one of them in the Release, or remove it to encrypt the bus under a key AWS owns" (toJson $o.KmsKeyId)) -}}
      {{- end -}}
      {{- end -}}

  artifacts:
    template.yaml: |
      {{- $o := optional .infra "overrides" dict -}}
      Resources:
        {{ .locals.logical_id }}EventBus:
          Type: AWS::Events::EventBus
          Properties:
            Name: "{{ .context.instance_id }}"

            ## ── Provider-specific overrides ─────────────────────────
            {{- with optional $o "KmsKeyId" "" }}
            KmsKeyIdentifier: {{ toJson . }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs and expands the short-form intrinsics to long form. The
      # output is named for this instance and the entry together, so two buses
      # in one stack keep their identities apart. A cross-stack consumer imports
      # the entry; an intra-stack consumer receives it through the value-pipe
      # above.
      provides:
        arn: !GetAtt {{ .locals.logical_id }}EventBus.Arn
