apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql-rds
  version: 1.0.0
  description: >
    MySQL via AWS RDS, rendered as a CloudFormation fragment. The artifact
    emits only the RDS DBInstance resource under a Resources block; the
    cloudformation provider stamps the stack envelope and projects this recipe's
    provides entries into the stack Outputs when it assembles the boundary's
    fragments into one stack template.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: core/datastore/mysql:1.0.0

  locals:
    logical_id: "MySQL"

  # The String Pipe: CloudFormation intrinsic function references. The compiler
  # pipes these strings verbatim into a consumer's injection context when it
  # uses this database — it does not resolve them. CloudFormation resolves them
  # at stack creation time. The provider projects the matching provides block
  # inside the fragment below into the assembled stack Outputs; this recipe-level
  # provides is the value-pipe contract, the fragment provides is the Outputs
  # source, and they carry the same references. user is the RDS master username
  # (admin, set below); database mirrors the developer value.
  #
  # host/port name the resource literally rather than reading
  # locals.logical_id, which holds the same name. provides is resolved before
  # locals — a local may read provides — so a provides template cannot reference
  # one, and the name has to be repeated here. Renaming the resource means
  # editing both; do not "unify" them back onto .locals.
  provides:
    host: "!GetAtt MySQL.Endpoint.Address"
    port: "!GetAtt MySQL.Endpoint.Port"
    user: "admin"
    database: "{{ .values.database }}"
    protocol: "mysql"

  artifacts:
    template.yaml: |
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::RDS::DBInstance
          DeletionPolicy: {{ if .infra.overrides }}{{ .infra.overrides.DeletionPolicy | default "Snapshot" }}{{ else }}Snapshot{{ end }}
          Properties:
            Engine: mysql
            EngineVersion: "{{ .infra.engine_version }}"
            Port: {{ .infra.port }}
            DBName: "{{ .values.database }}"
            MasterUsername: admin
            ManageMasterUserPassword: true

            ## ── Compute ────────────────────────────────────────────
            DBInstanceClass: {{ if .infra.overrides }}{{ .infra.overrides.DBInstanceClass | default "db.t3.small" }}{{ else }}db.t3.small{{ end }}

            ## ── Storage ────────────────────────────────────────────
            AllocatedStorage: {{ trimSuffix "Gi" .infra.storage.size }}
            StorageType: "{{ .infra.storage.type }}"

            ## ── HA ─────────────────────────────────────────────────
            MultiAZ: {{ if .infra.overrides }}{{ .infra.overrides.MultiAZ | default .infra.ha.enabled }}{{ else }}{{ .infra.ha.enabled }}{{ end }}

            ## ── Backup ─────────────────────────────────────────────
            BackupRetentionPeriod: {{ .infra.backup.retention_days }}

            ## ── Provider-specific overrides ─────────────────────────
            {{- if .infra.overrides }}
            {{- if .infra.overrides.DBSubnetGroupName }}
            DBSubnetGroupName: "{{ .infra.overrides.DBSubnetGroupName }}"
            {{- end }}
            {{- if .infra.overrides.VPCSecurityGroups }}
            VPCSecurityGroups: {{ toJson .infra.overrides.VPCSecurityGroups }}
            {{- end }}
            {{- if .infra.overrides.DBParameterGroupName }}
            DBParameterGroupName: "{{ .infra.overrides.DBParameterGroupName }}"
            {{- end }}
            {{- if .infra.overrides.StorageEncrypted }}
            StorageEncrypted: {{ .infra.overrides.StorageEncrypted }}
            KmsKeyId: "{{ .infra.overrides.KmsKeyId }}"
            {{- end }}
            {{- end }}

      # Fragment provides: the provider projects each entry into the assembled
      # stack Outputs, keyed by the entry name, and expands the short-form
      # intrinsics to long form. A cross-stack consumer imports the host entry;
      # an intra-stack consumer receives it through the value-pipe above.
      provides:
        host: !GetAtt {{ .locals.logical_id }}.Endpoint.Address
        port: !GetAtt {{ .locals.logical_id }}.Endpoint.Port
        user: "admin"
        database: "{{ .values.database }}"
        protocol: mysql
