apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-managed
  version: 1.0.0
  description: >
    An Azure managed online endpoint as a reference realization on Azure
    Resource Manager: the fragment this Recipe writes declares no resource,
    so the template deploys nothing for the model, and it carries the
    scoring endpoint the Release supplies and the model's name as outputs
    of the template.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-managed where it deploys Terraform.
    A consumer reads each value as the text the Release and the Aggregate
    give, and nothing is looked up when the template deploys. A missing
    infra.endpoint halts naming it. No credential is delivered by this
    Recipe: a consumer that needs a key or a token to call the endpoint
    holds its own, because how it authenticates belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/ai-model/azure-managed:1.0.0

  # This Recipe reads no infra.overrides key, and the Component declares no
  # infra.overrides, so a Release setting it halts at pull, before this
  # Recipe renders, its schema naming the property it does not declare.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.model, published as provides.model; infra.endpoint,
  #     published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint.
  #   not read — values.context_window, a hint for sizing the server that
  #     serves a model, which the operator's endpoint already does;
  #     values.display_name and values.description, which describe the
  #     component to its readers.
  #
  # Azure Resource Manager defines a managed online endpoint as a resource of
  # an Azure Machine Learning workspace. The Component is a reference to an
  # endpoint an organisation already runs, so this Recipe declares none.
  #
  # Backup. The endpoint is the operator's, and this Recipe creates nothing
  # to back up.
  assertions:
    # A managed online endpoint's scoring host belongs to the endpoint an
    # organisation created, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint this model is served from.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches an Azure managed online endpoint, and its scoring host belongs to the endpoint an organisation created, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the scoring URL of that endpoint" -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the model's name from the
  # developer's values, each published as written, so a consumer in this
  # template or another reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"

  # The fragment the provider assembles into the boundary's template: no
  # resource, so the template deploys nothing for this component, and an
  # output for each value the component publishes, so an operator reads what
  # the template was given once it is deployed. The provider names each
  # output after the component and the entry.
  artifacts:
    azure-managed.yaml: |
      resources: {}
      outputs:
        endpoint:
          type: string
          value: {{ toJson .infra.endpoint }}
        model:
          type: string
          value: {{ toJson .values.model }}
