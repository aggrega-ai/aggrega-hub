apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-application-insights
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Application Insights module: the third-party template this Recipe pins and
  # wraps in the output. The component it provisions is a service the reader
  # contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Application Insights: one workspace-based component storing its
    telemetry in the operator's Log Analytics workspace, deployed from an
    Azure Resource Manager template through Microsoft's Azure Verified
    Modules module avm/res/insights/component at 0.8.0, MIT, pinned by
    digest in entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-application-insights where it
    deploys Terraform. infra.overrides.workspace_id names the workspace by
    its resource ID; the Release creates none. The application type is web
    unless infra.overrides.application_type is other, every item is kept
    unless infra.overrides.sampling_percentage samples a share, and local
    authentication is on unless infra.overrides.local_authentication_enabled
    is false. Client IP addresses are masked. The module's telemetry is off.

    connection_string is an expression for the string the service reports.
    It is declared sensitive, so a consumer's values mapping reading it halts
    the build: a Container Apps server takes it from a Key Vault secret named
    under its infra.overrides.secrets. Any infra.overrides key not listed,
    resource_group_name, host and enable_telemetry true halt naming the key,
    as do workspace_id left out, and workspace_id, application_type,
    sampling_percentage, local_authentication_enabled and location given in
    a form they do not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/observability/azure-application-insights:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.8.0, the module Bicep names
  # br/public:avm/res/insights/component:0.8.0. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.Insights/components at API version 2020-02-02, a linked
  # storage account in a nested deployment of the module's own, deployed
  # only while one is passed, and passes the catalog's check of every
  # rendered template against the Azure Resource Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/insights/component
    version: 0.8.0

  locals:
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expression in provides reads.
    symbol: '{{ capitalizedWords .context.instance_id }}'

  # This Recipe reads from infra.overrides:
  #   workspace_id                  - string (workspaceResourceId), required
  #   application_type              - string (applicationType and kind: web or other;
  #                                   default web)
  #   sampling_percentage           - integer (samplingPercentage: 0 to 100; default 100)
  #   local_authentication_enabled  - bool (disableLocalAuth, inverted; default true)
  #   location                      - string (location; the module's default is the resource group's)
  #   tags                          - map[string]string (tags)
  #   enable_telemetry              - false alone (enableTelemetry, always false)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. host halts by name too: the component
  # publishes no host, since the ingestion address travels inside the
  # connection string. enable_telemetry: true halts by name, since telemetry
  # is always off.
  #
  # Each but enable_telemetry is the key terraform/azure-application-insights
  # reads for the same concept, under the same spelling; that Recipe refuses
  # enable_telemetry, since its module is the catalog's own, and also reads
  # resource_group_name, since Terraform names the group a resource is
  # created in. The module parameter each sets is given in brackets.
  # workspace_id, application_type, sampling_percentage and
  # local_authentication_enabled are the arguments of the azurerm provider's
  # Application Insights resource.
  #
  # workspace_id. The resource ID of the Log Analytics workspace the
  # component stores its telemetry in,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.OperationalInsights/workspaces/<workspace>,
  # read without regard to case, as Azure Resource Manager reads IDs. The
  # workspace is the operator's, created outside the Release; this Recipe
  # creates none. Microsoft documents classic Application Insights, which
  # kept telemetry outside a workspace, as retired, and the API version the
  # module calls requires the workspace to create a component, so the key is
  # required. A workspace in another subscription is taken; Microsoft
  # documents that the identity deploying the template then needs the
  # workspace's sharedKeys action there. How long telemetry is kept, and the
  # workspace's daily cap, are set on the workspace.
  #
  # application_type. Microsoft's API for the component, version
  # 2020-02-02, which the module calls, defines the application types web
  # and other; the module takes these two alone, and any other value halts
  # below by name. Unset it is web, the type Microsoft's own examples
  # create. It is written to the component's kind as well, as the azurerm
  # provider writes it, so both Recipes create the same component.
  #
  # sampling_percentage. The share of the telemetry the service keeps when
  # it ingests it, ingestion sampling: 100 unless set, so every item an
  # application sends is kept. The module takes a whole number from 0 to 100,
  # and any other value halts below by name. An SDK that samples before it
  # sends is unaffected.
  #
  # local_authentication_enabled. Unset or true, the service's default,
  # telemetry carrying the instrumentation key alone is ingested. false
  # writes disableLocalAuth true: the component then ingests only telemetry
  # authenticated with Microsoft Entra ID, so a sender also presents a token
  # for an identity holding the Monitoring Metrics Publisher role on the
  # component, a role assignment that is the operator's.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry. The
  # module passes false to its own nested deployments on its own.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: ingestion and query over the public
  # network both on, so an Azure Monitor Private Link Scope restricting them
  # is the operator's; no linked storage account for the profiler and
  # snapshot debugger; no ingestion mode; and no lock, role assignment or
  # diagnostic setting. Microsoft documents that a template cannot set the
  # component's daily cap, so the service's own stands.
  #
  # These are replaced: disableIpMasking, whose default is true, by false,
  # so the service masks the client IP address of the telemetry it ingests
  # rather than storing it, as the azurerm provider's default does too;
  # retentionInDays, whose
  # default is 365, by 90, the value terraform/azure-application-insights
  # writes; and flowType and requestSource, which the module leaves out, by
  # Bluefield and rest, the values Microsoft's schema for the API asks a
  # caller creating a component through it to set.
  #
  # The component is named after the component instance. Microsoft's
  # documentation of Azure resource names gives an Application Insights
  # component 1 to 260 characters, none of them %, &, \, ?, / or a control
  # character, and no space or period at the end. A component name in an
  # Aggregate holds letters, digits, hyphens and underscores alone, and the
  # provider names this component's nested deployment after it, halting the
  # build where the name of that nested deployment would pass 50 characters,
  # so every name that builds is one the service takes.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — infra.overrides.resource_group_name; host; enable_telemetry true;
  #     workspace_id left out or given as anything but a Log Analytics
  #     workspace's resource ID; application_type given as anything but web
  #     or other; sampling_percentage as anything but a whole number from 0
  #     to 100; local_authentication_enabled as anything but a boolean;
  #     location as anything but a string; and any infra.overrides key not
  #     listed above.
  #   not read — none.
  #
  # Credentials. The component publishes its connection string, which holds
  # its instrumentation key. The Component declares it sensitive, so a
  # consumer's values mapping that reads it halts the build, under the
  # provider's rule that refuses every literal such a mapping writes; a
  # connection that reads nothing from it builds. A server on Container Apps
  # takes the string from a Key Vault secret the operator stores it in,
  # named under that server's infra.overrides.secrets, so the template
  # carries a reference and never the string. The module returns the string
  # as a plain string output of its nested deployment, and Azure Resource
  # Manager keeps the outputs of a nested deployment for whoever can read it,
  # as the service returns the string among the component's properties to
  # whoever can read the component; this Recipe writes it into no output of
  # its own.
  # Backup. The component keeps no data of its own: its telemetry is in the
  # workspace, so this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "workspace_id" "application_type" "sampling_percentage" "local_authentication_enabled" "location" "tags" "enable_telemetry" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Application Insights component in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and the Application Insights component publishes no host: a sender finds the ingestion address in the connection string it publishes: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads workspace_id, application_type, sampling_percentage, local_authentication_enabled, location, tags and enable_telemetry from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    # The workspace's resource ID, read without regard to case, as Azure
    # Resource Manager reads IDs.
    workspace_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if not (hasKey $o "workspace_id") -}}
      {{- fail "this Release stores the Application Insights component's telemetry in the operator's own Log Analytics workspace, which this Recipe never creates, but infra.overrides.workspace_id carries none: set infra.overrides.workspace_id in the Release to the workspace's resource ID" -}}
      {{- end -}}
      {{- $w := index $o "workspace_id" -}}
      {{- $ok := typeIs "string" $w -}}
      {{- if $ok }}{{ $ok = regexMatch `(?i)^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.operationalinsights/workspaces/[^/]+$` $w }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.workspace_id is %v, and it names the Log Analytics workspace the component stores its telemetry in by its resource ID, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.OperationalInsights/workspaces/<workspace>: set it in the Release to such an ID" $w) -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $a := optional $o "application_type" "web" -}}
      {{- if not (has $a (list "web" "other")) -}}
      {{- fail (printf "infra.overrides.application_type is %v, and Microsoft's API for an Application Insights component, version 2020-02-02, defines the application types web and other, spelt in lower case: set infra.overrides.application_type to one of them, or remove it for web" $a) -}}
      {{- end -}}
      {{- $s := optional $o "sampling_percentage" 100 -}}
      {{- $whole := or (kindIs "int" $s) (kindIs "int64" $s) (and (kindIs "float64" $s) (eq (float64 (int $s)) $s)) -}}
      {{- if not (and $whole (ge (int $s) 0) (le (int $s) 100)) -}}
      {{- fail (printf "infra.overrides.sampling_percentage is %v, and the module takes the share of telemetry the service keeps as a whole number from 0 to 100: set infra.overrides.sampling_percentage to such a number, or remove it to keep every item" $s) -}}
      {{- end -}}
      {{- $la := optional $o "local_authentication_enabled" true -}}
      {{- if not (kindIs "bool" $la) -}}
      {{- fail (printf "infra.overrides.local_authentication_enabled is %v, and it switches the component's local authentication as a boolean: set it to false to ingest only telemetry authenticated with Microsoft Entra ID, or to true or remove it to keep it on" $la) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the component is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
  # The String Pipe: the compiler does not interpret this string. A consumer
  # receives it as written. The module publishes the connection string the
  # service reports as its connectionString output, and connection_string
  # reads that output from the nested deployment this component becomes.
  # Azure Resource Manager evaluates the expression when the template
  # deploys, after the component exists. No infra.overrides key replaces
  # it: the string is the component's own.
  provides:
    connection_string: "[reference('{{ .locals.symbol }}').outputs.connectionString.value]"

  # Each key binds the module parameter of the same name. The component is
  # named after the component instance, as the other managed Recipes name
  # theirs.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    {{- $a := optional $o "application_type" "web" }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    kind: {{ $a }}
    applicationType: {{ $a }}
    workspaceResourceId: "{{ $o.workspace_id }}"
    samplingPercentage: {{ int (optional $o "sampling_percentage" 100) }}
    disableLocalAuth: {{ if optional $o "local_authentication_enabled" true }}false{{ else }}true{{ end }}
    disableIpMasking: false
    retentionInDays: 90
    flowType: Bluefield
    requestSource: rest
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
