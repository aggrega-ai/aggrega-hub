apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-data-factory
  version: 1.0.0
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Data Factory: one factory, with the pipelines values.pipelines
    declares and the global parameters values.global_parameters declares,
    declared by an Azure Resource Manager template this Recipe writes, not
    by Microsoft's Azure Verified Modules module
    avm/res/data-factory/factory, whose template at 0.13.0 fails the
    catalog's check against the Azure Resource Manager schemas.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-data-factory where it deploys
    Terraform. Public network access is on unless
    infra.overrides.public_network_access_enabled is false. The factory
    takes the user-assigned managed identities infra.overrides.identity_ids
    names, and no system-assigned identity. Each pipeline is deployed after
    the factory's pipelines it runs by name, and is written whole on every
    deploy, so a change made in Data Factory Studio is written over; one
    removed from values.pipelines stays in the factory, since the template
    deploys incrementally. Every string of a definition reaches Data
    Factory as written, one that Azure Resource Manager would read as an
    expression included.

    The factory publishes nothing. A component name, an infra.overrides key
    the Recipe does not take, or a value given in a form it does not take
    halts naming it, as do resource_group_name, host and enable_telemetry.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/bigdata/azure-data-factory:1.0.0

  # The factory is declared by the fragment below: one nested deployment
  # holding a Microsoft.DataFactory/factories resource and a
  # Microsoft.DataFactory/factories/pipelines resource for each pipeline, at
  # API version 2018-06-01, which the provider assembles into the boundary's
  # template.
  #
  # Microsoft's Azure Verified Modules programme publishes a Bicep module for
  # the service, avm/res/data-factory/factory, MIT, at 0.13.0 its newest
  # version. It declares no pipeline, and its compiled template declares, in
  # the nested deployment of its linked services, a linked service carrying
  # typeProperties, which the catalog's check of every rendered template
  # against the Azure Resource Manager schemas reports whatever the
  # parameters a Recipe passes: the schemas describe a linked service as a
  # type whose base, closed to every property but its own, refuses the
  # properties each kind of linked service adds, and the check lists this as
  # a place where it is stricter than Resource Manager. The module is
  # therefore not sourced, and no module telemetry exists to turn off.
  locals:
    # The symbolic name of the nested deployment, folded from the instance id
    # as the provider folds a sourced template's: ingest becomes Ingest.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # values.pipelines and values.global_parameters, as JSON text, with each
    # string value that opens with [ and closes with ] written with one more
    # [ in front. Azure Resource Manager reads such a string as an expression
    # wherever the template holds it, and reads [[ at its start as one [, so
    # the string reaches Data Factory as the Aggregate wrote it: a stored
    # procedure named [dbo].[load_orders] stays that name. A key is left as
    # written, since Resource Manager reads no key as an expression. The
    # first replacement marks each such string, keys among them, where it
    # opens; the second takes the mark off each one a colon follows, a key;
    # the third writes [ for the mark.
    values_text: >-
      {{- $j := toJson (dict "pipelines" (default dict .values.pipelines) "global_parameters" (default dict .values.global_parameters)) -}}
      {{- $j = regexReplaceAll `([\[{,:]|^)"(\[(?:[^"\\]|\\.)*\])"` $j "${1}\"\x00${2}\"" -}}
      {{- $j = regexReplaceAll `"\x00((?:[^"\\]|\\.)*)":` $j "\"${1}\":" -}}
      {{- replace "\x00" "[" $j -}}

  # This Recipe reads from infra.overrides:
  #   identity_ids                  - []string (identity.userAssignedIdentities: the factory's
  #                                   type becomes UserAssigned)
  #   public_network_access_enabled - bool (properties.publicNetworkAccess, Enabled or
  #                                   Disabled; default true)
  #   location                      - string (location; default the resource group's region)
  #   tags                          - map[string]string (tags)
  # resource_group_name, host and enable_telemetry halt by name, as any key
  # not listed does: the template deploys into the resource group it is
  # deployed to, which no property of the factory names; the factory has no
  # address for host to name; and the template is this catalog's own, with no
  # module telemetry to turn on or off.
  #
  # Each is the key terraform/azure-data-factory reads for the same concept,
  # under the same spelling, and that Recipe also reads resource_group_name,
  # since Terraform names the group a resource is created in; the property
  # each sets is given in brackets. identity_ids is the key every Azure
  # Recipe reads for the user-assigned managed identities a resource takes,
  # and public_network_access_enabled the key for a boolean switch of public
  # access.
  #
  # identity_ids. Each is the resource ID of a user-assigned managed identity
  # the operator created outside the Release. Data Factory uses one through a
  # credential of the factory, created outside the Release and named by a
  # linked service, to reach a store as that identity, under role
  # assignments the operator makes on the store. Microsoft documents that a
  # factory created through the Azure Resource Manager API takes a
  # system-assigned managed identity only when the request asks for one;
  # this template asks for none, so the factory has no system-assigned
  # identity, and no linked service can authenticate as it. Microsoft also
  # documents that an update naming no identity, made to a factory that
  # holds a system-assigned one, is refused, so a factory given one outside
  # the Release fails its next deploy here. Unset, the factory has no
  # managed identity.
  #
  # public_network_access_enabled. Unset or true, the factory takes requests,
  # those of Data Factory Studio and of a self-hosted integration runtime
  # among them, over the internet; false writes Disabled, and it takes them
  # through private endpoints alone, the operator's, created outside the
  # Release with their private DNS zones.
  #
  # The template sets the factory's properties whole on every deploy: its
  # global parameters from values.global_parameters, its public network
  # access, and nothing else. A Git configuration or a Microsoft Purview
  # account set on the factory outside the Release is therefore not kept,
  # and neither is offered here; nor is a customer-managed key, which
  # Microsoft documents as configured only on an empty factory, which this
  # one is not once its pipelines deploy, and as never removed once set.
  # The service's own defaults stand for the rest: activities run on the
  # factory's default Azure integration runtime,
  # AutoResolveIntegrationRuntime, unless a linked service names another,
  # and the factory has no managed virtual network, private endpoint, role
  # assignment, diagnostic setting or lock.
  #
  # Pipelines. Each entry of values.pipelines becomes a pipeline of that
  # name, its properties the definition as written, so a definition copied
  # from Data Factory Studio's code view deploys as Studio shows it. The
  # template writes a pipeline's activities in its variables, as one entry of
  # pipelineActivities, and the pipeline reads them with variables(), because
  # the pinned schemas describe an activity as a type whose base, closed to
  # every property but its own, refuses typeProperties and every other
  # property an activity of a given type adds; Resource Manager takes them,
  # and the catalog's check lists this as a place where it is stricter than
  # Resource Manager. A value written whole as an expression is not held to
  # the schemas, so an activity is checked by Data Factory alone, when the
  # template deploys; a pipeline's other properties are checked here.
  # A pipeline is deployed after the factory and after each pipeline of this
  # component that one of its activities names in a pipeline reference, so
  # the reference resolves when the pipeline is created; two pipelines
  # naming each other are a circular dependency, which Resource Manager
  # refuses. The linked services, datasets, data flows, integration runtimes
  # and credentials a pipeline names are the operator's, created in the
  # factory outside the Release before the pipeline deploys, and so are the
  # triggers that start pipelines; nothing here creates one. Each deploy
  # writes every pipeline whole, so a change made to one in Data Factory
  # Studio is written over; Resource Manager deploys the template
  # incrementally, so a pipeline removed from values.pipelines stays in the
  # factory until it is deleted there.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # template reference for its resources:
  #   honoured — values.pipelines, as the factory's pipelines;
  #     values.global_parameters, as its global parameters; and the overrides
  #     above.
  #   refused — a factory name Azure refuses; infra.overrides.resource_group_name,
  #     host and enable_telemetry; identity_ids, public_network_access_enabled
  #     and location given in a form they do not take; and any infra.overrides
  #     key not listed above. A pipeline name or definition, or a global
  #     parameter, outside the shape Data Factory writes is refused by the
  #     Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. Nothing here creates or delivers one: the factory reaches a
  # store with the identity or credential its linked service names, and a
  # caller starting a run authenticates to Azure Resource Manager as its own
  # identity. Backup. The factory holds definitions rather than data, and
  # the template writes its pipelines and global parameters on every deploy;
  # this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "identity_ids" "public_network_access_enabled" "location" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the data factory in the resource group the template is deployed to, which no property of the factory names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a data factory has no address for it to name: Azure Resource Manager manages the factory, and this Component publishes nothing: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the data factory in a template of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads identity_ids, public_network_access_enabled, location and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the factory's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the factory is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := get $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
    # The factory is named after the component, and its name is unique across
    # Azure. Microsoft's naming rules for Data Factory give a factory name of
    # 3 to 63 letters, digits and hyphens, beginning and ending with a letter
    # or a digit, each hyphen between two of them, which the factory
    # resource's schema bounds the same way; it is checked here, where the
    # name is known.
    factory_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$` $n) (ge (len $n) 3) (le (len $n) 63)) -}}
      {{- fail (printf "the component %q names its data factory, and Microsoft's naming rules for Data Factory take a factory name of 3 to 63 letters, digits and hyphens, beginning and ending with a letter or a digit, with no two hyphens together: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The Component publishes nothing.
  provides: {}

  # The fragment the provider assembles into the boundary's template: one
  # nested deployment, named after its symbolic name and the deployment it
  # runs in, deployed incrementally and evaluated in its own scope, as the
  # provider deploys a sourced template. Its template declares the factory,
  # named after the component, in location or the resource group's region,
  # with the identity and properties the comments above name; and each
  # pipeline in the order of the names, beside the factory, named
  # <factory>/<pipeline> by a format() expression, as Resource Manager names
  # a child declared outside its parent, each deployed after the factory and
  # after the pipelines it references. A name is written inside the
  # expression's quotes with each ' doubled, as Resource Manager escapes it.
  artifacts:
    data-factory.yaml: |
      {{- $id := .context.instance_id }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $v := fromJson .locals.values_text }}
      {{- $location := default "[resourceGroup().location]" (optional $o "location" "") }}
      {{- $factoryId := printf "[resourceId('Microsoft.DataFactory/factories', '%s')]" $id }}
      {{- $properties := dict "publicNetworkAccess" (ternary "Disabled" "Enabled" (eq (toString (optional $o "public_network_access_enabled" true)) "false")) }}
      {{- with $v.global_parameters }}{{ $_ := set $properties "globalParameters" . }}{{ end }}
      {{- $factory := dict "type" "Microsoft.DataFactory/factories" "apiVersion" "2018-06-01" "name" $id "location" $location "properties" $properties }}
      {{- with optional $o "tags" "" }}{{ $_ := set $factory "tags" . }}{{ end }}
      {{- with optional $o "identity_ids" list }}
      {{- $assigned := dict }}{{ range . }}{{ $_ := set $assigned . dict }}{{ end }}
      {{- $_ := set $factory "identity" (dict "type" "UserAssigned" "userAssignedIdentities" $assigned) }}
      {{- end }}
      {{- $resources := list $factory }}
      {{- $activities := list }}
      {{- range $name, $def := $v.pipelines }}
      {{- $references := lower (toJson (get (get $.values.pipelines $name) "activities")) }}
      {{- $after := list $factoryId }}
      {{- range $other, $_ := $v.pipelines }}
      {{- if and (ne $other $name) (contains (lower (printf "\"referenceName\":%s,\"type\":\"PipelineReference\"" (toJson $other))) $references) }}
      {{- $after = append $after (printf "[resourceId('Microsoft.DataFactory/factories/pipelines', '%s', '%s')]" $id (replace "'" "''" $other)) }}
      {{- end }}
      {{- end }}
      {{- $properties := omit $def "activities" }}
      {{- $_ := set $properties "activities" (printf "[variables('pipelineActivities')[%d]]" (len $activities)) }}
      {{- $activities = append $activities $def.activities }}
      {{- $resources = append $resources (dict "type" "Microsoft.DataFactory/factories/pipelines" "apiVersion" "2018-06-01" "name" (printf "[format('{0}/{1}', '%s', '%s')]" $id (replace "'" "''" $name)) "dependsOn" $after "properties" $properties) }}
      {{- end }}
      {{- $template := dict "$schema" "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#" "contentVersion" "1.0.0.0" "resources" $resources }}
      {{- if $activities }}{{ $_ := set $template "variables" (dict "pipelineActivities" $activities) }}{{ end }}
      {{- $nested := dict "type" "Microsoft.Resources/deployments" "apiVersion" "2025-04-01" "name" (printf "[format('%s-{0}', uniqueString(deployment().name))]" .locals.symbol) "properties" (dict "mode" "Incremental" "expressionEvaluationOptions" (dict "scope" "inner") "template" $template) }}
      resources:
        {{ .locals.symbol }}: {{ toJson $nested }}
