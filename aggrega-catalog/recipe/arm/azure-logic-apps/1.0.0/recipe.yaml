apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-logic-apps
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Logic Apps workflow module: the third-party template this Recipe pins and
  # wraps in the output. The workflow it provisions is a service the reader
  # contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Logic Apps: one Consumption workflow running the definition
    values.definition declares, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/logic/workflow at 0.6.0, MIT, pinned by digest in entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-logic-apps where it deploys
    Terraform. The workflow is enabled, takes the user-assigned managed
    identities infra.overrides.identity_ids names, and is written whole on
    every deploy, so a change made in the designer is written over. The
    module's telemetry is off.

    Every string of the definition, the keys of its maps among them,
    reaches Logic Apps as written: expressions the workflow evaluates
    when it runs, which start with @, pass through Azure Resource Manager
    untouched, and a string Resource Manager would read as an expression of
    its own, one that opens with [ and closes with ], is written so that it
    is not; a key named copy, which Resource Manager reads as a copy
    instruction, is written as the expression [string('copy')], which gives
    that name. The template writes contentVersion 1.0.0.0, so a definition
    naming another version halts naming it.

    The workflow publishes nothing. A component name, an infra.overrides
    key the Recipe does not take, or a value given in a form it does not
    take halts naming it, as do resource_group_name, host and
    enable_telemetry true.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/ai-pipeline/azure-logic-apps:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.6.0, the module Bicep names
  # br/public:avm/res/logic/workflow:0.6.0. `aggrega pin` records the digests
  # of its manifest and of its template layer in entity.lock, and every build
  # reads exactly those bytes. The provider reads the template, main.json,
  # and wraps it as one nested deployment. The template declares
  # Microsoft.Logic/workflows at API version 2019-05-01, a Consumption
  # workflow in multitenant Azure Logic Apps, and passes the catalog's check
  # of every rendered template against the Azure Resource Manager schemas.
  # It takes the definition in parts, one parameter for each section,
  # workflowTriggers, workflowActions, workflowOutputs, workflowParameters
  # and workflowStaticResults, and writes the definition's $schema and its
  # contentVersion, 1.0.0.0, itself.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/logic/workflow
    version: 0.6.0

  locals:
    # values.definition as JSON text, with each string, value or key, that
    # opens with [ and closes with ] written with one more [ in front, and
    # each key named copy written as the expression [string('copy')]. Azure
    # Resource Manager reads such a string as an expression of its own
    # wherever the template holds it, a property name included (Bicep
    # compiles the key '[resourceGroup().location]' to
    # "[[resourceGroup().location]"), and reads [[ at its start as one [, so
    # the string reaches Logic Apps as the Aggregate wrote it: a value
    # [accepted] stays that text, and so does a key [region]. A property
    # named copy is read as a copy instruction, which Bicep avoids by
    # writing the name as [string('copy')] whatever its case. The first
    # replacement marks each string that opens with [ and closes with ]; the
    # second writes a key named copy as the expression; the third writes [
    # for the mark. Expressions of the Workflow Definition Language start
    # with @ and are evaluated by Logic Apps when the workflow runs, while
    # Resource Manager evaluates only its own, in square brackets, when the
    # template deploys (Microsoft's Logic Apps page on Azure Resource
    # Manager templates, References to parameters), so they are left as
    # written.
    definition_text: >-
      {{- $j := toJson (default dict .values.definition) -}}
      {{- $j = regexReplaceAll `([\[{,:]|^)"(\[(?:[^"\\]|\\.)*\])"` $j "${1}\"\x00${2}\"" -}}
      {{- $j = regexReplaceAll `([{,])"((?i:copy))":` $j "${1}\"\x00string('${2}')]\":" -}}
      {{- replace "\x00" "[" $j -}}

  # This Recipe reads from infra.overrides:
  #   identity_ids     - []string (managedIdentities.userAssignedResourceIds)
  #   location         - string (location; the module's default is the resource group's)
  #   tags             - map[string]string (tags)
  #   enable_telemetry - false alone (enableTelemetry, always false)
  # resource_group_name and host halt by name, as any key not listed does:
  # the template deploys into the resource group it is deployed to, which no
  # parameter of the module names; and the workflow publishes no address for
  # host to name. enable_telemetry: true halts by name, since telemetry is
  # always off.
  #
  # Each is the key terraform/azure-logic-apps reads for the same concept,
  # under the same spelling, and that Recipe also reads resource_group_name,
  # since Terraform names the group a resource is created in; the module
  # parameter each sets is given in brackets. identity_ids is the key every
  # Azure Recipe reads for the user-assigned managed identities a resource
  # takes.
  #
  # identity_ids. Each is the resource ID of a user-assigned managed identity
  # the operator created outside the Release, under role assignments the
  # operator makes on each service the workflow calls. Microsoft documents
  # that a Consumption workflow may have several user-assigned identities and
  # uses one at a time, each trigger or action naming the identity it
  # authenticates as. The module asks for a system-assigned identity only
  # when its managedIdentities parameter says so, which this Recipe never
  # does, so the workflow has none. Unset, the workflow has no managed
  # identity.
  #
  # The module deploys a telemetry resource while its enableTelemetry
  # parameter is true, its default: it reports the module and its version to
  # Microsoft. Every Recipe that wraps a module of the Azure Verified Modules
  # programme binds enableTelemetry to false, so the template deploys no
  # telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: the workflow's state is Enabled, so its
  # triggers fire once it deploys; no access control, so a Request trigger
  # takes a call bearing its callback URL from any address; no integration account,
  # integration service environment or endpoints configuration; no values
  # for the definition's parameters, so each takes its default value; and no
  # role assignment, diagnostic setting or lock.
  #
  # Definition. values.definition is written into the module's parameters
  # section by section: triggers into workflowTriggers, actions into
  # workflowActions and outputs into workflowOutputs, each an empty map when
  # unset; parameters into workflowParameters and staticResults into
  # workflowStaticResults, each left out when unset. The module writes
  # $schema, the one schema version the Component admits, and contentVersion
  # 1.0.0.0, the service's default, which no parameter changes, so a
  # definition naming another contentVersion halts below. The API
  # connections a managed connector's action names, created outside the
  # Release, are the operator's; nothing here creates one, and the workflow's
  # parameter values, the resource's parameters property where a template
  # passes connection details as $connections, are not set, so each
  # parameter of the definition, $connections included, takes the default
  # value the definition gives it. Each deploy writes the definition whole,
  # so a change made in the designer or code view is written over.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.definition, as the workflow's definition, and the
  #     overrides above.
  #   refused — a workflow name Logic Apps refuses; a contentVersion other
  #     than 1.0.0.0; infra.overrides.resource_group_name, host and
  #     enable_telemetry true; identity_ids and location given in a form they
  #     do not take; and any infra.overrides key not listed above. A
  #     definition outside the shape the Workflow Definition Language
  #     documents is refused by the Component's own schema before this
  #     Recipe renders.
  #   not read — none.
  #
  # Credentials. Nothing here creates or delivers one. A Request trigger's
  # callback URL carries a shared access signature the service generates,
  # which the operator reads from the workflow, through Azure Resource
  # Manager's List Callback Url operation or the Azure portal, and delivers
  # to a caller outside the Release; it is never written into the template.
  # The workflow calls other services as a managed identity named above, or
  # through an API connection or the authentication an action's definition
  # names. Backup. The workflow holds its definition, which the template
  # writes on every deploy; this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "identity_ids" "location" "tags" "enable_telemetry" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the logic app workflow in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and a logic app workflow publishes no address for it to name: a caller starts a run through a Request trigger's callback URL, a credential the operator delivers outside the Release, or through Azure Resource Manager: remove infra.overrides.host from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads identity_ids, location, tags and enable_telemetry from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the workflow is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := get $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
    # The module writes the definition's contentVersion itself, as 1.0.0.0,
    # and takes no parameter for it.
    content_version: >-
      {{- $v := optional (default dict .values.definition) "contentVersion" "1.0.0.0" -}}
      {{- if ne $v "1.0.0.0" -}}
      {{- fail (printf "values.definition.contentVersion is %s, and the template this Recipe deploys writes the definition's contentVersion as 1.0.0.0, which nothing in it changes: write 1.0.0.0 or remove contentVersion in the Aggregate, or realize the workflow with terraform/azure-logic-apps, which writes it as given" $v) -}}
      {{- end -}}
    # The workflow is named after the component. Microsoft's limits reference
    # for Logic Apps gives a Consumption workflow's name at most 80
    # characters, and the workflow resource takes letters, digits, hyphens,
    # underscores, periods and parentheses, as the azurerm provider's
    # workflow resource checks; it is checked here, where the name is known.
    workflow_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[-()_.A-Za-z0-9]{1,80}$` $n) -}}
      {{- fail (printf "the component %q names its logic app workflow, and Logic Apps takes a Consumption workflow's name of at most 80 letters, digits, hyphens, underscores, periods and parentheses: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The Component publishes nothing.
  provides: {}

  # Each key binds the module parameter of the same name. The workflow is
  # named after the component, as the other managed Recipes name theirs.
  # Each section of the definition is read from the text the local above
  # writes, so every string reaches Logic Apps as the Aggregate wrote it.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    {{- $d := fromJson .locals.definition_text }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: {{ toJson . }}
    {{- end }}
    workflowTriggers: {{ toJson (optional $d "triggers" dict) }}
    workflowActions: {{ toJson (optional $d "actions" dict) }}
    workflowOutputs: {{ toJson (optional $d "outputs" dict) }}
    {{- with optional $d "parameters" dict }}
    workflowParameters: {{ toJson . }}
    {{- end }}
    {{- with optional $d "staticResults" dict }}
    workflowStaticResults: {{ toJson . }}
    {{- end }}
    {{- with optional $o "identity_ids" list }}
    managedIdentities:
      userAssignedResourceIds: {{ toJson . }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
