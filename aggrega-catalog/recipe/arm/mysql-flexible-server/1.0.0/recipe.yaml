apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mysql-flexible-server
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # MySQL flexible server module: the third-party template this Recipe pins and
  # wraps in the output. The flexible server it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # Every value, attachment and infra.overrides key that halts the build is
  # listed, with its reason, in the comments above the assertions.
  description: >
    MySQL on Azure Database for MySQL flexible server, one server with private
    access in a delegated subnet of the operator's virtual network and the
    database values.database names, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/db-for-my-sql/flexible-server at 0.11.2, MIT, fetched from
    mcr.microsoft.com and pinned by digest in entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager template
    and the database is a flexible server in the operator's subscription;
    reach for terraform/mysql-flexible-server where the Release deploys
    Terraform. The delegated subnet and private DNS zone are the operator's,
    named in infra.overrides, and none is emitted: other servers share the
    subnet and the zone. The module deploys a telemetry resource by default,
    reporting to Microsoft; this Recipe turns it off.

    values.user names the server's administrator login and must be set; its
    password is the Key Vault secret a core/referenced-secret attachment on
    root_password names, bound to arm/key-vault-secret, handed to the server
    as a Key Vault reference, so the template carries no password; with
    nothing attached, or another credential, the build halts naming the slot.

    host publishes an expression for the server's FQDN, or
    infra.overrides.host; port is 3306. A value or an infra.overrides key the
    service or the module cannot take halts naming it, and compute is not
    read: infra.overrides.sku_name sizes the server. The server keeps the
    service's automated backups 7 days, and a core/backup attachment halts:
    no FeatureRecipe for this capability binds it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/datastore/mysql:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.11.2, the module Bicep names
  # br/public:avm/res/db-for-my-sql/flexible-server:0.11.2. `aggrega pin`
  # records the digests of its manifest and of its template layer in
  # entity.lock, and every build reads exactly those bytes. The provider reads
  # the template, main.json, and wraps it as one nested deployment.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/db-for-my-sql/flexible-server
    version: 0.11.2

  locals:
    # The module's spelling of the MySQL version infra.engine_version begins
    # with: 8.4 for 8.4 or 8.4.3, 8.0.21 for any 8.0, 5.7 for 5.7, and empty
    # for any other, which the assertion below refuses. The service runs the
    # newest minor version of the major version it is given.
    version: '{{ get (dict "5.7" "5.7" "8.0" "8.0.21" "8.4" "8.4") (regexFind `^[0-9]+\.[0-9]+` (toString .infra.engine_version)) }}'
    # The SKU, infra.overrides.sku_name or GP_Standard_D2ds_v4: two vCores of
    # the General Purpose tier. The tier is the prefix before the first
    # underscore, B, GP or MO, and the module takes the rest as the SKU name.
    sku: '{{ optional (optional .infra "overrides" dict) "sku_name" "GP_Standard_D2ds_v4" }}'
    # The name the Release gives the server under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   delegated_subnet_id   - string (delegatedSubnetResourceId), required
  #   private_dns_zone_id   - string (privateDnsZoneResourceId), required
  #   sku_name              - string (skuName and tier; default "GP_Standard_D2ds_v4")
  #   location              - string (location; the module's default is the resource group's)
  #   zone                  - string (availabilityZone, 1, 2 or 3; default none)
  #   server_configuration  - map[string]{name: string, config: string} (configurations)
  #   tags                  - map[string]string (tags)
  #   host                  - string (published as provides.host; not passed to the module)
  # resource_group_name and enable_telemetry are not read, and each halts by
  # name, as any other key does: the template deploys into the resource group
  # it is deployed to, which no parameter of the module names, and telemetry is
  # always off.
  #
  # Each is the key arm/postgres-flexible-server reads for the same concept,
  # under the same spelling, and the key terraform/mysql-flexible-server reads,
  # which also reads resource_group_name, since Terraform names the group a
  # resource is created in; the module parameter each sets is given in
  # brackets, and host is the key every managed datastore Recipe reads for the
  # address it publishes. delegated_subnet_id
  # and private_dns_zone_id are required: they place the server in the
  # operator's network, and this Recipe never chooses either. The server takes
  # private access in delegated_subnet_id, a subnet's resource ID, whose subnet
  # is delegated to Microsoft.DBforMySQL/flexibleServers; its name resolves
  # through private_dns_zone_id, the resource ID of a private DNS zone whose
  # name ends in .mysql.database.azure.com, linked to every virtual network a
  # client resolves the server from. This Recipe emits neither: the subnet
  # serves every flexible server placed in it, and the zone every server
  # resolving through it.
  #
  # server_configuration carries the server parameters a raw configuration
  # file would, one entry per parameter, as
  # {<key>: {name: <parameter>, config: <value>}}, the shape the other flexible
  # server Recipes take; the module's configurations entry takes the
  # parameter's name and its value.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: the service picks the maintenance window;
  # geo-redundant backup is enabled, which the region of the server must offer;
  # advanced threat protection is on; the storage is provisioned with 1000
  # IOPS, which do not scale on their own; and the storage does not grow on its
  # own as it fills, save on a server with high availability. These are
  # replaced: highAvailability, whose default is zone redundant and which this
  # mapping passes from infra.ha.enabled; storageAutoGrow, which this mapping
  # enables beside high availability, because the service grows the storage of
  # a server with high availability as it fills, with no setting that stops
  # it, and the module requires it there; availabilityZone, a required
  # parameter that is -1, no zone, unless infra.overrides.zone names one; and
  # firewallRules, which this mapping leaves out because a server in a virtual
  # network takes none.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.database, as the database the module creates;
  #     values.charset and values.collation, as its character set and
  #     collation; values.user, as the administrator login; the root_password
  #     attachment, as the administrator's password; infra.engine_version (the
  #     major versions 5.7, 8.0 and 8.4; the service lists 5.7 as retired,
  #     running on in Extended Support, which it charges for);
  #     infra.storage.size, as the server's storage, in the sizes the module
  #     takes; infra.ha.enabled, as zone-redundant high availability; and the
  #     overrides above.
  #   refused — values.init_scripts; values.custom_config; values.user unset,
  #     or a name the service refuses as the login; an attachment to
  #     user_password; a credential on root_password other than
  #     core/referenced-secret; infra.engine_version other than the three
  #     above; infra.port other than 3306; infra.storage.type, since the
  #     module takes no disk type; a storage size the module does not take;
  #     infra.ha.enabled on a Burstable SKU; infra.ha.read_replicas above
  #     zero; and any infra.overrides key not listed above.
  #   not read — infra.port while it is 3306; infra.compute.cpu and
  #     infra.compute.memory, whose Component defaults would size a container:
  #     the service sizes the server by infra.overrides.sku_name, and a Recipe
  #     cannot tell those defaults from a value the Release wrote, so the
  #     Component's descriptions say so instead.
  #
  # Backup. This Recipe reads no core/backup attachment, and the server keeps
  # the service's automated backups for 7 days, the module's default for
  # backupRetentionDays. A core/backup attachment halts at the Manifest,
  # naming the Feature, because no FeatureRecipe for the arm capability binds
  # it. The Recipe reads attachments only through its two credential slots:
  # finding an attachment by its Feature would mean ranging over every
  # attachment, the Key Vault credential among them, whose origin is declared
  # sensitive, and the arm provider then refuses every literal parameter the
  # mapping binds.
  #
  # The service keeps the server's superuser account, azure_superuser, to
  # itself, and creates one administrator login, named here by values.user, so
  # values.user is required: with it unset there is no login to name, and
  # root, which the Component means by leaving it out, is a name the service
  # refuses for that login. The module declares no resource for a further
  # MySQL user, so the application user the Component's user_password slot is
  # for is not created, and a credential on that slot halts.
  #
  # The administrator's password is the module's administratorLoginPassword, a
  # secure parameter: the nested deployment receives a Key Vault reference
  # object in its place, which Azure Resource Manager resolves while the
  # template deploys, so no password is written into the template. The
  # attachment on root_password publishes the secret's resource ID in
  # provides.name; the vault's ID is that ID without its /secrets/<name> tail,
  # and secretName is the name. Neither the service nor the module draws a
  # password, so with nothing attached the build halts, and so it does on any
  # credential other than core/referenced-secret: another carries its value as
  # text, which would be written into the template, or carries none the
  # service could take. The service takes a password of 8 to 128 characters
  # holding three of upper-case letters, lower-case letters, digits and other
  # characters; the build never sees the secret's value, so the secret the
  # operator creates holds such a password. The assertions read the slot, but
  # an assertion does not see what an attachment publishes; the mapping halts
  # where the published ID is no Key Vault secret's.
  assertions:
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "delegated_subnet_id" "private_dns_zone_id" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release places its flexible server in the operator's own delegated subnet and private DNS zone, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.delegated_subnet_id and infra.overrides.private_dns_zone_id in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/virtualNetworks/[^/]+/subnets/[^/]+$` $o.delegated_subnet_id) -}}
      {{- fail (printf "infra.overrides.delegated_subnet_id is %q, and the flexible server takes the subnet it is placed in as the subnet's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>, a subnet delegated to Microsoft.DBforMySQL/flexibleServers" $o.delegated_subnet_id) -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/privateDnsZones/[^/]+\.mysql\.database\.azure\.com$` $o.private_dns_zone_id) -}}
      {{- fail (printf "infra.overrides.private_dns_zone_id is %q, and a flexible server with private access resolves through a private DNS zone whose name ends in .mysql.database.azure.com, given as the zone's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/privateDnsZones/<name>.mysql.database.azure.com" $o.private_dns_zone_id) -}}
      {{- end -}}
    overrides_known: >-
      {{- $known := list "delegated_subnet_id" "private_dns_zone_id" "sku_name" "location" "zone" "server_configuration" "tags" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the flexible server in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads delegated_subnet_id, private_dns_zone_id, sku_name, location, zone, server_configuration, tags and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $z := toString (optional $o "zone" "") -}}
      {{- if not (has $z (list "" "1" "2" "3")) -}}
      {{- fail (printf "infra.overrides.zone is %q, and the module takes the availability zone as 1, 2 or 3: set infra.overrides.zone to one of them, or remove it for no zone" $z) -}}
      {{- end -}}
      {{- $sc := optional $o "server_configuration" "" -}}
      {{- if not (eq (toString $sc) "") -}}
      {{- if not (kindIs "map" $sc) -}}
      {{- fail (printf "infra.overrides.server_configuration is %v, and the module takes the server's parameters as a map, one entry per parameter: write it as {<key>: {name: <parameter>, config: <value>}}" $sc) -}}
      {{- end -}}
      {{- range $k, $e := $sc -}}
      {{- if not (and (kindIs "map" $e) (typeIs "string" (optional $e "name" 0)) (typeIs "string" (optional $e "config" 0)) (eq (len $e) 2)) -}}
      {{- fail (printf "infra.overrides.server_configuration.%s is %v, and each entry names one server parameter and its value as strings: write it as {name: <parameter>, config: <value>}" $k (toJson $e)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the server serves port 3306` $h) -}}
      {{- end -}}
      {{- end -}}
    # The server is named after the component, and its name is also the first
    # label of the address the service gives it under mysql.database.azure.com,
    # so it is unique across Azure; the rule the service checks it against is
    # checked here, where the name is known.
    server_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (ge (len $n) 3) (le (len $n) 63) (regexMatch `^[a-z0-9]([a-z0-9-]*[a-z0-9])?$` $n)) -}}
      {{- fail (printf "the component %q names its flexible server, and a server name holds 3 to 63 lowercase letters, digits and hyphens, beginning and ending with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The MySQL major versions the module takes that the service creates
    # servers on. The module also lists 9.3, an innovation release: the service
    # offers only its newest innovation release, as a preview it removes 30
    # days after the server is created, and 9.3 is no longer that release. A
    # version the module adds later is refused here until this Recipe names
    # it.
    engine_version_offered: >-
      {{- if not .locals.version -}}
      {{- fail (printf "infra.engine_version is %q, and this Recipe creates an Azure Database for MySQL flexible server on MySQL 5.7, 8.0 or 8.4, the versions the module takes that the service keeps, which it reads off the major version the value begins with: set infra.engine_version in the Release to one of them, such as 8.4" (toString .infra.engine_version)) -}}
      {{- end -}}
    port_is_the_service_port: >-
      {{- if ne (int .infra.port) 3306 -}}
      {{- fail (printf "infra.port is %v, and Azure Database for MySQL flexible server serves MySQL on port 3306, which this Recipe publishes as port, and takes no other: remove infra.port from the Release" .infra.port) -}}
      {{- end -}}
    # The module takes the storage in GiB, from a fixed list of sizes read off
    # its main.json at the pinned version, though the service itself takes any
    # whole GiB from 20; a template binding another size fails Azure Resource
    # Manager's check of the module's parameters when it deploys. The
    # Component's default, 10Gi, sizes a container's volume.
    storage: >-
      {{- $size := toString .infra.storage.size -}}
      {{- $sizes := list "20" "32" "64" "128" "256" "512" "1024" "2048" "4096" "8192" "16384" -}}
      {{- if not (and (regexMatch `^[0-9]+Gi$` $size) (has (trimSuffix "Gi" $size) $sizes)) -}}
      {{- fail (printf "infra.storage.size is %q, and the module this Recipe sources provisions a flexible server's storage at 20, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192 or 16384 GiB alone; the Component's default sizes a container's volume: set infra.storage.size in the Release to one of them, such as 20Gi, or map this component to terraform/mysql-flexible-server, which takes any whole GiB from 20" $size) -}}
      {{- end -}}
      {{- with optional .infra.storage "type" "" -}}
      {{- fail (printf "infra.storage.type is %q, and the module this Recipe sources provisions the flexible server's storage with no disk type to choose: remove infra.storage.type from the Release" .) -}}
      {{- end -}}
    sku_and_ha: >-
      {{- if not (regexMatch `^(B|GP|MO)_Standard_[A-Za-z0-9_]+$` .locals.sku) -}}
      {{- fail (printf "infra.overrides.sku_name is %q, and a flexible server's SKU is its tier and compute size, B_Standard_, GP_Standard_ or MO_Standard_ followed by the size, such as GP_Standard_D2ds_v4: set infra.overrides.sku_name to one, or remove it for that default" .locals.sku) -}}
      {{- end -}}
      {{- if and .infra.ha.enabled (hasPrefix "B_" .locals.sku) -}}
      {{- fail (printf "infra.ha.enabled is true, and infra.overrides.sku_name is %s, a Burstable SKU, which Azure Database for MySQL flexible server gives no high availability: set infra.overrides.sku_name to a General Purpose or Memory Optimized SKU, such as GP_Standard_D2ds_v4, or infra.ha.enabled to false" .locals.sku) -}}
      {{- end -}}
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions the one server a call of the module creates; a read replica is a server of its own: set infra.ha.read_replicas to 0" .infra.ha.read_replicas) -}}
      {{- end -}}
    # The service runs no initialisation scripts and reads no configuration
    # file of the reader's; its server settings are server parameters. The
    # administrator logins the service refuses are refused here first, where the
    # build can name the key; it takes a login of at most 32 characters.
    values_the_service_cannot_apply: >-
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and a flexible server runs none: remove values.init_scripts from the Aggregate and run them against the server once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and a flexible server reads none: its server settings are server parameters, which the Release names in infra.overrides.server_configuration; remove values.custom_config from the Aggregate" -}}
      {{- end -}}
      {{- $u := toString (optional .values "user" "") -}}
      {{- if not $u -}}
      {{- fail "values.user is unset, and Azure Database for MySQL flexible server creates one administrator login, which values.user names, while root, the account leaving it unset asks for, is a name the service refuses for that login: set values.user in the Aggregate to the administrator's login" -}}
      {{- end -}}
      {{- if or (has (lower $u) (list "azure_superuser" "admin" "administrator" "root" "guest" "sa" "public")) (gt (len $u) 32) -}}
      {{- fail (printf "values.user is %q, the flexible server's administrator login, and the service takes as that login a name of at most 32 characters other than azure_superuser, admin, administrator, root, guest, sa and public: set values.user in the Aggregate to such a name" $u) -}}
      {{- end -}}
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "user_password" -}}
      {{- fail "a credential is attached to the user_password slot, and this Recipe creates the one administrator login values.user names, whose password is the root_password attachment; the module declares no resource for a further MySQL user: remove the attachment" -}}
      {{- end -}}
      {{- if not (hasKey $f "root_password") -}}
      {{- fail "the root_password slot is empty, and neither Azure Database for MySQL flexible server nor the module this Recipe sources draws the administrator's password: attach core/referenced-secret to the root_password slot, naming the Key Vault secret that holds it, and bind it to arm/key-vault-secret in the Manifest" -}}
      {{- end -}}
      {{- $ty := first (splitList ":" (toString (optional $f.root_password "type" ""))) -}}
      {{- if ne $ty "core/referenced-secret" -}}
      {{- fail (printf "the root_password slot is filled by %s, and this Recipe hands the flexible server its administrator's password as a Key Vault reference to a secret the attachment names, which core/referenced-secret publishes through arm/key-vault-secret; another credential either carries its value as text, which would be written into the template, or carries none the service could take: attach core/referenced-secret to the root_password slot, bound to arm/key-vault-secret in the Manifest" (default "an attachment of no type" $ty)) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. host reads the nested deployment this component
  # becomes, whose symbolic name is the instance id folded into words, and
  # names the module's fqdn output, the server's name under
  # mysql.database.azure.com, which resolves to its private address through
  # the private DNS zone; Azure Resource Manager evaluates the expression when
  # the template deploys, so it resolves for a consumer in the same template,
  # through the link for a consumer in another arm template, and as text on
  # another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record for it, so the operator points the name at the server outside
  # the Release. A consumer in the same template receives the name as well, and
  # a name carries no reference for Azure Resource Manager to order the
  # consumer after the server by; a later syncWave on the consumer's boundary,
  # sharing this boundary's directory, orders the two.
  #
  # port is 3306, where the service serves MySQL. user is the administrator
  # login values.user names, and database the database the module creates.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[reference('{{ capitalizedWords .context.instance_id }}').outputs.fqdn.value]{{ end }}"
    port: "3306"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "mysql"

  # Each key binds the module parameter of the same name. The server is named
  # after the component, as the other managed Recipes name theirs. The
  # administrator's password is the Key Vault reference object Azure Resource
  # Manager reads in a secure parameter's place: the vault's ID and the
  # secret's name, both taken from the one resource ID the attachment
  # publishes. The mapping reads the attachment by those exact leaves alone:
  # a values mapping reading a value an attachment declares sensitive, or a
  # whole map holding one, has every literal it binds refused, and the
  # root_password attachment declares its origin sensitive.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    {{- $id := toString .features.root_password.provides.name }}
    {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+/secrets/[^/]+$` $id) }}
    {{- fail (printf "the root_password slot of %q is filled by an attachment that publishes no Key Vault secret resource ID, and the administrator's password is handed to the flexible server as a reference to that secret: bind core/referenced-secret to arm/key-vault-secret in the Manifest" .context.instance_id) }}
    {{- end }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    skuName: "{{ trimPrefix (printf "%s_" (first (splitList "_" .locals.sku))) .locals.sku }}"
    tier: "{{ get (dict "B" "Burstable" "GP" "GeneralPurpose" "MO" "MemoryOptimized") (first (splitList "_" .locals.sku)) }}"
    version: "{{ .locals.version }}"
    storageSizeGB: {{ int (trimSuffix "Gi" (toString .infra.storage.size)) }}
    administratorLogin: "{{ .values.user }}"
    administratorLoginPassword:
      reference:
        keyVault:
          id: "{{ regexReplaceAll `/secrets/[^/]+$` $id "" }}"
        secretName: "{{ regexFind `[^/]+$` $id }}"
    delegatedSubnetResourceId: "{{ $o.delegated_subnet_id }}"
    privateDnsZoneResourceId: "{{ $o.private_dns_zone_id }}"
    publicNetworkAccess: Disabled
    {{- if .infra.ha.enabled }}
    highAvailability: ZoneRedundant
    storageAutoGrow: Enabled
    {{- else }}
    highAvailability: Disabled
    {{- end }}
    availabilityZone: {{ with optional $o "zone" "" }}{{ . }}{{ else }}-1{{ end }}
    databases:
      - name: "{{ .values.database }}"
        charset: "{{ .values.charset }}"
        collation: "{{ .values.collation }}"
    {{- with optional $o "server_configuration" "" }}
    configurations:
      {{- range $k, $e := . }}
      - name: "{{ $e.name }}"
        value: "{{ $e.config }}"
        source: user-override
      {{- end }}
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
