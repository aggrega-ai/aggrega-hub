apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-front-door
  version: 1.0.0
  # No metadata.license: this Recipe pins and vendors no third-party module.
  # The template it writes is its own, and the Front Door profile that
  # template declares is a service the reader contracts for directly with
  # Microsoft, under Azure's terms.
  description: >
    Azure Front Door: one Standard or Premium profile with one endpoint
    routing every path to one origin, declared by an Azure Resource Manager
    template this Recipe writes, not by Microsoft's Azure Verified Modules
    module avm/res/cdn/profile, whose template at 0.20.0 fails the
    catalog's check against the Azure Resource Manager schemas.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-front-door where it deploys
    Terraform. The profile runs on Standard_AzureFrontDoor unless
    infra.overrides.sku_name is Premium_AzureFrontDoor, at the location
    global. The origin's host name is the host the upstream connection
    publishes; Front Door forwards to it over HTTPS on port 443, redirects
    HTTP to HTTPS and caches nothing. infra.waf_policy_id associates the
    operator's web application firewall policy with the endpoint.

    host is an expression for the host name the service gives the
    endpoint; endpoint is https:// and that name. A component name the
    service refuses halts naming the component, an upstream publishing no
    host halts naming the connection, and any infra.overrides key not
    listed, resource_group_name, location, enable_telemetry and host halt
    naming the key, as does sku_name given in a form it does not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/network/azure-front-door:1.0.0

  # Why the template is the catalog's own. Microsoft's Azure Verified Modules
  # module avm/res/cdn/profile at 0.20.0 takes every setting this Recipe
  # writes, the web application firewall policy by its resource ID among
  # them. Its compiled template, the one its registry publishes, always
  # carries the nested template of its security policy, written as
  # Microsoft.Cdn/profiles/securityPolicies at API version 2025-04-15 with
  # the policy and its associations as literal properties, and the catalog's
  # check of every rendered template against the Azure Resource Manager
  # schemas refuses both properties there, so every build wrapping the module
  # fails that check whether or not a policy is named. The resources below
  # are those the module declares for one endpoint, written at API version
  # 2026-10-01, a version the pinned schemas cover.

  locals:
    # The resource's symbolic name in the boundary's template: the instance's
    # name in capitalized words, so two instances declare two resources.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # The tier the profile runs on, or empty for a value that is not a
    # string, which the assertion below refuses.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard_AzureFrontDoor" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   sku_name  - string (the profile's sku.name: Standard_AzureFrontDoor or
  #               Premium_AzureFrontDoor; default Standard_AzureFrontDoor)
  #   tags      - map[string]string (the profile's and the endpoint's tags)
  # host halts by name, as any key not listed does: the route serves only
  # the endpoint's own host name, and this Recipe offers no custom domain,
  # so a name set here would be one Front Door refuses a request for.
  # resource_group_name halts by name: the
  # template creates the profile in the resource group it is deployed to,
  # which nothing in it names. location halts by name: a Front Door profile
  # and its endpoint sit at the location global, which the template writes,
  # and in no region. enable_telemetry halts by name: the template is the
  # catalog's own and deploys no telemetry resource to turn on or off.
  #
  # sku_name and tags are the keys terraform/azure-front-door reads for the
  # same concepts, under the same spelling; that Recipe also reads
  # resource_group_name, since Terraform names the group a resource is
  # created in, and refuses host by name as this one does. sku_name is the
  # key every Azure Recipe reads for the tier a service is provisioned at.
  #
  # sku_name. Microsoft offers Azure Front Door in two tiers, spelt as the
  # service spells them: Standard_AzureFrontDoor, unless set, and
  # Premium_AzureFrontDoor, which adds managed rule sets in a web
  # application firewall policy, bot protection and Private Link connections
  # to origins. The profile resource takes other names, the tiers of Azure
  # CDN, with which a profile serves no Front Door endpoint, so any other
  # value halts below by name. Microsoft documents an upgrade from Standard to
  # Premium as an operation of its own, and no downgrade: going back to
  # Standard takes a new profile.
  #
  # Infra keys of the Component:
  #   waf_policy_id. Unset, the template declares no security policy, and no
  #   web application firewall inspects the endpoint's requests. Set, it
  #   declares one, of type WebApplicationFirewall, associating the policy
  #   the ID names with the endpoint's own domain for every path, /*. The
  #   policy is the operator's: the template references it and never
  #   creates or changes it, so an ID naming no policy fails when the
  #   template deploys, and the policy has to be of the profile's tier:
  #   Microsoft's tier-upgrade page implies a policy and its profile share
  #   one. The Component refuses an ID not of a policy's form.
  #
  # The upstream connection. The Component's one_upstream assertion keeps a
  # single connection on the socket, and the compiler refuses none, as the
  # socket is required. The template's origin takes the host that
  # connection's target publishes as its host name, and the same name as the
  # Host header Front Door sends, which origins such as Web Apps and Blob
  # Storage require by default. The origin is reached over HTTPS on port 443,
  # plain HTTP on port 80 being unused, and Front Door checks that the
  # certificate it presents carries that name. The host is copied into the
  # template as the target publishes it: a name, or an expression Resource
  # Manager resolves when the template deploys, for a target in the same
  # template. A target that publishes no host, such as core/compute/server,
  # halts the build naming the connection.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's documentation and the
  # pinned Azure Resource Manager schemas:
  #   honoured — infra.waf_policy_id, the upstream connection's host and the
  #     overrides above. The Component declares no values.
  #   refused — a component name the service refuses; an upstream target
  #     publishing no host; infra.overrides.resource_group_name, location,
  #     enable_telemetry and host; sku_name given as anything but
  #     Standard_AzureFrontDoor or Premium_AzureFrontDoor; and any
  #     infra.overrides key not listed above.
  #   not read — none.
  #
  # Credentials. Front Door holds no credential a consumer needs: clients
  # reach the endpoint anonymously over HTTPS, and authenticating them is the
  # origin's work or the web application firewall policy's. The origin is
  # reached without one, so nothing is published but the endpoint's address.
  # Backup. Front Door keeps no data of its own, only its configuration,
  # which this template declares, so no backup is configured.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "tags" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Front Door profile in the resource group the template is deployed to, which nothing in the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "location" -}}
      {{- fail "infra.overrides.location is set, and an Azure Front Door profile and its endpoint sit at the location global, which this Recipe writes, in no region: remove infra.overrides.location from the Release" -}}
      {{- end -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe writes its own template, which deploys no telemetry resource to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and this Recipe's route serves only the endpoint's own host name and offers no custom domain, so a name set here would be one Front Door refuses a request for: remove infra.overrides.host from the Release, and read the host the endpoint publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name and tags from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $s := optional (optional .infra "overrides" dict) "sku_name" "Standard_AzureFrontDoor" -}}
      {{- if not (has $s (list "Standard_AzureFrontDoor" "Premium_AzureFrontDoor")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Microsoft offers Azure Front Door in the tiers Standard_AzureFrontDoor and Premium_AzureFrontDoor, spelt as written here: set infra.overrides.sku_name to one of them, or remove it for Standard_AzureFrontDoor" $s) -}}
      {{- end -}}
    # The profile, its endpoint, origin group, origin, route and security
    # policy are all named after the component. The endpoint's name is the
    # narrowest bound: the azurerm provider's validator for it
    # (internal/services/cdn/validate/front_door_endpoint_name.go, v5.14.0)
    # takes 2 to 46 letters, digits and hyphens, starting and ending with a
    # letter or digit, and the endpoint's host name is that name, a hyphen
    # and a 16-character hash, so 46 + 1 + 16 = 63 fills the DNS label limit.
    # Microsoft Learn's resource name rules have no row for afdEndpoints; they
    # give the profile 1 to 260 and the origin group, origin and route 1 to
    # 50, with the same characters, and name no bound for the security
    # policy, so 2 to 46 fits each. It is checked here, where the name is
    # known.
    front_door_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9][A-Za-z0-9-]{0,44}[A-Za-z0-9]$` $n) -}}
      {{- fail (printf "the component %q names its Front Door profile, endpoint, origin group, origin, route and security policy, and the endpoint takes 2 to 46 letters, digits and hyphens, starting and ending with a letter or digit (the azurerm provider's endpoint name validator; the endpoint's host name adds a hyphen and a 16-character hash, which keeps it within the 63 characters of a DNS label): rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service gives the endpoint a host name of
  # its own, the endpoint's name followed by a hash Front Door generates,
  # under its environment's domain, z01.azurefd.net in the public cloud, and
  # the endpoint resource reports it as its read-only hostName. The outputs
  # of the nested deployment carry it, and host reads that output; endpoint
  # is https:// followed by it. Azure Resource Manager evaluates each expression when the
  # template deploys, after the endpoint exists, so it resolves for a
  # consumer in the same template, through the link for a consumer in
  # another arm template, and as text on another target.
  #
  # No infra.overrides.host: Front Door refuses a request whose host is not
  # one of its route's domains, and this route's one domain is the
  # endpoint's own, so no other name would reach it.
  provides:
    host: "[reference('{{ .locals.symbol }}').outputs.hostName.value]"
    endpoint: "[format('https://{0}', reference('{{ .locals.symbol }}').outputs.hostName.value)]"

  # The fragment the provider assembles into the boundary's template: one
  # nested deployment, named after its symbolic name and the deployment it
  # runs in, holding the resources below in a template of its own, which
  # takes the origin's host name as its one parameter, evaluated in the
  # boundary's template, so a host published as an expression over a resource
  # there resolves.
  #
  # The profile, at the location global, with the tier above, its tags, and
  # 60 seconds for an origin to answer a forwarded request. The endpoint,
  # also global, enabled, its host name's hash shared by endpoints of its
  # name across the Microsoft Entra tenant, the service's default. The origin
  # group, its load balancing over 4 samples, 3 of them successful, with 50
  # milliseconds of added latency, session affinity off and no health probe
  # settings, so no health probe is sent, which Microsoft documents as open
  # to an origin group holding a single origin. The
  # origin, enabled, at priority 1 and weight 1000, the host name and Host
  # header above, ports 80 and 443, its certificate's name checked. The
  # route, enabled, linking the endpoint's own domain to the origin group for
  # every path, taking HTTP and HTTPS, redirecting HTTP to HTTPS and
  # forwarding over HTTPS alone, with no rule set and no cache
  # configuration, which leaves caching off.
  #
  # The security policy, while infra.waf_policy_id is set. Its parameters
  # object, of type WebApplicationFirewall, names the policy and associates it
  # with the endpoint for every path. The template writes that object in its
  # variables and the policy reads it with variables('wafPolicyParameters'),
  # because the pinned schemas describe the parameters of every API version
  # of Microsoft.Cdn/profiles/securityPolicies as a type whose base, closed to
  # every property but type, refuses wafPolicy and associations, the two
  # properties a WebApplicationFirewall policy takes; Resource Manager takes
  # them, and the catalog's check lists this as a place where it is stricter
  # than Resource Manager. A value written whole as an expression is not held
  # to the schemas.
  artifacts:
    front-door.yaml: |
      {{- $id := .context.instance_id }}
      {{- $o := optional .infra "overrides" dict }}
      {{- $api := "2026-10-01" }}
      {{- $origin := "" }}
      {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "upstream" }}
      {{- $p := optional $edge "provides" dict }}
      {{- if not (hasKey $p "host") }}
      {{- fail (printf "the upstream connection %q of %q reaches %q, which publishes no host, and Azure Front Door forwards every request to the host its upstream publishes: wire upstream in the Aggregate to a component that publishes host" $alias $id $edge.target) }}
      {{- end }}
      {{- $origin = $p.host }}
      {{- end }}
      {{- end }}
      {{- $profileId := printf "[resourceId('Microsoft.Cdn/profiles', '%s')]" $id }}
      {{- $endpointId := printf "[resourceId('Microsoft.Cdn/profiles/afdEndpoints', '%s', '%s')]" $id $id }}
      {{- $groupId := printf "[resourceId('Microsoft.Cdn/profiles/originGroups', '%s', '%s')]" $id $id }}
      {{- $originId := printf "[resourceId('Microsoft.Cdn/profiles/originGroups/origins', '%s', '%s', '%s')]" $id $id $id }}
      {{- $profile := dict "type" "Microsoft.Cdn/profiles" "apiVersion" $api "name" $id "location" "global" "sku" (dict "name" .locals.sku) "properties" (dict "originResponseTimeoutSeconds" 60) }}
      {{- $endpoint := dict "type" "Microsoft.Cdn/profiles/afdEndpoints" "apiVersion" $api "name" (printf "[format('{0}/{1}', '%s', '%s')]" $id $id) "location" "global" "dependsOn" (list $profileId) "properties" (dict "autoGeneratedDomainNameLabelScope" "TenantReuse" "enabledState" "Enabled") }}
      {{- with optional $o "tags" "" }}{{ $_ := set $profile "tags" . }}{{ $_ := set $endpoint "tags" . }}{{ end }}
      {{- $group := dict "type" "Microsoft.Cdn/profiles/originGroups" "apiVersion" $api "name" (printf "[format('{0}/{1}', '%s', '%s')]" $id $id) "dependsOn" (list $profileId) "properties" (dict "loadBalancingSettings" (dict "sampleSize" 4 "successfulSamplesRequired" 3 "additionalLatencyInMilliseconds" 50) "sessionAffinityState" "Disabled") }}
      {{- $originProperties := dict "hostName" "[parameters('originHostName')]" "originHostHeader" "[parameters('originHostName')]" "httpPort" 80 "httpsPort" 443 "priority" 1 "weight" 1000 "enabledState" "Enabled" "enforceCertificateNameCheck" true }}
      {{- $originResource := dict "type" "Microsoft.Cdn/profiles/originGroups/origins" "apiVersion" $api "name" (printf "[format('{0}/{1}/{2}', '%s', '%s', '%s')]" $id $id $id) "dependsOn" (list $groupId) "properties" $originProperties }}
      {{- $routeProperties := dict "originGroup" (dict "id" $groupId) "supportedProtocols" (list "Http" "Https") "patternsToMatch" (list "/*") "forwardingProtocol" "HttpsOnly" "linkToDefaultDomain" "Enabled" "httpsRedirect" "Enabled" "enabledState" "Enabled" }}
      {{- $route := dict "type" "Microsoft.Cdn/profiles/afdEndpoints/routes" "apiVersion" $api "name" (printf "[format('{0}/{1}/{2}', '%s', '%s', '%s')]" $id $id $id) "dependsOn" (list $endpointId $originId) "properties" $routeProperties }}
      {{- $resources := list $profile $endpoint $group $originResource $route }}
      {{- $template := dict "$schema" "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#" "contentVersion" "1.0.0.0" "parameters" (dict "originHostName" (dict "type" "string")) }}
      {{- with optional .infra "waf_policy_id" "" }}
      {{- $association := dict "domains" (list (dict "id" $endpointId)) "patternsToMatch" (list "/*") }}
      {{- $_ := set $template "variables" (dict "wafPolicyParameters" (dict "type" "WebApplicationFirewall" "wafPolicy" (dict "id" .) "associations" (list $association))) }}
      {{- $resources = append $resources (dict "type" "Microsoft.Cdn/profiles/securityPolicies" "apiVersion" $api "name" (printf "[format('{0}/{1}', '%s', '%s')]" $id $id) "dependsOn" (list $endpointId) "properties" (dict "parameters" "[variables('wafPolicyParameters')]")) }}
      {{- end }}
      {{- $_ := set $template "resources" $resources }}
      {{- $_ := set $template "outputs" (dict "hostName" (dict "type" "string" "value" (printf "[reference(%s, '%s').hostName]" (trimSuffix "]" (trimPrefix "[" $endpointId)) $api))) }}
      {{- $nested := dict "type" "Microsoft.Resources/deployments" "apiVersion" "2025-04-01" "name" (printf "[format('%s-{0}', uniqueString(deployment().name))]" .locals.symbol) "properties" (dict "mode" "Incremental" "expressionEvaluationOptions" (dict "scope" "inner") "parameters" (dict "originHostName" (dict "value" $origin)) "template" $template) }}
      resources:
        {{ .locals.symbol }}: {{ toJson $nested }}
