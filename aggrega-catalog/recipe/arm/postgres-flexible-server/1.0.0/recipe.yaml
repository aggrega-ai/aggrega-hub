apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: postgres-flexible-server
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # PostgreSQL flexible server module: the third-party template this Recipe pins
  # and wraps in the output. The flexible server it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  description: >
    PostgreSQL on Azure Database for PostgreSQL flexible server, one server
    with private access in a delegated subnet of the operator's virtual
    network, deployed from an Azure Resource Manager template through
    Microsoft's Azure Verified Modules module avm/res/db-for-postgre-sql/flexible-server
    at 0.16.2, MIT, fetched from its git repository at that tag; entity.lock
    pins the tag's commit and archive digest.

    Reach for it where the Release deploys an Azure Resource Manager template
    and the database is a flexible server in the operator's subscription;
    reach for terraform/postgres-flexible-server where the Release deploys
    Terraform. The delegated subnet and private DNS zone are the operator's,
    named in infra.overrides, and none is emitted: other servers share the
    subnet and the zone. The module deploys a telemetry resource by default,
    reporting to Microsoft; this Recipe turns it off.

    The administrator values.user names takes the password from the Key Vault
    secret a core/referenced-secret attachment on the password slot names,
    bound to arm/key-vault-secret, handed to the server as a Key Vault
    reference, so the template carries no password; with nothing attached, or
    another credential, the build halts naming the slot. host publishes an
    expression for the server's FQDN, or infra.overrides.host; port is 5432.
    Init scripts, a configuration file, replicas, another port and a storage
    size the service does not offer halt naming the key; compute is not read,
    because infra.overrides.sku_name sizes the server.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/datastore/postgres:1.0.0

  # The module's directory at the tag its registry publishes as version 0.16.2.
  # The registry's tag is the git tag named here; `aggrega pin` resolves it to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes. module_subdir names the
  # module's directory in a repository that holds every Azure Verified Modules
  # module; the provider reads its main.json, the compiled template the module
  # commits, and wraps it as one nested deployment.
  source:
    kind: git-repository
    url: https://github.com/Azure/bicep-registry-modules.git
    ref: avm/res/db-for-postgre-sql/flexible-server/0.16.2
    module_subdir: avm/res/db-for-postgre-sql/flexible-server

  locals:
    # The PostgreSQL major version infra.engine_version begins with: 16 for 16
    # or 16.4. The service runs the newest minor version of that major version.
    major: '{{ regexFind `^[0-9]+` (toString .infra.engine_version) }}'
    # The SKU, infra.overrides.sku_name or GP_Standard_D2ds_v5: two vCores of
    # the General Purpose tier. The tier is the prefix before the first
    # underscore, B, GP or MO, and the module takes the rest as the SKU name.
    sku: '{{ optional (optional .infra "overrides" dict) "sku_name" "GP_Standard_D2ds_v5" }}'
    # The name the Release gives the server under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   delegated_subnet_id   - string (delegatedSubnetResourceId), required
  #   private_dns_zone_id   - string (privateDnsZoneArmResourceId), required
  #   sku_name              - string (skuName and tier; default "GP_Standard_D2ds_v5")
  #   location              - string (location; the module's default is the resource group's)
  #   zone                  - string (availabilityZone, 1, 2 or 3; default none)
  #   server_configuration  - map[string]{name: string, config: string} (configurations)
  #   tags                  - map[string]string (tags)
  #   host                  - string (published as provides.host; not passed to the module)
  # resource_group_name and enable_telemetry are not read: the template deploys
  # into the resource group the template is deployed to, and telemetry is always
  # off. infra.overrides.enable_telemetry: true halts by name rather than being
  # ignored.
  #
  # Each is named by the module parameter it sets, given in brackets, save host,
  # which the other managed PostgreSQL Recipes read under the same name for the
  # same concept. delegated_subnet_id and private_dns_zone_id are required:
  # they place the server in the operator's network, and this Recipe never
  # chooses either. The server takes private access in delegated_subnet_id, a
  # subnet's resource ID, whose subnet is delegated to
  # Microsoft.DBforPostgreSQL/flexibleServers and holds no other resource type;
  # its name resolves through private_dns_zone_id, the resource ID of a private
  # DNS zone whose name ends in .postgres.database.azure.com, linked to every
  # virtual network a client resolves the server from. This Recipe emits
  # neither: the subnet serves every flexible server placed in it, and the zone
  # every server resolving through it.
  #
  # server_configuration carries the server parameters a raw configuration
  # file would, one entry per parameter, as
  # {<key>: {name: <parameter>, config: <value>}}; the module's configurations
  # entry takes the parameter's name and its value. It is also how an extension
  # is made available: the service creates in a database only the extensions
  # named in the azure.extensions parameter, and loads the libraries an
  # extension needs at start from shared_preload_libraries.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: a maintenance window on Sundays from 01:00 UTC;
  # geo-redundant backup enabled, which the region of the server must offer;
  # advanced threat protection on; and storage that does not grow on its own
  # as it fills. These are replaced: authConfig, whose default enables Microsoft
  # Entra authentication and disables password authentication, so the
  # administrator's password would reach nothing; firewallRules, which this
  # mapping leaves out because a server in a virtual network takes none;
  # highAvailability, whose default is zone redundant and which this mapping
  # passes from infra.ha.enabled; and availabilityZone, a required parameter
  # that is -1, no zone, unless infra.overrides.zone names one.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation:
  #   honoured — values.database; values.user, as the administrator login;
  #     values.encoding and values.locale, as the database's charset and
  #     collation; infra.engine_version (the major version, 13 to 18, which the
  #     service creates new servers on); infra.storage.size, as the server's
  #     storage, 32 GiB or more; infra.storage.type, as the module's
  #     storageType (Premium_LRS, PremiumV2_LRS or UltraSSD_LRS), which the
  #     storage_type assertion checks; infra.ha.enabled, as zone-redundant
  #     high availability; and the overrides above.
  #   refused — values.init_scripts; values.custom_config; values.user where
  #     the service refuses it as the login; infra.port other than 5432;
  #     infra.ha.enabled on a Burstable SKU; infra.ha.read_replicas above
  #     zero; an attachment to app_user_password; infra.credentials supplied
  #     and any infra.credentials_secret, which configure the controller-driven
  #     realization; and a password as set out below.
  #   not read — infra.port while it is 5432; infra.compute.cpu and
  #     infra.compute.memory, whose Component defaults would size a container:
  #     the service sizes the server by infra.overrides.sku_name, and a Recipe
  #     cannot tell those defaults from a value the Release wrote, so the
  #     Component's descriptions say so instead. values.app_user and
  #     infra.control_plane_present configure other realizations, as their
  #     descriptions say. infra.credentials and infra.credentials_secret while
  #     they hold the Component's defaults. An attachment other than the
  #     password slot's: this Recipe reads none, and no FeatureRecipe on this
  #     capability binds core/backup, so one halts at the Manifest. The module's
  #     backupRetentionDays stands at its default, 7 days.
  #
  # The administrator's password is the module's administratorLoginPassword, a
  # secure parameter: the nested deployment receives a Key Vault reference
  # object in its place, which Azure Resource Manager resolves while the
  # template deploys, so no password is written into the template. The
  # attachment on the password slot publishes the secret's resource ID in
  # provides.name; the vault's ID is that ID without its /secrets/<name> tail,
  # and secretName is the name. Neither the service nor the module draws a
  # password, so with nothing attached the build halts, and so it does on any
  # credential other than core/referenced-secret: another carries its value as
  # text, which would be written into the template, or carries none the
  # service could take. The assertions read the slot, which the sensitive-value
  # rule of the mapping does not reach, but an assertion does not see what an
  # attachment publishes; the mapping reads the attachment by its exact leaves
  # alone and halts where the published ID is no Key Vault secret's.
  assertions:
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k := list "delegated_subnet_id" "private_dns_zone_id" -}}
      {{- $v := optional $o $k "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "this Release places its flexible server in the operator's own delegated subnet and private DNS zone, and this Recipe never chooses either, but infra.overrides.%s carries none: set infra.overrides.delegated_subnet_id and infra.overrides.private_dns_zone_id in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/virtualNetworks/[^/]+/subnets/[^/]+$` $o.delegated_subnet_id) -}}
      {{- fail (printf "infra.overrides.delegated_subnet_id is %q, and the flexible server takes the subnet it is placed in as the subnet's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>, a subnet delegated to Microsoft.DBforPostgreSQL/flexibleServers" $o.delegated_subnet_id) -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/privateDnsZones/[^/]+\.postgres\.database\.azure\.com$` $o.private_dns_zone_id) -}}
      {{- fail (printf "infra.overrides.private_dns_zone_id is %q, and a flexible server with private access resolves through a private DNS zone whose name ends in .postgres.database.azure.com, given as the zone's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/privateDnsZones/<name>.postgres.database.azure.com" $o.private_dns_zone_id) -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if eq (toString (optional $o "enable_telemetry" "")) "true" -}}
      {{- fail "infra.overrides.enable_telemetry is true, and this Recipe turns the module's telemetry off in every template it writes: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- $z := toString (optional $o "zone" "") -}}
      {{- if not (has $z (list "" "1" "2" "3")) -}}
      {{- fail (printf "infra.overrides.zone is %q, and the module takes the availability zone as 1, 2 or 3: set infra.overrides.zone to one of them, or remove it for no zone" $z) -}}
      {{- end -}}
      {{- $sc := optional $o "server_configuration" "" -}}
      {{- if not (eq (toString $sc) "") -}}
      {{- if not (kindIs "map" $sc) -}}
      {{- fail (printf "infra.overrides.server_configuration is %v, and the module takes the server's parameters as a map, one entry per parameter: write it as {<key>: {name: <parameter>, config: <value>}}" $sc) -}}
      {{- end -}}
      {{- range $k, $e := $sc -}}
      {{- if not (and (kindIs "map" $e) (typeIs "string" (optional $e "name" 0)) (typeIs "string" (optional $e "config" 0)) (eq (len $e) 2)) -}}
      {{- fail (printf "infra.overrides.server_configuration.%s is %v, and each entry names one server parameter and its value as strings: write it as {name: <parameter>, config: <value>}" $k (toJson $e)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the server serves port 5432` $h) -}}
      {{- end -}}
      {{- end -}}
    # The server is named after the component, and its name is also the first
    # label of the address the service gives it under
    # postgres.database.azure.com, so it is unique across Azure; the rule the
    # service checks it against is checked here, where the name is known.
    server_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$` $n) -}}
      {{- fail (printf "the component %q names its flexible server, and a server name holds 3 to 63 lowercase letters, digits and hyphens, beginning and ending with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The PostgreSQL major versions the service creates new servers on, read off
    # its supported-versions page; 11 and 12 run in extended support on servers
    # that already exist, though the module still lists them. A version it adds
    # later is refused here until this list names it.
    engine_version_offered: >-
      {{- if not (has .locals.major (list "13" "14" "15" "16" "17" "18")) -}}
      {{- fail (printf "infra.engine_version is %q, and Azure Database for PostgreSQL flexible server creates new servers on PostgreSQL 13 to 18, which this Recipe reads off the major version the value begins with: set infra.engine_version in the Release to one of them, such as 16" (toString .infra.engine_version)) -}}
      {{- end -}}
    port_is_the_service_port: >-
      {{- if ne (int .infra.port) 5432 -}}
      {{- fail (printf "infra.port is %v, and Azure Database for PostgreSQL flexible server serves PostgreSQL on port 5432, which this Recipe publishes as port, and its connection pooler on 6432; neither moves: remove infra.port from the Release" .infra.port) -}}
      {{- end -}}
    # The module takes the storage in GiB and its smallest server is 32 GiB; the
    # Component's default, 10Gi, sizes a container's volume.
    storage: >-
      {{- $size := toString .infra.storage.size -}}
      {{- if not (and (hasSuffix "Gi" $size) (regexMatch `^[0-9]+Gi$` $size) (ge (int (trimSuffix "Gi" $size)) 32)) -}}
      {{- fail (printf "infra.storage.size is %q, and a flexible server's storage is given in whole gibibytes from 32Gi; the Component's default sizes a container's volume: set infra.storage.size in the Release to a size from 32Gi, such as 32Gi" $size) -}}
      {{- end -}}
    # The module's storageType parameter allows these three values, read off its
    # main.json at the pinned tag; the Component leaves the value unset, and
    # then the module's own default stands.
    storage_type: >-
      {{- with optional .infra.storage "type" "" -}}
      {{- if not (has (toString .) (list "Premium_LRS" "PremiumV2_LRS" "UltraSSD_LRS")) -}}
      {{- fail (printf "infra.storage.type is %q, and the module this Recipe sources takes the flexible server's storage type as Premium_LRS, PremiumV2_LRS or UltraSSD_LRS: set infra.storage.type in the Release to one of them, or remove it for the module's default" (toString .)) -}}
      {{- end -}}
      {{- end -}}
    sku_and_ha: >-
      {{- if not (regexMatch `^(B|GP|MO)_Standard_[A-Za-z0-9_]+$` .locals.sku) -}}
      {{- fail (printf "infra.overrides.sku_name is %q, and a flexible server's SKU is its tier and compute size, B_Standard_, GP_Standard_ or MO_Standard_ followed by the size, such as GP_Standard_D2ds_v5: set infra.overrides.sku_name to one, or remove it for that default" .locals.sku) -}}
      {{- end -}}
      {{- if and .infra.ha.enabled (hasPrefix "B_" .locals.sku) -}}
      {{- fail (printf "infra.ha.enabled is true, and infra.overrides.sku_name is %s, a Burstable SKU, which Azure Database for PostgreSQL flexible server gives no zone-redundant high availability: set infra.overrides.sku_name to a General Purpose or Memory Optimized SKU, such as GP_Standard_D2ds_v5, or infra.ha.enabled to false" .locals.sku) -}}
      {{- end -}}
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions the one server a call of the module creates; a read replica is a server of its own: set infra.ha.read_replicas to 0" .infra.ha.read_replicas) -}}
      {{- end -}}
    # The service runs no initialisation scripts and reads no configuration
    # file of the reader's; its server settings are server parameters. The
    # administrator logins the service refuses are refused here first, where the
    # build can name the key.
    values_the_service_cannot_apply: >-
      {{- if optional .values "init_scripts" "" -}}
      {{- fail "values.init_scripts asks for scripts run when the database is first initialised, and a flexible server runs none: remove values.init_scripts from the Aggregate and run them against the server once it exists, or map this component to a realization that initialises the database itself" -}}
      {{- end -}}
      {{- if optional .values "custom_config" "" -}}
      {{- fail "values.custom_config asks for a server configuration file, and a flexible server reads none: its server settings are server parameters, which the Release names in infra.overrides.server_configuration; remove values.custom_config from the Aggregate" -}}
      {{- end -}}
      {{- $u := lower (toString .values.user) -}}
      {{- if or (has $u (list "azure_superuser" "azure_pg_admin" "admin" "administrator" "root" "guest" "public")) (hasPrefix "pg_" $u) -}}
      {{- fail (printf "values.user is %q, the flexible server's administrator login, and the service refuses azure_superuser, azure_pg_admin, admin, administrator, root, guest, public and every name beginning with pg_ as that login: set values.user in the Aggregate to another name" (toString .values.user)) -}}
      {{- end -}}
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if hasKey $f "app_user_password" -}}
      {{- fail "a credential is attached to the app_user_password slot, and this Recipe creates the one administrator values.user names: remove the attachment, or map this component to the synthesized helm Recipe, which creates the application role" -}}
      {{- end -}}
      {{- if not (hasKey $f "password") -}}
      {{- fail "the password slot is empty, and neither Azure Database for PostgreSQL flexible server nor the module this Recipe sources draws the administrator's password: attach core/referenced-secret to the password slot, naming the Key Vault secret that holds it, and bind it to arm/key-vault-secret in the Manifest" -}}
      {{- end -}}
      {{- $ty := first (splitList ":" (toString (optional $f.password "type" ""))) -}}
      {{- if ne $ty "core/referenced-secret" -}}
      {{- fail (printf "the password slot is filled by %s, and this Recipe hands the flexible server its administrator's password as a Key Vault reference to a secret the attachment names, which core/referenced-secret publishes through arm/key-vault-secret; another credential either carries its value as text, which would be written into the template, or carries none the service could take: attach core/referenced-secret to the password slot, bound to arm/key-vault-secret in the Manifest" $ty) -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. Here the administrator's password
    # comes from the password slot and the service reads no Secret, so
    # supplied, or any Secret name, would reach no byte of the output while the
    # build reads as if it had chosen who owns the password: each halts naming
    # the key, and the Component's defaults, generated and empty, pass.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and this Recipe hands the flexible server its administrator's password from the password slot, which takes core/referenced-secret: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database owner's credentials from, and Azure Database for PostgreSQL flexible server reads no Secret: this Recipe hands it the administrator's password from the password slot, which takes core/referenced-secret: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. host reads the nested deployment this
  # component becomes, whose symbolic name is the instance id folded into
  # words, and names the module's fqdn output, the server's name
  # under postgres.database.azure.com, which resolves to its private address
  # through the private DNS zone; Azure Resource Manager evaluates the
  # expression when the template deploys, so it resolves for a consumer in the
  # same template, through the link for a consumer in another arm template, and
  # as text on another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record for it, so the operator points the name at the server outside
  # the Release.
  #
  # port is 5432, where the service serves PostgreSQL. user and database are
  # the developer values the module creates. The metrics keys are published
  # empty: the service publishes its metrics to Azure Monitor rather than to a
  # Prometheus endpoint.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[reference('{{ capitalizedWords .context.instance_id }}').outputs.fqdn.value]{{ end }}"
    port: "5432"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""

  # Each key binds the module parameter of the same name, case aside. The
  # server is named after the component, as the other managed Recipes name
  # theirs. The administrator's password is the Key Vault reference object
  # Azure Resource Manager reads in a secure parameter's place: the vault's ID
  # and the secret's name, both taken from the one resource ID the attachment
  # publishes. The mapping reads the attachment by those exact leaves alone.
  valuesMapping: |
    {{- $o := .infra.overrides }}
    {{- $id := toString .features.password.provides.name }}
    {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+/secrets/[^/]+$` $id) }}
    {{- fail (printf "the password slot of %q is filled by an attachment that publishes no Key Vault secret resource ID, and the administrator's password is handed to the flexible server as a reference to that secret: bind core/referenced-secret to arm/key-vault-secret in the Manifest" .context.instance_id) }}
    {{- end }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    skuName: "{{ trimPrefix (printf "%s_" (first (splitList "_" .locals.sku))) .locals.sku }}"
    tier: "{{ get (dict "B" "Burstable" "GP" "GeneralPurpose" "MO" "MemoryOptimized") (first (splitList "_" .locals.sku)) }}"
    version: "{{ .locals.major }}"
    storageSizeGB: {{ int (trimSuffix "Gi" (toString .infra.storage.size)) }}
    {{- with optional .infra.storage "type" "" }}
    storageType: "{{ . }}"
    {{- end }}
    administratorLogin: "{{ .values.user }}"
    administratorLoginPassword:
      reference:
        keyVault:
          id: "{{ regexReplaceAll `/secrets/[^/]+$` $id "" }}"
        secretName: "{{ regexFind `[^/]+$` $id }}"
    authConfig:
      activeDirectoryAuth: Disabled
      passwordAuth: Enabled
    delegatedSubnetResourceId: "{{ $o.delegated_subnet_id }}"
    privateDnsZoneArmResourceId: "{{ $o.private_dns_zone_id }}"
    publicNetworkAccess: Disabled
    {{- if .infra.ha.enabled }}
    highAvailability: ZoneRedundant
    {{- else }}
    highAvailability: Disabled
    {{- end }}
    availabilityZone: {{ with optional $o "zone" "" }}{{ . }}{{ else }}-1{{ end }}
    databases:
      - name: "{{ .values.database }}"
        {{- with optional .values "encoding" "" }}
        charset: "{{ . }}"
        {{- end }}
        {{- with optional .values "locale" "" }}
        collation: "{{ . }}"
        {{- end }}
    {{- with optional $o "server_configuration" "" }}
    configurations:
      {{- range $k, $e := . }}
      - name: "{{ $e.name }}"
        value: "{{ $e.config }}"
        source: user-override
      {{- end }}
    {{- end }}
    {{- with optional $o "tags" "" }}
