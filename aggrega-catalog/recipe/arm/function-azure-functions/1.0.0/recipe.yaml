apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: function-azure-functions
  version: 1.0.0
  description: >
    The generic event-driven compute primitive as one Azure Functions function
    app running the Release's image, a whole function app image holding the
    Functions host, on the operator's Elastic Premium or Dedicated plan,
    declared by an Azure Resource Manager template this Recipe writes. The
    Azure Verified Module for App Service is not used: its template declares
    a location on its publishing credential policies, a property the
    vendor's resource schema for that type does not list, so the catalog's
    template check refuses it. Reach for it where the Release deploys an
    Azure Resource Manager template, and for terraform/function-azure-functions
    where it deploys Terraform.

    The plan and the host storage account are the operator's, each required
    under infra.overrides, with one user-assigned identity the host reaches
    its storage with; no access key is taken. Only the app is emitted, with
    the policies that refuse basic authentication on its publishing
    endpoints, and public network access off.

    Each env entry an inject block dictates becomes an app setting; runtime
    arrives by default as FUNCTION_RUNTIME. A name the platform sets or does
    not take, and file, arg and other entries halt by name. These plans keep
    an instance running, so infra.min_replicas 0, the Component's default,
    halts: set at least 1.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/compute/function:1.0.0

  # The function app is declared by the fragment below, a Microsoft.Web/sites
  # resource at API version 2025-03-01 with two
  # Microsoft.Web/sites/basicPublishingCredentialsPolicies resources beside
  # it, which the provider assembles into the boundary's template.
  #
  # Microsoft's Azure Verified Modules programme publishes a Bicep module for
  # App Service apps, function apps among them, avm/res/web/site, MIT. Its
  # parameters carry everything this Recipe sets, but its compiled template
  # declares location on the Microsoft.Web/sites/basicPublishingCredentialsPolicies
  # and Microsoft.Web/sites/slots/basicPublishingCredentialsPolicies
  # resources of its nested templates, as of the version checked, 0.24.0, a
  # property the vendor's resource schema for those types does not list. The
  # catalog's template check holds each resource to that schema, whether or
  # not the template deploys it, so it refuses the module's template. The
  # module is therefore not sourced, and no module telemetry exists to turn
  # off.
  #
  # The two policies are written as Microsoft's template reference for
  # Microsoft.Web/sites/basicPublishingCredentialsPolicies at 2025-03-01 sets
  # the resource out: a name, ftp or scm, and properties, with no location,
  # where the module and Microsoft's quickstart templates write one the
  # reference does not list. The app carries no reserved property: the plan's
  # reserved property makes it a Linux plan, as on arm/server-app-service.
  locals:
    # The symbolic names of the fragment's resources, folded from the
    # instance id as the provider folds a sourced template's: order-events
    # becomes OrderEvents.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # The registry host infra.image names, read as a container engine reads
    # it: the first segment of an image of more than one segment, when it
    # holds a period or a colon or is localhost; any other image is Docker
    # Hub's, index.docker.io. registry_server is checked against it.
    image_host: >-
      {{- $parts := splitList "/" (toString (optional .infra "image" "")) -}}
      {{- $first := first $parts -}}
      {{- if and (gt (len $parts) 1) (or (contains "." $first) (contains ":" $first) (eq $first "localhost")) -}}
      {{- if eq (lower $first) "docker.io" }}index.docker.io{{ else }}{{ $first }}{{ end -}}
      {{- else }}index.docker.io{{ end -}}

  # This Recipe reads from infra.overrides:
  #   service_plan_id             - string (properties.serverFarmId, and the
  #                                 plan's SKU tier, read when the template
  #                                 deploys), required
  #   storage_account_id          - string (the account's name, read from the
  #                                 ID, as the AzureWebJobsStorage__accountName
  #                                 app setting in properties.siteConfig.appSettings),
  #                                 required
  #   identity_ids                - []string (identity.userAssignedIdentities;
  #                                 its one entry's client ID is the
  #                                 AzureWebJobsStorage__clientId app setting),
  #                                 required
  #   virtual_network_subnet_id   - string (properties.virtualNetworkSubnetId)
  #   location                    - string (location; the resource group's
  #                                 region while it is unset, so set it
  #                                 wherever the plan's region is another)
  #   registry_server             - string (the DOCKER_REGISTRY_SERVER_URL app
  #                                 setting)
  #   registry_identity           - string (properties.siteConfig.acrUseManagedIdentityCreds,
  #                                 and the identity's client ID as
  #                                 properties.siteConfig.acrUserManagedIdentityID)
  #   registry_username           - string (the DOCKER_REGISTRY_SERVER_USERNAME
  #                                 app setting)
  #   registry_password_secret_id - string (a Key Vault reference in the
  #                                 DOCKER_REGISTRY_SERVER_PASSWORD app setting)
  #   registry_password_identity  - string (properties.keyVaultReferenceIdentity)
  #   registry_password           - refused: the password is read from Key Vault
  #   storage_account_access_key  - refused: the host reaches its storage with
  #                                 an identity
  #   storage_key_vault_secret_id - refused: the host reaches its storage with
  #                                 an identity
  #   enable_telemetry            - refused: the template is this catalog's
  #                                 own, with no module telemetry to turn on
  #                                 or off
  # resource_group_name is not read: the app is created in the resource group
  # the template is deployed to. It is admitted, and renders nothing, so a
  # Release writes one set of overrides for this Recipe and
  # terraform/function-azure-functions, which requires it.
  #
  # Each key is the one terraform/function-azure-functions reads for the same
  # concept, under the same spelling and meaning, and service_plan_id,
  # virtual_network_subnet_id, location, identity_ids and the registry keys
  # are also the ones arm/server-app-service reads; the property each sets is
  # given in brackets.
  #
  # service_plan_id and storage_account_id are required and neither has a
  # default: the plan the app runs on and the storage account its host keeps
  # its state in are provisioned outside this Release, no
  # subscription-independent value exists for either, and this Recipe never
  # chooses a plan, and with it the app's size, for the operator.
  # service_plan_id is the plan's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Web/serverFarms/<name>,
  # a Linux Elastic Premium plan or a Linux Dedicated (App Service) plan, the
  # plans on which Azure Functions runs a whole function app image; the
  # template reads the plan's SKU tier when it deploys, by a reference() call
  # over the plan's resource ID, so the identity that deploys the template
  # reads the plan and the ID, written inside that call, holds no quote,
  # backslash or white space. The app runs in its plan's region, so location
  # must name the plan's region wherever it is not the region of the resource
  # group the template is deployed to: the fragment cannot read the plan's
  # region, since the provider admits a reference() call in a resource's
  # properties alone and not in its location.
  #
  # Host storage. The Functions host keeps its state in a storage account, and
  # cannot start without one. storage_account_id is the account's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Storage/storageAccounts/<name>,
  # whose name, 3 to 24 lowercase letters and digits, this Recipe reads from
  # it. The host reaches the account with a managed identity and no secret,
  # through the app settings Microsoft's guidance on identity-based
  # connections gives for a user-assigned identity:
  # AzureWebJobsStorage__accountName, the account's name;
  # AzureWebJobsStorage__credential, managedidentity; and
  # AzureWebJobsStorage__clientId, the client ID of the one entry of
  # identity_ids, which the template reads when it deploys, by a reference()
  # call over the identity's resource ID. The name form reaches the account
  # at Azure's standard storage host names. An access key or a connection
  # string would be written into the template, so storage_account_access_key
  # and storage_key_vault_secret_id halt by name, and identity_ids holding no
  # entry, or more than one, halts, naming the remedy. The operator grants
  # that identity the Storage Blob Data Owner role on the account, Storage
  # Table Data Contributor for the diagnostic events the host writes, and the
  # queue roles its triggers need; no role assignment is emitted. No Azure
  # Files content share is configured, since Azure Files takes only an access
  # key: Microsoft documents that an Elastic Premium app runs without one,
  # with scaling that may then be limited, and that an app on a Dedicated
  # plan does not depend on one.
  #
  # virtual_network_subnet_id is the resource ID of a subnet delegated to
  # Microsoft.Web/serverFarms, which the app joins by regional virtual network
  # integration; all its outbound traffic is then routed through it
  # (properties.siteConfig.vnetRouteAllEnabled), so a database with private
  # access in that network, and the private DNS zone its name resolves
  # through, are reached from the app.
  #
  # identity_ids are the resource IDs of user-assigned managed identities that
  # already exist; its one entry is the identity the host reaches its storage
  # with, which the function's code may call Azure with as well. A private
  # image is pulled from registry_server, the registry's host name, which is
  # the host infra.image names: App Service pulls from one registry address,
  # so a registry_server naming another host halts. It is pulled either with
  # registry_identity, a user-assigned identity granted pull on the registry,
  # whose client ID App Service takes and the template reads as it reads the
  # storage identity's; or with registry_username and a password App Service
  # reads from the Key Vault secret registry_password_secret_id names,
  # https://<vault>.vault.azure.net/secrets/<name>, with or without a version,
  # through a Key Vault reference it resolves with the user-assigned identity
  # registry_password_identity names. That identity reads every Key Vault
  # reference of the app. Each identity named for the registry is given to the
  # app as well, since App Service uses only the app's own identities. Every
  # identity ID is written inside an expression, so it holds no quote,
  # backslash or white space. A password written as text would be written
  # into the template, so it is taken only by that reference. With no
  # registry key set the image is pulled as a public one.
  #
  # Who invokes the function. Public network access is off: the app's default
  # host name answers no request from the internet, and a private endpoint the
  # operator creates for the app, in a network its callers reach, is the way
  # in for an HTTP trigger. Every other trigger, and every binding, is
  # declared by the image's own function code and reaches its event source
  # from the app. A wider ingress is not something this Recipe renders. Plain
  # HTTP is redirected to HTTPS, which App Service terminates at its front
  # ends, and a request reaches the container on infra.port, which the
  # template writes as the WEBSITES_PORT app setting: Microsoft's function app
  # images have the host listen on port 80 unless they set another, and
  # infra.port takes a port from 1024, so the image's host listens on
  # infra.port, 8080 unless the Release sets another. The minimum TLS version
  # is 1.2, FTP is disabled, the two publishing credential policies, ftp and
  # scm, refuse basic authentication on the FTP and SCM publishing endpoints,
  # and WEBSITES_ENABLE_APP_SERVICE_STORAGE is false, as Microsoft directs for
  # an app running a container, so no shared /home directory is mounted.
  # FUNCTIONS_EXTENSION_VERSION is ~4, the runtime version the Functions
  # documentation names as the one supported.
  #
  # The instance counts. An Elastic Premium or Dedicated plan keeps at least
  # one instance of the app running, so the app never scales to zero, and
  # infra.min_replicas at the Component's default of 0 halts, naming the
  # remedy: set it to at least 1. The template reads the plan's SKU tier when
  # it deploys. On an Elastic Premium plan, whose tier is ElasticPremium,
  # infra.min_replicas is the app's always ready instance count
  # (properties.siteConfig.minimumElasticInstanceCount), which Microsoft
  # supports up to 20 for one app and which also raises the plan's own
  # minimum; infra.max_replicas is the app's scale-out limit
  # (properties.siteConfig.functionAppScaleLimit), within the plan's maximum
  # burst; one prewarmed instance is kept, Microsoft's default; and Always On
  # is off. On a Dedicated plan each of those three counts is written as
  # null(), so the template sets none of them: the app runs on each instance
  # the plan runs, the plan's instance count, the operator's, sets the floor
  # and the ceiling, and Always On is on, which a function app on that plan
  # needs to keep its host running. A floor above the ceiling halts, and so
  # does a floor above 20.
  #
  # The environment. Every env entry on the inject pipe, dictated by a
  # connection's inject block, by the component's own inject block or by an
  # attachment, becomes one app setting in properties.siteConfig.appSettings,
  # under the name it was dictated as, its value written whole, so a
  # neighbour's Azure Resource Manager expression, such as the address a
  # database publishes, reaches the template as an expression evaluated where
  # the neighbour's resource is declared, and a neighbour's value written
  # inside literal text is written by the provider as a format() expression.
  # App Service hands each app setting to the container as a variable. It
  # takes an app setting name of letters, digits, periods and underscores
  # alone. It sets WEBSITE_SITE_NAME, WEBSITE_RESOURCE_GROUP,
  # WEBSITE_OWNER_NAME, REGION_NAME, WEBSITE_PLATFORM_VERSION, HOME,
  # SERVER_PORT, WEBSITE_COMPUTE_MODE, WEBSITE_SKU, SITE_BITNESS,
  # WEBSITE_HOSTNAME, WEBSITE_DEFAULT_HOSTNAME, WEBSITE_VOLUME_TYPE,
  # WEBSITE_INSTANCE_ID and WEBSITE_ROLE_INSTANCE_ID itself, read-only, as its
  # "Environment variables and app settings reference" lists; and this Recipe
  # sets WEBSITES_PORT, WEBSITES_ENABLE_APP_SERVICE_STORAGE,
  # FUNCTIONS_EXTENSION_VERSION, the host's storage settings beneath
  # AzureWebJobsStorage, DOCKER_REGISTRY_SERVER_URL,
  # DOCKER_REGISTRY_SERVER_USERNAME and DOCKER_REGISTRY_SERVER_PASSWORD. A
  # variable under any of those names, compared without regard to case,
  # AzureWebJobsStorage itself or AzureWebJobsStorage__ followed by anything
  # among them, or under a name outside those characters, halts, naming who
  # dictated it.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's runtime value. It is
  # delivered under the name the Kubernetes, AWS Lambda and Cloud Run
  # realizations deliver it under, FUNCTION_RUNTIME, for the application's own
  # code to read. That name is a default: it is rendered only while no entry of
  # the component's own inject block, in any mechanism, delivers the runtime,
  # and an edge or that block delivering that name as well, compared without
  # regard to case, halts, naming which, rather than one value silently
  # replacing the other.
  #
  # A credential. The fragment is a template, not a values mapping, so no
  # rule refuses a value declared sensitive in it: every delivered value is
  # written into the template as it is delivered. A credential reaches the
  # container without passing through the template as a variable whose value
  # is a Key Vault reference, @Microsoft.KeyVault(SecretUri=<secret ID>),
  # dictated as a literal in the component's own inject block, which App
  # Service resolves with the identity registry_password_identity names, its
  # one identity for every Key Vault reference of the app.
  #
  # Files and other mechanisms. This realization delivers env entries alone,
  # and every other entry on the pipe halts, naming the entry, its mechanism
  # and who dictated it, so none is dropped: a file entry, because App Service
  # gives a custom container no way to write a file's content into it; an arg
  # entry, because no command line is rendered, and App Service passes a
  # startup command to the container in place of the image's own; and any
  # custom mechanism.
  #
  # DELIBERATE NEAR-DUPLICATE of the environment assembly every other
  # target's container Recipes hold, in their own values mapping or in the
  # shared parameters they import, of arm/server-app-service's, which holds
  # the same app setting name rule, registry checks and placement checks, and
  # of terraform/function-azure-functions's, which holds the same host
  # storage and instance count checks: the same reading of the inject pipe
  # and of who dictated each entry, save the variables each target reserves
  # and the mechanisms it delivers. No catalog kind composes part of a
  # template into another, so this Recipe holds its own; a change to one is
  # made to all of them.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.runtime as above; infra.image (required), as the image
  #     the app runs (properties.siteConfig.linuxFxVersion, DOCKER| followed
  #     by the image); infra.port, as WEBSITES_PORT; infra.min_replicas from 1
  #     and infra.max_replicas, on an Elastic Premium plan, as above; the
  #     overrides above; and env entries.
  #   refused — infra.image unset; infra.min_replicas below 1, above
  #     infra.max_replicas or above 20; a component name App Service does not
  #     take for an app; a variable under a name the platform sets or reads
  #     itself or does not take, or under FUNCTION_RUNTIME while the runtime is
  #     delivered under that default name; a file, arg or custom-mechanism
  #     entry; a registry_server other than the image's registry; identity_ids
  #     holding other than one entry; an override that is not of the form
  #     above; and any infra.overrides key not listed above.
  #   not read — infra.compute.cpu and infra.compute.memory, since the plan's
  #     SKU sizes every app on it, and a Recipe cannot tell the Component's
  #     defaults from a value the Release wrote; infra.min_replicas and
  #     infra.max_replicas on a Dedicated plan, as above;
  #     infra.control_plane_present, as Azure Functions needs no control plane
  #     of the operator's; infra.scaler, as the platform scales the app on its
  #     triggers' own events and takes no event source to scale on; and
  #     values.display_name and values.description, documentation knobs no
  #     Azure setting takes.
  assertions:
    overrides_known: >-
      {{- $known := list "service_plan_id" "storage_account_id" "identity_ids" "virtual_network_subnet_id" "location" "registry_server" "registry_identity" "registry_username" "registry_password_secret_id" "registry_password_identity" "resource_group_name" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "registry_password" -}}
      {{- fail "infra.overrides.registry_password is set, and this Recipe takes a registry password only by reference, so that its value is never written into the template: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" -}}
      {{- end -}}
      {{- if has $k (list "storage_account_access_key" "storage_key_vault_secret_id") -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe has the Functions host reach its storage account with a managed identity alone, so that no access key or connection string is written into the template: remove infra.overrides.%s, and grant the identity infra.overrides.identity_ids holds access to the account infra.overrides.storage_account_id names" $k $k) -}}
      {{- end -}}
      {{- if eq $k "enable_telemetry" -}}
      {{- fail "infra.overrides.enable_telemetry is set, and this Recipe declares the function app in a template of this catalog's own, which carries no telemetry to turn on or off: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads service_plan_id, storage_account_id, identity_ids, virtual_network_subnet_id, location, registry_server, registry_identity, registry_username, registry_password_secret_id and registry_password_identity from infra.overrides, admits resource_group_name without reading it, and takes no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    placement_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $plan := optional $o "service_plan_id" "" -}}
      {{- if not (and (typeIs "string" $plan) $plan) -}}
      {{- fail (printf "the component %q runs as a function app on the operator's own Elastic Premium or Dedicated plan, and this Recipe never chooses one, but infra.overrides.service_plan_id carries none: set it in the Release to the plan's resource ID" $.metadata.instance_id) -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/'"\\\s]+/resourceGroups/[^/'"\\\s]+/providers/Microsoft\.Web/serverFarms/[^/'"\\\s]+$` $plan) -}}
      {{- fail (printf "infra.overrides.service_plan_id is %q, and this Recipe takes the plan the function app runs on as the plan's resource ID, written inside an expression, so it holds no quote, backslash or white space: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Web/serverFarms/<name>, a Linux Elastic Premium or Dedicated plan" $plan) -}}
      {{- end -}}
      {{- if hasKey $o "virtual_network_subnet_id" -}}
      {{- $s := index $o "virtual_network_subnet_id" -}}
      {{- if not (and (typeIs "string" $s) (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/virtualNetworks/[^/]+/subnets/[^/]+$` $s)) -}}
      {{- fail (printf "infra.overrides.virtual_network_subnet_id is %s, and this Recipe takes the subnet the function app joins by virtual network integration as the subnet's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>, a subnet delegated to Microsoft.Web/serverFarms, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "location" "resource_group_name" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as a string: set it in the Release to one, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # The storage account and the one identity the host reaches it with. A
    # list of identities that is not a list of resource IDs is refused by the
    # registry assertion below, which reads every identity key.
    host_storage: >-
      {{- $id := .metadata.instance_id -}}
      {{- $o := optional .infra "overrides" dict -}}
      {{- $sa := optional $o "storage_account_id" "" -}}
      {{- if not (and (typeIs "string" $sa) $sa) -}}
      {{- fail (printf "the component %q runs on Azure Functions, whose host keeps its state in a storage account and cannot start without one, and this Recipe never creates one, but infra.overrides.storage_account_id carries none: set it in the Release to the resource ID of the operator's storage account, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Storage/storageAccounts/<name>" $id) -}}
      {{- end -}}
      {{- if not (regexMatch `^/(?i:subscriptions)/[^/]+/(?i:resourceGroups)/[^/]+/(?i:providers/Microsoft\.Storage/storageAccounts)/[a-z0-9]{3,24}$` $sa) -}}
      {{- fail (printf "infra.overrides.storage_account_id of %q is %q, and this Recipe takes the host's storage account as the account's resource ID, whose last segment is the account's name of 3 to 24 lowercase letters and digits: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Storage/storageAccounts/<name>" $id $sa) -}}
      {{- end -}}
      {{- $ids := optional $o "identity_ids" list -}}
      {{- if kindIs "slice" $ids -}}
      {{- if eq (len $ids) 0 -}}
      {{- fail (printf "the component %q has its Functions host reach its storage account with a user-assigned identity, the one entry of infra.overrides.identity_ids, and none is set: set infra.overrides.identity_ids in the Release to a list holding the resource ID of one existing user-assigned identity the operator has granted access to the account" $id) -}}
      {{- end -}}
      {{- if gt (len $ids) 1 -}}
      {{- fail (printf "the component %q has its Functions host reach its storage account with the one entry of infra.overrides.identity_ids, and it holds %d entries, so which one reaches the account is not said: keep one, the user-assigned identity the operator has granted access to the account" $id (len $ids)) -}}
      {{- end -}}
      {{- end -}}
    # The app is named after the component, and its name is also the first
    # label of its default host name under azurewebsites.net, so it is unique
    # across Azure; the rule Microsoft's naming rules for Azure resources state
    # for an app is checked here, where the name is known.
    app_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9][-A-Za-z0-9]{0,58}[A-Za-z0-9]$` $n) -}}
      {{- fail (printf "the component %q names its function app, and App Service takes an app name of 2 to 60 letters, digits and hyphens that begins and ends with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    image_supplied: >-
      {{- if not (toString (optional .infra "image" "")) -}}
      {{- fail (printf "the component %q has no image to run: the Release sets no infra.image, and this Recipe holds no default image, as the generic compute primitive packages no software; set infra.image in the Release to the function app image it runs" .metadata.instance_id) -}}
      {{- end -}}
    # A function app running an image runs only on an Elastic Premium or a
    # Dedicated plan, and each keeps at least one instance of it running.
    replica_floor: >-
      {{- $id := .metadata.instance_id -}}
      {{- $min := int .infra.min_replicas -}}
      {{- $max := int .infra.max_replicas -}}
      {{- if lt $min 1 -}}
      {{- fail (printf "infra.min_replicas of %q is %d, and a function app running an image runs only on an Elastic Premium or a Dedicated plan, each of which keeps at least one instance of it running, so it never scales to zero: set infra.min_replicas to at least 1 in the Release" $id $min) -}}
      {{- end -}}
      {{- if gt $min $max -}}
      {{- fail (printf "infra.min_replicas of %q is %d and infra.max_replicas %d, and on an Elastic Premium plan the floor is the app's always ready instance count, which the app's scale-out limit the ceiling sets cannot be below: set infra.min_replicas in the Release to at most infra.max_replicas" $id $min $max) -}}
      {{- end -}}
      {{- if gt $min 20 -}}
      {{- fail (printf "infra.min_replicas of %q is %d, and on an Elastic Premium plan the floor is the app's always ready instance count, which Microsoft supports up to 20 for one app: set infra.min_replicas in the Release to at most 20" $id $min) -}}
      {{- end -}}
    registry: >-
      {{- $id := .metadata.instance_id -}}
      {{- $o := optional .infra "overrides" dict -}}
      {{- $uai := `(?i)^/subscriptions/[^/'"\\\s]+/resourceGroups/[^/'"\\\s]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/'"\\\s]+$` -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := index $o "identity_ids" -}}
      {{- $ok := kindIs "slice" $s -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids of %q is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>, written inside an expression, so each holds no quote, backslash or white space: set it in the Release to such a list" $id (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_identity" "registry_password_identity" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) -}}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this Recipe reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>, written inside an expression, so it holds no quote, backslash or white space: set it in the Release to that ID, or remove it" $k $id (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_server" "registry_username" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "infra.overrides.%s of %q is %s, and this Recipe reads it as a string: set it in the Release to one, or remove it" $k $id (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "registry_password_secret_id" -}}
      {{- $v := index $o "registry_password_secret_id" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) -}}
      {{- fail (printf "infra.overrides.registry_password_secret_id of %q is %s, and this Recipe reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" $id (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" -}}
      {{- $set := list -}}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end -}}
      {{- if and $set (not (hasKey $o "registry_server")) -}}
      {{- fail (printf "infra.overrides.%s of %q is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set) $id) -}}
      {{- end -}}
      {{- if hasKey $o "registry_server" -}}
      {{- $missing := list -}}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end -}}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) (len $byPassword)) -}}
      {{- fail (printf "infra.overrides of %q sets registry_identity and a registry user name or password as well, and App Service pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" $id) -}}
      {{- end -}}
      {{- if and (not (hasKey $o "registry_identity")) $missing -}}
      {{- fail (printf "infra.overrides.registry_server of %q names a private registry, and this Recipe pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" $id (first $missing)) -}}
      {{- end -}}
      {{- if ne (lower (toString $o.registry_server)) (lower .locals.image_host) -}}
      {{- fail (printf "infra.overrides.registry_server of %q is %q, and infra.image names the registry %s, and App Service pulls the image from one registry address with the registry's credentials: set registry_server to %s, or infra.image to an image in %s" $id (toString $o.registry_server) .locals.image_host .locals.image_host (toString $o.registry_server)) -}}
      {{- end -}}
      {{- end -}}

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  # The fragment the provider assembles into the boundary's template. Before
  # anything is written, the inject pipe is read as the comments above set
  # out: every entry that is not an env entry halts, naming who dictated it,
  # and every env entry becomes one app setting, under a name App Service
  # takes and neither it nor this Recipe sets or reads itself; the runtime
  # joins them as FUNCTION_RUNTIME while it is delivered under that default
  # name. The template reads the component's own inject block at
  # .context.self_inject, which maps each name the developer wrote to
  # values.<key> for an entry whose template reads that one own value. The app
  # settings are written in the order of their names, those this Recipe sets
  # among them.
  #
  # The app is named after the component, and created in the resource group
  # the template is deployed to. Whether its plan is an Elastic Premium one is
  # read from the plan's SKU tier when the template deploys, and decides
  # Always On, the always ready and prewarmed instance counts and the
  # scale-out limit, each written as an expression over that reading, which
  # yields null() for a count the plan does not take. The two publishing
  # credential policies are child resources of the app, named ftp and scm as
  # Microsoft.Web names them, each written as
  # [format('{0}/{1}', '<app>', '<policy>')], and deployed after the app.
  # Every resource is written at Microsoft.Web's 2025-03-01 API version; the
  # app's siteConfig and its other properties are those the comments above
  # name, and the provider's defaults stand for every property left out.
  artifacts:
    function-app.yaml: |
      {{- $id := .context.instance_id }}
      {{- $sym := .locals.symbol }}
      {{- $reserved := list "WEBSITE_SITE_NAME" "WEBSITE_RESOURCE_GROUP" "WEBSITE_OWNER_NAME" "REGION_NAME" "WEBSITE_PLATFORM_VERSION" "HOME" "SERVER_PORT" "WEBSITE_COMPUTE_MODE" "WEBSITE_SKU" "SITE_BITNESS" "WEBSITE_HOSTNAME" "WEBSITE_DEFAULT_HOSTNAME" "WEBSITE_VOLUME_TYPE" "WEBSITE_INSTANCE_ID" "WEBSITE_ROLE_INSTANCE_ID" "WEBSITES_PORT" "WEBSITES_ENABLE_APP_SERVICE_STORAGE" "FUNCTIONS_EXTENSION_VERSION" "AZUREWEBJOBSSTORAGE" "DOCKER_REGISTRY_SERVER_URL" "DOCKER_REGISTRY_SERVER_USERNAME" "DOCKER_REGISTRY_SERVER_PASSWORD" }}
      {{- $inject := default dict .context.inject }}
      {{- $selfInject := default dict .context.self_inject }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey (optional $selfInject $mechanism dict) $name }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "file" }}
      {{- fail (printf "the component %q is handed a file at %q by %s, and this realization delivers env entries only: App Service gives a custom container no way to write a file's content into it. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: App Service passes a startup command to the container in place of the image's own, which stays the image's. Dictate the value as an env entry in that inject block instead" $id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env entries only: dictate the value as an env entry in that inject block instead" $id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $named := dict }}
      {{- range $mechanism, $names := $selfInject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- $runtimeByDefault := not (hasKey $named "values.runtime") }}
      {{- $settings := dict }}
      {{- $ownEnv := optional $selfInject "env" dict }}
      {{- range $k, $v := optional $inject "env" dict }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) $k }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if and $runtimeByDefault (eq (upper $k) "FUNCTION_RUNTIME") }}
      {{- fail (printf "the component %q delivers its developer value runtime to the container as FUNCTION_RUNTIME, and %s dictates the variable %q as well, the same name without regard to case, so one would silently replace the other: rename the variable in that inject block" $id $by $k) }}
      {{- end }}
      {{- if or (has (upper $k) $reserved) (hasPrefix "AZUREWEBJOBSSTORAGE__" (upper $k)) }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and App Service or this Recipe sets or reads an app setting of that name itself, compared here without regard to case, so the two would collide: rename the variable where it is dictated" $id $k $by) }}
      {{- end }}
      {{- if not (regexMatch `^[A-Za-z0-9._]+$` $k) }}
      {{- fail (printf "the component %q is handed the variable %q by %s, and App Service takes an app setting name of letters, digits, periods and underscores alone: rename the variable where it is dictated" $id $k $by) }}
      {{- end }}
      {{- $_ := set $settings $k (toString $v) }}
      {{- end }}
      {{- if $runtimeByDefault }}{{ $_ := set $settings "FUNCTION_RUNTIME" (toString .values.runtime) }}{{ end }}
      {{- $o := default dict .infra.overrides }}
      {{- $storageIdentity := first $o.identity_ids }}
      {{- $_ := set $settings "WEBSITES_PORT" (toString .infra.port) }}
      {{- $_ := set $settings "WEBSITES_ENABLE_APP_SERVICE_STORAGE" "false" }}
      {{- $_ := set $settings "FUNCTIONS_EXTENSION_VERSION" "~4" }}
      {{- $_ := set $settings "AzureWebJobsStorage__accountName" (last (splitList "/" $o.storage_account_id)) }}
      {{- $_ := set $settings "AzureWebJobsStorage__credential" "managedidentity" }}
      {{- $_ := set $settings "AzureWebJobsStorage__clientId" (printf "[reference('%s', '2023-01-31').clientId]" $storageIdentity) }}
      {{- with optional $o "registry_server" "" }}{{ $_ := set $settings "DOCKER_REGISTRY_SERVER_URL" (printf "https://%s" .) }}{{ end }}
      {{- with optional $o "registry_username" "" }}{{ $_ := set $settings "DOCKER_REGISTRY_SERVER_USERNAME" . }}{{ end }}
      {{- with optional $o "registry_password_secret_id" "" }}{{ $_ := set $settings "DOCKER_REGISTRY_SERVER_PASSWORD" (printf "@Microsoft.KeyVault(SecretUri=%s)" .) }}{{ end }}
      {{- $appSettings := list }}
      {{- range $k := keys $settings | sortAlpha }}{{ $appSettings = append $appSettings (dict "name" $k "value" (index $settings $k)) }}{{ end }}
      {{- $elastic := printf "equals(toLower(reference('%s', '2025-03-01', 'Full').sku.tier), 'elasticpremium')" $o.service_plan_id }}
      {{- $siteConfig := dict "linuxFxVersion" (printf "DOCKER|%s" (toString .infra.image)) "alwaysOn" (printf "[not(%s)]" $elastic) "minimumElasticInstanceCount" (printf "[if(%s, %d, null())]" $elastic (int .infra.min_replicas)) "functionAppScaleLimit" (printf "[if(%s, %d, null())]" $elastic (int .infra.max_replicas)) "preWarmedInstanceCount" (printf "[if(%s, 1, null())]" $elastic) "minTlsVersion" "1.2" "ftpsState" "Disabled" "appSettings" $appSettings }}
      {{- if optional $o "virtual_network_subnet_id" "" }}{{ $_ := set $siteConfig "vnetRouteAllEnabled" true }}{{ end }}
      {{- with optional $o "registry_identity" "" }}
      {{- $_ := set $siteConfig "acrUseManagedIdentityCreds" true }}
      {{- $_ := set $siteConfig "acrUserManagedIdentityID" (printf "[reference('%s', '2023-01-31').clientId]" .) }}
      {{- end }}
      {{- $identities := list }}
      {{- range $v := $o.identity_ids }}{{ $identities = append $identities $v }}{{ end }}
      {{- range $k := list "registry_identity" "registry_password_identity" }}{{ with optional $o $k "" }}{{ if not (has . $identities) }}{{ $identities = append $identities . }}{{ end }}{{ end }}{{ end }}
      {{- $properties := dict "serverFarmId" $o.service_plan_id "httpsOnly" true "publicNetworkAccess" "Disabled" "siteConfig" $siteConfig }}
      {{- with optional $o "virtual_network_subnet_id" "" }}{{ $_ := set $properties "virtualNetworkSubnetId" . }}{{ end }}
      {{- with optional $o "registry_password_identity" "" }}{{ $_ := set $properties "keyVaultReferenceIdentity" . }}{{ end }}
      {{- $assigned := dict }}
      {{- range $identities }}{{ $_ := set $assigned . dict }}{{ end }}
      {{- $site := dict "type" "Microsoft.Web/sites" "apiVersion" "2025-03-01" "name" $id "kind" "functionapp,linux,container" "location" (default "[resourceGroup().location]" (optional $o "location" "")) "identity" (dict "type" "UserAssigned" "userAssignedIdentities" $assigned) "properties" $properties }}
      resources:
        {{ $sym }}: {{ toJson $site }}
      {{- range $policy := list "ftp" "scm" }}
        {{ $sym }}{{ title $policy }}Publishing: {{ toJson (dict "type" "Microsoft.Web/sites/basicPublishingCredentialsPolicies" "apiVersion" "2025-03-01" "name" (printf "[format('{0}/{1}', '%s', '%s')]" $id $policy) "dependsOn" (list $sym) "properties" (dict "allow" false)) }}
      {{- end }}
