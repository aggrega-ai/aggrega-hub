apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: foundry-agent-service
  version: 1.0.0
  description: >
    A Microsoft Foundry Agent Service agent as a reference realization on
    Azure Resource Manager: the fragment this Recipe writes declares no
    resource, so the template deploys nothing for the agent, and it carries
    the project endpoint the Release supplies, the agent's name and its
    version as outputs of the template.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/foundry-agent-service where it deploys
    Terraform. A consumer reads each value as the text the Release and the
    Aggregate give, and nothing is looked up when the template deploys. A
    missing infra.endpoint halts naming it, and so does any infra.overrides
    key, since this Recipe reads none. No credential is delivered: a
    consumer calls the project with a Microsoft Entra ID token for its own
    identity.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/ai-agent/foundry-agent-service:1.0.0

  # This Recipe reads no infra.overrides key. Each one halts naming it,
  # resource_group_name and enable_telemetry among them: the fragment
  # declares no resource to place in a group or region, to tag or to name,
  # and sources no module whose telemetry a key could switch.
  #
  # Every Component value and infra key is honoured, refused below by name,
  # or not read:
  #   honoured — values.agent_name and values.agent_version, published as
  #     provides.agent_name and provides.agent_version, the version empty
  #     while unset; infra.endpoint, published as provides.endpoint.
  #   refused — a missing or empty infra.endpoint, and any infra.overrides
  #     key.
  #   not read — values.display_name, values.description, values.models,
  #     values.tools_allowed, values.datastores and values.agents_allowed:
  #     they record the catalog entities an agent works with, a documented
  #     convention the compiler does not evaluate, while the agent's own
  #     instructions, model and tools are the definition the project holds.
  #
  # The template schemas Microsoft publishes define no resource for an agent
  # itself. Their applications and agentDeployments types, children of a
  # Foundry project, publish an agent the project already holds, named by
  # its agent name and version, so there is nothing for a template to
  # create: the agent is created and versioned in the project, through the
  # Foundry portal, SDKs or REST API, outside the Release.
  #
  # Backup. The agent is a definition the service holds, and this Recipe
  # creates nothing to back up.
  assertions:
    # The project's endpoint belongs to the Foundry resource and project an
    # organisation created, so no address exists for the catalog to hold as a
    # default: the Release names the project the agent lives in.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches an agent of Microsoft Foundry Agent Service, and the agent lives in a Foundry project an organisation created, so the Release supplies the project's endpoint and the catalog holds no default: set infra.endpoint in the Release to that endpoint, https://<resource>.services.ai.azure.com/api/projects/<project>" -}}
      {{- end -}}
    overrides_known: >-
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads no key from infra.overrides: it reaches an agent a Foundry project already holds and declares no resource a key could set: remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. The
  # endpoint comes from the operator's infra and the agent's name and version
  # from the developer's values, each published as written, so a consumer in
  # this template or another reads the same text.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_name: "{{ .values.agent_name }}"
    agent_version: '{{ optional .values "agent_version" "" }}'

  # The fragment the provider assembles into the boundary's template: no
  # resource, so the template deploys nothing for this component, and an
  # output for each value the component publishes, so an operator reads what
  # the template was given once it is deployed. The provider names each
  # output after the component and the entry.
  artifacts:
    foundry-agent-service.yaml: |
      resources: {}
      outputs:
        endpoint:
          type: string
          value: {{ toJson .infra.endpoint }}
        agent_name:
          type: string
          value: {{ toJson .values.agent_name }}
        agent_version:
          type: string
          value: {{ toJson (optional .values "agent_version" "") }}
