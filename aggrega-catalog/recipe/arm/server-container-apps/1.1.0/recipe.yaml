apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: server-container-apps
  version: 1.1.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # container app module: the third-party template this Recipe pins and wraps in
  # the output. The container app it creates is a service the reader contracts
  # for directly with Microsoft, under Azure's terms.
  license: MIT
  description: >
    The generic long-running server primitive as one Azure Container Apps app
    running the Release's image on infra.port, deployed from an Azure Resource
    Manager template through Microsoft's Azure Verified Modules module
    avm/res/app/container-app at 0.23.1, MIT, fetched from mcr.microsoft.com
    and pinned by digest in entity.lock; ContainerAppParameters binds its
    parameters. Reach for it where the Release deploys an Azure Resource
    Manager template, and for terraform/server-container-apps where it deploys
    Terraform.

    Its ingress is internal: only the other apps and jobs in its environment
    reach it. The environment is the operator's, required under
    infra.overrides; user-assigned identities and a private registry are
    optional. The template holds one nested deployment, which creates only the
    app; the module's telemetry resource, which reports to Microsoft by
    default, is turned off.

    Each env entry an inject block dictates becomes a container variable, a
    neighbour's value written whole or inside literal text; a name Container
    Apps sets itself, and file, arg and other entries, halt by name. A value
    declared sensitive halts the build when an inject block delivers it into a
    variable. Keep it in Key Vault, name the secret under
    infra.overrides.secrets and drop the delivery, and the variable reads it
    by secretRef, so no secret is written into the template. The app runs exactly infra.replicas replicas at the smallest
    Consumption size meeting infra.compute.cpu and memory.
    The nested deployment keeps its name, so a redeploy updates the app.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/compute/server:1.1.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.23.1, the module Bicep names
  # br/public:avm/res/app/container-app:0.23.1. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and every
  # build reads exactly those bytes. The provider reads the template, main.json,
  # and wraps it as one nested deployment. It is the template the module's git
  # tag avm/res/app/container-app/0.23.1 commits, compiled by a later Bicep: the
  # two differ only in the compiler version and hash in their metadata and in
  # the name of the module's telemetry resource, which no template this Recipe
  # writes deploys.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/app/container-app
    version: 0.23.1

  # This Recipe reads from infra.overrides:
  #   container_app_environment_id - string (environmentResourceId; location), required
  #   identity_ids                 - []string (managedIdentities.userAssignedResourceIds)
  #   registry_server              - string (registries[0].server)
  #   registry_identity            - string (registries[0].identity)
  #   registry_username            - string (registries[0].username)
  #   registry_password_secret_id  - string (a secrets entry's keyVaultUrl)
  #   registry_password_identity   - string (that secrets entry's identity)
  #   secrets                      - map[string]{origin: string, identity: string} (secrets; containers[0].env)
  #   registry_password            - refused: the password is read from Key Vault
  #   enable_telemetry             - refused while true: telemetry is always off
  # resource_group_name is not read: the app is created in the resource group
  # the template is deployed to.
  #
  # Each key but secrets is the one terraform/server-container-apps reads for
  # the same concept, under the same spelling, so an operator writes one set of
  # overrides across both; the module parameter each sets is given in brackets.
  # secrets is named after the module's own secrets parameter. These are the
  # keys arm/worker-container-apps reads, under the same names, and
  # ContainerAppParameters#/mappings/AppParameters sets out how each is read:
  # the environment by its resource ID, which also gives the app its region;
  # the identities, registry and Key Vault secrets by reference, so no
  # identity is created and no credential's value is written into the
  # template.
  #
  # Who reaches the server. The app's ingress is internal: its address is
  # reachable only from inside its environment, by the other apps and jobs
  # there, and it is not published at the environment's inbound address. An
  # environment-level HTTP route configuration naming the app as a target is
  # the one way in from outside, and it is the operator's. A wider ingress is
  # not something this Recipe renders. The readiness probe opens a TCP
  # connection to infra.port, and the ingress sends a replica no traffic until
  # the process accepts one; no liveness probe is declared, because a start-up
  # time cannot be known for an image this Recipe does not name.
  #
  # The nested deployment's symbolic name and its name are folded from the
  # instance id, and the app is named after the component, as in version
  # 1.0.0, which sources the same module version from the module's git
  # repository; for the same Release both versions bind the same parameters
  # to the same values. The nested deployment therefore keeps its name, so a
  # redeploy updates the app.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # ContainerAppParameters#/mappings/AppParameters:
  #   honoured — infra.image (required), infra.port as the ingress's target
  #     port and the readiness probe's port, infra.replicas as the replica
  #     count, infra.compute.cpu and infra.compute.memory as the Consumption
  #     size that entry chooses, the overrides above, and env entries.
  #   refused — infra.published_port, a port published on the host with Docker
  #     Compose, which a container app has no host to publish on; a compute
  #     quantity that entry cannot read, and a pair larger than the largest
  #     size; more than 1,000 replicas; a component name Container Apps does
  #     not take for an app; a variable under a name Container Apps sets
  #     itself, or one both delivered and named in secrets; a value declared
  #     sensitive that an inject block, the component's own or a connection's,
  #     delivers into a variable (a connection whose target publishes such a
  #     value that nothing delivers builds); a file, arg or custom-mechanism entry; and an override that is not
  #     of the form above.
  #   not read — values.display_name and values.description, documentation
  #     knobs no Azure setting takes.
  #
  # The component packages no upstream product, so this Recipe declares none of
  # the locals ContainerAppParameters reads: no default image, so the Release
  # names the one it runs; the port is infra.port; no own value and no socket is
  # delivered by default, since the Component has none; and no probe path and
  # no GPU.

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: ContainerAppParameters#/mappings/AppParameters
