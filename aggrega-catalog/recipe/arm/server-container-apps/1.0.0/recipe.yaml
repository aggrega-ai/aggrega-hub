apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: server-container-apps
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # container app module: the third-party template this Recipe pins and wraps in
  # the output. The container app it creates is a service the reader contracts
  # for directly with Microsoft, under Azure's terms.
  license: MIT
  description: >
    The generic long-running server primitive as one Azure Container Apps app
    running the Release's image on infra.port, deployed from an Azure Resource
    Manager template through Microsoft's Azure Verified Modules module
    avm/res/app/container-app at 0.23.1, MIT, fetched from its git repository
    at that tag; entity.lock pins the tag's commit and archive digest. Reach
    for it where the Release deploys an Azure Resource Manager template, and
    for terraform/server-container-apps where it deploys Terraform.

    Its ingress is internal: only the other apps in its environment reach it.
    The environment is the operator's, required under infra.overrides;
    user-assigned identities and a private registry are optional. Only the app
    is emitted. The module deploys a telemetry resource by default, reporting
    to Microsoft; this Recipe turns it off.

    Each env entry an inject block dictates becomes a container variable, a
    neighbour's value written whole or inside literal text; a name Container
    Apps sets itself, and file, arg and other entries, halt by name. A value
    its producer declares sensitive halts the build: keep it in Key Vault and
    name the secret under infra.overrides.secrets, and the variable reads it
    through a Key Vault-backed app secret by secretRef, so no secret is written
    into the template. The app runs exactly infra.replicas replicas at the
    smallest Consumption size meeting infra.compute.cpu and memory.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/compute/server:1.1.0

  # The module's directory at the tag its registry publishes as version 0.23.1.
  # The registry's tag is the git tag named here; `aggrega pin` resolves it to
  # its commit and records that commit and the archive's digest in entity.lock,
  # and every build vendors exactly those bytes. module_subdir names the
  # module's directory in a repository that holds every Azure Verified Modules
  # module; the provider reads its main.json, the compiled template the module
  # commits, and wraps it as one nested deployment.
  source:
    kind: git-repository
    url: https://github.com/Azure/bicep-registry-modules.git
    ref: avm/res/app/container-app/0.23.1
    module_subdir: avm/res/app/container-app

  # This Recipe reads from infra.overrides:
  #   container_app_environment_id - string (environmentResourceId; location), required
  #   identity_ids                 - []string (managedIdentities.userAssignedResourceIds)
  #   registry_server              - string (registries[0].server)
  #   registry_identity            - string (registries[0].identity)
  #   registry_username            - string (registries[0].username)
  #   registry_password_secret_id  - string (a secrets entry's keyVaultUrl)
  #   registry_password_identity   - string (that secrets entry's identity)
  #   secrets                      - map[string]{origin: string, identity: string} (secrets; containers[0].env)
  #   registry_password            - refused: the password is read from Key Vault
  #   enable_telemetry             - refused while true: telemetry is always off
  # resource_group_name is not read: the app is created in the resource group
  # the template is deployed to.
  #
  # Each key but secrets is the one terraform/server-container-apps reads for
  # the same concept, under the same spelling, so an operator writes one set of
  # overrides across both; the module parameter each sets is given in brackets.
  # secrets is named after the module's own secrets parameter.
  # container_app_environment_id is required and has no default: the Container
  # Apps environment the app runs in is provisioned outside this Release, no
  # subscription-independent value exists for it, and this Recipe never chooses
  # an environment, and with it a network, for the operator. It is the
  # environment's resource ID,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>;
  # the environment decides the network the app's egress leaves through and
  # where the app's logs go, so this Recipe reads no log destination.
  #
  # Where the app is created. An app runs in its environment, so location is
  # bound to the environment's own location rather than left at the module's
  # default, the resource group's location, which need not be the
  # environment's region. It is read when the template deploys, by a reference()
  # call over container_app_environment_id at API version 2026-01-01, the one
  # the module creates the app at and the Azure Verified Modules managed
  # environment module creates an environment at; the identity that deploys the
  # template reads the environment.
  #
  # identity_ids are the resource IDs of user-assigned managed identities that
  # already exist, which the server's code calls Azure with. A private image is
  # pulled from registry_server, the registry's host name, either with
  # registry_identity, a user-assigned identity granted pull on the registry, or
  # with registry_username and a password Container Apps reads from the Key
  # Vault secret registry_password_secret_id names,
  # https://<vault>.vault.azure.net/secrets/<name>, with the user-assigned
  # identity registry_password_identity names; that password is the app secret
  # registry-password. With no registry key set the image is pulled as a public
  # one.
  #
  # secrets is how a credential reaches the container: each entry's key is the
  # name of the container variable that holds it, origin the resource ID of the
  # Key Vault secret,
  # /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<name>,
  # the value core/referenced-secret takes under the same name on arm, and
  # identity the user-assigned identity Container Apps reads it with, named
  # after the module's own field, which needs read access to that secret. Each entry becomes one app secret, named
  # after the variable in lowercase with each underscore a hyphen, whose
  # keyVaultUrl is
  # [format('https://{0}{1}/secrets/{2}', '<vault>', environment().suffixes.keyvaultDns, '<name>')],
  # so the vault's address is the one of the cloud the template deploys to and
  # Container Apps reads the secret's latest version; the variable names that
  # secret with secretRef. The value never passes through the Release or the
  # template. It is the route for a credential a neighbour would otherwise
  # deliver: a delivery its producer declares sensitive halts the build, as the
  # comment above valuesMapping sets out.
  #
  # Every identity named for the registry or for a secret is given to the app as
  # well, since Container Apps reads a registry or a Key Vault secret only with
  # one of the app's own identities. A value written as text would be written
  # into the template, so a password or a secret is taken only by reference, and
  # a system-assigned identity, which Azure creates with the app, is not one this
  # Recipe names.
  #
  # Who reaches the server. The app's ingress is internal, bound here: its
  # address is reachable only from inside its environment, by the other apps
  # there, and it is not published at the environment's inbound address,
  # whether that is public or the internal load balancer of the operator's
  # virtual network. An environment-level HTTP route configuration naming the
  # app as a target is the one way in from outside, and it is the operator's. A
  # wider ingress is not something this Recipe renders. ingressAllowInsecure is
  # bound to false in place of the module's default of true, so a plain HTTP
  # request is redirected to HTTPS, and all traffic goes to the latest
  # revision of a single-revision app.
  #
  # The replica count. The app's minimum and maximum replica count are both
  # infra.replicas, so Container Apps runs exactly that many whatever the
  # traffic. Container Apps configures at most 1,000 replicas of a revision.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out; one worth knowing is maxInactiveRevisions, 0, so the app keeps no
  # inactive revision to return to.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — infra.image (required), infra.port as the ingress's target
  #     port and the readiness probe's port, infra.replicas as the replica
  #     count, infra.compute.cpu and infra.compute.memory as the size below,
  #     and the overrides above.
  #   refused — infra.published_port, a port published on the host with Docker
  #     Compose, which a container app has no host to publish on; a compute
  #     quantity this Recipe cannot read, and a pair larger than the largest
  #     size; more than 1,000 replicas; a component name Container Apps does
  #     not take for an app; a variable under a name Container Apps sets
  #     itself, or one both delivered and named in secrets; a delivery its
  #     producer declares sensitive; and a file, arg or custom-mechanism entry,
  #     as the comment above valuesMapping describes.
  #   not read — values.display_name and values.description, documentation
  #     knobs no Azure setting takes.
  assertions:
    published_port_not_on_container_apps: >-
      {{- if optional .infra "published_port" 0 -}}
      {{- fail (printf "the component %q sets infra.published_port: publishing a port on the host is a Docker Compose setting; on Container Apps the app is reached at infra.port by the other apps in its environment, so remove infra.published_port from the Release for this target" .metadata.instance_id) -}}
      {{- end -}}
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image serving the application in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; one the Release sets empty leaves the container
    # nothing to be sized by, so each must carry a quantity.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "infra.compute.cpu is empty, so the container app would have no CPU to be sized by: set infra.compute.cpu in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "infra.compute.memory is empty, so the container app would have no memory to be sized by: set infra.compute.memory in the Release to a quantity, or remove it to take the component's default" -}}
      {{- end -}}
    compute_fits_container_apps: >-
      {{- if not .locals.cpu_millicores -}}
      {{- fail (printf "infra.compute.cpu is %q, and this Recipe reads it as a Kubernetes CPU quantity, whole millicores such as 100m or vCPUs with at most three decimals such as 0.5: set infra.compute.cpu in the Release to one of those forms" (toString .infra.compute.cpu)) -}}
      {{- end -}}
      {{- if not .locals.memory_mib -}}
      {{- fail (printf "infra.compute.memory is %q, and this Recipe reads it as a Kubernetes memory quantity in whole mebibytes or gibibytes, such as 128Mi or 1Gi: set infra.compute.memory in the Release to one of those forms" (toString .infra.compute.memory)) -}}
      {{- end -}}
      {{- if not .locals.size -}}
      {{- fail (printf "infra.compute asks for cpu %q and memory %q, and no Container Apps Consumption size meets both: the sizes run from 0.25 vCPU with 0.5 GiB to 4 vCPU with 8 GiB, each with twice its vCPU in GiB; set infra.compute in the Release to a pair one size meets" (toString .infra.compute.cpu) (toString .infra.compute.memory)) -}}
      {{- end -}}
    replicas_within_service: >-
      {{- if gt (int .infra.replicas) 1000 -}}
      {{- fail (printf "infra.replicas is %v, and Container Apps configures at most 1,000 replicas of a revision: set infra.replicas in the Release to 1000 or fewer" .infra.replicas) -}}
      {{- end -}}
    # The environment ID is also written inside the reference() call the app's
    # location is read with, so it may hold no single quote.
    environment_supplied: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $v := optional $o "container_app_environment_id" "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail "this Release runs its server as an app in the operator's own Azure Container Apps environment, and this Recipe never chooses one, but infra.overrides.container_app_environment_id carries none: set it in the Release to the environment's resource ID" -}}
      {{- end -}}
      {{- if not (regexMatch `(?i)^/subscriptions/[^/']+/resourceGroups/[^/']+/providers/Microsoft\.App/managedEnvironments/[^/']+$` $v) -}}
      {{- fail (printf "infra.overrides.container_app_environment_id is %q, and this Recipe takes the Container Apps environment the app runs in as the environment's resource ID: set it to /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.App/managedEnvironments/<name>" $v) -}}
      {{- end -}}
    # Each identity is a user-assigned one that already exists, named by its
    # resource ID, and each credential a Key Vault secret named by its ID, so no
    # identity is created and no credential's value is written.
    # DELIBERATE NEAR-DUPLICATE of the registry checks of
    # terraform/server-container-apps and terraform/worker-container-apps, and
    # of this assertion in arm/worker-container-apps: the keys are the same, and
    # an assertion is part of one Recipe, which no catalog kind lets several
    # Recipes share; a change to it is made to all of them.
    optional_overrides_typed: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` -}}
      {{- if eq (toString (optional $o "enable_telemetry" "")) "true" -}}
      {{- fail "infra.overrides.enable_telemetry is true, and this Recipe turns the module's telemetry off in every template it writes: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if hasKey $o "registry_password" -}}
      {{- fail "infra.overrides.registry_password is set, and this Recipe takes a registry password only by reference, so that its value is never written into the template: store it as a Key Vault secret and set infra.overrides.registry_password_secret_id to the secret's ID and infra.overrides.registry_password_identity to a user-assigned identity allowed to read it, then remove infra.overrides.registry_password" -}}
      {{- end -}}
      {{- if hasKey $o "identity_ids" -}}
      {{- $s := index $o "identity_ids" -}}
      {{- $ok := and (kindIs "slice" $s) (gt (len $s) 0) -}}
      {{- if $ok }}{{ range $s }}{{ if not (and (typeIs "string" .) (regexMatch $uai .)) }}{{ $ok = false }}{{ end }}{{ end }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.identity_ids is %s, and this Recipe reads it as a list of resource IDs of existing user-assigned managed identities, each /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to such a list, or remove it" (toJson $s)) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_identity" "registry_password_identity" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) (regexMatch $uai $v)) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as the resource ID of an existing user-assigned managed identity, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "registry_server" "registry_username" -}}
      {{- if hasKey $o $k -}}
      {{- $v := index $o $k -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "infra.overrides.%s is %s, and this Recipe reads it as a string: set it in the Release to one, or remove it" $k (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $o "registry_password_secret_id" -}}
      {{- $v := index $o "registry_password_secret_id" -}}
      {{- if not (and (typeIs "string" $v) (regexMatch `^https://[a-z0-9-]+(\.[a-z0-9-]+)+/secrets/[A-Za-z0-9-]+(/[A-Za-z0-9]+)?$` $v)) -}}
      {{- fail (printf "infra.overrides.registry_password_secret_id is %s, and this Recipe reads it as the ID of the Key Vault secret holding the registry password, https://<vault>.vault.azure.net/secrets/<name>, with or without a version: set it in the Release to that ID, or remove it" (toJson $v)) -}}
      {{- end -}}
      {{- end -}}
      {{- $byPassword := list "registry_username" "registry_password_secret_id" "registry_password_identity" -}}
      {{- $set := list -}}
      {{- range $k := concat (list "registry_identity") $byPassword }}{{ if hasKey $o $k }}{{ $set = append $set $k }}{{ end }}{{ end -}}
      {{- if and $set (not (hasKey $o "registry_server")) -}}
      {{- fail (printf "infra.overrides.%s is set, and it says how a private image is pulled from a registry, but infra.overrides.registry_server names none: set infra.overrides.registry_server in the Release to the registry's host name, or remove the registry keys" (first $set)) -}}
      {{- end -}}
      {{- if hasKey $o "registry_server" -}}
      {{- $missing := list -}}
      {{- range $k := $byPassword }}{{ if not (hasKey $o $k) }}{{ $missing = append $missing $k }}{{ end }}{{ end -}}
      {{- if and (hasKey $o "registry_identity") (lt (len $missing) 3) -}}
      {{- fail "infra.overrides sets registry_identity and a registry user name or password as well, and Container Apps pulls an image from a registry either with a managed identity or with a user name and password, never both: keep registry_identity alone, or registry_username, registry_password_secret_id and registry_password_identity together" -}}
      {{- end -}}
      {{- if and (not (hasKey $o "registry_identity")) $missing -}}
      {{- fail (printf "infra.overrides.registry_server names a private registry, and this Recipe pulls from it either with registry_identity, or with registry_username, registry_password_secret_id and registry_password_identity together, but infra.overrides.%s is not set: set registry_identity, or the three keys together, in the Release" (first $missing)) -}}
      {{- end -}}
      {{- end -}}
    # Each secrets entry names its variable, the Key Vault secret and the
    # identity, and nothing else: a value written in place of the reference
    # would be written into the template. The secret is named after the
    # variable, so two variables naming one secret, or one naming the registry
    # password's, halt. The vault's and the secret's names are written inside
    # the keyVaultUrl expression, so each holds only the characters Key Vault
    # names take: 3 to 24 letters, digits and hyphens for a vault, 1 to 127 for
    # a secret.
    # DELIBERATE NEAR-DUPLICATE of this assertion in arm/worker-container-apps,
    # for the reason the one above gives.
    secrets_by_reference: >-
      {{- $s := optional (optional .infra "overrides" dict) "secrets" "" -}}
      {{- if not (eq (toString $s) "") -}}
      {{- if not (and (kindIs "map" $s) (gt (len $s) 0)) -}}
      {{- fail "infra.overrides.secrets is set, and this Recipe reads it as a map from the name of a container variable to the Key Vault secret it holds: write it as {<VARIABLE>: {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}}, or remove it" -}}
      {{- end -}}
      {{- $uai := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^/]+$` -}}
      {{- $kv := `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[A-Za-z0-9-]{3,24}/secrets/[A-Za-z0-9-]{1,127}$` -}}
      {{- $named := dict -}}
      {{- if hasKey (optional .infra "overrides" dict) "registry_password_secret_id" }}{{ $_ := set $named "registry-password" "infra.overrides.registry_password_secret_id" }}{{ end -}}
      {{- range $name, $e := $s -}}
      {{- if not (regexMatch `^[A-Za-z0-9]([-_A-Za-z0-9]*[A-Za-z0-9])?$` $name) -}}
      {{- fail (printf "infra.overrides.secrets names the variable %q, and this Recipe names the app secret holding it after the variable, so a variable named in secrets holds letters, digits, underscores and hyphens, beginning and ending with a letter or a digit: rename it in the Release" $name) -}}
      {{- end -}}
      {{- if has $name (list "CONTAINER_APP_NAME" "CONTAINER_APP_REVISION" "CONTAINER_APP_HOSTNAME" "CONTAINER_APP_ENV_DNS_SUFFIX" "CONTAINER_APP_PORT" "CONTAINER_APP_REPLICA_NAME") -}}
      {{- fail (printf "infra.overrides.secrets names the variable %q, and Container Apps sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME, CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and CONTAINER_APP_REPLICA_NAME in every app itself, so the two would collide: rename the variable in the Release" $name) -}}
      {{- end -}}
      {{- if not (kindIs "map" $e) -}}
      {{- fail (printf "infra.overrides.secrets.%s is %s, and this Recipe reads each entry as the Key Vault secret the variable holds: write it as {origin: <secret resource ID>, identity: <user-assigned identity resource ID>}" $name (toJson $e)) -}}
      {{- end -}}
      {{- if hasKey $e "value" -}}
      {{- fail (printf "infra.overrides.secrets.%s sets value, and this Recipe takes a secret only by reference, so that its value is never written into the template: store it as a Key Vault secret, set origin to the secret's resource ID and identity to a user-assigned identity allowed to read it, then remove value" $name) -}}
      {{- end -}}
      {{- range $k, $_ := $e -}}
      {{- if not (has $k (list "origin" "identity")) -}}
      {{- fail (printf "infra.overrides.secrets.%s sets %s, and this Recipe reads origin and identity alone from an entry: remove %s from the Release" $name $k $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if not (and (typeIs "string" (optional $e "origin" 0)) (regexMatch $kv (toString (optional $e "origin" "")))) -}}
      {{- fail (printf "infra.overrides.secrets.%s.origin is not a Key Vault secret's resource ID, and this Recipe names the secret the variable holds by that ID: write /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret> in infra.overrides.secrets.%s.origin in the Release, with a vault name of 3 to 24 and a secret name of 1 to 127 letters, digits and hyphens" $name $name) -}}
      {{- end -}}
      {{- if not (and (typeIs "string" (optional $e "identity" 0)) (regexMatch $uai (toString (optional $e "identity" "")))) -}}
      {{- fail (printf "infra.overrides.secrets.%s.identity is %s, and this Recipe reads it as the resource ID of an existing user-assigned managed identity allowed to read the secret, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>: set it in the Release to that ID" $name (toJson (optional $e "identity" ""))) -}}
      {{- end -}}
      {{- $secret := lower (replace "_" "-" $name) -}}
      {{- if hasKey $named $secret -}}
      {{- fail (printf "infra.overrides.secrets.%s and %s both name the app secret %s, which this Recipe names after the variable in lowercase with each underscore a hyphen: rename one of them in the Release" $name (get $named $secret) $secret) -}}
      {{- end -}}
      {{- $_ := set $named $secret (printf "infra.overrides.secrets.%s" $name) -}}
      {{- end -}}
      {{- end -}}

  # The app's size, read off the table of Container Apps' "vCPU and memory
  # allocation requirements", which every app on the Consumption plan meets:
  # 0.25 vCPU with 0.5 GiB, and each step of 0.25 vCPU with 0.5 GiB more, to 4
  # vCPU with 8 GiB. The app runs on the environment's Consumption workload
  # profile, the one Container Apps places an app on when it names none, at the
  # first size meeting both the CPU and the memory infra.compute asks for. Each
  # requested quantity is a floor: the container may be given more than was
  # written, and is billed for what it is given. The Component's defaults, 100m
  # and 128Mi, are below the smallest size, so they run at 0.25 vCPU and 0.5
  # GiB. An environment of the Consumption-only type takes 2 vCPU with 4 GiB at
  # most, which the build cannot see: a larger size fails when the template
  # deploys. A size the table adds later is not chosen until it is listed here.
  # DELIBERATE NEAR-DUPLICATE: these locals are the ones
  # terraform/server-container-apps, terraform/worker-container-apps and
  # arm/worker-container-apps declare, word for word, because a local is part of
  # one Recipe; a change to the table is made to all four. cpu_millicores and
  # memory_mib are also the locals the Amazon ECS and Cloud Run Recipes declare.
  locals:
    # The requested CPU in millicores, or empty when it is not a quantity this
    # Recipe reads: whole millicores, or vCPUs with at most three decimals.
    cpu_millicores: >-
      {{- $c := toString (optional (optional .infra "compute" dict) "cpu" "") -}}
      {{- if regexMatch `^[0-9]+m$` $c -}}{{ atoi (trimSuffix "m" $c) }}
      {{- else if regexMatch `^[0-9]+(\.[0-9]{1,3})?$` $c -}}
      {{- $p := splitList "." $c -}}{{- $f := 0 -}}
      {{- if eq (len $p) 2 }}{{ $f = atoi (substr 0 3 (printf "%s000" (index $p 1))) }}{{ end -}}
      {{- add (mul (atoi (index $p 0)) 1000) $f -}}
      {{- end -}}
    # The requested memory in MiB, or empty when it is not a quantity this
    # Recipe reads: whole Mi or Gi.
    memory_mib: >-
      {{- $m := toString (optional (optional .infra "compute" dict) "memory" "") -}}
      {{- if regexMatch `^[0-9]+Mi$` $m -}}{{ atoi (trimSuffix "Mi" $m) }}
      {{- else if regexMatch `^[0-9]+Gi$` $m -}}{{ mul (atoi (trimSuffix "Gi" $m)) 1024 }}
      {{- end -}}
    # The first size meeting both, as vcpu/memory in the table's own spelling,
    # or empty when none does.
    size: >-
      {{- $found := "" -}}
      {{- if and .locals.cpu_millicores .locals.memory_mib -}}
      {{- $mc := atoi .locals.cpu_millicores -}}{{- $mib := atoi .locals.memory_mib -}}
      {{- range list (list 250 512 "0.25" "0.5Gi") (list 500 1024 "0.5" "1.0Gi") (list 750 1536 "0.75" "1.5Gi") (list 1000 2048 "1.0" "2.0Gi") (list 1250 2560 "1.25" "2.5Gi") (list 1500 3072 "1.5" "3.0Gi") (list 1750 3584 "1.75" "3.5Gi") (list 2000 4096 "2.0" "4.0Gi") (list 2250 4608 "2.25" "4.5Gi") (list 2500 5120 "2.5" "5.0Gi") (list 2750 5632 "2.75" "5.5Gi") (list 3000 6144 "3.0" "6.0Gi") (list 3250 6656 "3.25" "6.5Gi") (list 3500 7168 "3.5" "7.0Gi") (list 3750 7680 "3.75" "7.5Gi") (list 4000 8192 "4.0" "8.0Gi") -}}
      {{- if and (not $found) (ge (index . 0) $mc) (ge (index . 1) $mib) -}}
      {{- $found = printf "%s/%s" (index . 2) (index . 3) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $found -}}
    size_cpu: '{{ if .locals.size }}{{ index (splitList "/" .locals.size) 0 }}{{ end }}'
    size_memory: '{{ if .locals.size }}{{ index (splitList "/" .locals.size) 1 }}{{ end }}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  # Each key binds the module parameter of the same name. The app is named
  # after the component, so the name is checked here against what Container
  # Apps accepts for one. Its one container, main, receives requests on
  # infra.port; the image is the Release's, so no product documents a health
  # endpoint, and the readiness probe opens a TCP connection to infra.port, so
  # the ingress sends a replica no traffic until its process accepts one. No
  # liveness probe is declared, because a start-up time cannot be known for an
  # image this Recipe does not name. The CPU is written as json('<vCPU>'), the
  # form Bicep compiles a fractional number to, since an ARM template writes no
  # fractional number of its own.
  #
  # The environment is read off the inject pipe by exact leaf, at
  # .context.inject.env, and every variable on it becomes one entry of the
  # container's env, under the name the Aggregate gave it, in name order. Each
  # value is written whole, so a neighbour's ARM expression, such as the host a
  # database publishes, reaches the template as an expression ARM evaluates
  # where the neighbour's resource is declared; a neighbour's value written
  # inside literal text, such as postgres://<value>:5432, is written by the
  # provider as a format() expression. Each entry of infra.overrides.secrets
  # adds one variable naming its app secret by secretRef, and a variable both
  # delivered and named there halts, naming it. Container Apps sets
  # CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME,
  # CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and
  # CONTAINER_APP_REPLICA_NAME in every app itself, so an inject block
  # dictating one would collide with the platform's own variable, and it halts
  # here, naming which.
  #
  # A delivery its producer declares sensitive. The mapping reads the pipe, so
  # when a delivery on it is declared sensitive the provider refuses every
  # literal this mapping produces and the build halts naming the parameters,
  # rather than write the value into the template as text. The route for such a
  # credential is Key Vault: store it there, name it under
  # infra.overrides.secrets, and drop the delivery from the inject block, so
  # the container reads it through an app secret by secretRef.
  #
  # The pipe itself is read only for the names of the mechanisms on it, and
  # every one but env halts, naming the entry and its mechanism: a file entry,
  # because its content would reach the container as the value of an app
  # secret, which the template would carry as text; an arg entry, because this
  # Recipe renders no command line, and Container Apps passes a container's
  # arguments to its startup command in place of the image's default ones,
  # which are the Release's; and any custom mechanism. A connection's own entries, at
  # .context.uses, are not read: a producer that publishes a value declared
  # sensitive would mark the mapping even where no inject block delivers it.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, whose env entries reach the pipe under the
  # names the developer chose and so reach the container with every other env
  # entry. The component has no own value this Recipe names, so the template
  # reads only which names that block delivers, at .context.self_inject, for a
  # refusal of one of them to name the block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  valuesMapping: |
    {{- if not (and (regexMatch `^[a-z][-a-z0-9]{0,30}[a-z0-9]$` .context.instance_id) (not (contains "--" .context.instance_id))) }}
    {{- fail (printf "the component %q names its Azure container app, and Container Apps takes a name of 2 to 32 lowercase letters, digits and hyphens that begins with a letter, ends with a letter or a digit and holds no two hyphens together: rename the component in the Aggregate to such a name" .context.instance_id) }}
    {{- end }}
    {{- range $mechanism, $entries := default dict .context.inject }}
    {{- if not (has $mechanism (list "all" "env")) }}
    {{- range $name, $_ := $entries }}
    {{- if eq $mechanism "file" }}
    {{- fail (printf "the component %q is handed a file at %q by an inject block on one of its connections or attachments, under the delivery mechanism file, and this realization delivers env entries alone: the file's content would reach the container as the value of an app secret, written into the template as text. Dictate the value as an env entry in that inject block instead" $.context.instance_id $name) }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by an inject block on one of its connections or attachments, under the delivery mechanism arg, and this realization renders no command line: Container Apps passes a container's arguments to its startup command in place of the image's default ones, and those are the Release's. Dictate the value as an env entry in that inject block instead" $.context.instance_id $name) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by an inject block on one of its connections or attachments, and this realization delivers env entries alone: dictate the value as an env entry in that inject block instead" $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $env := optional (default dict .context.inject) "env" dict }}
    {{- $ownEnv := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $o := optional .infra "overrides" dict }}
    {{- $secrets := optional $o "secrets" dict }}
    {{- range $k, $_ := $env }}
    {{- $by := "an inject block on one of its connections or attachments" }}
    {{- if hasKey $ownEnv $k }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- if has $k (list "CONTAINER_APP_NAME" "CONTAINER_APP_REVISION" "CONTAINER_APP_HOSTNAME" "CONTAINER_APP_ENV_DNS_SUFFIX" "CONTAINER_APP_PORT" "CONTAINER_APP_REPLICA_NAME") }}
    {{- fail (printf "the component %q is handed the variable %q by %s, and Container Apps sets CONTAINER_APP_NAME, CONTAINER_APP_REVISION, CONTAINER_APP_HOSTNAME, CONTAINER_APP_ENV_DNS_SUFFIX, CONTAINER_APP_PORT and CONTAINER_APP_REPLICA_NAME in every app itself, so the two would collide: rename the variable in that inject block" $.context.instance_id $k $by) }}
    {{- end }}
    {{- if hasKey $secrets $k }}
    {{- fail (printf "the component %q is handed the variable %q by %s, and infra.overrides.secrets names it as well, so one would silently replace the other: rename the variable in that inject block, or remove the entry from infra.overrides.secrets" $.context.instance_id $k $by) }}
    {{- end }}
    {{- end }}
    {{- $entries := dict }}
    {{- range $k, $v := $env }}{{ $_ := set $entries $k (dict "name" $k "value" $v) }}{{ end }}
    {{- $appSecrets := list }}
    {{- $identities := list }}
    {{- range $v := optional $o "identity_ids" list }}{{ $identities = append $identities $v }}{{ end }}
    {{- range $k := list "registry_identity" "registry_password_identity" }}{{ with optional $o $k "" }}{{ $identities = append $identities . }}{{ end }}{{ end }}
    {{- with optional $o "registry_password_secret_id" "" }}
    {{- $appSecrets = append $appSecrets (dict "name" "registry-password" "keyVaultUrl" . "identity" (optional $o "registry_password_identity" "")) }}
    {{- end }}
    {{- range $k, $e := $secrets }}
    {{- $secret := lower (replace "_" "-" $k) }}
    {{- $id := splitList "/" (toString (optional $e "origin" "")) }}
    {{- $appSecrets = append $appSecrets (dict "name" $secret "keyVaultUrl" (printf "[format('https://{0}{1}/secrets/{2}', '%s', environment().suffixes.keyvaultDns, '%s')]" (index $id 8) (index $id 10)) "identity" (optional $e "identity" "")) }}
    {{- $identities = append $identities (optional $e "identity" "") }}
    {{- $_ := set $entries $k (dict "name" $k "secretRef" $secret) }}
    {{- end }}
    {{- $envList := list }}
    {{- range $k, $e := $entries }}{{ $envList = append $envList $e }}{{ end }}
    {{- $container := dict "name" "main" "image" .infra.image "resources" (dict "cpu" (printf "[json('%s')]" .locals.size_cpu) "memory" .locals.size_memory) "probes" (list (dict "type" "Readiness" "tcpSocket" (dict "port" (int .infra.port)))) }}
    {{- if $envList }}{{ $_ := set $container "env" $envList }}{{ end }}
    name: "{{ .context.instance_id }}"
    location: "[reference('{{ $o.container_app_environment_id }}', '2026-01-01', 'full').location]"
    environmentResourceId: {{ toJson $o.container_app_environment_id }}
    containers: {{ toJson (list $container) }}
    scaleSettings:
      minReplicas: {{ .infra.replicas }}
      maxReplicas: {{ .infra.replicas }}
    activeRevisionsMode: Single
    disableIngress: false
    ingressExternal: false
    ingressTargetPort: {{ .infra.port }}
    ingressAllowInsecure: false
    traffic:
      - latestRevision: true
        weight: 100
    {{- with uniq $identities }}
    managedIdentities:
      userAssignedResourceIds: {{ toJson . }}
    {{- end }}
    {{- $server := optional $o "registry_server" "" }}
    {{- $pullIdentity := optional $o "registry_identity" "" }}
    {{- if and $server $pullIdentity }}
    registries: {{ toJson (list (dict "server" $server "identity" $pullIdentity)) }}
    {{- else if $server }}
    registries: {{ toJson (list (dict "server" $server "username" (optional $o "registry_username" "") "passwordSecretRef" "registry-password")) }}
    {{- end }}
    {{- with $appSecrets }}
    secrets: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
