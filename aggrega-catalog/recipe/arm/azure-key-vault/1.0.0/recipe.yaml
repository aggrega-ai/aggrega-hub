apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-key-vault
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Key Vault module: the third-party template this Recipe pins and wraps in
  # the output. The vault it provisions is a service the reader contracts for
  # directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Key Vault: one vault authorizing access to its contents with Azure
    role-based access control, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/key-vault/vault at 0.14.3, MIT, pinned by digest in
    entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-key-vault where it deploys
    Terraform. The vault is standard unless infra.overrides.sku_name is
    premium, keeps deleted contents 90 days unless
    infra.overrides.soft_delete_retention_days names 7 to 90, and has purge
    protection unless infra.overrides.purge_protection_enabled is false.
    Public network access is on unless
    infra.overrides.public_network_access_enabled is false. On each apply
    the template sets the vault's network rule set to allow every network
    and its access policies to none. The module's telemetry is off.

    host is an expression for the DNS name in the URI the service reports,
    or infra.overrides.host; endpoint is that URI, or one built on
    infra.overrides.host. A vault name the service refuses halts naming the
    component; any infra.overrides key not listed, resource_group_name, and
    enable_telemetry true halt naming the key, as do sku_name,
    soft_delete_retention_days, purge_protection_enabled,
    public_network_access_enabled, location and host given in a form they
    do not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/security/azure-key-vault:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.14.3, the module Bicep names
  # br/public:avm/res/key-vault/vault:0.14.3. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.KeyVault/vaults at API version 2026-02-01, its secrets, keys,
  # access policies and private endpoints in nested deployments of the
  # module's own, and passes the catalog's check of every rendered template
  # against the Azure Resource Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/key-vault/vault
    version: 0.14.3

  locals:
    # The name the Release gives the vault under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expressions in provides read.
    symbol: '{{ capitalizedWords .context.instance_id }}'

  # This Recipe reads from infra.overrides:
  #   sku_name                       - string (sku: standard or premium; default standard)
  #   soft_delete_retention_days     - integer (softDeleteRetentionInDays: 7 to 90; default 90)
  #   purge_protection_enabled       - bool (enablePurgeProtection; default true)
  #   public_network_access_enabled  - bool (publicNetworkAccess, Enabled or Disabled;
  #                                    default true)
  #   location                       - string (location; the module's default is the resource group's)
  #   tags                           - map[string]string (tags)
  #   enable_telemetry               - false alone (enableTelemetry, always false)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. enable_telemetry: true halts by name, since
  # telemetry is always off. No key names the tenant: the module sets the
  # vault's tenantId to the tenant of the subscription the template deploys
  # into, subscription().tenantId, and takes no parameter for it.
  #
  # Each but enable_telemetry is the key terraform/azure-key-vault reads for
  # the same concept, under the same spelling; that Recipe refuses
  # enable_telemetry, since its module is the catalog's own, and also reads
  # resource_group_name, since Terraform names the group a resource is
  # created in. The module parameter each sets is given in brackets.
  # sku_name is the key every Azure Recipe reads for the tier a service is
  # provisioned at, public_network_access_enabled the key every Azure Recipe
  # reads for a boolean switch of public access, and host the key every
  # managed Recipe reads for the address it publishes;
  # soft_delete_retention_days and purge_protection_enabled are the
  # arguments of the azurerm provider's vault resource.
  #
  # sku_name. Microsoft offers a vault in two tiers, spelt as the service
  # spells them: standard, unless set, which protects keys in software; and
  # premium, which can also hold keys protected by hardware security modules.
  # Both hold secrets and certificates alike. The module takes these two
  # alone, and any other value halts below by name.
  #
  # soft_delete_retention_days. Soft delete is always on: the service turns
  # it on by default for a new vault, once on it cannot be turned off, and
  # this Recipe writes enableSoftDelete true. A deleted vault, or a deleted
  # secret, key or certificate, stays recoverable for this many days, 90
  # unless set, and the service purges it after that. Microsoft documents 7
  # to 90 days, and documents that the period is fixed when the vault is
  # created and cannot be changed afterwards, so a later apply giving
  # another value fails when the template deploys. While a deleted vault is
  # retained, its name stays taken: the service refuses to create a vault
  # under it until the deleted one is recovered, or purged where purge
  # protection allows.
  #
  # purge_protection_enabled. Unset or true, the vault has purge protection,
  # the module's own default: a deleted vault or object cannot be purged
  # before its retention period ends, only recovered. Microsoft documents
  # that enabling it is irreversible, and that most Azure services
  # integrating with Key Vault, such as Storage, require it. false makes the
  # module pass no value, since the property takes none but true, so a vault
  # created that way has no purge protection, while a vault that already has
  # it keeps it.
  #
  # public_network_access_enabled. A vault is reached over its public
  # endpoint or over a private endpoint in a virtual network. Unset or true,
  # public network access is Enabled; false writes Disabled, and the vault
  # takes requests through a private endpoint alone, apart from the trusted
  # Microsoft services the network rule set lets through. This Recipe emits
  # no private endpoint: it is the operator's, created for the vault outside
  # the Release, the way a virtual network's subnets and private DNS zones
  # are.
  #
  # The network rule set. The module writes the vault's networkAcls from the
  # object passed to it, and this Recipe passes the default action Allow, the
  # trusted Microsoft services bypassing it, and no IP or virtual network
  # rule, so with public network access on the public endpoint takes
  # requests from every network, each still authorized through Microsoft
  # Entra ID. The rule set is a property of the vault, which Azure Resource
  # Manager writes as the template gives it each time it applies the
  # template, so IP and virtual network rules made outside the template are
  # overwritten on the next apply. Access to the vault is restricted with
  # public_network_access_enabled false and the operator's private endpoint;
  # IP and virtual network rules are not offered.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry. The
  # module passes false to its own nested deployments on its own.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: the create mode default, so a vault is
  # created rather than recovered; and no secret, key, access policy, lock,
  # role assignment, private endpoint or diagnostic setting. With no access
  # policy passed, the module writes the vault's access policies as an empty
  # list on each apply, and a vault authorizing with role-based access
  # control ignores access policies in any case.
  #
  # These are replaced: sku, whose default is premium, by
  # infra.overrides.sku_name, standard unless set; publicNetworkAccess, which
  # the module leaves to the service while no private endpoint is passed, by
  # infra.overrides.public_network_access_enabled; networkAcls, which the
  # module leaves out while none is passed, by the rule set above;
  # enableVaultForDeployment and enableVaultForDiskEncryption, each true by
  # default, by false, so neither virtual machines nor Azure Disk Encryption
  # read the vault on its own grant; and softDeleteRetentionInDays and
  # enablePurgeProtection by the keys above, with the module's defaults.
  # enableVaultForTemplateDeployment, enableRbacAuthorization and
  # enableSoftDelete are written as true, their defaults, so the contract
  # stands in the template itself: Azure Resource Manager may read the
  # vault's secrets while deploying a template, which a Key Vault reference
  # needs, and the vault authorizes reads and writes of its contents with
  # Azure role-based access control.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — a vault name the service refuses; infra.overrides.
  #     resource_group_name; enable_telemetry true; sku_name given as
  #     anything but standard or premium; soft_delete_retention_days as
  #     anything but a whole number from 7 to 90; purge_protection_enabled
  #     and public_network_access_enabled as anything but a boolean;
  #     location as anything but a string; host as anything but a bare DNS
  #     name; and any infra.overrides key not listed above.
  #   not read — none.
  #
  # Credentials. The vault keeps no key of its own: every request to it is
  # authenticated with Microsoft Entra ID and authorized by the role
  # assignments the operator makes, so nothing is published but its address.
  # Backup. Microsoft documents no backup of a whole vault, only of each
  # secret, key or certificate on demand, so this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "soft_delete_retention_days" "purge_protection_enabled" "public_network_access_enabled" "location" "tags" "enable_telemetry" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Key Vault in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, soft_delete_retention_days, purge_protection_enabled, public_network_access_enabled, location, tags, enable_telemetry and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "standard" -}}
      {{- if not (has $s (list "standard" "premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Microsoft offers a Key Vault in the tiers standard and premium, spelt in lower case, which the module takes alone: set infra.overrides.sku_name to one of them, or remove it for standard" $s) -}}
      {{- end -}}
      {{- $d := optional $o "soft_delete_retention_days" 90 -}}
      {{- $whole := or (kindIs "int" $d) (kindIs "int64" $d) (and (kindIs "float64" $d) (eq (float64 (int $d)) $d)) -}}
      {{- if not (and $whole (ge (int $d) 7) (le (int $d) 90)) -}}
      {{- fail (printf "infra.overrides.soft_delete_retention_days is %v, and Microsoft documents a Key Vault keeping deleted contents for 7 to 90 days: set infra.overrides.soft_delete_retention_days to a whole number in that range, or remove it for 90" $d) -}}
      {{- end -}}
      {{- $pp := optional $o "purge_protection_enabled" true -}}
      {{- if not (kindIs "bool" $pp) -}}
      {{- fail (printf "infra.overrides.purge_protection_enabled is %v, and it switches the vault's purge protection as a boolean: set it to false to create the vault without it, or to true or remove it to keep it on" $pp) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the vault's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the vault is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a client of this vault reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the vault takes requests over HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The vault is named after the component, and its name is also the first
    # label of the address the service gives it, so it is unique across Azure.
    # Microsoft's documentation of Azure resource names gives a Key Vault name
    # 3 to 24 letters, digits and hyphens, starting with a letter, ending with
    # a letter or digit, and holding no two hyphens in a row; it is checked
    # here, where the name is known.
    vault_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if or (not (regexMatch `^[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]$` $n)) (contains "--" $n) -}}
      {{- fail (printf "the component %q names its Key Vault, and Microsoft documents a vault name as 3 to 24 letters, digits and hyphens, starting with a letter, ending with a letter or digit, with no two hyphens in a row: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service reports the vault's URI, the
  # address a client calls the vault at, as https://<vault>.vault.azure.net/
  # in the public cloud, under its cloud's own domain elsewhere, and the
  # module publishes it as its uri output. host reads that output from the
  # nested deployment this component becomes and takes the DNS name between
  # https:// and the path, so it holds whichever domain the service's cloud
  # gives; the URI names no port. endpoint is the output as the service
  # reports it. Azure Resource Manager evaluates each expression when the
  # template deploys, after the vault exists, so it resolves for a consumer
  # in the same template, through the link for a consumer in another arm
  # template, and as text on another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression, and endpoint is https://<name>/. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the vault outside the Release. A client checking the
  # vault's certificate needs a name the certificate carries: the vault's own
  # name under vault.azure.net, resolving to a private endpoint through the
  # operator's private DNS zone where one is linked.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[split(reference('{{ .locals.symbol }}').outputs.uri.value, '/')[2]]{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}/{{ else }}[reference('{{ .locals.symbol }}').outputs.uri.value]{{ end }}"

  # Each key binds the module parameter of the same name. The vault is named
  # after the component, as the other managed Recipes name theirs.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    sku: {{ optional $o "sku_name" "standard" }}
    enableRbacAuthorization: true
    enableSoftDelete: true
    softDeleteRetentionInDays: {{ int (optional $o "soft_delete_retention_days" 90) }}
    enablePurgeProtection: {{ if optional $o "purge_protection_enabled" true }}true{{ else }}false{{ end }}
    enableVaultForTemplateDeployment: true
    enableVaultForDeployment: false
    enableVaultForDiskEncryption: false
    publicNetworkAccess: {{ if optional $o "public_network_access_enabled" true }}Enabled{{ else }}Disabled{{ end }}
    networkAcls:
      bypass: AzureServices
      defaultAction: Allow
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
