apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sql-server-azure-sql-database
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # SQL server module: the third-party template this Recipe pins and wraps in
  # the output. The logical server and database it provisions are a service
  # the reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values, attachments and infra.overrides keys this Recipe refuses are
  # listed, with their reasons, in the comments above the assertions.
  description: >
    SQL Server on Azure SQL Database: one logical server and the one database
    values.database names, deployed from an Azure Resource Manager template
    through Microsoft's Azure Verified Modules module avm/res/sql/server at
    0.23.1, MIT, fetched from mcr.microsoft.com and pinned by digest in
    entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager template
    and the database is an Azure SQL Database in the operator's subscription;
    reach for terraform/sql-server-azure-sql-database where the Release
    deploys Terraform. Public network access is off unless
    infra.overrides.public_network_access_enabled is true; the private
    endpoint or the firewall rules a client reaches the server through are
    the operator's, and none is emitted.

    The administrator values.user names takes the password from the Key Vault
    secret a core/referenced-secret attachment on the password slot names,
    bound to arm/key-vault-secret, handed to the server as a Key Vault
    reference, so the template carries no password; with nothing attached, or
    another credential, the build halts naming the slot. host publishes an
    expression for the server's FQDN, or infra.overrides.host; port is 1433.
    A value or an infra.overrides key the service or the module cannot take
    halts naming it, as do a storage size the SKU's tier does not take and
    an administrator login the service keeps for a principal of its own;
    infra.overrides.sku_name sizes the database. The database keeps the
    service's automated backups 7 days unless a core/backup attachment sets
    them, and such an attachment halts, naming the Feature, where no
    FeatureRecipe for the arm capability realizes core/backup.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/datastore/sql-server:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.23.1, the module Bicep names
  # br/public:avm/res/sql/server:0.23.1. `aggrega pin` records the digests of
  # its manifest and of its template layer in entity.lock, and every build
  # reads exactly those bytes. The provider reads the template, main.json, and
  # wraps it as one nested deployment.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/sql/server
    version: 0.23.1

  locals:
    # The SKU, infra.overrides.sku_name or GP_Gen5_2: two vCores of the
    # General Purpose tier on standard-series (Gen5) hardware, the size the
    # service's own production preset provisions.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "GP_Gen5_2" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The name the Release gives the server under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # Names the backup this Recipe configures from a core/backup attachment.
    # A FeatureRecipe binding such an attachment to the service's own backup
    # reads it beneath its own locals, and halts on a host whose Recipe
    # declares none, which would configure nothing from the attachment.
    native_backup: "Azure SQL Database automated backups"

  # This Recipe reads from infra.overrides:
  #   sku_name                       - string (databases[0].sku.name; default "GP_Gen5_2")
  #   public_network_access_enabled  - bool (publicNetworkAccess, Enabled or Disabled; default false)
  #   location                       - string (location; the module's default is the resource group's)
  #   tags                           - map[string]string (tags)
  #   enable_telemetry               - false alone (enableTelemetry, always false)
  #   host                           - string (published as provides.host; not passed to the module)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. enable_telemetry: true halts by name, since
  # telemetry is always off.
  #
  # Each is the key terraform/sql-server-azure-sql-database reads for the same
  # concept, under the same spelling, and that Recipe also reads
  # resource_group_name, since Terraform names the group a resource is created
  # in; the module parameter each sets is given in brackets. sku_name is the
  # key every Azure Recipe reads for the size a service is provisioned at,
  # public_network_access_enabled the key every Azure Recipe reads for a
  # boolean switch of public access, and host the key every managed datastore
  # Recipe reads for the address it publishes.
  #
  # sku_name names the database's service objective as the service spells it:
  # a vCore SKU such as GP_Gen5_2, GP_S_Gen5_1 (serverless), BC_Gen5_4 or
  # HS_Gen5_2, or a DTU SKU such as Basic, S0 or P1. The service checks the
  # name, and whether the region offers it, when the template deploys.
  #
  # public_network_access_enabled. A logical server takes connections over its
  # public endpoint, subject to the server's firewall rules, or over a private
  # endpoint in a virtual network. Unset or false, public network access is
  # Disabled and a client reaches the server only through a private endpoint;
  # true enables it, and a client reaches it only where a firewall rule admits
  # its address. This Recipe emits neither a private endpoint nor a firewall
  # rule: each is the operator's, created for the server outside the Release,
  # the way a virtual network's subnets and private DNS zones are.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: TLS 1.2 is the oldest version a client may
  # connect with; the server's auditing is enabled and sends its events to
  # Azure Monitor; the connection policy is the service's Default, which
  # redirects a client inside Azure to the node hosting the database, on a
  # port from 11000 to 11999, and proxies one outside Azure through 1433;
  # and the database's backups are kept on geo-redundant storage. These are
  # replaced: the database's sku, maxSizeBytes and zoneRedundant, whose
  # defaults in the module's database template are GP_Gen5_2, 32 GiB and zone
  # redundant, and which this mapping passes from infra.overrides.sku_name,
  # infra.storage.size and infra.ha.enabled; availabilityZone, a required
  # entry that is -1, no zone pinned; and publicNetworkAccess, which this
  # mapping passes from infra.overrides.public_network_access_enabled.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.database, as the database the module creates;
  #     values.user, as the administrator login; values.collation, as the
  #     database's collation; the password attachment, as the administrator's
  #     password; infra.storage.size, as the database's maximum data size in
  #     whole gibibytes; infra.ha.enabled, as the database's zone redundancy;
  #     and the overrides above.
  #   refused — infra.engine_version other than the Component's default, 2022:
  #     Azure SQL Database runs the service's own current database engine and
  #     takes no version; infra.port other than 1433; infra.compute.cpu and
  #     infra.compute.memory, since infra.overrides.sku_name sizes the
  #     database; infra.storage.type, since the service tier fixes the
  #     storage; infra.storage.size where the SKU's tier does not take it;
  #     infra.ha.enabled on a SKU the service makes no database zone
  #     redundant on; a database name the service refuses; values.user naming
  #     a principal the service keeps; a credential on the password slot other
  #     than core/referenced-secret, or none; and any infra.overrides key not
  #     listed above.
  #   not read — infra.engine_version while it is 2022 and infra.port while it
  #     is 1433, the Component's defaults: the service runs its own engine
  #     and serves 1433, and a Recipe cannot tell a default from a value the
  #     Release wrote.
  #
  # Backup. Azure SQL Database backs up every database: a full backup each
  # week, a differential one every 12 or 24 hours and a log backup about every
  # 10 minutes, at times the service chooses, and keeps them for
  # point-in-time restore 1 to 35 days, 1 to 7 on the Basic tier, 7 by
  # default; no setting turns them off. The mapping reads a core/backup
  # attachment among the component's attachments, as the comment above it
  # says. An attachment binds only where a FeatureRecipe for the arm
  # capability realizes core/backup in the catalog the build reads; where none
  # does, it halts at the Manifest, naming the Feature, and the database keeps
  # its backups 7 days.
  #
  # The administrator's password is the module's administratorLoginPassword, a
  # secure parameter: the nested deployment receives a Key Vault reference
  # object in its place, which Azure Resource Manager resolves while the
  # template deploys, so no password is written into the template. The
  # attachment on the password slot publishes the secret's resource ID in
  # provides.name; the vault's ID is that ID without its /secrets/<name> tail,
  # and secretName is the name. The service draws no password, so with
  # nothing attached the build halts, and so it does on any credential other
  # than core/referenced-secret: another carries its value as text, which
  # would be written into the template, or carries none the service could
  # take; core/random-password draws its password at apply time on the
  # terraform capability, which no template here can read. The service takes
  # a password of 8 to 128 characters holding three of upper-case letters,
  # lower-case letters, digits and other characters, and not holding the
  # login; the build never sees the secret's value, so the secret the operator
  # creates holds such a password. The assertions read the slot, but an
  # assertion does not see what an attachment publishes; the mapping halts
  # where the published ID is no Key Vault secret's.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "public_network_access_enabled" "location" "tags" "enable_telemetry" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the logical server in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, public_network_access_enabled, location, tags, enable_telemetry and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" false -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the logical server's public network access as a boolean: set it to true to enable it, or to false or remove it to keep it disabled" $p) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "GP_Gen5_2" -}}
      {{- if not (and (typeIs "string" $s) (regexMatch `^[A-Za-z0-9_]+$` (toString $s))) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and the database's SKU is the service objective's name, letters, digits and underscores, such as GP_Gen5_2, GP_S_Gen5_1, BC_Gen5_4, HS_Gen5_2, Basic, S0 or P1: set infra.overrides.sku_name to one, or remove it for GP_Gen5_2" $s) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (or (regexMatch `[/@\s]` $h) (eq (len (splitList ":" $h)) 2) (contains "]:" $h)) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the address a consumer of this database reaches it at, given as a DNS name or an IP literal alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the server serves port 1433` $h) -}}
      {{- end -}}
      {{- end -}}
    # The logical server is named after the component, and its name is also
    # the first label of the address the service gives it under
    # database.windows.net, so it is unique across Azure; the rule the service
    # checks it against is checked here, where the name is known.
    server_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` $n) -}}
      {{- fail (printf "the component %q names its logical server, and a server name holds 1 to 63 lowercase letters, digits and hyphens, beginning and ending with a letter or a digit: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}
    # The database names the service refuses: one over 128 characters, one
    # holding < > * % & : \ / ? or a control character, one ending in a period
    # or a space, and master, the system database every logical server holds.
    database_name: >-
      {{- $d := toString .values.database -}}
      {{- if or (eq $d "") (gt (len $d) 128) (regexMatch `[<>*%&:\\/?[:cntrl:]]` $d) (hasSuffix "." $d) (hasSuffix " " $d) (eq (lower $d) "master") -}}
      {{- fail (printf "values.database is %q, and Azure SQL Database takes a database name of 1 to 128 characters holding none of < > * %% & : \\ / ? or a control character, not ending in a period or a space, and other than master, the system database every logical server holds: set values.database in the Aggregate to such a name" $d) -}}
      {{- end -}}
    # The names of the principals SQL Server keeps on every logical server and
    # database, read off its documentation of the Database Engine's principals
    # and of the roles of master in Azure SQL Database: the sa login and the
    # public server role, the dbo, guest, INFORMATION_SCHEMA and sys users, and
    # the dbmanager and loginmanager roles. The administrator login is named
    # once, when the server is created, and this Recipe refuses each of these
    # names for it, and an empty name, which names no login.
    administrator_login: >-
      {{- $u := toString .values.user -}}
      {{- if or (eq $u "") (has (lower $u) (list "sa" "public" "dbo" "guest" "information_schema" "sys" "dbmanager" "loginmanager")) -}}
      {{- fail (printf "values.user is %q, the logical server's administrator login, and SQL Server keeps sa, public, dbo, guest, INFORMATION_SCHEMA, sys, dbmanager and loginmanager for principals of its own on every logical server and database, while an empty name names no login: set values.user in the Aggregate to another name" $u) -}}
      {{- end -}}
    engine_version_is_the_service: >-
      {{- if ne (toString .infra.engine_version) "2022" -}}
      {{- fail (printf "infra.engine_version is %q, and Azure SQL Database runs the service's own current database engine, which no setting chooses: remove infra.engine_version from the Release, or map this component to a realization that creates the server on the release it names" (toString .infra.engine_version)) -}}
      {{- end -}}
    port_is_the_service_port: >-
      {{- if ne (int .infra.port) 1433 -}}
      {{- fail (printf "infra.port is %v, and Azure SQL Database serves SQL Server on port 1433, which this Recipe publishes as port, and does not move it: remove infra.port from the Release" .infra.port) -}}
      {{- end -}}
    compute_not_taken: >-
      {{- $c := optional .infra "compute" dict -}}
      {{- range $k := list "cpu" "memory" -}}
      {{- with optional $c $k "" -}}
      {{- fail (printf "infra.compute.%s is %v, and Azure SQL Database sizes the database by its SKU, which this Recipe reads from infra.overrides.sku_name, not by a CPU or memory figure: remove infra.compute.%s from the Release and set infra.overrides.sku_name" $k . $k) -}}
      {{- end -}}
      {{- end -}}
    # The service takes the maximum data size in bytes; this Recipe passes
    # whole gibibytes. On a DTU SKU the service takes only the sizes its
    # documentation of the CREATE DATABASE statement lists for the SKU's tier,
    # read in whole gibibytes: 1 and 2 on Basic; 1, 2, 5, 10, 20, 30, 40, 50,
    # 100, 150, 200 and 250 on S0 to S2; those and 300, 400, 500, 750 and 1024
    # on S3 to S12 and P1 to P6; and those and every 256 from 1280 to 4096 on
    # P11 and P15, which some regions cap at 1024. A vCore SKU caps the size at
    # its own largest, which the service checks when the template deploys.
    storage: >-
      {{- $size := toString .infra.storage.size -}}
      {{- if not (and (regexMatch `^[0-9]+Gi$` $size) (ge (int (trimSuffix "Gi" $size)) 1)) -}}
      {{- fail (printf "infra.storage.size is %q, and this Recipe sets the database's maximum data size in whole gibibytes, from 1Gi: set infra.storage.size in the Release to such a size, such as 32Gi" $size) -}}
      {{- end -}}
      {{- $gi := int (trimSuffix "Gi" $size) -}}
      {{- $s := .locals.sku -}}
      {{- $low := list 1 2 5 10 20 30 40 50 100 150 200 250 -}}
      {{- $high := concat $low (list 300 400 500 750 1024) -}}
      {{- $sizes := list -}}
      {{- if eq $s "Basic" -}}{{- $sizes = list 1 2 -}}
      {{- else if regexMatch `^S[0-2]$` $s -}}{{- $sizes = $low -}}
      {{- else if regexMatch `^P(11|15)$` $s -}}{{- $sizes = concat $high (list 1280 1536 1792 2048 2304 2560 2816 3072 3328 3584 3840 4096) -}}
      {{- else if regexMatch `^[SP][0-9]+$` $s -}}{{- $sizes = $high -}}
      {{- end -}}
      {{- if and $sizes (not (has $gi $sizes)) -}}
      {{- fail (printf "infra.storage.size is %q, and Azure SQL Database takes the maximum data size of a database on SKU %s as one of %s GiB: set infra.storage.size in the Release to one of them, such as %vGi" $size $s (join ", " $sizes) (last $sizes)) -}}
      {{- end -}}
      {{- with optional .infra.storage "type" "" -}}
      {{- fail (printf "infra.storage.type is %q, and Azure SQL Database chooses the database's storage by the SKU's service tier and takes no storage type: remove infra.storage.type from the Release" (toString .)) -}}
      {{- end -}}
    # Zone redundancy, read off the service's reliability documentation: the
    # Basic and Standard tiers take none; General Purpose takes it on
    # standard-series (Gen5) hardware alone; Hyperscale takes it only with
    # zone-redundant backup storage and a high-availability replica, which no
    # key of this Recipe sets. Premium and Business Critical take it.
    sku_and_ha: >-
      {{- $s := .locals.sku -}}
      {{- if .infra.ha.enabled -}}
      {{- if or (eq $s "Basic") (eq $s "Standard") (regexMatch `^S[0-9]+$` $s) -}}
      {{- fail (printf "infra.ha.enabled is true, and infra.overrides.sku_name is %s, of the Basic or Standard tier, which Azure SQL Database makes no database zone redundant on: set infra.overrides.sku_name to a General Purpose, Business Critical or Premium SKU, such as GP_Gen5_2, or infra.ha.enabled to false" $s) -}}
      {{- end -}}
      {{- if and (hasPrefix "GP_" $s) (not (regexMatch `^GP_(S_)?Gen5_` $s)) -}}
      {{- fail (printf "infra.ha.enabled is true, and infra.overrides.sku_name is %s, General Purpose on hardware other than standard-series (Gen5), which Azure SQL Database makes no database zone redundant on: set infra.overrides.sku_name to a Gen5 SKU, such as GP_Gen5_2, or infra.ha.enabled to false" $s) -}}
      {{- end -}}
      {{- if hasPrefix "HS_" $s -}}
      {{- fail (printf "infra.ha.enabled is true, and infra.overrides.sku_name is %s, of the Hyperscale tier, which Azure SQL Database makes zone redundant only with zone-redundant backup storage and a high-availability replica, and this Recipe sets neither: set infra.overrides.sku_name to a General Purpose, Business Critical or Premium SKU, or infra.ha.enabled to false" $s) -}}
      {{- end -}}
      {{- end -}}
    credentials: >-
      {{- $f := default dict .features -}}
      {{- if not (hasKey $f "password") -}}
      {{- fail "the password slot is empty, and Azure SQL Database draws no password for the administrator values.user names: attach core/referenced-secret to the password slot, naming the Key Vault secret that holds it, and bind it to arm/key-vault-secret in the Manifest" -}}
      {{- end -}}
      {{- $ty := first (splitList ":" (toString (optional $f.password "type" ""))) -}}
      {{- if ne $ty "core/referenced-secret" -}}
      {{- fail (printf "the password slot is filled by %s, and this Recipe hands the logical server its administrator's password as a Key Vault reference to a secret the attachment names, which core/referenced-secret publishes through arm/key-vault-secret; another credential either carries its value as text, which would be written into the template, or carries none the service could take: attach core/referenced-secret to the password slot, bound to arm/key-vault-secret in the Manifest" $ty) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. host reads the nested deployment this
  # component becomes, whose symbolic name is the instance id folded into
  # words, and names the module's fullyQualifiedDomainName output, the
  # server's name under database.windows.net; Azure Resource Manager evaluates
  # the expression when the template deploys, so it resolves for a consumer in
  # the same template, through the link for a consumer in another arm
  # template, and as text on another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression. It is the operator's deterministic pointer: the
  # compiler pipes it as text and looks nothing up, and this Recipe emits no
  # DNS record for it, so the operator points the name at the server outside
  # the Release. A client checking the server's certificate needs a name the
  # certificate carries, which is the server's own name under
  # database.windows.net or the private link name that resolves to it.
  #
  # port is 1433, where the service serves SQL Server. user and database are
  # the developer values the module creates; protocol is sqlserver.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[reference('{{ capitalizedWords .context.instance_id }}').outputs.fullyQualifiedDomainName.value]{{ end }}"
    port: "1433"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "sqlserver"

  # Each key binds the module parameter of the same name. The logical server
  # is named after the component, as the other managed Recipes name theirs.
  # The administrator's password is the Key Vault reference object Azure
  # Resource Manager reads in a secure parameter's place: the vault's ID and
  # the secret's name, both taken from the one resource ID the attachment
  # publishes. The mapping reads that attachment by those exact leaves.
  #
  # The database is the module's one databases entry. Its maximum data size is
  # infra.storage.size in bytes.
  #
  # Backup is the core/backup attachment, found among the component's
  # attachments by its type with any version set aside. The service backs up
  # every database at times it chooses and keeps the backups for
  # point-in-time restore 1 to 35 days, 1 to 7 on the Basic tier, so no
  # setting turns them off and no time reaches them:
  #   - With none attached, the mapping writes no short-term retention policy
  #     and the database keeps the service's default, 7 days.
  #   - An attachment carrying no infra.role_arn sets the policy's retentionDays
  #     from infra.retention_days, and a value outside the tier's range halts
  #     naming the attachment; infra.schedule halts naming it, since the
  #     service takes no backup time. The policy's differential backup interval
  #     is 24 hours on a DTU SKU and 12 hours on a vCore SKU, the service's
  #     default for each, where the module would otherwise write 24 for both.
  #     The service keeps point-in-time restore for every database across that
  #     window, and no setting turns it off, so infra.point_in_time_recovery
  #     left out or true is what it gives, and false halts naming the
  #     attachment rather than being ignored.
  #   - An attachment carrying infra.role_arn is AWS Backup's, whose
  #     realizations refuse a host that is no Amazon RDS instance; this Recipe
  #     configures nothing from it.
  #   - Two attachments carrying no infra.role_arn halt naming both: a database
  #     runs one automated backup.
  # Reading the attachments reads no value an attachment declares sensitive
  # into what the mapping writes, so the provider's refusal of a literal
  # produced from such a value does not reach these parameters. A Recipe's
  # locals cannot read its attachments, so the reading sits at the top of the
  # mapping below.
  valuesMapping: |
    {{- /* core/backup, found among this component's attachments by its type with any version set aside. */ -}}
    {{- $backupNative := "" -}}{{- $backupNativeInfra := dict -}}
    {{- range $name, $attachment := (default dict .features) -}}
    {{- if eq (first (splitList ":" (toString (optional $attachment "type" "")))) "core/backup" -}}
    {{- $in := default dict (optional $attachment "infra" dict) -}}
    {{- if not (trim (toString (optional $in "role_arn" ""))) -}}
    {{- if $backupNative -}}
    {{- fail (printf "core/backup attachments %q and %q on %q both leave its backup to Azure SQL Database, which runs one automated backup on a database: remove one of the two" $backupNative $name $.context.instance_id) -}}
    {{- end -}}
    {{- $backupNative = $name -}}{{- $backupNativeInfra = $in -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $dtu := or (has .locals.sku (list "Basic" "Standard" "Premium")) (regexMatch `^[SP][0-9]+$` .locals.sku) -}}
    {{- $backupRetention := 0 -}}
    {{- if $backupNative -}}
    {{- with trim (toString (optional $backupNativeInfra "schedule" "")) -}}
    {{- fail (printf "core/backup attachment %q on %q is scheduled %q in infra.schedule, and Azure SQL Database takes each backup at a time it chooses, which no setting moves: remove infra.schedule from the attachment" $backupNative $.context.instance_id .) -}}
    {{- end -}}
    {{- $backupRetention = int (optional $backupNativeInfra "retention_days" 7) -}}
    {{- $most := 35 -}}{{- if eq .locals.sku "Basic" }}{{ $most = 7 }}{{ end -}}
    {{- if or (lt $backupRetention 1) (gt $backupRetention $most) -}}
    {{- fail (printf "core/backup attachment %q on %q keeps each backup for %d days in infra.retention_days, and Azure SQL Database keeps a database's backups for point-in-time restore 1 to %d days on SKU %s, which this Recipe sets from it: set infra.retention_days to a number in that range" $backupNative .context.instance_id $backupRetention $most .locals.sku) -}}
    {{- end -}}
    {{- if eq (toString (optional $backupNativeInfra "point_in_time_recovery" "")) "false" -}}
    {{- fail (printf "core/backup attachment %q on %q sets infra.point_in_time_recovery to false, and Azure SQL Database keeps point-in-time restore for every database, across the retention window, with no setting that turns it off: remove infra.point_in_time_recovery from the attachment, or set it to true" $backupNative .context.instance_id) -}}
    {{- end -}}
    {{- end -}}
    {{- $o := optional .infra "overrides" dict }}
    {{- $id := toString .features.password.provides.name }}
    {{- if not (regexMatch `(?i)^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/vaults/[^/]+/secrets/[^/]+$` $id) }}
    {{- fail (printf "the password slot of %q is filled by an attachment that publishes no Key Vault secret resource ID, and the administrator's password is handed to the logical server as a reference to that secret: bind core/referenced-secret to arm/key-vault-secret in the Manifest" .context.instance_id) }}
    {{- end }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    administratorLogin: "{{ .values.user }}"
    administratorLoginPassword:
      reference:
        keyVault:
          id: "{{ regexReplaceAll `/secrets/[^/]+$` $id "" }}"
        secretName: "{{ regexFind `[^/]+$` $id }}"
    {{- if optional $o "public_network_access_enabled" false }}
    publicNetworkAccess: Enabled
    {{- else }}
    publicNetworkAccess: Disabled
    {{- end }}
    databases:
      - name: "{{ .values.database }}"
        sku:
          name: "{{ .locals.sku }}"
        maxSizeBytes: {{ mul (int (trimSuffix "Gi" (toString .infra.storage.size))) 1073741824 }}
        availabilityZone: -1
        zoneRedundant: {{ if .infra.ha.enabled }}true{{ else }}false{{ end }}
        {{- with optional .values "collation" "" }}
        collation: "{{ . }}"
        {{- end }}
        {{- if $backupNative }}
        backupShortTermRetentionPolicy:
          retentionDays: {{ $backupRetention }}
          diffBackupIntervalInHours: {{ if $dtu }}24{{ else }}12{{ end }}
        {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
