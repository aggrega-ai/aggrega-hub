apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-ai-search
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # search service module: the third-party template this Recipe pins and
  # wraps in the output. The search service it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values, attachments and infra.overrides keys this Recipe refuses are
  # listed, with their reasons, in the comments above the assertions.
  description: >
    Azure AI Search: one search service, deployed from an Azure Resource
    Manager template through Microsoft's Azure Verified Modules module
    avm/res/search/search-service at 0.13.1, MIT, fetched from
    mcr.microsoft.com and pinned by digest in entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager template
    and the service lives in the operator's subscription; reach for
    terraform/azure-ai-search where the Release deploys Terraform. Public
    network access is off unless infra.overrides.public_network_access_enabled
    is true; the private endpoint or the IP rules a client reaches the service
    through are the operator's, and none is emitted. The module deploys a
    telemetry resource by default, reporting to Microsoft; this Recipe turns it
    off.

    The service's API keys are off, so it takes requests authenticated with
    Microsoft Entra ID alone, and no key is written into the template or
    published; the role assignment granting a consumer's identity access is
    the operator's, and none is emitted. host publishes an expression for the
    service's DNS name, read from the endpoint the service reports, or
    infra.overrides.host; port is 443; endpoint is https:// followed by host.
    infra.overrides.sku_name sets the service tier, standard unless set, and
    infra.overrides.replica_count and partition_count its replicas and
    partitions, 1 each unless set. values.semantic_search sets the semantic
    ranker's plan, at the service's management API version 2025-05-01. A
    value or an infra.overrides key the service or the module cannot take
    halts naming it, as do a replica or partition count the tier does not
    take, more than the 36 search units a service is given, and the semantic
    ranker's standard plan on the free tier. The service keeps no backup of
    its own, and a core/backup attachment halts, naming the Feature, where no
    FeatureRecipe for the arm capability realizes core/backup.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/datastore/azure-ai-search:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.13.1, the module Bicep names
  # br/public:avm/res/search/search-service:0.13.1. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.Search/searchServices at API version 2025-05-01, and passes the
  # catalog's check of every rendered template against the Azure Resource
  # Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/search/search-service
    version: 0.13.1

  locals:
    # The service tier, infra.overrides.sku_name or standard, the module's own
    # default. Only a string is read here; any other value is refused by the
    # assertion below rather than passed on.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The name the Release gives the service under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expressions in provides read.
    symbol: '{{ capitalizedWords .context.instance_id }}'

  # This Recipe reads from infra.overrides:
  #   sku_name                       - string (sku; default "standard")
  #   replica_count                  - integer (replicaCount; default 1)
  #   partition_count                - integer (partitionCount; default 1)
  #   public_network_access_enabled  - bool (publicNetworkAccess, Enabled or Disabled; default false)
  #   location                       - string (location; the module's default is the resource group's)
  #   tags                           - map[string]string (tags)
  #   enable_telemetry               - false alone (enableTelemetry, always false)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. enable_telemetry: true halts by name, since
  # telemetry is always off.
  #
  # Each is the key terraform/azure-ai-search reads for the same concept,
  # under the same spelling, and that Recipe also reads resource_group_name,
  # since Terraform names the group a resource is created in; the module
  # parameter each sets is given in brackets. sku_name is the key every Azure
  # Recipe reads for the size class a service is provisioned at,
  # public_network_access_enabled the key every Azure Recipe reads for a
  # boolean switch of public access, and host the key every managed datastore
  # Recipe reads for the address it publishes.
  #
  # sku_name names the service tier as the service spells it: free, basic,
  # standard, standard2, standard3, storage_optimized_l1 or
  # storage_optimized_l2, the values the module's sku parameter allows. The
  # service checks whether the region offers the tier when the template
  # deploys.
  #
  # replica_count and partition_count. Each replica holds a copy of the
  # service's indexes and answers queries; partitions divide the indexes'
  # storage. Unset, each is 1, the count Microsoft's documentation gives a
  # service when it starts, where the module's own replicaCount default is 3.
  # Two replicas or more give a read service level agreement and spread the
  # replicas across availability zones where the region has them; three give
  # a read-write one. The service tier bounds both counts, which the
  # assertions below check.
  #
  # public_network_access_enabled. A search service takes requests over its
  # public endpoint, subject to the IP rules of its network rule set, or over
  # a private endpoint in a virtual network. Unset or false, public network
  # access is Disabled and a client reaches the service only through a
  # private endpoint; true enables it. This Recipe emits neither a private
  # endpoint nor a network rule set: each is the operator's, created for the
  # service outside the Release, the way a virtual network's subnets and
  # private DNS zones are.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: the hosting mode is Default, so a standard3
  # service runs no high-density partitions; the compute type is Default, not
  # confidential computing; the service carries no managed identity, network
  # rule set, private endpoint, shared private link, role assignment,
  # diagnostic setting or lock; and its keys are exported to no Key Vault,
  # which the module does only while API keys are on. These are replaced:
  # replicaCount, whose default is 3, by infra.overrides.replica_count or 1;
  # publicNetworkAccess, whose default is Enabled, by
  # infra.overrides.public_network_access_enabled or Disabled; and
  # semanticSearch, which the module leaves to the service, by
  # values.semantic_search. disableLocalAuth is written as true, its default,
  # so the contract that no API key reaches a consumer stands in the template
  # itself.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.semantic_search, as the semantic ranker's plan; and the
  #     overrides above.
  #   refused — values.semantic_search standard on the free tier; a replica
  #     count or partition count the tier does not take; more than 36 search
  #     units; a service name the service refuses;
  #     a core/backup attachment, where no FeatureRecipe for the arm capability
  #     realizes core/backup; and any infra.overrides key not listed above.
  #   not read — none.
  #
  # The semantic ranker's plans, read off Microsoft's documentation of its
  # billing: the free plan answers a monthly allowance on every tier and is
  # the service's default, and the standard plan requires the basic tier or
  # above, so standard on the free tier is refused below. disabled is the
  # value the module's management API version, 2025-05-01, takes for the
  # ranker off; Microsoft documents that a service holding it is treated as
  # on the free plan, and that management API versions from
  # 2026-03-01-preview take no disabled.
  #
  # Backup. Azure AI Search keeps no backup of its own: Microsoft's
  # reliability documentation for the service says it offers no self-service
  # backup and restore, since it is not a primary data store, and that an
  # index is rebuilt from its source data. So this Recipe declares no backup
  # it configures, and a core/backup attachment halts the build: at the
  # Manifest, naming the Feature, where no FeatureRecipe for the arm
  # capability realizes core/backup, and in a FeatureRecipe that leaves the
  # backup to the service, which finds none declared here.
  #
  # Credentials. The module's primaryKey and secondaryKey outputs carry the
  # service's admin keys only while API keys are on, and this Recipe keeps
  # them off, so the outputs are empty and nothing reads them.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "replica_count" "partition_count" "public_network_access_enabled" "location" "tags" "enable_telemetry" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the search service in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, replica_count, partition_count, public_network_access_enabled, location, tags, enable_telemetry and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" false -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the search service's public network access as a boolean: set it to true to enable it, or to false or remove it to keep it disabled" $p) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "standard" -}}
      {{- if not (has $s (list "free" "basic" "standard" "standard2" "standard3" "storage_optimized_l1" "storage_optimized_l2")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and the module this Recipe deploys takes a service tier of free, basic, standard, standard2, standard3, storage_optimized_l1 or storage_optimized_l2: set infra.overrides.sku_name to one, or remove it for standard" $s) -}}
      {{- end -}}
      {{- $r := optional $o "replica_count" 1 -}}
      {{- if not (and (or (kindIs "int" $r) (kindIs "int64" $r) (and (kindIs "float64" $r) (eq (float64 (int $r)) $r))) (ge (int $r) 1) (le (int $r) 12)) -}}
      {{- fail (printf "infra.overrides.replica_count is %v, and a search service takes 1 to 12 replicas: set infra.overrides.replica_count to a whole number in that range, or remove it for 1" $r) -}}
      {{- end -}}
      {{- $n := optional $o "partition_count" 1 -}}
      {{- if not (and (or (kindIs "int" $n) (kindIs "int64" $n) (and (kindIs "float64" $n) (eq (float64 (int $n)) $n))) (has (int $n) (list 1 2 3 4 6 12))) -}}
      {{- fail (printf "infra.overrides.partition_count is %v, and a search service takes 1, 2, 3, 4, 6 or 12 partitions: set infra.overrides.partition_count to one of them, or remove it for 1" $n) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the search service is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
    # The service's limits by tier, read off Microsoft's documentation of the
    # service's limits and of creating a service: the free tier runs on shared
    # infrastructure and takes no replicas or partitions beyond its one; the
    # basic tier takes up to 3 replicas and 3 partitions; the other tiers take
    # up to 12 of each, and up to 36 search units, a search unit being one
    # replica of one partition. The semantic ranker's standard plan requires
    # the basic tier or above.
    tier_limits: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := .locals.sku -}}
      {{- $r := int (optional $o "replica_count" 1) -}}
      {{- $n := int (optional $o "partition_count" 1) -}}
      {{- if and (eq $s "free") (gt $r 1) -}}
      {{- fail (printf "infra.overrides.replica_count is %d, and infra.overrides.sku_name is free, a tier Azure AI Search runs on shared infrastructure with one replica, which no setting scales: remove infra.overrides.replica_count, or set infra.overrides.sku_name to basic or above" $r) -}}
      {{- end -}}
      {{- if and (eq $s "free") (gt $n 1) -}}
      {{- fail (printf "infra.overrides.partition_count is %d, and infra.overrides.sku_name is free, a tier Azure AI Search runs on shared infrastructure with one partition, which no setting scales: remove infra.overrides.partition_count, or set infra.overrides.sku_name to basic or above" $n) -}}
      {{- end -}}
      {{- if and (eq $s "basic") (gt $r 3) -}}
      {{- fail (printf "infra.overrides.replica_count is %d, and infra.overrides.sku_name is basic, a tier Azure AI Search gives up to 3 replicas: set infra.overrides.replica_count to 3 or fewer, or infra.overrides.sku_name to standard or above" $r) -}}
      {{- end -}}
      {{- if and (eq $s "basic") (gt $n 3) -}}
      {{- fail (printf "infra.overrides.partition_count is %d, and infra.overrides.sku_name is basic, a tier Azure AI Search gives up to 3 partitions: set infra.overrides.partition_count to 3 or fewer, or infra.overrides.sku_name to standard or above" $n) -}}
      {{- end -}}
      {{- if gt (mul $r $n) 36 -}}
      {{- fail (printf "infra.overrides.replica_count is %d and infra.overrides.partition_count is %d, %d search units, and Azure AI Search gives a service up to 36 search units, one for each replica of each partition: lower either count so that their product is 36 or less" $r $n (mul $r $n)) -}}
      {{- end -}}
      {{- if and (eq $s "free") (eq (toString .values.semantic_search) "standard") -}}
      {{- fail "values.semantic_search is standard, and infra.overrides.sku_name is free, a tier on which Azure AI Search offers the semantic ranker's free plan alone, the standard plan requiring the basic tier or above: set values.semantic_search in the Aggregate to free or disabled, or infra.overrides.sku_name in the Release to basic or above" -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a consumer of this search service reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the service answers HTTPS on port 443, and endpoint is https:// followed by the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The service is named after the component, and its name is also the first
    # label of the address the service gives it under search.windows.net, so it
    # is unique across Azure; the rule Microsoft's documentation of creating a
    # service and the resource's schema give a service name, 2 to 60 lowercase
    # letters, digits and hyphens, no hyphen among the first two characters or
    # last, and no two hyphens together, is checked here, where the name is
    # known.
    service_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (and (regexMatch `^[a-z0-9][a-z0-9]+(-[a-z0-9]+)*$` $n) (le (len $n) 60)) -}}
      {{- fail (printf "the component %q names its search service, and a service name holds 2 to 60 lowercase letters, digits and hyphens, with no hyphen among its first two characters or as its last, and no two hyphens together: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service reports its endpoint as
  # https://<service>.search.windows.net/ in the public cloud, under its
  # cloud's own domain elsewhere, and the module publishes it as its endpoint
  # output. host reads that output from the nested deployment this component
  # becomes and takes the DNS name between https:// and the path, so it holds
  # whichever domain the service's cloud gives; endpoint is https:// followed
  # by that name. Azure Resource Manager evaluates each expression when the
  # template deploys, after the service exists, so it resolves for a consumer
  # in the same template, through the link for a consumer in another arm
  # template, and as text on another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression, and endpoint is built on it. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the service outside the Release. A client checking the
  # service's certificate needs a name the certificate carries, which is the
  # service's own name under search.windows.net or the private link name that
  # resolves to it.
  #
  # port is 443, the one port the service serves, over HTTPS alone.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[split(reference('{{ .locals.symbol }}').outputs.endpoint.value, '/')[2]]{{ end }}"
    port: "443"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}{{ else }}[format('https://{0}', split(reference('{{ .locals.symbol }}').outputs.endpoint.value, '/')[2])]{{ end }}"

  # Each key binds the module parameter of the same name. The search service
  # is named after the component, as the other managed Recipes name theirs.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    sku: "{{ .locals.sku }}"
    replicaCount: {{ int (optional $o "replica_count" 1) }}
    partitionCount: {{ int (optional $o "partition_count" 1) }}
    semanticSearch: "{{ .values.semantic_search }}"
    disableLocalAuth: true
    {{- if optional $o "public_network_access_enabled" false }}
    publicNetworkAccess: Enabled
    {{- else }}
    publicNetworkAccess: Disabled
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
