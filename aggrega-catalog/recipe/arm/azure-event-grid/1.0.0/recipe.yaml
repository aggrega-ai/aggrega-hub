apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-event-grid
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Event Grid topic module: the third-party template this Recipe pins and
  # wraps in the output. The topic it provisions is a service the reader
  # contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Event Grid: one custom topic taking events in the format
    values.input_schema names, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/event-grid/topic at 0.10.0, MIT, pinned by digest in
    entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-event-grid where it deploys
    Terraform. Public network access is on unless
    infra.overrides.public_network_access_enabled is false; the private
    endpoint is the operator's. The module's telemetry is off, and the
    template declares no event subscription.

    Access key and shared access signature authentication is off, so the
    topic takes Microsoft Entra ID alone; the role assignment granting a
    publisher access is the operator's. host is an expression for the DNS
    name in the endpoint the service reports, or infra.overrides.host;
    endpoint is that URL, or one built on infra.overrides.host. A topic
    name the service refuses halts naming the component; any
    infra.overrides key not listed, resource_group_name, and
    enable_telemetry true halt naming the key, as do
    public_network_access_enabled, location and host given in a form they
    do not take.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/messaging/azure-event-grid:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.10.0, the module Bicep names
  # br/public:avm/res/event-grid/topic:0.10.0. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.EventGrid/topics at API version 2025-04-01-preview, its event
  # subscriptions and private endpoints in nested deployments of the module's
  # own, and passes the catalog's check of every rendered template against
  # the Azure Resource Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/event-grid/topic
    version: 0.10.0

  locals:
    # The name the Release gives the topic under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expressions in provides read.
    symbol: '{{ capitalizedWords .context.instance_id }}'

  # This Recipe reads from infra.overrides:
  #   public_network_access_enabled  - bool (publicNetworkAccess, Enabled or Disabled;
  #                                    default true)
  #   location                       - string (location; the module's default is the resource group's)
  #   tags                           - map[string]string (tags)
  #   enable_telemetry               - false alone (enableTelemetry, always false)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. enable_telemetry: true halts by name, since
  # telemetry is always off.
  #
  # Each but enable_telemetry is the key terraform/azure-event-grid reads for
  # the same concept, under the same spelling; that Recipe refuses
  # enable_telemetry, since its module is the catalog's own, and also reads
  # resource_group_name, since Terraform names the group a resource is
  # created in. The module parameter each sets is given in brackets.
  # public_network_access_enabled is the key every Azure Recipe reads for a
  # boolean switch of public access, and host the key every managed Recipe
  # reads for the address it publishes.
  #
  # public_network_access_enabled. A topic takes events over its public
  # endpoint, from every network unless IP rules restrict it, or over a
  # private endpoint in a virtual network. Unset or true, public network
  # access is Enabled, the service's default, and since this Recipe passes no
  # IP rule the public endpoint takes events from every network, each request
  # still authenticated with Microsoft Entra ID; false writes Disabled, and
  # the topic takes events through a private endpoint alone. This Recipe
  # emits no private endpoint: it is the operator's, created for the topic
  # outside the Release, the way a virtual network's subnets and private DNS
  # zones are.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry. The
  # module passes false to its own nested deployments on its own.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: TLS 1.2 at least; the topic kind Azure; the
  # service's own data residency boundary, which Microsoft documents as
  # cross-geo, replicating the topic's metadata to its region's pair where
  # the region has one; and no event subscription, managed identity, IP rule,
  # input schema mapping, private endpoint, role assignment, diagnostic
  # setting or lock.
  #
  # These are replaced: publicNetworkAccess, which the module leaves to the
  # service while no private endpoint is passed, by
  # infra.overrides.public_network_access_enabled; and inputSchema, whose
  # default is EventGridSchema, by values.input_schema, which has the same
  # default. disableLocalAuth is written as true, its default, so the contract
  # that no key reaches a consumer stands in the template itself.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.input_schema, as the topic's input schema; and the
  #     overrides above.
  #   refused — a topic name the service refuses; infra.overrides.
  #     resource_group_name; enable_telemetry true; public_network_access_enabled
  #     given as anything but a boolean, location as anything but a string,
  #     and host as anything but a bare DNS name; and any infra.overrides key
  #     not listed above. An input schema the Component does not offer is
  #     refused by the Component's own schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. With local authentication off, the topic's access keys
  # authenticate no request; the module publishes no key output, and nothing
  # reads them. Backup. Microsoft documents Event Grid as an event routing
  # service with no backup or restore of its own, so this Recipe configures
  # none.
  assertions:
    overrides_known: >-
      {{- $known := list "public_network_access_enabled" "location" "tags" "enable_telemetry" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Event Grid topic in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads public_network_access_enabled, location, tags, enable_telemetry and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the topic's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the topic is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a publisher to this topic reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the topic takes events over HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The topic is named after the component, and its name is also the first
    # label of the address the service gives it, so it is unique within its
    # region. Microsoft's documentation of Azure resource names gives an Event
    # Grid topic name 3 to 50 letters, digits and hyphens; it is checked here,
    # where the name is known.
    topic_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9-]{3,50}$` $n) -}}
      {{- fail (printf "the component %q names its Event Grid topic, and Microsoft documents a topic name as 3 to 50 letters, digits and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service reports the topic's endpoint, the
  # URL a publisher sends events to, as
  # https://<topic>.<region>-1.eventgrid.azure.net/api/events in the public
  # cloud, under its cloud's own domain elsewhere, and the module publishes it
  # as its endpoint output. host reads that output from the nested deployment
  # this component becomes and takes the DNS name between https:// and the
  # path, so it holds whichever domain the service's cloud gives; the
  # endpoint names no port. endpoint is the output as the service reports it.
  # Azure Resource Manager evaluates each expression when the template
  # deploys, after the topic exists, so it resolves for a consumer in the
  # same template, through the link for a consumer in another arm template,
  # and as text on another target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression, and endpoint is https://<name>/api/events. It
  # is the operator's deterministic pointer: the compiler pipes it as text
  # and looks nothing up, and this Recipe emits no DNS record for it, so the
  # operator points the name at the topic outside the Release. A client
  # checking the topic's certificate needs a name the certificate carries,
  # which is the topic's own name under eventgrid.azure.net or the private
  # link name that resolves to it.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[split(reference('{{ .locals.symbol }}').outputs.endpoint.value, '/')[2]]{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}/api/events{{ else }}[reference('{{ .locals.symbol }}').outputs.endpoint.value]{{ end }}"

  # Each key binds the module parameter of the same name. The topic is named
  # after the component, as the other managed Recipes name theirs.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    inputSchema: {{ default "EventGridSchema" .values.input_schema }}
    disableLocalAuth: true
    publicNetworkAccess: {{ if optional $o "public_network_access_enabled" true }}Enabled{{ else }}Disabled{{ end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
