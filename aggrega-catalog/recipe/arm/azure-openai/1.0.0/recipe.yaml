apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-openai
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Cognitive Services account module: the third-party template this Recipe
  # pins and wraps in the output. The Azure OpenAI resource it provisions is a
  # service the reader contracts for directly with Microsoft, under Azure's
  # terms.
  license: MIT
  description: >
    Creates the Azure OpenAI resource core/ai-model/azure-openai is served
    from, and its chat model deployment, from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/cognitive-services/account at 0.19.2, MIT, fetched from its git
    repository at that tag; entity.lock pins the tag's commit and archive
    digest: an account of kind OpenAI under the custom subdomain the Release
    names, and one model deployment named values.deployment_name serving
    values.model.

    Reach for it where the Release deploys an Azure Resource Manager template
    and is to create the resource; reach for terraform/azure-openai where it
    deploys Terraform, or for the helm or compose reference where the resource
    already exists outside the Release.

    The account goes in the resource group the template is deployed to; the
    Release names the subdomain in infra.overrides and may name the region.
    Which models, versions and model deployment types a region offers, and the quota
    the subscription holds for them, are the subscription's and no build sees
    them: a model the region does not offer, or one beyond the quota, fails
    when the template deploys.

    endpoint is https://<subdomain>.openai.azure.com, the address Azure serves
    a resource under its custom subdomain, so it is known before the deploy;
    model is the model deployment's name. The account holds its API keys, enabled, and
    the template carries none: a consumer's credential is a key read from the
    resource once it exists, attached on the consumer's connection. Public
    network access is the service's default, every network, unless the Release
    turns it off.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/ai-model/azure-openai:1.0.0

  # The module's directory at the tag its registry publishes as version 0.19.2.
  # `aggrega pin` resolves the git tag to its commit and records that commit
  # and the archive's digest in entity.lock, and every build vendors exactly
  # those bytes. module_subdir names the module's directory in a repository
  # that holds every Azure Verified Modules module; the provider reads its
  # main.json, the compiled template the module commits, and wraps it as one
  # nested deployment. The arm realization of
  # core/ai-model/azure-openai-embedding wraps the same module for an embedding
  # model.
  source:
    kind: git-repository
    url: https://github.com/Azure/bicep-registry-modules.git
    ref: avm/res/cognitive-services/account/0.19.2
    module_subdir: avm/res/cognitive-services/account

  # Values the assertions, provides and the mapping all read, worked out once.
  locals:
    # The model deployment type, infra.overrides.sku_name or Standard: the type whose
    # prompts and responses are processed within the Azure geography of the
    # resource's region. Microsoft recommends GlobalStandard for most
    # workloads, which may process them in any Azure region, so it is the
    # operator's choice, written in the Release, rather than a default.
    sku_name: '{{ optional (optional .infra "overrides" dict) "sku_name" "Standard" }}'
    # The model deployment's capacity, infra.overrides.sku_capacity or 1, the
    # least quota a model deployment holds.
    sku_capacity: '{{ optional (optional .infra "overrides" dict) "sku_capacity" 1 }}'
    # The subdomain the resource is created under and its endpoint is composed
    # from, or empty while the Release names none, which the assertion below
    # refuses.
    subdomain: '{{ $s := optional (optional .infra "overrides" dict) "custom_subdomain_name" "" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   custom_subdomain_name         - string (customSubDomainName), required
  #   location                      - string (location; the module's default is the resource group's)
  #   model_version                 - string (the model deployment's model.version)
  #   sku_name                      - string (the model deployment's sku.name; default "Standard")
  #   sku_capacity                  - integer (the model deployment's sku.capacity; default 1)
  #   public_network_access_enabled - bool (publicNetworkAccess; the service's default is every network)
  #   version_upgrade_option        - string (the model deployment's versionUpgradeOption)
  #   tags                          - map[string]string (tags)
  # resource_group_name and enable_telemetry are not read: the template deploys
  # into the resource group the template is deployed to, and telemetry is always
  # off. infra.overrides.enable_telemetry: true halts by name rather than being
  # ignored.
  #
  # Each is named by the module parameter it sets, or by the model deployment's own
  # property, given in brackets, in the form the terraform realization of this
  # component reads the same concept. custom_subdomain_name is required: it
  # gives the resource its address, and this Recipe never chooses it. It is
  # unique to the resource across Azure and cannot be changed once the
  # resource exists. Microsoft's rule for it is checked below: 2 to 64 letters,
  # digits and hyphens, not ending with a hyphen.
  #
  # model_version names a version of values.model the region offers. Left
  # unset, the service assigns the model's default version when the
  # model deployment is created. version_upgrade_option decides whether the
  # service moves the model deployment to a new default version:
  # OnceNewDefaultVersionAvailable, OnceCurrentVersionExpired or NoAutoUpgrade.
  #
  # sku_name is the model deployment type: Standard, DataZoneStandard,
  # GlobalStandard, DataZoneBatch, GlobalBatch, DataZoneProvisionedManaged,
  # GlobalProvisionedManaged or ProvisionedManaged. sku_capacity is counted in
  # units of the model deployment type: on the standard and batch types a unit is a
  # share of the subscription's quota in the region, 1,000 tokens per minute
  # for most chat models and more for some reasoning models; on the
  # provisioned types it is a provisioned throughput unit, which is purchased
  # outside the template.
  #
  # public_network_access_enabled false turns off access from every network;
  # this Recipe creates no private endpoint, so a resource without public
  # access is reached only through one the operator creates.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out; it binds the ones below against those defaults. disableLocalAuth
  # defaults to true, which leaves only Microsoft Entra authentication; this
  # Recipe binds it to false, so the account has the API keys the consumer's
  # connection reads, as the terraform realization creates it.
  # restrictOutboundNetworkAccess defaults to true; this Recipe binds it to
  # false, the service's own default, as the terraform realization leaves it.
  # enableTelemetry is bound to false, as every Recipe wrapping a module of the
  # Azure Verified Modules programme binds it.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read:
  #   honoured — values.model, which the model deployment serves in the
  #     OpenAI format; values.deployment_name, as its deployment name; and
  #     the overrides above.
  #   refused — infra.endpoint, since this realization composes the address of
  #     the resource it creates; infra.overrides.enable_telemetry true.
  #   not read — values.api_version, which a consumer sends on each request
  #     and the model deployment does not take; values.context_window, a
  #     sizing hint for inference servers; values.display_name and
  #     values.description, which describe the component to a reader.
  assertions:
    subdomain_supplied: >-
      {{- $v := optional (optional .infra "overrides" dict) "custom_subdomain_name" "" -}}
      {{- if not (and (typeIs "string" $v) $v) -}}
      {{- fail (printf "%q creates its Azure OpenAI resource under a subdomain the operator chooses, and this Recipe never chooses it, but infra.overrides.custom_subdomain_name is not set to a name: set infra.overrides.custom_subdomain_name in the Release" .metadata.instance_id) -}}
      {{- end -}}
    custom_subdomain_name: >-
      {{- $s := .locals.subdomain -}}
      {{- if not (and (le (len $s) 64) (regexMatch `^[A-Za-z0-9-]+[A-Za-z0-9]$` $s)) -}}
      {{- fail (printf "infra.overrides.custom_subdomain_name is %q, and an Azure OpenAI resource's custom subdomain is 2 to 64 letters, digits and hyphens, not ending with a hyphen: set it in the Release to such a name, which becomes the first label of https://<subdomain>.openai.azure.com" $s) -}}
      {{- end -}}
    endpoint_not_set: >-
      {{- if hasKey .infra "endpoint" -}}
      {{- fail (printf "%q sets infra.endpoint, and the arm realization of core/ai-model/azure-openai creates the Azure OpenAI resource and composes its address from infra.overrides.custom_subdomain_name: remove infra.endpoint from the Release, or map this component to the helm or compose reference to reach a resource that already exists" .metadata.instance_id) -}}
      {{- end -}}
    # The account is named after the component, as the other managed Recipes
    # name theirs; the rule the service checks the name against is checked
    # here, where the name is known.
    account_name: >-
      {{- if not (regexMatch `^[a-zA-Z0-9][a-zA-Z0-9_.-]+$` .metadata.instance_id) -}}
      {{- fail (printf "the component %q names its Azure OpenAI account, and an account name begins with a letter or a digit and holds letters, digits, periods, hyphens and underscores, two characters at least: rename the component in the Aggregate to such a name" .metadata.instance_id) -}}
      {{- end -}}
    # A number written as version_upgrade_option, 0 included, is refused like any
    # other: an assertion reads a 0 as empty, so the key's presence is tested.
    deployment_settings: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if eq (toString (optional $o "enable_telemetry" "")) "true" -}}
      {{- fail "infra.overrides.enable_telemetry is true, and this Recipe turns the module's telemetry off in every template it writes: remove infra.overrides.enable_telemetry from the Release" -}}
      {{- end -}}
      {{- if not (has .locals.sku_name (list "Standard" "DataZoneStandard" "GlobalStandard" "DataZoneBatch" "GlobalBatch" "DataZoneProvisionedManaged" "GlobalProvisionedManaged" "ProvisionedManaged")) -}}
      {{- fail (printf "infra.overrides.sku_name is %q, and the model deployment types the service takes are Standard, DataZoneStandard, GlobalStandard, DataZoneBatch, GlobalBatch, DataZoneProvisionedManaged, GlobalProvisionedManaged and ProvisionedManaged: set it to one of them, or remove it for Standard" .locals.sku_name) -}}
      {{- end -}}
      {{- if not (regexMatch `^[1-9][0-9]*$` (toString .locals.sku_capacity)) -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and a model deployment's capacity is a whole number of units, 1 or more: set it to one, or remove it for 1" .locals.sku_capacity) -}}
      {{- end -}}
      {{- $mv := optional $o "model_version" "" -}}
      {{- if not (typeIs "string" $mv) -}}
      {{- fail (printf "infra.overrides.model_version is %v, and the model's version is written as a string, such as \"2024-11-20\": quote it in the Release" $mv) -}}
      {{- end -}}
      {{- $loc := optional $o "location" "" -}}
      {{- if not (typeIs "string" $loc) -}}
      {{- fail (printf "infra.overrides.location is %v, and a region is written as a string, such as westeurope: set it in the Release as one" $loc) -}}
      {{- end -}}
      {{- $pna := optional $o "public_network_access_enabled" "" -}}
      {{- if not (or (kindIs "bool" $pna) (eq (toString $pna) "")) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %s, and it is passed to the account as a boolean: set it to false, unquoted, to turn off access from every network, true to keep it, or remove it for the service's default, true" (toJson $pna)) -}}
      {{- end -}}
      {{- $vuo := optional $o "version_upgrade_option" "" -}}
      {{- if or $vuo (and (hasKey $o "version_upgrade_option") (has (kindOf $vuo) (list "int64" "float64"))) -}}
      {{- if not (has $vuo (list "OnceNewDefaultVersionAvailable" "OnceCurrentVersionExpired" "NoAutoUpgrade")) -}}
      {{- fail (printf "infra.overrides.version_upgrade_option is %s, and the model deployment takes OnceNewDefaultVersionAvailable, OnceCurrentVersionExpired or NoAutoUpgrade: set it to one of them, or remove it for the service's default" (toJson $vuo)) -}}
      {{- end -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. endpoint is
  # composed from the subdomain the Release names, the host Azure serves the
  # resource under, so it is the same text on every target and a consumer in
  # the same template or elsewhere reads it directly, without waiting for the
  # account; it resolves once the account exists. model is the model deployment's
  # name, the name a request addresses on this provider.
  provides:
    endpoint: "https://{{ .locals.subdomain }}.openai.azure.com"
    model: "{{ .values.deployment_name }}"

  # Each key binds the module parameter of the same name, case aside. The
  # account is named after the component, as the other managed Recipes name
  # theirs. The module's deployments parameter takes the one model deployment.
  valuesMapping: |
    name: "{{ .context.instance_id }}"
    kind: OpenAI
    sku: S0
    {{- with optional .infra.overrides "location" "" }}
    location: "{{ . }}"
    {{- end }}
    customSubDomainName: "{{ .locals.subdomain }}"
    {{- if kindIs "bool" (optional .infra.overrides "public_network_access_enabled" "") }}
    publicNetworkAccess: {{ if .infra.overrides.public_network_access_enabled }}Enabled{{ else }}Disabled{{ end }}
    {{- end }}
    disableLocalAuth: false
    restrictOutboundNetworkAccess: false
    deployments:
      - name: "{{ .values.deployment_name }}"
        model:
          format: OpenAI
          name: "{{ .values.model }}"
          {{- with optional .infra.overrides "model_version" "" }}
          version: "{{ . }}"
          {{- end }}
        sku:
          name: "{{ .locals.sku_name }}"
          capacity: {{ .locals.sku_capacity }}
        {{- with optional .infra.overrides "version_upgrade_option" "" }}
        versionUpgradeOption: "{{ . }}"
        {{- end }}
    {{- with optional .infra.overrides "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
