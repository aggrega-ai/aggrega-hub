apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-container-registry
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # container registry module: the third-party template this Recipe pins and
  # wraps in the output. The registry it provisions is a service the reader
  # contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Azure Container Registry: one registry, deployed from an Azure Resource
    Manager template through Microsoft's Azure Verified Modules module
    avm/res/container-registry/registry at 0.13.2, MIT, pinned by digest in
    entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-container-registry where it deploys
    Terraform. The registry runs on the Standard tier unless
    infra.overrides.sku_name names Basic or Premium. Public network access
    is on unless infra.overrides.public_network_access_enabled is false,
    which the service takes on Premium alone. On Premium, each deploy sets
    the registry's network rule set to allow every network, with no IP
    rule. The admin account is off, Microsoft Entra tokens issued for Azure
    Resource Manager are accepted, AcrPull and AcrPush assignments are
    honoured at the registry's scope, and untagged manifests are kept. The
    module's telemetry is off.

    host is an expression for the login server the service reports. A
    registry name the service refuses halts naming the component; a key
    the service or the module cannot take halts naming it, as do
    infra.overrides.host, resource_group_name and enable_telemetry true.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/devtool/azure-container-registry:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.13.2, the module Bicep names
  # br/public:avm/res/container-registry/registry:0.13.2. `aggrega pin`
  # records the digests of its manifest and of its template layer in
  # entity.lock, and every build reads exactly those bytes. The provider
  # reads the template, main.json, and wraps it as one nested deployment.
  # The template declares Microsoft.ContainerRegistry/registries at API
  # version 2025-06-01-preview, its replications, webhooks, scope maps,
  # tokens, cache rules, credential sets, tasks and private endpoints in
  # nested deployments of the module's own, and passes the catalog's check
  # of every rendered template against the Azure Resource Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/container-registry/registry
    version: 0.13.2

  locals:
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expression in provides reads.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # The tier, infra.overrides.sku_name or Standard. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   sku_name                      - string (acrSku: Basic, Standard or Premium; default Standard)
  #   public_network_access_enabled - bool (publicNetworkAccess, Enabled or Disabled;
  #                                   default true)
  #   location                      - string (location; the module's default is the resource group's)
  #   tags                          - map[string]string (tags)
  #   enable_telemetry              - false alone (enableTelemetry, always false)
  # resource_group_name and host halt by name, as any key not listed does:
  # the template deploys into the resource group it is deployed to, which no
  # parameter of the module names; and the registry answers at the login
  # server the service gives it, as the String Pipe comment below says.
  # enable_telemetry: true halts by name, since telemetry is always off.
  #
  # Each is the key terraform/azure-container-registry reads for the same
  # concept, under the same spelling, and that Recipe also reads
  # resource_group_name, since Terraform names the group a resource is
  # created in; the module parameter each sets is given in brackets.
  # sku_name is the key every Azure Recipe reads for the tier a service is
  # provisioned at, and public_network_access_enabled the key for a boolean
  # switch of public access.
  #
  # sku_name. Microsoft's page on the registry's tiers describes Basic as a
  # cost-optimized entry point for developers, Standard as satisfying the
  # needs of many production scenarios, with more included storage and
  # image throughput, and Premium as adding geo-replication, private link
  # with private endpoints, IP network rules and higher limits; every tier
  # serves the same data plane, and Microsoft's reliability guidance
  # recommends Premium for production workloads. Unset, the registry runs on
  # Standard, where the module's own default is Premium. The module takes
  # the tier spelt Basic, Standard or Premium, and any other value halts
  # below by name.
  # Microsoft documents that a registry moves between tiers without downtime
  # once its content fits the new tier's storage limit, and that features
  # Premium alone offers are turned off on leaving it.
  #
  # public_network_access_enabled. Unset or true, the registry takes
  # requests at its public endpoint; false writes Disabled, and it takes
  # them through private endpoints alone. Microsoft offers private endpoints
  # on Premium alone, and the azurerm provider's registry resource refuses
  # public access disabled on another tier, so false halts below unless
  # sku_name is Premium. The private endpoint and the private DNS zone
  # privatelink.azurecr.io are the operator's, created for the registry
  # outside the Release, and with them the login server resolves to a
  # private address.
  #
  # The network rule set. The module writes the registry's networkRuleSet
  # from its networkRuleSetDefaultAction and networkRuleSetIpRules
  # parameters, and its default action, Deny, with public access enabled,
  # writes a rule set refusing every public client, which Basic and
  # Standard do not offer at all. This Recipe passes the default action
  # Allow on every tier, and on Premium an empty list of IP rules, so the
  # template writes the rule set Allow with no IP rule on Premium and none
  # on the other tiers. The rule set is a property of the registry, which
  # Azure Resource Manager writes as the template gives it each time it
  # applies the template, so on Premium IP rules made outside the template
  # are overwritten on the next apply. Access is restricted with
  # public_network_access_enabled false and the operator's private
  # endpoint; IP rules are not offered. Trusted Microsoft services bypass
  # network restrictions (networkRuleBypassOptions AzureServices, the
  # module's default), and ACR Tasks do not (networkRuleBypassAllowedForTasks
  # false, the module's default).
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry. The
  # module passes false to its own nested deployments on its own.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: anonymous pull off; no dedicated data
  # endpoint; soft delete off; on Premium, the quarantine and content trust
  # policies off; the domain name label scope left to the service, so host
  # reads whichever login server the service gives the registry; no managed
  # identity, customer-managed key, replication, webhook, scope map, token,
  # cache rule, credential set, task, private endpoint, role assignment,
  # diagnostic setting or lock.
  #
  # These are replaced, and written so that the contract stands in the
  # template itself: acrSku, whose default is Premium, by sku_name, Standard
  # unless set; acrAdminUserEnabled is written false, its default, so the
  # registry's admin account, a user name and two passwords the service
  # generates, stays off; azureADAuthenticationAsArmPolicyStatus, whose
  # default is disabled, by enabled, the service's own default, under which
  # the registry accepts Microsoft Entra tokens issued for Azure Resource
  # Manager as well as tokens issued for the registry, since Microsoft
  # documents that App Service web apps pull images with the former and fail
  # without it; roleAssignmentMode, which the module leaves to the service,
  # by LegacyRegistryPermissions, under which AcrPull and AcrPush assigned at
  # the registry's scope authorize pulls and pushes; exportPolicyStatus,
  # whose default is disabled on Premium, by enabled, the service's own
  # default, since Microsoft documents that disabling export requires public
  # network access disabled; retentionPolicyStatus, whose default enables a
  # policy on Premium deleting untagged manifests after 15 days, by
  # disabled, the service's own default, so no manifest is deleted that a
  # client did not delete; networkRuleSetDefaultAction and
  # networkRuleSetIpRules, as above; and zoneRedundancy, which the module
  # writes on Premium alone and whose default there is Enabled, by Disabled.
  # Microsoft documents that every registry in a region with availability
  # zones is zone-redundant, on every tier, whatever that property says, and
  # that setting it to Disabled has no effect there; written Disabled, it
  # stays as it is on the other tiers when the registry moves to or from
  # Premium.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — a registry name the service refuses;
  #     infra.overrides.resource_group_name and host; enable_telemetry true;
  #     sku_name given as anything but Basic, Standard or Premium;
  #     public_network_access_enabled as anything but a boolean, or false on
  #     a tier other than Premium; location as anything but a string; and
  #     any infra.overrides key not listed above.
  #   not read — none.
  #
  # Credentials. The registry publishes none, and nothing here creates or
  # delivers one: a client authenticates as a Microsoft Entra ID identity,
  # the operator's, authorized by the role assignments the operator makes
  # on the registry, such as AcrPull to pull and AcrPush to push. The admin
  # account stays off, so the service generates no password for it.
  # Backup. Microsoft documents that geo-replication creates no independent
  # recovery point, and recommends copying critical images and artifacts to
  # another registry or to external storage, which is the operator's,
  # outside the Release; this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "public_network_access_enabled" "location" "tags" "enable_telemetry" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the container registry in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Azure Container Registry serves a registry at the login server it gives it, under a certificate for that name, which a private endpoint resolves to a private address under the same name; a custom domain is a private preview Microsoft admits a Premium registry to, outside any template: remove infra.overrides.host from the Release, and read the host the registry publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, public_network_access_enabled, location, tags and enable_telemetry from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $s := optional $o "sku_name" "Standard" -}}
      {{- if not (has $s (list "Basic" "Standard" "Premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Microsoft offers a container registry on the tiers Basic, Standard and Premium, spelt so, which the module takes alone: set infra.overrides.sku_name to one of them, or remove it for Standard" $s) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the registry's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the registry is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
    # Microsoft offers private endpoints on Premium alone, and the azurerm
    # provider's registry resource refuses public access disabled on another
    # tier (internal/services/containers/container_registry_resource.go,
    # v4.81.0).
    public_network_access: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if and (eq (toString (optional $o "public_network_access_enabled" true)) "false") (ne .locals.sku "Premium") -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is false, and a registry takes requests through private endpoints alone on the Premium tier, which Microsoft offers private endpoints on, while this registry runs on %s: set infra.overrides.sku_name to Premium in the Release, or remove public_network_access_enabled" .locals.sku) -}}
      {{- end -}}
    # The registry is named after the component, and its name is also the
    # first label of its login server, so it is unique across Azure.
    # Microsoft's documentation of Azure resource names gives a container
    # registry 5 to 50 letters and digits, which the registry resource's
    # schema bounds the same way; it is checked here, where the name is known.
    registry_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9]{5,50}$` $n) -}}
      {{- fail (printf "the component %q names its container registry, and Azure takes a registry name of 5 to 50 letters and digits, with no hyphen: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret this string. A consumer
  # receives it as written. The service gives the registry its login server
  # when it creates it, <registry>.azurecr.io in lower case in Azure's public
  # cloud, under its cloud's own domain elsewhere, and the registry resource
  # reports it as its read-only loginServer, which the module publishes as
  # its loginServer output, a host name with no scheme. host reads that
  # output from the nested deployment this component becomes. Azure Resource
  # Manager evaluates the expression when the template deploys, after the
  # registry exists, so it resolves for a consumer in the same template,
  # through the link for a consumer in another arm template, and as text on
  # another target.
  #
  # No infra.overrides.host: the registry answers at its login server, under
  # a certificate the service issues for that name, and a private endpoint
  # resolves the same name to a private address through the operator's
  # private DNS zone. A custom domain is a private preview: Microsoft admits
  # a Premium registry to it outside any template, and the registry then
  # serves the domain with a certificate the operator keeps in Azure Key
  # Vault.
  provides:
    host: "[reference('{{ .locals.symbol }}').outputs.loginServer.value]"

  # Each key binds the module parameter of the same name. The registry is
  # named after the component, as the other managed Recipes name theirs.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: {{ toJson . }}
    {{- end }}
    acrSku: {{ .locals.sku }}
    acrAdminUserEnabled: false
    azureADAuthenticationAsArmPolicyStatus: enabled
    roleAssignmentMode: LegacyRegistryPermissions
    publicNetworkAccess: {{ if eq (toString (optional $o "public_network_access_enabled" true)) "false" }}Disabled{{ else }}Enabled{{ end }}
    networkRuleSetDefaultAction: Allow
    {{- if eq .locals.sku "Premium" }}
    networkRuleSetIpRules: []
    {{- end }}
    exportPolicyStatus: enabled
    retentionPolicyStatus: disabled
    zoneRedundancy: Disabled
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
