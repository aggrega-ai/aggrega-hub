apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-container-apps
  version: 1.1.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # container app module: the third-party template this Recipe pins and wraps in
  # the output. The container app it creates is a service the reader contracts
  # for directly with Microsoft, under Azure's terms.
  license: MIT
  description: >
    The generic background-worker primitive as one Azure Container Apps app
    running the Release's image, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/app/container-app at 0.23.1, MIT, fetched from mcr.microsoft.com
    and pinned by digest in entity.lock; ContainerAppParameters binds its
    parameters. Reach for it where the Release deploys an Azure Resource
    Manager template, and for terraform/worker-container-apps where it deploys
    Terraform.

    The app declares no ingress, so nothing reaches it. The environment is the
    operator's, required under infra.overrides; user-assigned identities and a
    private registry are optional. The template holds one nested deployment,
    which creates only the app; the module's telemetry resource, which reports
    to Microsoft by default, is turned off.

    Each env entry an inject block dictates becomes a container variable, a
    neighbour's value written whole or inside literal text; concurrency and
    queue_depth_hint arrive by default as WORKER_CONCURRENCY and
    WORKER_QUEUE_DEPTH_HINT. A name Container Apps sets itself, a default name
    while it is one, and file, arg and other entries, halt by name. A value
    declared sensitive, delivered to the component or published by a target it
    connects to, halts the build: keep it in Key Vault and name the secret
    under infra.overrides.secrets, and the variable reads it through a Key
    Vault-backed app secret by secretRef, so no secret is written into the
    template. The app runs exactly infra.replicas replicas at the smallest
    Consumption size meeting infra.compute.cpu and memory.
    The nested deployment keeps its name, so a redeploy updates the app.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/compute/worker:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.23.1, the module Bicep names
  # br/public:avm/res/app/container-app:0.23.1. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and every
  # build reads exactly those bytes. The provider reads the template, main.json,
  # and wraps it as one nested deployment. It is the template the module's git
  # tag avm/res/app/container-app/0.23.1 commits, compiled by a later Bicep: the
  # two differ only in the compiler version and hash in their metadata and in
  # the name of the module's telemetry resource, which no template this Recipe
  # writes deploys.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/app/container-app
    version: 0.23.1

  # This Recipe reads from infra.overrides:
  #   container_app_environment_id - string (environmentResourceId; location), required
  #   identity_ids                 - []string (managedIdentities.userAssignedResourceIds)
  #   registry_server              - string (registries[0].server)
  #   registry_identity            - string (registries[0].identity)
  #   registry_username            - string (registries[0].username)
  #   registry_password_secret_id  - string (a secrets entry's keyVaultUrl)
  #   registry_password_identity   - string (that secrets entry's identity)
  #   secrets                      - map[string]{origin: string, identity: string} (secrets; containers[0].env)
  #   registry_password            - refused: the password is read from Key Vault
  #   enable_telemetry             - refused while true: telemetry is always off
  # resource_group_name is not read: the app is created in the resource group
  # the template is deployed to.
  #
  # Each key but secrets is the one terraform/worker-container-apps reads for
  # the same concept, under the same spelling, so an operator writes one set of
  # overrides across both; the module parameter each sets is given in brackets.
  # secrets is named after the module's own secrets parameter. These are the
  # keys arm/server-container-apps reads, under the same names, and
  # ContainerAppParameters#/mappings/AppParameters sets out how each is read:
  # the environment by its resource ID, which also gives the app its region;
  # the identities, registry and Key Vault secrets by reference, so no
  # identity is created and no credential's value is written into the
  # template.
  #
  # The app declares no ingress: the Component declares no port, so the
  # ingress is disabled, the module's default being an external one, nothing
  # reaches the worker, and the zero inbound application ports the type
  # promises reach the template. No probe is declared: a worker serves no
  # request a probe could send.
  #
  # The replica count. The app declares no scale rule, and its minimum and
  # maximum replica count are both infra.replicas, so Container Apps runs
  # exactly that many; a minimum of one or more is what keeps an app without
  # ingress running at all. Container Apps configures at most 1,000 replicas of
  # a revision.
  #
  # The nested deployment's symbolic name and its name are folded from the
  # instance id, and the app is named after the component, as in version
  # 1.0.0, which sources the same module version from the module's git
  # repository; for the same Release both versions bind the same parameters
  # to the same values. The nested deployment therefore keeps its name, so a
  # redeploy updates the app.
  #
  # Every Component value and infra key is honoured or refused by name, in
  # ContainerAppParameters#/mappings/AppParameters:
  #   honoured — values.concurrency and values.queue_depth_hint as the locals
  #     below say, infra.image (required), infra.replicas as the replica count,
  #     infra.compute.cpu and infra.compute.memory as the Consumption size that
  #     entry chooses, the overrides above, and env entries.
  #   refused — a compute quantity that entry cannot read, and a pair larger
  #     than the largest size; more than 1,000 replicas; a component name
  #     Container Apps does not take for an app; a variable under a default
  #     name a developer value is delivered under while it is one, under a name
  #     Container Apps sets itself, or both delivered and named in secrets; a
  #     value declared sensitive, delivered or published by a target the
  #     component connects to; a file, arg or custom-mechanism entry; and an
  #     override that is not of the form above.
  #   not read — values.display_name and values.description, documentation
  #     knobs no Azure setting takes.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer values. They are
  # delivered under the names helm/worker delivers them under, and only when
  # the developer set them, so an unset value renders no variable rather than
  # an empty one. Those names are defaults: each is rendered only while no
  # entry of the component's own inject block, in any mechanism, delivers its
  # value, and an edge or that block delivering either name as well halts,
  # naming which, rather than one value silently replacing the other. The
  # component packages no upstream product, so no other local
  # ContainerAppParameters reads is declared: no default image, so the Release
  # names the one it runs; no port, so the app has no ingress; no probe path,
  # no GPU and no socket.
  locals:
    value_env: '{"values.concurrency": "WORKER_CONCURRENCY", "values.queue_depth_hint": "WORKER_QUEUE_DEPTH_HINT"}'

  # The component publishes nothing across an edge, so nothing is emitted for
  # one.
  provides: {}

  valuesMapping:
    $import: ContainerAppParameters#/mappings/AppParameters
