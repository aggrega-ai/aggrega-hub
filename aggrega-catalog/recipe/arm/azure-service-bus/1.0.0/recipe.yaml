apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-service-bus
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Service Bus namespace module: the third-party template this Recipe pins
  # and wraps in the output. The namespace it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The values and infra.overrides keys this Recipe refuses are listed, with
  # their reasons, in the comments above the assertions.
  description: >
    Azure Service Bus: one namespace, with the queues values.queues
    declares and the topics and subscriptions values.topics declares,
    deployed from an Azure Resource Manager template through Microsoft's
    Azure Verified Modules module avm/res/service-bus/namespace at 0.17.2,
    MIT, pinned by digest in entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-service-bus where it deploys
    Terraform. The namespace runs on the Standard tier unless
    infra.overrides.sku_name names Basic or Premium, a Premium namespace on
    one messaging unit unless infra.overrides.sku_capacity names more.
    Public network access is on unless
    infra.overrides.public_network_access_enabled is false; the private
    endpoint, which the service offers on the Premium tier alone, is the
    operator's. The module's telemetry is off.

    Shared access signature authentication is off and no authorization
    rule is declared, so the namespace takes Microsoft Entra ID alone; the
    role assignment granting a consumer access is the operator's. host is
    an expression for the DNS name in the endpoint the service reports, or
    infra.overrides.host; endpoint is that URL, or one built on
    infra.overrides.host. A value or an infra.overrides key the service or
    the module cannot take halts naming it, as do topics, and a queue
    requiring sessions, on the Basic tier.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/messaging/azure-service-bus:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.17.2, the module Bicep names
  # br/public:avm/res/service-bus/namespace:0.17.2. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.ServiceBus/namespaces and its queues, topics and
  # topics/subscriptions at API version 2024-01-01, each queue and topic in
  # one of the module's own nested deployments and each subscription in one
  # nested in its topic's, and passes the catalog's check of every rendered
  # template against the Azure Resource Manager schemas.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/service-bus/namespace
    version: 0.17.2

  locals:
    # The name the Release gives the namespace under infra.overrides.host, or
    # empty while it gives none. Only a string is read here; any other value is
    # refused by the assertion below rather than published.
    operator_host: '{{ $h := optional (optional .infra "overrides" dict) "host" "" }}{{ if typeIs "string" $h }}{{ $h }}{{ end }}'
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expressions in provides read.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # The tier, infra.overrides.sku_name or Standard. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "Standard" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'

  # This Recipe reads from infra.overrides:
  #   sku_name                       - string (skuObject.name, Basic, Standard or Premium;
  #                                    default Standard)
  #   sku_capacity                   - integer (skuObject.capacity, the messaging units of a
  #                                    Premium namespace, 1, 2, 4, 8 or 16; default 1)
  #   public_network_access_enabled  - bool (publicNetworkAccess, Enabled or Disabled;
  #                                    default true)
  #   location                       - string (location; the module's default is the resource group's)
  #   tags                           - map[string]string (tags)
  #   enable_telemetry               - false alone (enableTelemetry, always false)
  #   host                           - string (published as provides.host and in provides.endpoint;
  #                                    not passed to the module)
  # resource_group_name halts by name, as any key not listed does: the
  # template deploys into the resource group it is deployed to, which no
  # parameter of the module names. enable_telemetry: true halts by name, since
  # telemetry is always off.
  #
  # Each is the key terraform/azure-service-bus reads for the same concept,
  # under the same spelling, and that Recipe also reads resource_group_name,
  # since Terraform names the group a resource is created in; the module
  # parameter each sets is given in brackets. sku_name is the key every Azure
  # Recipe reads for the tier a service is provisioned at, sku_capacity the
  # key for the units it is provisioned with, public_network_access_enabled
  # the key for a boolean switch of public access, and host the key every
  # managed Recipe reads for the address it publishes.
  #
  # sku_name. Microsoft documents three tiers: Basic, queues alone; Standard,
  # which adds topics and subscriptions, sessions, transactions and duplicate
  # detection on shared capacity billed per operation; and Premium, dedicated
  # messaging units with private endpoints and messages up to 100 MB. Unset,
  # the namespace runs on Standard, the lowest tier offering every value the
  # Component declares, where the module's own default is Premium on two
  # messaging units. The module takes the tier as Basic, Standard or Premium,
  # spelt so, and any other spelling is refused below. On Basic, any topic
  # and any queue requiring sessions halt below, naming the key and the tier.
  #
  # sku_capacity. Microsoft gives a Premium namespace 1, 2, 4, 8 or 16
  # messaging units, and the other tiers none. Unset, a Premium namespace
  # runs on one, as terraform/azure-service-bus gives it; set beside another
  # tier, or to another number, it halts below.
  #
  # public_network_access_enabled. A namespace takes requests over its public
  # endpoint, from every network unless IP rules restrict it, or over a
  # private endpoint in a virtual network. Unset or true, public network
  # access is Enabled, the service's default, and since this Recipe passes no
  # IP rule the public endpoint takes requests from every network, each still
  # authenticated with Microsoft Entra ID; false writes Disabled, and the
  # namespace takes requests through a private endpoint alone. This Recipe
  # emits no private endpoint: it is the operator's, created for the namespace
  # outside the Release, the way a virtual network's subnets and private DNS
  # zones are, and Microsoft offers private endpoints on the Premium tier
  # alone, so a Basic or Standard namespace with public network access
  # Disabled takes requests from no network.
  #
  # The module deploys a telemetry resource while its enableTelemetry parameter
  # is true, its default: it reports the module and its version to Microsoft.
  # Every Recipe that wraps a module of the Azure Verified Modules programme
  # binds enableTelemetry to false, so the template deploys no telemetry. The
  # module passes false to its own nested deployments on its own.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: TLS 1.2 at least; one messaging partition on
  # Premium; and no managed identity, customer-managed key, network rule set,
  # private endpoint, role assignment, diagnostic setting, disaster recovery
  # pairing or lock. Each queue keeps the module's settings: a peek-lock of
  # one minute, a maximum size of 1,024 MB, messages kept 14 days and then
  # moved to its dead-letter queue, no duplicate detection and no
  # partitioning. Each topic keeps them too: 1,024 MB, messages kept 14 days,
  # duplicate detection over a ten-minute window, and no partitioning. Each
  # subscription keeps the service's own message lifetime and a peek-lock of
  # one minute, and neither dead-letters an expired message nor one its
  # filter fails on. terraform/azure-service-bus keeps another module's
  # settings, which differ in these: a queue's and a topic's messages there
  # keep the service's own lifetime, a queue does not dead-letter an expired
  # message, a topic detects no duplicates, and a subscription dead-letters a
  # message its filter fails on.
  #
  # These are replaced: skuObject, whose default is Premium on two messaging
  # units, by infra.overrides.sku_name and sku_capacity; publicNetworkAccess,
  # which the module leaves Enabled while no private endpoint is passed, by
  # infra.overrides.public_network_access_enabled; authorizationRules, whose
  # default declares the shared access rule RootManageSharedAccessKey, by none,
  # since the namespace takes no shared access signature; and zoneRedundant,
  # whose default is true, by false. Microsoft documents that Service Bus
  # makes every namespace zone redundant in a region with availability zones,
  # on every tier, and that the zoneRedundant property is deprecated and may
  # read false on a zone-redundant namespace; the property's own documentation
  # ties true to the Premium tier, so false is the value every tier takes.
  # disableLocalAuth is written as true, its default, so the contract that no
  # key reaches a consumer stands in the template itself.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — values.queues, as the namespace's queues, each with its
  #     requires_session and max_delivery_count; values.topics, as its
  #     topics, each with its subscriptions and theirs; and the overrides
  #     above.
  #   refused — a namespace name the service refuses; any topic, and any
  #     queue requiring sessions, on the Basic tier; and any infra.overrides
  #     key not listed above, or a value of one the service or the module
  #     cannot take. A queue, topic or subscription name and a delivery count
  #     outside what the service takes are refused by the Component's own
  #     schema before this Recipe renders.
  #   not read — none.
  #
  # Credentials. The module's key and connection string outputs read the keys
  # of the namespace's RootManageSharedAccessKey rule, which the service
  # creates with every namespace and which work for nothing while shared
  # access signature authentication is off; nothing reads them. Backup.
  # Microsoft documents that Service Bus keeps replicas of message data but
  # offers no backup or restore of it, so this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "sku_capacity" "public_network_access_enabled" "location" "tags" "enable_telemetry" "host" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Service Bus namespace in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, sku_capacity, public_network_access_enabled, location, tags, enable_telemetry and host from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the namespace's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the namespace is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
    # The tier and its messaging units, read off Microsoft's documentation of
    # the tiers: Basic, Standard and Premium, spelt so, which the module also
    # takes alone; and 1, 2, 4, 8 or 16 messaging units, on Premium alone.
    sku: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $s := optional $o "sku_name" "Standard" -}}
      {{- if not (has $s (list "Basic" "Standard" "Premium")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Azure Service Bus offers the Basic, Standard and Premium tiers, which the module this Recipe deploys takes spelt so: set infra.overrides.sku_name to one of them, or remove it for Standard" $s) -}}
      {{- end -}}
      {{- if hasKey $o "sku_capacity" -}}
      {{- $c := get $o "sku_capacity" -}}
      {{- if ne $s "Premium" -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and infra.overrides.sku_name gives the %s tier, to which Azure Service Bus allocates no messaging units, which it gives the Premium tier alone: remove infra.overrides.sku_capacity, or set infra.overrides.sku_name to Premium" $c $s) -}}
      {{- end -}}
      {{- if not (and (or (kindIs "int" $c) (kindIs "int64" $c) (and (kindIs "float64" $c) (eq (float64 (int $c)) $c))) (has (int $c) (list 1 2 4 8 16))) -}}
      {{- fail (printf "infra.overrides.sku_capacity is %v, and Azure Service Bus gives a Premium namespace 1, 2, 4, 8 or 16 messaging units: set infra.overrides.sku_capacity to one of them, or remove it for one" $c) -}}
      {{- end -}}
      {{- end -}}
    # Microsoft documents that the Basic tier supports queues alone, with no
    # topics and subscriptions, and no sessions.
    basic_tier: >-
      {{- if eq (toString (optional (optional .infra "overrides" dict) "sku_name" "Standard")) "Basic" -}}
      {{- range $name, $_ := (default dict .values.topics) -}}
      {{- fail (printf "values.topics declares the topic %q, and infra.overrides.sku_name is Basic, a tier Microsoft documents as offering queues alone, with no topics and subscriptions: remove the topics from the Aggregate, or set infra.overrides.sku_name to Standard or Premium in the Release" $name) -}}
      {{- end -}}
      {{- range $name, $q := (default dict .values.queues) -}}
      {{- if eq (toString (optional $q "requires_session" false)) "true" -}}
      {{- fail (printf "values.queues.%s.requires_session is true, and infra.overrides.sku_name is Basic, a tier Microsoft documents as offering no sessions: set requires_session to false in the Aggregate, or infra.overrides.sku_name to Standard or Premium in the Release" $name) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    operator_host_is_bare: >-
      {{- $h := optional (optional .infra "overrides" dict) "host" "" -}}
      {{- if not (kindIs "invalid" $h) -}}
      {{- $bare := typeIs "string" $h -}}
      {{- if $bare }}{{ $bare = not (regexMatch `[/@\s:]` $h) }}{{ end -}}
      {{- if not $bare -}}
      {{- fail (printf `infra.overrides.host is the DNS name a consumer of this namespace reaches it at, given alone, and "%v" is not one: set it in the Release to the bare name, with no scheme, path, user or port — the namespace answers HTTPS on port 443, and endpoint is built on the name` $h) -}}
      {{- end -}}
      {{- end -}}
    # The namespace is named after the component, and its name is also the
    # first label of the address the service gives it under
    # servicebus.windows.net, so it is unique across Azure. Microsoft's
    # documentation of Azure resource names and of creating a namespace gives
    # a namespace name 6 to 50 letters, digits and hyphens, beginning with a
    # letter, ending with a letter or a digit, and not ending in -sb or -mgmt;
    # it is checked here, where the name is known.
    namespace_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if or (not (regexMatch `^[A-Za-z][A-Za-z0-9-]{4,48}[A-Za-z0-9]$` $n)) (hasSuffix "-sb" (lower $n)) (hasSuffix "-mgmt" (lower $n)) -}}
      {{- fail (printf "the component %q names its Service Bus namespace, and Microsoft documents a namespace name as 6 to 50 letters, digits and hyphens, beginning with a letter, ending with a letter or a digit, and not ending in -sb or -mgmt: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service reports the namespace's endpoint as
  # https://<namespace>.servicebus.windows.net:443/ in the public cloud, under
  # its cloud's own domain elsewhere, and the module publishes it as its
  # serviceBusEndpoint output. host reads that output from the
  # nested deployment this component becomes and takes the DNS name between
  # https:// and the port, so it holds whichever domain the service's cloud
  # gives: the fully qualified namespace a Service Bus client library
  # connects to.
  # endpoint is the output as the service reports it. Azure Resource Manager
  # evaluates each expression when the template deploys, after the namespace
  # exists, so it resolves for a consumer in the same template, through the
  # link for a consumer in another arm template, and as text on another
  # target.
  #
  # While the Release sets infra.overrides.host, host publishes that name
  # instead of the expression, and endpoint is https://<name>:443/. It is the
  # operator's deterministic pointer: the compiler pipes it as text and looks
  # nothing up, and this Recipe emits no DNS record for it, so the operator
  # points the name at the namespace outside the Release. A client checking
  # the namespace's certificate needs a name the certificate carries, which is
  # the namespace's own name under servicebus.windows.net or the private link
  # name that resolves to it.
  provides:
    host: "{{ if .locals.operator_host }}{{ .locals.operator_host }}{{ else }}[split(split(reference('{{ .locals.symbol }}').outputs.serviceBusEndpoint.value, '/')[2], ':')[0]]{{ end }}"
    endpoint: "{{ if .locals.operator_host }}https://{{ .locals.operator_host }}:443/{{ else }}[reference('{{ .locals.symbol }}').outputs.serviceBusEndpoint.value]{{ end }}"

  # Each key binds the module parameter of the same name. The namespace is
  # named after the component, as the other managed Recipes name theirs.
  #
  # Each queue is one entry of the module's queues, and each topic one of its
  # topics, with its subscriptions, each list in the order of the names. A
  # queue or subscription requires sessions while its requires_session is
  # true, and takes max_delivery_count, 10 unless set, the service's default.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: "{{ . }}"
    {{- end }}
    skuObject:
      name: {{ .locals.sku }}
      {{- if eq .locals.sku "Premium" }}
      capacity: {{ int (optional $o "sku_capacity" 1) }}
      {{- end }}
    zoneRedundant: false
    disableLocalAuth: true
    authorizationRules: []
    publicNetworkAccess: {{ if optional $o "public_network_access_enabled" true }}Enabled{{ else }}Disabled{{ end }}
    queues:
    {{- range $name, $q := (default dict .values.queues) }}
      - name: {{ toJson $name }}
        requiresSession: {{ if eq (toString (optional $q "requires_session" false)) "true" }}true{{ else }}false{{ end }}
        maxDeliveryCount: {{ int (optional $q "max_delivery_count" 10) }}
    {{- else }} []
    {{- end }}
    topics:
    {{- range $name, $t := (default dict .values.topics) }}
      - name: {{ toJson $name }}
        subscriptions:
        {{- range $sub, $s := (default dict (optional $t "subscriptions" dict)) }}
          - name: {{ toJson $sub }}
            requiresSession: {{ if eq (toString (optional $s "requires_session" false)) "true" }}true{{ else }}false{{ end }}
            maxDeliveryCount: {{ int (optional $s "max_delivery_count" 10) }}
        {{- else }} []
        {{- end }}
    {{- else }} []
    {{- end }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
