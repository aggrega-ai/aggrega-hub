apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-databricks
  version: 1.0.0
  # The licence of the vendored module, the Azure Verified Modules programme's
  # Databricks workspace module: the third-party template this Recipe pins
  # and wraps in the output. The workspace it provisions is a service the
  # reader contracts for directly with Microsoft, under Azure's terms.
  license: MIT
  # The infra.overrides keys this Recipe refuses are listed, with their
  # reasons, in the comments above the assertions.
  description: >
    Azure Databricks: one workspace, deployed from an Azure Resource Manager
    template through Microsoft's Azure Verified Modules module
    avm/res/databricks/workspace at 0.12.1, MIT, pinned by digest in
    entity.lock.

    Reach for it where the Release deploys an Azure Resource Manager
    template; reach for terraform/azure-databricks where it deploys
    Terraform. The workspace runs on the premium tier unless
    infra.overrides.sku_name names trial; with secure cluster connectivity,
    its clusters taking no public IP address, unless
    infra.overrides.custom_parameters.no_public_ip is false; and in a
    network Azure Databricks creates unless custom_parameters names the
    operator's network and its two subnets. Public network access is on
    unless infra.overrides.public_network_access_enabled is false. The
    module's telemetry is off.

    Azure creates the managed resource group
    databricks-rg-<component>-<resource group>, or the one
    infra.overrides.managed_resource_group_name names, outside the
    template, holding the workspace storage account, an access connector,
    the clusters' machines and, unless the operator's network is named, the
    network Azure Databricks creates and its NAT gateway; a deleted
    workspace leaves the storage account and the connector there.
    host is an expression for the workspace's name the service reports,
    endpoint https:// and that name. A key the service or the module cannot
    take halts naming it, as do infra.overrides.host and resource_group_name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: arm
  implements: core/bigdata/azure-databricks:1.0.0

  # The module's compiled template, as the Azure Verified Modules programme
  # publishes it to its registry at version 0.12.1, the module Bicep names
  # br/public:avm/res/databricks/workspace:0.12.1. `aggrega pin` records the
  # digests of its manifest and of its template layer in entity.lock, and
  # every build reads exactly those bytes. The provider reads the template,
  # main.json, and wraps it as one nested deployment. The template declares
  # Microsoft.Databricks/workspaces at API version 2024-05-01 and passes the
  # catalog's check of every rendered template against the Azure Resource
  # Manager schemas; the workspace's properties are one expression the
  # module composes, which the schema check reads as a string.
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/databricks/workspace
    version: 0.12.1

  locals:
    # The symbolic name of the nested deployment this component becomes, the
    # instance id folded into words, which the expressions in provides read.
    symbol: '{{ capitalizedWords .context.instance_id }}'
    # The tier, infra.overrides.sku_name or premium. Only a string is read
    # here; any other value is refused by the assertion below.
    sku: '{{ $s := optional (optional .infra "overrides" dict) "sku_name" "premium" }}{{ if typeIs "string" $s }}{{ $s }}{{ end }}'
    # The managed resource group's ID, composed when the template deploys in
    # the subscription it deploys to: infra.overrides.managed_resource_group_name,
    # or databricks-rg-<component>-<the resource group the template is
    # deployed to>. Only a string is read here; any other value is refused by
    # the assertion below.
    managed_resource_group_id: >-
      {{- $m := optional (optional .infra "overrides" dict) "managed_resource_group_name" "" -}}
      {{- if and (typeIs "string" $m) $m -}}
      [subscriptionResourceId('Microsoft.Resources/resourceGroups', '{{ $m }}')]
      {{- else -}}
      [subscriptionResourceId('Microsoft.Resources/resourceGroups', format('databricks-rg-{0}-{1}', '{{ .context.instance_id }}', resourceGroup().name))]
      {{- end -}}

  # This Recipe reads from infra.overrides:
  #   sku_name                              - string (skuName, premium or trial; default premium)
  #   managed_resource_group_name           - string (managedResourceGroupResourceId, the ID of
  #                                           the group of that name in the subscription the
  #                                           template deploys to; default
  #                                           databricks-rg-<component>-<resource group>)
  #   custom_parameters                     - object of these fields and no other:
  #     virtual_network_id                  - string (customVirtualNetworkResourceId, which the
  #                                           module writes as customVirtualNetworkId)
  #     private_subnet_name                 - string (customPrivateSubnetName)
  #     public_subnet_name                  - string (customPublicSubnetName)
  #     no_public_ip                        - bool (disablePublicIp, which the module writes as
  #                                           enableNoPublicIp; default true)
  #     private_subnet_network_security_group_association_id
  #                                         - string (admitted, renders nothing)
  #     public_subnet_network_security_group_association_id
  #                                         - string (admitted, renders nothing)
  #   public_network_access_enabled         - bool (publicNetworkAccess, Enabled or Disabled;
  #                                           default true)
  #   network_security_group_rules_required - string (requiredNsgRules, AllRules or
  #                                           NoAzureDatabricksRules; default AllRules)
  #   location                              - string (location; the module's default is the
  #                                           resource group's)
  #   tags                                  - map[string]string (tags)
  #   enable_telemetry                      - false alone (enableTelemetry, always false)
  # resource_group_name and host halt by name, as any key not listed does:
  # the template deploys into the resource group it is deployed to, which no
  # parameter of the module names, and the workspace answers only at the name
  # the service gives it. enable_telemetry: true halts by name, since
  # telemetry is always off.
  #
  # Each is the key terraform/azure-databricks reads for the same concept,
  # under the same spelling, and that Recipe also reads resource_group_name,
  # since Terraform names the group a resource is created in; the module
  # parameter each sets is given in brackets. sku_name is the key every Azure
  # Recipe reads for the tier a service is provisioned at, and
  # public_network_access_enabled the key for a boolean switch of public
  # access; the others, and the fields of custom_parameters, are the inputs
  # of the Terraform module that Recipe sources.
  #
  # sku_name. Microsoft's end-of-life notice for Standard tier workspaces
  # states that every new workspace is created on the Premium tier, and its
  # sign-up page offers trial, Premium with 14 days of free usage. The module
  # takes premium, standard or trial, spelt so; standard and any other value
  # halt below. Unset, the workspace runs on premium, the module's own
  # default.
  #
  # managed_resource_group_name. Azure Resource Manager requires a workspace
  # to name its managed resource group, by ID, and Azure Databricks creates
  # that group in the workspace's subscription when the workspace is created,
  # outside the template: the template never declares it. In it Azure keeps
  # the workspace storage account, whose name begins with dbstorage and which
  # holds the workspace's system data and file system root, an access
  # connector with a managed identity reaching that account, and, while
  # clusters run, their virtual machines, disks, IP addresses and network
  # interfaces; without custom_parameters.virtual_network_id it also holds
  # the virtual network Azure Databricks creates for the clusters and the NAT
  # gateway that carries their outbound traffic while they take no public IP
  # address. Microsoft documents that the group is not modifiable and is
  # protected by a deny assignment that blocks role assignments on it.
  # Deleting the workspace removes the clusters' machines, disks and network
  # but keeps the storage account and the access connector, converting the
  # group into an ordinary resource group the operator then owns, unless the
  # deletion is forced (az databricks workspace delete --force-deletion);
  # removing the workspace from the template does not force it. The name
  # set here is composed into the group's ID in the subscription the template
  # deploys to, which is the workspace's, and Azure takes a resource group
  # name of 1 to 90 letters, digits, underscores, hyphens, periods and
  # parentheses, not ending in a period, which the assertion below checks.
  # Unset, the group is databricks-rg-<component>-<the resource group the
  # template is deployed to>, the name terraform/azure-databricks's module
  # gives it, where this module's own default, rg-<component>-managed, is one
  # name for every workspace of that name in the subscription, so two of
  # them in two resource groups would claim one group. The resource group's
  # name is known only when the template deploys, so a component name and a
  # resource group name of more than 75 characters together give a group
  # name Azure refuses at deploy; set managed_resource_group_name then.
  #
  # custom_parameters. Unset, the workspace's clusters run in a virtual
  # network Azure Databricks creates in the managed resource group. With
  # virtual_network_id, they run in the operator's network instead, which
  # Microsoft requires to sit in the workspace's region and subscription and
  # to hold two subnets dedicated to the workspace, named by
  # private_subnet_name and public_subnet_name, each delegated to
  # Microsoft.Databricks/workspaces with a network security group attached;
  # a subnet serves one workspace alone. The network, its subnets, their
  # delegation and their network security groups are the operator's,
  # created outside the Release, and this Recipe creates none of them. Azure
  # Databricks writes the inbound and outbound rules it requires into those
  # network security groups itself, through the delegation, outside the
  # template. The service takes both subnet names with a network and neither
  # without one, as the azurerm provider's workspace resource checks
  # (internal/services/databricks/databricks_workspace_resource.go, v4.81.0),
  # and each name follows Azure's subnet name rules, 1 to 80 letters, digits,
  # underscores, periods and hyphens, beginning with a letter or digit and
  # ending with a letter, digit or underscore; all three are checked below.
  # The two association fields name the operator's subnet network security
  # group associations, whose ID is the subnet's own; Terraform reads them to
  # order the workspace after the associations, and Azure Resource Manager
  # takes none, so here they are checked as subnet IDs and render nothing.
  #
  # no_public_ip. With secure cluster connectivity the clusters take no
  # public IP address and open the connection to the control plane
  # themselves. Microsoft documents that the workspace resource enables it
  # when enableNoPublicIp is not given, from API version 2024-05-01, and
  # recommends it; the module writes false unless told otherwise, so this
  # Recipe writes true unless no_public_ip is false. In the network Azure
  # Databricks creates, the service adds the NAT gateway above, billed to
  # the operator; in the operator's network, outbound traffic needs a path
  # of the operator's, such as the NAT gateway on both subnets Microsoft
  # recommends. Microsoft documents that it plans to require secure cluster
  # connectivity for every classic workspace; false is admitted while the
  # service takes it.
  #
  # public_network_access_enabled. Unset or true, users and clients reach
  # the workspace over the internet; false writes Disabled, and the
  # workspace takes requests through private endpoints alone. Microsoft
  # lists the operator's network, secure cluster connectivity and the
  # Premium tier as prerequisites of Private Link, and its Private Link
  # concepts give NoAzureDatabricksRules as the rule set of a workspace with
  # public access disabled, the combination with AllRules being one the
  # azurerm provider's workspace resource refuses; so false halts below
  # without virtual_network_id, with no_public_ip false, or without
  # network_security_group_rules_required NoAzureDatabricksRules. The private
  # endpoints, databricks_ui_api for the workspace and
  # browser_authentication for single sign-on, and the private DNS zone
  # privatelink.azuredatabricks.net are the operator's, created outside the
  # Release; with them, the workspace's own name resolves to a private
  # address.
  #
  # network_security_group_rules_required. AllRules, the default, keeps the
  # outbound rule to the AzureDatabricks service tag in the subnets' network
  # security groups; NoAzureDatabricksRules removes it, for clusters that
  # reach the control plane through the operator's back-end private
  # endpoint, which Microsoft's Private Link concepts list with the
  # operator's network and secure cluster connectivity as prerequisites, so
  # it halts below without virtual_network_id or with no_public_ip false.
  # The schema of the workspace resource documents NoAzureServiceRules as
  # for internal use only, and it halts below with any other value.
  #
  # The module deploys a telemetry resource while its enableTelemetry
  # parameter is true, its default: it reports the module and its version to
  # Microsoft. Every Recipe that wraps a module of the Azure Verified Modules
  # programme binds enableTelemetry to false, so the template deploys no
  # telemetry.
  #
  # The module's own defaults stand for every parameter this mapping leaves
  # out. These are worth knowing: the workspace storage account on
  # Standard_GRS, under a name the service generates; the address prefix
  # 10.139 for the network Azure Databricks creates; no customer-managed key
  # or infrastructure encryption; and no private endpoint, role assignment,
  # diagnostic setting, lock, storage firewall, access connector of the
  # operator's, default catalog setting, compliance profile or Azure Machine
  # Learning link. These are replaced: disablePublicIp, whose default is
  # false, by no_public_ip, true unless set false; and
  # managedResourceGroupResourceId, whose default is rg-<component>-managed,
  # as above.
  #
  # Every Component value and infra key is honoured, refused below by name, or
  # not read, each measured against the service's own documentation and the
  # module's parameters:
  #   honoured — the overrides above. The Component declares no values.
  #   refused — a workspace name Azure refuses; and any infra.overrides key or
  #     custom_parameters field not listed above, or a value of one the
  #     service or the module cannot take, or a combination of them the
  #     service refuses.
  #   not read — none.
  #
  # Credentials. The workspace takes Microsoft Entra ID tokens and tokens
  # Azure Databricks issues, and nothing here creates or delivers one; a
  # consumer authenticates as its own identity, which the operator admits to
  # the workspace. Backup. Microsoft documents that the control plane keeps
  # the workspace's objects in databases replicated across the region's
  # availability zones, and that its disaster recovery copies them to a
  # second workspace, which is the operator's; this Recipe configures none.
  assertions:
    overrides_known: >-
      {{- $known := list "sku_name" "managed_resource_group_name" "custom_parameters" "public_network_access_enabled" "network_security_group_rules_required" "location" "tags" "enable_telemetry" -}}
      {{- range $k, $_ := (optional .infra "overrides" dict) -}}
      {{- if eq $k "resource_group_name" -}}
      {{- fail "infra.overrides.resource_group_name is set, and this Recipe creates the Azure Databricks workspace in the resource group the template is deployed to, which no parameter of the template names: remove infra.overrides.resource_group_name from the Release, and deploy the template to that resource group" -}}
      {{- end -}}
      {{- if eq $k "host" -}}
      {{- fail "infra.overrides.host is set, and Azure Databricks serves the workspace at the name it gives it, adb-<workspace id>.<n>.azuredatabricks.net, which Private Link resolves to a private address under the same name; an account's custom URL names all its workspaces and needs the workspace's ID beside it, which this Component does not publish: remove infra.overrides.host from the Release, and read the host the workspace publishes" -}}
      {{- end -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.%s is set, and this Recipe reads sku_name, managed_resource_group_name, custom_parameters, public_network_access_enabled, network_security_group_rules_required, location, tags and enable_telemetry from infra.overrides and no other key: correct its spelling, or remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
      {{- end -}}
    overrides_shape: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $t := optional $o "enable_telemetry" false -}}
      {{- if not (and (kindIs "bool" $t) (not $t)) -}}
      {{- fail (printf "infra.overrides.enable_telemetry is %v, and this Recipe turns the module's telemetry off in every template it writes, which no override turns on: remove infra.overrides.enable_telemetry from the Release, or set it to false" $t) -}}
      {{- end -}}
      {{- $p := optional $o "public_network_access_enabled" true -}}
      {{- if not (kindIs "bool" $p) -}}
      {{- fail (printf "infra.overrides.public_network_access_enabled is %v, and it switches the workspace's public network access as a boolean: set it to false to disable it, or to true or remove it to keep it enabled" $p) -}}
      {{- end -}}
      {{- $l := optional $o "location" "" -}}
      {{- if not (typeIs "string" $l) -}}
      {{- fail (printf "infra.overrides.location is %v, and it names the one Azure region the workspace is created in: set it to a region's name, such as westeurope, or remove it for the resource group's region" $l) -}}
      {{- end -}}
      {{- $r := optional $o "network_security_group_rules_required" "AllRules" -}}
      {{- if not (has $r (list "AllRules" "NoAzureDatabricksRules")) -}}
      {{- fail (printf "infra.overrides.network_security_group_rules_required is %v, and Azure Databricks takes AllRules or NoAzureDatabricksRules, spelt so, the workspace resource's schema giving NoAzureServiceRules as for internal use only: set it to one of them, or remove it for AllRules" $r) -}}
      {{- end -}}
    # Microsoft's end-of-life notice for Standard tier workspaces states that
    # every new workspace is created on the Premium tier; trial is Premium
    # with 14 days of free usage. The module takes the tier lower case.
    sku: >-
      {{- $s := optional (optional .infra "overrides" dict) "sku_name" "premium" -}}
      {{- if not (has $s (list "premium" "trial")) -}}
      {{- fail (printf "infra.overrides.sku_name is %v, and Azure Databricks creates a new workspace on the premium tier or on trial, Premium with 14 days of free usage, and none on standard, as Microsoft's end-of-life notice for Standard tier workspaces states: set infra.overrides.sku_name to premium or trial, or remove it for premium" $s) -}}
      {{- end -}}
    # Azure's resource group name rules: 1 to 90 letters, digits,
    # underscores, hyphens, periods and parentheses, not ending in a period.
    managed_resource_group_name: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "managed_resource_group_name" -}}
      {{- $m := get $o "managed_resource_group_name" -}}
      {{- $ok := typeIs "string" $m -}}
      {{- if $ok }}{{ $ok = regexMatch `^[\p{L}\p{Nd}_.()-]{0,89}[\p{L}\p{Nd}_()-]$` $m }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.managed_resource_group_name is %v, and it names the resource group Azure Databricks creates for the workspace, which Azure takes as 1 to 90 letters, digits, underscores, hyphens, periods and parentheses, not ending in a period: set it to such a name, or remove it for databricks-rg-<component>-<resource group>" $m) -}}
      {{- end -}}
      {{- end -}}
    # The fields of custom_parameters, each in the shape the service takes:
    # the network and the subnet associations by their resource IDs, which
    # Azure Resource Manager reads without regard to case; each subnet by a
    # name Azure's subnet name rules admit; no_public_ip as a boolean. The
    # service takes both subnet names with a network and neither without one.
    custom_parameters: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- if hasKey $o "custom_parameters" -}}
      {{- $cp := get $o "custom_parameters" -}}
      {{- $fields := "virtual_network_id, private_subnet_name, public_subnet_name, no_public_ip, private_subnet_network_security_group_association_id and public_subnet_network_security_group_association_id" -}}
      {{- if not (kindIs "map" $cp) -}}
      {{- fail (printf "infra.overrides.custom_parameters is %v, and it is an object of the fields %s: set it in the Release to such an object, or remove it" $cp $fields) -}}
      {{- end -}}
      {{- $known := list "virtual_network_id" "private_subnet_name" "public_subnet_name" "no_public_ip" "private_subnet_network_security_group_association_id" "public_subnet_network_security_group_association_id" -}}
      {{- range $k, $_ := $cp -}}
      {{- if not (has $k $known) -}}
      {{- fail (printf "infra.overrides.custom_parameters.%s is set, and this Recipe reads %s from infra.overrides.custom_parameters and no other field: correct its spelling, or remove custom_parameters.%s from the Release" $k $fields $k) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $cp "virtual_network_id" -}}
      {{- $v := get $cp "virtual_network_id" -}}
      {{- $ok := typeIs "string" $v -}}
      {{- if $ok }}{{ $ok = regexMatch `(?i)^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.network/virtualnetworks/[^/]+$` $v }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.custom_parameters.virtual_network_id is %v, and it names the operator's virtual network by its resource ID, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>: set it to such an ID, or remove it for the network Azure Databricks creates" $v) -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "private_subnet_name" "public_subnet_name" -}}
      {{- if hasKey $cp $k -}}
      {{- $v := get $cp $k -}}
      {{- $ok := typeIs "string" $v -}}
      {{- if $ok }}{{ $ok = regexMatch `^[A-Za-z0-9]([A-Za-z0-9_.-]{0,78}[A-Za-z0-9_])?$` $v }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.custom_parameters.%s is %v, and it names a subnet of the operator's network, which Azure takes as 1 to 80 letters, digits, underscores, periods and hyphens, beginning with a letter or digit and ending with a letter, digit or underscore: set it to such a name" $k $v) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $k := list "private_subnet_network_security_group_association_id" "public_subnet_network_security_group_association_id" -}}
      {{- if hasKey $cp $k -}}
      {{- $v := get $cp $k -}}
      {{- $ok := typeIs "string" $v -}}
      {{- if $ok }}{{ $ok = regexMatch `(?i)^/subscriptions/[^/]+/resourcegroups/[^/]+/providers/microsoft\.network/virtualnetworks/[^/]+/subnets/[^/]+$` $v }}{{ end -}}
      {{- if not $ok -}}
      {{- fail (printf "infra.overrides.custom_parameters.%s is %v, and it names the operator's network security group association of a workspace subnet, whose ID is the subnet's, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.Network/virtualNetworks/<network>/subnets/<subnet>: set it to such an ID" $k $v) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $n := optional $cp "no_public_ip" true -}}
      {{- if not (kindIs "bool" $n) -}}
      {{- fail (printf "infra.overrides.custom_parameters.no_public_ip is %v, and it switches secure cluster connectivity as a boolean: set it to false to give the clusters public IP addresses, or to true or remove it to give them none" $n) -}}
      {{- end -}}
      {{- if hasKey $cp "virtual_network_id" -}}
      {{- range $k := list "private_subnet_name" "public_subnet_name" -}}
      {{- if not (hasKey $cp $k) -}}
      {{- fail (printf "infra.overrides.custom_parameters.virtual_network_id names the operator's network, and custom_parameters.%s is not set: Azure Databricks runs a workspace in the operator's network on two subnets dedicated to it, named by private_subnet_name and public_subnet_name: set both in the Release" $k) -}}
      {{- end -}}
      {{- end -}}
      {{- else -}}
      {{- range $k := list "private_subnet_name" "public_subnet_name" -}}
      {{- if hasKey $cp $k -}}
      {{- fail (printf "infra.overrides.custom_parameters.%s is set, and custom_parameters.virtual_network_id names no network for the subnet to belong to, so the workspace runs in a network Azure Databricks creates: set virtual_network_id to the operator's network in the Release, or remove custom_parameters.%s" $k $k) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
    # Private Link: Microsoft lists the operator's network, secure cluster
    # connectivity and the Premium tier as its prerequisites, and gives
    # NoAzureDatabricksRules as the rule set of a workspace with public
    # access disabled; the azurerm provider's workspace resource refuses
    # AllRules with public access disabled. The tier is premium or trial,
    # Premium either way, by the sku assertion.
    private_link: >-
      {{- $o := optional .infra "overrides" dict -}}
      {{- $cp := optional $o "custom_parameters" dict -}}
      {{- if not (kindIs "map" $cp) }}{{ $cp = dict }}{{ end -}}
      {{- $closed := eq (toString (optional $o "public_network_access_enabled" true)) "false" -}}
      {{- $backend := eq (toString (optional $o "network_security_group_rules_required" "AllRules")) "NoAzureDatabricksRules" -}}
      {{- $why := "" -}}
      {{- if $closed }}{{ $why = "infra.overrides.public_network_access_enabled is false" }}{{ else if $backend }}{{ $why = "infra.overrides.network_security_group_rules_required is NoAzureDatabricksRules" }}{{ end -}}
      {{- if $why -}}
      {{- if not (hasKey $cp "virtual_network_id") -}}
      {{- fail (printf "%s, which takes the workspace onto Private Link, and Microsoft lists the operator's own network among Private Link's prerequisites: set infra.overrides.custom_parameters.virtual_network_id and its two subnets in the Release" $why) -}}
      {{- end -}}
      {{- if eq (toString (optional $cp "no_public_ip" true)) "false" -}}
      {{- fail (printf "%s, which takes the workspace onto Private Link, and Microsoft lists secure cluster connectivity among Private Link's prerequisites, which infra.overrides.custom_parameters.no_public_ip false turns off: set no_public_ip to true, or remove it" $why) -}}
      {{- end -}}
      {{- end -}}
      {{- if and $closed (not $backend) -}}
      {{- fail "infra.overrides.public_network_access_enabled is false, and a workspace with public access disabled takes the rule set NoAzureDatabricksRules, which Microsoft's Private Link concepts give for it, while AllRules beside it is a combination the azurerm provider's workspace resource refuses: set infra.overrides.network_security_group_rules_required to NoAzureDatabricksRules in the Release" -}}
      {{- end -}}
    # The workspace is named after the component. Azure's resource name rules
    # give a Databricks workspace 3 to 64 letters, digits, underscores and
    # hyphens, which the workspace resource's schema bounds the same way; it
    # is checked here, where the name is known.
    workspace_name: >-
      {{- $n := .metadata.instance_id -}}
      {{- if not (regexMatch `^[A-Za-z0-9_-]{3,64}$` $n) -}}
      {{- fail (printf "the component %q names its Azure Databricks workspace, and Azure takes a workspace name of 3 to 64 letters, digits, underscores and hyphens: rename the component in the Aggregate to such a name" $n) -}}
      {{- end -}}

  # The String Pipe: the compiler does not interpret these strings. A consumer
  # receives each as written. The service gives the workspace a name of its
  # own when it creates it, adb-<workspace id>.<n>.azuredatabricks.net in
  # the public cloud, and the workspace resource reports it as its read-only
  # workspaceUrl, which the module publishes as its workspaceUrl output, a
  # host name with no scheme. host reads that output from the
  # nested deployment this component becomes; endpoint is https:// followed
  # by it.
  # Azure Resource Manager evaluates each expression when the template
  # deploys, after the workspace exists, so it resolves for a consumer in the
  # same template, through the link for a consumer in another arm template,
  # and as text on another target.
  #
  # No infra.overrides.host: the workspace's web application and REST API
  # answer at that name, and Private Link resolves the same name to a
  # private address. An account's custom URL, which Microsoft offers in
  # preview, reaches every workspace of the account and selects one by its
  # workspace ID, which this Component does not publish.
  provides:
    host: "[reference('{{ .locals.symbol }}').outputs.workspaceUrl.value]"
    endpoint: "[format('https://{0}', reference('{{ .locals.symbol }}').outputs.workspaceUrl.value)]"

  # Each key binds the module parameter of the same name. The workspace is
  # named after the component, as the other managed Recipes name theirs. The
  # managed resource group's ID is an expression, which Azure Resource
  # Manager evaluates in the boundary's template as it deploys the nested
  # one.
  valuesMapping: |
    {{- $o := optional .infra "overrides" dict }}
    {{- $cp := optional $o "custom_parameters" dict }}
    {{- if not (kindIs "map" $cp) }}{{ $cp = dict }}{{ end }}
    name: "{{ .context.instance_id }}"
    {{- with optional $o "location" "" }}
    location: {{ toJson . }}
    {{- end }}
    skuName: {{ .locals.sku }}
    managedResourceGroupResourceId: {{ toJson .locals.managed_resource_group_id }}
    disablePublicIp: {{ if eq (toString (optional $cp "no_public_ip" true)) "false" }}false{{ else }}true{{ end }}
    {{- with optional $cp "virtual_network_id" "" }}
    customVirtualNetworkResourceId: {{ toJson . }}
    {{- end }}
    {{- with optional $cp "private_subnet_name" "" }}
    customPrivateSubnetName: {{ toJson . }}
    {{- end }}
    {{- with optional $cp "public_subnet_name" "" }}
    customPublicSubnetName: {{ toJson . }}
    {{- end }}
    publicNetworkAccess: {{ if eq (toString (optional $o "public_network_access_enabled" true)) "false" }}Disabled{{ else }}Enabled{{ end }}
    requiredNsgRules: {{ optional $o "network_security_group_rules_required" "AllRules" }}
    {{- with optional $o "tags" "" }}
    tags: {{ toJson . }}
    {{- end }}
    enableTelemetry: false
