apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: langgraph
  version: 1.0.0
  description: >
    A LangGraph agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint wired into the
    `model` socket is rendered as OPENAI_BASE_URL; the checkpointer datastore
    wired into the `checkpointer_db` socket contributes its host and port; an
    attached model API key arrives on the inject pipe as OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/langgraph:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes two sockets. The recipe ranges its outbound edges
        # and matches on the socket name: the `model` edge contributes the SDK
        # endpoint and model name; the `checkpointer_db` edge contributes the
        # datastore host and port the LangGraph checkpointer persists graph state to.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- if eq $edge.socket "checkpointer_db" }}
          LANGGRAPH_CHECKPOINTER_HOST: "{{ $edge.provides.host }}"
          LANGGRAPH_CHECKPOINTER_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- end }}
        # An attached model API key arrives on the inject pipe and renders as
        # OPENAI_API_KEY (compose has no secretKeyRef primitive). Unattached, no
        # key env is emitted.
    {{- if hasKey (default dict .secrets) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
