apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: langgraph
  version: 1.0.0
  description: >
    A LangGraph agent application for local development via Docker Compose.
    The model endpoint wired into the `model` socket is rendered as
    OPENAI_BASE_URL; the checkpointer datastore wired into the
    `checkpointer_db` socket contributes its host and port as
    LANGGRAPH_CHECKPOINTER_HOST and LANGGRAPH_CHECKPOINTER_PORT, and its user
    and database where it publishes them as LANGGRAPH_CHECKPOINTER_USER and
    LANGGRAPH_CHECKPOINTER_DATABASE; a model API key attached on the `model`
    connection is rendered as OPENAI_API_KEY, and a password attached on the
    `checkpointer_db` connection as LANGGRAPH_CHECKPOINTER_PASSWORD.
    `values.recursion_limit` is rendered as
    LANGGRAPH_DEFAULT_RECURSION_LIMIT, which LangGraph reads as the limit of a
    run whose configuration sets none. A connection writing an `inject:` block
    receives the names it dictates instead of these defaults, as variables or
    as files mounted at the paths it names, while OPENAI_BASE_URL, the API key
    and the checkpointer password stay. A checkpointer datastore served over
    TLS alone or over HTTPS halts the build on a connection writing no
    `inject:` block, naming the connection, since such a connection hands the
    application the store's host and port and not its protocol.

    With infra.image unset it runs the catalog's quickstart agent, a small
    LangGraph application whose own code reads the model's default variables
    and the store's host and port, and no other; a Release running its own
    application sets infra.image.
    Its own value graph_entrypoint reaches the container as
    LANGGRAPH_GRAPH_ENTRYPOINT by default. The component's own `inject:` block
    delivers its entries as a connection's are, and one reading a value alone
    replaces that value's default name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/langgraph:1.0.0
  # A synthesized-mode Workload: the compose provider translates its image and
  # environment from the Workload kind. A credential's value is read from the
  # inject pipe under the key its attachment names, as the comments on the
  # variables below say.
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides, and a connection that writes one
      receives exactly what it dictates instead, read off the inject pipe as a
      map. Three deliveries stay on every connection either way: OPENAI_BASE_URL,
      which the client SDK reads by itself, the API key a credential attached on
      a model connection carries, and the password a credential attached on a
      checkpointer connection carries. A dictated env entry becomes a
      service variable under the name it gives, written as the pipe carries it,
      so Docker Compose substitutes a $ in it as in every variable; a dictated
      file entry becomes a compose config mounted as one file at the absolute
      path it names, its content written with each $ doubled so the file holds
      the value itself, and a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: the service's command replaces the image's
      default, which is the Release's. Any other mechanism is refused too. A
      dictated variable named like one this recipe delivers itself, or like the
      key an attachment's value arrives under on the inject pipe, where the
      attachment's value would take its place, halts the build, naming both,
      since the compiler cannot see the names a recipe writes.

      A checkpointer datastore served over TLS alone publishes a protocol ending
      in -tls, such as valkey-tls or memcached-tls, and one served over HTTPS
      alone publishes https; neither accepts a plaintext connection. A
      checkpointer connection taking the defaults hands the application the
      store's host and port and not its protocol, so its code could not tell
      that TLS is required: such a connection halts the build, naming it, rather than
      rendering an address the application would reach in plaintext. A
      connection that dictates its delivery can hand the code the protocol too,
      and is not refused.

      A checkpointer connection taking the defaults is also handed the store's
      user and database, each only where the store publishes it. They are
      written through toJson rather than inside quotes as the host and the port
      are: an author types them, so either may hold a quote or a backslash,
      which written inside quotes as typed would break the file.

      The component's own inject block. The developer may also write an inject
      block on the component itself, and its env and file entries reach the
      container as a connection's do: each env entry under the name it gives,
      read off the inject pipe, after the connections' variables, and each file
      at the absolute path it names, from a compose config of its own, checked
      as a connection's file is. The agent's own value is delivered under a
      default name: LANGGRAPH_GRAPH_ENTRYPOINT. It is rendered, and kept from
      every connection and from that block, only while no entry of that block,
      in either mechanism, delivers it. The templates read that at
      .context.self_inject, which maps each name the developer wrote to
      values.<key> for an entry whose template reads that one own value.
      LANGGRAPH_DEFAULT_RECURSION_LIMIT is read by LangGraph itself, so it is no
      default: it is rendered whatever that block delivers, and an entry of that
      block under that name halts the build. A refusal about one of that block's
      entries names the block rather than a connection.

      DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
      Recipe in this catalog that reads .context.self_inject declares: the same
      lines, save the own values each looks up and the mechanisms it reads. A
      Recipe of a tool or of an agent reads env and file entries, and reads the
      file entries a second time for the files it emits; a Recipe of
      core/compute/function, task or worker reads env entries alone; a Recipe of
      core/compute/server that refuses a variable by name reads the names of the
      env entries alone; and a realization of core/ai-tool/mcp that delivers
      none of the block reads it only to refuse each of its entries. The
      connections and that block only record who dictates each name and each
      file, and each refusal runs once over both, naming the one that dictated
      it. It is part of a workload template, and no catalog kind holds part of
      one for several Recipes to share; a change to it is made to all of them.

      The block reading the connections' inject directives is the one every
      compose Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- /*
      The catalog's quickstart agent, written once: the graph runs it when the
      Release sets no infra.image, and the wait for the checkpointer store
      below runs it whatever the Release sets.
    */ -}}
    {{- $quickstart := "hub.aggrega.ai/tools/quickstart-agent:1.0.0@sha256:99816fe5ab1015d2576bd7bffe5a51ca07fec41fe650bda17c5555143367acab" }}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- $ownFile := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict "LANGGRAPH_DEFAULT_RECURSION_LIMIT" "the component's values.recursion_limit, which LangGraph reads under that name" }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $slot, $attachment := (default dict $edge.features) }}
    {{- with optional (default dict $attachment.values) "key" "" }}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint the client SDK reads under that name" $alias) }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "checkpointer_db") (hasKey (default dict $edge.features) "credential") }}
    {{- $_ := set $taken "LANGGRAPH_CHECKPOINTER_PASSWORD" (printf "the credential attached on the checkpointer_db connection %s" $alias) }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $by := printf "the %s connection %s, which writes no inject block" $edge.socket $alias }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_MODEL" $by }}
    {{- end }}
    {{- if eq $edge.socket "checkpointer_db" }}
    {{- $_ := set $taken "LANGGRAPH_CHECKPOINTER_HOST" $by }}
    {{- $_ := set $taken "LANGGRAPH_CHECKPOINTER_PORT" $by }}
    {{- if hasKey (default dict $edge.provides) "user" }}{{ $_ := set $taken "LANGGRAPH_CHECKPOINTER_USER" $by }}{{ end }}
    {{- if hasKey (default dict $edge.provides) "database" }}{{ $_ := set $taken "LANGGRAPH_CHECKPOINTER_DATABASE" $by }}{{ end }}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- $needs := "" }}
    {{- if hasSuffix "-tls" $proto }}{{ $needs = "TLS" }}{{ else if eq $proto "https" }}{{ $needs = "HTTPS" }}{{ end }}
    {{- if $needs }}
    {{- fail (printf "the %s connection %s of %q reaches %q, which publishes protocol %s, a store served over %s alone, but a connection writing no inject block hands the application the store's host and port and not its protocol, so its code could not tell that %s is required: write an inject block on that connection delivering the store's protocol with whatever else the code reads, under names it reads, or wire a store served without %s" $edge.socket $alias $.context.instance_id $edge.target $proto $needs $needs $needs) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $own := dict }}
    {{- if not (hasKey $named "values.graph_entrypoint") }}{{ $_ := set $own "LANGGRAPH_GRAPH_ENTRYPOINT" (toString .values.graph_entrypoint) }}{{ $_ := set $taken "LANGGRAPH_GRAPH_ENTRYPOINT" "the component's own value graph_entrypoint" }}{{ end }}
    {{- $files := dict }}
    {{- $dictated := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "file" }}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $by := $dictated }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) }}
    {{- end }}
    {{- end }}
    {{- range $name, $by := $files }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    # The graph may open its checkpointer as it starts, and Docker Compose
    # starts it once the store's container has started, not once the store
    # accepts connections: a program that opens its store at start can then
    # exit while the store initialises, and nothing starts it again. So a step
    # runs first for each checkpointer_db connection whose store publishes both
    # a host and a port, and waits until that address accepts a TCP connection;
    # a store publishing either one alone or neither gets no wait, and the graph
    # starts as it would without one. Bash opens the connection through
    # /dev/tcp, each attempt bounded to 5 s and repeated every 2 s, and once the
    # limit below has passed it gives up, exits non-zero and names the address,
    # and Docker Compose does not start the graph. It reads the store's host and
    # port from what the store publishes, which the connection carries whether
    # or not it writes an inject block, and nothing else, so no credential
    # reaches it. They reach it as the variables STORE_HOST and STORE_PORT, and
    # the check that opens the connection is a single-quoted script reading
    # those variables itself, so the address is never written into any script
    # text a shell parses, and a value holding a space stays one word. Each is
    # written as a JSON string with every $ doubled, so a quote, a backslash, a
    # line break or a $ in what the store publishes arrives as published, in one
    # variable. Each step becomes a service of its own that runs once, and the
    # graph's service waits for it to complete successfully. This is the wait
    # recipe/helm/dify-plugin-daemon writes, adapted to this target: it runs in
    # the catalog's quickstart agent, pinned above, whose image holds bash and
    # timeout, rather than in the graph's image, which is the Release's and may
    # hold no shell; Docker Compose reads every $ in the file before any shell
    # runs, so the step's own shell variables are written $$, which reaches the
    # shell as one $; and it sets no resources, as the graph's own container
    # sets none. DELIBERATE NEAR-DUPLICATE of that block: no catalog kind holds
    # part of a workload template for several Recipes to share, so a change to
    # the wait is made to both.
    {{- $wait := 0 }}
    {{- range $alias, $edge := .context.uses }}
    {{- $published := default dict $edge.provides }}
    {{- if and (eq $edge.socket "checkpointer_db") (hasKey $published "host") (hasKey $published "port") }}
    {{- if eq $wait 0 }}
    initContainers:
    {{- end }}
    {{- $wait = add $wait 1 }}
      - name: "wait-for-store{{ if gt $wait 1 }}-{{ $wait }}{{ end }}"
        image: "{{ $quickstart }}"
        command: ["/bin/bash", "-c"]
        args:
          - 'limit=300; end=$$SECONDS; ((end += limit)); until timeout 5 bash -c ''exec 3<>"/dev/tcp/$$STORE_HOST/$$STORE_PORT"'' 2>/dev/null; do if ((SECONDS >= end)); then echo "the store at $$STORE_HOST:$$STORE_PORT accepted no TCP connection within $$limit s" >&2; exit 1; fi; sleep 2; done; echo "the store at $$STORE_HOST:$$STORE_PORT accepts TCP connections"'
        variables:
          STORE_HOST: {{ toJson (replace "$" "$$" (toString $edge.provides.host)) }}
          STORE_PORT: {{ toJson (replace "$" "$$" (toString $edge.provides.port)) }}
    {{- end }}
    {{- end }}
    containers:
      main:
        # The image is the Release's own code, so infra.image, where the Release
        # sets it, is the one run. Unset, this realization runs the catalog's
        # quickstart agent: a small LangGraph application published under the
        # Apache-2.0 licence, which calls the model on the model connection
        # through OPENAI_BASE_URL, OPENAI_MODEL and OPENAI_API_KEY and keeps its
        # checkpoints in the store on the checkpointer_db connection through
        # LANGGRAPH_CHECKPOINTER_HOST and LANGGRAPH_CHECKPOINTER_PORT, the
        # defaults below, so it runs with no inject block on either connection.
        # It is pinned by the digest of its published image index, so every
        # build runs the same image on every platform it is published for.
        image: "{{ default $quickstart (optional .infra "image" "") }}"
        # This agent consumes two sockets. The recipe ranges its outbound edges
        # and matches on the socket name: the `model` edge contributes the endpoint
        # and the model name; the `checkpointer_db` edge contributes the datastore
        # host and port the LangGraph checkpointer persists graph state to, the
        # user and the database each where the store publishes one, as a
        # PostgreSQL store does and a Valkey store does not, and a credential
        # attached on it the store's password.
        # The client SDK reads the base URL and the API key from the environment.
        # LangGraph reads no model-name environment variable at all — a model named
        # as a string is resolved by the LangChain chat-model factory, which
        # consults no environment variable for the name, and the OpenAI chat
        # model's own environment reads cover the base URL, the organization and
        # the proxy but never the model — so the model name is delivered as
        # OPENAI_MODEL for the application's own code to read. An env-delivered
        # model name is therefore right here, where the application is the
        # configuration surface and no flow definition competes with it, and inert
        # on a visual platform, whose own flow node carries the model.
        # OPENAI_MODEL and the checkpointer coordinates are the defaults: a
        # connection writing an inject block receives the variables it dictates
        # in their place, on its own position among the edges.
        # values.recursion_limit is delivered as LANGGRAPH_DEFAULT_RECURSION_LIMIT,
        # which LangGraph itself reads when it is imported, as the most steps a
        # run may take when the configuration it is invoked with sets no limit of
        # its own. LangGraph reads no environment variable naming the graph to
        # run, which the application's own code chooses, so values.graph_entrypoint
        # is delivered under a default name for that code to read.
        variables:
          LANGGRAPH_DEFAULT_RECURSION_LIMIT: "{{ .values.recursion_limit }}"
    {{- range $alias, $edge := .context.uses }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if not $dictates }}
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "checkpointer_db") (not $dictates) }}
          LANGGRAPH_CHECKPOINTER_HOST: {{ toJson (replace "$" "$$" (toString $edge.provides.host)) }}
          LANGGRAPH_CHECKPOINTER_PORT: {{ toJson (replace "$" "$$" (toString $edge.provides.port)) }}
    {{- $published := default dict $edge.provides }}
    {{- if hasKey $published "user" }}
          LANGGRAPH_CHECKPOINTER_USER: {{ toJson (toString $published.user) }}
    {{- end }}
    {{- if hasKey $published "database" }}
          LANGGRAPH_CHECKPOINTER_DATABASE: {{ toJson (toString $published.database) }}
    {{- end }}
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
    {{- range $name, $value := $own }}
          {{ $name }}: {{ toJson $value }}
    {{- end }}
    {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
        # A model API key attached on the `model` connection arrives on the
        # inject pipe and renders as OPENAI_API_KEY. It is read off the pipe
        # under the key the attachment names in `values.key` (`value` for a
        # `core/secret-value` the Release alone attaches), or under
        # OPENAI_API_KEY where it names none, and nothing delivered under the
        # key read halts the build naming that key. A connection carrying no
        # credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
    {{- $credentialKey := default "OPENAI_API_KEY" (optional (default dict $features.credential.values) "key" "") }}
          OPENAI_API_KEY: "{{ index $env $credentialKey | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- end }}
        # A password attached on the `checkpointer_db` connection is read off the
        # inject pipe the same way, under the key the attachment names in
        # `values.key`, or under LANGGRAPH_CHECKPOINTER_PASSWORD where it names
        # none, and renders as LANGGRAPH_CHECKPOINTER_PASSWORD whether or not the
        # connection writes an inject block, since an inject block can name only
        # what the store publishes and a store publishes no password. A
        # connection carrying no credential emits no password env.
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "checkpointer_db") (hasKey $features "credential") }}
    {{- $credentialKey := default "LANGGRAPH_CHECKPOINTER_PASSWORD" (optional (default dict $features.credential.values) "key" "") }}
          LANGGRAPH_CHECKPOINTER_PASSWORD: "{{ index $env $credentialKey | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
  # The compose configs holding the file entries the connections and the
  # component's own inject block dictate, one per file and numbered in path
  # order, the names the workload's volumes read. A compose config is written as
  # one file at the path it is mounted at, and Docker Compose substitutes a $ in
  # its content, so each $ is doubled. They are emitted only while either one
  # dictates a file, so a build with none renders nothing here.
  artifacts:
    langgraph-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
