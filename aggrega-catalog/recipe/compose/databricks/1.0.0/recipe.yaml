apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: databricks
  version: 1.0.0
  description: >
    a Databricks model serving endpoint as a reference realization: no compute runs in-cluster. the compose engine carries the operator-supplied endpoint and credential to consumers through the injection contract; no service runs.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/databricks:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    credential:
      from: databricks_token
      env: DATABRICKS_TOKEN
