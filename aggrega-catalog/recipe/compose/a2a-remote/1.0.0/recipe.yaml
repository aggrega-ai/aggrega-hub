apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: a2a-remote
  version: 1.0.0
  description: >
    An agent another party runs over the Agent2Agent (A2A) protocol, reached at
    the address infra.endpoint names, as a reference realization for local
    development via Docker Compose: no service is defined for it and nothing
    runs. The address reaches a consuming service through the injection context
    rather than through a service definition, because compose has no
    counterpart to an in-cluster alias. provides.endpoint is the address as
    written, protocol is its scheme, agent_card_url is where the agent's card is
    read, and credential_header is the request header the agent reads a
    caller's credential from, Authorization unless infra.credential_header names
    another. token_url, oidc_discovery_url and scopes are where and for what a
    caller obtains a token under the card's OAuth 2.0 or OpenID Connect scheme,
    as infra names them, and empty where it names none.

    No credential is held here: a consumer that needs one holds it on its own
    connection to the agent and presents it under that header, because the
    credential belongs to the consumer rather than to the address.
    infra.endpoint is the address without any part that carries a key, at least
    a scheme and a host. An address carrying a user name or password is refused,
    for infra.endpoint and infra.agent_card_url alike. infra.token_url and
    infra.oidc_discovery_url, where set, are each refused unless they are an
    https URL naming a host with no user name or password, since OAuth 2.0
    sends a client secret only over TLS.

    Reach for this realization under Docker Compose; helm/a2a-remote is the
    same reference on Kubernetes.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/a2a-remote:1.0.0
  # infra.endpoint is read once here, and provides and the workload read the
  # parts below from it. optional, because a Release that sets no address
  # leaves the key absent, and a bare reference to an absent key halts before
  # the assertion below can say what is missing.
  #
  # port is the one the address names, or its scheme's default port where it
  # names none: 80 for http, 443 for https. Matching the host's trailing
  # digits rather than splitting on the colon keeps an IPv6 literal whole. It
  # is read only by the workload below; the Component publishes no port.
  #
  # agent_card_url is infra.agent_card_url where the Release sets it, and
  # otherwise the protocol's well-known location on the endpoint's scheme and
  # host, its port included where the address names one.
  #
  # DELIBERATE NEAR-DUPLICATE of recipe/helm/a2a-remote's locals: a local
  # sits inside the Recipe that renders it and no catalog kind holds one for
  # two Recipes to share, so the two are moved together.
  locals:
    endpoint: '{{ optional .infra "endpoint" "" }}'
    scheme: '{{ (urlParse .locals.endpoint).scheme }}'
    port: '{{ $u := urlParse .locals.endpoint }}{{ $p := regexFind ":[0-9]+$" $u.host | trimPrefix ":" }}{{ if $p }}{{ $p }}{{ else if eq $u.scheme "http" }}80{{ else }}443{{ end }}'
    agent_card_url: '{{ $c := optional .infra "agent_card_url" "" }}{{ if $c }}{{ $c }}{{ else }}{{ $u := urlParse .locals.endpoint }}{{ $u.scheme }}://{{ $u.host }}/.well-known/agent-card.json{{ end }}'
  # The contract is key-for-key the one helm/a2a-remote publishes, so a
  # consumer reads the same keys on either target. credential_header is
  # published from infra, where the Component holds its default. token_url,
  # oidc_discovery_url and scopes hold no default, so each is read through
  # optional and published empty while the Release sets none; a consumer reads
  # an empty value as absent. Each is published as written, once the assertion
  # below has held a token_url or oidc_discovery_url the Release sets to an
  # https URL naming a host with no user name or password.
  provides:
    endpoint: "{{ .locals.endpoint }}"
    agent_card_url: "{{ .locals.agent_card_url }}"
    protocol: "{{ .locals.scheme }}"
    credential_header: "{{ .infra.credential_header }}"
    token_url: '{{ optional .infra "token_url" "" }}'
    oidc_discovery_url: '{{ optional .infra "oidc_discovery_url" "" }}'
    scopes: '{{ optional .infra "scopes" "" }}'
  assertions:
    # The agent is the other party's, so no address exists for the catalog to
    # hold as a default: the Release names it.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches an agent another party runs over the A2A protocol, so the Release supplies its address and the catalog holds no default: set infra.endpoint in the Release to the http or https URL of an interface the agent's card lists for a binding served over HTTP, without any part that carries a key and with at least its scheme and host, for example https://agent.example.com/a2a/v1" -}}
      {{- end -}}
    # Where a caller obtains a token is published to every consumer, and one
    # holding a client secret sends it there, so a token_url or oidc_discovery_url the
    # Release sets is held here, before anything renders, to an https URL
    # naming a host, since OAuth 2.0 sends a client secret only over TLS, and to
    # one carrying no user name or password, which would write a credential into
    # every rendered file a consumer delivers the address into. Holding it at the
    # agent makes the rule the same whichever consumer reads the address, or
    # none does. An unset value passes and is published empty. No message
    # repeats the address, so a credential written into it reaches no log
    # either. The two conditions are the ones the workload below applies to
    # infra.endpoint, with https alone admitted.
    token_addresses_https: >-
      {{- range $key := list "token_url" "oidc_discovery_url" -}}
      {{- with optional $.infra $key "" -}}
      {{- $u := urlParse . -}}
      {{- if $u.userinfo -}}
      {{- fail (printf "infra.%s of %q carries a user name or password before its host, which would write a credential into every rendered file a consumer delivers the address into: remove it, since the client secret a caller obtains a token with is held on that caller's own connection to the agent" $key $.metadata.instance_id) -}}
      {{- end -}}
      {{- if not (and (eq $u.scheme "https") $u.hostname) -}}
      {{- fail (printf "infra.%s of %q is not an https URL naming a host, and OAuth 2.0 sends a client secret only over TLS: set it to the https URL the agent's card declares, or leave it unset where the card declares no such scheme" $key $.metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block. It runs nothing, so it reads no image, port or compute.
  #
  # An address that is not an http or https URL naming a host halts the build,
  # as does one carrying a user name or password, which would put a credential
  # into every rendered file the address reaches; infra.agent_card_url, where
  # the Release sets it, is held to the same two checks. No message repeats the
  # address, so a credential written into it reaches no log either.
  #
  # form: reference is the no-compute shape: compose defines no service for
  # it, and the address reaches a consumer through provides.
  workload: |
    {{- $u := urlParse .locals.endpoint -}}
    {{- if $u.userinfo -}}
    {{- fail (printf "infra.endpoint of %q carries a user name or password before its host, which would write a credential into every rendered file the address reaches: remove it, and have each consumer hold the credential on its connection to the agent, presented under the header credential_header publishes" $.context.instance_id) -}}
    {{- end -}}
    {{- if not (and (has $u.scheme (list "http" "https")) $u.hostname) -}}
    {{- fail (printf "infra.endpoint of %q is not an http or https URL naming a host: set it to the URL of an interface the agent's card lists for a binding served over HTTP, without any part that carries a key and with at least its scheme and host, for example https://agent.example.com/a2a/v1" $.context.instance_id) -}}
    {{- end -}}
    {{- with optional .infra "agent_card_url" "" -}}
    {{- $c := urlParse . -}}
    {{- if $c.userinfo -}}
    {{- fail (printf "infra.agent_card_url of %q carries a user name or password before its host, which would write a credential into every rendered file the address reaches: remove it, and have each consumer hold the credential on its connection to the agent, presented under the header credential_header publishes" $.context.instance_id) -}}
    {{- end -}}
    {{- if not (and (has $c.scheme (list "http" "https")) $c.hostname) -}}
    {{- fail (printf "infra.agent_card_url of %q is not an http or https URL naming a host: set it to the URL the agent's card is read at, for example https://agent.example.com/.well-known/agent-card.json, or leave it unset to publish the well-known location on infra.endpoint's scheme and host" $.context.instance_id) -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .locals.endpoint }}"
    port: {{ .locals.port }}
