apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: s3-object-store
  version: 1.0.0
  # The licence of SeaweedFS, the server this Recipe runs from its project's
  # published chrislusf/seaweedfs image.
  license: Apache-2.0
  description: >
    An S3-compatible object store on a Compose host: SeaweedFS 4.48,
    Apache-2.0, from its project's published chrislusf/seaweedfs image, run by
    the compose provider's Workload synthesis as one weed server process —
    master, volume server, filer and S3 gateway — with a named volume for its
    data and the S3 port published on the host. An init service creates the
    bucket values.bucket names before the server serves, and leaves an existing
    one as it is.

    Reach for it where the store runs on a Compose host with nothing else in
    place; for helm/s3-object-store in a Kubernetes cluster; for
    terraform/s3-object-store-amazon-s3 or
    cloudformation/s3-object-store-amazon-s3 in an AWS account; and for
    terraform/s3-object-store-gcs in a Google Cloud project.

    The access_key_id and secret_access_key slots are the server's S3 account,
    and both are required here: each value arrives on the inject pipe under
    AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY and is written into the
    service's environment as delivered, so a Compose variable reference such
    as ${S3_SECRET_ACCESS_KEY} keeps the key out of the file. An empty slot
    halts naming it. The server serves plain HTTP on the Compose network and
    the host; only the S3 gateway listens beyond the container, on its S3 port
    and the gRPC port beside it, and each refuses a caller without the key.

    It publishes the bucket, the endpoint http://<service>:8333, its host,
    port 8333, protocol s3 and region us-east-1, the one S3 clients read from a
    server reporting none. infra.region, any infra.overrides key and a bucket
    name SeaweedFS does not take halt naming the key.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/storage/s3-object-store:1.0.0
  # This Recipe reads no infra.overrides keys; any key under it halts the build
  # naming it.
  #
  # Every Component value and infra key is honoured or refused by name:
  #   honoured — values.bucket, as the bucket the init service creates;
  #     access_key_id and secret_access_key, as the server's S3 account.
  #   refused — a bucket name SeaweedFS does not take; infra.region, which
  #     SeaweedFS reads nowhere; any infra.overrides key; and either key slot
  #     left empty, or filled with nothing delivered under the variable this
  #     Recipe reads.
  #
  # The Component declares no version, port or sizing key, so the image tag
  # and the S3 port are fixed here: 4.48 and 8333, the S3 gateway's own
  # default. The volume is a named volume, which takes no size on this target.
  # No resources are reserved or limited.
  #
  # The region. SeaweedFS verifies a request signed for any region, taking the
  # region from the request's own credential scope, and answers
  # GetBucketLocation with an empty location constraint, which an S3 client
  # reads as us-east-1. So region is published as us-east-1, a client signing
  # for it is answered, and infra.region, which would place nothing, halts the
  # build naming it.
  #
  # host is the bare service name, resolved on the Compose network; endpoint
  # composes it with the port under http, the scheme the S3 gateway is served
  # over: the service mounts no certificate, so the server terminates no TLS.
  # host and endpoint spell the name out twice on purpose: a provides entry
  # cannot read another.
  provides:
    bucket: "{{ .values.bucket }}"
    region: "us-east-1"
    endpoint: "http://{{ .context.instance_id }}:8333"
    host: "{{ .context.instance_id }}"
    port: "8333"
    protocol: "s3"
  assertions:
    # The two slots are the account the S3 gateway authenticates every request
    # by, and a key every reader of the catalog holds would guard nothing, so
    # there is no default for either.
    key_slots_filled: >-
      {{- $f := default dict .features -}}
      {{- range $pair := list (list "access_key_id" "AWS_ACCESS_KEY_ID") (list "secret_access_key" "AWS_SECRET_ACCESS_KEY") -}}
      {{- $slot := index $pair 0 -}}
      {{- $var := index $pair 1 -}}
      {{- if not (hasKey $f $slot) -}}
      {{- fail (printf "the %s slot is empty, and SeaweedFS takes the access_key_id and secret_access_key pair as the account its S3 API authenticates every request by, so there is no default for either: attach a credential to %s delivering %s, such as core/secret-value with key %s and its origin a Compose variable reference such as ${%s}" $slot $slot $var $var $var) -}}
      {{- end -}}
      {{- end -}}
    region_unset: >-
      {{- with optional .infra "region" "" -}}
      {{- fail (printf "infra.region is %q, and SeaweedFS reads no region: it answers a request signed for any region and reports none for its buckets, which S3 clients read as us-east-1, the region this Recipe publishes; remove infra.region from the Release" (toString .)) -}}
      {{- end -}}
    # The bucket name rules SeaweedFS's S3 API applies, so the init service
    # never meets a name the server refuses.
    bucket_name_seaweedfs_takes: >-
      {{- $b := toString .values.bucket -}}
      {{- $rule := "" -}}
      {{- if not (regexMatch `^[\p{Ll}\p{N}.-]*$` $b) -}}
      {{- $rule = "SeaweedFS takes lowercase letters, numbers, periods and hyphens alone in a bucket name" -}}
      {{- else if or (lt (len $b) 3) (gt (len $b) 63) -}}
      {{- $rule = "SeaweedFS takes a bucket name of 3 to 63 bytes" -}}
      {{- else if or (hasPrefix "." $b) (hasPrefix "-" $b) (hasSuffix "." $b) (hasSuffix "-" $b) -}}
      {{- $rule = "SeaweedFS takes a bucket name only where it begins and ends with a letter or a number" -}}
      {{- else if contains ".." $b -}}
      {{- $rule = "SeaweedFS takes no bucket name holding two adjacent periods" -}}
      {{- else if regexMatch `^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$` $b -}}
      {{- $rule = "SeaweedFS takes no bucket name in the form of an IP address" -}}
      {{- else if hasPrefix "xn--" $b -}}
      {{- $rule = "SeaweedFS reserves the prefix xn--" -}}
      {{- else if hasSuffix "-s3alias" $b -}}
      {{- $rule = "SeaweedFS reserves the suffix -s3alias" -}}
      {{- else if eq $b "filemeta" -}}
      {{- $rule = "SeaweedFS reserves the name filemeta for its own metadata store" -}}
      {{- end -}}
      {{- if $rule -}}
      {{- fail (printf "values.bucket is %q, and %s: set values.bucket in the Aggregate to another name" $b $rule) -}}
      {{- end -}}
    overrides_unread: >-
      {{- range $k, $v := (optional .infra "overrides" dict) -}}
      {{- fail (printf "infra.overrides.%s is not a setting this Recipe reads: it reads no infra.overrides key; remove infra.overrides.%s from the Release" $k $k) -}}
      {{- end -}}
  workload: |
    {{- /* The script the init service runs, with the bucket name in it. The name
      holds lowercase letters, numbers, periods and hyphens alone, which the
      assertion above has checked, so the shell reads it as one word. Each $ the
      shell reads is written $$, because Docker Compose substitutes $NAME in
      every value of the file and reads $$ as one $. The line is written as a JSON
      string, so YAML reads it as written. */ -}}
    {{- $create := printf "/entrypoint.sh server -ip=127.0.0.1 -ip.bind=127.0.0.1 -filer -master.telemetry=false & pid=$$!; n=0; while :; do out=`echo 's3.bucket.create -name %s' | timeout 30 weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 2>&1`; status=$$?; case \"$$out\" in *'bucket %s already exists'*) status=0;; esac; [ $$status -eq 0 ] && break; n=`expr $$n + 1`; [ $$n -ge 60 ] && break; kill -0 $$pid 2>/dev/null || break; sleep 2; done; echo \"$$out\"; kill $$pid; wait $$pid; exit $$status" (toString .values.bucket) (toString .values.bucket) -}}
    {{- /* A credential on this target reaches the Recipe on the inject pipe under
      the key its attachment names, so a slot filled with nothing delivered under
      the variable read below halts the build, rather than rendering an empty
      key. */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- range $pair := list (list "access_key_id" "AWS_ACCESS_KEY_ID") (list "secret_access_key" "AWS_SECRET_ACCESS_KEY") -}}
    {{- if and (hasKey (default dict $.features) (index $pair 0)) (not (hasKey $env (index $pair 1))) -}}
    {{- fail (printf "the %s slot of %q is filled, but nothing is delivered under %s on the inject pipe, the variable this Recipe gives the server that key in: set the key of the credential attached to %s to %s" (index $pair 0) $.context.instance_id (index $pair 1) (index $pair 0) (index $pair 1)) -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    initContainers:
      # Creates the bucket before the server serves, as a service the server's
      # service waits on. The admin shell creates a bucket over the filer's
      # gRPC, so the init service starts a server of its own against the data
      # volume, on the loopback address alone and with no S3 gateway, runs
      # s3.bucket.create until its filer answers, and stops it. A bucket that
      # already exists — every start after the first — is left as it is: the
      # shell answers "bucket <name> already exists", which counts as done. The
      # shell is retried every 2 s while the server starts, 60 times at most; an
      # answer still failing then, or a server that exits, fails the init
      # service, so the server never serves a store without its bucket. The
      # image's entrypoint makes the volume the seaweed user's and drops to that
      # user, for this server as for the main one. No credential is read: the
      # shell reaches the filer on loopback.
      - name: bucket
        image: "chrislusf/seaweedfs:4.48"
        command: ["/bin/sh"]
        args:
          - "-c"
          - {{ $create | toJson | replace "\u0085" "\\u0085" }}
        volumeMounts:
          - name: data
            path: /data
    containers:
      main:
        image: "chrislusf/seaweedfs:4.48"
        # The image's entrypoint runs `weed server` with its data directory at
        # /data and the volume count sized to the disk. The master, the volume
        # server and the filer listen on the loopback address alone, -ip and
        # -ip.bind, because their HTTP and gRPC ports take no key; only the S3
        # gateway listens on every address, -s3.ip.bind, on the S3 port and the
        # gRPC port beside it. The
        # gateway's Iceberg and Lance catalog ports are off, and so is the
        # master's report of anonymous usage statistics to SeaweedFS's own
        # server, which is on unless switched off.
        args:
          - server
          - -ip=127.0.0.1
          - -ip.bind=127.0.0.1
          - -filer
          - -s3
          - -s3.port=8333
          - -s3.ip.bind=0.0.0.0
          - -s3.port.iceberg=0
          - -s3.port.lance=0
          - -master.telemetry=false
        # The server's S3 account, read off the inject pipe. SeaweedFS reads
        # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as an admin identity, and
        # with an identity present it authenticates every S3 request. The
        # gateway's own gRPC port listens beside the S3 port and takes identity
        # changes, unauthenticated unless a filer signing key is set, so
        # WEED_JWT_FILER_SIGNING_KEY, the environment spelling of that key, is
        # the secret key as well. The assertion above has halted a build
        # leaving either slot empty or undelivered, and the guard lets a
        # single-entity validate, which attaches nothing, still render the rest.
    {{- if and (hasKey $env "AWS_ACCESS_KEY_ID") (hasKey $env "AWS_SECRET_ACCESS_KEY") }}
        variables:
          AWS_ACCESS_KEY_ID: "{{ optional $env "AWS_ACCESS_KEY_ID" "" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          AWS_SECRET_ACCESS_KEY: "{{ optional $env "AWS_SECRET_ACCESS_KEY" "" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          WEED_JWT_FILER_SIGNING_KEY: "{{ optional $env "AWS_SECRET_ACCESS_KEY" "" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
        ports:
          s3: 8333
        # The service's healthcheck asks the S3 gateway's /healthz, which
        # answers 200, unauthenticated, once it serves, with the curl the
        # image's build installs. A service keeps one healthcheck, so one probe
        # is declared.
        health:
          ready:
            http: /healthz
            periodSeconds: 10
            timeoutSeconds: 5
        volumeMounts:
          - name: data
            path: /data
    volumes:
      data:
        persistent:
          size: "8Gi"
    services:
      default:
        type: NodePort
        ports:
          s3: 8333
