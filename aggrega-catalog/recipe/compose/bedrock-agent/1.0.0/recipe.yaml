apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: bedrock-agent
  version: 1.0.0
  description: >
    An Amazon Bedrock agent as a reference realization for local development, so
    no service runs. The compose engine carries the operator-supplied regional
    endpoint and the agent name to consumers through the injection contract, and
    delivers no credential — consumers authenticate with their own AWS
    credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/bedrock:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_name: "{{ .values.agent_name }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
