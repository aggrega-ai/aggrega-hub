apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: anthropic
  version: 1.0.0
  description: >
    Anthropic's managed Claude API as a reference realization for local
    development: no service runs. The compose engine carries the endpoint and
    api_key credential to consumers through the injection contract.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/anthropic:1.0.0
  provides:
    endpoint: "https://api.anthropic.com"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "https://api.anthropic.com"
    port: 443
    credential:
      from: api_key
      env: ANTHROPIC_API_KEY
