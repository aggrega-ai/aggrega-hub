apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: qdrant
  version: 1.0.0
  license: Apache-2.0
  description: >
    Qdrant for local development via Docker Compose. Synthesized-mode Workload —
    the compose provider translates the Workload kind into a service entry
    (image, ports, environment). Authentication is off by default; when an
    api_key credential is attached its value arrives on the env pipe and is
    rendered as the server's service API key, and a read_only_api_key
    credential is rendered the same way as its read-only key. Storage sizing
    and the persistent volume are a synthesized-Helm concern, so this
    local-development flavor is ephemeral and declares no data volume,
    mirroring how the Compose postgres flavor leaves storage to the helm
    target. provides.host is the bare service
    name, resolved on the compose network. provides.metrics_endpoint names the
    server's metrics on the REST port; while api_key is attached a scrape
    presents the read-only key where read_only_api_key is attached, and the
    api_key otherwise.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/qdrant:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # protocol is "http" — the port published as provides.port serves Qdrant's REST
  # API over HTTP, and a consumer composing a URL needs the scheme rather than the
  # product name.
  #
  # metrics_endpoint is where the server serves its Prometheus metrics: /metrics
  # on the REST port, reached on the compose network under the service name,
  # spelled out again because a provides entry cannot read another provides
  # entry. With an api_key credential attached, the key guards that route too,
  # so a scrape presents a key: the read-only key where read_only_api_key is
  # attached, which the route answers, and the api_key otherwise.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    grpc_port: "{{ .infra.grpc_port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/metrics"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "qdrant/qdrant:{{ .infra.engine_version }}"
        # The server reads its whole configuration from a file it ships, and every
        # setting in that file can be overridden by an environment variable whose
        # name is the setting's path, uppercased, prefixed QDRANT__ and joined by a
        # double underscore. Each knob below is emitted only when the Aggregate
        # set it, so a bare deployment renders no configuration variables at all.
        # compute sizing is a helm-synth concern; this flavor reads only the
        # developer, port and version surface, as the Compose postgres flavor does.
        variables:
          QDRANT__SERVICE__HTTP_PORT: "{{ .infra.port }}"
          QDRANT__SERVICE__GRPC_PORT: "{{ .infra.grpc_port }}"
    {{- with .values.log_level }}
          QDRANT__LOG_LEVEL: "{{ . }}"
    {{- end }}
    {{- with .values.max_request_size_mb }}
          QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "{{ . }}"
    {{- end }}
    {{- if .values.telemetry_disabled }}
          QDRANT__TELEMETRY_DISABLED: "true"
    {{- end }}
        # Authentication rides the optional api_key credential slot. When a
        # credential is attached its value arrives on the inject pipe as
        # .context.inject.env.QDRANT__SERVICE__API_KEY and the server enforces it
        # on every request. The optional read_only_api_key slot arrives the same
        # way, as .context.inject.env.QDRANT__SERVICE__READ_ONLY_API_KEY, and is
        # rendered as the server's read-only key, which it answers with read
        # access and never a write; the Component halts the build when that slot
        # is filled without api_key. A slot filled with a credential that delivers
        # no value under its variable halts the build naming that variable. With
        # neither attached, no key variable is emitted and the server accepts
        # unauthenticated requests.
    {{- $delivered := default dict (optional (default dict .context.inject) "env" dict) }}
    {{- if or (hasKey (default dict .features) "api_key") (optional $delivered "QDRANT__SERVICE__API_KEY" "") }}
          QDRANT__SERVICE__API_KEY: "{{ index .context.inject.env "QDRANT__SERVICE__API_KEY" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- if or (hasKey (default dict .features) "read_only_api_key") (optional $delivered "QDRANT__SERVICE__READ_ONLY_API_KEY" "") }}
          QDRANT__SERVICE__READ_ONLY_API_KEY: "{{ index .context.inject.env "QDRANT__SERVICE__READ_ONLY_API_KEY" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
        ports:
          http: {{ .infra.port }}
          grpc: {{ .infra.grpc_port }}
        # Qdrant serves /readyz on its REST port, answering 200 once the server
        # is started and ready to be used. The image carries no curl, nc or other
        # HTTP client, and an http check is sent to the port whose name sorts
        # first, which here is `grpc`. So the service's healthcheck opens a TCP
        # connection to the REST port with the image's own bash, through its
        # /dev/tcp redirection, which succeeds once the server has started. A
        # service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - bash
              - "-c"
              - "exec 3<>/dev/tcp/127.0.0.1/{{ .infra.port }}"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
          grpc: {{ .infra.grpc_port }}
