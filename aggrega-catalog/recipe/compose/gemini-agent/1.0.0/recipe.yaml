apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: gemini-agent
  version: 1.0.0
  description: >
    A Gemini assistant on Google's generative-language API as a reference
    realization for local development, so no service runs. The compiler
    carries the endpoint and the model string to consumers through the
    injection contract. No credential is delivered by this recipe: a consumer
    that needs one declares it as `credential` on the socket that reaches
    this endpoint and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/gemini:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
