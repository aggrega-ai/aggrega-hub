apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mcp
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Model Context Protocol server tool on Docker Compose, for local
    development: one service running the image the Release names in
    infra.image, serving the protocol over HTTP on infra.port, where an agent
    on the compose network reaches it at the service's name. Where the Release
    sets infra.published_port, that port on the host's loopback address,
    127.0.0.1, forwards to infra.port; unset, nothing is published, and two
    servers that each publish take distinct published_port values. The tool
    packages no upstream product, so a
    build with no image set halts and names the key. provides publishes host,
    port, endpoint, protocol and credential_header.

    An edge from the tool, on a socket the author names, delivers the names its
    `inject:` block dictates, as variables or as files from compose configs;
    the component's own `inject:` block delivers its entries the same way. The
    server's credentials arrive through the server_env slot: attach
    core/referenced-secret-set mapped to compose/dotenv-secret-set, each
    entry's value a Compose variable reference such as ${GITHUB_TOKEN}, which
    Docker Compose substitutes when the stack starts. An attachment publishing
    only a secret resource's name, or delivering no variable, halts the build.

    Reach for this realization under Docker Compose where the server ships as
    a container image serving the protocol over HTTP; reach for helm/mcp on
    Kubernetes, for compose/mcp-stdio-bridge where the server is a package
    speaking stdio, and for compose/mcp-remote where someone else already runs
    it. The two stdio keys and infra.endpoint are refused here.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-tool/mcp:1.1.0
  # The service the compose provider synthesizes is named after the component
  # instance, and a consumer on the same compose network resolves that name
  # directly. Nothing fronts the container, so the port a caller reaches is
  # the one the server listens on. The keys are the ones helm/mcp publishes,
  # so a consumer reads the same contract on either target. Which header the
  # image's server checks a caller's credential in is the image's, so the
  # Release states it in infra.credential_header, where the Component holds
  # its default: credential_header is Authorization unless the Release names
  # another.
  #
  # The host sees the server only where the Release asks: with
  # infra.published_port set, the service entry at the end of the workload
  # publishes it on 127.0.0.1, forwarding to infra.port, so a client on the
  # machine reaches the server there and on no other host interface; any
  # process on the machine can reach it. Two services cannot publish one host
  # port, which is why two servers in one stack that each publish, on this
  # realization or on compose/mcp-stdio-bridge, take distinct published_port
  # values. provides is unchanged by it: a consumer on the compose network
  # still reaches the service by name on infra.port.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "http"
    credential_header: "{{ .infra.credential_header }}"
  # The name the workload's volumes and the ComposeInjectFiles bundle both
  # give each dictated file's compose config begins with this prefix; the
  # bundle stops the build when the two differ.
  locals:
    inject_file_config_prefix: "{{ .context.instance_id }}-file-"
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs. A Release carrying an
    # input only another realization reads is told which realization reads it
    # by the workload's refusal below, rather than asked for an image it does
    # not mean to run.
    image_supplied: >-
      {{- $elsewhere := or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") (optional .infra "endpoint" "") -}}
      {{- if not (or (optional .infra "image" "") $elsewhere) -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the Model Context Protocol over HTTP in the Release" -}}
      {{- end -}}
    # A key left out of infra.compute takes the component's default, so only a
    # value written empty reaches this check.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets infra.compute.cpu on the tool to an empty value, so the rendered service would carry no CPU limit or reservation: set it, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets infra.compute.memory on the tool to an empty value, so the rendered service would carry no memory limit or reservation: set it, or remove it to take the component's default" -}}
      {{- end -}}
  # Every Component value and infra key is honoured or refused below by name:
  #   honoured — values.side_effects, values.timeout_seconds and
  #     values.llm_description_override as the variables described below;
  #     infra.image (required); infra.port as the container's port and the
  #     port published in provides; infra.published_port as the host port the
  #     service entry publishes on 127.0.0.1; infra.credential_header, published as
  #     provides.credential_header; infra.compute.cpu and infra.compute.memory
  #     as the service's limits and reservations; the server_env slot, as the
  #     variables its attachment delivers.
  #   refused — infra.stdio_command and infra.stdio_runtime, which
  #     compose/mcp-stdio-bridge reads; infra.endpoint, which
  #     compose/mcp-remote reads; a compute quantity left empty; an edge's or
  #     the component's own arg or custom-mechanism entry; a file entry at a
  #     path that is not absolute or that lies beneath another entry's path; a
  #     variable delivered under a name this Recipe delivers itself; a
  #     server_env attachment publishing a secret resource's name, or
  #     delivering no variable.
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block.
  #
  # No health check is declared. On this target a service's one check runs
  # inside its image, and the image is the Release's: whether it carries a
  # shell and the client an HTTP or TCP check runs cannot be known here, and a
  # check whose tool is missing reports the service unhealthy for ever.
  # helm/mcp declares a TCP readiness probe, which Kubernetes runs from outside
  # the container, which no compose check can do.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation names a
  # spelling for them; the recipe delivers each under the default name helm/mcp
  # delivers it under, for the server's own code to read. The optional
  # description override is emitted only when the developer set it, so an
  # unset value renders no variable rather than an empty one. Docker Compose
  # reads $NAME and ${NAME} anywhere in a compose file as its own variables and
  # $$ as a literal $, so each $ in a value the developer wrote is doubled and
  # reaches the container as written.
  #
  # The image is the tool's own code, and the component declares no socket, so
  # this recipe derives no variable from a connection: an edge from the tool,
  # on whatever socket the author names, delivers exactly what its inject block
  # dictates — any key the target publishes, under the names that code reads —
  # and an edge writing none delivers nothing. A dictated env entry becomes a
  # variable of the service under the name it gives, written as the inject pipe
  # carries it, so a Compose variable reference a credential delivers, such as
  # ${API_TOKEN}, stays one for Compose to substitute when the stack starts; a
  # dictated file entry becomes a compose config mounted as one file at the
  # absolute path it names, its content written with each $ doubled so the file
  # holds the value itself, and a path that is not absolute, or one lying
  # beneath another file's path, is refused. An arg entry is refused, because
  # this recipe renders no command line: a service's command replaces the
  # image's default command, which is the Release's. Any other mechanism is
  # refused too. A dictated variable named like one of the tool's own values
  # this recipe delivers halts the build, naming both, since the compiler cannot
  # see the names a recipe writes.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, and its env and file entries reach the
  # container as a connection's do: each env entry under the name it gives,
  # read off the inject pipe, and each file at the absolute path it names, from
  # a compose config of its own, checked as a connection's file is. The names
  # this recipe gives the tool's own values are defaults: each is rendered, and
  # kept from a connection, only while no entry of that block, in either
  # mechanism, delivers its value. The templates read that at
  # .context.self_inject, which maps each name the developer wrote to
  # values.<key> for an entry whose template reads that one own value. A refusal
  # about one of that block's entries names the block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits — here that second
  # reading is the ComposeInjectFiles bundle's, below; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. The connections
  # and that block only record who dictates each name and each file, and each
  # refusal runs once over both, naming the one that dictated it. Here it is
  # part of the workload template, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  #
  # The server's credentials, from the server_env slot. Docker Compose has no
  # secret reference, so a credential reaches a service only as a value
  # written into the compose file; written as a Compose variable reference,
  # ${NAME}, the file carries the reference and Docker Compose substitutes it
  # when the stack starts. The slot's attachment delivers its variables on the
  # inject pipe through its realization's mapping — compose/dotenv-secret-set
  # one per entry of a core/referenced-secret-set, compose/dotenv-secret one
  # for a core/secret-value — and each becomes a variable of the service under
  # the name it was delivered under, written as the pipe carries it.
  # compose/dotenv-secret writes its mapping keyed by mechanism, which the
  # build refuses while the component's own inject block also delivers a file,
  # so the refusals below name it only with that condition;
  # compose/dotenv-secret-set writes a flat mapping and serves either way. The
  # pipe
  # does not say which attachment delivered an entry, so this recipe delivers
  # every env entry on it that neither a connection nor the component's own
  # inject block dictates: the server_env attachment's, and those of any other
  # attachment on the component. Two refusals keep an attachment from being
  # dropped: one whose realization publishes a non-empty name, the locator of
  # a secret resource the server's variables would be read from —
  # core/referenced-secret's and core/referenced-secret-set's Kubernetes
  # realizations publish one, and a Manifest may map either on this target —
  # halts the build naming it, since this target cannot read a resource by
  # name; and one under which no variable reaches the pipe under a name no
  # inject block dictates halts it too, since the pipe cannot tell an
  # attachment delivering nothing from one delivering only a name an inject
  # block also dictates; such a name, beside names of the attachment's own,
  # carries the attachment's value, which replaces the inject block's on the
  # pipe. A delivered variable named like one this recipe delivers itself
  # halts the build as a dictated one does, naming it. helm/mcp refuses a
  # server_env attachment and delivers nothing from it to the image it runs;
  # this realization writes the variables into the service itself.
  # DELIBERATE NEAR-DUPLICATE of compose/mcp-stdio-bridge's reading of the
  # slot, for the reason above: the same two refusals and the same delivery,
  # save that this one counts the names the component's own inject block
  # dictates as dictated, since it delivers that block; its locator refusal
  # recommends compose/dotenv-secret only with the condition above and names no
  # Kubernetes realization, where the bridge's names helm/mcp-stdio-bridge; and
  # its no-variable refusal recommends compose/dotenv-secret-set alone. A change
  # to one is made to both.
  #
  # The compose configs for the file entries the connections and the
  # component's own inject block dictate come from the ComposeInjectFiles
  # bundle, which compose/mcp-stdio-bridge, compose/http-request and
  # compose/retrieval import too: one per file,
  # numbered in path order, named <instance>-file-<n>, the names the workload's
  # volumes read, and emitted only while either one dictates a file, so a build
  # with none renders nothing there. The bundle checks that the local
  # inject_file_config_prefix, declared above, is the prefix it names them by.
  # The block reading the connections' inject directives in the workload is
  # the one every compose Workload realization of a tool in this catalog
  # declares, differing only in the names each delivers itself and the
  # refusals its own service calls for; a change to it is made to all.
  artifacts:
    mcp-files:
      $import: ComposeInjectFiles#/artifacts/Configs
  workload: |
    {{- if or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") -}}
    {{- fail (printf "infra.stdio_command or infra.stdio_runtime of %q is set, but this realization runs the image infra.image names and starts no command line; remove both, or map the component to compose/mcp-stdio-bridge to run that command line behind the bridge" $.context.instance_id) -}}
    {{- end -}}
    {{- with optional .infra "endpoint" "" -}}
    {{- fail (printf "infra.endpoint of %q is set, but this realization runs the image infra.image names and reaches no server elsewhere; remove infra.endpoint, or map the component to compose/mcp-remote to reach the server at that address" $.context.instance_id) -}}
    {{- end -}}
    {{- /* A server_env attachment whose realization publishes the name of a
           secret resource would reach the server with nothing on this target:
           the build halts naming it. Near-duplicate of
           compose/mcp-stdio-bridge's check, as the note above the artifacts
           says. */ -}}
    {{- $serverEnv := optional (default dict .features) "server_env" dict -}}
    {{- with optional (optional $serverEnv "provides" dict) "name" "" -}}
    {{- fail (printf "the server_env slot of %q carries an attachment whose realization publishes %q, the name of a secret resource the server's variables are to be read from, and Docker Compose has no secret reference to read them through: attach core/referenced-secret-set mapped to compose/dotenv-secret-set, writing each entry's value as a Compose variable reference such as ${GITHUB_TOKEN}; core/secret-value mapped to compose/dotenv-secret serves too, but only while the component's own inject block delivers no file" $.context.instance_id .) -}}
    {{- end -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $named := dict -}}
    {{- $ownEnv := dict -}}
    {{- $ownFile := dict -}}
    {{- range $mechanism, $names := default dict .context.self_inject -}}
    {{- range $name, $key := $names -}}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end -}}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end -}}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $own := dict -}}
    {{- $taken := dict -}}
    {{- if not (hasKey $named "values.side_effects") }}{{ $_ := set $own "MCP_TOOL_SIDE_EFFECTS" (toString .values.side_effects) }}{{ $_ := set $taken "MCP_TOOL_SIDE_EFFECTS" "the component's own value side_effects" }}{{ end -}}
    {{- if not (hasKey $named "values.timeout_seconds") }}{{ $_ := set $own "MCP_TOOL_TIMEOUT_SECONDS" (toString .values.timeout_seconds) }}{{ $_ := set $taken "MCP_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" }}{{ end -}}
    {{- $_ := set $own "MCP_TOOL_PORT" (toString .infra.port) -}}
    {{- $_ := set $taken "MCP_TOOL_PORT" "the component's own infra.port" -}}
    {{- with .values.llm_description_override -}}
    {{- if not (hasKey $named "values.llm_description_override") }}{{ $_ := set $own "MCP_TOOL_DESCRIPTION" (toString .) }}{{ $_ := set $taken "MCP_TOOL_DESCRIPTION" "the component's own value llm_description_override" }}{{ end -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- $dictated := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "file" -}}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $by := $dictated -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $by := $files -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- /* The variables the component's attachments delivered: every env
           entry on the pipe that neither a connection nor the component's own
           inject block dictates. Near-duplicate of compose/mcp-stdio-bridge's
           reading, as the note above the artifacts says. */ -}}
    {{- $attached := list -}}
    {{- range $name, $v := $env -}}
    {{- if not (hasKey $dictated $name) -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "an attachment on %q delivers the variable %s, which this realization already delivers from %s: deliver the credential under another name" $.context.instance_id $name .) -}}
    {{- end -}}
    {{- $attached = append $attached $name -}}
    {{- end -}}
    {{- end -}}
    {{- if and (hasKey (default dict .features) "server_env") (not $attached) -}}
    {{- fail (printf "the server_env slot of %q carries an attachment that delivers no variable under a name of its own: it delivers none, or only names the component's own inject block or a connection's also dictates. Attach core/referenced-secret-set mapped to compose/dotenv-secret-set with at least one entry under a name no inject block dictates, or remove the attachment" $.context.instance_id) -}}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        ports:
          http: {{ .infra.port }}
        variables:
          {{- range $name, $value := $own }}
          {{ $name }}: {{ replace "$" "$$" $value | toJson }}
          {{- end }}
          {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- range $alias, $edge := .context.uses }}
          {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- end }}
          {{- range $name := $attached }}
          {{ toJson $name }}: {{ toJson (toString (index $env $name)) }}
          {{- end }}
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
    {{- if $files }}
    volumes:
      {{- $i := 0 }}
      {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.locals.inject_file_config_prefix }}{{ $i }}"
      {{- $i = add $i 1 }}
      {{- end }}
    {{- end }}
    # With infra.published_port set, a Loopback service entry publishes it on
    # the host's loopback address, 127.0.0.1, naming the container port http,
    # which is infra.port, so compose renders 127.0.0.1:<published_port>:<port>
    # and a client on the machine reaches the server there and on no other
    # host interface. Unset, a ClusterIP service entry keeps the server on the
    # compose network, which is where the agents calling it sit: a consumer
    # wired to it resolves the service name and the port straight from the
    # edge. Nothing is published to the host. Either way the agents on the
    # compose network reach it as before.
    services:
      default:
        {{- with optional .infra "published_port" 0 }}
        type: Loopback
        ports:
          http: {{ . }}
        {{- else }}
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
        {{- end }}
