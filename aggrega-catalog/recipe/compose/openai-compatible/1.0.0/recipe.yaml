apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai-compatible
  version: 1.0.0
  description: >
    An OpenAI-compatible broker gateway as a reference realization for local development: no service runs. The compiler carries the operator-supplied gateway endpoint to consumers through the injection contract. No credential is delivered by this recipe: a consumer that needs one declares it on its own Component's featuresSchema and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/openai-compatible:1.0.0
  # The broker endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
    provider: "{{ .values.provider_name }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
