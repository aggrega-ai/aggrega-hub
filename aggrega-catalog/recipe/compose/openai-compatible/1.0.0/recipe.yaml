apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai-compatible
  version: 1.0.0
  description: >
    An OpenAI-compatible broker gateway as a reference realization for local development: no service runs. compose carries the operator-supplied gateway endpoint and optional api_key credential to consumers through the injection contract.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/openai-compatible:1.0.0
  # The broker endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
    provider: "{{ .values.provider_name }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    {{- if hasKey (default dict .features) "api_key" }}
    credential:
      from: api_key
      env: OPENAI_API_KEY
    {{- end }}
