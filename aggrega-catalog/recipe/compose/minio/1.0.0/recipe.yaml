apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: minio
  version: 1.0.0
  description: >
    MinIO S3-compatible object-storage server for local development via Docker
    Compose. Synthesized-mode Workload — the compose provider translates the
    Workload into a service entry (official minio/minio image, S3 API port, root
    environment, named volume for object data). The official image runs the
    server via `minio server /data`. The root username is a developer value; the
    root password is wired through the optional `root_password` credential slot:
    when attached its value arrives on .context.inject.env and becomes
    MINIO_ROOT_PASSWORD; when none is attached the Recipe falls back to a
    deterministic development default. MinIO's object data is persisted to a
    named volume mounted at /data. provides.host is the bare service name,
    resolved on the compose network. The packaged MinIO server is AGPL-3.0.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: compose
  implements: core/storage/minio:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "s3"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "minio/minio:{{ .infra.engine_version }}"
        # The official minio/minio image entrypoint runs `minio` with the args
        # given here; `server /data` starts the object store over the API port,
        # with data on the mounted volume.
        command:
          - minio
          - server
          - /data
          - --address
          - ":{{ .infra.port }}"
        # MINIO_ROOT_USER is a developer value. MINIO_ROOT_PASSWORD is wired
        # through the optional `root_password` credential slot: when attached its
        # value arrives on the inject pipe (.context.inject.env); with none
        # attached the Recipe falls back to a deterministic development default.
        variables:
          MINIO_ROOT_USER: {{ .values.root_user }}
    {{- if hasKey (default dict .secrets) "root_password" }}
          MINIO_ROOT_PASSWORD: "{{ .context.inject.env.MINIO_ROOT_PASSWORD }}"
    {{- else }}
          MINIO_ROOT_PASSWORD: dev-minio-root-change-me
    {{- end }}
        ports:
          api: {{ .infra.port }}
        volumeMounts:
          - name: data
            path: /data
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          api: {{ .infra.port }}
