apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: minio
  version: 1.0.0
  license: AGPL-3.0
  description: >
    MinIO S3-compatible object-storage server for local development via Docker
    Compose. Synthesized-mode Workload — the compose provider translates the
    Workload into a service entry (official quay.io/minio/minio image, S3 API
    port, root environment, named volume for object data). The official image
    runs the server via `minio server /data`. The root username is a developer
    value; the
    root password is wired through the optional `root_password` credential slot:
    when attached its value arrives on .context.inject.env and becomes
    MINIO_ROOT_PASSWORD; when none is attached the Recipe falls back to a
    deterministic development default. MinIO's object data is persisted to a
    named volume mounted at /data. With `infra.external_base_url` set, it
    reaches the server as the endpoint it advertises (MINIO_SERVER_URL), and the
    build halts when that address carries a path; unset, that variable is not
    emitted. provides.host is the bare service name,
    resolved on the compose network, and provides.endpoint composes it and the
    port under http, the scheme the server is served over: the service mounts
    no certificate, so the server terminates no TLS. provides.metrics_endpoint
    names MinIO's cluster metrics, which a scrape reaches with a bearer token.
    The packaged MinIO server is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/storage/minio:1.0.0
  # This Recipe reads no infra.overrides keys.

  # endpoint is the address a consumer's S3 client is pointed at, so a consumer
  # reads the scheme from the store rather than assuming one. It is http because
  # the service mounts no certificate and the server terminates no TLS. host and
  # endpoint spell the service name out twice on purpose: a provides entry
  # cannot read another provides entry, so the two must be edited together.
  #
  # metrics_endpoint is where MinIO serves its cluster-wide metrics, which it
  # does by default: /minio/v2/metrics/cluster on the S3 API port, reached on the
  # compose network under the service name, spelled out a third time for the
  # same reason. metrics_credential_required is true because MinIO answers that
  # path only to a bearer token unless MINIO_PROMETHEUS_AUTH_TYPE says
  # otherwise, and this Recipe never sets that variable.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "s3"
    metrics_endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/minio/v2/metrics/cluster"
    metrics_credential_required: true

  # The server takes its advertised endpoint as scheme, host and port and drops
  # any path from it, so an address carrying one would be advertised as a
  # different address from the one authored. Halt on one here, where the fix is
  # one value in the Release.
  assertions:
    external_base_url_is_an_origin: >-
      {{- with optional .infra "external_base_url" "" -}}
      {{- $u := urlParse . -}}
      {{- if and $u.host $u.path (ne $u.path "/") -}}
      {{- fail (printf "infra.external_base_url %q carries the path %q, but the object store drops any path from the endpoint it advertises, so it would advertise an address other than this one; set it to the scheme, host and port alone, for example https://s3.example.com" . $u.path) -}}
      {{- end -}}
      {{- end -}}

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "quay.io/minio/minio:{{ .infra.engine_version }}"
        # The official quay.io/minio/minio image entrypoint runs `minio` with the args
        # given here; `server /data` starts the object store over the API port,
        # with data on the mounted volume.
        command:
          - minio
          - server
          - /data
          - --address
          - ":{{ .infra.port }}"
        # MINIO_ROOT_USER is a developer value. MINIO_ROOT_PASSWORD is wired
        # through the optional `root_password` credential slot: when attached its
        # value arrives on the inject pipe (.context.inject.env); with none
        # attached the Recipe falls back to a deterministic development default.
        # With infra.external_base_url set, MINIO_SERVER_URL carries it as the
        # endpoint the server advertises about itself; MINIO_BROWSER_REDIRECT_URL,
        # the address of the console the server also runs, is not set, because
        # this service publishes no console port. Unset, neither is emitted.
        variables:
          MINIO_ROOT_USER: "{{ .values.root_user }}"
    {{- with .infra.external_base_url }}
          MINIO_SERVER_URL: "{{ . }}"
    {{- end }}
    {{- if hasKey (default dict .features) "root_password" }}
          MINIO_ROOT_PASSWORD: "{{ .context.inject.env.MINIO_ROOT_PASSWORD }}"
    {{- else }}
          MINIO_ROOT_PASSWORD: dev-minio-root-change-me
    {{- end }}
        ports:
          api: {{ .infra.port }}
        # The service's healthcheck asks /minio/health/ready — the node is
        # initialized and ready to accept requests — on the API port, with the
        # curl MinIO's image build copies into the image. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            http: /minio/health/ready
            periodSeconds: 10
            timeoutSeconds: 5
        volumeMounts:
          - name: data
            path: /data
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          api: {{ .infra.port }}
