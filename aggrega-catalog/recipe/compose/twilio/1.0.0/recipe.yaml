apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: twilio
  version: 1.0.0
  description: >
    The Twilio messaging and voice carrier as a reference realization for local
    development with Docker Compose: no service is defined for it and nothing is
    provisioned, because the carrier runs outside the composition. What a
    consumer needs is the base address, the account coordinate, the modality and
    the direction, and those reach the consuming service through the injection
    context rather than through a service definition — compose has no
    counterpart to an in-cluster alias, so the address travels to the caller
    instead of being aliased for it.

    This recipe pins no artifact. It names no image — the Release calls a
    service its own operator contracts for directly.

    No credential is delivered here. A credential attached to one of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name it was
    given, because the environment-variable name a credential arrives under
    belongs to the consumer rather than to the carrier.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/messaging/twilio:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    account_sid: "{{ .infra.account_sid }}"
    modality: "{{ .values.modality }}"
    direction: "{{ .values.direction }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
