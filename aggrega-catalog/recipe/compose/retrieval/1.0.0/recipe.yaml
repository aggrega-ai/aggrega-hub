apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: retrieval
  version: 1.0.0
  description: >
    The similarity-retrieval tool on Docker Compose: one service running the
    image the Release names in infra.image, listening on infra.port on the
    compose network, where an agent reaches it at the service's own name.
    Nothing is published to the host. The store the tool searches arrives on
    the tool's datastore socket, and its host, port and protocol reach the
    container as RETRIEVAL_TOOL_STORE_HOST, RETRIEVAL_TOOL_STORE_PORT and
    RETRIEVAL_TOOL_STORE_PROTOCOL beside the developer's match count, the
    names helm/retrieval-knative delivers them under; a connection writing an
    `inject:` block receives instead the names it dictates, as variables or as
    files from compose configs.

    It differs from the Knative realization in one way a reader must know: the
    service is one container that runs while the stack runs. Docker Compose has
    no autoscaler, so the tool does not scale to zero between calls and runs no
    second replica; an infra.min_replicas above one is refused by name, and
    infra.max_replicas, a ceiling one container never passes, is honoured as
    it stands. No control plane is involved, so infra.control_plane_present is
    not read. Reach for this realization under Docker Compose, and for
    helm/retrieval-knative on a Kubernetes cluster running Knative Serving.

    The component's own `inject:` block delivers its entries as a connection's
    are, and one reading a value of the tool alone replaces that value's
    default name. An arg entry, or any other mechanism, is refused by name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-tool/retrieval:1.0.0
  # The service the compose provider synthesizes is named after the component
  # instance, and a consumer on the same compose network resolves that name
  # directly. The service publishes nothing to the host and fronts nothing:
  # the container's own port is the one a caller connects to, so provides.port
  # is infra.port, where helm/retrieval-knative publishes 80, the port the
  # Knative control plane routes from. The keys are the ones that Recipe
  # publishes, so a consumer reads the same contract on either target.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "http"
  locals:
    # The component's name, for the assertions' messages to name it.
    instance_id: '{{ .context.instance_id }}'
  # Every Component value and infra key is honoured or refused below by name:
  #   honoured — values.top_k, values.side_effects, values.timeout_seconds and
  #     values.llm_description_override as the variables described below; the
  #     target_datastore connection as the store variables described below;
  #     infra.image (required); infra.port as the container's port and the
  #     port published in provides; infra.compute.cpu and infra.compute.memory
  #     as the service's limits and reservations; infra.min_replicas at zero or
  #     one, and infra.max_replicas at any value, since the one container the
  #     service runs lies within either bound.
  #   refused — infra.min_replicas above one; a compute quantity left empty;
  #     two target_datastore connections taking the default variables; an
  #     edge's or the component's own arg or custom-mechanism entry; a file
  #     entry at a path that is not absolute or that lies beneath another
  #     entry's path; a dictated variable under a name this Recipe delivers.
  #   not read — infra.control_plane_present, which affirms that Knative
  #     Serving is installed in a cluster: this realization needs no control
  #     plane, so neither value changes what it renders or what it needs. And
  #     infra.overrides: its annotations key carries switches the Knative
  #     control plane reads from a revision, and a compose service has no
  #     revision; this Recipe reads none of its keys.
  #
  # One container. The Knative realization admits a call while it runs no
  # replica and adds replicas as calls arrive, between the two bounds. Docker
  # Compose starts each service once and keeps no replica count for a service
  # written this way, so the service runs one container from docker compose up
  # until the stack stops. A floor of zero or one is met by that container; a
  # floor above one is not, and would be dropped rather than honoured, so the
  # build halts on it, naming the realization that runs that many.
  #
  # No health check is declared. On this target a service's one check runs
  # inside its image, and the image is the Release's: whether it carries a
  # shell and the client an HTTP or TCP check runs cannot be known here, and a
  # check whose tool is missing reports the service unhealthy for ever. Knative
  # probes the container from outside it, which no compose check can do.
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the tool in the Release" -}}
      {{- end -}}
    one_container: >-
      {{- if gt (int (optional .infra "min_replicas" 0)) 1 -}}
      {{- fail (printf "infra.min_replicas of %q is %d, and this realization runs the tool as one Docker Compose service, one container, which keeps no replica count: set infra.min_replicas to 0 or 1 in the Release, or map core/ai-tool/retrieval to helm/retrieval-knative in the Manifest, which keeps that many replicas running on Knative Serving" .locals.instance_id (int .infra.min_replicas)) -}}
      {{- end -}}
    # A key left out of infra.compute takes the component's default, so only a
    # value written empty reaches this check.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets infra.compute.cpu on the tool to an empty value, so the rendered service would carry no CPU limit or reservation: set it, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets infra.compute.memory on the tool to an empty value, so the rendered service would carry no memory limit or reservation: set it, or remove it to take the component's default" -}}
      {{- end -}}
  # The tool's own values and the store's coordinates are both delivered to the
  # container as environment variables. The image is the Release's, so no
  # upstream documentation names a spelling for them; the recipe delivers each
  # under the default name helm/retrieval-knative delivers it under, for the
  # application's own code to read. The optional values are emitted only when
  # they are present, so an unset value renders no variable rather than an
  # empty one. Docker Compose reads $NAME and ${NAME} anywhere in a compose file
  # as its own variables and $$ as a literal $, so each $ in a value the
  # developer wrote is doubled and reaches the container as written.
  #
  # The store's host and port are read off the datastore socket's own edge
  # rather than from a value on the tool, which is what makes the destination
  # the topology's to decide: the edge is found by matching the socket name the
  # component declares, so the alias the developer chose for the connection
  # does not reach this template. Host and port are the pair every store this
  # socket accepts publishes; protocol is published by some and is emitted only
  # where it is. Several edges taking those defaults would each deliver a store
  # under the same variable names, leaving undefined which one the tool
  # searches, so the template halts and names two of the connections rather
  # than emitting an artifact whose behaviour the author did not choose.
  #
  # The image is the tool's own code, so the store variables above are
  # defaults: a connection that writes no inject block receives them, and a
  # connection that writes one receives exactly what it dictates instead — the
  # store's host, port, protocol or any other key the store publishes, under
  # the names that code reads — so the halt on several edges counts only the
  # connections taking the defaults. An edge on a socket the component does not
  # declare has no defaults and receives what it dictates. A dictated env entry
  # becomes a variable of the service under the name it gives, written as the
  # inject pipe carries it, so a Compose variable reference a credential
  # delivers, such as ${STORE_API_KEY}, stays one for Compose to substitute when
  # the stack starts; a dictated file entry becomes a compose config mounted as
  # one file at the absolute path it names, its content written with each $
  # doubled so the file holds the value itself, and a path that is not
  # absolute, or one lying beneath another file's path, is refused. An arg
  # entry is refused, because this recipe renders no command line: a service's
  # command replaces the image's default command, which is the Release's. Any
  # other mechanism is refused too. A dictated variable named like one this
  # recipe delivers itself — a value of the tool's own, or another connection's
  # default — halts the build, naming both, since the compiler cannot see the
  # names a recipe writes.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, and its env and file entries reach the
  # container as a connection's do: each env entry under the name it gives,
  # read off the inject pipe, and each file at the absolute path it names, from
  # a compose config of its own, checked as a connection's file is. The names
  # this recipe gives the tool's own values are defaults: each is rendered, and
  # kept from a connection, only while no entry of that block, in either
  # mechanism, delivers its value. The templates read that at
  # .context.self_inject, which maps each name the developer wrote to
  # values.<key> for an entry whose template reads that one own value. A refusal
  # about one of that block's entries names the block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. The connections
  # and that block only record who dictates each name and each file, and each
  # refusal runs once over both, naming the one that dictated it. It is part of
  # an artifact or a workload template, and no catalog kind holds part of one
  # for several Recipes to share; a change to it is made to all of them.
  #
  # retrieval-files.compose-fragment.yaml holds the compose configs for the
  # file entries the connections and the component's own inject block dictate,
  # one per file and numbered in path order, the names the workload's volumes
  # read, and is emitted only while either one dictates a file, so a build with
  # none renders nothing there. The block reading the connections' inject
  # directives is the one every compose Workload realization of a tool in this
  # catalog declares, differing only in the names each delivers itself and the
  # refusals its own service calls for; a change to it is made to all.
  artifacts:
    retrieval-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ printf "%s-file-%d" $.context.instance_id $i | toJson }}:
          content: {{ toJson (replace "$" "$$" (toString $v)) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
  workload: |
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $named := dict -}}
    {{- $ownEnv := dict -}}
    {{- $ownFile := dict -}}
    {{- range $mechanism, $names := default dict .context.self_inject -}}
    {{- range $name, $key := $names -}}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end -}}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end -}}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $dictating := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $wired := list -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "target_datastore") (not (hasKey $dictating $alias)) -}}
    {{- $wired = append $wired $alias -}}
    {{- end -}}
    {{- end -}}
    {{- if gt (len $wired) 1 -}}
    {{- fail (printf "the target_datastore connections %s and %s of %q write no inject block, so each would hand the tool its store under the same variable names, leaving undefined which store the tool searches: write an inject block on all but one of them, dictating the names the tool's code reads for each store, or leave one edge on target_datastore and declare a second retrieval component for a second store" (index $wired 0) (index $wired 1) .context.instance_id) -}}
    {{- end -}}
    {{- $own := dict -}}
    {{- $taken := dict -}}
    {{- if not (hasKey $named "values.top_k") }}{{ $_ := set $own "RETRIEVAL_TOOL_TOP_K" (toString .values.top_k) }}{{ $_ := set $taken "RETRIEVAL_TOOL_TOP_K" "the component's own value top_k" }}{{ end -}}
    {{- if not (hasKey $named "values.side_effects") }}{{ $_ := set $own "RETRIEVAL_TOOL_SIDE_EFFECTS" (toString .values.side_effects) }}{{ $_ := set $taken "RETRIEVAL_TOOL_SIDE_EFFECTS" "the component's own value side_effects" }}{{ end -}}
    {{- if not (hasKey $named "values.timeout_seconds") }}{{ $_ := set $own "RETRIEVAL_TOOL_TIMEOUT_SECONDS" (toString .values.timeout_seconds) }}{{ $_ := set $taken "RETRIEVAL_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" }}{{ end -}}
    {{- with .values.llm_description_override -}}
    {{- if not (hasKey $named "values.llm_description_override") }}{{ $_ := set $own "RETRIEVAL_TOOL_DESCRIPTION" (toString .) }}{{ $_ := set $taken "RETRIEVAL_TOOL_DESCRIPTION" "the component's own value llm_description_override" }}{{ end -}}
    {{- end -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "target_datastore") (not (hasKey $dictating $alias)) -}}
    {{- $by := printf "the target_datastore connection %s, which writes no inject block" $alias -}}
    {{- $_ := set $taken "RETRIEVAL_TOOL_STORE_HOST" $by -}}
    {{- $_ := set $taken "RETRIEVAL_TOOL_STORE_PORT" $by -}}
    {{- if optional (default dict $edge.provides) "protocol" "" -}}
    {{- $_ := set $taken "RETRIEVAL_TOOL_STORE_PROTOCOL" $by -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- $dictated := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "file" -}}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $by := $dictated -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $by := $files -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        ports:
          http: {{ .infra.port }}
        {{- /* The map is written only while a variable is: an inject block
               delivering every own value as a file, beside a store connection
               dictating files alone, leaves none, and an empty key would be
               read as no map at all. */}}
        {{- if or $taken $dictated }}
        variables:
          {{- range $name, $value := $own }}
          {{ $name }}: {{ replace "$" "$$" $value | toJson }}
          {{- end }}
          {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- range $alias, $edge := .context.uses }}
          {{- if hasKey $dictating $alias }}
          {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- else if eq $edge.socket "target_datastore" }}
          RETRIEVAL_TOOL_STORE_HOST: {{ toJson (toString $edge.provides.host) }}
          RETRIEVAL_TOOL_STORE_PORT: {{ toJson (toString $edge.provides.port) }}
          {{- with (optional (default dict $edge.provides) "protocol" "") }}
          RETRIEVAL_TOOL_STORE_PROTOCOL: {{ toJson (toString .) }}
          {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
    {{- if $files }}
    volumes:
      {{- $i := 0 }}
      {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
      {{- $i = add $i 1 }}
      {{- end }}
    {{- end }}
    # A ClusterIP service entry keeps the tool on the compose network, which is
    # where the agents calling it sit: a consumer wired to it resolves the
    # service name and the port straight from the edge. Nothing is published to
    # the host.
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
