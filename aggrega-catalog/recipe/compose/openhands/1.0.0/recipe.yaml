apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openhands
  version: 1.0.0
  description: >
    An OpenHands agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; a model API key
    attached on the `model` connection arrives on the inject pipe as
    OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/openhands:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name to find it, then reads the model recipe's published
        # endpoint and model name. The client SDK reads the base URL and the API
        # key from the environment. The model name is delivered as OPENAI_MODEL
        # for the application's own code to read — a stable name this recipe
        # defines rather than a claim about a framework read. The iteration
        # ceiling is passed by the application when it opens its session, so the
        # recipe emits no variable for it.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, arrives on the inject pipe and renders as OPENAI_API_KEY
        # (compose has no Secret-resource / secretKeyRef primitive). A connection
        # carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ $.context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
    {{- end }}
