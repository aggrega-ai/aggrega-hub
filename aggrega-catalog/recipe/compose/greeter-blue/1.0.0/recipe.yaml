apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: greeter-blue
  version: 1.0.0
  description: >
    The DEFAULT physical implementation of example/compute/greeter — the "blue" build.
    Every greeter instance resolves here through the Manifest type tier unless
    a per-instance name override redirects it elsewhere.
spec:
  provider: compose
  implements: example/compute/greeter
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "greeter:blue"
        variables:
          VARIANT: "blue"
          MESSAGE: "{{ .values.message }}"
        ports:
          http: {{ optional .infra `port` 8080 }}
    services:
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}
