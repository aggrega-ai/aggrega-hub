apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: azure-openai
  version: 1.0.0
  description: >
    Azure OpenAI's managed chat API as a reference realization: no compute runs in-cluster. the compose engine carries the operator-supplied endpoint to consumers through the injection contract; no service runs. No credential is delivered by this recipe: a consumer that needs one declares it on its own Component's featuresSchema and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/azure-openai:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
