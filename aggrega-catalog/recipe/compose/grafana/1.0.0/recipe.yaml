apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: grafana
  version: 1.0.0
  license: AGPL-3.0
  description: >
    Grafana dashboards server for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry (official grafana/grafana image, web port, admin
    environment, named volume for state). The admin username is a developer
    value; the admin password is wired through the optional `admin_password`
    credential slot: when attached its value arrives on .context.inject.env and
    becomes GF_SECURITY_ADMIN_PASSWORD; when none is attached the Recipe falls
    back to a deterministic development default. Grafana's local state is
    persisted to a named volume. With `infra.external_base_url` set, it reaches
    the server as its root URL (GF_SERVER_ROOT_URL); unset, that variable is not
    emitted and the server keeps its default. The server listens on
    `infra.port`, which also carries its own metrics in the Prometheus format at
    /metrics, published as provides.metrics_endpoint. provides.host is the bare
    service name, resolved on the compose network. The packaged Grafana server
    is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/observability/grafana:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # metrics_endpoint is the address Grafana serves its own metrics at, in the
  # Prometheus format: /metrics on the web port, on by default and asking no
  # credential. It is spelled out in full on purpose: a provides entry cannot
  # read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/metrics"

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "grafana/grafana:{{ .infra.engine_version }}"
        # GF_SECURITY_ADMIN_USER is a developer value. GF_SECURITY_ADMIN_PASSWORD
        # is wired through the optional `admin_password` credential slot: when
        # attached its value arrives on the inject pipe (.context.inject.env);
        # with none attached the Recipe falls back to a deterministic development
        # default. Grafana keeps its state under /var/lib/grafana on the data
        # volume. With infra.external_base_url set, GF_SERVER_ROOT_URL carries
        # it as the server's root URL, the base of every link and redirect it
        # writes; the server keeps serving at its own root, so the health check
        # below is unaffected by a path in that address. Unset, it is not
        # emitted.
        # Grafana listens on 3000 unless told otherwise, while the container
        # port, the published port and provides.port all follow infra.port; so
        # with infra.port anything but 3000, GF_SERVER_HTTP_PORT moves the
        # server's listener there too. At 3000 it is not emitted and the server
        # keeps its own default.
        variables:
          GF_SECURITY_ADMIN_USER: "{{ .values.admin_user }}"
    {{- if ne (int .infra.port) 3000 }}
          GF_SERVER_HTTP_PORT: "{{ .infra.port }}"
    {{- end }}
    {{- with .infra.external_base_url }}
          GF_SERVER_ROOT_URL: "{{ . }}"
    {{- end }}
    {{- if hasKey (default dict .features) "admin_password" }}
          GF_SECURITY_ADMIN_PASSWORD: "{{ index .context.inject.env "GRAFANA_ADMIN_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else }}
          GF_SECURITY_ADMIN_PASSWORD: dev-grafana-admin-change-me
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # Grafana's /api/health answers once the web server runs and can reach
        # its database. The healthcheck asks it with the curl the image carries.
        # A service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            http: /api/health
            periodSeconds: 10
            timeoutSeconds: 5
        volumeMounts:
          - name: data
            path: /var/lib/grafana
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "10Gi" }}{{ else }}10Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
