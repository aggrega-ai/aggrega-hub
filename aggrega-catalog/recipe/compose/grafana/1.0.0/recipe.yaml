apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: grafana
  version: 1.0.0
  license: AGPL-3.0
  description: >
    Grafana dashboards server for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry (official grafana/grafana image, web port, admin
    environment, named volume for state). The admin username is a developer
    value; the admin password is wired through the optional `admin_password`
    credential slot: when attached its value arrives on .context.inject.env and
    becomes GF_SECURITY_ADMIN_PASSWORD; when none is attached the Recipe falls
    back to a deterministic development default. Grafana's local state is
    persisted to a named volume. provides.host is the bare service name, resolved
    on the compose network. The packaged Grafana server is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/observability/grafana:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "grafana/grafana:{{ .infra.engine_version }}"
        # GF_SECURITY_ADMIN_USER is a developer value. GF_SECURITY_ADMIN_PASSWORD
        # is wired through the optional `admin_password` credential slot: when
        # attached its value arrives on the inject pipe (.context.inject.env);
        # with none attached the Recipe falls back to a deterministic development
        # default. Grafana keeps its state under /var/lib/grafana on the data
        # volume.
        variables:
          GF_SECURITY_ADMIN_USER: "{{ .values.admin_user }}"
    {{- if hasKey (default dict .features) "admin_password" }}
          GF_SECURITY_ADMIN_PASSWORD: "{{ .context.inject.env.GRAFANA_ADMIN_PASSWORD }}"
    {{- else }}
          GF_SECURITY_ADMIN_PASSWORD: dev-grafana-admin-change-me
    {{- end }}
        ports:
          http: {{ .infra.port }}
        volumeMounts:
          - name: data
            path: /var/lib/grafana
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "10Gi" }}{{ else }}10Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
