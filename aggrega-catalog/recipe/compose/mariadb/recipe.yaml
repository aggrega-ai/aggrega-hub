apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mariadb
  version: 1.0.0
  description: >
    MariaDB for local development via Docker Compose.
    Passwords are resolved from .env file at runtime.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  provider: compose
  implements: core/database/mariadb:1.0.0

  locals:
    service_name: "{{ .context.instance_id }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .values.port }}"
    protocol: "mariadb"

  valuesMapping: |
    services:
      {{ .locals.service_name }}:
        image: "{{ if .infra.overrides }}{{ if .infra.overrides.image }}{{ .infra.overrides.image }}{{ else }}mariadb:{{ .infra.engine_version }}{{ end }}{{ else }}mariadb:{{ .infra.engine_version }}{{ end }}"
        ports:
          - "{{ .values.port }}:3306"
        environment:
          MARIADB_DATABASE: "{{ .values.database }}"
          MARIADB_CHARACTER_SET_SERVER: "{{ .values.charset }}"
          MARIADB_COLLATION_SERVER: "{{ .values.collation }}"
          {{- if .values.user }}
          MARIADB_USER: "{{ .values.user }}"
          {{- end }}
          ## Secrets are injected by the compose-dotenv-secret
          ## FeatureRecipe via injectMapping into .context.inject.env.
          ## The base Recipe renders them as ${VAR} references.
          {{- range $key, $value := .context.inject.env }}
          {{ $key }}: "${  {{ $key }} }"
          {{- end }}
        env_file:
          - .env
        volumes:
          - {{ .locals.service_name }}-data:/var/lib/mysql
          {{- if .values.init_scripts }}
          {{- range $name, $_ := .values.init_scripts }}
          - ./initdb/{{ $name }}:/docker-entrypoint-initdb.d/{{ $name }}:ro
          {{- end }}
          {{- end }}
        healthcheck:
          test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
          interval: 10s
          timeout: 5s
          retries: 3

    volumes:
      {{ .locals.service_name }}-data:
