apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mariadb
  version: 1.0.0
  description: >
    MariaDB for local development via Docker Compose. Synthesized-mode
    Workload — image, environment, ports, persistent volume, healthcheck
    are translated from the Workload kind by the compose provider.
    Secrets injected via the dotenv-secret FeatureRecipe surface as env
    vars in the rendered service. Bootstrap scripts (init_scripts) and a
    custom server configuration block (custom_config) are both realized:
    each script mounts under /docker-entrypoint-initdb.d and runs once when
    the database first initializes, and the configuration block mounts as a
    .cnf the server reads through its defaults-extra-file argument.
    It runs one server, so infra.ha.enabled and a non-zero infra.ha.read_replicas
    halt the build naming the key; helm/mariadb-cluster honors both.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/datastore/mariadb:1.0.0

  # This Recipe reads from infra.overrides:
  #   image - string (the container image reference, replacing the default the
  #           Recipe composes from infra.engine_version)
  locals:
    service_name: "{{ .context.instance_id }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "mariadb"

  # This Recipe runs one MariaDB server on the local Docker host, so a highly
  # available primary and read replicas are refused rather than dropped: the
  # service fails over to nothing and starts no replica.
  # helm/mariadb-cluster provides both, through the mariadb-operator controller's
  # replication.
  assertions:
    no_high_availability: >-
      {{- if .infra.ha.enabled -}}
      {{- fail "infra.ha.enabled is true, and this Recipe runs one MariaDB server with no replica to fail over to: set infra.ha.enabled to false, or map this component to helm/mariadb-cluster, which fails over automatically to a read replica the mariadb-operator controller runs beside the primary" -}}
      {{- end -}}
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions one instance: set infra.ha.read_replicas to 0, or map this component to helm/mariadb-cluster, which provisions read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. This realization takes the root
    # password from the credential attached to the root_password slot and the
    # application user's from user_password, each delivered as a value on the
    # inject pipe, and Docker Compose has no Kubernetes Secret to read, so
    # supplied, or any Secret name, would reach no byte of the output while the
    # build reads as if it had chosen who owns the passwords. Refused here by
    # name: infra.credentials other than generated, and any
    # infra.credentials_secret. Not read: both, while they hold the Component's
    # defaults, generated and empty.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and this realization takes the root password from the credential attached to the root_password slot and the application user's from user_password: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database credentials from, and Docker Compose has no Kubernetes Secret to read, so this realization takes the root password from the credential attached to the root_password slot and the application user's from user_password: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}

  # The developer's bootstrap scripts and custom server configuration render as
  # compose configs the server mounts as files. Each half is presence-guarded
  # independently: an Aggregate that leaves a value unset emits no config, no
  # mount and no server argument for it, so it renders as though the key did not
  # exist.
  #
  # init_scripts becomes one config per key, each mounted at its own filename
  # under /docker-entrypoint-initdb.d. The image runs the files it finds there
  # once, in filename order, and only when the data directory is empty — a
  # database that already holds data is left untouched. custom_config becomes a
  # custom.cnf the server reads through --defaults-extra-file, in addition to
  # the image's own configuration, so settings the block omits keep the values
  # the image ships. It mounts in a directory of its own, which the image does
  # not populate, so it never masks the image's configuration files.
  #
  # Each config's name is spelled here and again on the volume that mounts it
  # below. The artifact and the workload are separate template strings with no
  # binding either could dereference, so the repetition is forced rather than
  # chosen — the two must be edited together.
  artifacts:
    mariadb-initdb.compose-fragment.yaml: |
      {{- if .values.init_scripts }}
      configs:
      {{- range $name, $content := .values.init_scripts }}
        {{ $.context.instance_id }}-initdb-{{ $name }}:
          content: |
      {{ $content | indent 6 }}
      {{- end }}
      {{- end }}
    mariadb-config.compose-fragment.yaml: |
      {{- if .values.custom_config }}
      configs:
        {{ .context.instance_id }}-config:
          content: |
      {{ .values.custom_config | indent 6 }}
      {{- end }}

  workload: |
    {{- $configFile := "/etc/aggrega/config/custom.cnf" -}}
    {{- $initDir := "/docker-entrypoint-initdb.d" -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "{{ if .infra.overrides }}{{ if .infra.overrides.image }}{{ .infra.overrides.image }}{{ else }}mariadb:{{ .infra.engine_version }}{{ end }}{{ else }}mariadb:{{ .infra.engine_version }}{{ end }}"
    {{- if .values.custom_config }}
        # The server arguments are supplied as args rather than as a command, so
        # the image's own startup script still runs: it is what creates the
        # database on an empty data directory, reads the MARIADB_* variables
        # below, and runs the bootstrap files. It prepends the server binary to
        # an argument list beginning with a dash and passes the list on, which is
        # where --defaults-extra-file is read. That option has to be the server's
        # first argument, so it is the first entry here.
        #
        # $configFile is the single authored home for that path: the
        # --defaults-extra-file argument and the mount that puts the file there
        # both read the binding, so a future move cannot relocate one and leave
        # the other pointing at the old path. It names a file rather than a
        # directory.
        args:
          - "--defaults-extra-file={{ $configFile }}"
    {{- end }}
        # Both passwords are read off the inject pipe. root_password is a
        # Black-Box slot (featuresSchema inject: []), so the credential attached
        # to it delivers its value under MARIADB_ROOT_PASSWORD; user_password is
        # transparent, and its attachment delivers it as the env variable
        # MARIADB_PASSWORD. Each is read through index whenever its slot is
        # attached, so a credential delivering under another name, as a file or
        # not at all halts the build naming the variable, rather than starting
        # the server without that password. With a slot unattached its variable
        # renders only when a value arrived under that name.
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
          MARIADB_CHARACTER_SET_SERVER: "{{ .values.charset }}"
          MARIADB_COLLATION_SERVER: "{{ .values.collation }}"
          {{- if .values.user }}
          MARIADB_USER: "{{ .values.user }}"
          {{- end }}
          {{- $env := default dict (optional (default dict .context.inject) "env" dict) }}
          {{- if or (hasKey (default dict .features) "root_password") (optional $env "MARIADB_ROOT_PASSWORD" "") }}
          MARIADB_ROOT_PASSWORD: "{{ index $env "MARIADB_ROOT_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
          {{- if or (hasKey (default dict .features) "user_password") (optional $env "MARIADB_PASSWORD" "") }}
          MARIADB_PASSWORD: "{{ index $env "MARIADB_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          mysql: 3306
        volumeMounts:
          - name: data
            path: /var/lib/mysql
          {{- range $name, $content := .values.init_scripts }}
          - name: "initdb-{{ $name }}"
            path: "{{ $initDir }}/{{ $name }}"
          {{- end }}
          {{- if .values.custom_config }}
          - name: dbconf
            path: "{{ $configFile }}"
          {{- end }}
        # The service's healthcheck is the one MariaDB documents for this image:
        # its own healthcheck.sh, testing that the server accepts a TCP
        # connection and that InnoDB has finished initializing, with the timing
        # of the documentation's own Compose example. The image creates the
        # account the script connects as when it first initializes the database,
        # and the temporary server it runs meanwhile takes no network
        # connections, so a service that depends on this one is started only once
        # the real server is up. The image ships the mariadb-admin client and no
        # mysqladmin, nc or curl, so the check is the image's own script; an image
        # supplied through infra.overrides.image has to ship the same script. A
        # service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - healthcheck.sh
              - "--connect"
              - "--innodb_initialized"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "10Gi" }}{{ else }}10Gi{{ end }}"
      {{- range $name, $content := .values.init_scripts }}
      "initdb-{{ $name }}":
        configmap:
          source: "{{ $.context.instance_id }}-initdb-{{ $name }}"
      {{- end }}
      {{- if .values.custom_config }}
      dbconf:
        configmap:
          source: "{{ .context.instance_id }}-config"
      {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          mysql: 3306
