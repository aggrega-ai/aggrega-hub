apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: chroma
  version: 1.0.0
  license: Apache-2.0
  description: >
    Chroma for local development via Docker Compose. Synthesized-mode Workload:
    the compose provider translates the Workload kind into a service entry
    running the official chromadb/chroma image, with a named volume at the
    server's data path. provides.host is the bare service name, resolved on the
    compose network.

    The server checks no credential, so the Recipe publishes no port on the
    host: the service is reachable from the other services of the stack and
    from nothing outside it.

    Reach for this realization for local development; on Kubernetes the
    component is realized by the Helm Recipe of the same name, which
    synthesizes a StatefulSet and needs nothing installed in the target cluster.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/chroma:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # protocol is "http" — the port published as provides.port serves Chroma's HTTP
  # API, and a consumer composing a URL needs the scheme rather than the product
  # name.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "chromadb/chroma:{{ .infra.engine_version }}"
        # The image starts the server on the configuration file it ships, which
        # sets the data path to /data, and the server lays every setting named by
        # a CHROMA_-prefixed environment variable over that file. CHROMA_PORT
        # carries infra.port so the server and the service follow the one value.
        # The two developer knobs are emitted only when the Aggregate set them,
        # so an Aggregate that sets neither keeps the server's own defaults.
        # Compute sizing is honored here as well as on the Kubernetes target, so
        # the value an operator sets is not silently discarded on the local one.
        variables:
          CHROMA_PORT: "{{ .infra.port }}"
    {{- if .values.allow_reset }}
          CHROMA_ALLOW_RESET: "true"
    {{- end }}
    {{- with .values.max_payload_size_bytes }}
          CHROMA_MAX_PAYLOAD_SIZE_BYTES: "{{ . }}"
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The image installs neither curl nor nc, so the service's healthcheck
        # opens a TCP connection to the HTTP port with the bash of the image's
        # Debian base, through its /dev/tcp redirection, which succeeds once the
        # server is listening. A service keeps one healthcheck, so one probe is
        # declared.
        health:
          ready:
            exec:
              - bash
              - "-c"
              - "exec 3<>/dev/tcp/127.0.0.1/{{ .infra.port }}"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /data
    # The server owns a durable volume on this target too, so the collections a
    # developer builds survive the container being recreated, as they do on the
    # Kubernetes target. The declared size is read from the operator's own
    # sizing knob so one Release configures either target.
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    # ClusterIP, which on this target publishes nothing on the host: the server
    # checks no credential, so it is kept to the stack's own network.
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
