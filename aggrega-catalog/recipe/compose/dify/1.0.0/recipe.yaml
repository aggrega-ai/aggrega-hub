apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dify
  version: 1.0.0
  # metadata.license is deliberately absent. The Dify platform this Recipe
  # realizes is published under a modified Apache License 2.0 carrying
  # additional conditions, and no single SPDX identifier names those terms; the
  # licensing class sits on the Component's upstream-licensing label. The
  # SPDX header at the top of this file states the terms of the file itself.
  description: >
    The Dify API and console server on Docker Compose via the compose
    provider's Workload synthesis: one service on the API port, infra.port,
    reached on the compose network under its service name and published on
    the host's loopback address, 127.0.0.1, on that same port, so a client on
    the machine running the stack calls it at 127.0.0.1 and nothing on the
    host's other interfaces reaches it. The port is published on every build,
    at the Component's default unless the Release sets infra.port: a Release
    sets a different infra.port where that port is already taken on the
    machine, or where two such components share it. It reads the same values,
    connections and credentials as helm/dify and writes the same settings,
    and it applies outstanding schema migrations at start.

    Unlike on helm, nothing restarts a service that exits, so a step first
    waits until the backend accepts TCP connections. Each credential is the
    value its attachment delivers, written into the file as delivered, so an
    origin written as a Compose variable reference keeps it out of the file;
    unattached, the pinned development literals are written.

    An app_definition, when set, is imported by a one-shot service running the
    server's image with the owner password as delivered. It halts the build on
    a credential publishing a secret resource's name, on one that delivers no
    value, and on a cache connection holding a server_ca.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/dify:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare service name, the component's instance name, which
  # every service on the compose network resolves.
  #
  # Where the service is reached. infra.port is the port the server listens on,
  # and it is published on the host's loopback address, 127.0.0.1, as the same
  # number, so a client on the machine running the stack reaches it at
  # 127.0.0.1 and nothing on the host's other interfaces does. The Component
  # gives infra.port a default, so the port is published on every build: a
  # Release sets a different infra.port where that port is already taken on the
  # machine, or where two such components share it. A peer on the compose
  # network reaches it at the service's own name on the same port, which
  # provides.port publishes.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
  # Importing values.app_definition needs an account to import it as, exactly as
  # on helm/dify: the step performs Dify's first-time setup as
  # infra.owner_email with the password attached to owner_password, then signs
  # in as that account. Neither has a default, so a definition with either one
  # missing halts here, where the fix is one line of authored YAML. With no
  # definition nothing is read and nothing halts. DELIBERATE NEAR-DUPLICATE of
  # the same assertion in helm/dify: an assertion belongs to one Recipe, and no
  # catalog kind holds one for several Recipes to share; a change to it is made
  # to both.
  assertions:
    app_definition_needs_an_owner: >-
      {{- if optional .values "app_definition" "" -}}
      {{- if not (optional .infra "owner_email" "") -}}
      {{- fail (printf "the Dify server %q is given values.app_definition to import but no infra.owner_email: set infra.owner_email in the Release to the email address of the account that owns the installation, or remove app_definition" .metadata.instance_id) -}}
      {{- end -}}
      {{- if not (hasKey (default dict .features) "owner_password") -}}
      {{- fail (printf "the Dify server %q is given values.app_definition to import but nothing fills its owner_password slot: attach a secret credential to owner_password holding the password of the account infra.owner_email names, or remove app_definition" .metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
  # When values.app_definition is set, the fragment below writes two compose
  # configs — the definition, and the script that imports it — and a service
  # that runs the script once. With no definition it renders empty and emits no
  # file, so the output is what it is without the value.
  #
  # The step is the one helm/dify runs as a Job, adapted to this target. It
  # waits for GET /console/api/setup to answer; if setup has not run, it posts
  # the owner account to /console/api/setup; it signs in at /console/api/login,
  # which takes the password Base64-encoded; it lists the applications named
  # like the definition's app.name and stops, leaving it as it is, when one
  # carries exactly that name; otherwise it posts the definition to
  # /console/api/apps/imports and, when Dify holds the import for confirmation,
  # confirms it. Every call after signing in carries the session cookies in an
  # explicit Cookie header with the CSRF token repeated in X-CSRF-Token, since
  # the server marks those cookies secure when its external address is https. A
  # refused call prints its step and HTTP status beside the message Dify's reply
  # carries; nothing the step prints repeats the password.
  #
  # A run that ends is written whole as a service with restart "no", as the
  # compose target's workload synthesis has no form for one: Docker Compose does
  # not start it again when it exits, so it runs once at each docker compose up,
  # and its exit status is what a reader inspects. A failed run is run again by
  # the next docker compose up, and a run finding the application present leaves
  # it as it is. It runs the server's own image, whose Python environment carries
  # the HTTP and YAML libraries the script uses, so the step adds no image; the
  # image's entrypoint starts the server, so the service names the script as its
  # entrypoint. It waits for the server itself, about ten minutes at most, so it
  # carries no ordering of its own. The address is the server's service name on
  # infra.port.
  #
  # Docker Compose has no secret reference, so the owner password reaches the
  # step as the value its attachment delivers on this component's inject pipe,
  # under the key the attachment names in values.key, written into the file as
  # delivered: an origin written as a Compose variable reference, such as
  # ${DIFY_OWNER_PASSWORD}, keeps the password out of the file, and Docker
  # Compose substitutes it when the stack starts. An attachment whose
  # realization publishes the name of a secret resource halts the build, since
  # nothing here could read the resource, and so does one under which no value
  # reaches the pipe. The owner's email and both configs are written with every
  # $ doubled, which Docker Compose reads as one literal $, so each reaches the
  # container as authored.
  #
  # The script is a DELIBERATE NEAR-DUPLICATE of the one helm/dify 1.0.0
  # carries in its ConfigMap, kept beside it because that version is
  # published. Its home, when helm/dify takes a new version, is one
  # ArtifactLibrary bundle wrapping the text as a ConfigMap or as compose
  # configs by a local the importer sets, as LiteLLMGuard does; until then a
  # change to the script is made to both. The step and its refusals below are
  # this Recipe's own.
  artifacts:
    dify-app-import.compose-fragment.yaml: |
      {{- if .values.app_definition }}
      {{- $env := optional (default dict .context.inject) "env" dict }}
      {{- $attachment := optional (default dict .features) "owner_password" dict }}
      {{- with optional (optional $attachment "provides" dict) "name" "" }}
      {{- fail (printf "the owner_password slot of the Dify server %q carries an attachment whose realization publishes %q, the name of a secret resource the password is to be read from, and Docker Compose has no secret reference to read it through: map core/referenced-secret to compose/dotenv-referenced-secret in the Manifest, writing its origin as the password or as a Compose variable reference such as ${DIFY_OWNER_PASSWORD}" $.context.instance_id .) }}
      {{- end }}
      {{- $key := default "OWNER_PASSWORD" (toString (optional (optional $attachment "values" dict) "key" "")) }}
      {{- if not (hasKey $env $key) }}
      {{- fail (printf "the owner_password slot of the Dify server %q is attached, but no value reaches this Recipe under %s, the key it is read under, so the step importing values.app_definition would sign in with no password: map core/referenced-secret to compose/dotenv-referenced-secret, or core/secret-value to compose/dotenv-secret, in the Manifest" $.context.instance_id $key) }}
      {{- end }}
      configs:
        {{ printf "%s-app-definition" .context.instance_id | toJson }}:
          content: {{ replace "$" "$$" (toString .values.app_definition) | toJson }}
        {{ printf "%s-app-import" .context.instance_id | toJson }}:
          content: |
            import base64
            import os
            import sys
            import time

            import httpx
            import yaml

            API = os.environ["DIFY_API_URL"].rstrip("/") + "/console/api"
            EMAIL = os.environ["OWNER_EMAIL"]
            PASSWORD = os.environ["OWNER_PASSWORD"]
            ENCODED = base64.b64encode(PASSWORD.encode("utf-8")).decode("ascii")
            FINAL = 2


            def fail(message, code=1):
                print(message, file=sys.stderr)
                sys.exit(code)


            def read_json(response):
                try:
                    return response.json()
                except ValueError:
                    return {}


            def said(text):
                if not isinstance(text, str) or "input_value" in text:
                    return ""
                if PASSWORD and (PASSWORD in text or ENCODED in text):
                    return ""
                return text.strip()


            def refused(step, response):
                body = read_json(response)
                error = body.get("error") if isinstance(body, dict) else None
                fields = error if isinstance(error, dict) else body if isinstance(body, dict) else {}
                status = response.status_code
                reasons = []
                for key in ("message",) if status == 422 else ("message", "details"):
                    text = said(fields.get(key))
                    if text and text not in reasons:
                        reasons.append(text)
                message = f"{step} was refused with HTTP {status}"
                if reasons:
                    message += ": " + "; ".join(reasons)
                fail(message, FINAL if 400 <= status < 500 and status not in (408, 429) else 1)


            def setup_step(client):
                deadline = time.monotonic() + 600
                while time.monotonic() < deadline:
                    try:
                        response = client.get(API + "/setup")
                        if response.status_code == 200:
                            return read_json(response).get("step")
                    except httpx.HTTPError:
                        pass
                    time.sleep(5)
                fail("the Dify API server did not answer within ten minutes")


            def main():
                with open("/seed/app.yml", encoding="utf-8") as handle:
                    definition = handle.read()
                app = (yaml.safe_load(definition) or {}).get("app") or {}
                name = app.get("name") or ""
                if not name:
                    fail("the definition names no application under app.name", FINAL)
                with httpx.Client(timeout=60) as client:
                    if setup_step(client) != "finished":
                        owner = {"email": EMAIL, "name": EMAIL.split("@")[0][:30], "password": PASSWORD}
                        response = client.post(API + "/setup", json=owner)
                        if response.status_code != 201:
                            refused("first-time setup", response)
                        print(f"first-time setup done: owner account {EMAIL}")
                    response = client.post(API + "/login", json={"email": EMAIL, "password": ENCODED})
                    if response.status_code != 200 or read_json(response).get("result") != "success":
                        refused(f"signing in as {EMAIL}", response)
                    session = {cookie.name: cookie.value for cookie in response.cookies.jar}
                    client.cookies.clear()
                    csrf = next((value for key, value in session.items() if key.endswith("csrf_token")), "")
                    headers = {
                        "Cookie": "; ".join(f"{key}={value}" for key, value in session.items()),
                        "X-CSRF-Token": csrf,
                    }
                    page = 1
                    while True:
                        query = {"page": page, "limit": 100, "name": name}
                        response = client.get(API + "/apps", params=query, headers=headers)
                        if response.status_code != 200:
                            refused("listing the applications", response)
                        listing = read_json(response)
                        if any(item.get("name") == name for item in listing.get("data", [])):
                            print(f"an application named {name!r} is already present; leaving it as it is")
                            return
                        if not listing.get("has_more"):
                            break
                        page += 1
                    body = {"mode": "yaml-content", "yaml_content": definition}
                    response = client.post(API + "/apps/imports", json=body, headers=headers)
                    result = read_json(response)
                    if result.get("status") == "pending":
                        response = client.post(API + "/apps/imports/" + result.get("id", "") + "/confirm", headers=headers)
                        result = read_json(response)
                    if result.get("status") not in ("completed", "completed-with-warnings"):
                        if result.get("status") != "failed":
                            refused(f"importing {name!r}", response)
                        reason = said(result.get("error")) or f"HTTP {response.status_code}"
                        fail(f"importing {name!r} failed: {reason}", FINAL)
                    print(f"imported {name!r} as application {result.get('app_id')}")


            main()
      services:
        {{ printf "%s-app-import" .context.instance_id | toJson }}:
          image: {{ printf "langgenius/dify-api:%s" .infra.engine_version | toJson }}
          entrypoint: ["python", "/seed/import.py"]
          environment:
            DIFY_API_URL: {{ printf "http://%s:%v" .context.instance_id .infra.port | toJson }}
            OWNER_EMAIL: {{ replace "$" "$$" (toString .infra.owner_email) | toJson }}
            OWNER_PASSWORD: {{ toString (index $env $key) | toJson }}
          configs:
            - source: {{ printf "%s-app-definition" .context.instance_id | toJson }}
              target: /seed/app.yml
            - source: {{ printf "%s-app-import" .context.instance_id | toJson }}
              target: /seed/import.py
          restart: "no"
      {{- end }}
  # The backend identity resolved from the backend uses-edge (host, port,
  # username, database) and the cache, vector-store, sandbox, plugin-runtime and
  # proxy identities resolved from their edges arrive on .context.inject.env and
  # compose the server's connection settings and the URLs of its siblings on the
  # compose network, translated as helm/dify translates them.
  #
  # Credentials. Docker Compose has no secret reference, and the compose
  # provider writes an attachment read as an empty variable, so each credential
  # the server reads is the value its attachment delivers on this component's
  # inject pipe, under the key the attachment names in values.key —
  # compose/dotenv-referenced-secret for a core/referenced-secret,
  # compose/dotenv-secret for a core/secret-value — written as the variable
  # helm/dify delivers it on: DB_PASSWORD from the backend connection,
  # CODE_EXECUTION_API_KEY from the sandbox connection, PLUGIN_DAEMON_KEY from
  # the plugin_daemon connection, SECRET_KEY from the secret_key slot and
  # INNER_API_KEY_FOR_PLUGIN from the inner_api_key slot. Each is written as
  # delivered, so an origin written as a Compose variable reference keeps it out
  # of the file. An attachment naming no key is read under the variable's own
  # name. Two refusals keep an attachment from being dropped: one whose
  # realization publishes a non-empty name, the locator of a secret resource,
  # halts the build naming it, since this target cannot read a resource by name
  # — core/referenced-secret's Kubernetes realizations publish one, and a
  # Manifest may map either on this target; and one under which no value reaches
  # the pipe halts it too. Unattached, each falls back to the pinned development
  # literal helm/dify writes, so the stack runs with no external secret; the two
  # handshake keys are attached on the server, the worker and the plugin runtime
  # or on none of them, as on helm.
  workload: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
      DELIBERATE NEAR-DUPLICATE of the same block in helm/dify, and of the block
      every Dify Recipe declares with its own sockets and names: it is part of a
      workload template, and no catalog kind holds part of one for several
      Recipes to share; a change to it is made to all.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "DB_HOST" "host" "DB_PORT" "port" "DB_USERNAME" "user" "DB_DATABASE" "database") "cache" (dict "REDIS_HOST" "host" "REDIS_PORT" "port") "vector_store" (dict "VDB_HOST" "host" "VDB_PORT" "port" "VDB_GRPC_PORT" "grpc_port") "sandbox" (dict "SANDBOX_HOST" "host" "SANDBOX_PORT" "port") "plugin_daemon" (dict "PLUGIN_DAEMON_HOST" "host" "PLUGIN_DAEMON_PORT" "port") "ssrf_proxy" (dict "SSRF_PROXY_HOST" "host" "SSRF_PROXY_PORT" "port") -}}
    {{- $required := list "backend" "cache" "sandbox" "plugin_daemon" "ssrf_proxy" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/dify %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    {{- /*
      The credentials, read off the inject pipe as the comment above the
      workload says. $attached maps each variable to its attachment and to the
      words naming where it is attached; $credentials maps each attached
      variable to the value delivered. DELIBERATE NEAR-DUPLICATE of the same
      reading in the compose Recipes of the task worker, the scheduler and the
      plugin runtime, each with its own variables, and of the one-slot reading
      in compose/dify-sandbox and in this Recipe's own import step: it is part
      of a workload template, and no catalog kind holds part of one for several
      Recipes to share; a change to it is made to all.
    */ -}}
    {{- $attached := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- with optional (default dict $edge.features) "credential" dict -}}
    {{- if eq $edge.socket "backend" }}{{ $_ := set $attached "DB_PASSWORD" (dict "attachment" . "where" (printf "the credential on its backend connection %s" $alias)) }}{{ end -}}
    {{- if eq $edge.socket "sandbox" }}{{ $_ := set $attached "CODE_EXECUTION_API_KEY" (dict "attachment" . "where" (printf "the credential on its sandbox connection %s" $alias)) }}{{ end -}}
    {{- if eq $edge.socket "plugin_daemon" }}{{ $_ := set $attached "PLUGIN_DAEMON_KEY" (dict "attachment" . "where" (printf "the credential on its plugin_daemon connection %s" $alias)) }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- with optional (default dict .features) "secret_key" dict }}{{ $_ := set $attached "SECRET_KEY" (dict "attachment" . "where" "its secret_key slot") }}{{ end -}}
    {{- with optional (default dict .features) "inner_api_key" dict }}{{ $_ := set $attached "INNER_API_KEY_FOR_PLUGIN" (dict "attachment" . "where" "its inner_api_key slot") }}{{ end -}}
    {{- $credentials := dict -}}
    {{- range $var, $slot := $attached -}}
    {{- with optional (optional $slot.attachment "provides" dict) "name" "" -}}
    {{- fail (printf "%s of %q carries an attachment whose realization publishes %q, the name of a secret resource the value is to be read from, and Docker Compose has no secret reference to read it through: map core/referenced-secret to compose/dotenv-referenced-secret in the Manifest, writing its origin as the value or as a Compose variable reference such as ${DIFY_SECRET_KEY}" $slot.where $.context.instance_id .) -}}
    {{- end -}}
    {{- $key := default $var (toString (optional (optional $slot.attachment "values" dict) "key" "")) -}}
    {{- if not (hasKey $env $key) -}}
    {{- fail (printf "%s of %q is attached, but no value reaches this Recipe under %s, the key it is read under, so %s would be written empty: map core/referenced-secret to compose/dotenv-referenced-secret, or core/secret-value to compose/dotenv-secret, in the Manifest" $slot.where $.context.instance_id $key $var) -}}
    {{- end -}}
    {{- $_ := set $credentials $var (toString (index $env $key)) -}}
    {{- end -}}
    {{- /*
      The cache connection over TLS, read as helm/dify reads it: a cache
      publishing valkey-tls or redis-tls is reached over TLS, its certificate
      checked against the image's default trust store; any other value ending
      in -tls halts rather than connecting in plaintext. A server_ca on the
      connection is refused here: helm/dify mounts the Secret it names, and
      Docker Compose has no secret to mount. DELIBERATE NEAR-DUPLICATE of the
      block in helm/dify and in the compose Recipes of the task worker and the
      scheduler; a change to it is made to all.
    */ -}}
    {{- $cacheTLS := false -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "cache" -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- $edgeTLS := has $proto (list "valkey-tls" "redis-tls") -}}
    {{- if $edgeTLS }}{{ $cacheTLS = true }}{{ else if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the cache connection %s of %q reaches %q, which publishes protocol %s, a cache served over TLS that the Dify server does not reach: it speaks the Redis protocol, over TLS to a cache publishing valkey-tls or redis-tls; wire a Redis-protocol cache to the cache socket" $alias $.context.instance_id $edge.target $proto) -}}
    {{- end -}}
    {{- if hasKey (default dict $edge.features) "server_ca" -}}
    {{- fail (printf "the cache connection %s of %q holds a server_ca, which is mounted as a file from the secret resource it names, and Docker Compose has no secret resource to mount: remove the server_ca, so the server checks the cache's certificate against the image's default trust store, or map core/ai-agent/dify to helm/dify in the Manifest" $alias $.context.instance_id) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    {{- /*
      The vector-store connection, read as helm/dify reads it: a target whose
      datastore.aggrega.ai/engine label is anything but vector halts, and so
      does one publishing a protocol other than http. DELIBERATE NEAR-DUPLICATE
      of the block in helm/dify, helm/dify-worker and compose/dify-worker; a
      change to it is made to all.
    */ -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "vector_store" -}}
    {{- $engine := toString (optional (default dict $edge.labels) "datastore.aggrega.ai/engine" "") -}}
    {{- if ne $engine "vector" -}}
    {{- fail (printf "the vector_store connection %s of %q reaches %q, whose datastore.aggrega.ai/engine label is %s, not vector: the Dify server's two drivers, Weaviate and Qdrant, speak to a vector engine alone; wire a vector store, such as core/datastore/weaviate or core/datastore/qdrant, to the vector_store socket" $alias $.context.instance_id $edge.target (default "absent" $engine)) -}}
    {{- end -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- if and $proto (ne $proto "http") -}}
    {{- fail (printf "the vector_store connection %s of %q reaches %q, which publishes protocol %s, and the Dify server dials its %s driver at an http:// address, so it would reach that store in plaintext or not at all: wire a store publishing protocol http to the vector_store socket" $alias $.context.instance_id $edge.target $proto (toString $edge.values.engine)) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    {{- $image := printf "langgenius/dify-api:%s" .infra.engine_version -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The server holds no durable state, so the stateless form is correct.
    form: stateless
    # The server applies outstanding schema migrations before it serves, and a
    # server started before the database accepts connections exits; on this
    # target nothing starts it again. So this step runs first, in the server's
    # own image, and waits until the database's address accepts a TCP
    # connection: bash opens the connection through /dev/tcp, each attempt
    # bounded to 5 s and repeated every 2 s, and once the limit has passed it
    # gives up, exits non-zero and names the address, and Docker Compose does
    # not start the server. It reads the database's host and port and nothing
    # else, so no credential reaches it, and the script reading them is single-
    # quoted, so the address is never written into script text a shell parses.
    # Docker Compose reads every $ in the file before a shell runs, so the
    # script's own $ is written $$. Its quantities are the server's own.
    # DELIBERATE NEAR-DUPLICATE of the wait helm/dify-plugin-daemon writes, as
    # compose/langgraph and the compose Recipes of the Dify worker, scheduler
    # and plugin runtime copy it; a change to it is made to all.
    initContainers:
      - name: wait-for-database
        image: "{{ $image }}"
        command: ["/bin/bash", "-c"]
        args:
          - 'limit=300; end=$$SECONDS; ((end += limit)); until timeout 5 bash -c ''exec 3<>"/dev/tcp/$$DB_HOST/$$DB_PORT"'' 2>/dev/null; do if ((SECONDS >= end)); then echo "the database at $$DB_HOST:$$DB_PORT accepted no TCP connection within $$limit s" >&2; exit 1; fi; sleep 2; done; echo "the database at $$DB_HOST:$$DB_PORT accepts TCP connections"'
        variables:
          DB_HOST: {{ toJson (replace "$" "$$" (toString $env.DB_HOST)) }}
          DB_PORT: {{ toJson (replace "$" "$$" (toString $env.DB_PORT)) }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    containers:
      main:
        image: "{{ $image }}"
        # MODE selects which of the three roles this image runs; the image's own
        # entrypoint reads it.
        variables:
          MODE: api
          LOG_LEVEL: "{{ .infra.log_level }}"
          DIFY_PORT: "{{ .infra.port }}"
          # This server is the one place the schema upgrade runs; the worker and
          # the scheduler set the flag false.
          MIGRATION_ENABLED: "true"
          DB_TYPE: postgresql
          DB_HOST: "{{ $env.DB_HOST }}"
          DB_PORT: "{{ $env.DB_PORT }}"
          DB_USERNAME: "{{ $env.DB_USERNAME }}"
          DB_DATABASE: "{{ $env.DB_DATABASE }}"
          REDIS_HOST: "{{ $env.REDIS_HOST }}"
          REDIS_PORT: "{{ $env.REDIS_PORT }}"
          CELERY_BACKEND: redis
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "cache" }}
          REDIS_DB: "{{ $edge.values.db_index }}"
          CELERY_BROKER_URL: "{{ if $cacheTLS }}rediss{{ else }}redis{{ end }}://{{ $env.REDIS_HOST }}:{{ $env.REDIS_PORT }}/{{ $edge.values.broker_db_index }}"
    {{- end }}
    {{- end }}
    {{- if $cacheTLS }}
          REDIS_USE_SSL: "true"
          REDIS_SSL_CERT_REQS: CERT_REQUIRED
    {{- end }}
          # The prefix is the developer's text, so each $ in it is doubled and
          # it reaches the container as authored.
          VECTOR_INDEX_NAME_PREFIX: {{ replace "$" "$$" (toString .values.vector_index_prefix) | toJson }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
          VECTOR_STORE: "{{ $edge.values.engine }}"
    {{- if eq $edge.values.engine "weaviate" }}
          WEAVIATE_ENDPOINT: "http://{{ $env.VDB_HOST }}:{{ $env.VDB_PORT }}"
          WEAVIATE_GRPC_ENDPOINT: "grpc://{{ $env.VDB_HOST }}:{{ $env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- if eq $edge.values.engine "qdrant" }}
          QDRANT_URL: "http://{{ $env.VDB_HOST }}:{{ $env.VDB_PORT }}"
          QDRANT_GRPC_PORT: "{{ $env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- end }}
    {{- end }}
          CODE_EXECUTION_ENDPOINT: "http://{{ $env.SANDBOX_HOST }}:{{ $env.SANDBOX_PORT }}"
          PLUGIN_DAEMON_URL: "http://{{ $env.PLUGIN_DAEMON_HOST }}:{{ $env.PLUGIN_DAEMON_PORT }}"
          PLUGIN_DIFY_INNER_API_URL: "http://{{ .context.instance_id }}:{{ .infra.port }}"
          SSRF_PROXY_HTTP_URL: "http://{{ $env.SSRF_PROXY_HOST }}:{{ $env.SSRF_PROXY_PORT }}"
          SSRF_PROXY_HTTPS_URL: "http://{{ $env.SSRF_PROXY_HOST }}:{{ $env.SSRF_PROXY_PORT }}"
          TOP_K_MAX_VALUE: "{{ .values.top_k_max }}"
          MAX_PARALLEL_LIMIT: "{{ .values.max_parallel_limit }}"
          MAX_ITERATIONS_NUM: "{{ .values.max_iterations }}"
          MAX_TOOLS_NUM: "{{ .values.max_tools }}"
          INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "{{ .values.indexing_max_segmentation_tokens }}"
    {{- with .infra.external_base_url }}
          # The externally reachable base URL, when the operator supplied one,
          # with each $ doubled so it reaches the container as authored.
          CONSOLE_API_URL: {{ replace "$" "$$" . | toJson }}
          CONSOLE_WEB_URL: {{ replace "$" "$$" . | toJson }}
          SERVICE_API_URL: {{ replace "$" "$$" . | toJson }}
          APP_API_URL: {{ replace "$" "$$" . | toJson }}
          APP_WEB_URL: {{ replace "$" "$$" . | toJson }}
          FILES_URL: {{ replace "$" "$$" . | toJson }}
    {{- end }}
          # Each credential as delivered, or the development literal helm/dify
          # writes when nothing is attached. Each is written through toJson, so a
          # quote or a backslash in it reaches the file as delivered.
          DB_PASSWORD: {{ optional $credentials "DB_PASSWORD" "apppass" | toJson }}
          CODE_EXECUTION_API_KEY: {{ optional $credentials "CODE_EXECUTION_API_KEY" "dify-sandbox" | toJson }}
          PLUGIN_DAEMON_KEY: {{ optional $credentials "PLUGIN_DAEMON_KEY" "dify-plugin-daemon-server-key" | toJson }}
          INNER_API_KEY_FOR_PLUGIN: {{ optional $credentials "INNER_API_KEY_FOR_PLUGIN" "dify-plugin-inner-api-key" | toJson }}
    {{- if hasKey $credentials "SECRET_KEY" }}
          SECRET_KEY: {{ $credentials.SECRET_KEY | toJson }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The server answers GET /health, and Dify's own Compose file checks that
        # route with curl, which the image carries, every 30 s with a 5 s timeout
        # and three retries after a 30 s start period; an http probe on this
        # target is that curl, and it takes the same timing. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            http: /health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    # The port on the host's loopback address only: see the header above.
    services:
      default:
        type: Loopback
        ports:
          http: {{ .infra.port }}
