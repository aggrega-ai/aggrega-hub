apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: phidata
  version: 1.0.0
  description: >
    A Phidata agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL; the
    datastore wired into `storage` contributes the coordinates for session history
    and the store wired into `knowledge_base` those for retrieved reference
    material; an attached model API key arrives on the inject pipe as
    OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/phidata:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes three sockets, each addressed by the developer-chosen
        # alias, so the recipe ranges its outbound edges and matches on the socket
        # name: `model` contributes the endpoint and the model name; `storage` the
        # host and port of the store holding session history; `knowledge_base`
        # those of the store holding retrieved reference material. The two stores
        # stay separate variable pairs because Phidata addresses them as separate
        # subsystems. The client SDK reads the base URL and the API key from the
        # environment; the model name and both store coordinates are delivered
        # under stable names this recipe defines, for the application's own code to
        # read, since a Phidata Agent takes its storage and knowledge arguments in
        # code. Both store sockets are optional, so an unwired deployment emits
        # neither pair.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- if eq $edge.socket "storage" }}
          PHIDATA_STORAGE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_STORAGE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- if eq $edge.socket "knowledge_base" }}
          PHIDATA_KNOWLEDGE_BASE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_KNOWLEDGE_BASE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached to the model_api_key
        # slot, arrives on the inject pipe and renders as OPENAI_API_KEY (compose
        # has no Secret-resource / secretKeyRef primitive). Unattached, no key env
        # is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
