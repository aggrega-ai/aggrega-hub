apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: phidata
  version: 1.0.0
  description: >
    A Phidata agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL; the
    datastore wired into `storage` contributes the coordinates for session
    history and the store wired into `knowledge_base` those for retrieved
    reference material; a model API key attached on the `model` connection
    arrives on the inject pipe as OPENAI_API_KEY. A storage datastore served
    over TLS alone halts the build, naming the connection, since the
    application is handed only its host and port.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/phidata:1.0.0
  workload: |
    {{- /*
      A storage datastore served over TLS alone publishes a protocol ending in
      -tls, such as valkey-tls or memcached-tls, and accepts no plaintext
      connection. The application is handed the store's host and port alone,
      under names its own code reads, so that code could not tell that TLS is
      required or be given an authority to check the store's certificate
      against: such a store halts the build, naming the connection, rather than
      rendering an address the application would reach in plaintext.
    */ -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "storage" -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the storage connection %s of %q reaches %q, which publishes protocol %s, a store served over TLS alone, but the application is handed only the store's host and port, so its code could not tell that TLS is required or be given the authority to trust; wire a store served without TLS to the storage socket" $alias $.context.instance_id $edge.target $proto) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes three sockets, each addressed by the developer-chosen
        # alias, so the recipe ranges its outbound edges and matches on the socket
        # name: `model` contributes the endpoint and the model name; `storage` the
        # host and port of the store holding session history; `knowledge_base`
        # those of the store holding retrieved reference material. The two stores
        # stay separate variable pairs because Phidata addresses them as separate
        # subsystems. The client SDK reads the base URL and the API key from the
        # environment; the model name and both store coordinates are delivered
        # under stable names this recipe defines, for the application's own code to
        # read, since a Phidata Agent takes its storage and knowledge arguments in
        # code. Both store sockets are optional, so a Release leaving them unwired emits
        # neither pair.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- if eq $edge.socket "storage" }}
          PHIDATA_STORAGE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_STORAGE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- if eq $edge.socket "knowledge_base" }}
          PHIDATA_KNOWLEDGE_BASE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_KNOWLEDGE_BASE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, arrives on the inject pipe and renders as OPENAI_API_KEY
        # (compose has no Secret-resource / secretKeyRef primitive). A connection
        # carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ $.context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
    {{- end }}
