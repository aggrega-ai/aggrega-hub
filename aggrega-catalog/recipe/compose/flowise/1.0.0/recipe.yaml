apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the data volume, and the
    exposed port are translated from the Workload kind by the compose provider.
    Two pieces of durable state land on the named volume and survive a restart:
    the chatflow database, and the encryption key that protects the credentials
    created in the editor. The platform generates that key on first start and
    writes it under the data path, so the key and the database whose rows it
    protects stay together; state written anywhere else in the container does not
    survive. The model endpoint wired into the `model` socket is rendered as
    OPENAI_BASE_URL and an attached model API key as OPENAI_API_KEY. A chatflow
    resolves its model credential per node from Flowise's own encrypted
    credential store: the OpenAI node selects a credential, and Flowise looks it
    up and decrypts it — so a credential selected on the node takes precedence
    over the delivered key, and an operator who wants a chatflow to work the way
    Flowise intends creates that credential in the editor after deploying. The
    delivered variables are read by the underlying OpenAI client library when the
    node's Connect Credential and Base Path fields are left empty. That is the
    client library's environment fallback rather than a documented Flowise
    feature, so a future Flowise release that changes how it validates a
    credential-less node would end it. Which model a chatflow calls is selected
    inside the chatflow's own OpenAI node, whose model-name field carries the
    platform's default; the environment carries no model name. Chatflows are
    authored through the Flowise editor or its REST API. The environment-variable
    contract is authored against Flowise 3.1.3.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/flowise:1.0.0
  workload: |
    {{- $dataPath := "/app/flowise-data" -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Every key that has to agree on it reads the binding — the
        # database path, the credential-key path, and the volume mount — so a
        # future move cannot relocate one and leave the others behind.
        # SECRETKEY_PATH is load-bearing rather than decorative: without it the
        # platform writes the credential encryption key it generates on first
        # start outside the mounted volume, and each restart then mints a new key
        # while the volume keeps the database, leaving every credential created
        # in the editor undecryptable.
        variables:
          DATABASE_PATH: "{{ $dataPath }}"
          SECRETKEY_PATH: "{{ $dataPath }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
          # Fallback for the no-credential authoring state: the client library
          # reads this only when the node's Connect Credential is left empty. A
          # chatflow node with its own credential attached uses that instead —
          # so this delivery is not how the key is supplied.
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 3000
        # The platform answers GET /api/v1/ping without authentication, and its
        # own Compose file checks that route with curl, every 10 s after a 30 s
        # start period and allowing five retries. The check runs inside the
        # image the Release names; the platform's own published image carries
        # curl. A service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            http: /api/v1/ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
