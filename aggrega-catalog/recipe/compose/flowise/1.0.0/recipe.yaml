apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the chatflow-database volume,
    and the exposed port are translated from the Workload kind by the compose
    provider. The model endpoint wired into the `model` socket is rendered as
    OPENAI_BASE_URL and an attached model API key as OPENAI_API_KEY. Chatflows are
    authored through the Flowise editor or its REST API.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/flowise:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          DATABASE_PATH: /app/flowise-data
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 3000
        volumeMounts:
          - name: data
            path: /app/flowise-data
    volumes:
      data:
        persistent:
          size: {{ .infra.storage_size }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
