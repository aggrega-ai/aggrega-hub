apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder for local development via Docker Compose,
    synthesized from the Workload kind by the compose provider. The chatflow
    database and the key encrypting the editor's credentials live on the named
    data volume, mounted at the platform's home directory, and survive a
    restart; nothing outside that directory does.

    The model endpoint wired into the `model` socket is rendered as
    OPENAI_BASE_URL and a key attached on that connection as OPENAI_API_KEY,
    which a chatflow's OpenAI node reads only while its Connect Credential and
    Base Path fields are empty, through the client library's environment
    fallback, as on helm/flowise.

    Each `tools` and `vector_store` connection reaches the platform under the
    variables helm/flowise names, AGGREGA_TOOL_<ALIAS>_URL,
    AGGREGA_VECTOR_STORE_<ALIAS>_URL, their parts and credentials, read by a
    chatflow through a Runtime variable of the same name. Compose has no
    secret reference, so a secret is written into the file as it was
    delivered, a Compose variable reference such as ${STORE_API_KEY} as that
    reference. A connection writing an `inject:` block receives the names it
    dictates as on helm/flowise, a file as a compose config mounted at the
    path it names.

    A flow_definition, when set, is carried in a compose config and seeded by
    a service that runs once, in the platform's image, after the platform
    reports healthy: it registers infra.owner_email as the owner on a fresh
    instance, with the owner_password credential as delivered, signs in, and
    updates the chatflow at chatflow_id or imports it there. With none,
    neither is rendered. The contract is authored against Flowise 3.1.3.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/flowise:1.0.0
  # The entries below are the values the seeding service shares with the
  # FlowiseFlowSeed bundle imported for the definition and the script that
  # seeds it. Each has its home in the bundle, which stops the build naming the
  # local when one is missing or differs from its own; the service reads them
  # here, because an artifact of this Recipe cannot read the bundle.
  # flow_seed_delivery has the bundle emit two compose configs, named
  # flow_definition_config_name and seed_script_config_name, which the service
  # mounts as files in flow_seed_directory, where the script reads the
  # definition.
  locals:
    flow_seed_delivery: compose_configs
    flow_definition_config_name: "{{ .context.instance_id }}-flow"
    seed_script_config_name: "{{ .context.instance_id }}-flow-seed"
    flow_seed_directory: /seed
  # metrics_endpoint is the address Flowise serves its metrics at while
  # values.metrics_enabled is true, when the Workload below delivers
  # ENABLE_METRICS and METRICS_PROVIDER: /api/v1/metrics on port 3000 of the
  # service name, which every peer on the compose network reaches. Empty while
  # the value is false. metrics_credential_required follows it, true exactly
  # while there is an address to scrape, since Flowise answers its metrics only
  # to an API key.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}:3000/api/v1/metrics{{ end }}"
    metrics_credential_required: "{{ if .values.metrics_enabled }}true{{ else }}false{{ end }}"
  # When values.flow_definition is set, a compose fragment adds a service that
  # runs once and seeds the definition, and the FlowiseFlowSeed bundle adds two
  # compose configs: the definition, verbatim, and the script that seeds it.
  # With no definition neither renders, so the output is what it is without
  # the value. The Component's assertions have already halted a definition with
  # no infra.owner_email, no owner_password credential or a chatflow_id that is
  # not a UUID.
  #
  # The step is the one helm/flowise runs as a Job, running the same script,
  # the bundle's, which both Recipes import. It registers the owner on a fresh
  # instance or signs in, then updates the chatflow at chatflow_id or imports
  # the definition at that id, halting with the platform's own status and
  # message when a call is refused, and running it again updates the same
  # chatflow.
  #
  # A Workload's init container runs before the main service starts, and the
  # seeding has to wait for the platform to answer, so the step is a service
  # of the fragment's own rather than part of the Workload: it waits on the
  # main service with service_healthy, which the Workload's readiness check on
  # GET /api/v1/ping becomes, and carries restart "no", so it runs once at each
  # start of the stack and its exit status is what a reader inspects. It shares
  # the main service's network namespace, the way a sidecar does, so it reaches
  # the platform at 127.0.0.1 on the port the Workload serves, 3000, whatever
  # network the boundary is given. It runs the platform's own image, whose
  # Node.js runtime carries the HTTP client the script uses, with the image's
  # entrypoint replaced so it does not start a second platform. Its name
  # carries -flow-seed after the instance, apart from the names the Workload's
  # services take.
  #
  # The owner password is read from the inject pipe under the key its
  # attachment delivered it under, values.key, which is value unless the
  # Aggregate names another; an attachment naming no key is read under
  # OWNER_PASSWORD. Compose has no secret reference, so it is written into the
  # file as it was delivered, a Compose variable reference such as
  # ${FLOWISE_OWNER_PASSWORD} as that reference, which Docker Compose
  # substitutes when the stack starts.
  #
  # Docker Compose substitutes a variable reference, $NAME or ${NAME},
  # anywhere in the file's values, a config's content included, and reads $$
  # as one literal $. So the definition, which the bundle writes, and the
  # chatflow's name are written with every $ doubled and reach the step as
  # authored; the script holds no $. Inline config content needs Docker
  # Compose 2.23.1 or later, so supplying a definition raises the compose
  # output's floor to it.
  artifacts:
    flowise-flow.compose-fragment.yaml: |
      {{- if .values.flow_definition }}
      {{- $passwordKey := optional .features.owner_password.values "key" "" }}
      services:
        {{ .context.instance_id }}-flow-seed:
          image: "{{ .infra.image }}"
          entrypoint: ["node", "{{ .locals.flow_seed_directory }}/seed.js"]
          environment:
            FLOWISE_URL: "http://127.0.0.1:3000"
            OWNER_EMAIL: "{{ .infra.owner_email }}"
            OWNER_PASSWORD: "{{ if $passwordKey }}{{ index .context.inject.env $passwordKey | replace "\\" "\\\\" | replace "\"" "\\\"" }}{{ else }}{{ index .context.inject.env "OWNER_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}{{ end }}"
            CHATFLOW_ID: "{{ .values.chatflow_id }}"
            CHATFLOW_NAME: {{ optional .values "display_name" "" | default .values.chatflow_id | replace "$" "$$" | toJson }}
          configs:
            - source: {{ .locals.flow_definition_config_name }}
              target: {{ .locals.flow_seed_directory }}/flow.json
            - source: {{ .locals.seed_script_config_name }}
              target: {{ .locals.flow_seed_directory }}/seed.js
          network_mode: "service:{{ .context.instance_id }}"
          depends_on:
            {{ .context.instance_id }}:
              condition: service_healthy
          restart: "no"
      {{- end }}
    flowise-flow:
      $import: FlowiseFlowSeed#/artifacts/SeedScript
    # The compose configs holding the file entries the connections dictate,
    # one per file and numbered in path order, the names the workload's
    # volumes read. A compose config is written as one file at the path it is
    # mounted at, and Docker Compose substitutes a $ in its content, so each $
    # is doubled. They are emitted only while a connection dictates a file, so
    # a build with none renders nothing here.
    flowise-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
  # Synthesized-mode Workload: image, environment, the data volume, and the
  # exposed port are translated from the Workload kind by the compose provider.
  # Two pieces of durable state land on the named volume and survive a restart:
  # the chatflow database, and the encryption key that protects the credentials
  # created in the editor. The platform generates that key on first start and
  # writes it under the data path, so the key and the database whose rows it
  # protects stay together. The volume is mounted at /home/node, the home
  # directory of the user the platform's image runs as, and the data path is
  # /home/node/.flowise, the platform's own documented data directory; whatever
  # else the platform writes under its home directory survives with them, and
  # state written anywhere else in the container does not.
  #
  # The platform's image runs as `node` from Flowise 3.1.4, and as root before
  # it. Docker fills a new named volume from the directory it is mounted over,
  # owner included, and the image holds /home/node owned by `node`, so the
  # volume is writable by `node`; at a path the image does not hold, Docker
  # creates the volume owned by root and `node` cannot write to it. This target
  # has no counterpart to the pod-level group the Kubernetes Recipe sets.
  #
  # The model endpoint wired into the `model` socket is rendered as
  # OPENAI_BASE_URL and a model API key attached on that connection as
  # OPENAI_API_KEY, read from the inject pipe under the key its own attachment
  # delivered it under, values.key, which is value unless the Aggregate names
  # another; an attachment naming no key is read under OPENAI_API_KEY, and
  # nothing delivered under the key read halts the build naming that key. A
  # chatflow resolves its model credential per node from Flowise's own encrypted
  # credential store: the OpenAI node selects a credential, and Flowise looks it
  # up and decrypts it — so a credential selected on the node takes precedence
  # over the delivered key, and an operator who wants a chatflow to work the way
  # Flowise intends creates that credential in the editor after deploying. The
  # delivered variables are read by the underlying OpenAI client library when
  # the node's Connect Credential and Base Path fields are left empty. That is
  # the client library's environment fallback rather than a documented Flowise
  # feature, so a future Flowise release that changes how it validates a
  # credential-less node would end it. Which model a chatflow calls is selected
  # inside the chatflow's own OpenAI node, whose model-name field carries the
  # platform's default; the environment carries no model name.
  #
  # Each `tools` and `vector_store` connection is delivered as on helm/flowise,
  # under its alias upper-cased with every hyphen an underscore, each secret
  # read from the inject pipe under its own attachment's values.key: a tool's
  # endpoint secret in place of the endpoint the tool publishes, its credential
  # with the header beside it only where the tool publishes one, and a store's
  # credential beside the address the store publishes or the one composed from
  # its protocol, host and port. A store that also publishes a database and a
  # user is delivered in parts as well, AGGREGA_VECTOR_STORE_<ALIAS>_HOST,
  # _PORT, _DATABASE and _USER, for the reason helm/flowise gives. Two secrets
  # the Release alone attaches on one platform both arrive under the key value
  # and halt the build naming both; an Aggregate naming values.key on one of
  # them avoids it.
  #
  # The tools and vector_store variables are defaults, as on helm/flowise: a
  # connection writing an inject block receives exactly the names it dictates
  # instead of its address, header and part variables, while its credential
  # and endpoint secrets stay.
  workload: |
    {{- /*
      A connection that writes no inject block receives the defaults above. A
      tools or vector_store connection that writes one receives exactly what
      it dictates instead, read off the inject pipe as a map: no
      AGGREGA_TOOL_<ALIAS>_URL from the endpoint the tool publishes, no
      _CREDENTIAL_HEADER, no AGGREGA_VECTOR_STORE_<ALIAS>_URL and no part
      variables. What its attachments deliver stays either way: the credential
      as _CREDENTIAL, and a tool's endpoint secret as AGGREGA_TOOL_<ALIAS>_URL.

      A dictated env entry becomes a service variable under the name it gives,
      after every variable this recipe names, written as the pipe carries it,
      so Docker Compose substitutes a $ in it as in every variable; a dictated
      file entry becomes a compose config mounted as one file at the absolute
      path it names, its content written with each $ doubled so the file holds
      the value itself, and a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: the service's command replaces the
      image's default, which starts the platform. Any other mechanism is
      refused too. A dictated variable named like one this recipe delivers
      itself, a platform setting, the model's variables or another
      connection's, or like the key an attachment's value arrives under on the
      inject pipe, where the attachment's value would take its place, halts the
      build, naming both, since the compiler cannot see the names a recipe
      writes.

      Two tools or two vector_store connections whose aliases differ only in
      letter case, or in a hyphen against an underscore, are named alike, so
      the build halts, naming both, wherever the two would deliver one
      variable: always while both take the defaults, and otherwise wherever
      what each still delivers meets, such as a credential attached on each.
    */ -}}
    {{- $pipe := default dict .context.inject -}}
    {{- $env := optional $pipe "env" dict -}}
    {{- $pipeFiles := optional $pipe "file" dict -}}
    {{- $dictating := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $taken := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $slot, $attachment := (default dict $edge.features) -}}
    {{- with optional (default dict $attachment.values) "key" "" -}}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- with optional (default dict .features) "owner_password" "" -}}
    {{- $key := optional (default dict .values) "key" "" -}}
    {{- if not $key }}{{ $key = "OWNER_PASSWORD" }}{{ end -}}
    {{- $_ := set $taken $key "the owner_password attached on the platform, whose value arrives on the inject pipe under that key" -}}
    {{- end -}}
    {{- $_ := set $taken "DATABASE_PATH" "the platform's own setting naming its data directory" -}}
    {{- $_ := set $taken "SECRETKEY_PATH" "the platform's own setting naming where it keeps its encryption key" -}}
    {{- if .values.metrics_enabled -}}
    {{- $_ := set $taken "ENABLE_METRICS" "the platform's own setting turning its metrics on" -}}
    {{- $_ := set $taken "METRICS_PROVIDER" "the platform's own setting naming its metrics format" -}}
    {{- end -}}
    {{- $connectionVars := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if eq $edge.socket "model" -}}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint the OpenAI client library reads under that name" $alias) -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) -}}
    {{- end -}}
    {{- end -}}
    {{- if or (eq $edge.socket "tools") (eq $edge.socket "vector_store") -}}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" -}}
    {{- $byDefault := printf "the %s connection %s, which writes no inject block" $edge.socket $alias -}}
    {{- $delivers := dict -}}
    {{- if eq $edge.socket "tools" -}}
    {{- if hasKey $features "endpoint" -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) (printf "the endpoint attached on the tools connection %s" $alias) -}}
    {{- else if not (hasKey $dictating $alias) -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) $byDefault -}}
    {{- end -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) (printf "the credential attached on the tools connection %s" $alias) -}}
    {{- if and (not (hasKey $dictating $alias)) (optional $edge.provides "credential_header" "") -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL_HEADER" $name) $byDefault -}}
    {{- end -}}
    {{- end -}}
    {{- else -}}
    {{- if not (hasKey $dictating $alias) -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_URL" $name) $byDefault -}}
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") -}}
    {{- range $part := list "HOST" "PORT" "DATABASE" "USER" -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_%s" $name $part) $byDefault -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_CREDENTIAL" $name) (printf "the credential attached on the vector_store connection %s" $alias) -}}
    {{- end -}}
    {{- end -}}
    {{- range $var, $by := $delivers -}}
    {{- with optional $connectionVars $var "" -}}
    {{- fail (printf "the %s connections %s and %s of %q would both deliver the variable %s, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" $edge.socket . $alias $.context.instance_id $var) -}}
    {{- end -}}
    {{- $_ := set $connectionVars $var $alias -}}
    {{- $_ := set $taken $var $by -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) -}}
    {{- end -}}
    {{- else if eq $mechanism "file" -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) -}}
    {{- end -}}
    {{- $_ := set $files $name (optional $pipeFiles $name "") -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, which starts the platform. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $homeDir := "/home/node" -}}
    {{- $dataPath := printf "%s/.flowise" $homeDir -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # $homeDir is the single authored home for where the data volume is
        # mounted, the home directory of the platform's user, and $dataPath, the
        # platform's data directory inside it, is derived from it. The database
        # path and the credential-key path read $dataPath and the volume mount
        # reads $homeDir, so a future move cannot relocate one and leave the
        # others behind.
        # DATABASE_PATH and SECRETKEY_PATH are load-bearing rather than
        # decorative: without them the platform keeps the database and the
        # credential encryption key it generates on first start under its own
        # user's home directory, which is the mounted volume only for an image
        # running as `node`. An image running as root would write both outside
        # the volume, and each restart would then mint a new key, leaving every
        # credential created in the editor undecryptable.
        # ENABLE_METRICS and METRICS_PROVIDER turn on the platform's own
        # metrics, in the Prometheus format, while values.metrics_enabled is
        # true; it serves them on its own port behind its API-key check, which
        # every peer on the compose network already reaches.
        variables:
          DATABASE_PATH: "{{ $dataPath }}"
          SECRETKEY_PATH: "{{ $dataPath }}"
    {{- if .values.metrics_enabled }}
          ENABLE_METRICS: "true"
          METRICS_PROVIDER: "prometheus"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
          # Fallback for the no-credential authoring state: the client library
          # reads this only when the node's Connect Credential is left empty. A
          # chatflow node with its own credential attached uses that instead —
          # so this delivery is not how the key is supplied.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
    {{- $credentialKey := optional $edge.features.credential.values "key" "" }}
          OPENAI_API_KEY: "{{ if $credentialKey }}{{ index $.context.inject.env $credentialKey | replace "\\" "\\\\" | replace "\"" "\\\"" }}{{ else }}{{ index $.context.inject.env "OPENAI_API_KEY" | replace "\\" "\\\\" | replace "\"" "\\\"" }}{{ end }}"
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ index $.context.inject.env $features.endpoint.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else if not $dictates }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- if and (not $dictates) (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $url := optional $edge.provides "endpoint" "" }}
    {{- if not $url }}
    {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
    {{- end }}
          AGGREGA_VECTOR_STORE_{{ $name }}_URL: "{{ $url }}"
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
          AGGREGA_VECTOR_STORE_{{ $name }}_HOST: "{{ $edge.provides.host }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_PORT: "{{ $edge.provides.port }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_DATABASE: "{{ $edge.provides.database }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_USER: "{{ $edge.provides.user }}"
    {{- end }}
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_VECTOR_STORE_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- /* The variables connections dictate, after every variable this recipe names, in alias order. */}}
    {{- range $alias, $edge := .context.uses }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
        ports:
          http: 3000
        # The platform answers GET /api/v1/ping without authentication, and its
        # own Compose file checks that route with curl, every 10 s after a 30 s
        # start period and allowing five retries. The check runs inside the
        # image the Release names; the platform's own published image carries
        # curl. A service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            http: /api/v1/ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        volumeMounts:
          - name: data
            path: "{{ $homeDir }}"
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    {{- $i = 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
