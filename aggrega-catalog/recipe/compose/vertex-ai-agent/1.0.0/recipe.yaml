apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: vertex-ai-agent
  version: 1.0.0
  description: >
    A Vertex AI agent as a reference realization for local development, so no
    service runs. The compose engine carries the operator-supplied regional
    endpoint and the agent identifier to consumers through the injection
    contract, and delivers no credential — consumers authenticate with their own
    Google credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/vertex-ai:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_id: "{{ .values.agent_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
