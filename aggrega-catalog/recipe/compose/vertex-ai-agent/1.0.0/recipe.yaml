apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vertex-ai-agent
  version: 1.0.0
  description: >
    A Vertex AI agent as a reference realization for local development, so no
    service runs. The compiler carries the operator-supplied regional
    endpoint and the agent identifier to consumers through the injection
    contract, and delivers no credential — consumers authenticate with their own
    Google credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/vertex-ai:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_id: "{{ .values.agent_id }}"
  assertions:
    # The Vertex AI host carries the region, and the region is the operator's
    # choice, so no address exists for the catalog to hold as a default: the
    # Release names the host of the region it uses.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches a Vertex AI agent in a region the operator chooses, and its host carries that region, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the Vertex AI host of that region (<region>-aiplatform.googleapis.com)" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
