apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: bedrock-embedding
  version: 1.0.0
  description: >
    Amazon Bedrock's managed embedding API as a reference realization: no compute runs in-cluster. the compose engine carries the operator-supplied regional endpoint to consumers through the injection contract; no service runs. No credential is delivered by this recipe: consumers authenticate with ambient AWS IAM (for example EKS IRSA) or inject their own credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/bedrock-embedding:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
