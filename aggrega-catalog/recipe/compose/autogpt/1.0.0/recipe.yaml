apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: autogpt
  version: 1.0.0
  description: >
    An AutoGPT agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; an attached
    model API key arrives on the inject pipe as OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/autogpt:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name to find it, then reads the model recipe's published
        # endpoint and model name. The client SDK reads the base URL and the API
        # key from the environment. The model name is delivered as OPENAI_MODEL
        # for the application's own code to read — a stable name this recipe
        # defines rather than a claim about a framework read. AutoGPT's goal list
        # and continuous-run cap live in its own configuration file, which the
        # deployment's image owns, so no goal or step variable is emitted here.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached to the model_api_key
        # slot, arrives on the inject pipe and renders as OPENAI_API_KEY (compose
        # has no Secret-resource / secretKeyRef primitive). Unattached, no key env
        # is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
