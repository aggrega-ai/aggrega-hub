apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nats
  version: 1.0.0
  description: >
    NATS for local development via Docker Compose. Synthesized-mode Workload —
    the compose provider translates the Workload kind into a service entry
    (image, port, exposed service). Used as an in-memory messaging server with
    no persistence, so no data volume is declared. Authentication is off by
    default; when a password credential is attached its value arrives on the
    env pipe and the server is started with user/password authentication flags.
    With no credential attached the server runs unauthenticated and the render
    stays reproducible. provides.host is the bare service name, resolved on the
    compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: compose
  implements: core/messaging/nats:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "nats"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: nats:{{ .infra.engine_version }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached its value arrives on the inject
        # pipe as .context.inject.env.NATS_PASSWORD, and the server is started
        # with user/password authentication flags. With no credential attached
        # no auth flags are emitted and the server runs unauthenticated.
    {{- if and .context.inject.env .context.inject.env.NATS_PASSWORD }}
        command:
          - "--user"
          - "{{ .values.username }}"
          - "--pass"
          - "{{ .context.inject.env.NATS_PASSWORD }}"
    {{- end }}
        ports:
          client: {{ .infra.port }}
    services:
      default:
        type: ClusterIP
        ports:
          client: {{ .infra.port }}
