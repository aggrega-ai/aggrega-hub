apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: nemo-guardrails
  version: 1.0.0
  license: Apache-2.0
  description: >
    The NeMo Guardrails server as a guard in a model's path, for local
    development via Docker Compose: one service running the image in
    infra.image, synthesized from the Workload kind by the compose provider.
    Two compose configs carry the guard's configuration as the product's own
    two files — config.yaml, naming the Hugging Face classifier rail pointed at
    the detector wired on the detector socket, with values.threshold and
    values.blocked_labels; and rails.co, the flow that keeps a request body from
    switching that rail off. The guard starts in the product's
    single-configuration mode and refuses a request naming any other
    configuration. It writes no NemoGuard rail, and halts while the
    content_safety or jailbreak_detection socket holds a connection.

    Compose has no env-from-secret primitive, so an attached upstream_key
    credential is rendered as a plain environment variable, under the name
    config.yaml gives it, which is therefore also the key the attached
    credential must publish under; unattached, the guard presents none. The
    upstream address reaches the guard as MAIN_MODEL_BASE_URL, from
    infra.upstream_endpoint.

    The service publishes no port on the host: callers sit on the same compose
    network. provides.host is the compose service name, and the published
    contract is key for key the one the Kubernetes realization publishes.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/security/nemo-guardrails:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Each entry below is the single authored home for a value the artifacts
  # template and the workload template both have to agree on. They are separate
  # templates, so a template variable bound in one is not visible in the other.
  locals:
    # The names the two configs are declared under, which the volumes source.
    config_name: "{{ .context.instance_id }}-config"
    flow_config_name: "{{ .context.instance_id }}-flow"
    # The image starts the server with its configuration root at /app/config
    # and the configuration id in CONFIG_ID. A root holding config/config.yaml
    # puts the server in its single-configuration mode, under the id "config",
    # which is then also the id it serves by default; so the id is "config" and
    # the files are mounted in /app/config/config.
    config_id: config
    config_dir: /app/config/config
    # The variable the upstream credential is delivered under, which config.yaml
    # names on the main model and the workload renders from the inject pipe.
    upstream_key_variable: UPSTREAM_API_KEY
    # The name the classifier rail's configuration is declared under and the
    # input flow refers to it by.
    classifier_name: prompt_injection
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, and below the PORT variable the image's start-up
  # reads, the container port and the service entry; the literal is never
  # repeated.
  #
  # host is the name the compose provider gives the synthesized service, which is
  # the component instance's own name. host and endpoint spell it out twice on
  # purpose: a provides entry cannot read another provides entry, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together.
  #
  # provides.host is the compose service name, and the published contract is
  # key for key the one the Kubernetes realization publishes. threshold is
  # values.threshold, the one the rail below refuses at, published so a gateway
  # routing its model traffic through the guard can check what the guard will
  # refuse.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/v1"
    protocol: "http"
    threshold: "{{ .values.threshold }}"
  artifacts:
    # The guard's configuration, as the product's own two files, each a compose
    # config because this target delivers a config as one file at the path it is
    # mounted at.
    #
    # Each is mounted as one file at the path the image's start-up reads, so the
    # guard starts in the product's single-configuration mode and refuses a
    # request naming any other configuration.
    #
    # config.yaml: passthrough forwards each admitted request's messages and
    # parameters to the upstream as the caller sent them. The one input rail is
    # the Hugging Face classifier rail on the fms engine — the guardrails
    # detector API — at the endpoint and model the wired detector publishes; the
    # guard sends the latest user message and values.threshold there and refuses
    # the request when a label in values.blocked_labels comes back at or above
    # the threshold, and it refuses the request as well when the detector cannot
    # be reached or answers with an error. The upstream itself is not named
    # here: the guard takes its address from MAIN_MODEL_BASE_URL and forwards
    # under the model name the caller asked for. A main model is declared only
    # when the upstream_key slot is attached, and then only to name the variable
    # the credential is delivered under — the model name it carries is replaced
    # by the caller's on every request. Declaring one with that variable unset
    # would refuse every request, so unattached nothing is declared. No
    # credential value appears here.
    #
    # 🔴 rails.co redefines "process user input", a flow internal to the NeMo
    # Guardrails library, copied from the library at the version the image
    # carries with its one generation-options condition removed. The library's
    # own flow runs the input rails only while a request's options leave them
    # on, so a caller could switch the check off from the request body; with
    # this definition the configuration's flow is the one that runs, and it runs
    # the input rails on every request. It is the only thing that closes that
    # switch: no setting of the server or of the configuration does. It is
    # pinned to the build of the image its closure was proved on, which the
    # Component names beside its infra.image setting; the catalog names no
    # image, and its closure — every body toggle and a caller-named
    # configuration refused, benign requests and streaming unchanged — is
    # re-proved at every upgrade of the NeMo Guardrails component and for every
    # other image a Release sets there. The Helm Recipe carries the same flow.
    #
    # Every $ the guard is to read is written $$ in both files: Compose reads $
    # in the file it is given as the start of a variable of its own, and $$ is
    # how that file spells a literal $, so the guard is handed the flow's
    # variables and the rail's parameter as written. Apart from that, the bodies
    # are the ones the Kubernetes realization carries in its ConfigMap, line for
    # line.
    #
    # The configuration names one detector address, so a second detector wired
    # to the socket would leave one of them unused without saying which. The
    # edges are counted here, where each carries its socket, and the build halts
    # on a second one; a halting check elsewhere sees one edge per socket.
    #
    # This realization writes the classifier rail alone. The NemoGuard rails
    # the Kubernetes realization writes for the content_safety and
    # jailbreak_detection sockets are not written here, so the build halts when
    # either socket holds a connection rather than deploying a guard without the
    # check it was wired for.
    nemo-guardrails-config.compose-fragment.yaml: |
      {{- $detector := dict -}}
      {{- $wired := 0 -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if eq $edge.socket "detector" -}}{{- $detector = $edge -}}{{- $wired = add1 $wired -}}{{- end -}}
      {{- if or (eq $edge.socket "content_safety") (eq $edge.socket "jailbreak_detection") -}}
      {{- fail (printf "the guard's %s socket is wired to %q, but the Docker Compose realization of core/security/nemo-guardrails writes the classifier rail alone and no NemoGuard rail; build the guard for Kubernetes with helm/nemo-guardrails, or remove the connection" $edge.socket $edge.target) -}}
      {{- end -}}
      {{- end -}}
      {{- if gt $wired 1 -}}
      {{- fail (printf "%d components are wired to the guard's detector socket, but its classifier rail calls one detector; wire a single core/security/trustyai-huggingface-detector to detector" $wired) -}}
      {{- end -}}
      configs:
        {{ .locals.config_name }}:
          content: |
      {{- if hasKey (default dict .features) "upstream_key" }}
            models:
              - type: main
                engine: openai
                model: named-by-each-request
                api_key_env_var: {{ .locals.upstream_key_variable }}
      {{- end }}
            passthrough: true
            rails:
              config:
                hf_classifier:
                  {{ .locals.classifier_name }}:
                    engine: fms
                    model: {{ $detector.provides.model | toJson }}
                    base_url: {{ $detector.provides.endpoint | toJson }}
                    threshold: {{ .values.threshold }}
                    blocked_labels: {{ .values.blocked_labels | toJson }}
              input:
                flows:
                  - hf classifier check input $$classifier={{ .locals.classifier_name }}
        {{ .locals.flow_config_name }}:
          content: |
            # Redefines the library's "process user input" with its
            # generation-options condition removed, so the input rails run on
            # every request. Re-prove at every upgrade of the image.
            define parallel flow process user input
              """Run all the input rails on the user input."""
              event UtteranceUserActionFinished(final_transcript="...")
              $$user_message = $$event["final_transcript"]

              # If we have input rails, we run them, otherwise we just create the user message event
              if $$config.rails.input.flows
                # Create a marker event.
                create event StartInputRails
                event StartInputRails

                # Run all the input rails
                # This can potentially alter the $$user_message
                do run input rails

                # Create a marker event.
                create event InputRailsFinished
                event InputRailsFinished

              create event UserMessage(text=$$user_message)
  # Synthesized-mode Workload: the compose provider translates it into one
  # service running the image in infra.image. The upstream address is handed to
  # the guard through the MAIN_MODEL_BASE_URL variable it reads, from
  # infra.upstream_endpoint.
  #
  # Compose has no env-from-secret primitive, so an attached upstream_key
  # credential arrives on the inject pipe and is rendered as a plain
  # environment variable, under the name config.yaml names on the main model —
  # which is therefore also the key the attached credential must publish
  # under; unattached, config.yaml names no credential and the guard presents
  # none.
  #
  # The guard's one healthcheck asks its health route with the curl the image
  # carries. The service entry publishes no port on the host: callers sit on the
  # same compose network, and a guard that authenticates no caller is kept off
  # the host's interfaces.
  workload: |
    {{- $keyVar := .locals.upstream_key_variable -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The image's own start-up is kept: it checks that the configuration is
        # in place and starts the server on it. It reads the configuration id and
        # the port from these two variables. The server reads the upstream's
        # address and API dialect from the other two. With the upstream_key slot
        # attached, the credential is rendered from the inject pipe under the
        # variable config.yaml names; no credential value is authored here.
        variables:
          CONFIG_ID: "{{ .locals.config_id }}"
          PORT: "{{ .infra.port }}"
          MAIN_MODEL_ENGINE: openai
          MAIN_MODEL_BASE_URL: "{{ .infra.upstream_endpoint }}"
    {{- if hasKey (default dict .features) "upstream_key" }}
          {{ $keyVar }}: "{{ index .context.inject.env $keyVar | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # A compose service keeps one healthcheck and it runs inside the image,
        # which carries curl and a shell. The product documents GET /v1/health as
        # its health check, answered while the server can serve a request.
        health:
          ready:
            http: /v1/health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        # Each config is one file, mounted at the path the start-up reads.
        volumeMounts:
          - name: config
            path: "{{ .locals.config_dir }}/config.yaml"
          - name: flow
            path: "{{ .locals.config_dir }}/rails.co"
    volumes:
      config:
        configmap:
          source: "{{ .locals.config_name }}"
      flow:
        configmap:
          source: "{{ .locals.flow_config_name }}"
    # A ClusterIP service entry keeps the guard internal to the compose network,
    # where its callers sit. Nothing is published to the host.
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
