apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: presidio-anonymizer
  version: 1.0.0
  license: MIT
  description: >
    The Presidio anonymizer for local development via Docker Compose.
    Synthesized-mode Workload: the compose provider translates it into one
    service running the vendor's published image, with the listen port handed
    to the image through the PORT variable it reads. The service keeps no state,
    so it mounts no volume. Its one healthcheck is the image's own — curl
    against /health, which the image carries — with the timings the image
    declares. The service entry publishes no port on the host: callers sit on
    the same compose network, and a service that authenticates no caller is
    kept off the host's interfaces. provides.host is the compose service name,
    which a consumer on that network resolves directly, and the published
    contract is key for key the one the Kubernetes realization publishes. The
    image is published under the MIT licence.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/security/presidio-anonymizer:1.0.0
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, and below the PORT variable the image listens on,
  # the container port and the service entry; the literal is never repeated.
  #
  # host is the name the compose provider gives the synthesized service, which is
  # the component instance's own name. host and endpoint spell it out twice on
  # purpose: a provides entry cannot read another provides entry, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "ghcr.io/data-privacy-stack/presidio-anonymizer:{{ .infra.engine_version }}"
        variables:
          PORT: "{{ .infra.port }}"
        ports:
          http: {{ .infra.port }}
        # A compose service keeps one healthcheck and it runs inside the image,
        # which carries curl and a shell for exactly this check: GET /health
        # every 30 s with a 3 s timeout, after the 30 s start period the image
        # itself declares.
        health:
          ready:
            http: /health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
