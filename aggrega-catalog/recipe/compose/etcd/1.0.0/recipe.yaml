apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: etcd
  version: 1.0.0
  license: Apache-2.0
  description: >
    Single-node etcd for local development via Docker Compose. Synthesized-mode
    Workload: the compose provider translates the Workload kind into a service
    entry (image, environment, client and peer ports, a named volume for the
    data directory). etcd holds its data on the named volume and serves the v3
    client API over HTTP without authentication. Its own metrics, in the
    Prometheus format at /metrics on the client port, are published as
    provides.metrics_endpoint. provides.host is the bare service name, resolved
    on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/etcd:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # metrics_endpoint is the address etcd serves its own metrics at, in the
  # Prometheus format: /metrics on the client listener, always on and asking no
  # credential, since no authentication is configured. It is spelled out in
  # full on purpose: a provides entry cannot read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.client_port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.instance_id }}:{{ .infra.client_port }}/metrics"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The default form plus a named volume carries the single-node data
    # directory. The client and peer URLs advertise the
    # bare compose service name so the member reaches itself at a stable address
    # on the compose network, and the initial cluster names the one member and
    # bootstraps a new cluster on first start.
    replicas: 1
    containers:
      main:
        image: "quay.io/coreos/etcd:{{ .infra.engine_version }}"
        variables:
          ETCD_NAME: "{{ .values.name }}"
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:{{ .infra.client_port }}"
          ETCD_ADVERTISE_CLIENT_URLS: "http://{{ .context.instance_id }}:{{ .infra.client_port }}"
          ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:{{ .infra.peer_port }}"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://{{ .context.instance_id }}:{{ .infra.peer_port }}"
          ETCD_INITIAL_CLUSTER: "{{ .values.name }}=http://{{ .context.instance_id }}:{{ .infra.peer_port }}"
          ETCD_INITIAL_CLUSTER_STATE: "new"
          ETCD_DATA_DIR: "/etcd-data"
          ETCD_AUTO_COMPACTION_RETENTION: "{{ .infra.auto_compaction_retention }}"
    {{- if .infra.quota_backend_bytes }}
          ETCD_QUOTA_BACKEND_BYTES: "{{ .infra.quota_backend_bytes }}"
    {{- end }}
        ports:
          client: {{ .infra.client_port }}
          peer: {{ .infra.peer_port }}
        # The image carries no shell, curl or nc, so the service's healthcheck
        # runs the image's own etcdctl: `endpoint health` reports the member
        # unhealthy when it cannot take part in consensus, asked on the client
        # port. A service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - etcdctl
              - "--endpoints=http://127.0.0.1:{{ .infra.client_port }}"
              - endpoint
              - health
            periodSeconds: 10
            timeoutSeconds: 5
        volumeMounts:
          - name: data
            path: /etcd-data
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          client: {{ .infra.client_port }}
          peer: {{ .infra.peer_port }}
