apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: pgvector
  version: 1.0.0
  license: PostgreSQL
  description: >
    pgvector for local development via Docker Compose. Synthesized-mode
    Workload: the compose provider translates the Workload kind into a service
    entry running the pgvector project's own image, with a named data volume and
    the script that enables the extension in the database the server creates on
    its first start. provides.host is the bare service name, resolved on the
    compose network, and the port is also published on the host, so a client on
    the developer's own machine connects to it.

    Reach for this realization for local development; on Kubernetes the
    component is realized by the Helm Recipe of the same name, which
    synthesizes a StatefulSet and needs nothing installed in the target cluster.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/pgvector:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.endpoint joins the same parts into a PostgreSQL connection URI,
  # postgresql://<user>@<host>:<port>/<database>, with no password: the
  # password is what the password slot's credential holds, and it enters no
  # published value. A provides entry cannot read another, so each part is
  # read from the key its own entry reads, and the user and the database are
  # written as given.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    endpoint: "postgresql://{{ .values.user }}@{{ .context.instance_id }}:{{ .infra.port }}/{{ .values.database }}"
  # Two compose configs, each mounted as one file. The first carries the script
  # that enables the extension and is always emitted: the image installs the
  # extension's files and enables it in no database. The image's startup script
  # runs every .sql file under /docker-entrypoint-initdb.d once, against the
  # database POSTGRES_DB names, when the data directory is empty, so the
  # extension is enabled in the component's database on its first start and a
  # database that already holds data is left as it is.
  #
  # The second carries the developer's custom server configuration and is
  # presence-guarded: an Aggregate that leaves custom_config unset emits no
  # config, no configuration mount and no config_file argument.
  #
  # Each config's name is spelled here and again on the volume that mounts it
  # below. The artifact and the workload are separate template strings with no
  # binding either could dereference, so the repetition is forced rather than
  # chosen — the two must be edited together.
  artifacts:
    pgvector-initdb.compose-fragment.yaml: |
      configs:
        {{ .context.instance_id }}-initdb-vector:
          content: |
            CREATE EXTENSION IF NOT EXISTS vector;
    pgvector-config.compose-fragment.yaml: |
      {{- if .values.custom_config }}
      configs:
        {{ .context.instance_id }}-config:
          content: |
      {{ .values.custom_config | indent 6 }}
      {{- end }}
  workload: |
    {{- $configFile := "/etc/postgresql/postgresql.conf" -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "pgvector/pgvector:{{ .infra.engine_version }}"
    {{- if .values.custom_config }}
        # The server arguments are supplied as args rather than as a command, so
        # the image's own startup script still runs: it is what creates the
        # database on an empty data directory, reads the POSTGRES_* variables
        # below and runs the extension script, and it passes these arguments
        # through to the server, where config_file selects the mounted file.
        #
        # $configFile is the single authored home for that path: the config_file
        # argument and the mount that puts the file there both read the binding,
        # so a future move cannot relocate one and leave the other pointing at
        # the old path. It names a file rather than a directory.
        args:
          - postgres
          - -c
          - "config_file={{ $configFile }}"
    {{- end }}
        # POSTGRES_USER / POSTGRES_DB are developer values. POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when attached its
        # value arrives on the inject pipe (an inject-family FeatureRecipe such as
        # dotenv-secret); with none attached the Recipe falls back to an inline
        # development default. POSTGRES_INITDB_ARGS is emitted only when
        # encoding/locale are set. PGPORT carries infra.port: the server takes its
        # listen port from it when none is configured, and so do the image's
        # startup script and pg_isready. Compute sizing is honored here as well as
        # on the Kubernetes target, so the value an operator sets is not silently
        # discarded on the local one.
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if hasKey (default dict .features) "password" }}
          POSTGRES_PASSWORD: "{{ index .context.inject.env "POSTGRES_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
          PGPORT: "{{ .infra.port }}"
    {{- if or .values.encoding .values.locale }}
          POSTGRES_INITDB_ARGS: "{{ with .values.encoding }}--encoding={{ . }}{{ end }}{{ with .values.locale }} --locale={{ . }}{{ end }}"
    {{- end }}
        ports:
          p: {{ .infra.port }}
        # The service's healthcheck runs the image's own pg_isready, which
        # PostgreSQL documents as the check of whether a server is accepting
        # connections, over TCP: while a new database is initialized the image
        # runs a temporary server that listens on its socket only, so a service
        # that depends on this one is started only once the server accepts
        # network connections. The configured user and database are named so that
        # a check is not logged as a failed connection attempt. A service keeps
        # one healthcheck, so one probe is declared; failures in the first 30 s do
        # not count, to cover initialization and the extension script.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        # The data volume is mounted at /var/lib/postgresql, the single mount the
        # PostgreSQL 18 and later builds are laid out for; the server keeps its
        # data in a subdirectory named for the major version. The extension script
        # is mounted as one file in the directory the startup script reads.
        volumeMounts:
          - name: data
            path: /var/lib/postgresql
          - name: initdb-vector
            path: /docker-entrypoint-initdb.d/00-vector-extension.sql
    {{- if .values.custom_config }}
          - name: pgconf
            path: "{{ $configFile }}"
    {{- end }}
    # The server owns a durable volume on this target too. A datastore whose data
    # vanished with its container would be a different thing from the one the
    # Kubernetes target deploys, and a developer testing against it would be
    # testing something else. The declared size is read from the operator's own
    # sizing knob so one Release configures either target.
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
      initdb-vector:
        configmap:
          source: "{{ .context.instance_id }}-initdb-vector"
    {{- if .values.custom_config }}
      pgconf:
        configmap:
          source: "{{ .context.instance_id }}-config"
    {{- end }}
    # NodePort rather than ClusterIP so the port is published on the host, which
    # is what a local-development datastore is for — a client on the developer's
    # own machine connects to it.
    services:
      db:
        type: NodePort
        ports:
          p: {{ .infra.port }}
