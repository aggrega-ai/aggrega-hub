apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai
  version: 1.0.0
  description: >
    OpenAI's managed API as a reference realization for local development: no service runs. compose carries the endpoint and api_key credential to consumers through the injection contract.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/openai:1.0.0
  # provides is self-contained (only .context.instance_id/.values/.infra/.locals/
  # static text), so the fixed managed host is a static constant here; it is
  # repeated in the workload endpoint below and the two must stay in sync.
  provides:
    endpoint: "https://api.openai.com"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "https://api.openai.com"
    port: 443
    credential:
      from: api_key
      env: OPENAI_API_KEY
