apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: replicate
  version: 1.0.0
  description: >
    Replicate's managed prediction API as a reference realization: no compute runs in-cluster. The compiler carries the endpoint to consumers through the injection contract; no service runs. No credential is delivered by this recipe: a consumer that needs one declares it as `credential` on the socket that reaches this endpoint and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/replicate:1.0.0
  # provides is self-contained (only .context.instance_id/.values/.infra/
  # static text), so the fixed managed host is a static constant here; it is
  # repeated in the workload endpoint below and the two must stay in sync.
  provides:
    endpoint: "https://api.replicate.com"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "https://api.replicate.com"
