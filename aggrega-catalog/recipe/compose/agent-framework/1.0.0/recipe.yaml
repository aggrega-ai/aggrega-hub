apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: agent-framework
  version: 1.0.0
  description: >
    An application built on Microsoft Agent Framework, for local development
    via Docker Compose. Synthesized-mode Workload: the image the Release
    supplies and its environment are translated from the Workload kind by the
    compose provider. The model wired into the `model` socket reaches the
    application as the variables Agent Framework's Python OpenAI clients read:
    its endpoint as OPENAI_BASE_URL, its model name as OPENAI_MODEL, and the
    connection's credential as OPENAI_API_KEY. Each tool wired into the
    `tools` socket reaches it under the variables helm/agent-framework names:
    its address as AGGREGA_TOOL_<ALIAS>_URL, or the whole address the
    connection holds as a secret in its place, and the connection's credential
    as AGGREGA_TOOL_<ALIAS>_CREDENTIAL beside the header the tool publishes,
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER.

    Compose has no secret reference, so a secret held on a connection is
    written into the file as it was delivered; a Compose variable reference
    such as ${MODEL_API_KEY} is written as that reference, and Docker Compose
    substitutes it when the stack starts. Two secrets the Release alone
    attaches, a model credential beside a tool credential, both arrive under
    the key value and halt the build naming both; an Aggregate naming
    values.key on one of them avoids it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/agent-framework:1.0.0
  # The variables are named as on helm/agent-framework, so the application
  # reads the same names on either target. The model arrives on the `model`
  # uses-edge, addressed by the developer-chosen alias; the recipe ranges the
  # outbound edges and matches on the socket name to find it.
  #
  # The credential is read from the inject pipe under the key its own
  # attachment delivered it under, values.key, which is value unless the
  # Aggregate names another. A connection carrying none emits no key variable.
  #
  # Each `tools` connection is delivered as on helm/agent-framework, under its
  # alias upper-cased with every hyphen an underscore, each secret read from
  # the inject pipe under its own attachment's values.key: an endpoint secret
  # in place of the endpoint the tool publishes, and the credential with the
  # header beside it only where the tool publishes one.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $features := default dict $edge.features }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- if hasKey $features "credential" }}
          OPENAI_API_KEY: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ index $.context.inject.env $features.endpoint.values.key }}"
    {{- else }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- if optional $edge.provides "credential_header" "" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
