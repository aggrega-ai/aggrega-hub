apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: valkey
  version: 1.0.0
  description: >
    Valkey for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). Used as an in-memory cache with no
    persistence, so no data volume is declared. Authentication is off by
    default; when a password credential is attached its value arrives on the
    env pipe and is rendered as the VALKEY_PASSWORD environment variable.
    Images that read that variable (Bitnami-packaged Valkey) enable
    authentication from it; the plain upstream image expects the password
    through its configuration and ignores the variable.
    provides.host is the bare service name, resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/valkey:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "valkey"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: valkey/valkey:{{ .infra.engine_version }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached its value arrives on the inject
        # pipe as .context.inject.env.VALKEY_PASSWORD. With no credential
        # attached, no auth env is emitted and the cache runs without
        # authentication.
    {{- if .context.inject.env }}
    {{- if .context.inject.env.VALKEY_PASSWORD }}
        variables:
          VALKEY_PASSWORD: "{{ .context.inject.env.VALKEY_PASSWORD }}"
    {{- end }}
    {{- end }}
        ports:
          valkey: {{ .infra.port }}
    services:
      default:
        type: ClusterIP
        ports:
          valkey: {{ .infra.port }}
