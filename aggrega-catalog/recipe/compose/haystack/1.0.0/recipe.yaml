apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: haystack
  version: 1.0.0
  description: >
    A Haystack agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; an attached model
    API key arrives on the inject pipe as OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/haystack:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name, then reads the model recipe's published endpoint and
        # model name. The client SDK reads the base URL and the API key from the
        # environment. Haystack reads no model-name environment variable at all —
        # its OpenAI generator takes the model as a constructor argument and
        # otherwise falls back to a library default — so the model name is
        # delivered as OPENAI_MODEL for the application's own code to read. An
        # env-delivered model name is therefore right here, where the application
        # is the configuration surface and no flow definition competes with it, and
        # inert on a visual platform, whose own flow node carries the model.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # An attached model API key arrives on the inject pipe and renders as
        # OPENAI_API_KEY. Unattached, no
        # key env is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
