apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: ferretdb
  version: 1.0.0
  license: Apache-2.0
  description: >
    A MongoDB-wire-compatible document-database proxy for local development via
    Docker Compose. Synthesized-mode Workload: the compose provider translates
    the Workload kind into a service entry (image, environment, wire port). The
    proxy holds no local state, so no volume is rendered. The PostgreSQL backend
    identity resolved from the `backend` uses-edge (host, port, user, database)
    arrives on .context.inject.env and is composed into the proxy's PostgreSQL
    connection URL; the URL is rendered password-free and the backend password
    is supplied separately on the standard libpq PGPASSWORD environment variable,
    wired through the optional `password` credential slot with an inline
    development default when unattached. provides.host is the bare service name,
    resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/ferretdb:1.0.0
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "mongodb"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "ghcr.io/ferretdb/ferretdb:{{ .infra.engine_version }}"
        variables:
          FERRETDB_LISTEN_ADDR: ":{{ .infra.port }}"
          FERRETDB_POSTGRESQL_URL: "postgres://{{ .context.inject.env.FERRETDB_PG_USER }}@{{ .context.inject.env.FERRETDB_PG_HOST }}:{{ .context.inject.env.FERRETDB_PG_PORT }}/{{ .context.inject.env.FERRETDB_PG_DB }}"
    {{- if hasKey (default dict .secrets) "password" }}
          PGPASSWORD: "{{ .context.inject.env.PGPASSWORD }}"
    {{- else }}
          PGPASSWORD: apppass
    {{- end }}
        ports:
          p: {{ .infra.port }}
    services:
      default:
        type: ClusterIP
        ports:
          p: {{ .infra.port }}
