apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ferretdb
  version: 1.0.0
  license: Apache-2.0
  description: >
    A MongoDB-wire-compatible document-database proxy for local development via
    Docker Compose. Synthesized-mode Workload: the compose provider translates
    the Workload kind into a service entry (image, environment, wire port). The
    proxy holds no local state, so no volume is rendered. The PostgreSQL backend
    identity resolved from the `backend` uses-edge (host, port, user, database)
    arrives on .context.inject.env and is composed into the proxy's PostgreSQL
    connection URL; the URL is rendered password-free and the backend password
    is supplied separately on the standard libpq PGPASSWORD environment variable,
    wired through the optional credential on the `backend` connection with an
    inline development default when none is attached. provides.host is the bare
    service name, resolved on the compose network.

    FERRETDB_DEBUG_ADDR binds FerretDB's debug listener, port 8088, to the
    container's loopback address while `values.metrics_enabled` is false, and
    provides.metrics_endpoint is empty. True, it binds it on every interface,
    and provides.metrics_endpoint publishes its /debug/metrics. While it is on,
    every peer on the compose network reaches that listener with no caller
    check, and beside the metrics it serves /debug/pprof, which takes CPU
    profiles and execution traces on request, /debug/vars, /debug/archive and
    /debug/graphs.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/ferretdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # metrics_endpoint is the address FerretDB serves its own metrics at while
  # values.metrics_enabled is true: /debug/metrics on its debug listener, port
  # 8088, of the service name, which any peer on the compose network reaches
  # once the workload below binds that listener on every interface. It is empty
  # while the value is false, when the workload binds the listener to the
  # container's loopback address.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "mongodb"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}:8088/debug/metrics{{ end }}"
  workload: |
    {{- /* Whether a `backend` connection carries a credential. Its value arrives
           on the inject pipe under the key the credential publishes, PGPASSWORD. */ -}}
    {{- $backendCredential := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}
    {{- $backendCredential = true -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "FERRETDB_PG_HOST" "host" "FERRETDB_PG_PORT" "port" "FERRETDB_PG_USER" "user" "FERRETDB_PG_DB" "database") -}}
    {{- $required := list "backend" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/datastore/ferretdb %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "ghcr.io/ferretdb/ferretdb:{{ .infra.engine_version }}"
        # FerretDB's debug listener, port 8088, serves its metrics at
        # /debug/metrics. The image sets FERRETDB_DEBUG_ADDR to every
        # interface, so the Recipe always writes it: the container's loopback
        # address while values.metrics_enabled is false, and every interface
        # while it is true, so the published metrics address reaches it, and
        # every peer on the compose network reaches it too: it checks no
        # caller, and beside the metrics it serves /debug/pprof, which takes a
        # CPU profile or an execution trace on request, /debug/vars,
        # /debug/archive, a zip holding a ten-second CPU profile and execution
        # trace among other debugging data, and /debug/graphs. On the loopback
        # address no peer reaches it. Compose writes no port for a service a
        # peer reaches on the network, so nothing else is rendered. The
        # healthcheck below pings the wire port and is unaffected.
        variables:
          FERRETDB_LISTEN_ADDR: ":{{ .infra.port }}"
          FERRETDB_POSTGRESQL_URL: "postgres://{{ $env.FERRETDB_PG_USER }}@{{ $env.FERRETDB_PG_HOST }}:{{ $env.FERRETDB_PG_PORT }}/{{ $env.FERRETDB_PG_DB }}"
    {{- if $backendCredential }}
          PGPASSWORD: "{{ index $env "PGPASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else }}
          PGPASSWORD: apppass
    {{- end }}
    {{- if .values.metrics_enabled }}
          FERRETDB_DEBUG_ADDR: ":8088"
    {{- else }}
          FERRETDB_DEBUG_ADDR: "127.0.0.1:8088"
    {{- end }}
        ports:
          p: {{ .infra.port }}
        # The service's healthcheck is the image's own: `ferretdb ping`, which
        # FerretDB documents as behaving like its readiness probe — a
        # MongoDB-protocol ping to the proxy, which also proves the PostgreSQL
        # connection and the DocumentDB extension. The image carries no shell,
        # curl or nc, so the check is the image's own binary. It is stated here so
        # the rendered file shows it and a dependent service is checked every
        # 10 s rather than at the image's own minute interval; failures in the
        # first 30 s do not count, as in the image's own. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - /ferretdb
              - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      default:
        type: ClusterIP
        ports:
          p: {{ .infra.port }}
