apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres
  version: 1.0.0
  description: >
    PostgreSQL for local development via Docker Compose. Synthesized-mode
    Workload: the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). provides.host is the bare service
    name, resolved on the compose network. Bootstrap scripts (init_scripts) and
    a custom server configuration block (custom_config) are both realized: each
    script mounts under /docker-entrypoint-initdb.d and runs once when the
    database first initializes, and the configuration block mounts as the
    postgresql.conf the server's config_file argument points at.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/postgres:1.0.0
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
  # The developer's bootstrap scripts and custom server configuration render as
  # compose configs the server mounts as files. Each half is presence-guarded
  # independently: an Aggregate that leaves a value unset emits no config, no
  # mount and no server argument for it, so it renders as though the key did not
  # exist.
  #
  # init_scripts becomes one config per key, each mounted at its own filename
  # under /docker-entrypoint-initdb.d. The image runs the files it finds there
  # once, in filename order, and only when the data directory is empty — a
  # database that already holds data is left untouched. custom_config becomes
  # the postgresql.conf the server's config_file argument points at; settings
  # the file omits keep their built-in defaults, and listen_addresses is the one
  # worth naming, because its built-in default accepts local connections only —
  # a block that omits it leaves the server unreachable from the other services
  # on the compose network.
  #
  # Each config's name is spelled here and again on the volume that mounts it
  # below. The artifact and the workload are separate template strings with no
  # binding either could dereference, so the repetition is forced rather than
  # chosen — the two must be edited together.
  artifacts:
    postgres-initdb.compose-fragment.yaml: |
      {{- if .values.init_scripts }}
      configs:
      {{- range $name, $content := .values.init_scripts }}
        {{ $.context.instance_id }}-initdb-{{ $name }}:
          content: |
      {{ $content | indent 6 }}
      {{- end }}
      {{- end }}
    postgres-config.compose-fragment.yaml: |
      {{- if .values.custom_config }}
      configs:
        {{ .context.instance_id }}-config:
          content: |
      {{ .values.custom_config | indent 6 }}
      {{- end }}
  workload: |
    {{- $configFile := "/etc/postgresql/postgresql.conf" -}}
    {{- $initDir := "/docker-entrypoint-initdb.d" -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "postgres:{{ .infra.engine_version }}"
    {{- if .values.custom_config }}
        # The server arguments are supplied as args rather than as a command, so
        # the image's own startup script still runs: it is what creates the
        # database on an empty data directory, reads the POSTGRES_* variables
        # below, and runs the bootstrap files. It passes these arguments through
        # to the server, which is where config_file selects the mounted
        # configuration file.
        #
        # $configFile is the single authored home for that path: the config_file
        # argument and the mount that puts the file there both read the binding,
        # so a future move cannot relocate one and leave the other pointing at
        # the old path. It names a file rather than a directory.
        args:
          - postgres
          - -c
          - "config_file={{ $configFile }}"
    {{- end }}
        # POSTGRES_USER / POSTGRES_DB are developer values (configurable, defaults
        # matching the historical inline values). POSTGRES_PASSWORD is wired through
        # the optional `password` credential slot: when attached its value arrives on
        # the inject pipe (an inject-family FeatureRecipe such as dotenv-secret); with
        # none attached the Recipe falls back to an inline development default.
        # storage/compute sizing is a helm-synth concern; the compose flavor reads
        # only the developer/port/version surface.
        # The optional application-user role (the app_user_password slot) stays a
        # helm-target realization: it rides the role-creation script the helm
        # Recipe emits on first initialization, so a compose deployment does not
        # create a separate application role.
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if hasKey (default dict .features) "password" }}
          POSTGRES_PASSWORD: "{{ .context.inject.env.POSTGRES_PASSWORD }}"
    {{- else }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
    {{- if or .values.encoding .values.locale }}
          POSTGRES_INITDB_ARGS: "{{ with .values.encoding }}--encoding={{ . }}{{ end }}{{ with .values.locale }} --locale={{ . }}{{ end }}"
    {{- end }}
        ports:
          p: {{ .infra.port }}
        # The service's healthcheck runs the image's own pg_isready, which
        # PostgreSQL documents as the check of whether a server is accepting
        # connections, over TCP: while a new database is initialized the image
        # runs a temporary server that listens on its socket only, so a service
        # that depends on this one is started only once the server accepts
        # network connections. The image carries no curl or nc, so the check is a
        # command the image does carry. The configured user and database are named
        # so that a check is not logged as a failed connection attempt. A service
        # keeps one healthcheck, so one probe is declared; failures in the first
        # 30 s do not count, to cover initialization and the bootstrap scripts.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
    {{- if or .values.init_scripts .values.custom_config }}
        volumeMounts:
    {{- range $name, $content := .values.init_scripts }}
          - name: "initdb-{{ $name }}"
            path: "{{ $initDir }}/{{ $name }}"
    {{- end }}
    {{- if .values.custom_config }}
          - name: pgconf
            path: "{{ $configFile }}"
    {{- end }}
    {{- end }}
    {{- if or .values.init_scripts .values.custom_config }}
    volumes:
    {{- range $name, $content := .values.init_scripts }}
      "initdb-{{ $name }}":
        configmap:
          source: "{{ $.context.instance_id }}-initdb-{{ $name }}"
    {{- end }}
    {{- if .values.custom_config }}
      pgconf:
        configmap:
          source: "{{ .context.instance_id }}-config"
    {{- end }}
    {{- end }}
    services:
      db:
        type: ClusterIP
        ports:
          p: {{ .infra.port }}
