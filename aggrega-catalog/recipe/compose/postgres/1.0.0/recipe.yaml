apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres
  version: 1.0.0
  description: >
    PostgreSQL for local development via Docker Compose. Synthesized-mode
    Workload: the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). provides.host is the bare service
    name, resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  provider: compose
  implements: core/datastore/postgres:1.0.0
  provides:
    host: "{{ .context.instance_id }}"
    port: 5432
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: postgres:16
        # POSTGRES_USER / POSTGRES_DB are plain configuration. POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when a credential
        # is attached its value arrives on the inject pipe (an inject-family
        # FeatureRecipe such as dotenv-secret); with none attached the Recipe falls
        # back to an inline development default.
        variables:
          POSTGRES_USER: appuser
    {{- if hasKey (default dict .secrets) "password" }}
          POSTGRES_PASSWORD: "{{ .context.inject.env.POSTGRES_PASSWORD }}"
    {{- else }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: appdb
        ports:
          p: 5432
    services:
      db:
        type: ClusterIP
        ports:
          p: 5432
