apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openclaw
  version: 1.0.0
  description: >
    An OpenClaw agent for local development via Docker Compose. Synthesized-mode
    Workload: image and environment are translated from the Workload kind by the
    compose provider. The image carries both the agent and the JSON configuration
    it reads. A model API key attached on the `model` connection arrives on the
    inject pipe as OPENAI_API_KEY, which the agent reads directly. The model
    endpoint published
    by the component wired into the `model` socket is rendered under a name this
    recipe defines, because the agent resolves its endpoint from its configuration
    file rather than from the environment.
    The endpoint and the model name are delivered as OPENCLAW_MODEL_BASE_URL and
    OPENCLAW_MODEL by default; a connection writing an `inject:` block receives
    the names it dictates in their place, as variables or as files mounted at
    the paths it names, while the API key stays.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/openclaw:1.0.0
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides — OPENCLAW_MODEL_BASE_URL and
      OPENCLAW_MODEL, for a model connection — and a connection that writes one
      receives exactly what it dictates instead, read off the inject pipe as a
      map. The API key a credential attached on a model connection carries stays
      on every connection either way, as OPENAI_API_KEY, which the agent reads.
      A dictated env entry becomes a service variable under the name it gives,
      written as the pipe carries it, so Docker Compose substitutes a $ in it as
      in every variable; a dictated file entry becomes a compose config mounted
      as one file at the absolute path it names, its content written with each $
      doubled so the file holds the value itself, and a path that is not
      absolute, or one lying beneath another file's path, is refused. An arg
      entry is refused, because this recipe renders no command line: the
      service's command replaces the image's default, which is the Release's.
      Any other mechanism is refused too. A dictated variable named like one
      this recipe delivers itself, or like the key an attachment's value arrives
      under on the inject pipe, where the attachment's value would take its
      place, halts the build, naming both, since the compiler cannot see the
      names a recipe writes.

      The block reading the connections' inject directives is the one every
      compose Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $slot, $attachment := (default dict $edge.features) }}
    {{- with optional (default dict $attachment.values) "key" "" }}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $_ := set $taken "OPENCLAW_MODEL_BASE_URL" (printf "the %s connection %s, which writes no inject block" $edge.socket $alias) }}
    {{- $_ := set $taken "OPENCLAW_MODEL" (printf "the %s connection %s, which writes no inject block" $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) }}
    {{- end }}
    {{- else if eq $mechanism "file" }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) }}
    {{- end }}
    {{- $_ := set $files $name (optional $pipeFiles $name "") }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name to find it, then reads the model recipe's published
        # endpoint and model name.
        #
        # Both are delivered under names this recipe defines, and the reason is
        # worth stating rather than leaving a reader to infer a framework read
        # that is not there. OpenClaw declares its providers, its per-provider
        # endpoint and its model reference in the JSON configuration file it loads
        # from its state directory; the environment surface it documents carries
        # provider API keys, gateway auth and path overrides, and no endpoint
        # variable at all. So the endpoint and the model reference are delivered
        # for the image's own startup to fold into that configuration, and the
        # named consumer is the image rather than the agent — whoever supplies
        # the image is the same party that supplies the configuration.
        #
        # The API key is the one value that needs no such indirection: the agent
        # reads OPENAI_API_KEY from the environment for its OpenAI provider, so
        # the attached credential is delivered under that name unchanged.
        # Driving a different provider means substituting that provider's own
        # key variable at the attachment, which is an authoring decision rather
        # than a catalog one.
        # OPENCLAW_MODEL_BASE_URL and OPENCLAW_MODEL are defaults: a connection
        # writing an inject block receives the variables it dictates in their
        # place, on its own position among the edges; OPENAI_API_KEY stays.
        # A connection dictating files alone leaves no variable to write, so the
        # variables key is written only with an entry under it.
    {{- $vars := false }}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (not (hasKey $dictating $alias)) }}{{ $vars = true }}{{ end }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}{{ $vars = true }}{{ end }}
    {{- if optional (default dict $edge.inject) "env" dict }}{{ $vars = true }}{{ end }}
    {{- end }}
    {{- if $vars }}
        variables:
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- if not (hasKey $dictating $alias) }}
          OPENCLAW_MODEL_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENCLAW_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
        # A model API key attached on the `model` connection arrives on the
        # inject pipe and renders as OPENAI_API_KEY. A connection carrying no
        # credential emits no key env, and the agent runs against whatever
        # credential its own configuration supplies.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ $.context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
  # The compose configs holding the file entries the connections dictate, one
  # per file and numbered in path order, the names the workload's volumes read.
  # A compose config is written as one file at the path it is mounted at, and
  # Docker Compose substitutes a $ in its content, so each $ is doubled. They
  # are emitted only while a connection dictates a file, so a build with none
  # renders nothing here.
  artifacts:
    openclaw-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
