apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mcp-stdio-bridge
  version: 1.1.0
  # The bridge's own licence. The server it runs is the Release's package,
  # named in infra.stdio_command and fetched when the server starts, so this
  # Recipe pins no server and states no licence for one.
  license: MIT
  description: >
    A Model Context Protocol server published as an npm or PyPI package that
    speaks only stdio, run for local development via Docker Compose behind
    supergateway 4.1.0, which serves it over Streamable HTTP. One service runs
    the bridge image, pinned by digest, for the runtime infra.stdio_runtime
    names, and starts the command line infra.stdio_command names; the launcher
    fetches the package when the server starts. One server process runs per
    client session, at the path /mcp on infra.port, where a consumer on the
    compose network reaches it at the service's name. Where the Release sets
    infra.published_port, that port on the host's loopback address,
    127.0.0.1, forwards to infra.port; unset, nothing is published, and two
    servers that each publish take distinct published_port values. An edge
    from the tool, on a socket the author
    names, delivers the names its `inject:` block dictates into the bridge's
    environment, which the server inherits, or as files from compose configs.

    The server's credentials arrive through the server_env slot: attach
    core/referenced-secret-set mapped to compose/dotenv-secret-set, each
    entry's value a Compose variable reference such as ${GITHUB_TOKEN}, which
    Docker Compose substitutes when the stack starts. An attachment publishing
    only a secret resource's name, or delivering no variable, halts the build.

    Reach for this realization under Docker Compose; reach for
    helm/mcp-stdio-bridge on Kubernetes, for compose/mcp or helm/mcp where the
    server ships as an image serving HTTP, and for compose/mcp-remote where
    someone else already runs it. infra.image, infra.endpoint and the
    component's own `inject:` block are refused here.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-tool/mcp:1.1.0
  # The healthcheck asks the bridge's /healthz endpoint with the wget the image
  # carries; see the workload below. What this realization renders is checked
  # by building it, and the bridge's behaviour is read from its documentation
  # and source at the pinned release.
  #
  # The pins and the paths, each written once here and read by provides and
  # the workload alike.
  #
  # npm_image and pypi_image are supergateway 4.1.0, pinned by tag and by the
  # digest of each image index, so every platform the project publishes
  # resolves to the build read here: the base image runs Node.js 20 with npm
  # and npx, and the -uvx image adds Python 3, uv and uvx. The flags the
  # workload passes are the ones this release registers, so a pin moves only
  # together with them, and infra.image is refused rather than read.
  # DELIBERATE NEAR-DUPLICATE of recipe/helm/mcp-stdio-bridge's locals: a pin
  # sits inside the Recipe that renders it and no catalog kind holds one for
  # two Recipes to share, so the two are moved together.
  #
  # path is where the bridge serves Streamable HTTP, and health_path the
  # endpoint the bridge answers "ok" on while it is up — each passed to the
  # bridge as a flag, so the address published and the address served agree.
  #
  # inject_file_config_prefix begins the name the workload's volumes and the
  # ComposeInjectFiles bundle both give each dictated file's compose config;
  # the bundle stops the build when the two differ.
  locals:
    npm_image: "ghcr.io/supercorp-ai/supergateway:4.1.0@sha256:1938c43538a5308bce07d58028e9de00b7acfecb40b39b059b2f3931800ad910"
    pypi_image: "ghcr.io/supercorp-ai/supergateway:4.1.0-uvx@sha256:660c97d4ee58498f4654e1dc60682f4f4ccab363025c9b8b415d04b4e823025e"
    path: /mcp
    health_path: /healthz
    inject_file_config_prefix: "{{ .context.instance_id }}-file-"
  # The contract is key-for-key the one helm/mcp-stdio-bridge publishes, so a
  # consumer reads the same keys on either target. host is the name the
  # compose provider gives the synthesized service, which is the component
  # instance's own name, and a consumer on the same compose network resolves
  # it directly. credential_header is empty: the bridge reads no credential
  # from a request that reaches it, in any header, so there is none for a
  # consumer to present, and infra.credential_header is not read.
  #
  # The host sees the bridge only where the Release asks: with
  # infra.published_port set, the service entry at the end of the workload
  # publishes it on 127.0.0.1, forwarding to infra.port, so a client on the
  # machine reaches the bridge there and on no other host interface; any
  # process on the machine can reach it, and the bridge checks no caller's
  # credential. Two services cannot publish one host port, which is why two
  # servers in one stack that each publish, on this realization or on
  # compose/mcp, take distinct published_port values. provides is unchanged by
  # it: a consumer on the compose network still reaches the service by name on
  # infra.port.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}{{ .locals.path }}"
    protocol: "http"
    credential_header: ""
  assertions:
    # The server is the Release's, so the catalog holds no command line to
    # fall back to. A Release carrying an input only another realization
    # reads is told which realization reads it by the workload's refusal
    # below, rather than asked for a command line it does not mean to run.
    stdio_command_supplied: >-
      {{- $elsewhere := or (optional .infra "image" "") (optional .infra "endpoint" "") -}}
      {{- if not (or (optional .infra "stdio_command" list) $elsewhere) -}}
      {{- fail "this realization runs a Model Context Protocol server published as a package speaking stdio, and the server is the Release's: set infra.stdio_command to the server's command line, one list item per argument, for example [npx, -y, \"@modelcontextprotocol/server-everything\"]" -}}
      {{- end -}}
    stdio_runtime_supplied: >-
      {{- $elsewhere := or (optional .infra "image" "") (optional .infra "endpoint" "") -}}
      {{- if not (or (optional .infra "stdio_runtime" "") $elsewhere) -}}
      {{- fail "this realization runs the server's command line in the bridge image carrying its launcher, and selects that image from infra.stdio_runtime: set it to npm for a command run with npx, or to pypi for one run with uvx" -}}
      {{- end -}}
    # A key left out of infra.compute takes the component's default, so only a
    # value written empty reaches this check.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets infra.compute.cpu on the tool to an empty value, so the rendered service would carry no CPU limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets infra.compute.memory on the tool to an empty value, so the rendered service would carry no memory limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block.
  #
  # The bridge runs the command line it is handed through /bin/sh, so the
  # workload quotes each item of infra.stdio_command in single quotes — an
  # embedded single quote written as '\'' — and joins them with spaces: the
  # shell then hands the server each item exactly as written, expanding no
  # variable and splitting no word. Docker Compose reads $NAME and ${NAME}
  # anywhere in a compose file as its own variables, and $$ as a literal $, so
  # every $ in what the Release and the developer wrote is doubled and reaches
  # the container as itself.
  #
  # The bridge's flags, all registered by supergateway 4.1.0:
  #   --stdio               the quoted command line;
  #   --outputTransport     streamableHttp, the transport the component's
  #                         tool.aggrega.ai/transport label names;
  #   --stateful            one server process per client session, started
  #                         when the client initializes and stopped when the
  #                         session ends or has been idle for the bridge's
  #                         default of thirty minutes — so a server keeping
  #                         state between calls keeps it for its client;
  #   --port                infra.port;
  #   --streamableHttpPath  locals.path;
  #   --healthEndpoint      locals.health_path.
  # The bridge logs at its default level, which writes each message it relays.
  #
  # The developer's declared effect, timeout and description override reach
  # the container under the names helm/mcp delivers them under, and from the
  # bridge's environment the server inherits them. No product reads these
  # names: they are there for a server's own code to read.
  #
  # The server is the Release's own code, and the component declares no
  # socket, so this recipe derives no variable from a connection: an edge from
  # the tool, on whatever socket the author names, delivers exactly what its
  # inject block dictates — any key the target publishes, under the names the
  # server reads — and an edge writing none delivers nothing. A dictated env
  # entry becomes a variable of the bridge's service under the name it gives,
  # written as the inject pipe carries it, so Docker Compose substitutes a $
  # in it as in every variable, and the server inherits it as it inherits the
  # values above; a dictated file entry becomes a compose config mounted as
  # one file at the absolute path it names in that service, where the server
  # runs, its content written with each $ doubled so the file holds the value
  # itself, and a path that is not absolute, or one lying beneath another
  # file's path, is refused. An arg entry is refused, because the service's
  # arguments are the bridge's flags and the server's own command line is
  # infra.stdio_command, which is the Release's. Any other mechanism is
  # refused too. A dictated variable named like one this recipe delivers
  # itself halts the build, naming both, since the compiler cannot see the
  # names a recipe writes.
  #
  # The server's credentials, from the server_env slot. Docker Compose has no
  # secret reference, so a credential reaches a service only as a value
  # written into the compose file; written as a Compose variable reference,
  # ${NAME}, the file carries the reference and Docker Compose substitutes it
  # when the stack starts. The slot's attachment delivers its variables on the
  # inject pipe through its realization's mapping — compose/dotenv-secret-set
  # one per entry of a core/referenced-secret-set, compose/dotenv-secret one
  # for a core/secret-value — and each becomes a variable of the bridge's
  # service under the name it was delivered under, written as the pipe carries
  # it, so the server inherits it as it inherits the values above. The pipe
  # does not say which attachment delivered an entry, so this recipe delivers
  # every env entry on it that no connection dictates: the server_env
  # attachment's, and those of any other attachment on the component. They
  # follow the connections' entries, so a build carrying no attachment renders
  # no variable beyond the connections' and the recipe's own. Two refusals
  # keep an attachment from being dropped: one whose realization publishes a
  # non-empty name, the locator of a secret resource the server's variables
  # would be read from — core/referenced-secret's and
  # core/referenced-secret-set's Kubernetes realizations publish one, and a
  # Manifest may map either on this target — halts the build naming it, since
  # this target cannot read a resource by name; and one under which no
  # variable reaches the pipe under a name no connection dictates halts it
  # too, since the pipe cannot tell an attachment delivering nothing from one
  # delivering only a name a connection also dictates; such a name, beside
  # names of the attachment's own, carries the attachment's value, which
  # replaces the connection's on the pipe. A delivered variable named like one
  # this recipe delivers itself halts the build as a dictated one does, naming
  # it. compose/dotenv-secret's mapping, keyed by mechanism, is refused by the
  # build only on a component whose own inject block delivers a file, which
  # this realization refuses anyway, so its refusals recommend it without a
  # condition.
  #
  # DELIBERATE NEAR-DUPLICATE of compose/mcp's reading of the server_env slot:
  # the same two refusals and the same delivery, save that compose/mcp counts
  # the names the component's own inject block dictates as dictated, since it
  # delivers that block, recommends compose/dotenv-secret only while that block
  # delivers no file, and names no Kubernetes realization, where this one names
  # helm/mcp-stdio-bridge. It is part of a workload template, and no catalog
  # kind holds part of one for several Recipes to share; a change to one is
  # made to both.
  #
  # The component's own inject block. This realization delivers only what a
  # connection dictates, and none of the component's own values under a name
  # the developer chooses: its MCP_TOOL_* names stay as they are. An entry the
  # developer writes in an inject block on the component itself halts the
  # build, naming the entry and its mechanism, rather than reaching nothing;
  # compose/mcp and helm/mcp deliver such entries.
  #
  # The compose configs holding the file entries the connections dictate come
  # from the ComposeInjectFiles bundle, which compose/mcp, compose/http-request
  # and compose/retrieval import too: one per file, numbered in path order, named <instance>-file-<n>,
  # the names the workload's volumes read, and emitted only while a connection
  # dictates a file, so a build with none renders nothing there. The bundle
  # also reads the component's own inject block, which the workload here
  # refuses, so no file of it reaches the service. The bundle checks that the
  # local inject_file_config_prefix, declared above, is the prefix it names
  # the configs by. The block reading the connections' inject directives in
  # the workload is the one every compose Workload realization of a tool in
  # this catalog declares, differing only in the names each delivers itself
  # and the refusals its own service calls for; a change to it is made to all.
  artifacts:
    mcp-stdio-bridge-files:
      $import: ComposeInjectFiles#/artifacts/Configs
  workload: |
    {{- /* infra.image names the image compose/mcp and helm/mcp run. This
           realization runs the bridge image it pins, so a Release setting the
           key would see it dropped: the build halts naming it instead. */ -}}
    {{- with optional .infra "image" "" -}}
    {{- fail (printf "infra.image of %q is %q, but this realization runs the supergateway bridge image it pins for infra.stdio_runtime and reads no image from the Release; remove infra.image, or map the component to compose/mcp to run that image" $.context.instance_id .) -}}
    {{- end -}}
    {{- /* infra.endpoint names a server someone else runs, which
           compose/mcp-remote reaches; this realization runs its own. */ -}}
    {{- with optional .infra "endpoint" "" -}}
    {{- fail (printf "infra.endpoint of %q is set, but this realization runs the server's command line behind the bridge and reaches no server elsewhere; remove infra.endpoint, or map the component to compose/mcp-remote to reach the server at that address" $.context.instance_id) -}}
    {{- end -}}
    {{- /* The compose target has no secret reference, so a server_env
           attachment whose realization publishes the name of a secret
           resource, for the variables to be read from, would reach the server
           with nothing: the build halts naming it instead. Near-duplicate of
           compose/mcp's check, as the note above the artifacts says. */ -}}
    {{- $serverEnv := optional (default dict .features) "server_env" dict -}}
    {{- with optional (optional $serverEnv "provides" dict) "name" "" -}}
    {{- fail (printf "the server_env slot of %q carries an attachment whose realization publishes %q, the name of a secret resource the server's variables are to be read from, and Docker Compose has no secret reference to read them through: attach core/referenced-secret-set mapped to compose/dotenv-secret-set, writing each entry's value as a Compose variable reference such as ${GITHUB_TOKEN}, or core/secret-value mapped to compose/dotenv-secret, or run the server under helm/mcp-stdio-bridge, which reads the variables from that Secret by reference" $.context.instance_id .) -}}
    {{- end -}}
    {{- range $mechanism, $names := default dict .context.self_inject -}}
    {{- range $name, $key := $names -}}
    {{- fail (printf "the own inject block of %q dictates %q under the delivery mechanism %q, and this realization delivers only what a connection's inject block dictates: remove the inject block from the component, or map the component to compose/mcp, which delivers it, to run the server's image" $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $taken := dict -}}
    {{- $_ := set $taken "MCP_TOOL_SIDE_EFFECTS" "the component's own value side_effects" -}}
    {{- $_ := set $taken "MCP_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" -}}
    {{- $_ := set $taken "MCP_TOOL_PORT" "the component's own infra.port" -}}
    {{- if .values.llm_description_override -}}
    {{- $_ := set $taken "MCP_TOOL_DESCRIPTION" "the component's own value llm_description_override" -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- $dictated := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- $_ := set $dictated $name true -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) -}}
    {{- end -}}
    {{- else if eq $mechanism "file" -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) -}}
    {{- end -}}
    {{- $_ := set $files $name true -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization's service arguments are the bridge's own flags, while the server's command line is infra.stdio_command, which is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- /* The variables the component's attachments delivered: every env
           entry on the pipe that no connection dictates. Near-duplicate of
           compose/mcp's reading, as the note above the artifacts says. */ -}}
    {{- $attached := list -}}
    {{- range $name, $v := $env -}}
    {{- if not (hasKey $dictated $name) -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "an attachment on %q delivers the variable %s, which this realization already delivers from %s: deliver the credential under another name" $.context.instance_id $name .) -}}
    {{- end -}}
    {{- $attached = append $attached $name -}}
    {{- end -}}
    {{- end -}}
    {{- if and (hasKey (default dict .features) "server_env") (not $attached) -}}
    {{- fail (printf "the server_env slot of %q carries an attachment that delivers no variable under a name of its own: it delivers none, or only names a connection's inject block also dictates. Attach core/referenced-secret-set mapped to compose/dotenv-secret-set with at least one entry, or core/secret-value mapped to compose/dotenv-secret, under a name no connection dictates, or remove the attachment" $.context.instance_id) -}}
    {{- end -}}
    {{- $words := list -}}
    {{- range .infra.stdio_command -}}
    {{- $words = append $words (printf "'%s'" (replace "'" "'\\''" .)) -}}
    {{- end -}}
    {{- $line := join " " $words | replace "$" "$$" -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ if eq .infra.stdio_runtime "pypi" }}{{ .locals.pypi_image }}{{ else }}{{ .locals.npm_image }}{{ end }}"
        # The image's entrypoint is the bridge; these are its arguments.
        args:
          - --stdio
          - {{ $line | toJson }}
          - --outputTransport
          - streamableHttp
          - --stateful
          - --port
          - "{{ .infra.port }}"
          - --streamableHttpPath
          - "{{ .locals.path }}"
          - --healthEndpoint
          - "{{ .locals.health_path }}"
        variables:
          MCP_TOOL_SIDE_EFFECTS: "{{ .values.side_effects }}"
          MCP_TOOL_TIMEOUT_SECONDS: "{{ .values.timeout_seconds }}"
          MCP_TOOL_PORT: "{{ .infra.port }}"
          {{- with .values.llm_description_override }}
          MCP_TOOL_DESCRIPTION: {{ . | replace "$" "$$" | toJson }}
          {{- end }}
          {{- range $alias, $edge := .context.uses }}
          {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- end }}
          {{- range $name := $attached }}
          {{ toJson $name }}: {{ toJson (toString (index $env $name)) }}
          {{- end }}
        ports:
          http: {{ .infra.port }}
        # A compose service carries one healthcheck, run inside the image. The
        # image holds no curl, which an http probe would run, but its base
        # carries busybox's wget, so the check is an exec probe fetching the
        # bridge's health endpoint on the loopback; wget exits non-zero unless
        # the bridge answers.
        health:
          ready:
            exec: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:{{ .infra.port }}{{ .locals.health_path }}"]
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
    {{- if $files }}
    volumes:
      {{- $i := 0 }}
      {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.locals.inject_file_config_prefix }}{{ $i }}"
      {{- $i = add $i 1 }}
      {{- end }}
    {{- end }}
    # With infra.published_port set, a Loopback service entry publishes it on
    # the host's loopback address, 127.0.0.1, naming the container port http,
    # which is infra.port, so compose renders 127.0.0.1:<published_port>:<port>
    # and a client on the machine reaches the bridge there and on no other
    # host interface. Unset, a ClusterIP service entry keeps the bridge on the
    # compose network, which is where its consumers sit: a consumer wired to it
    # resolves the service name and the port straight from the edge. Nothing is
    # published to the host. Either way its consumers on the compose network
    # reach it as before.
    services:
      default:
        {{- with optional .infra "published_port" 0 }}
        type: Loopback
        ports:
          http: {{ . }}
        {{- else }}
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
        {{- end }}
