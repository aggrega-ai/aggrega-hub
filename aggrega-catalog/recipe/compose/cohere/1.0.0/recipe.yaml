apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: cohere
  version: 1.0.0
  description: >
    Cohere's managed Command API as a reference realization: no compute runs in-cluster. the compose engine carries the endpoint and credential to consumers through the injection contract; no service runs.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/cohere:1.0.0
  # provides is self-contained (only .context.instance_id/.values/.infra/
  # static text), so the fixed managed host is a static constant here; it is
  # repeated in the workload endpoint below and the two must stay in sync.
  provides:
    endpoint: "https://api.cohere.com"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "https://api.cohere.com"
    credential:
      from: api_key
      env: CO_API_KEY
