apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: search
  version: 1.0.0
  description: >
    The managed web-search API as a reference realization for local development
    with Docker Compose: no service is defined for it and nothing is provisioned,
    because the search API runs outside the composition. What a consumer needs is
    the base address, the provider whose dialect it speaks and how many results
    to ask for, and those reach the consuming service through the injection
    context rather than through a service definition — compose has no counterpart
    to an in-cluster alias, so the address travels to the caller instead of being
    aliased for it.

    This recipe pins no artifact. It names no image — the deployment calls a
    service its own operator contracts for directly.

    No credential is delivered here: a consumer that needs the search API's key
    declares the `credential` slot on the socket that reaches the search API
    and delivers it from its own container, because the environment-variable
    name a credential arrives under belongs to the consumer rather than to the
    endpoint.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-tool/search:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    provider: "{{ .values.provider }}"
    max_results: "{{ .values.max_results }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
