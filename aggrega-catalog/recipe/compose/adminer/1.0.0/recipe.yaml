apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: adminer
  version: 1.0.0
  description: >
    Adminer for local development via Docker Compose. Synthesized-mode
    Workload: image, environment, port, and the exposed service are
    translated from the Workload kind by the compose provider. The
    database host resolved from the `databases` uses-edge arrives on
    .context.inject.env and is rendered verbatim into the service env.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/devtool/adminer:1.0.0

  # The image serves Adminer on 8080, and nothing here moves that listener, so
  # the container port and the healthcheck stay on 8080 whatever port an
  # operator sets. infra.port is the port published on the host. A peer on the
  # compose network, such as a gateway proxying to the UI, connects to this
  # service by name on the container's own port, so provides.port is 8080.
  provides:
    host: "{{ .context.instance_id }}"
    port: "8080"

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "adminer:4"
        variables:
          ADMINER_DESIGN: "{{ .values.design }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          http: 8080
        # Adminer documents no health endpoint, so the service's healthcheck
        # opens a TCP connection to the port the image serves, with the nc the
        # image's busybox provides. A service keeps one healthcheck, so one probe
        # is declared.
        health:
          ready:
            tcp: 8080
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      # NodePort publishes the port to the host so the UI is reachable from a
      # browser. The entry's number, infra.port, is the host side and the
      # container port it names, http on 8080, the container side: compose
      # renders "<infra.port>:8080".
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}
