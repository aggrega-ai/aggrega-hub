apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: adminer
  version: 1.0.0
  description: >
    Adminer for local development via Docker Compose. Synthesized-mode
    Workload: image, environment, port, and the exposed service are
    translated from the Workload kind by the compose provider. The
    database host resolved from the `databases` uses-edge arrives on
    .context.inject.env and is rendered verbatim into the service env.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/devtool/adminer:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ optional .infra `port` 8080 }}"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "adminer:4"
        variables:
          ADMINER_DESIGN: "{{ .values.design }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          http: {{ optional .infra `port` 8080 }}
        # Adminer documents no health endpoint, so the service's healthcheck
        # opens a TCP connection to the service's port, with the nc the image's
        # busybox provides. A service keeps one healthcheck, so one probe is
        # declared.
        health:
          ready:
            tcp: {{ optional .infra `port` 8080 }}
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      # NodePort publishes the port to the host (compose: "host:container")
      # so the UI is reachable from a browser.
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}
