apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: fluentd
  version: 1.0.0
  license: Apache-2.0
  description: >
    Fluentd log aggregator for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. Fluentd is the receiving end: a minimal fluent.conf
    with a `forward` input source bound to the infra port is written at
    start-up, and records whose tag matches the developer's output match are
    routed to standard output. The buffer is in-memory by default; when
    infra.storage.size is set a named volume backs a file buffer. provides.host
    is the bare service name, resolved on the compose network, and provides.port
    is the forward input port upstream forwarders ship records to.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/observability/fluentd:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "forward"

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "fluent/fluentd:{{ .infra.engine_version }}"
        # A minimal fluent.conf is written at start-up: a `forward` input
        # source bound to the infra port receives records from upstream
        # forwarders, and records matching the output match are routed to
        # standard output. Fluentd is then exec'd against that config.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/fluent.conf <<'EOF'
            <source>
                @type forward
                bind 0.0.0.0
                port {{ .infra.port }}
            </source>
            <match {{ .values.output_match }}>
                @type stdout
            {{- if and .infra.storage .infra.storage.size }}
                <buffer>
                    @type file
                    path /fluentd/log/buffer
                </buffer>
            {{- end }}
            </match>
            EOF
            exec fluentd -c /tmp/fluent.conf
        ports:
          forward: {{ .infra.port }}
        # Fluentd documents no health endpoint for its forward input, which
        # listens on a TCP socket for the event stream, so the healthcheck opens
        # a TCP connection to that port. The image carries neither curl nor nc,
        # so the connection is made by the image's own bash. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - bash
              - "-c"
              - "exec 3<>/dev/tcp/127.0.0.1/{{ .infra.port }}"
            periodSeconds: 10
            timeoutSeconds: 5
        {{- if and .infra.storage .infra.storage.size }}
        volumeMounts:
          - name: data
            path: /fluentd/log
        {{- end }}
    {{- if and .infra.storage .infra.storage.size }}
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    {{- end }}
    services:
      default:
        type: NodePort
        ports:
          forward: {{ .infra.port }}
