apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dify-worker
  version: 1.0.0
  # metadata.license is deliberately absent. The Dify platform this Recipe
  # realizes is published under a modified Apache License 2.0 carrying
  # additional conditions, and no single SPDX identifier names those terms; the
  # licensing class sits on the Component's upstream-licensing label. The
  # SPDX header at the top of this file states the terms of the file itself.
  description: >
    The Dify task worker on Docker Compose via the compose provider's Workload
    synthesis: one service running the API server's image under a different
    MODE, taking its work from the Celery broker, so it publishes no port and
    nothing. It reads the same values, connections and credentials as
    helm/dify-worker and writes the same settings.

    Unlike on helm, nothing restarts a service that exits, so a step first
    waits until the backend accepts TCP connections. Each credential is the
    value its attachment delivers, written into the file as delivered, so an
    origin written as a Compose variable reference keeps it out of the file;
    unattached, the pinned development literals are written.

    It halts the build on a credential publishing a secret resource's name, on
    one that delivers no value, and on a cache connection holding a server_ca.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/dify-worker:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # The worker publishes no provides contract: it is reached through the broker
  # rather than over the network, so there is no address for a consumer to read.
  #
  # The backend, cache, vector-store, sandbox, plugin-runtime and proxy
  # identities resolved from the component's uses-edges arrive on
  # .context.inject.env and are translated as helm/dify-worker translates them.
  #
  # Credentials, as compose/dify reads them: each is the value its attachment
  # delivers on this component's inject pipe under the key the attachment names
  # in values.key, written as delivered under the variable helm/dify-worker
  # delivers it on — DB_PASSWORD from the backend connection,
  # CODE_EXECUTION_API_KEY from the sandbox connection, PLUGIN_DAEMON_KEY from
  # the plugin_daemon connection, SECRET_KEY from the secret_key slot and
  # INNER_API_KEY_FOR_PLUGIN from the inner_api_key slot; an attachment naming
  # no key is read under the variable's own name. One whose realization
  # publishes the name of a secret resource halts the build, and so does one
  # under which no value reaches the pipe. Unattached, each falls back to the
  # pinned development literal helm/dify-worker writes.
  workload: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
      DELIBERATE NEAR-DUPLICATE of the same block in helm/dify-worker, and of
      the block every Dify Recipe declares with its own sockets and names: it is
      part of a workload template, and no catalog kind holds part of one for
      several Recipes to share; a change to it is made to all.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "DB_HOST" "host" "DB_PORT" "port" "DB_USERNAME" "user" "DB_DATABASE" "database") "cache" (dict "REDIS_HOST" "host" "REDIS_PORT" "port") "vector_store" (dict "VDB_HOST" "host" "VDB_PORT" "port" "VDB_GRPC_PORT" "grpc_port") "sandbox" (dict "SANDBOX_HOST" "host" "SANDBOX_PORT" "port") "plugin_daemon" (dict "PLUGIN_DAEMON_HOST" "host" "PLUGIN_DAEMON_PORT" "port") "ssrf_proxy" (dict "SSRF_PROXY_HOST" "host" "SSRF_PROXY_PORT" "port") -}}
    {{- $required := list "backend" "cache" "sandbox" "plugin_daemon" "ssrf_proxy" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/dify-worker %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    {{- /*
      The credentials, read off the inject pipe as compose/dify reads its own.
      DELIBERATE NEAR-DUPLICATE of that reading: it is part of a workload
      template, and no catalog kind holds part of one for several Recipes to
      share; a change to it is made to all of the compose Dify Recipes.
    */ -}}
    {{- $attached := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- with optional (default dict $edge.features) "credential" dict -}}
    {{- if eq $edge.socket "backend" }}{{ $_ := set $attached "DB_PASSWORD" (dict "attachment" . "where" (printf "the credential on its backend connection %s" $alias)) }}{{ end -}}
    {{- if eq $edge.socket "sandbox" }}{{ $_ := set $attached "CODE_EXECUTION_API_KEY" (dict "attachment" . "where" (printf "the credential on its sandbox connection %s" $alias)) }}{{ end -}}
    {{- if eq $edge.socket "plugin_daemon" }}{{ $_ := set $attached "PLUGIN_DAEMON_KEY" (dict "attachment" . "where" (printf "the credential on its plugin_daemon connection %s" $alias)) }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- with optional (default dict .features) "secret_key" dict }}{{ $_ := set $attached "SECRET_KEY" (dict "attachment" . "where" "its secret_key slot") }}{{ end -}}
    {{- with optional (default dict .features) "inner_api_key" dict }}{{ $_ := set $attached "INNER_API_KEY_FOR_PLUGIN" (dict "attachment" . "where" "its inner_api_key slot") }}{{ end -}}
    {{- $credentials := dict -}}
    {{- range $var, $slot := $attached -}}
    {{- with optional (optional $slot.attachment "provides" dict) "name" "" -}}
    {{- fail (printf "%s of %q carries an attachment whose realization publishes %q, the name of a secret resource the value is to be read from, and Docker Compose has no secret reference to read it through: map core/referenced-secret to compose/dotenv-referenced-secret in the Manifest, writing its origin as the value or as a Compose variable reference such as ${DIFY_SECRET_KEY}" $slot.where $.context.instance_id .) -}}
    {{- end -}}
    {{- $key := default $var (toString (optional (optional $slot.attachment "values" dict) "key" "")) -}}
    {{- if not (hasKey $env $key) -}}
    {{- fail (printf "%s of %q is attached, but no value reaches this Recipe under %s, the key it is read under, so %s would be written empty: map core/referenced-secret to compose/dotenv-referenced-secret, or core/secret-value to compose/dotenv-secret, in the Manifest" $slot.where $.context.instance_id $key $var) -}}
    {{- end -}}
    {{- $_ := set $credentials $var (toString (index $env $key)) -}}
    {{- end -}}
    {{- /*
      The cache connection over TLS, read as compose/dify reads it (DELIBERATE
      NEAR-DUPLICATE: a change to it is made to every Dify Recipe carrying it).
      A server_ca is refused: Docker Compose has no secret resource to mount.
    */ -}}
    {{- $cacheTLS := false -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "cache" -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- $edgeTLS := has $proto (list "valkey-tls" "redis-tls") -}}
    {{- if $edgeTLS }}{{ $cacheTLS = true }}{{ else if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the cache connection %s of %q reaches %q, which publishes protocol %s, a cache served over TLS that the Dify worker does not reach: it speaks the Redis protocol, over TLS to a cache publishing valkey-tls or redis-tls; wire a Redis-protocol cache to the cache socket" $alias $.context.instance_id $edge.target $proto) -}}
    {{- end -}}
    {{- if hasKey (default dict $edge.features) "server_ca" -}}
    {{- fail (printf "the cache connection %s of %q holds a server_ca, which is mounted as a file from the secret resource it names, and Docker Compose has no secret resource to mount: remove the server_ca, so the worker checks the cache's certificate against the image's default trust store, or map core/ai-agent/dify-worker to helm/dify-worker in the Manifest" $alias $.context.instance_id) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    {{- /*
      The vector-store connection, read as compose/dify reads it (DELIBERATE
      NEAR-DUPLICATE: a change to it is made to every Dify Recipe carrying it).
    */ -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "vector_store" -}}
    {{- $engine := toString (optional (default dict $edge.labels) "datastore.aggrega.ai/engine" "") -}}
    {{- if ne $engine "vector" -}}
    {{- fail (printf "the vector_store connection %s of %q reaches %q, whose datastore.aggrega.ai/engine label is %s, not vector: the Dify worker's two drivers, Weaviate and Qdrant, speak to a vector engine alone; wire a vector store, such as core/datastore/weaviate or core/datastore/qdrant, to the vector_store socket" $alias $.context.instance_id $edge.target (default "absent" $engine)) -}}
    {{- end -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- if and $proto (ne $proto "http") -}}
    {{- fail (printf "the vector_store connection %s of %q reaches %q, which publishes protocol %s, and the Dify worker dials its %s driver at an http:// address, so it would reach that store in plaintext or not at all: wire a store publishing protocol http to the vector_store socket" $alias $.context.instance_id $edge.target $proto (toString $edge.values.engine)) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    {{- $image := printf "langgenius/dify-api:%s" .infra.engine_version -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The worker holds no durable state and opens no listening socket, so the
    # stateless form with no ports and no services is correct.
    form: stateless
    # The wait compose/dify writes, for the same reason: the worker opens the
    # database at start, and on this target nothing starts it again when it
    # exits. DELIBERATE NEAR-DUPLICATE of that wait; a change to it is made to
    # every Recipe carrying it.
    initContainers:
      - name: wait-for-database
        image: "{{ $image }}"
        command: ["/bin/bash", "-c"]
        args:
          - 'limit=300; end=$$SECONDS; ((end += limit)); until timeout 5 bash -c ''exec 3<>"/dev/tcp/$$DB_HOST/$$DB_PORT"'' 2>/dev/null; do if ((SECONDS >= end)); then echo "the database at $$DB_HOST:$$DB_PORT accepted no TCP connection within $$limit s" >&2; exit 1; fi; sleep 2; done; echo "the database at $$DB_HOST:$$DB_PORT accepts TCP connections"'
        variables:
          DB_HOST: {{ toJson (replace "$" "$$" (toString $env.DB_HOST)) }}
          DB_PORT: {{ toJson (replace "$" "$$" (toString $env.DB_PORT)) }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    containers:
      main:
        image: "{{ $image }}"
        # MODE selects the worker role of the shared API image.
        variables:
          MODE: worker
          LOG_LEVEL: "{{ .infra.log_level }}"
          # The API server is the single place the schema upgrade runs.
          MIGRATION_ENABLED: "false"
          CELERY_WORKER_AMOUNT: "{{ .infra.concurrency }}"
          DB_TYPE: postgresql
          DB_HOST: "{{ $env.DB_HOST }}"
          DB_PORT: "{{ $env.DB_PORT }}"
          DB_USERNAME: "{{ $env.DB_USERNAME }}"
          DB_DATABASE: "{{ $env.DB_DATABASE }}"
          REDIS_HOST: "{{ $env.REDIS_HOST }}"
          REDIS_PORT: "{{ $env.REDIS_PORT }}"
          CELERY_BACKEND: redis
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "cache" }}
          REDIS_DB: "{{ $edge.values.db_index }}"
          CELERY_BROKER_URL: "{{ if $cacheTLS }}rediss{{ else }}redis{{ end }}://{{ $env.REDIS_HOST }}:{{ $env.REDIS_PORT }}/{{ $edge.values.broker_db_index }}"
    {{- end }}
    {{- end }}
    {{- if $cacheTLS }}
          REDIS_USE_SSL: "true"
          REDIS_SSL_CERT_REQS: CERT_REQUIRED
    {{- end }}
          # The prefix is the developer's text, so each $ in it is doubled and
          # it reaches the container as authored.
          VECTOR_INDEX_NAME_PREFIX: {{ replace "$" "$$" (toString .values.vector_index_prefix) | toJson }}
          INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "{{ .values.indexing_max_segmentation_tokens }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
          VECTOR_STORE: "{{ $edge.values.engine }}"
    {{- if eq $edge.values.engine "weaviate" }}
          WEAVIATE_ENDPOINT: "http://{{ $env.VDB_HOST }}:{{ $env.VDB_PORT }}"
          WEAVIATE_GRPC_ENDPOINT: "grpc://{{ $env.VDB_HOST }}:{{ $env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- if eq $edge.values.engine "qdrant" }}
          QDRANT_URL: "http://{{ $env.VDB_HOST }}:{{ $env.VDB_PORT }}"
          QDRANT_GRPC_PORT: "{{ $env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- end }}
    {{- end }}
          CODE_EXECUTION_ENDPOINT: "http://{{ $env.SANDBOX_HOST }}:{{ $env.SANDBOX_PORT }}"
          PLUGIN_DAEMON_URL: "http://{{ $env.PLUGIN_DAEMON_HOST }}:{{ $env.PLUGIN_DAEMON_PORT }}"
          SSRF_PROXY_HTTP_URL: "http://{{ $env.SSRF_PROXY_HOST }}:{{ $env.SSRF_PROXY_PORT }}"
          SSRF_PROXY_HTTPS_URL: "http://{{ $env.SSRF_PROXY_HOST }}:{{ $env.SSRF_PROXY_PORT }}"
          # Each credential as delivered, or the development literal
          # helm/dify-worker writes when nothing is attached.
          DB_PASSWORD: {{ optional $credentials "DB_PASSWORD" "apppass" | toJson }}
          CODE_EXECUTION_API_KEY: {{ optional $credentials "CODE_EXECUTION_API_KEY" "dify-sandbox" | toJson }}
          PLUGIN_DAEMON_KEY: {{ optional $credentials "PLUGIN_DAEMON_KEY" "dify-plugin-daemon-server-key" | toJson }}
          INNER_API_KEY_FOR_PLUGIN: {{ optional $credentials "INNER_API_KEY_FOR_PLUGIN" "dify-plugin-inner-api-key" | toJson }}
    {{- if hasKey $credentials "SECRET_KEY" }}
          SECRET_KEY: {{ $credentials.SECRET_KEY | toJson }}
    {{- end }}
        # Dify's own Compose file ships the worker's healthcheck switched off and
        # helm/dify-worker declares no probe, so no healthcheck is declared.
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
