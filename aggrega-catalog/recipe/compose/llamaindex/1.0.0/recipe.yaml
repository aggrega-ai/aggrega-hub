apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: llamaindex
  version: 1.0.0
  description: >
    A LlamaIndex agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; a model API key
    attached on the `model` connection arrives on the inject pipe as
    OPENAI_API_KEY.
    The model name is delivered as OPENAI_MODEL by default; a connection writing
    an `inject:` block receives the names it dictates in its place, as variables
    or as files mounted at the paths it names, while OPENAI_BASE_URL and the API
    key stay.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/llamaindex:1.0.0
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides — OPENAI_MODEL, for a model connection
      — and a connection that writes one receives exactly what it dictates
      instead, read off the inject pipe as a map. Two deliveries stay on every
      connection either way: OPENAI_BASE_URL, which the client SDK reads by
      itself, and the API key a credential attached on a model connection
      carries. A dictated env entry becomes a service variable under the name it
      gives, written as the pipe carries it, so Docker Compose substitutes a $
      in it as in every variable; a dictated file entry becomes a compose config
      mounted as one file at the absolute path it names, its content written
      with each $ doubled so the file holds the value itself, and a path that is
      not absolute, or one lying beneath another file's path, is refused. An arg
      entry is refused, because this recipe renders no command line: the
      service's command replaces the image's default, which is the Release's.
      Any other mechanism is refused too. A dictated variable named like one
      this recipe delivers itself, or like the key an attachment's value arrives
      under on the inject pipe, where the attachment's value would take its
      place, halts the build, naming both, since the compiler cannot see the
      names a recipe writes.

      The block reading the connections' inject directives is the one every
      compose Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $slot, $attachment := (default dict $edge.features) }}
    {{- with optional (default dict $attachment.values) "key" "" }}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint the client SDK reads under that name" $alias) }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $_ := set $taken "OPENAI_MODEL" (printf "the %s connection %s, which writes no inject block" $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) }}
    {{- end }}
    {{- else if eq $mechanism "file" }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) }}
    {{- end }}
    {{- $_ := set $files $name (optional $pipeFiles $name "") }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name, then reads the model recipe's published endpoint and
        # model name. The client SDK reads the base URL and the API key from the
        # environment. LlamaIndex reads no model-name environment variable at all —
        # its OpenAI LLM takes the model as a constructor argument and otherwise
        # falls back to a library default — so the model name is delivered as
        # OPENAI_MODEL for the application's own code to read. An env-delivered
        # model name is therefore right here, where the application is the
        # configuration surface and no flow definition competes with it, and inert
        # on a visual platform, whose own flow node carries the model.
        # OPENAI_MODEL is a default: a connection writing an inject block
        # receives the variables it dictates in its place, on its own position
        # among the edges.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if not (hasKey $dictating $alias) }}
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
        # A model API key attached on the `model` connection arrives on the
        # inject pipe and renders as OPENAI_API_KEY. A connection carrying no
        # credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ $.context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
  # The compose configs holding the file entries the connections dictate, one
  # per file and numbered in path order, the names the workload's volumes read.
  # A compose config is written as one file at the path it is mounted at, and
  # Docker Compose substitutes a $ in its content, so each $ is doubled. They
  # are emitted only while a connection dictates a file, so a build with none
  # renders nothing here.
  artifacts:
    llamaindex-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
