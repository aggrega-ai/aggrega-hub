apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: n8n
  version: 1.0.0
  description: >
    The n8n automation platform for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the data volume, and the
    exposed port are translated from the Workload kind by the compose provider.
    The platform's data directory is a named volume, so the workflows and the
    credentials authored in the editor survive a restart; state written anywhere
    else in the container does not. The volume is the only home for authored state
    on this target — nothing re-creates it. The model endpoint wired into the
    `model` socket is rendered as OPENAI_BASE_URL and an attached model API key as
    OPENAI_API_KEY, both read by workflow expressions via n8n's $env. Which model a
    workflow calls is selected in the workflow's own node. The environment carries
    no model name, so there is no model name for a workflow expression to read
    through $env either. Automated workflow seeding is realized by the helm target
    only, which carries the definition in a ConfigMap an init container imports on
    start. Compose runs an init step, but has no way to carry the definition to it,
    so this target seeds no workflow and does not read
    `values.flow_definition`: a definition supplied against compose is accepted
    by the component's schema and has no effect on the rendered output.
    On compose the workflow is authored or imported through the n8n editor.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/n8n:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name, then reads the model
        # recipe's published endpoint. n8n workflow expressions read it via $env.
        # An attached model API key arrives on the inject pipe and renders as
        # OPENAI_API_KEY (compose has no secretKeyRef primitive).
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 5678
        volumeMounts:
          - name: data
            path: /home/node/.n8n
    volumes:
      data:
        # The data directory holds the workflows and credentials authored in the
        # editor, and this target has no import step to re-create them, so the
        # volume must outlive the container.
        # The size is a literal rather than a knob on the component's surface: the
        # compose target has no volume-size concept and drops the value, and no
        # other target of this component declares a persistent volume, so a
        # component-level size field would be a surface with nothing reading it.
        persistent:
          size: 2Gi
    services:
      default:
        type: ClusterIP
        ports:
          http: 5678
