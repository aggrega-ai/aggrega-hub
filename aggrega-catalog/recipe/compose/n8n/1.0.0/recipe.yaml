apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: n8n
  version: 1.0.0
  description: >
    The n8n automation platform for local development via Docker Compose,
    synthesized from the Workload kind by the compose provider. The data
    directory is a named volume, the only home of the workflows and the
    credentials authored in the editor, which survive a restart; state written
    anywhere else in the container does not.

    A workflow definition, when supplied on `values.flow_definition`, is
    carried in a compose config and imported by an init service with
    `n8n import:workflow` before the platform starts, on every start, so it is
    applied again rather than seeded once; with none, neither is rendered.

    The model wired into the `model` socket arrives as OPENAI_BASE_URL and its
    key as OPENAI_API_KEY. Each tool and vector store wired into the `tools`
    and `vector_store` sockets arrives under the variables helm/n8n names: its
    address as AGGREGA_TOOL_<ALIAS>_URL, or the whole address the connection
    holds as a secret in its place, or AGGREGA_VECTOR_STORE_<ALIAS>_URL, and
    its credential as AGGREGA_TOOL_<ALIAS>_CREDENTIAL, beside
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER, or
    AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL, written into the file as it was
    delivered.

    N8N_BLOCK_ENV_ACCESS_IN_NODE is true unless the component's
    allow_env_access_in_nodes value is true, so a workflow reads these values
    through $env only then. `infra.external_base_url`, where set, becomes the
    editor address and the webhook base.

    With `values.metrics_enabled` true, N8N_METRICS turns n8n's metrics on, at
    /metrics on port 5678, which answers that path without a sign-in and which
    any peer on the compose network reaches, and provides.metrics_endpoint
    publishes the address; false, that key is empty.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/n8n:1.0.0
  # metrics_endpoint is the address n8n serves its own metrics at while
  # values.metrics_enabled is true: /metrics on the main port 5678 of the
  # service, named after the component instance and resolved on the compose
  # network, where any peer reaches the port with nothing published to the
  # host. It is empty while the value is false, when the metrics are off.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}:5678/metrics{{ end }}"
  # The workflow definition is authored by the developer on .values. When present
  # it renders a compose config the seeding init container mounts as a file;
  # presence-guarded so an Aggregate supplying no definition emits no config and
  # no init service, byte-identical to a bare deploy.
  #
  # Docker Compose substitutes $NAME and ${NAME} anywhere in the file's values,
  # a config's content included, and reads $$ as one literal $. So the
  # definition is written with every $ doubled, and the import reads it as
  # authored, its $env and $json expressions intact.
  #
  # The config's name is spelled here and again on the `flow` volume below. The
  # artifact and the workload are separate template strings with no binding either
  # could dereference, so the repetition is forced rather than chosen — the two
  # must be edited together.
  #
  # How the platform reconciles a re-import against a workflow already present
  # in its data directory is the platform's own behaviour.
  artifacts:
    n8n-flow.compose-fragment.yaml: |
      {{- if .values.flow_definition }}
      configs:
        {{ .context.instance_id }}-flow:
          content: |
      {{ .values.flow_definition | replace "$" "$$" | indent 6 }}
      {{- end }}
  workload: |
    {{- $dataPath := "/home/node/.n8n" -}}
    {{- $seedFile := "/flows/workflow.json" -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    {{- if .values.flow_definition }}
    # Seed the supplied workflow before the platform starts. The init container
    # imports the flow from the mounted config into the n8n data directory the
    # main container serves from (both mount the shared data volume).
    # $seedFile is the single authored home for the seed file: the import argument
    # and the mount that puts the file there both read it, so a future move cannot
    # relocate one and leave the other pointing at the old path. It names a file
    # rather than a directory because this target delivers a configmap volume as
    # one file at the mount path, so the mount path is the file the import reads.
    initContainers:
      - name: import-flow
        image: "{{ .infra.image }}"
        command: ["n8n"]
        args: ["import:workflow", "--input={{ $seedFile }}"]
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
          - name: flow
            path: "{{ $seedFile }}"
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Both this container's mount and the seeding init container's
        # mount read the binding — they have to name the same directory for an
        # imported workflow to be visible to the platform — so a future move
        # cannot relocate one and leave the other behind.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name, then reads the model
        # recipe's published endpoint. Which model a workflow calls is selected
        # in the workflow's own node, and the environment carries no model name.
        # A model API key attached on the `model` connection arrives on the
        # inject pipe and renders as OPENAI_API_KEY, read under the key its own
        # attachment delivered it under, values.key, which is value unless the
        # Aggregate names another; an attachment naming no key is read under
        # OPENAI_API_KEY.
        # N8N_BLOCK_ENV_ACCESS_IN_NODE is delivered as on helm/n8n: "true"
        # while the component's allow_env_access_in_nodes value is false, its
        # default, and "false" only where an Aggregate sets that value true. A
        # workflow reads the model, tool and store values through $env only in
        # the second case, which opens every variable of the platform's
        # environment, the credentials included, to every workflow.
        # Each `tools` and `vector_store` connection is delivered as on
        # helm/n8n, under its alias upper-cased with every hyphen an underscore,
        # each secret read from the inject pipe under its own attachment's
        # values.key: a tool's endpoint secret in place of the endpoint the tool
        # publishes, its credential with the header beside it only where the
        # tool publishes one, and a store's credential beside the address the
        # store publishes or the one composed from its protocol, host and port.
        # A store that also publishes a database and a user is delivered in
        # parts as well, AGGREGA_VECTOR_STORE_<ALIAS>_HOST, _PORT, _DATABASE and
        # _USER, for the Postgres credential helm/n8n describes.
        # Two secrets the Release alone attaches both arrive under the key value
        # and halt the build naming both; an Aggregate naming values.key on one
        # of them avoids it.
        # With infra.external_base_url set, the platform's editor address and
        # its webhook base are both that address. The webhook base is written
        # under both names the platform has read it by: N8N_WEBHOOK_URL, which a
        # build that reads it prefers, and WEBHOOK_URL, the only name an earlier
        # build reads — the image is the Release's, so either kind may run. A
        # build that reads the newer name logs a deprecation notice for the
        # older one at start-up. Unset, none of the three is emitted.
        # N8N_METRICS is delivered as on helm/n8n, only while
        # values.metrics_enabled is true.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- with .infra.external_base_url }}
          N8N_EDITOR_BASE_URL: "{{ . }}"
          N8N_WEBHOOK_URL: "{{ . }}"
          WEBHOOK_URL: "{{ . }}"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
    {{- $credentialKey := optional $edge.features.credential.values "key" "" }}
          OPENAI_API_KEY: "{{ if $credentialKey }}{{ index $.context.inject.env $credentialKey }}{{ else }}{{ $.context.inject.env.OPENAI_API_KEY }}{{ end }}"
    {{- end }}
    {{- end }}
    {{- if optional .values "allow_env_access_in_nodes" false }}
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    {{- else }}
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    {{- end }}
    {{- if .values.metrics_enabled }}
          N8N_METRICS: "true"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ index $.context.inject.env $features.endpoint.values.key }}"
    {{- else }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- if optional $edge.provides "credential_header" "" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- $url := optional $edge.provides "endpoint" "" }}
    {{- if not $url }}
    {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
    {{- end }}
          AGGREGA_VECTOR_STORE_{{ $name }}_URL: "{{ $url }}"
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
          AGGREGA_VECTOR_STORE_{{ $name }}_HOST: "{{ $edge.provides.host }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_PORT: "{{ $edge.provides.port }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_DATABASE: "{{ $edge.provides.database }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_USER: "{{ $edge.provides.user }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_VECTOR_STORE_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- end }}
    {{- end }}
    {{- end }}
        ports:
          http: 5678
        # The platform documents GET /healthz/readiness, which answers once its
        # database is connected and migrated. The check runs inside the image the
        # Release names; the platform's own published image carries busybox wget
        # and no curl, so the probe runs wget directly. The timing is the
        # platform's own Helm chart's readiness probe. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - wget
              - -q
              - --spider
              - "http://127.0.0.1:5678/healthz/readiness"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    volumes:
      data:
        # The data directory holds the workflows and credentials authored in the
        # editor. The seeding step re-imports only the supplied definition, so
        # everything else authored here has no other home and the volume must
        # outlive the container.
        # The size is a literal: the component's infra.storage.size is read by
        # the n8n-chart Recipe alone, and this Recipe reads nothing there.
        persistent:
          size: 2Gi
    {{- if .values.flow_definition }}
      flow:
        configmap:
          source: "{{ .context.instance_id }}-flow"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 5678
