apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: n8n
  version: 1.0.0
  description: >
    The n8n automation platform for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the data volume, and the
    exposed port are translated from the Workload kind by the compose provider.
    The model endpoint wired into the `model` socket is rendered as OPENAI_BASE_URL
    and an attached model API key as OPENAI_API_KEY, both read by workflow
    expressions via n8n's $env. Automated workflow seeding (the helm target's
    init-import of a supplied flow definition) is not available on compose, which
    has no init-step or config-resource primitive; on compose the workflow is
    authored or imported through the n8n editor.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/n8n:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name, then reads the model
        # recipe's published endpoint and model name. n8n workflow expressions read
        # these via $env. An attached model API key arrives on the inject pipe and
        # renders as OPENAI_API_KEY (compose has no secretKeyRef primitive).
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 5678
        volumeMounts:
          - name: data
            path: /home/node/.n8n
    volumes:
      data:
        ephemeral: {}
    services:
      default:
        type: ClusterIP
        ports:
          http: 5678
