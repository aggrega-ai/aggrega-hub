apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: openai-embedding
  version: 1.0.0
  description: >
    OpenAI's managed embeddings API as a reference realization for local development: no service runs. The compiler carries the endpoint to consumers through the injection contract. No credential is delivered by this recipe: a consumer that needs one declares it as `credential` on the socket that reaches this endpoint and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/openai-embedding:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
