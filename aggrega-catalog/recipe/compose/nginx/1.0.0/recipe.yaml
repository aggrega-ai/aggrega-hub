apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nginx
  version: 1.0.0
  description: >
    NGINX reverse-proxy gateway for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. The upstream host and port resolved from the
    `upstream` uses-edge arrive on .context.inject.env and are written into a
    minimal NGINX server configuration whose proxy_pass forwards matching
    requests to that upstream. provides.host is the bare service name, resolved
    on the compose network.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/gateway/nginx:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "nginx:{{ .infra.engine_version }}"
        # The upstream target resolved from the `upstream` uses-edge arrives on
        # the inject pipe (.context.inject.env). It is written into the NGINX
        # server config at start-up and forwarded via proxy_pass.
        command:
          - /bin/sh
          - -c
          - "echo 'server { listen {{ .infra.port }}; location {{ .values.upstream_path }} { proxy_pass http://{{ .context.inject.env.NGINX_UPSTREAM_HOST }}:{{ .context.inject.env.NGINX_UPSTREAM_PORT }}; } }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
        ports:
          http: {{ .infra.port }}
        # NGINX documents no health endpoint, and the one location this server
        # configures is forwarded to the upstream, so the service's healthcheck
        # opens a TCP connection to the port the server listens on, with the nc
        # the image's busybox provides. A service keeps one healthcheck, so one
        # probe is declared.
        health:
          ready:
            tcp: {{ .infra.port }}
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
