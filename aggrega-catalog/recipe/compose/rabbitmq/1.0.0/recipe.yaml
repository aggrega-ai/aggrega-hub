apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: rabbitmq
  version: 1.0.0
  description: >
    RabbitMQ for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, ports, exposed service). RabbitMQ always authenticates, so
    the application user and password are always emitted: the user comes from
    the developer value and the password from the optional `password`
    credential slot when attached, falling back to a deterministic inline
    development default otherwise so the render stays reproducible. The image
    is management-enabled, so the broker exposes both the AMQP port and the
    management dashboard. provides.host is the bare service name, resolved on
    the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/messaging/rabbitmq:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "amqp"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "rabbitmq:{{ .infra.engine_version }}"
        # The application user is always provisioned. Its password comes from
        # the optional `password` credential slot when attached (arriving on
        # the inject pipe as .context.inject.env.RABBITMQ_PASSWORD); with no
        # credential attached the Recipe emits a deterministic inline
        # development default so the render stays reproducible.
        variables:
          RABBITMQ_DEFAULT_USER: "{{ .values.username }}"
    {{- if and .context.inject.env .context.inject.env.RABBITMQ_PASSWORD }}
          RABBITMQ_DEFAULT_PASS: "{{ .context.inject.env.RABBITMQ_PASSWORD }}"
    {{- else }}
          RABBITMQ_DEFAULT_PASS: devpass
    {{- end }}
        ports:
          amqp: {{ .infra.port }}
          manager: {{ .infra.management_port }}
    services:
      default:
        type: ClusterIP
        ports:
          amqp: {{ .infra.port }}
          manager: {{ .infra.management_port }}
