apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: rabbitmq
  version: 1.0.0
  description: >
    RabbitMQ for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, ports, exposed service). RabbitMQ always authenticates, so
    the application user and password are always emitted: the user comes from
    the developer value and the password from the optional `password`
    credential slot when attached, falling back to a deterministic inline
    development default otherwise so the render stays reproducible. The image
    is management-enabled, so the broker exposes both the AMQP port and the
    management dashboard. provides.host is the bare service name, resolved on
    the compose network.

    The broker's metrics are on in the image, on port 15692, which checks no
    caller and which any peer on the compose network reaches. With
    `values.metrics_enabled` true their address is published as
    provides.metrics_endpoint; false, that key is empty.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/messaging/rabbitmq:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # metrics_endpoint is the address the broker serves its own metrics at while
  # values.metrics_enabled is true: /metrics on port 15692 of the service. The
  # image switches the broker's prometheus plugin on and it listens on every
  # interface, so a peer on the compose network reaches it with no port
  # published; nothing is added for it, and false only leaves the key empty. It
  # is spelled out in full on purpose: a provides entry cannot read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "amqp"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}:15692/metrics{{ end }}"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "rabbitmq:{{ .infra.engine_version }}"
        # The application user is always provisioned. Its password comes from
        # the optional `password` credential slot when attached (arriving on
        # the inject pipe as .context.inject.env.RABBITMQ_PASSWORD); with no
        # credential attached the Recipe emits a deterministic inline
        # development default so the render stays reproducible.
        variables:
          RABBITMQ_DEFAULT_USER: "{{ .values.user }}"
    {{- if and .context.inject.env .context.inject.env.RABBITMQ_PASSWORD }}
          RABBITMQ_DEFAULT_PASS: "{{ .context.inject.env.RABBITMQ_PASSWORD }}"
    {{- else }}
          RABBITMQ_DEFAULT_PASS: devpass
    {{- end }}
        ports:
          amqp: {{ .infra.port }}
          manager: {{ .infra.management_port }}
        # RabbitMQ documents a TCP check on the AMQP port as the best-practice
        # readiness check, so the service's healthcheck opens a TCP connection to
        # that port with the nc the image's busybox provides. A service keeps one
        # healthcheck, so one probe is declared.
        health:
          ready:
            tcp: {{ .infra.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      default:
        type: ClusterIP
        ports:
          amqp: {{ .infra.port }}
          manager: {{ .infra.management_port }}
