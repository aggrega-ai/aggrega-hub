apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mcp-remote
  version: 1.0.0
  description: >
    A Model Context Protocol server someone else already runs, reached at the
    address infra.endpoint names, as a reference realization for local
    development via Docker Compose: no service is defined for it and nothing
    runs. The address reaches a consuming service through the injection
    context rather than through a service definition, because compose has no
    counterpart to an in-cluster alias. provides.endpoint is the address as
    written, host, port and protocol are read from it, and credential_header is
    the request header the server reads a caller's credential from,
    Authorization unless infra.credential_header names another.

    No credential is held here: a consumer that needs one holds it on its own
    connection to the tool and presents it under that header, because the
    credential belongs to the consumer rather than to the address.
    infra.endpoint is the address without any part that carries a key, at
    least a scheme and a host; a consumer whose server reads its key from the
    address supplies the whole address through the endpoint slot on its own
    connection, as a Compose variable reference. An address carrying a user
    name or password is refused.

    Reach for this realization under Docker Compose where the server already
    runs outside the Release; reach for helm/mcp-remote on Kubernetes, and for
    compose/mcp-stdio-bridge to run a server published as a package speaking
    stdio. infra.image, the two stdio keys and a server_env attachment are
    refused here, and so is an `inject:` block, on a connection from the tool
    or on the component itself, since no container runs to receive it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-tool/mcp:1.0.0
  # infra.endpoint is read once here, and provides and the workload read the
  # parts below from it. optional, because a Release that sets no address
  # leaves the key absent, and a bare reference to an absent key halts before
  # the assertion below can say what is missing.
  #
  # port is the one the address names, or its scheme's default port where it
  # names none: 80 for http, 443 for https. Matching the host's trailing
  # digits rather than splitting on the colon keeps an IPv6 literal whole.
  # DELIBERATE NEAR-DUPLICATE of recipe/helm/mcp-remote's locals: a local
  # sits inside the Recipe that renders it and no catalog kind holds one for
  # two Recipes to share, so the two are moved together.
  locals:
    endpoint: '{{ optional .infra "endpoint" "" }}'
    scheme: '{{ (urlParse .locals.endpoint).scheme }}'
    hostname: '{{ (urlParse .locals.endpoint).hostname }}'
    port: '{{ $u := urlParse .locals.endpoint }}{{ $p := regexFind ":[0-9]+$" $u.host | trimPrefix ":" }}{{ if $p }}{{ $p }}{{ else if eq $u.scheme "http" }}80{{ else }}443{{ end }}'
  # The contract is key-for-key the one helm/mcp-remote publishes, so a
  # consumer reads the same keys on either target. credential_header is
  # published from infra, where the Component holds its default.
  provides:
    host: "{{ .locals.hostname }}"
    port: "{{ .locals.port }}"
    endpoint: "{{ .locals.endpoint }}"
    protocol: "{{ .locals.scheme }}"
    credential_header: "{{ .infra.credential_header }}"
  assertions:
    # The server is the Release's, so no address exists for the catalog to
    # hold as a default: the Release names it. A Release carrying an input
    # only another realization reads is told which realization reads it by
    # the workload's refusal below, rather than asked for an address it does
    # not mean to reach.
    endpoint_supplied: >-
      {{- $elsewhere := or (optional .infra "image" "") (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") (hasKey (default dict .features) "server_env") -}}
      {{- if not (or (optional .infra "endpoint" "") $elsewhere) -}}
      {{- fail "this realization reaches a Model Context Protocol server someone else already runs, so the Release supplies its address and the catalog holds no default: set infra.endpoint in the Release to the http or https URL a client connects to the server at, without any part that carries a key and with at least its scheme and host, for example https://mcp.example.com/mcp; a consumer whose server reads its key from the address supplies the whole address through the endpoint slot on its own connection to the tool" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block. It runs nothing, so it reads neither infra.port nor
  # infra.compute.
  #
  # The inputs that only another realization reads halt the build, naming the
  # realization that reads them, rather than being dropped: infra.image is
  # helm/mcp's, and the two stdio keys and the server_env slot are the
  # mcp-stdio-bridge realizations'. An address that is not an http or https
  # URL naming a host halts too, as does one carrying a user name or
  # password, which would put a credential into every rendered file the
  # address reaches. Neither message repeats the address, so a credential
  # written into it reaches no log either.
  #
  # A connection from the tool that writes an inject block halts the build
  # too, naming each entry it dictates and its delivery mechanism: an inject
  # block hands a value to the code running in the tool's container, and this
  # realization runs no container, so the entry would reach nothing.
  # compose/mcp-stdio-bridge, which runs the server, delivers it. A connection
  # writing none renders as it would without it. An entry in an inject block
  # the developer writes on the component itself halts the build the same way,
  # naming the entry and its mechanism; helm/mcp delivers such entries.
  #
  # form: reference is the no-compute shape: compose defines no service for
  # it, and the address reaches a consumer through provides.
  workload: |
    {{- with optional .infra "image" "" -}}
    {{- fail (printf "infra.image of %q is set, but this realization runs nothing and reaches the server at infra.endpoint; remove infra.image, or run the image on Kubernetes with helm/mcp" $.context.instance_id) -}}
    {{- end -}}
    {{- if or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") -}}
    {{- fail (printf "infra.stdio_command or infra.stdio_runtime of %q is set, but this realization runs nothing and reaches the server at infra.endpoint; remove both, or map the component to compose/mcp-stdio-bridge to run that command line behind the bridge" $.context.instance_id) -}}
    {{- end -}}
    {{- if hasKey (default dict .features) "server_env" -}}
    {{- fail (printf "the server_env slot of %q carries an attachment, but this realization runs no server to deliver it to: a remote server's credential is held by each consumer on its connection to the tool and presented under the header credential_header publishes; remove the attachment" $.context.instance_id) -}}
    {{- end -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, but this realization runs nothing: it reaches a server someone else runs at infra.endpoint, so there is no container for the entry to reach; remove the inject block from that connection, or map the component to compose/mcp-stdio-bridge, which runs the server and delivers what a connection dictates" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $mechanism, $names := default dict .context.self_inject -}}
    {{- range $name, $key := $names -}}
    {{- fail (printf "the own inject block of %q dictates %q under the delivery mechanism %q, but this realization runs nothing: it reaches a server someone else runs at infra.endpoint, so there is no container for the entry to reach; remove the inject block from the component, or run the server's image on Kubernetes with helm/mcp, which delivers it" $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- $u := urlParse .locals.endpoint -}}
    {{- if $u.userinfo -}}
    {{- fail (printf "infra.endpoint of %q carries a user name or password before its host, which would write a credential into every rendered file the address reaches: remove it, and have each consumer hold the credential on its connection to the tool, presented under the header credential_header publishes" $.context.instance_id) -}}
    {{- end -}}
    {{- if not (and (has $u.scheme (list "http" "https")) $u.hostname) -}}
    {{- fail (printf "infra.endpoint of %q is not an http or https URL naming a host: set it to the URL a client connects to the server at, without any part that carries a key and with at least its scheme and host, for example https://mcp.example.com/mcp; a consumer whose server reads its key from the address supplies the whole address through the endpoint slot on its own connection to the tool" $.context.instance_id) -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .locals.endpoint }}"
    port: {{ .locals.port }}
