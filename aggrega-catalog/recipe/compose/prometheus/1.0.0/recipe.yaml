apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: prometheus
  version: 1.0.0
  description: >
    Prometheus metrics server for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. The scrape-target host and port resolved from the
    `scrape_target` uses-edge arrive on .context.inject.env and are written into
    a minimal prometheus.yml scrape job at start-up, so the server scrapes that
    target. The time-series database is persisted to a named volume.
    provides.host is the bare service name, resolved on the compose network.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  target: compose
  implements: core/observability/prometheus:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "prom/prometheus:{{ .infra.engine_version }}"
        # The scrape target resolved from the `scrape_target` uses-edge arrives
        # on the inject pipe (.context.inject.env) and is written into the
        # prometheus.yml scrape config at start-up, then Prometheus is exec'd
        # against that config with the time-series database on the data volume.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/prometheus.yml <<'EOF'
            global:
              scrape_interval: 15s
            scrape_configs:
              - job_name: {{ .values.scrape_job_name }}
                metrics_path: {{ .values.metrics_path }}
                static_configs:
                  - targets:
                      - {{ .context.inject.env.PROM_SCRAPE_HOST }}:{{ .context.inject.env.PROM_SCRAPE_PORT }}
            EOF
            exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address=0.0.0.0:{{ .infra.port }}
        ports:
          http: {{ .infra.port }}
        volumeMounts:
          - name: data
            path: /prometheus
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
