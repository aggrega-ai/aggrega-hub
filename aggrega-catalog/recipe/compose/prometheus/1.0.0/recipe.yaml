apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: prometheus
  version: 1.0.0
  description: >
    Prometheus metrics server for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. The scrape-target host and port resolved from the
    `scrape_target` uses-edge arrive on .context.inject.env and are written into
    a minimal prometheus.yml scrape job at start-up, so the server scrapes that
    target. The time-series database is persisted to a named volume.
    provides.host is the bare service name, resolved on the compose network.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/observability/prometheus:1.0.0

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "prom/prometheus:{{ .infra.engine_version }}"
        # Every component wired on the `scrape_target` socket becomes one scrape
        # job: its resolved host and port from the enriched topology pipe are the
        # job's target, and the edge's per-connection values tune the job's
        # label, cadence, and metrics path. The rendered prometheus.yml is
        # written at start-up, then Prometheus is exec'd against it with the
        # time-series database on the data volume.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/prometheus.yml <<'EOF'
            global: {}
            scrape_configs:
            {{- range $alias, $edge := .context.uses }}
            {{- if eq $edge.socket "scrape_target" }}
            {{- $v := default (dict) $edge.values }}
            {{- /* job_name keeps a template fallback because its default is the
                   edge alias — per-edge context, which no static value in the
                   socket's valueSchema can express. Leave it here. The two keys
                   below take their defaults from that valueSchema, so they read
                   the edge value directly and this template holds no second
                   copy of them. */}}
              - job_name: {{ default $alias (get $v "job_name") }}
                scrape_interval: {{ get $v "scrape_interval" }}
                metrics_path: {{ get $v "metrics_path" }}
                static_configs:
                  - targets:
                      - {{ $edge.provides.host }}:{{ $edge.provides.port }}
            {{- end }}
            {{- end }}
            EOF
            exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address=0.0.0.0:{{ .infra.port }}
        ports:
          http: {{ .infra.port }}
        volumeMounts:
          - name: data
            path: /prometheus
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
