apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: prometheus
  version: 1.0.0
  description: >
    Prometheus metrics server for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. Each connection on the `scrape_target` uses-socket
    becomes one job in a minimal prometheus.yml the container writes at
    start-up: the host and port that connection's target publishes are the job's
    address, and the connection's own `values` set that job's label, cadence and
    metrics path. The time-series database is persisted to a named volume. With
    `infra.external_base_url` set, the server takes it as its external URL and
    is kept serving at its root; unset, neither flag is emitted.
    provides.host is the bare service name, resolved on the compose network.

    The server's port is also published on the host. With
    `values.otlp_receiver` true, the server runs the OTLP receiver, which
    checks no caller, on that same port, so anything that reaches the host's
    port can write metrics into it, and it publishes the receiver's address as
    provides.otlp_http_endpoint; false, that key is empty.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/observability/prometheus:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # otlp_http_endpoint is the OTLP receiver's base address on the service name
  # and port while values.otlp_receiver is true — the server serves its
  # receiver at /api/v1/otlp/v1/metrics, and an OTLP exporter appends
  # /v1/metrics to this base itself — and empty while it is false, when the
  # server serves no receiver. The address is spelled out in full on purpose: a
  # provides entry cannot read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
    otlp_http_endpoint: "{{ if .values.otlp_receiver }}http://{{ .context.instance_id }}:{{ .infra.port }}/api/v1/otlp{{ end }}"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "prom/prometheus:{{ .infra.engine_version }}"
        # Every component wired on the `scrape_target` socket becomes one scrape
        # job: its resolved host and port from the enriched topology pipe are the
        # job's target, and the edge's per-connection values tune the job's
        # label, cadence, and metrics path. The rendered prometheus.yml is
        # written at start-up, then Prometheus is exec'd against it with the
        # time-series database on the data volume.
        # With infra.external_base_url set, --web.external-url carries it, the
        # base of every link the server writes back to itself. The server would
        # otherwise also move every endpoint under that address's path, so
        # --web.route-prefix=/ keeps it serving at its root: the health check
        # below and every consumer composing its address from provides reach it
        # there. Unset, neither flag is emitted.
        # With values.otlp_receiver true, --web.enable-otlp-receiver turns on the
        # receiver for metrics pushed over OTLP, at /api/v1/otlp/v1/metrics on
        # the same port; it checks no caller, and the service entry below
        # publishes that port on the host as well as on the compose network.
        # False, the flag is not emitted.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/prometheus.yml <<'EOF'
            global: {}
            scrape_configs:
            {{- range $alias, $edge := .context.uses }}
            {{- if eq $edge.socket "scrape_target" }}
            {{- $v := default (dict) $edge.values }}
            {{- /* job_name keeps a template fallback because its default is the
                   edge alias — per-edge context, which no static value in the
                   socket's valueSchema can express. Leave it here. The two keys
                   below take their defaults from that valueSchema, so they read
                   the edge value directly and this template holds no second
                   copy of them. */}}
              - job_name: {{ default $alias (get $v "job_name") }}
                scrape_interval: {{ get $v "scrape_interval" }}
                metrics_path: {{ get $v "metrics_path" }}
                static_configs:
                  - targets:
                      - {{ $edge.provides.host }}:{{ $edge.provides.port }}
            {{- end }}
            {{- end }}
            EOF
            exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address=0.0.0.0:{{ .infra.port }}{{ if .values.otlp_receiver }} --web.enable-otlp-receiver{{ end }}{{ with .infra.external_base_url }} '--web.external-url={{ . }}' --web.route-prefix=/{{ end }}
        ports:
          http: {{ .infra.port }}
        # Prometheus reports readiness at /-/ready. The image carries no curl,
        # so the healthcheck asks it with the wget of the image's busybox,
        # which fails on an error answer and when nothing answers. The timing is
        # the one the product's own chart gives its readiness probe. A service
        # keeps one healthcheck, so one probe is declared.
        health:
          ready:
            exec:
              - wget
              - "-q"
              - "--spider"
              - "http://127.0.0.1:{{ .infra.port }}/-/ready"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
        volumeMounts:
          - name: data
            path: /prometheus
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
