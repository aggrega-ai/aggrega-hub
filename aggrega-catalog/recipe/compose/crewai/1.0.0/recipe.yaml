apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: crewai
  version: 1.0.0
  description: >
    A CrewAI agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; the model name
    is delivered as MODEL, the variable CrewAI resolves first when no model is
    set in code.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/crewai:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and
        # matches on the socket name to find it, then reads the model recipe's
        # published endpoint and model name. The client SDK reads the base URL and
        # the API key from the environment. CrewAI reads the model name from the
        # environment itself: it resolves MODEL first, then MODEL_NAME, then
        # OPENAI_MODEL_NAME, and MODEL is the spelling its own configuration guide
        # documents. The recipe therefore delivers the model name under MODEL and
        # the framework picks it up with no application code, so no second model
        # variable is emitted.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, arrives on the inject pipe and renders as OPENAI_API_KEY
        # (compose has no Secret-resource / secretKeyRef primitive). A connection
        # carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ $.context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
    {{- end }}
