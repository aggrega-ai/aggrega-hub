apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mastra
  version: 1.0.0
  # No healthcheck is declared: a compose check runs inside the image, and which
  # tools the Release's image carries is not known here.
  description: >
    A server built by Mastra, for local development via Docker Compose.
    Synthesized-mode Workload: the image the Release supplies and its
    environment are translated from the Workload kind by the compose provider.
    The server receives infra.port as PORT beside MASTRA_HOST set to 0.0.0.0,
    and provides is the service's name on the compose network with that port,
    and, where values.agent_id is set, the address of that agent's
    Agent2Agent card.

    The model wired into the `model` socket reaches the server as on
    helm/mastra: its endpoint as OPENAI_BASE_URL, and the connection's
    credential as OPENAI_API_KEY. Each tool wired into the `tools` socket
    reaches it under the variables helm/mastra names: its address as
    AGGREGA_TOOL_<ALIAS>_URL, or the whole address the connection holds as a
    secret in its place, and the connection's credential as
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL beside the header the tool publishes,
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER. A connection writing an `inject:`
    block, or the component's own, delivers the names it dictates, as on
    helm/mastra, a file as a compose config mounted at the path it names. A
    set values.agent_id reaches the server as MASTRA_AGENT_ID unless an entry
    of the component's own block reads it alone.

    Compose has no secret reference, so a secret held on a connection is
    written into the file as it was delivered; a Compose variable reference
    such as ${MODEL_API_KEY} is written as that reference, and Docker Compose
    substitutes it when the stack starts. Two secrets the Release alone
    attaches, a model credential beside a tool credential, both arrive under
    the key value and halt the build naming both; an Aggregate naming
    values.key on one of them avoids it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/mastra:1.0.0
  # The contract is key-for-key the one helm/mastra publishes, so a consumer
  # reads the same keys on either target. host is the name the compose
  # provider gives the synthesized service, which is the component instance's
  # own name, and a consumer on the same compose network resolves it
  # directly. agent_card_url is composed as on helm/mastra.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "http"
    agent_card_url: "{{ with optional .values \"agent_id\" \"\" }}http://{{ $.context.instance_id }}:{{ $.infra.port }}/api/.well-known/{{ . }}/agent-card.json{{ end }}"
  # The variables are named as on helm/mastra, so the server reads the same
  # names on either target. The model arrives on the `model` uses-edge,
  # addressed by the developer-chosen alias; the recipe ranges the outbound
  # edges and matches on the socket name to find it.
  #
  # The credential is read from the inject pipe under the key its own
  # attachment delivered it under, values.key, which is value unless the
  # Aggregate names another. A connection carrying none emits no key variable.
  #
  # Each `tools` connection is delivered as on helm/mastra, under its alias
  # upper-cased with every hyphen an underscore, each secret read from the
  # inject pipe under its own attachment's values.key: an endpoint secret in
  # place of the endpoint the tool publishes, and the credential with the
  # header beside it only where the tool publishes one. The address and the
  # header are the defaults a tools connection writing an inject block gives
  # up for the names it dictates; the two secrets are its attachments' and
  # stay.
  #
  # The compose provider publishes no container port without a host-publishing
  # service, and a service on the compose network reaches the container on any
  # port, so no port or service is declared; PORT carries infra.port to the
  # server.
  workload: |
    {{- /*
      The image is the Release's own code, so the names this recipe derives from
      a connection's provides are defaults: a connection that writes no inject
      block receives them, and a connection that writes one receives exactly
      what it dictates instead, read off the inject pipe as a map. On a model
      connection nothing is a default: Mastra's model router reads
      OPENAI_BASE_URL by itself, and OPENAI_API_KEY is the credential attached
      on the connection, so a model connection that dictates receives its names
      beside them. On a tools connection the defaults are
      AGGREGA_TOOL_<ALIAS>_URL from the endpoint the tool publishes and
      AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER from the header it publishes,
      while what its attachments deliver stays either way: the credential as
      AGGREGA_TOOL_<ALIAS>_CREDENTIAL, and an endpoint secret as
      AGGREGA_TOOL_<ALIAS>_URL. PORT and MASTRA_HOST are the component's own.

      A dictated env entry becomes a service variable under the name it gives,
      after the variables this recipe names for the server, the model and the
      tools, written as the pipe carries it,
      so Docker Compose substitutes a $ in it as in every variable; a dictated
      file entry becomes a compose config mounted as one file at the absolute
      path it names, its content written with each $ doubled so the file holds
      the value itself, and a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: the service's command replaces the
      image's default, which is the Release's. Any other mechanism is refused
      too. A dictated variable named like one this recipe delivers itself, or
      like the key an attachment's value arrives under on the inject pipe,
      where the attachment's value would take its place, halts the build,
      naming both, since the compiler cannot see the names a recipe writes.

      Two tools connections whose aliases differ only in letter case, or in a
      hyphen against an underscore, are named alike, so the build halts, naming
      both, wherever the two would deliver one variable: always while both take
      the defaults, and otherwise wherever what each still delivers meets, such
      as a credential attached on each.

      The component's own inject block. The developer may also write an inject
      block on the component itself, and its env and file entries reach the
      container as a connection's do: each env entry under the name it gives,
      read off the inject pipe, after the connections' variables, and each file
      at the absolute path it names, from a compose config of its own, checked
      as a connection's file is. The agent's own value is delivered under a
      default name: MASTRA_AGENT_ID (while set). It is rendered, and kept from
      every connection and from that block, only while no entry of that block,
      in either mechanism, delivers it. A value left unset renders no variable.
      The templates read that at .context.self_inject, which maps each name the
      developer wrote to values.<key> for an entry whose template reads that one
      own value. A refusal about one of that block's entries names the block
      rather than a connection.

      DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
      Recipe in this catalog that reads .context.self_inject declares: the same
      lines, save the own values each looks up and the mechanisms it reads. A
      Recipe of a tool or of an agent reads env and file entries, and reads the
      file entries a second time for the files it emits; a Recipe of
      core/compute/function, task or worker reads env entries alone; a Recipe of
      core/compute/server that refuses a variable by name reads the names of the
      env entries alone; and a realization of core/ai-tool/mcp that delivers
      none of the block reads it only to refuse each of its entries. The
      connections and that block only record who dictates each name and each
      file, and each refusal runs once over both, naming the one that dictated
      it. It is part of a workload template, and no catalog kind holds part of
      one for several Recipes to share; a change to it is made to all of them.

      The block reading the connections' inject directives is the one every
      compose Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- $ownFile := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $slot, $attachment := (default dict $edge.features) }}
    {{- with optional (default dict $attachment.values) "key" "" }}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $_ := set $taken "PORT" "the component's infra.port, which the server reads under that name" }}
    {{- $_ := set $taken "MASTRA_HOST" "this realization, which sets the address the server listens on under that name" }}
    {{- $toolVars := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint Mastra's model router reads under that name" $alias) }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $byDefault := printf "the tools connection %s, which writes no inject block" $alias }}
    {{- $delivers := dict }}
    {{- if hasKey $features "endpoint" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) (printf "the endpoint attached on the tools connection %s" $alias) }}
    {{- else if not (hasKey $dictating $alias) }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) $byDefault }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) (printf "the credential attached on the tools connection %s" $alias) }}
    {{- if and (not (hasKey $dictating $alias)) (optional $edge.provides "credential_header" "") }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL_HEADER" $name) $byDefault }}
    {{- end }}
    {{- end }}
    {{- range $var, $by := $delivers }}
    {{- with optional $toolVars $var "" }}
    {{- fail (printf "the tools connections %s and %s of %q would both deliver the variable %s, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" . $alias $.context.instance_id $var) }}
    {{- end }}
    {{- $_ := set $toolVars $var $alias }}
    {{- $_ := set $taken $var $by }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $own := dict }}
    {{- if not (hasKey $named "values.agent_id") }}{{ with optional $.values "agent_id" nil }}{{ $_ := set $own "MASTRA_AGENT_ID" (toString .) }}{{ $_ := set $taken "MASTRA_AGENT_ID" "the component's own value agent_id" }}{{ end }}{{ end }}
    {{- $files := dict }}
    {{- $dictated := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "file" }}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $by := $dictated }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) }}
    {{- end }}
    {{- end }}
    {{- range $name, $by := $files }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The variables this recipe names come first, the server's own, then
        # model and tools; the variables connections dictate follow, in alias
        # order, then the agent id's default and the component's own inject
        # block's entries.
        variables:
          PORT: "{{ .infra.port }}"
          MASTRA_HOST: "0.0.0.0"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $features := default dict $edge.features }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if hasKey $features "credential" }}
          OPENAI_API_KEY: "{{ index $.context.inject.env $features.credential.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ index $.context.inject.env $features.endpoint.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else if not $dictates }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- if and (not $dictates) (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
    {{- range $name, $value := $own }}
          {{ $name }}: {{ toJson $value }}
    {{- end }}
    {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
  # The compose configs holding the file entries the connections and the
  # component's own inject block dictate, one per file and numbered in path
  # order, the names the workload's volumes read. A compose config is written as
  # one file at the path it is mounted at, and Docker Compose substitutes a $ in
  # its content, so each $ is doubled. They are emitted only while either one
  # dictates a file, so a build with none renders nothing here.
  artifacts:
    mastra-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
