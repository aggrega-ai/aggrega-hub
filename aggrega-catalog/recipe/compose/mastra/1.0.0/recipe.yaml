apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mastra
  version: 1.0.0
  description: >
    A server built by Mastra, for local development via Docker Compose.
    Synthesized-mode Workload: the image the Release supplies and its
    environment are translated from the Workload kind by the compose provider.
    The server receives infra.port as PORT beside MASTRA_HOST set to 0.0.0.0,
    and provides is the service's name on the compose network with that port,
    and, where values.agent_id is set, the address of that agent's
    Agent2Agent card. No healthcheck is declared: a compose check runs inside
    the image, and which tools the Release's image carries is not known here.

    The model wired into the `model` socket reaches the server as on
    helm/mastra: its endpoint as OPENAI_BASE_URL, and the connection's
    credential as OPENAI_API_KEY. Each tool wired into the `tools` socket
    reaches it under the variables helm/mastra names: its address as
    AGGREGA_TOOL_<ALIAS>_URL, or the whole address the connection holds as a
    secret in its place, and the connection's credential as
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL beside the header the tool publishes,
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER.

    Compose has no secret reference, so a secret held on a connection is
    written into the file as it was delivered; a Compose variable reference
    such as ${MODEL_API_KEY} is written as that reference, and Docker Compose
    substitutes it when the stack starts. Two secrets the Release alone
    attaches, a model credential beside a tool credential, both arrive under
    the key value and halt the build naming both; an Aggregate naming
    values.key on one of them avoids it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/mastra:1.0.0
  # The contract is key-for-key the one helm/mastra publishes, so a consumer
  # reads the same keys on either target. host is the name the compose
  # provider gives the synthesized service, which is the component instance's
  # own name, and a consumer on the same compose network resolves it
  # directly. agent_card_url is composed as on helm/mastra.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}"
    protocol: "http"
    agent_card_url: "{{ with optional .values \"agent_id\" \"\" }}http://{{ $.context.instance_id }}:{{ $.infra.port }}/api/.well-known/{{ . }}/agent-card.json{{ end }}"
  # The variables are named as on helm/mastra, so the server reads the same
  # names on either target. The model arrives on the `model` uses-edge,
  # addressed by the developer-chosen alias; the recipe ranges the outbound
  # edges and matches on the socket name to find it.
  #
  # The credential is read from the inject pipe under the key its own
  # attachment delivered it under, values.key, which is value unless the
  # Aggregate names another. A connection carrying none emits no key variable.
  #
  # Each `tools` connection is delivered as on helm/mastra, under its alias
  # upper-cased with every hyphen an underscore, each secret read from the
  # inject pipe under its own attachment's values.key: an endpoint secret in
  # place of the endpoint the tool publishes, and the credential with the
  # header beside it only where the tool publishes one.
  #
  # The compose provider publishes no container port without a host-publishing
  # service, and a service on the compose network reaches the container on any
  # port, so no port or service is declared; PORT carries infra.port to the
  # server.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          PORT: "{{ .infra.port }}"
          MASTRA_HOST: "0.0.0.0"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $features := default dict $edge.features }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if hasKey $features "credential" }}
          OPENAI_API_KEY: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ index $.context.inject.env $features.endpoint.values.key }}"
    {{- else }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL: "{{ index $.context.inject.env $features.credential.values.key }}"
    {{- if optional $edge.provides "credential_header" "" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
