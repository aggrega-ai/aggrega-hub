apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: gumloop
  version: 1.0.0
  description: >
    A Gumloop automation pipeline on Gumloop's managed platform as a reference
    realization for local development, so no service runs. The compiler carries
    the managed endpoint and the pipeline identifier to consumers through the
    injection contract. No credential is delivered by this recipe: a consumer
    that needs one declares it as `credential` on the socket that reaches this
    endpoint and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/gumloop:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    pipeline_id: "{{ .values.pipeline_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
