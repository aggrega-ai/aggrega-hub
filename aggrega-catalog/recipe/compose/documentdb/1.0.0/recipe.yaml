apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: documentdb
  version: 1.0.0
  license: MIT
  description: >
    PostgreSQL with the DocumentDB extension for local development via Docker
    Compose. Synthesized-mode Workload: the compose provider translates the
    Workload kind into a service entry (image, environment, port, a named volume
    for the data directory). POSTGRES_USER / POSTGRES_DB are developer values;
    POSTGRES_PASSWORD is wired through the optional `password` credential slot,
    whose value arrives on the inject pipe when a credential is attached and
    falls back to an inline development default when none is. provides.host is
    the bare service name, resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/documentdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "ghcr.io/ferretdb/postgres-documentdb:{{ .infra.engine_version }}"
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if hasKey (default dict .features) "password" }}
          POSTGRES_PASSWORD: "{{ .context.inject.env.POSTGRES_PASSWORD }}"
    {{- else }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
        ports:
          p: {{ .infra.port }}
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      db:
        type: ClusterIP
        ports:
          p: {{ .infra.port }}
