apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: documentdb
  version: 1.0.0
  license: MIT
  description: >
    PostgreSQL with the DocumentDB extension for local development via Docker
    Compose. Synthesized-mode Workload: the compose provider translates the
    Workload kind into a service entry (image, environment, port, a named volume
    for the data directory). POSTGRES_USER / POSTGRES_DB are developer values;
    POSTGRES_PASSWORD is wired through the optional `password` credential slot,
    whose value arrives on the inject pipe when a credential is attached and
    falls back to an inline development default when none is. provides.host is
    the bare service name, resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/documentdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "ghcr.io/ferretdb/postgres-documentdb:{{ .infra.engine_version }}"
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if hasKey (default dict .features) "password" }}
          POSTGRES_PASSWORD: "{{ index .context.inject.env "POSTGRES_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- else }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
        ports:
          p: {{ .infra.port }}
        # The service's healthcheck runs the image's own pg_isready, which
        # PostgreSQL documents as the check of whether a server is accepting
        # connections, over TCP: while a new database is initialized the image
        # runs a temporary server that listens on its socket only, so a service
        # that depends on this one is started only once the server accepts
        # network connections. The image carries no curl or nc, so the check is a
        # command the image does carry. The configured user and database are named
        # so that a check is not logged as a failed connection attempt. A service
        # keeps one healthcheck, so one probe is declared; failures in the first
        # 30 s do not count, to cover initialization and the extension's
        # installation.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      db:
        type: ClusterIP
        ports:
          p: {{ .infra.port }}
