apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ollama
  version: 1.0.0
  license: Apache-2.0
  description: >
    Ollama as a self-hosted inference server for local development via Docker
    Compose, synthesized from the Workload kind by the compose provider. A
    weights-pull step, running the same image at the same tag, resolves the
    model pointer into a named model-cache volume before the server starts, and
    a failed pull holds the server back; the compiler never fetches weights.
    The server serves what the cache holds, so the model name published to
    consumers is the weights identifier itself.

    An attached model_pull_token is rendered as the OLLAMA_PULL_TOKEN
    environment variable on the pull step, which is also the key the credential
    must publish under; unattached, weights are pulled anonymously.

    A GPU count is honoured: the compose provider reserves that many NVIDIA
    GPUs for the serving service, which the Docker host must be able to hand
    out. Compose is single-host: the replica count and the GPU runtime class
    are authored all the same, and the build reports each as an
    unsupported-field warning naming the setting. provides.host is the compose
    service name, which a consumer on the same compose network resolves
    directly.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/ollama:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, and below the server's own listen address, the
  # container port and the service entry; the literal is never repeated. The
  # contract is key-for-key the one the Kubernetes realization publishes, so a
  # consumer reads the same keys on either target.
  #
  # host is the name the compose provider gives the synthesized service, which is
  # the component instance's own name, so a consumer on the same compose network
  # resolves it directly. host and endpoint spell it out twice on purpose: a
  # provides entry cannot read another provides entry, so there is no home either
  # could dereference instead — the repetition is forced, not a choice, and the
  # two must be edited together.
  #
  # model is the weights identifier verbatim. The component exposes no serving
  # alias alongside it, and the server below serves whatever the pull step placed
  # in the shared cache, so there is nothing else a consumer could be told to ask
  # for.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/v1"
    model: "{{ .values.model }}"
    protocol: "http"
  # Synthesized-mode Workload: the image, the command line, the environment, the
  # model-cache volume and the weights-pull step are translated from the
  # Workload kind by the compose provider. The weights pull is an init
  # container, so it becomes a run-to-completion service that the serving
  # service waits on before it starts. This runtime pulls with its own client
  # against its own server, and both live in the same image, so the pull step
  # and the server are that image at the same tag — one version knob moves
  # both, and no second image has to be kept in step.
  #
  # Both services mount the same named model-cache volume and point the
  # runtime's model directory at it, so the weights outlive the containers and
  # a restart re-runs the pull step against an already-populated cache — how
  # the runtime reconciles that is the runtime's own behaviour.
  #
  # When the optional model_pull_token credential slot is attached its value
  # arrives on the inject pipe and is rendered as the OLLAMA_PULL_TOKEN
  # environment variable on the weights-pull service, which is therefore also
  # the key the attached credential must publish under; unattached, no such
  # variable is emitted and weights are pulled anonymously.
  #
  # The GPU count is honoured here as on Kubernetes: the compose provider writes
  # it as a reservation of that many NVIDIA GPUs on the serving service. Compose
  # is single-host, so two operator settings the Kubernetes realization honours
  # cannot be honoured here: the replica count and the GPU runtime class. Each
  # is authored all the same, so the build reports it as an unsupported-field
  # warning naming the setting rather than dropping it in silence.
  workload: |
    {{- $modelsPath := "/models" -}}
    {{- $tokenVar := "OLLAMA_PULL_TOKEN" -}}
    {{- $model := .values.model | replace "'" "'\\''" | squote | replace "$" "$$" -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    # The replica count is authored even though compose serves one instance: the
    # setting is a real operator knob, and authoring it is what turns a value this
    # target cannot honour into a named warning instead of a silent loss. An
    # operator who asks for more than one replica is told the setting was omitted,
    # rather than counting containers to find out.
    replicas: {{ .infra.replicas }}
    # The runtime class here and the GPU count further down are authored exactly as
    # the Kubernetes realization authors them. The compose target reserves the GPU
    # count as that many NVIDIA GPUs; the runtime class has no single-host compose
    # analog, and the target reports it as an unsupported-field warning naming the
    # setting — so both are stated once and the target translates or degrades each,
    # rather than this recipe second-guessing what it can express. Both stay
    # presence-guarded, so a Release that asks for no GPU carries no trace of one.
    {{- with (default dict .infra.gpu).runtime_class }}
    runtimeClassName: "{{ . }}"
    {{- end }}
    # Pull the weights before the server starts. The init container becomes its
    # own run-to-completion service, and the serving service waits for it to
    # finish — so the ordering is the target's, not something this recipe encodes
    # into a command line where nothing could inspect or diagnose it.
    # The pull client and the server it talks to ship in the same image, so this
    # step and the server below select the same tag from the same version knob.
    # .values.model is the deterministic pointer the runtime resolves here; the
    # compiler pipes the string through unresolved.
    #
    # The command reads as it does because pulling needs a server to pull into:
    # it starts one in the background, waits until the server answers before
    # asking for anything, pulls, and stops the server it started. The exit
    # status is the interesting part. The serving service waits on this one
    # completing successfully, and what compose reads for that is the status the
    # step exits with — which, in a plain sequence, would be the status of
    # stopping the background server, and stopping it succeeds whether or not the
    # pull did. So the pull's own status is captured the moment it returns and
    # becomes the step's exit status, and a failed pull keeps the server at the
    # starting line instead of letting it come up against an empty cache.
    #
    # Compose reads every $ in the compose file before any shell runs: $NAME
    # becomes the value of NAME where compose itself runs, blank when it is
    # unset, and $$ becomes one $. So the step's own shell variables are
    # written $$ here and reach the shell as $!, $serve_pid, $? and
    # $pull_status; written with a single $, compose would blank the server's
    # process id and the pull's status, and the step would fail however the
    # pull went.
    #
    # The model name reaches ollama pull exactly as written, whatever it
    # contains. $model, at the top of this template, wraps it in single quotes
    # for the shell, writing each single quote inside it as '\'', so the shell
    # reads the whole name as one word and expands or runs nothing in it, and
    # then doubles each $ in it for compose, as above. The line is written as
    # a JSON string, so a quote or a backslash in the name cannot end it early,
    # with U+0085 written as an escape: JSON leaves that character as it is,
    # and YAML would read it as a line break and fold it into a space.
    initContainers:
      - name: model-pull
        image: "ollama/ollama:{{ .infra.engine_version }}"
        command: ["/bin/sh"]
        args:
          - "-c"
          - {{ printf "ollama serve & serve_pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull %s; pull_status=$$?; kill $$serve_pid; exit $$pull_status" $model | toJson | replace "\u0085" "\\u0085" }}
        # $modelsPath is the single authored home for the cache directory. The
        # pull step writes there, the server reads from there, and both mounts
        # put the shared volume there — four readers of one binding, so a future
        # move cannot relocate one and leave the others pointing at the old path.
        # The variable naming it is the one this runtime reads; the server below
        # is given the same one so both halves agree on where the weights live.
        # $tokenVar binds the variable the token is rendered under to the
        # inject-pipe entry it is read from, so the two cannot drift apart. No
        # credential value is authored here — it is read from the pipe the
        # attached credential fills.
        variables:
          OLLAMA_MODELS: "{{ $modelsPath }}"
    {{- if hasKey (default dict .features) "model_pull_token" }}
          {{ $tokenVar }}: "{{ index .context.inject.env $tokenVar | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: "{{ $modelsPath }}"
    containers:
      main:
        image: "ollama/ollama:{{ .infra.engine_version }}"
        # The image starts the server on its own, so no command is authored here;
        # the listen address is the one setting it needs, and it carries the port
        # every other reader of .infra.port already agrees on. The server reads
        # the weights the pull step left in the shared cache.
        variables:
          OLLAMA_HOST: "0.0.0.0:{{ .infra.port }}"
          OLLAMA_MODELS: "{{ $modelsPath }}"
        ports:
          http: {{ .infra.port }}
        # A compose service carries one healthcheck, and it runs inside the
        # image, which ships a shell but no HTTP client or socket tool. The
        # runtime's own client is the check instead: it reads the listen address
        # from the same variable the server does, asks the server's root path
        # and then its model list, and fails unless both answer — the command
        # the pull step above already waits on. The product documents no health
        # endpoint; the timing is the readiness timing of the community chart
        # the catalog also wraps.
        health:
          ready:
            exec:
              - ollama
              - list
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if (default dict .infra.gpu).count }}
            "nvidia.com/gpu": "{{ .infra.gpu.count }}"
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: "{{ $modelsPath }}"
    volumes:
      model-cache:
        # One named volume shared by the pull step and the server, which is what a
        # single-host target has: compose runs one instance of a service, so there
        # is no per-replica claim to template and nothing a per-replica shape could
        # apply to here. The Kubernetes realization gives each replica its own
        # claim; this one keeps a single cache both containers mount.
        # The size is read from the operator's own sizing knob so one Release
        # configures either target.
        persistent:
          size: "{{ .infra.model_cache.size }}"
    # A ClusterIP service entry keeps the server internal to the compose network,
    # which is where its consumers sit: the agent wired to it resolves the service
    # name and the port straight from the edge. Nothing is published to the host,
    # so the API is not reachable from outside the network on this target.
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
