apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: langflow
  version: 1.0.0
  description: >
    The Langflow visual flow-builder for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the data volume, and the
    exposed port are translated from the Workload kind by the compose provider.
    The named volume is mounted at the platform's config directory, and the recipe
    directs the flow database into that config directory, so the flows authored in
    the editor survive a restart together with the encryption key the platform
    generates there; the platform's default location for the database is inside
    the image, which would not survive, so the recipe sets the flag that moves it.
    State written anywhere else in the container does not survive. The model
    endpoint wired into the `model` socket is rendered as OPENAI_BASE_URL and an
    attached model API key as OPENAI_API_KEY. Which model a flow calls is selected
    in the flow's own model component field, whose model-name list carries the
    platform's default; the environment carries no model name. Automated flow
    seeding is realized by the helm target only, which carries the definition in a
    ConfigMap the platform loads on startup. This compose recipe authors no
    equivalent, so it seeds no flow and does not read
    `values.flow_definition`: a definition supplied against compose is accepted
    by the component's schema and has no effect on the rendered output. On
    compose the flow is authored through the Langflow editor. Reaching that
    editor requires signing in: the recipe switches the platform's built-in
    sign-in bypass off and seeds an administrator account from values.admin_user
    and the password attached to the admin_password slot, so that password is the
    only way in. A deployment that wants the editor open to anyone who can reach
    the service sets values.require_authentication to false instead, which leaves
    the bypass on and needs no credential. Doing neither halts the build, so an
    editor nobody can sign in to is never deployed.
    The environment-variable contract is authored against langflow-base 0.11.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/langflow:1.0.0
  # With the sign-in bypass switched off, the seeded administrator account is the
  # only way into the editor, and its password comes from the attached
  # credential — there is no fallback the platform can invent. So a deployment
  # that leaves require_authentication at its default and attaches nothing has
  # asked for an editor it could not reach. The build halts here, where the fix
  # is one line in the deployment's own document, rather than at start-up on the
  # machine running the containers. It halts only on that ambiguity: a deployment
  # that sets the lever has made its choice and renders exactly what it asked for.
  assertions:
    admin_credential_prerequisite: >-
      {{- if and .values.require_authentication (not (hasKey (default dict .features) "admin_password")) -}}
      {{- fail "the Langflow editor needs an administrator password to sign in with and this deployment attaches none: attach a secret credential to the admin_password slot to set that password, or set values.require_authentication to false to run the editor with no sign-in required at all" -}}
      {{- end -}}
  workload: |
    {{- $configDir := "/app/langflow-data" -}}
    {{- $requireAuth := .values.require_authentication -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # $configDir is the single authored home for the platform's config
        # directory. Both the environment variable that tells the platform where
        # to write and the volume mount that decides what is mounted there read
        # the binding, so a future move cannot relocate one and leave the other
        # behind.
        # The save-database-in-config-directory flag is load-bearing rather than
        # decorative: the platform's own default puts the flow database inside the
        # installed package directory in the image, which the mounted volume does
        # not cover, so without the flag the flows authored in the editor are lost
        # at the first restart.
        # values.require_authentication is the single authored home for whether
        # the editor asks for a sign-in; $requireAuth binds it once and both the
        # variables and the build-time assertion read that binding, so the
        # sign-in posture cannot be decided twice and disagree. The platform's own
        # bypass flag is its inverse, which is why each arm writes the opposite
        # word rather than piping the value through — piping it would make the two
        # spellings look interchangeable, and they are not.
        # The two arms are the only two coherent states, and they are kept whole
        # deliberately: bypass off means the account name and its password travel
        # with it, and bypass on means neither is authored, so no half-configured
        # account is ever emitted. The password arrives on the inject pipe.
        variables:
          LANGFLOW_CONFIG_DIR: "{{ $configDir }}"
          LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
    {{- if $requireAuth }}
          LANGFLOW_AUTO_LOGIN: "false"
          # Quoted because a login name is free text. Unquoted, a name spelled
          # like a number or a boolean is read as one — `007` arrives as the
          # number 7 and `true` as a boolean — and the variables map, which
          # takes strings, then refuses the build over a name that was perfectly
          # legal to choose.
          LANGFLOW_SUPERUSER: "{{ .values.admin_user }}"
          LANGFLOW_SUPERUSER_PASSWORD: "{{ .context.inject.env.LANGFLOW_SUPERUSER_PASSWORD }}"
    {{- else }}
          LANGFLOW_AUTO_LOGIN: "true"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 7860
        volumeMounts:
          - name: data
            path: "{{ $configDir }}"
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage_size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: 7860
