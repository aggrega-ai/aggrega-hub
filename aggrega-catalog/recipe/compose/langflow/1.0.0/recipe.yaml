apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: langflow
  version: 1.0.0
  description: >
    The Langflow visual flow-builder for local development via Docker Compose.
    Synthesized-mode Workload: image, environment, the flow-database volume, and
    the exposed port are translated from the Workload kind by the compose provider.
    The model endpoint wired into the `model` socket is rendered as OPENAI_BASE_URL
    and an attached model API key as OPENAI_API_KEY. Automated flow seeding (the
    helm target's startup flow load) is not available on compose, which has no
    config-resource primitive; on compose the flow is authored through the Langflow
    editor.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/langflow:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          LANGFLOW_CONFIG_DIR: /app/langflow-data
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
        ports:
          http: 7860
        volumeMounts:
          - name: data
            path: /app/langflow-data
    volumes:
      data:
        persistent:
          size: {{ .infra.storage_size }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 7860
