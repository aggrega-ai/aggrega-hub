apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: griptape
  version: 1.0.0
  description: >
    A Griptape agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL; the
    store wired into the `task_memory` socket contributes its host and port; a
    model API key attached on the `model` connection arrives on the inject pipe
    as OPENAI_API_KEY. A connection writing an `inject:` block receives the
    names it dictates instead of these defaults, as variables or as files
    mounted at the paths it names, while OPENAI_BASE_URL and the API key stay. A
    task-memory store served over TLS alone or over HTTPS halts the build on a
    connection writing no `inject:` block, naming the connection, since such a
    connection hands the application only the store's host and port.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/griptape:1.0.0
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides, and a connection that writes one
      receives exactly what it dictates instead, read off the inject pipe as a
      map. Two deliveries stay on every connection either way: OPENAI_BASE_URL,
      which the client SDK reads by itself, and the API key a credential
      attached on a model connection carries. A dictated env entry becomes a
      service variable under the name it gives, written as the pipe carries it,
      so Docker Compose substitutes a $ in it as in every variable; a dictated
      file entry becomes a compose config mounted as one file at the absolute
      path it names, its content written with each $ doubled so the file holds
      the value itself, and a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: the service's command replaces the image's
      default, which is the Release's. Any other mechanism is refused too. A
      dictated variable named like one this recipe delivers itself, or like the
      key an attachment's value arrives under on the inject pipe, where the
      attachment's value would take its place, halts the build, naming both,
      since the compiler cannot see the names a recipe writes.

      A store served over TLS alone publishes a protocol ending in -tls, such as
      valkey-tls, and one served over HTTPS alone publishes https — an OpenSearch
      domain managed by a cloud provider does; neither accepts a plaintext
      connection. A task-memory connection taking the defaults hands the
      application the store's host and port alone, so its code could not tell
      that TLS is required: such a connection halts the build, naming it, rather
      than rendering an address the application would reach in plaintext. A
      connection that dictates its delivery can hand the code the protocol too,
      and is not refused.

      The block reading the connections' inject directives is the one every
      compose Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $slot, $attachment := (default dict $edge.features) }}
    {{- with optional (default dict $attachment.values) "key" "" }}
    {{- $_ := set $taken . (printf "the %s attached on the %s connection %s, whose value arrives on the inject pipe under that key" $slot $edge.socket $alias) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint the client SDK reads under that name" $alias) }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $by := printf "the %s connection %s, which writes no inject block" $edge.socket $alias }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_MODEL" $by }}
    {{- end }}
    {{- if eq $edge.socket "task_memory" }}
    {{- $_ := set $taken "GRIPTAPE_TASK_MEMORY_HOST" $by }}
    {{- $_ := set $taken "GRIPTAPE_TASK_MEMORY_PORT" $by }}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- $needs := "" }}
    {{- if hasSuffix "-tls" $proto }}{{ $needs = "TLS" }}{{ else if eq $proto "https" }}{{ $needs = "HTTPS" }}{{ end }}
    {{- if $needs }}
    {{- fail (printf "the %s connection %s of %q reaches %q, which publishes protocol %s, a store served over %s alone, but a connection writing no inject block hands the application only the store's host and port, so its code could not tell that %s is required: write an inject block on that connection delivering the store's protocol with whatever else the code reads, under names it reads, or wire a store served without %s" $edge.socket $alias $.context.instance_id $edge.target $proto $needs $needs $needs) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) }}
    {{- end }}
    {{- else if eq $mechanism "file" }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) }}
    {{- end }}
    {{- $_ := set $files $name (optional $pipeFiles $name "") }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: a service's command replaces the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes two sockets, both addressed by the developer-chosen
        # alias, so the recipe ranges its outbound edges and matches on the socket
        # name: the `model` edge contributes the endpoint and the model name; the
        # `task_memory` edge contributes the host and port of the store holding
        # tool output kept off the prompt. The client SDK reads the base URL and
        # the API key from the environment. The model name and the task-memory
        # coordinates are delivered under stable names this recipe defines, for
        # the application's own code to read — Griptape constructs its drivers in
        # application code rather than resolving them from the environment. Those
        # stable names are the defaults: a connection writing an inject block
        # receives the variables it dictates in their place, on its own position
        # among the edges. The task-memory socket is optional, so a Release
        # leaving it unwired emits no task-memory variables.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if not $dictates }}
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "task_memory") (not $dictates) }}
          GRIPTAPE_TASK_MEMORY_HOST: "{{ $edge.provides.host }}"
          GRIPTAPE_TASK_MEMORY_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, arrives on the inject pipe and renders as OPENAI_API_KEY
        # (compose has no Secret-resource / secretKeyRef primitive). A connection
        # carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
          OPENAI_API_KEY: "{{ index $env "OPENAI_API_KEY" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
  # The compose configs holding the file entries the connections dictate, one
  # per file and numbered in path order, the names the workload's volumes read.
  # A compose config is written as one file at the path it is mounted at, and
  # Docker Compose substitutes a $ in its content, so each $ is doubled. They
  # are emitted only while a connection dictates a file, so a build with none
  # renders nothing here.
  artifacts:
    griptape-files.compose-fragment.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ $.context.instance_id }}-file-{{ $i }}:
          content: {{ toJson (replace "$" "$$" $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
