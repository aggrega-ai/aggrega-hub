apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: anthropic-agent
  version: 1.0.0
  description: >
    A Claude assistant on Anthropic's managed API as a reference realization for
    local development, so no service runs. The compose engine carries the
    endpoint, the model string and the api_key credential to consumers through
    the injection contract.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/anthropic:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
    credential:
      from: api_key
      env: ANTHROPIC_API_KEY
