apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql
  version: 1.0.0
  description: >
    MySQL for local development via Docker Compose. Synthesized-mode
    Workload — image, environment, ports, persistent volume, healthcheck
    are translated from the Workload kind by the compose provider. The
    database name and credentials are delivered through the MySQL image's
    environment contract (MYSQL_DATABASE, MYSQL_USER, MYSQL_ROOT_PASSWORD,
    MYSQL_PASSWORD). Character set and collation are chart- and
    managed-target knobs; the MySQL container image takes them as server
    command-line arguments rather than environment variables, so this
    local-development target leaves them at the image defaults. Secrets
    injected via the dotenv-secret FeatureRecipe surface as env vars in the
    rendered service.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/datastore/mysql:1.0.0

  # This Recipe reads from infra.overrides:
  #   image - string (the container image reference, replacing the default the
  #           Recipe composes from infra.engine_version)
  locals:
    service_name: "{{ .context.instance_id }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "mysql"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "{{ if .infra.overrides }}{{ if .infra.overrides.image }}{{ .infra.overrides.image }}{{ else }}mysql:{{ .infra.engine_version }}{{ end }}{{ else }}mysql:{{ .infra.engine_version }}{{ end }}"
        variables:
          MYSQL_DATABASE: "{{ .values.database }}"
          {{- if .values.user }}
          MYSQL_USER: "{{ .values.user }}"
          {{- end }}
          {{- if .context.inject.env }}
          {{- if .context.inject.env.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_PASSWORD: "{{ .context.inject.env.MYSQL_ROOT_PASSWORD }}"
          {{- end }}
          {{- if .context.inject.env.MYSQL_PASSWORD }}
          MYSQL_PASSWORD: "{{ .context.inject.env.MYSQL_PASSWORD }}"
          {{- end }}
          {{- end }}
        ports:
          mysql: 3306
        volumeMounts:
          - name: data
            path: /var/lib/mysql
        probes:
          ready:
            tcp: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
          live:
            exec:
              - mysqladmin
              - ping
            timeoutSeconds: 5
            periodSeconds: 10
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "10Gi" }}{{ else }}10Gi{{ end }}"
    services:
      default:
        type: ClusterIP
        ports:
          mysql: 3306
