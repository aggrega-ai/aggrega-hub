apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: lindy
  version: 1.0.0
  description: >
    A Lindy assistant on Lindy's managed platform as a reference realization for
    local development, so no service runs. The compiler carries the
    operator-supplied platform endpoint and the assistant identifier to
    consumers through the injection contract. No credential is delivered by this
    recipe: a consumer that needs one declares it on its own Component's
    featuresSchema and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/lindy:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    lindy_id: "{{ .values.lindy_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
