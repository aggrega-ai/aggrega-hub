apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dify-web
  version: 1.0.0
  # metadata.license is deliberately absent. The front end this Recipe realizes
  # is published under a modified Apache License 2.0 carrying additional
  # conditions — among them a condition on altering the branding this image
  # serves — and no single SPDX identifier names those terms; the licensing
  # class sits on the Component's upstream-licensing label. The SPDX header at
  # the top of this file states the terms of the file itself.
  description: >
    The Dify front end on Docker Compose via the compose provider's Workload
    synthesis: one service on the HTTP port, infra.port, reached on the
    compose network under its service name and published on the host's
    loopback address, 127.0.0.1, on that same port, so a browser on the
    machine running the stack opens it at 127.0.0.1 and nothing on the host's
    other interfaces reaches it; a reverse proxy or an ingress tier in front
    of it routes the browser path to it from anywhere else. The port is
    published on every build, at the Component's default unless the Release
    sets infra.port: a Release sets a different infra.port where that port is
    already taken on the machine, or where two such components share it. It
    holds no state and declares no volume.

    It writes the same settings as helm/dify-web. The API server's address,
    resolved from the api connection, becomes SERVER_CONSOLE_API_URL, the base
    URL the server-side rendering path calls on the compose network; an
    external base URL the operator supplies is written separately as
    CONSOLE_API_URL and APP_API_URL, the addresses the browser calls, and left
    empty the browser derives them from the page it was served on.

    Its health check opens a TCP connection to the HTTP port on the
    container's IPv4 loopback with the image's own nc. It halts the build
    where the api connection leaves API_HOST or API_PORT undelivered.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/dify-web:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare service name, the component's instance name, which
  # every service on the compose network resolves.
  #
  # Where the service is reached. infra.port is the port the front end listens
  # on, and it is published on the host's loopback address, 127.0.0.1, as the
  # same number, so a browser on the machine running the stack reaches it at
  # 127.0.0.1 and nothing on the host's other interfaces does. The Component
  # gives infra.port a default, so the port is published on every build: a
  # Release sets a different infra.port where that port is already taken on the
  # machine, or where two such components share it. A peer on the compose
  # network reaches it at the service's own name on the same port, which
  # provides.port publishes.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
      DELIBERATE NEAR-DUPLICATE of the same block in helm/dify-web, and of the
      block every Dify Recipe declares with its own sockets and names: it is
      part of a workload template, and no catalog kind holds part of one for
      several Recipes to share; a change to it is made to all.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "api" (dict "API_HOST" "host" "API_PORT" "port") -}}
    {{- $required := list "api" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/dify-web %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The front end holds no durable state, so the stateless form is correct.
    form: stateless
    containers:
      main:
        image: "langgenius/dify-web:{{ .infra.engine_version }}"
        variables:
          # The port the front-end server binds. The image reads the standard
          # Node port variable.
          PORT: "{{ .infra.port }}"
          # The address the front-end server binds. The image binds the one
          # HOSTNAME names, and Docker sets HOSTNAME to the container's own name,
          # which resolves to its address on the compose network alone, so the
          # health check below, which connects on the container's loopback,
          # would find nothing answering. 0.0.0.0 binds every address the
          # container has.
          HOSTNAME: "0.0.0.0"
          # The address of the API server on the compose network, resolved from
          # the `api` connection. The server-side rendering path calls this; the
          # browser does not, and cannot, because the service name does not
          # resolve outside the compose network.
          SERVER_CONSOLE_API_URL: "http://{{ $env.API_HOST }}:{{ $env.API_PORT }}"
          # Stated rather than left to the image, because the front end's own
          # build and its published Compose definition disagree about the
          # default. A standard-library entity chooses the quieter one.
          NEXT_TELEMETRY_DISABLED: "1"
          ALLOW_EMBED: "{{ .values.allow_embed }}"
          TEXT_GENERATION_TIMEOUT_MS: "{{ .values.text_generation_timeout_ms }}"
          TOP_K_MAX_VALUE: "{{ .values.top_k_max }}"
          MAX_PARALLEL_LIMIT: "{{ .values.max_parallel_limit }}"
          MAX_ITERATIONS_NUM: "{{ .values.max_iterations }}"
          MAX_TOOLS_NUM: "{{ .values.max_tools }}"
    {{- with .infra.external_base_url }}
          # The externally reachable base URL, when the operator supplied one.
          # These are the addresses the browser calls, so they are the address
          # of whatever publishes the installation rather than the API server's
          # service name. Docker Compose substitutes a variable reference in a
          # value, so each $ is doubled, which Compose reads as one literal $,
          # and the URL reaches the container as authored.
          CONSOLE_API_URL: {{ replace "$" "$$" . | toJson }}
          APP_API_URL: {{ replace "$" "$$" . | toJson }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The front end documents no health endpoint and Dify's own Compose file
        # gives it no healthcheck, so the check opens a TCP connection to the
        # port it binds, as helm/dify-web's probes do, with the nc the image
        # carries. It is an exec probe naming 127.0.0.1 rather than a tcp probe:
        # a tcp probe on this target connects to localhost, which this image
        # resolves to ::1 first, while the server listens on IPv4 alone, so the
        # check would fail for ever on a server that answers. A service keeps one
        # healthcheck, so one probe is declared; failures in the first 10 s do
        # not count, the delay helm/dify-web gives its liveness probe.
        health:
          ready:
            exec:
              - nc
              - "-z"
              - 127.0.0.1
              - "{{ .infra.port }}"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    # The port on the host's loopback address only: see the header above.
    services:
      default:
        type: Loopback
        ports:
          http: {{ .infra.port }}
