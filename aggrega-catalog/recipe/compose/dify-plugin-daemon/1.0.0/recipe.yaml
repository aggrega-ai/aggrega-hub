apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: dify-plugin-daemon
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Dify plugin runtime on Docker Compose via the compose provider's
    Workload synthesis: one service on the dispatch port, reached on the
    compose network under its service name and published on no host port.
    Installed plugin packages and their prepared environments live on a named
    volume, whose declared size reaches no emitted byte on this target. It
    writes the same settings as helm/dify-plugin-daemon, keeping its catalogue
    in a database of its own on the backend's server, and publishes its
    Prometheus metrics address as provides.metrics_endpoint.

    As on helm, a step first waits until the backend accepts TCP connections.
    Each credential is the value its attachment delivers, written into the
    file as delivered, so an origin written as a Compose variable reference
    keeps it out of the file; unattached, the pinned development literals are
    written.

    It halts the build on a credential publishing a secret resource's name, on
    one that delivers no value, and on a cache connection holding a server_ca.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/dify-plugin-daemon:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare service name, the component's instance name, which
  # every service on the compose network resolves. metrics_endpoint is the
  # address the runtime serves its own metrics at, /metrics/ on the dispatch
  # port, spelled out in full because a provides entry cannot read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.instance_id }}:{{ .infra.port }}/metrics/"
  # The backend, cache and API-server identities resolved from the component's
  # uses-edges arrive on .context.inject.env and are translated as
  # helm/dify-plugin-daemon translates them: DB_DATABASE carries the developer's
  # plugin_database value, and the API-server edge becomes DIFY_INNER_API_URL.
  #
  # Credentials, as compose/dify reads them: each is the value its attachment
  # delivers on this component's inject pipe under the key the attachment names
  # in values.key, written as delivered under the variable
  # helm/dify-plugin-daemon delivers it on — DB_PASSWORD from the backend
  # connection, SERVER_KEY from the plugin_daemon_key slot and
  # DIFY_INNER_API_KEY from the api connection; an attachment naming no key is
  # read under the variable's own name. One whose realization publishes the
  # name of a secret resource halts the build, and so does one under which no
  # value reaches the pipe. Unattached, each falls back to the pinned
  # development literal helm/dify-plugin-daemon writes.
  workload: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
      DELIBERATE NEAR-DUPLICATE of the same block in helm/dify-plugin-daemon,
      and of the block every Dify Recipe declares with its own sockets and
      names: it is part of a workload template, and no catalog kind holds part
      of one for several Recipes to share; a change to it is made to all.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "DB_HOST" "host" "DB_PORT" "port" "DB_USERNAME" "user") "cache" (dict "REDIS_HOST" "host" "REDIS_PORT" "port") "api" (dict "API_HOST" "host" "API_PORT" "port") -}}
    {{- $required := list "backend" "cache" "api" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/dify-plugin-daemon %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    {{- /*
      The credentials, read off the inject pipe as compose/dify reads its own
      (DELIBERATE NEAR-DUPLICATE of that reading: a change to it is made to all
      of the compose Dify Recipes).
    */ -}}
    {{- $attached := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- with optional (default dict $edge.features) "credential" dict -}}
    {{- if eq $edge.socket "backend" }}{{ $_ := set $attached "DB_PASSWORD" (dict "attachment" . "where" (printf "the credential on its backend connection %s" $alias)) }}{{ end -}}
    {{- if eq $edge.socket "api" }}{{ $_ := set $attached "DIFY_INNER_API_KEY" (dict "attachment" . "where" (printf "the credential on its api connection %s" $alias)) }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- with optional (default dict .features) "plugin_daemon_key" dict }}{{ $_ := set $attached "SERVER_KEY" (dict "attachment" . "where" "its plugin_daemon_key slot") }}{{ end -}}
    {{- $credentials := dict -}}
    {{- range $var, $slot := $attached -}}
    {{- with optional (optional $slot.attachment "provides" dict) "name" "" -}}
    {{- fail (printf "%s of %q carries an attachment whose realization publishes %q, the name of a secret resource the value is to be read from, and Docker Compose has no secret reference to read it through: map core/referenced-secret to compose/dotenv-referenced-secret in the Manifest, writing its origin as the value or as a Compose variable reference such as ${DIFY_PLUGIN_DAEMON_KEY}" $slot.where $.context.instance_id .) -}}
    {{- end -}}
    {{- $key := default $var (toString (optional (optional $slot.attachment "values" dict) "key" "")) -}}
    {{- if not (hasKey $env $key) -}}
    {{- fail (printf "%s of %q is attached, but no value reaches this Recipe under %s, the key it is read under, so %s would be written empty: map core/referenced-secret to compose/dotenv-referenced-secret, or core/secret-value to compose/dotenv-secret, in the Manifest" $slot.where $.context.instance_id $key $var) -}}
    {{- end -}}
    {{- $_ := set $credentials $var (toString (index $env $key)) -}}
    {{- end -}}
    {{- /*
      The cache connection over TLS, read as helm/dify-plugin-daemon reads it:
      a cache publishing valkey-tls or redis-tls is reached over TLS, checked
      against the image's system roots; any other value ending in -tls halts. A
      server_ca is refused: Docker Compose has no secret resource to mount.
    */ -}}
    {{- $cacheTLS := false -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "cache" -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- $edgeTLS := has $proto (list "valkey-tls" "redis-tls") -}}
    {{- if $edgeTLS }}{{ $cacheTLS = true }}{{ else if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the cache connection %s of %q reaches %q, which publishes protocol %s, a cache served over TLS that the Dify plugin runtime does not reach: it speaks the Redis protocol, over TLS to a cache publishing valkey-tls or redis-tls; wire a Redis-protocol cache to the cache socket" $alias $.context.instance_id $edge.target $proto) -}}
    {{- end -}}
    {{- if hasKey (default dict $edge.features) "server_ca" -}}
    {{- fail (printf "the cache connection %s of %q holds a server_ca, which is mounted as a file from the secret resource it names, and Docker Compose has no secret resource to mount: remove the server_ca, so the runtime checks the cache's certificate against the image's system roots, or map core/ai-agent/dify-plugin-daemon to helm/dify-plugin-daemon in the Manifest" $alias $.context.instance_id) -}}
    {{- end -}}
    {{- end }}{{ end -}}
    {{- $image := printf "langgenius/dify-plugin-daemon:%s" .infra.engine_version -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # One service with one container: the installed-plugin set lives on the
    # named volume below, which Docker Compose keeps across restarts of the
    # stack until it is removed with down -v.
    #
    # The runtime connects to its database as it starts and exits when the
    # database does not accept connections, and on this target nothing starts
    # it again. So this step runs first, in the runtime's own image: the wait
    # helm/dify-plugin-daemon writes, with every $ of its script written $$,
    # which Docker Compose reads as one $ before the shell runs, and each address
    # value written as a JSON string with every $ doubled. DELIBERATE
    # NEAR-DUPLICATE of that wait, as compose/dify, compose/dify-worker,
    # compose/dify-worker-beat and compose/langgraph carry it; a change to it is
    # made to all.
    initContainers:
      - name: wait-for-database
        image: "{{ $image }}"
        command: ["/bin/bash", "-c"]
        args:
          - 'limit=300; end=$$SECONDS; ((end += limit)); until timeout 5 bash -c ''exec 3<>"/dev/tcp/$$DB_HOST/$$DB_PORT"'' 2>/dev/null; do if ((SECONDS >= end)); then echo "the database at $$DB_HOST:$$DB_PORT accepted no TCP connection within $$limit s" >&2; exit 1; fi; sleep 2; done; echo "the database at $$DB_HOST:$$DB_PORT accepts TCP connections"'
        variables:
          DB_HOST: {{ toJson (replace "$" "$$" (toString $env.DB_HOST)) }}
          DB_PORT: {{ toJson (replace "$" "$$" (toString $env.DB_PORT)) }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    containers:
      main:
        image: "{{ $image }}"
        variables:
          SERVER_PORT: "{{ .infra.port }}"
          # DB_DATABASE is the developer's value: the runtime keeps its catalogue
          # in a database of its own on the same server.
          DB_TYPE: postgresql
          DB_HOST: {{ toJson (toString $env.DB_HOST) }}
          DB_PORT: {{ toJson (toString $env.DB_PORT) }}
          DB_USERNAME: {{ toJson (toString $env.DB_USERNAME) }}
          DB_DATABASE: {{ replace "$" "$$" (toString .values.plugin_database) | toJson }}
          DB_SSL_MODE: disable
          REDIS_HOST: {{ toJson (toString $env.REDIS_HOST) }}
          REDIS_PORT: {{ toJson (toString $env.REDIS_PORT) }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "cache" }}
          REDIS_DB: "{{ $edge.values.db_index }}"
    {{- end }}
    {{- end }}
    {{- if $cacheTLS }}
          REDIS_USE_SSL: "true"
    {{- end }}
          DIFY_INNER_API_URL: {{ printf "http://%s:%s" (toString $env.API_HOST) (toString $env.API_PORT) | toJson }}
          # Each credential as delivered, or the development literal
          # helm/dify-plugin-daemon writes when nothing is attached.
          SERVER_KEY: {{ optional $credentials "SERVER_KEY" "dify-plugin-daemon-server-key" | toJson }}
          DIFY_INNER_API_KEY: {{ optional $credentials "DIFY_INNER_API_KEY" "dify-plugin-inner-api-key" | toJson }}
          DB_PASSWORD: {{ optional $credentials "DB_PASSWORD" "apppass" | toJson }}
          FORCE_VERIFYING_SIGNATURE: "{{ .values.verify_signature }}"
          MAX_PLUGIN_PACKAGE_SIZE: "{{ .values.max_package_size }}"
          PLUGIN_MAX_EXECUTION_TIMEOUT: "{{ .values.max_execution_timeout }}"
          # The plugin-debugging listener stays off, as on helm: this Recipe
          # opens no port for it.
          PLUGIN_REMOTE_INSTALLING_ENABLED: "false"
          PLUGIN_STORAGE_TYPE: local
          PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
          PLUGIN_WORKING_PATH: /app/storage/cwd
          PLUGIN_INSTALLED_PATH: plugin
          PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
          PLUGIN_MEDIA_CACHE_PATH: assets
        ports:
          http: {{ .infra.port }}
        # The runtime answers GET /health/check, and the image carries curl, so
        # the check is an http probe. Dify's own Compose file gives the runtime
        # no healthcheck; the timing is helm/dify-plugin-daemon's liveness
        # probe, failures in the first 30 s not counting while the image
        # migrates the catalogue's database, then six misses 10 s apart. A
        # service keeps one healthcheck, so one probe is declared.
        health:
          ready:
            http: /health/check
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: storage
            path: /app/storage
    volumes:
      storage:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
