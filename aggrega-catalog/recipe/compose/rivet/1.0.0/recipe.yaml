apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: rivet
  version: 1.0.0
  description: >
    A Rivet agent application for local development via Docker Compose.
    Synthesized-mode Workload: image and environment are translated from the
    Workload kind by the compose provider. The image carries both the Rivet
    runtime and the project file it executes. The model endpoint published by the
    component wired into the `model` socket is rendered as OPENAI_BASE_URL, the
    environment variable the OpenAI-compatible client SDK reads; an attached model
    API key arrives on the inject pipe as OPENAI_API_KEY.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/rivet:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name to find it, then reads the model recipe's published
        # endpoint and model name. The client SDK reads the base URL and the API
        # key from the environment. The model name is delivered as OPENAI_MODEL for
        # the host application's own code to read — a stable name this recipe
        # defines rather than a claim about a framework read, since a Rivet graph
        # carries its model on the calling node inside the project file. The
        # project file, graph name and graph inputs address content inside the
        # supplied image and are passed by the host application, so none is emitted
        # as a variable.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached to the model_api_key
        # slot, arrives on the inject pipe and renders as OPENAI_API_KEY (compose
        # has no Secret-resource / secretKeyRef primitive). Unattached, no key env
        # is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
          OPENAI_API_KEY: "{{ .context.inject.env.OPENAI_API_KEY }}"
    {{- end }}
