apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-api-management
  version: 1.0.0
  description: >
    References an API already served by an Azure API Management instance, as a
    reference realization for local development: no service runs and nothing
    in Azure is created or changed. The compiler carries the API's address to
    consumers through the injection contract. Reach for it where the API is
    configured outside the Release; reach for the terraform Recipe where the
    instance exists and the Release is to configure the API.

    It carries no Feature, because every control the gateway keeps is a
    policy in the API's own configuration, which this realization does not
    write, so the build halts on any attachment. No credential is delivered:
    a consumer that needs one declares it as `credential` on the socket that
    reaches the gateway and delivers it from its own container.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/gateway/azure-api-management:1.0.0
  # A FeatureRecipe bound for the terraform Recipe delivers its setting to this
  # node too, and nothing here would place it, so a control or a key would be
  # accepted and then written nowhere. The build halts instead, on any
  # attachment, naming it.
  assertions:
    carries_no_feature: >-
      {{- range $name, $attachment := (default dict .features) -}}
      {{- fail (printf "attachment %q on %q is carried by the compose reference realization of core/gateway/azure-api-management, which writes no part of the API's configuration and so would change nothing it does; bind the gateway in the Manifest to terraform/azure-api-management:1.0.0, which writes the API's policy, or leave the attachment out" $name $.metadata.instance_id) -}}
      {{- end -}}
  # The address is composed once, in locals, and both provides and the workload
  # below read it, so the two cannot disagree. The host defaults to the one
  # Azure gives the instance.
  locals:
    endpoint: '{{ default (printf "https://%s.azure-api.net" .infra.api_management_name) (optional .infra "gateway_url" "") }}/{{ .infra.api_path }}'
  provides:
    endpoint: "{{ .locals.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .locals.endpoint }}"
    port: 443
