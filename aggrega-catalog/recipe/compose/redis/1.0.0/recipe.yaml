apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: redis
  version: 1.0.0
  license: AGPL-3.0
  description: >
    Redis for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). Used as an in-memory cache with no
    persistence, so no data volume is declared. Authentication is off by
    default. An attached password is enforced: the server is started with
    --requirepass in its arguments, since the image reads no variable that
    would carry it, so the value shows in the service's command. The value is
    read under the variable the attachment's values.key names, or else
    REDIS_PASSWORD, and an attachment delivering it under neither halts the
    build naming the slot.
    provides.host is the bare service name, resolved on the compose network.
    Encrypted client connections are not served here: infra.client_tls set to
    true, or a certificate attached to server_certificate, halts the build by
    name, because the server reads its certificate from files and no credential
    Feature realized on Compose names a secret a service can mount. The helm
    realization redis serves TLS from that slot.
    The packaged Redis server is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/redis:1.0.0
  # This Recipe reads from infra.overrides:
  #   image - string (the container image reference, replacing the default the
  #           Recipe composes from infra.engine_version). The repository is
  #           authored here rather than exposed, so a Release needing a
  #           different image — one built to be reconciled by a Redis
  #           controller, say — names the whole reference through this key.
  #           The image named there is given the same server arguments as the
  #           stock one — the knobs, the port and the password — so it must
  #           start redis-server from a flag-leading argument list, as the
  #           stock image's entrypoint does.

  # vector_search is true while the image this Recipe runs serves the Redis
  # query engine's vector search, and empty otherwise. With no
  # infra.overrides.image the image is redis at infra.engine_version, which
  # carries the query engine from 8.0.0 on; the tag is compared as a version
  # only where it reads as one, a variant suffix such as -alpine counted as
  # part of its release, so a tag naming no release, such as latest, publishes
  # it empty rather than stopping the build. With an override, it is
  # infra.image_serves_vector_search that says so. helm/redis writes the same
  # template: a provides entry imports nothing, so the two are edited
  # together.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "redis"
    vector_search: '{{ $image := optional (optional .infra "overrides" dict) "image" "" }}{{ if $image }}{{ if .infra.image_serves_vector_search }}true{{ end }}{{ else if regexMatch "^[0-9]+(\\.[0-9]+){0,2}(-[0-9A-Za-z.-]+)?$" .infra.engine_version }}{{ if semverCompare ">=8.0.0-0" .infra.engine_version }}true{{ end }}{{ end }}'

  # Encrypted client connections are refused by name here. The image serves TLS,
  # but the server reads its certificate and key from files, and a Compose
  # service mounts a file attachment only from a credential that names a secret
  # resource — which no Compose realization of the catalog's credential Features
  # does — so this realization has no way to hand the server its certificate.
  # Both directions halt: client_tls true, and a certificate attached while it is
  # false, since nothing here would present it.
  #
  # An attached password is enforced, or the build halts: the image reads no
  # password variable of its own, so a value this Recipe could not find would
  # leave the cache open while the Aggregate asks for it to be protected. The
  # value is read under the variable the attachment names in values.key, as
  # core/secret-value delivers it, and otherwise under REDIS_PASSWORD.
  workload: |
    {{- if .infra.client_tls }}
    {{- fail (printf "infra.client_tls is true on %q, but this Compose realization of core/datastore/redis cannot serve TLS: the server reads its certificate and key from files, and no credential Feature the catalog realizes on Compose names a secret a service can mount as files; set infra.client_tls to false, or map the component to helm/redis in the Manifest, which serves TLS from the server_certificate slot" .context.instance_id) }}
    {{- end }}
    {{- if hasKey (default dict .features) "server_certificate" }}
    {{- fail (printf "a certificate is attached to the server_certificate slot of %q, but infra.client_tls is false and this Compose realization of core/datastore/redis serves plaintext alone, since no credential Feature the catalog realizes on Compose delivers a certificate as files, so nothing would present it; remove the attachment, or map the component to helm/redis in the Manifest and set infra.client_tls to true there" .context.instance_id) }}
    {{- end }}
    {{- $password := "" }}
    {{- if hasKey (default dict .features) "password" }}
    {{- $passwordKey := default "REDIS_PASSWORD" (optional (optional (index .features "password") "values" dict) "key" "") }}
    {{- $delivered := optional (default dict .context.inject) "env" dict }}
    {{- if not (optional $delivered $passwordKey "") }}
    {{- fail (printf "the password slot of %q is attached, but no value reaches this Recipe under %s, the variable it reads the password from, so the server cannot be started with it; attach core/secret-value and name the variable in its values.key, or deliver the value under REDIS_PASSWORD" .context.instance_id $passwordKey) }}
    {{- end }}
    {{- $password = index $delivered $passwordKey }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "{{ if .infra.overrides }}{{ if .infra.overrides.image }}{{ .infra.overrides.image }}{{ else }}redis:{{ .infra.engine_version }}{{ end }}{{ else }}redis:{{ .infra.engine_version }}{{ end }}"
        # Config knobs are passed as redis-server flags; the official image's
        # entrypoint prepends `redis-server` to a flag-leading argument list. The
        # block is emitted only when a knob, a moved port or a password is set,
        # so a bare cache renders no args. Persistence (a durable StatefulSet +
        # PVC) is a synthesized-Helm realization; this local-dev Compose flavor
        # is ephemeral and declares no data volume, mirroring how the Compose
        # postgres flavor leaves storage to the helm target.
        #
        # The server is told its port (--port) only when infra.port differs from
        # 6379, the port the Redis server listens on when it is given none — a
        # fact about the server, not a copy of the Component's default. So a
        # cache at the default port renders no flag, and one an operator moved
        # listens where its healthcheck and the published port point.
        #
        # An attached password reaches the server as --requirepass, last in the
        # arguments. The image's entrypoint reads no variable that would carry
        # it to the server, so the arguments are the form it allows: the value
        # shows in the service's command and in the container's configured
        # command, though not in the running server's command line, which the
        # server rewrites to its address once it starts. No shell expands the arguments on their way to the server,
        # so a password holding whitespace or *, ? or [ reaches it intact. With
        # no password attached, nothing is emitted and the cache runs without
        # authentication.
    {{- $portFlag := ne (toString .infra.port) "6379" }}
    {{- if or .values.maxmemory .values.maxmemory_policy .values.databases .values.appendonly $portFlag $password }}
        args:
    {{- with .values.databases }}
          - "--databases"
          - "{{ . }}"
    {{- end }}
    {{- with .values.maxmemory }}
          - "--maxmemory"
          - "{{ . }}"
    {{- end }}
    {{- with .values.maxmemory_policy }}
          - "--maxmemory-policy"
          - "{{ . }}"
    {{- end }}
    {{- if .values.appendonly }}
          - "--appendonly"
          - "yes"
    {{- end }}
    {{- if $portFlag }}
          - "--port"
          - "{{ .infra.port }}"
    {{- end }}
    {{- if $password }}
          - "--requirepass"
          - {{ $password | toJson }}
    {{- end }}
    {{- end }}
        ports:
          redis: {{ .infra.port }}
        # The service's healthcheck sends PING with the image's own redis-cli to
        # the service's port. Redis documents PING as the check that a connection
        # is alive and that the server can serve data. Without its -e option the
        # client does not turn an error reply into a failing exit status, so the
        # check passes once the server answers on that port and fails while
        # nothing answers there. A service keeps one healthcheck, so one probe is
        # declared.
        health:
          ready:
            exec:
              - redis-cli
              - "-p"
              - "{{ .infra.port }}"
              - ping
            periodSeconds: 10
            timeoutSeconds: 5
    services:
      default:
        type: ClusterIP
        ports:
          redis: {{ .infra.port }}
