apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: redis
  version: 1.0.0
  license: AGPL-3.0
  description: >
    Redis for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). Used as an in-memory cache with no
    persistence, so no data volume is declared. Authentication is off by
    default; when a password credential is attached its value arrives on the
    env pipe and is rendered as the REDIS_PASSWORD environment variable.
    Images that read that variable (Bitnami-packaged Redis) enable
    authentication from it; the plain upstream image expects the password
    through its configuration and ignores the variable.
    provides.host is the bare service name, resolved on the compose network.
    The packaged Redis server is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/redis:1.0.0
  # This Recipe reads from infra.overrides:
  #   image - string (the container image reference, replacing the default the
  #           Recipe composes from infra.engine_version). The repository is
  #           authored here rather than exposed, so a Release needing a
  #           different image — one built to be reconciled by a Redis
  #           controller, say — names the whole reference through this key.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "redis"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "{{ if .infra.overrides }}{{ if .infra.overrides.image }}{{ .infra.overrides.image }}{{ else }}redis:{{ .infra.engine_version }}{{ end }}{{ else }}redis:{{ .infra.engine_version }}{{ end }}"
        # Config knobs are passed as redis-server flags; the official image's
        # entrypoint prepends `redis-server` to a flag-leading argument list. The
        # block is emitted only when a knob is set, so a bare cache renders no
        # args. Persistence (a durable StatefulSet + PVC) is a synthesized-Helm
        # realization; this local-dev Compose flavor is ephemeral and declares no
        # data volume, mirroring how the Compose postgres flavor leaves storage
        # to the helm target.
    {{- if or .values.maxmemory .values.maxmemory_policy .values.databases .values.appendonly }}
        args:
    {{- with .values.databases }}
          - "--databases"
          - "{{ . }}"
    {{- end }}
    {{- with .values.maxmemory }}
          - "--maxmemory"
          - "{{ . }}"
    {{- end }}
    {{- with .values.maxmemory_policy }}
          - "--maxmemory-policy"
          - "{{ . }}"
    {{- end }}
    {{- if .values.appendonly }}
          - "--appendonly"
          - "yes"
    {{- end }}
    {{- end }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached its value arrives on the inject
        # pipe as .context.inject.env.REDIS_PASSWORD. With no credential
        # attached, no auth env is emitted and the cache runs without
        # authentication.
    {{- if .context.inject.env }}
    {{- if .context.inject.env.REDIS_PASSWORD }}
        variables:
          REDIS_PASSWORD: "{{ .context.inject.env.REDIS_PASSWORD }}"
    {{- end }}
    {{- end }}
        ports:
          redis: {{ .infra.port }}
    services:
      default:
        type: ClusterIP
        ports:
          redis: {{ .infra.port }}
