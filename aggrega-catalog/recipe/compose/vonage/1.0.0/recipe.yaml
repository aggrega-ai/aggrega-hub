apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vonage
  version: 1.0.0
  description: >
    The Vonage voice carrier as a reference realization for local development
    with Docker Compose: no service is defined for it and nothing is
    provisioned, because the carrier runs outside the composition. What a
    consumer needs is the base address, both webhook addresses, the modality and
    the direction, and those reach the consuming service through the injection
    context rather than through a service definition — compose has no
    counterpart to an in-cluster alias, so the address travels to the caller
    instead of being aliased for it.

    The two webhook addresses are published to consumers exactly as the operator
    supplied them. They are opaque pointer strings: this recipe pipes each
    through unchanged, and nothing here resolves an address, contacts one, or
    derives one from the state of a cluster.

    This recipe pins no artifact. It names no image — the Release calls a
    service its own operator contracts for directly.

    No credential is delivered here, and none can be: with no service defined,
    a credential attached to one of the component's slots would reach no
    emitted file, so the build halts naming the slot. On compose the
    credential belongs to the component that calls the carrier, attached there
    under the environment-variable name that component reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/messaging/vonage:1.0.0
  # A credential FeatureRecipe on compose delivers onto the inject pipe of the
  # component it is attached to, and the reference workload below defines no
  # service to read that pipe, so an attached credential would be accepted and
  # then written nowhere. The build halts instead, naming the first filled slot
  # in the order the Component declares them.
  #
  # DELIBERATE NEAR-DUPLICATE: each compose reference realization whose Component
  # declares a credential slot carries this assertion, naming its own slots,
  # because an assertion sits inside the Recipe that evaluates it and no catalog
  # kind holds one for several Recipes to share.
  assertions:
    carries_no_credential: >-
      {{- range $slot := list "api_key" "api_secret" "signature_secret" -}}
      {{- if hasKey (default dict $.features) $slot -}}
      {{- fail (printf "the %s slot of %q carries a credential, but the compose realization of core/messaging/vonage defines no service, so the credential would reach no emitted file; on compose, attach it to the component that calls the carrier, under the environment variable that component reads" $slot $.metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below. The two webhook
  # addresses likewise have one authored home each, in infra.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    answer_url: "{{ .infra.answer_url }}"
    event_url: "{{ .infra.event_url }}"
    modality: "{{ .values.modality }}"
    direction: "{{ .values.direction }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
