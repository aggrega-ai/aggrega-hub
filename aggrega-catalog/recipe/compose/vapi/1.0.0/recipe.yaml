apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vapi
  version: 1.0.0
  description: >
    The Vapi voice-agent platform as a reference realization for local
    development: no service is defined for it and nothing is provisioned. The
    compiler carries the platform's API base address and the assistant
    coordinates to consumers through the injection contract, so an application
    developed locally reaches the same platform it will reach in a cluster.

    This recipe pins no artifact. It names no image and no chart — the deployment
    calls a platform its own operator contracts for directly, and the wiring is
    the whole of what is emitted.

    No credential is delivered here, and none can be: with no service defined,
    a credential attached to the component's slot would reach no emitted file,
    so the build halts naming the slot. On compose the credential belongs to
    the component that calls the platform, attached there under the
    environment-variable name that component reads.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/vapi:1.0.0
  # A credential FeatureRecipe on compose delivers onto the inject pipe of the
  # component it is attached to, and the reference workload below defines no
  # service to read that pipe, so an attached credential would be accepted and
  # then written nowhere. The build halts instead, naming the slot.
  #
  # DELIBERATE NEAR-DUPLICATE: each compose reference realization whose Component
  # declares a credential slot carries this assertion, naming its own slots,
  # because an assertion sits inside the Recipe that evaluates it and no catalog
  # kind holds one for several Recipes to share.
  assertions:
    carries_no_credential: >-
      {{- range $slot := list "api_key" -}}
      {{- if hasKey (default dict $.features) $slot -}}
      {{- fail (printf "the %s slot of %q carries a credential, but the compose realization of core/ai-agent/vapi defines no service, so the credential would reach no emitted file; on compose, attach it to the component that calls the platform, under the environment variable that component reads" $slot $.metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below. Every key here
  # is piped through exactly as authored: nothing is resolved,
  # contacted or derived.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    assistant_id: "{{ .values.assistant_id }}"
    assistant_version: "{{ .values.assistant_version }}"
    phone_number_id: "{{ .infra.phone_number_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
