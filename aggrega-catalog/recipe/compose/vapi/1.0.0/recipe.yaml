apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: vapi
  version: 1.0.0
  description: >
    The Vapi voice-agent platform as a reference realization for local
    development: no service is defined for it and nothing is provisioned. The
    compiler carries the platform's API base address and the assistant
    coordinates to consumers through the injection contract, so an application
    developed locally reaches the same platform it will reach in a cluster.

    This recipe pins no artifact. It names no image and no chart — the deployment
    calls a platform its own operator contracts for directly, and the wiring is
    the whole of what is emitted.

    No credential is delivered here. A credential attached to the component's slot
    is materialized by that credential's own realization, and the consuming
    application references the material under the name the deployment gave it,
    because the environment-variable name a credential arrives under belongs to
    the consumer rather than to the platform.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/vapi:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below. Every key here
  # is piped through as the string the deployment wrote: nothing is resolved,
  # contacted or derived.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    assistant_id: "{{ .values.assistant_id }}"
    assistant_version: "{{ .values.assistant_version }}"
    phone_number_id: "{{ .infra.phone_number_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
