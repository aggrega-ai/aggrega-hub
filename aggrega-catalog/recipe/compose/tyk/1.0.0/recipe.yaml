apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: tyk
  version: 1.0.0
  license: MPL-2.0
  description: >
    Tyk Gateway for local development via Docker Compose, synthesized from the
    Workload kind by the compose provider. There is no chart to point at here,
    so this Recipe assembles the container over the same published image the
    Kubernetes realization's chart runs and sets the same gateway settings as
    environment overrides; everything else is left to the configuration file
    the image ships. The gateway holds no local state — the Redis-protocol
    store wired on the `cache` edge holds its keys, counters and sessions — so
    it renders stateless with no volume.

    With no credential on the cache connection the gateway connects to the
    store with an empty password, as the store components for this target
    expect; an attached one arrives under TYK_STORE_PASSWORD, the key it must
    publish under, and is rendered as a plain environment variable. A dependency
    derived from a uses-edge waits on the store having started rather than
    reporting healthy, so on a cold host the gateway may start first and
    retries; no readiness wait is hidden in a command line.

    Nothing is published to the host, so the data plane is reachable from the
    compose network only. The contract is key-for-key the Kubernetes
    realization's; only host differs, being the compose service name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/gateway/tyk:1.0.0

  # This Recipe reads from the `cache` uses-edge, which must deliver the store's
  # address on the injection context under these keys:
  #   TYK_STORE_HOST     - the store's provides.host
  #   TYK_STORE_PORT     - the store's provides.port
  #   TYK_STORE_PASSWORD - the attached credential's value, when the connection
  #                        carries the optional credential
  #
  # This Recipe reads from infra.overrides:
  #   api_secret       - string (the gateway's own API secret; default is a development literal)
  #   storage_database - integer (logical database index on the wired store; default 0)
  #
  # provides is evaluated before the workload and cannot read it, so the
  # data-plane port has one authored home in .infra.port that every reader
  # dereferences — provides.port here, and below the gateway's listen port, the
  # container port and the service entry; the literal is never repeated.
  #
  # The contract is key-for-key the one the Kubernetes realization publishes;
  # only host is spelled differently, because it is the name the compose
  # provider gives the synthesized service.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"
  # Synthesized-mode Workload: the image, the environment, the exposed port and
  # the service entry are translated from the Workload kind by the compose
  # provider. The Kubernetes realization points at the chart the gateway's
  # maintainers publish; there is no chart to point at here, so this Recipe
  # assembles the container directly over the same published image and sets the
  # same gateway settings the chart sets, expressed as the environment overrides
  # the gateway reads. Everything this Recipe does not set is left to the
  # configuration file the image ships, which is where the gateway's working
  # directories and its policy source already point. The gateway holds no local
  # state — the wired Redis-protocol store holds its keys, rate-limit counters
  # and session state — so it renders stateless and declares no volume.
  #
  # With no credential on the cache connection the gateway connects with an
  # empty password, which is what the store components for this target expect
  # until a credential is attached to them too; with one attached, its value
  # arrives on the inject pipe under TYK_STORE_PASSWORD, which is therefore also
  # the key the attached credential must publish under, because compose has no
  # env-from-secret primitive and a plain environment variable is the delivery
  # this target has.
  #
  # One ordering property is worth knowing before this is deployed onto a cold
  # host, and it is a property of the target rather than of this Recipe: a
  # dependency derived from a uses-edge waits on the target having started
  # rather than on it reporting healthy, so the gateway may start before the
  # store is accepting connections and will retry. No readiness wait is hidden
  # in a command line to compensate: that would move a lifecycle concern into a
  # string nothing can inspect or diagnose.
  workload: |
    {{- $apiSecret := "tyk-development-secret" -}}
    {{- if and .infra.overrides .infra.overrides.api_secret -}}
    {{- $apiSecret = .infra.overrides.api_secret -}}
    {{- end -}}
    {{- $storageDatabase := 0 -}}
    {{- if and .infra.overrides (hasKey .infra.overrides "storage_database") -}}
    {{- $storageDatabase = .infra.overrides.storage_database -}}
    {{- end -}}
    {{- /*
      Each core/upstream-key-pinning attachment on this gateway names
      upstreams and the key accepted from each; its FeatureRecipe
      (upstream-key-pinning-tyk) has already refused what this gateway cannot
      honour, so every entry here is one upstream and one key. The entries of
      every attachment, in attachment-name order and then in the order each
      lists them, are joined here into the one setting the gateway reads, and
      the text of each key is carried through unread. An upstream two
      attachments both name halts the build, because the gateway would keep
      only one of the two keys. An attachment is found by its type with any
      version it was authored with set aside, so core/upstream-key-pinning
      and core/upstream-key-pinning:1.0.0 are both read. The setting is
      emitted below as an escaped scalar so material carrying line breaks
      reaches the gateway intact. With no such attachment the joined value is
      empty, nothing is emitted, and the rendered container is what it would
      be without this block.
    */ -}}
    {{- $sep := "" -}}
    {{- $pins := "" -}}
    {{- $pinned := dict -}}
    {{- range $name, $f := (default dict .features) -}}
    {{- if eq (first (splitList ":" $f.type)) "core/upstream-key-pinning" -}}
    {{- range $pin := $f.infra.pins -}}
    {{- if hasKey $pinned $pin.upstream -}}
    {{- fail (printf "core/upstream-key-pinning attachments %q and %q on %q both pin the upstream %q, but core/gateway/tyk keeps one key for an upstream, so one of the two would be dropped; name the upstream in one attachment" (get $pinned $pin.upstream) $name $.context.instance_id $pin.upstream) -}}
    {{- end -}}
    {{- $_ := set $pinned $pin.upstream $name -}}
    {{- $pins = printf "%s%s%s:%s" $pins $sep $pin.upstream (first $pin.public_keys) -}}
    {{- $sep = "," -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- /* Whether a `cache` connection carries a credential. Its value arrives
           on the inject pipe under the key the credential publishes,
           TYK_STORE_PASSWORD. */ -}}
    {{- $cacheCredential := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "cache") (hasKey (default dict $edge.features) "credential") -}}
    {{- $cacheCredential = true -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The gateway holds no durable state — the wired store is where its keys and
    # counters live — so the stateless form is correct: there is nothing for a
    # volume to outlive the container for, and none is declared. No replica
    # count is authored: the Component exposes none for this target, and
    # authoring one here would raise an unsupported-field warning naming a
    # setting nobody asked for.
    form: stateless
    containers:
      main:
        image: "docker.tyk.io/tyk-gateway/tyk-gateway:{{ .infra.engine_version }}"
        # No command or args override — the image's own default command starts
        # the gateway against the configuration file the image ships. Each
        # variable below overrides one setting in that file: the listen port,
        # the storage connection composed from the `cache` uses-edge, the
        # gateway's own API secret, and the policy source, which names the
        # standalone posture explicitly rather than leaving it to be inferred.
        variables:
          TYK_GW_LISTENPORT: "{{ .infra.port }}"
          TYK_GW_STORAGE_TYPE: "redis"
          TYK_GW_STORAGE_ADDRS: "{{ .context.inject.env.TYK_STORE_HOST }}:{{ .context.inject.env.TYK_STORE_PORT }}"
          TYK_GW_STORAGE_DATABASE: "{{ $storageDatabase }}"
          TYK_GW_SECRET: "{{ $apiSecret }}"
          TYK_GW_NODESECRET: "{{ $apiSecret }}"
          TYK_GW_POLICIES_POLICYSOURCE: "file"
    {{- if $cacheCredential }}
          TYK_GW_STORAGE_PASSWORD: "{{ .context.inject.env.TYK_STORE_PASSWORD }}"
    {{- end }}
    {{- if $pins }}
          TYK_GW_SECURITY_PINNEDPUBLICKEYS: {{ $pins | toJson }}
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    # A ClusterIP service entry keeps the gateway on the compose network, which
    # is where its consumers sit: a consumer wired to it resolves the service
    # name and the port straight from the edge. Nothing is published to the
    # host, so the data plane is not reachable from outside the network on this
    # target.
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
