apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: agentgateway
  version: 1.0.0
  license: Apache-2.0
  description: >
    agentgateway for local development via Docker Compose, synthesized from
    the Workload kind by the compose provider: one service running the
    project's image, pinned by digest, from one configuration file mounted
    from a compose config. Nothing is published to the host; provides.host is
    the compose service name.

    Each model wired to the models socket is one entry of that file, named by
    the connection's alias and sent to the endpoint and model name the model
    publishes. A connection's credential is the value it publishes as
    AI_PROXY_<ALIAS>_API_KEY on the inject pipe, written into the service's
    environment as it was delivered — a Compose variable reference such as
    ${OPENAI_API_KEY} lands as that reference, a literal as itself — and the
    entry names the variable, never the value. The file attaches no UI to
    the data-plane port.

    It realizes none of the AI Features the Component's labels admit, so
    attaching one halts the build naming its type, and it halts on
    infra.callers: this target holds no Secret to read the callers' keys
    from.

    Reach for it under Docker Compose; reach for `agentgateway-chart` on
    Kubernetes. The image carries no shell or client to run a check from, so
    the service declares no healthcheck.

    The gateway's metrics are always on, on port 15020, which checks no caller
    and which any peer on the compose network reaches. With
    `values.metrics_enabled` true their address is published as
    provides.metrics_endpoint; false, that key is empty.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/gateway/agentgateway:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides is evaluated before the workload and cannot read it, so the
  # data-plane port has one authored home in .infra.http_port that every
  # reader dereferences — provides.port here, and below the configuration's
  # gateway port, the container port and the service entry.
  #
  # The contract is key-for-key the one the Kubernetes realization publishes,
  # so a consumer reads the same keys on either target. Only host is spelled
  # differently: it is the name the compose provider gives the synthesized
  # service, which is the component instance's own name. A consumer on the
  # same compose network resolves it directly. endpoint is the base URL every
  # wired model is served under, /v1 on that name and port; model is the alias
  # values.model names. With nothing wired to the models socket values.model is
  # omitted — the component's assertion halts on any other combination — and
  # both are empty.
  #
  # metrics_endpoint is the address the gateway serves its own metrics at while
  # values.metrics_enabled is true: /metrics on port 15020 of the service.
  # agentgateway's stats listener is always on, on every interface, so a peer on
  # the compose network reaches it with no port published and nothing is added
  # for it; false only leaves the key empty. It is spelled out in full on
  # purpose: a provides entry cannot read another.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.http_port }}"
    protocol: "http"
    endpoint: '{{ with optional .values "model" "" }}http://{{ $.context.instance_id }}:{{ $.infra.http_port }}/v1{{ end }}'
    model: '{{ optional .values "model" "" }}'
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}:15020/metrics{{ end }}"

  # The pins and the names the artifact and the workload share, each written
  # once here; the two are separate templates with no binding either could
  # dereference, so they read them from here.
  #
  # image is the gateway's image, pinned by tag and by the digest of its
  # index, so every platform the project publishes resolves to the build read
  # here. DELIBERATE NEAR-DUPLICATE of recipe/helm/agentgateway-chart's
  # locals.image: a pin sits inside the Recipe that renders it and no catalog
  # kind holds one for two Recipes to share, so the two are moved together.
  # No setting moves it: the configuration below is written for this release,
  # whose provider and path rules differ from the release before it.
  #
  # config_name is the compose config the artifact declares and the volume
  # sources; config_path is the file it is mounted as and the gateway is
  # started on, since a compose config carries no file name.
  #
  # A models connection's credential reaches the gateway under one variable
  # named after the connection's alias in capitals, with every character other
  # than a letter or a digit as an underscore, between the fixed parts here.
  # A locals entry cannot read a connection, so each template applies the
  # alias rule itself, the rule the Component's assertion
  # credential_variables_are_distinct checks.
  locals:
    image: "cr.agentgateway.dev/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c"
    config_name: "{{ .context.instance_id }}-config"
    config_path: /config/config.yaml
    connection_variable_prefix: AI_PROXY_
    credential_variable_suffix: _API_KEY

  # The configuration file, as one compose config the workload mounts as one
  # file at config_path. It is always written: with nothing wired to the
  # models socket the file lists no model, and the gateway serves none.
  #
  # DELIBERATE NEAR-DUPLICATE of the configuration recipe/helm/agentgateway-chart
  # writes through the chart's `config` value. The chart takes the file only as
  # that value, which a value mapping writes, and this Recipe delivers it as a
  # compose config, which its artifacts write; a value mapping imports only a
  # mapping library and an artifact only an artifact library, so no one
  # template reaches both. The two are edited together, and a build of both
  # from one Release, with the two files compared, shows them alike.
  #
  # One gateway, `default`, listening on infra.http_port; the model-serving
  # routes attach to it. No `ui` section is written, so agentgateway serves its
  # UI on its admin interface alone, inside the container, never on the
  # data-plane port.
  #
  # Each connection, in alias order, is one model entry named by its alias, an
  # OpenAI-compatible provider accepting chat completions, whose base URL is
  # the endpoint the model publishes, written verbatim: agentgateway appends
  # /chat/completions to it and takes its path as the whole base path. The
  # entry asks for the model name the model publishes. agentgateway refuses a
  # base URL that is not absolute, that names user information, a query or a
  # fragment, or whose scheme is neither http nor https without a port, so the
  # build halts on such an endpoint, naming the connection, and on an empty
  # model name, which would send the alias upstream as one.
  #
  # Two readers expand a $ in this file, one after the other. Docker Compose
  # reads $NAME and ${NAME} anywhere in a compose file, a config's content
  # included, as its own variables, and spells a literal $ as $$; agentgateway
  # then reads $NAME and ${NAME} in the file it is given as its environment's
  # variables, refusing the file when one is unset, and also spells a literal
  # $ as $$. So a connection carrying a credential has its entry's apiKey
  # written $$AI_PROXY_<ALIAS>_API_KEY, which reaches the gateway as
  # $AI_PROXY_<ALIAS>_API_KEY and is replaced from the service's environment,
  # and each string a model publishes is written with every $ as $$$$, which
  # reaches the gateway as $$ and is read as one $. A published string reaches
  # the gateway as it was published, and the file names the variable, never
  # the value. Because agentgateway puts the credential into the file's text
  # before it reads the file as YAML, the key must be a plain token — letters,
  # digits and - . _ ~ + / = — and other characters can load as a different
  # key or stop the gateway.
  artifacts:
    agentgateway-config.compose-fragment.yaml: |
      {{- $wired := list }}
      {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "models" }}
      {{- $wired = append $wired $alias }}
      {{- $u := urlParse (toString $edge.provides.endpoint) }}
      {{- if not (and (has $u.scheme (list "http" "https")) $u.host (not $u.userinfo) (not $u.query) (not $u.fragment)) }}
      {{- fail (printf "the models connection %s of %q reaches %q, whose published endpoint %q is not an absolute http or https URL free of user information, a query and a fragment, so agentgateway would refuse it as the base URL of the model entry" $alias $.context.instance_id $edge.target (toString $edge.provides.endpoint)) }}
      {{- end }}
      {{- if not (toString $edge.provides.model) }}
      {{- fail (printf "the models connection %s of %q reaches %q, which publishes no model name, so the model entry would send the alias %s upstream as the model a request asks for" $alias $.context.instance_id $edge.target $alias) }}
      {{- end }}
      {{- end }}
      {{- end }}
      configs:
        {{ .locals.config_name }}:
          content: |
            gateways:
              default:
                port: {{ .infra.http_port }}
            llm:
      {{- if not $wired }}
              models: []
      {{- else }}
              models:
      {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "models" }}
                - name: {{ $alias | toJson }}
                  provider:
                    custom:
                      formats:
                        - type: completions
                  params:
                    model: {{ toString $edge.provides.model | toJson | replace "$" "$$$$" }}
                    baseUrl: {{ toString $edge.provides.endpoint | toJson | replace "$" "$$$$" }}
      {{- if hasKey (default dict $edge.features) "credential" }}
                    apiKey: {{ printf "$$%s%s%s" $.locals.connection_variable_prefix (regexReplaceAll "[^A-Z0-9]" (upper $alias) "_") $.locals.credential_variable_suffix | toJson }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}

  # Synthesized-mode Workload: the image, the arguments, the environment, the
  # mounted configuration and the port are translated from the Workload kind
  # by the compose provider.
  workload: |
    {{- /* The models connections carrying a credential. A connection's
           credential arrives on the inject pipe as the value it publishes,
           under AI_PROXY_<ALIAS>_API_KEY; one that publishes it under any
           other name would leave the variable the entry names unset, and the
           gateway refuses a file naming an unset variable, so the build halts
           naming the connection and the name. What the configuration is
           written from — the gateway port and each connection's alias, the
           endpoint and model name its model publishes, and whether it carries
           a credential — is digested as CONFIG_DIGEST below.

           Callers are not realized here: each caller's key would have to
           reach the gateway by reference to one Secret holding a key per
           caller, and this target has no secret reference and no realization
           of a credential carrying several keys, so a declared caller would go
           unchecked. The build halts on infra.callers rather than render open
           routes under a declared protection. */ -}}
    {{- with optional .infra "callers" list -}}
    {{- fail (printf "infra.callers of %q declares %s, but the compose realization of agentgateway checks no caller's key: each key would have to reach the gateway by reference to the one Secret the caller_keys slot names, and this target holds no Secret and has no realization of a credential carrying a key per caller; use agentgateway-chart, which checks each caller's key, or remove infra.callers" $.context.instance_id (join ", " .)) -}}
    {{- end -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $credentials := list -}}
    {{- $configSet := list .infra.http_port -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if eq $edge.socket "models" -}}
    {{- $hasCredential := hasKey (default dict $edge.features) "credential" -}}
    {{- $configSet = append $configSet (list $alias (toString $edge.provides.endpoint) (toString $edge.provides.model) $hasCredential) -}}
    {{- if $hasCredential -}}
    {{- $variable := printf "%s%s%s" $.locals.connection_variable_prefix (regexReplaceAll "[^A-Z0-9]" (upper $alias) "_") $.locals.credential_variable_suffix -}}
    {{- if not (hasKey $env $variable) -}}
    {{- fail (printf "the models connection %s of %q carries a credential, but its inject pipe holds nothing named %s, the name this Recipe reads that credential under; publish it under %s, which with core/secret-value is values.key" $alias $.context.instance_id $variable $variable) -}}
    {{- end -}}
    {{- $credentials = append $credentials (dict "name" $variable "value" (index $env $variable)) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The gateway holds no state of its own: its configuration is the mounted
    # file, and nothing it does here is written anywhere.
    form: stateless
    containers:
      main:
        image: "{{ .locals.image }}"
        # The image's own entrypoint starts the gateway; the arguments name the
        # mounted configuration file, as the project's Docker instructions do.
        args: ["-f", "{{ .locals.config_path }}"]
        # Each models connection carrying a credential: the variable its entry
        # names, holding the value the credential delivered, written as it was
        # delivered. Then the digest of what the configuration is written from,
        # a variable nothing reads: docker compose up re-creates a service's
        # container when its own definition changed, and a config's content is
        # no part of that definition, so a changed configuration changes this
        # value and the next docker compose up re-creates the gateway.
        variables:
    {{- range $credentials }}
          {{ .name }}: {{ .value | toJson }}
    {{- end }}
          CONFIG_DIGEST: "{{ sha256sum (toJson $configSet) }}"
        ports:
          http: {{ .infra.http_port }}
        # The image holds the gateway's binary and its system libraries and
        # nothing else — no shell, HTTP client or socket tool — and the binary
        # has no command reporting its health, so no healthcheck can run inside
        # it and none is declared. The chart realization keeps the chart's own
        # readiness probe.
        # Each quantity is quoted because it is a string: a value with no unit
        # suffix — a whole-core cpu count, say — would otherwise be read as a
        # number and rejected before the target ever sees it.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: config
            path: "{{ .locals.config_path }}"
    volumes:
      config:
        configmap:
          source: "{{ .locals.config_name }}"
    # A ClusterIP service entry keeps the gateway on the compose network, which
    # is where its consumers sit: a consumer wired to it resolves the service
    # name and the port straight from the edge. Nothing is published to the
    # host.
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.http_port }}
