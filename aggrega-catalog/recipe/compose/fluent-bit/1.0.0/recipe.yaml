apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: fluent-bit
  version: 1.0.0
  description: >
    Fluent Bit log forwarder for local development via Docker Compose.
    Synthesized-mode Workload — the compose provider translates the Workload
    into a service entry. The sink host and port resolved from the
    `forward_target` uses-edge arrive on .context.inject.env and are written
    into a minimal fluent-bit.conf `forward` output at start-up, so the
    forwarder ships records to that sink. Fluent Bit holds no persistent state.
    provides.host is the bare service name, resolved on the compose network.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: compose
  implements: core/observability/fluent-bit:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # The forward output below speaks the Fluentd forward protocol to whatever is
  # wired on forward_target, a socket whose selector admits any server. The
  # check that each wired sink publishes forward lives in the TargetProtocol
  # library's Check bundle, imported under artifacts by every Recipe of this
  # Component. These locals are what it reads — the socket, the protocol, why
  # Fluent Bit needs it and a component publishing it — and it stops the build,
  # naming the connection, on a sink publishing another protocol or none. It
  # writes no file.
  locals:
    check_socket: forward_target
    check_protocol: forward
    check_reason: "Fluent Bit ships its records through a forward output, which speaks the Fluentd forward protocol a sink publishes as the protocol forward"
    check_example: core/observability/fluentd
  artifacts:
    target-protocol:
      $import: TargetProtocol#/artifacts/Check

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "fluent/fluent-bit:{{ .infra.engine_version }}"
        # The sink resolved from the `forward_target` uses-edge arrives on the
        # inject pipe (.context.inject.env) and is written into the fluent-bit.conf
        # forward output at start-up, then Fluent Bit is exec'd against that
        # config with its monitoring endpoint bound to the infra port.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/fluent-bit.conf <<'EOF'
            [SERVICE]
                Flush        1
                Log_Level    info
                HTTP_Server  On
                HTTP_Listen  0.0.0.0
                HTTP_Port    {{ .infra.port }}
            [INPUT]
                Name   dummy
                Dummy  {"message": "log record from fluent-bit"}
            [OUTPUT]
                Name   forward
                Match  {{ .values.forward_match }}
                Host   {{ .context.inject.env.FLUENT_FORWARD_HOST }}
                Port   {{ .context.inject.env.FLUENT_FORWARD_PORT }}
            EOF
            exec /fluent-bit/bin/fluent-bit -c /tmp/fluent-bit.conf
        ports:
          http: {{ .infra.port }}
    services:
      default:
        type: NodePort
        ports:
          http: {{ .infra.port }}
