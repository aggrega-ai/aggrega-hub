apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: server
  version: 1.0.0
  description: >
    The generic long-running server primitive on Docker Compose: one service
    running infra.image, listening on infra.port, which is published on the
    host's loopback address, 127.0.0.1, so the application answers at
    localhost on that port and on no other host interface. Reach for
    helm/server on Kubernetes.

    The service is sized from infra.compute. It runs one container, so an
    infra.replicas above one is refused by name, as Docker Compose keeps no
    replica count for a service it is handed this way.

    An edge's inject block dictates what reaches the container: each env
    entry a variable under that name, and each file entry a file from a
    Compose config. An arg entry, or any other mechanism, is refused by name:
    the recipe renders no command line. An edge that dictates nothing
    delivers nothing. The component's own inject block delivers env entries
    the same way.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/compute/server:1.0.0
  # This is the only realization of the component at this target, so the
  # Manifest entry mapping the component's type to it names one candidate rather
  # than choosing between several. The entry is still required: recipe
  # resolution is mapping-driven, and a component instance with no mapping for
  # its type halts the build whatever its implementers.
  #
  # infra keys read here: image, port, replicas, compute. The component's
  # infra.overrides block carries the keys its cloud realizations read; this
  # Recipe reads none of its keys. No provides contract is emitted, because the
  # component declares none.
  #
  # Every Component value and infra key is honoured or refused below by name:
  #   honoured — infra.image (required), infra.port as the container's port and
  #     the port published on the host's loopback address, infra.replicas at
  #     one, and infra.compute.cpu and infra.compute.memory as the service's
  #     limits and reservations.
  #   refused — infra.replicas above one; an edge's arg or custom-mechanism
  #     entry, and a file entry at a path that is not absolute or that lies
  #     beneath another entry's path.
  #
  # Where the service is reached. The image is the Release's, an application
  # someone develops on the machine running the stack, so the port is published
  # on the host's loopback address alone: a browser or a client on that machine
  # reaches it at localhost, and nothing on the host's other interfaces does. A
  # peer on the compose network reaches it at the service's own name.
  #
  # No health check is declared. On this target a service's one check runs
  # inside its image, and the image is the Release's: whether it carries a shell
  # and the tool a TCP or HTTP check runs cannot be known here, and a check
  # whose tool is missing reports the service unhealthy for ever. helm/server
  # declares a TCP readiness probe, which Kubernetes runs from outside the
  # container.
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image serving the application in the Release" -}}
      {{- end -}}
    # Docker Compose runs the service this Recipe writes as one container. A
    # replica count above one would be dropped with a warning rather than
    # honoured, so it is refused by name instead.
    one_replica: >-
      {{- if gt (int (optional .infra "replicas" 1)) 1 -}}
      {{- fail (printf "infra.replicas is %d, and this realization runs the server as one Docker Compose service, one container, which keeps no replica count: set infra.replicas to 1 in the Release, or map core/compute/server to helm/server in the Manifest, which runs that many replicas behind one Service" (int .infra.replicas)) -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; a sub-key the Release sets empty would leave the
    # emitted service without that quantity, so this halts on it, naming each
    # separately so the reader is told which one is empty.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered service would carry no CPU limit or reservation: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered service would carry no memory limit or reservation: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  provides: {}
  # Delivery from an edge. The image is the Release's own code, so no name this
  # Recipe could choose is one that code reads: each of the component's
  # connections dictates its own delivery in its inject block, and an edge that
  # dictates nothing delivers nothing. The pipe is read as a map. Every env
  # entry becomes a variable of the service's environment under the name the
  # edge gave it, its value written whole, so a Compose variable reference a
  # credential delivers, such as ${DB_PASSWORD}, stays one for Compose to
  # substitute when the stack starts. Every file entry becomes a Compose config
  # holding the entry's content, written in the fragment below, mounted as one
  # file at the path the edge names, so a path that is not absolute, or one
  # lying beneath another entry's path, is refused. An arg entry is refused,
  # because this Recipe renders no command line: Compose takes a service's
  # command in place of the image's default command, which is the Release's.
  # Any other mechanism is refused too. A refusal names the entry, its
  # mechanism and the connection that dictated it. The checks are helm/server's,
  # worded for Compose.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, whose env entries reach the pipe under the
  # names the developer chose and so become variables of the service's
  # environment with every other env entry. The component has no own value this
  # Recipe names and this Recipe refuses no variable by its name, so nothing
  # here reads which names that block delivers.
  workload: |
    {{- $inject := default dict .context.inject }}
    {{- $env := optional $inject "env" dict }}
    {{- $files := optional $inject "file" dict }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Docker Compose takes a service's command in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    containers:
      main:
        image: "{{ .infra.image }}"
        ports:
          http: {{ .infra.port }}
        {{- if $env }}
        variables:
          {{- range $k, $v := $env }}
          {{ toJson $k }}: {{ toJson $v }}
          {{- end }}
        {{- end }}
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-file-{{ $i }}
            path: {{ toJson $path }}
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if $files }}
    volumes:
      {{- $i := 0 }}
      {{- range $path, $_ := $files }}
      inject-file-{{ $i }}:
        configmap:
          source: "{{ $.context.instance_id }}-file-{{ $i }}"
      {{- $i = add $i 1 }}
      {{- end }}
    {{- end }}
    # The port on the host's loopback address only: see the header above.
    services:
      default:
        type: Loopback
        ports:
          http: {{ .infra.port }}
  # The compose configs holding the file entries an edge dictates, one per file
  # and numbered in path order, the names the workload's volumes read. A compose
  # config is written as one file at the path it is mounted at, and Docker
  # Compose substitutes a $ in its content, so each $ is doubled and the file
  # holds the content as the edge delivered it. They are emitted only while an
  # edge dictates a file, so a build with none renders nothing here.
  artifacts:
    server-files.compose-fragment.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files }}
      configs:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        {{ printf "%s-file-%d" $.context.instance_id $i | toJson }}:
          content: {{ toString $v | replace "$" "$$" | toJson }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
