apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai-agent
  version: 1.0.0
  description: >
    An OpenAI Assistants API assistant as a reference realization for local
    development, so no service runs. The compose engine carries the endpoint,
    the assistant identifier and the api_key credential to consumers through the
    injection contract.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-agent/openai:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    assistant_id: "{{ .values.assistant_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
    credential:
      from: api_key
      env: OPENAI_API_KEY
