apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: memcached
  version: 1.0.0
  description: >
    Memcached for local development via Docker Compose. Synthesized-mode
    Workload — the compose provider translates the Workload kind into a service
    entry (image, port, exposed service). In-memory cache with no persistence,
    so no data volume is declared. Authentication is off by default; when a
    password credential is attached its value arrives on the env pipe and is
    rendered as MEMCACHED_USERNAME / MEMCACHED_PASSWORD environment variables.
    SASL authentication requires a Memcached image built with SASL support;
    the plain image ignores these variables and runs without authentication.
    provides.host is the bare service name, resolved on the compose network.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/datastore/memcached:1.0.0
  # This Recipe reads no infra.overrides keys.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "memcached"

  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "memcached:{{ .infra.engine_version }}"
        # Tuning knobs pass as memcached server flags; the official image's
        # entrypoint prepends `memcached` to a flag-leading argument list. The
        # block is emitted only when a knob is set, so a bare cache renders no
        # args.
    {{- if or .values.memory_limit .values.max_connections .values.threads .values.max_item_size }}
        args:
    {{- with .values.memory_limit }}
          - "-m"
          - "{{ . }}"
    {{- end }}
    {{- with .values.max_connections }}
          - "-c"
          - "{{ . }}"
    {{- end }}
    {{- with .values.threads }}
          - "-t"
          - "{{ . }}"
    {{- end }}
    {{- with .values.max_item_size }}
          - "-I"
          - "{{ . }}"
    {{- end }}
    {{- end }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached its value arrives on the inject
        # pipe as .context.inject.env.MEMCACHED_PASSWORD; the SASL username is a
        # developer value. With no credential attached, no auth env is emitted
        # and the cache runs without authentication.
    {{- if .context.inject.env }}
    {{- if .context.inject.env.MEMCACHED_PASSWORD }}
        variables:
          MEMCACHED_USERNAME: "{{ .values.username }}"
          MEMCACHED_PASSWORD: "{{ .context.inject.env.MEMCACHED_PASSWORD }}"
    {{- end }}
    {{- end }}
        ports:
          memcached: {{ .infra.port }}
    services:
      default:
        type: ClusterIP
        ports:
          memcached: {{ .infra.port }}
