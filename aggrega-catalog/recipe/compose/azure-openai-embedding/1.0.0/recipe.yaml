apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-openai-embedding
  version: 1.0.0
  description: >
    Azure OpenAI's managed embedding API as a reference realization: no compute runs in-cluster. The compiler carries the operator-supplied endpoint to consumers through the injection contract; no service runs. No credential is delivered by this recipe: a consumer that needs one declares it as `credential` on the socket that reaches this endpoint and delivers it from its own container, because the environment-variable name belongs to the consumer.

    Reach for it where the Azure OpenAI resource already exists outside the Release; reach for terraform/azure-openai-embedding where the Release is to create the resource and its model deployment.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/azure-openai-embedding:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below. model is the deployment name,
  # the name a request addresses on this provider, rather than the model's
  # own name.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.deployment_name }}"
  assertions:
    # An Azure OpenAI resource's host belongs to the organisation that
    # provisioned the resource, so no address exists for the catalog to hold as
    # a default: the Release names the resource this model is deployed in.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches the Azure OpenAI resource its model is deployed in, and that resource's host belongs to the organisation that provisioned it, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the base URL of that resource (https://<resource>.openai.azure.com)" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
