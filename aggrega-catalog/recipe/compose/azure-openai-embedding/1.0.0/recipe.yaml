apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: azure-openai-embedding
  version: 1.0.0
  description: >
    Azure OpenAI's managed embedding API as a reference realization: no compute runs in-cluster. the compose engine carries the operator-supplied endpoint and credential to consumers through the injection contract; no service runs.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/ai-model/azure-openai-embedding:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    credential:
      from: azure_credentials
      env: AZURE_OPENAI_API_KEY
