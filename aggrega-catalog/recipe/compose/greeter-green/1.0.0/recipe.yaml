apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: greeter-green
  version: 1.0.0
  description: >
    The ALTERNATE physical implementation of example/compute/greeter — the "green" build.
    No greeter instance reaches it through the type tier; it is selected only
    when the Manifest name tier overrides a specific instance to it.
spec:
  capability: compose
  implements: example/compute/greeter:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "greeter:green"
        variables:
          VARIANT: "green"
          MESSAGE: "{{ .values.message }}"
        ports:
          http: {{ optional .infra `port` 8080 }}
    services:
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}
