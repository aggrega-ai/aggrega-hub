apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: promptlayer
  version: 1.0.0
  description: >
    The hosted prompt registry as a reference realization for local development
    with Docker Compose: no service is defined for it and nothing is
    provisioned, because the registry runs outside the composition. What a
    consumer needs is the base address and the release label, and those reach
    the consuming service through the injection context rather than through a
    service definition — compose has no counterpart to an in-cluster alias, so
    the address travels to the caller instead of being aliased for it.

    This recipe pins no artifact. It names no image — the deployment calls a
    service its own operator contracts for directly.

    No credential is delivered here: a consumer that needs the registry's API key
    declares the `credential` slot on the socket that reaches the registry and
    delivers it from its own container, because the environment-variable name a
    credential arrives under belongs to the consumer rather than to the endpoint.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: compose
  implements: core/devtool/promptlayer:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    prompt_label: "{{ .values.prompt_label }}"
    protocol: "https"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
