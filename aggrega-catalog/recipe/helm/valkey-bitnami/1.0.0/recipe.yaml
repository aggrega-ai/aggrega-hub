apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: valkey-bitnami
  version: 1.0.0
  description: >
    Valkey via Bitnami Helm chart (bitnami/valkey), standalone architecture.
    Used as an in-memory cache with persistence disabled, so the chart renders
    a stateless Deployment rather than a StatefulSet and requests no persistent
    volume. Authentication is off by default; when a password credential is
    attached its value arrives on the env pipe and the chart's password
    authentication is enabled with that password. Default chart version in
    source.version; override via infra.source_version.
    The synthesized helm Recipe (helm/valkey), which runs the official upstream
    valkey/valkey image directly with no external chart, is the preferred path
    for this cache. This chart-wrap is retained for compatibility with existing
    deployments and may be retired in favor of the synthesized Recipe.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/datastore/valkey:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/valkey
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"6.1.16\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "valkey"

  # This Recipe reads from infra.overrides:
  #   image           - map[string]string (chart image.* fields)
  valuesMapping: |
    ## ── Architecture (standalone, stateless cache) ─────────────
    ## The chart defaults to a replicated StatefulSet with persistence; the
    ## cache role pins a single standalone Deployment with persistence off.
    architecture: standalone
    primary:
      kind: Deployment
      persistence:
        enabled: false

      ## ── Ports ────────────────────────────────────────────────
      containerPorts:
        valkey: {{ .infra.port }}
      service:
        ports:
          valkey: {{ .infra.port }}

      ## ── Resources ────────────────────────────────────────────
      resources:
        requests:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"

    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- end }}

    ## ── Authentication (optional credential slot) ──────────────
    ## Off by default. When the optional `password` slot is filled, the
    ## credential value arrives on the inject pipe and enables chart password
    ## authentication; the chart provisions its own Secret from that password.
    {{- if and .context.inject.env .context.inject.env.VALKEY_PASSWORD }}
    auth:
      enabled: true
      password: "{{ .context.inject.env.VALKEY_PASSWORD }}"
    {{- else }}
    auth:
      enabled: false
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/valkey
      version: 6.1.16
      digest: sha256:0b56cb939a8359f9c53a4f6af7f29071aabb53fe333f846575b54da4337e7ae1
      manifestDigest: sha256:8e40dd0e5c1ce337de06e4c18430f9ab6ec075fdacf46085ef2fff2344a217e6
