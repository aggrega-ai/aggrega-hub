apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: bland
  version: 1.0.0
  description: >
    The Bland voice-agent platform as a reference realization on Kubernetes: no
    compute runs in-cluster and nothing is provisioned. The helm provider emits an
    ExternalName Service mapping an in-cluster name onto the platform's API base
    address, so a consumer may reach it under a stable in-cluster name whichever
    address the operator pointed it at.

    This recipe pins no artifact. It names no image, no chart and no module — the
    deployment calls a platform its own operator contracts for directly, and the
    wiring is the whole of what is emitted.

    No credential is delivered here. A credential attached to either of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name it was
    given, because the environment-variable name a credential arrives under
    belongs to the consumer rather than to the platform.

    The api_key slot is required here: a build leaving it empty halts naming
    it. The byo_telephony_key slot stays optional.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/bland:1.0.0
  # The Component declares its api_key slot optional, because its compose
  # realization defines no service to carry one. Here the credential is
  # materialized by its own realization for the consumer to reference, and the
  # platform authenticates every request with it, so an empty slot halts the
  # build, naming it. byo_telephony_key is optional on every target and is not
  # checked.
  #
  # DELIBERATE NEAR-DUPLICATE: each helm reference realization whose Component
  # leaves a carrier-issued credential slot optional for compose carries this
  # assertion, naming its own slots, because an assertion sits inside the Recipe
  # that evaluates it and no catalog kind holds one for several Recipes to share.
  assertions:
    credential_slots_filled: >-
      {{- range $slot := list "api_key" -}}
      {{- if not (hasKey (default dict $.features) $slot) -}}
      {{- fail (printf "the %s slot of %q is empty, and the helm realization of core/ai-agent/bland requires it: the platform issues this credential and no default stands in for it, so attach a credential to the %s slot" $slot $.metadata.instance_id $slot) -}}
      {{- end -}}
      {{- end -}}
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together. Every key here is
  # piped through exactly as authored: nothing is resolved, contacted or
  # derived.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    pathway_id: "{{ .values.pathway_id }}"
    pathway_version: "{{ .values.pathway_version }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
