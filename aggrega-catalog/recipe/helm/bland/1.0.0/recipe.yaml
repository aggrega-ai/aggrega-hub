apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: bland
  version: 1.0.0
  description: >
    The Bland voice-agent platform as a reference realization on Kubernetes: no
    compute runs in-cluster and nothing is provisioned. The helm provider emits an
    ExternalName Service mapping an in-cluster name onto the platform's API base
    address, so a consumer may reach it under a stable in-cluster name whichever
    address the operator pointed it at.

    This recipe pins no artifact. It names no image, no chart and no module — the
    deployment calls a platform its own operator contracts for directly, and the
    wiring is the whole of what is emitted.

    No credential is delivered here. A credential attached to either of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name it was
    given, because the environment-variable name a credential arrives under
    belongs to the consumer rather than to the platform.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/bland:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together. Every key here is
  # piped through exactly as authored: nothing is resolved, contacted or
  # derived.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    pathway_id: "{{ .values.pathway_id }}"
    pathway_version: "{{ .values.pathway_version }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
