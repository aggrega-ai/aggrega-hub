apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: bedrock-agent
  version: 1.0.0
  description: >
    An Amazon Bedrock agent as a reference realization, so no compute runs
    in-cluster. The helm provider emits an ExternalName Service that maps an
    in-cluster DNS name onto the operator-supplied regional agent-runtime
    endpoint. No credential is delivered by this recipe — consumers authenticate
    with ambient AWS IAM (for example EKS IRSA) or inject their own credentials.
    provides.endpoint is the regional host and provides.agent_name is the
    developer-selected agent.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/bedrock:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    agent_name: "{{ .values.agent_name }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
