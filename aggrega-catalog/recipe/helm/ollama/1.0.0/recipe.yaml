apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ollama
  version: 1.0.0
  license: MIT
  description: >
    Ollama as a self-hosted inference server on Kubernetes via the helm
    provider's Workload synthesis, running the official upstream image directly
    (no external Helm chart). Renders a StatefulSet: a weights-pull initContainer
    resolves the model pointer into a per-replica model-cache volume, and the
    serving container mounts the same volume and serves the OpenAI-compatible API
    behind a ClusterIP Service. The model value is a deterministic pointer the
    initContainer resolves at pod start; the compiler never fetches weights. When
    the optional model_pull_token credential slot is attached the token reaches
    the initContainer as an env secretKeyRef, so it never appears in the rendered
    manifest; unattached, weights are pulled anonymously, byte-identically to a
    recipe with no slot. provides.host is the bare, self-contained in-cluster
    service name of the synthesized ClusterIP Service — it carries no namespace,
    so the recipe is independent of where it is deployed. A consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing). Readiness and liveness probes ask the server's root
    path, which answers once the server listens. Reach for this realization
    where the build must complete with nothing fetched, or where more than one
    serving replica is wanted — each replica here gets its own model cache;
    reach for `ollama-chart`, which renders the community-maintained Ollama
    chart, where the replica bounds should render a horizontal autoscaler,
    which this realization does not emit.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/ollama:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default"; endpoint is
  # the OpenAI-compatible base URL an ai-agent consumer reads (mapped to
  # OPENAI_BASE_URL), single-sourced from the same host and port.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/v1"
    model: "{{ .values.model }}"
    protocol: "http"
  workload: |
    {{- $model := .values.model | replace "'" "'\\''" | squote | replace "$" "$$" -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful gives each replica a stable per-replica model-cache claim
    # (persistentTemplate below); the initContainer pulls the weights into it
    # before the serving container starts.
    form: stateful
    replicas: {{ .infra.replicas }}
    {{- with (default dict .infra.gpu).runtime_class }}
    runtimeClassName: "{{ . }}"
    {{- end }}
    initContainers:
      - name: model-pull
        image: "ollama/ollama:{{ .infra.engine_version }}"
        # Pulls the model into the shared model-cache volume before serving
        # starts. ollama pull needs a running server, so the initContainer
        # starts one against the cache dir, waits for it, pulls, and stops it.
        # .values.model is the deterministic pointer the runtime resolves here;
        # the compiler pipes the string unresolved (AOT).
        #
        # The pod starts the serving container only once this step exits
        # successfully, and the status the step exits with would otherwise be
        # that of stopping the server it started, which succeeds whether or not
        # the pull did. So the pull's own status is captured the moment it
        # returns and becomes the step's exit status: a failed pull keeps the
        # pod from serving instead of letting the server come up against an
        # empty cache, which the readiness probe below would not notice.
        #
        # The model name reaches ollama pull exactly as written, whatever it
        # contains. $model, at the top of this template, wraps it in single
        # quotes for the shell, writing each single quote inside it as '\'',
        # so the shell reads the whole name as one word and expands or runs
        # nothing in it. Each $ in it is then doubled, because Kubernetes
        # expands $(NAME) in a container's arguments and reads $$ as one $
        # before the shell starts. The line is written as a JSON string, so
        # a quote or a backslash in the name cannot end it early, with U+0085
        # written as an escape: JSON leaves that character as it is, and YAML
        # would read it as a line break and fold it into a space.
        command: ["/bin/sh"]
        args:
          - "-c"
          - {{ printf "ollama serve & serve_pid=$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull %s; pull_status=$?; kill $serve_pid; exit $pull_status" $model | toJson | replace "\u0085" "\\u0085" }}
        variables:
          OLLAMA_MODELS: /models
    {{- if hasKey (default dict .features) "model_pull_token" }}
        # Gated-model pull token, delivered as an env secretKeyRef so the value
        # never lands in the manifest. Emitted only when the slot is attached.
        attachments:
          OLLAMA_PULL_TOKEN:
            from: model_pull_token
            as: env
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    containers:
      main:
        image: "ollama/ollama:{{ .infra.engine_version }}"
        # The serving container reads the pre-pulled weights from the same
        # model-cache volume and serves on the configured port.
        variables:
          OLLAMA_HOST: "0.0.0.0:{{ .infra.port }}"
          OLLAMA_MODELS: /models
        ports:
          http: {{ .infra.port }}
        # The server answers GET / with "Ollama is running" once it listens,
        # and it listens before loading any model: the weights are already on
        # the cache volume, because the pull step above completes first, and a
        # model is loaded into memory by the first request that names it. The
        # product documents no health endpoint, so the path and every timing
        # are the ones the community chart the catalog also wraps gives its
        # own probes.
        health:
          ready:
            http: /
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          live:
            http: /
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if (default dict .infra.gpu).count }}
            "nvidia.com/gpu": "{{ .infra.gpu.count }}"
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    volumes:
      model-cache:
        persistentTemplate:
          size: "{{ .infra.model_cache.size }}"
    {{- with .infra.model_cache.class }}
          class: "{{ . }}"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
