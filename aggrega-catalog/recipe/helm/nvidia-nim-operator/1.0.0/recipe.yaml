apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: nvidia-nim-operator
  version: 1.0.0
  # No licence identifier is stated, for the reason the Component gives: the
  # chart and the container this Recipe runs are listed by NVIDIA under the
  # NVIDIA AI Enterprise Software License Agreement, their source under
  # Apache-2.0.
  description: >
    Installs NVIDIA's NIM Operator through NVIDIA's own `k8s-nim-operator`
    Helm chart, pulled from NVIDIA's chart repository at helm.ngc.nvidia.com,
    at the chart release whose application version is the tag of the operator
    image the Component defaults to; the image is infra.image. The chart is
    official, published by NVIDIA; complete, carrying the operator, its
    custom-resource definitions and every role it binds; and maintained, each
    of its releases carrying the operator release of the same version.

    Using it needs an NVIDIA account and an NGC API key, under NVIDIA's
    licence terms: NVIDIA's documentation lists the chart and the operator
    image under its own licence agreement, and every NIMService the operator
    reconciles pulls a NIM image the reader must be entitled to pull. The
    cluster must already run NVIDIA's GPU Operator, which no build checks.

    The chart renders the operator Deployment, its account, its cluster and
    leader-election roles, its metrics Service and the nine definitions of
    its `apps.nvidia.com` API, NIMService among them. Its admission webhook,
    which needs cert-manager, stays off, as do its definitions-upgrade hook
    and its Dynamo components. Nothing is generated when the build runs. The
    chart places its namespaced objects in the namespace the Release, or else the Aggregate, declares
    for the component, so the build halts unless one is declared.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/nvidia-nim-operator:1.0.0

  # NVIDIA's own chart, from its own chart repository, which answers a chart
  # request with no credential. Its default version, 3.1.2, is the release
  # whose application version is the tag of the image the Component defaults
  # to, so the chart's templates, its definitions and the operator move
  # together; infra.source_version picks another chart release, and the image
  # follows it only where the Release sets infra.image too.
  source:
    kind: helm-https-chart
    url: https://helm.ngc.nvidia.com/nvidia
    chart: k8s-nim-operator
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"3.1.2\" }}"

  # This Recipe reads no infra.overrides keys.
  #
  # The chart is read for the values below; everything else stays the chart's
  # own default at its release: the operator's resources, its probes, its
  # security contexts, and its toleration of and preference for the
  # control-plane nodes.
  #
  # Names. The chart names its Deployment from fullnameOverride, pinned here to
  # the rendered name, and every other object itself: the ServiceAccount
  # k8s-nim-operator, the cluster role and binding k8s-nim-operator-role and
  # k8s-nim-operator-rolebinding, the metrics-reader cluster role, the
  # leader-election role and the Service k8s-nim-operator-metrics-service. The
  # operator reads none of them by a name a Release could change, and the
  # cluster-scoped ones are one per cluster, so one installation runs per
  # cluster. The operator watches every namespace, so a NIMService written into
  # any namespace is reconciled.
  #
  # Images. The chart runs one image, the operator's, which it composes as
  # operator.image.repository, a colon and operator.image.tag, putting its own
  # application version in place of an empty tag. The Component's infra.image,
  # pinned by default to the 3.1.2 release, is cut at the last colon after its
  # last slash into that repository and tag, which the chart joins back into
  # exactly the reference the Release names, a digest reference included; so a
  # chart release picked through infra.source_version does not move the image
  # with it. A reference with no tag or digest would run the chart's own
  # default in its place, so it halts the build at the top of the mapping,
  # naming infra.image.
  #
  # Custom-resource definitions. The chart carries them in its crds directory,
  # which the helm provider renders with the chart, so they are installed
  # beside the operator at the chart's release and move with it. The chart's
  # definitions-upgrade hook, a Job that re-applies the same definitions
  # before a Helm upgrade, is switched off: the rendered output already
  # carries them at the chart's release, and the hook would add a Job, its
  # account and a cluster role able to rewrite every definition in the
  # cluster.
  #
  # Webhooks. The chart's admission webhook stays off, as the chart ships it:
  # it needs cert-manager, or a certificate Secret the Component does not
  # name, and the operator runs without it.
  #
  # Extras outside the control plane stay off, as the chart ships them, and
  # are written out so the render does not depend on the defaults: the Dynamo
  # platform and its definitions, which the chart carries as dependencies, and
  # the NodeFeatureRule labelling NVIDIA PCI devices.
  #
  # Namespace. The chart writes no namespace on its Deployment, its
  # ServiceAccount or its metrics Service, and writes the release namespace on
  # the subjects of its role bindings, which is the namespace the Release, or else the Aggregate,
  # declares for the component through the aggrega.ai/namespace annotation.
  # With one declared, the provider places every namespaced object there too,
  # so the bindings name the account where it is created. With none declared
  # the bindings would name the namespace default while the account landed
  # wherever the applying tool put it, so the build halts at the top of the
  # mapping, naming the annotation.
  valuesMapping: |
    {{- $declared := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
    {{- if not $declared }}
    {{- fail (printf "%q is installed through NVIDIA's k8s-nim-operator chart, which binds its roles to an account in the namespace the Release, or else the Aggregate, declares for the component, and neither declares one; declare the annotation aggrega.ai/namespace on %q or on its boundary in the Release" .context.instance_id .context.instance_id) }}
    {{- end }}
    {{- if not (contains ":" (last (splitList "/" .infra.image))) }}
    {{- fail (printf "infra.image of %q is %q, which names no tag or digest, and NVIDIA's k8s-nim-operator chart puts its own default tag in place of a missing one: set infra.image to the full reference of the operator image, tag or digest included" .context.instance_id .infra.image) }}
    {{- end }}
    {{- $tag := last (splitList ":" (last (splitList "/" .infra.image))) }}
    {{- $repository := trimSuffix (printf ":%s" $tag) .infra.image }}
    fullnameOverride: "{{ .context.rendered_name }}"
    operator:
      upgradeCRD: false
      image:
        repository: "{{ $repository }}"
        tag: "{{ $tag }}"
      admissionController:
        enabled: false
    nfd:
      nodeFeatureRules:
        deviceID: false
    dynamo:
      enabled: false
