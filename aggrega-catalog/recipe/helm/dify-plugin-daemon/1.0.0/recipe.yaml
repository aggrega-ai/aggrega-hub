apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: dify-plugin-daemon
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Dify plugin runtime on Kubernetes via the helm provider's Workload
    synthesis. Installed plugin packages and the Python environments prepared
    for them live on the runtime's own volume, so the workload renders as a
    StatefulSet with a persistent claim, alongside the governing headless
    Service the stateful form requires and a ClusterIP Service publishing the
    dispatch port. One replica is rendered: a second would hold a different
    plugin set and answer differently depending on which one a call reached.

    It keeps its plugin catalogue in a database of its own on the backend's
    server, named by plugin_database, and calls the API server back on its
    internal API. The backend password and the two keys it shares with the API
    server and the worker each come from a credential when one is attached and
    otherwise from a pinned development literal, for evaluation and local
    development; the two it presents, to the backend and to the API server, are
    held on those connections, and the two keys are attached on all three or on
    none.

    provides.host is the bare in-cluster Service name, with no namespace; a
    consumer in another namespace qualifies it on its own side.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/dify-plugin-daemon:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-default"
  # with no namespace segment, so the recipe is independent of where it is
  # deployed. A same-namespace consumer reaches it under this name directly; a
  # cross-namespace consumer qualifies it with the target namespace on its own
  # side (caller-side routing).
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # One replica is rendered because the installed-plugin set lives on the
  # runtime's own claim, so a second replica would hold a different set.
  #
  # The backend, cache and API-server identities resolved from the component's
  # uses-edges arrive on .context.inject.env. The backend identity passes
  # through under the names the runtime itself reads, except for the database
  # name: the runtime keeps its plugin catalogue in a database of its own, so
  # DB_DATABASE carries the developer's plugin_database value rather than the
  # platform database the backend edge published. The API-server edge is
  # translated into DIFY_INNER_API_URL, the internal endpoint the runtime calls
  # to resolve workspace and credential context.
  #
  # The backend password comes from a credential when the backend connection
  # carries one and from an inline development default otherwise. The same
  # holds for the runtime's own server key, a slot of its own, and for the key
  # it presents on the internal API, held on its api connection: each falls
  # back to a pinned development literal matching the one the API-server and
  # worker Recipes emit, so the three agree with no external secret. Those two
  # keys are read by the runtime, the API server and the worker alike, so a
  # credential for either is attached on all three or on none of them.
  workload: |
    {{- /*
      The alias of each connection carrying a credential, or empty: the
      backend's password and the key presented on the API server's internal
      API.
    */ -}}
    {{- $backendCredential := "" -}}
    {{- $apiCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if hasKey (default dict $edge.features) "credential" -}}
    {{- if eq $edge.socket "backend" -}}{{- $backendCredential = $alias -}}{{- end -}}
    {{- if eq $edge.socket "api" -}}{{- $apiCredential = $alias -}}{{- end -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume and the headless Service below are companions of
    # this form. The claim holds the installed plugin packages and their
    # prepared runtime environments.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "langgenius/dify-plugin-daemon:{{ .infra.engine_version }}"
        variables:
          SERVER_PORT: "{{ .infra.port }}"
          # The backend identity arrives on the inject pipe under the names the
          # runtime itself reads. DB_DATABASE is the exception: the runtime
          # keeps its catalogue in its own database on the same server, so the
          # developer's value wins over the name the edge published.
          DB_TYPE: postgresql
          DB_HOST: "{{ .context.inject.env.DB_HOST }}"
          DB_PORT: "{{ .context.inject.env.DB_PORT }}"
          DB_USERNAME: "{{ .context.inject.env.DB_USERNAME }}"
          DB_DATABASE: "{{ .values.plugin_database }}"
          DB_SSL_MODE: disable
          REDIS_HOST: "{{ .context.inject.env.REDIS_HOST }}"
          REDIS_PORT: "{{ .context.inject.env.REDIS_PORT }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "cache" }}
          REDIS_DB: "{{ $edge.values.db_index }}"
    {{- end }}
    {{- end }}
          # The API-server edge is translated into the internal endpoint the
          # runtime calls back on.
          DIFY_INNER_API_URL: "http://{{ .context.inject.env.API_HOST }}:{{ .context.inject.env.API_PORT }}"
          # The two keys this runtime and the API server present to each other.
          # SERVER_KEY is the key a caller must present to this runtime, behind
          # its own credential slot; DIFY_INNER_API_KEY is the key this runtime
          # presents back to the API server, held on its api connection.
          # Unattached, the Recipe emits the pinned development literal below —
          # the same literal the API-server and worker Recipes emit — so the
          # stack runs self-contained with no external secret. Attached, the
          # literal is not emitted and the credential subsystem delivers the
          # value on the same variable through the attachments block further
          # down. This runtime, the API server and the worker all read these two
          # keys, so a credential is attached on all three or on none of them:
          # attaching it to some of them leaves the rest carrying a different
          # value, which renders cleanly and is refused when the call between
          # them is made.
    {{- if not (hasKey (default dict .features) "plugin_daemon_key") }}
          SERVER_KEY: dify-plugin-daemon-server-key
    {{- end }}
    {{- if not $apiCredential }}
          DIFY_INNER_API_KEY: dify-plugin-inner-api-key
    {{- end }}
          FORCE_VERIFYING_SIGNATURE: "{{ .values.verify_signature }}"
          MAX_PLUGIN_PACKAGE_SIZE: "{{ .values.max_package_size }}"
          PLUGIN_MAX_EXECUTION_TIMEOUT: "{{ .values.max_execution_timeout }}"
          # Plugin packages and their prepared environments live on the claim
          # mounted below, so every storage path is rooted there.
          PLUGIN_STORAGE_TYPE: local
          PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
          PLUGIN_WORKING_PATH: /app/storage/cwd
          PLUGIN_INSTALLED_PATH: plugin
          PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
          PLUGIN_MEDIA_CACHE_PATH: assets
    {{- if not $backendCredential }}
          DB_PASSWORD: apppass
    {{- end }}
    {{- if or $backendCredential (hasKey (default dict .features) "plugin_daemon_key") $apiCredential }}
        attachments:
    {{- with $backendCredential }}
          DB_PASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "plugin_daemon_key" }}
          SERVER_KEY:
            from: plugin_daemon_key
            as: env
    {{- end }}
    {{- with $apiCredential }}
          DIFY_INNER_API_KEY:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The runtime answers GET /health/check on the port it serves. No
        # start-up time is documented, and the image migrates the plugin
        # catalogue's database before the runtime starts, so the liveness probe
        # waits 30 s and allows six misses 10 s apart.
        health:
          ready:
            http: /health/check
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /health/check
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: storage
            path: /app/storage
    volumes:
      storage:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
