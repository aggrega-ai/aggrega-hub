apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: thanos-query
  version: 1.0.0
  license: Apache-2.0
  description: >
    Thanos Query, the query front end of a Thanos metrics stack, on Kubernetes
    via the helm provider's Workload synthesis (a stateless Deployment plus a
    ClusterIP Service on the HTTP port). Query holds no local state — it reads
    through the Store Gateway — so it renders stateless, with no persistent
    volume. The Store Gateway identity resolved from the `store` uses-edge (host,
    port) arrives on .context.inject.env and composes the StoreAPI endpoint Query
    dials on its `--endpoint` flag; a component wired to `store` that publishes
    a protocol other than grpc, or none, halts the build, naming the
    connection. Query reads no object store and needs no
    credentials of its own. With `infra.external_base_url` set, it reaches Query
    as its `--alert.query-url`, the base of the links its web interface writes
    back to itself. Where that address carries a path, Query also takes the path
    as `--web.external-prefix`, so the links and redirects of its own pages carry
    it, and `--web.route-prefix=/` keeps it serving at its root; unset, none of
    these flags is emitted. provides.host is the bare,
    self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed.
    A consumer in another namespace qualifies the host with the target namespace
    on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/thanos-query:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. provides.port is
  # the HTTP PromQL/UI port consumers connect to; protocol is "http".
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.http_port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # Query holds no durable state — it reads through the Store Gateway — so the
    # default stateless form (a Deployment on the helm provider) is correct: no
    # form: stateful, no persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "quay.io/thanos/thanos:{{ .infra.engine_version }}"
        # `thanos query` answers PromQL and fans out over the StoreAPI. The Store
        # Gateway identity resolved from the `store` uses-edge arrives on the
        # inject pipe (.context.inject.env) and composes the --endpoint address.
        # With infra.external_base_url set, --alert.query-url carries it: the
        # base of the link the web interface writes beside every rule and
        # alert, back to its own query page. Where the address carries a path,
        # --web.external-prefix carries that path, so the links, asset paths
        # and redirects of the web interface's own pages follow the address
        # the ingress serves them under. Query would otherwise also move its
        # API and web interface under that path, so --web.route-prefix=/ keeps
        # them at the root, where every consumer composing its address from
        # provides reaches them; the probes below are served at the root
        # either way. Unset, none of these flags is emitted.
        #
        # Query speaks the StoreAPI to the store, a gRPC API, which a store
        # publishes as the protocol grpc. The `store` socket's selector admits
        # any server, so the protocol each wired component publishes is read
        # here and the build halts on any other, or on none, naming the
        # connection.
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "store" }}
    {{- $protocol := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- if ne $protocol "grpc" }}
    {{- $published := "publishes no protocol" }}
    {{- with $protocol }}{{ $published = printf "publishes the protocol %q" . }}{{ end }}
    {{- fail (printf "the store connection %s of %q is wired to %q, which %s, but Thanos Query dials every store over the StoreAPI, a gRPC API a store publishes as the protocol grpc; wire a component publishing grpc, such as core/observability/thanos-store, to the store socket instead" $alias $.context.instance_id $edge.target $published) }}
    {{- end }}
    {{- end }}
    {{- end }}
        args:
          - query
          - --http-address
          - "0.0.0.0:{{ .infra.http_port }}"
          - --grpc-address
          - "0.0.0.0:{{ .infra.grpc_port }}"
          - --endpoint
          - "{{ .context.inject.env.THANOS_STORE_HOST }}:{{ .context.inject.env.THANOS_STORE_PORT }}"
    {{- with .infra.external_base_url }}
          - --alert.query-url
          - "{{ . }}"
    {{- $u := urlParse . }}
    {{- if and $u.host $u.path (ne $u.path "/") }}
          - "--web.external-prefix={{ $u.path }}"
          - --web.route-prefix=/
    {{- end }}
    {{- end }}
        ports:
          http: {{ .infra.http_port }}
          grpc: {{ .infra.grpc_port }}
        # Thanos serves /-/ready and /-/healthy on its HTTP port. An http probe
        # is sent to the container port whose name sorts first, which here is
        # `grpc`, so both probes run the wget of the image's busybox against the
        # HTTP port instead; it fails on an error answer and when nothing
        # answers. No start-up time is documented; the liveness probe waits
        # 10 s before its first check.
        health:
          ready:
            exec:
              - wget
              - "-q"
              - "--spider"
              - "http://127.0.0.1:{{ .infra.http_port }}/-/ready"
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - wget
              - "-q"
              - "--spider"
              - "http://127.0.0.1:{{ .infra.http_port }}/-/healthy"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.http_port }}
