apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: tempo
  version: 1.0.0
  description: >
    Grafana Tempo distributed-tracing server on Kubernetes via the helm
    provider's Workload synthesis, running the official upstream grafana/tempo
    image (no external Helm chart). Tempo is driven in its single-binary shape:
    every subsystem — distributor, ingester, querier, compactor — runs inside
    one process backed by a local trace store, so it renders as one StatefulSet
    with a per-replica data volume, a ConfigMap carrying the Tempo config, a
    ClusterIP Service and a Headless Service exposing the OTLP gRPC and HTTP
    receivers alongside the HTTP query API. The Tempo server image is pinned to a
    resolvable tag for reproducible renders. The developer's retention_period
    flows into the in-process compactor, which deletes stored trace blocks once
    they age past it. provides.host is the bare, self-contained in-cluster
    service name of the synthesized ClusterIP Service — it carries no namespace,
    so the recipe is independent of where it is deployed; a consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing). provides.port is the OTLP gRPC receiver port, the
    endpoint a trace producer wires to. Image tag from infra.engine_version. The
    packaged Tempo server is AGPL-3.0.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/tempo:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "grpc" and
  # the container serves the OTLP gRPC receiver on its fixed port 4317, so
  # provides.port is that fixed value.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "4317"
    protocol: "grpc"
  # A single ConfigMap carries the single-binary Tempo configuration for the
  # synthesized container. It mounts whole into /etc/tempo, where the server's
  # -config.file argument reads tempo.yaml. The developer's retention_period
  # drives the compactor's block retention; the OTLP gRPC and HTTP receivers are
  # served on their conventional ports; traces and the write-ahead log live under
  # the mounted data volume at /var/tempo.
  artifacts:
    config-configmap.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-config
      data:
        tempo.yaml: |
          server:
            http_listen_port: 3200
          distributor:
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: "0.0.0.0:4317"
                  http:
                    endpoint: "0.0.0.0:4318"
          ingester:
            max_block_duration: 5m
          compactor:
            compaction:
              block_retention: "{{ .values.retention_period }}"
          storage:
            trace:
              backend: local
              wal:
                path: /var/tempo/wal
              local:
                path: /var/tempo/blocks
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form (rendered as a
    # volumeClaimTemplate), and the Headless service supplies the StatefulSet's
    # stable network identity.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "grafana/tempo:{{ .infra.engine_version }}"
        # The single-binary server reads its whole configuration from the
        # ConfigMap mounted at /etc/tempo; the trace store and write-ahead log
        # live on the data volume at /var/tempo.
        command: ["/tempo", "-config.file=/etc/tempo/tempo.yaml"]
        ports:
          otlp-grpc: 4317
          otlp-http: 4318
          http: 3200
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/tempo
          - name: config
            path: /etc/tempo
    volumes:
      data:
        persistentTemplate:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "10Gi" }}{{ else }}10Gi{{ end }}"
      config:
        configmap:
          source: "{{ .context.instance_id }}-config"
    services:
      default:
        type: ClusterIP
        ports:
          otlp-grpc: 4317
          otlp-http: 4318
          http: 3200
      headless:
        type: Headless
        ports:
          otlp-grpc: 4317
          otlp-http: 4318
          http: 3200
