apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mariadb
  version: 1.0.0
  description: >
    MariaDB on Kubernetes via the helm provider's Workload synthesis, running the
    official mariadb image directly with no external chart (StatefulSet +
    ClusterIP Service + Headless Service). Nothing has to be installed in the
    cluster first and no chart repository has to be reachable, so this is the
    realization to reach for where no MariaDB control plane runs and where the
    build has to complete without network access. It honors the developer's
    first-initialization scripts, which the controller-driven realization cannot.
    It runs one server, so infra.ha.enabled and a non-zero infra.ha.read_replicas
    halt the build naming the key; the controller-driven realization honors both.
    provides.host is the bare, self-contained in-cluster service name of the
    synthesized ClusterIP Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace qualifies
    the host with the target namespace on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/mariadb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "mariadb"
  # This Recipe runs one MariaDB server, so a highly available primary and read
  # replicas are refused rather than dropped. The image fails over to nothing,
  # and while it can start a server replicating from another, each replica needs
  # a replication password the Component declares no slot for and a server id of
  # its own, which one StatefulSet pod template does not give its pods.
  # helm/mariadb-cluster provides both, through the mariadb-operator controller's
  # replication.
  assertions:
    no_high_availability: >-
      {{- if .infra.ha.enabled -}}
      {{- fail "infra.ha.enabled is true, and this Recipe runs one MariaDB server with no replica to fail over to: set infra.ha.enabled to false, or map this component to helm/mariadb-cluster, which fails over automatically to a read replica the mariadb-operator controller runs beside the primary" -}}
      {{- end -}}
    no_read_replicas: >-
      {{- if gt (int .infra.ha.read_replicas) 0 -}}
      {{- fail (printf "infra.ha.read_replicas is %v, and this Recipe provisions one instance: set infra.ha.read_replicas to 0, or map this component to helm/mariadb-cluster, which provisions read replicas beside the primary" .infra.ha.read_replicas) -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. This realization takes the root
    # password from the credential attached to the root_password slot, as a
    # value on the inject pipe, and the application user's from user_password,
    # which renders as a secretKeyRef — an existing Kubernetes Secret is
    # attached there as core/referenced-secret bound to
    # helm/k8s-existing-secret. It reads neither key, so supplied, or any
    # Secret name, would reach no byte of the output while the build reads as
    # if it had chosen who owns the passwords. Refused here by name:
    # infra.credentials other than generated, and any infra.credentials_secret.
    # Not read: both, while they hold the Component's defaults, generated and
    # empty.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and this realization takes the root password from the credential attached to the root_password slot and the application user's from user_password, which names an existing Kubernetes Secret when that is core/referenced-secret bound to helm/k8s-existing-secret: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database credentials from, and this realization reads no Secret by that name, taking the root password from the credential attached to the root_password slot and the application user's from user_password, which names an existing Kubernetes Secret when that is core/referenced-secret bound to helm/k8s-existing-secret: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}
  # Two ConfigMaps carry the developer's bootstrap scripts and custom server
  # configuration for the synthesized container. Each mounts whole into a
  # dedicated path and is presence-guarded independently: an entry renders empty
  # — and is therefore skipped, emitting no file — when its source value is unset.
  # An Aggregate that sets neither value emits no ConfigMap at all, byte-identical
  # to one with no ConfigMap. init_scripts keys become files under
  # /docker-entrypoint-initdb.d, which the official image executes on first
  # initialization in alphabetical key order. custom_config becomes a custom.cnf
  # the server reads via --defaults-extra-file; it mounts into a dedicated
  # directory the image does not populate, so it never masks the image's own
  # configuration files.
  artifacts:
    initdb-configmap.yaml: |
      {{- if .values.init_scripts -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-initdb
      data:
      {{- range $name, $content := .values.init_scripts }}
        {{ $name }}: |
      {{ $content | indent 4 }}
      {{- end }}
      {{- end }}
    config-configmap.yaml: |
      {{- if .values.custom_config -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-config
      data:
        custom.cnf: |
      {{ .values.custom_config | indent 4 }}
      {{- end }}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form, and the
    # Headless service supplies the StatefulSet's stable network identity.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "mariadb:{{ .infra.engine_version }}"
    {{- if .values.custom_config }}
        # custom_config renders a custom.cnf mounted at /etc/aggrega/config; the
        # --defaults-extra-file argument makes the server read it in addition to
        # the image defaults, and must be the server's first argument. Settings
        # the fragment omits keep their built-in defaults.
        args:
          - "--defaults-extra-file=/etc/aggrega/config/custom.cnf"
    {{- end }}
        # MARIADB_DATABASE / MARIADB_USER / charset / collation are developer
        # values. The two credential slots are delivered differently by design:
        # root_password is a Black-Box slot (featuresSchema inject: []), so its
        # value arrives on the inject pipe from the attached credential, under
        # MARIADB_ROOT_PASSWORD, and is read here — never a workload secret
        # reference. It is read through index whenever the slot is attached, so
        # a credential delivering under another name, or nothing on the pipe,
        # halts the build naming MARIADB_ROOT_PASSWORD rather than starting the
        # server without a root password. user_password is transparent: when a
        # referenceable credential fills it, MARIADB_PASSWORD renders as an env
        # secretKeyRef via containers.attachments; with none attached the Recipe
        # falls back to an inline development default.
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
    {{- if .values.user }}
          MARIADB_USER: "{{ .values.user }}"
    {{- end }}
          MARIADB_CHARACTER_SET_SERVER: "{{ .values.charset }}"
          MARIADB_COLLATION_SERVER: "{{ .values.collation }}"
    {{- $env := default dict (optional (default dict .context.inject) "env" dict) }}
    {{- if or (hasKey (default dict .features) "root_password") (optional $env "MARIADB_ROOT_PASSWORD" "") }}
          MARIADB_ROOT_PASSWORD: "{{ index $env "MARIADB_ROOT_PASSWORD" | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
    {{- end }}
    {{- if not (hasKey (default dict .features) "user_password") }}
          MARIADB_PASSWORD: apppass
    {{- end }}
    {{- if hasKey (default dict .features) "user_password" }}
        attachments:
          MARIADB_PASSWORD:
            from: user_password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        # Readiness runs healthcheck.sh, the check the image ships and MariaDB
        # documents for it, with the two tests its documentation pairs: the
        # server accepts a TCP connection, and InnoDB has finished initializing,
        # including any crash recovery. The image creates the account the script
        # connects as when it first initializes the database, and the temporary
        # server it runs meanwhile takes no network connections, so the pod is
        # reported ready only once the real server is up. Liveness runs
        # mariadb-admin ping over the server's local socket, which succeeds while
        # the server process is running — also during initialization and also
        # when the connection is refused for lack of credentials — so a first
        # start is not restarted. No start-up time is documented: the liveness
        # probe waits 30 s and allows six misses 10 s apart, to cover
        # initialization and the bootstrap scripts.
        health:
          ready:
            exec:
              - healthcheck.sh
              - "--connect"
              - "--innodb_initialized"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - mariadb-admin
              - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/lib/mysql
    {{- if .values.init_scripts }}
          - name: initdb
            path: /docker-entrypoint-initdb.d
    {{- end }}
    {{- if .values.custom_config }}
          - name: dbconf
            path: /etc/aggrega/config
    {{- end }}
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    {{- if .values.init_scripts }}
      initdb:
        configmap:
          source: "{{ .context.rendered_name }}-initdb"
    {{- end }}
    {{- if .values.custom_config }}
      dbconf:
        configmap:
          source: "{{ .context.rendered_name }}-config"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
