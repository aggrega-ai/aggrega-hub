apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: k8up-chart
  version: 1.0.0
  license: Apache-2.0
  description: >
    Installs K8up through the project's own Helm chart, at the chart release
    whose image is the one the Component pins. The chart is official,
    published by the K8up maintainers from the project's repository;
    complete, carrying the custom-resource definitions, the operator and its
    permissions; and maintained, its newest release carrying K8up 2.16.1.

    It renders the operator Deployment, its metrics Service, the
    custom-resource definitions, the cluster roles the operator and its
    backup jobs run under, and the chart's post-install cleanup Job. It
    renders no schedule: helm/backup-k8up writes one beside each datastore
    carrying a core/backup attachment.

    The operator acts on K8up resources in every namespace, so the Release
    may place it in any namespace. Its chart repository must be reachable from
    the build.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/storage/k8up:1.0.0

  # The project's own chart, from its own chart repository. Its default
  # version, 4.10.1, defaults its image to v2.16.1, the tag of the image the
  # Component pins, so the chart's templates, its custom-resource definitions
  # and the image move together; infra.source_version picks another chart
  # release, and the image follows it only where the Release sets infra.image
  # too.
  source:
    kind: helm-https-chart
    url: https://k8up-io.github.io/k8up
    chart: k8up
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"4.10.1\" }}"

  # This Recipe reads no infra.overrides keys; the Component declares none.
  #
  # The chart is read for the values below; everything else stays the chart's
  # own default at its release.
  #
  # Namespace. The operator watches K8up resources in every namespace, and
  # each Schedule is written beside the datastore it backs up, so nothing ties
  # the operator to one namespace: the chart writes its namespaced objects into
  # the release namespace, the namespace the Release declares for the
  # component, or default where it declares none.
  #
  # Names. The chart names its objects after its release name, which the helm
  # provider gives as the component's rendered name; they are left as the chart
  # publishes them. K8up runs once per cluster, and nothing is published for a
  # consumer to reach.
  #
  # Images. The operator runs infra.image, and so does every backup and prune
  # job it starts, since the chart passes the operator's image on as the jobs'
  # image. The chart writes the image as "<registry>/<repository>:<tag>", so
  # the reference is cut at its first slash and at the last colon after its
  # last slash, and the three parts join back into exactly the reference the
  # Release names, a digest reference included; a reference with no slash, or
  # with neither a tag nor a digest, halts, naming it.
  #
  # Custom-resource definitions. They ship in the chart's crds directory and
  # are rendered with the chart, so applying the output installs and updates
  # them. Two of them, podconfigs.k8up.io and prebackuppods.k8up.io, are larger
  # than the copy of the applied object a client-side apply records in an
  # annotation can hold, so they are applied server-side: a client-side apply
  # refuses them.
  #
  # Cleanup Job. The chart renders, as Helm hooks run after an install, an
  # upgrade and a removal, a Job with its service account and roles that
  # deletes, in every namespace, the role binding K8up's backup jobs run
  # under; K8up writes the binding again before each backup. The chart offers
  # no setting that leaves it out, and it is kept as the chart publishes it.
  #
  # Credentials and time zone. The operator's own fallback key, bucket and
  # repository password are left unset, so a Schedule naming no Secret of its
  # own finds none; helm/backup-k8up names them on every Schedule. The
  # operator's time zone, which every Schedule's cron expression is read in,
  # is left to the chart's default, which the chart's values describe as the
  # time zone the cluster runs in.
  valuesMapping: |
    {{- $ref := .infra.image }}
    {{- if not (contains "/" $ref) }}
    {{- fail (printf "infra.image is %q, which names no registry, and K8up's chart writes its image as registry/repository:tag; name the image with its registry host, such as ghcr.io/k8up-io/k8up:v2.16.1" $ref) }}
    {{- end }}
    {{- $registry := first (splitList "/" $ref) }}
    {{- $repo := trimPrefix (printf "%s/" $registry) $ref }}
    {{- $tag := "" }}
    {{- if contains ":" (last (splitList "/" $repo)) }}
      {{- $tag = last (splitList ":" (last (splitList "/" $repo))) }}
      {{- $repo = trimSuffix (printf ":%s" $tag) $repo }}
    {{- end }}
    {{- if not $tag }}
    {{- fail (printf "infra.image is %q, which names neither a tag nor a digest, and K8up's chart writes its image as registry/repository:tag; name the image with its tag, such as ghcr.io/k8up-io/k8up:v2.16.1, or with its digest" $ref) }}
    {{- end }}
    image:
      registry: "{{ $registry }}"
      repository: "{{ $repo }}"
      tag: "{{ $tag }}"
