apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: envoy-gateway
  version: 1.0.0
  license: Apache-2.0
  description: >
    An Envoy Gateway ingress gateway via the project's own Helm chart, from a
    container registry: the controller and its access control, the
    certificate-generation job and — unless infra.install_crds is false, when
    infra.control_plane_present must be true or the build halts — the routing
    API's experimental-channel definitions.

    Beside the chart this Recipe emits the gateway class, claimed under the
    controller name the control plane answers for, and the gateway with one
    HTTP listener. Where infra.tls_secret names a certificate Secret, the
    gateway gains an `https` listener on port 443 terminating TLS with it; the
    Secret is referenced and never emitted. It emits neither the data plane,
    which the control plane creates, nor a namespace. The gateway and every
    namespaced resource of the chart land in the namespace the Release declares
    for the component, or in `default` where none is declared.

    Wired to the AI gateway controller on the extension socket, the control
    plane names it as its extension server, and the gateway must sit in
    envoy-gateway-system. Each model on the models socket gets a rule of one
    AI route and the resources reaching its published endpoint, its
    credential named only by its Secret; the project's client traffic policy
    raises the gateway's buffer to 50Mi. With a model wired, provides.host is
    the data-plane Service Envoy Gateway creates and provides.endpoint its /v1
    base URL, qualified with envoy-gateway-system.

    The control-plane image is pinned (override: infra.image); the rate-limit
    and data-plane images the render names do not float and are replaceable
    through infra.overrides; the chart version is in source.version, overridden
    via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/envoy-gateway:1.0.0

  # The chart is distributed as an artifact in a container registry and
  # referenced as one here. It is published by the project's own maintainers,
  # covers the whole control plane, and carries the same version as the release
  # it packages, so this Recipe maps the Component's surface into it rather than
  # re-deriving the control plane by hand. The chart carries the controller and
  # the access control it runs under, the certificate-generation job the
  # authentication paths need, and — unless the Release turns that off — the
  # custom-resource definitions the gateway and its routes are written against.
  # Those definitions are the experimental channel of the routing API, which
  # carries the standard channel's resources plus the TCP, TLS and UDP routes and
  # the listener-set resource; a cluster already holding the standard channel
  # installs them separately and sets infra.install_crds to false.
  source:
    kind: helm-oci-chart
    url: oci://docker.io/envoyproxy/gateway-helm
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"v1.9.1\" }}"

  # The fixed strings the templates below share, each written once here.
  #
  # controller_gateway_namespace is the namespace the AI gateway controller
  # looks for this gateway's control plane in: the controller chart's default
  # for its Envoy Gateway namespace at v1.1.0, the version the controller's
  # Recipe pins, which that Recipe leaves in place. It is a deliberate second
  # copy of that chart default, kept here so this Recipe can halt when a
  # Release places the gateway anywhere else; a controller Recipe moving that
  # setting moves this line with it.
  #
  # model_header is the header Envoy AI Gateway writes the model name a request
  # carries into, which a route rule matches to choose a backend.
  locals:
    controller_gateway_namespace: envoy-gateway-system
    model_header: x-ai-eg-model

  # host is the Service Envoy Gateway creates for this gateway's data plane —
  # the entry point client traffic is sent to. Envoy Gateway names it from the
  # gateway's namespace and name, `<namespace>/<name>` with the slash as a
  # hyphen, cut to 48 characters with a trailing hyphen dropped, prefixed with
  # `envoy-` and followed by a hyphen and the first eight hexadecimal digits of
  # the SHA-256 digest of `<namespace>/<name>`, and places it in its own
  # namespace, which this Recipe makes the gateway's. The expression below is a
  # deliberate second copy of that naming, read from Envoy Gateway's source at
  # v1.9.1, the chart version this Recipe defaults to, so the published name is
  # the one the control plane creates without this Recipe emitting anything to
  # pin it. The name carries no namespace; a consumer in another namespace
  # qualifies it on its own side. port is the plain HTTP listener's port,
  # which the Service exposes as it is.
  #
  # A published value can read neither the namespace the Release places the
  # gateway in nor the gateway's connections, so the namespace hashed in is
  # locals.controller_gateway_namespace, and only while values.model is set.
  # A build gets that far only with a models connection, which needs the
  # extension connection, which places the gateway in that namespace — the
  # component's assertions and the halt in the value mapping below, in that
  # order — so the name is the one Envoy Gateway gives. With values.model
  # unset the namespace is not known here, and host is empty rather than a
  # name hashed from a guess.
  #
  # endpoint is the base URL an OpenAI client takes for the models this gateway
  # serves: the Service qualified with its namespace, its port and /v1, the
  # path Envoy AI Gateway serves the OpenAI API under with the controller's
  # chart defaults. Unlike host, it carries the namespace, so it resolves from
  # any namespace a consumer sits in: it is written only while values.model is
  # set, which is exactly when the namespace is fixed by construction to
  # locals.controller_gateway_namespace, so the qualified name is always the
  # true one. model is values.model, the alias a consumer names as its model.
  # The Service name is spelled out again on purpose: a provides entry cannot
  # read another provides entry and a locals entry cannot read the rendered
  # name, so the repetition is forced, and the entries are edited together.
  # With nothing wired to the models socket values.model is omitted — the
  # component's assertion halts on any other combination — and host, endpoint
  # and model are empty.
  provides:
    host: '{{- with optional .values "model" "" }}{{- $key := printf "%s/%s" $.locals.controller_gateway_namespace $.context.rendered_name }}{{- $base := replace "/" "-" $key }}{{- if gt (len $base) 48 }}{{- $base = trimSuffix "-" (trunc 48 $base) }}{{- end }}envoy-{{ $base }}-{{ trunc 8 (sha256sum $key) }}{{ end }}'
    port: "{{ .infra.port }}"
    protocol: "http"
    endpoint: '{{- with optional .values "model" "" }}{{- $key := printf "%s/%s" $.locals.controller_gateway_namespace $.context.rendered_name }}{{- $base := replace "/" "-" $key }}{{- if gt (len $base) 48 }}{{- $base = trimSuffix "-" (trunc 48 $base) }}{{- end }}http://envoy-{{ $base }}-{{ trunc 8 (sha256sum $key) }}.{{ $.locals.controller_gateway_namespace }}.svc.cluster.local:{{ $.infra.port }}/v1{{ end }}'
    model: '{{ optional .values "model" "" }}'

  # The runtime prerequisite, declared rather than hoped for. By default this
  # Release installs the custom-resource definitions alongside the controller
  # that reconciles them, so the gateway class and the gateway it emits have
  # both halves of their control plane in the same render. Where the Release
  # does not install them, the definitions have to be in the cluster already —
  # and the compiler runs ahead of time and cannot look, so it asks the operator
  # to affirm it and halts when nobody has.
  assertions:
    custom_resource_definitions_prerequisite: |
      {{- if and (not .infra.install_crds) (not .infra.control_plane_present) -}}
      {{ fail "this Release does not install the custom-resource definitions the gateway class and the gateway are written against, because infra.install_crds is false; affirm that the target cluster already carries them by setting infra.control_plane_present to true on this component in the Release, or set infra.install_crds back to true and let this Release install them" }}
      {{- end -}}

  # This Recipe reads from infra.overrides:
  #   ratelimit_image  - string (global.images.ratelimit.image; replaces the chart's pin)
  #   data_plane_image - string (global.images.envoyProxy.image; replaces the control plane's built-in default)
  #   requests         - { cpu: string, memory: string } (control-plane resource requests)
  #   service_type     - string (service.type; default ClusterIP)
  #   replicas         - integer (deployment.replicas)
  #   nodeSelector     - map[string]string
  #   tolerations      - []object
  #
  # The control-plane image is pinned to an explicit release tag for a
  # reproducible render; override it through infra.image. Two further images are
  # named by the render and neither floats — the rate-limit image the chart
  # itself pins, and the data-plane image, left to the control plane's own
  # built-in default, which the control-plane pin fixes in turn. Each is
  # replaceable through infra.overrides.
  valuesMapping: |
    ## ── The extension server ───────────────────────────────────
    ## The connection on the extension socket, if any; the Component's
    ## assertion allows one. The controller it reaches looks for this gateway's
    ## control plane in locals.controller_gateway_namespace, so with a
    ## connection the gateway's own namespace — the one the Release declares,
    ## or `default` — must be that one, and the build halts otherwise, naming
    ## the namespace to declare. The controller's namespace qualifies the host
    ## it publishes, which carries none.
    {{- $extension := dict }}
    {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "extension" }}
        {{- $extension = $edge }}
      {{- end }}
    {{- end }}
    {{- $controllerNamespace := "" }}
    {{- with $extension }}
      {{- $ns := optional (optional (default dict $.context.annotations) "release" dict) "aggrega.ai/namespace" "" | default "default" }}
      {{- if ne $ns $.locals.controller_gateway_namespace }}
      {{- fail (printf "%q has %q wired to its extension socket, and that controller looks for this gateway's control plane in the %s namespace, but the gateway is placed in %q; declare the annotation aggrega.ai/namespace: %s on %q in the Release" $.context.instance_id .target $.locals.controller_gateway_namespace $ns $.locals.controller_gateway_namespace $.context.instance_id) }}
      {{- end }}
      {{- $controllerNamespace = optional (optional (default dict .annotations) "release" dict) "aggrega.ai/namespace" "" | default "default" }}
    {{- end }}

    ## ── Resource naming ────────────────────────────────────────
    ## Bind the chart's own name prefix to the rendered name, the release name
    ## the helm provider gives the chart, so every object it renders is named
    ## after the component the Aggregate declared, spelled in the alphabet a
    ## Kubernetes name allows.
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── Image pins ─────────────────────────────────────────────
    ## Pin the control-plane image explicitly for a reproducible render;
    ## override it via infra.image. The rate-limit image the chart pins and the
    ## data-plane image the control plane defaults to are each replaceable
    ## through infra.overrides, and neither is restated here — restating a pin
    ## the upstream already makes would be a second copy that drifts from it.
    global:
      images:
        envoyGateway:
          image: "{{ .infra.image }}"
        {{- if and .infra.overrides .infra.overrides.ratelimit_image }}
        ratelimit:
          image: "{{ .infra.overrides.ratelimit_image }}"
        {{- end }}
        {{- if and .infra.overrides .infra.overrides.data_plane_image }}
        envoyProxy:
          image: "{{ .infra.overrides.data_plane_image }}"
        {{- end }}

    ## ── Custom-resource definitions ────────────────────────────
    ## Install the definitions the gateway and its routes are written against,
    ## together with the upgrade-safety policy that guards them. Set
    ## infra.install_crds to false where the cluster manages them separately.
    crds:
      enabled: {{ .infra.install_crds }}

    ## ── Gateway class controller name ──────────────────────────
    ## The control plane answers for this name and the gateway class this Recipe
    ## emits is claimed under it, so the two halves read one value.
    config:
      envoyGateway:
        gateway:
          controllerName: "{{ .infra.controller_name }}"
        {{- with $extension }}
        ## ── The AI gateway extension ─────────────────────────────
        ## Written as the AI gateway's installation configures Envoy Gateway
        ## at the controller's version: the Backend resource and the patch
        ## policies admitted, and the controller's extension server called
        ## after Envoy Gateway translates its configuration, for every
        ## listener, route, cluster and secret, at the address the controller
        ## publishes. Nothing here is written while the extension socket is
        ## empty, so the configuration is then the chart's own.
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        extensionManager:
          hooks:
            xdsTranslator:
              translation:
                listener:
                  includeAll: true
                route:
                  includeAll: true
                cluster:
                  includeAll: true
                secret:
                  includeAll: true
              post:
                - Translation
                - Cluster
                - Route
          service:
            fqdn:
              hostname: "{{ .provides.host }}.{{ $controllerNamespace }}.svc.cluster.local"
              port: {{ .provides.port }}
        {{- end }}

    ## ── Control-plane workload ─────────────────────────────────
    deployment:
      {{- if and .infra.overrides .infra.overrides.replicas }}
      replicas: {{ .infra.overrides.replicas }}
      {{- end }}
      envoyGateway:
        resources:
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          {{- if and .infra.overrides .infra.overrides.requests }}
          requests:
            cpu: "{{ .infra.overrides.requests.cpu }}"
            memory: "{{ .infra.overrides.requests.memory }}"
          {{- end }}
      {{- if .infra.overrides }}
      {{- if or .infra.overrides.nodeSelector .infra.overrides.tolerations }}
      pod:
        {{- if .infra.overrides.nodeSelector }}
        nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
        {{- end }}
        {{- if .infra.overrides.tolerations }}
        tolerations: {{ toJson .infra.overrides.tolerations }}
        {{- end }}
      {{- end }}
      {{- end }}

    ## ── Control-plane service ──────────────────────────────────
    ## This Service carries the configuration stream the data plane reads. It is
    ## not the client entry point: client traffic reaches the Service the control
    ## plane creates for the gateway.
    service:
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}

  # Beside the chart this Recipe emits the two resources the chart leaves to its
  # user: the gateway class, claimed under the same controller name the control
  # plane is configured to answer for, and the gateway itself with one HTTP
  # listener. Where the Release names a certificate Secret (infra.tls_secret),
  # the gateway gains a second listener, `https`, on port 443 with protocol
  # HTTPS, terminating TLS with the certificate that Secret holds — the port and
  # protocol the routing API names as its core pairing for a route served over
  # HTTPS — and a route attaches to it by naming that listener; the Secret is
  # referenced and never emitted, and with the key unset the gateway carries the
  # HTTP listener alone. It does not emit the data plane — the control plane
  # creates that when it reconciles the gateway — and it does not emit a
  # namespace.
  #
  # The gateway is placed in the namespace the Release declares for the
  # component through the aggrega.ai/namespace annotation, the namespace the
  # chart's own objects land in. Where no namespace is declared it is placed in
  # `default`, the namespace the chart is then rendered against.
  #
  # The two resources the chart leaves to its user: the gateway class is
  # cluster-scoped, and one gateway serves every route attached to it, so both
  # belong to the install rather than to any single application. The gateway
  # is named by the same rendered name the chart's own objects are.
  #
  # The HTTPS listener is emitted only where infra.tls_secret names a
  # certificate Secret. It takes its own name, because a route attaches to one
  # listener by naming it, and its own port, because two listeners must differ
  # in port, protocol or hostname; 443 is the port the routing API pairs with
  # HTTPS for a route. It carries no hostname, so it accepts every hostname the
  # routes attached to it declare. The certificate reference is written out in
  # full, kind and group included, which is the form the cluster stores it in.
  #
  # The models the gateway serves, as the resources Envoy AI Gateway and Envoy
  # Gateway define, all in the gateway's own namespace, written into
  # models.yaml. With nothing
  # wired to the models socket the template writes nothing, and no file is
  # emitted.
  #
  # One AI route, named after the gateway with -models appended, attached to
  # this gateway, holds a rule per connection in alias order: a request whose
  # model name, which Envoy AI Gateway writes into locals.model_header, is the
  # connection's alias goes to that connection's AI service backend, asking
  # for the model name the model publishes in place of the alias. The route
  # takes fifteen rules, so a sixteenth connection stops the build.
  #
  # Beside the route, the client traffic policy Envoy AI Gateway's own basic
  # example and configuration generator write at the controller's version: it
  # targets this gateway and raises the buffer Envoy Gateway allows each
  # incoming connection from its default of 32768 bytes to 50Mi, because the AI
  # gateway's external processor reads each request's whole body, in buffered
  # mode, to find the model it names. It targets the gateway, so the raised
  # buffer applies to every route attached to it, model routes or not. It is
  # named after the gateway rather than with the project's fixed name, because
  # every gateway serving a model sits in the same namespace.
  #
  # Each connection's resources are named after the gateway and the alias, in
  # lowercase with every underscore as a hyphen, the characters a Kubernetes
  # name allows; an alias ending in a hyphen or an underscore, or two aliases
  # giving one name, stop the build, naming the connections. Per connection:
  # an Envoy Gateway Backend for the host and port of the endpoint the model
  # publishes — the port the scheme implies where the endpoint names none, and
  # an address endpoint where the host is an address. A host carrying no dot is
  # a Service name published without a namespace, which the data plane in this
  # gateway's namespace could not resolve, so the Backend qualifies it, as a
  # consumer in another namespace does, with the namespace the Release places
  # the model in, or `default` where it declares none:
  # `<host>.<namespace>.svc.cluster.local`. A host carrying a dot, a managed
  # API's included, is written as published. Then an AI service backend
  # for the OpenAI API whose prefix is the endpoint's path, `/` where it has
  # none, so a request reaches the model under the path it publishes; where
  # the endpoint is https, a TLS policy on the Backend checking the server's
  # certificate against the system's trust anchors for the Backend's host,
  # the Gateway API's own policy at its v1 version, which Envoy Gateway serves
  # at the chart version this Recipe pins; and, where the connection carries a
  # credential, a backend security policy of the API-key type naming the
  # Secret the credential publishes. The policy writes no namespace: the
  # controller reads the key from that Secret in the policy's own namespace,
  # under the data key apiKey, so a credential publishing another data key
  # stops the build, naming both. An endpoint that is not an absolute http or
  # https URL stops the build, naming the connection, and so does an https
  # endpoint whose host is an address, which the TLS policy cannot name.
  artifacts:
    gatewayclass.yaml: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: {{ .values.gateway_class_name }}
      spec:
        controllerName: {{ .infra.controller_name }}
    gateway.yaml: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: {{ .context.rendered_name }}
        {{- $ns := "default" }}
        {{- if .context.annotations }}
          {{- if .context.annotations.release }}
            {{- $raw := optional .context.annotations.release "aggrega.ai/namespace" "" }}
            {{- if $raw }}{{- $ns = $raw }}{{- end }}
          {{- end }}
        {{- end }}
        namespace: "{{ $ns }}"
      spec:
        gatewayClassName: {{ .values.gateway_class_name }}
        listeners:
          - name: http
            port: {{ .infra.port }}
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: {{ .values.allowed_route_namespaces }}
          {{- with .infra.tls_secret }}
          - name: https
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  group: ""
                  name: {{ . }}
            allowedRoutes:
              namespaces:
                from: {{ $.values.allowed_route_namespaces }}
          {{- end }}
    models.yaml: |
      {{- $ns := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" "" | default "default" }}
      {{- $wired := list }}
      {{- $names := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "models" }}
      {{- $wired = append $wired $alias }}
      {{- $name := printf "%s-%s" $.context.rendered_name (lower (replace "_" "-" $alias)) }}
      {{- if hasSuffix "-" $name }}{{ fail (printf "the models connection %s of %q gives its resources the name %q, which ends in a hyphen and so is no Kubernetes name; rename the connection so its alias ends in a letter or a digit" $alias $.context.instance_id $name) }}{{ end }}
      {{- range $other, $taken := $names }}{{ if eq $taken $name }}{{ fail (printf "the models connections %s and %s of %q would each name their resources %q, because the gateway names a connection's resources after its alias in lowercase with every underscore as a hyphen; rename one of the two connections" $other $alias $.context.instance_id $name) }}{{ end }}{{ end }}
      {{- $_ := set $names $alias $name }}
      {{- end }}
      {{- end }}
      {{- if gt (len $wired) 15 }}{{ fail (printf "%q has %d connections on its models socket, but the AI route serving them holds at most 15 rules, one per connection; serve the others through a second gateway" .context.instance_id (len $wired)) }}{{ end }}
      {{- if $wired -}}
      apiVersion: aigateway.envoyproxy.io/v1beta1
      kind: AIGatewayRoute
      metadata:
        name: {{ .context.rendered_name }}-models
        namespace: "{{ $ns }}"
      spec:
        parentRefs:
          - name: {{ .context.rendered_name }}
            kind: Gateway
            group: gateway.networking.k8s.io
        rules:
      {{- range $alias := $wired }}
      {{- $edge := get $.context.uses $alias }}
          - matches:
              - headers:
                  - type: Exact
                    name: {{ $.locals.model_header }}
                    value: {{ $alias | toJson }}
            backendRefs:
              - name: {{ get $names $alias }}
                modelNameOverride: {{ $edge.provides.model | toJson }}
      {{- end }}
      ---
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: ClientTrafficPolicy
      metadata:
        name: {{ .context.rendered_name }}-client-buffer-limit
        namespace: "{{ $ns }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: {{ .context.rendered_name }}
        connection:
          bufferLimit: 50Mi
      {{- range $alias := $wired }}
      {{- $edge := get $.context.uses $alias }}
      {{- $name := get $names $alias }}
      {{- $u := urlParse $edge.provides.endpoint }}
      {{- if not (and (has $u.scheme (list "http" "https")) $u.host) }}{{ fail (printf "the models connection %s of %q reaches %q, whose published endpoint %q is not an absolute http or https URL, so the gateway cannot write the backend it forwards to" $alias $.context.instance_id $edge.target $edge.provides.endpoint) }}{{ end }}
      {{- $hostport := $u.host }}
      {{- $port := ternary "443" "80" (eq $u.scheme "https") }}
      {{- with regexFind ":[0-9]+$" $hostport }}{{ $port = trimPrefix ":" . }}{{ $hostport = trimSuffix . $hostport }}{{ end }}
      {{- $hostname := lower (trimSuffix "]" (trimPrefix "[" $hostport)) }}
      {{- $address := or (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $hostname) (contains ":" $hostname) }}
      {{- if and $address (eq $u.scheme "https") }}{{ fail (printf "the models connection %s of %q reaches %q, whose published endpoint %q is https on an address, but the gateway checks an https endpoint's certificate against the host name it names, and an address names none; publish an endpoint naming the server's host" $alias $.context.instance_id $edge.target $edge.provides.endpoint) }}{{ end }}
      {{- if not (or $address (contains "." $hostname)) }}
      {{- $hostname = printf "%s.%s.svc.cluster.local" $hostname (optional (optional (default dict $edge.annotations) "release" dict) "aggrega.ai/namespace" "" | default "default") }}
      {{- end }}
      ---
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: Backend
      metadata:
        name: {{ $name }}
        namespace: "{{ $ns }}"
      spec:
        endpoints:
      {{- if $address }}
          - ip:
              address: {{ $hostname | toJson }}
              port: {{ $port }}
      {{- else }}
          - fqdn:
              hostname: {{ $hostname | toJson }}
              port: {{ $port }}
      {{- end }}
      {{- if eq $u.scheme "https" }}
      ---
      apiVersion: gateway.networking.k8s.io/v1
      kind: BackendTLSPolicy
      metadata:
        name: {{ $name }}
        namespace: "{{ $ns }}"
      spec:
        targetRefs:
          - group: gateway.envoyproxy.io
            kind: Backend
            name: {{ $name }}
        validation:
          wellKnownCACertificates: System
          hostname: {{ $hostname | toJson }}
      {{- end }}
      ---
      apiVersion: aigateway.envoyproxy.io/v1beta1
      kind: AIServiceBackend
      metadata:
        name: {{ $name }}
        namespace: "{{ $ns }}"
      spec:
        schema:
          name: OpenAI
          prefix: {{ default "/" $u.path | toJson }}
        backendRef:
          name: {{ $name }}
          kind: Backend
          group: gateway.envoyproxy.io
      {{- with optional (default dict $edge.features) "credential" dict }}
      {{- if ne .provides.key "apiKey" }}{{ fail (printf "the models connection %s of %q carries a credential publishing the data key %q, but Envoy AI Gateway reads an API key from its Secret under the data key apiKey alone, so the key would not be found; set the credential's key to apiKey" $alias $.context.instance_id .provides.key) }}{{ end }}
      ---
      apiVersion: aigateway.envoyproxy.io/v1beta1
      kind: BackendSecurityPolicy
      metadata:
        name: {{ $name }}
        namespace: "{{ $ns }}"
      spec:
        targetRefs:
