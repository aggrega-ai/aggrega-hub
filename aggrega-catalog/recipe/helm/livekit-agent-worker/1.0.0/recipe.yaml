apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: livekit-agent-worker
  version: 1.0.0
  license: Apache-2.0
  description: >
    A LiveKit agent worker on Kubernetes via the helm provider's Workload
    synthesis, running an image the Release supplies (no external Helm chart,
    because the project publishes none for this service, and no pinned image,
    because it publishes none of those either — the agent framework ships as a
    language package). It renders a stateless Deployment and nothing else: no
    Service, because the worker serves no application traffic, and no volume,
    because it keeps a session's state in memory. The worker is configured
    entirely on the environment, in the variables the framework itself reads:
    the media server's WebSocket address and API key identifier, the dispatch
    name, and the log level. The one port declared is the framework's own health
    endpoint, which is a container port the probes reach on the pod address and
    which no Service publishes, so the worker exposes nothing to the rest of the
    Release. Readiness reads that endpoint, which answers unhealthy while the
    worker cannot reach the media server, so a worker that is running but
    unreachable is visibly not ready rather than silently idle. The
    token-signing secret arrives from the credential on the media_server
    connection as an env secretKeyRef, so the plaintext secret never appears in
    the worker's own manifest. The public key identifier travels over the same
    edge, so one key pair is authored once. provides.agent_name is
    the dispatch name the Aggregate authored, republished so a consumer writing
    a dispatch rule reads it rather than repeating it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/livekit-agent-worker:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # This Recipe reads three values delivered on the env pipe by the component's
  # required media_server uses edge, under the names the component's usesSchema
  # documents: LIVEKIT_MEDIA_SERVER_HOST, LIVEKIT_MEDIA_SERVER_PORT and
  # LIVEKIT_MEDIA_SERVER_API_KEY.
  #
  # Every variable this Recipe delivers is one the agent framework reads on its
  # own, with no code in the supplied image required to look for it: the server
  # address, the key identifier and the secret are the three the worker refuses
  # to start without, the dispatch name selects explicit dispatch, and the log
  # level is bound to the framework's own start command.
  #
  # provides publishes the dispatch name and nothing else. There is no host and
  # no port to publish: no Service is rendered, so there is no address a
  # consumer could be handed.
  provides:
    agent_name: "{{ .values.agent_name }}"
  workload: |
    {{- /* The alias of the `media_server` connection carrying the credential.
           The slot is required, so a build reaching this template has one. */ -}}
    {{- $mediaServerCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "media_server") (hasKey (default dict $edge.features) "credential") -}}
    {{- $mediaServerCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "media_server" (dict "LIVEKIT_MEDIA_SERVER_HOST" "host" "LIVEKIT_MEDIA_SERVER_PORT" "port" "LIVEKIT_MEDIA_SERVER_API_KEY" "api_key") -}}
    {{- $required := list "media_server" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/livekit-agent-worker %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    {{- /* The catalog pins no image for this component, so a Release that
           does not supply one has nothing to run. The workload contract would
           refuse the container anyway, naming the missing image property, but
           that message describes the shape of the document rather than the fix.
           So the value is checked here and a build that omits it halts naming
           the key and what to put in it. */}}
    {{- if not .infra.image }}
    {{- fail "this Release runs the agent worker without infra.image, and the catalog pins no image for it because the agent framework is published as a language package rather than as a container: build an image from that framework together with your own agent code, publish it where the cluster can pull it, and set infra.image to that reference" }}
    {{- end }}
    {{- /* The media_server socket is required, so an edge always exists — but
           which of the target's keys an edge carries, and under which
           environment names, is decided where the topology is authored. A name
           the edge does not deliver halts above; one delivered empty would
           configure the worker with an empty server address or an empty key
           identifier: it would deploy, register with nothing, and report no
           reason. So the three names this body reads are also checked for a
           value before anything is rendered, and an empty one halts here
           naming itself, where the fix is one line of topology. */}}
    {{- range $name := list "LIVEKIT_MEDIA_SERVER_HOST" "LIVEKIT_MEDIA_SERVER_PORT" "LIVEKIT_MEDIA_SERVER_API_KEY" }}
    {{- if not (optional $env $name "") }}
    {{- fail (printf "the agent worker is wired without %s, so the worker would start with that value empty and could not register with the media server: bind the socket that publishes it and carry the target's key into this environment name on that edge, as the component's own socket documentation lists" $name) }}
    {{- end }}
    {{- end }}
    {{- /* The framework serves its health endpoint on this port, and the port is
           a constructor argument of the worker rather than anything the
           environment or a command-line flag reaches — so it is stated once here
           and is not an operational knob, because a knob that cannot change what
           the process opens would be a dial that does nothing. */}}
    {{- $healthPort := 8081 }}
    # The worker holds no durable disk — a session's state is in memory and ends
    # with the session — so the default stateless form (a Deployment on the helm
    # provider) is correct: no form: stateful, no persistentTemplate volume, no
    # PVC.
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          # The worker's whole configuration. Each of these is read by the agent
          # framework itself, so an image built from that framework needs no code
          # of its own to pick them up.
          #
          # The API secret is deliberately absent from this block. It arrives
          # through the attachment below, which keeps the plaintext out of the
          # rendered manifest; the framework reads it from the same environment
          # either way.
          LIVEKIT_URL: "ws://{{ $env.LIVEKIT_MEDIA_SERVER_HOST }}:{{ $env.LIVEKIT_MEDIA_SERVER_PORT }}"
          LIVEKIT_API_KEY: "{{ $env.LIVEKIT_MEDIA_SERVER_API_KEY }}"
          LIVEKIT_LOG_LEVEL: "{{ .infra.log_level }}"
    {{- if .values.agent_name }}
          # Present only when the Aggregate named the agent. The framework reads
          # an empty value as no name at all, so emitting the variable empty would
          # say nothing; omitting it says the same thing and says it in the bytes.
          LIVEKIT_AGENT_NAME: "{{ .values.agent_name }}"
    {{- end }}
    {{- with $mediaServerCredential }}
        attachments:
          LIVEKIT_API_SECRET:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
        ports:
          # The health endpoint and nothing else. It is a container port and not
          # a service port, because the probes below reach it on the pod address
          # and nothing outside the pod has a reason to — which is the whole of
          # what this workload exposes. Every other connection the worker takes
          # part in it opens itself, outward to the media server.
          health: {{ $healthPort }}
        # The endpoint answers unhealthy while the worker cannot reach the media
        # server, which is the right readiness answer — a worker that cannot be
        # handed a room should not read as ready — and the wrong liveness one,
        # where it would restart a process whose only fault is that its peer is
        # down. So readiness reads the endpoint and liveness opens a socket to it.
        # The http probe resolves its target from the container's first port name
        # in alphabetical order, which is this container's one declared port.
        #
        # Both probes assume the supplied image runs the framework's production
        # entrypoint, which is what opens this port; the framework's own example
        # images do exactly that.
        health:
          ready:
            http: /
          live:
            tcp: {{ $healthPort }}
            initialDelaySeconds: 10
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    # No services block, and its absence is the point rather than an omission:
    # the worker serves no application traffic, so there is nothing for a Service
    # to front and no address for one to publish.
