apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: open-webui
  version: 1.0.0
  # metadata.license is deliberately absent. The Open WebUI platform this Recipe
  # realizes is published under the three BSD-3-Clause conditions plus a fourth
  # forbidding alteration of the platform's branding, and no single SPDX
  # identifier names that combination; the licensing class sits on the
  # Component's upstream-licensing label. The SPDX header at the top of this file
  # states the terms of the file itself.
  description: >
    A self-hosted Open WebUI installation on Kubernetes via the helm provider's
    Workload synthesis: a single-replica Deployment, a ClusterIP Service on the
    listen port, and one persistent volume holding the accounts, the
    conversations, the prompt library and the document index. The model edge's
    endpoint becomes OPENAI_API_BASE_URL and its model name the model a new
    conversation opens on; the platform's Ollama client is switched off.

    The listen port is emitted as PORT as well as published on the container
    port and the Service, because the platform reads its bind port from the
    environment. infra.external_base_url, when set, reaches the platform as
    WEBUI_URL. A model API key attached on the `model` connection is delivered
    as OPENAI_API_KEY, and with none attached no key is emitted. The session
    secret is delivered as WEBUI_SECRET_KEY; it has no default, and the
    Component requires its slot.

    Reach for this realization where the build must complete with nothing
    fetched, or where no chart repository is reachable from it; reach for
    `open-webui-chart`, which renders the platform's own Helm chart, where single
    sign-on or per-component log levels are wanted — that realization carries
    the integration surface this one has nowhere to declare.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/open-webui:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-default"
  # with no namespace segment, so the Recipe is independent of where it is
  # deployed. A same-namespace consumer reaches it under this name directly; a
  # cross-namespace consumer qualifies it caller-side.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # One persistent volume carries every kind of state the platform accumulates
  # — the accounts, the conversations, the prompt library and the document
  # index, which the platform keeps together in its data directory.
  #
  # The model edge carries both a published endpoint and a published model
  # name. The endpoint is written into OPENAI_API_BASE_URL, the variable the
  # platform reads for the base URL of an OpenAI-compatible API, and it is
  # passed through as the wired component published it — so moving the model's
  # listen port moves this variable with it and nothing here has to be
  # re-authored. OPENAI_API_BASE_URL is the documented single-endpoint form;
  # the platform also accepts a plural multi-endpoint variable, and this Recipe
  # deliberately delivers only the singular one rather than carrying a second
  # spelling for insurance. The model name becomes the model a new conversation
  # opens on, so that name is the one the wired component actually serves
  # under rather than one re-typed here. The platform's separate Ollama client
  # is switched off in the same breath, because it is on by default and would
  # otherwise spend every model listing probing an address that was never
  # wired.
  #
  # The listen port is emitted as well as published on the container port and
  # the Service. The platform reads its bind port from the environment, so
  # without that variable moving the port would move the Service and the
  # container port while the process kept binding its own default.
  #
  # Two credential slots are wired conditionally. A model API key attached on
  # the `model` connection is delivered as OPENAI_API_KEY, through a
  # secretKeyRef naming that connection, and with no key attached none is
  # emitted at all, which is the right rendering for an in-cluster endpoint that
  # authenticates callers by network position. The session secret is delivered
  # as WEBUI_SECRET_KEY, the value the platform signs its session tokens with;
  # it is always attached, because the Component requires its slot, so no
  # secret every reader of this catalog holds is ever rendered.
  #
  # The chart-backed realization, `open-webui-chart`, also renders the chart
  # that carries the platform's external object storage for uploaded documents
  # and an external relational store in place of the embedded one; that Recipe
  # passes only the chart's single-sign-on and logging blocks through
  # infra.overrides, so those two are not settable from a Release either way.
  workload: |
    {{- $dataPath := "/app/backend/data" -}}
    {{- /* The alias of the `model` connection carrying a credential, or empty. */ -}}
    {{- $modelCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") -}}
    {{- $modelCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The platform runs as one replica against one volume. Its state is a single
    # data directory rather than a sharded store, so the stateless form with a
    # persistent volume is the shape here: a Deployment plus a
    # PersistentVolumeClaim, and no headless Service to govern ordinals.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/open-webui/open-webui:{{ .infra.engine_version }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Both keys that have to agree on it read the binding — the
        # data-directory variable and the volume mount — so a future move cannot
        # relocate one and leave the other behind. It is load-bearing rather than
        # decorative: the platform's default data directory sits inside the image
        # and the mounted volume does not cover it, so without the variable every
        # account and conversation is lost at the first restart.
        variables:
          DATA_DIR: "{{ $dataPath }}"
          # The bind port. Emitted because the process reads its listen port from
          # here; see the note in the description.
          PORT: "{{ .infra.port }}"
          # Quoted because a title is free text. Unquoted, a title spelled like a
          # number or a boolean is read as one, and the variables map, which
          # takes strings, then refuses the build over a title that was perfectly
          # legal to choose.
          WEBUI_NAME: "{{ .values.instance_title }}"
          ENABLE_SIGNUP: "{{ .values.enable_signup }}"
          DEFAULT_USER_ROLE: "{{ .values.default_user_role }}"
          ENABLE_WEB_SEARCH: "{{ .values.enable_web_search }}"
          # The platform's OpenAI-compatible client is what the wired model
          # endpoint is reached through, so it is switched on; its Ollama client
          # is switched off because it defaults on and no Ollama address is
          # wired for it to probe.
          ENABLE_OPENAI_API: "true"
          ENABLE_OLLAMA_API: "false"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          # The model endpoint and the model name both arrive on the `model`
          # uses-edge; the recipe ranges the outbound edges and matches on the
          # socket name rather than on the alias the topology chose, so it does
          # not depend on that alias. The endpoint is the base URL the platform
          # calls; the name is the model a new conversation opens on, and it is
          # the name the wired component actually serves under rather than one
          # re-typed here.
          OPENAI_API_BASE_URL: "{{ $edge.provides.endpoint }}"
          DEFAULT_MODELS: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- with .infra.external_base_url }}
          # The externally reachable base URL, when the operator supplied one.
          # The platform composes the links it emits from it, which is what makes
          # a shared conversation link resolve from outside the cluster. Left
          # empty, this is not emitted and the platform derives each address from
          # the incoming request.
          WEBUI_URL: "{{ . }}"
    {{- end }}
    {{- /* The session_secret slot is always taken in a build: the Component requires it. The guards
      let a single-entity validate, which attaches nothing, still render the rest of this Recipe. */ -}}
    {{- if or $modelCredential (hasKey (default dict .features) "session_secret") }}
        attachments:
    {{- with $modelCredential }}
          OPENAI_API_KEY:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "session_secret" }}
          WEBUI_SECRET_KEY:
            from: session_secret
            as: env
    {{- end }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The platform documents GET /health, which answers while the service
        # runs, and its own guide to running it on Kubernetes probes start-up and
        # liveness on /health and readiness on /health/db, which also reaches the
        # database, with the timing below. The start-up probe allows 600 s
        # before liveness takes over.
        health:
          startup:
            http: /health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          ready:
            http: /health/db
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
        # The resource quantities are quoted so the rendered value stays a string
        # whatever the Release supplies: a whole-core quantity such as 1
        # re-parses as a YAML integer and fails workload validation, while a
        # milli quantity happens not to.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
