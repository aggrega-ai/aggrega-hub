              # its reasoning, in each shape the gateway's routes return: a refusal, citations and
              # annotations, a web search's query and its results, and every field of a name of the
              # provider's own, on the reply, a choice, a message or a streamed chunk, or as an
              # output item or a content block of a kind of its own. What masking cannot read is
              # withheld first, unless the entry sets allow_unmasked_reply_parts.
