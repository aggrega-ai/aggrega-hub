apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: litellm-gateway
  version: 1.0.0
  license: MIT
  description: >
    An AI gateway on Kubernetes via the helm provider's Workload synthesis,
    running the official upstream proxy image directly (no external Helm chart).
    Renders a Deployment plus a ConfigMap, and the ConfigMap is where this
    realization earns the gateway's capability: it carries the routing table —
    every published alias, the upstream target each one resolves to, and the
    strategy applied where an alias appears more than once — so the rendered
    artifact shows which models the gateway serves rather than leaving it to the
    running process to reveal. The proxy container reads that file through the
    --config flag. A ClusterIP Service fronts the API. When the optional
    master_key credential slot is attached the administrative key reaches the
    gateway as an env secretKeyRef, so its value never appears in the rendered
    manifest; unattached, the gateway starts with no administrative key. When the
    optional provider_key slot is attached the upstream credential reaches the
    gateway the same way and every map entry names that variable rather than
    carrying the credential, which is what keeps the credential inside the
    gateway and out of the calling application. The bookkeeping database
    connection string is emitted only when infra.database_url is set; with none
    the gateway runs stateless. While a core/context-propagation attachment is
    present, the ConfigMap also carries the request hook that attachment's
    realization relies on, as a second file beside the configuration, and the
    configuration registers it under litellm_settings.callbacks; what the hook
    does is stated on that realization. With no such attachment neither
    appears. Likewise, while a core/data-masking attachment lists entity
    types or patterns, the ConfigMap carries the module that attachment's
    guardrails are loaded from, as a further file beside the configuration,
    and while any attachment masking replies by entity type leaves
    allow_streamed_replies off the configuration also registers that module's
    refusal of streamed requests under litellm_settings.callbacks; what both
    do is stated on that realization, and with no such attachment neither
    appears. The gateway's
    public origin is emitted as PROXY_BASE_URL only when
    infra.external_base_url is set, and the build halts when that address
    carries a path. With the pii_analyzer and pii_anonymizer
    sockets wired, the endpoint each service publishes reaches the gateway as
    PRESIDIO_ANALYZER_API_BASE and PRESIDIO_ANONYMIZER_API_BASE, the variables
    its Presidio integration reads wherever a guardrail names no address of its
    own; this Recipe writes no guardrail entry, so nothing reads them until one is
    configured, and the build halts when only one of the two is wired. With
    neither wired, neither variable is emitted. provides.host is the bare,
    self-contained in-cluster service name of the synthesized ClusterIP Service
    — it carries no namespace, so the recipe is independent of where it is
    deployed. A consumer in another namespace qualifies the host with the target
    namespace on its own side (caller-side routing). The configuration contract
    is authored against LiteLLM v1.85.1.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/litellm:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Each entry below is the single authored home for a value the artifacts
  # template and the workload template both have to agree on. They are separate
  # templates, so a variable bound in one is not visible in the other, and these
  # entries are what keeps the emitted ConfigMap and the container that reads it
  # from drifting apart: config_file is the ConfigMap's data key and the filename
  # the proxy is pointed at, config_map_name is the resource name the ConfigMap
  # declares and the volume sources, and provider_key_variable is the variable
  # the routing table names for its upstream credential and the variable the
  # attached credential is delivered under. A second home for that last one is
  # exactly how a routing table comes to name a variable nothing sets.
  locals:
    config_file: config.yaml
    config_map_name: "{{ .context.instance_id }}-config"
    provider_key_variable: LITELLM_PROVIDER_API_KEY
    # The module the caller-identity hook is delivered as: the ConfigMap's
    # second data key and the callback the configuration registers both read
    # it, so the file and its registration cannot name different modules.
    caller_identity_module: caller_identity
    # The module the masking guardrails are loaded from, and the classes in it:
    # each configuration entry a core/data-masking attachment's realization
    # writes names a module and a class from here, and the file below defines
    # them from here, so an entry cannot name one the file lacks.
    masking_module: data_masking
    request_tool_call_masking_class: RequestToolCallMasking
    reply_masking_class: ReplyMasking
    buffered_reply_masking_class: BufferedReplyMasking
    tool_call_pattern_masking_class: ToolCallPatternMasking
    # Published for an attachment's realization to check against, and never
    # emitted. A FeatureRecipe reads this Recipe's locals and not the
    # component's values, so the facts it checks an attachment against are
    # stated here once: every alias the model map publishes, as a JSON list,
    # and "true" when infra.database_url is set, empty when it is not.
    model_aliases: '{{ $aliases := list }}{{ range .values.models }}{{ $aliases = append $aliases .name }}{{ end }}{{ toJson $aliases }}'
    bookkeeping_database: '{{ if optional .infra "database_url" "" }}true{{ end }}'
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, and below the proxy's own listen-port argument, the
  # container port and the Service; the literal is never repeated. endpoint is the
  # OpenAI-compatible base URL a caller wiring to the gateway reads, assembled
  # from the same host and port as the other keys.
  #
  # host and endpoint spell the Service name out twice on purpose. A provides
  # entry cannot read another provides entry, and the name has to match the
  # Service the helm provider derives from the service key below, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}-default:{{ .infra.port }}/v1"
    protocol: "http"
  # The gateway takes its public address as an origin — scheme, host and port —
  # and joins its own routes onto it, so an address carrying a path would give
  # it links that point somewhere it is not served. Halt on one here, where the
  # fix is one value in the Release.
  assertions:
    external_base_url_is_an_origin: >-
      {{- with optional .infra "external_base_url" "" -}}
      {{- $u := urlParse . -}}
      {{- if and $u.host $u.path (ne $u.path "/") -}}
      {{- fail (printf "infra.external_base_url %q carries the path %q, but the gateway takes its public address as an origin only, so the links it composes would point where it is not served; set it to the scheme, host and port alone, for example https://llm.example.com" . $u.path) -}}
      {{- end -}}
      {{- end -}}
    # The gateway's Presidio integration calls the analyzer and then the
    # anonymizer for every text it masks, and a guardrail missing either address
    # fails as it is set up, so one socket wired without the other is always a
    # mistake. Halt on it here, naming the socket left empty.
    recognizer_sockets_wired_together: >-
      {{- $analyzer := hasKey .uses "pii_analyzer" -}}
      {{- $anonymizer := hasKey .uses "pii_anonymizer" -}}
      {{- if and $analyzer (not $anonymizer) -}}
      {{- fail "the pii_analyzer socket is wired and the pii_anonymizer socket is not, but the gateway's Presidio integration hands every text the analyzer reports on to the anonymizer and cannot use either service alone; wire a core/security/presidio-anonymizer to pii_anonymizer as well, or remove the pii_analyzer edge" -}}
      {{- end -}}
      {{- if and $anonymizer (not $analyzer) -}}
      {{- fail "the pii_anonymizer socket is wired and the pii_analyzer socket is not, but the gateway's Presidio integration replaces only the spans the analyzer reports and cannot use either service alone; wire a core/security/presidio-analyzer to pii_analyzer as well, or remove the pii_anonymizer edge" -}}
      {{- end -}}
  artifacts:
    # The gateway's routing table. Every entry of the developer's model map
    # becomes one published alias and the upstream target it resolves to, and the
    # strategy entry below states how the gateway picks between entries that
    # publish the same alias. This body is the reason the component's capability
    # label is true of what is rendered rather than only of what is authored: a
    # reader of this artifact can see the models the gateway serves.
    #
    # No credential value appears here. The upstream credential is named through
    # the proxy's own environment indirection — each entry carries the variable
    # name and the runtime reads the value from the environment — and the
    # administrative key is not named here at all, because the proxy reads its
    # variable directly from the environment at startup.
    #
    # While a core/context-propagation attachment is present, the same ConfigMap
    # also carries the caller-identity hook as a second data key, and the body
    # registers it under litellm_settings.callbacks. The whole ConfigMap is
    # mounted as the directory the proxy is pointed at, and the proxy loads a
    # module its configuration names from the directory that configuration sits
    # in, so the file lands where it is looked for. The hook sends the identity
    # to the aliases every such attachment lists in infra.destinations. With no
    # such attachment, neither the registration nor the file is emitted.
    #
    # While a core/data-masking attachment lists entities or patterns, the
    # ConfigMap carries the masking module the attachment's realization names
    # in its guardrail entries, and while any attachment listing entities with
    # scope response or both leaves infra.allow_streamed_replies off, the body
    # registers that module's refusal of streamed requests. The realization
    # decides the same conditions from the same attachment to write its
    # entries, because the choice of file here cannot be handed to it; should
    # the two ever disagree, each fails closed: an entry naming a module absent
    # here stops the gateway from starting, and without the registration the
    # reply entry's guardrail still refuses a streamed reply before any of it
    # is sent. With no such attachment, neither the module nor the
    # registration is emitted.
    litellm-gateway-config.configmap.yaml: |
      {{- $identity := false }}
      {{- $listed := list }}
      {{- $masking := false }}
      {{- $refuseStreams := false }}
      {{- range $name, $attachment := (default dict .features) }}
      {{- if eq (toString $attachment.type) "core/context-propagation" }}
      {{- $identity = true }}
      {{- range $alias := optional (optional $attachment "infra" dict) "destinations" list }}
      {{- if not (has $alias $listed) }}{{ $listed = append $listed $alias }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if eq (toString $attachment.type) "core/data-masking" }}
      {{- $values := optional $attachment "values" dict }}
      {{- if or (optional $values "entities" list) (optional $values "patterns" list) }}{{ $masking = true }}{{ end }}
      {{- if optional $values "entities" list }}
      {{- if and (ne (toString (optional $values "scope" "request")) "request") (not (optional (optional $attachment "infra" dict) "allow_streamed_replies" false)) }}{{ $refuseStreams = true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- end -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .locals.config_map_name }}
      data:
        {{ .locals.config_file }}: |
          model_list:
      {{- range .values.models }}
            - model_name: {{ .name }}
              litellm_params:
                model: {{ .target }}
      {{- if hasKey (default dict $.features) "provider_key" }}
                api_key: os.environ/{{ $.locals.provider_key_variable }}
      {{- end }}
      {{- end }}
          router_settings:
            routing_strategy: {{ .values.routing_strategy }}
      {{- if or $identity $refuseStreams }}
          litellm_settings:
            callbacks:
      {{- if $identity }}
              - {{ .locals.caller_identity_module }}.hook
      {{- end }}
      {{- if $refuseStreams }}
              - {{ .locals.masking_module }}.refuse_streamed_requests
      {{- end }}
      {{- end }}
      {{- if $identity }}
        {{ .locals.caller_identity_module }}.py: |
          """Caller identity for the requests this gateway sends upstream.

          Delivered beside the gateway's configuration and registered there under
          litellm_settings.callbacks while core/context-propagation is attached. On
          every request it removes each header whose name begins x-litellm- from the
          parts of the request body the gateway turns into upstream headers, so a
          caller cannot supply an identity of its own. On a request for a listed model
          alias it then adds the user, the team and the organization of the virtual
          key the gateway verified, and nothing else about that key. A request made
          with the master key names nobody and carries none of them.
          """
          from litellm.constants import LITELLM_PROXY_MASTER_KEY_ALIAS
          from litellm.integrations.custom_logger import CustomLogger

          # The model aliases whose upstream receives the caller's identity.
          LISTED = frozenset([{{ range $i, $alias := $listed }}{{ if $i }}, {{ end }}{{ toJson $alias }}{{ end }}])

          # The header each verified field travels under. These are the names the
          # gateway's own header forwarding uses, so a service reading them reads one
          # set of names whichever part of the gateway wrote them.
          IDENTITY = (
              ("x-litellm-user_api_key_user_id", "user_id"),
              ("x-litellm-user_api_key_team_id", "team_id"),
              ("x-litellm-user_api_key_org_id", "org_id"),
          )

          # The request fields the gateway turns into upstream headers. It merges them
          # in this order, the later winning, and provider_specific_header.extra_headers
          # over both; a model_list entry's litellm_params carries the same two.
          HEADER_FIELDS = ("headers", "extra_headers")


          def _is_gateway_header(name):
              # Header names are matched loosely further on, so they are compared the
              # same way here: surrounding space trimmed, letter case ignored, and an
              # underscore read as a hyphen.
              if not isinstance(name, str):
                  return False
              return name.strip().lower().replace("_", "-").startswith("x-litellm-")


          def _without_gateway_headers(headers):
              if not isinstance(headers, dict):
                  return headers
              return dict((k, v) for k, v in headers.items() if not _is_gateway_header(k))


          def _strip(fields):
              # Each part is replaced by a filtered copy rather than edited in place, so
              # a request the gateway retries or falls back with is not changed under it.
              for key in HEADER_FIELDS:
                  if key in fields:
                      fields[key] = _without_gateway_headers(fields[key])
              specific = fields.get("provider_specific_header")
              if isinstance(specific, dict) and "extra_headers" in specific:
                  specific = dict(specific)
                  specific["extra_headers"] = _without_gateway_headers(specific["extra_headers"])
                  fields["provider_specific_header"] = specific
              entries = fields.get("model_list")
              if isinstance(entries, list):
                  for entry in entries:
                      params = entry.get("litellm_params") if isinstance(entry, dict) else None
                      if isinstance(params, dict):
                          _strip(params)


          def _listed(alias):
              return isinstance(alias, str) and alias in LISTED


          def _model_group(kwargs):
              for key in ("metadata", "litellm_metadata"):
                  meta = kwargs.get(key)
                  if isinstance(meta, dict) and meta.get("model_group"):
                      return meta["model_group"]
              return None


          class CallerIdentity(CustomLogger):
              async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                  _strip(data)
                  if not _listed(data.get("model")):
                      return data
                  if user_api_key_dict.api_key == LITELLM_PROXY_MASTER_KEY_ALIAS:
                      return data
                  identity = []
                  for header, field in IDENTITY:
                      value = getattr(user_api_key_dict, field, None)
                      if value:
                          identity.append((header, str(value)))
                  if identity:
                      headers = data.get("headers")
                      headers = dict(headers) if isinstance(headers, dict) else {}
                      headers.update(identity)
                      data["headers"] = headers
                  return data

              async def async_pre_call_deployment_hook(self, kwargs, call_type):
                  # Runs on every call to a model, fallbacks included, after the call's
                  # model alias is known. A call to an alias that is not listed loses
                  # the identity written for the alias the request first asked for.
                  if not _listed(_model_group(kwargs)):
                      _strip(kwargs)
                  return kwargs


          hook = CallerIdentity()
      {{- end }}
      {{- if $masking }}
        {{ .locals.masking_module }}.py: |
          """Masking of the gateway's traffic by entity type and by listed pattern.

          Delivered beside the gateway's configuration while core/data-masking lists
          entity types or patterns. Every text the entity classes below mask goes
          through check_pii, the gateway's own Presidio integration's masking of one
          text, which fails the request when a recognizer cannot be reached or
          answers with an error; every text {{ .locals.tool_call_pattern_masking_class }} masks goes through
          the gateway's own content filter's masking of one text, with the entry's
          patterns.
          {{ .locals.request_tool_call_masking_class }} runs before a request is forwarded and before the
          gateway's own Presidio guardrail, which masks the text of the request's
          messages but passes on the tool calls of its earlier turns as they came,
          and which the configuration keeps off the chat route's tool turns, where
          it would mask a result as one text: it masks the arguments of those tool
          calls, and the results of them the conversation carries, a result that is
          JSON value by value and any other result as one text.
          {{ .locals.tool_call_pattern_masking_class }} masks with the listed patterns the tool calls a
          request's earlier turns carry and a reply's, beside the gateway's own
          content filter, which masks the text of the messages. In a streamed chat
          reply it holds the tool-call parts until the choice they belong to
          finishes and sends them masked, in one piece, just before the chunk that
          finishes it; a streamed reply on the messages or responses route arrives
          in pieces of another kind, which it passes on as they come.
          {{ .locals.reply_masking_class }} and {{ .locals.buffered_reply_masking_class }} mask a reply: its text,
          through the gateway's own handler for its kind of reply, its tool-call
          arguments, and, unless the entry sets mask_reasoning to false, its
          reasoning text, in the fields _mask_reasoning names. They differ on a
          streamed reply, whose masking the gateway would otherwise do in a way that
          passes the reply on unmasked when a recognizer cannot be reached.
          {{ .locals.reply_masking_class }} refuses a streamed reply before any of it is sent, and the
          configuration also registers refuse_streamed_requests, which refuses a
          streamed request before it is forwarded at all.
          {{ .locals.buffered_reply_masking_class }} holds a streamed reply until all of it has arrived,
          masks it as one piece and sends it as one piece; when anything about that
          fails, it refuses the request before any of the reply is sent.
          Tool-call arguments are masked value by value, never as one text: they are
          read as JSON, every string value at any depth and every number whose
          digits are recognized or matched are masked, the keys are not, and the
          JSON is written back, such a number becoming the placeholder as a string.
          Arguments that are not JSON, other than empty ones, are never passed on: a
          reply carrying them is refused before any of it is sent, a streamed reply
          masked by pattern sends none of its tool calls and ends with an error after
          the text already sent, and a request carrying them in its conversation is
          refused before it is forwarded.
          """
          import json

          from fastapi import HTTPException
          from litellm.integrations.custom_logger import CustomLogger
          from litellm.llms.base_llm.base_model_iterator import convert_model_response_to_streaming
          from litellm.main import stream_chunk_builder
          from litellm.proxy.guardrails.guardrail_hooks.litellm_content_filter.content_filter import ContentFilterGuardrail
          from litellm.proxy.guardrails.guardrail_hooks.presidio import _OPTIONAL_PresidioPIIMasking
          from litellm.types.utils import Delta, ModelResponse, ModelResponseStream, StreamingChoices

          STREAM_REFUSED = (
              "This gateway masks the entities in its replies and does not stream a reply "
              "it masks that way, so a request asking for a streamed reply is refused. "
              "Send it with stream set to false, or without stream, to receive the whole "
              "reply masked, in one piece."
          )

          REPLY_NOT_JSON = (
              "The reply was not sent: the model returned tool-call arguments that are not "
              "JSON, and this gateway masks tool-call arguments only value by value, so it "
              "sends none of the reply."
          )

          HISTORY_NOT_JSON = (
              "The request was not forwarded: a tool call in its conversation carries "
              "arguments that are not JSON, and this gateway masks tool-call arguments only "
              "value by value. Send each tool call's arguments as the JSON it was made with."
          )

          STREAMED_TOOL_CALLS_NOT_JSON = (
              "The reply's tool calls were not sent: the model returned tool-call arguments "
              "that are not JSON, and this gateway masks tool-call arguments only value by "
              "value, so it sends none of them. The text of the reply before them was sent."
          )


          class NotJson(ValueError):
              pass


          class RefuseStreamedRequests(CustomLogger):
              async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                  # The gateway streams a reply only when stream is true itself, and
                  # serves any other value in one piece, so only that is refused. A
                  # stream begun some other way meets the reply-side guardrail's own
                  # refusal instead.
                  if data.get("stream") is True:
                      raise HTTPException(status_code=400, detail=STREAM_REFUSED)
                  return data


          refuse_streamed_requests = RefuseStreamedRequests()


          def _field(holder, name):
              return holder.get(name) if isinstance(holder, dict) else getattr(holder, name, None)


          def _set_field(holder, name, value):
              if isinstance(holder, dict):
                  holder[name] = value
              else:
                  setattr(holder, name, value)


          class _Number(str):
              # A JSON number exactly as the text wrote it: the recognizer reads the digits
              # as written, and a number it does not flag is written back as it was.
              pass


          class _Members(list):
              # A JSON object's members as (key, value) pairs, in the order written.
              pass


          def _refuse_constant(name):
              raise ValueError(name + " is not JSON")


          def _read_json(text):
              try:
                  return json.loads(
                      text, parse_int=_Number, parse_float=_Number, parse_constant=_refuse_constant, object_pairs_hook=_Members
                  )
              except ValueError:
                  raise NotJson() from None


          def _write_json(value):
              if isinstance(value, _Members):
                  return "{" + ", ".join(json.dumps(key) + ": " + _write_json(item) for key, item in value) + "}"
              if isinstance(value, list):
                  return "[" + ", ".join(_write_json(item) for item in value) + "]"
              if isinstance(value, _Number):
                  return str(value)
              return json.dumps(value)


          async def _masked_value(value, mask):
              # Every string value is masked and no key is. A number is handed over as the
              # text it was written as, and becomes the masked text, a string, only when
              # that text comes back changed.
              if isinstance(value, _Members):
                  return _Members([(key, await _masked_value(item, mask)) for key, item in value])
              if isinstance(value, list):
                  return [await _masked_value(item, mask) for item in value]
              if isinstance(value, _Number):
                  masked = await mask(str(value))
                  return value if masked == value else masked
              if isinstance(value, str) and value:
                  return await mask(value)
              return value


          async def _masked_json(text, mask):
              # Text with nothing in it carries nothing to mask and passes as it is; JSON
              # nothing in which is masked keeps every byte it had. Text that is not JSON
              # raises NotJson, and each caller decides what that means.
              if not text.strip():
                  return text
              value = _read_json(text)
              masked = await _masked_value(value, mask)
              return text if masked == value else _write_json(masked)


          async def _masked_result(text, mask):
              # A tool result is masked value by value when it is JSON, and as one text
              # when it is not.
              try:
                  return await _masked_json(text, mask)
              except NotJson:
                  return await mask(text)


          async def _mask_arguments_of(holder, name, mask):
              text = _field(holder, name) if holder is not None else None
              if isinstance(text, str):
                  _set_field(holder, name, await _masked_json(text, mask))


          async def _mask_result_of(holder, name, mask):
              # A result is one text or a list of parts, each of which carries its text.
              value = _field(holder, name)
              if isinstance(value, str):
                  _set_field(holder, name, await _masked_result(value, mask))
              elif isinstance(value, list):
                  for part in value:
                      text = _field(part, "text")
                      if isinstance(text, str):
                          _set_field(part, "text", await _masked_result(text, mask))


          async def _mask_tool_call_arguments(container, mask):
              # The tool calls a request's conversation or a reply carries, in each shape the
              # gateway's routes use: a chat turn's tool_calls and function_call, a tool_use
              # block's input on the messages route, and a function_call item on the
              # responses route.
              turns = list(_field(container, "messages") or [])
              turns += [_field(choice, "message") for choice in _field(container, "choices") or []]
              if isinstance(container, dict) and container.get("type") == "message":
                  turns.append(container)
              for turn in turns:
                  if turn is None:
                      continue
                  for call in _field(turn, "tool_calls") or []:
                      await _mask_arguments_of(_field(call, "function"), "arguments", mask)
                  await _mask_arguments_of(_field(turn, "function_call"), "arguments", mask)
                  content = _field(turn, "content")
                  for block in content if isinstance(content, list) else []:
                      if _field(block, "type") == "tool_use" and _field(block, "input") is not None:
                          text = json.dumps(_field(block, "input"))
                          masked = await _masked_json(text, mask)
                          if masked != text:
                              _set_field(block, "input", json.loads(masked))
              for items in (_field(container, "input"), _field(container, "output")):
                  for item in items if isinstance(items, list) else []:
                      if _field(item, "type") == "function_call":
                          await _mask_arguments_of(item, "arguments", mask)


          async def _mask_tool_results(request, mask):
              # The results of earlier tool calls a request's conversation carries, in each
              # shape the gateway's routes use: a chat tool or function turn's content, a
              # tool_result block's content on the messages route, and a
              # function_call_output item's output on the responses route.
              for turn in _field(request, "messages") or []:
                  if _field(turn, "role") in ("tool", "function"):
                      await _mask_result_of(turn, "content", mask)
                      continue
                  content = _field(turn, "content")
                  for block in content if isinstance(content, list) else []:
                      if _field(block, "type") == "tool_result":
                          await _mask_result_of(block, "content", mask)
              items = _field(request, "input")
              for item in items if isinstance(items, list) else []:
                  if _field(item, "type") == "function_call_output":
                      await _mask_result_of(item, "output", mask)


          def _masker(guardrail, request_data):
              config = guardrail.get_presidio_settings_from_request_data(request_data or {})

              async def mask(text):
                  return await guardrail.check_pii(
                      text=text, output_parse_pii=False, presidio_config=config, request_data=request_data
                  )

              return mask


          def _pattern_masker(guardrail):
              # The content filter's own masking of one text, with the entry's listed patterns.
              async def mask(text):
                  return guardrail._filter_single_text(text)

              return mask


          class {{ .locals.request_tool_call_masking_class }}(_OPTIONAL_PresidioPIIMasking):
              # This class does not declare apply_guardrail itself, so the gateway hands it
              # the whole request before forwarding it, rather than only its text.

              async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                  mask = _masker(self, data)
                  try:
                      await _mask_tool_call_arguments(data, mask)
                  except NotJson:
                      raise HTTPException(status_code=400, detail=HISTORY_NOT_JSON) from None
                  await _mask_tool_results(data, mask)
                  return data


          class {{ .locals.reply_masking_class }}(_OPTIONAL_PresidioPIIMasking):
              # This class does not declare apply_guardrail itself, so the gateway hands
              # a reply sent in one piece to async_post_call_success_hook below, reply
              # and all, rather than only the reply's text.

              def __init__(self, mask_reasoning=True, **kwargs):
                  # A reply-side guardrail: every reply is masked, and no stand-in is
                  # mapped back to an original. mask_reasoning comes from the entry's
                  # own settings; only false turns the masking of reasoning text off.
                  kwargs["apply_to_output"] = True
                  kwargs["output_parse_pii"] = False
                  super().__init__(**kwargs)
                  self.mask_reasoning = mask_reasoning is not False

              async def async_post_call_success_hook(self, data, user_api_key_dict, response):
                  # The reply's text is masked through the gateway's own handler for its
                  # kind of reply, which is the path the built-in guardrail takes; then
                  # its tool-call arguments, which that handler passes on as they came;
                  # then its reasoning text, in the fields _mask_reasoning names.
                  from litellm.proxy.utils import unified_guardrail

                  data["guardrail_to_apply"] = self
                  masked = await unified_guardrail.async_post_call_success_hook(
                      data=data, user_api_key_dict=user_api_key_dict, response=response
                  )
                  if masked is not None:
                      response = masked
                  await self._mask_tool_calls(response, data)
                  if self.mask_reasoning:
                      await self._mask_reasoning(response, data)
                  return response

              async def _mask_tool_calls(self, reply, request_data):
                  try:
                      await _mask_tool_call_arguments(reply, _masker(self, request_data))
                  except NotJson:
                      raise NotJson(REPLY_NOT_JSON) from None

              async def _mask_reasoning(self, reply, request_data):
                  # Every piece of reasoning text goes through check_pii, the gateway's own
                  # masking of one text, so what is found, what replaces it and what
                  # happens when a recognizer fails are the integration's. The same
                  # reasoning often travels in two or three of the fields below, so each
                  # distinct text is masked once and every such copy receives the result.
                  # A thinking block's signature and a redacted block's data are the
                  # provider's encrypted copies and are left as they are, and a field a
                  # provider names in a way of its own is not among those below.
                  masked = {}
                  config = self.get_presidio_settings_from_request_data(request_data or {})

                  async def text(holder, name):
                      value = _field(holder, name)
                      if isinstance(value, str) and value:
                          if value not in masked:
                              masked[value] = await self.check_pii(
                                  text=value, output_parse_pii=False, presidio_config=config, request_data=request_data
                              )
                          _set_field(holder, name, masked[value])

                  async def blocks(items):
                      for block in items or []:
                          kind = _field(block, "type")
                          if kind == "thinking":
                              await text(block, "thinking")
                          elif kind == "reasoning":
                              for part in list(_field(block, "summary") or []) + list(_field(block, "content") or []):
                                  await text(part, "text")

                  if isinstance(reply, dict):
                      # A reply on the provider-native messages route.
                      if reply.get("type") == "message":
                          await blocks(reply.get("content"))
                      return
                  for choice in _field(reply, "choices") or []:
                      message = _field(choice, "message")
                      if message is None:
                          continue
                      # The chat reply's own reasoning fields, and the copies of them it
                      # carries among its provider-specific fields.
                      for holder in (message, _field(message, "provider_specific_fields")):
                          if holder is None:
                              continue
                          await text(holder, "reasoning_content")
                          await text(holder, "reasoning")
                          await blocks(_field(holder, "thinking_blocks"))
                          await blocks(_field(holder, "reasoning_items"))
                  # A reply on the responses route.
                  await blocks(_field(reply, "output"))

              async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                  # Takes the place of the gateway's own masking of a streamed reply.
                  # Raised before anything is yielded, so none of the reply is sent.
                  raise HTTPException(status_code=400, detail=STREAM_REFUSED)
                  yield


          class {{ .locals.buffered_reply_masking_class }}({{ .locals.reply_masking_class }}):
              async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                  # The whole reply is held and masked as one piece, because entities are
                  # found over the whole text and a piece sent early could carry part of
                  # one. Nothing is yielded until all of it is masked, and any failure is
                  # raised before that one yield, while the gateway can still answer with
                  # an error rather than with part of a reply.
                  try:
                      chunks = []
                      async for chunk in response:
                          if not isinstance(chunk, ModelResponseStream):
                              raise ValueError("the reply arrives as " + type(chunk).__name__ + " pieces, which are not masked")
                          chunks.append(chunk)
                      if not chunks:
                          return
                      whole = stream_chunk_builder(chunks=chunks, messages=request_data.get("messages"))
                      if not isinstance(whole, ModelResponse):
                          raise ValueError("the streamed reply could not be assembled into one reply")
                      self._preserve_usage_from_last_chunk(whole, chunks)
                      # The gateway's own masking of an assembled reply masks its text and
                      # its tool-call arguments as one text each; the tool calls are held
                      # out of it and masked value by value instead.
                      held = []
                      for choice in whole.choices:
                          message = getattr(choice, "message", None)
                          for name in ("tool_calls", "function_call"):
                              if message is not None and getattr(message, name, None):
                                  held.append((message, name, getattr(message, name)))
                                  setattr(message, name, None)
                      await self._process_response_for_pii(response=whole, request_data=request_data, mode="mask")
                      for message, name, value in held:
                          setattr(message, name, value)
                      await self._mask_tool_calls(whole, request_data)
                      if self.mask_reasoning:
                          await self._mask_reasoning(whole, request_data)
                      masked = convert_model_response_to_streaming(whole)
                  except NotJson:
                      raise
                  except Exception as e:
                      raise Exception(
                          "The reply was not sent: masking it failed (" + str(e) + "), and a streamed "
                          "reply is sent only once all of it is masked."
                      ) from e
                  yield masked


          class _HeldToolCalls:
              # The tool-call parts of one choice of a streamed reply, put back together.

              def __init__(self):
                  self.calls = {}
                  self.function = None

              def add(self, delta):
                  for part in _field(delta, "tool_calls") or []:
                      index = _field(part, "index") or 0
                      call = self.calls.setdefault(index, {"id": None, "type": None, "name": None, "arguments": ""})
                      function = _field(part, "function")
                      call["id"] = call["id"] or _field(part, "id")
                      call["type"] = call["type"] or _field(part, "type")
                      call["name"] = call["name"] or _field(function, "name")
                      call["arguments"] += _field(function, "arguments") or ""
                  part = _field(delta, "function_call")
                  if part is not None:
                      if self.function is None:
                          self.function = {"name": None, "arguments": ""}
                      self.function["name"] = self.function["name"] or _field(part, "name")
                      self.function["arguments"] += _field(part, "arguments") or ""

              async def masked(self, mask):
                  # The fields of one delta carrying every held call whole, its arguments masked
                  # value by value; NotJson when any of them is not JSON.
                  fields = {}
                  if self.calls:
                      fields["tool_calls"] = []
                      for index in sorted(self.calls):
                          call = self.calls[index]
                          arguments = await _masked_json(call["arguments"], mask)
                          fields["tool_calls"].append(
                              {
                                  "index": index,
                                  "id": call["id"],
                                  "type": call["type"] or "function",
                                  "function": {"name": call["name"], "arguments": arguments},
                              }
                          )
                  if self.function is not None:
                      arguments = await _masked_json(self.function["arguments"], mask)
                      fields["function_call"] = {"name": self.function["name"], "arguments": arguments}
                  return fields


          class {{ .locals.tool_call_pattern_masking_class }}(ContentFilterGuardrail):
              # Masks tool-call arguments with the entry's listed patterns, through the content
              # filter's own masking of one text: in the tool calls a request's earlier turns
              # carry, and in a reply's. The gateway's own content filter entry beside it masks
              # the text of the messages. This class does not declare apply_guardrail itself,
              # so the gateway hands it the whole request and the whole reply.

              async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                  try:
                      await _mask_tool_call_arguments(data, _pattern_masker(self))
                  except NotJson:
                      raise HTTPException(status_code=400, detail=HISTORY_NOT_JSON) from None
                  return data

              async def async_post_call_success_hook(self, data, user_api_key_dict, response):
                  try:
                      await _mask_tool_call_arguments(response, _pattern_masker(self))
                  except NotJson:
                      raise NotJson(REPLY_NOT_JSON) from None
                  return response

              async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                  # The content filter masks a streamed reply's text as it streams and never its
                  # tool calls, so their parts are held here: each chunk goes on without them,
                  # and when the choice they belong to finishes they are masked whole, value by
                  # value, and sent in one piece just before the chunk that finishes it. When
                  # their arguments are not JSON none of them is sent, and the stream ends with
                  # an error after the text already sent.
                  held = {}
                  async for chunk in response:
                      if isinstance(chunk, ModelResponseStream):
                          for choice in chunk.choices or []:
                              delta = getattr(choice, "delta", None)
                              if delta is not None and (getattr(delta, "tool_calls", None) or getattr(delta, "function_call", None)):
                                  held.setdefault(getattr(choice, "index", 0) or 0, _HeldToolCalls()).add(delta)
                                  delta.tool_calls = None
                                  delta.function_call = None
                          for choice in chunk.choices or []:
                              index = getattr(choice, "index", 0) or 0
                              if getattr(choice, "finish_reason", None) and index in held:
                                  yield await self._held_chunk(chunk, index, held.pop(index))
                      yield chunk
                  for index in sorted(held):
                      yield await self._held_chunk(None, index, held[index])

              async def _held_chunk(self, like, index, calls):
                  try:
                      fields = await calls.masked(_pattern_masker(self))
                  except NotJson:
                      raise NotJson(STREAMED_TOOL_CALLS_NOT_JSON) from None
                  return ModelResponseStream(
                      id=getattr(like, "id", None),
                      created=getattr(like, "created", None),
                      model=getattr(like, "model", None),
                      choices=[StreamingChoices(index=index, delta=Delta(**fields))],
                  )
      {{- end }}
  workload: |
    {{- $configDir := "/etc/litellm" -}}
    {{- $recognizer := false -}}
    {{- range $alias, $edge := .context.uses }}{{ if or (eq $edge.socket "pii_analyzer") (eq $edge.socket "pii_anonymizer") }}{{ $recognizer = true }}{{ end }}{{ end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/berriai/litellm:{{ .infra.engine_version }}"
        # $configDir is the single authored home for the directory the routing
        # table is mounted at: the path the proxy is pointed at and the volume
        # mount that decides what is mounted there both read the binding, so a
        # future move cannot relocate one and leave the other behind. The
        # filename within it is the ConfigMap's own data key, so it is read from
        # the entry the emitted ConfigMap shares.
        # The image entrypoint execs the proxy with the container args as its
        # command line, and supplying args replaces the image's own default
        # arguments — so the listen port is passed here explicitly rather than
        # inherited, dereferencing its single authored home.
        args:
          - "--config"
          - "{{ $configDir }}/{{ .locals.config_file }}"
          - "--port"
          - "{{ .infra.port }}"
        # With infra.external_base_url set, PROXY_BASE_URL carries it: the
        # origin the gateway composes its sign-in callback, its admin-console
        # redirect and the address in its alerts from. Unset, it is not emitted
        # and the gateway takes each of those from the request that arrives.
        # With the recognizer sockets wired, each service's published endpoint
        # arrives on its edge, matched by socket name rather than by the alias
        # the topology chose, and is delivered under the variable the gateway's
        # Presidio integration reads when a guardrail names no address itself.
        # Each is written inside the loop over the edges, so a second service
        # wired to the same socket writes the variable twice and the build
        # refuses the duplicate rather than keeping one address silently.
    {{- if or .infra.database_url .infra.external_base_url $recognizer }}
        variables:
    {{- end }}
    {{- if .infra.database_url }}
          DATABASE_URL: "{{ .infra.database_url }}"
    {{- end }}
    {{- with .infra.external_base_url }}
          PROXY_BASE_URL: "{{ . }}"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "pii_analyzer" }}
          PRESIDIO_ANALYZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if eq $edge.socket "pii_anonymizer" }}
          PRESIDIO_ANONYMIZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- if or (hasKey (default dict .features) "master_key") (hasKey (default dict .features) "provider_key") }}
        attachments:
    {{- end }}
    {{- if hasKey (default dict .features) "master_key" }}
          # The variable the proxy itself reads at startup. Delivered as an env
          # secretKeyRef, so the key's value never lands in the manifest.
          LITELLM_MASTER_KEY:
            from: master_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "provider_key" }}
          # The same variable every routing-table entry names through the proxy's
          # environment indirection, read from the one home above so the table
          # and the delivery agree by construction.
          {{ .locals.provider_key_variable }}:
            from: provider_key
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The proxy documents /health/readiness and /health/liveliness as its
        # readiness and liveness contract; neither makes a model call. Readiness
        # fails while a configured bookkeeping database is unreachable. The
        # start-up probe and every timing are the ones the product's own chart
        # gives these probes: readiness is asked for up to 300 s before the
        # liveness probe takes over.
        health:
          startup:
            http: /health/readiness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          ready:
            http: /health/readiness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          live:
            http: /health/liveliness
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        # Quoted on purpose. A CPU quantity may legitimately be authored as a
        # bare number ("1"), and an unquoted template expansion of it lands in
        # the workload document as a YAML integer, which the resource-quantity
        # contract refuses because a quantity is a string.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: config
            path: "{{ $configDir }}"
    volumes:
      config:
        configmap:
          source: "{{ .locals.config_map_name }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
