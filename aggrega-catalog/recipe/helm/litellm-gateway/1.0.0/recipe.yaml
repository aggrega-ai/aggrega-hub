apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: litellm-gateway
  version: 1.0.0
  license: MIT
  description: >
    An AI gateway on Kubernetes via the helm provider's Workload synthesis,
    running the official upstream proxy image directly. Renders a Deployment,
    a ClusterIP Service and a ConfigMap carrying the routing table. Every
    credential reaches the gateway as an env secretKeyRef, so no credential
    value appears in its own resources. It is proven at LiteLLM v1.103.1 and
    halts on any other engine_version.

    On every Release a second ConfigMap carries a request guard, which
    forwards only the request fields the proxy declares for the route, plus
    any the Release admits in infra.admitted_request_fields, and refuses the
    rest naming the field. The same ConfigMap configures a path allowlist, a
    container running the official nginx image (BSD-2-Clause) on infra.port,
    which answers 403 to every path but the routes the gateway serves.

    A core/context-propagation attachment, a core/data-masking one listing
    what to mask, or values.log_masking listing it, adds the module each
    relies on. A core/prompt-injection-shield attachment sends every map entry
    to the guard on the guard socket.
    PROXY_BASE_URL and the Presidio and cache store addresses appear only when
    infra.external_base_url and their sockets are set. A store publishing
    redis-tls is reached over TLS, its password inside the cache's URL: keep
    that password to letters and digits.

    With `values.metrics_enabled` true the path allowlist forwards a GET of
    /metrics alone from port 9090, on the ClusterIP Service, to the gateway's
    metrics, published as provides.metrics_endpoint; false leaves that key
    empty.

    Reach for this realization where the build must fetch nothing; reach for
    `litellm-gateway-chart`, BerriAI's own chart, where its registry is
    reachable at build time.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/litellm:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Each entry below is the single authored home for a value the configuration
  # the LiteLLMGatewayConfig bundle renders and the workload template both have
  # to agree on. They are separate templates, so a variable bound in one is not
  # visible in the other, and these entries are what keeps the emitted ConfigMap
  # and the container that reads it from drifting apart: config_file is the
  # ConfigMap's data key and the filename the proxy is pointed at, and
  # provider_key_variable is the variable the routing table's hand-typed
  # entries name for their upstream credential and the variable the attached
  # provider_key is delivered under. A second home for that last one is
  # exactly how a routing table comes to name a variable nothing sets. The
  # ConfigMap's own name, "<rendered_name>-config", has no entry here: the
  # bundle declares it and the volume sources it, both reading
  # .context.rendered_name, which a locals entry cannot read.
  locals:
    config_file: config.yaml
    provider_key_variable: LITELLM_PROVIDER_API_KEY
    # The variable a models connection's credential is delivered under, which
    # that connection's entry in the routing table names: these two fixed parts
    # around the connection's alias, written in capitals with every character
    # other than a letter or a digit as an underscore, so the connection fast
    # is delivered as LITELLM_MODEL_FAST_API_KEY. The rule is applied in the
    # configuration bundle and in the workload template, because a variable bound
    # in one is not visible in the other and a locals entry cannot read a
    # connection; its fixed parts are held here once, so the two cannot name
    # different variables. Two aliases the rule maps to one variable halt the
    # build in the workload, naming both. The fixed prefix keeps every such
    # variable apart from the provider variables the proxy reads on its own,
    # so a connection named after a provider is never read as that
    # provider's default key.
    connection_key_variable_prefix: LITELLM_MODEL_
    connection_key_variable_suffix: _API_KEY
    # The word every map entry presents as its credential while
    # core/prompt-injection-shield sends it to the guard. The proxy calls an
    # entry addressed this way only when the entry names a key, and the guard
    # reads none from a request: it presents its own upstream_key to the model.
    # So the entry names a fixed word that is no credential, and the gateway's
    # own provider credential, which the shield's realization does not let be
    # attached beside it, never leaves the gateway.
    guard_api_key: the-guard-holds-the-upstream-credential
    # The module the caller-identity hook is delivered as: the ConfigMap's
    # second data key and the callback the configuration registers both read
    # it, so the file and its registration cannot name different modules.
    caller_identity_module: caller_identity
    # The module the masking guardrails are loaded from, and the classes in it:
    # each configuration entry a core/data-masking attachment's realization
    # writes names a module and a class from here, and the file the
    # configuration bundle delivers defines them from here, so an entry cannot
    # name one the file lacks.
    masking_module: data_masking
    field_entity_masking_class: FieldEntityMasking
    reply_masking_class: ReplyMasking
    buffered_reply_masking_class: BufferedReplyMasking
    field_pattern_masking_class: FieldPatternMasking
    held_reply_class: HeldStreamedReply
    # The module the log-masking guardrail is loaded from, and the class in it:
    # the guardrail entry the configuration body carries while
    # values.log_masking lists something names both from here, and the file the
    # configuration bundle delivers defines the class from here, so the entry
    # cannot name one the file lacks.
    log_masking_module: log_masking
    log_masking_class: LogMasking
    # The callback in that module that withholds a failed call's text: the
    # configuration registers it and the file defines it from here, so the
    # registration cannot name one the file lacks.
    log_masking_failure_callback: withhold_failed_calls
    # The request-guard module, delivered on every Release by the LiteLLMGuard
    # bundle imported below: the file it is carried as and the callback the
    # configuration registers first both read this name. The bundle holds the
    # name as well, and stops the build when this local differs from it, so the
    # file and its registration cannot disagree. The fields the guard refuses on
    # every Release, and the check that a Release does not admit one of them, are
    # the bundle's, not this Recipe's.
    request_filter_module: request_field_filter
    # The path allowlist in front of the gateway. The gateway listens on the
    # pod's loopback address only, so nothing outside the pod reaches it
    # directly, and a reverse proxy in a second container listens on
    # infra.port and forwards only the routes the gateway serves. The address
    # and the port are read by the gateway's own listen arguments and by its
    # probes, and the reverse proxy's forwarding target, which the bundle
    # writes, is the same address and port: the bundle holds the address and
    # computes the port from infra.port by the same rule, and stops the build
    # when either local differs. The loopback port is the one after infra.port,
    # or the one before it when infra.port is the highest there is, so it never
    # collides with the port callers reach and adds no rule on infra.port.
    gateway_address: 127.0.0.1
    gateway_port: '{{ if eq (int .infra.port) 65535 }}65534{{ else }}{{ add1 (int .infra.port) }}{{ end }}'
    # The gateway's metrics, while values.metrics_enabled is true. The gateway
    # serves them on a listener of its own bound to its own address, the
    # loopback one, on gateway_metrics_port, which its listen arguments read;
    # the path allowlist serves them on metrics_port, on every interface,
    # forwarding a GET of /metrics alone to that listener, and its container
    # port, the Service and the published metrics address read it. The bundle
    # holds both ports as well, checks these locals against them, and stops the
    # build when infra.port or gateway_port is one of them.
    metrics_port: "9090"
    gateway_metrics_port: "9091"
    # The reverse proxy's configuration: the file the bundle carries it as and
    # the file the reverse proxy is pointed at both read this name, which the
    # bundle holds as well and checks this local against.
    path_allowlist_file: path-allowlist.conf
    # The tag of the official nginx image the reverse proxy runs, the one
    # core/gateway/nginx defaults to. It is written here rather than taken from
    # infra, because the reverse proxy is part of how this Recipe realizes the
    # gateway and no Release setting chooses it.
    path_allowlist_image_tag: 1.27.5-alpine
    # The bundle's ConfigMap: the name it is emitted under, which the workload's
    # volume sources and the bundle checks this local against, and the directory
    # both containers mount it at. That directory is one of its own, beside the
    # configuration's rather than inside it, so no mount sits within another
    # ConfigMap's directory, and the configuration registers the guard by the
    # full path of its file there. The proxy reads a registration's last dot as
    # the one before the hook's name and every other dot as a directory
    # separator, so this path carries no dot.
    request_guard_config_map_name: "{{ .context.instance_id }}-request-guard"
    request_guard_dir: /etc/litellm-request-guard
    # How the bundle delivers its two files, which the bundle reads: as that one
    # ConfigMap, the shape this target mounts. The bundle takes "config_map" or
    # "compose_configs" and stops the build on anything else.
    request_guard_delivery: config_map
    # Whether the reverse proxy forwards the routes that create, read, update and
    # delete an organization, as "true" or "false"; the bundle reads it. Off
    # here: the release this Recipe pins creates organizations only under an
    # enterprise licence, which nothing this Recipe renders supplies, and
    # answers every organization route 403 without one, so forwarding them
    # would only open routes that cannot succeed. So no key this gateway issues
    # names an organization, and the caller-identity realization writes no
    # organization header.
    forward_organization_routes: "false"
    # Published for an attachment's realization to check against, and never
    # emitted. A FeatureRecipe reads this Recipe's locals and not the
    # component's values, so the fact it checks an attachment against is
    # stated here once: every alias the hand-typed entries of values.models
    # publish, as a JSON list. It carries those entries only, because a locals
    # entry cannot read a connection: the aliases of the models wired to the
    # models socket are the keys of the host's .uses.models, which a
    # realization's assertion reads beside this list. Whether the gateway has a
    # bookkeeping database is not stated here: it is whether the database_url
    # credential slot is attached, which a realization reads from the
    # attachments themselves.
    model_aliases: '{{ $aliases := list }}{{ range (optional .values "models" list) }}{{ $aliases = append $aliases .name }}{{ end }}{{ toJson $aliases }}'
    # Published the same way, and never emitted: every hand-typed entry of
    # values.models, its alias and its target, as a JSON list in map order,
    # which the core/prompt-injection-shield realization checks each target
    # in. The wired entries are not among them, for the same reason.
    model_entries: '{{ toJson (optional .values "models" list) }}'
    # The alias published as the gateway's model, which provides.model below
    # hands to every component wired to it: values.model where it is set, and
    # otherwise the one alias values.models publishes. The component's own
    # assertion has already halted the build where values.model names an alias
    # the gateway does not serve, or is omitted while the gateway serves
    # several aliases or values.models has no entry, so the first entry's alias
    # read here is the only alias there is.
    published_model: '{{ with optional .values "model" "" }}{{ . }}{{ else }}{{ with optional .values "models" list }}{{ (index . 0).name }}{{ end }}{{ end }}'
    # The entity types the Presidio analyzer that core/security/presidio-analyzer
    # runs reports it recognizes in English, as a JSON list: the gateway hands
    # each listed type to that analyzer, and a type outside the list is ignored
    # when it is listed beside one it knows. core/data-masking's realization
    # checks an attachment's entity types against this one list, and the
    # assertion entity_types_the_analyzer_knows below checks those of
    # values.log_masking against it, so the two refuse the same types.
    analyzer_entity_types: '["CREDIT_CARD", "CRYPTO", "DATE_TIME", "EMAIL_ADDRESS", "IBAN_CODE", "IP_ADDRESS", "LOCATION", "MAC_ADDRESS", "MEDICAL_LICENSE", "NRP", "PERSON", "PHONE_NUMBER", "UK_NHS", "URL", "US_BANK_NUMBER", "US_DRIVER_LICENSE", "US_ITIN", "US_PASSPORT", "US_SSN"]'
    # The LiteLLM releases the code this Recipe delivers into the proxy is
    # proven at, as a JSON list: the request guard, on every Release, and the
    # masking modules, while core/data-masking is attached or
    # values.log_masking lists something, are Python the proxy loads, which
    # imports the proxy's own internals, and
    # what they refuse, mask and withhold was established by running them at
    # these releases and at no other. The assertion engine_version_is_proven
    # reads this list, so a release joins the set by one edit here, once that
    # proof has been run at it.
    proven_engine_versions: '["v1.103.1"]'
    # The variables the cache store's host and port are delivered under when
    # the cache_store socket is wired: the workload writes them, and the
    # semantic-caching realization's cache configuration names them through
    # the proxy's environment indirection, so the two cannot name different
    # variables. They are names of this Recipe's own and not the proxy's
    # REDIS_HOST and REDIS_PORT, because the proxy reads those two as the
    # address of a store to keep its own spend counters, rate limits and
    # cross-pod bookkeeping in, which the cache's store is not wired here to
    # be. The password goes under REDIS_PASSWORD, the variable the cache reads
    # it from, delivered from the credential the cache_store connection
    # carries: the cache will not start without one, so with no credential on
    # that connection the workload writes it empty, which connects without a
    # password; on its own that variable names no store, and nothing else in
    # the proxy reads it. While the store publishes redis-tls the workload
    # writes the cache's whole connection URL under cache_store_url_variable
    # in place of the host and port, and the semantic-caching realization
    # names it as the cache's redis_url, the one setting through which the
    # cache connects over TLS. That URL carries the password as a reference to
    # the password variable, which the container expands when it starts; it is
    # a name of this Recipe's own and not the proxy's REDIS_URL for the same
    # reason the host and port are.
    cache_store_host_variable: SEMANTIC_CACHE_STORE_HOST
    cache_store_port_variable: SEMANTIC_CACHE_STORE_PORT
    cache_store_password_variable: REDIS_PASSWORD
    cache_store_url_variable: SEMANTIC_CACHE_STORE_URL
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, the path allowlist's listen port, which the
  # bundle writes, and below its container port and the Service, with the
  # proxy's own loopback port derived from it in the locals; the literal is
  # never repeated. endpoint is the OpenAI-compatible base URL a caller wiring
  # to the gateway reads, assembled from the same host and port as the other
  # keys.
  #
  # host and endpoint spell the Service name out twice on purpose. A provides
  # entry cannot read another provides entry, and the name has to match the
  # Service the helm provider derives from the service key below, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together.
  #
  # provides.host is the bare, self-contained in-cluster service name of the
  # synthesized ClusterIP Service — it carries no namespace, so the recipe is
  # independent of where it is deployed. A consumer in another namespace
  # qualifies the host with the target namespace on its own side (caller-side
  # routing).
  #
  # model is the alias a component wired to the gateway sends as its model
  # name, held once in the published_model local above.
  #
  # metrics_endpoint is the address the path allowlist serves the gateway's
  # own metrics at while values.metrics_enabled is true: /metrics on the
  # metrics_port local above, of the same ClusterIP Service, which carries that
  # port only then. It is empty while the value is false, when the gateway runs
  # no metrics listener.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/v1"
    model: "{{ .locals.published_model }}"
    protocol: "http"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-default:{{ .locals.metrics_port }}/metrics{{ end }}"
  # The gateway takes its public address as an origin — scheme, host and port —
  # and joins its own routes onto it, so an address carrying a path would give
  # it links that point somewhere it is not served. Halt on one here, where the
  # fix is one value in the Release.
  assertions:
    external_base_url_is_an_origin: >-
      {{- with optional .infra "external_base_url" "" -}}
      {{- $u := urlParse . -}}
      {{- if and $u.host $u.path (ne $u.path "/") -}}
      {{- fail (printf "infra.external_base_url %q carries the path %q, but the gateway takes its public address as an origin only, so the links it composes would point where it is not served; set it to the scheme, host and port alone, for example https://llm.example.com" . $u.path) -}}
      {{- end -}}
      {{- end -}}
    # The gateway's Presidio integration calls the analyzer and then the
    # anonymizer for every text it masks, and a guardrail missing either address
    # fails as it is set up, so one socket wired without the other is always a
    # mistake. Halt on it here, naming the socket left empty.
    recognizer_sockets_wired_together: >-
      {{- $analyzer := hasKey .uses "pii_analyzer" -}}
      {{- $anonymizer := hasKey .uses "pii_anonymizer" -}}
      {{- if and $analyzer (not $anonymizer) -}}
      {{- fail "the pii_analyzer socket is wired and the pii_anonymizer socket is not, but the gateway's Presidio integration hands every text the analyzer reports on to the anonymizer and cannot use either service alone; wire a core/security/presidio-anonymizer to pii_anonymizer as well, or remove the pii_analyzer edge" -}}
      {{- end -}}
      {{- if and $anonymizer (not $analyzer) -}}
      {{- fail "the pii_anonymizer socket is wired and the pii_analyzer socket is not, but the gateway's Presidio integration replaces only the spans the analyzer reports and cannot use either service alone; wire a core/security/presidio-analyzer to pii_analyzer as well, or remove the pii_anonymizer edge" -}}
      {{- end -}}
    # The entity types values.log_masking lists are checked against the one
    # list analyzer_entity_types above holds, which core/data-masking's
    # realization reads too. A type outside it is ignored by the analyzer when
    # it is listed beside one it knows, so the logs would keep it and nothing
    # would say so.
    entity_types_the_analyzer_knows: >-
      {{- $known := fromJson (optional .locals "analyzer_entity_types" "[]") -}}
      {{- range $e := optional (optional .values "log_masking" dict) "entities" list -}}
      {{- if not (has $e $known) -}}
      {{- fail (printf "values.log_masking on %q lists the entity type %q, which the Presidio analyzer core/gateway/litellm calls does not recognize in English; listed beside types it does recognize it would mask nothing in the logs and say nothing. List only types from: %s" $.metadata.instance_id $e (join ", " $known)) -}}
      {{- end -}}
      {{- end -}}
    # Entity types values.log_masking lists are found by the Presidio analyzer
    # and replaced by the Presidio anonymizer that the gateway calls through
    # its pii_analyzer and pii_anonymizer sockets: a person's name becomes
    # <PERSON>. Both services receive the unmasked text, recognition runs in
    # English, and it can miss an entity. Listed patterns need neither
    # service. One socket wired alone has already halted above.
    entities_need_the_recognizer: >-
      {{- if optional (optional .values "log_masking" dict) "entities" list -}}
      {{- $analyzer := hasKey .uses "pii_analyzer" -}}
      {{- $anonymizer := hasKey .uses "pii_anonymizer" -}}
      {{- if not (and $analyzer $anonymizer) -}}
      {{- $unwired := "neither its pii_analyzer socket nor its pii_anonymizer socket is wired" -}}
      {{- if $analyzer }}{{ $unwired = "its pii_anonymizer socket is not wired" }}{{ end -}}
      {{- if $anonymizer }}{{ $unwired = "its pii_analyzer socket is not wired" }}{{ end -}}
      {{- fail (printf "values.log_masking on %q lists entities, which core/gateway/litellm finds and replaces in its logs through the Presidio analyzer and anonymizer it calls, but %s; wire a core/security/presidio-analyzer to pii_analyzer and a core/security/presidio-anonymizer to pii_anonymizer on %q, or list patterns instead of entities" .metadata.instance_id $unwired .metadata.instance_id) -}}
      {{- end -}}
      {{- end -}}
    # The request guard this Recipe delivers on every Release, and the masking
    # modules it delivers while core/data-masking is attached or
    # values.log_masking lists something, run inside the proxy and rest on its
    # internals, so they keep what they promise only at the releases they were
    # proven at. At another release they may fail to load and stop the proxy,
    # or load over changed internals and refuse, mask or withhold less, with
    # nothing in the build to show which. So the build halts on any
    # engine_version outside proven_engine_versions, whatever is attached,
    # naming the releases it takes.
    engine_version_is_proven: >-
      {{- $proven := fromJson .locals.proven_engine_versions -}}
      {{- if not (has .infra.engine_version $proven) -}}
      {{- fail (printf "infra.engine_version %q is not a LiteLLM release this Recipe is proven at: the request guard it delivers on every Release, and the masking it delivers while core/data-masking is attached or values.log_masking lists something, are code the proxy loads that relies on the proxy's own internals, and they are proven only at %s. Set infra.engine_version to one of these, or leave it unset for the default" .infra.engine_version (join ", " $proven)) -}}
      {{- end -}}
  artifacts:
    # The gateway's configuration — its routing table, the request guard's
    # registration and the settings the component's values turn on — and the
    # modules delivered beside it as attachments ask, from the bundle every
    # Recipe realizing this gateway imports, so the configuration has one text
    # and every Feature realized on the gateway reads and edits the same body.
    # What the body holds, and what each attachment adds to it, is stated on
    # the bundle. It renders one ConfigMap, "<rendered_name>-config", as the
    # file litellm-gateway-config/configmap.yaml; the workload mounts it as the
    # directory the proxy is pointed at. The bundle reads the locals above
    # that name its files, modules, classes and variables, and stops the build
    # naming any this Recipe does not declare.
    litellm-gateway-config:
      $import: LiteLLMGatewayConfig#/artifacts/GatewayConfig
    # The request guard and the path allowlist, from the bundle every Recipe
    # running this proxy imports, so the line they draw — which request fields a
    # caller may send and which paths it may reach — has one text wherever the
    # proxy runs. The bundle emits one ConfigMap, named by
    # request_guard_config_map_name, carrying the guard module, which holds the
    # fields refused on every Release, and the reverse proxy's configuration,
    # which lists the routes it forwards; the workload mounts it at
    # request_guard_dir in both containers. It stops the build when a Release
    # admits a refused field in infra.admitted_request_fields, and when a name,
    # the address or the port it shares with this Recipe's locals above differs
    # from its own. forward_organization_routes keeps the organization routes
    # off.
    #
    # What the two texts do. On every Release this second ConfigMap carries a
    # request-guard module, mounted in a directory of its own beside the
    # configuration's and registered as the first entry of
    # litellm_settings.callbacks so it runs before anything else reads the
    # request: it forwards only the request fields the proxy declares for the
    # route the request took, plus any the Release names in
    # infra.admitted_request_fields, and refuses the rest with an error naming
    # the field, forwarding nothing. So a caller cannot point the gateway at an
    # address of its own through a request-body model list, inject an upstream
    # header, or slip an unrecognised field through to the model server, nor
    # send a provider key of its own in place of the gateway's, even one it
    # holds legitimately — the fields the guard refuses are the ones a caller
    # could otherwise use to send the gateway's credential somewhere it was not
    # meant to go.
    #
    # The guard sees only the routes that hand it the request, so on every
    # Release the proxy listens on the pod's loopback address alone and a second
    # container, running the official nginx image (BSD-2-Clause), stands in
    # front of it on infra.port, the port the Service targets, as a path
    # allowlist: it forwards only the routes the gateway serves — the chat
    # completions, completions, embeddings, responses, messages, image
    # generation, moderation, transcription and rerank routes the guard checks,
    # in the spellings the gateway serves whatever the model alias; the model
    # listing; the health routes; and, of the administrative routes, key
    # management — and answers every other path 403 with nothing forwarded. So
    # the proxy's token-count routes, its pass-through routes to providers' own
    # APIs, its other administrative routes (organizations, teams, users,
    # budgets, spend and request logs, and model and configuration management
    # among them) and its administrative
    # console are not reachable through this gateway; a caller that counts
    # tokens does so on its own side. The model routes whose path carries the
    # model name, the engine-style and Azure-style paths, are refused too: on
    # them the proxy reads words in the path, the alias included, to decide how
    # it records a request, so the guard would serve some alias names and refuse
    # others. The allowlist's configuration is the other file of that second
    # ConfigMap.
    #
    # While values.metrics_enabled is true the allowlist also listens on
    # metrics_port and forwards a GET of /metrics alone to the gateway's own
    # metrics listener on gateway_metrics_port of the loopback address,
    # answering every other request on that port 403, the metrics listener's
    # health route included. Neither port asks a caller for a key, and the
    # metrics name the hashed keys, key aliases and user emails the gateway
    # attributes spend to, so whatever reaches the Service's metrics port reads
    # them.
    request-guard:
      $import: LiteLLMGuard#/artifacts/RequestGuard
  # The workload: the gateway's Deployment, with the path allowlist as its
  # second container, fronted by a ClusterIP Service.
  #
  # When the optional api_key credential slot is attached the
  # administrative key reaches the gateway as an env secretKeyRef, so its value
  # never appears in the rendered manifest; unattached, the gateway starts with
  # no administrative key. When the optional provider_key slot is attached the
  # upstream credential reaches the gateway the same way.
  #
  # The bookkeeping database's connection string reaches the gateway the same
  # way, as DATABASE_URL, when the optional database_url slot is attached; with
  # none the gateway runs stateless. The
  # gateway's public origin is emitted as PROXY_BASE_URL only when
  # infra.external_base_url is set, and the build halts when that address
  # carries a path. With the pii_analyzer and pii_anonymizer sockets wired, the
  # endpoint each service publishes reaches the gateway as
  # PRESIDIO_ANALYZER_API_BASE and PRESIDIO_ANONYMIZER_API_BASE, the variables
  # its Presidio integration reads wherever a guardrail names no address of its
  # own; this Recipe writes such a guardrail only while values.log_masking lists
  # entity types, so otherwise nothing reads them until an attachment
  # configures one, and the build halts when only one of the two is wired. With
  # neither wired, neither variable is emitted. With the cache_store socket
  # wired, the store's published host and port reach the gateway under the
  # two variables the locals above name, and its password as REDIS_PASSWORD:
  # an env secretKeyRef when the cache_store connection carries a credential,
  # an empty value when it does not. A store publishing redis-tls is reached
  # over TLS: the gateway gets one variable in place of the host and port, the
  # URL the cache connects with, rediss://:$(REDIS_PASSWORD)@<host>:<port>
  # with a credential and rediss://<host>:<port> without one, followed by
  # ?ssl_check_hostname=true, or by
  # ?ssl_ca_certs=/etc/litellm-cache-store-ca/ca.crt&ssl_check_hostname=true
  # while the connection holds a server_ca, whose Secret is mounted whole and
  # read-only there. The password stays an env secretKeyRef, which the provider writes ahead of
  # every plain variable, so the container expands the reference when it
  # starts and the password reaches no rendered file; with no credential, no
  # password variable is written, since the cache reads none beside a URL.
  # Kubernetes inserts the password unencoded, so a password carrying /, ?, #
  # or %, or a tab or a line break, breaks the URL when the gateway starts,
  # and nothing at build can refuse one it never sees: use letters and
  # digits. Without a server_ca the cache checks the store's certificate
  # against its image's default trust store, and with one against that
  # authority, and checks that the certificate names the store's published
  # host; a certificate that does not fails the connection, and every lookup
  # is then a miss and nothing is stored. With nothing
  # wired to cache_store, none of these is emitted. Each models connection
  # carrying a credential delivers it as an env secretKeyRef under the
  # variable its routing-table entry names, derived from its alias by the
  # rule the locals above state; two aliases the rule maps to one variable
  # halt the build here, naming both. The pod is ready only once a request
  # through the path allowlist would be served.
  workload: |
    {{- $configDir := "/etc/litellm" -}}
    {{- $recognizer := false -}}
    {{- $cacheStore := false -}}
    {{- $storeCredential := "" -}}
    {{- $storeCA := "" -}}
    {{- $caDir := "/etc/litellm-cache-store-ca" -}}
    {{- $modelKeys := dict -}}
    {{- range $alias, $edge := .context.uses }}{{ if or (eq $edge.socket "pii_analyzer") (eq $edge.socket "pii_anonymizer") }}{{ $recognizer = true }}{{ end }}{{ if eq $edge.socket "cache_store" }}{{ $cacheStore = true }}{{ if hasKey (default dict $edge.features) "credential" }}{{ $storeCredential = $alias }}{{ end }}{{ if hasKey (default dict $edge.features) "server_ca" }}{{ $storeCA = $alias }}{{ end }}{{ end }}{{ end -}}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "models") (hasKey (default dict $edge.features) "credential") }}
    {{- $variable := printf "%s%s%s" $.locals.connection_key_variable_prefix (regexReplaceAll "[^A-Z0-9]" (upper $alias) "_") $.locals.connection_key_variable_suffix }}
    {{- with get $modelKeys $variable }}{{ fail (printf "the models connections %s and %s of %q would each deliver their credential as %s, because the gateway names a connection's variable after its alias in capitals, with every character other than a letter or a digit as an underscore; rename one of the two connections" . $alias $.context.instance_id $variable) }}{{ end }}
    {{- $_ := set $modelKeys $variable $alias }}
    {{- end }}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/berriai/litellm:{{ .infra.engine_version }}"
        # $configDir is the single authored home for the directory the routing
        # table is mounted at: the path the proxy is pointed at and the volume
        # mount that decides what is mounted there both read the binding, so a
        # future move cannot relocate one and leave the other behind. The
        # filename within it is the ConfigMap's own data key, so it is read from
        # the entry the emitted ConfigMap shares.
        # The image entrypoint execs the proxy with the container args as its
        # command line, and supplying args replaces the image's own default
        # arguments — so the listen address and port are passed here explicitly
        # rather than inherited, each dereferencing its single authored home.
        # The proxy listens on the pod's loopback address only: callers reach it
        # through the path allowlist below, which listens on infra.port, and
        # nothing outside the pod can reach the proxy past it. While
        # values.metrics_enabled is true the proxy also starts its own metrics
        # listener on gateway_metrics_port, which binds to the same loopback
        # address, so the allowlist's metrics port is the one way to it.
        args:
          - "--config"
          - "{{ $configDir }}/{{ .locals.config_file }}"
          - "--host"
          - "{{ .locals.gateway_address }}"
          - "--port"
          - "{{ .locals.gateway_port }}"
    {{- if .values.metrics_enabled }}
          - "--prometheus_metrics_port"
          - "{{ .locals.gateway_metrics_port }}"
    {{- end }}
        # With infra.external_base_url set, PROXY_BASE_URL carries it: the
        # origin the gateway composes its sign-in callback, its admin-console
        # redirect and the address in its alerts from. Unset, it is not emitted
        # and the gateway takes each of those from the request that arrives.
        # With the recognizer sockets wired, each service's published endpoint
        # arrives on its edge, matched by socket name rather than by the alias
        # the topology chose, and is delivered under the variable the gateway's
        # Presidio integration reads when a guardrail names no address itself.
        # Each is written inside the loop over the edges, so a second service
        # wired to the same socket writes the variable twice and the build
        # refuses the duplicate rather than keeping one address silently.
        # With the cache_store socket wired, the store's published host and
        # port are written the same way, and the build halts when the store
        # publishes no vector_search, its own statement that it serves the
        # query engine's vector search. With no credential on the cache_store
        # connection the password variable is written empty; with one, it is
        # delivered below instead. A store publishing redis-tls is served over
        # TLS alone, and the cache composes a plaintext address from a host and
        # port, so the URL variable is written in their place: rediss://, the
        # password as a $(...) reference to the password variable while the
        # connection carries a credential, the host and port, the mounted
        # authority's ca.crt while it holds a server_ca, and always
        # ssl_check_hostname=true, so the cache checks that the store's
        # certificate names the host it dials. Every attachment
        # delivered as env is written ahead of every plain variable, so the
        # reference follows the entry it names. With no credential no password
        # variable is written, since the cache reads none beside a URL. Any
        # other protocol ending in -tls halts the build, naming the connection,
        # as do a server_ca publishing no Secret name and one on a connection
        # whose store serves no TLS.
    {{- if or .infra.external_base_url $recognizer $cacheStore }}
        variables:
    {{- end }}
    {{- with .infra.external_base_url }}
          PROXY_BASE_URL: "{{ . }}"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "pii_analyzer" }}
          PRESIDIO_ANALYZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if eq $edge.socket "pii_anonymizer" }}
          PRESIDIO_ANONYMIZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if eq $edge.socket "cache_store" }}
    {{- if not (toString (optional (default dict $edge.provides) "vector_search" "")) }}
    {{- fail (printf "the cache_store socket is wired to %q, a %s publishing no vector_search, but the gateway's semantic cache stores and searches its replies with the Redis query engine's vector search; a store without it would cache nothing while every request still succeeds. Wire a store publishing vector_search to cache_store: a core/datastore/redis on an infra.engine_version from 8.0.0 on, or one whose infra.overrides.image names an image serving that search, with infra.image_serves_vector_search: true set on it in the Release" $edge.target (first (splitList ":" (toString $edge.component)))) }}
    {{- end }}
    {{- $storeProtocol := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- $storeTLS := eq $storeProtocol "redis-tls" }}
    {{- if and (hasSuffix "-tls" $storeProtocol) (not $storeTLS) }}
    {{- fail (printf "the cache_store connection %s of %q reaches %q, which publishes protocol %s, a store served over TLS that the gateway's semantic cache is not taught to reach: it speaks the Redis protocol, over TLS to a store publishing redis-tls; wire a Redis store publishing redis-tls, or one served without TLS, to the cache_store socket" $alias $.context.instance_id $edge.target $storeProtocol) }}
    {{- end }}
    {{- $edgeFeatures := default dict $edge.features }}
    {{- if hasKey $edgeFeatures "server_ca" }}
    {{- $caProvides := optional (optional $edgeFeatures "server_ca" dict) "provides" dict }}
    {{- if not (and (kindIs "map" $caProvides) (optional $caProvides "name" "")) }}
    {{- fail (printf "the server_ca on the cache_store connection %s of %q publishes no Secret name, so no Secret could be mounted into the gateway: attach a server_ca publishing one, such as core/referenced-secret" $alias $.context.instance_id) }}
    {{- end }}
    {{- if not $storeTLS }}
    {{- fail (printf "the cache_store connection %s of %q holds a server_ca, but the store it reaches, %q, publishes protocol %s, served without TLS, so no TLS handshake takes place to check a certificate in: turn client_tls on for that store, or remove the server_ca" $alias $.context.instance_id $edge.target (default "none" $storeProtocol)) }}
    {{- end }}
    {{- end }}
    {{- if $storeTLS }}
          {{ $.locals.cache_store_url_variable }}: "rediss://{{ if hasKey $edgeFeatures "credential" }}:$({{ $.locals.cache_store_password_variable }})@{{ end }}{{ $edge.provides.host }}:{{ $edge.provides.port }}?{{ if hasKey $edgeFeatures "server_ca" }}ssl_ca_certs={{ $caDir }}/ca.crt&{{ end }}ssl_check_hostname=true"
    {{- else }}
          {{ $.locals.cache_store_host_variable }}: "{{ $edge.provides.host }}"
          {{ $.locals.cache_store_port_variable }}: "{{ $edge.provides.port }}"
    {{- if not (hasKey (default dict $edge.features) "credential") }}
          {{ $.locals.cache_store_password_variable }}: ""
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if or (hasKey (default dict .features) "api_key") (hasKey (default dict .features) "provider_key") (hasKey (default dict .features) "database_url") $storeCredential $modelKeys $storeCA }}
        attachments:
    {{- end }}
    {{- if hasKey (default dict .features) "api_key" }}
          # The variable the proxy itself reads its master key from at startup.
          # Delivered as an env secretKeyRef, so the key's value never lands in
          # the manifest.
          LITELLM_MASTER_KEY:
            from: api_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "provider_key" }}
          # The same variable every hand-typed routing-table entry names
          # through the proxy's environment indirection, read from the one home
          # above so the table and the delivery agree by construction.
          {{ .locals.provider_key_variable }}:
            from: provider_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "database_url" }}
          # The variable the proxy itself reads at startup for its bookkeeping
          # database. The connection string carries the database's credentials,
          # so it is delivered as an env secretKeyRef and never lands in the
          # gateway's own resources.
          DATABASE_URL:
            from: database_url
            as: env
    {{- end }}
    {{- with $storeCredential }}
          # The variable the semantic cache reads the store's password from,
          # read from the one home in the locals above, delivered from the
          # credential the cache_store connection carries as an env
          # secretKeyRef, so the password never lands in the manifest.
          {{ $.locals.cache_store_password_variable }}:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- range $variable, $alias := $modelKeys }}
          # A models connection's credential, under the variable its
          # routing-table entry names, so the proxy presents it to that model
          # alone; delivered as an env secretKeyRef, never the value.
          {{ $variable }}:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- with $storeCA }}
          # The cache_store connection's server_ca Secret, mounted whole and
          # read-only, one file per data key, at the directory the cache's
          # connection URL names its ca.crt in.
          cache-store-server-ca:
            connection: "{{ . }}"
            from: server_ca
            as: file
            path: "{{ $caDir }}"
    {{- end }}
        # The proxy documents /health/readiness and /health/liveliness as its
        # readiness and liveness contract; neither makes a model call. Readiness
        # fails while a configured bookkeeping database is unreachable. The
        # start-up probe and every timing are the ones the product's own chart
        # gives these probes: readiness is asked for up to 300 s before the
        # liveness probe takes over.
        #
        # The proxy declares no port: it listens on the loopback address, which
        # a probe sent to the pod's own address cannot reach. So its start-up and
        # liveness probes run inside this container and ask it on the loopback
        # address, with the interpreter the image runs the proxy with, and a
        # liveness failure restarts this container — the one that stopped
        # answering. Readiness is asked through the path allowlist instead, on
        # its container below, so the pod is ready only once a caller's request
        # would be served.
        health:
          startup:
            exec:
              - python3
              - -I
              - -S
              - -c
              - "import urllib.request; urllib.request.urlopen('http://{{ .locals.gateway_address }}:{{ .locals.gateway_port }}/health/readiness', timeout=4)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          live:
            exec:
              - python3
              - -I
              - -S
              - -c
              - "import urllib.request; urllib.request.urlopen('http://{{ .locals.gateway_address }}:{{ .locals.gateway_port }}/health/liveliness', timeout=4)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        # Quoted on purpose. A CPU quantity may legitimately be authored as a
        # bare number ("1"), and an unquoted template expansion of it lands in
        # the workload document as a YAML integer, which the resource-quantity
        # contract refuses because a quantity is a string.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        # The routing table's ConfigMap as the directory the proxy is pointed at,
        # and the bundle's ConfigMap at a directory of its own beside it, where
        # the configuration's registration finds the request guard.
        volumeMounts:
          - name: config
            path: "{{ $configDir }}"
          - name: request-guard
            path: "{{ .locals.request_guard_dir }}"
            readonly: true
      # The path allowlist: the official nginx image, configured only by the
      # file the bundle's ConfigMap carries, which it mounts and nothing else,
      # run in the foreground in place of the image's own start-up scripts,
      # which would edit a configuration this container does not use. It
      # listens on infra.port, the port the Service targets, and
      # forwards the routes the gateway serves to the proxy on the loopback
      # address; every other path is answered 403 with nothing forwarded. Its
      # readiness probe asks the proxy's readiness route through it, so a pod
      # whose proxy or allowlist is not answering takes no traffic. The
      # resources are sized for its one worker process relaying requests over
      # the loopback address, and set as both request and limit, as the proxy's
      # are, so the pod keeps the same resource class it has with the proxy alone.
      # While values.metrics_enabled is true it also listens on metrics_port,
      # declared here and on the Service; http still sorts first, so the
      # readiness probe stays on it.
      path-allowlist:
        image: "nginx:{{ .locals.path_allowlist_image_tag }}"
        command:
          - nginx
          - -c
          - "{{ .locals.request_guard_dir }}/{{ .locals.path_allowlist_file }}"
          - -g
          - "daemon off;"
        ports:
          http: {{ .infra.port }}
    {{- if .values.metrics_enabled }}
          metrics: {{ .locals.metrics_port }}
    {{- end }}
        health:
          ready:
            http: /health/readiness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: request-guard
            path: "{{ .locals.request_guard_dir }}"
            readonly: true
    volumes:
      config:
        configmap:
          source: "{{ .context.rendered_name }}-config"
      request-guard:
        configmap:
          source: "{{ .locals.request_guard_config_map_name }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
    {{- if .values.metrics_enabled }}
          metrics: {{ .locals.metrics_port }}
    {{- end }}
