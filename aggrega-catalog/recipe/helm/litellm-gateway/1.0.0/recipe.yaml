                  # not JSON none of them is sent, and the stream ends with an error. The parts
                  # _mask_reply_parts names are masked in each chunk as it passes. The chunks
                  # arrive here already held whole by the entry written first for the attachment,
                  # so a reply passes as one chunk.
                  held = {}
                  async for chunk in response:
                      if isinstance(chunk, ModelResponseStream):
                          await _mask_reply_parts(chunk, _pattern_masker(self), self.withholds)
                          for choice in chunk.choices or []:
                              delta = getattr(choice, "delta", None)
                              if delta is not None and (getattr(delta, "tool_calls", None) or getattr(delta, "function_call", None)):
                                  held.setdefault(getattr(choice, "index", 0) or 0, _HeldToolCalls()).add(delta)
                                  delta.tool_calls = None
                                  delta.function_call = None
                          for choice in chunk.choices or []:
                              index = getattr(choice, "index", 0) or 0
                              if getattr(choice, "finish_reason", None) and index in held:
                                  yield await self._held_chunk(chunk, index, held.pop(index))
                      yield chunk
                  for index in sorted(held):
                      yield await self._held_chunk(None, index, held[index])

              async def _held_chunk(self, like, index, calls):
                  try:
                      fields = await calls.masked(_pattern_masker(self))
                  except NotJson:
                      raise NotJson(STREAMED_TOOL_CALLS_NOT_JSON) from None
                  return ModelResponseStream(
                      id=getattr(like, "id", None),
                      created=getattr(like, "created", None),
                      model=getattr(like, "model", None),
                      choices=[StreamingChoices(index=index, delta=Delta(**fields))],
                  )


          class {{ .locals.held_reply_class }}(CustomGuardrail):
              # Written first among the entries of an attachment masking replies by pattern, so it
              # receives a streamed chat reply as the provider sends it, before the gateway's
              # content filter. It holds every chunk until the reply has arrived and hands the
              # reply on as one chunk, its last, so the content filter and the entries after it
              # read the reply whole: no part of a match can be sent before the rest of it has
              # arrived, and where the attachment refuses, nothing of a reply carrying a match is
              # sent. It masks nothing, and acts on no request and no reply sent in one piece. A
              # reply it cannot put back together is not sent, and an error the provider raises
              # while the reply arrives is raised as it came, before any of the reply is sent.

              async def async_post_call_streaming_iterator_hook(self, user_api_key_dict, response, request_data):
                  chunks = []
                  async for chunk in response:
                      chunks.append(chunk)
                  if not chunks:
                      return
                  try:
                      whole = _assembled_reply(chunks, request_data)
                  except Exception as e:
                      raise Exception(REPLY_NOT_HELD.format(reason=str(e))) from e
                  yield convert_model_response_to_streaming(whole)
      {{- end }}
      {{- if $logMasking }}
        {{ .locals.log_masking_module }}.py: |
          """Masking of what the gateway hands to its logs, by listed pattern and by entity type, and of a failed call's text.

          Delivered beside the gateway's configuration while core/log-masking lists patterns or entity types, and loaded by
          the one guardrail entry that attachment's realization writes and by the callback the configuration registers right
          after the request guard. {{ .locals.log_masking_class }} runs only where the gateway hands a finished
          call to its logs, never before a request is forwarded and never on a reply before it is returned: it replaces each
          copy of the call the logs are handed with a masked copy, and edits nothing the call itself holds. The copies are the
          messages, prompt and input of the call; the standard logging payload's messages and reply; a streamed reply as the
          gateway assembled it; the request as the provider was sent it and the reply as the provider returned it; the request
          as the caller sent it, which the spend logs keep; and the reply handed to each integration. In each, the text a caller
          or a model wrote is masked: every listed pattern at every match,
          through the gateway's own content filter's masking of one text, then every listed entity type, through the gateway's
          own Presidio integration's masking of one text; the words that say what a part is, the identifiers that tie parts
          together, and parts that are not text, an image, a file or audio, pass as they are. When a text cannot be masked, a
          recognizer that cannot be reached among the reasons, or an analyzer answer the check after the imports cannot read
          as detections, no copy is handed on masked in part: every copy is built again
          with each such text replaced by one fixed placeholder, [TEXT_WITHHELD], so the call's record is still handed to the
          logs and the call is still counted, and the gateway's own log says the text was withheld. Only if that fails too is
          the record not written at all; it is never written unmasked.

          The gateway calls no logging guardrail for a call that fails, so a failed call's text is withheld instead.
          {{ .locals.log_masking_failure_callback }} is handed a failed call's record before every callback registered after it: the call
          record by the gateway's failure handlers, which can run before a failed attempt is retried, and the request by its
          failure hook. In place of each entry that carries text it puts a copy in which every text a caller or a model wrote
          is [TEXT_WITHHELD], matched or not, and the error the call failed with is [ERROR_TEXT_WITHHELD]; it edits no object
          an entry held, so a retried attempt is sent exactly as it would be without it. The exception the call failed with is
          left as the gateway raised it, because the caller's error reply is built from it, so a callback after this one can
          still read a provider's own error message there. And while this module is loaded, an error the gateway's own
          loggers write at warning or above, carrying its exception or written by the proxy for a failed call, keeps the kind
          of error and loses its text.
          """
          import asyncio
          import copy
          import logging
          from concurrent.futures import ThreadPoolExecutor

          from litellm._logging import verbose_logger, verbose_proxy_logger, verbose_router_logger
          from litellm.integrations.custom_guardrail import CustomGuardrail
          from litellm.integrations.custom_logger import CustomLogger
          from litellm.proxy.guardrails.guardrail_hooks.litellm_content_filter.content_filter import ContentFilterGuardrail
          from litellm.proxy.guardrails.guardrail_hooks.presidio import _OPTIONAL_PresidioPIIMasking
          from litellm.types.guardrails import GuardrailEventHooks
          {{- .locals.analyzer_answer_check | nindent 4 }}

          # What each text a caller or a model wrote becomes, in every copy of a call whose texts could not all be masked:
          # one fixed word that carries no part of any text.
          TEXT_WITHHELD = "[TEXT_WITHHELD]"

          TEXT_WITHHELD_NOTE = (
              "A call's log record was handed on with its text withheld: masking it failed (%s), so every text in every "
              "copy of the call was replaced by " + TEXT_WITHHELD + ". The call itself was answered as usual."
          )

          RECORD_DROPPED = (
              "A call's log record was not written: masking its text failed, and withholding the text failed as well. The "
              "call itself was answered as usual."
          )

          # What the error a failed call ended with becomes, in what the logs are handed for that call: words that carry no
          # part of it.
          ERROR_WITHHELD = "[ERROR_TEXT_WITHHELD]"

          # What the gateway's own log says in place of an error's text, followed by the kind of error.
          ERROR_LINE_WITHHELD = "An error was logged with its text withheld, as log masking is attached: %s"


          class LogMaskingFailed(Exception):
              pass


          # The keys whose value is text a caller or a model wrote, in the request and reply shapes of the routes the gateway
          # serves: a message's or a block's content, a part's text, a tool call's arguments, a completion's prompt, an
          # embedding's or a responses request's input, a responses request's instructions and a responses reply's output, a
          # messages-route system prompt, a completions suffix, reasoning and thinking, and a refusal.
          _TEXT = frozenset([
              "arguments", "content", "input", "instructions", "output", "output_text", "prompt", "reasoning_content",
              "refusal", "suffix", "system", "text", "thinking",
          ])

          # Inside such text, the words that say what a part is and the identifiers that tie parts together.
          _OWN = frozenset([
              "cache_control", "call_id", "encrypted_content", "finish_reason", "id", "index", "media_type", "name", "role",
              "signature", "status", "tool_call_id", "tool_use_id", "type",
          ])

          # The kinds of part that are not text: masking reads text, so these pass as they are.
          _NOT_TEXT = frozenset([
              "audio", "file", "image", "image_url", "input_audio", "input_file", "input_image", "video_url",
          ])


          def _field(holder, name):
              return holder.get(name) if isinstance(holder, dict) else getattr(holder, name, None)


          def _set_field(holder, name, value):
              if isinstance(holder, dict):
                  holder[name] = value
              else:
                  setattr(holder, name, value)


          def _names(holder):
              if isinstance(holder, dict):
                  return list(holder)
              dump = getattr(holder, "model_dump", None)
              return list(dump()) if dump is not None else []


          async def _withheld(text):
              # Reads nothing of the text and calls no recognizer, so it cannot fail the way masking did.
              return TEXT_WITHHELD


          def _run_to_end(make):
              # The gateway calls a synchronous hook from a worker thread, or from a thread running an event loop; either
              # way the coroutine make returns runs to its end in an event loop of its own, and its result or its error is
              # the hook's.
              def run():
                  loop = asyncio.new_event_loop()
                  try:
                      return loop.run_until_complete(make())
                  finally:
                      loop.close()

              try:
                  asyncio.get_running_loop()
              except RuntimeError:
                  return run()
              with ThreadPoolExecutor(max_workers=1) as pool:
                  return pool.submit(run).result()


          class _TextCopies:
              # Builds a copy of a value in which each text a caller or a model wrote is replaced by what replace returns for
              # it; shared by the masking of a successful call and the withholding of a failed one, so the two read the same
              # values as text.
              async def _replaced_item(self, value, replace, text, seen):
                  if isinstance(value, str):
                      return await replace(value) if text else value
                  if isinstance(value, (dict, list)) or getattr(value, "model_dump", None) is not None:
                      await self._replace_in_place(value, replace, text, seen)
                  return value

              async def _replace_in_place(self, holder, replace, text, seen):
                  # Walks a copy: inside a key named in _TEXT every string is text, except under the keys _OWN names; outside
                  # such a key only the walk goes on. A value met twice is replaced once.
                  if id(holder) in seen:
                      return
                  seen.add(id(holder))
                  if isinstance(holder, list):
                      for i, item in enumerate(holder):
                          holder[i] = await self._replaced_item(item, replace, text, seen)
                      return
                  if text and _field(holder, "type") in _NOT_TEXT:
                      return
                  for name in _names(holder):
                      if text and name in _OWN:
                          continue
                      value = _field(holder, name)
                      if value is None:
                          continue
                      replaced = await self._replaced_item(value, replace, text or name in _TEXT, seen)
                      if replaced is not value:
                          _set_field(holder, name, replaced)

              async def _copy(self, value, replace, text):
                  if isinstance(value, str):
                      return await replace(value) if text else value
                  copied = copy.deepcopy(value)
                  await self._replace_in_place(copied, replace, text, set())
                  return copied


          class {{ .locals.log_masking_class }}(_TextCopies, CustomGuardrail):
              def __init__(self, patterns=None, pii_entities_config=None, **kwargs):
                  # A logging hook whatever mode the entry names, so the gateway calls it on no request before it is forwarded
                  # and on no reply before it is returned; and no second entry is built for replies.
                  kwargs["event_hook"] = GuardrailEventHooks.logging_only
                  super().__init__(**kwargs)
                  self._patterns = None
                  if patterns:
                      # The gateway's own content filter, never registered, used only for its masking of one text, so a
                      # pattern masks here exactly what it masks under core/data-masking.
                      self._patterns = ContentFilterGuardrail(
                          guardrail_name=self.guardrail_name, patterns=patterns, event_hook=GuardrailEventHooks.pre_call
                      )
                  self._recognizer = None
                  if pii_entities_config:
                      # The gateway's own Presidio integration, never registered, used only for its masking of one text through
                      # the analyzer and the anonymizer at the addresses the gateway's environment carries.
                      self._recognizer = _OPTIONAL_PresidioPIIMasking(
                          guardrail_name=self.guardrail_name,
                          pii_entities_config=pii_entities_config,
                          event_hook=GuardrailEventHooks.logging_only,
                      )

              async def _mask_text(self, text, done):
                  # Each distinct text is masked once and every copy carrying it receives the result. A caller's request cannot
                  # change what is masked: the recognizer is handed settings of its own, never the request's.
                  if not text.strip():
                      return text
                  if text not in done:
                      masked = text
                      if self._patterns is not None:
                          masked = self._patterns._filter_single_text(masked)
                      if self._recognizer is not None:
                          own = {"metadata": {}}
                          masked = await self._recognizer.check_pii(
                              text=masked,
                              output_parse_pii=False,
                              presidio_config=self._recognizer.get_presidio_settings_from_request_data(own),
                              request_data=own,
                          )
                      done[text] = masked
                  return done[text]

              async def _copies(self, kwargs, result, replace):
                  # Every copy of the call the logs are handed, each built from what the call holds and never from another
                  # copy, with each text in it replaced by what replace returns for that text. Nothing the call holds is
                  # edited, so copies a failure leaves half built are dropped and never handed on.
                  out = dict(kwargs)
                  for key in ("messages", "prompt", "input"):
                      if out.get(key) is not None:
                          out[key] = await self._copy(out[key], replace, True)
                  payload = out.get("standard_logging_object")
                  if isinstance(payload, dict):
                      payload = dict(payload)
                      if payload.get("messages") is not None:
                          payload["messages"] = await self._copy(payload["messages"], replace, True)
                      if payload.get("response") is not None:
                          payload["response"] = await self._copy(payload["response"], replace, isinstance(payload["response"], str))
                      out["standard_logging_object"] = payload
                  for key in ("complete_streaming_response", "async_complete_streaming_response"):
                      if out.get(key) is not None:
                          out[key] = await self._copy(out[key], replace, False)
                  if isinstance(out.get("original_response"), str):
                      out["original_response"] = await replace(out["original_response"])
                  extra = out.get("additional_args")
                  if isinstance(extra, dict) and extra.get("complete_input_dict") is not None:
                      extra = dict(extra)
                      extra["complete_input_dict"] = await self._copy(extra["complete_input_dict"], replace, False)
                      out["additional_args"] = extra
                  params = out.get("litellm_params")
                  arrived = params.get("proxy_server_request") if isinstance(params, dict) else None
                  if isinstance(arrived, dict) and arrived.get("body") is not None:
                      arrived = dict(arrived)
                      arrived["body"] = await self._copy(arrived["body"], replace, False)
                      params = dict(params)
                      params["proxy_server_request"] = arrived
                      out["litellm_params"] = params
                  if result is not None:
                      result = await self._copy(result, replace, isinstance(result, str))
                  return out, result

              async def async_logging_hook(self, kwargs, result, call_type):
                  # What this returns is what the gateway hands on: to each integration, and to its spend logs and cost
                  # tracking, which count the call from the copies' cost and key, never from their text.
                  done = {}

                  async def mask(text):
                      return await self._mask_text(text, done)

                  try:
                      return await self._copies(kwargs, result, mask)
                  except Exception as failure:
                      reason = type(failure).__name__
                  # Masking failed, at the first text or part of the way through, so none of its copies is handed on: every
                  # copy is built again from what the call holds, each text in it withheld.
                  try:
                      withheld = await self._copies(kwargs, result, _withheld)
                  except Exception:
                      # Raised, the gateway hands this call to none of its logs: the handler for asynchronous integrations,
                      # the spend logs and the cost tracking stops at the hook, and the one for synchronous integrations
                      # logs the error and writes nothing.
                      raise LogMaskingFailed(RECORD_DROPPED) from None
                  verbose_proxy_logger.error(TEXT_WITHHELD_NOTE, reason)
                  return withheld

              def logging_hook(self, kwargs, result, call_type):
                  # The gateway's handler for synchronous integrations calls this from a worker thread; the masking runs to its
                  # end in an event loop of its own, and hands on, withholds or raises exactly as async_logging_hook does.
                  return _run_to_end(lambda: self.async_logging_hook(kwargs, result, call_type))


          # Entries of a failed call's record as the gateway's failure handlers and its failure hook hand it on: those that
          # are text a caller or a model wrote, withheld whole; those holding the call's settings and the request as the
          # provider was sent it, walked for such text; and those holding the error's text. The standard logging payload and
          # the request as the caller sent it are handled below; the exception is left as the gateway raised it.
          _FAILED_CALL_TEXT = ("messages", "prompt", "input")
          _FAILED_CALL_WALKED = ("optional_params", "additional_args")
          _FAILED_CALL_ERROR = ("traceback_exception", "original_response")


          class FailedCallWithholding(_TextCopies, CustomLogger):
              async def _withheld_copy(self, value, text):
                  # An entry that cannot be copied is handed on as the placeholder, whole, never as it came.
                  try:
                      return await self._copy(value, _withheld, text)
                  except Exception:
                      return TEXT_WITHHELD

              async def _withheld_entries(self, record):
                  copies = {}
                  for key in _FAILED_CALL_TEXT:
                      if record.get(key) is not None:
                          copies[key] = await self._withheld_copy(record[key], True)
                  for key in _FAILED_CALL_WALKED:
                      if isinstance(record.get(key), dict):
                          copies[key] = await self._withheld_copy(record[key], False)
                  for key in _FAILED_CALL_ERROR:
                      if record.get(key):
                          copies[key] = ERROR_WITHHELD
                  payload = record.get("standard_logging_object")
                  if isinstance(payload, dict):
                      withheld = await self._withheld_copy(payload, False)
                      if isinstance(withheld, dict):
                          for key in ("messages", "response"):
                              if payload.get(key) is not None:
                                  withheld[key] = await self._withheld_copy(payload[key], True)
                          if withheld.get("error_str"):
                              withheld["error_str"] = ERROR_WITHHELD
                          info = withheld.get("error_information")
                          if isinstance(info, dict):
                              for key in ("error_message", "traceback"):
                                  if info.get(key):
                                      info[key] = ERROR_WITHHELD
                      copies["standard_logging_object"] = withheld
                  # The request as the caller sent it: under litellm_params in the call record, at the top of the request.
                  params = record.get("litellm_params")
                  arrived = params.get("proxy_server_request") if isinstance(params, dict) else None
                  if isinstance(arrived, dict) and arrived.get("body") is not None:
                      body = await self._withheld_copy(arrived["body"], False)
                      copies["litellm_params"] = dict(params, proxy_server_request=dict(arrived, body=body))
                  arrived = record.get("proxy_server_request")
                  if isinstance(arrived, dict) and arrived.get("body") is not None:
                      body = await self._withheld_copy(arrived["body"], False)
                      copies["proxy_server_request"] = dict(arrived, body=body)
                  return copies

              async def _withhold(self, record):
                  # Every copy is built first and then put in place of its entry, so the callbacks after this one are handed
                  # the copies; should building them fail, each entry that carries text is put in place as the placeholder.
                  if not isinstance(record, dict):
                      return
                  try:
                      copies = await self._withheld_entries(record)
                  except Exception:
                      copies = dict((key, TEXT_WITHHELD) for key in _FAILED_CALL_TEXT + _FAILED_CALL_WALKED if key in record)
                      copies.update((key, ERROR_WITHHELD) for key in _FAILED_CALL_ERROR if key in record)
                      for key in ("standard_logging_object", "litellm_params", "proxy_server_request"):
                          if key in record:
                              copies[key] = TEXT_WITHHELD
                  record.update(copies)

              def log_failure_event(self, kwargs, response_obj, start_time, end_time):
                  _run_to_end(lambda: self._withhold(kwargs))

              async def async_log_failure_event(self, kwargs, response_obj, start_time, end_time):
                  await self._withhold(kwargs)

              async def async_post_call_failure_hook(self, request_data, original_exception, user_api_key_dict, traceback_str=None):
                  await self._withhold(request_data)
                  return None


          # The proxy's functions that log a failed call's error, by name: one of them writes a provider's error message
          # without its exception attached.
          _FAILED_CALL_LINES = frozenset(["log_llm_api_exception", "_handle_llm_api_exception"])


          class _ErrorTextFilter(logging.Filter):
              # The proxy runs this file anew for each name the configuration loads from it, the guardrail entry's class and
              # the callback, so a filter already installed is found by this mark and each logger carries one.
              withholds_error_text = True

              def filter(self, record):
                  if record.levelno >= logging.WARNING and (record.exc_info or record.funcName in _FAILED_CALL_LINES):
                      if record.exc_info:
                          error = record.exc_info[1]
                      else:
                          args = record.args if isinstance(record.args, tuple) else ()
                          error = next((arg for arg in args if isinstance(arg, BaseException)), None)
                      record.msg = ERROR_LINE_WITHHELD
                      record.args = (type(error).__name__ if error is not None else "unknown",)
                      record.exc_info = None
                      record.exc_text = None
                      record.stack_info = None
                  return True


          for _logger in (verbose_proxy_logger, verbose_router_logger, verbose_logger):
              if not any(getattr(installed, "withholds_error_text", False) for installed in _logger.filters):
                  _logger.addFilter(_ErrorTextFilter())

          {{ .locals.log_masking_failure_callback }} = FailedCallWithholding()
      {{- end }}
    # The request guard and the path allowlist, from the bundle every Recipe
    # running this proxy imports, so the line they draw — which request fields a
    # caller may send and which paths it may reach — has one text wherever the
    # proxy runs. The bundle emits one ConfigMap, named by
    # request_guard_config_map_name, carrying the guard module, which holds the
    # fields refused on every Release, and the reverse proxy's configuration,
    # which lists the routes it forwards; the workload mounts it at
    # request_guard_dir in both containers. It stops the build when a Release
    # admits a refused field in infra.admitted_request_fields, and when a name,
    # the address or the port it shares with this Recipe's locals above differs
    # from its own. forward_organization_routes keeps the organization routes
    # off.
    #
    # What the two texts do. On every Release this second ConfigMap carries a
    # request-guard module, mounted in a directory of its own beside the
    # configuration's and registered as the first entry of
    # litellm_settings.callbacks so it runs before anything else reads the
    # request: it forwards only the request fields the proxy declares for the
    # route the request took, plus any the Release names in
    # infra.admitted_request_fields, and refuses the rest with an error naming
    # the field, forwarding nothing. So a caller cannot point the gateway at an
    # address of its own through a request-body model list, inject an upstream
    # header, or slip an unrecognised field through to the model server, nor
    # send a provider key of its own in place of the gateway's, even one it
    # holds legitimately — the fields the guard refuses are the ones a caller
    # could otherwise use to send the gateway's credential somewhere it was not
    # meant to go.
    #
    # The guard sees only the routes that hand it the request, so on every
    # Release the proxy listens on the pod's loopback address alone and a second
    # container, running the official nginx image (BSD-2-Clause), stands in
    # front of it on infra.port, the port the Service targets, as a path
    # allowlist: it forwards only the routes the gateway serves — the chat
    # completions, completions, embeddings, responses, messages, image
    # generation, moderation, transcription and rerank routes the guard checks,
    # in the spellings the gateway serves whatever the model alias; the model
    # listing; the health routes; and, of the administrative routes, key
    # management — and answers every other path 403 with nothing forwarded. So
    # the proxy's token-count routes, its pass-through routes to providers' own
    # APIs, its other administrative routes (organizations, teams, users,
    # budgets, spend and request logs, and model and configuration management
    # among them) and its administrative
    # console are not reachable through this gateway; a caller that counts
    # tokens does so on its own side. The model routes whose path carries the
    # model name, the engine-style and Azure-style paths, are refused too: on
    # them the proxy reads words in the path, the alias included, to decide how
    # it records a request, so the guard would serve some alias names and refuse
    # others. The allowlist's configuration is the other file of that second
    # ConfigMap.
    request-guard:
      $import: LiteLLMGuard#/artifacts/RequestGuard
  # The workload: the gateway's Deployment, with the path allowlist as its
  # second container, fronted by a ClusterIP Service.
  #
  # When the optional api_key credential slot is attached the
  # administrative key reaches the gateway as an env secretKeyRef, so its value
  # never appears in the rendered manifest; unattached, the gateway starts with
  # no administrative key. When the optional provider_key slot is attached the
  # upstream credential reaches the gateway the same way.
  #
  # The bookkeeping database's connection string reaches the gateway the same
  # way, as DATABASE_URL, when the optional database_url slot is attached; with
  # none the gateway runs stateless. The
  # gateway's public origin is emitted as PROXY_BASE_URL only when
  # infra.external_base_url is set, and the build halts when that address
  # carries a path. With the pii_analyzer and pii_anonymizer sockets wired, the
  # endpoint each service publishes reaches the gateway as
  # PRESIDIO_ANALYZER_API_BASE and PRESIDIO_ANONYMIZER_API_BASE, the variables
  # its Presidio integration reads wherever a guardrail names no address of its
  # own; this Recipe writes no guardrail entry, so nothing reads them until one
  # is configured, and the build halts when only one of the two is wired. With
  # neither wired, neither variable is emitted. With the cache_store socket
  # wired, the store's published host and port reach the gateway under the
  # two variables the locals above name, and its password as REDIS_PASSWORD:
  # an env secretKeyRef when the cache_store connection carries a credential,
  # an empty value when it does not. With nothing wired to cache_store, none
  # of the three is emitted. Each models connection carrying a credential
  # delivers it as an env secretKeyRef under the variable its routing-table
  # entry names, derived from its alias by the rule the locals above state;
  # two aliases the rule maps to one variable halt the build here, naming
  # both. The pod is ready only once a request through the path allowlist
  # would be served.
  workload: |
    {{- $configDir := "/etc/litellm" -}}
    {{- $recognizer := false -}}
    {{- $cacheStore := false -}}
    {{- $storeCredential := "" -}}
    {{- $modelKeys := dict -}}
    {{- range $alias, $edge := .context.uses }}{{ if or (eq $edge.socket "pii_analyzer") (eq $edge.socket "pii_anonymizer") }}{{ $recognizer = true }}{{ end }}{{ if eq $edge.socket "cache_store" }}{{ $cacheStore = true }}{{ if hasKey (default dict $edge.features) "credential" }}{{ $storeCredential = $alias }}{{ end }}{{ end }}{{ end -}}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "models") (hasKey (default dict $edge.features) "credential") }}
    {{- $variable := printf "%s%s%s" $.locals.connection_key_variable_prefix (regexReplaceAll "[^A-Z0-9]" (upper $alias) "_") $.locals.connection_key_variable_suffix }}
    {{- with get $modelKeys $variable }}{{ fail (printf "the models connections %s and %s of %q would each deliver their credential as %s, because the gateway names a connection's variable after its alias in capitals, with every character other than a letter or a digit as an underscore; rename one of the two connections" . $alias $.context.instance_id $variable) }}{{ end }}
    {{- $_ := set $modelKeys $variable $alias }}
    {{- end }}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/berriai/litellm:{{ .infra.engine_version }}"
        # $configDir is the single authored home for the directory the routing
        # table is mounted at: the path the proxy is pointed at and the volume
        # mount that decides what is mounted there both read the binding, so a
        # future move cannot relocate one and leave the other behind. The
        # filename within it is the ConfigMap's own data key, so it is read from
        # the entry the emitted ConfigMap shares.
        # The image entrypoint execs the proxy with the container args as its
        # command line, and supplying args replaces the image's own default
        # arguments — so the listen address and port are passed here explicitly
        # rather than inherited, each dereferencing its single authored home.
        # The proxy listens on the pod's loopback address only: callers reach it
        # through the path allowlist below, which listens on infra.port, and
        # nothing outside the pod can reach the proxy past it.
        args:
          - "--config"
          - "{{ $configDir }}/{{ .locals.config_file }}"
          - "--host"
          - "{{ .locals.gateway_address }}"
          - "--port"
          - "{{ .locals.gateway_port }}"
        # With infra.external_base_url set, PROXY_BASE_URL carries it: the
        # origin the gateway composes its sign-in callback, its admin-console
        # redirect and the address in its alerts from. Unset, it is not emitted
        # and the gateway takes each of those from the request that arrives.
        # With the recognizer sockets wired, each service's published endpoint
        # arrives on its edge, matched by socket name rather than by the alias
        # the topology chose, and is delivered under the variable the gateway's
        # Presidio integration reads when a guardrail names no address itself.
        # Each is written inside the loop over the edges, so a second service
        # wired to the same socket writes the variable twice and the build
        # refuses the duplicate rather than keeping one address silently.
        # With the cache_store socket wired, the store's published host and
        # port are written the same way, and the build halts when the store is
        # not core/datastore/redis, its type compared with any version it was
        # authored with set aside. With no credential on the cache_store
        # connection the password variable is written empty; with one, it is
        # delivered below instead.
    {{- if or .infra.external_base_url $recognizer $cacheStore }}
        variables:
    {{- end }}
    {{- with .infra.external_base_url }}
          PROXY_BASE_URL: "{{ . }}"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "pii_analyzer" }}
          PRESIDIO_ANALYZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if eq $edge.socket "pii_anonymizer" }}
          PRESIDIO_ANONYMIZER_API_BASE: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if eq $edge.socket "cache_store" }}
    {{- $store := first (splitList ":" (toString $edge.component)) }}
    {{- if ne $store "core/datastore/redis" }}
    {{- fail (printf "the cache_store socket is wired to %q, a %s, but the gateway's semantic cache stores and searches its replies with the Redis query engine's vector search and JSON commands, which only core/datastore/redis is established to carry in this catalog; a store without them would cache nothing while every request still succeeds. Wire a core/datastore/redis to cache_store instead" $edge.target $store) }}
    {{- end }}
          {{ $.locals.cache_store_host_variable }}: "{{ $edge.provides.host }}"
          {{ $.locals.cache_store_port_variable }}: "{{ $edge.provides.port }}"
    {{- if not (hasKey (default dict $edge.features) "credential") }}
          {{ $.locals.cache_store_password_variable }}: ""
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if or (hasKey (default dict .features) "api_key") (hasKey (default dict .features) "provider_key") (hasKey (default dict .features) "database_url") $storeCredential $modelKeys }}
        attachments:
    {{- end }}
    {{- if hasKey (default dict .features) "api_key" }}
          # The variable the proxy itself reads its master key from at startup.
          # Delivered as an env secretKeyRef, so the key's value never lands in
          # the manifest.
          LITELLM_MASTER_KEY:
            from: api_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "provider_key" }}
          # The same variable every hand-typed routing-table entry names
          # through the proxy's environment indirection, read from the one home
          # above so the table and the delivery agree by construction.
          {{ .locals.provider_key_variable }}:
            from: provider_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "database_url" }}
          # The variable the proxy itself reads at startup for its bookkeeping
          # database. The connection string carries the database's credentials,
          # so it is delivered as an env secretKeyRef and never lands in the
          # gateway's own resources.
          DATABASE_URL:
            from: database_url
            as: env
    {{- end }}
    {{- with $storeCredential }}
          # The variable the semantic cache reads the store's password from,
          # read from the one home in the locals above, delivered from the
          # credential the cache_store connection carries as an env
          # secretKeyRef, so the password never lands in the manifest.
          {{ $.locals.cache_store_password_variable }}:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- range $variable, $alias := $modelKeys }}
          # A models connection's credential, under the variable its
          # routing-table entry names, so the proxy presents it to that model
          # alone; delivered as an env secretKeyRef, never the value.
          {{ $variable }}:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
        # The proxy documents /health/readiness and /health/liveliness as its
        # readiness and liveness contract; neither makes a model call. Readiness
        # fails while a configured bookkeeping database is unreachable. The
        # start-up probe and every timing are the ones the product's own chart
        # gives these probes: readiness is asked for up to 300 s before the
        # liveness probe takes over.
        #
        # The proxy declares no port: it listens on the loopback address, which
        # a probe sent to the pod's own address cannot reach. So its start-up and
        # liveness probes run inside this container and ask it on the loopback
        # address, with the interpreter the image runs the proxy with, and a
        # liveness failure restarts this container — the one that stopped
        # answering. Readiness is asked through the path allowlist instead, on
        # its container below, so the pod is ready only once a caller's request
        # would be served.
        health:
          startup:
            exec:
              - python3
              - -I
              - -S
              - -c
              - "import urllib.request; urllib.request.urlopen('http://{{ .locals.gateway_address }}:{{ .locals.gateway_port }}/health/readiness', timeout=4)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          live:
            exec:
              - python3
              - -I
              - -S
              - -c
              - "import urllib.request; urllib.request.urlopen('http://{{ .locals.gateway_address }}:{{ .locals.gateway_port }}/health/liveliness', timeout=4)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        # Quoted on purpose. A CPU quantity may legitimately be authored as a
        # bare number ("1"), and an unquoted template expansion of it lands in
        # the workload document as a YAML integer, which the resource-quantity
        # contract refuses because a quantity is a string.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        # The routing table's ConfigMap as the directory the proxy is pointed at,
        # and the bundle's ConfigMap at a directory of its own beside it, where
        # the configuration's registration finds the request guard.
        volumeMounts:
          - name: config
            path: "{{ $configDir }}"
          - name: request-guard
            path: "{{ .locals.request_guard_dir }}"
            readonly: true
      # The path allowlist: the official nginx image, configured only by the
      # file the bundle's ConfigMap carries, which it mounts and nothing else,
      # run in the foreground in place of the image's own start-up scripts,
      # which would edit a configuration this container does not use. It
      # listens on infra.port, the port the Service targets, and
      # forwards the routes the gateway serves to the proxy on the loopback
      # address; every other path is answered 403 with nothing forwarded. Its
      # readiness probe asks the proxy's readiness route through it, so a pod
      # whose proxy or allowlist is not answering takes no traffic. The
      # resources are sized for its one worker process relaying requests over
      # the loopback address, and set as both request and limit, as the proxy's
      # are, so the pod keeps the same resource class it has with the proxy alone.
      path-allowlist:
        image: "nginx:{{ .locals.path_allowlist_image_tag }}"
        command:
          - nginx
          - -c
          - "{{ .locals.request_guard_dir }}/{{ .locals.path_allowlist_file }}"
          - -g
          - "daemon off;"
        ports:
          http: {{ .infra.port }}
        health:
          ready:
            http: /health/readiness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: request-guard
            path: "{{ .locals.request_guard_dir }}"
            readonly: true
    volumes:
      config:
        configmap:
          source: "{{ .context.rendered_name }}-config"
      request-guard:
        configmap:
          source: "{{ .locals.request_guard_config_map_name }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
