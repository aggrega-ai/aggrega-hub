apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: litellm-gateway
  version: 1.0.0
  license: MIT
  description: >
    An AI gateway on Kubernetes via the helm provider's Workload synthesis,
    running the official upstream proxy image directly (no external Helm chart).
    Renders a Deployment, a ClusterIP Service and a ConfigMap carrying the
    routing table — each alias of values.models and of a models connection,
    its upstream and the routing strategy — so the rendered artifact shows
    which models the gateway serves. Every credential reaches the gateway as
    an env secretKeyRef, so no credential value appears in its own resources.
    It is proven at LiteLLM v1.103.1 and halts on any other engine_version.

    On every Release a second ConfigMap carries a request guard, which
    forwards only the request fields the proxy declares for the route, plus
    any the Release admits in infra.admitted_request_fields, and refuses the
    rest naming the field. The same ConfigMap configures a path allowlist, a
    container running the official nginx image (BSD-2-Clause) on infra.port,
    which answers 403 to every path but the model routes, the model listing,
    the health routes and key management. Both come from the LiteLLMGuard
    bundle.

    A core/context-propagation attachment, or a core/data-masking or
    core/log-masking one listing what to mask, adds the module its realization
    relies on; a masking attachment's refusals are a policy the request guard
    applies. A core/prompt-injection-shield attachment sends every map entry
    to the guard on the guard socket.
    PROXY_BASE_URL and the Presidio and cache store addresses appear only when
    infra.external_base_url and their sockets are set; the build halts on an
    address carrying a path, on one recognizer socket wired alone, on a store
    other than core/datastore/redis, and on two models aliases naming one
    variable.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/litellm:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Each entry below is the single authored home for a value the artifacts
  # template and the workload template both have to agree on. They are separate
  # templates, so a variable bound in one is not visible in the other, and these
  # entries are what keeps the emitted ConfigMap and the container that reads it
  # from drifting apart: config_file is the ConfigMap's data key and the filename
  # the proxy is pointed at, and provider_key_variable is the variable the
  # routing table's hand-typed entries name for their upstream credential and
  # the variable the attached provider_key is delivered under. A second home
  # for that last one is exactly how a routing table comes to name a variable
  # nothing sets. The ConfigMap's own name, "<rendered_name>-config", has no
  # entry here: the artifact declares it and the volume sources it, both
  # reading .context.rendered_name, which a locals entry cannot read.
  locals:
    config_file: config.yaml
    provider_key_variable: LITELLM_PROVIDER_API_KEY
    # The variable a models connection's credential is delivered under, which
    # that connection's entry in the routing table names: these two fixed parts
    # around the connection's alias, written in capitals with every character
    # other than a letter or a digit as an underscore, so the connection fast
    # is delivered as LITELLM_MODEL_FAST_API_KEY. The rule is applied in the
    # artifacts template and in the workload template, because a variable bound
    # in one is not visible in the other and a locals entry cannot read a
    # connection; its fixed parts are held here once, so the two cannot name
    # different variables. Two aliases the rule maps to one variable halt the
    # build in the workload, naming both. The fixed prefix keeps every such
    # variable apart from the provider variables the proxy reads on its own,
    # so a connection named after a provider is never read as that
    # provider's default key.
    connection_key_variable_prefix: LITELLM_MODEL_
    connection_key_variable_suffix: _API_KEY
    # The word every map entry presents as its credential while
    # core/prompt-injection-shield sends it to the guard. The proxy calls an
    # entry addressed this way only when the entry names a key, and the guard
    # reads none from a request: it presents its own upstream_key to the model.
    # So the entry names a fixed word that is no credential, and the gateway's
    # own provider credential, which the shield's realization does not let be
    # attached beside it, never leaves the gateway.
    guard_api_key: the-guard-holds-the-upstream-credential
    # The module the caller-identity hook is delivered as: the ConfigMap's
    # second data key and the callback the configuration registers both read
    # it, so the file and its registration cannot name different modules.
    caller_identity_module: caller_identity
    # The module the masking guardrails are loaded from, and the classes in it:
    # each configuration entry a core/data-masking attachment's realization
    # writes names a module and a class from here, and the file below defines
    # them from here, so an entry cannot name one the file lacks.
    masking_module: data_masking
    field_entity_masking_class: FieldEntityMasking
    reply_masking_class: ReplyMasking
    buffered_reply_masking_class: BufferedReplyMasking
    field_pattern_masking_class: FieldPatternMasking
    held_reply_class: HeldStreamedReply
    # The module the log-masking guardrail is loaded from, and the class in it:
    # the configuration entry a core/log-masking attachment's realization
    # writes names both from here, and the file below defines the class from
    # here, so the entry cannot name one the file lacks.
    log_masking_module: log_masking
    log_masking_class: LogMasking
    # The callback in that module that withholds a failed call's text: the
    # configuration registers it and the file defines it from here, so the
    # registration cannot name one the file lacks.
    log_masking_failure_callback: withhold_failed_calls
    # The request-guard module, delivered on every Release by the LiteLLMGuard
    # bundle imported below: the file it is carried as and the callback the
    # configuration registers first both read this name. The bundle holds the
    # name as well, and stops the build when this local differs from it, so the
    # file and its registration cannot disagree. The fields the guard refuses on
    # every Release, and the check that a Release does not admit one of them, are
    # the bundle's, not this Recipe's.
    request_filter_module: request_field_filter
    # The path allowlist in front of the gateway. The gateway listens on the
    # pod's loopback address only, so nothing outside the pod reaches it
    # directly, and a reverse proxy in a second container listens on
    # infra.port and forwards only the routes the gateway serves. The address
    # and the port are read by the gateway's own listen arguments and by its
    # probes, and the reverse proxy's forwarding target, which the bundle
    # writes, is the same address and port: the bundle holds the address and
    # computes the port from infra.port by the same rule, and stops the build
    # when either local differs. The loopback port is the one after infra.port,
    # or the one before it when infra.port is the highest there is, so it never
    # collides with the port callers reach and adds no rule on infra.port.
    gateway_address: 127.0.0.1
    gateway_port: '{{ if eq (int .infra.port) 65535 }}65534{{ else }}{{ add1 (int .infra.port) }}{{ end }}'
    # The reverse proxy's configuration: the file the bundle carries it as and
    # the file the reverse proxy is pointed at both read this name, which the
    # bundle holds as well and checks this local against.
    path_allowlist_file: path-allowlist.conf
    # The tag of the official nginx image the reverse proxy runs, the one
    # core/gateway/nginx defaults to. It is written here rather than taken from
    # infra, because the reverse proxy is part of how this Recipe realizes the
    # gateway and no Release setting chooses it.
    path_allowlist_image_tag: 1.27.5-alpine
    # The bundle's ConfigMap: the name it is emitted under, which the workload's
    # volume sources and the bundle checks this local against, and the directory
    # both containers mount it at. That directory is one of its own, beside the
    # configuration's rather than inside it, so no mount sits within another
    # ConfigMap's directory, and the configuration registers the guard by the
    # full path of its file there. The proxy reads a registration's last dot as
    # the one before the hook's name and every other dot as a directory
    # separator, so this path carries no dot.
    request_guard_config_map_name: "{{ .context.instance_id }}-request-guard"
    request_guard_dir: /etc/litellm-request-guard
    # How the bundle delivers its two files, which the bundle reads: as that one
    # ConfigMap, the shape this target mounts. The bundle takes "config_map" or
    # "compose_configs" and stops the build on anything else.
    request_guard_delivery: config_map
    # Whether the reverse proxy forwards the routes that create, read, update and
    # delete an organization, as "true" or "false"; the bundle reads it. Off
    # here: the release this Recipe pins creates organizations only under an
    # enterprise licence, which nothing this Recipe renders supplies, and
    # answers every organization route 403 without one, so forwarding them
    # would only open routes that cannot succeed. So no key this gateway issues
    # names an organization, and the caller-identity realization writes no
    # organization header.
    forward_organization_routes: "false"
    # Published for an attachment's realization to check against, and never
    # emitted. A FeatureRecipe reads this Recipe's locals and not the
    # component's values, so the fact it checks an attachment against is
    # stated here once: every alias the hand-typed entries of values.models
    # publish, as a JSON list. It carries those entries only, because a locals
    # entry cannot read a connection: the aliases of the models wired to the
    # models socket are the keys of the host's .uses.models, which a
    # realization's assertion reads beside this list. Whether the gateway has a
    # bookkeeping database is not stated here: it is whether the database_url
    # credential slot is attached, which a realization reads from the
    # attachments themselves.
    model_aliases: '{{ $aliases := list }}{{ range (optional .values "models" list) }}{{ $aliases = append $aliases .name }}{{ end }}{{ toJson $aliases }}'
    # Published the same way, and never emitted: every hand-typed entry of
    # values.models, its alias and its target, as a JSON list in map order,
    # which the core/prompt-injection-shield realization checks each target
    # in. The wired entries are not among them, for the same reason.
    model_entries: '{{ toJson (optional .values "models" list) }}'
    # The alias published as the gateway's model, which provides.model below
    # hands to every component wired to it: values.model where it is set, and
    # otherwise the one alias values.models publishes. The component's own
    # assertion has already halted the build where values.model names an alias
    # the gateway does not serve, or is omitted while the gateway serves
    # several aliases or values.models has no entry, so the first entry's alias
    # read here is the only alias there is.
    published_model: '{{ with optional .values "model" "" }}{{ . }}{{ else }}{{ with optional .values "models" list }}{{ (index . 0).name }}{{ end }}{{ end }}'
    # The entity types the Presidio analyzer that core/security/presidio-analyzer
    # runs reports it recognizes in English, as a JSON list: the gateway hands
    # each listed type to that analyzer, and a type outside the list is ignored
    # when it is listed beside one it knows. Both masking realizations,
    # core/data-masking's and core/log-masking's, check an attachment's entity
    # types against this one list, so the two refuse the same types.
    analyzer_entity_types: '["CREDIT_CARD", "CRYPTO", "DATE_TIME", "EMAIL_ADDRESS", "IBAN_CODE", "IP_ADDRESS", "LOCATION", "MAC_ADDRESS", "MEDICAL_LICENSE", "NRP", "PERSON", "PHONE_NUMBER", "UK_NHS", "URL", "US_BANK_NUMBER", "US_DRIVER_LICENSE", "US_ITIN", "US_PASSPORT", "US_SSN"]'
    # The check both masking modules below put in front of the gateway's
    # Presidio integration, held here once and written into whichever of the
    # two is delivered, so the two cannot accept different answers. The
    # integration fails a call when the analyzer answers with an HTTP error,
    # with a body that is not JSON, with an error object or with neither a list
    # nor an object; but it skips, with a warning, every item of a list it
    # cannot read as a detection, so a list holding only such items reads as
    # finding nothing and the text would pass on unmasked. The check accepts an
    # answer that is a list, or an object other than an error, only when every
    # item in it is a detection — an entity type, where it starts and where it
    # ends, and a score — and otherwise fails the call as the integration fails
    # it for an answer it cannot read, so a request or a reply carrying the
    # text fails rather than travel on, and a logged copy has its text
    # withheld. It wraps the one function the integration reads the analyzer's
    # answer through, for every guardrail calling the analyzer, the gateway's
    # own Presidio guardrail included, once per process however often the
    # proxy runs the module. An empty list is a legitimate answer, finding
    # nothing, and passes.
    analyzer_answer_check: |-
      from litellm.exceptions import GuardrailRaisedException
      from litellm.proxy.guardrails.guardrail_hooks import presidio as _presidio_integration
      ANALYZER_ANSWER_UNREADABLE = (
          "Presidio analyzer returned invalid response; cannot verify PII when PII protection is configured: "
          "its answer holds an item that is not a detection result"
      )
      def _is_detection(item):
          # One detection as the analyzer reports it: the entity type, where it starts and ends, and a score.
          if not isinstance(item, dict) or not isinstance(item.get("entity_type"), str) or not item["entity_type"]:
              return False
          start, end, score = item.get("start"), item.get("end"), item.get("score")
          placed = all(isinstance(value, int) and not isinstance(value, bool) for value in (start, end))
          scored = isinstance(score, (int, float)) and not isinstance(score, bool)
          return placed and scored and 0 <= start <= end
      def _checked_analyzer_answer(read):
          async def checked(response):
              answer = await read(response)
              if isinstance(answer, list):
                  items = answer
              elif isinstance(answer, dict) and "error" not in answer:
                  items = [answer]
              else:
                  items = []
              if not all(_is_detection(item) for item in items):
                  raise GuardrailRaisedException(message=ANALYZER_ANSWER_UNREADABLE, should_wrap_with_default_message=False)
              return answer
          checked.checks_analyzer_answer = True
          return checked
      if not getattr(_presidio_integration._json_body, "checks_analyzer_answer", False):
          _presidio_integration._json_body = _checked_analyzer_answer(_presidio_integration._json_body)
    # The LiteLLM releases the code this Recipe delivers into the proxy is
    # proven at, as a JSON list: the request guard, on every Release, and the
    # masking modules, while core/data-masking or core/log-masking is attached,
    # are Python the proxy loads, which imports the proxy's own internals, and
    # what they refuse, mask and withhold was established by running them at
    # these releases and at no other. The assertion engine_version_is_proven
    # reads this list, so a release joins the set by one edit here, once that
    # proof has been run at it.
    proven_engine_versions: '["v1.103.1"]'
    # The variables the cache store's host and port are delivered under when
    # the cache_store socket is wired: the workload writes them, and the
    # semantic-caching realization's cache configuration names them through
    # the proxy's environment indirection, so the two cannot name different
    # variables. They are names of this Recipe's own and not the proxy's
    # REDIS_HOST and REDIS_PORT, because the proxy reads those two as the
    # address of a store to keep its own spend counters, rate limits and
    # cross-pod bookkeeping in, which the cache's store is not wired here to
    # be. The password goes under REDIS_PASSWORD, the variable the cache reads
    # it from, delivered from the credential the cache_store connection
    # carries: the cache will not start without one, so with no credential on
    # that connection the workload writes it empty, which connects without a
    # password; on its own that variable names no store, and nothing else in
    # the proxy reads it.
    cache_store_host_variable: SEMANTIC_CACHE_STORE_HOST
    cache_store_port_variable: SEMANTIC_CACHE_STORE_PORT
    cache_store_password_variable: REDIS_PASSWORD
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, the path allowlist's listen port, which the
  # bundle writes, and below its container port and the Service, with the
  # proxy's own loopback port derived from it in the locals; the literal is
  # never repeated. endpoint is the OpenAI-compatible base URL a caller wiring
  # to the gateway reads, assembled from the same host and port as the other
  # keys.
  #
  # host and endpoint spell the Service name out twice on purpose. A provides
  # entry cannot read another provides entry, and the name has to match the
  # Service the helm provider derives from the service key below, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together.
  #
  # provides.host is the bare, self-contained in-cluster service name of the
  # synthesized ClusterIP Service — it carries no namespace, so the recipe is
  # independent of where it is deployed. A consumer in another namespace
  # qualifies the host with the target namespace on its own side (caller-side
  # routing).
  #
  # model is the alias a component wired to the gateway sends as its model
  # name, held once in the published_model local above.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/v1"
    model: "{{ .locals.published_model }}"
    protocol: "http"
  # The gateway takes its public address as an origin — scheme, host and port —
  # and joins its own routes onto it, so an address carrying a path would give
  # it links that point somewhere it is not served. Halt on one here, where the
  # fix is one value in the Release.
  assertions:
    external_base_url_is_an_origin: >-
      {{- with optional .infra "external_base_url" "" -}}
      {{- $u := urlParse . -}}
      {{- if and $u.host $u.path (ne $u.path "/") -}}
      {{- fail (printf "infra.external_base_url %q carries the path %q, but the gateway takes its public address as an origin only, so the links it composes would point where it is not served; set it to the scheme, host and port alone, for example https://llm.example.com" . $u.path) -}}
      {{- end -}}
      {{- end -}}
    # The gateway's Presidio integration calls the analyzer and then the
    # anonymizer for every text it masks, and a guardrail missing either address
    # fails as it is set up, so one socket wired without the other is always a
    # mistake. Halt on it here, naming the socket left empty.
    recognizer_sockets_wired_together: >-
      {{- $analyzer := hasKey .uses "pii_analyzer" -}}
      {{- $anonymizer := hasKey .uses "pii_anonymizer" -}}
      {{- if and $analyzer (not $anonymizer) -}}
      {{- fail "the pii_analyzer socket is wired and the pii_anonymizer socket is not, but the gateway's Presidio integration hands every text the analyzer reports on to the anonymizer and cannot use either service alone; wire a core/security/presidio-anonymizer to pii_anonymizer as well, or remove the pii_analyzer edge" -}}
      {{- end -}}
      {{- if and $anonymizer (not $analyzer) -}}
      {{- fail "the pii_anonymizer socket is wired and the pii_analyzer socket is not, but the gateway's Presidio integration replaces only the spans the analyzer reports and cannot use either service alone; wire a core/security/presidio-analyzer to pii_analyzer as well, or remove the pii_anonymizer edge" -}}
      {{- end -}}
    # The request guard this Recipe delivers on every Release, and the masking
    # modules it delivers while a masking Feature is attached, run inside the
    # proxy and rest on its internals, so they keep what they promise only at
    # the releases they were proven at. At another release they may fail to
    # load and stop the proxy, or load over changed internals and refuse,
    # mask or withhold less, with nothing in the build to show which. So the
    # build halts on any engine_version outside proven_engine_versions,
    # whatever is attached, naming the releases it takes.
    engine_version_is_proven: >-
      {{- $proven := fromJson .locals.proven_engine_versions -}}
      {{- if not (has .infra.engine_version $proven) -}}
      {{- fail (printf "infra.engine_version %q is not a LiteLLM release this Recipe is proven at: the request guard it delivers on every Release, and the masking it delivers while core/data-masking or core/log-masking is attached, are code the proxy loads that relies on the proxy's own internals, and they are proven only at %s. Set infra.engine_version to one of these, or leave it unset for the default" .infra.engine_version (join ", " $proven)) -}}
      {{- end -}}
  artifacts:
    # The gateway's routing table. Every hand-typed entry of values.models
    # becomes one published alias and the upstream target it resolves to; then
    # every connection on the models socket becomes one more, published under
    # the connection's alias, in alias order. The strategy entry below states
    # how the gateway picks between entries that publish the same alias. This
    # body is the reason the component's capability label is true of what is
    # rendered rather than only of what is authored: a reader of this artifact
    # can see the models the gateway serves.
    #
    # A wired entry is written from what its model publishes: the model name,
    # as the entry's model, and the endpoint, as its api_base — strings piped
    # through, never resolved. Its notation follows its credential. With a
    # credential on the connection, the entry is written openai/<model> and
    # names the variable the workload delivers that credential under, so the
    # proxy presents it to the model; with none, it is written
    # hosted_vllm/<model>, the proxy's notation for an OpenAI-API server it
    # reaches presenting no credential, because an openai/ entry with no key is
    # refused by the proxy on every request. A wired entry never names
    # provider_key's variable. The component's own assertions have already
    # halted the build on a wired model that does not speak the OpenAI API, on
    # an alias a connection and values.models both publish, and on a managed
    # model reached with no credential and no unauthenticated: true. With no
    # entry in values.models and nothing on the models socket, this body halts
    # the build, naming the gateway, since its table would hold no model; that
    # check is here rather than among the component's assertions because
    # validating this Recipe on its own places the component in a build that
    # wires no connection and gives it no values.
    #
    # The body is rendered as a ConfigMap beside the Deployment, and that
    # ConfigMap is where this realization earns the gateway's capability: the
    # rendered artifact shows which models the gateway serves rather than
    # leaving it to the running process to reveal. The proxy container reads
    # that file through the --config flag.
    #
    # No credential value appears here. Each upstream credential is named
    # through the proxy's own environment indirection — an entry carries the
    # variable name and the runtime reads the value from the environment — and
    # the administrative key is not named here at all, because the proxy reads
    # its variable directly from the environment at startup. A hand-typed entry
    # names provider_key's variable and a wired entry its own connection's,
    # rather than carrying the credential, which is what keeps every credential
    # inside the gateway and out of the calling application.
    #
    # While a core/context-propagation attachment is present, the same ConfigMap
    # also carries the caller-identity hook as a second data key, and the body
    # registers it under litellm_settings.callbacks. The whole ConfigMap is
    # mounted as the directory the proxy is pointed at, and the proxy loads a
    # module its configuration names from the directory that configuration sits
    # in, so the file lands where it is looked for. The hook sends the identity
    # to the aliases every such attachment lists in infra.destinations. With no
    # such attachment, neither the registration nor the file is emitted. The
    # hook is the one that attachment's realization relies on, it is
    # registered after the guard, and what it does is stated on that
    # realization.
    #
    # While a core/data-masking attachment lists entities or patterns, the
    # ConfigMap carries the masking module the attachment's realization names
    # in its guardrail entries. The realization decides the same condition from
    # the same attachment to write its entries, because the choice of file here
    # cannot be handed to it; should the two ever disagree, it fails closed: an
    # entry naming a module absent here stops the gateway from starting. What
    # the attachment refuses before forwarding is not a hook of that module's:
    # the realization writes it as a policy into the request guard's settings.
    # With no such attachment, the module is not emitted. The module is a
    # further file beside the configuration, the one that attachment's
    # guardrails are loaded from, and what it does is stated on that
    # realization. What such an attachment refuses before a request is
    # forwarded — request types, fields, parts, tools, streamed requests and
    # output options its masking does not reach — is refused by the request
    # guard, from that policy, so the guard stays the one hook that refuses.
    #
    # While a core/log-masking attachment lists entities or patterns, the
    # ConfigMap carries the log-masking module, the one that attachment's
    # guardrail entry is loaded from, decided from the attachment in the same
    # way and failing closed in the same way, and the body registers the
    # module's failure callback right after the request guard. Its guardrail
    # class runs only where the gateway hands a finished call to its logs, so
    # nothing it does reaches a request or a reply. Its failure callback is
    # handed a failed call's record before every callback registered after
    # it, and puts a copy with the text withheld in place of each entry that
    # carries text, editing no object an entry held, so a retried attempt is
    # sent as it would be without it. While the module is loaded, an error
    # line the gateway's own loggers write at warning or above, carrying its
    # exception or written for a failed call, keeps the kind of error and
    # loses its text. What it masks and withholds is stated on that
    # realization. With no such attachment, neither the module nor the
    # registration is emitted.
    #
    # While a core/prompt-injection-shield attachment is present, every entry
    # of the model map is sent to the guard wired to the guard socket: its
    # api_base is the endpoint the guard publishes, and it presents the fixed
    # word in guard_api_key as its credential, because the guard authenticates
    # upstream with its own. The target stays as the developer wrote it, so the
    # guard is asked for the model the target names. The guard checks each chat
    # request and forwards what it admits to the model behind it; what it does
    # not admit, it answers itself, and nothing of it reaches that model. The
    # attachment's realization checks the guard and the map before any file is
    # written; with the shield attached and nothing on the guard socket this
    # body stops the build too, so the map is never written unguarded under an
    # attached shield. It stops the build as well, naming them, while the
    # shield is attached and the models socket holds a connection, because a
    # wired entry is sent to its own model's endpoint and would pass the guard
    # by. With no such attachment, no hand-typed entry carries an api_base.
    #
    # Each of those attachments is found by its type with any version it was
    # authored with set aside, so core/context-propagation and
    # core/context-propagation:1.0.0 are both read, as are core/data-masking
    # and core/data-masking:1.0.0, core/log-masking and core/log-masking:1.0.0,
    # and core/prompt-injection-shield and core/prompt-injection-shield:1.0.0.
    #
    # On every Release the body registers the request guard first, before any
    # hook that reads the request. Its module is not a file of this ConfigMap:
    # the bundle imported below delivers it in a ConfigMap of its own, mounted
    # at request_guard_dir beside this one's directory, so the registration
    # names the module by the full path of its file there. The proxy loads a
    # module named by a full path from that path, and one named without a
    # directory, as the other hooks below are, from beside the configuration.
    litellm-gateway-config.configmap.yaml: |
      {{- $identity := false }}
      {{- $listed := list }}
      {{- $masking := false }}
      {{- $logMasking := false }}
      {{- $shield := false }}
      {{- range $name, $attachment := (default dict .features) }}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/context-propagation" }}
      {{- $identity = true }}
      {{- range $alias := optional (optional $attachment "infra" dict) "destinations" list }}
      {{- if not (has $alias $listed) }}{{ $listed = append $listed $alias }}{{ end }}
      {{- end }}
      {{- end }}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/data-masking" }}
      {{- $values := optional $attachment "values" dict }}
      {{- if or (optional $values "entities" list) (optional $values "patterns" list) }}{{ $masking = true }}{{ end }}
      {{- end }}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/log-masking" }}
      {{- $values := optional $attachment "values" dict }}
      {{- if or (optional $values "entities" list) (optional $values "patterns" list) }}{{ $logMasking = true }}{{ end }}
      {{- end }}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-injection-shield" }}{{ $shield = true }}{{ end }}
      {{- end }}
      {{- $guardBase := "" }}
      {{- $wired := list }}
      {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "models" }}{{ $wired = append $wired $alias }}{{ end }}{{ end }}
      {{- if not (or (optional .values "models" list) $wired) }}{{ fail (printf "%q serves no model: values.models has no entry and nothing is wired to its models socket, so its routing table would be empty; wire a model to the models socket, or add an entry to values.models" .context.instance_id) }}{{ end }}
      {{- if $shield }}
      {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "guard" }}{{ $guardBase = $edge.provides.endpoint }}{{ end }}{{ end }}
      {{- if not $guardBase }}{{ fail "core/prompt-injection-shield is attached to the gateway, but nothing is wired to its guard socket, so its model map would be sent to no guard; wire a core/security/nemo-guardrails to the guard socket" }}{{ end }}
      {{- if $wired }}{{ fail (printf "core/prompt-injection-shield is attached to the gateway, which sends its model map to the guard, but its models socket holds %s, whose entries would be sent to each model's own endpoint past the guard; remove those connections, or the shield attachment" (join ", " $wired)) }}{{ end }}
      {{- end -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-config
      data:
        {{ .locals.config_file }}: |
          model_list:
      {{- range (optional .values "models" list) }}
            - model_name: {{ .name }}
              litellm_params:
                model: {{ .target }}
      {{- if $guardBase }}
                api_base: {{ $guardBase | toJson }}
                api_key: {{ $.locals.guard_api_key | toJson }}
      {{- else if hasKey (default dict $.features) "provider_key" }}
                api_key: os.environ/{{ $.locals.provider_key_variable }}
      {{- end }}
      {{- end }}
      {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "models" }}
            - model_name: {{ $alias | toJson }}
              litellm_params:
      {{- if hasKey (default dict $edge.features) "credential" }}
                model: {{ printf "openai/%s" $edge.provides.model | toJson }}
                api_base: {{ $edge.provides.endpoint | toJson }}
                api_key: os.environ/{{ $.locals.connection_key_variable_prefix }}{{ regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}{{ $.locals.connection_key_variable_suffix }}
      {{- else }}
                model: {{ printf "hosted_vllm/%s" $edge.provides.model | toJson }}
                api_base: {{ $edge.provides.endpoint | toJson }}
      {{- end }}
      {{- end }}
      {{- end }}
          router_settings:
            routing_strategy: {{ .values.routing_strategy }}
          litellm_settings:
            callbacks:
              - {{ .locals.request_guard_dir }}/{{ .locals.request_filter_module }}.filter
      {{- if $logMasking }}
              - {{ .locals.log_masking_module }}.{{ .locals.log_masking_failure_callback }}
      {{- end }}
      {{- if $identity }}
              - {{ .locals.caller_identity_module }}.hook
      {{- end }}
      {{- if $identity }}
        {{ .locals.caller_identity_module }}.py: |
          """Caller identity for the requests this gateway sends upstream.

          Delivered beside the gateway's configuration and registered there under
          litellm_settings.callbacks while core/context-propagation is attached. On
          every request it removes each header whose name begins x-litellm- from the
          parts of the request body the gateway turns into upstream headers, so a
          caller cannot supply an identity of its own. On a request for a listed model
          alias it then adds the user and the team of the virtual key the gateway
          verified, and its organization where the key names one, and nothing else
          about that key. A request made with the master key names nobody and
          carries none of them.
          """
          from litellm.constants import LITELLM_PROXY_MASTER_KEY_ALIAS
          from litellm.integrations.custom_logger import CustomLogger
          from litellm.proxy._types import UserAPIKeyAuth

          # The model aliases whose upstream receives the caller's identity.
          LISTED = frozenset([{{ range $i, $alias := $listed }}{{ if $i }}, {{ end }}{{ toJson $alias }}{{ end }}])

          # The header each verified field travels under. These are the names the
          # gateway's own header forwarding uses, so a service reading them reads one
          # set of names whichever part of the gateway wrote them.
          IDENTITY = (
              ("x-litellm-user_api_key_user_id", "user_id"),
              ("x-litellm-user_api_key_team_id", "team_id"),
              ("x-litellm-user_api_key_org_id", "org_id"),
          )

          # The request fields the gateway turns into upstream headers. It merges them
          # in this order, the later winning, and provider_specific_header.extra_headers
          # over both; a model_list entry's litellm_params carries the same two.
          HEADER_FIELDS = ("headers", "extra_headers")

          # The name under which the gateway places the verified key's own record in the
          # one metadata mapping it fills for a request. A request body cannot carry that
          # object, so the mapping holding it is the gateway's and any other the caller's.
          KEY_RECORD = "user_api_key_auth"


          def _is_gateway_header(name):
              # Header names are matched loosely further on, so they are compared the
              # same way here: surrounding space trimmed, letter case ignored, and an
              # underscore read as a hyphen.
              if not isinstance(name, str):
                  return False
              return name.strip().lower().replace("_", "-").startswith("x-litellm-")


          def _without_gateway_headers(headers):
              if not isinstance(headers, dict):
                  return headers
              return dict((k, v) for k, v in headers.items() if not _is_gateway_header(k))


          def _strip(fields):
              # Each part is replaced by a filtered copy rather than edited in place, so
              # a request the gateway retries or falls back with is not changed under it.
              for key in HEADER_FIELDS:
                  if key in fields:
                      fields[key] = _without_gateway_headers(fields[key])
              specific = fields.get("provider_specific_header")
              if isinstance(specific, dict) and "extra_headers" in specific:
                  specific = dict(specific)
                  specific["extra_headers"] = _without_gateway_headers(specific["extra_headers"])
                  fields["provider_specific_header"] = specific
              entries = fields.get("model_list")
              if isinstance(entries, list):
                  for entry in entries:
                      params = entry.get("litellm_params") if isinstance(entry, dict) else None
                      if isinstance(params, dict):
                          _strip(params)


          def _listed(alias):
              return isinstance(alias, str) and alias in LISTED


          def _model_group(kwargs):
              # The alias is read only from the gateway's own mapping, the one holding the
              # key's record, and only the two top-level mappings are looked at: copies of
              # the request nested deeper hold the record too and, on a fallback, still
              # name the alias the request first asked for. Where neither holds the
              # record, no alias is read, so the call is treated as one to an alias that
              # is not listed.
              for key in ("metadata", "litellm_metadata"):
                  meta = kwargs.get(key)
                  if isinstance(meta, dict) and isinstance(meta.get(KEY_RECORD), UserAPIKeyAuth):
                      return meta.get("model_group")
              return None


          class CallerIdentity(CustomLogger):
              async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
                  _strip(data)
                  if not _listed(data.get("model")):
                      return data
                  if user_api_key_dict.api_key == LITELLM_PROXY_MASTER_KEY_ALIAS:
                      return data
                  identity = []
                  for header, field in IDENTITY:
                      value = getattr(user_api_key_dict, field, None)
                      if value:
                          identity.append((header, str(value)))
                  if identity:
                      headers = data.get("headers")
                      headers = dict(headers) if isinstance(headers, dict) else {}
                      headers.update(identity)
                      data["headers"] = headers
                  return data

              async def async_pre_call_deployment_hook(self, kwargs, call_type):
                  # Runs on every call to a model, fallbacks included, after the call's
                  # model alias is known. A call to an alias that is not listed loses
                  # the identity written for the alias the request first asked for.
                  if not _listed(_model_group(kwargs)):
                      _strip(kwargs)
                  return kwargs


          hook = CallerIdentity()
      {{- end }}
      {{- if $masking }}
        {{ .locals.masking_module }}.py: |
          """Masking of the gateway's traffic by entity type and by listed pattern.

          Delivered beside the gateway's configuration while core/data-masking lists
          entity types or patterns. Every text the entity classes below mask goes
          through check_pii, the gateway's own Presidio integration's masking of one
          text, which fails the request when a recognizer cannot be reached or
          answers with an error; every text {{ .locals.field_pattern_masking_class }} masks goes through
          the gateway's own content filter's masking of one text, with the entry's
          patterns. The check right after the imports makes an analyzer answer
          holding an item that is not a detection such an error too, for every
          guardrail calling the analyzer, the gateway's own included. Where the
          attachment refuses rather than masks, its entries mark each pattern and
          entity type BLOCK, and those same two functions then raise on a match
          instead of replacing it, so every class here refuses what it would have
          masked: a request is not forwarded, and a reply is not sent. None of them
          refuses a request for its route, its parts or its options: that is the
          request guard's, which refuses, before anything here runs, every request
          the attachment's policy does not serve.
          {{ .locals.field_entity_masking_class }} runs before a request is forwarded and before the
          gateway's own Presidio guardrail, which masks the text of the request's
          messages but passes on the tool calls of its earlier turns as they came,
          and which the configuration keeps off the chat route's tool turns, where
          it would mask a result as one text: it masks the arguments of those tool
          calls, and the results of them the conversation carries, a result that is
          JSON value by value and any other result as one text; and it masks the
          request fields that guardrail does not read, in _mask_request_fields.
          {{ .locals.field_pattern_masking_class }} masks with the listed patterns the same tool calls,
          tool results and fields a request carries, and a reply's tool calls and
          the parts _mask_reply_parts names, beside the gateway's own content filter,
          which masks the text of the messages and which the configuration keeps off
          the chat route's tool turns on requests. In a streamed chat reply it holds
          the tool-call parts until the choice they belong to finishes and sends them
          masked, in one piece, just before the chunk that finishes it.
          {{ .locals.held_reply_class }} runs only on a streamed chat reply masked by pattern, where
          its entry comes first, so it receives the provider's chunks before the
          gateway's content filter does. The content filter masks a streamed reply's
          text piece by piece, sending all of it but its last characters as it goes,
          so a match whose earlier part arrived far enough ahead of the rest would
          leave that part sent before the match is found. {{ .locals.held_reply_class }} holds the whole
          reply and hands it on as one piece, so the content filter and the entries
          after it read and mask the reply whole and the caller receives it all at
          once at the end; it masks nothing itself.
          {{ .locals.reply_masking_class }} and {{ .locals.buffered_reply_masking_class }} mask a reply: its text,
          through the gateway's own handler for its kind of reply, its tool-call
          arguments, the parts _mask_reply_parts names, and, unless the entry sets
          mask_reasoning to false, its reasoning text, in the fields _mask_reasoning
          names. They differ on a streamed reply, whose masking the gateway would
          otherwise do in a way that passes the reply on unmasked when a recognizer
          cannot be reached.
          {{ .locals.reply_masking_class }} refuses a streamed reply before any of it is sent; the request
          guard has already refused a request asking for one.
          {{ .locals.buffered_reply_masking_class }} holds a streamed reply until all of it has arrived,
          masks it as one piece and sends it as one piece; when masking it fails, it
          refuses the request before any of the reply is sent, and an error the
          provider raises while the reply arrives reaches the caller as that error.
          A reply also carries parts its model or provider adds on its own: a refusal,
          citations and annotations, a web search's query and its results, and fields
          under names of the provider's own, on the reply, a choice, a message or a
          streamed chunk, or as an output item or a content block of a kind of its
          own. Where an entry masks replies, _mask_reply_parts masks every string in
          them, value by value, and leaves as they are the words that say what a part
          is, the identifiers that tie parts together and a provider's encrypted
          tokens; in a streamed chat reply masked by pattern, the parts of the one
          piece {{ .locals.held_reply_class }} hands on are masked as it passes. What masking cannot
          read — spoken audio and its transcript, an image, and the probabilities of
          the tokens the model chose — is withheld: _withhold_unreadable takes it out
          of the reply, one piece or streamed, and the caller receives the rest. And
          an error the model call raises reaches the caller without the message the
          provider wrote in it, which can quote text the masking never saw: the
          message is replaced on the exception the gateway answers from, by one
          saying that the gateway masks sensitive text in its replies or, where the
          entry refuses, that it refuses the replies that carry it, and the
          error keeps its status code and its type. An entry that sets
          allow_unmasked_reply_parts does neither: what masking cannot read reaches
          the caller as the provider sent it, and so does the provider's message.
          Tool-call arguments are masked value by value, never as one text: they are
          read as JSON, every string value at any depth and every number whose
          digits are recognized or matched are masked, the keys are not, and the
          JSON is written back, such a number becoming the placeholder as a string.
          Arguments that are not JSON, other than empty ones, are never passed on: a
          reply carrying them is refused before any of it is sent, a streamed reply
          masked by pattern sends none of its tool calls and ends with an error, and
          a request carrying them in its conversation is refused before it is
          forwarded.
          """
          import json

          import openai
          from fastapi import HTTPException
          from litellm.exceptions import BlockedPiiEntityError
          from litellm.integrations.custom_guardrail import CustomGuardrail
          from litellm.llms.base_llm.base_model_iterator import convert_model_response_to_streaming
          from litellm.llms.base_llm.chat.transformation import BaseLLMException
          from litellm.main import stream_chunk_builder
          from litellm.proxy.guardrails.guardrail_hooks.litellm_content_filter.content_filter import ContentFilterGuardrail
          from litellm.proxy.guardrails.guardrail_hooks.presidio import _OPTIONAL_PresidioPIIMasking
          from litellm.types.guardrails import GuardrailEventHooks
          from litellm.types.utils import Delta, ModelResponse, ModelResponseStream, StreamingChoices
          {{- .locals.analyzer_answer_check | nindent 4 }}

          STREAM_REFUSED = (
              "This gateway masks the entities in its replies and does not stream a reply "
              "it masks that way, so a request asking for a streamed reply is refused. "
              "Send it with stream set to false, or without stream, to receive the whole "
              "reply masked, in one piece."
          )

          REPLY_NOT_JSON = (
              "The reply was not sent: the model returned tool-call arguments that are not "
              "JSON, and this gateway masks tool-call arguments only value by value, so it "
              "sends none of the reply."
          )

          HISTORY_NOT_JSON = (
              "The request was not forwarded: a tool call in its conversation carries "
              "arguments that are not JSON, and this gateway masks tool-call arguments only "
              "value by value. Send each tool call's arguments as the JSON it was made with."
          )

          STREAMED_TOOL_CALLS_NOT_JSON = (
              "The reply's tool calls were not sent: the model returned tool-call arguments "
              "that are not JSON, and this gateway masks tool-call arguments only value by "
              "value, so it sends none of them."
          )

          REPLY_NOT_HELD = (
              "The reply was not sent: holding it whole failed ({reason}), and this gateway "
              "sends a streamed reply it masks by pattern only once all of it has arrived."
          )

          PROVIDER_ERROR_WITHHELD = (
              "The call to the model failed{status}. This gateway {what}, so it does not pass "
              "on the message the model provider returned with the error, which can quote text "
              "from the request or from the reply."
          )

          # What the fixed message says the gateway does with its replies: what an entry does
          # where its marks are MASK, and where they are BLOCK.
          MASKS_REPLIES = "masks sensitive text in its replies"
          REFUSES_REPLIES = "refuses the replies that carry sensitive text"


          class NotJson(ValueError):
              pass


          def _field(holder, name):
              return holder.get(name) if isinstance(holder, dict) else getattr(holder, name, None)


          def _set_field(holder, name, value):
              if isinstance(holder, dict):
                  holder[name] = value
              else:
                  setattr(holder, name, value)


          class _Number(str):
              # A JSON number exactly as the text wrote it: the recognizer reads the digits
              # as written, and a number it does not flag is written back as it was.
              pass


          class _Members(list):
              # A JSON object's members as (key, value) pairs, in the order written.
              pass


          def _refuse_constant(name):
              raise ValueError(name + " is not JSON")


          def _read_json(text):
              try:
                  return json.loads(
                      text, parse_int=_Number, parse_float=_Number, parse_constant=_refuse_constant, object_pairs_hook=_Members
                  )
              except ValueError:
                  raise NotJson() from None


          def _write_json(value):
              if isinstance(value, _Members):
                  return "{" + ", ".join(json.dumps(key) + ": " + _write_json(item) for key, item in value) + "}"
              if isinstance(value, list):
                  return "[" + ", ".join(_write_json(item) for item in value) + "]"
              if isinstance(value, _Number):
                  return str(value)
              return json.dumps(value)


          async def _masked_value(value, mask):
              # Every string value is masked and no key is. A number is handed over as the
              # text it was written as, and becomes the masked text, a string, only when
              # that text comes back changed.
              if isinstance(value, _Members):
                  return _Members([(key, await _masked_value(item, mask)) for key, item in value])
              if isinstance(value, list):
                  return [await _masked_value(item, mask) for item in value]
              if isinstance(value, _Number):
                  masked = await mask(str(value))
                  return value if masked == value else masked
              if isinstance(value, str) and value:
                  return await mask(value)
              return value


          async def _masked_json(text, mask):
              # Text with nothing in it carries nothing to mask and passes as it is; JSON
              # nothing in which is masked keeps every byte it had. Text that is not JSON
              # raises NotJson, and each caller decides what that means.
              if not text.strip():
                  return text
              value = _read_json(text)
              masked = await _masked_value(value, mask)
              return text if masked == value else _write_json(masked)


          async def _masked_result(text, mask):
              # A tool result is masked value by value when it is JSON, and as one text
              # when it is not.
              try:
                  return await _masked_json(text, mask)
              except NotJson:
                  return await mask(text)


          async def _mask_arguments_of(holder, name, mask):
              text = _field(holder, name) if holder is not None else None
              if isinstance(text, str):
                  _set_field(holder, name, await _masked_json(text, mask))


          async def _mask_result_of(holder, name, mask):
              # A result is one text or a list of parts, each of which carries its text.
              value = _field(holder, name)
              if isinstance(value, str):
                  _set_field(holder, name, await _masked_result(value, mask))
              elif isinstance(value, list):
                  for part in value:
                      text = _field(part, "text")
                      if isinstance(text, str):
                          _set_field(part, "text", await _masked_result(text, mask))


          async def _mask_tool_call_arguments(container, mask):
              # The tool calls a request's conversation or a reply carries, in each shape the
              # gateway's routes use: a chat turn's tool_calls and function_call, a tool_use
              # block's input on the messages route, and a function_call item on the
              # responses route.
              turns = list(_field(container, "messages") or [])
              turns += [_field(choice, "message") for choice in _field(container, "choices") or []]
              if isinstance(container, dict) and container.get("type") == "message":
                  turns.append(container)
              for turn in turns:
                  if turn is None:
                      continue
                  for call in _field(turn, "tool_calls") or []:
                      await _mask_arguments_of(_field(call, "function"), "arguments", mask)
                  await _mask_arguments_of(_field(turn, "function_call"), "arguments", mask)
                  content = _field(turn, "content")
                  for block in content if isinstance(content, list) else []:
                      if _field(block, "type") == "tool_use" and _field(block, "input") is not None:
                          text = json.dumps(_field(block, "input"))
                          masked = await _masked_json(text, mask)
                          if masked != text:
                              _set_field(block, "input", json.loads(masked))
              for items in (_field(container, "input"), _field(container, "output")):
                  for item in items if isinstance(items, list) else []:
                      if _field(item, "type") == "function_call":
                          await _mask_arguments_of(item, "arguments", mask)


          async def _mask_tool_results(request, mask):
              # The results of earlier tool calls a request's conversation carries, in each
              # shape the gateway's routes use: a chat tool or function turn's content, a
              # tool_result block's content on the messages route, and a
              # function_call_output item's output on the responses route.
              for turn in _field(request, "messages") or []:
                  if _field(turn, "role") in ("tool", "function"):
                      await _mask_result_of(turn, "content", mask)
                      continue
                  content = _field(turn, "content")
                  for block in content if isinstance(content, list) else []:
                      if _field(block, "type") == "tool_result":
                          await _mask_result_of(block, "content", mask)
              items = _field(request, "input")
              for item in items if isinstance(items, list) else []:
                  if _field(item, "type") == "function_call_output":
                      await _mask_result_of(item, "output", mask)


          # The words that say what a part is, rather than carry what a caller wrote.
          _STRUCTURAL = frozenset(["type", "media_type", "cache_control"])

          # The types of a part that is text. A part of any other type, an image or a file,
          # is not text to mask and passes as it is; the request guard refuses it unless the
          # attachment lets such content through.
          _TEXT_PARTS = frozenset(["text", "input_text", "output_text"])


          async def _masked_strings(value, mask, parts=True):
              # Every string at any depth is masked, one by one, and no key is. Where the value
              # holds parts, the words above are not masked either, and a part that is not
              # text passes as it is; a mapping of the caller's own, such as metadata, holds
              # no parts, so every string in it is masked whatever its key.
              if isinstance(value, dict):
                  if parts and isinstance(value.get("type"), str) and value["type"] not in _TEXT_PARTS:
                      return value
                  return {
                      key: item if parts and key in _STRUCTURAL else await _masked_strings(item, mask, parts)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [await _masked_strings(item, mask, parts) for item in value]
              if isinstance(value, str) and value:
                  return await mask(value)
              return value


          async def _mask_key(holder, name, mask, parts=True):
              if isinstance(holder, dict) and holder.get(name) is not None:
                  holder[name] = await _masked_strings(holder[name], mask, parts)


          # The key under which the gateway's own guardrails record what they found, in the
          # request's metadata; it is the gateway's, not the caller's.
          _GATEWAY_RECORD = "standard_logging_guardrail_information"


          async def _mask_caller_metadata(request, mask):
              # Where the gateway keeps its own bookkeeping under litellm_metadata, as it does
              # on the messages and responses routes, a request's metadata is the caller's, and
              # every key of it is masked. Elsewhere, the cursor path among them, the gateway
              # merges the caller's metadata into a metadata of its own, which some paths
              # forward, so the keys the caller sent, read from the request as it arrived, are
              # masked there and the gateway's own are left as they are. It is masked in place,
              # key by key, because the gateway's own guardrails record what they find in the
              # same mapping while it is masked.
              metadata = request.get("metadata") if isinstance(request, dict) else None
              if metadata is None:
                  return
              if not isinstance(metadata, dict):
                  request["metadata"] = await _masked_strings(metadata, mask, parts=False)
                  return
              if "litellm_metadata" in request:
                  keys = [key for key in metadata if key != _GATEWAY_RECORD]
              else:
                  arrived = request.get("proxy_server_request")
                  body = arrived.get("body") if isinstance(arrived, dict) else None
                  sent = body.get("metadata") if isinstance(body, dict) else None
