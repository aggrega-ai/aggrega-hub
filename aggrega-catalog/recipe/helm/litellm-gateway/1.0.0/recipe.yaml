              # with, which can quote text the masking never saw: the gateway's own error for a
              # provider's answer, or, on the messages route, the provider's error as it came. The
              # message is replaced on the exception itself, which every route the gateway serves
              # reads when it answers with the error, and the error keeps its status code, type and
              # code. The message says what the entry does with replies: it refuses the replies that
              # carry sensitive text where refuses is true, and masks that text otherwise.
              # An error the gateway raises itself, such as a refusal of the request guard's or a
              # recognizer that cannot be reached, is not one of these and keeps its message.
