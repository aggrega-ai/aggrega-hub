                  # message's refusal and the annotations of its text, and every item other than a
                  # message, a function call and reasoning, a web search call among them.
                  declared = frozenset(getattr(type(reply), "model_fields", None) or ["id", "object", "created_at", "status", "model", "output", "usage"])
                  await _mask_fields(reply, declared, mask)
