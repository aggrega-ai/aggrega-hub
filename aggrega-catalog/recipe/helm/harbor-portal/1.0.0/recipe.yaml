apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: harbor-portal
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor portal on Kubernetes via the helm provider's Workload synthesis
    (a stateless Deployment plus a ClusterIP Service on the web port). The portal
    is a pure static-asset server: nginx serving the single-page application
    bundled into the image, with unmatched routes rewritten to the SPA entry
    point. Its nginx configuration is delivered as a file: the recipe emits
    nginx.conf as a ConfigMap via artifacts: and mounts it whole-directory at
    /etc/nginx. Because the image already populates /etc/nginx, the mounted
    configuration is fully self-contained — it inlines the MIME type map it needs
    rather than including any file from the image — so the whole-directory mount
    does not depend on image-provided includes. It holds no state, so it renders
    stateless. provides.host is the bare, self-contained in-cluster service name
    of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/devtool/harbor-portal:1.0.0
  # This Recipe reads no infra.overrides keys.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # The portal nginx configuration is delivered as a ConfigMap and mounted
  # whole-directory at /etc/nginx. The image populates /etc/nginx, so the config
  # is self-contained: it inlines the MIME type map (rather than including
  # /etc/nginx/mime.types) and references no other include, keeping the
  # whole-directory mount safe. It listens on the web port, serves the bundled
  # SPA from /usr/share/nginx/html, and rewrites unmatched routes to index.html.
  artifacts:
    harbor-portal-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-portal-config
      data:
        nginx.conf: |
          worker_processes auto;

          events {
            worker_connections 1024;
          }

          http {
            types {
              text/html html;
              application/javascript js;
              text/css css;
              image/svg+xml svg;
              application/json json;
            }
            default_type application/octet-stream;
            sendfile on;
            keepalive_timeout 65;

            server {
              listen {{ .infra.port }};
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;

              location / {
                try_files $uri $uri/ /index.html;
              }
            }
          }
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The portal holds no state — it serves the static bundle from its image —
    # so the default stateless form (a Deployment on the helm provider) is correct.
    replicas: 1
    containers:
      main:
        image: "goharbor/harbor-portal:{{ .infra.engine_version }}"
        # The image default entrypoint runs nginx against /etc/nginx/nginx.conf,
        # which the mounted ConfigMap supplies.
        ports:
          http: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: config
            path: /etc/nginx
    volumes:
      config:
        configmap:
          source: "{{ .context.instance_id }}-portal-config"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
