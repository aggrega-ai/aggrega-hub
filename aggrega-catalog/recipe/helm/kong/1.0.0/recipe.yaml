apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: kong
  version: 1.0.0
  license: Apache-2.0
  description: >
    Kong, a database-backed API gateway, on Kubernetes via the helm provider's
    Workload synthesis (a stateless Deployment plus a ClusterIP Service on the
    proxy port). Kong holds no local state — the PostgreSQL backend is the
    system of record — so it renders stateless. The backend identity resolved
    from the `backend` uses-edge (host, port, user, database) arrives on
    .context.inject.env and composes Kong's KONG_PG_* connection. A migrations
    step runs to completion before the gateway serves, provisioning the database
    schema against the same backend and credentials. The connection is rendered
    password-free where possible: with no credential attached the Recipe uses an
    inline development default, and with one attached the password is supplied on
    KONG_PG_PASSWORD via the credential subsystem. provides.host is the bare,
    self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed. A
    consumer in another namespace qualifies the host with the target namespace on
    its own side (caller-side routing). Reach for this realization where the
    build must complete with nothing fetched, or where no chart repository is
    reachable from it; reach for `kong-chart`, which renders the official Kong
    chart, where the gateway will be upgraded in place — that realization
    sequences an up-migration before an upgrade and a finishing migration after
    it, neither of which a workload with a bootstrap step ahead of it can
    express.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/kong:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.proxy_port }}"
    protocol: "http"
  workload: |
    {{- /* Kong's Status API port: the product's own default. It is the single
           authored home for the listen address below, the container port and
           the probes that read it. */ -}}
    {{- $statusPort := 8007 -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # Kong holds no durable state — the PostgreSQL backend is the system of
    # record — so the default stateless form (a Deployment on the helm provider)
    # is correct: no form: stateful, no persistentTemplate volume, no PVC.
    replicas: 1
    # The migrations step runs to completion before the gateway serves,
    # provisioning the database schema. It uses the same image, the same
    # backend connection composed from the `backend` uses-edge, and the same
    # password handling as the main container; only its entrypoint arguments
    # differ (the image default entrypoint with `migrations bootstrap`). The
    # bootstrap is idempotent, so a re-run against an already-provisioned
    # database is a no-op.
    initContainers:
      - image: "kong:{{ .infra.engine_version }}"
        args: [kong, migrations, bootstrap]
        variables:
          KONG_DATABASE: postgres
          KONG_PG_HOST: "{{ .context.inject.env.KONG_PG_HOST }}"
          KONG_PG_PORT: "{{ .context.inject.env.KONG_PG_PORT }}"
          KONG_PG_USER: "{{ .context.inject.env.KONG_PG_USER }}"
          KONG_PG_DATABASE: "{{ .context.inject.env.KONG_PG_DATABASE }}"
    {{- if not (hasKey (default dict .features) "password") }}
          KONG_PG_PASSWORD: apppass
    {{- end }}
    {{- if hasKey (default dict .features) "password" }}
        attachments:
          KONG_PG_PASSWORD:
            from: password
            as: env
    {{- end }}
    containers:
      main:
        image: "kong:{{ .infra.engine_version }}"
        # No command/args override — the image default entrypoint runs
        # `kong docker-start`. The backend identity resolved from the `backend`
        # uses-edge arrives on the inject pipe (.context.inject.env) and composes
        # the KONG_PG_* connection. KONG_PG_PASSWORD is delivered via the optional
        # `password` credential slot (env secret when attached) or an inline
        # development default when unattached. The admin API listens in-cluster
        # only — the synthesized Service is a ClusterIP. The read-only Status
        # API listens on loopback by default; it is bound on every address so
        # the kubelet can reach it, and no Service publishes it.
        variables:
          KONG_DATABASE: postgres
          KONG_PG_HOST: "{{ .context.inject.env.KONG_PG_HOST }}"
          KONG_PG_PORT: "{{ .context.inject.env.KONG_PG_PORT }}"
          KONG_PG_USER: "{{ .context.inject.env.KONG_PG_USER }}"
          KONG_PG_DATABASE: "{{ .context.inject.env.KONG_PG_DATABASE }}"
          KONG_PROXY_LISTEN: "0.0.0.0:{{ .infra.proxy_port }}, 0.0.0.0:8443 ssl"
          KONG_ADMIN_LISTEN: "0.0.0.0:{{ .infra.admin_port }}"
          KONG_STATUS_LISTEN: "0.0.0.0:{{ $statusPort }}"
    {{- if not (hasKey (default dict .features) "password") }}
          KONG_PG_PASSWORD: apppass
    {{- end }}
    {{- if hasKey (default dict .features) "password" }}
        attachments:
          KONG_PG_PASSWORD:
            from: password
            as: env
    {{- end }}
        # `status` sorts before `tcp`, so an http probe is sent to the Status
        # API rather than the proxy; the proxy port keeps its name, which the
        # Service reads.
        ports:
          status: {{ $statusPort }}
          tcp: {{ .infra.proxy_port }}
        # Kong reports readiness at /status/ready, which answers once the
        # database connects and the router is built, and liveness at /status.
        # The timings are the ones the product's own chart gives these probes.
        health:
          ready:
            http: /status/ready
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          live:
            http: /status
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.proxy_port }}
