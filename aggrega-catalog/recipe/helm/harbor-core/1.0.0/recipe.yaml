apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: harbor-core
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor core service on Kubernetes via the helm provider's Workload
    synthesis (a stateless Deployment plus a ClusterIP Service on the API port).
    The core holds no local state — the PostgreSQL backend and the registry blob
    store are the systems of record — so it renders stateless. The backend
    identity resolved from the `backend` uses-edge (host, port, user, database)
    and the cache, registry, job-service, and portal identities resolved from
    their edges arrive on .context.inject.env and compose the core's connection
    settings and the in-cluster URLs of its siblings. The core's file
    configuration — the beego config, the token-service RSA signing key, and the
    16-byte attribute encryption key — is delivered as a ConfigMap emitted via
    artifacts: and mounted whole-directory at /etc/core. The PostgreSQL password
    is rendered password-free where possible: with no credential attached the
    Recipe uses an inline development default, and with one attached the password
    is supplied on POSTGRESQL_PASSWORD via the credential subsystem. The internal
    service secrets that authenticate the core, the job service, and the registry
    to each other are pinned shared development literals, so the stack runs
    self-contained. provides.host is the bare, self-contained in-cluster service
    name of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/devtool/harbor-core:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-default"
  # with no namespace segment. A same-namespace consumer reaches it under this
  # name directly; a cross-namespace consumer qualifies it caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # The core's file configuration is delivered as a ConfigMap and mounted
  # whole-directory at /etc/core. The core image does not populate /etc/core, so
  # a whole-directory mount is safe. The RSA signing key is the token service's
  # private key (the core is the sole token issuer and validator; the v2.x
  # distribution registry does no token auth and holds no key). The encryption
  # key is exactly 16 bytes with no trailing newline, so it is a plain quoted
  # scalar rather than a block scalar.
  artifacts:
    harbor-core-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-core-config
      data:
        app.conf: |
          appname = Harbor
          runmode = prod
          enablegzip = true

          [prod]
          httpport = 8080
        key: "harborcorekey123"
        private_key.pem: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAyfasYqTaZRA5Ee+8/rwqnrYWpXlKPsUt8gN3UVywwebOTQr0
          hxttcioK8eANxCPf1y/76RO4mbpAVvOVKtno5fggSOo37fP2s2YdwMx0fNR6G1yV
          OOVoPSXldZywL2M9sDxY7qF1D5kvTLdZtYl2J5SDogocGNp2INTSJgS2g+44NZI/
          U0IGcel67JF8ucCET1wvLXxXlLdD3QxpmIce75ouTMcboQC/D1A8/PKyw1uOfR9+
          L1bnC4DhRjqyJ7kkoFTEqWzNLNCJb3wufcfnmrvZ1WzWm8crjX86ke9udk91Ytyu
          O8rXm3BM75f/PsWZk+Aqyu5s7cZYLVSAJQm7LwIDAQABAoIBAAX7AfvMeehy5Iho
          Gvvywn2p/V2vtnJ0EE+RqV+FaSPfcSMi5z7Locq2/VVQQdgZtS/VbJY9o+0ZcNJN
          ADvL8XOYjLbcCK/z1iMAgR0LxjSew3GP+kiRsoEtCsXC0AzMhC/LJFmx+kTDT9KW
          aKz8LGgw+PzmuRJGAH1/D9dZsws7sydsNucqo6EeOsTnQtqDOgj3S+cVEfUV3k+9
          Jwms0dfckQasXyH5Jd9rNpJ5lw8cHMmc0RM/P0qKbtT4HAGvX9aozs5GWF/c5pnL
          T7DxtRoWBXvDZfhQDoJGYCIDFYT5MK0Yxg9nGHB2hhWekohoMXf15uDzE6GwiUAy
          A8SDWHECgYEA8XDBnahdZn8jNI5JdLc1Y3J87fEeGyECepO2OphpmDDme/oe1Les
          tMH0PZPzKK61hZXX9yShMNywRtTadGvwrk5LrolT+cEQdmfsmaKSu868OMWgLV0C
          JgEaFPdA1kyW2pNUrwfTqVpK8magEa5RkWlkVFt1ZoCanUDxRhUGyrsCgYEA1iR9
