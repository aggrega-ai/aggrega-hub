          5o7v64mYxik69NJms3r1jf8ZF5/hM/ZvBYWy41Cs/abwYRnSih0jIdcKlXmF64a6
          Mzxn2hDNJC1KitRoOez3x9WYuG1KuxN2IAbs17nONwVMRk0O5bdjeA==
          -----END RSA PRIVATE KEY-----
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The core holds no durable state — the database and the registry blob store
    # are the systems of record — so the default stateless form (a Deployment on
    # the helm engine) is correct: no form: stateful, no persistentTemplate
    # volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "goharbor/harbor-core:{{ .infra.engine_version }}"
        # The backend, cache, registry, job-service, and portal identities
        # arrive on the inject pipe (.context.inject.env). The raw host and port
        # values are emitted as env for transparency, and the composed
        # connection URLs the core reads are built from them. The internal
        # service secrets are pinned shared development literals.
        variables:
          POSTGRESQL_HOST: "{{ .context.inject.env.POSTGRESQL_HOST }}"
          POSTGRESQL_PORT: "{{ .context.inject.env.POSTGRESQL_PORT }}"
          POSTGRESQL_USERNAME: "{{ .context.inject.env.POSTGRESQL_USERNAME }}"
          POSTGRESQL_DATABASE: "{{ .context.inject.env.POSTGRESQL_DATABASE }}"
          POSTGRESQL_SSLMODE: disable
          HARBOR_REDIS_HOST: "{{ .context.inject.env.HARBOR_REDIS_HOST }}"
          HARBOR_REDIS_PORT: "{{ .context.inject.env.HARBOR_REDIS_PORT }}"
          HARBOR_REGISTRY_HOST: "{{ .context.inject.env.HARBOR_REGISTRY_HOST }}"
          HARBOR_REGISTRY_PORT: "{{ .context.inject.env.HARBOR_REGISTRY_PORT }}"
          HARBOR_JOBSERVICE_HOST: "{{ .context.inject.env.HARBOR_JOBSERVICE_HOST }}"
          HARBOR_JOBSERVICE_PORT: "{{ .context.inject.env.HARBOR_JOBSERVICE_PORT }}"
          HARBOR_PORTAL_HOST: "{{ .context.inject.env.HARBOR_PORTAL_HOST }}"
          HARBOR_PORTAL_PORT: "{{ .context.inject.env.HARBOR_PORTAL_PORT }}"
          _REDIS_URL_CORE: "redis://{{ .context.inject.env.HARBOR_REDIS_HOST }}:{{ .context.inject.env.HARBOR_REDIS_PORT }}/0"
          _REDIS_URL_REG: "redis://{{ .context.inject.env.HARBOR_REDIS_HOST }}:{{ .context.inject.env.HARBOR_REDIS_PORT }}/1"
          REGISTRY_URL: "http://{{ .context.inject.env.HARBOR_REGISTRY_HOST }}:{{ .context.inject.env.HARBOR_REGISTRY_PORT }}"
          REGISTRY_CONTROLLER_URL: "http://{{ .context.inject.env.HARBOR_REGISTRY_HOST }}:{{ .context.inject.env.HARBOR_REGISTRY_PORT }}"
          JOBSERVICE_URL: "http://{{ .context.inject.env.HARBOR_JOBSERVICE_HOST }}:{{ .context.inject.env.HARBOR_JOBSERVICE_PORT }}"
          PORTAL_URL: "http://{{ .context.inject.env.HARBOR_PORTAL_HOST }}:{{ .context.inject.env.HARBOR_PORTAL_PORT }}"
          CORE_URL: "http://{{ .context.instance_id }}-default:{{ .infra.port }}"
          CORE_LOCAL_URL: "http://127.0.0.1:{{ .infra.port }}"
          TOKEN_SERVICE_URL: "http://{{ .context.instance_id }}-default:{{ .infra.port }}/service/token"
          EXT_ENDPOINT: "http://{{ .context.instance_id }}-default:{{ .infra.port }}"
          CONFIG_PATH: /etc/core/app.conf
          KEY_PATH: /etc/core/key
          LOG_LEVEL: info
          INTERNAL_TLS_ENABLED: "false"
          CORE_SECRET: harborcoresecret0
          JOBSERVICE_SECRET: harborjobsvcsecr0
          CSRF_KEY: harborcsrfkey0123456789abcdef012
          HARBOR_ADMIN_PASSWORD: Harbor12345
          REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
          REGISTRY_CREDENTIAL_PASSWORD: harbor_registry_password
    {{- if not (hasKey (default dict .secrets) "password") }}
          POSTGRESQL_PASSWORD: apppass
    {{- end }}
    {{- if hasKey (default dict .secrets) "password" }}
        secrets:
          POSTGRESQL_PASSWORD:
            from: password
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
        volumeMounts:
          - name: config
            path: /etc/core
    volumes:
      config:
        configmap:
          source: "{{ .context.instance_id }}-core-config"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
