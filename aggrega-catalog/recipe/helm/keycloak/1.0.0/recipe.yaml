apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: keycloak
  version: 1.0.0
  license: Apache-2.0
  description: >
    Keycloak, a database-backed identity and access-management server, on
    Kubernetes via the helm provider's Workload synthesis (a stateless
    Deployment plus a ClusterIP Service on the HTTP port). Keycloak holds no
    local state — the PostgreSQL backend is the system of record — so it renders
    stateless. The backend identity resolved from the `backend` uses-edge (host,
    port, user, database) arrives on .context.inject.env and composes Keycloak's
    database connection. Keycloak provisions and migrates its own schema on
    startup, so no separate migration step is needed. The connection is rendered
    password-free where possible: with no credential attached the Recipe uses an
    inline development default, and with one attached the password is supplied
    via the credential subsystem. The bootstrap admin account is seeded on first
    startup from a username value and a separate optional admin credential slot,
    with an inline development default when unattached. provides.host is the
    bare, self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed.
    A consumer in another namespace qualifies the host with the target namespace
    on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/keycloak:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.http_port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # Keycloak holds no durable state — the PostgreSQL backend is the system of
    # record — so the default stateless form (a Deployment on the helm engine)
    # is correct: no form: stateful, no persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "quay.io/keycloak/keycloak:{{ .infra.engine_version }}"
        # `start` runs the production-shaped server; Keycloak provisions and
        # migrates its own schema on startup, so no separate migration step is
        # needed. The backend identity resolved from the `backend` uses-edge
        # arrives on the inject pipe (.context.inject.env) and composes the KC_DB*
        # connection. KC_DB_PASSWORD is delivered via the optional `password`
        # credential slot (env secret when attached) or an inline development
        # default when unattached. KC_HTTP_ENABLED and KC_HOSTNAME_STRICT=false
        # make the server self-contained with no real hostname. The bootstrap
        # admin account is seeded on first startup from the admin_user value and
        # the optional `admin_password` credential slot (env secret when attached,
        # inline development default when unattached).
        args: [start]
        variables:
          KC_DB: postgres
          KC_DB_URL_HOST: "{{ .context.inject.env.KC_DB_URL_HOST }}"
          KC_DB_URL_PORT: "{{ .context.inject.env.KC_DB_URL_PORT }}"
          KC_DB_URL_DATABASE: "{{ .context.inject.env.KC_DB_URL_DATABASE }}"
          KC_DB_USERNAME: "{{ .context.inject.env.KC_DB_USERNAME }}"
          KC_HTTP_ENABLED: "true"
          KC_HOSTNAME_STRICT: "false"
          KC_BOOTSTRAP_ADMIN_USERNAME: "{{ .values.admin_user }}"
    {{- if not (hasKey (default dict .features) "password") }}
          KC_DB_PASSWORD: apppass
    {{- end }}
    {{- if not (hasKey (default dict .features) "admin_password") }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    {{- end }}
    {{- if or (hasKey (default dict .features) "password") (hasKey (default dict .features) "admin_password") }}
        attachments:
    {{- end }}
    {{- if hasKey (default dict .features) "password" }}
          KC_DB_PASSWORD:
            from: password
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "admin_password" }}
          KC_BOOTSTRAP_ADMIN_PASSWORD:
            from: admin_password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.http_port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.http_port }}
