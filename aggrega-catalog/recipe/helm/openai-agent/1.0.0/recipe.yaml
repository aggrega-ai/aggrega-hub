apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai-agent
  version: 1.0.0
  description: >
    An OpenAI Assistants API assistant as a reference realization, so no compute
    runs in-cluster. The helm engine emits an ExternalName Service that maps an
    in-cluster DNS name onto the managed endpoint, and the api_key credential is
    carried to consumers as an environment variable. provides.endpoint is the
    managed API host and provides.assistant_id is the developer-selected
    assistant the application addresses.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/openai:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    assistant_id: "{{ .values.assistant_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
    credential:
      from: api_key
      env: OPENAI_API_KEY
