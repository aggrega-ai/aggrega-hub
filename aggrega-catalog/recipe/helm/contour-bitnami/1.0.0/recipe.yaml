apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: contour-bitnami
  version: 1.0.0
  description: >
    Contour ingress gateway via the Bitnami Contour Helm chart
    (bitnami/contour). The chart deploys the Contour control plane, which
    reconciles the cluster's Ingress and HTTPProxy resources, alongside an Envoy
    data plane that serves client traffic. The chart manages the Contour CRDs
    and creates the IngressClass named from the Component's ingress_class_name
    value, so applications routing to that class are programmed into Envoy. The
    Envoy service is exposed as a LoadBalancer by default; set
    infra.overrides.service_type to change it. The chart pins its container
    images to resolvable release tags, which this Recipe re-pins explicitly for
    reproducible renders. Default chart version in source.version; override via
    infra.source_version. This chart-wrap depends on upstream
    Bitnami-distributed images whose free public distribution is being
    discontinued; it is retained meanwhile and a replacement is planned.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/gateway/contour:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/contour
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"21.1.4\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   contour_image - map[string]string (contour.image.* fields; overrides the tag pin)
  #   envoy_image   - map[string]string (envoy.image.* fields; overrides the tag pin)
  #   service_type  - string (envoy.service.type; default LoadBalancer)
  #   requests      - { cpu: string, memory: string } (Envoy resource requests)
  #   manage_crds   - bool (contour.manageCRDs; disable when CRDs are pre-installed)
  #   ingress_class_default - bool (contour.ingressClass.default)
  #   nodeSelector  - map[string]string
  #   tolerations   - []object
  valuesMapping: |
    ## ── Contour control-plane image pin ────────────────────────
    ## The chart ships resolvable release tags; pin explicitly for a
    ## reproducible render. Override the whole block via infra.overrides.contour_image.
    contour:
      {{- if and .infra.overrides .infra.overrides.contour_image }}
      image:
        {{- range $k, $v := .infra.overrides.contour_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/contour
        tag: "1.32.1-debian-12-r0"
      {{- end }}

      ## ── CRD management ───────────────────────────────────────
      ## Contour installs and manages its own CRDs by default. Set
      ## infra.overrides.manage_crds to false when the CRDs are pre-installed.
      {{- if and .infra.overrides (hasKey .infra.overrides "manage_crds") }}
      manageCRDs: {{ .infra.overrides.manage_crds }}
      {{- else }}
      manageCRDs: true
      {{- end }}

      ## ── IngressClass ─────────────────────────────────────────
      ingressClass:
        name: "{{ .values.ingress_class_name }}"
        create: true
        {{- if and .infra.overrides (hasKey .infra.overrides "ingress_class_default") }}
        default: {{ .infra.overrides.ingress_class_default }}
        {{- else }}
        default: true
        {{- end }}

      ## ── Control-plane resources ──────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

    ## ── Envoy data-plane image pin ─────────────────────────────
    envoy:
      {{- if and .infra.overrides .infra.overrides.envoy_image }}
      image:
        {{- range $k, $v := .infra.overrides.envoy_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/envoy
        tag: "1.34.5-debian-12-r0"
      {{- end }}

      ## ── Data-plane service (client entry point) ──────────────
      ## The Envoy service is the gateway's data-plane entry. infra.port sets the
      ## HTTP service port; default service type is LoadBalancer.
      service:
        {{- if and .infra.overrides .infra.overrides.service_type }}
        type: "{{ .infra.overrides.service_type }}"
        {{- else }}
        type: LoadBalancer
        {{- end }}
        ports:
          http: {{ .infra.port }}

      ## ── Data-plane resources ─────────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      ## ── Scheduling overrides ─────────────────────────────────
      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/contour
      version: 21.1.4
      digest: sha256:dbb32d59417cb5800a337509521cce5ab2d37dac6e72e451190ced31b27986f8
      manifestDigest: sha256:ff853d2dcce7978030e3db0c1a814c8239a689ded507e2aebeb64b8355ba32d9
