apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: azure-managed
  version: 1.0.0
  description: >
    An Azure managed online endpoint as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the operator-supplied endpoint. No credential is delivered by this recipe: a consumer that needs one declares it as `credential` on the socket that reaches this endpoint and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/azure-managed:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  assertions:
    # A managed online endpoint's scoring host belongs to the endpoint an
    # organisation created, so no address exists for the catalog to hold as a
    # default: the Release names the endpoint this model is served from.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches an Azure managed online endpoint, and its scoring host belongs to the endpoint an organisation created, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the scoring URL of that endpoint" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
