apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: azure-managed
  version: 1.0.0
  description: >
    An Azure managed online endpoint as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the operator-supplied endpoint. No credential is delivered by this recipe: a consumer that needs one declares it on its own Component's featuresSchema and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/azure-managed:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
