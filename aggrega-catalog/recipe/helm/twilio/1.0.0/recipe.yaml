apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: twilio
  version: 1.0.0
  description: >
    The Twilio messaging and voice carrier as a reference realization on
    Kubernetes: no compute runs in-cluster and nothing is provisioned. The helm
    provider emits an ExternalName Service mapping an in-cluster name onto the
    carrier's API base address, so a consumer may reach it under a stable
    in-cluster name whichever address the operator pointed it at.

    This recipe pins no artifact. It names no image, no chart and no module — the
    deployment calls a service its own operator contracts for directly, and the
    wiring is the whole of what is emitted.

    No credential is delivered here. A credential attached to one of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name the
    deployment gave it, because the environment-variable name a credential
    arrives under belongs to the consumer rather than to the carrier.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/twilio:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    account_sid: "{{ .infra.account_sid }}"
    modality: "{{ .values.modality }}"
    direction: "{{ .values.direction }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
