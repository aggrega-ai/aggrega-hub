apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: twilio
  version: 1.0.0
  description: >
    The Twilio messaging and voice carrier as a reference realization on
    Kubernetes: no compute runs in-cluster and nothing is provisioned. The helm
    provider emits an ExternalName Service mapping an in-cluster name onto the
    carrier's API base address, so a consumer may reach it under a stable
    in-cluster name whichever address the operator pointed it at.

    This recipe pins no artifact. It names no image, no chart and no module — the
    Release calls a service its own operator contracts for directly, and the
    wiring is the whole of what is emitted.

    No credential is delivered here. A credential attached to one of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name it was
    given, because the environment-variable name a credential arrives under
    belongs to the consumer rather than to the carrier.

    Both credential slots are required here: a build leaving either empty halts
    naming it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/twilio:1.0.0
  # The Component declares its credential slots optional, because its compose
  # realization defines no service to carry one. Here the credential is
  # materialized by its own realization for the consumer to reference, and the
  # carrier authenticates every request with it, so an empty slot halts the
  # build, naming the first empty one in the order the Component declares them.
  #
  # DELIBERATE NEAR-DUPLICATE: each helm reference realization whose Component
  # leaves a carrier-issued credential slot optional for compose carries this
  # assertion, naming its own slots, because an assertion sits inside the Recipe
  # that evaluates it and no catalog kind holds one for several Recipes to share.
  assertions:
    credential_slots_filled: >-
      {{- range $slot := list "api_key_sid" "api_key_secret" -}}
      {{- if not (hasKey (default dict $.features) $slot) -}}
      {{- fail (printf "the %s slot of %q is empty, and the helm realization of core/messaging/twilio requires it: the carrier issues this credential and no default stands in for it, so attach a credential to the %s slot" $slot $.metadata.instance_id $slot) -}}
      {{- end -}}
      {{- end -}}
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    account_sid: "{{ .infra.account_sid }}"
    modality: "{{ .values.modality }}"
    direction: "{{ .values.direction }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
