apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: redis-bitnami
  version: 1.0.0
  description: >
    Redis via Bitnami Helm chart (bitnami/redis), standalone architecture.
    Used as an in-memory cache with persistence disabled, so the chart renders
    a stateless Deployment rather than a StatefulSet and requests no persistent
    volume. Authentication is off by default; when a password credential is
    attached its value arrives on the env pipe and the chart's password
    authentication is enabled with that password. The chart floats its image
    tag, so the image is pinned by digest for deterministic output; override
    via infra.overrides.image. Default chart version in source.version;
    override via infra.source_version. The packaged Redis server is AGPL-3.0.
    The synthesized helm Recipe (helm/redis), which runs the official upstream
    redis image directly with no external chart, is the preferred path for this
    cache. This chart-wrap is retained for compatibility with existing
    deployments and may be retired in favor of the synthesized Recipe.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/datastore/redis:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/redis
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"27.0.15\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "redis"

  # This Recipe reads from infra.overrides:
  #   image           - map[string]string (chart image.* fields)
  valuesMapping: |
    ## ── Architecture (standalone, stateless cache) ─────────────
    ## The chart defaults to a replicated StatefulSet with persistence; the
    ## cache role pins a single standalone Deployment with persistence off.
    ## The redis chart names its single node `master` (not `primary`).
    architecture: standalone
    master:
      kind: Deployment
      persistence:
        enabled: false

      ## ── Ports ────────────────────────────────────────────────
      containerPorts:
        redis: {{ .infra.port }}
      service:
        ports:
          redis: {{ .infra.port }}

      ## ── Resources ────────────────────────────────────────────
      resources:
        requests:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"

    ## ── Image pin ──────────────────────────────────────────────
    ## The upstream chart floats image.tag: latest, which is non-deterministic.
    ## The registry publishes no resolvable semver tag for this appVersion, so
    ## the image is pinned by digest (the appVersion the default chart version
    ## ships) to keep the rendered workload immutable. When infra.overrides.image
    ## is supplied it takes over the image block entirely.
    {{- if and .infra.overrides .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      digest: "sha256:341edafd5622a1e47e4b3ab379913de84ea4a50d534f40aaa903a3825e0e1cf1"
    {{- end }}

    ## ── Authentication (optional credential slot) ──────────────
    ## Off by default. When the optional `password` slot is filled, the
    ## credential value arrives on the inject pipe and enables chart password
    ## authentication; the chart provisions its own Secret from that password.
    {{- if and .context.inject.env .context.inject.env.REDIS_PASSWORD }}
    auth:
      enabled: true
      password: "{{ .context.inject.env.REDIS_PASSWORD }}"
    {{- else }}
    auth:
      enabled: false
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/redis
      version: 27.0.15
      digest: sha256:7e841f2a321d7ab999e4253fb875f12764a2cf3152d1a0ccfef61bc0261b9a5b
      manifestDigest: sha256:968f2c0f7cc52094dfc11fcc92a4c4d356c29fc2b7185418a3ba281416fce20c
