apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: timescaledb
  version: 1.0.0
  description: >
    TimescaleDB on Kubernetes via the helm provider's Workload synthesis
    (StatefulSet + ClusterIP Service + headless Service). provides.host is the
    bare, self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed. A
    consumer in another namespace qualifies the host with the target namespace on
    its own side (caller-side routing). Reach for this realization where nothing
    is installed in the target cluster: it needs no control plane and no chart
    repository, and it builds with nothing fetched. Reach for
    timescaledb-cloudnative-pg where the CloudNativePG control plane is already
    in place and the cluster can mount an image as a volume, which is how that
    realization delivers the extension.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/timescaledb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  #
  # The metrics keys are published empty: the server runs alone in its pod,
  # with no exporter beside it, and serves no metrics of its own.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""
  # One ConfigMap carries the developer's custom server configuration. It is
  # presence-guarded: the entry renders empty — and is therefore skipped, emitting
  # no file — when custom_config is unset, so an Aggregate that leaves it unset
  # emits no ConfigMap at all and renders byte-identically to a recipe with none.
  # custom_config becomes a postgresql.conf the container's config_file argument
  # points at.
  artifacts:
    config-configmap.yaml: |
      {{- if .values.custom_config -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-config
      data:
        postgresql.conf: |
      {{ .values.custom_config | indent 4 }}
      {{- end }}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "timescale/timescaledb:{{ .infra.engine_version }}"
        # The extension's library has to be loaded before the server accepts
        # connections; without it the server stops with a fatal error naming the
        # missing preload. Passing the list as a server option rather than writing
        # it into the configuration file is what makes that survive a
        # developer-supplied custom_config: a command-line setting takes
        # precedence over the configuration file, so the block below is still
        # applied as authored and every setting in it still takes effect.
        # extra_preload_libraries is appended to the list rather than replacing
        # it, so a developer asking for further libraries gets them alongside the
        # extension's own rather than instead of it.
        #
        # The server arguments are supplied as args rather than as a command, so
        # the image's own startup script still runs: it is what creates the
        # database on an empty data directory, reads the POSTGRES_* variables
        # below, and installs the extension into the databases it creates. It
        # passes these arguments through to the server, which is where the
        # preload list takes effect.
        args:
          - postgres
          - -c
          - "shared_preload_libraries=timescaledb{{ with .values.extra_preload_libraries }},{{ . }}{{ end }}"
    {{- if .values.custom_config }}
          # custom_config renders a postgresql.conf mounted at /etc/postgresql;
          # the config_file argument makes the server read it. Settings the file
          # omits keep their built-in defaults, so a fragment is enough.
          - -c
          - config_file=/etc/postgresql/postgresql.conf
    {{- end }}
        # POSTGRES_USER / POSTGRES_DB are developer values. POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when a credential
        # is attached it renders as an env secretKeyRef; with none attached the
        # Recipe falls back to an inline development default. POSTGRES_INITDB_ARGS
        # is emitted only when encoding/locale are set.
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if not (hasKey (default dict .features) "password") }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
    {{- if or .values.encoding .values.locale }}
          POSTGRES_INITDB_ARGS: "{{ with .values.encoding }}--encoding={{ . }}{{ end }}{{ with .values.locale }} --locale={{ . }}{{ end }}"
    {{- end }}
    {{- if hasKey (default dict .features) "password" }}
        attachments:
          POSTGRES_PASSWORD:
            from: password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        # Both probes run the image's own pg_isready, which PostgreSQL documents
        # as the check of whether a server is accepting connections. Readiness
        # asks over TCP on the port the Service targets; liveness asks over the
        # server's local socket. While a new database is initialized the image
        # runs a temporary server that listens on its socket only, so the pod is
        # reported ready only once the server accepts network connections, and a
        # first start is not restarted while initialization is still running.
        # The configured user and database are named so that a probe is not
        # logged as a failed connection attempt. No start-up time is documented:
        # the liveness probe waits 30 s and allows six misses 10 s apart, to cover
        # initialization and the extension's installation.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - pg_isready
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    {{- if .values.custom_config }}
          - name: pgconf
            path: /etc/postgresql
    {{- end }}
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    {{- if .values.custom_config }}
      pgconf:
        configmap:
          source: "{{ .context.rendered_name }}-config"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
