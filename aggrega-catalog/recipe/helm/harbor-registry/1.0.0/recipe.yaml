apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: harbor-registry
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Harbor distribution registry on Kubernetes via the helm provider's
    Workload synthesis (a StatefulSet with a per-replica blob volume, plus a
    ClusterIP Service on the registry port). It holds durable blob data on the
    persistent volume at /storage, so it renders stateful. The registry is
    configured by a file: the recipe emits config.yml and the htpasswd file as a
    ConfigMap via artifacts: and mounts it whole-directory at /etc/registry, and
    the image reads config.yml from there. Authentication is HTTP basic against
    the bundled htpasswd file — the v2.x registry does no token auth; the core
    service is the token issuer and basic-auths to the registry. The blob
    descriptor cache lives in the Redis-compatible store resolved from the
    `cache` uses-edge, whose host and port arrive on .context.inject.env and
    compose the registry's redis addr. The HTTP secret is a pinned development
    literal supplied on the environment. provides.host is the bare,
    self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed.
    A consumer in another namespace qualifies the host with the target namespace
    on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/devtool/harbor-registry:1.0.0
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # The registry config and htpasswd file are delivered as a ConfigMap and
  # mounted whole-directory at /etc/registry. The htpasswd line is a bcrypt of
  # the shared development registry password; the plaintext credential the core
  # and job service present matches it. The redis addr tracks the cache
  # uses-edge; the blob store writes to the persistent volume at /storage.
  artifacts:
    harbor-registry-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-registry-config
      data:
        config.yml: |
          version: 0.1
          log:
            level: info
            fields:
              service: registry
          storage:
            filesystem:
              rootdirectory: /storage
            cache:
              blobdescriptor: redis
            maintenance:
              uploadpurging:
                enabled: false
            delete:
              enabled: true
          redis:
            addr: "{{ .context.inject.env.HARBOR_REDIS_HOST }}:{{ .context.inject.env.HARBOR_REDIS_PORT }}"
            db: 1
          http:
            addr: ":{{ .infra.port }}"
            secret: harborreghttpsec0
          auth:
            htpasswd:
              realm: harbor-registry-basic-realm
              path: /etc/registry/passwd
          health:
            storagedriver:
              enabled: true
              interval: 30s
              threshold: 3
        passwd: |-
          harbor_registry_user:$2a$10$jq51.Pshb5XW/PoSsjm85ugaf.jE5VPLPDzZVc0VzZgVtson5FtOS
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm engine; the blob store
    # persists to the per-replica persistentTemplate volume at /storage, so the
    # stateful shape (and its per-replica claim) is correct.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "goharbor/registry-photon:{{ .infra.engine_version }}"
        # The image default entrypoint serves the registry from
        # /etc/registry/config.yml, which the mounted ConfigMap supplies. The
        # HTTP secret overrides the config's http.secret with the same value.
        variables:
          REGISTRY_HTTP_SECRET: harborreghttpsec0
        ports:
          registry: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
        volumeMounts:
          - name: storage
            path: /storage
          - name: config
            path: /etc/registry
    volumes:
      storage:
        persistentTemplate:
          size: {{ .infra.storage.size }}
      config:
        configmap:
          source: "{{ .context.instance_id }}-registry-config"
    services:
      default:
        type: ClusterIP
        ports:
          registry: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          registry: {{ .infra.port }}
