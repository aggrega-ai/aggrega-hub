apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: langflow
  version: 1.0.0
  description: >
    The Langflow visual flow-builder on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment serving the Langflow editor on a ClusterIP Service, backed by a
    persistent volume holding the flow database. When a flow definition is
    supplied, a ConfigMap carries it and the platform loads it from a mounted
    directory on startup; with no definition the platform deploys empty and the
    ConfigMap is omitted byte-identically. The model endpoint wired into the
    `model` socket is injected as OPENAI_BASE_URL and an attached model API key as
    OPENAI_API_KEY; the key is delivered as an env secret and is never written into
    a flow artifact.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/langflow:1.0.0
  artifacts:
    langflow-flow.configmap.yaml: |
      {{- if .infra.flow_definition }}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-flow
      data:
        flow.json: |
      {{ .infra.flow_definition | indent 6 }}
      {{- end }}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The config directory (holding the flow database) is set explicitly so
        # the persistent volume mounts at a deterministic path. The model endpoint
        # arrives on the `model` uses-edge; the recipe ranges the outbound edges
        # and matches on the socket name to read the published endpoint and model.
        variables:
          LANGFLOW_CONFIG_DIR: /app/langflow-data
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if .infra.flow_definition }}
          # Load the seeded flow directory on startup.
          LANGFLOW_LOAD_FLOWS_PATH: /app/flows
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
        secrets:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
        ports:
          http: 7860
        volumeMounts:
          - name: data
            path: /app/langflow-data
    {{- if .infra.flow_definition }}
          - name: flow
            path: /app/flows
    {{- end }}
    volumes:
      data:
        persistent:
          size: {{ .infra.storage_size }}
    {{- if .infra.flow_definition }}
      flow:
        configmap:
          source: {{ .context.instance_id }}-flow
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 7860
