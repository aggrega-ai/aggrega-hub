apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: chroma
  version: 1.0.0
  license: Apache-2.0
  description: >
    Chroma on Kubernetes via the helm provider's Workload synthesis: a
    StatefulSet running the official chromadb/chroma image with a persistent
    volume at the server's data path, a ClusterIP Service on the HTTP port, and
    the headless Service the stateful form requires. The project's one Helm
    chart is for its distributed version, and its maintainers mark it as not
    ready for use, so the single server is synthesized rather than sourced.

    The server checks no credential, so the Recipe publishes it on a ClusterIP
    Service and nothing else: it is reachable from inside the cluster, and a
    Release that exposes it further puts something that authenticates clients in
    front of it. provides.host is the bare in-cluster service name, with no
    namespace; a consumer in another namespace qualifies it on its own side.

    Reach for this realization on Kubernetes: it needs no control plane and no
    chart repository, and it builds with nothing fetched. The Compose Recipe of
    the same name is the local-development realization.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/chroma:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. protocol is
  # "http": the port published as provides.port serves Chroma's HTTP API, and a
  # consumer composing a URL needs the scheme rather than the product name.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume and the headless Service below are companions of
    # this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "chromadb/chroma:{{ .infra.engine_version }}"
        # The image starts the server on the configuration file it ships, which
        # sets the data path to /data, and the server lays every setting named by
        # a CHROMA_-prefixed environment variable over that file. CHROMA_PORT
        # carries infra.port so the server, the container port and the Services
        # follow the one value; being set explicitly, it also takes precedence
        # over a service-link variable of the same name that Kubernetes would
        # otherwise inject for a Service named chroma in the namespace. The two
        # developer knobs are emitted only when the Aggregate set them, so an
        # Aggregate that sets neither keeps the server's own defaults.
        variables:
          CHROMA_PORT: "{{ .infra.port }}"
    {{- if .values.allow_reset }}
          CHROMA_ALLOW_RESET: "true"
    {{- end }}
    {{- with .values.max_payload_size_bytes }}
          CHROMA_MAX_PAYLOAD_SIZE_BYTES: "{{ . }}"
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The server's own health route, /api/v2/healthcheck, answers 200 once the
        # server and its query executor are ready and 503 until then, so it is the
        # readiness probe; an http probe is sent to the container port whose name
        # sorts first, which is the one port, `http`. No start-up time is
        # documented, so the probe allows six misses 5 s apart. Chroma's own
        # documentation names no liveness check, and none is declared.
        health:
          ready:
            http: /api/v2/healthcheck
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /data
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
