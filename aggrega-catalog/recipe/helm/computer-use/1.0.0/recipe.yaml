apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: computer-use
  version: 1.0.0
  license: Apache-2.0
  description: >
    The virtual-desktop tool realized on Kubernetes by the helm provider's
    Workload synthesis, rendered offline as plain manifests. The Workload
    becomes a Deployment that keeps the desktop session resident and a
    ClusterIP Service that fronts the port its control API listens on, because
    an agent screenshots and drives the same desktop across turns rather than
    starting a new one per call. It runs a single replica for that reason: two
    replicas behind one Service are two desktops, and a screenshot taken from
    the second would not show what the pointer input did to the first. The
    developer's screen geometry, declared effect and timeout reach the running
    session as environment variables. The image is the Release's, because
    this tool packages no upstream product: a build with none set halts and
    names the key. provides is the synthesized Service, so a consumer wires to
    a host, port, endpoint and protocol and never to the desktop behind them.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/computer-use:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service
  # "<instance_id>-<service-key>", and this workload's one service key is
  # "default". It carries no namespace segment, so the recipe is independent of
  # where it is deployed and a consumer in another namespace qualifies it on
  # its own side (caller-side routing). The port is the one the tool listens
  # on, because a caller reaches this Service directly rather than through a
  # routing layer.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}-default:{{ .infra.port }}"
    protocol: "http"
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the desktop session and its control API in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered Deployment would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered Deployment would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block: a synthesized Workload offers no free-form annotation surface
  # for one to land in, so a bag declared here would be read by nothing.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation
  # names a spelling for them; the recipe delivers each under a stable name for
  # the application's own code to read, and the developer's screen geometry,
  # declared effect and timeout reach the running session through exactly these
  # names. The optional description override is emitted only when the developer
  # set it, so an unset value renders no variable rather than an empty one.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The desktop session is the state, and it lives in the process serving it,
    # so the replica count is pinned here rather than exposed as an operational
    # knob: an agent that screenshots one desktop and clicks on another has not
    # been given a desktop at all.
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          COMPUTER_USE_TOOL_DISPLAY_WIDTH: "{{ .values.display_width }}"
          COMPUTER_USE_TOOL_DISPLAY_HEIGHT: "{{ .values.display_height }}"
          COMPUTER_USE_TOOL_SIDE_EFFECTS: "{{ .values.side_effects }}"
          COMPUTER_USE_TOOL_TIMEOUT_SECONDS: "{{ .values.timeout_seconds }}"
          COMPUTER_USE_TOOL_PORT: "{{ .infra.port }}"
          {{- with .values.llm_description_override }}
          COMPUTER_USE_TOOL_DESCRIPTION: "{{ . }}"
          {{- end }}
        ports:
          http: {{ .infra.port }}
        # The image is the Release's, so no product documents a health endpoint
        # here: the readiness probe opens a TCP connection to the declared port,
        # and the Service sends no traffic until the process accepts one. No
        # liveness probe is declared, because a start-up time cannot be known
        # for an image this realization does not name, and a liveness probe
        # that fires before a slow server has started restarts it for ever.
        health:
          ready:
            tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
