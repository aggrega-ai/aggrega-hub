apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openapi-knative
  version: 1.0.0
  license: Apache-2.0
  description: >
    The OpenAPI-driven tool realized as a Knative Service the Knative Serving
    control plane reconciles. The recipe emits a single Service custom
    resource; the control plane turns it into a revision, admits an inbound
    call while that revision runs no replicas, and sets the replica count from
    the concurrency it observes, so the tool occupies no compute between the
    calls that invoke it. The replica floor and ceiling carry through as the
    revision's own scaling bounds. The location of the OpenAPI document is
    delivered into the container, so the operations the tool offers are read
    from the specification the developer named rather than fixed by this
    recipe. An edge from the tool, on a socket the author names, delivers the
    names its `inject:` block dictates, as variables or as files from a
    ConfigMap emitted beside the Service. provides is the addressable name the
    control plane gives the Service, so a consumer wires to the tool's declared
    contract rather than to anything Knative-specific. The Knative Serving
    control plane is a runtime prerequisite: the build halts unless the
    operator affirms it is installed (infra.control_plane_present), so no
    custom resource is emitted into a cluster that cannot reconcile it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/openapi:1.0.0
  # A Knative Service is addressable in its own namespace under the Service's
  # own name, on port 80, and the control plane routes from there to the
  # revision's container port. provides.host is therefore that bare in-cluster
  # name with no namespace segment, so the recipe is independent of where it is
  # deployed; a consumer in another namespace qualifies it on its own side
  # (caller-side routing). provides.port is 80 rather than infra.port because
  # 80 is what a caller connects to — infra.port is where the container listens
  # behind the control plane's routing, and only the container spec below reads
  # it.
  provides:
    host: "{{ .context.instance_id }}"
    port: "80"
    endpoint: "http://{{ .context.instance_id }}"
    protocol: "http"
  assertions:
    # The Knative Serving control plane must exist in the target cluster before
    # a Serving custom resource can reconcile. The compiler cannot inspect
    # cluster state, so the prerequisite is declared: an operator affirms it in
    # the Release, and an unaffirmed build halts here rather than emitting an
    # orphan custom resource.
    knative_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Knative Serving control plane must be installed in the target cluster before this realization emits its Knative Service; once Knative Serving is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the tool in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered revision would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered revision would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads from infra.overrides:
  #   annotations - map[string]string (added to the revision template's annotations)
  #
  # The key exists because the control plane reads its per-revision switches
  # from the revision's annotations, and which switches an installation offers
  # belongs to the installed control-plane version rather than to this catalog.
  # The two scaling bounds are not among them: they come from infra.min_replicas
  # and infra.max_replicas, first-class keys on the component's own surface.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation names
  # a spelling for them; the recipe delivers each under a stable name for the
  # application's own code to read, and the developer's declared specification
  # location, effect and timeout reach the running tool through exactly these
  # names. The one optional value is emitted only when the developer set it, so
  # an unset value renders no variable rather than an empty one.
  #
  # The image is the tool's own code, and the component declares no socket, so
  # this recipe derives no variable from a connection: an edge from the tool,
  # on whatever socket the author names, delivers exactly what its inject block
  # dictates — any key the target publishes, under the names that code reads —
  # and an edge writing none delivers nothing. A dictated env entry becomes an
  # entry of the container's env under the name it gives, read off the inject
  # pipe as a map; a dictated file entry a read-only file at the absolute path
  # it names, held in one ConfigMap and mounted by subPath, so a path that is
  # not absolute, or one lying beneath another file's path, is refused. An arg
  # entry is refused, because this recipe renders no command line: Knative
  # takes a container's arguments in place of the image's default command,
  # which is the Release's. Any other mechanism is refused too. A dictated
  # variable named like one of the tool's own values this recipe delivers
  # halts the build, naming both, since the compiler cannot see the names a
  # recipe writes.
  #
  # openapi-knative-files.configmap.yaml holds the file entries the
  # connections dictate, keyed file-0, file-1 and so on in path order, the keys
  # the Service's mounts read, and is emitted only while a connection dictates a
  # file, so a build with none renders nothing there. It names no namespace, as
  # the Service names none, so the two are applied into one namespace together.
  # The block reading the connections' inject directives is the one every
  # Knative realization of a tool in this catalog declares, differing only in
  # the names each delivers itself and the refusals its own connections call
  # for; a change to it is made to all.
  artifacts:
    openapi-knative-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-files
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson (toString $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
    service.yaml: |
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      {{- $taken := dict -}}
      {{- $_ := set $taken "OPENAPI_TOOL_SPEC_URI" "the component's own value spec_uri" -}}
      {{- $_ := set $taken "OPENAPI_TOOL_SIDE_EFFECTS" "the component's own value side_effects" -}}
      {{- $_ := set $taken "OPENAPI_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" -}}
      {{- if .values.llm_description_override -}}
      {{- $_ := set $taken "OPENAPI_TOOL_DESCRIPTION" "the component's own value llm_description_override" -}}
      {{- end -}}
      {{- $files := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- range $mechanism, $entries := (default dict $edge.inject) -}}
      {{- range $name, $from := $entries -}}
      {{- if eq $mechanism "env" -}}
      {{- with optional $taken $name "" -}}
      {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) -}}
      {{- end -}}
      {{- else if eq $mechanism "file" -}}
      {{- if not (hasPrefix "/" $name) -}}
      {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) -}}
      {{- end -}}
      {{- $_ := set $files $name true -}}
      {{- else if eq $mechanism "arg" -}}
      {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Knative takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
      {{- else -}}
      {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $path, $_ := $files -}}
      {{- range $other, $_ := $files -}}
      {{- if hasPrefix (printf "%s/" $path) $other -}}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "{{ .infra.min_replicas }}"
              autoscaling.knative.dev/max-scale: "{{ .infra.max_replicas }}"
              {{- if and .infra.overrides .infra.overrides.annotations }}
              {{- range $k, $v := .infra.overrides.annotations }}
              {{ $k }}: "{{ $v }}"
              {{- end }}
              {{- end }}
          spec:
            containers:
              - image: "{{ .infra.image }}"
                ports:
                  - containerPort: {{ .infra.port }}
                env:
                  - name: OPENAPI_TOOL_SPEC_URI
                    value: "{{ .values.spec_uri }}"
                  - name: OPENAPI_TOOL_SIDE_EFFECTS
                    value: "{{ .values.side_effects }}"
                  - name: OPENAPI_TOOL_TIMEOUT_SECONDS
                    value: "{{ .values.timeout_seconds }}"
                  {{- with .values.llm_description_override }}
                  - name: OPENAPI_TOOL_DESCRIPTION
                    value: "{{ . }}"
                  {{- end }}
                  {{- range $alias, $edge := .context.uses }}
                  {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
                  - name: {{ toJson $name }}
                    value: {{ toJson (toString (optional $env $name "")) }}
                  {{- end }}
                  {{- end }}
                resources:
                  requests:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                  limits:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                {{- if $files }}
                volumeMounts:
                  {{- $i := 0 }}
                  {{- range $path, $_ := $files }}
                  - name: inject-files
                    mountPath: {{ toJson $path }}
                    subPath: "file-{{ $i }}"
                    readOnly: true
                  {{- $i = add $i 1 }}
                  {{- end }}
                {{- end }}
            {{- if $files }}
            volumes:
              - name: inject-files
                configMap:
                  name: "{{ .context.instance_id }}-files"
            {{- end }}
