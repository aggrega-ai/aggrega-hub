apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: dynamiq
  version: 1.0.0
  description: >
    A Dynamiq agent application on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment running the operator-supplied image, which carries both the
    framework and the workflow it executes. The model endpoint published by the
    component wired into the `model` socket is injected as OPENAI_URL — the
    variable Dynamiq's own OpenAI connection reads, which is not the one the
    bare client SDK would consult. The datastore wired into the `state_store`
    socket contributes its host and port. A model API key attached on the
    `model` connection is delivered as OPENAI_API_KEY via a secretKeyRef. A
    connection writing an `inject:` block receives the names it dictates
    instead of these defaults, as variables or as files mounted at the paths it
    names, while OPENAI_URL and the API key stay. A state store served over TLS
    alone or over HTTPS halts the build on a connection writing no `inject:`
    block, naming the connection, since such a connection hands the application
    only the store's host and port.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/dynamiq:1.0.0
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides, and a connection that writes one
      receives exactly what it dictates instead, read off the inject pipe as a
      map. Two deliveries stay on every connection either way: OPENAI_URL, which
      Dynamiq's own OpenAI connection reads by itself, and the API key a
      credential attached on a model connection carries. A dictated env entry
      becomes a container variable under the name it gives; a dictated file entry
      a read-only file at the absolute path it names, held in one ConfigMap and
      mounted by subPath, so a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: Kubernetes takes a container's arguments in
      place of the image's default command, which is the Release's. Any other
      mechanism is refused too. A dictated variable named like one this recipe
      delivers itself halts the build, naming both, since the compiler cannot see
      the names a recipe writes.

      A state store served over TLS alone publishes a protocol ending in -tls,
      such as valkey-tls or memcached-tls, and one served over HTTPS alone
      publishes https; neither accepts a plaintext connection. A state-store
      connection taking the defaults hands the application the store's host and
      port alone, so its code could not tell that TLS is required: such a
      connection halts the build, naming it, rather than rendering an address the
      application would reach in plaintext. A connection that dictates its
      delivery can hand the code the protocol too, and is not refused.

      The block reading the connections' inject directives is the one every helm
      Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_URL" (printf "the model connection %s, whose endpoint Dynamiq's OpenAI connection reads under that name" $alias) }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $by := printf "the %s connection %s, which writes no inject block" $edge.socket $alias }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_MODEL" $by }}
    {{- end }}
    {{- if eq $edge.socket "state_store" }}
    {{- $_ := set $taken "DYNAMIQ_STATE_STORE_HOST" $by }}
    {{- $_ := set $taken "DYNAMIQ_STATE_STORE_PORT" $by }}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- $needs := "" }}
    {{- if hasSuffix "-tls" $proto }}{{ $needs = "TLS" }}{{ else if eq $proto "https" }}{{ $needs = "HTTPS" }}{{ end }}
    {{- if $needs }}
    {{- fail (printf "the %s connection %s of %q reaches %q, which publishes protocol %s, a store served over %s alone, but a connection writing no inject block hands the application only the store's host and port, so its code could not tell that %s is required: write an inject block on that connection delivering the store's protocol with whatever else the code reads, under names it reads, or wire a store served without %s" $edge.socket $alias $.context.instance_id $edge.target $proto $needs $needs $needs) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) }}
    {{- end }}
    {{- else if eq $mechanism "file" }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) }}
    {{- end }}
    {{- $_ := set $files $name (optional $pipeFiles $name "") }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes two sockets. Each edge is addressed by the
        # developer-chosen alias, so the recipe ranges the outbound edges and
        # matches on the socket name.
        #
        # The `model` edge contributes the endpoint and the model name.
        # OPENAI_URL is deliberately the endpoint variable here, and it is the
        # one place this recipe departs from its siblings: Dynamiq's own OpenAI
        # connection resolves its endpoint from OPENAI_URL and then passes that
        # value to the client SDK explicitly on every call. Because it always
        # passes one, OPENAI_BASE_URL — which the SDK consults only when no
        # endpoint is passed — can never take effect, so delivering it would be a
        # wire that does not exist. OPENAI_API_KEY is read by the same
        # connection and needs no translation.
        #
        # Dynamiq reads no model-name variable at all: a node's model is a
        # constructor argument in the workflow's own Python. The model name is
        # therefore delivered as OPENAI_MODEL for the application's own code to
        # read — a stable name this recipe defines rather than a claim about a
        # framework read.
        #
        # The `state_store` edge contributes the datastore host and port the
        # framework's memory backend persists conversation and workflow state to.
        # Each backend the framework ships reads its own engine-specific
        # variables — a relational backend its host and port pair, a vector
        # backend a single URL — and this socket accepts any datastore, so no one
        # engine's spelling is authorable here. The coordinates are delivered
        # under a stable name this recipe defines, and the application selects
        # and constructs its backend from them.
        #
        # OPENAI_MODEL and the state-store coordinates are the defaults: a
        # connection writing an inject block receives the variables it dictates
        # in their place, on its own position among the edges, and OPENAI_URL
        # stays.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if eq $edge.socket "model" }}
          OPENAI_URL: "{{ $edge.provides.endpoint }}"
    {{- if not $dictates }}
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "state_store") (not $dictates) }}
          DYNAMIQ_STATE_STORE_HOST: "{{ $edge.provides.host }}"
          DYNAMIQ_STATE_STORE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
        # A model API key attached on the `model` connection is delivered as
        # OPENAI_API_KEY via a secretKeyRef naming that connection; the key
        # value never renders into the manifest. A connection carrying no
        # credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
        attachments:
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
  # The ConfigMap holding the file entries the connections dictate, keyed
  # file-0, file-1 and so on in path order, the keys the workload's mounts read.
  # It is emitted only while a connection dictates a file, so a build with none
  # renders nothing here. The pod mounts it by name, which resolves only in the
  # pod's own namespace, so it carries the namespace the Release, or else the Aggregate, declares for
  # the component through the aggrega.ai/namespace annotation, and none where it
  # declares none.
  artifacts:
    dynamiq-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
