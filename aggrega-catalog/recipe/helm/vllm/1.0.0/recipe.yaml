apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vllm
  version: 1.0.0
  license: Apache-2.0
  description: >
    vLLM as a self-hosted inference server on Kubernetes via the helm provider's
    Workload synthesis, running the official upstream image directly (no external
    Helm chart). Renders a StatefulSet: a weights-pull initContainer resolves the
    model pointer into a per-replica model-cache volume, and the serving
    container mounts the same volume and serves the OpenAI-compatible API behind a
    ClusterIP Service. The model value is a deterministic pointer the
    initContainer resolves at pod start; the compiler never fetches weights. When
    the optional model_pull_token credential slot is attached the token reaches
    the initContainer as an env secretKeyRef, so it never appears in the rendered
    manifest; unattached, weights are pulled anonymously, byte-identically to a
    recipe with no slot. When the optional api_key slot is attached the key
    reaches the serving container as VLLM_API_KEY the same way, and the server
    requires it of every caller under /v1; unattached, it requires none.
    provides.host is the bare, self-contained in-cluster service name; a
    consumer in another namespace qualifies it on its own side.
    provides.metrics_endpoint names the server's metrics on the same Service
    while it runs one replica; above one it is empty and metrics_service names
    that Service for a scraper to discover every replica behind it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/vllm:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # The metrics keys say where the server serves its Prometheus metrics: /metrics
  # on the serving port, outside the /v1 path the api_key slot's key guards. The
  # Service balances across replicas, so one address reaches a single replica
  # per scrape. While infra.replicas is 1, metrics_endpoint is that address on
  # the default Service, spelling the Service name out again because a provides
  # entry cannot read another provides entry; above 1 it is empty, and
  # metrics_service, metrics_service_port and metrics_path name the same
  # Service, the name of its port, and the path, for a scraper that discovers
  # each endpoint behind it. The port name is the one the services block below
  # declares, which provides cannot read, so the two are edited together. The
  # pod facts belong to the KubeAI realization and are empty here.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/v1"
    model: "{{ default .values.model .values.served_model_name }}"
    protocol: "http"
    metrics_endpoint: "{{ if le (int .infra.replicas) 1 }}http://{{ .context.rendered_name }}-default:{{ .infra.port }}/metrics{{ end }}"
    metrics_service: "{{ if gt (int .infra.replicas) 1 }}{{ .context.rendered_name }}-default{{ end }}"
    metrics_service_port: "{{ if gt (int .infra.replicas) 1 }}http{{ end }}"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: "{{ if gt (int .infra.replicas) 1 }}/metrics{{ end }}"
  # A context_window the Aggregate writes reaches the server as --max-model-len;
  # one it leaves out reaches it as nothing, and vLLM then derives the context
  # length from the model's own configuration. A context length of 0 tokens
  # leaves the model no room for a prompt, so an authored 0 halts the build
  # here, naming the value, rather than being passed on.
  assertions:
    context_window_at_least_one: >-
      {{- if hasKey .values "context_window" -}}
      {{- $window := index .values "context_window" -}}
      {{- if lt (int $window) 1 -}}
      {{- fail (printf "values.context_window is %v, a context length that leaves the model no room for a prompt: remove values.context_window to have vLLM take the context length from the model's own configuration, or set it to the number of tokens to serve the model with" $window) -}}
      {{- end -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateful
    replicas: {{ .infra.replicas }}
    {{- with (default dict .infra.gpu).runtime_class }}
    runtimeClassName: "{{ . }}"
    {{- end }}
    initContainers:
      - name: model-pull
        image: "vllm/vllm-openai:{{ .infra.engine_version }}"
        # Pre-downloads the model into the shared model-cache volume before
        # serving starts. .values.model is the deterministic pointer the runtime
        # resolves here; the compiler pipes the string unresolved (AOT).
        command: ["/bin/sh"]
        args:
          - "-c"
          - "huggingface-cli download {{ .values.model }}"
        variables:
          HF_HOME: /models
    {{- if hasKey (default dict .features) "model_pull_token" }}
        attachments:
          HF_TOKEN:
            from: model_pull_token
            as: env
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    containers:
      main:
        image: "vllm/vllm-openai:{{ .infra.engine_version }}"
        args:
          - "--model"
          - "{{ .values.model }}"
          - "--port"
          - "{{ .infra.port }}"
    {{- with .values.served_model_name }}
          - "--served-model-name"
          - "{{ . }}"
    {{- end }}
    {{- if hasKey .values "context_window" }}
          - "--max-model-len"
          - "{{ index .values "context_window" }}"
    {{- end }}
        variables:
          HF_HOME: /models
    {{- if hasKey (default dict .features) "api_key" }}
        # VLLM_API_KEY is the variable vLLM reads its key from at startup,
        # delivered as an env secretKeyRef so the key's value never lands in
        # the manifest. With it set the server answers a request under /v1 only
        # when the request carries the key as a bearer token; /health sits
        # outside /v1, so the probes below are unchanged.
        attachments:
          VLLM_API_KEY:
            from: api_key
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The server documents /health, and it starts answering on this port
        # only once the engine has loaded the model. The three probes and every
        # timing are the ones the vLLM project's own chart gives them: readiness
        # and liveness wait for a start-up probe allowed 15 s plus 60 checks
        # 10 s apart. That chart gives the budget to a server which fetches its
        # own weights at start; here the pull step above has already fetched
        # them.
        health:
          startup:
            http: /health
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          ready:
            http: /health
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          live:
            http: /health
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if (default dict .infra.gpu).count }}
            "nvidia.com/gpu": "{{ .infra.gpu.count }}"
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    volumes:
      model-cache:
        persistentTemplate:
          size: "{{ .infra.model_cache.size }}"
    {{- with .infra.model_cache.class }}
          class: "{{ . }}"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
