apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: kafka
  version: 1.0.0
  license: Apache-2.0
  description: >
    Apache Kafka single-node KRaft on Kubernetes via the helm provider's
    Workload synthesis (a StatefulSet with a per-replica data volume, a
    ClusterIP Service exposing the client bootstrap port, and a headless
    governing Service). The node runs the broker and controller roles in one
    process (no ZooKeeper) and stores its commit log on the persistent volume at
    /var/lib/kafka/data so log data survives restarts. The cluster identity is
    supplied verbatim through CLUSTER_ID from the developer value, and the image
    reads it as-is with no random generation, so the rendered manifest is
    byte-identical across builds. KAFKA_ADVERTISED_LISTENERS advertises the
    in-cluster Service name so clients reconnect through the stable address
    rather than the pod's own hostname. provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no namespace,
    so the recipe is independent of where it is deployed. A consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/kafka:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. provides.port is
  # the client bootstrap port producers and consumers connect to; protocol is
  # "kafka".
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.broker_port }}"
    protocol: "kafka"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm engine; the Kafka commit
    # log persists to the per-replica persistentTemplate volume at
    # /var/lib/kafka/data, so the stateful shape (and its per-replica claim) is
    # correct.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "apache/kafka:{{ .infra.engine_version }}"
        # Minimal single-node KRaft configuration. The node runs both the
        # broker and controller roles; CLUSTER_ID is supplied verbatim from the
        # developer value so the render is deterministic. Values carrying ':' or
        # ',' are quoted to keep the workload YAML valid. CLUSTER_ID has no
        # KAFKA_ prefix — the image reads it under that exact name.
        variables:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://{{ .context.instance_id }}-default:{{ .infra.broker_port }}"
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
          KAFKA_LOG_DIRS: /var/lib/kafka/data
          CLUSTER_ID: "{{ .values.cluster_id }}"
        ports:
          broker: {{ .infra.broker_port }}
          controller: {{ .infra.controller_port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
        volumeMounts:
          - name: data
            path: /var/lib/kafka/data
    volumes:
      data:
        persistentTemplate:
          size: {{ .infra.storage.size }}
    services:
      default:
        type: ClusterIP
        ports:
          broker: {{ .infra.broker_port }}
      headless:
        type: Headless
        ports:
          broker: {{ .infra.broker_port }}
          controller: {{ .infra.controller_port }}
