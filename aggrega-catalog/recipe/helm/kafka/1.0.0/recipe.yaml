apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: kafka
  version: 1.0.0
  license: Apache-2.0
  description: >
    Apache Kafka single-node KRaft on Kubernetes via the helm provider's
    Workload synthesis (a StatefulSet with a per-replica data volume, a
    ClusterIP Service exposing the client bootstrap port, and a headless
    governing Service). Nothing has to be installed in the cluster first and no
    chart repository has to be reachable, so this is the realization to reach for
    where no Kafka control plane runs and where the build has to complete without
    network access; reach for the controller-driven recipe where the Strimzi
    Cluster Operator is already in place. The node runs the broker and controller
    roles in one process (no ZooKeeper) and stores its commit log on the
    persistent volume at
    /var/lib/kafka/data so log data survives restarts. The cluster identity is
    supplied verbatim through CLUSTER_ID from the developer value, and the image
    reads it as-is with no random generation, so the rendered manifest is
    byte-identical across builds. KAFKA_ADVERTISED_LISTENERS advertises the
    in-cluster Service name so clients reconnect through the stable address
    rather than the pod's own hostname. provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no namespace,
    so the recipe is independent of where it is deployed. A consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing). The image serves no Prometheus metrics, so the metrics
    keys are published empty and values.metrics_enabled true halts the build.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/kafka:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. provides.port is
  # the client bootstrap port producers and consumers connect to; protocol is
  # "kafka". provides.bootstrap_servers is that one address joined "host:port",
  # the whole list for a client that takes one: a single node serves every
  # client. It spells the Service name a second time because a locals entry
  # cannot read the rendered name the two are built from.
  #
  # The metrics keys are published empty. The official image installs the Kafka
  # distribution and nothing beside it, and Kafka keeps its own metrics behind
  # JMX, so no Prometheus endpoint exists here to publish.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.broker_port }}"
    bootstrap_servers: "{{ .context.rendered_name }}-default:{{ .infra.broker_port }}"
    protocol: "kafka"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""
  # values.metrics_enabled asks for a Prometheus endpoint this realization
  # cannot serve: the image carries no exporter, and adding one would mean
  # fetching an agent the image does not ship. Accepting the value and
  # publishing nothing would let a Release believe its brokers are scraped, so
  # the build halts and names the value instead.
  assertions:
    kafka_metrics_enabled_unsupported: >-
      {{- if .values.metrics_enabled -}}
      {{- fail "values.metrics_enabled is true, but this realization runs the official Apache Kafka image, which keeps its metrics behind JMX and carries no Prometheus exporter, so there is no metrics endpoint to turn on or publish; set values.metrics_enabled to false, or select the controller-driven kafka-strimzi recipe in the Manifest, which turns the Strimzi metrics reporter on" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the Kafka commit
    # log persists to the per-replica persistentTemplate volume at
    # /var/lib/kafka/data, so the stateful shape (and its per-replica claim) is
    # correct.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "apache/kafka:{{ .infra.engine_version }}"
        # Minimal single-node KRaft configuration. The node runs both the
        # broker and controller roles; CLUSTER_ID is supplied verbatim from the
        # developer value so the render is deterministic. Every value here is
        # quoted. The Workload schema declares these values as strings because
        # an environment variable is a string — every consumer, on every provider,
        # delivers it as one — and quoting keeps values carrying ':' or ','
        # valid in the workload YAML. CLUSTER_ID has no KAFKA_ prefix — the
        # image reads it under that exact name.
        variables:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://{{ .context.rendered_name }}-default:{{ .infra.broker_port }}"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
          KAFKA_LOG_DIRS: "/var/lib/kafka/data"
          CLUSTER_ID: "{{ .values.cluster_id }}"
        ports:
          broker: {{ .infra.broker_port }}
          controller: {{ .infra.controller_port }}
        # Kafka documents no health endpoint, so both probes open a TCP
        # connection to the client port the Service targets. No start-up time is
        # documented either; both probes first check after 15 s, the delay the
        # Strimzi operator gives a Kafka node's own probes by default, and wait
        # up to 5 s for an answer.
        health:
          ready:
            tcp: {{ .infra.broker_port }}
            initialDelaySeconds: 15
            timeoutSeconds: 5
          live:
            tcp: {{ .infra.broker_port }}
            initialDelaySeconds: 15
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/lib/kafka/data
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          broker: {{ .infra.broker_port }}
      headless:
        type: Headless
        ports:
          broker: {{ .infra.broker_port }}
          controller: {{ .infra.controller_port }}
