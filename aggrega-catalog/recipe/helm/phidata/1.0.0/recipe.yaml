apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: phidata
  version: 1.0.0
  description: >
    A Phidata agent application on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment running the operator-supplied application image. The model
    endpoint published by the component wired into the `model` socket is
    injected as OPENAI_BASE_URL; the datastore wired into `storage` contributes
    the coordinates for session history and the store wired into
    `knowledge_base` those for retrieved reference material; a model API key
    attached on the `model` connection is delivered as OPENAI_API_KEY via a
    secretKeyRef. A connection writing an `inject:` block receives the names it
    dictates instead of these defaults, as variables or as files mounted at the
    paths it names, while OPENAI_BASE_URL and the API key stay. A store served
    over TLS alone or over HTTPS halts the build on a store connection writing
    no `inject:` block, naming the connection, since such a connection hands the
    application only the store's host and port.
    The agent's own values reach the container as
    PHIDATA_ADD_HISTORY_TO_MESSAGES and PHIDATA_MARKDOWN by default. The
    component's own `inject:` block delivers its entries as a connection's are,
    and one reading a value alone replaces that value's default name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/phidata:1.0.0
  workload: |
    {{- /*
      The image is the Release's own code, so the names below are defaults: a
      connection that writes no inject block receives the variables this recipe
      derives from its target's provides, and a connection that writes one
      receives exactly what it dictates instead, read off the inject pipe as a
      map. Two deliveries stay on every connection either way: OPENAI_BASE_URL,
      which the client SDK reads by itself, and the API key a credential attached
      on a model connection carries. A dictated env entry becomes a container
      variable under the name it gives; a dictated file entry a read-only file at
      the absolute path it names, held in one ConfigMap and mounted by subPath, so
      a path that is not absolute, or one lying beneath another file's path, is
      refused. An arg entry is refused, because this recipe renders no command
      line: Kubernetes takes a container's arguments in place of the image's
      default command, which is the Release's. Any other mechanism is refused too.
      A dictated variable named like one this recipe delivers itself halts the
      build, naming both, since the compiler cannot see the names a recipe writes.

      A store served over TLS alone publishes a protocol ending in -tls, such as
      valkey-tls, and one served over HTTPS alone publishes https; neither accepts
      a plaintext connection. A store connection taking the defaults hands the
      application the store's host and port alone, so its code could not tell
      that TLS is required: such a connection halts the build, naming it, rather
      than rendering an address the application would reach in plaintext. A
      connection that dictates its delivery can hand the code the protocol too,
      and is not refused.

      The component's own inject block. The developer may also write an inject
      block on the component itself, and its env and file entries reach the
      container as a connection's do: each env entry under the name it gives,
      read off the inject pipe, after the connections' variables, and each file
      at the absolute path it names, from the same ConfigMap, checked as a
      connection's file is. The agent's own values are delivered under default
      names: PHIDATA_ADD_HISTORY_TO_MESSAGES and PHIDATA_MARKDOWN. Each is
      rendered, and kept from every connection and from that block, only while
      no entry of that block, in either mechanism, delivers its value. The
      templates read that at .context.self_inject, which maps each name the
      developer wrote to values.<key> for an entry whose template reads that one
      own value. A refusal about one of that block's entries names the block
      rather than a connection.

      DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
      Recipe in this catalog that reads .context.self_inject declares: the same
      lines, save the own values each looks up and the mechanisms it reads. A
      Recipe of a tool or of an agent reads env and file entries, and reads the
      file entries a second time for the files it emits; a Recipe of
      core/compute/function, task or worker reads env entries alone; a Recipe of
      core/compute/server that refuses a variable by name reads the names of the
      env entries alone; and a realization of core/ai-tool/mcp that delivers
      none of the block reads it only to refuse each of its entries. The
      connections and that block only record who dictates each name and each
      file, and each refusal runs once over both, naming the one that dictated
      it. It is part of a workload template, and no catalog kind holds part of
      one for several Recipes to share; a change to it is made to all of them.

      The block reading the connections' inject directives is the one every helm
      Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- $ownFile := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint the client SDK reads under that name" $alias) }}
    {{- if hasKey (default dict $edge.features) "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $by := printf "the %s connection %s, which writes no inject block" $edge.socket $alias }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_MODEL" $by }}
    {{- end }}
    {{- if eq $edge.socket "storage" }}
    {{- $_ := set $taken "PHIDATA_STORAGE_HOST" $by }}
    {{- $_ := set $taken "PHIDATA_STORAGE_PORT" $by }}
    {{- end }}
    {{- if eq $edge.socket "knowledge_base" }}
    {{- $_ := set $taken "PHIDATA_KNOWLEDGE_BASE_HOST" $by }}
    {{- $_ := set $taken "PHIDATA_KNOWLEDGE_BASE_PORT" $by }}
    {{- end }}
    {{- if has $edge.socket (list "storage" "knowledge_base") }}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") }}
    {{- $needs := "" }}
    {{- if hasSuffix "-tls" $proto }}{{ $needs = "TLS" }}{{ else if eq $proto "https" }}{{ $needs = "HTTPS" }}{{ end }}
    {{- if $needs }}
    {{- fail (printf "the %s connection %s of %q reaches %q, which publishes protocol %s, a store served over %s alone, but a connection writing no inject block hands the application only the store's host and port, so its code could not tell that %s is required: write an inject block on that connection delivering the store's protocol with whatever else the code reads, under names it reads, or wire a store served without %s" $edge.socket $alias $.context.instance_id $edge.target $proto $needs $needs $needs) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $own := dict }}
    {{- if not (hasKey $named "values.add_history_to_messages") }}{{ $_ := set $own "PHIDATA_ADD_HISTORY_TO_MESSAGES" (toString .values.add_history_to_messages) }}{{ $_ := set $taken "PHIDATA_ADD_HISTORY_TO_MESSAGES" "the component's own value add_history_to_messages" }}{{ end }}
    {{- if not (hasKey $named "values.markdown") }}{{ $_ := set $own "PHIDATA_MARKDOWN" (toString .values.markdown) }}{{ $_ := set $taken "PHIDATA_MARKDOWN" "the component's own value markdown" }}{{ end }}
    {{- $files := dict }}
    {{- $dictated := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "file" }}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $by := $dictated }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) }}
    {{- end }}
    {{- end }}
    {{- range $name, $by := $files }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes three sockets. The recipe ranges its outbound edges
        # and matches on the socket name: the `model` edge contributes the endpoint
        # and the model name; `storage` contributes the host and port of the store
        # holding session history; `knowledge_base` contributes those of the store
        # holding retrieved reference material. The two stores are kept as separate
        # variable pairs because Phidata addresses them as separate subsystems —
        # collapsing them would lose the distinction the component draws.
        # OPENAI_BASE_URL and the API key are read from the environment by the
        # OpenAI-compatible client SDK; the model name and both store coordinates
        # are delivered under stable names this recipe defines, for the
        # application's own code to read, because a Phidata Agent is constructed in
        # code with its storage and knowledge arguments rather than resolving them
        # from the environment. Those stable names are the defaults: a connection
        # writing an inject block receives the variables it dictates in their
        # place, on its own position among the edges. Both store sockets are
        # optional, so wiring neither emits neither pair.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- $dictates := hasKey $dictating $alias }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- if not $dictates }}
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if not $dictates }}
    {{- if eq $edge.socket "storage" }}
          PHIDATA_STORAGE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_STORAGE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- if eq $edge.socket "knowledge_base" }}
          PHIDATA_KNOWLEDGE_BASE_HOST: "{{ $edge.provides.host }}"
          PHIDATA_KNOWLEDGE_BASE_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- end }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
    {{- range $name, $value := $own }}
          {{ $name }}: {{ toJson $value }}
    {{- end }}
    {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, is delivered as OPENAI_API_KEY via a secretKeyRef naming
        # that connection — the key value never renders into the manifest. A
        # connection carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
        attachments:
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
  # The ConfigMap holding the file entries the connections and the component's
  # own inject block dictate, keyed file-0, file-1 and so on in path order, the
  # keys the workload's mounts read. It is emitted only while either one
  # dictates a file, so a build with none renders nothing here. The pod mounts
  # it by name, which resolves only in the pod's own namespace, so it carries
  # the namespace the Release, or else the Aggregate, declares for the component
  # through the aggrega.ai/namespace annotation, and none where it declares
  # none.
  artifacts:
    phidata-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
