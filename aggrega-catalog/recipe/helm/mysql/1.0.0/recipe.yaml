apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql
  version: 1.0.0
  description: >
    MySQL on Kubernetes via the helm provider's Workload synthesis
    (StatefulSet + ClusterIP Service + Headless Service) on the official
    mysql image — no external chart. provides.host is the bare, self-contained
    in-cluster service name of the synthesized ClusterIP Service — it carries
    no namespace, so the recipe is independent of where it is deployed. A
    consumer in another namespace qualifies the host with the target namespace
    on its own side (caller-side routing).
  license: GPL-2.0-only
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/mysql:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "mysql"
  # Two ConfigMaps carry the developer's bootstrap scripts and custom server
  # configuration for the synthesized container. Each mounts whole into a
  # dedicated path and is presence-guarded independently: an entry renders empty
  # — and is therefore skipped, emitting no file — when its source value is unset.
  # A deployment that sets neither value emits no ConfigMap at all, byte-identical
  # to one with no ConfigMap. init_scripts keys become files under
  # /docker-entrypoint-initdb.d, which the official image executes on first
  # initialization in alphabetical key order. custom_config becomes a custom.cnf
  # the server reads via --defaults-extra-file; it mounts into a dedicated
  # directory the image does not populate, so it never masks the image's own
  # configuration files.
  artifacts:
    initdb-configmap.yaml: |
      {{- if .values.init_scripts -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-initdb
      data:
      {{- range $name, $content := .values.init_scripts }}
        {{ $name }}: |
      {{ $content | indent 4 }}
      {{- end }}
      {{- end }}
    config-configmap.yaml: |
      {{- if .values.custom_config -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-config
      data:
        custom.cnf: |
      {{ .values.custom_config | indent 4 }}
      {{- end }}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form, and the
    # Headless service supplies the StatefulSet's stable network identity.
    form: stateful
    replicas: 1
    containers:
      main:
        image: mysql:{{ .infra.engine_version }}
        # The official mysql image has no character-set/collation environment
        # variables; it takes them as mysqld server command-line arguments. The
        # image entrypoint execs mysqld with these args (it prepends mysqld when
        # the first argument begins with a dash), so charset and collation are
        # honored as container args while the image's own initialization runs
        # unchanged.
        args:
    {{- if .values.custom_config }}
          # --defaults-extra-file must be the server's first argument; it makes
          # mysqld read custom_config's custom.cnf in addition to the image
          # defaults. It mounts in a dedicated dir so it never masks the image's
          # own configuration files.
          - "--defaults-extra-file=/etc/aggrega/config/custom.cnf"
    {{- end }}
          - "--character-set-server={{ .values.charset }}"
          - "--collation-server={{ .values.collation }}"
        # MYSQL_DATABASE / MYSQL_USER are developer values. The two credential
        # slots are delivered differently by design: root_password is a
        # Black-Box slot (featuresSchema inject: []), so its value arrives on the
        # inject pipe from the attached credential and is read here as
        # .context.inject.env.MYSQL_ROOT_PASSWORD — never a workload secret
        # reference. user_password is transparent: when a referenceable
        # credential fills it, MYSQL_PASSWORD renders as an env secretKeyRef via
        # containers.attachments; with none attached the Recipe falls back to an
        # inline development default.
        variables:
          MYSQL_DATABASE: {{ .values.database }}
    {{- if .values.user }}
          MYSQL_USER: {{ .values.user }}
    {{- end }}
    {{- if .context.inject.env.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_PASSWORD: "{{ .context.inject.env.MYSQL_ROOT_PASSWORD }}"
    {{- end }}
    {{- if not (hasKey (default dict .features) "user_password") }}
          MYSQL_PASSWORD: apppass
    {{- end }}
    {{- if hasKey (default dict .features) "user_password" }}
        attachments:
          MYSQL_PASSWORD:
            from: user_password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
        volumeMounts:
          - name: data
            path: /var/lib/mysql
    {{- if .values.init_scripts }}
          - name: initdb
            path: /docker-entrypoint-initdb.d
    {{- end }}
    {{- if .values.custom_config }}
          - name: dbconf
            path: /etc/aggrega/config
    {{- end }}
    volumes:
      data:
        persistentTemplate:
          size: {{ .infra.storage.size }}
          class: {{ .infra.storage.type }}
    {{- if .values.init_scripts }}
      initdb:
        configmap:
          source: {{ .context.instance_id }}-initdb
    {{- end }}
    {{- if .values.custom_config }}
      dbconf:
        configmap:
          source: {{ .context.instance_id }}-config
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
