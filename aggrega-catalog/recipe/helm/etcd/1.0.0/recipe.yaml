apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: etcd
  version: 1.0.0
  license: Apache-2.0
  description: >
    Single-node etcd on Kubernetes via the helm provider's Workload synthesis
    (a StatefulSet with a persistent volume, plus a ClusterIP Service and a
    headless Service), running the official upstream image (no external Helm
    chart). etcd holds its data on the persistent volume and serves the v3
    client API over HTTP without authentication. Its own metrics, in the
    Prometheus format at /metrics on the client port, are published as
    provides.metrics_endpoint. provides.host is the bare,
    self-contained in-cluster service name of the synthesized ClusterIP Service
    — it carries no namespace, so the recipe is independent of where it is
    deployed. A consumer in another namespace qualifies the host with the target
    namespace on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/etcd:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  #
  # metrics_endpoint is the address etcd serves its own metrics at, in the
  # Prometheus format: /metrics on the client listener, always on and asking no
  # credential, since no authentication is configured. It is spelled out in
  # full on purpose: a provides entry cannot read another.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.client_port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.client_port }}/metrics"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "quay.io/coreos/etcd:{{ .infra.engine_version }}"
        # Single-node etcd. The client and peer URLs advertise the ClusterIP
        # Service name so the member reaches itself at a stable in-cluster
        # address; the initial cluster names the one member and bootstraps a new
        # cluster on first start. Data persists under /etcd-data on the volume.
        variables:
          ETCD_NAME: "{{ .values.name }}"
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:{{ .infra.client_port }}"
          ETCD_ADVERTISE_CLIENT_URLS: "http://{{ .context.rendered_name }}-default:{{ .infra.client_port }}"
          ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:{{ .infra.peer_port }}"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://{{ .context.rendered_name }}-default:{{ .infra.peer_port }}"
          ETCD_INITIAL_CLUSTER: "{{ .values.name }}=http://{{ .context.rendered_name }}-default:{{ .infra.peer_port }}"
          ETCD_INITIAL_CLUSTER_STATE: "new"
          ETCD_DATA_DIR: "/etcd-data"
          ETCD_AUTO_COMPACTION_RETENTION: "{{ .infra.auto_compaction_retention }}"
    {{- if .infra.quota_backend_bytes }}
          ETCD_QUOTA_BACKEND_BYTES: "{{ .infra.quota_backend_bytes }}"
    {{- end }}
        ports:
          client: {{ .infra.client_port }}
          peer: {{ .infra.peer_port }}
        # etcd serves /readyz — whether the member is ready to serve traffic —
        # and /livez — whether the process is alive or needs a restart — on its
        # client port, from v3.5.12 on, which the Component's default version
        # is past. An http probe is sent to the container port whose name sorts
        # first, which is `client`. No start-up time is documented; the liveness
        # probe waits 10 s before its first check.
        health:
          ready:
            http: /readyz
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /livez
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /etcd-data
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    services:
      default:
        type: ClusterIP
        ports:
          client: {{ .infra.client_port }}
          peer: {{ .infra.peer_port }}
      headless:
        type: Headless
        ports:
          client: {{ .infra.client_port }}
          peer: {{ .infra.peer_port }}
