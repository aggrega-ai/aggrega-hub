apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: promptlayer
  version: 1.0.0
  description: >
    The hosted prompt registry as a reference realization on Kubernetes: no
    compute runs in-cluster and nothing is provisioned. The helm provider emits
    an ExternalName Service mapping an in-cluster name onto the registry's base
    address, so a consumer may reach it under a stable in-cluster name whichever
    address the operator pointed it at.

    This recipe pins no artifact. It names no image, no chart and no module —
    the deployment calls a service its own operator contracts for directly, and
    the wiring is the whole of what is emitted.

    No credential is delivered here: a consumer that needs the registry's API key
    declares the `credential` slot on the socket that reaches the registry and
    delivers it from its own container, because the environment-variable name a
    credential arrives under belongs to the consumer rather than to the endpoint.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/devtool/promptlayer:1.0.0
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    prompt_label: "{{ .values.prompt_label }}"
    protocol: "https"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
