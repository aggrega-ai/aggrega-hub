apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: task
  version: 1.0.0
  description: >
    The generic ephemeral compute primitive on Kubernetes via the helm
    provider's Workload synthesis, in whichever run-to-completion shape the
    developer's own `schedule` value asks for: a single run when they author
    none, and a recurring run on that expression when they do. One recipe covers
    both shapes, so the emitted shape follows the value the Aggregate's author
    wrote and is decided by nothing else — no operator value and no Manifest
    entry reaches that choice.

    This is the only realization of the component at this target, so the Manifest
    entry mapping the component's type to it names one candidate rather than
    choosing between several. The entry is still required: recipe resolution is
    mapping-driven, and a component instance with no mapping for its type halts
    the build whatever its implementers, so mapping this component is what a
    deployment does before it can render.

    No Service and no port are emitted in either shape: nothing connects to a
    run that ends. The developer's `timeout` value is delivered to the container
    under a stable name for the application's own code to honour, because the
    workload contract this recipe authors against expresses no deadline for a
    run-to-completion form — a deployment that needs the run bounded by the
    platform sets that on the emitted resource at the target. No provides
    contract is emitted, because the component declares none.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/task:1.0.0
  # The component declares no infra.overrides block, because a synthesized
  # workload has no provider-specific knob to override: this Recipe therefore
  # reads no override keys, and none is declared for it to read.
  #
  # infra keys read here: image, compute.
  #
  # Target-expected names: the image is the deployment's, so no upstream
  # documentation names a spelling for the developer's timeout value. The recipe
  # delivers it under a stable name for the application's own code to read. The
  # `schedule` value is not delivered as a variable — it decides the emitted
  # resource's own shape instead, and the target reads it from there.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the deployment names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the deployment supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image the run executes in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, and a deployment that
    # authors the block while setting only one of them takes neither default:
    # the emitted container then carries one quantity and silently loses the
    # other. Both are required together for that reason, and each is named
    # separately so the reader is told which one is missing.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this deployment sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this deployment sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    {{- $schedule := optional .values "schedule" "" }}
    {{- if $schedule }}
    # The developer authored a schedule, so the run recurs on it.
    form: scheduled
    schedule: "{{ $schedule }}"
    {{- else }}
    # No schedule authored, so the run happens once and ends.
    form: task
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        {{- with (optional .values "timeout" "") }}
        variables:
          TASK_TIMEOUT: "{{ . }}"
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
