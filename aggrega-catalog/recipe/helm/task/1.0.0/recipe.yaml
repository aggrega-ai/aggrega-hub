apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: task
  version: 1.0.0
  description: >
    The generic ephemeral compute primitive on Kubernetes via the helm
    provider's Workload synthesis, in a run-to-completion shape decided by two
    things the Aggregate's author writes and by nothing else: the task's
    `schedule` value and a core/manual-trigger attachment on it. No operator
    value and no Manifest entry reaches that choice.

    With a schedule, the task is a CronJob running on it, attached or not.
    With none, it is a Job that runs once at deploy, unless core/manual-trigger
    is attached: then it is a suspended CronJob on the fixed schedule
    0 0 30 2 *, a date no month holds, so no run starts at deploy, nor if
    someone resumes it. Start a run of either CronJob with kubectl create job
    <run-name> --from=cronjob/<cronjob>, the CronJob named as the component is
    rendered.

    No Service and no port are emitted: nothing connects to a run that ends.
    The developer's `timeout` value reaches the container as TASK_TIMEOUT by
    default for the application's own code to honour, as no deadline is set on
    the run.

    An edge's inject block dictates what reaches the container, in every shape:
    each env entry a variable under that name, beside TASK_TIMEOUT, which no
    edge may dictate while it is the default, and each file entry a read-only
    file from a ConfigMap. The component's own inject block delivers env
    entries the same way, and one reading timeout alone replaces TASK_TIMEOUT,
    its default name. An arg entry,
    or any other mechanism, is refused by name: the recipe renders no command
    line. A credential published for the pod to reference, such as
    core/referenced-secret, halts the build by name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/task:1.0.0
  # This is the only realization of the component at this target, so the
  # Manifest entry mapping the component's type to it names one candidate rather
  # than choosing between several. The entry is still required: recipe
  # resolution is mapping-driven, and a component instance with no mapping for
  # its type halts the build whatever its implementers, so mapping this
  # component is what the Manifest must do before it can render.
  #
  # The developer's timeout value is delivered under a stable name because the
  # workload contract this recipe authors against expresses no deadline for a
  # run-to-completion form: a Release that needs the run bounded by the
  # platform sets that on the emitted resource at the target. No provides
  # contract is emitted, because the component declares none.
  #
  # The component's infra.overrides block carries the keys its Amazon ECS
  # realizations read. A synthesized workload has no provider-specific knob to
  # override, so this Recipe reads none of its keys.
  #
  # infra keys read here: image, compute.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's timeout value. The recipe
  # delivers it under a stable default name for the application's own code to
  # read, which the component's own inject block may replace, as below. The
  # `schedule` value is not delivered as a variable — it decides the emitted
  # resource's own shape instead, and the target reads it from there.
  #
  # The shape. A schedule renders form: scheduled on it, a CronJob, whatever is
  # attached: core/manual-trigger promises only that a run can also be started
  # by hand, and any CronJob can be, with kubectl create job --from=cronjob/.
  # No schedule renders form: task, a Job that runs once at deploy, unless the
  # task carries core/manual-trigger, which asks that no run start until
  # someone starts one: that renders form: scheduled with suspend: true, a
  # CronJob the controller starts no run from, in place of the Job. A CronJob
  # requires a schedule, so it carries 0 0 30 2 *, which the developer never
  # writes: the API server checks each cron field's range alone and accepts
  # it, and it names 30 February, a date that never comes, so a CronJob
  # someone resumes still has no time at which to start a run. A real date
  # would start one there after a resume. The attachment is found by its
  # Feature's type, with any version it was authored with set aside, as
  # terraform/task-ecs and cloudformation/task-ecs find it; its FeatureRecipe,
  # helm/manual-trigger, emits nothing, because a FeatureRecipe sees neither
  # the host's schedule nor can it withdraw the Job the host would emit.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image the run executes in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, and a Release that
    # authors the block while setting only one of them takes neither default:
    # the emitted container then carries one quantity and silently loses the
    # other. Both are required together for that reason, and each is named
    # separately so the reader is told which one is missing.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # A credential attached to the component reaches the container only through
  # the delivery pipe the workload below renders: a core/secret-value attachment
  # writes its value there as a variable under the key it names, so the value is
  # written into the rendered Job or CronJob, and a core/secret-provided
  # attachment under the names its own inject block dictates. Every other
  # credential Feature publishes a secret for the pod to reference, or leaves it
  # to a controller, and this realization renders no reference: a Workload
  # reference names a credential slot, and the component declares none. Such an
  # attachment would build and reach no container, so the workload halts on it
  # first, naming it. A credential is recognised by the label its Feature
  # declares, feature.aggrega.ai/kind: secret, and its Feature by its type with
  # any version set aside. The check sits in the workload rather than among the
  # assertions above because the attachment's labels are read here.
  #
  # DELIBERATE NEAR-DUPLICATE of the credential check helm/server, helm/worker,
  # helm/function-keda and helm/function-knative carry: the same template, save
  # the component type and the rendered resource its refusal names. It is a part
  # of a workload template, and a WorkloadLibrary entry replaces a whole
  # workload, never a part of one, so no catalog kind holds it for five Recipes
  # to share; a change to it is made to all five.
  #
  # Delivery from an edge. The image is the Release's own code, so no name this
  # Recipe could choose is one that code reads: each of the component's
  # connections dictates its own delivery in its inject block, and an edge that
  # dictates nothing delivers nothing. The pipe is read as a map. Every env
  # entry becomes a container variable under the name the edge gave it, its
  # value written whole, after the timeout; an entry under the timeout's name
  # halts, naming the connection, while the timeout is set. Every file entry
  # becomes a read-only file at the path the edge names: one ConfigMap holds the
  # entries, emitted only while there is one, and each is mounted by subPath, so
  # a path that is not absolute, or one lying beneath another entry's path, is
  # refused. An arg entry is refused, because this Recipe renders no command
  # line: Kubernetes takes a container's arguments in place of the image's
  # default command, which is the Release's. Any other mechanism is refused
  # too. A refusal names the entry, its mechanism and the connection that
  # dictated it.
  #
  # The block reading the pipe is the one helm/server, helm/worker and
  # helm/function-keda declare, word for word, and helm/function-knative adapts
  # to the Knative Service it renders; a change to it is made to all five.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the container with every other env entry. The
  # name this Recipe gives the timeout is a default: it is rendered only while
  # no entry of that block, in any mechanism, delivers the timeout. The template
  # reads that at .context.self_inject, which maps each name the developer wrote
  # to values.<key> for an entry whose template reads that one own value. A
  # refusal naming a variable that block delivers names the block, rather than
  # an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  workload: |
    {{- range $name, $attachment := (default dict .features) }}
    {{- $type := first (splitList ":" (toString (optional $attachment "type" ""))) }}
    {{- $kind := optional (default dict (optional $attachment "labels" dict)) "feature.aggrega.ai/kind" "" }}
    {{- if and (eq $kind "secret") (not (has $type (list "core/secret-value" "core/secret-provided"))) }}
    {{- fail (printf "the %s attachment %q on %q would reach no container: this realization delivers a credential only through the component's delivery pipe, which core/secret-value fills with its value under the key it names and core/secret-provided through the attachment's own inject block, and it renders no reference to a secret, since core/compute/task declares no credential slot a reference could name. Attach the credential as core/secret-value, whose value is then written into the rendered Job's or CronJob's environment, or realize the component with a Recipe that reads the secret by reference" $type $name $.context.instance_id) }}
    {{- end }}
    {{- end }}
    {{- $inject := default dict .context.inject }}
    {{- $env := optional $inject "env" dict }}
    {{- $files := optional $inject "file" dict }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $timeout := "" }}
    {{- if not (hasKey $named "values.timeout") }}{{ $timeout = optional .values "timeout" "" }}{{ end }}
    {{- if and $timeout (hasKey $env "TASK_TIMEOUT") }}
    {{- $by := "an attachment on the component" }}
    {{- if hasKey $ownEnv "TASK_TIMEOUT" }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) "TASK_TIMEOUT" }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- fail (printf "the component %q delivers its developer value timeout to the container as TASK_TIMEOUT, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" .context.instance_id $by) }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    {{- $schedule := optional .values "schedule" "" }}
    {{- $manual := false }}
    {{- range $name, $attachment := optional . "features" dict }}
    {{- if eq (first (splitList ":" (toString $attachment.type))) "core/manual-trigger" }}{{ $manual = true }}{{ end }}
    {{- end }}
    {{- if $schedule }}
    # The developer authored a schedule, so the run recurs on it.
    form: scheduled
    schedule: "{{ $schedule }}"
    {{- else if $manual }}
    # No schedule authored and core/manual-trigger attached, so no run starts
    # until someone starts one: a suspended CronJob on a date that never comes.
    form: scheduled
    schedule: "0 0 30 2 *"
    suspend: true
    {{- else }}
    # No schedule authored, so the run happens once and ends.
    form: task
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        {{- if or $timeout $env }}
        variables:
          {{- with $timeout }}
          TASK_TIMEOUT: "{{ . }}"
          {{- end }}
          {{- range $k, $v := $env }}
          {{ toJson $k }}: {{ toJson $v }}
          {{- end }}
        {{- end }}
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
  # The ConfigMap holding the file entries an edge dictates, keyed file-0,
  # file-1 and so on in path order, the keys the workload's mounts read. It is
  # emitted only while an edge dictates a file, so a build with none renders
  # nothing here. The pod mounts it by name, which resolves only in the pod's own
  # namespace, so it carries the namespace the Release, or else the Aggregate, declares for the
  # component through the aggrega.ai/namespace annotation, as the workload's own
  # resources do, and none where it declares none. The output filename carries
  # the realization's own name, because an artifact key is the output path used
  # as written.
  artifacts:
    task-files.configmap.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
