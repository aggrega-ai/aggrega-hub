apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: task
  version: 1.0.0
  description: >
    The generic ephemeral compute primitive on Kubernetes via the helm
    provider's Workload synthesis, in whichever run-to-completion shape the
    developer's own `schedule` value asks for: a single run when they author
    none, and a recurring run on that expression when they do. One recipe covers
    both shapes, so the emitted shape follows the value the Aggregate's author
    wrote and is decided by nothing else — no operator value and no Manifest
    entry reaches that choice.

    This is the only realization of the component at this target, so the Manifest
    entry mapping the component's type to it names one candidate rather than
    choosing between several. The entry is still required: recipe resolution is
    mapping-driven, and a component instance with no mapping for its type halts
    the build whatever its implementers, so mapping this component is what the
    Manifest must do before it can render.

    No Service and no port are emitted in either shape: nothing connects to a
    run that ends. The developer's `timeout` value is delivered to the container
    under a stable name for the application's own code to honour, because the
    workload contract this recipe authors against expresses no deadline for a
    run-to-completion form — a deployment that needs the run bounded by the
    platform sets that on the emitted resource at the target. No provides
    contract is emitted, because the component declares none.

    An edge's inject block dictates what reaches the container, in either shape:
    each env entry a variable under that name, beside TASK_TIMEOUT, which no
    edge may dictate, and each file entry a read-only file from a ConfigMap. An
    arg entry, or any other mechanism, is refused by name: the recipe renders no
    command line.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/task:1.0.0
  # The component declares no infra.overrides block, because a synthesized
  # workload has no provider-specific knob to override: this Recipe therefore
  # reads no override keys, and none is declared for it to read.
  #
  # infra keys read here: image, compute.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's timeout value. The recipe
  # delivers it under a stable name for the application's own code to read. The
  # `schedule` value is not delivered as a variable — it decides the emitted
  # resource's own shape instead, and the target reads it from there.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image the run executes in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, and a Release that
    # authors the block while setting only one of them takes neither default:
    # the emitted container then carries one quantity and silently loses the
    # other. Both are required together for that reason, and each is named
    # separately so the reader is told which one is missing.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # Delivery from an edge. The image is the Release's own code, so no name this
  # Recipe could choose is one that code reads: each of the component's
  # connections dictates its own delivery in its inject block, and an edge that
  # dictates nothing delivers nothing. The pipe is read as a map. Every env
  # entry becomes a container variable under the name the edge gave it, its
  # value written whole, after the timeout; an entry under the timeout's name
  # halts, naming the connection, while the timeout is set. Every file entry
  # becomes a read-only file at the path the edge names: one ConfigMap holds the
  # entries, emitted only while there is one, and each is mounted by subPath, so
  # a path that is not absolute, or one lying beneath another entry's path, is
  # refused. An arg entry is refused, because this Recipe renders no command
  # line: Kubernetes takes a container's arguments in place of the image's
  # default command, which is the Release's. Any other mechanism is refused
  # too. A refusal names the entry, its mechanism and the connection that
  # dictated it.
  #
  # The block reading the pipe is the one helm/server, helm/worker and
  # helm/function-keda declare, word for word, and helm/function-knative adapts
  # to the Knative Service it renders; a change to it is made to all five.
  workload: |
    {{- $inject := default dict .context.inject }}
    {{- $env := optional $inject "env" dict }}
    {{- $files := optional $inject "file" dict }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $timeout := optional .values "timeout" "" }}
    {{- if and $timeout (hasKey $env "TASK_TIMEOUT") }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := .context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) "TASK_TIMEOUT" }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- fail (printf "the component %q delivers its developer value timeout to the container as TASK_TIMEOUT, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" .context.instance_id $by) }}
    {{- end }}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    {{- $schedule := optional .values "schedule" "" }}
    {{- if $schedule }}
    # The developer authored a schedule, so the run recurs on it.
    form: scheduled
    schedule: "{{ $schedule }}"
    {{- else }}
    # No schedule authored, so the run happens once and ends.
    form: task
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        {{- if or $timeout $env }}
        variables:
          {{- with $timeout }}
          TASK_TIMEOUT: "{{ . }}"
          {{- end }}
          {{- range $k, $v := $env }}
          {{ toJson $k }}: {{ toJson $v }}
          {{- end }}
        {{- end }}
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
  # The ConfigMap holding the file entries an edge dictates, keyed file-0,
  # file-1 and so on in path order, the keys the workload's mounts read. It is
  # emitted only while an edge dictates a file, so a build with none renders
  # nothing here. The pod mounts it by name, which resolves only in the pod's own
  # namespace, so it carries the namespace the Release declares for the
  # component through the aggrega.ai/namespace annotation, as the workload's own
  # resources do, and none where it declares none. The output filename carries
  # the realization's own name, because an artifact key is the output path used
  # as written.
  artifacts:
    task-files.configmap.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" "" }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
