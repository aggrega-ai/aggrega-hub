apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: redis
  version: 1.0.0
  description: >
    Redis on Kubernetes via the helm provider's Workload synthesis, running the
    official upstream redis image (no external Helm chart). Used as an in-memory
    cache with no persistence, so it renders a stateless Deployment plus a
    ClusterIP Service and declares no storage. Authentication is off by default;
    when the optional password credential slot is attached the value is
    delivered as an env secretKeyRef and Redis is started with --requirepass to
    enforce it, so the plaintext password never appears in the rendered
    manifest. provides.host is the bare, self-contained in-cluster service name
    of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing). The packaged Redis server is AGPL-3.0.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/datastore/redis:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "redis" —
  # Redis speaks the Redis wire protocol; the family publishes it under the
  # engine name so all redis recipes present a single protocol value.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "redis"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A cache holds no durable state, so the default stateless form (a
    # Deployment on the helm engine) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: redis:{{ .infra.engine_version }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached, the password is delivered as an
        # env secretKeyRef (REDIS_PASSWORD) and Redis is started with
        # --requirepass referencing it through the $(VAR) form, which the
        # runtime expands from the Secret at container start — the plaintext
        # never lands in the manifest. The upstream redis image does not read a
        # password from the environment on its own, so the flag is what actually
        # enables auth. With no credential attached, no args and no secret are
        # emitted and the cache runs without authentication, byte-identically to
        # a Recipe with no slot at all.
    {{- if hasKey (default dict .secrets) "password" }}
        args:
          - "--requirepass"
          - "$(REDIS_PASSWORD)"
    {{- end }}
        ports:
          redis: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
    {{- if hasKey (default dict .secrets) "password" }}
        secrets:
          REDIS_PASSWORD:
            from: password
            as: env
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          redis: {{ .infra.port }}
