apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: rabbitmq-cluster-operator
  version: 1.0.0
  license: MPL-2.0
  description: >
    Installs the RabbitMQ Cluster Operator as an explicit component: a
    ServiceAccount, the cluster RBAC the controller needs to reconcile
    RabbitmqCluster custom resources, and the controller Deployment on the upstream
    image. Emitting the control plane as a first-class component lets a
    controller-driven RabbitMQ ship its runtime prerequisite alongside the
    RabbitmqCluster custom resource it emits (the bundled-deploy prerequisite
    mode), so the custom resource and the controller that reconciles it are
    deployed together. This is a minimal control-plane bootstrap; a production
    install typically sources the project's upstream release manifest, which also
    carries the custom-resource definition, the leader-election role and the
    admission webhooks with their serving certificates.

    The controller serves its own metrics at /metrics on port 8080, which checks
    no caller. With `values.metrics_enabled` true a ClusterIP Service,
    `<instance>-metrics` in infra.namespace, carries that port and
    provides.metrics_endpoint publishes its address with the namespace; false,
    that key is empty and no Service is rendered.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/rabbitmq-cluster-operator:1.0.0
  # metrics_endpoint is the address the controller serves its own metrics at
  # while values.metrics_enabled is true: /metrics on port 8080 of the ClusterIP
  # Service rendered after the Deployment, in the same file. Every object here
  # lives in infra.namespace rather than the Release's, so the host carries that
  # namespace and resolves from a Prometheus server in any other. It is spelled
  # out in full on purpose: a provides entry cannot read another.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}-metrics.{{ .infra.namespace }}:8080/metrics{{ end }}"
  # This Recipe reads no infra.overrides keys.
  #
  # The controller Deployment starts the control plane with its own webhook
  # switch off, because this bootstrap emits no admission webhook configuration
  # and no serving certificate for one. The defaulting webhook is what would
  # otherwise fill in an unset broker image, which is why the controller-driven
  # RabbitMQ recipe always writes the broker image explicitly.
  #
  # The cluster RBAC below is the project's own control-plane role, transcribed
  # rule for rule from its published install manifest rather than narrowed: the
  # controller reconciles a broker out of all of these, and a role guessed
  # smaller renders cleanly and then fails at the first object it cannot create.
  #
  # The controller's liveness and readiness probes are the ones the project's
  # own release manifest gives it at the version the image pins: /healthz and
  # /readyz on its probe address, which it binds on port 8081 by default, so no
  # flag is needed. With the webhook switch off, readiness does not wait on a
  # webhook server this bootstrap never starts.
  artifacts:
    serviceaccount.yaml: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
    clusterrole.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .context.instance_id }}
      rules:
        - apiGroups: [""]
          resources: ["configmaps", "persistentvolumeclaims", "secrets", "serviceaccounts", "services"]
          verbs: ["create", "get", "list", "update", "watch"]
        - apiGroups: [""]
          resources: ["endpoints"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "get", "patch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "update", "watch"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
        - apiGroups: ["apps"]
          resources: ["statefulsets"]
          verbs: ["create", "delete", "get", "list", "update", "watch"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters"]
          verbs: ["create", "get", "list", "update", "watch"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters/finalizers"]
          verbs: ["update"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters/status"]
          verbs: ["get", "patch", "update"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["rolebindings", "roles"]
          verbs: ["create", "delete", "get", "list", "update", "watch"]
    clusterrolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .context.instance_id }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    # The controller serves its metrics on port 8080, its default metrics
    # address, which the arguments below leave as it is: plain HTTP on every
    # address of the pod, with /metrics the listener's only route here. While
    # values.metrics_enabled is true a ClusterIP Service follows the Deployment
    # in this file, selecting its pod and reaching the port by number, which a
    # Service does whether or not the container declares it. Like every object
    # here it is named after the component instance, with -metrics appended.
    # While the value is false the file is the Deployment alone.
    deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: {{ .context.instance_id }}
        template:
          metadata:
            labels:
              app.kubernetes.io/name: {{ .context.instance_id }}
          spec:
            serviceAccountName: {{ .context.instance_id }}
            containers:
              - name: rabbitmq-cluster-operator
                image: {{ .infra.image }}
                command:
                  - /manager
                env:
                  - name: OPERATOR_NAMESPACE
                    value: {{ .infra.namespace }}
                  - name: ENABLE_WEBHOOKS
                    value: "false"
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
      {{- if .values.metrics_enabled }}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}-metrics
        namespace: {{ .infra.namespace }}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/name: {{ .context.instance_id }}
        ports:
          - name: metrics
            port: 8080
            targetPort: 8080
      {{- end }}
