apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: rabbitmq-cluster-operator
  version: 1.0.0
  license: MPL-2.0
  description: >
    Installs the RabbitMQ Cluster Operator as an explicit component: a
    ServiceAccount, the cluster RBAC the controller needs to reconcile
    RabbitmqCluster custom resources, and the controller Deployment on the upstream
    image. Emitting the control plane as a first-class component lets a
    controller-driven RabbitMQ ship its runtime prerequisite alongside the
    RabbitmqCluster custom resource it emits (the bundled-deploy prerequisite
    mode), so the custom resource and the controller that reconciles it are
    deployed together. This is a minimal control-plane bootstrap; a production
    install typically wraps the project's upstream release manifest, which also
    carries the custom-resource definition, the leader-election role and the
    admission webhooks with their serving certificates.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/rabbitmq-cluster-operator:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # The controller Deployment starts the control plane with its own webhook
  # switch off, because this bootstrap emits no admission webhook configuration
  # and no serving certificate for one. The defaulting webhook is what would
  # otherwise fill in an unset broker image, which is why the controller-driven
  # RabbitMQ recipe always writes the broker image explicitly.
  #
  # The cluster RBAC below is the project's own control-plane role, transcribed
  # rule for rule from its published install manifest rather than narrowed: the
  # controller reconciles a broker out of all of these, and a role guessed
  # smaller renders cleanly and then fails at the first object it cannot create.
  artifacts:
    serviceaccount.yaml: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
    clusterrole.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .context.instance_id }}
      rules:
        - apiGroups: [""]
          resources: ["configmaps", "persistentvolumeclaims", "secrets", "serviceaccounts", "services"]
          verbs: ["create", "get", "list", "update", "watch"]
        - apiGroups: [""]
          resources: ["endpoints"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "get", "patch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "update", "watch"]
        - apiGroups: [""]
          resources: ["pods/exec"]
          verbs: ["create"]
        - apiGroups: ["apps"]
          resources: ["statefulsets"]
          verbs: ["create", "delete", "get", "list", "update", "watch"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters"]
          verbs: ["create", "get", "list", "update", "watch"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters/finalizers"]
          verbs: ["update"]
        - apiGroups: ["rabbitmq.com"]
          resources: ["rabbitmqclusters/status"]
          verbs: ["get", "patch", "update"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["rolebindings", "roles"]
          verbs: ["create", "delete", "get", "list", "update", "watch"]
    clusterrolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .context.instance_id }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: {{ .context.instance_id }}
        template:
          metadata:
            labels:
              app.kubernetes.io/name: {{ .context.instance_id }}
          spec:
            serviceAccountName: {{ .context.instance_id }}
            containers:
              - name: rabbitmq-cluster-operator
                image: {{ .infra.image }}
                command:
                  - /manager
                env:
                  - name: OPERATOR_NAMESPACE
                    value: {{ .infra.namespace }}
                  - name: ENABLE_WEBHOOKS
                    value: "false"
