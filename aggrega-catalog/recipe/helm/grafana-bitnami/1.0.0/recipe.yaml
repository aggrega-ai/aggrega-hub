apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: grafana-bitnami
  version: 1.0.0
  description: >
    Grafana dashboards server via the Bitnami Grafana Helm chart
    (bitnami/grafana). Grafana keeps its own state on disk, so persistence is
    enabled and the data volume is sized from infra.storage. The admin account
    is always present: its username is a developer value and its password is
    wired through the component's optional `admin_password` slot. When a
    credential is attached its value arrives on the env pipe and is set as the
    chart's admin.password; when none is attached the Recipe supplies a
    deterministic development default, because the chart would otherwise generate
    a fresh random admin password on every render and break deterministic output.
    The chart publishes a resolvable image tag for this appVersion; the Recipe
    pins that tag explicitly for a reproducible render. Default chart version in
    source.version; override via infra.source_version. The packaged Grafana
    server is AGPL-3.0.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/observability/grafana:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/grafana
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"12.1.8\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   image         - map[string]string (chart image.* fields; overrides the tag pin)
  #   service_type  - string (chart service.type)
  #   requests      - { cpu: string, memory: string } (resource requests)
  #   storage_class - string (persistence storageClass for the data PVC)
  #   nodeSelector  - map[string]string
  #   tolerations   - []object
  valuesMapping: |
    ## ── Image pin ──────────────────────────────────────────────
    ## The chart publishes a resolvable image tag for this appVersion;
    ## pin the same tag explicitly for a reproducible render. Override
    ## the whole block via infra.overrides.image.
    {{- if and .infra.overrides .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      registry: docker.io
      repository: bitnami/grafana
      tag: "12.1.1-debian-12-r1"
    {{- end }}

    ## ── Admin credentials (optional credential slot) ───────────
    ## The Grafana admin account is always present. The username is a
    ## developer value. When the optional `admin_password` slot is filled
    ## its value arrives on the inject pipe and sets the admin password;
    ## when unset the Recipe supplies a deterministic development default
    ## (the chart would otherwise generate a fresh random password on every
    ## render, which is non-deterministic).
    admin:
      user: "{{ .values.admin_user }}"
      {{- if and .context.inject.env .context.inject.env.GRAFANA_ADMIN_PASSWORD }}
      password: "{{ .context.inject.env.GRAFANA_ADMIN_PASSWORD }}"
      {{- else }}
      password: "dev-grafana-admin-change-me"
      {{- end }}

    grafana:
      replicaCount: 1

      ## ── Ports ────────────────────────────────────────────────
      containerPorts:
        grafana: {{ .infra.port }}

      ## ── Resources ────────────────────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      ## ── Scheduling overrides ─────────────────────────────────
      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── Service ────────────────────────────────────────────────
    service:
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      ports:
        grafana: {{ .infra.port }}

    ## ── Persistence (Grafana local state) ──────────────────────
    persistence:
      enabled: true
      size: "{{ .infra.storage.size }}"
      {{- if and .infra.overrides .infra.overrides.storage_class }}
      storageClass: "{{ .infra.overrides.storage_class }}"
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/grafana
      version: 12.1.8
      digest: sha256:2203a6c7956e72a0f890cdcf1a9203a03f4a3499b25b0df1fb29f546042dafc6
      manifestDigest: sha256:97131b25ffc1ed1a0cc46fce49b58e040552d4acc1a7352fe437db49778cc72a
