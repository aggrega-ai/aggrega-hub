apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nats
  version: 1.0.0
  description: >
    NATS on Kubernetes via the helm provider's Workload synthesis, running the
    official upstream nats image (no external Helm chart). Used as an in-memory
    messaging server with JetStream file storage disabled, so it renders a
    stateless Deployment plus a ClusterIP Service and declares no storage.
    Authentication is off by default; when the optional password credential slot
    is attached the value is delivered as an env secretKeyRef and the server is
    started with user/password authentication flags referencing it, so the
    plaintext password never appears in the rendered manifest. provides.host is
    the bare, self-contained in-cluster service name of the synthesized Service —
    it carries no namespace, so the recipe is independent of where it is
    deployed. A consumer in another namespace qualifies the host with the target
    namespace on its own side (caller-side routing).
  license: Apache-2.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/messaging/nats:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "nats"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A lean messaging server routes subjects in memory with no durable state, so
    # the default stateless form (a Deployment on the helm engine) is correct —
    # no form: stateful, no persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: nats:{{ .infra.engine_version }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached, the password is delivered as an
        # env secretKeyRef (NATS_PASSWORD) and the server is started with
        # --user/--pass flags referencing it through the $(VAR) form, which the
        # runtime expands from the Secret at container start — the plaintext
        # never lands in the manifest. These flags are appended to the image
        # entrypoint, so the server still starts on its default client port with
        # authentication enforced. With no credential attached, no args and no
        # secret are emitted and the server runs without authentication,
        # byte-identically to a Recipe with no slot at all.
    {{- if hasKey (default dict .secrets) "password" }}
        args:
          - "--user"
          - "{{ .values.username }}"
          - "--pass"
          - "$(NATS_PASSWORD)"
    {{- end }}
        ports:
          client: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
    {{- if hasKey (default dict .secrets) "password" }}
        secrets:
          NATS_PASSWORD:
            from: password
            as: env
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          client: {{ .infra.port }}
