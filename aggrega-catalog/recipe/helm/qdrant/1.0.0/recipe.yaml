apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: qdrant
  version: 1.0.0
  license: Apache-2.0
  description: >
    Qdrant on Kubernetes via the helm provider's Workload synthesis, running the
    official upstream qdrant/qdrant image (no external Helm chart). Vector data
    is the point of this store rather than a cache of something else, so the
    workload renders as a StatefulSet with a persistent volume mounted at the
    server's storage path, alongside the governing headless Service the stateful
    form requires and a ClusterIP Service publishing both the HTTP and the gRPC
    port. Authentication is off by default; when the optional api_key credential
    slot is attached the value is delivered as an env secretKeyRef and the server
    reads it as its service API key, so the plaintext key never appears in the
    rendered manifest. provides.host is the bare, self-contained in-cluster
    service name of the synthesized ClusterIP Service — it carries no namespace,
    so the recipe is independent of where it is deployed. A consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/qdrant:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "http" — the
  # port published as provides.port serves Qdrant's REST API over HTTP, and a
  # consumer composing a URL needs the scheme rather than the product name.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    grpc_port: "{{ .infra.grpc_port }}"
    protocol: "http"
  # A Release may set a single key inside an infra group — `compute.cpu` alone, or
  # `storage.size` alone — and a group supplied that way carries only the keys it
  # names, so the sibling this Recipe also reads arrives empty. Rendered, that
  # would emit a workload with a CPU limit and no memory limit, or a volume with a
  # size and no storage class: a deployment materially different from the one the
  # Component's declared defaults describe, with nothing in the output saying so.
  # The build halts here instead, naming the key that is missing and the group it
  # belongs to, so the fix is one line in the Release. A Release that supplies no
  # operational sizing at all is unaffected — every key then carries the
  # Component's default — and so is one that supplies a whole group.
  assertions:
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the vector store but leaves compute.cpu empty, so the rendered workload would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the vector store but leaves compute.memory empty, so the rendered workload would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
    storage_group_complete: >-
      {{- if not (optional (default dict .infra.storage) "size" "") -}}
      {{- fail "this Release sets part of infra.storage on the vector store but leaves storage.size empty, so the rendered volume would request no size: set both storage.size and storage.type together, or remove the storage block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.storage) "type" "") -}}
      {{- fail "this Release sets part of infra.storage on the vector store but leaves storage.type empty, so the rendered volume would name no storage class: set both storage.size and storage.type together, or remove the storage block entirely to take the component's defaults" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume and the headless Service below are companions of
    # this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "qdrant/qdrant:{{ .infra.engine_version }}"
        # The server reads its whole configuration from a file it ships, and every
        # setting in that file can be overridden by an environment variable whose
        # name is the setting's path, uppercased, prefixed QDRANT__ and joined by
        # a double underscore. Each knob below is emitted only when the Aggregate
        # set it, so a bare deployment renders no configuration variables at all
        # and the server keeps its own built-in defaults. Authentication rides the
        # optional api_key slot: the key is delivered as an env secretKeyRef
        # (QDRANT__SERVICE__API_KEY), so the plaintext never lands in the
        # manifest, and the server enforces it on every request. Both listen ports
        # are set from infra so the container ports and the published Service
        # ports cannot drift apart.
        variables:
          QDRANT__SERVICE__HTTP_PORT: "{{ .infra.port }}"
          QDRANT__SERVICE__GRPC_PORT: "{{ .infra.grpc_port }}"
    {{- with .values.log_level }}
          QDRANT__LOG_LEVEL: "{{ . }}"
    {{- end }}
    {{- with .values.max_request_size_mb }}
          QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "{{ . }}"
    {{- end }}
    {{- if .values.telemetry_disabled }}
          QDRANT__TELEMETRY_DISABLED: "true"
    {{- end }}
    {{- if hasKey (default dict .features) "api_key" }}
        attachments:
          QDRANT__SERVICE__API_KEY:
            from: api_key
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
          grpc: {{ .infra.grpc_port }}
        # The resource quantities are quoted so the rendered value stays a string
        # whatever the Release supplies. Rendered bare, a whole-core quantity
        # such as 1 or 2 re-parses as a YAML integer and fails workload validation,
        # which wants a string here; a milli quantity such as 250m happens not to.
        # Quoting removes the difference, so every legal quantity a Release may
        # write renders and validates alike.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /qdrant/storage
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
          grpc: {{ .infra.grpc_port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
          grpc: {{ .infra.grpc_port }}
