apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: prometheus-bitnami
  version: 1.0.0
  description: >
    Prometheus metrics server via the Bitnami Prometheus Helm chart
    (bitnami/prometheus). The scrape-target host and port resolved from the
    `scrape_target` uses-edge arrive on the injection context and are rendered
    into the chart's server.extraScrapeConfigs as a scrape job, which the chart
    merges into the Prometheus configuration, so the server scrapes that target.
    Persistence is enabled and the data volume is sized from infra.storage, so
    the time-series database survives restarts. Alertmanager is disabled for a
    lean single-purpose metrics component. The chart pins its image by tag; the
    Recipe pins the same tag explicitly for a reproducible render. Default chart
    version in source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/observability/prometheus:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/prometheus
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"2.1.23\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   image        - map[string]string (chart server.image.* fields; overrides the tag pin)
  #   service_type - string (chart server.service.type)
  #   requests     - { cpu: string, memory: string } (resource requests)
  #   storage_class - string (persistence storageClass for the data PVC)
  #   nodeSelector - map[string]string
  #   tolerations  - []object
  valuesMapping: |
    ## ── Lean shape: single-purpose metrics server ──────────────
    ## Disable Alertmanager so the chart renders only the Prometheus
    ## server, its Service, config, RBAC, and data PVC.
    alertmanager:
      enabled: false

    server:
      ## ── Image pin ────────────────────────────────────────────
      ## The chart pins a concrete image tag; pin the same tag
      ## explicitly for a reproducible render. Override the whole
      ## block via infra.overrides.image.
      {{- if and .infra.overrides .infra.overrides.image }}
      image:
        {{- range $k, $v := .infra.overrides.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/prometheus
        tag: "3.5.0-debian-12-r3"
      {{- end }}

      replicaCount: 1

      ## ── Ports ────────────────────────────────────────────────
      containerPorts:
        http: {{ .infra.port }}
      service:
        ports:
          http: {{ .infra.port }}
        {{- if and .infra.overrides .infra.overrides.service_type }}
        type: "{{ .infra.overrides.service_type }}"
        {{- else }}
        type: ClusterIP
        {{- end }}

      ## ── Scrape target (injected) ─────────────────────────────
      ## The scrape-target host:port resolved from the `scrape_target`
      ## uses-edge is rendered into an extra scrape job, which the chart
      ## merges into the Prometheus configuration.
      extraScrapeConfigs:
        - job_name: "{{ .values.scrape_job_name }}"
          metrics_path: "{{ .values.metrics_path }}"
          static_configs:
            - targets:
                - "{{ .context.inject.env.PROM_SCRAPE_HOST }}:{{ .context.inject.env.PROM_SCRAPE_PORT }}"

      ## ── Persistence (time-series database) ───────────────────
      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        {{- if and .infra.overrides .infra.overrides.storage_class }}
        storageClass: "{{ .infra.overrides.storage_class }}"
        {{- end }}

      ## ── Resources ────────────────────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      ## ── Scheduling overrides ─────────────────────────────────
      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/prometheus
      version: 2.1.23
      digest: sha256:6615d15be2047bf7619b9162ebcbeff14e4d740708bef5a4b0c2d3e3b60bafdc
      manifestDigest: sha256:3683ba3f72df231a3089e4afb63d65d7a45a86b829a85787536697f076c544cb
