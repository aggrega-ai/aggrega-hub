apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: nvidia-api
  version: 1.0.0
  description: >
    The managed NVIDIA API as a reference realization: no compute runs in-
    cluster. helm emits an ExternalName Service mapping an in-cluster name onto
    the managed endpoint. No credential is delivered by this recipe: a consumer
    that needs one declares it as `credential` on the socket that reaches this
    endpoint and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/nvidia-api:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
