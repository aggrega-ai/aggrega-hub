apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nvidia-api
  version: 1.0.0
  description: >
    The managed NVIDIA API as a reference realization: no compute runs
    in-cluster. helm emits an ExternalName Service mapping an in-cluster name
    onto the managed endpoint; the api_key credential is carried to consumers as
    an environment variable.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/nvidia-api:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
    credential:
      from: api_key
      env: NVIDIA_API_KEY
