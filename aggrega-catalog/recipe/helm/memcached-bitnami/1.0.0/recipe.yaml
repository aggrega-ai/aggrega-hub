apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: memcached-bitnami
  version: 1.0.0
  description: >
    Memcached via Bitnami Helm chart (bitnami/memcached), standalone
    architecture. Memcached is an in-memory cache with no persistence, so the
    chart renders a stateless Deployment rather than a StatefulSet and no
    persistent volume is requested. Authentication is off by default; when a
    password credential is attached its value arrives on the env pipe and the
    chart's SASL authentication is enabled with that password. Default chart
    version in source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/datastore/memcached:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/memcached
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"8.6.10\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "memcached"

  # This Recipe reads from infra.overrides:
  #   image           - map[string]string (chart image.* fields)
  valuesMapping: |
    ## ── Architecture (stateless, in-memory cache) ──────────────
    architecture: standalone
    replicaCount: {{ .infra.replicas }}

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      memcached: {{ .infra.port }}
    service:
      ports:
        memcached: {{ .infra.port }}

    ## ── Resources ──────────────────────────────────────────────
    resources:
      requests:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"

    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- end }}

    ## ── Authentication (optional credential slot) ──────────────
    ## Off by default. When the optional `password` slot is filled, the
    ## credential value arrives on the inject pipe and enables chart SASL auth.
    ## The chart requires a writable root filesystem when auth is enabled, so
    ## the read-only default is relaxed in that case only.
    {{- if and .context.inject.env .context.inject.env.MEMCACHED_PASSWORD }}
    auth:
      enabled: true
      username: "{{ .values.username }}"
      password: "{{ .context.inject.env.MEMCACHED_PASSWORD }}"
    containerSecurityContext:
      readOnlyRootFilesystem: false
    {{- else }}
    auth:
      enabled: false
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/memcached
      version: 8.6.10
      digest: sha256:61a18297e072e020687ab89c2ae61a4ca9e186e885da93ddb79c820bf972a50d
      manifestDigest: sha256:0dd4138b1ee53ce43dc55a96c2787cf51c8887b416c08684e528b2277846f453
