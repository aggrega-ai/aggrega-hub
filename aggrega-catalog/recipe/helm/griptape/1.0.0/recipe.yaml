apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: griptape
  version: 1.0.0
  description: >
    A Griptape agent application on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment running the operator-supplied application image. The model endpoint
    published by the component wired into the `model` socket is injected as
    OPENAI_BASE_URL; the store wired into the `task_memory` socket contributes its
    host and port, so off-prompt tool output has somewhere to live; an attached
    model API key is delivered as OPENAI_API_KEY via a secretKeyRef.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/griptape:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # This agent consumes two sockets. The recipe ranges its outbound edges
        # and matches on the socket name: the `model` edge contributes the endpoint
        # and the model name; the `task_memory` edge contributes the host and port
        # of the store that holds tool output kept off the prompt. OPENAI_BASE_URL
        # and the API key are read from the environment by the OpenAI-compatible
        # client SDK. The model name and the task-memory coordinates are delivered
        # under stable names this recipe defines, for the application's own code to
        # read: Griptape's drivers are constructed in application code rather than
        # resolved from the environment, so no environment read is claimed for
        # either. The task-memory socket is optional, so wiring nothing to it
        # simply emits no task-memory variables and the agent keeps
        # tool output in the prompt.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- if eq $edge.socket "task_memory" }}
          GRIPTAPE_TASK_MEMORY_HOST: "{{ $edge.provides.host }}"
          GRIPTAPE_TASK_MEMORY_PORT: "{{ $edge.provides.port }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached to the model_api_key
        # slot, is delivered as OPENAI_API_KEY via a secretKeyRef — the key value
        # never renders into the manifest. Unattached, no key env is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
        attachments:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
