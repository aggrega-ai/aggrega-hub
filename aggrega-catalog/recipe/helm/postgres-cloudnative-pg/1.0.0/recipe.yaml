apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres-cloudnative-pg
  version: 1.0.0
  license: Apache-2.0
  description: >
    PostgreSQL realized as a Cluster custom resource the CloudNativePG control
    plane reconciles, rather than a directly synthesized StatefulSet — the
    controller-driven realization of the same PostgreSQL component, selectable in
    the Manifest alongside the synthesis recipe and the reference recipe. The
    recipe emits one Cluster conformant to the postgresql.cnpg.io/v1 API; the
    controller turns it into a running server, the Services that reach it and the
    Secret holding the database owner's password, and creates the initial database
    and its owning role from the developer's own values. The controller presents
    the instances under several Services and provides.host is the read-write one,
    which is the address the controller itself records as the database's host, so
    a consumer wires to it exactly as it would to the synthesized realization.
    Credential custody is the operator's choice: infra.credentials generated
    leaves the owner's password with the controller, and supplied points it at an
    existing Secret named in infra.credentials_secret. The CloudNativePG control
    plane is a runtime prerequisite: the build halts unless the operator affirms
    it is installed (infra.control_plane_present), so no custom resource is
    emitted into a cluster that cannot reconcile it. Reach for this realization
    where the control plane is already in place; reach for the synthesis recipe
    where it is not, and for the reference recipe where the server already exists
    outside the deployment.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/postgres:1.0.0

  # The controller fixes the server's listen port: it writes the port setting into
  # every instance's own configuration, so the custom resource carries no field for
  # it and no server setting can move it. The published contract and the assertion
  # below both read this one value, so what a consumer is handed and what the
  # assertion accepts cannot drift apart.
  locals:
    server_port: "5432"

  # The controller creates three Services for an instance, named by appending a
  # suffix to the custom resource's own name: `-rw` routes to the primary and
  # accepts writes, `-ro` routes to the replicas alone, and `-r` routes to any
  # instance. provides.host is the read-write one. It is the only one that answers
  # on a single-instance cluster — `-ro` selects replicas, of which there are none
  # until high availability is enabled — and it is the address the controller
  # itself writes into the connection material it generates for the database. The
  # host is the bare in-cluster name, carrying no namespace, matching the synthesis
  # realization's contract so consumers are realization-agnostic; a consumer in
  # another namespace qualifies it on its own side (caller-side routing).
  #
  # The read-only endpoint stays reachable under the same naming rule, but it is
  # not published: the provides contract is the Component's and is shared by every
  # realization of it, and a key only one realization can fill is one a consumer
  # cannot depend on.
  provides:
    host: "{{ .context.instance_id }}-rw"
    port: "{{ .locals.server_port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"

  # Five declared conditions, each halting rather than emitting something that
  # renders cleanly and does not work.
  assertions:
    # The CloudNativePG control plane must exist in the target cluster before a
    # Cluster custom resource can reconcile. The compiler cannot inspect cluster
    # state, so the prerequisite is declared: an operator affirms it in the Release,
    # and an unaffirmed build halts here rather than emitting an orphan custom
    # resource.
    cloudnative_pg_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the CloudNativePG control plane must be installed in the target cluster before this realization emits its Cluster custom resource; once the control plane is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # The listen port is the controller's, not the operator's. A port set here would
    # be accepted, validated and then reach no emitted byte, and the consumer would
    # be handed a port the server does not answer on.
    cloudnative_pg_fixed_port: >-
      {{- if ne (printf "%v" .infra.port) .locals.server_port -}}
      {{- fail "this realization runs the server on port 5432 and cannot move it: the controller writes the port setting into every instance's own configuration, so the custom resource carries no field for it; leave infra.port at 5432 here, or select the synthesis recipe in the Manifest, which does honor another port" -}}
      {{- end -}}
    # The custom resource takes server configuration as named settings rather than
    # as a configuration file, so a raw block has nowhere to go.
    cloudnative_pg_custom_config: >-
      {{- if and (hasKey (default dict .values) "custom_config") .values.custom_config -}}
      {{- fail "the Cluster custom resource takes server configuration as named settings rather than as a configuration file, so values.custom_config would reach no emitted byte on this realization; set the individual settings under infra.overrides.parameters, which this realization writes into the custom resource, or select the synthesis recipe in the Manifest, which does honor the raw block" -}}
      {{- end -}}
    # Supplied credentials need a Secret to read them from. An empty name would
    # render a custom resource the controller waits on forever.
    cloudnative_pg_supplied_credentials_secret: >-
      {{- if and (eq .infra.credentials "supplied") (not .infra.credentials_secret) -}}
      {{- fail "infra.credentials is supplied, so name the existing Secret the controller reads the database owner's credentials from in infra.credentials_secret; leave infra.credentials at generated to have the controller create and own that Secret instead" -}}
      {{- end -}}
    # On this realization the controller owns the database's credentials, so an
    # attached credential is a request the recipe cannot fulfil. Dropping it quietly
    # would leave the application holding one password and the database another —
    # a build that succeeds and a deployment that cannot authenticate.
    cloudnative_pg_credential_slots: >-
      {{- if or (hasKey (default dict .features) "password") (hasKey (default dict .features) "app_user_password") -}}
      {{- fail "a credential is attached to the password or app_user_password slot, but on this realization the controller owns the database's credentials: it either generates the owner's password or reads it from the Secret named in infra.credentials_secret, so an attached credential would reach no emitted byte and the application would authenticate with a password the database does not have; remove the attachment and set infra.credentials, or select the synthesis recipe in the Manifest, which does wire the slot" -}}
      {{- end -}}

  # This Recipe reads from infra.overrides:
  #   parameters - map[string]string (server settings written to the custom
  #                resource's own configuration surface; the route this realization
  #                offers in place of the raw values.custom_config block, which
  #                halts above)
  #
  # infra.ha is honored here and by no other realization of this component: the
  # instance count the custom resource carries is exactly one primary plus the
  # requested read replicas, which is what makes the controller's read-only
  # endpoint answer at all. With high availability off, one instance is rendered.
  #
  # infra.backup is read by neither this realization nor the synthesized one — the
  # controller's backup surface names an object store this catalog does not supply
  # — so the move between them loses nothing. values.custom_config and infra.port
  # are honored by the synthesis realization alone, which is why they halt above
  # rather than passing quietly. values.app_user names a role the synthesis
  # realization creates only when a credential is attached to app_user_password,
  # and that attachment halts here, so the name is never quietly dropped.
  #
  # The controller does not enable superuser access by default, and this recipe
  # does not ask it to: the role named by values.user owns the application database
  # and is the role a consumer signs in as, which is the account the published
  # contract names.
  artifacts:
    # The developer's bootstrap scripts, carried as a ConfigMap the custom resource
    # references by key. The entry renders empty — and is therefore skipped,
    # emitting no file — when no scripts are set, so an Aggregate that sets none
    # emits no ConfigMap at all. The controller runs each referenced key as SQL in
    # the application database once the cluster is created, in the order the
    # references are listed; the synthesis realization runs the same keys as files
    # on the server's own first-initialization path, where shell content is also
    # accepted. Content that is not SQL therefore belongs on the synthesis
    # realization.
    initdb-configmap.yaml: |
      {{- if .values.init_scripts -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-initdb
      data:
      {{- range $name, $content := .values.init_scripts }}
        {{ $name }}: |
      {{ $content | indent 4 }}
      {{- end }}
      {{- end }}
    cluster.yaml: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: {{ .context.instance_id }}
      spec:
        {{- if .infra.ha.enabled }}
        instances: {{ add1 .infra.ha.read_replicas }}
        {{- else }}
        instances: 1
        {{- end }}
        imageName: "ghcr.io/cloudnative-pg/postgresql:{{ .infra.engine_version }}"
        storage:
          size: "{{ .infra.storage.size }}"
          storageClass: "{{ .infra.storage.type }}"
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.parameters }}
        postgresql:
          parameters:
            {{- range $name, $setting := .infra.overrides.parameters }}
            {{ $name }}: "{{ $setting }}"
            {{- end }}
        {{- end }}
        bootstrap:
          initdb:
            database: "{{ .values.database }}"
            owner: "{{ .values.user }}"
            {{- with .values.encoding }}
            encoding: "{{ . }}"
            {{- end }}
            {{- with .values.locale }}
            locale: "{{ . }}"
            {{- end }}
            {{- if eq .infra.credentials "supplied" }}
            secret:
              name: "{{ .infra.credentials_secret }}"
            {{- end }}
            {{- if .values.init_scripts }}
            postInitApplicationSQLRefs:
              configMapRefs:
              {{- range $name, $content := .values.init_scripts }}
                - name: {{ $.context.instance_id }}-initdb
                  key: {{ $name }}
              {{- end }}
            {{- end }}
