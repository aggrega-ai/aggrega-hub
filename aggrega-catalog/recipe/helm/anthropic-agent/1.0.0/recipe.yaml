apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: anthropic-agent
  version: 1.0.0
  description: >
    A Claude assistant on Anthropic's managed API as a reference realization,
    so no compute runs in-cluster. The helm provider emits an ExternalName
    Service that maps an in-cluster DNS name onto the managed endpoint.
    provides.endpoint is the managed API host and provides.model is the
    developer-selected model string. No credential is delivered by this recipe:
    a consumer that needs one declares it as `credential` on the socket that
    reaches this endpoint and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/anthropic:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
