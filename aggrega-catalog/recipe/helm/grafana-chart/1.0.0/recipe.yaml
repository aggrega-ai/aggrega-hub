apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: grafana-chart
  version: 1.0.0
  # The packaged Grafana server is AGPL-3.0.
  license: AGPL-3.0
  description: >
    Grafana dashboards server on Kubernetes via the community-maintained Grafana
    Helm chart, served from that project's HTTPS chart repository. It renders one
    server with a persistent volume for its own state — a Deployment, a
    ClusterIP Service, a PersistentVolumeClaim, the server configuration, the
    admin account's Secret and the account it runs under — with the chart's
    ingress, route, autoscaling, network-policy, monitoring and image-renderer
    resources left switched off. The server image and the chart version are
    pinned.

    What it carries that a hand-assembled workload does not is the provisioning
    surface: data sources and dashboards declared through infra.overrides, so an
    operator hands the server one without an application change. Reach for this
    realization where a chart repository is reachable at build time and data
    sources or dashboards are to be provisioned with the server; reach for
    `grafana`, the workload-synthesis realization, where the build must complete
    with nothing fetched.

    With `infra.external_base_url` set, it becomes the server's root URL through
    the chart's own `grafana.ini` value; unset, that value is not set. The
    server's own metrics, in the Prometheus format at /metrics, are served
    through the same Service and port and published as
    provides.metrics_endpoint.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/grafana:1.0.0

  # What it carries that a hand-assembled workload does not is the provisioning
  # surface: the server's own configuration directory layout, and a place for
  # provisioned data sources and dashboards to be declared — passed through
  # from infra.overrides, so an operator can hand this realization a data
  # source or a dashboard without an application change. It also prepares the
  # persistent volume's ownership before the server starts and runs the
  # distroless image variant; both realizations probe the server's health
  # endpoint.
  #
  # The server image is pinned to a resolvable release tag for reproducible
  # renders.
  source:
    kind: helm-https-chart
    url: https://grafana-community.github.io/helm-charts
    chart: grafana
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"13.2.5\" }}"

  # provides.host is the web and query endpoint's Service name, which is what the
  # Component's provides contract promises. The valuesMapping below pins the
  # chart's fullnameOverride to the rendered name, the release name the helm
  # provider gives the chart, which spells the Component's name in the alphabet
  # a Kubernetes name allows. This chart names that Service by the pinned name
  # with no suffix — read from a render of the chart, not assumed, because
  # several charts in this catalog suffix it instead.
  #
  # port follows the Service port the operator set; the server process itself
  # always listens on the chart's own fixed port and the Service forwards to it,
  # so moving the port moves the published address and not the listener.
  #
  # A same-namespace consumer reaches the endpoint under this name directly; a
  # cross-namespace consumer qualifies it caller-side. The name carries no
  # namespace, so the Recipe is independent of where it is deployed.
  #
  # metrics_endpoint is the address Grafana serves its own metrics at, in the
  # Prometheus format: /metrics on the web port, reached through the same
  # Service and port. The chart's server configuration leaves Grafana's own
  # metrics setting at its default, which is on, and sets no credential for
  # them. It is spelled out in full on purpose: a provides entry cannot read
  # another.
  provides:
    host: "{{ .context.rendered_name }}"
    port: "{{ .infra.port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.rendered_name }}:{{ .infra.port }}/metrics"

  # The chart is configured for the shape this Component describes: one
  # dashboards server with a persistent volume for its own state, with the
  # chart's Ingress, OpenShift Route, HTTPRoute, autoscalers, network policy,
  # Prometheus-operator resources and image-renderer Deployment all left
  # switched off, because the Component describes none of them. Under this
  # configuration the chart renders a Deployment, a ClusterIP Service, a
  # PersistentVolumeClaim for the server's own state, a ConfigMap holding the
  # server configuration, a Secret holding the admin account, a
  # ServiceAccount, and the cluster role and binding that account runs under.
  #
  # This Recipe reads from infra.overrides:
  #   image                - map[string]string (image.* fields; overrides the tag pin)
  #   chown_image          - map[string]string (initChownData.image.* fields)
  #   service_type         - string (service.type; how the endpoint is exposed, default ClusterIP)
  #   storage_class        - string (persistence.storageClassName for the state volume)
  #   requests             - { cpu: string, memory: string } (server resource requests)
  #   datasources          - object (provisioned data sources, in the chart's own shape)
  #   dashboard_providers  - object (provisioned dashboard providers, in the chart's own shape)
  #   dashboards           - object (provisioned dashboards, in the chart's own shape)
  #   nodeSelector         - map[string]string (pod scheduling)
  #   tolerations          - []object (pod scheduling)
  valuesMapping: |
    ## ── Pin the chart's resource names to the rendered name ────
    ## Names the web and query endpoint's Service exactly "<rendered_name>",
    ## matching provides.host.
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── Server image pin ───────────────────────────────────────
    ## The chart's own default tag is a template over its application version,
    ## which makes the render move whenever the chart moves; pin it explicitly
    ## instead. The registry and repository are the chart's own defaults, so the
    ## image this realization runs is the one its chart is tested against, and it
    ## is why the Component's engine_version says the chart-backed realization
    ## pins its own tag. Override the whole block via infra.overrides.image.
    image:
      {{- if and .infra.overrides .infra.overrides.image }}
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      registry: docker.io
      repository: grafana/grafana
      tag: "13.2.2-distroless"
      {{- end }}

    ## ── Volume-ownership init container image pin ──────────────
    ## The chart runs a short-lived container before the server to give it
    ## ownership of the state volume, which the distroless server image needs
    ## because it does not run as the volume's owner. It is one of the images
    ## this Recipe renders, so it is pinned here rather than left to whatever the
    ## chart's own default becomes at the next chart version. Override the whole
    ## block via infra.overrides.chown_image.
    initChownData:
      image:
        {{- if and .infra.overrides .infra.overrides.chown_image }}
        {{- range $k, $v := .infra.overrides.chown_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        registry: docker.io
        repository: library/busybox
        tag: "1.38.0"
        {{- end }}

    ## ── Chart extras this Component does not describe ──────────
    ## The chart can also deploy an ingress, an OpenShift route, a gateway route,
    ## autoscalers, a network policy, Prometheus-operator resources and a
    ## separate image-rendering service. The Component describes one dashboards
    ## server and none of those, so they are left at the chart's own off-by-
    ## default setting. The one switched off deliberately here is the helm test
    ## hook: a test hook is not part of the deployed system, and it would
    ## otherwise add a third image this Recipe would owe a pin for.
    testFramework:
      enabled: false

    ## ── Web and query endpoint Service ─────────────────────────
    ## infra.port sets the Service port. The server listens on the chart's own
    ## fixed container port and the Service forwards to it, so an operator moving
    ## the port moves the published address and not the listener. The container
    ## port is left alone deliberately: the server reads its listen port from its
    ## own configuration file, which the chart writes, and moving one without the
    ## other would publish an address nothing answers on.
    service:
      enabled: true
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      port: {{ .infra.port }}

    ## ── The address the server reports as its own ──────────────
    ## Set only with infra.external_base_url. The chart's own grafana.ini value
    ## takes the server's root URL, which becomes the base of every link and
    ## redirect the server writes; the chart merges it over the rest of its
    ## server configuration. The server keeps serving at its own root, so the
    ## chart's probes on /api/health are unaffected by a path in that address.
    ## Unset, the chart's server configuration is left as the chart writes it.
    {{- with .infra.external_base_url }}
    grafana.ini:
      server:
        root_url: "{{ . }}"
    {{- end }}

    ## ── The server's own state volume ──────────────────────────
    ## Users, saved dashboards and preferences live here. The chart leaves
    ## persistence off by default; the Component describes a server backed by a
    ## persistent volume, so it is switched on and sized from infra.storage.
    persistence:
      enabled: true
      size: "{{ .infra.storage.size }}"
      {{- if and .infra.overrides .infra.overrides.storage_class }}
      storageClassName: "{{ .infra.overrides.storage_class }}"
      {{- end }}

    ## ── The admin account ──────────────────────────────────────
    ## 🔴 THE PASSWORD IS SUPPLIED ON BOTH BRANCHES, AND THAT IS A CORRECTNESS
    ## REQUIREMENT RATHER THAN A CONVENIENCE. Left unset, the chart GENERATES one
    ## from a random source, so two renders of identical input would differ — and
    ## the Component's own description already rules that out, requiring a
    ## deterministic development default instead of a generated password.
    ##
    ## Attached, the chart is pointed at the credential's secret BY NAME, so the
    ## material never appears in the rendered artifact — and pointing it there
    ## also stops the chart emitting a secret of its own. The account name is
    ## handed over as a plain setting on that branch, because a user name is not
    ## secret material and the credential carries one key rather than two.
    ##
    ## Unattached, the account name and a deterministic development default are
    ## written into the secret the chart manages, so the render is stable and the
    ## default is the same one the workload-synthesis realization emits.
    {{- if hasKey (default dict .features) "admin_password" }}
    env:
      GF_SECURITY_ADMIN_USER: "{{ .values.admin_user }}"
    admin:
      existingSecret: "{{ .features.admin_password.provides.name }}"
      passwordKey: "{{ .features.admin_password.provides.key }}"
    {{- else }}
    adminUser: "{{ .values.admin_user }}"
    adminPassword: "dev-grafana-admin-change-me"
    {{- end }}

    ## ── Provisioned data sources and dashboards ────────────────
    ## The chart's own provisioning surface, passed through untouched. This is
    ## the capability that distinguishes this realization: a server assembled as
    ## a plain workload has nowhere to declare a data source or a dashboard, so
    ## both have to be added by hand after the Release has shipped. Each block is
    ## authored in the chart's own shape, because translating it would mean this
    ## Recipe carrying a second copy of a schema the chart already defines.
    {{- if .infra.overrides }}
    {{- if .infra.overrides.datasources }}
    datasources: {{ toJson .infra.overrides.datasources }}
    {{- end }}
    {{- if .infra.overrides.dashboard_providers }}
    dashboardProviders: {{ toJson .infra.overrides.dashboard_providers }}
    {{- end }}
    {{- if .infra.overrides.dashboards }}
    dashboards: {{ toJson .infra.overrides.dashboards }}
    {{- end }}
    {{- end }}

    ## ── Server resources ───────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}
