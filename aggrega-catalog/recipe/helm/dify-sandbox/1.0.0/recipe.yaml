apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: dify-sandbox
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Dify code sandbox on Kubernetes via the helm provider's Workload
    synthesis: a stateless Deployment and a ClusterIP Service on the execution
    port. Each execution is independent and its working directory is discarded,
    so the sandbox holds nothing between calls and renders stateless.

    Code the sandbox runs was supplied by an application author, so its egress
    leaves through the proxy wired on the ssrf_proxy edge, which refuses private
    destinations. The execution key comes from a credential when one is
    attached and otherwise from a pinned development literal, for evaluation
    and local development: while it is in force, any workload that can reach
    this Service can execute code through it.

    Python requirements the developer declared are mounted from a ConfigMap.
    provides.host is the bare in-cluster Service name, with no namespace; a
    consumer in another namespace qualifies it on its own side.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/dify-sandbox:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-default"
  # with no namespace segment, so the recipe is independent of where it is
  # deployed. A same-namespace consumer reaches it under this name directly; a
  # cross-namespace consumer qualifies it with the target namespace on its own
  # side (caller-side routing).
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # The declared Python requirements become one requirements file in a
  # ConfigMap, emitted through artifacts and mounted whole-directory at the
  # dependencies directory the sandbox reads on startup. The entry renders
  # empty — and so emits no file — when the developer declared none, and the
  # workload then carries no mount either, rendering byte-identically to a
  # Recipe with no such surface at all.
  artifacts:
    dify-sandbox-dependencies.yaml: |
      {{- if .values.python_packages -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-dependencies
      data:
        python-requirements.txt: |
      {{- range .values.python_packages }}
          {{ . }}
      {{- end }}
      {{- end }}
  # The proxy identity resolved from the ssrf_proxy uses-edge arrives on
  # .context.inject.env and is composed into HTTP_PROXY and HTTPS_PROXY, the
  # variables the sandbox's own outbound client reads. That is the whole point
  # of the edge: code the sandbox runs was supplied by an application author,
  # so its egress leaves through the proxy, which refuses private destinations,
  # rather than going out directly with the pod's own reachability.
  #
  # The execution key comes from a credential when one is attached, delivered
  # on API_KEY via the credential subsystem, and from a pinned development
  # literal otherwise, matching the literal the API-server and worker Recipes
  # present on CODE_EXECUTION_API_KEY, so the three agree with no external
  # secret.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # Each execution is independent and leaves nothing behind, so the default
    # stateless form (a Deployment on the helm provider) is correct.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "langgenius/dify-sandbox:{{ .infra.engine_version }}"
        variables:
          SANDBOX_PORT: "{{ .infra.port }}"
          GIN_MODE: release
          WORKER_TIMEOUT: "{{ .values.worker_timeout }}"
          ENABLE_NETWORK: "{{ .values.enable_network }}"
          # The proxy identity arrives on the inject pipe and is composed into
          # the two variables the sandbox's outbound client reads, so executed
          # code reaches the network only through the proxy.
          HTTP_PROXY: "http://{{ .context.inject.env.SSRF_PROXY_HOST }}:{{ .context.inject.env.SSRF_PROXY_PORT }}"
          HTTPS_PROXY: "http://{{ .context.inject.env.SSRF_PROXY_HOST }}:{{ .context.inject.env.SSRF_PROXY_PORT }}"
    {{- if not (hasKey (default dict .features) "code_execution_key") }}
          API_KEY: dify-sandbox
    {{- end }}
    {{- if hasKey (default dict .features) "code_execution_key" }}
        attachments:
          API_KEY:
            from: code_execution_key
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The sandbox answers GET /health without the execution key, and the
        # platform's own Compose file checks that route. No timing is
        # documented; the liveness probe first checks after 10 s.
        health:
          ready:
            http: /health
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if .values.python_packages }}
        volumeMounts:
          - name: dependencies
            path: /dependencies
    {{- end }}
    {{- if .values.python_packages }}
    volumes:
      dependencies:
        configmap:
          source: "{{ .context.instance_id }}-dependencies"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
