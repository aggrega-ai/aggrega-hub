apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nvidia-nim
  version: 1.0.0
  license: Apache-2.0
  description: >
    NVIDIA Inference Microservice as a self-hosted, GPU-native inference server
    on Kubernetes via the helm provider's Workload synthesis, running the NIM
    container directly (no external Helm chart). Renders a StatefulSet: the NIM
    serving container resolves the model profile into a per-replica model-cache
    volume at start and serves the OpenAI-compatible API behind a ClusterIP
    Service. The serving image comes from infra.image, which the Release
    supplies — the catalog names no NIM image, since NIM images are distributed
    under NVIDIA's own terms and a reader pulls one they are entitled to. The
    model value is a deterministic pointer the container resolves at
    pod start; the compiler never fetches the profile. GPU-native — the serving
    container always requests a GPU (nvidia.com/gpu), and when a runtime class is
    named the pod is scheduled under it. When the optional ngc_api_key credential
    slot is attached the key reaches the container as an env secretKeyRef, so it
    never appears in the rendered manifest; unattached, the container starts
    without it, byte-identically to a recipe with no slot. provides.host is the
    bare, self-contained in-cluster service name; a consumer in another namespace
    qualifies it on its own side.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/nvidia-nim:1.0.0
  # This Recipe reads no infra.overrides keys.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/v1"
    model: "{{ .values.model }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful gives each replica a stable per-replica model-cache claim
    # (persistentTemplate below); the NIM container resolves the model profile
    # into it at start.
    form: stateful
    replicas: {{ .infra.replicas }}
    {{- with (default dict .infra.gpu).runtime_class }}
    runtimeClassName: "{{ . }}"
    {{- end }}
    {{- with .infra.image_pull_secret }}
    imagePullSecrets:
      - "{{ . }}"
    {{- end }}
    containers:
      main:
        # The serving image is operator-supplied and must be the NIM image for
        # the model named in .values.model, which the runtime resolves at pod
        # start. The compiler pipes both strings unresolved (AOT).
        image: "{{ .infra.image }}"
        variables:
          NIM_CACHE_PATH: /opt/nim/.cache
    {{- if hasKey (default dict .features) "ngc_api_key" }}
        # NGC API key, delivered as an env secretKeyRef so the value never lands
        # in the manifest. Emitted only when the slot is attached.
        attachments:
          NGC_API_KEY:
            from: ngc_api_key
            as: env
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # NIM documents /v1/health/ready, which answers once the model is
        # loaded and inference is available, and /v1/health/live, which answers
        # while the container runs and needs no model. Both are served on the
        # API port unless the image is told otherwise, and this Recipe tells it
        # nothing. The container resolves its model profile itself at start,
        # so the start-up probe carries the download and the load: every timing
        # is the default NVIDIA's own operator gives these probes, readiness
        # asked for up to 1230 s before the liveness probe takes over.
        health:
          startup:
            http: /v1/health/ready
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 120
          ready:
            http: /v1/health/ready
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          live:
            http: /v1/health/live
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
            "nvidia.com/gpu": "{{ (default dict .infra.gpu).count | default 1 }}"
        volumeMounts:
          - name: model-cache
            path: /opt/nim/.cache
    volumes:
      model-cache:
        persistentTemplate:
          size: "{{ .infra.model_cache.size }}"
    {{- with .infra.model_cache.class }}
          class: "{{ . }}"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
