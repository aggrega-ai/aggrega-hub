apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: openai-compatible
  version: 1.0.0
  description: >
    An OpenAI-compatible broker gateway as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the operator-supplied gateway endpoint. No credential is delivered by this recipe: a consumer that needs one declares it as `credential` on the socket that reaches this endpoint and delivers it from its own container, because the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/openai-compatible:1.0.0
  # The broker endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
    provider: "{{ .values.provider_name }}"
  assertions:
    # What answers at this address is whatever service the Release points it
    # at, so no address exists for the catalog to hold as a default: the
    # Release names the service speaking the OpenAI API.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches whatever service speaking the OpenAI API the Release points it at, a proxy in the cluster, a gateway or any other server, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the base URL of that service" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
