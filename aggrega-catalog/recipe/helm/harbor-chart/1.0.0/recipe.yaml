apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: harbor-chart
  version: 1.0.0
  license: Apache-2.0
  description: >
    A Harbor container registry on Kubernetes via the product's own Helm chart,
    served from its project's HTTPS chart repository. The chart deploys the whole
    registry as one unit, in the order its services need, which is what this
    Component describes: the API and token-service control plane, the OCI blob
    store and its controller, the web console, the asynchronous worker tier, the
    vulnerability scanner, the relational backend, the key-value cache, and the
    reverse proxy that fronts them.

    Under this configuration it renders a Deployment for the reverse proxy, the
    console, the control plane, the worker tier and the blob store; a StatefulSet
    for the backend, the cache and the scanner; a persistent volume claim for the
    blob store and one for the worker tier's logs; the configuration maps and
    secrets each service reads; and eight Services. The chart's Ingress is left
    switched off and the reverse proxy exposed as a cluster-internal Service
    instead, because the Component publishes an in-cluster address rather than an
    external hostname. Transport security, the metrics exporter and the
    Prometheus-operator monitor are left switched off too, because the Component
    describes none of them.

    What it carries that a hand-assembled workload does not is the wiring the
    product's own maintainers keep in step with it: the reverse-proxy
    configuration that routes the console path to the console and the registry
    and API paths to the control plane, the token-service trust the blob store
    checks every pull and push against, the connection settings each service
    reads for the backend and the cache, the logical-database split that keeps
    the services' cache keyspaces apart, and start-up ordering and probes for
    each service.

    🔴 The chart mints its own material when none is supplied — the control
    plane's shared and token-signing secrets, the worker tier's and the blob
    store's secrets, the cross-site-request-forgery key, and the blob store's
    hashed password are each generated at render time if left empty, so two
    renders of identical input would differ. Every one of them is supplied here
    instead: from the attached credential BY NAME where a slot is filled, and
    from a fixed development value where it is not. Nothing is left for the chart
    to generate, so the output is byte-identical across renders.

    Every image the chart runs is pinned to a resolvable release tag for
    reproducible renders. The product ships them all on one tag, so
    infra.engine_version selects every one at once. A Release pulling from a
    mirror moves them together with infra.overrides.image_prefix, and replaces
    any single one of them through infra.overrides.image, which is keyed by
    service. Default chart version in source.version; override via
    infra.source_version.

    provides.host is the bare, self-contained in-cluster Service name of the
    reverse proxy — it carries no namespace, so the recipe is independent of
    where it is deployed; a consumer in another namespace qualifies the host with
    the target namespace on its own side (caller-side routing). The packaged
    Harbor registry is Apache-2.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/devtool/harbor:1.0.0

  source:
    kind: helm-https-chart
    url: https://helm.goharbor.io
    chart: harbor
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"1.19.2\" }}"

  # provides.host is the name of the Service fronting the reverse proxy, which
  # is the single address the Component's provides contract promises.
  #
  # 🔴 IT IS THE BARE INSTANCE ID, AND THAT IS NOT WHAT PINNING THE CHART'S
  # TOP-LEVEL NAME GIVES YOU. This chart derives every other resource name from
  # its top-level name knob and then SUFFIXES it — the control plane's Service is
  # "<instance_id>-core", the console's "<instance_id>-portal", the blob store's
  # "<instance_id>-registry", and so on for the worker tier, the scanner, the
  # backend and the cache. Nothing is named by the bare pinned name. The
  # published Service is named by a SEPARATE, exposure-scoped knob whose own
  # default is the fixed literal "harbor", independent of the top-level name — so
  # a Recipe that pinned only the top-level name would publish an address no
  # Service answers to, and two instances in one namespace would both emit a
  # Service called "harbor" and collide. Both knobs are set from the instance id
  # in the valuesMapping below, and the resulting Service name was read from a
  # render of the chart, not assumed.
  #
  # Publishing any of the suffixed Services instead would publish one service of
  # the registry rather than the registry: a container client needs the console
  # path and the registry and API paths served from one address, which is what
  # the reverse proxy behind this Service does.
  #
  # port follows the Service port the operator set. The reverse proxy itself
  # always listens on the port the chart fixes and the Service forwards to it, so
  # moving infra.port moves the published address and not the listener — which is
  # why infra.port admits the privileged ports a registry is conventionally
  # reached on.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  assertions:
    # The blob store checks a presented account against a bcrypt line of the form
    # `<username>:<hash>`, and the registry's own services present the plaintext.
    # That one line names BOTH halves of the account, so the three keys describing
    # it are one setting written three ways and they move as a unit. A Release
    # that moves some of them renders a registry whose own services cannot
    # authenticate to their own blob store — a build that succeeds and a registry
    # that rejects every push.
    #
    # 🔴 The rule is ALL THREE OR NONE, rather than a per-key pairing, and the
    # reason is that no template can check a bcrypt hash against a plaintext. Any
    # narrower rule would have to GUESS which key the operator meant to be
    # authoritative, and a guess that halts refuses configurations that are
    # perfectly legal — a new account name over the development password is one.
    # Asking for all three states what was meant, costs the operator one line
    # they already know, and leaves no case where the build is wrong and silent.
    registry_account_complete: >-
      {{- $un := .infra.registry_username -}}
      {{- $pw := optional .infra `registry_password` "" -}}
      {{- $ht := optional .infra `registry_htpasswd` "" -}}
      {{- if and (or (ne $un "harbor_registry_user") $pw $ht) (or (not $pw) (not $ht)) -}}
      {{- fail "this Release changes part of the account the registry's own services present to its blob store, but that account is one setting written three ways — infra.registry_username, infra.registry_password, and infra.registry_htpasswd, which is the other two hashed into a single line — so a partial change leaves the blob store checking one account while the services present another and every push is rejected: set all three together, producing the third with `htpasswd -nbB <infra.registry_username> <infra.registry_password>`, or set none of them to take the Recipe's development account" -}}
      {{- end -}}

    # A Release may set a single key inside an infra group — `compute.cpu` alone,
    # or `storage.size` alone — and a group supplied that way carries only the
    # keys it names, so the sibling this Recipe also reads arrives empty.
    # Rendered, that would emit a control plane with a CPU limit and no memory
    # limit, or volumes with a size and no storage class: a Release materially
    # different from the one the Component's declared defaults describe, with
    # nothing in the output saying so. The build halts here instead, naming the
    # key that is missing and the group it belongs to.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the registry but leaves compute.cpu empty, so the rendered control plane would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the registry but leaves compute.memory empty, so the rendered control plane would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
    storage_group_complete: >-
      {{- if not (optional (default dict .infra.storage) "size" "") -}}
      {{- fail "this Release sets part of infra.storage on the registry but leaves storage.size empty, so the rendered volume for image layers and manifests would request no size: set both storage.size and storage.type together, or remove the storage block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.storage) "type" "") -}}
      {{- fail "this Release sets part of infra.storage on the registry but leaves storage.type empty, so the rendered volumes would name no storage class: set both storage.size and storage.type together, or remove the storage block entirely to take the component's defaults" -}}
      {{- end -}}

  # This Recipe reads from infra.overrides:
  #   image_prefix - string, the registry and namespace every pinned image is
  #                  named under, for a Release pulling from a mirror
  #                  (default docker.io/goharbor)
  #   image        - map keyed by service — nginx, portal, core, jobservice,
  #                  registry, registryctl, trivy, database, redis, exporter —
  #                  each value a map of image fields replacing that ONE
  #                  service's pin. The registry runs ten images, so an override
  #                  names which of them it means.
  #   token_key    - string (PEM RSA private key; the token service's signing key)
  #   token_cert   - string (PEM certificate over token_key)
  #   token_secret - string (name of an existing secret carrying tls.key and
  #                  tls.crt; takes precedence over token_key/token_cert)
  #   requests     - { cpu: string, memory: string } (control-plane requests)
  #   nodeSelector - map[string]string (pod scheduling)
  #   tolerations  - []object (pod scheduling)
  valuesMapping: |
    ## ── Pin every derived name to the instance id ──────────────
    ## This knob names the control plane, the console, the blob store, the worker
    ## tier, the scanner, the backend and the cache, each with its own suffix. It
    ## does NOT name the published Service; that is the exposure knob below.
    fullnameOverride: "{{ .context.instance_id }}"

    ## ── The single published address ───────────────────────────
    ## Exposing the reverse proxy as a cluster-internal Service is what gives the
    ## registry one in-cluster address, which is what provides.host publishes.
    ## The chart's Ingress path is not taken: it names an external hostname the
    ## Component does not describe, and it renders no in-cluster Service at all.
    ##
    ## 🔴 `clusterIP.name` is a SEPARATE knob from fullnameOverride above, and its
    ## own default is the fixed literal "harbor". Left alone it would publish a
    ## Service named "harbor" whatever the instance is called — an address
    ## provides.host does not name, and one that two instances in a namespace
    ## would both claim. It is pinned to the instance id here for both reasons.
    ##
    ## 🔴 Transport security is switched OFF deliberately, and it is a
    ## correctness requirement rather than a preference. The chart's own
    ## certificate source GENERATES a certificate authority and a signed
    ## certificate at render time, so two renders of identical input would
    ## differ. Left off, neither is reached.
    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: "{{ .context.instance_id }}"
        ports:
          httpPort: {{ .infra.port }}

    ## ── The address the registry reports as its own ────────────
    ## The control plane returns this to container clients as the token-service
    ## address and prints it in the console's copyable commands, so it must be
    ## the address consumers actually reach — the published Service above.
    externalURL: "http://{{ .context.instance_id }}:{{ .infra.port }}"

    ## ── Log verbosity ──────────────────────────────────────────
    ## Emitted only when the Aggregate set it, so a bare declaration renders no
    ## redundant setting and each service keeps the product's own default.
    {{- with .values.log_level }}
    logLevel: "{{ . }}"
    {{- end }}

    ## ── Every image the registry runs ──────────────────────────
    ## The chart's own tags track the version of the software it packages, so
    ## leaving them unset makes the render move whenever the chart moves. Each is
    ## pinned explicitly from infra.engine_version, which is one value because
    ## the product ships every one of these images on a single tag. The
    ## repositories are the chart's own, so the images this realization runs are
    ## the ones its chart is tested against.
    ##
    ## The metrics exporter is pinned with the rest although this configuration
    ## does not emit it, so that a Release turning metrics on through
    ## infra.overrides does not silently pick up a floating tag.
    ##
    ## 🔴 AN OVERRIDE NAMES ONE SERVICE. The registry runs ten images, so a
    ## single replacement map would point all ten at whichever one it named —
    ## infra.overrides.image is keyed by service and replaces that service's pin
    ## alone. The one case where all ten do move together is a Release pulling
    ## from a mirror, and infra.overrides.image_prefix is the knob for it.
    {{- $prefix := "docker.io/goharbor" }}
    {{- $img := dict }}
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image_prefix }}
    {{- $prefix = .infra.overrides.image_prefix }}
    {{- end }}
    {{- if .infra.overrides.image }}
    {{- $img = .infra.overrides.image }}
    {{- end }}
    {{- end }}
    nginx:
      image:
        {{- if hasKey $img "nginx" }}
        {{- range $k, $v := index $img "nginx" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/nginx-photon
        tag: "{{ .infra.engine_version }}"
        {{- end }}
    portal:
      image:
        {{- if hasKey $img "portal" }}
        {{- range $k, $v := index $img "portal" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/harbor-portal
        tag: "{{ .infra.engine_version }}"
        {{- end }}
    jobservice:
      image:
        {{- if hasKey $img "jobservice" }}
        {{- range $k, $v := index $img "jobservice" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/harbor-jobservice
        tag: "{{ .infra.engine_version }}"
        {{- end }}

      ## ── The worker tier's shared secret ────────────────────
      ## Generated by the chart when left empty. Supplied on both paths: the
      ## attached credential is named here so the material never reaches the
      ## rendered artifact, and a fixed development value stands in when nothing
      ## is attached.
      {{- if hasKey (default dict .features) "jobservice_secret" }}
      existingSecret: "{{ .features.jobservice_secret.provides.name }}"
      existingSecretKey: "{{ .features.jobservice_secret.provides.key }}"
      {{- else }}
      secret: "harborjobsvcsec1"
      {{- end }}
    trivy:
      image:
        {{- if hasKey $img "trivy" }}
        {{- range $k, $v := index $img "trivy" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/trivy-adapter-photon
        tag: "{{ .infra.engine_version }}"
        {{- end }}
    exporter:
      image:
        {{- if hasKey $img "exporter" }}
        {{- range $k, $v := index $img "exporter" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/harbor-exporter
        tag: "{{ .infra.engine_version }}"
        {{- end }}

    ## ── The API and token-service control plane ────────────────
    core:
      image:
        {{- if hasKey $img "core" }}
        {{- range $k, $v := index $img "core" }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: {{ $prefix }}/harbor-core
        tag: "{{ .infra.engine_version }}"
        {{- end }}

      ## The control plane's shared secret. Written into the configuration the
      ## Release renders rather than read from a secret the software is pointed
      ## at, so a Release replaces it through infra rather than by attaching a
      ## credential. Generated by the chart when left empty.
      secret: "{{ optional .infra `core_secret` "harborcoresecr01" }}"

      ## The cross-site-request-forgery signing key. Generated by the chart when
      ## left empty. Attached, the control plane is pointed at the credential BY
      ## NAME; unattached, a fixed development value stands in.
      {{- if hasKey (default dict .features) "csrf_key" }}
      existingXsrfSecret: "{{ .features.csrf_key.provides.name }}"
      existingXsrfSecretKey: "{{ .features.csrf_key.provides.key }}"
      {{- else }}
      xsrfKey: "harborcsrfkey0123456789abcdef012"
      {{- end }}

      ## The token-service signing key and the certificate over it. This is the
      ## trust the blob store checks every pull and push against. The chart
      ## generates a fresh certificate authority here when all three of its
      ## inputs are empty, which is the largest single source of drift between
      ## two renders, so one of them is always supplied.
      ##
      ## An operator holding the pair in a secret already names it through
      ## infra.overrides.token_secret, which the chart mounts whole and which
      ## must carry tls.key and tls.crt. Otherwise the pair below is used: a
      ## fixed, published development key and its self-signed certificate,
      ## replaceable one for one through infra.overrides.token_key and
      ## infra.overrides.token_cert. It is shared and public, so a Release
      ## serving real traffic replaces it.
      {{- if and .infra.overrides .infra.overrides.token_secret }}
      secretName: "{{ .infra.overrides.token_secret }}"
      ##
      ## 🔴 The supplied pair is emitted as a QUOTED flow scalar rather than as a
      ## block. A block would have to re-indent the lines of a value written
      ## somewhere else, and an indent that does not match leaves a certificate
      ## whose lines each carry leading spaces — a file that renders, applies and
      ## is rejected by the software that reads it, with nothing in the build
      ## saying so. The quoted form carries the line breaks inside the value and
      ## has no indentation to get wrong. Established by rendering the block form
      ## and reading the emitted certificate back.
      {{- else if and .infra.overrides .infra.overrides.token_key }}
      tokenKey: {{ .infra.overrides.token_key | toJson }}
      tokenCert: {{ .infra.overrides.token_cert | toJson }}
      {{- else }}
      tokenKey: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIEowIBAAKCAQEAvu15awFHDpYVzlvLQCz57Ho7hCDMkFHljyidqRxkY0xIJQOl
        x8/9d0xB1EHt4KC0KoIjct5jhp7ETDjeyq2lCxfpHN7CBZMud9LFAzJJ3yeThQa4
        dMZVKeR/WLR5UAD9N86/zvcDvqWFEUR3YGLjM2Bgd+5XFtBZCOpf6cdF76x1+Nhx
        quLbpo/OoCR42/DFVNlnpJUL5oFegi0sNvjl6OhZk/sgQwCjdQsWnIr6BN6w4jVe
        /6JoBie25oLlVvNdEKs6Ilnt1L3Rv552WjlwAnbly8tufmRB6kys7DuvpozpkPpd
        /V12TGLGB0LGJV8xZClZM54Nksmg+9RgzcPdpQIDAQABAoIBAAVdw1XgmVCtoztD
        lTjeir+8x8N08Ir14k/dwmCobaHk2PpBWf19uRALUqZWnAr+OVIgikKGQaHdAINr
        7ccgjkz7hQ/MqwNhGaNAh00Jss3U3O6WO8T8dhRRWcryd55qCLPy2a1FgBNxr4XG
        uNw6q0wcX1m/ly8K+BWqELwPX8XWtIdAjd+j0xJZbCn+vd516eVA/aZik4SNpAy9
        qmoyj3lCZa8Q/3FYcWLpwjNUcOCcT3nD//sX3iRiCE3Ab5s7QcQoLVtwTlJPlGgC
        YZrW2bAPtBvjfQuuJ29AvOnjAwAOjR25E2buRTpnaWlE/oQJlKR+oUUCQuyi9k9G
        nfwI3JkCgYEA/TwW4mj/m1NM2sTYwZ0VNv0/OFVrLQYRk8Id6sHKT0jrlJg7rjNG
        J0QSFzSvmHcNO5grux8FSn6npL37fRnDsJw8x5adgkhbrvTbvm2ypasB9BnbhXnJ
        B3RDNc811wF2yeLcFPXJqa75NtUEUEqUZkwzdTkXXjQOCRp3eMK94KcCgYEAwQM1
        CLLH6ZP1DYKARNZgF8T+riUpDNxiXbzDfYQOZA++p1D8hpUqH3FMyVSWsks4kaFj
