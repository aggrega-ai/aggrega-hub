apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: minio
  version: 1.0.0
  license: AGPL-3.0
  description: >
    MinIO S3-compatible object-storage server on Kubernetes via the helm
    provider's Workload synthesis, running the official upstream
    quay.io/minio/minio image directly (no external Helm chart). MinIO stores
    objects under /data, so the workload mounts a persistent volume at that
    path; it runs as a single replica serving the S3 API, so it renders a
    Deployment plus a ClusterIP
    Service. The server is started with `minio server /data --address :<port>`.
    The root username is a developer value. The root password is wired through the
    optional `root_password` credential slot: when a credential is attached it
    renders as an env secretKeyRef (MINIO_ROOT_PASSWORD), so the plaintext never
    lands in the Deployment manifest; when none is attached the Recipe falls back
    to a deterministic development default so the render stays byte-identical
    across runs. With `infra.external_base_url` set, it reaches the server as the
    endpoint it advertises (MINIO_SERVER_URL), and the build halts when that
    address carries a path; unset, that variable is not emitted.
    provides.host is the bare, self-contained in-cluster service name
    of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed; a consumer in another namespace qualifies
    the host with the target namespace on its own side (caller-side routing).
    provides.endpoint composes that name and the port under http, the scheme
    the server is served over: the workload mounts no certificate, so the
    server terminates no TLS. The packaged MinIO server is AGPL-3.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/storage/minio:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "s3" — the
  # S3-compatible object-storage API.
  #
  # endpoint is the address a consumer's S3 client is pointed at, so a consumer
  # reads the scheme from the store rather than assuming one. It is http because
  # the workload mounts no certificate and the server terminates no TLS.
  # host and endpoint spell the Service name out twice on purpose: a provides
  # entry cannot read another provides entry, so there is no home either could
  # dereference instead, and the two must be edited together.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "s3"
  # The server takes its advertised endpoint as scheme, host and port and drops
  # any path from it, so an address carrying one would be advertised as a
  # different address from the one authored. Halt on one here, where the fix is
  # one value in the Release.
  assertions:
    external_base_url_is_an_origin: >-
      {{- with optional .infra "external_base_url" "" -}}
      {{- $u := urlParse . -}}
      {{- if and $u.host $u.path (ne $u.path "/") -}}
      {{- fail (printf "infra.external_base_url %q carries the path %q, but the object store drops any path from the endpoint it advertises, so it would advertise an address other than this one; set it to the scheme, host and port alone, for example https://s3.example.com" . $u.path) -}}
      {{- end -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # MinIO runs as a single replica whose object data lives on the mounted
    # volume, so the default stateless form (a Deployment on the helm provider) is
    # correct — no form: stateful, no per-replica volume template.
    replicas: 1
    containers:
      main:
        image: "quay.io/minio/minio:{{ .infra.engine_version }}"
        # `minio server /data` starts the object store; --address binds the S3
        # API to the infra port, with object data on the mounted volume.
        command:
          - minio
          - server
          - /data
          - --address
          - ":{{ .infra.port }}"
        # MINIO_ROOT_USER is a developer value. MINIO_ROOT_PASSWORD is wired
        # through the optional `root_password` credential slot: when a credential
        # is attached it renders as an env secretKeyRef so the plaintext never
        # lands in the manifest; with none attached the Recipe falls back to a
        # deterministic development default. MinIO keeps its object data under
        # /data on the data volume. With infra.external_base_url set,
        # MINIO_SERVER_URL carries it as the endpoint the server advertises
        # about itself; MINIO_BROWSER_REDIRECT_URL, the address of the console
        # the server also runs, is not set, because this workload publishes no
        # console port. Unset, neither is emitted.
        variables:
          MINIO_ROOT_USER: "{{ .values.root_user }}"
    {{- with .infra.external_base_url }}
          MINIO_SERVER_URL: "{{ . }}"
    {{- end }}
    {{- if not (hasKey (default dict .features) "root_password") }}
          MINIO_ROOT_PASSWORD: dev-minio-root-change-me
    {{- end }}
    {{- if hasKey (default dict .features) "root_password" }}
        attachments:
          MINIO_ROOT_PASSWORD:
            from: root_password
            as: env
    {{- end }}
        ports:
          api: {{ .infra.port }}
        # MinIO serves /minio/health/ready — the node is initialized and ready to
        # accept requests, the probe MinIO names for a node's Kubernetes
        # readiness — and /minio/health/live on its API port, the only port the
        # container declares. No start-up time is documented; the liveness probe
        # waits 10 s before its first check.
        health:
          ready:
            http: /minio/health/ready
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /minio/health/live
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /data
    volumes:
      data:
        persistent:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: ClusterIP
        ports:
          api: {{ .infra.port }}
