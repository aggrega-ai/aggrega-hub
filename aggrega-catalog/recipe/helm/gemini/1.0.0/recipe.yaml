apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: gemini
  version: 1.0.0
  description: >
    Google's managed Gemini API as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the managed endpoint; the api_key credential is carried to consumers as an environment variable.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/gemini:1.0.0
  # provides is self-contained (only .context.instance_id/.values/.infra/.locals/
  # static text), so the fixed managed host is a static constant here; it is
  # repeated in the workload endpoint below and the two must stay in sync.
  provides:
    endpoint: "https://generativelanguage.googleapis.com"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "https://generativelanguage.googleapis.com"
    port: 443
    credential:
      from: api_key
      env: GEMINI_API_KEY
