apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: n8n
  version: 1.0.0
  description: >
    The n8n automation platform on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment serving the n8n editor and webhook endpoint on a ClusterIP
    Service. When a workflow definition is supplied, a flow ConfigMap carries it
    and an init container seeds it into the platform on start via
    `n8n import:workflow`; with no definition the platform deploys empty and the
    ConfigMap and init step are omitted byte-identically. On this target the
    supplied definition is the source of truth for the workflow and the platform's
    data directory is derived from it: the directory is a scratch volume that does
    not survive a restart, and the workflow returns because the init container
    re-imports it, not because it was stored. Everything else authored in the
    editor — further workflows, and the credentials entered there — lives only in
    that scratch directory and does not survive a restart. Author the workflow as
    a supplied definition rather than in the editor when it needs to outlive the
    pod. The model endpoint wired into the `model` socket is injected as
    OPENAI_BASE_URL and an attached model API key as OPENAI_API_KEY, both read by
    workflow expressions via n8n's $env. Which model a workflow calls is selected
    in the workflow's own node. The environment carries no model name, so there is
    no model name for a workflow expression to read through $env either.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/n8n:1.0.0
  # The workflow definition is authored by the developer on .values. When present
  # it renders a ConfigMap the init container reads; presence-guarded so an
  # Aggregate supplying no definition emits no ConfigMap, byte-identical to a
  # bare deploy.
  artifacts:
    n8n-flow.configmap.yaml: |
      {{- if .values.flow_definition }}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-flow
      data:
        workflow.json: |
      {{ .values.flow_definition | indent 6 }}
      {{- end }}
  workload: |
    {{- $dataPath := "/home/node/.n8n" -}}
    {{- $seedPath := "/flows" -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    {{- if .values.flow_definition }}
    # Seed the supplied workflow before the platform starts. The init container
    # imports the flow from the mounted ConfigMap into the n8n data directory the
    # main container serves from (both mount the shared data volume).
    # $seedPath is the single authored home for the seed directory: the import
    # argument and the mount that puts the file there both read it, so a future
    # move cannot relocate one and leave the other pointing at the old path.
    initContainers:
      - name: import-flow
        image: "{{ .infra.image }}"
        command: ["n8n"]
        args: ["import:workflow", "--input={{ $seedPath }}/workflow.json"]
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
          - name: flow
            path: "{{ $seedPath }}"
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Both this container's mount and the seeding init container's
        # mount read the binding — they have to name the same directory for an
        # imported workflow to be visible to the platform — so a future move
        # cannot relocate one and leave the other behind.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name, then reads the model
        # recipe's published endpoint. n8n workflow expressions read it via $env.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
        # An attached model API key is delivered as OPENAI_API_KEY via a
        # secretKeyRef; the key value never renders into the manifest.
    {{- if hasKey (default dict .features) "model_api_key" }}
        attachments:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
        ports:
          http: 5678
        # The platform documents GET /healthz, which answers once the instance is
        # reachable, and GET /healthz/readiness, which answers once its database
        # is connected and migrated, and keeps both enabled on its main server.
        # The probes and their timing are the platform's own Helm chart's: a
        # start-up probe on /healthz allowing 300 s, readiness on
        # /healthz/readiness and liveness on /healthz.
        health:
          startup:
            http: /healthz
            periodSeconds: 10
            failureThreshold: 30
          ready:
            http: /healthz/readiness
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          live:
            http: /healthz
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    volumes:
      data:
        # A scratch volume by design on this target: the supplied definition is
        # the source of truth for the workflow and the init container re-imports
        # it on every start, so the data directory is derived rather than
        # authoritative. State authored in the editor does not survive here.
        ephemeral: {}
    {{- if .values.flow_definition }}
      flow:
        configmap:
          source: "{{ .context.instance_id }}-flow"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 5678
