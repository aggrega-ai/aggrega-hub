apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: n8n
  version: 1.0.0
  description: >
    The n8n automation platform on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis: a Deployment serving
    the n8n editor and webhook endpoint on a ClusterIP Service. A workflow
    definition, when supplied, is carried in a ConfigMap and imported by an
    init container with `n8n import:workflow` on every start; with none,
    neither is rendered.

    The data directory is a scratch volume: the supplied definition returns
    after a restart because it is imported again, and everything else
    authored in the editor is lost.

    The model arrives as OPENAI_BASE_URL and its key as OPENAI_API_KEY; each
    `tools` and `vector_store` connection under variables named for its
    alias, as the comments above the workload set out; every credential
    through a secretKeyRef. A connection writing an `inject:` block receives
    the names it dictates in their place, as variables or as files mounted at
    the paths it names; its credentials stay.

    N8N_BLOCK_ENV_ACCESS_IN_NODE is true unless the component's
    allow_env_access_in_nodes value is true, so a workflow reads these values
    through $env only then. `infra.external_base_url`, where set, becomes the
    editor address and the webhook base.

    With `values.metrics_enabled` true, N8N_METRICS turns n8n's metrics on, at
    /metrics on the Service's port 5678, which answers without a sign-in, and
    provides.metrics_endpoint publishes the address.

    Reach for this realization where the build must complete with nothing
    fetched; reach for `n8n-chart`, rendering n8n's own chart, where a chart
    repository is reachable at build time, or editor state must survive a
    restart.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/n8n:1.0.0
  # metrics_endpoint is the address n8n serves its own metrics at while
  # values.metrics_enabled is true: /metrics on port 5678 of the synthesized
  # ClusterIP Service, "<rendered_name>-default" — the main port, which that
  # Service carries already, with no namespace segment, so a consumer in
  # another namespace qualifies the host on its own side. It is empty while the
  # value is false, when the metrics are off.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-default:5678/metrics{{ end }}"
  # The workflow definition is authored by the developer on .values. When present
  # it renders a ConfigMap the init container reads; presence-guarded so an
  # Aggregate supplying no definition emits no ConfigMap, byte-identical to a
  # bare deploy. The pod mounts the ConfigMap by name, which resolves only in
  # the pod's own namespace, so the ConfigMap carries the namespace the Release, or else the Aggregate,
  # declares for the component through the aggrega.ai/namespace annotation, as
  # the Workload's own resources do, and none where it declares none.
  artifacts:
    n8n-flow.configmap.yaml: |
      {{- if .values.flow_definition }}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-flow
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        workflow.json: |
      {{ .values.flow_definition | indent 6 }}
      {{- end }}
    # The ConfigMap holding the file entries the connections dictate, keyed
    # file-0, file-1 and so on in path order, the keys the workload's mounts
    # read. It is emitted only while a connection dictates a file, so a build
    # with none renders nothing here, and it carries the namespace the Release, or else the Aggregate,
    # declares for the component, as the definition's ConfigMap does.
    n8n-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
  # On this target the supplied definition is the source of truth for the
  # workflow and the platform's data directory is derived from it: the
  # directory is a scratch volume, and the workflow returns after a restart
  # because the init container imports it again, not because it was stored.
  #
  # Which model a workflow calls is selected in the workflow's own node. The
  # environment carries no model name, so there is no model name for a
  # workflow expression to read through $env either.
  #
  # n8n blocks a workflow's reads of $env, in expressions and the Code node,
  # according to N8N_BLOCK_ENV_ACCESS_IN_NODE: its 2.x releases block unless
  # the variable is "false", and its 1.x releases only where it is "true". The
  # image is the Release's, so the variable is always delivered: "true" while
  # the component's allow_env_access_in_nodes value is false, its default, and
  # "false" only where an Aggregate sets that value true. Every model, tool and
  # store value below is readable by a workflow only in the second case, which
  # also opens every other variable of the platform's environment, the
  # credentials included, to every workflow.
  #
  # Each `tools` and `vector_store` connection's variables are named for its
  # alias, upper-cased, with every character other than a letter or a digit an
  # underscore; the alias grammar admits only a hyphen and an underscore
  # besides, so a hyphen becomes an underscore. AGGREGA_TOOL_<ALIAS>_URL is the
  # endpoint the tool publishes, unless the connection carries an endpoint
  # secret: then it is that secret, referenced by connection and slot, and the
  # published address is not delivered. A tool's credential is delivered only
  # where the connection carries one, and the header the tool publishes beside
  # it, as AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER, only where it publishes one;
  # a tool behind a bridge publishes none, because the bridge checks no
  # caller's credential. AGGREGA_VECTOR_STORE_<ALIAS>_URL is
  # the endpoint the store publishes, or, for a store publishing none, the
  # address composed from the protocol, host and port it publishes, and its
  # credential is delivered only where the connection carries one.
  #
  # A store that also publishes a database and a user, as
  # core/datastore/pgvector does, is delivered in parts as well:
  # AGGREGA_VECTOR_STORE_<ALIAS>_HOST, _PORT, _DATABASE and _USER, its
  # published host, port, database and user. n8n's PGVector node reaches the
  # store through a Postgres credential holding those fields and the
  # password, and n8n resolves an expression written in a credential's field,
  # so each field reads its variable, and the password the connection's
  # credential, through $env — while allow_env_access_in_nodes is true, like
  # every other delivered value. A store publishing no database or no user
  # gets no parts: its connection delivers the address and the credential
  # alone.
  #
  # Every secret on every connection sits under one attachments key, so the
  # block is opened once, and only where one connection carries a secret.
  #
  # The variables a connection's provides fill are defaults, because n8n reads
  # none of them itself and a workflow reads them under whatever names its
  # expressions give: a connection writing an inject block receives exactly
  # the names it dictates instead — OPENAI_BASE_URL on the model connection,
  # the address, header and part variables on a tools or vector_store one —
  # while the credentials and endpoint secrets attached on it stay. A
  # workflow reads a dictated variable through $env, under the same block as
  # every other variable.
  workload: |
    {{- /*
      A connection that writes no inject block receives the defaults above. A
      connection that writes one receives exactly what it dictates instead,
      read off the inject pipe as a map: no OPENAI_BASE_URL from a model
      connection, no AGGREGA_TOOL_<ALIAS>_URL from the endpoint a tool
      publishes, no _CREDENTIAL_HEADER, no AGGREGA_VECTOR_STORE_<ALIAS>_URL and
      no part variables. What its attachments deliver stays either way: the
      model's credential as OPENAI_API_KEY, a tool's or a store's as
      _CREDENTIAL, and a tool's endpoint secret as AGGREGA_TOOL_<ALIAS>_URL.

      A dictated env entry becomes a container variable under the name it
      gives, after every variable this recipe names, which a workflow reads
      through $env while allow_env_access_in_nodes is true; a dictated file
      entry a read-only file at the absolute path it names, held in one
      ConfigMap and mounted by subPath into the platform's container, so a
      path that is not absolute, or one lying beneath another file's path, is
      refused. An arg entry is refused, because this recipe renders no command
      line for the platform: Kubernetes takes a container's arguments in place
      of the image's default command, which starts the platform. Any other
      mechanism is refused too. A dictated variable named like one this recipe
      delivers itself, a platform setting or another connection's, halts the
      build, naming both, since the compiler cannot see the names a recipe
      writes.

      Two tools or two vector_store connections whose aliases differ only in
      letter case, or in a hyphen against an underscore, are named alike, so
      the build halts, naming both, wherever the two would deliver one
      variable: always while both take the defaults, and otherwise wherever
      what each still delivers meets, such as a credential attached on each.
    */ -}}
    {{- $pipe := default dict .context.inject -}}
    {{- $env := optional $pipe "env" dict -}}
    {{- $pipeFiles := optional $pipe "file" dict -}}
    {{- $dictating := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $taken := dict -}}
    {{- if .infra.external_base_url -}}
    {{- range $var := list "N8N_EDITOR_BASE_URL" "N8N_WEBHOOK_URL" "WEBHOOK_URL" -}}
    {{- $_ := set $taken $var "the platform's own setting written from infra.external_base_url" -}}
    {{- end -}}
    {{- end -}}
    {{- $_ := set $taken "N8N_BLOCK_ENV_ACCESS_IN_NODE" "the platform's own setting written from values.allow_env_access_in_nodes" -}}
    {{- if .values.metrics_enabled -}}
    {{- $_ := set $taken "N8N_METRICS" "the platform's own setting turning its metrics on" -}}
    {{- end -}}
    {{- $connectionVars := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if eq $edge.socket "model" -}}
    {{- if not (hasKey $dictating $alias) -}}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, which writes no inject block" $alias) -}}
    {{- end -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) -}}
    {{- end -}}
    {{- end -}}
    {{- if or (eq $edge.socket "tools") (eq $edge.socket "vector_store") -}}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" -}}
    {{- $byDefault := printf "the %s connection %s, which writes no inject block" $edge.socket $alias -}}
    {{- $delivers := dict -}}
    {{- if eq $edge.socket "tools" -}}
    {{- if hasKey $features "endpoint" -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) (printf "the endpoint attached on the tools connection %s" $alias) -}}
    {{- else if not (hasKey $dictating $alias) -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) $byDefault -}}
    {{- end -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) (printf "the credential attached on the tools connection %s" $alias) -}}
    {{- if and (not (hasKey $dictating $alias)) (optional $edge.provides "credential_header" "") -}}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL_HEADER" $name) $byDefault -}}
    {{- end -}}
    {{- end -}}
    {{- else -}}
    {{- if not (hasKey $dictating $alias) -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_URL" $name) $byDefault -}}
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") -}}
    {{- range $part := list "HOST" "PORT" "DATABASE" "USER" -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_%s" $name $part) $byDefault -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- if hasKey $features "credential" -}}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_CREDENTIAL" $name) (printf "the credential attached on the vector_store connection %s" $alias) -}}
    {{- end -}}
    {{- end -}}
    {{- range $var, $by := $delivers -}}
    {{- with optional $connectionVars $var "" -}}
    {{- fail (printf "the %s connections %s and %s of %q would both deliver the variable %s, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" $edge.socket . $alias $.context.instance_id $var) -}}
    {{- end -}}
    {{- $_ := set $connectionVars $var $alias -}}
    {{- $_ := set $taken $var $by -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) -}}
    {{- end -}}
    {{- else if eq $mechanism "file" -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) -}}
    {{- end -}}
    {{- $_ := set $files $name (optional $pipeFiles $name "") -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line for the platform: Kubernetes takes a container's arguments in place of the image's default command, which starts the platform. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- $dataPath := "/home/node/.n8n" -}}
    {{- $seedPath := "/flows" -}}
    {{- $secrets := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "tools") (or (hasKey $features "credential") (hasKey $features "endpoint")) -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    {{- if .values.flow_definition }}
    # Seed the supplied workflow before the platform starts. The init container
    # imports the flow from the mounted ConfigMap into the n8n data directory the
    # main container serves from (both mount the shared data volume).
    # $seedPath is the single authored home for the seed directory: the import
    # argument and the mount that puts the file there both read it, so a future
    # move cannot relocate one and leave the other pointing at the old path.
    initContainers:
      - name: import-flow
        image: "{{ .infra.image }}"
        command: ["n8n"]
        args: ["import:workflow", "--input={{ $seedPath }}/workflow.json"]
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
          - name: flow
            path: "{{ $seedPath }}"
    {{- end }}
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Both this container's mount and the seeding init container's
        # mount read the binding — they have to name the same directory for an
        # imported workflow to be visible to the platform — so a future move
        # cannot relocate one and leave the other behind.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name, then reads the model
        # recipe's published endpoint. A workflow reads it through $env only
        # while allow_env_access_in_nodes is true.
        # With infra.external_base_url set, the platform's editor address and
        # its webhook base are both that address. The webhook base is written
        # under both names the platform has read it by: N8N_WEBHOOK_URL, which a
        # build that reads it prefers, and WEBHOOK_URL, the only name an earlier
        # build reads — the image is the Release's, so either kind may run. A
        # build that reads the newer name logs a deprecation notice for the
        # older one at start-up. Unset, none of the three is emitted.
        # With values.metrics_enabled true, N8N_METRICS turns on n8n's own
        # metrics, which it serves at /metrics on its main port with no
        # sign-in; with the value false it is not emitted and the metrics stay
        # off, n8n's own default.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (not (hasKey $dictating $alias)) }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- with .infra.external_base_url }}
          N8N_EDITOR_BASE_URL: "{{ . }}"
          N8N_WEBHOOK_URL: "{{ . }}"
          WEBHOOK_URL: "{{ . }}"
    {{- end }}
    {{- if optional .values "allow_env_access_in_nodes" false }}
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    {{- else }}
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    {{- end }}
    {{- if .values.metrics_enabled }}
          N8N_METRICS: "true"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "tools") (not (hasKey $dictating $alias)) }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $features "endpoint") }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "vector_store") (not (hasKey $dictating $alias)) }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $url := optional $edge.provides "endpoint" "" }}
    {{- if not $url }}
    {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
    {{- end }}
          AGGREGA_VECTOR_STORE_{{ $name }}_URL: "{{ $url }}"
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
          AGGREGA_VECTOR_STORE_{{ $name }}_HOST: "{{ $edge.provides.host }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_PORT: "{{ $edge.provides.port }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_DATABASE: "{{ $edge.provides.database }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_USER: "{{ $edge.provides.user }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- /* The variables connections dictate, after every variable this recipe names, in alias order. */}}
    {{- range $alias, $edge := .context.uses }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
        # A model API key attached on the `model` connection is delivered as
        # OPENAI_API_KEY via a secretKeyRef naming that connection; the key
        # value never renders into the manifest. Every secret on a `tools` or
        # `vector_store` connection is delivered the same way:
        # AGGREGA_TOOL_<ALIAS>_CREDENTIAL, AGGREGA_TOOL_<ALIAS>_URL from an
        # endpoint secret, and AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL.
    {{- if $secrets }}
        attachments:
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL:
            connection: "{{ $alias }}"
            from: endpoint
            as: env
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") }}
          AGGREGA_VECTOR_STORE_{{ regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- end }}
        ports:
          http: 5678
        # The platform documents GET /healthz, which answers once the instance is
        # reachable, and GET /healthz/readiness, which answers once its database
        # is connected and migrated, and keeps both enabled on its main server.
        # The probes and their timing are the platform's own Helm chart's: a
        # start-up probe on /healthz allowing 300 s, readiness on
        # /healthz/readiness and liveness on /healthz.
        health:
          startup:
            http: /healthz
            periodSeconds: 10
            failureThreshold: 30
          ready:
            http: /healthz/readiness
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          live:
            http: /healthz
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
      data:
        # A scratch volume by design on this target: the supplied definition is
        # the source of truth for the workflow and the init container re-imports
        # it on every start, so the data directory is derived rather than
        # authoritative. State authored in the editor does not survive here.
        ephemeral: {}
    {{- if .values.flow_definition }}
      flow:
        configmap:
          source: "{{ .context.rendered_name }}-flow"
    {{- end }}
    {{- if $files }}
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 5678
