apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: huggingface
  version: 1.0.0
  description: >
    Hugging Face's managed Inference API as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the managed endpoint; the credential is carried to consumers as an environment variable.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/huggingface:1.0.0
  # provides is self-contained (only .context.instance_id/.values/.infra/
  # static text), so the fixed managed host is a static constant here; it is
  # repeated in the workload endpoint below and the two must stay in sync.
  provides:
    endpoint: "https://api-inference.huggingface.co"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "https://api-inference.huggingface.co"
    port: 443
    credential:
      from: hf_token
      env: HF_TOKEN
