apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: envoy-ai-gateway-operator
  version: 1.0.0
  license: Apache-2.0
  description: >
    Installs the Envoy AI Gateway control plane as an explicit
    component: a ServiceAccount, the cluster RBAC the controller needs to
    reconcile gateway custom resources, and the controller Deployment on the
    upstream image. Emitting the control plane as a first-class component lets a
    gateway-mediated model ship its runtime prerequisite alongside the custom
    resources it emits (the bundled-deploy prerequisite mode), so the custom
    resource and the controller that reconciles it are deployed together. This is
    a minimal control-plane bootstrap; a production install typically sources the
    project's upstream chart or manifests, which also carry the custom-resource
    definitions and admission webhooks.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/envoy-ai-gateway-operator:1.0.0
  artifacts:
    serviceaccount.yaml: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
    clusterrole.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .context.instance_id }}
      rules:
        - apiGroups: ["aigateway.envoyproxy.io"]
          resources: ["aiservicebackends", "backendsecuritypolicies"]
          verbs: ["get", "list", "watch", "update", "patch"]
    clusterrolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .context.instance_id }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: {{ .context.instance_id }}
        template:
          metadata:
            labels:
              app.kubernetes.io/name: {{ .context.instance_id }}
          spec:
            serviceAccountName: {{ .context.instance_id }}
            containers:
              - name: controller
                image: {{ .infra.image }}
