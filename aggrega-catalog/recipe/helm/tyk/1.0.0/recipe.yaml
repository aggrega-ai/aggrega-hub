apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: tyk
  version: 1.0.0
  license: MPL-2.0
  description: >
    Tyk Gateway on Kubernetes via the open-source stack chart the gateway's own
    maintainers publish, served from the project's HTTPS chart repository. The
    chart was chosen over a hand-authored workload because it meets all three
    conditions the catalog asks of a chart: it is official, published by the
    product's maintainers alongside the gateway itself; it is complete, carrying
    the gateway Deployment, its Service, the storage wiring and the directory
    setup the gateway needs at start; and it is maintained, its most recent
    release post-dating the most recent gateway release by two days as read on
    2026-09-20. The chart bundles three components — the gateway, an analytics
    purger, and the vendor's Kubernetes controller — and only the gateway is
    unconditional. This Recipe deploys the gateway alone: the purger and the
    controller stay off, and the controller's configuration secret, which the
    chart emits by default even with the controller off, is turned off too, so
    the render carries nothing belonging to a component this Recipe does not
    stand up. The chart names its generated resources after the release, so
    fullnameOverride is bound to the release name the helm provider gives the
    chart, which spells the component's name in the alphabet a Kubernetes name
    allows, and provides.host names the Service the chart emits.
    It writes each core/upstream-key-pinning attachment into the gateway's
    environment. A cache publishing valkey-tls or redis-tls is reached through
    the chart's own Redis TLS setting, checked against the cache connection's
    server_ca, mounted, or the image's trust store; another TLS protocol halts
    the build. Default chart version in source.version; override via
    infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/tyk:1.0.0

  source:
    kind: helm-https-chart
    url: https://helm.tyk.io/public/helm/charts/
    chart: tyk-oss
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"5.3.0\" }}"

  # The chart prefixes the data-plane Service name with its own role segment and
  # then appends the name fullnameOverride carries — the rendered name, below —
  # so the emitted Service is `gateway-svc-<rendered_name>`. provides.host spells
  # that out rather than naming the release alone, because a host that names no
  # emitted Service is a broken contract that renders cleanly on both sides. The
  # host is the bare service name with no namespace segment, so this Recipe is
  # independent of where it is deployed and a cross-namespace consumer qualifies
  # it caller-side.
  provides:
    host: "gateway-svc-{{ .context.rendered_name }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from the `cache` uses-edge, which must deliver the store's
  # address on the injection context under these keys, or the build halts
  # naming the edge and the inject block to write:
  #   TYK_STORE_HOST - the store's provides.host
  #   TYK_STORE_PORT - the store's provides.port
  #
  # This Recipe reads from infra.overrides:
  #   gateway_image    - map[string]string (the gateway image.* fields; replaces the tag pin)
  #   setup_image      - map[string]string (the directory-setup init container's image fields; replaces the pin)
  #   service_type     - string (the data-plane service type; default ClusterIP)
  #   requests         - { cpu: string, memory: string } (gateway resource requests)
  #   api_secret       - string (the gateway's own API secret; default is a development literal)
  #   storage_database - integer (logical database index on the wired store; default 0)
  #   nodeSelector     - map[string]string
  #   tolerations      - []object
  #
  # The gateway subchart, which renders every resource this Recipe emits,
  # writes no namespace into any of them and offers no value that would; the
  # helm provider places them in the namespace the Release declares, and with
  # none declared they land wherever the tool applying the manifests puts them.
  valuesMapping: |
    {{- /* The credential the `cache` connection carries, or an empty map. */ -}}
    {{- $cacheCredential := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "cache") (hasKey (default dict $edge.features) "credential") -}}
    {{- $cacheCredential = $edge.features.credential -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "cache" (dict "TYK_STORE_HOST" "host" "TYK_STORE_PORT" "port") -}}
    {{- $required := list "cache" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/gateway/tyk %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    {{- /*
      The cache connection over TLS. A cache publishing valkey-tls or redis-tls accepts TLS
      connections alone, so the gateway reaches it over TLS; any other value
      ending in -tls names a cache served over TLS the gateway is not taught to
      reach, and halts rather than connecting in plaintext. A server_ca on the
      connection is mounted into the gateway, so its attachment must name a
      Secret, and it is refused on a cache served without TLS, where no
      handshake takes place to check a certificate in.
    */ -}}
    {{- $cacheTLS := false }}{{ $cacheCA := "" -}}
    {{- range $alias, $edge := .context.uses }}{{ if eq $edge.socket "cache" -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- $edgeTLS := has $proto (list "valkey-tls" "redis-tls") -}}
    {{- if $edgeTLS }}{{ $cacheTLS = true }}{{ else if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the cache connection %s of %q reaches %q, which publishes protocol %s, a cache served over TLS that the Tyk gateway does not reach: it speaks the Redis protocol, over TLS to a cache publishing valkey-tls or redis-tls; wire a Redis-protocol cache to the cache socket" $alias $.context.instance_id $edge.target $proto) -}}
    {{- end -}}
    {{- if hasKey (default dict $edge.features) "server_ca" -}}
    {{- $caProvides := optional (optional (default dict $edge.features) "server_ca" dict) "provides" dict -}}
    {{- if not (and (kindIs "map" $caProvides) (optional $caProvides "name" "")) -}}
    {{- fail (printf "the server_ca on the cache connection %s of %q publishes no Secret name, so no Secret could be mounted into the gateway: attach a server_ca publishing one, such as core/referenced-secret" $alias $.context.instance_id) -}}
    {{- end -}}
    {{- if not $edgeTLS -}}
    {{- fail (printf "the cache connection %s of %q holds a server_ca, but the cache it reaches, %q, publishes protocol %s, served without TLS, so no TLS handshake takes place to check a certificate in: turn client_tls on for that cache, or remove the server_ca" $alias $.context.instance_id $edge.target (default "none" $proto)) -}}
    {{- end -}}
    {{- $cacheCA = $caProvides.name -}}
    {{- end -}}
    {{- end }}{{ end -}}
    ## ── The chart's shared block: what is deployed, and what it talks to ──
    global:
      ## The chart carries the analytics purger and the vendor's Kubernetes
      ## controller as conditional subcharts, both off in the chart's own
      ## defaults. They are restated as off here so the intent is legible in
      ## this file and survives a change to those defaults: this Component is
      ## the gateway and the store it is wired to, and nothing else.
      components:
        pump: false
        operator: false

      ## The port the emitted data-plane Service publishes.
      servicePorts:
        gateway: {{ .infra.port }}

      secrets:
        ## The gateway's own API secret. The chart's default is a placeholder
        ## the reader is expected to replace, so a development literal is set
        ## here instead and an operator supplies their own through
        ## infra.overrides.api_secret. The control API this secret guards is
        ## not exposed by this realization: the chart's control port is off and
        ## the emitted Service carries the data-plane port alone.
        {{- if and .infra.overrides .infra.overrides.api_secret }}
        APISecret: "{{ .infra.overrides.api_secret }}"
        {{- else }}
        APISecret: "tyk-development-secret"
        {{- end }}

      redis:
        ## The store identity resolved from the `cache` uses-edge. The chart
        ## takes a list of addresses; one entry is the single-endpoint form.
        addrs:
          - "{{ $env.TYK_STORE_HOST }}:{{ $env.TYK_STORE_PORT }}"
        storage:
          database: {{ if and .infra.overrides (hasKey .infra.overrides "storage_database") }}{{ .infra.overrides.storage_database }}{{ else }}0{{ end }}
        ## With a credential attached on the `cache` connection, the chart is
        ## pointed at the Secret that credential produced and reads the
        ## password from it, so the material never lands in the rendered
        ## manifest. With nothing attached the password is empty, which is what
        ## the shipped Redis-protocol components expect until a credential is
        ## attached to them as well.
        {{- if $cacheCredential }}
        passSecret:
          name: "{{ $cacheCredential.provides.name }}"
          keyName: "{{ $cacheCredential.provides.key }}"
        {{- else }}
        pass: ""
        {{- end }}
        ## Over TLS the gateway reaches the cache with the chart's own switch,
        ## and checks the cache's certificate, ssl_insecure_skip_verify being
        ## left at its default, false: against the authority in the
        ## connection's server_ca where one is attached — the chart mounts the
        ## Secret it names and points the gateway at its ca.crt — and otherwise
        ## against the image's default trust store. The chart writes the two
        ## TLS version bounds whenever TLS is on, empty unless set, so both are
        ## set to the gateway's documented defaults.
        {{- if $cacheTLS }}
        useSSL: true
        tlsMinVersion: "1.2"
        tlsMaxVersion: "1.3"
        {{- with $cacheCA }}
        secretName: "{{ . }}"
        volumeName: cache-server-ca
        certificatesMountPath: /etc/tyk-gateway/cache-server-ca
        caFile: /etc/tyk-gateway/cache-server-ca/ca.crt
        {{- end }}
        {{- end }}

    ## The chart emits a configuration secret for the controller regardless of
    ## whether the controller subchart is enabled. With the controller off
    ## nothing reads it, so it is turned off and the render carries no resource
    ## belonging to a component this Recipe does not stand up.
    operatorSecret:
      enabled: false

    ## The chart ships a connectivity test pod and its script as test hooks.
    ## They belong to installing the chart by hand rather than to what a Release
    ## renders, so they are off.
    tests:
      enabled: false

    ## ── The gateway subchart ───────────────────────────────────
    tyk-gateway:
      ## Bind the chart's name override to the rendered name so the Service
      ## named by provides.host is the one the render emits.
      fullnameOverride: "{{ .context.rendered_name }}"

      gateway:
        ## ── Gateway image pin ────────────────────────────────────
        ## The chart's own default tag trails the gateway release this
        ## Component targets, so the tag is set here from engine_version.
        ## Override the whole block via infra.overrides.gateway_image.
        {{- if and .infra.overrides .infra.overrides.gateway_image }}
        image:
          {{- range $k, $v := .infra.overrides.gateway_image }}
          {{ $k }}: "{{ $v }}"
          {{- end }}
        {{- else }}
        image:
          repository: docker.tyk.io/tyk-gateway/tyk-gateway
          tag: "{{ .infra.engine_version }}"
        {{- end }}

        ## ── Directory-setup init container image pin ─────────────
        ## The chart runs a second image to create the gateway's working
        ## directories before it starts. It is pinned here rather than left to
        ## the chart, so both images the render names are this Recipe's own
        ## choice. Override the whole block via infra.overrides.setup_image.
        initContainers:
          {{- if and .infra.overrides .infra.overrides.setup_image }}
          setupDirectories:
            {{- range $k, $v := .infra.overrides.setup_image }}
            {{ $k }}: "{{ $v }}"
            {{- end }}
          {{- else }}
          setupDirectories:
            repository: busybox
            tag: "1.32"
          {{- end }}

        ## ── Data-plane listen port ───────────────────────────────
        containerPort: {{ .infra.port }}

        ## ── Data-plane service (client entry point) ──────────────
        ## The default service type keeps the gateway in-cluster, which is
        ## where a consumer wired to it sits.
        service:
          {{- if and .infra.overrides .infra.overrides.service_type }}
          type: "{{ .infra.overrides.service_type }}"
          {{- else }}
          type: ClusterIP
          {{- end }}

        ## ── Upstream public-key pins ─────────────────────────────
        ## Each core/upstream-key-pinning attachment on this gateway names
        ## upstreams and the key accepted from each; its FeatureRecipe
        ## (upstream-key-pinning-tyk) has already refused what this gateway
        ## cannot honour, so every entry here is one upstream and one key.
        ## The entries of every attachment, in attachment-name order and then
        ## in the order each lists them, are joined into the one setting the
        ## gateway reads and handed to the chart's own gateway environment
        ## extension point; the text of each key is carried through unread.
        ## An upstream two attachments both name halts the build, because the
        ## gateway would keep only one of the two keys. An attachment is found
        ## by its type with any version it was authored with set aside, so
        ## core/upstream-key-pinning and core/upstream-key-pinning:1.0.0 are
        ## both read. The setting is emitted as an escaped scalar so material
        ## carrying line breaks reaches the gateway intact. With no such
        ## attachment nothing is emitted here and the render is what it would
        ## be without this block.
        {{- $sep := "" }}
        {{- $pins := "" }}
        {{- $pinned := dict }}
        {{- range $name, $f := (default dict .features) }}
        {{- if eq (first (splitList ":" $f.type)) "core/upstream-key-pinning" }}
        {{- range $pin := $f.infra.pins }}
        {{- if hasKey $pinned $pin.upstream }}
        {{- fail (printf "core/upstream-key-pinning attachments %q and %q on %q both pin the upstream %q, but core/gateway/tyk keeps one key for an upstream, so one of the two would be dropped; name the upstream in one attachment" (get $pinned $pin.upstream) $name $.context.instance_id $pin.upstream) }}
        {{- end }}
        {{- $_ := set $pinned $pin.upstream $name }}
        {{- $pins = printf "%s%s%s:%s" $pins $sep $pin.upstream (first $pin.public_keys) }}
        {{- $sep = "," }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $pins }}
        extraEnvs:
          - name: TYK_GW_SECURITY_PINNEDPUBLICKEYS
            value: {{ $pins | toJson }}
        {{- end }}

        ## ── Gateway resources ────────────────────────────────────
        resources:
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          {{- if and .infra.overrides .infra.overrides.requests }}
          requests:
            cpu: "{{ .infra.overrides.requests.cpu }}"
            memory: "{{ .infra.overrides.requests.memory }}"
          {{- end }}

        ## ── Scheduling overrides ─────────────────────────────────
        {{- if .infra.overrides }}
        {{- if .infra.overrides.nodeSelector }}
        nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
        {{- end }}
        {{- if .infra.overrides.tolerations }}
        tolerations: {{ toJson .infra.overrides.tolerations }}
        {{- end }}
        {{- end }}
