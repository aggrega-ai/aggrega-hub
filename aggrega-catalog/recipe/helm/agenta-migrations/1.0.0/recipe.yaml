apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: agenta-migrations
  version: 1.0.0
  license: MIT
  # The identifier names the terms of the software this Recipe realizes: the
  # image below is the platform's open core, published under the MIT Expat terms
  # its repository states for everything outside one named subtree. That subtree
  # is published under separate terms and is built into a different image, which
  # this Recipe does not pin and offers no knob to select. No single identifier
  # states both situations, so the coarse class covering the product as a whole
  # is carried on the component's component.aggrega.ai/upstream-licensing label
  # rather than asserted here.
  description: >
    The agent workspace's schema-migration step on Kubernetes via the helm
    provider's Workload synthesis, rendered in the run-to-completion form: the
    workload runs once, applies the migration history to both of the platform's
    databases, and exits. It is the only tier of this platform that is not a
    Deployment, and the form is what makes that true rather than a comment
    claiming it — a long-running controller shape would restart the run forever.

    No Service is emitted, and no port: nothing connects to a run that exits.
    Nor is a deadline or a retry count emitted: the workload contract this
    Recipe authors against expresses neither for a run-to-completion form, so
    the run takes whatever the target platform's own defaults are. An installation
    that needs a bounded window for the long case — a first run against an empty
    database, which applies the whole history — sets it on the emitted resource
    at the target.

    The backend identity resolved from the `backend` uses-edge arrives on
    .context.inject.env and is composed here into the two connection strings
    the migration runner reads, one per database named on that edge. The
    connections are rendered password-free: the password arrives beside them as
    an env secret reference and is named inside each URL in the platform's own
    runtime-substitution form. This Recipe publishes no provides contract,
    because the component declares none.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/agenta-migrations:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Target-expected names: the migration runner reads POSTGRES_URI_CORE and
  # POSTGRES_URI_TRACING for the two databases it migrates, and
  # ALEMBIC_AUTO_MIGRATIONS for whether it applies what it finds or only reports
  # it.
  #
  # The names the edge delivers on are read here as BACKEND_HOST, BACKEND_PORT
  # and BACKEND_USER. Those are the `in:` keys the uses-edge must be set to, and
  # the component's socket comment states the same contract on the authoring
  # side.
  #
  # POSTGRES_PASSWORD is named inside both URLs in the $(POSTGRES_PASSWORD)
  # form, which the platform's own container runtime expands from the variable of
  # that name delivered beside it.
  provides: {}
  workload: |
    {{- /* The alias of the `backend` connection carrying a credential, or empty. */ -}}
    {{- $backendCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}
    {{- $backendCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "BACKEND_HOST" "host" "BACKEND_PORT" "port" "BACKEND_USER" "user") -}}
    {{- $required := list -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/agenta-migrations %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # A single run to completion, not a resident workload: the step applies the
    # schema and exits, so the run-to-completion form is the correct one and a
    # controller shape would restart it forever. No services key and no ports:
    # nothing connects to it.
    form: task
    containers:
      main:
        image: "ghcr.io/agenta-ai/agenta-api:{{ .infra.engine_version }}"
        # The migration history ships inside the platform image, so this step
        # runs the same image the services do under its own entry point — which
        # is why they pin the same engine_version.
        command: ["python", "-m", "entrypoints.alembic_runner"]
        variables:
          AGENTA_LICENSE: oss
          AGENTA_LOG_LEVEL: "{{ .infra.log_level }}"
          # Apply what the databases are behind on, or report it and change
          # nothing.
          ALEMBIC_AUTO_MIGRATIONS: "{{ .values.apply_on_start }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "backend" }}
          POSTGRES_URI_CORE: "postgresql+asyncpg://{{ $env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $env.BACKEND_HOST }}:{{ $env.BACKEND_PORT }}/{{ $edge.values.core_database }}"
          POSTGRES_URI_TRACING: "postgresql+asyncpg://{{ $env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $env.BACKEND_HOST }}:{{ $env.BACKEND_PORT }}/{{ $edge.values.tracing_database }}"
    {{- end }}
    {{- end }}
    {{- if not $backendCredential }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
    {{- with $backendCredential }}
        attachments:
          POSTGRES_PASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
