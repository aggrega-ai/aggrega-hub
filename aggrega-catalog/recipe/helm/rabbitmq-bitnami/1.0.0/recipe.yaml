apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: rabbitmq-bitnami
  version: 1.0.0
  description: >
    RabbitMQ via Bitnami Helm chart (bitnami/rabbitmq). RabbitMQ is a durable
    message broker, so the chart renders a StatefulSet with a persistent
    volume. Authentication is wired through the component's optional password
    slot: when a credential is attached its value arrives on the env pipe and
    is set as the broker's application-user password (auth.password); when none
    is attached the Recipe falls back to a deterministic inline development
    default so the render stays reproducible. The Erlang cookie is likewise
    pinned to a deterministic inline default rather than letting the chart
    generate a fresh random value on every render. Default chart version in
    source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/messaging/rabbitmq:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/rabbitmq
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"16.0.14\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "amqp"

  # This Recipe reads from infra.overrides:
  #   image                - map[string]string (chart image.* fields)
  #   global_storage_class - string (chart global.storageClass)
  #   requests             - { cpu: string, memory: string } (resource requests)
  #   nodeSelector         - map[string]string
  #   tolerations          - []object
  #   affinity             - object
  #   service_type         - string (service type)
  #   metrics              - { enabled: bool, image: map[string]string }
  valuesMapping: |
    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- if .infra.overrides.global_storage_class }}
    global:
      storageClass: "{{ .infra.overrides.global_storage_class }}"
    {{- end }}
    {{- end }}

    ## ── Authentication (optional credential slot) ──────────────
    ## RabbitMQ always authenticates. The application user is provisioned from
    ## the developer value; its password comes from the optional `password`
    ## slot when filled, otherwise a deterministic inline development default
    ## (the chart would otherwise generate a fresh random password on every
    ## render). The Erlang cookie is pinned to a deterministic inline default
    ## for the same reason.
    auth:
      username: "{{ .values.username }}"
      {{- if and .context.inject.env .context.inject.env.RABBITMQ_PASSWORD }}
      password: "{{ .context.inject.env.RABBITMQ_PASSWORD }}"
      {{- else }}
      password: devpass
      {{- end }}
      erlangCookie: devErlangCookieChangeMe

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      amqp: {{ .infra.port }}
      manager: {{ .infra.management_port }}
    service:
      ports:
        amqp: {{ .infra.port }}
        manager: {{ .infra.management_port }}
      {{- if .infra.overrides }}
      {{- if .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- end }}
      {{- end }}

    ## ── Persistence (durable broker) ───────────────────────────
    persistence:
      enabled: true
      size: "{{ .infra.storage.size }}"
      storageClass: "{{ .infra.storage.type }}"
      accessModes:
        - ReadWriteOnce

    ## ── Resources ──────────────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if .infra.overrides }}
      {{- if .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- if .infra.overrides.affinity }}
    affinity: {{ toJson .infra.overrides.affinity }}
    {{- end }}
    {{- end }}

    ## ── Metrics ────────────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.metrics }}
    metrics:
      enabled: true
      {{- if .infra.overrides.metrics.image }}
      image:
        {{- range $k, $v := .infra.overrides.metrics.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/rabbitmq
      version: 16.0.14
      digest: sha256:df625220cafdfe892e68c1b3f1a5500049acd227fe90b2deca04df13190a176b
      manifestDigest: sha256:53769713d29cd8d9af4f1d3dfc9d02cc2fc9bd517c68bf65cefc6da99fb10f94
