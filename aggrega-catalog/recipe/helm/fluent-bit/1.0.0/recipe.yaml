apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: fluent-bit
  version: 1.0.0
  license: Apache-2.0
  description: >
    Fluent Bit log forwarder on Kubernetes via the helm provider's Workload
    synthesis, running the official upstream fluent/fluent-bit image directly
    (no external Helm chart). The sink host and port resolved from the
    `forward_target` uses-edge arrive on .context.inject.env and are written into
    a minimal fluent-bit.conf `forward` output at start-up, so the forwarder
    ships records to that sink; Fluent Bit is then exec'd against that config
    with its monitoring endpoint bound to the infra port, which also serves its
    metrics in the Prometheus format at /api/v2/metrics/prometheus, published
    as provides.metrics_endpoint. Fluent Bit holds no
    persistent state, so it renders as a stateless Deployment. provides.host is
    the bare, self-contained in-cluster service name of the synthesized ClusterIP
    Service — it carries no namespace, so the recipe is independent of where it
    is deployed; a consumer in another namespace qualifies the host with the
    target namespace on its own side (caller-side routing). Reach for this
    realization where the build must complete with nothing fetched, or where a
    single forwarding pod with its own declared input is what is wanted; reach
    for `fluent-bit-chart`, which renders the official Fluent chart, where a
    chart repository is reachable and records are to be collected from the
    cluster's own nodes — that realization carries the per-node collector shape
    and the cluster read grants this one does not carry. The Fluent Bit
    server is Apache-2.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/fluent-bit:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "http" — the
  # Fluent Bit monitoring endpoint speaks HTTP.
  #
  # metrics_endpoint is the address Fluent Bit serves its own metrics at, in the
  # Prometheus format: /api/v2/metrics/prometheus on the monitoring endpoint,
  # which the HTTP_Server line of the configuration below switches on, asking
  # no credential. It is spelled out in full on purpose: a provides entry
  # cannot read another. One pod stands behind it, so the one address reaches
  # all of it, and the service-discovery facts — the Service, its port name and
  # the path — are published empty.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
    metrics_endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}/api/v2/metrics/prometheus"
    metrics_service: ""
    metrics_service_port: ""
    metrics_path: ""

  # The forward output below speaks the Fluentd forward protocol to whatever is
  # wired on forward_target, a socket whose selector admits any server. The
  # check that each wired sink publishes forward lives in the TargetProtocol
  # library's Check bundle, imported under artifacts by every Recipe of this
  # Component. These locals are what it reads — the socket, the protocol, why
  # Fluent Bit needs it and a component publishing it — and it stops the build,
  # naming the connection, on a sink publishing another protocol or none. It
  # writes no file.
  locals:
    check_socket: forward_target
    check_protocol: forward
    check_reason: "Fluent Bit ships its records through a forward output, which speaks the Fluentd forward protocol a sink publishes as the protocol forward"
    check_example: core/observability/fluentd
  artifacts:
    target-protocol:
      $import: TargetProtocol#/artifacts/Check

  workload: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "forward_target" (dict "FLUENT_FORWARD_HOST" "host" "FLUENT_FORWARD_PORT" "port") -}}
    {{- $required := list "forward_target" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/observability/fluent-bit %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # Fluent Bit holds no durable state, so the default stateless form (a
    # Deployment on the helm provider) is correct — no persistent volume.
    replicas: 1
    containers:
      main:
        image: "fluent/fluent-bit:{{ .infra.engine_version }}"
        # The sink resolved from the `forward_target` uses-edge arrives on the
        # inject pipe (.context.inject.env) and is written into the
        # fluent-bit.conf forward output at start-up, then Fluent Bit is exec'd
        # against that config with its monitoring endpoint bound to the infra
        # port.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/fluent-bit.conf <<'EOF'
            [SERVICE]
                Flush        1
                Log_Level    info
                HTTP_Server  On
                HTTP_Listen  0.0.0.0
                HTTP_Port    {{ .infra.port }}
                Health_Check On
            [INPUT]
                Name   dummy
                Dummy  {"message": "log record from fluent-bit"}
            [OUTPUT]
                Name   forward
                Match  {{ .values.forward_match }}
                Host   {{ $env.FLUENT_FORWARD_HOST }}
                Port   {{ $env.FLUENT_FORWARD_PORT }}
            EOF
            exec /fluent-bit/bin/fluent-bit -c /tmp/fluent-bit.conf
        ports:
          http: {{ .infra.port }}
        # Fluent Bit serves its health check at /api/v1/health on the monitoring
        # port once Health_Check is on in the [SERVICE] block above: it answers
        # an error while the outputs' failed flushes and retries exceed their
        # limits. The root path answers whenever the monitoring server runs. As
        # in the product's own chart, readiness asks the health check and
        # liveness asks the root path.
        health:
          ready:
            http: /api/v1/health
          live:
            http: /
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
