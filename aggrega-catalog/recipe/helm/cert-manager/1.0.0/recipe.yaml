apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: cert-manager
  version: 1.0.0
  license: Apache-2.0
  description: >
    cert-manager TLS-certificate lifecycle controller via the official
    cert-manager Helm chart, sourced from the jetstack OCI registry. The chart
    deploys the controller that reconciles Certificate and Issuer resources, a
    webhook that validates and defaults cert-manager's custom resources, and a
    CA injector that wires the webhook's CA bundle into the cluster, together
    with their RBAC, the webhook Service, the admission-webhook configurations,
    and a post-install startup check that confirms the certificate API is
    serving. When the Component's install_crds value is on, the chart also
    installs the cert-manager CustomResourceDefinitions. This Recipe pins the
    controller, webhook, CA-injector, startup-check, and ACME-solver container
    images to explicit release tags for reproducible renders. Default chart
    version in source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/cert-manager:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://quay.io/jetstack/charts/cert-manager
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"v1.21.0\" }}"

  # This Recipe reads from infra.overrides:
  #   controller_image      - map[string]string (image.* fields; overrides the tag pin)
  #   webhook_image         - map[string]string (webhook.image.* fields; overrides the tag pin)
  #   cainjector_image      - map[string]string (cainjector.image.* fields; overrides the tag pin)
  #   startupapicheck_image - map[string]string (startupapicheck.image.* fields; overrides the tag pin)
  #   acmesolver_image      - map[string]string (acmesolver.image.* fields; overrides the tag pin)
  #   requests              - { cpu: string, memory: string } (resource requests, applied to every long-running workload)
  #   log_level             - integer (global.logLevel; controller verbosity, 0-6)
  #   cluster_resource_namespace - string (clusterResourceNamespace; where ClusterIssuer credentials are read)
  #   nodeSelector          - map[string]string (applied to every long-running workload)
  #   tolerations           - []object (applied to every long-running workload)
  valuesMapping: |
    ## ── CRD installation (Developer intent) ────────────────────
    ## Installs the cert-manager custom resource definitions with the
    ## release when on. Turn off when the CRDs are managed out of band.
    crds:
      enabled: {{ .values.install_crds }}

    ## ── Cluster-wide controller settings ───────────────────────
    {{- if and .infra.overrides (hasKey .infra.overrides "log_level") }}
    global:
      logLevel: {{ .infra.overrides.log_level }}
    {{- end }}
    {{- if and .infra.overrides .infra.overrides.cluster_resource_namespace }}
    clusterResourceNamespace: "{{ .infra.overrides.cluster_resource_namespace }}"
    {{- end }}

    ## ── Controller ─────────────────────────────────────────────
    ## The controller reconciles Certificate and Issuer resources. Its image is
    ## the chart's top-level image block; pin explicitly for a reproducible
    ## render. Override the whole image block via infra.overrides.controller_image.
    {{- if and .infra.overrides .infra.overrides.controller_image }}
    image:
      {{- range $k, $v := .infra.overrides.controller_image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      repository: quay.io/jetstack/cert-manager-controller
      tag: v1.21.0
    {{- end }}

    ## ── Controller resources ───────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Controller scheduling ──────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

    ## ── ACME solver image ──────────────────────────────────────
    ## The controller launches this image to solve ACME HTTP-01 challenges.
    acmesolver:
      {{- if and .infra.overrides .infra.overrides.acmesolver_image }}
      image:
        {{- range $k, $v := .infra.overrides.acmesolver_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.0
      {{- end }}

    ## ── Webhook ────────────────────────────────────────────────
    ## Validates and defaults cert-manager's custom resources.
    webhook:
      {{- if and .infra.overrides .infra.overrides.webhook_image }}
      image:
        {{- range $k, $v := .infra.overrides.webhook_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        tag: v1.21.0
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── CA injector ────────────────────────────────────────────
    ## Injects the webhook's CA bundle into the admission configurations.
    cainjector:
      {{- if and .infra.overrides .infra.overrides.cainjector_image }}
      image:
        {{- range $k, $v := .infra.overrides.cainjector_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.0
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── Startup API check ──────────────────────────────────────
    ## Post-install hook Job that blocks until the certificate API is serving.
    startupapicheck:
      {{- if and .infra.overrides .infra.overrides.startupapicheck_image }}
      image:
        {{- range $k, $v := .infra.overrides.startupapicheck_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        repository: quay.io/jetstack/cert-manager-startupapicheck
        tag: v1.21.0
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://quay.io/jetstack/charts/cert-manager
      version: v1.21.0
      digest: sha256:9c2c6fabf3cf8fe14dacb016f37c819b66bc2c79e8b7acde4573d45ec141fb97
      manifestDigest: sha256:cd55fea42658e54abc25e85a0bc1de229925a5006445f916bfd2c6dc80ac3613
