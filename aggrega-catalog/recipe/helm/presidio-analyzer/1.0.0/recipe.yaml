apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: presidio-analyzer
  version: 1.0.0
  license: MIT
  description: >
    The Presidio analyzer on Kubernetes via the helm provider's Workload
    synthesis, running the vendor's published image directly: a stateless
    Deployment plus a ClusterIP Service on the port the service answers on.
    Synthesized rather than wrapping a chart because the project publishes no
    maintained one — the chart in its repository is a sample that floats its
    image tag and declares no health checks. The service keeps no state, so it
    renders no volume. The listen port is handed to the image through the PORT
    variable it reads, from the same infra.port the Service and the published
    address read. The image loads its English language model before it
    answers anything, which is why readiness is first asked only after the
    grace period the image itself declares. provides.host is the bare,
    self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so the recipe is independent of where it is deployed.
    A consumer in another namespace qualifies the host with the target
    namespace on its own side (caller-side routing). The image is published
    under the MIT licence.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/presidio-analyzer:1.0.0
  # provides is evaluated before the workload and cannot read it, so the port has
  # one authored home in .infra.port that every reader dereferences — provides.port
  # and provides.endpoint here, and below the PORT variable the image listens on,
  # the container port and the Service; the literal is never repeated.
  #
  # host and endpoint spell the Service name out twice on purpose. A provides
  # entry cannot read another provides entry, and the name has to match the
  # Service the helm provider derives from the service key below, so there is no
  # home either could dereference instead — the repetition is forced, not a
  # choice, and the two must be edited together. endpoint carries no path: a
  # caller appends the route it posts to.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/data-privacy-stack/presidio-analyzer:{{ .infra.engine_version }}"
        # The image's entrypoint serves on the port named by PORT, so the listen
        # port is set here from its single authored home.
        variables:
          PORT: "{{ .infra.port }}"
        ports:
          http: {{ .infra.port }}
        # The image declares one health check: GET /health every 30 s with a 3 s
        # timeout and three retries, after a 30 s start period, and the
        # project's own compose file gives the service the same check. It is
        # read here as readiness, with those timings. The product declares no
        # check that restarts the service, so no liveness probe is declared
        # either.
        health:
          ready:
            http: /health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
        # Quoted because a quantity is a string: a whole-core count authored as
        # a bare number would otherwise be read as an integer and refused.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
