apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: dify-worker
  version: 1.0.0
  # metadata.license is deliberately absent. The Dify platform this Recipe
  # realizes is published under a modified Apache License 2.0 carrying
  # additional conditions, and no single SPDX identifier names those terms; the
  # licensing class sits on the Component's upstream-licensing label. The
  # SPDX header at the top of this file states the terms of the file itself.
  description: >
    The Dify task worker on Kubernetes via the helm provider's Workload
    synthesis. The worker runs the same image as the API server under a
    different MODE, takes its work from the Celery broker rather than from a
    listening socket, and therefore renders as a stateless Deployment with no
    ports and no Service — nothing connects to it, so it publishes nothing.

    The backend, cache, vector-store, sandbox, plugin-runtime and proxy
    identities resolved from the component's uses-edges arrive on
    .context.inject.env. The backend and cache identities pass through under
    the names the worker itself reads; the vector-store edge is translated
    according to the driver named on that edge, and the sandbox, plugin-runtime
    and proxy edges are composed into the single URL each subsystem is addressed
    by. The worker's vector-store driver and index prefix match the API
    server's, because the two write the same collections.

    The backend password, the application secret and the sandbox execution key
    each come from a credential when one is attached and from an inline
    development default otherwise; the internal handshake secrets the worker
    shares with the plugin runtime are pinned shared development literals
    matching the literals the other Recipes in this stack pin. These defaults
    are for evaluation and local development.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/dify-worker:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # The worker publishes no provides contract: it is reached through the broker
  # rather than over the network, so there is no address for a consumer to read.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The worker holds no durable state — its queue lives in the cache and its
    # results in the backend and the vector datastore — so the stateless form (a
    # Deployment on the helm provider) is correct. No ports and no services: the
    # worker opens no listening socket.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "langgenius/dify-api:{{ .infra.engine_version }}"
        # MODE selects the worker role of the shared API image.
        variables:
          MODE: worker
          LOG_LEVEL: "{{ .infra.log_level }}"
          # The migration flag is read ahead of the mode, so it would apply to
          # the worker exactly as it does to the API server. It is false here
          # because the API server is the single place that applies the schema
          # upgrade: a worker with it set true would run the same upgrade at the
          # same time.
          MIGRATION_ENABLED: "false"
          CELERY_WORKER_AMOUNT: "{{ .infra.concurrency }}"
          # The backend identity arrives on the inject pipe under the names the
          # worker itself reads, so these pass through untranslated.
          DB_TYPE: postgresql
          DB_HOST: "{{ .context.inject.env.DB_HOST }}"
          DB_PORT: "{{ .context.inject.env.DB_PORT }}"
          DB_USERNAME: "{{ .context.inject.env.DB_USERNAME }}"
          DB_DATABASE: "{{ .context.inject.env.DB_DATABASE }}"
          REDIS_HOST: "{{ .context.inject.env.REDIS_HOST }}"
          REDIS_PORT: "{{ .context.inject.env.REDIS_PORT }}"
          CELERY_BACKEND: redis
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "cache" }}
          REDIS_DB: "{{ $edge.values.db_index }}"
          CELERY_BROKER_URL: "redis://{{ $.context.inject.env.REDIS_HOST }}:{{ $.context.inject.env.REDIS_PORT }}/{{ $edge.values.broker_db_index }}"
    {{- end }}
    {{- end }}
          # The vector-store edge is translated: the driver named on the edge
          # decides which variables carry the store's address.
          VECTOR_INDEX_NAME_PREFIX: "{{ .values.vector_index_prefix }}"
          INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "{{ .values.indexing_max_segmentation_tokens }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
          VECTOR_STORE: "{{ $edge.values.engine }}"
    {{- if eq $edge.values.engine "weaviate" }}
          WEAVIATE_ENDPOINT: "http://{{ $.context.inject.env.VDB_HOST }}:{{ $.context.inject.env.VDB_PORT }}"
          WEAVIATE_GRPC_ENDPOINT: "grpc://{{ $.context.inject.env.VDB_HOST }}:{{ $.context.inject.env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- if eq $edge.values.engine "qdrant" }}
          QDRANT_URL: "http://{{ $.context.inject.env.VDB_HOST }}:{{ $.context.inject.env.VDB_PORT }}"
          QDRANT_GRPC_PORT: "{{ $.context.inject.env.VDB_GRPC_PORT }}"
    {{- end }}
    {{- end }}
    {{- end }}
          CODE_EXECUTION_ENDPOINT: "http://{{ .context.inject.env.SANDBOX_HOST }}:{{ .context.inject.env.SANDBOX_PORT }}"
          PLUGIN_DAEMON_URL: "http://{{ .context.inject.env.PLUGIN_DAEMON_HOST }}:{{ .context.inject.env.PLUGIN_DAEMON_PORT }}"
          SSRF_PROXY_HTTP_URL: "http://{{ .context.inject.env.SSRF_PROXY_HOST }}:{{ .context.inject.env.SSRF_PROXY_PORT }}"
          SSRF_PROXY_HTTPS_URL: "http://{{ .context.inject.env.SSRF_PROXY_HOST }}:{{ .context.inject.env.SSRF_PROXY_PORT }}"
          # Pinned shared development literals, matching the literals the API
          # server and the plugin-runtime Recipes pin, so the three agree with
          # no external secret. A production deployment overrides them.
          PLUGIN_DAEMON_KEY: dify-plugin-daemon-server-key
          INNER_API_KEY_FOR_PLUGIN: dify-plugin-inner-api-key
    {{- if not (hasKey (default dict .features) "password") }}
          DB_PASSWORD: apppass
    {{- end }}
    {{- if not (hasKey (default dict .features) "secret_key") }}
          SECRET_KEY: dify-development-secret-key-evaluation-only
    {{- end }}
    {{- if not (hasKey (default dict .features) "code_execution_key") }}
          CODE_EXECUTION_API_KEY: dify-sandbox
    {{- end }}
    {{- if or (hasKey (default dict .features) "password") (hasKey (default dict .features) "secret_key") (hasKey (default dict .features) "code_execution_key") }}
        attachments:
    {{- if hasKey (default dict .features) "password" }}
          DB_PASSWORD:
            from: password
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "secret_key" }}
          SECRET_KEY:
            from: secret_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "code_execution_key" }}
          CODE_EXECUTION_API_KEY:
            from: code_execution_key
            as: env
    {{- end }}
    {{- end }}
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the deployment supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
