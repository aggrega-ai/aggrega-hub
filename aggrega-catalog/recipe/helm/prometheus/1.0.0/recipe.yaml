apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: prometheus
  version: 1.0.0
  license: Apache-2.0
  description: >
    Prometheus metrics server on Kubernetes via the helm provider's Workload
    synthesis, running the official upstream prom/prometheus image (no external
    Helm chart). Prometheus persists its time-series database to disk, so it
    renders as a StatefulSet with a per-replica data volume, a Headless Service
    for stable network identity, and a ClusterIP Service for queries. Each
    connection on the `scrape_target` uses-socket becomes one job in a minimal
    prometheus.yml the container writes at start-up: the host and port that
    connection's target publishes are the job's address, and the connection's
    own `values` set that job's label, cadence and metrics path.
    provides.host is the bare, self-contained in-cluster service name of the
    synthesized ClusterIP Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing). Reach for this realization where the build must complete with
    nothing fetched, or where no chart repository is reachable from it; reach for
    `prometheus-chart`, which renders the prometheus-community chart, where a
    chart repository is reachable and the server is expected to discover targets
    from the cluster itself — that realization carries the cluster-scoped read
    grants this one has no way to declare.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/prometheus:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form (rendered as a
    # volumeClaimTemplate), and the Headless service supplies the StatefulSet's
    # stable network identity.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "prom/prometheus:{{ .infra.engine_version }}"
        # Every component wired on the `scrape_target` socket becomes one scrape
        # job: its resolved host and port from the enriched topology pipe are the
        # job's target, and the edge's per-connection values tune the job's
        # label, cadence, and metrics path. The rendered prometheus.yml is
        # written at start-up, then Prometheus is exec'd against it with the
        # time-series database on the data volume.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/prometheus.yml <<'EOF'
            global: {}
            scrape_configs:
            {{- range $alias, $edge := .context.uses }}
            {{- if eq $edge.socket "scrape_target" }}
            {{- $v := default (dict) $edge.values }}
            {{- /* job_name keeps a template fallback because its default is the
                   edge alias — per-edge context, which no static value in the
                   socket's valueSchema can express. Leave it here. The two keys
                   below take their defaults from that valueSchema, so they read
                   the edge value directly and this template holds no second
                   copy of them. */}}
              - job_name: {{ default $alias (get $v "job_name") }}
                scrape_interval: {{ get $v "scrape_interval" }}
                metrics_path: {{ get $v "metrics_path" }}
                static_configs:
                  - targets:
                      - {{ $edge.provides.host }}:{{ $edge.provides.port }}
            {{- end }}
            {{- end }}
            EOF
            exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.listen-address=0.0.0.0:{{ .infra.port }}
        ports:
          http: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /prometheus
    volumes:
      data:
        persistentTemplate:
          size: "{{ if .infra.storage }}{{ .infra.storage.size | default "8Gi" }}{{ else }}8Gi{{ end }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
