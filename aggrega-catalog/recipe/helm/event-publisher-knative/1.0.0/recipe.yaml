apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: event-publisher-knative
  version: 1.0.0
  license: Apache-2.0
  description: >
    The event-publishing tool realized as a Knative Service the Knative
    Serving control plane reconciles. The recipe emits a single Service custom
    resource; the control plane turns it into a revision, admits an inbound
    call while that revision runs no replicas, and sets the replica count from
    the concurrency it observes, so the tool occupies no compute between the
    calls that invoke it. The replica floor and ceiling carry through as the
    revision's own scaling bounds. The broker the tool publishes to arrives on
    the tool's messaging socket, and the recipe delivers that broker's host,
    port and protocol into the container alongside the developer's topic, so
    the running tool addresses the broker the topology resolved rather than one
    named in its own configuration. A connection writing an `inject:` block
    receives instead the names it dictates, as variables or as files from a
    ConfigMap emitted beside the Service. A server_ca on the connection is
    mounted read-only and named as EVENT_TOOL_BROKER_SERVER_CA_FILE, and is
    refused on a broker served without TLS. provides is the addressable name the
    control plane gives the Service. The Knative Serving control plane is a
    runtime prerequisite: the build halts unless the operator affirms it is
    installed (infra.control_plane_present), so no custom resource is emitted
    into a cluster that cannot reconcile it.
    The component's own `inject:` block delivers its entries as a connection's
    are, and one reading a value of the tool alone replaces that value's default
    name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/event-publisher:1.0.0
  # A Knative Service is addressable in its own namespace under the Service's
  # own name, on port 80, and the control plane routes from there to the
  # revision's container port. provides.host is therefore that bare in-cluster
  # name with no namespace segment, so the recipe is independent of where it is
  # deployed; a consumer in another namespace qualifies it on its own side
  # (caller-side routing). provides.port is 80 rather than infra.port because
  # 80 is what a caller connects to — infra.port is where the container listens
  # behind the control plane's routing, and only the container spec below reads
  # it.
  provides:
    host: "{{ .context.instance_id }}"
    port: "80"
    endpoint: "http://{{ .context.instance_id }}"
    protocol: "http"
  assertions:
    # The Knative Serving control plane must exist in the target cluster before
    # a Serving custom resource can reconcile. The compiler cannot inspect
    # cluster state, so the prerequisite is declared: an operator affirms it in
    # the Release, and an unaffirmed build halts here rather than emitting an
    # orphan custom resource.
    knative_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Knative Serving control plane must be installed in the target cluster before this realization emits its Knative Service; once Knative Serving is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the tool in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered revision would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered revision would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads from infra.overrides:
  #   annotations - map[string]string (added to the revision template's annotations)
  #
  # The key exists because the control plane reads its per-revision switches
  # from the revision's annotations, and which switches an installation offers
  # belongs to the installed control-plane version rather than to this catalog.
  # The two scaling bounds are not among them: they come from infra.min_replicas
  # and infra.max_replicas.
  #
  # The tool's own values and the broker's coordinates are both delivered to the
  # container as environment variables. The image is the Release's, so no
  # upstream documentation names a spelling for them; the recipe delivers each
  # under a stable default name for the application's own code to read. The two
  # optional values are emitted only when the developer set them, so an unset
  # value renders no variable rather than an empty one.
  #
  # The broker's host, port and protocol are read off the messaging socket's
  # own edge rather than from a value on the tool, which is what makes the
  # destination the topology's to decide: the edge is found by matching the
  # socket name the component declares, so the alias the developer chose for
  # the connection does not reach this template. Several edges taking those
  # defaults would each deliver a broker under the same variable names, leaving
  # undefined which one the tool publishes the topic to, so the template halts
  # and names two of the connections rather than emitting an artifact whose
  # behaviour the author did not choose. A target the socket admits may still
  # publish no host or port — a messaging control plane such as an operator
  # is reached at no address — so the template halts on a connection taking
  # the defaults to such a target, naming the connection, the target and the
  # key it does not publish, rather than delivering an empty broker address.
  #
  # The image is the tool's own code, so the broker variables above are
  # defaults: a connection that writes no inject block receives them, and a
  # connection that writes one receives exactly what it dictates instead — the
  # broker's host, port, protocol or any other key the broker publishes, under
  # the names that code reads — so the halt on several edges counts only the
  # connections taking the defaults. An edge on a socket the component does not
  # declare has no defaults and receives what it dictates. A dictated env entry
  # becomes an entry of the container's env under the name it gives, read off
  # the inject pipe as a map; a dictated file entry a read-only file at the
  # absolute path it names, held in one ConfigMap and mounted by subPath, so a
  # path that is not absolute, or one lying beneath another file's path, is
  # refused. An arg entry is refused, because this recipe renders no command
  # line: Knative takes a container's arguments in place of the image's default
  # command, which is the Release's. Any other mechanism is refused too. A
  # dictated variable named like one this recipe delivers itself — a value of
  # the tool's own, or another connection's default — halts the build, naming
  # both, since the compiler cannot see the names a recipe writes.
  #
  # A broker serving TLS publishes a protocol saying so — kafka-ssl from a Kafka
  # broker with infra.client_tls on, amqps from RabbitMQ on Amazon MQ — and the
  # default connection delivers it as EVENT_TOOL_BROKER_PROTOCOL, from which the
  # tool's code learns to connect over TLS. The connection's server_ca slot
  # carries the authority the code checks the broker's certificate against. A
  # filled slot becomes a volume of the whole Secret its attachment publishes by
  # name, and a read-only mount of that volume, which Knative Serving requires
  # of a Secret volume, at a fixed directory; the volume lists no items, so
  # every data key becomes a file named by the key, and
  # EVENT_TOOL_BROKER_SERVER_CA_FILE names its ca.crt. The data key the
  # attachment publishes is not read. Both are delivered on a connection writing
  # an inject block too, since they come from the connection's attachment, which
  # no inject entry can name; a dictated file at, beneath or above the mount
  # directory, and a dictated variable of that name, are refused. A connection
  # holding no server_ca renders exactly what it renders with no such slot at
  # all. The template halts, naming the connection, on a server_ca whose
  # attachment publishes no Secret name, on one whose broker publishes a
  # protocol the catalog's messaging components serve without TLS — kafka, amqp,
  # nats, ws or sip — since no handshake would take place to check a certificate
  # in, and on server_ca held on two connections, since one container holds one
  # such variable and one such mount. A broker publishing no protocol is not
  # judged here. The Service names the Secret and never its content. Of the
  # Secret realizations, k8s-existing-secret is the one that fills the slot
  # here: one naming its Secret after the host halts, since this recipe renders
  # from an artifacts template, which gives the tool no rendered name.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, and its env and file entries reach the
  # container as a connection's do: each env entry under the name it gives,
  # read off the inject pipe, and each file at the absolute path it names, from
  # the same ConfigMap and checked as a connection's file is. The names this
  # recipe gives the tool's own values are defaults: each is rendered, and kept
  # from a connection, only while no entry of that block, in either mechanism,
  # delivers its value. The templates read that at .context.self_inject, which
  # maps each name the developer wrote to values.<key> for an entry whose
  # template reads that one own value. A refusal about one of that block's
  # entries names the block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. The connections
  # and that block only record who dictates each name and each file, and each
  # refusal runs once over both, naming the one that dictated it. It is part of
  # an artifact or a workload template, and no catalog kind holds part of one
  # for several Recipes to share; a change to it is made to all of them.
  #
  # event-publisher-knative-files.configmap.yaml holds the file entries the
  # connections and the component's own inject block dictate, keyed file-0,
  # file-1 and so on in path order, the keys the Service's mounts read, and is
  # emitted only while either one dictates a file, so a build with none renders
  # nothing there. It names no namespace, as the Service names none, so the two
  # are applied into one namespace together. The block reading the connections'
  # inject directives is the one every Knative realization of a tool in this
  # catalog declares, differing only in the names each delivers itself and the
  # refusals its own connections call for; a change to it is made to all.
  artifacts:
    event-publisher-knative-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-files
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson (toString $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
    service.yaml: |
      {{- $serverCaVolume := "target-messaging-server-ca" -}}
      {{- $serverCaDir := "/var/run/secrets/event-tool/target-messaging/server-ca" -}}
      {{- $plaintext := list "kafka" "amqp" "nats" "ws" "sip" -}}
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      {{- $named := dict -}}
      {{- $ownEnv := dict -}}
      {{- $ownFile := dict -}}
      {{- range $mechanism, $names := default dict .context.self_inject -}}
      {{- range $name, $key := $names -}}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end -}}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end -}}
      {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $dictating := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- range $mechanism, $entries := (default dict $edge.inject) -}}
      {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $wired := list -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if and (eq $edge.socket "target_messaging") (not (hasKey $dictating $alias)) -}}
      {{- $wired = append $wired $alias -}}
      {{- end -}}
      {{- end -}}
      {{- if gt (len $wired) 1 -}}
      {{- fail (printf "the target_messaging connections %s and %s of %q write no inject block, so each would hand the tool its broker under the same variable names, leaving undefined which broker the tool publishes to: write an inject block on all but one of them, dictating the names the tool's code reads for each broker, or leave one edge on target_messaging and declare a second event-publishing component for a second broker" (index $wired 0) (index $wired 1) .context.instance_id) -}}
      {{- end -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if and (eq $edge.socket "target_messaging") (not (hasKey $dictating $alias)) -}}
      {{- range $key := list "host" "port" -}}
      {{- if not (optional (default dict $edge.provides) $key "") -}}
      {{- fail (printf "the target_messaging connection %s of %q reaches %q, which publishes no %s, and a connection writing no inject block hands the tool the broker's host and port: wire target_messaging to a broker that publishes both, or write an inject block on that connection dictating what the tool's code reads to reach the broker" $alias $.context.instance_id $edge.target $key) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $caHolder := "" -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if and (eq $edge.socket "target_messaging") (hasKey (default dict $edge.features) "server_ca") -}}
      {{- $locator := optional (optional (default dict $edge.features) "server_ca" dict) "provides" dict -}}
      {{- if not (and (kindIs "map" $locator) (optional $locator "name" "")) -}}
      {{- fail (printf "the server_ca on the target_messaging connection %s of %q publishes no Secret name, so no Secret could be mounted into the tool's container: attach a server_ca publishing one, such as core/referenced-secret" $alias $.context.instance_id) -}}
      {{- end -}}
      {{- $proto := optional (default dict $edge.provides) "protocol" "" -}}
      {{- if has (toString $proto) $plaintext -}}
      {{- fail (printf "the target_messaging connection %s of %q holds a server_ca, but the broker it reaches, %q, publishes protocol %s, served without TLS, so no TLS handshake takes place to check a certificate in: turn TLS on for that broker, such as infra.client_tls on a Kafka broker, or remove the server_ca" $alias $.context.instance_id $edge.target $proto) -}}
      {{- end -}}
      {{- if $caHolder -}}
      {{- fail (printf "the target_messaging connections %s and %s of %q each hold a server_ca, and one container holds one EVENT_TOOL_BROKER_SERVER_CA_FILE and one mount at %s: hold server_ca on one target_messaging connection only, and declare a second event-publishing component for the other broker" $caHolder $alias $.context.instance_id $serverCaDir) -}}
      {{- end -}}
      {{- $caHolder = $alias -}}
      {{- end -}}
      {{- end -}}
      {{- $taken := dict -}}
      {{- if not (hasKey $named "values.target_topic") }}{{ $_ := set $taken "EVENT_TOOL_TARGET_TOPIC" "the component's own value target_topic" }}{{ end -}}
      {{- if not (hasKey $named "values.side_effects") }}{{ $_ := set $taken "EVENT_TOOL_SIDE_EFFECTS" "the component's own value side_effects" }}{{ end -}}
      {{- if not (hasKey $named "values.timeout_seconds") }}{{ $_ := set $taken "EVENT_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" }}{{ end -}}
      {{- if .values.payload_schema_ref -}}
      {{- if not (hasKey $named "values.payload_schema_ref") }}{{ $_ := set $taken "EVENT_TOOL_PAYLOAD_SCHEMA_REF" "the component's own value payload_schema_ref" }}{{ end -}}
      {{- end -}}
      {{- if .values.llm_description_override -}}
      {{- if not (hasKey $named "values.llm_description_override") }}{{ $_ := set $taken "EVENT_TOOL_DESCRIPTION" "the component's own value llm_description_override" }}{{ end -}}
      {{- end -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if and (eq $edge.socket "target_messaging") (not (hasKey $dictating $alias)) -}}
      {{- $by := printf "the target_messaging connection %s, which writes no inject block" $alias -}}
      {{- $_ := set $taken "EVENT_TOOL_BROKER_HOST" $by -}}
      {{- $_ := set $taken "EVENT_TOOL_BROKER_PORT" $by -}}
      {{- if optional (default dict $edge.provides) "protocol" "" -}}
      {{- $_ := set $taken "EVENT_TOOL_BROKER_PROTOCOL" $by -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- with $caHolder -}}
      {{- $_ := set $taken "EVENT_TOOL_BROKER_SERVER_CA_FILE" (printf "the server_ca held on the target_messaging connection %s" .) -}}
      {{- end -}}
      {{- $files := dict -}}
      {{- $dictated := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- range $mechanism, $entries := (default dict $edge.inject) -}}
      {{- range $name, $from := $entries -}}
      {{- if eq $mechanism "env" -}}
      {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
      {{- else if eq $mechanism "file" -}}
      {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
      {{- else if eq $mechanism "arg" -}}
      {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Knative takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
      {{- else -}}
      {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
      {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
      {{- range $name, $by := $dictated -}}
      {{- with optional $taken $name "" -}}
      {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) -}}
      {{- end -}}
      {{- end -}}
      {{- range $name, $by := $files -}}
      {{- if not (hasPrefix "/" $name) -}}
      {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) -}}
      {{- end -}}
      {{- if and $caHolder (or (eq $name $serverCaDir) (hasPrefix (printf "%s/" $serverCaDir) $name) (hasPrefix (printf "%s/" $name) $serverCaDir)) -}}
      {{- fail (printf "%s dictates a file at %q, and this realization mounts the server_ca at %q, so the two paths would overlap: dictate the file at a path neither at, beneath nor above that directory" $by $name $serverCaDir) -}}
      {{- end -}}
      {{- end -}}
      {{- range $path, $_ := $files -}}
      {{- range $other, $_ := $files -}}
      {{- if hasPrefix (printf "%s/" $path) $other -}}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "{{ .infra.min_replicas }}"
              autoscaling.knative.dev/max-scale: "{{ .infra.max_replicas }}"
              {{- if and .infra.overrides .infra.overrides.annotations }}
              {{- range $k, $v := .infra.overrides.annotations }}
              {{ $k }}: "{{ $v }}"
              {{- end }}
              {{- end }}
          spec:
            containers:
              - image: "{{ .infra.image }}"
                ports:
                  - containerPort: {{ .infra.port }}
                env:
                  {{- if not (hasKey $named "values.target_topic") }}
                  - name: EVENT_TOOL_TARGET_TOPIC
                    value: "{{ .values.target_topic }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.side_effects") }}
                  - name: EVENT_TOOL_SIDE_EFFECTS
                    value: "{{ .values.side_effects }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.timeout_seconds") }}
                  - name: EVENT_TOOL_TIMEOUT_SECONDS
                    value: "{{ .values.timeout_seconds }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.payload_schema_ref") }}
                  {{- with .values.payload_schema_ref }}
                  - name: EVENT_TOOL_PAYLOAD_SCHEMA_REF
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- if not (hasKey $named "values.llm_description_override") }}
                  {{- with .values.llm_description_override }}
                  - name: EVENT_TOOL_DESCRIPTION
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- range $name, $_ := $ownEnv }}
                  - name: {{ toJson $name }}
                    value: {{ toJson (toString (optional $env $name "")) }}
                  {{- end }}
                  {{- range $alias, $edge := .context.uses }}
                  {{- if hasKey $dictating $alias }}
                  {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
                  - name: {{ toJson $name }}
                    value: {{ toJson (toString (optional $env $name "")) }}
                  {{- end }}
                  {{- else if eq $edge.socket "target_messaging" }}
                  - name: EVENT_TOOL_BROKER_HOST
                    value: "{{ $edge.provides.host }}"
                  - name: EVENT_TOOL_BROKER_PORT
                    value: "{{ $edge.provides.port }}"
                  {{- with (optional $edge.provides "protocol" "") }}
                  - name: EVENT_TOOL_BROKER_PROTOCOL
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- if eq $alias $caHolder }}
                  - name: EVENT_TOOL_BROKER_SERVER_CA_FILE
                    value: "{{ $serverCaDir }}/ca.crt"
                  {{- end }}
                  {{- end }}
                resources:
                  requests:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                  limits:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                {{- if or $caHolder $files }}
                volumeMounts:
                  {{- if $caHolder }}
                  - name: {{ $serverCaVolume }}
                    mountPath: "{{ $serverCaDir }}"
                    readOnly: true
                  {{- end }}
                  {{- $i := 0 }}
                  {{- range $path, $_ := $files }}
                  - name: inject-files
                    mountPath: {{ toJson $path }}
                    subPath: "file-{{ $i }}"
                    readOnly: true
                  {{- $i = add $i 1 }}
                  {{- end }}
                {{- end }}
            {{- if or $caHolder $files }}
            volumes:
              {{- with $caHolder }}
              - name: {{ $serverCaVolume }}
                secret:
                  secretName: "{{ (index $.context.uses .).features.server_ca.provides.name }}"
              {{- end }}
              {{- if $files }}
              - name: inject-files
                configMap:
                  name: "{{ .context.instance_id }}-files"
              {{- end }}
            {{- end }}
