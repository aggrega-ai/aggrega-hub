apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: server
  version: 1.0.0
  description: >
    The generic long-running server primitive on Kubernetes via the helm
    provider's Workload synthesis: a Deployment plus a ClusterIP Service
    carrying inbound traffic to the container's port. The Service is what makes
    the operational type — compute that expects inbound application traffic —
    readable in the emitted bytes, and it is what separates this realization from
    the background-worker primitive's, which emits no Service at all.

    The component declares no developer fields of its own, so everything the
    workload needs comes from the operator: the image, the port, the replica
    count and the resource quantities. It needs no cluster control plane, so it
    carries no prerequisite affirmation and emits no custom resource.

    No provides contract is emitted, because the component declares none: this
    primitive publishes nothing across an edge.

    What reaches the container from the component's own edges is what each
    edge's inject block dictates, because the image is the Release's own code:
    env entries become variables and file entries read-only files, and an arg
    entry or any other delivery mechanism is refused by name. An edge that
    dictates nothing delivers nothing. The component's own inject block
    delivers env entries the same way.

    A credential attached to the component reaches the container the same way,
    through the delivery pipe: a core/secret-value attachment, its value
    written into the rendered Deployment, or a core/secret-provided one. A
    credential published for the pod to reference, such as
    core/referenced-secret or core/random-password, cannot reach it, because
    the component declares no credential slot a reference could name, so the
    build halts naming the attachment.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/server:1.0.0
  # The component declares an infra.overrides block for the realizations that
  # run on a cloud provider's container service, and the synthesized workload
  # here reads none of its keys: it has no provider-specific knob to override.
  #
  # infra keys read here: image, port, replicas, compute. The replica floor is
  # one, because a server holding no replicas has nothing to answer a request
  # with.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image serving the application in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; a sub-key the Release sets empty would leave the
    # emitted container without that quantity, so this halts on it, naming
    # each separately so the reader is told which one is empty.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # A credential attached to the component reaches the container only through
  # the delivery pipe the workload below renders: a core/secret-value attachment
  # writes its value there as a variable under the key it names, so the value is
  # written into the rendered Deployment, and a core/secret-provided attachment
  # under the names its own inject block dictates. Every other
  # credential Feature publishes a secret for the pod to reference, or leaves it
  # to a controller, and this realization renders no reference: a Workload
  # reference names a credential slot, and the component declares none. Such an
  # attachment would build and reach no container, so the workload halts on it
  # first, naming it. A credential is recognised by the label its Feature
  # declares, feature.aggrega.ai/kind: secret, and its Feature by its type with
  # any version set aside. The check sits in the workload rather than among the
  # assertions above because the attachment's labels are read here.
  #
  # DELIBERATE NEAR-DUPLICATE: helm/worker, helm/task, helm/function-keda and
  # helm/function-knative carry the same check, save the component type and the
  # rendered resource its refusal names. It is part of a workload template, and
  # a WorkloadLibrary entry replaces a whole workload, never a part of one, so no
  # catalog kind can hold it for the five; a change to it is made to all five.
  #
  # Delivery from an edge. The image is the Release's own code, which reads its
  # connections under names its author chose, so no name this Recipe could
  # choose is one that code reads: each of the component's connections dictates
  # its own delivery in its inject block, and an edge that dictates nothing
  # delivers nothing. The pipe is read as a map. Every env entry becomes a
  # container variable under the name the edge gave it, its value written whole.
  # Every file entry becomes a read-only file at the absolute path the edge
  # names: one ConfigMap beside the workload holds the entries, emitted only
  # while there is one, and each is mounted by subPath, so a path that is not
  # absolute, or one lying beneath another entry's path, is refused. An arg
  # entry is refused, because this Recipe renders no command line: Kubernetes
  # takes a container's arguments in place of the image's default command, which
  # is the Release's. Any other mechanism is refused too. A refusal names the
  # entry, its mechanism and the connection that dictated it.
  #
  # The block reading the pipe is the one helm/worker, helm/task and
  # helm/function-keda declare, word for word, and helm/function-knative adapts
  # to the Knative Service it renders; a change to it is made to all five.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, whose env entries reach the pipe under the
  # names the developer chose and so become container variables with every
  # other env entry. The component has no own value this Recipe names and this
  # Recipe refuses no variable by its name, so nothing here reads which names
  # that block delivers.
  workload: |
    {{- range $name, $attachment := (default dict .features) }}
    {{- $type := first (splitList ":" (toString (optional $attachment "type" ""))) }}
    {{- $kind := optional (default dict (optional $attachment "labels" dict)) "feature.aggrega.ai/kind" "" }}
    {{- if and (eq $kind "secret") (not (has $type (list "core/secret-value" "core/secret-provided"))) }}
    {{- fail (printf "the %s attachment %q on %q would reach no container: this realization delivers a credential only through the component's delivery pipe, which core/secret-value fills with its value under the key it names and core/secret-provided through the attachment's own inject block, and it renders no reference to a secret, since core/compute/server declares no credential slot a reference could name. Attach the credential as core/secret-value, whose value is then written into the rendered Deployment's environment, or realize the component with a Recipe that reads the secret by reference" $type $name $.context.instance_id) }}
    {{- end }}
    {{- end }}
    {{- $inject := default dict .context.inject }}
    {{- $env := optional $inject "env" dict }}
    {{- $files := optional $inject "file" dict }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # Interchangeable long-running replicas behind one address.
    form: stateless
    replicas: {{ .infra.replicas }}
    containers:
      main:
        image: "{{ .infra.image }}"
        ports:
          http: {{ .infra.port }}
        {{- if $env }}
        variables:
          {{- range $k, $v := $env }}
          {{ toJson $k }}: {{ toJson $v }}
          {{- end }}
        {{- end }}
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
        # The image is the Release's, so no product documents a health endpoint
        # here: the readiness probe opens a TCP connection to the declared port,
        # and the Service sends no traffic until the process accepts one. No
        # liveness probe is declared, because a start-up time cannot be known
        # for an image this realization does not name, and a liveness probe
        # that fires before a slow server has started restarts it for ever.
        health:
          ready:
            tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
  # The ConfigMap holding the file entries an edge dictates, keyed file-0,
  # file-1 and so on in path order, the keys the workload's mounts read. It is
  # emitted only while an edge dictates a file, so a build with none renders
  # nothing here. The pod mounts it by name, which resolves only in the pod's own
  # namespace, so it carries the namespace the Release, or else the Aggregate, declares for the
  # component through the aggrega.ai/namespace annotation, as the workload's own
  # resources do, and none where it declares none. The output filename carries
  # the realization's own name, because an artifact key is the output path used
  # as written.
  artifacts:
    server-files.configmap.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
