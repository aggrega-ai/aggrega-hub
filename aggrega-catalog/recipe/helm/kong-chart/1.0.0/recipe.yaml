apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: kong-chart
  version: 1.0.0
  license: Apache-2.0
  description: >
    Kong, a database-backed API gateway, on Kubernetes via the official Kong
    Helm chart, served from that project's HTTPS chart repository. The
    gateway's configuration lives in the PostgreSQL backend wired on the
    `backend` uses-socket, so the chart's bundled database, ingress controller
    and manager console are switched off. It renders a Deployment, a
    ServiceAccount, ClusterIP Services for the proxy data plane and the
    in-cluster Admin API, the chart's Kong custom-resource definitions, and the
    three schema-migration Jobs the product's maintainers sequence around a
    release: a bootstrap, an up-migration before an upgrade and a finishing
    migration after one.

    A workload assembled by hand can run the bootstrap and nothing more, so it
    cannot express what must happen on either side of a version change. Reach
    for this realization where a chart repository is reachable at build time
    and the gateway will be upgraded in place; reach for `kong`, the
    workload-synthesis realization, where the build must complete with nothing
    fetched.

    The gateway image and the chart version (source.version, overridden via
    infra.source_version) are pinned. provides.host is the proxy data-plane
    Service name, with no namespace; a consumer in another namespace qualifies
    it on its own side.

    Each model wired to the models socket gets a chat and a completion route
    through Kong's AI proxy, in a ConfigMap beside the chart that an init
    container imports into the database, retried on a first install until the
    bootstrap Job provisions the schema. A changed route set rolls the gateway.
    A connection's credential arrives as an env secretKeyRef the routes name
    through Kong's environment vault, so no credential value is in the
    rendered output.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/kong:1.0.0

  source:
    kind: helm-https-chart
    url: https://charts.konghq.com
    chart: kong
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"3.4.1\" }}"

  # provides.host is the proxy data-plane Service name — the entry point client
  # traffic is sent to, which is what the Component's provides contract promises.
  # The valuesMapping below pins the chart's fullnameOverride to the rendered
  # name, the release name the helm provider gives the chart, which spells the
  # Component's name in the alphabet a Kubernetes name allows. The chart suffixes
  # the proxy Service with "-proxy", so that Service is named exactly
  # "<rendered_name>-proxy". The Admin API Service takes "<rendered_name>-admin"
  # and is deliberately NOT what this pillar publishes: the
  # Component's own description says the published port carries proxied traffic
  # and never the Admin API. Both suffixes were read from a render of the chart,
  # not assumed. A same-namespace consumer reaches the proxy under this name
  # directly; a cross-namespace consumer qualifies it caller-side.
  #
  # The name carries no namespace, so the recipe is independent of where it is
  # deployed; a consumer in another namespace qualifies the host with the target
  # namespace on its own side (caller-side routing).
  #
  # endpoint is the route the gateway serves for the model values.model names,
  # under that alias in the path, on the proxy Service name and port; model is
  # that alias. The Service name is spelled out again on purpose: a provides
  # entry cannot read another provides entry, so the repetition is forced, and
  # the entries are edited together. With nothing wired to the models socket
  # values.model is omitted — the component's assertion halts on any other
  # combination — and both are empty.
  provides:
    host: "{{ .context.rendered_name }}-proxy"
    port: "{{ .infra.proxy_port }}"
    protocol: "http"
    endpoint: '{{ with optional .values "model" "" }}http://{{ $.context.rendered_name }}-proxy:{{ $.infra.proxy_port }}/{{ . }}/v1{{ end }}'
    model: '{{ optional .values "model" "" }}'

  # The entries below are the values the value mapping shares with the
  # KongModelRoutes bundle imported for the gateway's model routes. Each has
  # its home in the bundle, which stops the build naming the local when one is
  # missing or differs from its own; the value mapping reads them here,
  # because a value mapping cannot read the bundle. model_routes_delivery has
  # the bundle emit one ConfigMap. model_routes_file is the file that
  # ConfigMap carries the routes as and the file the import step reads. The
  # ConfigMap is named after the rendered name followed by
  # model_routes_config_map_suffix; a locals entry cannot read the rendered
  # name, so the volume composes the two. A models connection's credential
  # reaches the gateway under two variables, both named after the connection's
  # alias in capitals with every character other than a letter or a digit as
  # an underscore, between the fixed parts here: the connection fast carrying
  # a credential gives AI_PROXY_FAST_API_KEY, which holds the credential, and
  # AI_PROXY_FAST_AUTHORIZATION, the bearer token composed from it, which the
  # connection's routes name through Kong's environment vault. A locals entry
  # cannot read a connection, so the value mapping applies the alias rule
  # itself, once.
  locals:
    model_routes_delivery: config_map
    model_routes_file: model-routes.yaml
    model_routes_config_map_suffix: "-model-routes"
    connection_variable_prefix: AI_PROXY_
    credential_variable_suffix: _API_KEY
    header_variable_suffix: _AUTHORIZATION

  # The models the gateway serves, as Kong's own declarative configuration,
  # from the KongModelRoutes bundle every Recipe running this gateway imports,
  # so the routes and the rules they are written by have one text wherever the
  # gateway runs. It is emitted beside the chart's resources and loaded into
  # the backend database by the import step the value mapping below adds. Each
  # connection on the models socket gets a chat and a completion route under
  # its alias, through Kong's AI proxy to the endpoint and the model name the
  # model publishes, and one carrying a credential has its routes name
  # AI_PROXY_<ALIAS>_AUTHORIZATION through Kong's environment vault, never the
  # value. A core/prompt-deny-patterns attachment adds Kong's AI Prompt Guard
  # to every route, with the attachment's lists. With model_routes_delivery
  # set to config_map the bundle emits one ConfigMap,
  # "<rendered_name>-model-routes", carrying the routes as model_routes_file;
  # with nothing wired to the models socket it emits nothing. The bundle stops
  # the build when a local above differs from its own side.
  artifacts:
    model-routes:
      $import: KongModelRoutes#/artifacts/ModelRoutes

  # This Recipe reads from infra.overrides:
  #   image        - map[string]string (image.* fields; overrides the tag pin)
  #   service_type - string (proxy.type; how the data plane is exposed, default ClusterIP)
  #   requests     - { cpu: string, memory: string } (gateway resource requests)
  #   nodeSelector - map[string]string (pod scheduling)
  #   tolerations  - []object (pod scheduling)
  #
  # The chart is configured for the shape this Component describes: a gateway
  # whose configuration lives in the PostgreSQL backend wired on the `backend`
  # uses-socket, with the chart's own bundled database, its Kubernetes ingress
  # controller and its manager console all switched off, because the Component
  # describes none of them. Under this configuration the chart renders a
  # Deployment for the gateway, a ServiceAccount, a ClusterIP Service for the
  # proxy data plane, a ClusterIP Service for the in-cluster Admin API, and the
  # three schema-migration Jobs the product's own maintainers sequence around a
  # release: a bootstrap before the gateway first serves, an up-migration before
  # an upgrade, and a finishing migration after one. That sequencing is the
  # reason to reach for this realization — a workload assembled by hand can run
  # a bootstrap step before its own container and nothing more, so it has no way
  # to express what must happen on either side of a version change. The render
  # also carries the chart's Kong custom-resource definitions, which it emits
  # with its ingress controller switched off.
  valuesMapping: |
    ## ── The configuration backend edge ─────────────────────────
    ## The gateway keeps its routing configuration here. The edge is required, so
    ## it is always resolved by the time this template runs; its host and port
    ## compose the connection, and its user and database name the login.
    {{- $backend := dict }}
    {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "backend" }}
        {{- $backend = $edge }}
      {{- end }}
    {{- end }}
    {{- /* The models connections, in alias order, and those of them carrying a
           credential. The directory the routes file is mounted at is the
           single authored home for the mount and the path the import step
           reads. The route set is written from each connection's alias, the
           endpoint and model name its model publishes, and whether it
           carries a credential, and, while a core/prompt-deny-patterns
           attachment is on the component, from its two lists, which the
           routes' prompt guard carries; their digest is what rolls the
           gateway's pod when the route set changes, below. */}}
    {{- $routesDir := "/etc/kong/model-routes" }}
    {{- $wired := list }}
    {{- $credentialed := list }}
    {{- $routeSet := list }}
    {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "models" }}
        {{- $wired = append $wired $alias }}
        {{- $hasCredential := hasKey (default dict $edge.features) "credential" }}
        {{- if $hasCredential }}
          {{- $credentialed = append $credentialed $alias }}
        {{- end }}
        {{- $routeSet = append $routeSet (list $alias $edge.provides.endpoint $edge.provides.model $hasCredential) }}
      {{- end }}
    {{- end }}
    {{- range $attachment := (default dict .features) }}
      {{- if eq (first (splitList ":" (toString $attachment.type))) "core/prompt-deny-patterns" }}
        {{- $values := default dict $attachment.values }}
        {{- $routeSet = append $routeSet (list "core/prompt-deny-patterns" (optional $values "deny_patterns" list) (optional $values "allow_patterns" list)) }}
      {{- end }}
    {{- end }}
    {{- $routesDigest := sha256sum (toJson $routeSet) }}
    {{- /* The inline development password, the single authored home for the
           gateway's and the import step's connection when the backend
           connection carries no credential. */}}
    {{- $devPassword := "apppass" }}
    {{- /* The gateway image pin, the single authored home for the chart's image
           values below and for the image the import step runs: the step
           writes into the database the gateway reads, so the two run one
           release, an image override included. */}}
    {{- $repository := "kong" }}
    {{- $tag := "3.9.3" }}
    {{- $image := printf "%s:%s" $repository $tag }}
    {{- with .infra.overrides }}{{ with .image }}
      {{- if .unifiedRepoTag }}{{ $image = .unifiedRepoTag }}{{ else if and .repository .tag }}{{ $image = printf "%s:%s" .repository .tag }}{{ end }}
    {{- end }}{{ end }}

    ## ── Pin the chart's resource names to the rendered name ────
    ## Names the proxy Service "<rendered_name>-proxy", matching provides.host,
    ## and the Admin API Service "<rendered_name>-admin".
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── Gateway image pin ──────────────────────────────────────
    ## The chart's own default names a release series rather than a point
    ## release, which makes the render move as that series moves; pin it
    ## explicitly instead. Override the whole block via infra.overrides.image.
    image:
      {{- if and .infra.overrides .infra.overrides.image }}
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      repository: {{ $repository }}
      tag: "{{ $tag }}"
      {{- end }}

    ## ── Chart extras this Component does not describe ──────────
    ## The chart can also deploy a PostgreSQL of its own, a Kubernetes ingress
    ## controller, and the manager console. The backend is wired through the
    ## topology rather than bundled, and the Component describes neither an
    ## ingress controller nor a console, so all three are switched off rather
    ## than rendered unreferenced.
    postgresql:
      enabled: false
    ingressController:
      enabled: false
    manager:
      enabled: false

    ## ── Backend connection ─────────────────────────────────────
    ## Composed from the resolved `backend` edge. The password is the one place
    ## the two credential shapes differ: with a credential on that connection,
    ## it is bound by NAME so the material never appears in the rendered
    ## artifact; with none, the Component declares the slot optional, so an
    ## inline development default keeps the render working exactly as the
    ## workload-synthesis realization does.
    env:
      database: postgres
      pg_host: "{{ $backend.provides.host }}"
      pg_port: {{ $backend.provides.port }}
      pg_user: "{{ $backend.provides.user }}"
      pg_database: "{{ $backend.provides.database }}"
      {{- if hasKey (default dict $backend.features) "credential" }}
      pg_password:
        valueFrom:
          secretKeyRef:
            name: "{{ $backend.features.credential.provides.name }}"
            key: "{{ $backend.features.credential.provides.key }}"
      {{- else }}
      pg_password: "{{ $devPassword }}"
      {{- end }}

    ## ── The models the gateway serves ──────────────────────────
    ## While the models socket holds a connection, an init container of the
    ## gateway's pod imports the routes ConfigMap the artifact above emits into
    ## the backend database, with the gateway's image and the same backend
    ## connection and password. The chart places such a container ahead of its
    ## own wait for the database, so on a first install it fails until the
    ## bootstrap migration Job has provisioned the schema and the cluster
    ## retries it; once the schema is there it succeeds and the gateway starts.
    ##
    ## The chart also places this container in each of its three migration
    ## Jobs, ahead of the migration itself, and there an import that needs the
    ## schema would hold back the very Job that provisions it. So the step reads
    ## its pod's app.kubernetes.io/component label, which the chart sets to app
    ## on the gateway's pods and to the migration's name on each Job's, and
    ## exits at once anywhere but in the gateway's own pod. Like the chart's own
    ## wait for the database, it runs through a shell the image carries.
    ##
    ## The ConfigMap's content is no part of the pod's own specification, so
    ## the pod carries the digest of what the route set is written from as the
    ## annotation checksum/model-routes: a changed route set changes the pod's
    ## specification, the Deployment rolls the gateway, and the new pod imports
    ## the changed routes before it serves. The chart writes podAnnotations onto
    ## the gateway's pods alone, never onto a migration Job's.
    ##
    ## The import adds and updates each service, route and plugin under an id
    ## Kong derives from its name, so a re-run writes the same rows again; it
    ## removes nothing, so a route whose connection is removed stays in the
    ## database until it is deleted through the Admin API, and so does the
    ## prompt guard a core/prompt-deny-patterns attachment wrote once the
    ## attachment is removed. The step reads no model credential: the routes
    ## hold a reference to one, which only the gateway resolves.
    {{- if $wired }}
    podAnnotations:
      checksum/model-routes: "{{ $routesDigest }}"
    deployment:
      initContainers:
        - name: model-routes
          image: "{{ $image }}"
          args:
            - /bin/sh
            - -c
            - 'if [ "$MODEL_ROUTES_POD_COMPONENT" != app ]; then exit 0; fi; exec kong config db_import {{ $routesDir }}/{{ .locals.model_routes_file }}'
          env:
            - name: MODEL_ROUTES_POD_COMPONENT
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['app.kubernetes.io/component']"
            - name: KONG_DATABASE
              value: postgres
            - name: KONG_PG_HOST
              value: "{{ $backend.provides.host }}"
            - name: KONG_PG_PORT
              value: "{{ $backend.provides.port }}"
            - name: KONG_PG_USER
              value: "{{ $backend.provides.user }}"
            - name: KONG_PG_DATABASE
              value: "{{ $backend.provides.database }}"
            - name: KONG_PG_PASSWORD
              {{- if hasKey (default dict $backend.features) "credential" }}
              valueFrom:
                secretKeyRef:
                  name: "{{ $backend.features.credential.provides.name }}"
                  key: "{{ $backend.features.credential.provides.key }}"
              {{- else }}
              value: "{{ $devPassword }}"
              {{- end }}
          volumeMounts:
            - name: model-routes
              mountPath: "{{ $routesDir }}"
              readOnly: true
      userDefinedVolumes:
        - name: model-routes
          configMap:
            name: "{{ .context.rendered_name }}{{ .locals.model_routes_config_map_suffix }}"
    {{- end }}

    ## Each models connection carrying a credential delivers it as
    ## AI_PROXY_<ALIAS>_API_KEY, bound by NAME to the secret its attachment
    ## publishes, and composes AI_PROXY_<ALIAS>_AUTHORIZATION from it, the
    ## bearer token the connection's routes read through Kong's environment
    ## vault. The chart writes its environment in name order, so the credential
    ## variable comes before the token, and the cluster composes the token from
    ## it; neither carries the value in the rendered artifact.
    {{- with $credentialed }}
    customEnv:
      {{- range $alias := . }}
      {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
      {{- $credential := (get $.context.uses $alias).features.credential }}
      {{ $.locals.connection_variable_prefix }}{{ $name }}{{ $.locals.credential_variable_suffix }}:
        valueFrom:
          secretKeyRef:
            name: "{{ $credential.provides.name }}"
            key: "{{ $credential.provides.key }}"
      {{ $.locals.connection_variable_prefix }}{{ $name }}{{ $.locals.header_variable_suffix }}: "Bearer $({{ $.locals.connection_variable_prefix }}{{ $name }}{{ $.locals.credential_variable_suffix }})"
      {{- end }}
    {{- end }}

    ## ── Schema migrations ──────────────────────────────────────
    ## The three steps the product's own maintainers sequence around a release.
    ## They are what this realization carries that the workload-synthesis one
    ## cannot: the bootstrap has an equivalent there (an init container), the
    ## other two have none, because a workload has nowhere to say "before the
    ## upgrade" or "after it".
    migrations:
      init: true
      preUpgrade: true
      postUpgrade: true

    ## ── Proxy data plane ───────────────────────────────────────
    ## The client entry point, and the Service provides.host addresses.
    ## infra.proxy_port sets both the container port and the Service port, so the
    ## published address and the listener move together. TLS is terminated
    ## outside the cluster, matching the "http" this Recipe publishes.
    proxy:
      enabled: true
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      http:
        enabled: true
        containerPort: {{ .infra.proxy_port }}
        servicePort: {{ .infra.proxy_port }}
      tls:
        enabled: false

    ## ── Admin API ──────────────────────────────────────────────
    ## In-cluster only, on the port the operator set. Never published through
    ## provides.
    admin:
      enabled: true
      type: ClusterIP
      http:
        enabled: true
        containerPort: {{ .infra.admin_port }}
        servicePort: {{ .infra.admin_port }}
      tls:
        enabled: false

    ## ── Gateway resources ──────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}
