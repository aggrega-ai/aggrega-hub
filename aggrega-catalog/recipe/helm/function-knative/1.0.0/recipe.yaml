apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: function-knative
  version: 1.0.0
  description: >
    The generic event-driven compute primitive realized as a Knative Service
    the Knative Serving control plane reconciles. The recipe emits a single
    Service custom resource; the control plane turns it into a revision, admits
    an inbound call while that revision runs no replicas, and sets the replica
    count from the concurrency it observes, so the function occupies no compute
    between the calls that invoke it.

    This is the request-paced of the primitive's two realizations: work arrives
    as an inbound call. Where work arrives on a queue, the Manifest maps the
    component to the queue-paced realization instead.

    No Service definition and no provides contract are emitted, because the
    component declares none: the addressable name belongs to the control plane
    that creates it, and this primitive publishes nothing across an edge. The
    Knative Serving control plane is a runtime prerequisite: the build halts
    unless the operator affirms it is installed (infra.control_plane_present),
    so no custom resource is emitted into a cluster that cannot reconcile it.

    An edge's inject block dictates what reaches the container, since the image
    is the Release's own code: each env entry a variable under that name, beside
    FUNCTION_RUNTIME, which no edge may dictate while it is the default, and
    each file entry a read-only file from a ConfigMap emitted beside the
    Service. The component's own inject block delivers env entries too, and
    one reading runtime alone replaces FUNCTION_RUNTIME, its default name. An
    arg entry, or any other
    mechanism, is refused by name: the recipe renders no command line. A
    credential published for the pod to reference, such as
    core/referenced-secret, halts the build by name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/function:1.0.0
  # This Recipe reads from infra.overrides:
  #   annotations - map[string]string (added to the revision template's annotations)
  #
  # The key exists because the control plane reads its per-revision switches
  # from the revision's annotations, and which switches an installation offers
  # belongs to the installed control-plane version rather than to this catalog.
  # The two scaling bounds are not among them: they come from infra.min_replicas
  # and infra.max_replicas.
  #
  # The Manifest chooses between this request-paced realization and the
  # queue-paced one, and never maps the component to both at once.
  #
  # infra keys read here: image, port, compute, min_replicas, max_replicas,
  # control_plane_present, overrides.annotations. infra.scaler is not read here
  # — it belongs to the queue-paced realization, which scales on an event
  # source rather than on inbound concurrency.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the developer's runtime value. The recipe
  # delivers it under a stable default name for the application's own code to
  # read, which the component's own inject block may replace, as described
  # above the artifacts.
  provides: {}
  assertions:
    # The Knative Serving control plane must exist in the target cluster before
    # a Serving custom resource can reconcile. The compiler cannot inspect
    # cluster state, so the prerequisite is declared: an operator affirms it in
    # the Release, and an unaffirmed build halts here rather than emitting an
    # orphan custom resource.
    knative_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Knative Serving control plane must be installed in the target cluster before this realization emits its Knative Service; once Knative Serving is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image serving the function in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, and a Release that
    # authors the block while setting only one of them takes neither default:
    # the emitted container then carries one quantity and silently loses the
    # other. Both are required together for that reason, and each is named
    # separately so the reader is told which one is missing.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # The output filename carries the realization's own name rather than the bare
  # resource kind, because an artifact key is the output path used as written:
  # two realizations sharing a key cannot sit in one boundary, and the build
  # halts naming the path when they do.
  #
  # Delivery from an edge. The image is the Release's own code, so no name this
  # Recipe could choose is one that code reads: each of the component's
  # connections dictates its own delivery in its inject block, and an edge that
  # dictates nothing delivers nothing. The pipe is read as a map. Every env
  # entry becomes an entry of the container's env under the name the edge gave
  # it, its value written whole, after the runtime; an entry under the
  # runtime's name halts, naming the connection. Every file entry becomes a
  # read-only file at the path the edge names: one ConfigMap holds the entries,
  # emitted only while there is one, and each is mounted by subPath, so a path
  # that is not absolute, or one lying beneath another entry's path, is refused.
  # An arg entry is refused, because this Recipe renders no command line:
  # Knative takes a container's arguments in place of the image's default
  # command, which is the Release's. Any other mechanism is refused too. A
  # refusal names the entry, its mechanism and the connection that dictated it.
  # The block reading the pipe is the one helm/server, helm/worker, helm/task
  # and helm/function-keda declare, adapted to the Knative Service this Recipe
  # writes itself; a change to it is made to all five.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the container with every other env entry. The
  # name this Recipe gives the runtime is a default: it is rendered only while
  # no entry of that block, in any mechanism, delivers the runtime. The template
  # reads that at .context.self_inject, which maps each name the developer wrote
  # to values.<key> for an entry whose template reads that one own value. A
  # refusal naming a variable that block delivers names the block, rather than
  # an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  #
  # A credential attached to the component reaches the container only through
  # the delivery pipe the Service below renders: a core/secret-value attachment
  # writes its value there as an env entry under the key it names, so the value
  # is written into the rendered Knative Service, and a core/secret-provided
  # attachment under the names its own inject block dictates. Every other
  # credential Feature publishes a secret for the pod to reference, or leaves it
  # to a controller, and this realization renders no reference: the component
  # declares no credential slot one could name. Such an attachment would build
  # and reach no container, so the Service's template halts on it first, naming
  # it. A credential is recognised by the label its Feature declares,
  # feature.aggrega.ai/kind: secret, and its Feature by its type with any
  # version set aside.
  #
  # DELIBERATE NEAR-DUPLICATE of the credential check helm/server, helm/worker,
  # helm/task and helm/function-keda carry in their workloads: the same
  # template, save the component type and the rendered resource its refusal
  # names, here at the head of the Service this Recipe writes itself. No catalog
  # kind holds a part of a template for five Recipes to share; a change to it is
  # made to all five.
  #
  # function-knative-files.configmap.yaml holds the file entries, keyed file-0,
  # file-1 and so on in path order, the keys the Service's mounts read, and is
  # emitted only while an edge dictates a file. It names no namespace, as the
  # Service names none, so the two are applied into one namespace together.
  #
  # function-service.yaml is the Knative Service. The replica floor and ceiling
  # carry through as the revision's own scaling bounds, its min-scale and
  # max-scale annotations, and a floor of zero is where the scale-to-zero
  # property the operational type names becomes readable in the emitted bytes.
  artifacts:
    function-knative-files.configmap.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-files
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
    function-service.yaml: |
      {{- range $name, $attachment := (default dict .features) }}
      {{- $type := first (splitList ":" (toString (optional $attachment "type" ""))) }}
      {{- $kind := optional (default dict (optional $attachment "labels" dict)) "feature.aggrega.ai/kind" "" }}
      {{- if and (eq $kind "secret") (not (has $type (list "core/secret-value" "core/secret-provided"))) }}
      {{- fail (printf "the %s attachment %q on %q would reach no container: this realization delivers a credential only through the component's delivery pipe, which core/secret-value fills with its value under the key it names and core/secret-provided through the attachment's own inject block, and it renders no reference to a secret, since core/compute/function declares no credential slot a reference could name. Attach the credential as core/secret-value, whose value is then written into the rendered Knative Service's environment, or realize the component with a Recipe that reads the secret by reference" $type $name $.context.instance_id) }}
      {{- end }}
      {{- end }}
      {{- $inject := default dict .context.inject }}
      {{- $env := optional $inject "env" dict }}
      {{- $files := optional $inject "file" dict }}
      {{- range $mechanism, $entries := $inject }}
      {{- if not (has $mechanism (list "all" "env" "file")) }}
      {{- range $name, $_ := $entries }}
      {{- $by := "an attachment on the component" }}
      {{- range $alias, $edge := $.context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- if eq $mechanism "arg" }}
      {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Knative takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
      {{- end }}
      {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $path, $_ := $files }}
      {{- if not (hasPrefix "/" $path) }}
      {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
      {{- end }}
      {{- range $other, $_ := $files }}
      {{- if hasPrefix (printf "%s/" $path) $other }}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $named := dict }}
      {{- $ownEnv := dict }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- range $name, $key := $names }}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
      {{- end }}
      {{- end }}
      {{- $runtimeByDefault := not (hasKey $named "values.runtime") }}
      {{- if and $runtimeByDefault (hasKey $env "FUNCTION_RUNTIME") }}
      {{- $by := "an attachment on the component" }}
      {{- if hasKey $ownEnv "FUNCTION_RUNTIME" }}{{ $by = "the component's own inject block" }}{{ end }}
      {{- range $alias, $edge := .context.uses }}
      {{- if hasKey (optional (default dict $edge.inject) "env" dict) "FUNCTION_RUNTIME" }}{{ $by = printf "its connection %q" $alias }}{{ end }}
      {{- end }}
      {{- fail (printf "the component %q delivers its developer value runtime to the container as FUNCTION_RUNTIME, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" .context.instance_id $by) }}
      {{- end -}}
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "{{ .infra.min_replicas }}"
              autoscaling.knative.dev/max-scale: "{{ .infra.max_replicas }}"
              {{- if and .infra.overrides .infra.overrides.annotations }}
              {{- range $k, $v := .infra.overrides.annotations }}
              {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
              {{- end }}
              {{- end }}
          spec:
            containers:
              - image: "{{ .infra.image }}"
                ports:
                  - containerPort: {{ .infra.port }}
                {{- if or $runtimeByDefault $env }}
                env:
                  {{- if $runtimeByDefault }}
                  - name: FUNCTION_RUNTIME
                    value: "{{ .values.runtime }}"
                  {{- end }}
                  {{- range $k, $v := $env }}
                  - name: {{ toJson $k }}
                    value: {{ toJson $v }}
                  {{- end }}
                {{- end }}
                resources:
                  requests:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                  limits:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                {{- if $files }}
                volumeMounts:
                  {{- $i := 0 }}
                  {{- range $path, $_ := $files }}
                  - name: inject-files
                    mountPath: {{ toJson $path }}
                    subPath: "file-{{ $i }}"
                    readOnly: true
                  {{- $i = add $i 1 }}
                  {{- end }}
                {{- end }}
            {{- if $files }}
            volumes:
              - name: inject-files
                configMap:
                  name: "{{ .context.instance_id }}-files"
            {{- end }}
