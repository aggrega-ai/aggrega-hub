apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: agent-invocation-knative
  version: 1.0.0
  license: Apache-2.0
  description: >
    The agent-delegation tool as one Knative Service custom resource, which
    Knative Serving runs as a revision scaled on observed concurrency, to zero
    replicas between calls yet admitting each. The container receives the
    address keys the wired agent publishes and the developer's protocol and
    execution mode, so the tool reaches the agent the topology resolved, not
    one it names. A connection writing an `inject:` block receives instead the
    names it dictates, as variables or as files from a ConfigMap emitted beside
    the Service, beside what its attachments deliver. The component's own
    `inject:` block adds `env` and `file` entries beside them, and one reading
    a tool value alone replaces that value's default name. The build halts
    unless infra.control_plane_present affirms Knative Serving is installed,
    so no Service reaches a cluster unable to reconcile it.

    A credential or client_secret on the connection reaches the container by
    reference to its Secret: a credential beside the header the agent
    publishes, the Secret holding the whole header value; a client_secret
    beside the client id, scopes and token or discovery URL the
    container obtains a token with by the OAuth 2.0 client-credentials grant,
    directly or through OpenID Connect. Either halts the build on an agent
    labelled external publishing protocol http; to one inside the Release,
    http carries the credential or token unencrypted on the cluster network. A
    client_certificate, for mutual TLS, and a server_ca are each mounted
    read-only from their Secret, variables naming the files. Each Secret is one
    already in the namespace, named through
    helm/k8s-existing-secret; a realization naming it after the tool halts
    the build.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/agent-invocation:1.0.0
  # A credential or client_secret reaches the container by reference to its
  # Secret, never as a rendered value. A credential's Secret holds the whole
  # header value, as for an API key in a header or cookie or a Bearer or Basic
  # value. The container presents the credential, token and certificate, which
  # no build can check.
  #
  # A Knative Service is addressable in its own namespace under the Service's
  # own name, on port 80, and the control plane routes from there to the
  # revision's container port. provides.host is therefore that bare in-cluster
  # name with no namespace segment, so the recipe is independent of where it is
  # deployed; a consumer in another namespace qualifies it on its own side
  # (caller-side routing). provides.port is 80 rather than infra.port because
  # 80 is what a caller connects to — infra.port is where the container listens
  # behind the control plane's routing, and only the container spec below reads
  # it.
  provides:
    host: "{{ .context.instance_id }}"
    port: "80"
    endpoint: "http://{{ .context.instance_id }}"
    protocol: "http"
  assertions:
    # The Knative Serving control plane must exist in the target cluster before
    # a Serving custom resource can reconcile. The compiler cannot inspect
    # cluster state, so the prerequisite is declared: an operator affirms it in
    # the Release, and an unaffirmed build halts here rather than emitting an
    # orphan custom resource.
    knative_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Knative Serving control plane must be installed in the target cluster before this realization emits its Knative Service; once Knative Serving is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the tool in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered revision would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered revision would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads from infra.overrides:
  #   annotations - map[string]string (added to the revision template's annotations)
  #
  # The key exists because the control plane reads its per-revision switches
  # from the revision's annotations, and which switches an installation offers
  # belongs to the installed control-plane version rather than to this catalog.
  # The two scaling bounds are not among them: they come from infra.min_replicas
  # and infra.max_replicas, first-class keys on the component's own surface, and
  # carry through as the revision's own scaling bounds.
  #
  # The tool's own values and the delegated agent's coordinates are both
  # delivered to the container as environment variables. The image is the
  # Release's, so no upstream documentation names a spelling for them; the
  # recipe delivers each under a stable default name for the application's own
  # code to read. The optional values are emitted only when they are present, so
  # an unset value renders no variable rather than an empty one.
  #
  # The agent's address is read off the agent socket's own edge rather than
  # from a value on the tool, which is what makes the destination the
  # topology's to decide: the edge is found by matching the socket name the
  # component declares, so the alias the developer chose for the connection
  # does not reach this template. The agents this socket accepts publish
  # their address in more than one shape — some an endpoint, some a host with
  # a port and protocol, some both — so each key is read through a presence
  # check and emitted only where it is published, and an agent reached over
  # its own endpoint delivers no host variable rather than an empty one.
  # An agent that publishes neither an endpoint nor a host gives a connection
  # taking these variables nothing to reach it by, so the template halts and
  # names the connection rather than emitting a tool with no destination.
  # Several edges taking them would each deliver an agent under the same
  # variable names, leaving undefined which one the tool calls, so the template
  # halts there too, naming two of the connections. An agent publishing where
  # its card is read (agent_card_url) has that delivered as well, by the same
  # presence check.
  #
  # The credential the tool presents to the agent is held on that connection,
  # in the credential slot the socket declares, and read per connection from
  # the locator it publishes: AGENT_TOOL_TARGET_CREDENTIAL is a secretKeyRef to
  # the Secret name and data key the credential publishes, so the credential
  # appears in no rendered file. On a connection writing no inject block, the
  # header the agent publishes as credential_header is delivered beside it as
  # AGENT_TOOL_TARGET_CREDENTIAL_HEADER, for the tool to present the one under
  # the other, and only where a credential is delivered. A connection carrying
  # no credential renders neither variable. A credential publishing no Secret
  # name and data key halts the build, since the container would then have no
  # reference to read it from.
  #
  # The connection's client_secret slot carries the secret half of the tool's
  # OAuth 2.0 registration, for an agent whose card requires a token obtained by
  # the client-credentials grant, directly or through OpenID Connect discovery.
  # AGENT_TOOL_TARGET_CLIENT_SECRET is a secretKeyRef to the Secret name and
  # data key it publishes, read exactly as the credential is, and a
  # client_secret publishing neither halts the build the same way. Beside it
  # come AGENT_TOOL_TARGET_CLIENT_ID and AGENT_TOOL_TARGET_AUDIENCE from the
  # connection's own infra, which the Release writes, and, on a connection
  # writing no inject block, AGENT_TOOL_TARGET_TOKEN_URL,
  # AGENT_TOOL_TARGET_OIDC_DISCOVERY_URL and AGENT_TOOL_TARGET_SCOPES from what
  # the agent publishes — each only where it has a value, and none of them on a
  # connection holding no client_secret, so a connection reached with a header
  # credential, or with none, renders exactly what it renders with no such slot
  # at all. The container obtains the token, caches it, obtains another before
  # it expires, and presents it on each request; the build delivers the inputs
  # and cannot observe any of that. The slot and the credential slot are
  # independent: an agent whose card requires two schemes together is reached
  # with both, each delivered under its own variables. The template halts,
  # naming the connection, where the container could not run the grant or where
  # running it would leak the secret: a client_secret with no client_id; a
  # client_secret on a connection whose agent publishes neither token_url nor
  # oidc_discovery_url; a client_id or audience on a connection holding no
  # client_secret; and a token_url or oidc_discovery_url, delivered, that is not
  # an https URL naming a host — OAuth 2.0 sends a client secret only over TLS —
  # or that carries a user name or password, which would write a credential into
  # the rendered Service. No message repeats an address, so a credential written
  # into one reaches no log either.
  #
  # The connection's client_certificate slot carries the certificate and key the
  # container presents in the TLS handshake to an agent whose card requires
  # mutual TLS, and its server_ca slot the authority the container checks the
  # agent's server certificate against. Each filled slot becomes a volume of the
  # whole Secret its attachment publishes by name, and a read-only mount of that
  # volume, which Knative Serving requires of a Secret volume. The volume lists
  # no items, so every data key becomes a file named by the key, and Kubernetes
  # updates the files in place when the Secret changes, as on a renewal, which
  # it does not do for a subPath mount. The data key the attachment publishes is
  # not read: the file names are tls.crt and tls.key for the client certificate,
  # as a kubernetes.io/tls Secret holds them, and ca.crt for the authority.
  # AGENT_TOOL_TARGET_CLIENT_CERT_FILE and AGENT_TOOL_TARGET_CLIENT_KEY_FILE
  # name the two client files, and AGENT_TOOL_TARGET_SERVER_CA_FILE the
  # authority's, each only where its slot is filled, so a connection holding
  # neither slot renders exactly what it renders with no such slot at all. The
  # mount directories are fixed because each slot is held on one target_agent
  # connection at most. The rendered Service names each Secret and never its
  # content, so neither the certificate nor its key reaches a rendered file.
  # Presenting the certificate, checking the agent with the authority, and
  # reading the files again after a renewal are the container's; the build
  # cannot see that the Secret exists, holds those keys, or holds a certificate
  # the agent accepts. Either slot sits beside credential and client_secret,
  # each delivered under its own variables. The template halts, naming the
  # connection, on either slot whose attachment publishes no Secret name, since
  # nothing could be mounted, and on either slot on a connection whose agent
  # would be reached without TLS, since no handshake would take place to present
  # or check a certificate in. Which scheme the agent is reached over is read
  # from the protocol it publishes, which halts on http; an agent publishing no
  # protocol is judged by the scheme of the endpoint it publishes instead, which
  # halts on anything but https. An agent publishing neither is reached by its
  # host alone and is not judged here.
  #
  # A credential or client_secret on a connection to an agent labelled
  # component.aggrega.ai/hosting external that publishes protocol http halts the
  # build, naming the connection: the container would send the credential, or
  # the token it obtains with the client secret, to an agent outside the Release
  # unencrypted. The label is the target's and a Component assertion could read
  # it, but the protocol is a value the agent publishes, which only this
  # template reads, so the rule sits here. An agent with another hosting label,
  # or none, stays reachable over http with either: one running inside the
  # Release then receives the credential unencrypted on the cluster network.
  #
  # The realization of each of the connection's attachments is evaluated
  # against this tool as its host, and a host rendered from an artifacts
  # template carries no .context.rendered_name: a realization naming its Secret
  # after the host — k8s-external-secret and k8s-secret-from-parameter both do —
  # halts the build on that key. k8s-existing-secret publishes the name of a
  # Secret that already exists, so it is the realization that fills any of the
  # four slots here. Between them the four slots do not reach a key in the
  # query string, an HTTP scheme answering a challenge, such as Digest, or an
  # OAuth 2.0 grant other than client credentials.
  #
  # The image is the tool's own code, so the agent's address variables above are
  # defaults: a connection that writes no inject block receives
  # AGENT_TOOL_TARGET_ENDPOINT, _HOST, _PORT, _PROTOCOL and _AGENT_CARD_URL,
  # and, beside a credential, AGENT_TOOL_TARGET_CREDENTIAL_HEADER, and beside a
  # client_secret, AGENT_TOOL_TARGET_TOKEN_URL, _OIDC_DISCOVERY_URL and _SCOPES,
  # each where the agent publishes it. A connection that writes an inject block
  # receives exactly what it dictates instead — any key the agent publishes,
  # under the names that code reads — so the halt on several edges, and the halt
  # on an agent publishing neither an endpoint nor a host, hold only for the
  # connections taking the defaults. What the connection's attachments deliver
  # stays on every connection, dictated or not, since an attachment carries no
  # inject block of its own: the credential and client secret by reference,
  # AGENT_TOOL_TARGET_CLIENT_ID and _AUDIENCE from the connection's infra, and
  # the certificate files and their mounts. Each of those is delivered under one
  # name in one container, at one mount directory, so two target_agent
  # connections holding the same slot halt the build, naming the connection and
  # the variable. Every refusal above about a connection's own consistency — a
  # slot whose fill or target cannot serve it, an OAuth address that is not
  # https — holds on every connection too. An edge on a socket the component
  # does not declare has no defaults and receives what it dictates.
  #
  # A dictated env entry becomes an entry of the container's env under the name
  # it gives, read off the inject pipe as a map; a dictated file entry a
  # read-only file at the absolute path it names, held in one ConfigMap and
  # mounted by subPath, so a path that is not absolute, one lying beneath
  # another file's path, and one at, beneath or above a directory a certificate
  # is mounted at, are refused. An arg entry is refused, because this recipe
  # renders no command line: Knative takes a container's arguments in place of
  # the image's default command, which is the Release's. Any other mechanism is
  # refused too. A dictated variable named like one this recipe delivers
  # itself — a value of the tool's own, another connection's default, or what an
  # attachment delivers — halts the build, naming both, since the compiler
  # cannot see the names a recipe writes.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, and its env and file entries reach the
  # container as a connection's do: each env entry under the name it gives,
  # read off the inject pipe, and each file at the absolute path it names, from
  # the same ConfigMap and checked as a connection's file is. The names this
  # recipe gives the tool's own values are defaults: each is rendered, and kept
  # from a connection, only while no entry of that block, in either mechanism,
  # delivers its value. The templates read that at .context.self_inject, which
  # maps each name the developer wrote to values.<key> for an entry whose
  # template reads that one own value. A refusal about one of that block's
  # entries names the block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. The connections
  # and that block only record who dictates each name and each file, and each
  # refusal runs once over both, naming the one that dictated it. It is part of
  # an artifact or a workload template, and no catalog kind holds part of one
  # for several Recipes to share; a change to it is made to all of them.
  #
  # agent-invocation-knative-files.configmap.yaml holds the file entries the
  # connections and the component's own inject block dictate, keyed file-0,
  # file-1 and so on in path order, the keys the Service's mounts read, and is
  # emitted only while either one dictates a file, so a build with none renders
  # nothing there. It names no namespace, as the Service names none, so the two
  # are applied into one namespace together. The block reading the connections'
  # inject directives is the one every Knative realization of a tool in this
  # catalog declares, differing only in the names each delivers itself and the
  # refusals its own connections call for; a change to it is made to all.
  artifacts:
    agent-invocation-knative-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-files
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson (toString $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
    service.yaml: |
      {{- $clientCertificateVolume := "target-agent-client-certificate" -}}
      {{- $clientCertificateDir := "/var/run/secrets/agent-tool/target-agent/client-certificate" -}}
      {{- $serverCaVolume := "target-agent-server-ca" -}}
      {{- $serverCaDir := "/var/run/secrets/agent-tool/target-agent/server-ca" -}}
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      {{- $named := dict -}}
      {{- $ownEnv := dict -}}
      {{- $ownFile := dict -}}
      {{- range $mechanism, $names := default dict .context.self_inject -}}
      {{- range $name, $key := $names -}}
      {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end -}}
      {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end -}}
      {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $dictating := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- range $mechanism, $entries := (default dict $edge.inject) -}}
      {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end -}}
      {{- end -}}
      {{- end -}}
      {{- $wired := list -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if and (eq $edge.socket "target_agent") (not (hasKey $dictating $alias)) -}}
      {{- $wired = append $wired $alias -}}
      {{- end -}}
      {{- end -}}
      {{- if gt (len $wired) 1 -}}
      {{- fail (printf "the target_agent connections %s and %s of %q write no inject block, so each would hand the tool its agent under the same variable names, leaving undefined which agent the tool delegates to: write an inject block on all but one of them, dictating the names the tool's code reads for each agent, or leave one edge on target_agent and declare a second agent-invocation component for a second agent" (index $wired 0) (index $wired 1) .context.instance_id) -}}
      {{- end -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if eq $edge.socket "target_agent" -}}
      {{- $p := default dict $edge.provides -}}
      {{- if and (not (hasKey $dictating $alias)) (not (optional $p "endpoint" "")) (not (optional $p "host" "")) -}}
      {{- fail (printf "the target_agent connection %s of %q reaches %q, which publishes neither an endpoint nor a host, and a connection writing no inject block hands the tool only those to delegate to: wire target_agent to an agent component that publishes one of them, or write an inject block on that connection dictating what the tool's code reads to reach the agent" $alias $.context.instance_id $edge.target) -}}
      {{- end -}}
      {{- with optional (default dict $edge.features) "credential" dict -}}
      {{- $locator := optional . "provides" dict -}}
      {{- if not (and (optional $locator "name" "") (optional $locator "key" "")) -}}
      {{- fail (printf "the credential on the target_agent connection %s of %q publishes no Secret name and data key, so the tool's container could not be given a reference to read it from; attach a credential publishing both, such as core/referenced-secret" $alias $.context.instance_id) -}}
      {{- end -}}
      {{- end -}}
      {{- $in := default dict $edge.infra -}}
      {{- if hasKey (default dict $edge.features) "client_secret" -}}
      {{- $locator := optional $edge.features.client_secret "provides" dict -}}
      {{- if not (and (optional $locator "name" "") (optional $locator "key" "")) -}}
      {{- fail (printf "the client_secret on the target_agent connection %s of %q publishes no Secret name and data key, so the tool's container could not be given a reference to read it from; attach a client_secret publishing both, such as core/referenced-secret" $alias $.context.instance_id) -}}
      {{- end -}}
      {{- if not (optional $in "client_id" "") -}}
      {{- fail (printf "the target_agent connection %s of %q holds a client_secret but no client_id, so the tool's container could not obtain a token with it: set client_id in that connection's infra in the Release to the client id the agent's authorization server issued with the secret" $alias $.context.instance_id) -}}
      {{- end -}}
      {{- if not (or (optional $p "token_url" "") (optional $p "oidc_discovery_url" "")) -}}
      {{- fail (printf "the target_agent connection %s of %q holds a client_secret, but the agent it reaches, %q, publishes neither token_url nor oidc_discovery_url, so the tool's container would have nowhere to obtain a token: set infra.token_url or infra.oidc_discovery_url on that agent to what its card declares, or remove the client_secret" $alias $.context.instance_id $edge.target) -}}
      {{- end -}}
      {{- range $key := list "token_url" "oidc_discovery_url" -}}
      {{- with optional $p $key "" -}}
      {{- $u := urlParse . -}}
      {{- if $u.userinfo -}}
      {{- fail (printf "the %s that %q publishes to the target_agent connection %s of %q carries a user name or password before its host, which would write a credential into the rendered Service: remove it from that agent's infra.%s, since the client secret is held on the connection" $key $edge.target $alias $.context.instance_id $key) -}}
      {{- end -}}
      {{- if not (and (eq $u.scheme "https") $u.hostname) -}}
      {{- fail (printf "the %s that %q publishes to the target_agent connection %s of %q is not an https URL naming a host, and OAuth 2.0 sends a client secret only over TLS: set that agent's infra.%s to the https URL its card declares" $key $edge.target $alias $.context.instance_id $key) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- else if or (hasKey $in "client_id") (hasKey $in "audience") -}}
      {{- fail (printf "the target_agent connection %s of %q sets client_id or audience in its infra but holds no client_secret, so the tool's container has nothing to obtain a token with: attach a client_secret on that connection, or remove client_id and audience" $alias $.context.instance_id) -}}
      {{- end -}}
      {{- if and (eq (optional (default dict $edge.labels) "component.aggrega.ai/hosting" "") "external") (eq (optional $p "protocol" "") "http") -}}
      {{- $sent := dict "credential" "the credential" "client_secret" "the token obtained with it" -}}
      {{- range $slot := list "credential" "client_secret" -}}
      {{- if hasKey (default dict $edge.features) $slot -}}
      {{- fail (printf "the target_agent connection %s of %q holds a %s, but the agent it reaches, %q, is labelled component.aggrega.ai/hosting external and publishes protocol http, so %s would travel to an agent outside the Release unencrypted: reach that agent over https, or remove the %s" $alias $.context.instance_id $slot $edge.target (index $sent $slot) $slot) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $slot := list "client_certificate" "server_ca" -}}
      {{- if hasKey (default dict $edge.features) $slot -}}
      {{- $locator := optional (optional (default dict $edge.features) $slot dict) "provides" dict -}}
      {{- if not (optional $locator "name" "") -}}
      {{- fail (printf "the %s on the target_agent connection %s of %q publishes no Secret name, so no Secret could be mounted into the tool's container: attach a %s publishing one, such as core/referenced-secret" $slot $alias $.context.instance_id $slot) -}}
      {{- end -}}
      {{- if eq (optional $p "protocol" "") "http" -}}
      {{- fail (printf "the target_agent connection %s of %q holds a %s, but the agent it reaches, %q, publishes protocol http, so no TLS handshake would take place to present or check a certificate in: reach that agent over https, or remove the %s" $alias $.context.instance_id $slot $edge.target $slot) -}}
      {{- else if and (not (optional $p "protocol" "")) (optional $p "endpoint" "") (ne (urlParse (optional $p "endpoint" "")).scheme "https") -}}
      {{- fail (printf "the target_agent connection %s of %q holds a %s, but the agent it reaches, %q, publishes no protocol and an endpoint that is not an https URL, so no TLS handshake would take place to present or check a certificate in: reach that agent over https, or remove the %s" $alias $.context.instance_id $slot $edge.target $slot) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $taken := dict -}}
      {{- if not (hasKey $named "values.protocol") }}{{ $_ := set $taken "AGENT_TOOL_PROTOCOL" "the component's own value protocol" }}{{ end -}}
      {{- if not (hasKey $named "values.execution_mode") }}{{ $_ := set $taken "AGENT_TOOL_EXECUTION_MODE" "the component's own value execution_mode" }}{{ end -}}
      {{- if not (hasKey $named "values.side_effects") }}{{ $_ := set $taken "AGENT_TOOL_SIDE_EFFECTS" "the component's own value side_effects" }}{{ end -}}
      {{- if not (hasKey $named "values.timeout_seconds") }}{{ $_ := set $taken "AGENT_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" }}{{ end -}}
      {{- if .values.llm_description_override -}}
      {{- if not (hasKey $named "values.llm_description_override") }}{{ $_ := set $taken "AGENT_TOOL_DESCRIPTION" "the component's own value llm_description_override" }}{{ end -}}
      {{- end -}}
      {{- $mounts := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if eq $edge.socket "target_agent" -}}
      {{- $p := default dict $edge.provides -}}
      {{- $f := default dict $edge.features -}}
      {{- if not (hasKey $dictating $alias) -}}
      {{- $by := printf "the target_agent connection %s, which writes no inject block" $alias -}}
      {{- range $key, $name := dict "endpoint" "AGENT_TOOL_TARGET_ENDPOINT" "host" "AGENT_TOOL_TARGET_HOST" "port" "AGENT_TOOL_TARGET_PORT" "protocol" "AGENT_TOOL_TARGET_PROTOCOL" "agent_card_url" "AGENT_TOOL_TARGET_AGENT_CARD_URL" -}}
      {{- if optional $p $key "" -}}{{- $_ := set $taken $name $by -}}{{- end -}}
      {{- end -}}
      {{- if and (hasKey $f "credential") (optional $p "credential_header" "") -}}
      {{- $_ := set $taken "AGENT_TOOL_TARGET_CREDENTIAL_HEADER" $by -}}
      {{- end -}}
      {{- if hasKey $f "client_secret" -}}
      {{- range $key, $name := dict "token_url" "AGENT_TOOL_TARGET_TOKEN_URL" "oidc_discovery_url" "AGENT_TOOL_TARGET_OIDC_DISCOVERY_URL" "scopes" "AGENT_TOOL_TARGET_SCOPES" -}}
      {{- if optional $p $key "" -}}{{- $_ := set $taken $name $by -}}{{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $held := dict -}}
      {{- if hasKey $f "credential" -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_CREDENTIAL" (printf "the credential held on the target_agent connection %s" $alias) -}}
      {{- end -}}
      {{- if hasKey $f "client_secret" -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_CLIENT_SECRET" (printf "the client_secret held on the target_agent connection %s" $alias) -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_CLIENT_ID" (printf "the client_id set beside the client_secret held on the target_agent connection %s" $alias) -}}
      {{- if optional (default dict $edge.infra) "audience" "" -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_AUDIENCE" (printf "the audience set beside the client_secret held on the target_agent connection %s" $alias) -}}
      {{- end -}}
      {{- end -}}
      {{- if hasKey $f "client_certificate" -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_CLIENT_CERT_FILE" (printf "the client_certificate held on the target_agent connection %s" $alias) -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_CLIENT_KEY_FILE" (printf "the client_certificate held on the target_agent connection %s" $alias) -}}
      {{- $_ := set $mounts $clientCertificateDir "client_certificate" -}}
      {{- end -}}
      {{- if hasKey $f "server_ca" -}}
      {{- $_ := set $held "AGENT_TOOL_TARGET_SERVER_CA_FILE" (printf "the server_ca held on the target_agent connection %s" $alias) -}}
      {{- $_ := set $mounts $serverCaDir "server_ca" -}}
      {{- end -}}
      {{- range $name, $by := $held -}}
      {{- with optional $taken $name "" -}}
      {{- fail (printf "the target_agent connection %s of %q holds an attachment this realization delivers as %s, which it already delivers from %s, and one container holds one variable of each name and one mount of each certificate: hold that slot on one target_agent connection only, and declare a second agent-invocation component for the other agent" $alias $.context.instance_id $name .) -}}
      {{- end -}}
      {{- $_ := set $taken $name $by -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $files := dict -}}
      {{- $dictated := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- range $mechanism, $entries := (default dict $edge.inject) -}}
      {{- range $name, $from := $entries -}}
      {{- if eq $mechanism "env" -}}
      {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
      {{- else if eq $mechanism "file" -}}
      {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
      {{- else if eq $mechanism "arg" -}}
      {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Knative takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
      {{- else -}}
      {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
      {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
      {{- range $name, $by := $dictated -}}
      {{- with optional $taken $name "" -}}
      {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) -}}
      {{- end -}}
      {{- end -}}
      {{- range $name, $by := $files -}}
      {{- if not (hasPrefix "/" $name) -}}
      {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) -}}
      {{- end -}}
      {{- range $dir, $slot := $mounts -}}
      {{- if or (eq $name $dir) (hasPrefix (printf "%s/" $dir) $name) (hasPrefix (printf "%s/" $name) $dir) -}}
      {{- fail (printf "%s dictates a file at %q, and this realization mounts the %s at %q, so the two paths would overlap: dictate the file at a path neither at, beneath nor above that directory" $by $name $slot $dir) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- range $path, $_ := $files -}}
      {{- range $other, $_ := $files -}}
      {{- if hasPrefix (printf "%s/" $path) $other -}}
      {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- $certs := dict -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if eq $edge.socket "target_agent" -}}
      {{- range $slot := list "client_certificate" "server_ca" -}}
      {{- if hasKey (default dict $edge.features) $slot -}}
      {{- $_ := set $certs $slot (index $edge.features $slot).provides.name -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      {{- end -}}
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "{{ .infra.min_replicas }}"
              autoscaling.knative.dev/max-scale: "{{ .infra.max_replicas }}"
              {{- if and .infra.overrides .infra.overrides.annotations }}
              {{- range $k, $v := .infra.overrides.annotations }}
              {{ $k }}: "{{ $v }}"
              {{- end }}
              {{- end }}
          spec:
            containers:
              - image: "{{ .infra.image }}"
                ports:
                  - containerPort: {{ .infra.port }}
                env:
                  {{- if not (hasKey $named "values.protocol") }}
                  - name: AGENT_TOOL_PROTOCOL
                    value: "{{ .values.protocol }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.execution_mode") }}
                  - name: AGENT_TOOL_EXECUTION_MODE
                    value: "{{ .values.execution_mode }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.side_effects") }}
                  - name: AGENT_TOOL_SIDE_EFFECTS
                    value: "{{ .values.side_effects }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.timeout_seconds") }}
                  - name: AGENT_TOOL_TIMEOUT_SECONDS
                    value: "{{ .values.timeout_seconds }}"
                  {{- end }}
                  {{- if not (hasKey $named "values.llm_description_override") }}
                  {{- with .values.llm_description_override }}
                  - name: AGENT_TOOL_DESCRIPTION
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- range $name, $_ := $ownEnv }}
                  - name: {{ toJson $name }}
                    value: {{ toJson (toString (optional $env $name "")) }}
                  {{- end }}
                  {{- range $alias, $edge := .context.uses }}
                  {{- $dictates := hasKey $dictating $alias }}
                  {{- if $dictates }}
                  {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
                  - name: {{ toJson $name }}
                    value: {{ toJson (toString (optional $env $name "")) }}
                  {{- end }}
                  {{- end }}
                  {{- if eq $edge.socket "target_agent" }}
                  {{- if not $dictates }}
                  {{- with (optional (default dict $edge.provides) "endpoint" "") }}
                  - name: AGENT_TOOL_TARGET_ENDPOINT
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "host" "") }}
                  - name: AGENT_TOOL_TARGET_HOST
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "port" "") }}
                  - name: AGENT_TOOL_TARGET_PORT
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "protocol" "") }}
                  - name: AGENT_TOOL_TARGET_PROTOCOL
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "agent_card_url" "") }}
                  - name: AGENT_TOOL_TARGET_AGENT_CARD_URL
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- if hasKey (default dict $edge.features) "credential" }}
                  - name: AGENT_TOOL_TARGET_CREDENTIAL
                    valueFrom:
                      secretKeyRef:
                        name: "{{ $edge.features.credential.provides.name }}"
                        key: "{{ $edge.features.credential.provides.key }}"
                  {{- if not $dictates }}
                  {{- with (optional (default dict $edge.provides) "credential_header" "") }}
                  - name: AGENT_TOOL_TARGET_CREDENTIAL_HEADER
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- end }}
                  {{- if hasKey (default dict $edge.features) "client_secret" }}
                  {{- if not $dictates }}
                  {{- with (optional (default dict $edge.provides) "token_url" "") }}
                  - name: AGENT_TOOL_TARGET_TOKEN_URL
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "oidc_discovery_url" "") }}
                  - name: AGENT_TOOL_TARGET_OIDC_DISCOVERY_URL
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional (default dict $edge.provides) "scopes" "") }}
                  - name: AGENT_TOOL_TARGET_SCOPES
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- with (optional (default dict $edge.infra) "audience" "") }}
                  - name: AGENT_TOOL_TARGET_AUDIENCE
                    value: "{{ . }}"
                  {{- end }}
                  - name: AGENT_TOOL_TARGET_CLIENT_ID
                    value: "{{ optional (default dict $edge.infra) "client_id" "" }}"
                  - name: AGENT_TOOL_TARGET_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: "{{ $edge.features.client_secret.provides.name }}"
                        key: "{{ $edge.features.client_secret.provides.key }}"
                  {{- end }}
                  {{- if hasKey (default dict $edge.features) "client_certificate" }}
                  - name: AGENT_TOOL_TARGET_CLIENT_CERT_FILE
                    value: "{{ $clientCertificateDir }}/tls.crt"
                  - name: AGENT_TOOL_TARGET_CLIENT_KEY_FILE
                    value: "{{ $clientCertificateDir }}/tls.key"
                  {{- end }}
                  {{- if hasKey (default dict $edge.features) "server_ca" }}
                  - name: AGENT_TOOL_TARGET_SERVER_CA_FILE
                    value: "{{ $serverCaDir }}/ca.crt"
                  {{- end }}
                  {{- end }}
                  {{- end }}
                resources:
                  requests:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                  limits:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                {{- if or $certs $files }}
                volumeMounts:
                  {{- if hasKey $certs "client_certificate" }}
                  - name: {{ $clientCertificateVolume }}
                    mountPath: "{{ $clientCertificateDir }}"
                    readOnly: true
                  {{- end }}
                  {{- if hasKey $certs "server_ca" }}
                  - name: {{ $serverCaVolume }}
                    mountPath: "{{ $serverCaDir }}"
                    readOnly: true
                  {{- end }}
                  {{- $i := 0 }}
                  {{- range $path, $_ := $files }}
                  - name: inject-files
                    mountPath: {{ toJson $path }}
                    subPath: "file-{{ $i }}"
                    readOnly: true
                  {{- $i = add $i 1 }}
                  {{- end }}
                {{- end }}
            {{- if or $certs $files }}
            volumes:
              {{- with optional $certs "client_certificate" "" }}
              - name: {{ $clientCertificateVolume }}
                secret:
                  secretName: "{{ . }}"
              {{- end }}
              {{- with optional $certs "server_ca" "" }}
              - name: {{ $serverCaVolume }}
                secret:
                  secretName: "{{ . }}"
              {{- end }}
              {{- if $files }}
              - name: inject-files
                configMap:
                  name: "{{ .context.instance_id }}-files"
              {{- end }}
            {{- end }}
