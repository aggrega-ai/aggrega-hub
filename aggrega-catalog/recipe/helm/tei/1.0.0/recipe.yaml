apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: tei
  version: 1.0.0
  description: >
    Text Embeddings Inference as a self-hosted embedding server on Kubernetes via
    the helm provider's Workload synthesis, running the official upstream image
    directly (no external Helm chart). Renders a StatefulSet: a weights-pull
    initContainer resolves the model pointer into a per-replica model-cache
    volume, and the serving container mounts the same volume and serves the
    embeddings API behind a ClusterIP Service. The model value is a deterministic
    pointer the initContainer resolves at pod start; the compiler never fetches
    weights. When the optional model_pull_token credential slot is attached the
    token reaches the initContainer as an env secretKeyRef, so it never appears in
    the rendered manifest; unattached, weights are pulled anonymously,
    byte-identically to a recipe with no slot. provides.host is the bare,
    self-contained in-cluster service name; a consumer in another namespace
    qualifies it on its own side.
  license: Apache-2.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/tei:1.0.0
  # This Recipe reads no infra.overrides keys.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.instance_id }}-default:{{ .infra.port }}/v1"
    model: "{{ .values.model }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateful
    replicas: {{ .infra.replicas }}
    {{- with (default dict .infra.gpu).runtime_class }}
    runtimeClassName: {{ . }}
    {{- end }}
    initContainers:
      - name: model-pull
        # The TEI runtime image is a distroless binary with no downloader, so a
        # slim Hugging Face CLI image pre-downloads the model into the shared
        # model-cache volume. .values.model is the deterministic pointer the
        # runtime resolves here; the compiler pipes the string unresolved (AOT).
        image: "python:3.12-slim"
        command: ["/bin/sh"]
        args:
          - "-c"
          - "pip install --no-cache-dir --quiet 'huggingface_hub[cli]' && huggingface-cli download {{ .values.model }}"
        variables:
          HF_HOME: /models
          HUGGINGFACE_HUB_CACHE: /models
    {{- if hasKey (default dict .features) "model_pull_token" }}
        attachments:
          HF_TOKEN:
            from: model_pull_token
            as: env
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    containers:
      main:
        image: "ghcr.io/huggingface/text-embeddings-inference:{{ .infra.engine_version }}"
        args:
          - "--model-id"
          - "{{ .values.model }}"
          - "--pooling"
          - "{{ .values.pooling }}"
          - "--port"
          - "{{ .infra.port }}"
        variables:
          HUGGINGFACE_HUB_CACHE: /models
        ports:
          http: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
    {{- if (default dict .infra.gpu).count }}
            "nvidia.com/gpu": "{{ .infra.gpu.count }}"
    {{- end }}
        volumeMounts:
          - name: model-cache
            path: /models
    volumes:
      model-cache:
        persistentTemplate:
          size: {{ .infra.model_cache.size }}
    {{- with .infra.model_cache.class }}
          class: {{ . }}
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
