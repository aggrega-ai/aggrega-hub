apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: n8n-chart
  version: 1.0.0
  description: >
    The n8n automation platform on Kubernetes via n8n's own Helm chart, pulled
    from its OCI registry: one Deployment serving the editor and the webhook
    endpoint on a ClusterIP Service, on n8n's own SQLite database, with no
    queue workers, external database or cache. The chart was checked for
    being official, complete and maintained against the chart itself. The
    image is the one the Release names in `infra.image`, never the chart's
    own default, so the build halts until it is set.

    The data directory is a persistent volume sized by `infra.storage.size`,
    so the workflows and credentials authored in the editor, and the
    encryption key n8n generates on its first start, survive a restart. A
    workflow definition, when supplied, is carried in a ConfigMap and
    imported by an init container with `n8n import:workflow` on every start.

    The `model`, `tools` and `vector_store` connections arrive under the
    variables the workload-synthesis realization delivers, every credential
    through a secretKeyRef, a connection writing an `inject:` block receiving
    the names it dictates as there, and N8N_BLOCK_ENV_ACCESS_IN_NODE is true
    unless the component's allow_env_access_in_nodes value is true.
    `infra.external_base_url`, where set, becomes the editor address and the
    webhook base. With `values.metrics_enabled` true, N8N_METRICS turns n8n's
    metrics on, at /metrics on the Service's port 5678, which answers that
    path without a sign-in, and provides.metrics_endpoint publishes the
    address.

    The chart's own connection-check Pod is not rendered.

    Reach for this realization where a chart repository is reachable at
    build time; reach for `n8n`, the workload-synthesis realization, where
    the build must complete with nothing fetched.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/n8n:1.0.0

  # The chart is published by n8n's own maintainers from the n8n-io/n8n-hosting
  # repository, under the MIT licence, which calls it the official n8n Helm
  # chart, and the version pinned below is the latest it has published; each
  # chart release packages the n8n release current when it was cut. It carries
  # what this Component exposes: a single-pod mode on n8n's own SQLite
  # database, a list of extra environment entries that takes references to
  # Secrets, extra init containers, volumes and mounts, and a persistent volume
  # for the data directory. Those were the three checks a chart is held to —
  # official, complete, maintained — before a Recipe points at it. Every chart
  # version declares the n8n version it packages as its default image tag; the
  # catalog names no n8n image, so that default is never left to reach a
  # render. The software this realizes is published under n8n's own
  # source-available terms, which no single licence identifier names, so this
  # Recipe states no licence, as the workload-synthesis realization states none.
  source:
    kind: helm-oci-chart
    url: oci://ghcr.io/n8n-io/n8n-helm-chart/n8n
    # Default chart version. Override via infra.source_version; a version
    # other than this one may need a different value mapping.
    version: "{{ optional .infra `source_version` \"1.16.0\" }}"

  # metrics_endpoint is the address n8n serves its own metrics at while
  # values.metrics_enabled is true: /metrics on port 5678 of the chart's
  # ClusterIP Service, "<rendered_name>-main" — the valuesMapping below pins the
  # chart's fullnameOverride to the rendered name, and the chart names its
  # Service and its Deployment by that name with a "-main" suffix, read from a
  # render of the chart made both with and without the pin, not assumed. The
  # name carries no namespace, so a consumer in another namespace qualifies the
  # host on its own side. It is empty while the value is false, when the
  # metrics are off.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-main:5678/metrics{{ end }}"

  # Two halts, each naming what to change in the document a reader wrote.
  #
  # The image. The catalog names no n8n image, and this chart's own default is
  # n8n's image at the n8n version the chart packages, so a Release naming
  # none would run whatever version the chart was cut with. The chart composes
  # the image from a repository and a tag, so the image the Release names
  # carries a tag or a digest, which the chart writes back exactly as named; an
  # image named with neither would be given the chart's own tag. The
  # workload-synthesis realization halts on a missing image too, through the
  # Workload's own schema.
  #
  # The volume size. The chart accepts the size of its data volume only as a
  # whole number of gibibytes, and would otherwise refuse the value under its
  # own setting's name rather than the one the Release wrote.
  assertions:
    image_is_named: >-
      {{- $image := optional .infra "image" "" -}}
      {{- if not $image -}}
      {{- fail (printf "the n8n platform %q names no container image: the catalog pins none, so set infra.image in the Release to the n8n image to run, with its tag or digest" .metadata.instance_id) -}}
      {{- else if not (contains ":" (last (splitList "/" $image))) -}}
      {{- fail (printf "the n8n platform %q names the image %q with no tag or digest, and the chart this Recipe renders would run it at the n8n version the chart packages: write the tag or the digest into infra.image" .metadata.instance_id $image) -}}
      {{- end -}}
    storage_size_in_gibibytes: >-
      {{- $size := toString (optional (optional .infra "storage" dict) "size" "") -}}
      {{- if not (regexMatch "^[0-9]+Gi$" $size) -}}
      {{- fail (printf "the n8n platform %q sets infra.storage.size to %q, and the chart this Recipe renders sizes its data volume only as a whole number of gibibytes, such as 10Gi: write the size that way" .metadata.instance_id $size) -}}
      {{- end -}}

  # Two documents the chart renders are left out.
  #
  # The chart's own connection check, a Pod carrying the helm.sh/hook: test
  # annotation that fetches the platform's /healthz once, runs a base image the
  # Component never names and no chart setting pins or overrides. It is left
  # out of the render rather than described; the platform's own probes cover
  # the same address.
  #
  # The Secret holding the token the chart's task-runner sidecars present. The
  # chart renders it whatever it is given, with a token it generates on every
  # render, so two renders of one Release would differ. Its sidecars are off
  # under this configuration, as in the workload-synthesis realization, and
  # nothing rendered reads the Secret.
  omits:
    - kind: Pod
      name: "{{ .context.rendered_name }}-test-connection"
    - kind: Secret
      name: "{{ .context.rendered_name }}-task-runners"

  # The workflow definition is authored by the developer on .values. When
  # present it renders a ConfigMap the init container reads; presence-guarded
  # so an Aggregate supplying no definition emits no ConfigMap. The pod mounts
  # the ConfigMap by name, which resolves only in the pod's own namespace, so
  # the ConfigMap carries the namespace the Release, or else the Aggregate, declares for the component
  # through the aggrega.ai/namespace annotation, and none where it declares
  # none. Its name is built from the rendered name, as the chart's own names
  # are, and differs from the chart's own ConfigMap, "<rendered_name>".
  #
  # DELIBERATE NEAR-DUPLICATE: this artifact is the workload-synthesis
  # realization's, byte for byte, because no ArtifactLibrary carries it and a
  # Recipe cannot import another Recipe's artifact. A change to one is made to
  # the other.
  artifacts:
    n8n-flow.configmap.yaml: |
      {{- if .values.flow_definition }}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-flow
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        workflow.json: |
      {{ .values.flow_definition | indent 6 }}
      {{- end }}
    # The ConfigMap holding the file entries the connections dictate, keyed
    # file-0, file-1 and so on in path order, the keys the value mapping's
    # mounts read; emitted only while a connection dictates a file. It is the
    # workload-synthesis realization's, byte for byte, for the reason above.
    n8n-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}

  # This Recipe reads no infra.overrides keys; the Component declares none, and
  # the platform's image is already the Release's own, in infra.image.
  #
  # Under this configuration the chart renders one Deployment running the
  # platform, "<rendered_name>-main"; a ClusterIP Service of the same name on
  # port 5678; the persistent volume claim for the data directory,
  # "<rendered_name>"; the ConfigMap and the Secret the platform reads the
  # chart's own variables from, both "<rendered_name>"; and the ServiceAccount
  # the pod runs under, named after the rendered name too — the chart's own
  # default names it "n8n" whatever the release is called, which two
  # installations in one namespace would share. Its queue mode, its worker,
  # webhook-processor and task-runner pods, and the external database and
  # cache queue mode needs are off, because none of it is compute the
  # Aggregate declared; its Ingress, autoscalers, network policy, disruption
  # budget and object storage are left off, because the Component describes
  # none of them; an earlier chart version renders that budget over the single
  # pod, which would hold a node drain until the pod is deleted by hand. The
  # chart sets the namespace of each object to the release namespace, and the
  # helm provider places each object in the namespace the Release, or else the Aggregate, declares.
  #
  # The chart's Role and RoleBinding are not rendered either. They grant the
  # platform's ServiceAccount read access to every Secret and every ConfigMap
  # in its namespace, which this mode does not use, and a workflow able to run
  # code could reach that access through the account's token. Without them the
  # pod runs with the privileges the workload-synthesis realization gives it.
  #
  # The data directory. The chart runs n8n on its own SQLite database only with
  # its data directory, /home/node/.n8n, on a persistent volume, and refuses to
  # render otherwise; so this realization keeps that directory on a claim
  # sized by infra.storage.size, where the workload-synthesis realization keeps
  # it on a scratch volume. The workflows and credentials authored in the
  # editor survive a restart here, and so does the encryption key n8n
  # generates on its first start and keeps in that directory. One pod writes
  # the claim, so an update stops the old pod before starting the new one.
  #
  # The encryption key. The chart reads it from its own Secret, and refuses to
  # render while that Secret holds the key the chart publishes as a
  # placeholder, a key every reader of the chart holds. It is written there
  # empty instead: n8n treats an empty key as no key, and generates one of its
  # own on its first start, which is what the workload-synthesis realization
  # leaves it to do. The chart reads the host, port and protocol n8n composes
  # its own addresses from out of the same Secret, so they are written there
  # as n8n's own defaults — localhost, 5678 and http — which the
  # workload-synthesis realization leaves unset to the same effect.
  #
  # The variables. Every variable the workload-synthesis realization delivers
  # is written into the chart's list of extra environment entries under the
  # same name, with the same value: OPENAI_BASE_URL from the model edge;
  # N8N_EDITOR_BASE_URL, N8N_WEBHOOK_URL and WEBHOOK_URL from
  # infra.external_base_url; N8N_BLOCK_ENV_ACCESS_IN_NODE, always; N8N_METRICS
  # while values.metrics_enabled is true; and, for each `tools` and
  # `vector_store` connection, the variables named for its alias. The chart's
  # own webhook and editor settings are left empty, so the chart writes none
  # of those addresses itself; it would write two of the three, from its
  # ConfigMap. Every credential — the model API key, a tool's credential or
  # whole address, a store's credential — is a secretKeyRef to the Secret its
  # slot's realization names, with that realization's key, so no credential
  # value is written into any rendered file; a fill that publishes no Secret
  # name halts the build, naming the connection and the slot, because the
  # reference would name no Secret. What each variable does is stated in the
  # workload-synthesis realization's comments.
  #
  # Those of a connection's variables its provides fill are defaults, as
  # there: a connection writing an inject block receives exactly the names it
  # dictates instead, as entries at the end of the same list, and a file it
  # dictates is mounted read-only into the platform's container by subPath
  # from the ConfigMap above, through the chart's extra volumes and mounts. A
  # dictated name the chart already writes from its own ConfigMap or Secret —
  # TZ, DB_TYPE, N8N_WEBHOOK_TIMEOUT, the EXECUTIONS_ settings, the
  # encryption key and the host, port and protocol — halts the build, as do
  # the names the workload-synthesis realization refuses.
  #
  # The workflow import. The chart's extra init containers run before the
  # platform, so the supplied definition is imported by an init container of
  # the same name, image, command and mounts as the workload-synthesis
  # realization's: the image the Release names, `n8n import:workflow` reading
  # the definition from the mounted ConfigMap, into the data directory the
  # platform serves from.
  #
  # The probes are the chart's own: a start-up probe on /healthz allowing
  # 300 s, readiness on /healthz/readiness and liveness on /healthz, the same
  # paths and timing the workload-synthesis realization takes from it. The
  # chart's own settings beyond the Component's surface are kept as it ships
  # them: its resource requests and limits, a pause before the pod stops, the
  # time zone, its webhook timeout, and the variables keeping and pruning
  # execution data, at the chart's retention of fourteen days.
  #
  # DELIBERATE NEAR-DUPLICATE: the variables and their names repeat the
  # workload-synthesis realization's, because that realization writes them as a
  # synthesized workload's variables and attachments and this one as a chart's
  # values, and no catalog kind lets one template feed both. A variable added to
  # one is added to the other.
  valuesMapping: |
    {{- /* The chart mounts its data volume at this directory itself; the import mounts the same one. */}}
    {{- $dataPath := "/home/node/.n8n" }}
    {{- $seedPath := "/flows" }}
    {{- $image := optional .infra "image" "" }}
    {{- $tag := last (splitList ":" (last (splitList "/" $image))) }}
    {{- $repository := trimSuffix (printf ":%s" $tag) $image }}
    {{- /* Every credential, as variable, connection, slot and the fill's published Secret, in the order the
      workload-synthesis realization lists its attachments. */}}
    {{- $secretRefs := list }}
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
    {{- $secretRefs = append $secretRefs (list "OPENAI_API_KEY" $alias "credential" $features.credential.provides) }}
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- if hasKey $features "endpoint" }}
    {{- $secretRefs = append $secretRefs (list (printf "AGGREGA_TOOL_%s_URL" $name) $alias "endpoint" $features.endpoint.provides) }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $secretRefs = append $secretRefs (list (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) $alias "credential" $features.credential.provides) }}
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") }}
    {{- $secretRefs = append $secretRefs (list (printf "AGGREGA_VECTOR_STORE_%s_CREDENTIAL" $name) $alias "credential" $features.credential.provides) }}
    {{- end }}
    {{- end }}
    {{- range $ref := $secretRefs }}
    {{- if not (optional (index $ref 3) "name" "") }}
    {{- fail (printf "the %s slot of the %s connection of the n8n platform %q is filled by a realization that publishes no Secret name, so the platform would read %s from no Secret: bind that slot's Feature to a realization that names the Secret it holds" (index $ref 2) (index $ref 1) $.context.instance_id (index $ref 0)) }}
    {{- end }}
    {{- end }}
    {{- /* What each connection dictates, the names already taken and the dictated files, as the
      workload-synthesis realization computes them, the chart's own variables added to the names taken. */}}
    {{- $env := optional (default dict .context.inject) "env" dict }}
    {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict }}
    {{- range $var := list "TZ" "DB_TYPE" "N8N_WEBHOOK_TIMEOUT" "EXECUTIONS_TIMEOUT_MAX" "EXECUTIONS_DATA_SAVE_ON_ERROR" "EXECUTIONS_DATA_SAVE_ON_SUCCESS" "EXECUTIONS_DATA_SAVE_ON_PROGRESS" "EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS" "EXECUTIONS_DATA_PRUNE" "EXECUTIONS_DATA_MAX_AGE" "EXECUTIONS_DATA_PRUNE_MAX_COUNT" "EXECUTIONS_DATA_HARD_DELETE_BUFFER" "EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL" "EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL" "N8N_ENCRYPTION_KEY" "N8N_HOST" "N8N_PORT" "N8N_PROTOCOL" }}
    {{- $_ := set $taken $var "the platform's own setting, which the chart writes itself" }}
    {{- end }}
    {{- if .infra.external_base_url }}
    {{- range $var := list "N8N_EDITOR_BASE_URL" "N8N_WEBHOOK_URL" "WEBHOOK_URL" }}
    {{- $_ := set $taken $var "the platform's own setting written from infra.external_base_url" }}
    {{- end }}
    {{- end }}
    {{- $_ := set $taken "N8N_BLOCK_ENV_ACCESS_IN_NODE" "the platform's own setting written from values.allow_env_access_in_nodes" }}
    {{- if .values.metrics_enabled }}
    {{- $_ := set $taken "N8N_METRICS" "the platform's own setting turning its metrics on" }}
    {{- end }}
    {{- $connectionVars := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if eq $edge.socket "model" }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, which writes no inject block" $alias) }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if or (eq $edge.socket "tools") (eq $edge.socket "vector_store") }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $byDefault := printf "the %s connection %s, which writes no inject block" $edge.socket $alias }}
    {{- $delivers := dict }}
    {{- if eq $edge.socket "tools" }}
    {{- if hasKey $features "endpoint" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) (printf "the endpoint attached on the tools connection %s" $alias) }}
    {{- else if not (hasKey $dictating $alias) }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) $byDefault }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) (printf "the credential attached on the tools connection %s" $alias) }}
    {{- if and (not (hasKey $dictating $alias)) (optional $edge.provides "credential_header" "") }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL_HEADER" $name) $byDefault }}
    {{- end }}
    {{- end }}
    {{- else }}
    {{- if not (hasKey $dictating $alias) }}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_URL" $name) $byDefault }}
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
    {{- range $part := list "HOST" "PORT" "DATABASE" "USER" }}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_%s" $name $part) $byDefault }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $delivers (printf "AGGREGA_VECTOR_STORE_%s_CREDENTIAL" $name) (printf "the credential attached on the vector_store connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- range $var, $by := $delivers }}
    {{- with optional $connectionVars $var "" }}
    {{- fail (printf "the %s connections %s and %s of %q would both deliver the variable %s, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" $edge.socket . $alias $.context.instance_id $var) }}
    {{- end }}
    {{- $_ := set $connectionVars $var $alias }}
    {{- $_ := set $taken $var $by }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $files := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) }}
    {{- end }}
    {{- else if eq $mechanism "file" }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) }}
    {{- end }}
    {{- $_ := set $files $name (optional $pipeFiles $name "") }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line for the platform: Kubernetes takes a container's arguments in place of the image's default command, which starts the platform. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}

    ## ── Pin the chart's resource names to the rendered name ────
    ## The chart names its Deployment and Service "<rendered_name>-main" and
    ## its claim, ConfigMap and Secret "<rendered_name>".
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── The image the Release names ────────────────────────────
    ## Split into the repository and the tag the chart composes, the tag being
    ## what follows the last colon of the last path segment, so a digest is
    ## written back exactly as named.
    image:
      repository: "{{ $repository }}"
      tag: "{{ $tag }}"
      digest: ""
      pullPolicy: IfNotPresent

    ## ── One pod on n8n's own SQLite database ───────────────────
    queueMode:
      enabled: false
    database:
      type: sqlite
      useExternal: false
    redis:
      enabled: false
    multiMain:
      enabled: false
    webhookProcessor:
      enabled: false
    taskRunners:
      enabled: false
    s3:
      enabled: false
    replicaCount: 1
    strategy:
      type: Recreate

    ## ── What the Component describes none of ───────────────────
    ingress:
      enabled: false
    networkPolicy:
      enabled: false
    pdb:
      enabled: false
    rbac:
      create: false
    serviceAccount:
      create: true
      name: ""

    ## ── The data directory ─────────────────────────────────────
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "{{ .infra.storage.size }}"
      storageClassName: ""

    ## ── The chart's own Secret ─────────────────────────────────
    ## An empty key leaves the key to n8n; the host, port and protocol are
    ## n8n's own defaults.
    secretRefs:
      existingSecret: ""
      env:
        N8N_ENCRYPTION_KEY: ""
        N8N_ENCRYPTION_KEY_FILE: ""
        N8N_HOST: "localhost"
        N8N_PORT: "5678"
        N8N_PROTOCOL: "http"

    ## ── Addresses: written below, not by the chart ─────────────
    webhook:
      url: ""
    editor:
      url: ""

    service:
      type: ClusterIP
      port: 5678

    ## ── The platform's variables ───────────────────────────────
    ## The credentials first, then the plain variables, the order the
    ## workload-synthesis realization renders them in.
    config:
      extraEnv:
      {{- range $ref := $secretRefs }}
        - name: {{ index $ref 0 }}
          valueFrom:
            secretKeyRef:
              name: "{{ (index $ref 3).name }}"
              key: "{{ (index $ref 3).key }}"
      {{- end }}
      {{- range $alias, $edge := .context.uses }}
      {{- if and (eq $edge.socket "model") (not (hasKey $dictating $alias)) }}
        - name: OPENAI_BASE_URL
          value: "{{ $edge.provides.endpoint }}"
      {{- end }}
      {{- end }}
      {{- with .infra.external_base_url }}
        - name: N8N_EDITOR_BASE_URL
          value: "{{ . }}"
        - name: N8N_WEBHOOK_URL
          value: "{{ . }}"
        - name: WEBHOOK_URL
          value: "{{ . }}"
      {{- end }}
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "{{ if optional .values "allow_env_access_in_nodes" false }}false{{ else }}true{{ end }}"
      {{- if .values.metrics_enabled }}
        - name: N8N_METRICS
          value: "true"
      {{- end }}
      {{- range $alias, $edge := .context.uses }}
      {{- if and (eq $edge.socket "tools") (not (hasKey $dictating $alias)) }}
      {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
      {{- $features := default dict $edge.features }}
      {{- if not (hasKey $features "endpoint") }}
        - name: AGGREGA_TOOL_{{ $name }}_URL
          value: "{{ $edge.provides.endpoint }}"
      {{- end }}
      {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
        - name: AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER
          value: "{{ $edge.provides.credential_header }}"
      {{- end }}
      {{- end }}
      {{- end }}
      {{- range $alias, $edge := .context.uses }}
      {{- if and (eq $edge.socket "vector_store") (not (hasKey $dictating $alias)) }}
      {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
      {{- $url := optional $edge.provides "endpoint" "" }}
      {{- if not $url }}
      {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
      {{- end }}
        - name: AGGREGA_VECTOR_STORE_{{ $name }}_URL
          value: "{{ $url }}"
      {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
        - name: AGGREGA_VECTOR_STORE_{{ $name }}_HOST
          value: "{{ $edge.provides.host }}"
        - name: AGGREGA_VECTOR_STORE_{{ $name }}_PORT
          value: "{{ $edge.provides.port }}"
        - name: AGGREGA_VECTOR_STORE_{{ $name }}_DATABASE
          value: "{{ $edge.provides.database }}"
        - name: AGGREGA_VECTOR_STORE_{{ $name }}_USER
          value: "{{ $edge.provides.user }}"
      {{- end }}
      {{- end }}
      {{- end }}
      {{- /* The variables connections dictate, after every variable this recipe names, in alias order. */}}
      {{- range $alias, $edge := .context.uses }}
      {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
        - name: {{ toJson $name }}
          value: {{ toJson (optional $env $name "") }}
      {{- end }}
      {{- end }}

    ## ── The workflow import ────────────────────────────────────
    {{- if .values.flow_definition }}
    extraInitContainers:
      - name: import-flow
        image: "{{ $image }}"
        command: ["n8n"]
        args: ["import:workflow", "--input={{ $seedPath }}/workflow.json"]
        volumeMounts:
          - name: data
            mountPath: "{{ $dataPath }}"
          - name: flow
            mountPath: "{{ $seedPath }}"
    {{- end }}
    {{- if or .values.flow_definition $files }}
    extraVolumes:
    {{- if .values.flow_definition }}
      - name: flow
        configMap:
          name: "{{ .context.rendered_name }}-flow"
    {{- end }}
    {{- if $files }}
      - name: inject-files
        configMap:
          name: "{{ .context.rendered_name }}-files"
    {{- end }}
    {{- end }}

    ## ── The files connections dictate ──────────────────────────
    ## Mounted read-only into the platform's container, one file each, by
    ## subPath from the ConfigMap the artifacts emit.
    {{- if $files }}
    extraVolumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
      - name: inject-files
        mountPath: {{ toJson $path }}
        subPath: "file-{{ $i }}"
        readOnly: true
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
