apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mastra
  version: 1.0.0
  # A tools connection holding the tool's whole address as a secret, for a
  # server that reads its key from its address, delivers that secret as
  # AGGREGA_TOOL_<ALIAS>_URL through a secretKeyRef instead of the published
  # address.
  description: >
    A server built by Mastra, on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment running the image the Release supplies, and a ClusterIP Service
    fronting infra.port, which the server receives as PORT beside MASTRA_HOST
    set to 0.0.0.0. A readiness probe reads Mastra's /health route, so the
    Service sends no traffic until the server answers; provides is that
    Service's host, port, endpoint and protocol, and, where values.agent_id is
    set, the address of that agent's Agent2Agent card.

    The model wired into the `model` socket reaches the server as the
    variables Mastra reads for an openai/ model: its endpoint as
    OPENAI_BASE_URL, and the connection's credential as OPENAI_API_KEY through
    a secretKeyRef, so the key never renders into the manifest.

    Each tool wired into the `tools` socket reaches the server under variables
    named for the connection's alias, upper-cased with hyphens as underscores:
    its address as AGGREGA_TOOL_<ALIAS>_URL, and, where the connection carries
    a credential, that credential as AGGREGA_TOOL_<ALIAS>_CREDENTIAL through a
    secretKeyRef, with the header the tool publishes for it as
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER.

    A connection writing an `inject:` block also receives the names it
    dictates, as variables or as files mounted at the paths it names: a tools
    connection in place of its address and header variables, while what its
    attachments deliver stays, and the model connection beside the variables
    Mastra reads. So does the component's own block. A set values.agent_id
    reaches the server as MASTRA_AGENT_ID by default; an entry of the
    component's own block reading it alone replaces that name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/mastra:1.0.0
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service
  # "<rendered_name>-<service-key>", and this workload's one service key is
  # "default". It carries no namespace segment, so the recipe is independent of
  # where it is deployed and a consumer in another namespace qualifies it on
  # its own side. A caller reaches this Service directly, so the port is the
  # one the server listens on.
  #
  # Mastra serves the card of a registered agent at
  # /.well-known/<agentId>/agent-card.json under its API prefix, /api unless
  # the application's code sets another, so agent_card_url is composed on the
  # published endpoint from values.agent_id, and is empty while it is unset.
  # The card lists the address a caller sends requests to, formed from the
  # address the caller fetched the card at.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "http"
    agent_card_url: "{{ with optional .values \"agent_id\" \"\" }}http://{{ $.context.rendered_name }}-default:{{ $.infra.port }}/api/.well-known/{{ . }}/agent-card.json{{ end }}"
  # The model arrives on the `model` uses-edge, addressed by the
  # developer-chosen alias, so the recipe ranges the outbound edges and matches
  # on the socket name to find it, then reads the model's published endpoint.
  # Mastra's model router reads an openai/ model's address from
  # OPENAI_BASE_URL and hands it to its OpenAI client as that client's base,
  # the version path included, which is the form a model serving the OpenAI
  # API publishes; it reads the key from OPENAI_API_KEY. The agent's code
  # names the model, so no model name is delivered.
  #
  # The credential, when one is attached on the `model` connection, is
  # delivered as OPENAI_API_KEY through a secretKeyRef naming that connection;
  # a connection carrying none emits no key variable.
  #
  # PORT is infra.port, and MASTRA_HOST is 0.0.0.0, every interface: Mastra's
  # server reads both, and its documented default host is localhost, which the
  # Service could not reach. A port or a host the application's code sets in
  # its server configuration takes precedence over either.
  #
  # Mastra documents /health as its health check, returning 200 OK, and serves
  # it before any authentication the application configures, so the readiness
  # probe reads it on the one container port. No liveness probe is declared:
  # Mastra documents none, and a start-up time cannot be known for an image
  # this realization does not name.
  #
  # Each `tools` connection's variables are named for its alias, upper-cased,
  # with every character other than a letter or a digit an underscore; the
  # alias grammar admits only a hyphen and an underscore besides, so a hyphen
  # becomes an underscore. AGGREGA_TOOL_<ALIAS>_URL is the endpoint the tool
  # publishes, unless the connection carries an endpoint secret: then it is
  # that secret, referenced by connection and slot, and the published address
  # is not delivered. The credential is delivered only where the connection
  # carries one, and the header beside it only where the tool publishes one;
  # a tool behind a bridge publishes none, because the bridge checks no
  # caller's credential. The address and the header are the defaults a tools
  # connection writing an inject block gives up for the names it dictates; the
  # two secrets are its attachments' and stay.
  #
  # Every secret on every connection sits under one attachments key, so the
  # block is opened once, and only where one connection carries a secret.
  workload: |
    {{- /*
      The image is the Release's own code, so the names this recipe derives from
      a connection's provides are defaults: a connection that writes no inject
      block receives them, and a connection that writes one receives exactly
      what it dictates instead, read off the inject pipe as a map. On a model
      connection nothing is a default: Mastra's model router reads
      OPENAI_BASE_URL by itself, and OPENAI_API_KEY is the credential attached
      on the connection, so a model connection that dictates receives its names
      beside them. On a tools connection the defaults are
      AGGREGA_TOOL_<ALIAS>_URL from the endpoint the tool publishes and
      AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER from the header it publishes,
      while what its attachments deliver stays either way: the credential as
      AGGREGA_TOOL_<ALIAS>_CREDENTIAL, and an endpoint secret as
      AGGREGA_TOOL_<ALIAS>_URL. PORT and MASTRA_HOST are the component's own.

      A dictated env entry becomes a container variable under the name it
      gives, after the variables this recipe names for the server, the model
      and the tools; a dictated file entry a
      read-only file at the absolute path it names, held in one ConfigMap and
      mounted by subPath, so a path that is not absolute, or one lying beneath
      another file's path, is refused. An arg entry is refused, because this
      recipe renders no command line: Kubernetes takes a container's arguments
      in place of the image's default command, which is the Release's. Any
      other mechanism is refused too. A dictated variable named like one this
      recipe delivers itself halts the build, naming both, since the compiler
      cannot see the names a recipe writes.

      Two tools connections whose aliases differ only in letter case, or in a
      hyphen against an underscore, are named alike, so the build halts, naming
      both, wherever the two would deliver one variable: always while both take
      the defaults, and otherwise wherever what each still delivers meets, such
      as a credential attached on each.

      The component's own inject block. The developer may also write an inject
      block on the component itself, and its env and file entries reach the
      container as a connection's do: each env entry under the name it gives,
      read off the inject pipe, after the connections' variables, and each file
      at the absolute path it names, from the same ConfigMap, checked as a
      connection's file is. The agent's own value is delivered under a default
      name: MASTRA_AGENT_ID (while set). It is rendered, and kept from every
      connection and from that block, only while no entry of that block, in
      either mechanism, delivers it. A value left unset renders no variable. The
      templates read that at .context.self_inject, which maps each name the
      developer wrote to values.<key> for an entry whose template reads that one
      own value. A refusal about one of that block's entries names the block
      rather than a connection.

      DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
      Recipe in this catalog that reads .context.self_inject declares: the same
      lines, save the own values each looks up and the mechanisms it reads. A
      Recipe of a tool or of an agent reads env and file entries, and reads the
      file entries a second time for the files it emits; a Recipe of
      core/compute/function, task or worker reads env entries alone; a Recipe of
      core/compute/server that refuses a variable by name reads the names of the
      env entries alone; and a realization of core/ai-tool/mcp that delivers
      none of the block reads it only to refuse each of its entries. The
      connections and that block only record who dictates each name and each
      file, and each refusal runs once over both, naming the one that dictated
      it. It is part of a workload template, and no catalog kind holds part of
      one for several Recipes to share; a change to it is made to all of them.

      The block reading the connections' inject directives is the one every helm
      Recipe of an agent built on a framework in this catalog declares,
      differing only in the names each delivers itself and the refusals its own
      connections call for; a change to it is made to all.
    */ -}}
    {{- $pipe := default dict .context.inject }}
    {{- $env := optional $pipe "env" dict }}
    {{- $pipeFiles := optional $pipe "file" dict }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- $ownFile := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $dictating := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- if $entries }}{{ $_ := set $dictating $alias true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $taken := dict "PORT" "the component's infra.port, which the server reads under that name" "MASTRA_HOST" "this realization, which sets the address the server listens on under that name" }}
    {{- $toolVars := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if eq $edge.socket "model" }}
    {{- $_ := set $taken "OPENAI_BASE_URL" (printf "the model connection %s, whose endpoint Mastra's model router reads under that name" $alias) }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $taken "OPENAI_API_KEY" (printf "the credential attached on the model connection %s" $alias) }}
    {{- end }}
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $byDefault := printf "the tools connection %s, which writes no inject block" $alias }}
    {{- $delivers := dict }}
    {{- if hasKey $features "endpoint" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) (printf "the endpoint attached on the tools connection %s" $alias) }}
    {{- else if not (hasKey $dictating $alias) }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_URL" $name) $byDefault }}
    {{- end }}
    {{- if hasKey $features "credential" }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL" $name) (printf "the credential attached on the tools connection %s" $alias) }}
    {{- if and (not (hasKey $dictating $alias)) (optional $edge.provides "credential_header" "") }}
    {{- $_ := set $delivers (printf "AGGREGA_TOOL_%s_CREDENTIAL_HEADER" $name) $byDefault }}
    {{- end }}
    {{- end }}
    {{- range $var, $by := $delivers }}
    {{- with optional $toolVars $var "" }}
    {{- fail (printf "the tools connections %s and %s of %q would both deliver the variable %s, because a connection's variables are named for its alias upper-cased with every character other than a letter or a digit an underscore: rename one of the two" . $alias $.context.instance_id $var) }}
    {{- end }}
    {{- $_ := set $toolVars $var $alias }}
    {{- $_ := set $taken $var $by }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $own := dict }}
    {{- if not (hasKey $named "values.agent_id") }}{{ with optional $.values "agent_id" nil }}{{ $_ := set $own "MASTRA_AGENT_ID" (toString .) }}{{ $_ := set $taken "MASTRA_AGENT_ID" "the component's own value agent_id" }}{{ end }}{{ end }}
    {{- $files := dict }}
    {{- $dictated := dict }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $mechanism, $entries := (default dict $edge.inject) }}
    {{- range $name, $from := $entries }}
    {{- if eq $mechanism "env" }}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "file" }}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) }}
    {{- else if eq $mechanism "arg" }}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) }}
    {{- else }}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end }}
    {{- range $name, $by := $dictated }}
    {{- with optional $taken $name "" }}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) }}
    {{- end }}
    {{- end }}
    {{- range $name, $by := $files }}
    {{- if not (hasPrefix "/" $name) }}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $secrets := false }}
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
    {{- $secrets = true }}
    {{- end }}
    {{- if and (eq $edge.socket "tools") (or (hasKey $features "credential") (hasKey $features "endpoint")) }}
    {{- $secrets = true }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The variables this recipe names come first, the server's own, then
        # model and tools; the variables connections dictate follow, in alias
        # order, then the agent id's default and the component's own inject
        # block's entries.
        variables:
          PORT: "{{ .infra.port }}"
          MASTRA_HOST: "0.0.0.0"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "tools") (not (hasKey $dictating $alias)) }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $features "endpoint") }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- end }}
    {{- range $name, $value := $own }}
          {{ $name }}: {{ toJson $value }}
    {{- end }}
    {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (optional $env $name "") }}
    {{- end }}
    {{- if $files }}
        volumeMounts:
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
    {{- $i = add $i 1 }}
    {{- end }}
    {{- end }}
    {{- if $secrets }}
        attachments:
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL:
            connection: "{{ $alias }}"
            from: endpoint
            as: env
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        health:
          ready:
            http: /health
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
  # The ConfigMap holding the file entries the connections and the component's
  # own inject block dictate, keyed file-0, file-1 and so on in path order, the
  # keys the workload's mounts read. It is emitted only while either one
  # dictates a file, so a build with none renders nothing here. The pod mounts
  # it by name, which resolves only in the pod's own namespace, so it carries
  # the namespace the Release, or else the Aggregate, declares for the component
  # through the aggrega.ai/namespace annotation, and none where it declares
  # none.
  artifacts:
    mastra-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
