apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: gumloop
  version: 1.0.0
  description: >
    A Gumloop automation pipeline on Gumloop's managed platform as a reference
    realization, so no compute runs in-cluster. The helm provider emits an
    ExternalName Service that maps an in-cluster DNS name onto the managed
    endpoint. provides.endpoint is the managed API host and provides.pipeline_id
    is the developer-selected pipeline. No credential is delivered by this
    recipe: a consumer that needs one declares it as `credential` on the socket
    that reaches this endpoint and delivers it from its own container, because
    the environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/gumloop:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    pipeline_id: "{{ .values.pipeline_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
