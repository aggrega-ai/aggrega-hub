apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nats-bitnami
  version: 1.0.0
  description: >
    NATS via Bitnami Helm chart (bitnami/nats), single standalone instance.
    Used as an in-memory messaging server with JetStream file storage disabled,
    so the chart renders a stateless Deployment rather than a StatefulSet and
    requests no persistent volume. Authentication is off by default; when a
    password credential is attached its value arrives on the env pipe and the
    chart's user/password authentication is enabled with that password. Leaving
    authentication off avoids the chart's random-password generation, so the
    render stays byte-identical across runs. Default chart version in
    source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/messaging/nats:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/nats
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"9.0.28\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "nats"

  # This Recipe reads from infra.overrides:
  #   image           - map[string]string (chart image.* fields)
  valuesMapping: |
    ## ── Architecture (single standalone, stateless server) ─────
    ## The chart defaults to a StatefulSet; the lean messaging role pins a
    ## single-replica stateless Deployment with JetStream file storage off.
    resourceType: deployment
    replicaCount: 1
    jetstream:
      enabled: false

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      client: {{ .infra.port }}
      monitoring: {{ .infra.monitoring_port }}
    service:
      ports:
        client: {{ .infra.port }}
        monitoring: {{ .infra.monitoring_port }}

    ## ── Resources ──────────────────────────────────────────────
    resources:
      requests:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"

    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- end }}

    ## ── Authentication (optional credential slot) ──────────────
    ## Off by default. When the optional `password` slot is filled, the
    ## credential value arrives on the inject pipe and enables chart
    ## user/password authentication with that password; the chart writes the
    ## server configuration Secret from it. Leaving auth off avoids the chart's
    ## random-password generation, keeping the render deterministic.
    {{- if and .context.inject.env .context.inject.env.NATS_PASSWORD }}
    auth:
      enabled: true
      credentials:
        - user: "{{ .values.username }}"
          password: "{{ .context.inject.env.NATS_PASSWORD }}"
    {{- else }}
    auth:
      enabled: false
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/nats
      version: 9.0.28
      digest: sha256:48600e36b51558ce88db70d93dc17dd26a6ae26d42a38adab22354f0c85a1bbc
      manifestDigest: sha256:9ac9ba1073909fa55ee47e79520cb3c4abd56be20a7bc5e6dad24bca15c732e9
