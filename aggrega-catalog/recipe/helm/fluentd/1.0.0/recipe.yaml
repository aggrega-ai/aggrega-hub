apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: fluentd
  version: 1.0.0
  license: Apache-2.0
  description: >
    Fluentd log aggregator on Kubernetes via the helm provider's Workload
    synthesis, running the official upstream fluent/fluentd image directly (no
    external Helm chart). Fluentd is the receiving end: a minimal fluent.conf
    with a `forward` input source bound to the infra port is written at
    start-up, and records whose tag matches the developer's output match are
    routed to standard output. Fluentd is then exec'd against that config. The
    buffer is in-memory by default, so the aggregator renders as a stateless
    Deployment with no persistent volume; when infra.storage.size is set a
    durable volume backs a file buffer mounted at /fluentd/log. provides.host is
    the bare, self-contained in-cluster service name of the synthesized ClusterIP
    Service — it carries no namespace, so the recipe is independent of where it
    is deployed; a consumer in another namespace qualifies the host with the
    target namespace on its own side (caller-side routing). provides.port is the
    forward input port upstream forwarders ship records to. Reach for this
    realization where the build must complete with nothing fetched; reach for
    `fluentd-chart`, which renders the Fluent project's own Helm chart as the
    same aggregator, where a chart repository is reachable at build time. The
    Fluentd server is Apache-2.0.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/fluentd:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. protocol is "forward" —
  # the wire protocol of the Fluentd forward input upstream forwarders ship to.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "forward"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The buffer is in-memory by default, so the default stateless form (a
    # Deployment on the helm provider) is correct. When infra.storage.size is set,
    # a durable buffer volume is added and mounted at /fluentd/log; the volume is
    # a plain claim (not a per-replica template), so the stateless form still
    # holds — the aggregator remains a single-replica Deployment.
    replicas: 1
    containers:
      main:
        image: "fluent/fluentd:{{ .infra.engine_version }}"
        # A minimal fluent.conf is written at start-up: a `forward` input source
        # bound to the infra port receives records from upstream forwarders, and
        # records matching the output match are routed to standard output.
        # Fluentd is then exec'd against that config. When infra.storage.size is
        # set, a file buffer under the mounted volume backs the output.
        command:
          - /bin/sh
          - -c
          - |-
            cat > /tmp/fluent.conf <<'EOF'
            <source>
                @type forward
                bind 0.0.0.0
                port {{ .infra.port }}
            </source>
            <match {{ .values.output_match }}>
                @type stdout
            {{- if and .infra.storage .infra.storage.size }}
                <buffer>
                    @type file
                    path /fluentd/log/buffer
                </buffer>
            {{- end }}
            </match>
            EOF
            exec fluentd -c /tmp/fluent.conf
        ports:
          forward: {{ .infra.port }}
        # Fluentd documents no health endpoint for its forward input, which
        # listens on a TCP socket for the event stream, so both probes open a
        # TCP connection to that port. No start-up time is documented; the
        # liveness probe waits 10 s before its first check.
        health:
          ready:
            tcp: {{ .infra.port }}
          live:
            tcp: {{ .infra.port }}
            initialDelaySeconds: 10
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if and .infra.storage .infra.storage.size }}
        volumeMounts:
          - name: data
            path: /fluentd/log
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          forward: {{ .infra.port }}
