apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: vertex-ai
  version: 1.0.0
  description: >
    Google Vertex AI's managed model API as a reference realization: no compute runs in-cluster. helm emits an ExternalName Service mapping an in-cluster name onto the operator-supplied regional endpoint. No credential is delivered by this recipe: consumers authenticate with ambient GCP workload identity or inject their own credentials.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/vertex-ai:1.0.0
  # The endpoint is operator-supplied (infra.endpoint) and single-sourced
  # into both provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
