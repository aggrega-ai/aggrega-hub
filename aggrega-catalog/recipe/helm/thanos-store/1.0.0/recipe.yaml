apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: thanos-store
  version: 1.0.0
  license: Apache-2.0
  description: >
    Thanos Store Gateway, the read side of a Thanos metrics stack, on Kubernetes
    via the helm provider's Workload synthesis (a stateless Deployment plus a
    ClusterIP Service exposing the StoreAPI gRPC port and the HTTP port). The
    Store Gateway keeps only an ephemeral local cache of index data under a
    data-dir — the object store is the system of record — so it renders
    stateless, with no persistent volume. The endpoint the store wired to the
    `objstore` uses-edge publishes sets the inline object-store configuration
    passed on the `--objstore.config` flag: its host and port are the S3
    endpoint, and its scheme sets `insecure` — true for http, false for https.
    A store publishing no endpoint, or one with another scheme or with a path,
    halts the build naming the connection. The bucket is the component's own
    value, and a store publishing a different bucket halts the build naming
    both. That configuration selects the AWS SDK
    credential chain, so it carries no secret; the access key is a developer value
    delivered on AWS_ACCESS_KEY_ID and the secret key is delivered on
    AWS_SECRET_ACCESS_KEY — rendered as an env secretKeyRef when a credential is
    attached on the `objstore` connection, or an inline development default when
    none is, so the render stays byte-identical across runs. provides.host is
    the bare, self-contained in-cluster service name of the synthesized Service —
    it carries no namespace, so the recipe is independent of where it is deployed.
    A consumer in another namespace qualifies the host with the target namespace
    on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/observability/thanos-store:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. provides.port is
  # the StoreAPI gRPC port queriers dial; protocol is "grpc".
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.grpc_port }}"
    protocol: "grpc"
  workload: |
    {{- /* The alias of the `objstore` connection carrying a credential, or empty. */ -}}
    {{- $objstoreCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "objstore") (hasKey (default dict $edge.features) "credential") -}}
    {{- $objstoreCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The object store's address: the endpoint the store wired to objstore
      publishes, scheme included. The S3 client takes a host and port with no
      scheme and no path, and reaches it over plain HTTP when insecure is true
      and over TLS otherwise, so the scheme becomes that flag. A store
      publishing no endpoint, or one the client cannot take, halts the build
      naming the connection.

      The bucket stays this component's own value. Where the store publishes a
      bucket too, the two must name the same one, so a difference halts the
      build naming both; a store publishing no bucket leaves the value alone.
    */ -}}
    {{- $objstoreHost := "" -}}
    {{- $objstoreInsecure := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if eq $edge.socket "objstore" -}}
    {{- $endpoint := toString (optional (default dict $edge.provides) "endpoint" "") -}}
    {{- if not $endpoint -}}
    {{- fail (printf "the objstore connection %s of %q is wired to %q, which publishes no endpoint, but the Store Gateway's S3 client is pointed at the address the object store publishes, scheme included; wire a store publishing endpoint, such as core/storage/minio, to the objstore socket instead" $alias $.context.instance_id $edge.target) -}}
    {{- end -}}
    {{- if not (or (hasPrefix "http://" $endpoint) (hasPrefix "https://" $endpoint)) -}}
    {{- fail (printf "the objstore connection %s of %q is wired to %q, which publishes the endpoint %q, but the Store Gateway's S3 client reaches a store over http or https alone and takes the scheme from that endpoint; publish the store's address with one of the two" $alias $.context.instance_id $edge.target $endpoint) -}}
    {{- end -}}
    {{- $u := urlParse $endpoint -}}
    {{- if and $u.path (ne $u.path "/") -}}
    {{- fail (printf "the objstore connection %s of %q is wired to %q, which publishes the endpoint %q carrying the path %q, but the Store Gateway's S3 client takes a host and port alone and refuses a path; publish the store's address as scheme, host and port" $alias $.context.instance_id $edge.target $endpoint $u.path) -}}
    {{- end -}}
    {{- $objstoreHost = $u.host -}}
    {{- $objstoreInsecure = hasPrefix "http://" $endpoint -}}
    {{- $storeBucket := toString (optional (default dict $edge.provides) "bucket" "") -}}
    {{- if and $storeBucket (ne $storeBucket (toString $.values.bucket)) -}}
    {{- fail (printf "%q reads metric blocks from the bucket %q its bucket value names, but %q, the store its objstore connection %s is wired to, publishes the bucket %q, so the Store Gateway would read a bucket other than the one the store publishes; set bucket in the values of %q to %q" $.context.instance_id (toString $.values.bucket) $edge.target $alias $storeBucket $.context.instance_id $storeBucket) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The Store Gateway keeps only an ephemeral local cache under its data-dir —
    # the object store is the system of record — so the default stateless form
    # (a Deployment on the helm provider) is correct: no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "quay.io/thanos/thanos:{{ .infra.engine_version }}"
        # `thanos store` serves the StoreAPI on gRPC and health/metrics on HTTP.
        # The host, port and scheme of the endpoint the object store publishes,
        # resolved above, set the S3 endpoint and insecure in the inline
        # object-store configuration. The final args entry is a single
        # `--objstore.config=<yaml>` flag whose value is the multi-line S3 stanza;
        # aws_sdk_auth selects the AWS SDK credential chain so the configuration
        # holds no secret.
        args:
          - store
          - --grpc-address
          - "0.0.0.0:{{ .infra.grpc_port }}"
          - --http-address
          - "0.0.0.0:{{ .infra.http_port }}"
          - --data-dir
          - /var/thanos/store
          - |-
            --objstore.config=type: S3
            config:
              bucket: {{ .values.bucket }}
              endpoint: {{ $objstoreHost }}
              insecure: {{ $objstoreInsecure }}
              aws_sdk_auth: true
        # AWS_ACCESS_KEY_ID is a developer value. AWS_SECRET_ACCESS_KEY is the
        # optional credential on the `objstore` connection: when one is attached
        # it renders as an env secretKeyRef naming that connection, so the
        # plaintext never lands in the manifest; with none attached the Recipe
        # falls back to a deterministic development default.
        variables:
          AWS_ACCESS_KEY_ID: "{{ .values.s3_access_key }}"
    {{- if not $objstoreCredential }}
          AWS_SECRET_ACCESS_KEY: dev-minio-root-change-me
    {{- end }}
    {{- with $objstoreCredential }}
        attachments:
          AWS_SECRET_ACCESS_KEY:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
        ports:
          grpc: {{ .infra.grpc_port }}
          http: {{ .infra.http_port }}
        # The Store Gateway serves /-/healthy once its initial setup completes
        # and /-/ready once bootstrapping, including the initial index build,
        # has finished, both on its HTTP port. An http probe is sent to the
        # container port whose name sorts first, which here is `grpc`, so both
        # probes run the wget of the image's busybox against the HTTP port
        # instead; it fails on an error answer and when nothing answers. No
        # start-up time is documented; the liveness probe waits 10 s before its
        # first check.
        health:
          ready:
            exec:
              - wget
              - "-q"
              - "--spider"
              - "http://127.0.0.1:{{ .infra.http_port }}/-/ready"
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - wget
              - "-q"
              - "--spider"
              - "http://127.0.0.1:{{ .infra.http_port }}/-/healthy"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          grpc: {{ .infra.grpc_port }}
          http: {{ .infra.http_port }}
