apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: agent-framework
  version: 1.0.0
  description: >
    An application built on Microsoft Agent Framework, on Kubernetes, rendered
    offline as plain manifests by the helm provider's Workload synthesis. The
    Workload becomes a Deployment running the image the Release supplies, with
    no Service and no port. The model wired into the `model` socket reaches
    the application as the variables Agent Framework's Python OpenAI clients
    read: its endpoint as OPENAI_BASE_URL, its model name as OPENAI_MODEL, and
    the connection's credential as OPENAI_API_KEY through a secretKeyRef, so
    the key never renders into the manifest.

    Each tool wired into the `tools` socket reaches the application under
    variables named for the connection's alias, upper-cased with hyphens as
    underscores: its address as AGGREGA_TOOL_<ALIAS>_URL, and, where the
    connection carries a credential, that credential as
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL through a secretKeyRef, with the header the
    tool publishes for it as AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER. A
    connection holding the tool's whole address as a secret, for a server that
    reads its key from its address, delivers that secret as
    AGGREGA_TOOL_<ALIAS>_URL through a secretKeyRef instead.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/agent-framework:1.0.0
  # The model arrives on the `model` uses-edge, addressed by the
  # developer-chosen alias, so the recipe ranges the outbound edges and matches
  # on the socket name to find it, then reads the model's published endpoint
  # and model name. Agent Framework's Python OpenAI clients read
  # OPENAI_BASE_URL and OPENAI_API_KEY from the environment, and each reads
  # OPENAI_MODEL where the model variable of its own is unset, so the
  # application picks up all three with no code of its own.
  #
  # The credential, when one is attached on the `model` connection, is
  # delivered as OPENAI_API_KEY through a secretKeyRef naming that connection;
  # a connection carrying none emits no key variable.
  #
  # Each `tools` connection's variables are named for its alias, upper-cased,
  # with every character other than a letter or a digit an underscore; the
  # alias grammar admits only a hyphen and an underscore besides, so a hyphen
  # becomes an underscore. AGGREGA_TOOL_<ALIAS>_URL is the endpoint the tool
  # publishes, unless the connection carries an endpoint secret: then it is
  # that secret, referenced by connection and slot, and the published address
  # is not delivered. The credential is delivered only where the connection
  # carries one, and the header beside it only where the tool publishes one;
  # a tool behind a bridge publishes none, because the bridge checks no
  # caller's credential.
  #
  # Every secret on every connection sits under one attachments key, so the
  # block is opened once, and only where one connection carries a secret.
  workload: |
    {{- $secrets := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "tools") (or (hasKey $features "credential") (hasKey $features "endpoint")) -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $features "endpoint") }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if $secrets }}
        attachments:
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL:
            connection: "{{ $alias }}"
            from: endpoint
            as: env
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
