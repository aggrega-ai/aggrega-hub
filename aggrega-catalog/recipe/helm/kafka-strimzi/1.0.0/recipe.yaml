apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: kafka-strimzi
  version: 1.0.0
  license: Apache-2.0
  description: >
    Apache Kafka realized as a Strimzi custom resource the Strimzi Cluster
    Operator reconciles, rather than a directly synthesized StatefulSet — the
    operator-driven realization of the same Kafka component, selectable in the
    Manifest alongside the synthesis recipe. The recipe emits a Kafka custom
    resource (and its node-pool) in the KRaft shape, conformant to the Strimzi
    API; the operator turns it into a running broker. provides.host is the
    Strimzi client bootstrap Service the operator creates for the cluster, so a
    consumer wires to it exactly as it would to the synthesized realization. The
    Strimzi Cluster Operator is a runtime prerequisite: the build halts unless the
    operator affirms it is installed (infra.control_plane_present), so no custom
    resource is emitted into a cluster that cannot reconcile it. Reach for this
    realization where the control plane is already in place and the cluster should
    own broker upgrades, rolling restarts and partition rebalancing; reach for the
    synthesis recipe where it is not.

    Both resources are written into the namespace the Release names through the
    aggrega.ai/namespace annotation, where one is set. With values.metrics_enabled
    true the Kafka resource turns on the Strimzi metrics reporter on every node,
    which serves /metrics on port tcp-prometheus and checks no caller, and
    provides publishes the pod label, port name and path a scraper discovers the
    nodes by; false, those keys are empty and nothing else changes.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/kafka:1.0.0
  # The Strimzi Cluster Operator creates a client bootstrap Service named
  # "{cluster}-kafka-bootstrap" for the Kafka custom resource; provides.host is
  # that bare in-cluster name, matching the synthesis realization's contract so
  # consumers are realization-agnostic.
  #
  # The metrics keys say where a scraper finds the brokers' metrics while
  # values.metrics_enabled is true: every node the operator runs for this Kafka
  # resource is labelled strimzi.io/cluster with the resource's name and
  # strimzi.io/name with that name followed by -kafka, a label no other pod of the
  # cluster carries — the entity operator, the Kafka Exporter and Cruise Control
  # each have their own — and with metrics configured each node's container
  # declares the port tcp-prometheus, 9404, which no Service carries. The labels
  # and the port name are the operator's, read from its 0.51.0 and 1.3.0
  # releases, and evolve with it like every other detail here. While the value is
  # false the operator declares no metrics port and the keys are empty.
  provides:
    host: "{{ .context.instance_id }}-kafka-bootstrap"
    port: "{{ .infra.broker_port }}"
    protocol: "kafka"
    metrics_pod_selector: "{{ if .values.metrics_enabled }}strimzi.io/cluster={{ .context.instance_id }},strimzi.io/name={{ .context.instance_id }}-kafka{{ end }}"
    metrics_pod_port: "{{ if .values.metrics_enabled }}tcp-prometheus{{ end }}"
    metrics_path: "{{ if .values.metrics_enabled }}/metrics{{ end }}"
  # The Strimzi Cluster Operator must exist in the target cluster before a Kafka
  # custom resource can reconcile. The compiler cannot inspect cluster state, so
  # the prerequisite is declared: an operator affirms it in the Release, and an
  # unaffirmed build halts here rather than emitting an orphan custom resource.
  assertions:
    kafka_operator_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Strimzi Cluster Operator must be installed in the target cluster before this realization emits its Kafka custom resource; once the operator is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
  # This Recipe reads from infra.overrides:
  #   replicas      - integer (KafkaNodePool spec.replicas; default 1)
  #   broker_config - map[string]scalar (replaces the whole spec.kafka.config block)
  #
  # Both keys exist because the custom resource carries cluster-shape knobs the
  # Component's own schema does not enumerate. The node count is one: the
  # default renders the single-node shape, where one node holds both the broker
  # and controller roles, and a multi-node cluster raises it. The broker config
  # map is the other: it is Kafka's own open-ended property set, versioned with
  # Kafka rather than with this catalog, and its defaults here are the
  # single-node set — one replica of every internal topic and no in-sync quorum
  # to satisfy. A multi-node cluster needs different factors, so the whole
  # block is replaced rather than merged key by key; supply the complete config
  # map when overriding it.
  #
  # The Kafka resource and its node pool are written into the namespace the
  # Release names for this component through the aggrega.ai/namespace
  # annotation, on its boundary or its own entry — the pool must sit beside the
  # resource it names — and the operator creates the nodes and the bootstrap
  # Service there, so they land where a consumer reads that the cluster runs:
  # the namespace it qualifies host with, and the one a scraper discovers the
  # nodes in. The provider does not place an artifact on its own. Where no
  # namespace is named the field is omitted, and both land wherever the applying
  # tool puts them.
  #
  # With values.metrics_enabled true the Kafka resource's metrics configuration
  # names the Strimzi metrics reporter and nothing more: the operator then
  # configures it on every node with its own default selection of metrics and
  # declares the tcp-prometheus port. That is the smallest configuration the
  # operator documents — its own example for the reporter sets the type alone —
  # and it needs no ConfigMap of exporter rules, which the older JMX exporter
  # type does. The reporter type is taken by the operator from its 0.47.0
  # release on, under this API version and under the newer one. With the value
  # false nothing of it is rendered.
  artifacts:
    kafkanodepool.yaml: |
      apiVersion: kafka.strimzi.io/v1beta2
      kind: KafkaNodePool
      metadata:
        name: {{ .context.instance_id }}-pool
        {{- $ns := "" }}
        {{- if .context.annotations }}
          {{- if .context.annotations.release }}
            {{- $raw := optional .context.annotations.release "aggrega.ai/namespace" "" }}
            {{- if $raw }}{{- $ns = $raw }}{{- end }}
          {{- end }}
        {{- end }}
        {{- with $ns }}
        namespace: "{{ . }}"
        {{- end }}
        labels:
          strimzi.io/cluster: {{ .context.instance_id }}
      spec:
        {{- if and .infra.overrides .infra.overrides.replicas }}
        replicas: {{ .infra.overrides.replicas }}
        {{- else }}
        replicas: 1
        {{- end }}
        roles:
          - broker
          - controller
        storage:
          type: persistent-claim
          size: {{ .infra.storage.size }}
          deleteClaim: false
    kafka.yaml: |
      apiVersion: kafka.strimzi.io/v1beta2
      kind: Kafka
      metadata:
        name: {{ .context.instance_id }}
        {{- $ns := "" }}
        {{- if .context.annotations }}
          {{- if .context.annotations.release }}
            {{- $raw := optional .context.annotations.release "aggrega.ai/namespace" "" }}
            {{- if $raw }}{{- $ns = $raw }}{{- end }}
          {{- end }}
        {{- end }}
        {{- with $ns }}
        namespace: "{{ . }}"
        {{- end }}
        annotations:
          strimzi.io/node-pools: enabled
          strimzi.io/kraft: enabled
      spec:
        kafka:
          version: "{{ .infra.engine_version }}"
          listeners:
            - name: plain
              port: {{ .infra.broker_port }}
              type: internal
              tls: false
          config:
            {{- if and .infra.overrides .infra.overrides.broker_config }}
            {{- range $k, $v := .infra.overrides.broker_config }}
            {{ $k }}: {{ $v }}
            {{- end }}
            {{- else }}
            offsets.topic.replication.factor: 1
            transaction.state.log.replication.factor: 1
            transaction.state.log.min.isr: 1
            default.replication.factor: 1
            min.insync.replicas: 1
            {{- end }}
          {{- if .values.metrics_enabled }}
          metricsConfig:
            type: strimziMetricsReporter
          {{- end }}
        entityOperator:
          topicOperator: {}
          userOperator: {}
