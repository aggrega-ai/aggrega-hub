apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: fluent-bit-bitnami
  version: 1.0.0
  description: >
    Fluent Bit log forwarder via the Bitnami Fluent Bit Helm chart
    (bitnami/fluent-bit). The sink host and port resolved from the
    `forward_target` uses-edge arrive on the injection context and are rendered
    into the chart's config.outputs as a `forward` output, which the chart
    writes into the Fluent Bit configuration ConfigMap, so the forwarder ships
    records to that sink. Fluent Bit renders as a Deployment (daemonset mode is
    left disabled) for a lean single-replica forwarder. The chart pins its image
    by tag; the Recipe pins the same tag explicitly for a reproducible render.
    Default chart version in source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/observability/fluent-bit:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/fluent-bit
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"3.1.13\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   image        - map[string]string (chart image.* fields; overrides the tag pin)
  #   service_type - string (chart service.type)
  #   requests     - { cpu: string, memory: string } (resource requests)
  #   nodeSelector - map[string]string
  #   tolerations  - []object
  valuesMapping: |
    ## ── Image pin ──────────────────────────────────────────────
    ## The chart pins a concrete image tag; pin the same tag
    ## explicitly for a reproducible render. Override the whole
    ## block via infra.overrides.image.
    {{- if and .infra.overrides .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      registry: docker.io
      repository: bitnami/fluent-bit
      tag: "4.0.8-debian-12-r0"
    {{- end }}

    ## ── Deployment shape: single-replica forwarder ─────────────
    ## Daemonset mode stays disabled so the chart renders a
    ## Deployment, its Service, and the configuration ConfigMap.
    daemonset:
      enabled: false
    replicaCount: 1

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      http: {{ .infra.port }}
    service:
      ports:
        http: {{ .infra.port }}
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}

    ## ── Forward output (injected) ──────────────────────────────
    ## The sink host:port resolved from the `forward_target` uses-edge
    ## is rendered into a `forward` output, which the chart writes into
    ## the Fluent Bit configuration ConfigMap.
    config:
      outputs: |
        [OUTPUT]
            Name  forward
            Match {{ .values.forward_match }}
            Host  {{ .context.inject.env.FLUENT_FORWARD_HOST }}
            Port  {{ .context.inject.env.FLUENT_FORWARD_PORT }}

    ## ── Resources ──────────────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/fluent-bit
      version: 3.1.13
      digest: sha256:566716b5db56fe8840daa185300984a3c0fa092dd35f8d3b7cc685455e3e9013
      manifestDigest: sha256:6d0d33ffbfee9cb476cba93f96c7faf5c843a140ef7896fdbdaff851ddb535e7
