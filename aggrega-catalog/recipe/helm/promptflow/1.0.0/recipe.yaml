apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: promptflow
  version: 1.0.0
  description: >
    A Prompt flow application on Kubernetes, rendered offline as plain manifests
    by the helm provider's Workload synthesis. The Workload becomes a Deployment
    running the operator-supplied application image. The model endpoint
    published by the component wired into the `model` socket is injected as
    OPENAI_BASE_URL, the environment variable the OpenAI-compatible client SDK
    reads, so the flow talks to the wired model without hardcoding an endpoint.
    A model API key attached on the `model` connection is delivered as
    OPENAI_API_KEY via a secretKeyRef.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/promptflow:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge. The edge is
        # addressed by the developer-chosen alias, so the recipe ranges the
        # outbound edges and matches on the socket name to find it, then reads the
        # model recipe's published endpoint and model name. OPENAI_BASE_URL is an
        # environment variable the OpenAI-compatible client SDK reads, as is the
        # API key. The model name is delivered as OPENAI_MODEL for the flow's own
        # code to read — a stable name this recipe defines rather than a claim
        # about a framework read: a Prompt flow step names its model through the
        # connection the flow declares, which the flow definition carries. The
        # flow entrypoint the component selects is likewise not emitted as a
        # variable; it names a flow inside the image the Release supplies.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached on the `model`
        # connection, is delivered as OPENAI_API_KEY via a secretKeyRef naming
        # that connection — the key value never renders into the manifest. A
        # connection carrying no credential emits no key env.
    {{- range $alias, $edge := .context.uses }}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") }}
        attachments:
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
