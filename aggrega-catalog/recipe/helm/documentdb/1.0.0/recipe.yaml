apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: documentdb
  version: 1.0.0
  license: MIT
  description: >
    PostgreSQL 17 with the DocumentDB extension on Kubernetes via the helm
    provider's Workload synthesis (StatefulSet + ClusterIP Service + headless
    Service + PVC). provides.host is the bare, self-contained in-cluster service
    name of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/documentdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "ghcr.io/ferretdb/postgres-documentdb:{{ .infra.engine_version }}"
        # POSTGRES_USER / POSTGRES_DB are developer values. POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when a credential
        # is attached it renders as an env secretKeyRef; with none attached the
        # Recipe falls back to an inline development default.
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if not (hasKey (default dict .features) "password") }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
    {{- if hasKey (default dict .features) "password" }}
        attachments:
          POSTGRES_PASSWORD:
            from: password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        # Both probes run the image's own pg_isready, which PostgreSQL documents
        # as the check of whether a server is accepting connections. Readiness
        # asks over TCP on the port the Service targets; liveness asks over the
        # server's local socket. While a new database is initialized the image
        # runs a temporary server that listens on its socket only, so the pod is
        # reported ready only once the server accepts network connections, and a
        # first start is not restarted while initialization is still running.
        # The configured user and database are named so that a probe is not
        # logged as a failed connection attempt. No start-up time is documented:
        # the liveness probe waits 30 s and allows six misses 10 s apart, to cover
        # initialization and the extension's installation.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - pg_isready
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
