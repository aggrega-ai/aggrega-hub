apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nginx
  version: 1.0.0
  license: BSD-2-Clause
  description: >
    NGINX reverse-proxy gateway on Kubernetes via the helm provider's Workload
    synthesis, running the official upstream nginx image (no external Helm
    chart). NGINX holds no persistent state, so it renders a stateless
    Deployment plus a ClusterIP Service and declares no storage. The upstream
    host and port resolved from the `upstream` uses-edge arrive on
    .context.inject.env and are written into a minimal NGINX server
    configuration whose proxy_pass forwards matching requests to that upstream;
    the config is written at container start and nginx is then started in the
    foreground. provides.host is the bare, self-contained in-cluster service
    name of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing). Each core/traffic-shadowing attachment on the component adds a
    mirror to that location: an upstream group naming the Service the
    attachment's infra names, and an internal location sending a copy of every
    forwarded request there with its original URI, whose response NGINX
    discards. NGINX copies every request it forwards and cannot copy a share
    of them, so the FeatureRecipe realizing the attachment
    (traffic-shadowing-nginx) halts on a share below 100. With no such
    attachment the configuration carries no mirror. The two inject-pipe
    variables the proxy_pass target is read from are named in the locals; a
    core/prompt-injection-shield attachment's realization
    (prompt-injection-shield-nginx) writes them with the address of the guard
    wired to the guard socket.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/nginx:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  #
  # The two inject-pipe variables the server configuration reads its proxy_pass
  # target from: the Aggregate names them on the upstream edge's inject block,
  # and a core/prompt-injection-shield attachment's realization writes them,
  # pointing the target at the guard wired to the guard socket. Each is read
  # from here by the workload below and by that realization, so the two cannot
  # name different variables.
  locals:
    upstream_host_variable: NGINX_UPSTREAM_HOST
    upstream_port_variable: NGINX_UPSTREAM_PORT
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    {{- /*
      One mirror per core/traffic-shadowing attachment, in attachment-name
      order, which is the order a template ranges over a map in. An
      attachment is found by its type with any version it was authored with
      set aside, so core/traffic-shadowing and core/traffic-shadowing:1.0.0
      are both read. Each mirror names an upstream group for the copy's
      destination, so the internal location can pass the original request URI
      ($request_uri) without NGINX needing a resolver at runtime: a proxy_pass
      carrying a variable looks its host up among the server groups first. The
      attachment's infra is read here as the Feature declares it, and the
      Feature's own assertion has already halted the build if either key is
      missing. No attachment, no mirror: the range is empty and the server
      block is exactly the one written without it.
    */ -}}
    {{- $mirrors := list -}}
    {{- range $name, $f := (default dict .features) -}}
    {{- if eq (first (splitList ":" $f.type)) "core/traffic-shadowing" -}}
    {{- $mirrors = append $mirrors (dict "group" (printf "mirror_%s" $name) "location" (printf "/__mirror_%s" $name) "server" (printf "%s:%v" $f.infra.service_name $f.infra.service_port)) -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A reverse proxy holds no durable state, so the default stateless form (a
    # Deployment on the helm provider) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "nginx:{{ .infra.engine_version }}"
        # The upstream target resolved from the `upstream` uses-edge arrives on
        # the inject pipe (.context.inject.env). It is written into the NGINX
        # server config at container start and forwarded via proxy_pass; nginx
        # is then started in the foreground so the container stays alive. Each
        # mirror adds its upstream group ahead of the server block, a mirror
        # directive in the forwarded location, and the internal location the
        # copy is sent from.
        command:
          - /bin/sh
          - -c
          - "echo '{{ range $mirrors }}upstream {{ .group }} { server {{ .server }}; } {{ end }}server { listen {{ .infra.port }}; location {{ .values.upstream_path }} { {{ range $mirrors }}mirror {{ .location }}; {{ end }}proxy_pass http://{{ index .context.inject.env .locals.upstream_host_variable }}:{{ index .context.inject.env .locals.upstream_port_variable }}; }{{ range $mirrors }} location = {{ .location }} { internal; proxy_pass http://{{ .group }}$request_uri; }{{ end }} }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
        ports:
          http: {{ .infra.port }}
        # NGINX documents no health endpoint, and the one location this server
        # configures is forwarded to the upstream, so an HTTP check would report
        # the upstream's health rather than the proxy's. Both probes open a TCP
        # connection to the port the server listens on and the Service targets.
        # No start-up time is documented; the liveness probe waits 10 s before
        # its first check.
        health:
          ready:
            tcp: {{ .infra.port }}
          live:
            tcp: {{ .infra.port }}
            initialDelaySeconds: 10
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
