apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nginx
  version: 1.0.0
  license: BSD-2-Clause
  description: >
    NGINX reverse-proxy gateway on Kubernetes via the helm provider's Workload
    synthesis, running the official upstream nginx image (no external Helm
    chart). NGINX holds no persistent state, so it renders a stateless
    Deployment plus a ClusterIP Service and declares no storage. The upstream
    host and port resolved from the `upstream` uses-edge arrive on
    .context.inject.env and are written into a minimal NGINX server
    configuration whose proxy_pass forwards matching requests to that upstream;
    the config is written at container start and nginx is then started in the
    foreground. provides.host is the bare, self-contained in-cluster service
    name of the synthesized Service — it carries no namespace, so the recipe is
    independent of where it is deployed. A consumer in another namespace
    qualifies the host with the target namespace on its own side (caller-side
    routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/nginx:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A reverse proxy holds no durable state, so the default stateless form (a
    # Deployment on the helm provider) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "nginx:{{ .infra.engine_version }}"
        # The upstream target resolved from the `upstream` uses-edge arrives on
        # the inject pipe (.context.inject.env). It is written into the NGINX
        # server config at container start and forwarded via proxy_pass; nginx
        # is then started in the foreground so the container stays alive.
        command:
          - /bin/sh
          - -c
          - "echo 'server { listen {{ .infra.port }}; location {{ .values.upstream_path }} { proxy_pass http://{{ .context.inject.env.NGINX_UPSTREAM_HOST }}:{{ .context.inject.env.NGINX_UPSTREAM_PORT }}; } }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
        ports:
          http: {{ .infra.port }}
        # NGINX documents no health endpoint, and the one location this server
        # configures is forwarded to the upstream, so an HTTP check would report
        # the upstream's health rather than the proxy's. Both probes open a TCP
        # connection to the port the server listens on and the Service targets.
        # No start-up time is documented; the liveness probe waits 10 s before
        # its first check.
        health:
          ready:
            tcp: {{ .infra.port }}
          live:
            tcp: {{ .infra.port }}
            initialDelaySeconds: 10
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
