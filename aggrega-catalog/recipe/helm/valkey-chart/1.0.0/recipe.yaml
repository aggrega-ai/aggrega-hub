apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: valkey-chart
  version: 1.0.0
  # The packaged Valkey server is BSD-3-Clause.
  license: BSD-3-Clause
  description: >
    Valkey in-memory key-value cache on Kubernetes via the community-maintained
    Valkey Helm chart, served from that project's HTTPS chart repository. The
    chart is configured for the shape this Component describes: one cache
    process behind a ClusterIP Service, with replication, network policy,
    disruption budget and metrics left off, and transport security off unless
    infra.client_tls turns it on. With a password attached it also
    renders the chart's own connection check, a Pod carrying the helm test
    annotation that confirms an unauthenticated connection is refused; the chart
    offers no setting to decline it, and it is harmless as it stands — it runs
    the cache's pinned image, reads and writes nothing, and carries no
    credential material.

    What it carries that a hand-assembled workload does not is the cache's own
    start-up and security machinery: a hardened container that runs
    unprivileged with a read-only root filesystem, probes that run the cache's
    own client, and an attached password hashed on the pod from a mounted
    secret, so neither the password nor its hash reaches the rendered artifact.
    Reach for this realization where a chart repository is reachable at build
    time; reach for `valkey`, the workload-synthesis realization, where the
    build must complete with nothing fetched.

    The cache image and the chart version are pinned. provides.host is the bare
    in-cluster Service name; a consumer in another namespace qualifies it on its
    own side.

    With infra.client_tls true, the chart's transport security serves TLS alone
    on the operator's port from the Secret attached to server_certificate, the
    probes ping over TLS, and protocol is published as valkey-tls.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/valkey:1.0.0

  source:
    kind: helm-https-chart
    url: https://valkey.io/valkey-helm/
    chart: valkey
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"0.12.0\" }}"

  # provides.host is the cache's Service name, which is what the Component's
  # provides contract promises. The valuesMapping below pins the chart's
  # fullnameOverride to the rendered name, the release name the helm provider
  # gives the chart, which spells the Component's name in the alphabet a
  # Kubernetes name allows. This chart names that Service by the pinned name with
  # no suffix — read from a render of the chart, not assumed, because several
  # charts in this catalog suffix it instead.
  #
  # port follows the port the operator set. It sets the Service port, the
  # container port and — through the directive appended below — the port the
  # server actually binds, so the published address and the listener move
  # together. protocol is "valkey", naming the server on the other end; a
  # consumer reaches it with a Redis-protocol client. While infra.client_tls is
  # on it is "valkey-tls", since the port then accepts TLS alone.
  #
  # A same-namespace consumer reaches the cache under this name directly; a
  # cross-namespace consumer qualifies it caller-side. The host is the bare,
  # self-contained in-cluster Service name: it carries no namespace, so the
  # Recipe is independent of where it is deployed.
  provides:
    host: "{{ .context.rendered_name }}"
    port: "{{ .infra.port }}"
    protocol: "{{ if .infra.client_tls }}valkey-tls{{ else }}valkey{{ end }}"

  # This Recipe reads from infra.overrides:
  #   image          - map[string]string (image.* fields; overrides the tag pin)
  #   service_type   - string (service.type; how the endpoint is exposed, default ClusterIP)
  #   requests       - { cpu: string, memory: string } (cache resource requests)
  #   nodeSelector   - map[string]string (pod scheduling)
  #   tolerations    - []object (pod scheduling)
  #
  # The chart's replication mode, network policy, disruption budget, metrics
  # exporter and Prometheus-operator resources are all left at their own
  # off-by-default setting, and so is its transport security unless
  # infra.client_tls turns it on (below). Under this configuration it renders a
  # Deployment, the ClusterIP Service, a ConfigMap carrying the cache
  # directives, a second ConfigMap carrying the start-up script that assembles
  # the running configuration, and the ServiceAccount the pod runs under.
  #
  # The chart writes no namespace into any resource it renders and offers no
  # value that would; the helm provider places each namespaced one in the
  # namespace the Release declares, and with none declared they land wherever
  # the tool applying the manifests puts them.
  #
  # With a password attached it also renders the chart's own connection check,
  # a Pod carrying the helm test annotation that confirms an unauthenticated
  # connection is refused. The chart offers no setting to decline it, so the
  # description names it rather than leaving it to be discovered.
  #
  # What it carries that a hand-assembled workload does not is the cache's own
  # start-up and security machinery: a start-up step that assembles the running
  # configuration file on the pod, and a hardened container that runs
  # unprivileged with a read-only root filesystem and every capability dropped.
  # Its start-up, readiness and liveness probes run the cache's own client
  # against the port the server binds. Authentication, when a credential is
  # attached, is expressed as an access-control entry whose password is hashed
  # on the pod from a mounted secret, so no credential material and no hash
  # reaches the rendered artifact. The cache image is pinned to a resolvable
  # release tag for reproducible renders.
  valuesMapping: |
    {{- $tls := .infra.client_tls }}
    {{- $cert := hasKey (default dict .features) "server_certificate" }}
    {{- if and $tls (not $cert) }}
    {{- fail (printf "infra.client_tls is true on %q, so the cache serves TLS alone, but nothing is attached to its server_certificate slot, so the server has no certificate to present; attach to server_certificate a Secret holding tls.crt and tls.key, through core/referenced-secret, or set infra.client_tls to false" .context.instance_id) }}
    {{- end }}
    {{- if and $cert (not $tls) }}
    {{- fail (printf "a certificate is attached to the server_certificate slot of %q, but infra.client_tls is false, so the cache serves plaintext and nothing presents the certificate; set infra.client_tls to true to serve TLS from it, or remove the attachment" .context.instance_id) }}
    {{- end }}
    {{- $certProvides := optional (optional (default dict .features) "server_certificate" dict) "provides" dict }}
    {{- if and $tls (not (and (kindIs "map" $certProvides) (optional $certProvides "name" ""))) }}
    {{- fail (printf "the server_certificate slot of %q is filled by an attachment that publishes no Secret name, but the Valkey chart mounts the certificate from a Secret it names; bind the slot to core/referenced-secret, whose k8s-existing-secret realization names a Secret that already exists" .context.instance_id) }}
    {{- end }}
    ## ── Pin the chart's resource names to the rendered name ────
    ## Names the cache's Service exactly "<rendered_name>", matching
    ## provides.host. Every object this chart emits derives its name from this
    ## key, read from a render rather than assumed.
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── Cache image pin ────────────────────────────────────────
    ## The chart's own default tag is its application version, so leaving it
    ## unset makes the render move whenever the chart moves. Pin it explicitly.
    ## The registry and repository are the chart's own defaults, so the image
    ## this realization runs is the one its chart is tested against, and it is
    ## why the Component's engine_version says the chart-backed realization pins
    ## its own tag. This realization renders exactly one image: the cache's own,
    ## which its start-up step and its probes also run. Override the whole block
    ## via infra.overrides.image.
    image:
      {{- if and .infra.overrides .infra.overrides.image }}
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      registry: docker.io
      repository: valkey/valkey
      tag: "9.1.2"
      {{- end }}

    ## ── Cache Service ──────────────────────────────────────────
    ## infra.port sets the Service port and the container port from one value.
    service:
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      port: {{ .infra.port }}

    ## ── The cache's own directives ─────────────────────────────
    ## 🔴 THE LISTEN PORT IS WRITTEN HERE DELIBERATELY, EVEN THOUGH THE CHART
    ## ALSO WRITES ONE, AND THAT IS NOT THE DUPLICATE-KEY MISTAKE IT RESEMBLES.
    ## The chart's start-up step writes the server's base configuration with the
    ## listen port as a LITERAL rather than from the Service port, so an operator
    ## moving infra.port would move the Service and the container port while the
    ## server went on binding the chart's own number — an address that resolves
    ## to a process listening somewhere else, with the build green either way.
    ## The same step then APPENDS this block to the file it just wrote, and the
    ## server reads the last occurrence of a directive, so appending the port
    ## here is the chart's own documented way of overriding it. Verified by
    ## reading the assembled configuration rather than assumed.
    ##
    ## Every developer knob below is emitted only when the Aggregate set it, so a
    ## bare declaration renders no redundant directive and the cache keeps its own
    ## built-in default.
    ##
    ## With infra.client_tls on, the chart's base configuration closes the
    ## plaintext port and binds TLS on a literal port of its own, so the same
    ## last-occurrence override applies to both: this block closes the plaintext
    ## port again and moves the TLS port to infra.port. Appending the plaintext
    ## directive there instead would reopen a plaintext listener beside the TLS
    ## one, verified by running the assembled configuration.
    valkeyConfig: |
      {{- if $tls }}
      port 0
      tls-port {{ .infra.port }}
      {{- else }}
      port {{ .infra.port }}
      {{- end }}
      {{- with .values.maxmemory }}
      maxmemory {{ . }}
      {{- end }}
      {{- with .values.maxmemory_policy }}
      maxmemory-policy {{ . }}
      {{- end }}
      {{- with .values.databases }}
      databases {{ . }}
      {{- end }}
      {{- if .values.appendonly }}
      appendonly yes
      {{- end }}

    ## ── Health probes ──────────────────────────────────────────
    ## The chart's probes run the cache's own client, `valkey-cli ping`, which
    ## asks the client's default port unless a port is named, while the server
    ## binds the port the directive above sets. So each probe is given here as a
    ## full custom probe that names infra.port, with the chart's own default
    ## timing, and the probes keep asking the port the server listens on wherever
    ## an operator moves it. The chart ships its readiness probe switched off; it
    ## is switched on so the Service sends traffic to the pod only once the cache
    ## answers. With infra.client_tls on, a plaintext PING to the TLS port is
    ## reset and fails, so each probe adds --tls and --insecure rather than the
    ## chart's own certificate arguments: the probe dials the loopback address,
    ## which the certificate need not name, and it checks that the server
    ## answers, not who it is.
    startupProbe:
      customProbe:
        exec:
          command: ["valkey-cli",{{ if $tls }} "--tls", "--insecure",{{ end }} "-p", "{{ .infra.port }}", "ping"]
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
    livenessProbe:
      customProbe:
        exec:
          command: ["valkey-cli",{{ if $tls }} "--tls", "--insecure",{{ end }} "-p", "{{ .infra.port }}", "ping"]
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
    readinessProbe:
      enabled: true
      customProbe:
        exec:
          command: ["valkey-cli",{{ if $tls }} "--tls", "--insecure",{{ end }} "-p", "{{ .infra.port }}", "ping"]
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
        successThreshold: 1

    ## ── The durable volume, when the developer asked for one ───
    ## The cache role holds no durable state, so persistence is off unless the
    ## Aggregate switches it on; switched on, the volume is sized and classed
    ## from infra exactly as the workload-synthesis realization sizes its own.
    {{- if .values.persistence.enabled }}
    dataStorage:
      enabled: true
      requestedSize: "{{ .infra.storage.size }}"
      {{- with .infra.storage.type }}
      className: "{{ . }}"
      {{- end }}
    {{- end }}

    ## ── Authentication ─────────────────────────────────────────
    ## Unattached, the chart's access control stays off and the cache accepts
    ## unauthenticated connections, which is the Component's stated default and
    ## the same posture the workload-synthesis realization takes.
    ##
    ## Attached, the chart is pointed at the credential's secret BY NAME with the
    ## credential's own key, and its start-up step reads the password from the
    ## mounted file and writes a hashed access-control entry on the pod — so
    ## neither the password nor its hash appears in the rendered artifact. The
    ## entry is written for the cache's default account, which the chart requires
    ## whenever access control is on: without it the server would accept every
    ## caller while appearing to be protected.
    {{- if hasKey (default dict .features) "password" }}
    auth:
      enabled: true
      usersExistingSecret: "{{ .features.password.provides.name }}"
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: "{{ .features.password.provides.key }}"
    {{- end }}

    ## ── Transport security ─────────────────────────────────────
    ## Off unless infra.client_tls is on. On, the chart mounts the Secret the
    ## server_certificate slot names at /tls and writes the server's TLS
    ## directives from three of its data keys, named here after the two keys a
    ## kubernetes.io/tls Secret holds. The chart always names a CA file as well,
    ## and the server refuses to start where that file is missing, so it is
    ## pointed at tls.crt, the one certificate file the slot's Secret always
    ## holds; with client certificates not requested, which the chart writes
    ## while requireClientCertificate is false, the server verifies nothing
    ## against it. Verified by running the assembled configuration.
    ##
    ## With a password attached as well, the chart's connection check verifies
    ## the server against that same CA file, so it passes for a self-signed
    ## certificate and fails for one a separate authority issued; the cache
    ## itself is unaffected. An attached password is enforced over TLS as it is
    ## without it. The build halts naming server_certificate when client_tls is
    ## true and nothing is attached, or the attachment publishes no Secret name,
    ## and naming client_tls when a certificate is attached while it is false.
    {{- if $tls }}
    tls:
      enabled: true
      existingSecret: "{{ .features.server_certificate.provides.name }}"
      serverPublicKey: tls.crt
      serverKey: tls.key
      caPublicKey: tls.crt
      requireClientCertificate: false
    {{- end }}

    ## ── Cache resources ────────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}
