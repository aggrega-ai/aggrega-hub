apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: filesystem
  version: 1.0.0
  license: Apache-2.0
  description: >
    The file-tree tool realized on Kubernetes by the helm provider's Workload
    synthesis, rendered offline as plain manifests. The Workload becomes a
    StatefulSet whose tree lives on a per-instance persistent volume, mounted
    where the Release's image reads and writes it, with a ClusterIP Service
    fronting the port the tool listens on and a headless Service carrying the
    instance's stable network identity. It runs one instance, and that is a
    condition of the tool being correct rather than a starting size: two
    instances behind one address would each hold their own copy of the tree, so
    a file written through one would be missing from the other, and were they
    to share one disk instead, two writers would disagree about what it
    contains. The count is pinned here for that reason and is not exposed as an
    operational knob. A read-only access mode reaches the mount as well as the
    tool, so a tree the Aggregate declared read-only cannot be written even by
    an image that would try. The developer's access mode, declared effect and
    timeout reach the running tool as environment variables, together with the
    directory the tree is mounted at. The image is the Release's, because
    this tool packages no upstream product: a build with none set halts and
    names the key. An edge from the tool, on a socket the author names,
    delivers the names its `inject:` block dictates, as variables or as files
    from a ConfigMap emitted beside the StatefulSet, never inside the tree.
    provides is the synthesized ClusterIP Service, so a consumer
    wires to a host, port, endpoint and protocol and never to the file tree
    behind them.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/filesystem:1.0.0
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service
  # "<rendered_name>-<service-key>", and this workload's client-facing service key
  # is "default". It carries no namespace segment, so the recipe is independent
  # of where it is deployed and a consumer in another namespace qualifies it on
  # its own side (caller-side routing). The port is the one the tool listens on,
  # because a caller reaches this Service directly rather than through a routing
  # layer.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "http"
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the file tree in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered StatefulSet would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered StatefulSet would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block: a synthesized Workload offers no free-form annotation surface
  # for one to land in, so a bag declared here would be read by nothing.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation names
  # a spelling for them; the recipe delivers each under a stable name for the
  # application's own code to read, and the developer's access mode, effect and
  # timeout reach the running tool through exactly these names. The mount
  # directory is delivered under the same scheme and is single-sourced with the
  # volumeMount below, so the path the tool serves and the path the volume is
  # mounted at cannot drift apart. The optional description override is emitted
  # only when the developer set it, so an unset value renders no variable rather
  # than an empty one.
  #
  # The image is the tool's own code, and the component declares no socket, so
  # this recipe derives no variable from a connection: an edge from the tool,
  # on whatever socket the author names, delivers exactly what its inject block
  # dictates — any key the target publishes, under the names that code reads —
  # and an edge writing none delivers nothing. A dictated env entry becomes a
  # container variable under the name it gives, read off the inject pipe as a
  # map; a dictated file entry a read-only file at the absolute path it names,
  # held in one ConfigMap and mounted by subPath, so a path that is not
  # absolute, or one lying beneath another file's path, is refused, and so is
  # one at, beneath or above the directory the file tree is mounted at, which
  # is the tree's alone. An arg entry is refused, because this recipe renders
  # no command line: Kubernetes takes a container's arguments in place of the
  # image's default command, which is the Release's. Any other mechanism is
  # refused too. A dictated variable named like one this recipe delivers
  # itself halts the build, naming both, since the compiler cannot see the
  # names a recipe writes.
  #
  # filesystem-files.configmap.yaml holds the file entries the connections
  # dictate, keyed file-0, file-1 and so on in path order, the keys the
  # workload's mounts read. It is emitted only while a connection dictates a
  # file, so a build with none renders nothing there. The pod mounts it by
  # name, which resolves only in the pod's own namespace, so it carries the
  # namespace the Release declares for the component through the
  # aggrega.ai/namespace annotation, and none where it declares none. The block
  # reading the connections' inject directives is the one every helm Workload
  # realization of a tool in this catalog declares, differing only in the
  # names each delivers itself and the refusals its own container calls for; a
  # change to it is made to all.
  artifacts:
    filesystem-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" "" }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson (toString $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
  workload: |
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $taken := dict -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_ACCESS_MODE" "the component's own value access_mode" -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_ROOT" "the component's own infra.mount_path" -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_SIDE_EFFECTS" "the component's own value side_effects" -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_PORT" "the component's own infra.port" -}}
    {{- if .values.llm_description_override -}}
    {{- $_ := set $taken "FILESYSTEM_TOOL_DESCRIPTION" "the component's own value llm_description_override" -}}
    {{- end -}}
    {{- $tree := trimSuffix "/" (toString .infra.mount_path) -}}
    {{- $files := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "the %s connection %s of %q dictates the variable %s, which this realization already delivers from %s: dictate another name in that connection's inject block" $edge.socket $alias $.context.instance_id $name .) -}}
    {{- end -}}
    {{- else if eq $mechanism "file" -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $edge.socket $alias $.context.instance_id $name) -}}
    {{- end -}}
    {{- if or (eq $name $tree) (hasPrefix (printf "%s/" $tree) $name) (hasPrefix (printf "%s/" $name) $tree) -}}
    {{- fail (printf "the %s connection %s of %q dictates a file at %q, and this realization mounts the tool's file tree at %q, so the two paths would overlap: dictate the file at a path neither at, beneath nor above that directory" $edge.socket $alias $.context.instance_id $name $.infra.mount_path) -}}
    {{- end -}}
    {{- $_ := set $files $name true -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the file tree
    # persists to the per-instance persistentTemplate volume below, so the
    # stateful shape (and its per-instance claim) is correct.
    form: stateful
    # One instance, pinned here rather than exposed as an operational knob:
    # a second instance behind the same address holds its own copy of the tree,
    # so a file written through one is missing from the other, and a disk shared
    # between them instead would have two writers disagreeing about what it
    # contains.
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          FILESYSTEM_TOOL_ACCESS_MODE: "{{ .values.access_mode }}"
          FILESYSTEM_TOOL_ROOT: "{{ .infra.mount_path }}"
          FILESYSTEM_TOOL_SIDE_EFFECTS: "{{ .values.side_effects }}"
          FILESYSTEM_TOOL_TIMEOUT_SECONDS: "{{ .values.timeout_seconds }}"
          FILESYSTEM_TOOL_PORT: "{{ .infra.port }}"
          {{- with .values.llm_description_override }}
          FILESYSTEM_TOOL_DESCRIPTION: "{{ . }}"
          {{- end }}
          {{- range $alias, $edge := .context.uses }}
          {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- end }}
        ports:
          http: {{ .infra.port }}
        # The image is the Release's, so no product documents a health endpoint
        # here: the readiness probe opens a TCP connection to the declared port,
        # and the Service sends no traffic until the process accepts one. No
        # liveness probe is declared, because a start-up time cannot be known
        # for an image this realization does not name, and a liveness probe
        # that fires before a slow server has started restarts it for ever.
        health:
          ready:
            tcp: {{ .infra.port }}
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies. Rendered bare, a whole-core
        # quantity such as 1 or 2 re-parses as a YAML integer and fails workload
        # validation, which wants a string here; a milli quantity such as 250m
        # happens not to. Quoting removes the difference, so every legal quantity
        # a Release may write renders and validates alike.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        # The developer's read-only choice reaches the mount, not only the
        # environment variable the tool reads: a tree declared read-only stays
        # read-only even under an image that would write it.
        volumeMounts:
          - name: data
            path: "{{ .infra.mount_path }}"
    {{- if eq .values.access_mode "read_only" }}
            readonly: true
    {{- end }}
    {{- $i := 0 }}
    {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
    {{- $i = add $i 1 }}
    {{- end }}
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
    {{- if $files }}
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          http: {{ .infra.port }}
