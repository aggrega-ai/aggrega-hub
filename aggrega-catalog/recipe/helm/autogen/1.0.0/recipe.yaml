apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: autogen
  version: 1.0.0
  description: >
    An AutoGen agent application on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment running the operator-supplied application image. The model
    endpoint published by the component wired into the `model` socket is injected
    as OPENAI_BASE_URL, the environment variable the OpenAI-compatible client SDK
    reads, so the application talks to the wired model without hardcoding an
    endpoint. An attached model API key is delivered as OPENAI_API_KEY via a
    secretKeyRef.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/autogen:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge. The edge is
        # addressed by the developer-chosen alias, so the recipe ranges the
        # outbound edges and matches on the socket name to find it, then reads the
        # model recipe's published endpoint and model name. OPENAI_BASE_URL is an
        # environment variable the OpenAI-compatible client SDK reads, as is the
        # API key. The model name is a different case: an AutoGen agent is given
        # its model through the model-client configuration its application code
        # constructs, so the framework consults no environment variable for the
        # name. The name is therefore delivered as OPENAI_MODEL for the
        # application's own code to read — a stable name this recipe defines, not
        # a claim about what AutoGen reads.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # The model API key, when a credential is attached to the model_api_key
        # slot, is delivered as OPENAI_API_KEY via a secretKeyRef — the key value
        # never renders into the manifest. Unattached, no key env is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
        attachments:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
