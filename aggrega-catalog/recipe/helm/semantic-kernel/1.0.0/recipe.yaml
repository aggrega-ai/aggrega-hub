apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: semantic-kernel
  version: 1.0.0
  description: >
    A Semantic Kernel agent application on Kubernetes, rendered offline as plain manifests
    by the helm provider's Workload synthesis. The Workload becomes a Deployment
    running the operator-supplied application image. The model endpoint published
    by the component wired into the `model` socket is injected as OPENAI_BASE_URL,
    the environment variable the OpenAI-compatible client SDK reads; the model
    name is delivered as OPENAI_CHAT_MODEL_ID, the variable Semantic Kernel's
    OpenAI chat service reads; an attached model API key is delivered as
    OPENAI_API_KEY via a secretKeyRef.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/semantic-kernel:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name, then reads the model recipe's published endpoint and
        # model name. The client SDK reads the base URL and the API key from the
        # environment. Semantic Kernel reads the model name from the environment
        # itself: its OpenAI settings carry an OPENAI_ prefix over a chat-model-id
        # field, so the OpenAI chat service reads OPENAI_CHAT_MODEL_ID — the
        # spelling its own settings reference documents as required for OpenAI chat
        # completion. The recipe therefore delivers the model name under that name
        # and the framework picks it up with no application code, so no second
        # model variable is emitted.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_CHAT_MODEL_ID: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # An attached model API key is delivered as OPENAI_API_KEY via a
        # secretKeyRef; the key value never renders into the manifest. Unattached,
        # no key env is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
        attachments:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
