apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: memcached
  version: 1.0.0
  description: >
    Memcached on Kubernetes via the helm provider's Workload synthesis, running
    the official upstream memcached image directly (no external Helm chart).
    Used as an in-memory cache with no persistence, so it renders a stateless
    Deployment plus a ClusterIP Service and declares no storage. Authentication
    is off by default; when the optional password credential slot is attached
    the value is delivered as an env secretKeyRef (MEMCACHED_PASSWORD) alongside
    the MEMCACHED_USERNAME value, so the plaintext password never appears in the
    rendered Deployment manifest. SASL authentication requires a Memcached image
    built with SASL support; the plain official image ignores these variables
    and runs without authentication. provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no
    namespace, so the recipe is independent of where it is deployed. A consumer
    in another namespace qualifies the host with the target namespace on its own
    side (caller-side routing).
  license: BSD-3-Clause
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/memcached:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "memcached"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A cache holds no durable state, so the default stateless form (a
    # Deployment on the helm engine) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: {{ .infra.replicas }}
    containers:
      main:
        image: memcached:{{ .infra.engine_version }}
        # Authentication is wired through the optional `password` credential
        # slot. When a credential is attached, the password is delivered as an
        # env secretKeyRef (MEMCACHED_PASSWORD) and the SASL username is emitted
        # as MEMCACHED_USERNAME from the developer value — the plaintext
        # password never lands in the manifest. SASL authentication requires a
        # Memcached image built with SASL support; the plain official image
        # ignores these variables. With no credential attached, no auth env and
        # no secret are emitted and the cache runs without authentication,
        # byte-identically to a Recipe with no slot at all.
        #
        # Tuning knobs pass as memcached server flags — the official image's
        # entrypoint prepends `memcached` to a flag-leading argument list. The
        # block is emitted only when a knob is set, so a bare cache renders no
        # args and matches the un-thickened recipe exactly.
    {{- if or .values.memory_limit .values.max_connections .values.threads .values.max_item_size }}
        args:
    {{- with .values.memory_limit }}
          - "-m"
          - "{{ . }}"
    {{- end }}
    {{- with .values.max_connections }}
          - "-c"
          - "{{ . }}"
    {{- end }}
    {{- with .values.threads }}
          - "-t"
          - "{{ . }}"
    {{- end }}
    {{- with .values.max_item_size }}
          - "-I"
          - "{{ . }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .features) "password" }}
        variables:
          MEMCACHED_USERNAME: "{{ .values.username }}"
    {{- end }}
        ports:
          memcached: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
    {{- if hasKey (default dict .features) "password" }}
        attachments:
          MEMCACHED_PASSWORD:
            from: password
            as: env
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          memcached: {{ .infra.port }}
