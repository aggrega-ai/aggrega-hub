apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mysql-operator
  version: 1.0.0
  description: >
    Installs the MySQL Operator for Kubernetes control plane as an explicit
    component: a ServiceAccount, the cluster RBAC the controller needs to
    reconcile InnoDBCluster custom resources, and the controller Deployment on the
    pinned controller image. Emitting the control plane as a first-class component
    lets a controller-driven MySQL InnoDB Cluster ship its runtime prerequisite
    alongside the custom resource it emits, so the custom resource and the
    controller that reconciles it are deployed together. This is a minimal
    control-plane bootstrap installing no custom-resource definitions, and at
    the image the Component pins its role falls short of what the controller
    needs: it grants no pod status, disruption budgets, cron jobs, namespaces or
    definition reads, and renders none of the sidecar and switchover roles the
    controller binds a cluster's servers to. Reach for `mysql-operator-chart`,
    which renders the project's own chart.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/mysql-operator:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # What this bootstrap lacks against the project's chart at the release the
  # image pins, 2.3.0: the chart's controller role also grants pod status
  # updates, disruption budgets, cron jobs, namespace and custom-resource
  # definition reads, Prometheus-operator monitors, event updates and every
  # resource of its own API group; the chart renders two further cluster roles,
  # for the servers' sidecars and for switchover jobs, which the controller
  # binds each cluster to and whose names it is handed in its environment; and
  # it renders the peering object the controller's replicas coordinate through.
  # None of that is rendered here.
  #
  # The cluster role below names the custom-resource groups the controller
  # reconciles — its own API group, and the peering group it coordinates
  # controller instances through — together with the workload, networking and
  # credential resources it creates for a cluster. It is a bootstrap role rather
  # than a transcription of the project's published one, which is why the recipe
  # description says so: a role that is smaller than the controller needs renders
  # cleanly and then fails at the first object the controller cannot create.
  #
  # The controller's readiness probe is the one the project's own deploy manifest
  # gives it at the release the image pins: it reads a file the operator removes
  # as its start-up begins and writes once that start-up has completed. The
  # manifest declares no liveness probe, so none is declared here.
  artifacts:
    serviceaccount.yaml: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
    clusterrole.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .context.instance_id }}
      rules:
        - apiGroups: ["mysql.oracle.com"]
          resources: ["innodbclusters", "mysqlbackups", "mysqlclustersetfailovers"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["mysql.oracle.com"]
          resources: ["innodbclusters/status", "mysqlbackups/status", "mysqlclustersetfailovers/status"]
          verbs: ["get", "update", "patch"]
        - apiGroups: ["zalando.org"]
          resources: ["clusterkopfpeerings", "kopfpeerings"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
        - apiGroups: [""]
          resources: ["configmaps", "persistentvolumeclaims", "secrets", "serviceaccounts", "services"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "patch", "delete"]
        - apiGroups: [""]
          resources: ["pods/exec", "pods/log"]
          verbs: ["get", "create"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]
        - apiGroups: ["apps"]
          resources: ["deployments", "statefulsets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["rolebindings", "roles"]
          verbs: ["get", "list", "watch", "create", "update", "patch"]
    clusterrolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .context.instance_id }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: {{ .context.instance_id }}
        template:
          metadata:
            labels:
              app.kubernetes.io/name: {{ .context.instance_id }}
          spec:
            serviceAccountName: {{ .context.instance_id }}
            containers:
              - name: controller
                image: {{ .infra.image }}
                readinessProbe:
                  exec:
                    command:
                      - cat
                      - /tmp/mysql-operator-ready
                  initialDelaySeconds: 1
                  periodSeconds: 3
