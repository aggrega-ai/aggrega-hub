apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mcp
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Model Context Protocol server tool realized on Kubernetes by the helm
    provider's Workload synthesis, rendered offline as plain manifests. The
    Workload becomes a Deployment that stays up between calls and a ClusterIP
    Service that fronts the port it listens on, because an agent reaches this
    tool by connecting to it rather than by triggering it. The developer's
    declared effect, timeout and description override reach the running server
    as environment variables. The image is the Release's, because this tool
    packages no upstream product: a build with none set halts and names the
    key. provides is the synthesized Service, so a consumer wires to a host,
    port, endpoint and protocol and never to the server behind them; it also
    publishes the request header the server reads a caller's credential from,
    Authorization unless infra.credential_header names another.

    Reach for this realization where the server ships as a container image
    serving the protocol over HTTP; reach for helm/mcp-stdio-bridge where it
    is a package speaking stdio, and for helm/mcp-remote where someone else
    already runs it. The two stdio keys, a server_env attachment and
    infra.endpoint are refused here, each naming the realization that reads
    it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/mcp:1.0.0
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service
  # "<rendered_name>-<service-key>", and this workload's one service key is
  # "default". It carries no namespace segment, so the recipe is independent of
  # where it is deployed and a consumer in another namespace qualifies it on
  # its own side (caller-side routing). The port is the one the server listens
  # on, because a caller reaches this Service directly rather than through a
  # routing layer. Which header the image's server checks a caller's
  # credential in is the image's, so the Release states it in
  # infra.credential_header, where the Component holds its default.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "http"
    credential_header: "{{ .infra.credential_header }}"
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs. A Release carrying an
    # input only another realization reads is told which realization reads it
    # by the workload's refusal below, rather than asked for an image it does
    # not mean to run.
    image_supplied: >-
      {{- $elsewhere := or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") (hasKey (default dict .features) "server_env") (optional .infra "endpoint" "") -}}
      {{- if not (or (optional .infra "image" "") $elsewhere) -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the Model Context Protocol over HTTP in the Release" -}}
      {{- end -}}
    # A key left out of infra.compute takes the component's default, so only a
    # value written empty reaches this check.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets infra.compute.cpu on the tool to an empty value, so the rendered Deployment would carry no CPU request or limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets infra.compute.memory on the tool to an empty value, so the rendered Deployment would carry no memory request or limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block: a synthesized Workload offers no free-form annotation surface
  # for one to land in, so a bag declared here would be read by nothing.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation
  # names a spelling for them; the recipe delivers each under a stable name for
  # the server's own code to read, and the developer's declared effect and
  # timeout reach the running server through exactly these names. The optional
  # description override is emitted only when the developer set it, so an unset
  # value renders no variable rather than an empty one.
  #
  # The inputs that only another realization reads halt the build, naming the
  # realization that reads them, rather than being dropped: the two stdio keys
  # and the server_env slot are helm/mcp-stdio-bridge's, and infra.endpoint
  # is helm/mcp-remote's. This realization runs the image infra.image names
  # and nothing else.
  workload: |
    {{- if or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") -}}
    {{- fail (printf "infra.stdio_command or infra.stdio_runtime of %q is set, but this realization runs the image infra.image names and starts no command line; remove both, or map the component to helm/mcp-stdio-bridge to run that command line behind the bridge" $.context.instance_id) -}}
    {{- end -}}
    {{- if hasKey (default dict .features) "server_env" -}}
    {{- fail (printf "the server_env slot of %q carries an attachment, but this realization delivers nothing from it to the image it runs; remove the attachment, or map the component to helm/mcp-stdio-bridge, which imports every key of the attachment's Secret into the server's environment by reference" $.context.instance_id) -}}
    {{- end -}}
    {{- with optional .infra "endpoint" "" -}}
    {{- fail (printf "infra.endpoint of %q is set, but this realization runs the image infra.image names and reaches no server elsewhere; remove infra.endpoint, or map the component to helm/mcp-remote to reach the server at that address" $.context.instance_id) -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          MCP_TOOL_SIDE_EFFECTS: "{{ .values.side_effects }}"
          MCP_TOOL_TIMEOUT_SECONDS: "{{ .values.timeout_seconds }}"
          MCP_TOOL_PORT: "{{ .infra.port }}"
          {{- with .values.llm_description_override }}
          MCP_TOOL_DESCRIPTION: "{{ . }}"
          {{- end }}
        ports:
          http: {{ .infra.port }}
        # The image is the Release's, so no product documents a health endpoint
        # here: the readiness probe opens a TCP connection to the declared port,
        # and the Service sends no traffic until the process accepts one. No
        # liveness probe is declared, because a start-up time cannot be known
        # for an image this realization does not name, and a liveness probe
        # that fires before a slow server has started restarts it for ever.
        health:
          ready:
            tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
