apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mcp
  version: 1.0.0
  license: Apache-2.0
  description: >
    The Model Context Protocol server tool realized on Kubernetes by the helm
    provider's Workload synthesis, rendered offline as plain manifests. The
    Workload becomes a Deployment that stays up between calls and a ClusterIP
    Service that fronts the port it listens on, because an agent reaches this
    tool by connecting to it rather than by triggering it. The developer's
    declared effect, timeout and description override reach the running server
    as environment variables. The image is the Release's, because this tool
    packages no upstream product: a build with none set halts and names the
    key. An edge from the tool, on a socket the author names, delivers the
    names its `inject:` block dictates, as variables or as files from a
    ConfigMap emitted beside the Deployment. provides is the synthesized
    Service, so a consumer wires to a host, port, endpoint and protocol and
    never to the server behind them; it also publishes the request header the
    server reads a caller's credential from, Authorization unless
    infra.credential_header names another.

    Reach for this realization where the server ships as a container image
    serving the protocol over HTTP; reach for helm/mcp-stdio-bridge where it
    is a package speaking stdio, and for helm/mcp-remote where someone else
    already runs it. The two stdio keys, a server_env attachment and
    infra.endpoint are refused here, each naming the realization that reads
    it. The component's own `inject:` block delivers its entries as a
    connection's are, and one reading a value of the tool alone replaces that
    value's default name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/mcp:1.0.0
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service
  # "<rendered_name>-<service-key>", and this workload's one service key is
  # "default". It carries no namespace segment, so the recipe is independent of
  # where it is deployed and a consumer in another namespace qualifies it on
  # its own side (caller-side routing). The port is the one the server listens
  # on, because a caller reaches this Service directly rather than through a
  # routing layer. Which header the image's server checks a caller's
  # credential in is the image's, so the Release states it in
  # infra.credential_header, where the Component holds its default.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    endpoint: "http://{{ .context.rendered_name }}-default:{{ .infra.port }}"
    protocol: "http"
    credential_header: "{{ .infra.credential_header }}"
  assertions:
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs. A Release carrying an
    # input only another realization reads is told which realization reads it
    # by the workload's refusal below, rather than asked for an image it does
    # not mean to run.
    image_supplied: >-
      {{- $elsewhere := or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") (hasKey (default dict .features) "server_env") (optional .infra "endpoint" "") -}}
      {{- if not (or (optional .infra "image" "") $elsewhere) -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the Model Context Protocol over HTTP in the Release" -}}
      {{- end -}}
    # A key left out of infra.compute takes the component's default, so only a
    # value written empty reaches this check.
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets infra.compute.cpu on the tool to an empty value, so the rendered Deployment would carry no CPU request or limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets infra.compute.memory on the tool to an empty value, so the rendered Deployment would carry no memory request or limit: set it, or remove it to take the component's default" -}}
      {{- end -}}
  # This Recipe reads no infra.overrides keys, and the component declares no
  # such block: a synthesized Workload offers no free-form annotation surface
  # for one to land in, so a bag declared here would be read by nothing.
  #
  # The tool's own values are delivered to the container as environment
  # variables. The image is the Release's, so no upstream documentation names a
  # spelling for them; the recipe delivers each under a stable default name for
  # the server's own code to read, and the developer's declared effect and
  # timeout reach the running server through these names by default. The
  # optional description override is emitted only when the developer set it, so
  # an unset value renders no variable rather than an empty one.
  #
  # The inputs that only another realization reads halt the build, naming the
  # realization that reads them, rather than being dropped: the two stdio keys
  # and the server_env slot are helm/mcp-stdio-bridge's, and infra.endpoint
  # is helm/mcp-remote's. This realization runs the image infra.image names
  # and nothing else.
  #
  # The image is the tool's own code, and the component declares no socket, so
  # this recipe derives no variable from a connection: an edge from the tool,
  # on whatever socket the author names, delivers exactly what its inject block
  # dictates — any key the target publishes, under the names that code reads —
  # and an edge writing none delivers nothing. A dictated env entry becomes a
  # container variable under the name it gives, read off the inject pipe as a
  # map; a dictated file entry a read-only file at the absolute path it names,
  # held in one ConfigMap and mounted by subPath, so a path that is not
  # absolute, or one lying beneath another file's path, is refused. An arg
  # entry is refused, because this recipe renders no command line: Kubernetes
  # takes a container's arguments in place of the image's default command,
  # which is the Release's. Any other mechanism is refused too. A dictated
  # variable named like one this recipe delivers itself halts the build,
  # naming both, since the compiler cannot see the names a recipe writes.
  #
  # The component's own inject block. The developer may also write an inject
  # block on the component itself, and its env and file entries reach the
  # container as a connection's do: each env entry under the name it gives, read
  # off the inject pipe, and each file at the absolute path it names, from the
  # same ConfigMap and checked as a connection's file is. The names this recipe
  # gives the tool's own values are defaults: each is rendered, and kept from a
  # connection, only while no entry of that block, in either mechanism, delivers
  # its value. The templates read that at .context.self_inject, which maps each
  # name the developer wrote to values.<key> for an entry whose template reads
  # that one own value. A refusal about one of that block's entries names the
  # block rather than a connection.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. The connections
  # and that block only record who dictates each name and each file, and each
  # refusal runs once over both, naming the one that dictated it. It is part of
  # an artifact or a workload template, and no catalog kind holds part of one
  # for several Recipes to share; a change to it is made to all of them.
  #
  # mcp-files.configmap.yaml holds the file entries the connections and the
  # component's own inject block dictate, keyed file-0, file-1 and so on in path
  # order, the keys the workload's mounts read. It is emitted only while either
  # one dictates a file, so a build with none renders nothing there. The pod
  # mounts it by name, which resolves only in the pod's own namespace, so it
  # carries the namespace the Release, or else the Aggregate, declares for the
  # component through the aggrega.ai/namespace annotation, and none where it
  # declares none. The block reading the connections' inject directives is the
  # one every helm Workload realization of a tool in this catalog declares,
  # differing only in the names each delivers itself and the refusals its own
  # container calls for; a change to it is made to all.
  artifacts:
    mcp-files.configmap.yaml: |
      {{- $pipeFiles := optional (default dict .context.inject) "file" dict }}
      {{- $files := dict }}
      {{- range $alias, $edge := .context.uses }}
      {{- range $path, $from := (optional (default dict $edge.inject) "file" dict) }}
      {{- $_ := set $files $path (optional $pipeFiles $path "") }}
      {{- end }}
      {{- end }}
      {{- range $mechanism, $names := default dict .context.self_inject }}
      {{- if eq $mechanism "file" }}{{ range $path, $key := $names }}{{ $_ := set $files $path (optional $pipeFiles $path "") }}{{ end }}{{ end }}
      {{- end }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson (toString $v) }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
  workload: |
    {{- if or (optional .infra "stdio_command" list) (optional .infra "stdio_runtime" "") -}}
    {{- fail (printf "infra.stdio_command or infra.stdio_runtime of %q is set, but this realization runs the image infra.image names and starts no command line; remove both, or map the component to helm/mcp-stdio-bridge to run that command line behind the bridge" $.context.instance_id) -}}
    {{- end -}}
    {{- if hasKey (default dict .features) "server_env" -}}
    {{- fail (printf "the server_env slot of %q carries an attachment, but this realization delivers nothing from it to the image it runs; remove the attachment, or map the component to helm/mcp-stdio-bridge, which imports every key of the attachment's Secret into the server's environment by reference" $.context.instance_id) -}}
    {{- end -}}
    {{- with optional .infra "endpoint" "" -}}
    {{- fail (printf "infra.endpoint of %q is set, but this realization runs the image infra.image names and reaches no server elsewhere; remove infra.endpoint, or map the component to helm/mcp-remote to reach the server at that address" $.context.instance_id) -}}
    {{- end -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $named := dict -}}
    {{- $ownEnv := dict -}}
    {{- $ownFile := dict -}}
    {{- range $mechanism, $names := default dict .context.self_inject -}}
    {{- range $name, $key := $names -}}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end -}}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end -}}
    {{- if eq $mechanism "file" }}{{ $_ := set $ownFile $name true }}{{ end -}}
    {{- end -}}
    {{- end -}}
    {{- $taken := dict -}}
    {{- if not (hasKey $named "values.side_effects") }}{{ $_ := set $taken "MCP_TOOL_SIDE_EFFECTS" "the component's own value side_effects" }}{{ end -}}
    {{- if not (hasKey $named "values.timeout_seconds") }}{{ $_ := set $taken "MCP_TOOL_TIMEOUT_SECONDS" "the component's own value timeout_seconds" }}{{ end -}}
    {{- $_ := set $taken "MCP_TOOL_PORT" "the component's own infra.port" -}}
    {{- if .values.llm_description_override -}}
    {{- if not (hasKey $named "values.llm_description_override") }}{{ $_ := set $taken "MCP_TOOL_DESCRIPTION" "the component's own value llm_description_override" }}{{ end -}}
    {{- end -}}
    {{- $files := dict -}}
    {{- $dictated := dict -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- range $mechanism, $entries := (default dict $edge.inject) -}}
    {{- range $name, $from := $entries -}}
    {{- if eq $mechanism "env" -}}
    {{- $_ := set $dictated $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "file" -}}
    {{- $_ := set $files $name (printf "the %s connection %s of %q" $edge.socket $alias $.context.instance_id) -}}
    {{- else if eq $mechanism "arg" -}}
    {{- fail (printf "the %s connection %s of %q dictates the command-line argument %q, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name) -}}
    {{- else -}}
    {{- fail (printf "the %s connection %s of %q dictates %q under the delivery mechanism %q, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $edge.socket $alias $.context.instance_id $name $mechanism) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $v := $ownEnv }}{{ $_ := set $dictated $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $v := $ownFile }}{{ $_ := set $files $name (printf "the own inject block of %q" $.context.instance_id) }}{{ end -}}
    {{- range $name, $by := $dictated -}}
    {{- with optional $taken $name "" -}}
    {{- fail (printf "%s dictates the variable %s, which this realization already delivers from %s: dictate another name in that inject block" $by $name .) -}}
    {{- end -}}
    {{- end -}}
    {{- range $name, $by := $files -}}
    {{- if not (hasPrefix "/" $name) -}}
    {{- fail (printf "%s dictates a file at %q, and a file is written at an absolute path inside the container: write that path in that inject block starting with /" $by $name) -}}
    {{- end -}}
    {{- end -}}
    {{- range $path, $_ := $files -}}
    {{- range $other, $_ := $files -}}
    {{- if hasPrefix (printf "%s/" $path) $other -}}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) -}}
    {{- end -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: "{{ .infra.image }}"
        variables:
          {{- if not (hasKey $named "values.side_effects") }}
          MCP_TOOL_SIDE_EFFECTS: "{{ .values.side_effects }}"
          {{- end }}
          {{- if not (hasKey $named "values.timeout_seconds") }}
          MCP_TOOL_TIMEOUT_SECONDS: "{{ .values.timeout_seconds }}"
          {{- end }}
          MCP_TOOL_PORT: "{{ .infra.port }}"
          {{- if not (hasKey $named "values.llm_description_override") }}
          {{- with .values.llm_description_override }}
          MCP_TOOL_DESCRIPTION: "{{ . }}"
          {{- end }}
          {{- end }}
          {{- range $name, $_ := $ownEnv }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- range $alias, $edge := .context.uses }}
          {{- range $name, $from := (optional (default dict $edge.inject) "env" dict) }}
          {{ toJson $name }}: {{ toJson (toString (optional $env $name "")) }}
          {{- end }}
          {{- end }}
        ports:
          http: {{ .infra.port }}
        # The image is the Release's, so no product documents a health endpoint
        # here: the readiness probe opens a TCP connection to the declared port,
        # and the Service sends no traffic until the process accepts one. No
        # liveness probe is declared, because a start-up time cannot be known
        # for an image this realization does not name, and a liveness probe
        # that fires before a slow server has started restarts it for ever.
        health:
          ready:
            tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
