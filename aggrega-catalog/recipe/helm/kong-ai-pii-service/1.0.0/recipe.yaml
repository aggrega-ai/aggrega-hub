apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: kong-ai-pii-service
  version: 1.0.0
  description: >
    Kong's AI PII service on Kubernetes via the helm provider's Workload
    synthesis, running the image infra.image names: a stateless Deployment
    plus a ClusterIP Service on the port the service answers on. Synthesized
    because Kong publishes no chart for the service. It keeps no state, so it
    renders no volume.

    The image comes from infra.image alone, and the build halts naming
    infra.image when it is unset or empty; infra.image_pull_secret becomes the
    pod's image pull secret. The service listens on 8080 over plain HTTP, the
    port Kong's own run command publishes. It serves HTTPS on 8443 only when
    started with a certificate and a key, which this Recipe does not mount, so
    it publishes http.

    Readiness is asked of GET /llm/v1/status, which the service answers once
    it is up; it loads its language model as it starts, fetching one its image
    does not carry. Memory is requested and limited at infra.compute.memory,
    1Gi unless the Release sets another, above the 600MB Kong asks to be free
    for the one model the service loads by default. provides.host is the bare,
    self-contained in-cluster service name of the synthesized Service — it
    carries no namespace, so a consumer in another namespace qualifies it on
    its own side.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/kong-ai-pii-service:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # The port the service listens on. Kong's reference names no setting that
  # moves the plain-HTTP listener, and its run command publishes 8080, so the
  # port is this Recipe's to state rather than the operator's to set: it has one
  # home here, which the published port, the container port and the Service
  # read.
  locals:
    listen_port: "8080"

  # host spells the Service name the helm provider derives from the service key
  # below; provides cannot read the workload, so the two are edited together.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .locals.listen_port }}"
    protocol: "http"

  # The catalog names no image of the service, so the Release names the one it
  # runs. An unset infra.image halts where the Release is read, naming it; an
  # empty one halts here.
  assertions:
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs the Kong AI PII service image the Release supplies, because access to that image is governed by Kong's terms and the catalog therefore names none: set infra.image to the full reference of the image the operator is entitled to pull, tag included, as in kong/ai-pii-service:v0.2.2-en" -}}
      {{- end -}}

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: stateless
    replicas: 1
    {{- with .infra.image_pull_secret }}
    imagePullSecrets:
      - "{{ . }}"
    {{- end }}
    containers:
      main:
        # The image the Release names, piped as written.
        image: "{{ .infra.image }}"
        ports:
          http: {{ .locals.listen_port }}
        # GET /llm/v1/status is the service's health route, answering status
        # ok. It is read as readiness, so the Service sends no caller to the
        # pod until it answers; Kong documents no timings for it, so the
        # probe's defaults stand. The product declares no check that restarts
        # the service, so no liveness probe is declared either.
        health:
          ready:
            http: /llm/v1/status
        # Quoted because a quantity is a string: a whole-core count authored as
        # a bare number would otherwise be read as an integer and refused.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .locals.listen_port }}
