apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: openai-gateway
  version: 1.0.0
  description: >
    OpenAI reached through an in-cluster Envoy AI Gateway rather than directly —
    a gateway-mediated realization of the same model component, selectable in the
    Manifest alongside the direct reference recipe. The application points at the
    gateway's in-cluster endpoint (the operator repoints infra.endpoint from the
    managed host onto the gateway Service); the gateway holds the provider
    credential and speaks the OpenAI API schema to the upstream, so the credential
    never reaches the application. The recipe emits the gateway custom resources
    that register this model as a backend and bind its credential, conformant to
    the Envoy AI Gateway API. The gateway control plane is a runtime prerequisite:
    the build halts unless the operator affirms it is installed
    (infra.control_plane_present), so no custom resource is emitted into a cluster
    that cannot reconcile it. The provider credential is supplied as a
    referenceable Secret attached to the api_key slot; the security policy points
    the gateway at it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/openai:1.0.0
  # The application's endpoint is the operator-supplied in-cluster gateway address
  # (infra.endpoint repointed from the managed host onto the gateway Service),
  # single-sourced into both provides and the reference workload.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  # The gateway control plane must exist in the target cluster before its custom
  # resources can reconcile. The compiler cannot inspect cluster state, so the
  # prerequisite is declared: an operator affirms it in the Release, and an
  # unaffirmed build halts here rather than emitting an orphan custom resource.
  assertions:
    gateway_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Envoy AI Gateway control plane must be installed in the target cluster before this realization emits its custom resources; once the gateway is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
  # form: reference emits an in-cluster ExternalName Service aliasing the gateway,
  # so a consumer wires to a stable in-cluster name regardless of realization.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
  # The gateway custom resources. AIServiceBackend registers this model as an
  # upstream the gateway routes to under the OpenAI API schema; BackendSecurityPolicy
  # binds the provider credential (the referenceable Secret attached to api_key) to
  # that backend so the gateway authenticates upstream on the application's behalf.
  artifacts:
    aiservicebackend.yaml: |
      apiVersion: aigateway.envoyproxy.io/v1beta1
      kind: AIServiceBackend
      metadata:
        name: {{ .context.instance_id }}
      spec:
        apiSchema:
          name: OpenAI
        backendRef:
          name: {{ .context.instance_id }}-upstream
    backendsecuritypolicy.yaml: |
      apiVersion: aigateway.envoyproxy.io/v1beta1
      kind: BackendSecurityPolicy
      metadata:
        name: {{ .context.instance_id }}-credential
      spec:
        targetRefs:
          - group: aigateway.envoyproxy.io
            kind: AIServiceBackend
            name: {{ .context.instance_id }}
        type: APIKey
        apiKey:
          secretRef:
            name: {{ .features.api_key.provides.name }}
