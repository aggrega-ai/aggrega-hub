apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mysql-operator-chart
  version: 1.0.0
  license: UPL-1.0
  description: >
    Installs the MySQL Operator for Kubernetes control plane through the
    project's own Helm chart, at the chart release whose application version
    is the controller image's. The chart is official, published by the MySQL
    team from the operator's repository; complete, carrying the controller,
    its definitions and its roles; and maintained, released at each operator
    release. The project's chart repository serves its newest release
    alone, so a chart release it has replaced resolves only from a cache that
    already holds it.

    Beside what the minimal bootstrap installs — the controller, its service
    account and a cluster role — the chart renders the five custom-resource
    definitions the controller reads, the controller's full cluster role, the
    roles it binds the database servers' sidecars and switchover jobs to, the
    peering object its replicas coordinate through and the controller's
    Service. The controller image is pinned from infra.image and nothing is
    generated when the build runs.

    Reach for this realization; its chart repository must be reachable from
    the build. The alternative, `mysql-operator`, installs no definitions and
    at the image the Component pins grants less than the controller needs. The
    chart places every namespaced object in the
    namespace the Release, or else the Aggregate, declares for the component, so the build halts unless
    that namespace is infra.namespace.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/mysql-operator:1.0.0

  # The project's own chart, from its own chart repository. Its default
  # version, 2.3.0, is the release whose application version, 26.7.0-2.3.0, is
  # the tag of the image the Component pins, so the chart's templates and the
  # controller move together; infra.source_version picks another chart
  # release, and the image follows it only where the Release sets infra.image
  # too. The repository publishes the newest chart and removes the one before,
  # so a version it no longer lists is fetched by nobody: a build reads it from
  # a cache that already holds it, pinned in the Release's lockfile.
  source:
    kind: helm-https-chart
    url: https://mysql.github.io/mysql-operator/
    chart: mysql-operator
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"2.3.0\" }}"

  # Nothing reaches the control plane at an address — it reconciles the
  # InnoDBCluster custom resources a controller-driven MySQL emits — so this
  # realization publishes nothing, as the bootstrap does.
  provides: {}

  # This Recipe reads no infra.overrides keys.
  #
  # The chart is read for the values below; everything else stays the chart's
  # own default at its release.
  #
  # Names. The chart derives every name it renders from deployment.name: the
  # controller's Deployment and Service carry it, and its service account, its
  # three cluster roles, their binding and its peering object carry it after
  # the release namespace, "<namespace>-<name>-operator" and the like, and hand
  # those names to the controller in its environment. The mapping binds it to
  # the rendered name, the release
  # name the helm provider gives the chart. Established by rendering the chart
  # with and without it; left unset the chart writes the fixed names
  # mysql-operator, mysql-sidecar and mysql-switchover, which a second
  # installation in the cluster would collide with. The chart treats the name
  # as part of the controller's identity once installed, so changing the
  # component's name later is a reinstall.
  #
  # Image. The chart writes the controller image as
  # "<registry>/<repository>/<name>:<tag>", leaving out the registry and the
  # repository where they are empty, so both are set empty and the Component's
  # infra.image is cut at the last colon after its last slash: the two halves
  # join back into exactly the reference the Release names, a digest reference
  # included, and a reference with no tag leaves the chart's own tag, its
  # application version, in place. The database server and router images the
  # controller runs are chosen by the controller from the version an
  # InnoDBCluster names; the chart names none of them.
  #
  # Custom-resource definitions. The chart carries them in its crds directory,
  # which the helm provider renders with the chart, so they are installed
  # beside the controller at the chart's release; the chart has no webhook.
  #
  # Lookups. The chart reads the cluster while it renders, to keep a name it
  # installed before and to refuse a second operator watching the same
  # namespaces. A build reads no cluster, so those reads find nothing and the
  # chart renders as for a first install; the chart's own disableLookups switch
  # stays off, because all it changes in a render is a warning comment.
  #
  # Namespace. The chart writes the release namespace on every namespaced
  # object it renders, which is the namespace the Release, or else the Aggregate, declares for the
  # component through the aggrega.ai/namespace annotation, and it offers no
  # value placing them anywhere else; it refuses the `default` namespace
  # itself. So infra.namespace is honoured by requiring the two to agree: a
  # build declaring no namespace, or one other than infra.namespace, halts at
  # the top of the mapping, naming both.
  valuesMapping: |
    {{- $declared := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
    {{- if not $declared }}
    {{- fail (printf "%q is installed through the MySQL Operator project's chart, which places the control plane in the namespace the Release, or else the Aggregate, declares for the component, and neither declares one; declare the annotation aggrega.ai/namespace: %q on %q or on its boundary in the Release, the namespace infra.namespace names" .context.instance_id .infra.namespace .context.instance_id) }}
    {{- else if ne $declared .infra.namespace }}
    {{- fail (printf "%q is installed through the MySQL Operator project's chart, which places the control plane in the namespace the Release, or else the Aggregate, declares for the component, %q, but infra.namespace names %q; set the two to the same namespace in the Release" .context.instance_id $declared .infra.namespace) }}
    {{- end }}
    {{- $name := .infra.image }}
    {{- $tag := "" }}
    {{- if contains ":" (last (splitList "/" .infra.image)) }}
      {{- $tag = last (splitList ":" (last (splitList "/" .infra.image))) }}
      {{- $name = trimSuffix (printf ":%s" $tag) .infra.image }}
    {{- end }}
    deployment:
      name: "{{ .context.rendered_name }}"
    image:
      registry: ""
      repository: ""
      name: "{{ $name }}"
      tag: "{{ $tag }}"
