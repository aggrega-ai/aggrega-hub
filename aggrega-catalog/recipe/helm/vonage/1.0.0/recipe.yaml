apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vonage
  version: 1.0.0
  description: >
    The Vonage voice carrier as a reference realization on Kubernetes: no compute
    runs in-cluster and nothing is provisioned. The helm provider emits an
    ExternalName Service mapping an in-cluster name onto the carrier's API base
    address, so a consumer may reach it under a stable in-cluster name whichever
    address the operator pointed it at.

    The two webhook addresses are published to consumers exactly as the operator
    supplied them. They are opaque pointer strings: this recipe pipes each
    through unchanged, and nothing here resolves an address, contacts one, or
    derives one from the state of a cluster.

    This recipe pins no artifact. It names no image, no chart and no module — the
    Release calls a service its own operator contracts for directly, and the
    wiring is the whole of what is emitted.

    No credential is delivered here. A credential attached to one of the
    component's slots is materialized by that credential's own realization, and
    the consuming application references the material under the name it was
    given, because the environment-variable name a credential arrives under
    belongs to the consumer rather than to the carrier.

    All three credential slots are required here: a build leaving any of them
    empty halts naming it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/messaging/vonage:1.0.0
  # The Component declares its credential slots optional, because its compose
  # realization defines no service to carry one. Here each credential is
  # materialized by its own realization for the consumer to reference, and the
  # carrier authenticates every request with the key pair and signs every
  # webhook with the signature secret, so an empty slot halts the build, naming
  # the first empty one in the order the Component declares them.
  #
  # DELIBERATE NEAR-DUPLICATE: each helm reference realization whose Component
  # leaves a carrier-issued credential slot optional for compose carries this
  # assertion, naming its own slots, because an assertion sits inside the Recipe
  # that evaluates it and no catalog kind holds one for several Recipes to share.
  assertions:
    credential_slots_filled: >-
      {{- range $slot := list "api_key" "api_secret" "signature_secret" -}}
      {{- if not (hasKey (default dict $.features) $slot) -}}
      {{- fail (printf "the %s slot of %q is empty, and the helm realization of core/messaging/vonage requires it: the carrier issues this credential and no default stands in for it, so attach a credential to the %s slot" $slot $.metadata.instance_id $slot) -}}
      {{- end -}}
      {{- end -}}
  # The base address has one authored home in .infra.endpoint, dereferenced by
  # both the published contract and the reference workload below, so repointing
  # it moves the Service and the published address together. The two webhook
  # addresses likewise have one authored home each, in infra.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    answer_url: "{{ .infra.answer_url }}"
    event_url: "{{ .infra.event_url }}"
    modality: "{{ .values.modality }}"
    direction: "{{ .values.direction }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
