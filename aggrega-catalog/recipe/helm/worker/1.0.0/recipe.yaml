apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: worker
  version: 1.0.0
  description: >
    The generic background-worker primitive on Kubernetes via the helm
    provider's Workload synthesis: a Deployment and nothing else. No Service and
    no container port are emitted, and that absence carries the operational
    type's meaning rather than merely accompanying it — the type describes
    compute with zero inbound application ports, and the emitted file list is
    where a reader confirms that. It is what separates this realization from the
    generic server primitive's, which fronts its workload with a ClusterIP
    Service.

    Each replica pulls its own work, so the replica count widens throughput
    rather than sharing one queue position. The developer's `concurrency` and
    `queue_depth_hint` values are delivered to the container under stable names
    for the application's own loop to read, because how many items a worker
    takes at once and how deep a backlog it expects belong to that loop rather
    than to any field the workload contract expresses. It needs no cluster
    control plane, so it carries no prerequisite affirmation and emits no custom
    resource.

    No provides contract is emitted, because the component declares none: this
    primitive publishes nothing across an edge.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/worker:1.0.0
  # The component declares no infra.overrides block, because a synthesized
  # workload has no provider-specific knob to override: this Recipe therefore
  # reads no override keys, and none is declared for it to read.
  #
  # infra keys read here: image, replicas, compute.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the two developer values. The recipe
  # delivers each under a stable name for the application's own code to read,
  # and only when the developer set it, so an unset value renders no variable
  # rather than an empty one.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image running the worker loop in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, and a Release that
    # authors the block while setting only one of them takes neither default:
    # the emitted container then carries one quantity and silently loses the
    # other. Both are required together for that reason, and each is named
    # separately so the reader is told which one is missing.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # Interchangeable long-running replicas. No services key and no ports:
    # nothing connects to a worker.
    form: stateless
    replicas: {{ .infra.replicas }}
    containers:
      main:
        image: "{{ .infra.image }}"
        {{- $concurrency := optional .values "concurrency" "" }}
        {{- $queue_depth_hint := optional .values "queue_depth_hint" "" }}
        {{- if or $concurrency $queue_depth_hint }}
        variables:
          {{- with $concurrency }}
          WORKER_CONCURRENCY: "{{ . }}"
          {{- end }}
          {{- with $queue_depth_hint }}
          WORKER_QUEUE_DEPTH_HINT: "{{ . }}"
          {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
