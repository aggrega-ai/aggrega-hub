apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker
  version: 1.0.0
  description: >
    The generic background-worker primitive on Kubernetes via the helm
    provider's Workload synthesis: a Deployment and nothing else. No Service and
    no container port are emitted, and that absence carries the operational
    type's meaning rather than merely accompanying it — the type describes
    compute with zero inbound application ports, and the emitted file list is
    where a reader confirms that. It is what separates this realization from the
    generic server primitive's, which fronts its workload with a ClusterIP
    Service.

    The developer's `concurrency` and `queue_depth_hint` values are delivered
    to the container under stable names by default for the application's own
    loop to read, because how many items a worker takes at once and how deep a
    backlog it expects belong to that loop rather than to any field the
    workload contract expresses. The component's own inject block delivers env
    entries too, and one reading either value alone replaces its name.

    No provides contract is emitted, because the component declares none: this
    primitive publishes nothing across an edge.

    What reaches the container from the component's edges is what each edge's
    inject block dictates, since the image is the Release's own code: each env
    entry a variable under that name, beside the two developer values, whose
    names no edge may dictate while they are the defaults, and each file entry
    a read-only file at the path
    named, from a ConfigMap. An arg entry is refused by name, as the recipe
    renders no command line, and so is any other mechanism. A credential
    published for the pod to reference, such as core/referenced-secret, halts
    the build by name.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/compute/worker:1.0.0
  # The component declares an infra.overrides block for the realizations that
  # run on a cloud provider's container service, and the synthesized workload
  # here reads none of its keys: it has no provider-specific knob to override.
  #
  # infra keys read here: image, replicas, compute.
  #
  # It needs no cluster control plane, so it carries no prerequisite
  # affirmation and emits no custom resource.
  #
  # Each replica pulls its own work, so the replica count widens throughput
  # rather than sharing one queue position.
  #
  # Target-expected names: the image is the Release's, so no upstream
  # documentation names a spelling for the two developer values. The recipe
  # delivers each under a stable default name for the application's own code to
  # read, and only when the developer set it, so an unset value renders no
  # variable rather than an empty one; the component's own inject block may
  # replace either name, as described above the workload.
  provides: {}
  assertions:
    # This component packages no upstream product, so it holds no default image
    # to fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the generic compute primitive packages no software and therefore holds no default: set infra.image to the container image running the worker loop in the Release" -}}
      {{- end -}}
    # The compute block's two sub-keys carry defaults, which fill either one a
    # Release leaves out; a sub-key the Release sets empty would leave the
    # emitted container without that quantity, so this halts on it, naming
    # each separately so the reader is told which one is empty.
    compute_group_complete: >-
      {{- $compute := optional .infra "compute" dict -}}
      {{- if not (optional $compute "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.cpu empty, so the rendered container would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional $compute "memory" "") -}}
      {{- fail "this Release sets part of infra.compute and leaves compute.memory empty, so the rendered container would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # A credential attached to the component reaches the container only through
  # the delivery pipe the workload below renders: a core/secret-value attachment
  # writes its value there as a variable under the key it names, so the value is
  # written into the rendered Deployment, and a core/secret-provided attachment
  # under the names its own inject block dictates. Every other credential
  # Feature publishes a secret for the pod to reference, or leaves it to a
  # controller, and this realization renders no reference: a Workload reference
  # names a credential slot, and the component declares none. Such an attachment
  # would build and reach no container, so the workload halts on it first,
  # naming it. A credential is recognised by the label its Feature declares,
  # feature.aggrega.ai/kind: secret, and its Feature by its type with any
  # version set aside. The check sits in the workload rather than among the
  # assertions above because the attachment's labels are read here.
  #
  # DELIBERATE NEAR-DUPLICATE of the credential check helm/server, helm/task,
  # helm/function-keda and helm/function-knative carry: the same template, save
  # the component type and the rendered resource its refusal names. It is a part
  # of a workload template, and a WorkloadLibrary entry replaces a whole
  # workload, never a part of one, so no catalog kind holds it for five Recipes
  # to share; a change to it is made to all five.
  #
  # Delivery from an edge. The image is the Release's own code, so no name this
  # Recipe could choose is one that code reads: each of the component's
  # connections dictates its own delivery in its inject block, and an edge that
  # dictates nothing delivers nothing. The pipe is read as a map. Every env
  # entry becomes a container variable under the name the edge gave it, its
  # value written whole, after the two developer values; an entry under either
  # of their names halts, naming the connection, while that value is set.
  # Every file entry becomes a read-only file at the path the edge names: one
  # ConfigMap holds the entries, emitted only while there is one, and each is
  # mounted by subPath, so a path that is not absolute, or one lying beneath
  # another entry's path, is refused. An arg entry is refused, because this
  # Recipe renders no command line: Kubernetes takes a container's arguments in
  # place of the image's default command, which is the Release's. Any other
  # mechanism is refused too. A refusal names the entry, its mechanism and the
  # connection that dictated it.
  #
  # The block reading the pipe is the one helm/server, helm/task and
  # helm/function-keda declare, word for word, and helm/function-knative adapts
  # to the Knative Service it renders; a change to it is made to all five.
  #
  # The component's own values. The developer may also write an inject block on
  # the component itself, whose env entries reach the pipe under the names the
  # developer chose and so reach the container with every other env entry. The
  # names this Recipe gives the two developer values are defaults: each is
  # rendered only while no entry of that block, in any mechanism, delivers its
  # value. The template reads that at .context.self_inject, which maps each name
  # the developer wrote to values.<key> for an entry whose template reads that
  # one own value. A refusal naming a variable that block delivers names the
  # block, rather than an attachment.
  #
  # DELIBERATE NEAR-DUPLICATE of the reading of .context.self_inject every
  # Recipe in this catalog that reads .context.self_inject declares: the same
  # lines, save the own values each looks up and the mechanisms it reads. A
  # Recipe of a tool or of an agent reads env and file entries, and reads the
  # file entries a second time for the files it emits; a Recipe of
  # core/compute/function, task or worker reads env entries alone; a Recipe of
  # core/compute/server that refuses a variable by name reads the names of the
  # env entries alone; and a realization of core/ai-tool/mcp that delivers none
  # of the block reads it only to refuse each of its entries. It is part of a
  # workload or a values mapping, and no catalog kind holds part of one for
  # several Recipes to share; a change to it is made to all of them.
  workload: |
    {{- range $name, $attachment := (default dict .features) }}
    {{- $type := first (splitList ":" (toString (optional $attachment "type" ""))) }}
    {{- $kind := optional (default dict (optional $attachment "labels" dict)) "feature.aggrega.ai/kind" "" }}
    {{- if and (eq $kind "secret") (not (has $type (list "core/secret-value" "core/secret-provided"))) }}
    {{- fail (printf "the %s attachment %q on %q would reach no container: this realization delivers a credential only through the component's delivery pipe, which core/secret-value fills with its value under the key it names and core/secret-provided through the attachment's own inject block, and it renders no reference to a secret, since core/compute/worker declares no credential slot a reference could name. Attach the credential as core/secret-value, whose value is then written into the rendered Deployment's environment, or realize the component with a Recipe that reads the secret by reference" $type $name $.context.instance_id) }}
    {{- end }}
    {{- end }}
    {{- $inject := default dict .context.inject }}
    {{- $env := optional $inject "env" dict }}
    {{- $files := optional $inject "file" dict }}
    {{- range $mechanism, $entries := $inject }}
    {{- if not (has $mechanism (list "all" "env" "file")) }}
    {{- range $name, $_ := $entries }}
    {{- $by := "an attachment on the component" }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) $mechanism dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- if eq $mechanism "arg" }}
    {{- fail (printf "the component %q is handed the command-line argument %q by %s, and this realization renders no command line: Kubernetes takes a container's arguments in place of the image's default command, and that command is the Release's. Dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $by) }}
    {{- end }}
    {{- fail (printf "the component %q is handed %q under the delivery mechanism %q by %s, and this realization delivers env and file entries only: dictate the value as an env or a file entry in that inject block instead" $.context.instance_id $name $mechanism $by) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $path, $_ := $files }}
    {{- if not (hasPrefix "/" $path) }}
    {{- fail (printf "the component %q is handed a file at %q, and a file is written at an absolute path inside the container: write that path in the connection's inject block starting with /" $.context.instance_id $path) }}
    {{- end }}
    {{- range $other, $_ := $files }}
    {{- if hasPrefix (printf "%s/" $path) $other }}
    {{- fail (printf "the component %q is handed a file at %q and another at %q beneath it, and one path cannot be both a file and a directory: dictate the two files at paths neither of which lies beneath the other" $.context.instance_id $path $other) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $named := dict }}
    {{- $ownEnv := dict }}
    {{- range $mechanism, $names := default dict .context.self_inject }}
    {{- range $name, $key := $names }}
    {{- if $key }}{{ $_ := set $named (toString $key) true }}{{ end }}
    {{- if eq $mechanism "env" }}{{ $_ := set $ownEnv $name true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- $concurrency := "" }}
    {{- if not (hasKey $named "values.concurrency") }}{{ $concurrency = optional .values "concurrency" "" }}{{ end }}
    {{- $queue_depth_hint_set := and (hasKey .values "queue_depth_hint") (not (hasKey $named "values.queue_depth_hint")) }}
    {{- $queue_depth_hint := optional .values "queue_depth_hint" "" }}
    {{- range $value, $name := dict "concurrency" (ternary "WORKER_CONCURRENCY" "" (not (empty $concurrency))) "queue_depth_hint" (ternary "WORKER_QUEUE_DEPTH_HINT" "" $queue_depth_hint_set) }}
    {{- if and $name (hasKey $env $name) }}
    {{- $by := "an attachment on the component" }}
    {{- if hasKey $ownEnv $name }}{{ $by = "the component's own inject block" }}{{ end }}
    {{- range $alias, $edge := $.context.uses }}
    {{- if hasKey (optional (default dict $edge.inject) "env" dict) $name }}{{ $by = printf "its connection %q" $alias }}{{ end }}
    {{- end }}
    {{- fail (printf "the component %q delivers its developer value %s to the container as %s, and %s dictates a variable under that name as well, so one would silently replace the other: rename the variable in that inject block" $.context.instance_id $value $name $by) }}
    {{- end }}
    {{- end }}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # Interchangeable long-running replicas. No services key and no ports:
    # nothing connects to a worker.
    form: stateless
    replicas: {{ .infra.replicas }}
    containers:
      main:
        image: "{{ .infra.image }}"
        {{- if or $concurrency $queue_depth_hint_set $env }}
        variables:
          {{- with $concurrency }}
          WORKER_CONCURRENCY: "{{ . }}"
          {{- end }}
          {{- if $queue_depth_hint_set }}
          WORKER_QUEUE_DEPTH_HINT: "{{ $queue_depth_hint }}"
          {{- end }}
          {{- range $k, $v := $env }}
          {{ toJson $k }}: {{ toJson $v }}
          {{- end }}
        {{- end }}
        {{- if $files }}
        volumeMounts:
          {{- $i := 0 }}
          {{- range $path, $_ := $files }}
          - name: inject-files
            path: {{ toJson $path }}
            subPath: "file-{{ $i }}"
            readonly: true
          {{- $i = add $i 1 }}
          {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    {{- if $files }}
    volumes:
      inject-files:
        configmap:
          source: "{{ .context.rendered_name }}-files"
    {{- end }}
  # The ConfigMap holding the file entries an edge dictates, keyed file-0,
  # file-1 and so on in path order, the keys the workload's mounts read. It is
  # emitted only while an edge dictates a file, so a build with none renders
  # nothing here. The pod mounts it by name, which resolves only in the pod's own
  # namespace, so it carries the namespace the Release, or else the Aggregate, declares for the
  # component through the aggrega.ai/namespace annotation, as the workload's own
  # resources do, and none where it declares none. The output filename carries
  # the realization's own name, because an artifact key is the output path used
  # as written.
  artifacts:
    worker-files.configmap.yaml: |
      {{- $files := optional (default dict .context.inject) "file" dict }}
      {{- if $files -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-files
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
        namespace: "{{ . }}"
        {{- end }}
      data:
        {{- $i := 0 }}
        {{- range $path, $v := $files }}
        file-{{ $i }}: {{ toJson $v }}
        {{- $i = add $i 1 }}
        {{- end }}
      {{- end }}
