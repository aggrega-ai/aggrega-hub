apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: open-webui-chart
  version: 1.0.0
  # metadata.license is deliberately absent. The Open WebUI platform this Recipe
  # realizes is published under the three BSD-3-Clause conditions plus a fourth
  # forbidding alteration of the platform's branding, and no single SPDX
  # identifier names that combination; the licensing class sits on the
  # Component's upstream-licensing label. The SPDX header at the top of this file
  # states the terms of the file itself.
  description: >
    A self-hosted Open WebUI installation on Kubernetes via the platform's own
    Helm chart, served from its project's HTTPS chart repository. The chart is
    configured for the shape this Component describes: one platform process
    against one durable volume, reaching its model over the `model` uses-edge.
    Under this configuration it renders a StatefulSet with an init container that
    seeds the data directory from the image, a ClusterIP Service on the listen
    port, a PersistentVolumeClaim carrying the accounts, conversations, prompt
    library and document index, and the ServiceAccount the pod runs under. The
    chart's Ingress, gateway route and managed-certificate resources are left
    switched off, because the Component describes none of them.

    What it carries that a hand-assembled workload does not is the platform's own
    integration surface, kept by its maintainers in step with the platform:
    single sign-on against several identity providers, external object storage
    for uploaded documents, an external relational store in place of the embedded
    one, per-component log levels, and a seeding step that copies the packaged
    starter data onto the volume before the platform first starts — none of which
    a synthesized workload has anywhere to declare. Reach for this realization
    where a chart repository is reachable at build time; reach for `open-webui`,
    the workload-synthesis realization, where the build must complete with
    nothing fetched. The platform image is pinned to a resolvable release tag for
    reproducible renders. Default chart version in source.version; override via
    infra.source_version.

    Four parts of the chart's own defaults are declined deliberately and each is
    named at its setting below: the bundled model runner, the bundled extension
    server, the bundled cache backing multi-replica session fan-out, and the
    chart's shipped literal API key.

    provides.host is the bare, self-contained in-cluster Service name — it
    carries no namespace, so the recipe is independent of where it is deployed; a
    consumer in another namespace qualifies the host with the target namespace on
    its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/open-webui:1.0.0

  source:
    kind: helm-https-chart
    url: https://helm.openwebui.com
    chart: open-webui
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"16.6.0\" }}"

  # provides.host is the interface and API Service name, which is what the
  # Component's provides contract promises. The valuesMapping below pins the
  # chart's fullnameOverride to the instance id, and this chart names that
  # Service by the pinned name with no suffix — read from a render of the chart,
  # not assumed, because several charts in this catalog suffix it instead. The
  # ServiceAccount is the one object the chart does suffix, and it is not the
  # address published here.
  #
  # port follows the Service port the operator set. The listen port is also
  # written into the platform's own bind variable and onto the container port
  # below, so the published address, the Service and the process move together.
  #
  # A same-namespace consumer reaches the interface under this name directly; a
  # cross-namespace consumer qualifies it caller-side.
  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   image          - map[string]string (image.* fields; overrides the tag pin)
  #   service_type   - string (service.type; how the endpoint is exposed, default ClusterIP)
  #   storage_class  - string (persistence.storageClass for the data volume)
  #   requests       - { cpu: string, memory: string } (platform resource requests)
  #   sso            - object (the chart's own single-sign-on block, in its own shape)
  #   logging        - object (the chart's own logging block, in its own shape)
  #   nodeSelector   - map[string]string (pod scheduling)
  #   tolerations    - []object (pod scheduling)
  valuesMapping: |
    ## ── Pin the chart's resource names to the instance id ──────
    ## Names the interface and API Service exactly "<instance_id>", matching
    ## provides.host. Every object this chart emits derives its name from this
    ## key, read from a render rather than assumed.
    fullnameOverride: "{{ .context.instance_id }}"

    ## ── Platform image pin ─────────────────────────────────────
    ## The chart's own default tag is its application version, so leaving it
    ## unset makes the render move whenever the chart moves. Pin it explicitly.
    ## The repository is the chart's own default, so the image this realization
    ## runs is the one its chart is tested against, and it is why the Component's
    ## engine_version says the chart-backed realization pins its own tag. The
    ## chart's seeding init container runs this same image, so one pin covers
    ## both and this realization renders exactly one image. Override the whole
    ## block via infra.overrides.image.
    image:
      {{- if and .infra.overrides .infra.overrides.image }}
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      repository: ghcr.io/open-webui/open-webui
      tag: "0.11.4"
      {{- end }}

    ## ── The chart's bundled companions, all declined ───────────
    ## The chart can install a model runner, an extension server, a document
    ## text-extraction service and a terminal service alongside the platform.
    ## The first is declined because the model arrives on the `model` uses-edge,
    ## which is what makes changing the answering model a change of edge target
    ## rather than a change of this component; the rest are declined because the
    ## Component describes one platform process and none of them. Two of the four
    ## are ON in the chart's own defaults, so declining them is a deliberate
    ## setting rather than an omission.
    ##
    ## 🔴 The terminal service is also the one part of this chart that GENERATES
    ## a credential at render time — it mints a random access key whenever none
    ## is supplied, which would make two renders of identical input differ.
    ## Declining it takes that branch out of play; it is the only such site in
    ## the chart, established by reading every template it carries.
    ollama:
      enabled: false
    pipelines:
      enabled: false
    tika:
      enabled: false
    terminals:
      enabled: false

    ## ── Session fan-out ────────────────────────────────────────
    ## The chart deploys a bundled cache to carry live session events between
    ## replicas. The Component describes one platform process against one volume,
    ## so the cache is declined and the platform's own in-process manager carries
    ## the same events — which is what the chart's own note says to do for a
    ## single replica. The platform's live-event support itself is left at the
    ## chart's own default rather than switched off, because the Component
    ## describes an interface a person holds a conversation in.
    websocket:
      manager: ""
      redis:
        enabled: false

    ## ── The model the platform calls ───────────────────────────
    ## The endpoint arrives on the `model` uses-edge and is written into the
    ## chart's own single-endpoint setting, which the chart renders into the
    ## variable the platform reads for the base URL of an OpenAI-compatible API.
    ## It is passed through as the wired component published it, so moving the
    ## model's listen port moves this with it and nothing here is re-authored.
    ## The edges are ranged and matched on the SOCKET name rather than on the
    ## alias the topology chose, so this does not depend on that alias.
    enableOpenaiApi: true
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
    openaiBaseApiUrl: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}

    ## ── The model API key ──────────────────────────────────────
    ## 🔴 THE CHART SHIPS A LITERAL KEY AS ITS OWN DEFAULT, AND IT IS EMPTIED ON
    ## BOTH BRANCHES. Left alone, the platform would present a publicly known
    ## value to whatever endpoint is wired on the model socket. The Component
    ## says an unattached slot delivers no key at all, which suits an in-cluster
    ## endpoint that authenticates callers by network position, and that is what
    ## emptying the key produces: the chart emits no key variable at all.
    ##
    ## Attached, the chart is pointed at the credential's secret BY NAME with the
    ## credential's own key, so the material never appears in the rendered
    ## artifact. The literal stays empty on that branch too, because the chart
    ## reads the literal first where both are set.
    openaiApiKey: ""
    {{- if hasKey (default dict .features) "model_api_key" }}
    openaiApiKeyExistingSecret: "{{ .features.model_api_key.provides.name }}"
    openaiApiKeyExistingSecretKey: "{{ .features.model_api_key.provides.key }}"
    {{- end }}

    ## ── Interface and API Service ──────────────────────────────
    ## infra.port sets the Service port, the container port and the platform's
    ## own bind variable below, all three from one value. The chart's own
    ## defaults put the Service on a different port from the container, which
    ## would publish an address on one port while the process answered on
    ## another.
    service:
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      port: {{ .infra.port }}
      containerPort: {{ .infra.port }}

    ## ── The platform's own state volume ────────────────────────
    ## The accounts, the conversations, the prompt library and the document index
    ## all live here; the platform keeps them together in one data directory, so
    ## this single size covers every kind of state it accumulates. Left unset,
    ## the claim takes the cluster's default storage class.
    persistence:
      enabled: true
      size: "{{ .infra.storage.size }}"
      {{- if and .infra.overrides .infra.overrides.storage_class }}
      storageClass: "{{ .infra.overrides.storage_class }}"
      {{- end }}

    ## ── Platform resources ─────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Everything the chart has no setting of its own for ─────
    ## The chart carries settings for the model endpoint, the storage backend and
    ## single sign-on, and nothing for the platform's own interface behaviour, so
    ## the rest is delivered through the additional-environment map the chart
    ## does declare. Authoring these here rather than half here and half through
    ## a chart setting is deliberate: a variable written twice reaches the
    ## container twice and the platform reads whichever came last.
    extraEnvVars:
      ## The data directory. The chart mounts the volume at the platform's own
      ## data path and sets no variable for it; this states the path explicitly
      ## so the mount and the platform agree even if either default moves.
      DATA_DIR: "/app/backend/data"
      ## The bind port. The platform reads its listen port from here, so without
      ## this variable moving infra.port would move the Service and the container
      ## port while the process kept binding its own default.
      PORT: "{{ .infra.port }}"
      ## Quoted because a title is free text. Unquoted, a title spelled like a
      ## number or a boolean is read as one.
      WEBUI_NAME: "{{ .values.instance_title }}"
      ENABLE_SIGNUP: "{{ .values.enable_signup }}"
      DEFAULT_USER_ROLE: "{{ .values.default_user_role }}"
      ENABLE_WEB_SEARCH: "{{ .values.enable_web_search }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
      ## The model a new conversation opens on, taken from the `model` uses-edge
      ## so it is the name the wired component actually serves under rather than
      ## one re-typed here.
      DEFAULT_MODELS: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- with .infra.external_base_url }}
      ## The externally reachable base URL, when the operator supplied one. The
      ## platform composes the links it emits from it, which is what makes a
      ## shared conversation link resolve from outside the cluster. Left empty,
      ## this is not emitted and the platform derives each address from the
      ## incoming request.
      WEBUI_URL: "{{ . }}"
    {{- end }}
    {{- if hasKey (default dict .features) "session_secret" }}
      ## The session-signing secret, bound BY NAME from the attached credential,
      ## so the material never appears in the rendered artifact.
      WEBUI_SECRET_KEY:
        valueFrom:
          secretKeyRef:
            name: "{{ .features.session_secret.provides.name }}"
            key: "{{ .features.session_secret.provides.key }}"
    {{- else }}
      ## 🔴 SUPPLIED RATHER THAN LEFT UNSET, AND THAT IS A CORRECTNESS
      ## REQUIREMENT. The platform mints a signing key of its own when none is
      ## given, so every restart would invalidate every sign-in. It is the same
      ## development literal the workload-synthesis realization emits: every
      ## Release rendered from this default signs its tokens with the same
      ## publicly known value, so attach a credential to the session_secret slot
      ## for anything beyond evaluation.
      WEBUI_SECRET_KEY: "open-webui-development-secret-evaluation-only"
    {{- end }}

    ## ── The chart's own integration blocks, passed through ─────
    ## Single sign-on and per-component log levels are authored in the chart's
    ## own shape, because translating them would mean this Recipe carrying a
    ## second copy of a schema the chart already defines. Both are off unless an
    ## operator sets them.
    {{- if .infra.overrides }}
    {{- if .infra.overrides.sso }}
    sso: {{ toJson .infra.overrides.sso }}
    {{- end }}
    {{- if .infra.overrides.logging }}
    logging: {{ toJson .infra.overrides.logging }}
    {{- end }}
    {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-https-chart
      url: https://helm.openwebui.com
      chart: open-webui
      version: 16.6.0
      digest: sha256:ca96e875d059a115c55620a75013e72690dc0e703a023ee8c8c7dae6b903d637
