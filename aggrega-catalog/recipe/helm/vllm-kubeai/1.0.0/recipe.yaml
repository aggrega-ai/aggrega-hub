apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vllm-kubeai
  version: 1.0.0
  license: Apache-2.0
  description: >
    vLLM realized as a KubeAI Model the KubeAI operator reconciles, rather than a
    directly synthesized StatefulSet — a second controller-driven realization of the
    same model component, selectable in the Manifest alongside the synthesis recipe
    and the KServe realization. The recipe emits a Model custom resource whose url is
    the model pointer; the operator serves it behind its OpenAI-compatible proxy and
    autoscales it. The model value is a deterministic pointer the operator resolves
    at reconcile time; the compiler never fetches weights. GPU and CPU sizing carry
    through resourceProfile. provides is filled from the operator's proxy, which
    addresses a model by its resource name, so a consumer wires to it exactly as it
    would to the synthesized realization. An attached api_key reaches the server
    through the Model's envFrom, which imports the credential's secret by name
    and names each variable after one of its data keys, so the credential
    publishes its key as VLLM_API_KEY, and the build halts naming the key when it
    does not. The KubeAI control plane is a runtime prerequisite: the build halts
    unless the operator affirms it is installed (infra.control_plane_present), so
    no custom resource is emitted into a cluster that cannot reconcile it. The
    Model is written into the namespace the Release, or else the Aggregate, names for this component
    through the aggrega.ai/namespace annotation, where one is set, and the
    operator creates the model's pods there; the metrics keys publish the pod
    label, port name and path a scraper discovers those pods by.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/vllm:1.0.0
  # KubeAI serves every model through one OpenAI-compatible proxy Service and
  # addresses a model by its resource name, so provides.model is the resource name
  # (not the weights id), and endpoint is the operator's proxy under /openai/v1.
  # This fills the same contract key for key as the synthesis and KServe realizations,
  # so consumers are realization-agnostic; the value each realization supplies is the
  # one its runtime requires. The proxy Service address is install-namespace
  # dependent; a consumer in another namespace qualifies the host on its own side.
  #
  # The metrics keys say where a scraper finds the vLLM server's own metrics.
  # The published address is the operator's shared proxy rather than the
  # server, and the operator runs the model in pods no Service of this Recipe
  # carries, so metrics_endpoint and the service facts are empty and the pod
  # facts are published: the label the operator gives every pod of a Model,
  # kubeai.org/model, whose value is the Model's name; http, the name of the
  # server container's port; and /metrics, where vLLM serves them on it. The
  # label and the port name are the KubeAI operator's, read from its v0.24.0
  # release, and evolve with it like every other detail here. The operator
  # creates the pods in the Model's namespace, which the artifact below writes
  # from the Release, so a scraper reads that namespace from its connection.
  provides:
    host: "kubeai"
    port: "80"
    endpoint: "http://kubeai/openai/v1"
    model: "{{ .context.instance_id }}"
    protocol: "http"
    metrics_endpoint: ""
    metrics_service: ""
    metrics_service_port: ""
    metrics_pod_selector: "kubeai.org/model={{ .context.instance_id }}"
    metrics_pod_port: "http"
    metrics_path: "/metrics"
  # The KubeAI control plane must exist in the target cluster before a Model can
  # reconcile. The compiler cannot inspect cluster state, so the prerequisite is
  # declared: an operator affirms it in the Release, and an unaffirmed build halts
  # here rather than emitting an orphan custom resource.
  assertions:
    kubeai_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the KubeAI control plane must be installed in the target cluster before this realization emits its Model custom resource; once KubeAI is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
  # The KubeAI Model. url is the deterministic model pointer (an hf:// reference the
  # operator resolves at reconcile time). resourceProfile names a profile the operator
  # defined in the cluster; verify the profile names and the Model schema against the
  # KubeAI version installed, as custom-resource schemas evolve independently of the
  # catalog.
  #
  # This Recipe reads from infra.overrides:
  #   resource_profile - string (spec.resourceProfile, replacing the derived value)
  #
  # The key exists because the profile is a name defined in the cluster, not a
  # value this catalog can compute. The default composes one from the GPU count
  # or the CPU request, which matches the profiles a stock KubeAI install
  # defines; a cluster that named its profiles differently, or that offers a
  # profile with no counterpart in the sizing pillars, supplies the exact name
  # instead.
  #
  # When the optional api_key slot is attached, the Model imports the
  # credential's secret by name through envFrom, so the key's value never lands
  # in the custom resource; the slot therefore takes a credential that publishes
  # a secret's name and key. The operator adds the import to the vLLM server
  # container it creates, and names the variable after the secret's data key, so
  # that key must be VLLM_API_KEY, the variable vLLM reads its key from. Any
  # other key would start the server with no key at all, so the artifact halts
  # the build naming the key the credential publishes instead; it is checked
  # there because the credential's published locator is in scope where the
  # artifact renders. Every key the secret holds becomes a variable of that
  # container, so the secret holds this key alone. The operator's proxy
  # forwards a caller's Authorization header to the server, which requires the
  # key of every caller under /v1. Unattached, nothing is emitted.
  #
  # The Model is written into the namespace the Release, or else the Aggregate, names for this
  # component through the aggrega.ai/namespace annotation, on its boundary or
  # its own entry, so it and its pods land where a scraper reads that they run;
  # the provider does not place an artifact on its own. Where no namespace is
  # named the field is omitted, and the Model lands wherever the applying tool
  # puts it.
  artifacts:
    model.yaml: |
      apiVersion: kubeai.org/v1
      kind: Model
      metadata:
        name: {{ .context.instance_id }}
        {{- $ns := "" }}
        {{- if .context.annotations }}
          {{- $raw := optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") }}
          {{- if $raw }}{{- $ns = $raw }}{{- end }}
        {{- end }}
        {{- with $ns }}
        namespace: "{{ . }}"
        {{- end }}
      spec:
        features: ["TextGeneration"]
        url: "hf://{{ .values.model }}"
        engine: VLLM
        {{- if and .infra.overrides .infra.overrides.resource_profile }}
        resourceProfile: "{{ .infra.overrides.resource_profile }}"
        {{- else if (default dict .infra.gpu).count }}
        resourceProfile: "nvidia-gpu:{{ .infra.gpu.count }}"
        {{- else }}
        resourceProfile: "cpu:{{ .infra.compute.cpu }}"
        {{- end }}
        minReplicas: {{ default .infra.replicas .infra.min_replicas }}
        {{- with .infra.max_replicas }}
        maxReplicas: {{ . }}
        {{- end }}
        {{- if hasKey (default dict .features) "api_key" }}
        {{- if ne .features.api_key.provides.key "VLLM_API_KEY" }}
        {{- fail (printf "the KubeAI Model reads the api_key credential through envFrom, which names each variable after a data key of the credential's secret, so that key must be VLLM_API_KEY, the variable vLLM reads its key from; the credential attached to api_key publishes the key %q — set the attachment's key to VLLM_API_KEY" .features.api_key.provides.key) }}
        {{- end }}
        envFrom:
          - secretRef:
              name: "{{ .features.api_key.provides.name }}"
        {{- end }}
