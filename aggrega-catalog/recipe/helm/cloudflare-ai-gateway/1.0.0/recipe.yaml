apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: cloudflare-ai-gateway
  version: 1.0.0
  description: >
    References a Cloudflare AI Gateway that already exists, as a reference
    realization: nothing runs in the cluster and nothing in the account is
    created or changed. helm emits an ExternalName Service mapping an
    in-cluster name onto the gateway's host. Reach for it where the gateway is
    created and configured outside the Release; reach for the terraform Recipe
    where the Release is to create it.

    It carries no Feature, because every control the gateway keeps is a
    setting of the gateway itself, which this realization does not write, so
    the build halts on any attachment. No credential is delivered: a consumer
    that needs one declares it as `credential` on the socket that reaches the
    gateway and delivers it from its own container.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/cloudflare-ai-gateway:1.0.0
  # A FeatureRecipe bound for the terraform Recipe delivers its setting to this
  # node too, and nothing here would place it, so a budget or a retry count
  # would be accepted and then written nowhere. The build halts instead, on any
  # attachment, naming it.
  assertions:
    carries_no_feature: >-
      {{- range $name, $attachment := (default dict .features) -}}
      {{- fail (printf "attachment %q on %q is carried by the helm reference realization of core/gateway/cloudflare-ai-gateway, which writes no setting of the gateway and so would change nothing it does; bind the gateway in the Manifest to terraform/cloudflare-ai-gateway:1.0.0, which writes the gateway's settings, or leave the attachment out" $name $.metadata.instance_id) -}}
      {{- end -}}
  # The address is composed once, in locals, and both provides and the workload
  # below read it, so the two cannot disagree.
  locals:
    endpoint: "https://gateway.ai.cloudflare.com/v1/{{ .infra.account_id }}/{{ .infra.gateway_id }}/{{ .infra.provider_endpoint }}"
  provides:
    endpoint: "{{ .locals.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .locals.endpoint }}"
    port: 443
