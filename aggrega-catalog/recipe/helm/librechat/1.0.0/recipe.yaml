apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: librechat
  version: 1.0.0
  license: MIT
  description: >
    A self-hosted LibreChat installation on Kubernetes via the helm provider's
    Workload synthesis: a single-replica Deployment, a ClusterIP Service on the
    listen port, and one persistent volume for the files people upload; the
    accounts, conversations, agents and stored per-user credentials live in the
    document store wired on the `backend` edge. The model edge's endpoint becomes
    the platform's OpenAI-compatible base URL and its model name the one model
    offered; the backend edge's host and port compose the document-store
    connection string.

    The bind address is set to every interface, because the platform's default
    loopback bind would leave the Service in front of it reaching nothing, and
    the listen port is emitted because the process reads it from the
    environment. infra.external_base_url, when set, reaches the platform as
    DOMAIN_CLIENT and DOMAIN_SERVER; unset, both carry its in-cluster address.

    Five credential slots are wired: the model API key on the `model`
    connection, and four on the component. The credential-encryption key has
    no default: the Component requires its slot. With no model API key
    attached, each person enters their own key in the interface. Every other
    unattached slot — the two token secrets and the initialization vector —
    renders a pinned development literal published in this catalog, so a
    Release rendered from them offers no protection for its sign-ins; they suit
    evaluation and local development.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/librechat:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-default"
  # with no namespace segment, so the Recipe is independent of where it is
  # deployed. A same-namespace consumer reaches it under this name directly; a
  # cross-namespace consumer qualifies it caller-side.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "http"
  # The accounts, conversations, agents and stored per-user credentials live in
  # the document store wired on the `backend` edge rather than on the uploads
  # volume.
  #
  # Two edges are translated rather than passed through, because the variables
  # the platform reads are not the names the targets publish. The model edge
  # carries both a published endpoint and a published model name: the endpoint
  # becomes the platform's OpenAI-compatible base URL, and the model name
  # becomes the single-entry model list the platform offers, so the name a
  # person picks in the interface is the name the wired component actually
  # serves under. The backend edge carries a host and a port, which compose the
  # document-store connection string together with the logical database name
  # the developer declared. Both are read by socket name rather than by the
  # alias the topology chose, so neither depends on that alias.
  #
  # The bind address is set to accept traffic on every interface. The
  # platform's own default binds the loopback address only, which in a
  # container means the Service in front of it can reach nothing — so this is
  # load-bearing rather than decorative. The listen port is emitted for the
  # same reason as the Service and container port read it: the process reads
  # its port from the environment.
  #
  # Five credential slots are wired, and every credential value the rendered
  # Deployment carries has one, so attaching a slot leaves no partner of it
  # behind on a published literal. A model API key attached on the `model`
  # connection is delivered as the platform's provider key, through a
  # secretKeyRef naming that connection; with none attached the Recipe
  # leaves the platform in its per-user mode, where each person enters their
  # own key in the interface and no key is rendered at all. An attached session
  # secret signs the access tokens the platform issues and an attached refresh
  # secret signs the refresh tokens that mint them, while the
  # credential-encryption key and the initialization vector are the pair the
  # credentials held in the document store are encrypted under. The key is
  # always attached: the Component requires its slot, so no key every reader of
  # this catalog holds is ever rendered. Where any other slot is unattached the
  # Recipe emits a pinned development literal in its place, sized as the
  # platform requires. Those literals are published in this catalog, so the
  # token secrets of a Release rendered from them are guessable. They suit
  # evaluation and local development.
  workload: |
    {{- $uploadsPath := "/app/uploads" -}}
    {{- $selfUrl := printf "http://%s-default:%v" .context.rendered_name .infra.port -}}
    {{- /* The alias of the `model` connection carrying a credential, or empty. */ -}}
    {{- $modelCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "model") (hasKey (default dict $edge.features) "credential") -}}
    {{- $modelCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The platform runs as one replica against one volume. Its system of record
    # is the wired document store rather than local disk, and the volume carries
    # uploads only, so the stateless form with a persistent volume is the shape
    # here: a Deployment plus a PersistentVolumeClaim, and no headless Service to
    # govern ordinals.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/danny-avila/librechat:{{ .infra.engine_version }}"
        # $uploadsPath is the single authored home for the upload directory: the
        # volume mount reads the binding rather than repeating the literal.
        # $selfUrl is the single authored home for the installation's own
        # in-cluster address, used as the browser-facing base when the operator
        # supplied no external URL; the address is composed once here so the two
        # variables that carry it cannot disagree.
        # The bind address and the listen port are both load-bearing; see the
        # notes in the description.
        variables:
          HOST: 0.0.0.0
          PORT: "{{ .infra.port }}"
          # Quoted because a title is free text. Unquoted, a title spelled like a
          # number or a boolean is read as one, and the variables map, which
          # takes strings, then refuses the build over a title that was perfectly
          # legal to choose.
          APP_TITLE: "{{ .values.app_title }}"
          ALLOW_REGISTRATION: "{{ .values.allow_registration }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          # The model endpoint and the model name both arrive on the `model`
          # uses-edge. The platform reads its OpenAI-compatible base URL from
          # OPENAI_REVERSE_PROXY, and offers the models named in OPENAI_MODELS —
          # one entry here, the name the wired component serves under.
          OPENAI_REVERSE_PROXY: "{{ $edge.provides.endpoint }}"
          OPENAI_MODELS: "{{ $edge.provides.model }}"
    {{- end }}
    {{- if eq $edge.socket "backend" }}
          # The document-store connection, composed from the host and port the
          # wired store published and the logical database name the developer
          # declared.
          MONGO_URI: "mongodb://{{ $edge.provides.host }}:{{ $edge.provides.port }}/{{ $.values.database_name }}"
    {{- end }}
    {{- end }}
          # The browser-facing base URL. The operator's external URL when one was
          # supplied, and the installation's own in-cluster address otherwise.
    {{- with .infra.external_base_url }}
          DOMAIN_CLIENT: "{{ . }}"
          DOMAIN_SERVER: "{{ . }}"
    {{- else }}
          DOMAIN_CLIENT: "{{ $selfUrl }}"
          DOMAIN_SERVER: "{{ $selfUrl }}"
    {{- end }}
    {{- if not $modelCredential }}
          # The platform's per-user mode: each person enters their own provider
          # key in the interface, and none is rendered at all.
          OPENAI_API_KEY: user_provided
    {{- end }}
    {{- if not (hasKey (default dict .features) "session_secret") }}
          # Development literal. Every Release rendered from this default
          # signs its access tokens with the same publicly known value; attach a
          # secret credential to the session_secret slot for anything else.
          JWT_SECRET: librechat-development-token-secret-evaluation-only
    {{- end }}
    {{- if not (hasKey (default dict .features) "session_refresh_secret") }}
          # Development literal. The refresh tokens signed with it are what mint
          # new access tokens, so every Release rendered from this default
          # can have new access tokens minted for it by anyone reading this
          # catalog; attach a secret credential to the session_refresh_secret
          # slot for anything else.
          JWT_REFRESH_SECRET: librechat-development-refresh-secret-evaluation-only
    {{- end }}
    {{- if not (hasKey (default dict .features) "credential_encryption_iv") }}
          # Development literal for the initialization vector the platform pairs
          # with the credential-encryption key, sized as the platform requires (a
          # 16-byte value as 32 hexadecimal characters). A vector is not secret,
          # but this one is published in this catalog and is the same in every
          # Release rendered from the default; attach a secret credential to the
          # credential_encryption_iv slot for one of the Release's own.
          CREDS_IV: 8881b05adef1cab28b10901e03dff8ba
    {{- end }}
    {{- if or $modelCredential (hasKey (default dict .features) "session_secret") (hasKey (default dict .features) "session_refresh_secret") (hasKey (default dict .features) "credential_encryption_key") (hasKey (default dict .features) "credential_encryption_iv") }}
        attachments:
    {{- with $modelCredential }}
          OPENAI_API_KEY:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "session_secret" }}
          JWT_SECRET:
            from: session_secret
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "session_refresh_secret" }}
          JWT_REFRESH_SECRET:
            from: session_refresh_secret
            as: env
    {{- end }}
    {{- /* Always taken in a build: the Component requires the credential_encryption_key slot. The guard
      lets a single-entity validate, which attaches nothing, still render the rest of this Recipe. */ -}}
    {{- if hasKey (default dict .features) "credential_encryption_key" }}
          CREDS_KEY:
            from: credential_encryption_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "credential_encryption_iv" }}
          CREDS_IV:
            from: credential_encryption_iv
            as: env
    {{- end }}
    {{- end }}
        ports:
          http: {{ .infra.port }}
        # The platform's own Helm chart probes GET /health for readiness and
        # liveness on this port, and gives no timing. The server connects to its
        # document store before it listens, and no start-up time is documented,
        # so the liveness probe waits 30 s and allows six misses 10 s apart.
        health:
          ready:
            http: /health
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        volumeMounts:
          - name: uploads
            path: "{{ $uploadsPath }}"
        # The resource quantities are quoted so the rendered value stays a string
        # whatever the Release supplies: a whole-core quantity such as 1
        # re-parses as a YAML integer and fails workload validation, while a
        # milli quantity happens not to.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    volumes:
      uploads:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.port }}
