apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis: a Deployment serving
    the editor on a ClusterIP Service, backed by a persistent volume holding
    the chatflow database and the key encrypting the editor's credentials, so
    both survive a restart; nothing else in the container does.

    The model endpoint wired into the `model` socket is injected as
    OPENAI_BASE_URL and a key attached on that connection as OPENAI_API_KEY,
    which a chatflow's OpenAI node reads only while its Connect Credential and
    Base Path fields are empty, through the client library's environment
    fallback rather than a Flowise feature; a credential on the node wins.

    Each tool and store wired into the `tools` and `vector_store` sockets
    reaches the platform under variables named for the connection's alias:
    the address as AGGREGA_TOOL_<ALIAS>_URL or
    AGGREGA_VECTOR_STORE_<ALIAS>_URL, a store publishing its database and user
    also as AGGREGA_VECTOR_STORE_<ALIAS>_HOST, _PORT, _DATABASE and _USER, and
    the credential, by a secretKeyRef, as AGGREGA_TOOL_<ALIAS>_CREDENTIAL,
    with the header the tool publishes as
    AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER, or as
    AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL. A chatflow reads each through a
    Runtime variable of the same name created on Flowise's Variables page.

    A flow_definition, when set, is carried in a ConfigMap and seeded by a
    one-shot Job in the platform's image: it registers infra.owner_email as
    the owner on a fresh instance, the owner_password credential read by
    secretKeyRef, signs in, and updates the chatflow at chatflow_id or imports
    it there. With none, neither is rendered. The contract is authored against
    Flowise 3.1.3.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/flowise:1.0.0
  # The entries below are the values the seeding Job shares with the
  # FlowiseFlowSeed bundle imported for the definition and the script that
  # seeds it. Each has its home in the bundle, which stops the build naming the
  # local when one is missing or differs from its own; the Job reads them
  # here, because an artifact of this Recipe cannot read the bundle.
  # flow_seed_delivery has the bundle emit one ConfigMap, named after the
  # rendered name followed by flow_seed_config_map_suffix; a locals entry
  # cannot read the rendered name, so the Job composes the two.
  # flow_seed_directory is where the Job mounts that ConfigMap and runs the
  # script, and where the script reads the definition.
  locals:
    flow_seed_delivery: config_map
    flow_seed_config_map_suffix: "-flow"
    flow_seed_directory: /seed
  # metrics_endpoint is the address Flowise serves its metrics at while
  # values.metrics_enabled is true, when the Workload below delivers
  # ENABLE_METRICS and METRICS_PROVIDER: /api/v1/metrics on port 3000 of the
  # Service the Workload is served on, <rendered_name>-default. Empty while the
  # value is false. metrics_credential_required follows it, true exactly while
  # there is an address to scrape, since Flowise answers its metrics only to an
  # API key.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-default:3000/api/v1/metrics{{ end }}"
    metrics_credential_required: "{{ if .values.metrics_enabled }}true{{ else }}false{{ end }}"
  # When values.flow_definition is set, the FlowiseFlowSeed bundle emits a
  # ConfigMap carrying the definition verbatim beside the script that seeds
  # it, and a one-shot Job runs that script once the platform answers. With no
  # definition neither renders, so the output is what it is without the
  # value. The Component's assertions have already halted a definition with no
  # infra.owner_email, no owner_password credential or a chatflow_id that is
  # not a UUID.
  #
  # The script is the bundle's, the one compose/flowise imports too, so both
  # targets run one text; the bundle says what it does, in order. In short, it
  # registers infra.owner_email as the owner on a fresh instance, signs in,
  # and updates the chatflow at chatflow_id or imports the definition at that
  # id, named after values.display_name or the id, halting with the
  # platform's own status and message when a call is refused; running it
  # again updates the same chatflow, so a retried or repeated run converges.
  #
  # The Job runs the platform's own image, whose Node.js runtime carries the
  # HTTP client the script uses, so the step adds no image; the command
  # replaces the image's own entrypoint, which would start a second platform.
  # It has the form the provider gives a run-to-completion workload —
  # restartPolicy Never, and no deadline or retry count, so the cluster's
  # defaults apply — and each attempt stops waiting for the platform after
  # about ten minutes. The address is the Service the Workload below is
  # served on, <rendered_name>-default, on the port it serves, 3000. That bare
  # name resolves only inside the Service's own namespace, and the Secret the
  # password is read from must sit beside the Job too, so the ConfigMap and the
  # Job carry the namespace the Release declares for the component through the
  # aggrega.ai/namespace annotation, as the Workload's own resources do, and
  # none where it declares none, where the applying tool places all three. The
  # definition sits in the ConfigMap rather than in the Job, so editing it
  # leaves the Job's pod template unchanged; a Job runs when it is created,
  # so seeding an edited definition into a running platform means deleting the
  # completed Job and applying again. A Job's pod template cannot be changed
  # once created, so a Release changing anything else the Job's pod carries —
  # the owner's email, the image, the chatflow's id or name — deletes the
  # completed Job before applying.
  #
  # The owner password reaches the step by reference: OWNER_PASSWORD is a
  # secretKeyRef to the Secret name and data key the owner_password credential
  # publishes, so no file this Recipe renders carries the password, and a
  # credential publishing neither halts the build.
  artifacts:
    flowise-flow:
      $import: FlowiseFlowSeed#/artifacts/SeedScript
    flowise-flow-seed.job.yaml: |
      {{- if .values.flow_definition }}
      {{- $locator := optional (optional (default dict .features) "owner_password" dict) "provides" dict }}
      {{- if not (and (optional $locator "name" "") (optional $locator "key" "")) }}
      {{- fail (printf "the owner_password credential of the Flowise platform %q publishes no Secret name and data key, so the step seeding values.flow_definition could not be given a reference to read it from: attach an owner_password credential publishing both, such as core/referenced-secret" .context.instance_id) }}
      {{- end -}}
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: {{ .context.rendered_name }}-flow-seed
        {{- with optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" "" }}
        namespace: "{{ . }}"
        {{- end }}
      spec:
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: seed
                image: "{{ .infra.image }}"
                command: ["node", "{{ .locals.flow_seed_directory }}/seed.js"]
                env:
                  - name: FLOWISE_URL
                    value: "http://{{ .context.rendered_name }}-default:3000"
                  - name: OWNER_EMAIL
                    value: "{{ .infra.owner_email }}"
                  - name: OWNER_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: "{{ .features.owner_password.provides.name }}"
                        key: "{{ .features.owner_password.provides.key }}"
                  - name: CHATFLOW_ID
                    value: "{{ .values.chatflow_id }}"
                  - name: CHATFLOW_NAME
                    value: {{ optional .values "display_name" "" | default .values.chatflow_id | toJson }}
                volumeMounts:
                  - name: seed
                    mountPath: {{ .locals.flow_seed_directory }}
                    readOnly: true
            volumes:
              - name: seed
                configMap:
                  name: {{ .context.rendered_name }}{{ .locals.flow_seed_config_map_suffix }}
      {{- end }}
  # The Workload becomes a Deployment serving the Flowise editor on a ClusterIP
  # Service, backed by a persistent volume. Two pieces of durable state land on
  # that volume and survive a restart: the chatflow database, and the
  # encryption key that protects the credentials created in the editor. The
  # platform generates that key on first start and writes it under the data
  # path, so the key and the database whose rows it protects stay together;
  # state written anywhere else in the container does not survive.
  #
  # The model endpoint wired into the `model` socket is injected as
  # OPENAI_BASE_URL and a model API key attached on that connection as
  # OPENAI_API_KEY, through a secretKeyRef naming the connection. A chatflow
  # resolves its model credential per node from Flowise's own encrypted
  # credential store: the OpenAI node selects a credential, and Flowise looks it
  # up and decrypts it — so a credential selected on the node takes precedence
  # over the delivered key, and an operator who wants a chatflow to work the way
  # Flowise intends creates that credential in the editor after deploying. The
  # delivered variables are read by the underlying OpenAI client library when
  # the node's Connect Credential and Base Path fields are left empty. That is
  # the client library's environment fallback rather than a documented Flowise
  # feature, so a future Flowise release that changes how it validates a
  # credential-less node would end it. Which model a chatflow calls is selected
  # inside the chatflow's own OpenAI node, whose model-name field carries the
  # platform's default; the environment carries no model name.
  #
  # Chatflows are authored in the Flowise editor, or seeded from
  # values.flow_definition by the one-shot Job the artifacts above describe:
  # Flowise loads no chatflow from a file or a variable at start-up, so the
  # Workload itself carries nothing for it.
  #
  # Each `tools` and `vector_store` connection's variables are named for its
  # alias, upper-cased, with every character other than a letter or a digit an
  # underscore; the alias grammar admits only a hyphen and an underscore
  # besides, so a hyphen becomes an underscore. A chatflow reads none of them
  # until a Runtime variable of the same name exists on Flowise's Variables
  # page: Flowise resolves a Runtime variable from the environment variable of
  # its name, and a chatflow reads it as $vars.<name>.
  #
  # AGGREGA_TOOL_<ALIAS>_URL is the endpoint the tool publishes, unless the
  # connection carries an endpoint secret: then it is that secret, referenced
  # by connection and slot, and the published address is not delivered. The
  # credential is delivered only where the connection carries one, and the
  # header beside it only where the tool publishes one; a tool behind a bridge
  # publishes none, because the bridge checks no caller's credential.
  #
  # AGGREGA_VECTOR_STORE_<ALIAS>_URL is the endpoint the store publishes, or,
  # for a store publishing none, the address composed from the protocol, host
  # and port it publishes. Its credential is delivered only where the
  # connection carries one.
  #
  # A store that also publishes a database and a user, as
  # core/datastore/pgvector does, is delivered in parts as well:
  # AGGREGA_VECTOR_STORE_<ALIAS>_HOST, _PORT, _DATABASE and _USER, its
  # published host, port, database and user. Flowise's Postgres node takes the
  # host and the database in text fields, which a Runtime variable fills, the
  # port in a number field, and the user and the password from its Postgres
  # API credential, which Flowise stores and no Runtime variable fills, so
  # those two are typed into that credential. A store publishing no database
  # or no user gets no parts: its connection delivers the address and the
  # credential alone.
  #
  # Every secret on every connection sits under one attachments key, so the
  # block is opened once, and only where one connection carries a secret.
  workload: |
    {{- $dataPath := "/app/flowise-data" -}}
    {{- $secrets := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "tools") (or (hasKey $features "credential") (hasKey $features "endpoint")) -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Every key that has to agree on it reads the binding — the
        # database path, the credential-key path, and the volume mount — so a
        # future move cannot relocate one and leave the others behind.
        # SECRETKEY_PATH is load-bearing rather than decorative: without it the
        # platform writes the credential encryption key it generates on first
        # start outside the mounted volume, and each restart then mints a new key
        # while the volume keeps the database, leaving every credential created
        # in the editor undecryptable.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name to read the published
        # endpoint.
        # ENABLE_METRICS and METRICS_PROVIDER turn on the platform's own
        # metrics, in the Prometheus format, while values.metrics_enabled is
        # true; it serves them on its own port behind its API-key check, so no
        # port is added.
        variables:
          DATABASE_PATH: "{{ $dataPath }}"
          SECRETKEY_PATH: "{{ $dataPath }}"
    {{- if .values.metrics_enabled }}
          ENABLE_METRICS: "true"
          METRICS_PROVIDER: "prometheus"
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $features "endpoint") }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $url := optional $edge.provides "endpoint" "" }}
    {{- if not $url }}
    {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
    {{- end }}
          AGGREGA_VECTOR_STORE_{{ $name }}_URL: "{{ $url }}"
    {{- if and (optional $edge.provides "database" "") (optional $edge.provides "user" "") }}
          AGGREGA_VECTOR_STORE_{{ $name }}_HOST: "{{ $edge.provides.host }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_PORT: "{{ $edge.provides.port }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_DATABASE: "{{ $edge.provides.database }}"
          AGGREGA_VECTOR_STORE_{{ $name }}_USER: "{{ $edge.provides.user }}"
    {{- end }}
    {{- end }}
    {{- end }}
        # Fallback for the no-credential authoring state: the client library
        # reads this only when the node's Connect Credential is left empty. A
        # chatflow node with its own credential attached uses that instead — so
        # this delivery is not how the key is supplied.
    {{- if $secrets }}
        attachments:
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL:
            connection: "{{ $alias }}"
            from: endpoint
            as: env
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") }}
          AGGREGA_VECTOR_STORE_{{ regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- end }}
        ports:
          http: 3000
        # The platform answers GET /api/v1/ping without authentication, and its
        # own Compose file checks that route every 10 s after a 30 s start period,
        # allowing five retries — the timing the liveness probe below uses.
        health:
          ready:
            http: /api/v1/ping
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /api/v1/ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
