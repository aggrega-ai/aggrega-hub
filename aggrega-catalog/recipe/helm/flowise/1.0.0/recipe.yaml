apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment serving the Flowise editor on a ClusterIP Service, backed by a
    persistent volume holding the chatflow database. The model endpoint wired into
    the `model` socket is injected as OPENAI_BASE_URL and an attached model API key
    as OPENAI_API_KEY. Chatflows are authored or imported through the Flowise
    editor or its REST API; Flowise has no startup flow-load path, so seeding is
    not declarative on this platform.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/flowise:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The database path (holding the chatflow database) is set explicitly so
        # the persistent volume mounts at a deterministic path. The model endpoint
        # arrives on the `model` uses-edge; the recipe ranges the outbound edges
        # and matches on the socket name to read the published endpoint and model.
        variables:
          DATABASE_PATH: /app/flowise-data
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
        secrets:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
        ports:
          http: 3000
        volumeMounts:
          - name: data
            path: /app/flowise-data
    volumes:
      data:
        persistent:
          size: {{ .infra.storage_size }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
