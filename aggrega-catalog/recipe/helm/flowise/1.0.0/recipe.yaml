apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis. The Workload becomes a
    Deployment serving the Flowise editor on a ClusterIP Service, backed by a
    persistent volume. Two pieces of durable state land on that volume and
    survive a restart: the chatflow database, and the encryption key that
    protects the credentials created in the editor. The platform generates that
    key on first start and writes it under the data path, so the key and the
    database whose rows it protects stay together; state written anywhere else in
    the container does not survive. The model endpoint wired into the `model`
    socket is injected as OPENAI_BASE_URL and an attached model API key as
    OPENAI_API_KEY. Chatflows are authored or imported through the Flowise editor
    or its REST API; Flowise has no startup flow-load path, so seeding is not
    declarative on this platform. The environment-variable contract is authored
    against Flowise 3.1.3.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/flowise:1.0.0
  workload: |
    {{- $dataPath := "/app/flowise-data" -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Every key that has to agree on it reads the binding — the
        # database path, the credential-key path, and the volume mount — so a
        # future move cannot relocate one and leave the others behind.
        # SECRETKEY_PATH is load-bearing rather than decorative: without it the
        # platform writes the credential encryption key it generates on first
        # start outside the mounted volume, and each restart then mints a new key
        # while the volume keeps the database, leaving every credential created
        # in the editor undecryptable.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name to read the published
        # endpoint and model.
        variables:
          DATABASE_PATH: {{ $dataPath }}
          SECRETKEY_PATH: {{ $dataPath }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
    {{- if hasKey (default dict .secrets) "model_api_key" }}
        secrets:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
        ports:
          http: 3000
        volumeMounts:
          - name: data
            path: {{ $dataPath }}
    volumes:
      data:
        persistent:
          size: {{ .infra.storage_size }}
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
