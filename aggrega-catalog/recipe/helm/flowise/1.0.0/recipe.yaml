apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: flowise
  version: 1.0.0
  description: >
    The Flowise visual agent-builder on Kubernetes, rendered offline as plain
    manifests by the helm provider's Workload synthesis: a Deployment serving
    the Flowise editor on a ClusterIP Service, backed by a persistent volume.
    The chatflow database and the encryption key protecting the credentials
    created in the editor both live on that volume and survive a restart; state
    written anywhere else in the container does not.

    The model endpoint wired into the `model` socket is injected as
    OPENAI_BASE_URL and a model API key attached on that connection as
    OPENAI_API_KEY. A chatflow's OpenAI node reads them only while its Connect
    Credential and
    Base Path fields are left empty, through the client library's environment
    fallback rather than a documented Flowise feature; a credential selected
    on the node takes precedence, and the model is chosen in the node, not in
    the environment.

    Each tool wired into the `tools` socket and each vector store wired into
    the `vector_store` socket reach the platform under variables named for the
    connection's alias, upper-cased with hyphens as underscores: the address
    as AGGREGA_TOOL_<ALIAS>_URL or AGGREGA_VECTOR_STORE_<ALIAS>_URL, and the
    connection's credential as AGGREGA_TOOL_<ALIAS>_CREDENTIAL, with the header
    the tool publishes as AGGREGA_TOOL_<ALIAS>_CREDENTIAL_HEADER, or as
    AGGREGA_VECTOR_STORE_<ALIAS>_CREDENTIAL, through a secretKeyRef. A chatflow
    reads each through a Runtime variable of the same name created on
    Flowise's Variables page.

    Chatflows are authored or imported through the editor or its REST API:
    Flowise has no startup flow-load path, so this Recipe seeds none. The
    environment-variable contract is authored against Flowise 3.1.3.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/flowise:1.0.0
  # The Workload becomes a Deployment serving the Flowise editor on a ClusterIP
  # Service, backed by a persistent volume. Two pieces of durable state land on
  # that volume and survive a restart: the chatflow database, and the
  # encryption key that protects the credentials created in the editor. The
  # platform generates that key on first start and writes it under the data
  # path, so the key and the database whose rows it protects stay together;
  # state written anywhere else in the container does not survive.
  #
  # The model endpoint wired into the `model` socket is injected as
  # OPENAI_BASE_URL and a model API key attached on that connection as
  # OPENAI_API_KEY, through a secretKeyRef naming the connection. A chatflow
  # resolves its model credential per node from Flowise's own encrypted
  # credential store: the OpenAI node selects a credential, and Flowise looks it
  # up and decrypts it — so a credential selected on the node takes precedence
  # over the delivered key, and an operator who wants a chatflow to work the way
  # Flowise intends creates that credential in the editor after deploying. The
  # delivered variables are read by the underlying OpenAI client library when
  # the node's Connect Credential and Base Path fields are left empty. That is
  # the client library's environment fallback rather than a documented Flowise
  # feature, so a future Flowise release that changes how it validates a
  # credential-less node would end it. Which model a chatflow calls is selected
  # inside the chatflow's own OpenAI node, whose model-name field carries the
  # platform's default; the environment carries no model name.
  #
  # Chatflows are authored or imported through the Flowise editor or its REST
  # API; Flowise has no startup flow-load path, so seeding is not declarative on
  # this platform.
  #
  # Each `tools` and `vector_store` connection's variables are named for its
  # alias, upper-cased, with every character other than a letter or a digit an
  # underscore; the alias grammar admits only a hyphen and an underscore
  # besides, so a hyphen becomes an underscore. A chatflow reads none of them
  # until a Runtime variable of the same name exists on Flowise's Variables
  # page: Flowise resolves a Runtime variable from the environment variable of
  # its name, and a chatflow reads it as $vars.<name>.
  #
  # AGGREGA_TOOL_<ALIAS>_URL is the endpoint the tool publishes, unless the
  # connection carries an endpoint secret: then it is that secret, referenced
  # by connection and slot, and the published address is not delivered. The
  # credential is delivered only where the connection carries one, and the
  # header beside it only where the tool publishes one; a tool behind a bridge
  # publishes none, because the bridge checks no caller's credential.
  #
  # AGGREGA_VECTOR_STORE_<ALIAS>_URL is the endpoint the store publishes, or,
  # for a store publishing none, the address composed from the protocol, host
  # and port it publishes. Its credential is delivered only where the
  # connection carries one.
  #
  # Every secret on every connection sits under one attachments key, so the
  # block is opened once, and only where one connection carries a secret.
  workload: |
    {{- $dataPath := "/app/flowise-data" -}}
    {{- $secrets := false -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- $features := default dict $edge.features -}}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "tools") (or (hasKey $features "credential") (hasKey $features "endpoint")) -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") -}}
    {{- $secrets = true -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # $dataPath is the single authored home for the platform's data
        # directory. Every key that has to agree on it reads the binding — the
        # database path, the credential-key path, and the volume mount — so a
        # future move cannot relocate one and leave the others behind.
        # SECRETKEY_PATH is load-bearing rather than decorative: without it the
        # platform writes the credential encryption key it generates on first
        # start outside the mounted volume, and each restart then mints a new key
        # while the volume keeps the database, leaving every credential created
        # in the editor undecryptable.
        # The model endpoint arrives on the `model` uses-edge; the recipe ranges
        # the outbound edges and matches on the socket name to read the published
        # endpoint.
        variables:
          DATABASE_PATH: "{{ $dataPath }}"
          SECRETKEY_PATH: "{{ $dataPath }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $features := default dict $edge.features }}
    {{- if not (hasKey $features "endpoint") }}
          AGGREGA_TOOL_{{ $name }}_URL: "{{ $edge.provides.endpoint }}"
    {{- end }}
    {{- if and (hasKey $features "credential") (optional $edge.provides "credential_header" "") }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL_HEADER: "{{ $edge.provides.credential_header }}"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "vector_store" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- $url := optional $edge.provides "endpoint" "" }}
    {{- if not $url }}
    {{- $url = printf "%v://%v:%v" $edge.provides.protocol $edge.provides.host $edge.provides.port }}
    {{- end }}
          AGGREGA_VECTOR_STORE_{{ $name }}_URL: "{{ $url }}"
    {{- end }}
    {{- end }}
        # Fallback for the no-credential authoring state: the client library
        # reads this only when the node's Connect Credential is left empty. A
        # chatflow node with its own credential attached uses that instead — so
        # this delivery is not how the key is supplied.
    {{- if $secrets }}
        attachments:
    {{- range $alias, $edge := .context.uses }}
    {{- $features := default dict $edge.features }}
    {{- if and (eq $edge.socket "model") (hasKey $features "credential") }}
          OPENAI_API_KEY:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- if eq $edge.socket "tools" }}
    {{- $name := regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}
    {{- if hasKey $features "endpoint" }}
          AGGREGA_TOOL_{{ $name }}_URL:
            connection: "{{ $alias }}"
            from: endpoint
            as: env
    {{- end }}
    {{- if hasKey $features "credential" }}
          AGGREGA_TOOL_{{ $name }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- if and (eq $edge.socket "vector_store") (hasKey $features "credential") }}
          AGGREGA_VECTOR_STORE_{{ regexReplaceAll "[^A-Z0-9]" (upper $alias) "_" }}_CREDENTIAL:
            connection: "{{ $alias }}"
            from: credential
            as: env
    {{- end }}
    {{- end }}
    {{- end }}
        ports:
          http: 3000
        # The platform answers GET /api/v1/ping without authentication, and its
        # own Compose file checks that route every 10 s after a 30 s start period,
        # allowing five retries — the timing the liveness probe below uses.
        health:
          ready:
            http: /api/v1/ping
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /api/v1/ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        volumeMounts:
          - name: data
            path: "{{ $dataPath }}"
    volumes:
      data:
        persistent:
          size: "{{ .infra.storage.size }}"
    services:
      default:
        type: ClusterIP
        ports:
          http: 3000
