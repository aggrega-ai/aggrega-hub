apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: agenta-worker-streams
  version: 1.0.0
  license: MIT
  # The identifier names the terms of the software this Recipe realizes: the
  # image below is the platform's open core, published under the MIT Expat terms
  # its repository states for everything outside one named subtree. That subtree
  # is published under separate terms and is built into a different image, which
  # this Recipe does not pin and offers no knob to select. No single identifier
  # states both situations, so the coarse class covering the product as a whole
  # is carried on the component's component.aggrega.ai/upstream-licensing label
  # rather than asserted here.
  description: >
    The agent workspace's stream-consuming worker on Kubernetes via the helm
    provider's Workload synthesis: a stateless Deployment and no Service. There
    is no Service because nothing connects to this tier — work reaches it by
    being written to the streams it reads — and emitting one would advertise an
    endpoint that answers nothing.

    Each backing system's identity arrives on .context.inject.env and is
    composed here into the single connection string its client reads, under the
    same variable names the control-plane API's Recipe uses, because the two run
    the same image and read the same configuration. The relational connections
    are rendered password-free: the password arrives beside them as an env
    secret reference and is named inside each URL in the platform's own
    runtime-substitution form. A cache or queue publishing valkey-tls or redis-tls is
    reached over TLS, its certificate checked against that connection's
    server_ca, mounted, or the image's trust store; another TLS protocol halts
    the build.

    The stream selector is emitted from the component's own value, empty by
    default, which is what makes one container run every family. This Recipe
    publishes no provides contract, because the component declares none.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/agenta-worker-streams:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Target-expected names: the worker reads POSTGRES_URI_CORE and
  # POSTGRES_URI_TRACING for the two relational databases, REDIS_URI and
  # REDIS_URI_VOLATILE for the cache, REDIS_URI_DURABLE for the streams it
  # consumes, and AGENTA_WORKER_STREAMS for which families this container runs —
  # an empty value meaning all of them, which is why the variable is emitted
  # even when the component's value is unset.
  #
  # The three Redis URLs are composed as the control-plane API's Recipe
  # composes them, over TLS included: the rediss scheme for a store publishing
  # valkey-tls or redis-tls, and an ssl_ca_certs query argument naming the mounted
  # server_ca, both read by the Redis client the worker builds from each URL.
  #
  # The names the edges deliver on are read here as BACKEND_HOST, BACKEND_PORT,
  # BACKEND_USER, CACHE_HOST, CACHE_PORT, QUEUE_HOST and QUEUE_PORT. Those are
  # the `in:` keys each uses-edge must be set to, and the component's socket
  # comments state the same contract on the authoring side.
  #
  # POSTGRES_PASSWORD is named inside both relational URLs in the
  # $(POSTGRES_PASSWORD) form, which the platform's own container runtime
  # expands from the variable of that name delivered beside it.
  provides: {}
  workload: |
    {{- /*
      The alias of each connection carrying a credential this component
      presents, or empty: the backend's password.
    */ -}}
    {{- $backendCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}{{- $backendCredential = $alias -}}{{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "BACKEND_HOST" "host" "BACKEND_PORT" "port" "BACKEND_USER" "user") "cache" (dict "CACHE_HOST" "host" "CACHE_PORT" "port") "queue" (dict "QUEUE_HOST" "host" "QUEUE_PORT" "port") -}}
    {{- $required := list -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/ai-agent/agenta-worker-streams %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    {{- /*
      The cache and queue connections over TLS, each on its own. A store
      publishing valkey-tls or redis-tls accepts TLS connections alone, so its URL takes the
      rediss scheme, which the platform's Redis client reads as TLS; any other
      value ending in -tls names a store served over TLS the stream worker is not
      taught to reach, and halts rather than connecting in plaintext. A
      server_ca on a connection is the authority the client checks that
      store's certificate against: it is mounted, and the URL names its ca.crt
      in the client's ssl_ca_certs setting, so its attachment must name a
      Secret, and it is refused on a store served without TLS, where no
      handshake takes place to check a certificate in. DELIBERATE
      NEAR-DUPLICATE of the block in the control-plane API's Recipe, which the
      services, cron and two worker Recipes repeat inside templates of their
      own: no catalog kind holds a template fragment for several Recipes to
      share; change all five together.
    */ -}}
    {{- $redisTLS := dict }}{{ $redisCA := dict -}}
    {{- range $alias, $edge := .context.uses }}{{ if has $edge.socket (list "cache" "queue") -}}
    {{- $proto := toString (optional (default dict $edge.provides) "protocol" "") -}}
    {{- $edgeTLS := has $proto (list "valkey-tls" "redis-tls") -}}
    {{- if $edgeTLS }}{{ $_ := set $redisTLS $edge.socket true }}{{ else if hasSuffix "-tls" $proto -}}
    {{- fail (printf "the %s connection %s of %q reaches %q, which publishes protocol %s, a store served over TLS that the agent workspace's stream worker does not reach: it speaks the Redis protocol, over TLS to a store publishing valkey-tls or redis-tls; wire a Redis-protocol store to the %s socket" $edge.socket $alias $.context.instance_id $edge.target $proto $edge.socket) -}}
    {{- end -}}
    {{- if hasKey (default dict $edge.features) "server_ca" -}}
    {{- $caProvides := optional (optional (default dict $edge.features) "server_ca" dict) "provides" dict -}}
    {{- if not (and (kindIs "map" $caProvides) (optional $caProvides "name" "")) -}}
    {{- fail (printf "the server_ca on the %s connection %s of %q publishes no Secret name, so no Secret could be mounted into the worker's container: attach a server_ca publishing one, such as core/referenced-secret" $edge.socket $alias $.context.instance_id) -}}
    {{- end -}}
    {{- if not $edgeTLS -}}
    {{- fail (printf "the %s connection %s of %q holds a server_ca, but the store it reaches, %q, publishes protocol %s, served without TLS, so no TLS handshake takes place to check a certificate in: turn client_tls on for that store, or remove the server_ca" $edge.socket $alias $.context.instance_id $edge.target (default "none" $proto)) -}}
    {{- end -}}
    {{- $_ := set $redisCA $edge.socket $alias -}}
    {{- end -}}
    {{- end }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # The worker holds no durable state — the relational backend is the system
    # of record — so the default stateless form (a Deployment on the helm
    # provider) is correct. No services key: nothing connects to this tier.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/agenta-ai/agenta-api:{{ .infra.engine_version }}"
        # The platform image ships several entry points and runs whichever the
        # command names. This one drains the streams; the control-plane API, the
        # queue worker, the scheduler and the migration step run the same image
        # under their own commands, which is why all five pin the same
        # engine_version.
        command: ["python", "-m", "entrypoints.worker_streams"]
        variables:
          AGENTA_LICENSE: oss
          AGENTA_LOG_LEVEL: "{{ .infra.log_level }}"
          # Which stream families this container runs. Empty means all of them,
          # which is what a single-container installation wants.
          AGENTA_WORKER_STREAMS: "{{ .values.streams }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "backend" }}
          POSTGRES_URI_CORE: "postgresql+asyncpg://{{ $env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $env.BACKEND_HOST }}:{{ $env.BACKEND_PORT }}/{{ $edge.values.core_database }}"
          POSTGRES_URI_TRACING: "postgresql+asyncpg://{{ $env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $env.BACKEND_HOST }}:{{ $env.BACKEND_PORT }}/{{ $edge.values.tracing_database }}"
    {{- end }}
    {{- if eq $edge.socket "cache" }}
          REDIS_URI: "{{ if hasKey $redisTLS "cache" }}rediss{{ else }}redis{{ end }}://{{ $env.CACHE_HOST }}:{{ $env.CACHE_PORT }}/{{ $edge.values.db_index }}{{ if hasKey $redisCA "cache" }}?ssl_ca_certs=/etc/agenta/cache-server-ca/ca.crt{{ end }}"
          REDIS_URI_VOLATILE: "{{ if hasKey $redisTLS "cache" }}rediss{{ else }}redis{{ end }}://{{ $env.CACHE_HOST }}:{{ $env.CACHE_PORT }}/{{ $edge.values.db_index }}{{ if hasKey $redisCA "cache" }}?ssl_ca_certs=/etc/agenta/cache-server-ca/ca.crt{{ end }}"
    {{- end }}
    {{- if eq $edge.socket "queue" }}
          REDIS_URI_DURABLE: "{{ if hasKey $redisTLS "queue" }}rediss{{ else }}redis{{ end }}://{{ $env.QUEUE_HOST }}:{{ $env.QUEUE_PORT }}/{{ $edge.values.db_index }}{{ if hasKey $redisCA "queue" }}?ssl_ca_certs=/etc/agenta/queue-server-ca/ca.crt{{ end }}"
    {{- end }}
    {{- end }}
    {{- if not $backendCredential }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
    {{- $attached := or $backendCredential $redisCA }}
    {{- range $slot := list "auth_key" "crypt_key" }}
    {{- if hasKey (default dict $.features) $slot }}{{ $attached = true }}{{ end }}
    {{- end }}
    {{- if $attached }}
        attachments:
    {{- end }}
    {{- with $backendCredential }}
          POSTGRES_PASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "auth_key" }}
          AGENTA_AUTH_KEY:
            from: auth_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "crypt_key" }}
          AGENTA_CRYPT_KEY:
            from: crypt_key
            as: env
    {{- end }}
          # Each store connection's server_ca Secret mounts whole, read-only, one
          # file per data key, so the client reads ca.crt from its directory.
    {{- range $socket := list "cache" "queue" }}{{ with get $redisCA $socket }}
          {{ $socket }}-server-ca:
            connection: "{{ . }}"
            from: server_ca
            as: file
            path: /etc/agenta/{{ $socket }}-server-ca
    {{- end }}{{ end }}
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
