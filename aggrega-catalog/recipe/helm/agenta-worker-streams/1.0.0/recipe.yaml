apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: agenta-worker-streams
  version: 1.0.0
  license: MIT
  # The identifier names the terms of the software this Recipe realizes: the
  # image below is the platform's open core, published under the MIT Expat terms
  # its repository states for everything outside one named subtree. That subtree
  # is published under separate terms and is built into a different image, which
  # this Recipe does not pin and offers no knob to select. No single identifier
  # states both situations, so the coarse class covering the product as a whole
  # is carried on the component's component.aggrega.ai/upstream-licensing label
  # rather than asserted here.
  description: >
    The agent workspace's stream-consuming worker on Kubernetes via the helm
    provider's Workload synthesis: a stateless Deployment and no Service. There
    is no Service because nothing connects to this tier — work reaches it by
    being written to the streams it reads — and emitting one would advertise an
    endpoint that answers nothing.

    Each backing system's identity arrives on .context.inject.env and is
    composed here into the single connection string its client reads, under the
    same variable names the control-plane API's Recipe uses, because the two run
    the same image and read the same configuration. The relational connections
    are rendered password-free: the password arrives beside them as an env
    secret reference and is named inside each URL in the platform's own
    runtime-substitution form.

    The stream selector is emitted from the component's own value, empty by
    default, which is what makes one container run every family. This Recipe
    publishes no provides contract, because the component declares none.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/agenta-worker-streams:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # Target-expected names: the worker reads POSTGRES_URI_CORE and
  # POSTGRES_URI_TRACING for the two relational databases, REDIS_URI and
  # REDIS_URI_VOLATILE for the cache, REDIS_URI_DURABLE for the streams it
  # consumes, and AGENTA_WORKER_STREAMS for which families this container runs —
  # an empty value meaning all of them, which is why the variable is emitted
  # even when the component's value is unset.
  #
  # The names the edges deliver on are read here as BACKEND_HOST, BACKEND_PORT,
  # BACKEND_USER, CACHE_HOST, CACHE_PORT, QUEUE_HOST and QUEUE_PORT. Those are
  # the `in:` keys each uses-edge must be set to, and the component's socket
  # comments state the same contract on the authoring side.
  #
  # POSTGRES_PASSWORD is named inside both relational URLs in the
  # $(POSTGRES_PASSWORD) form, which the platform's own container runtime
  # expands from the variable of that name delivered beside it.
  provides: {}
  workload: |
    {{- /*
      The alias of each connection carrying a credential this component
      presents, or empty: the backend's password.
    */ -}}
    {{- $backendCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}{{- $backendCredential = $alias -}}{{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # The worker holds no durable state — the relational backend is the system
    # of record — so the default stateless form (a Deployment on the helm
    # provider) is correct. No services key: nothing connects to this tier.
    form: stateless
    replicas: 1
    containers:
      main:
        image: "ghcr.io/agenta-ai/agenta-api:{{ .infra.engine_version }}"
        # The platform image ships several entry points and runs whichever the
        # command names. This one drains the streams; the control-plane API, the
        # queue worker, the scheduler and the migration step run the same image
        # under their own commands, which is why all five pin the same
        # engine_version.
        command: ["python", "-m", "entrypoints.worker_streams"]
        variables:
          AGENTA_LICENSE: oss
          AGENTA_LOG_LEVEL: "{{ .infra.log_level }}"
          # Which stream families this container runs. Empty means all of them,
          # which is what a single-container installation wants.
          AGENTA_WORKER_STREAMS: "{{ .values.streams }}"
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "backend" }}
          POSTGRES_URI_CORE: "postgresql+asyncpg://{{ $.context.inject.env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $.context.inject.env.BACKEND_HOST }}:{{ $.context.inject.env.BACKEND_PORT }}/{{ $edge.values.core_database }}"
          POSTGRES_URI_TRACING: "postgresql+asyncpg://{{ $.context.inject.env.BACKEND_USER }}:$(POSTGRES_PASSWORD)@{{ $.context.inject.env.BACKEND_HOST }}:{{ $.context.inject.env.BACKEND_PORT }}/{{ $edge.values.tracing_database }}"
    {{- end }}
    {{- if eq $edge.socket "cache" }}
          REDIS_URI: "redis://{{ $.context.inject.env.CACHE_HOST }}:{{ $.context.inject.env.CACHE_PORT }}/{{ $edge.values.db_index }}"
          REDIS_URI_VOLATILE: "redis://{{ $.context.inject.env.CACHE_HOST }}:{{ $.context.inject.env.CACHE_PORT }}/{{ $edge.values.db_index }}"
    {{- end }}
    {{- if eq $edge.socket "queue" }}
          REDIS_URI_DURABLE: "redis://{{ $.context.inject.env.QUEUE_HOST }}:{{ $.context.inject.env.QUEUE_PORT }}/{{ $edge.values.db_index }}"
    {{- end }}
    {{- end }}
    {{- if not $backendCredential }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
    {{- if not (hasKey (default dict .features) "auth_key") }}
          AGENTA_AUTH_KEY: dev-agenta-auth-change-me
    {{- end }}
    {{- if not (hasKey (default dict .features) "crypt_key") }}
          AGENTA_CRYPT_KEY: dev-agenta-crypt-change-me
    {{- end }}
    {{- $attached := $backendCredential }}
    {{- range $slot := list "auth_key" "crypt_key" }}
    {{- if hasKey (default dict $.features) $slot }}{{ $attached = true }}{{ end }}
    {{- end }}
    {{- if $attached }}
        attachments:
    {{- end }}
    {{- with $backendCredential }}
          POSTGRES_PASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "auth_key" }}
          AGENTA_AUTH_KEY:
            from: auth_key
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "crypt_key" }}
          AGENTA_CRYPT_KEY:
            from: crypt_key
            as: env
    {{- end }}
        # The resource quantities are quoted so the rendered value stays a
        # string whatever the Release supplies.
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
