apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres-bitnami
  version: 1.0.0
  description: >
    PostgreSQL via Bitnami Helm chart (bitnami/postgresql). PostgreSQL is a
    durable relational database, so the chart renders a StatefulSet with a
    persistent volume. Authentication is wired through the component's optional
    password slot: when a credential is attached its value arrives on the env
    pipe and is set as the chart's superuser password (auth.postgresPassword)
    and the application user's password (auth.password); when none is attached
    the Recipe falls back to an inline development default so the render stays
    deterministic. Default chart version in source.version; override via
    infra.source_version. The synthesized helm Recipe (helm/postgres), which
    runs the official upstream postgres image directly with no external chart,
    is the preferred path for this database. This chart-wrap is retained for
    compatibility with existing deployments and may be retired in favor of the
    synthesized Recipe.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/datastore/postgres:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/postgresql
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"18.7.13\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "postgres"

  # This Recipe reads from infra.overrides:
  #   image                    - map[string]string (chart image.* fields)
  #   volume_permissions_image - map[string]string (chart volumePermissions.image.* fields)
  #   global_storage_class     - string (chart global.storageClass)
  #   requests                 - { cpu: string, memory: string } (primary resource requests)
  #   nodeSelector             - map[string]string
  #   tolerations              - []object
  #   affinity                 - object
  #   service_type             - string (primary service type)
  #   metrics                  - { enabled: bool, image: map[string]string }
  valuesMapping: |
    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- if .infra.overrides.volume_permissions_image }}
    volumePermissions:
      image:
        {{- range $k, $v := .infra.overrides.volume_permissions_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
    {{- end }}
    {{- if .infra.overrides.global_storage_class }}
    global:
      storageClass: "{{ .infra.overrides.global_storage_class }}"
    {{- end }}
    {{- end }}

    ## ── Architecture ───────────────────────────────────────────
    ## Read replicas require the chart's replication architecture; a
    ## standalone deployment renders the primary alone.
    {{- if and .infra.ha.enabled (gt (int .infra.ha.read_replicas) 0) }}
    architecture: replication
    {{- else }}
    architecture: standalone
    {{- end }}

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      postgresql: {{ .infra.port }}

    ## ── Authentication (optional credential slot) ──────────────
    ## The chart's "postgres" superuser is always present. A custom
    ## application user and database are created from the developer values.
    ## When the optional `password` slot is filled its value arrives on the
    ## inject pipe and sets both the superuser password and the application
    ## user's password; when unset the Recipe supplies an inline development
    ## default so the render stays deterministic (the chart would otherwise
    ## generate a fresh random password on every render).
    auth:
      database: "{{ .values.database }}"
      username: "{{ .values.user }}"
      {{- if and .context.inject.env .context.inject.env.POSTGRES_PASSWORD }}
      postgresPassword: "{{ .context.inject.env.POSTGRES_PASSWORD }}"
      password: "{{ .context.inject.env.POSTGRES_PASSWORD }}"
      {{- else }}
      postgresPassword: apppass
      password: apppass
      {{- end }}

    ## ── Primary ────────────────────────────────────────────────
    primary:
      {{- if .values.custom_config }}
      configuration: |-
        {{ .values.custom_config | nindent 8 }}
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if .infra.overrides }}
        {{- if .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}
        {{- end }}

      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
        accessModes:
          - ReadWriteOnce

      {{- if .values.init_scripts }}
      initdb:
        scripts:
          {{- range $name, $sql := .values.init_scripts }}
          {{ $name }}: |
            {{ $sql | nindent 12 }}
          {{- end }}
      {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- if .infra.overrides.affinity }}
      affinity: {{ toJson .infra.overrides.affinity }}
      {{- end }}
      {{- if .infra.overrides.service_type }}
      service:
        type: "{{ .infra.overrides.service_type }}"
      {{- end }}
      {{- end }}

    ## ── Read replicas (HA) ─────────────────────────────────────
    {{- if and .infra.ha.enabled (gt (int .infra.ha.read_replicas) 0) }}
    readReplicas:
      replicaCount: {{ .infra.ha.read_replicas }}
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
    {{- end }}

    ## ── Metrics ────────────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.metrics }}
    metrics:
      enabled: true
      {{- if .infra.overrides.metrics.image }}
      image:
        {{- range $k, $v := .infra.overrides.metrics.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/postgresql
      version: 18.7.13
      digest: sha256:50857ceb77d4ca9fb37d866c8fef718a5cfaef6cb0be8e397511a917591a9146
      manifestDigest: sha256:7da9adcf5a0e0ae2cfbe784d789705e737eb97d226026e9ad366bfc927436640
