apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: external-secrets
  version: 1.0.0
  license: Apache-2.0
  description: >
    external-secrets operator on Kubernetes via the official external-secrets
    Helm chart (external-secrets/external-secrets). The chart deploys the
    controller that reconciles ExternalSecret resources and synchronizes secret
    material from external secret-management systems into native Kubernetes
    Secrets, a webhook that validates and defaults external-secrets' custom
    resources, and a certificate controller that manages the webhook's serving
    certificate, together with their RBAC, the webhook Service, and the
    admission-webhook configurations. When the Component's install_crds value is
    on, the chart also installs the external-secrets CustomResourceDefinitions.
    The three container images share one repository; the chart defaults each tag
    to its appVersion, which this Recipe re-pins explicitly for reproducible
    renders. The bundled provider subchart is off, so a single coherent operator
    renders with no foreign datastore, cache, or broker. Default chart version in
    source.version; override via infra.source_version. external-secrets is
    distributed under the Apache-2.0 license. provides publishes the pod label,
    port name and path a scraper discovers the three processes' metrics by.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/external-secrets:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://ghcr.io/external-secrets/charts/external-secrets
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"2.7.0\" }}"

  # The metrics keys say where a scraper finds the controller's, the webhook's
  # and the certificate controller's own metrics: /metrics on a container port
  # each pod names metrics, which the chart declares whatever its metrics
  # Service switches say and puts on no Service by default. The chart labels
  # every pod of the release with app.kubernetes.io/instance set to the release
  # name, which the helm provider derives as the rendered name, so that one
  # label selects all three. The label and the port name are the chart's, read
  # from its 2.7.0 templates, and move with the chart like every other detail
  # here.
  provides:
    metrics_pod_selector: "app.kubernetes.io/instance={{ .context.rendered_name }}"
    metrics_pod_port: "metrics"
    metrics_path: "/metrics"

  # This Recipe reads from infra.overrides:
  #   controller_image     - map[string]string (top-level image.* fields; overrides the tag pin)
  #   webhook_image        - map[string]string (webhook.image.* fields; overrides the tag pin)
  #   certcontroller_image - map[string]string (certController.image.* fields; overrides the tag pin)
  #   requests             - { cpu: string, memory: string } (resource requests, applied to every workload)
  #   nodeSelector         - map[string]string (applied to every workload)
  #   tolerations          - []object (applied to every workload)
  valuesMapping: |
    ## ── CRD installation (Developer intent) ────────────────────
    ## Installs the external-secrets custom resource definitions with the
    ## release when on. Turn off when the CRDs are managed out of band.
    installCRDs: {{ .values.install_crds }}

    ## ── Controller ─────────────────────────────────────────────
    ## Reconciles ExternalSecret resources and syncs external material into
    ## Kubernetes Secrets. The chart defaults the tag to its appVersion; pin
    ## explicitly for a reproducible render. Override the whole image block via
    ## infra.overrides.controller_image.
    image:
      {{- if and .infra.overrides .infra.overrides.controller_image }}
      {{- range $k, $v := .infra.overrides.controller_image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      repository: ghcr.io/external-secrets/external-secrets
      tag: "v2.7.0"
      {{- end }}

    ## ── Controller resources ───────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Controller scheduling overrides ────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

    ## ── Webhook ────────────────────────────────────────────────
    ## Validates and defaults external-secrets' custom resources.
    webhook:
      image:
        {{- if and .infra.overrides .infra.overrides.webhook_image }}
        {{- range $k, $v := .infra.overrides.webhook_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: ghcr.io/external-secrets/external-secrets
        tag: "v2.7.0"
        {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── Certificate controller ─────────────────────────────────
    ## Manages the webhook's serving certificate.
    certController:
      image:
        {{- if and .infra.overrides .infra.overrides.certcontroller_image }}
        {{- range $k, $v := .infra.overrides.certcontroller_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        repository: ghcr.io/external-secrets/external-secrets
        tag: "v2.7.0"
        {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}
