apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: apisix
  version: 1.0.0
  license: Apache-2.0
  description: >
    Apache APISIX on Kubernetes via the helm provider's Workload synthesis (a
    stateless Deployment plus a ClusterIP Service on the proxy port), running
    the official upstream image (no external Helm chart). APISIX holds no local
    state — the etcd store is the system of record — so it renders stateless.
    Its config.yaml, carrying the connection composed from the `etcd`
    uses-edge, the static Admin API key and the Admin API port, is mounted from
    a ConfigMap as a single file, so it masks none of the files APISIX writes
    beside it at startup.

    The Admin API is reachable only from inside the cluster — no Service
    publishes its port — and is authenticated by the static `admin_key`, but
    its client allowlist, `allow_admin` in that config.yaml, admits every
    address: what holds it in-cluster is the cluster boundary rather than the
    list, so narrow it wherever the admin port is routable from outside the
    cluster.

    Reach for this realization where the build must complete with nothing
    fetched, or where no chart repository is reachable from it; reach for
    `apisix-chart`, which renders the project's own chart, where the gateway's
    configuration is expected to follow the product — that realization
    assembles the whole configuration from named settings rather than from the
    hand-written file this one carries. provides.host is the bare in-cluster
    Service name; a consumer in another namespace qualifies it on its own side.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/gateway/apisix:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side. Carrying no namespace,
  # the name keeps the recipe independent of where it is deployed.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.http_port }}"
    protocol: "http"
  # config.yaml carries APISIX's runtime configuration: the proxy listen port,
  # the static Admin API key and listen port, and the etcd configuration-store
  # host composed from the `etcd` uses-edge (.context.inject.env). It is emitted
  # as a ConfigMap and mounted as a single file into the container's conf
  # directory via subPath, so it does not mask the files APISIX writes alongside
  # it at startup.
  artifacts:
    config-configmap.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-config
      data:
        config.yaml: |
          apisix:
            node_listen: {{ .infra.http_port }}
          deployment:
            role: traditional
            role_traditional:
              config_provider: etcd
            admin:
              {{- /* The Admin API's client allowlist, and 0.0.0.0/0 admits
                     every address. What stands in front of the API is the
                     static key below and the cluster boundary: no Service
                     publishes the admin port, so a caller reaches the API only
                     from inside the cluster. That assumption is the one to
                     check — wherever the admin port is routable from outside
                     the cluster, replace this entry with the ranges that should
                     hold it. It is open here so the Recipe renders a gateway an
                     operator can administer without first finding this setting,
                     and the chart-backed realization admits the same range. */}}
              allow_admin:
                - 0.0.0.0/0
              admin_key:
                - name: admin
                  key: {{ .values.admin_key }}
                  role: admin
              admin_listen:
                ip: 0.0.0.0
                port: {{ .infra.admin_port }}
            etcd:
              host:
                - "http://{{ .context.inject.env.APISIX_ETCD_HOST }}:{{ .context.inject.env.APISIX_ETCD_PORT }}"
              prefix: "/apisix"
              timeout: 30
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # APISIX holds no durable state — etcd is the system of record — so the
    # default stateless form (a Deployment on the helm provider) is correct: no
    # form: stateful, no persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "apache/apisix:{{ .infra.engine_version }}"
        # The etcd identity resolved from the `etcd` uses-edge arrives on the
        # inject pipe (.context.inject.env) and is written into config.yaml. The
        # config is mounted as a single file via subPath so APISIX's startup
        # writes into the same conf directory (for example nginx.conf) are not
        # masked.
        ports:
          http: {{ .infra.http_port }}
          admin: {{ .infra.admin_port }}
        # APISIX reports readiness at /status/ready on a separate status server,
        # which listens on loopback only unless configured otherwise. An http
        # probe is sent to the container port whose name sorts first, which here
        # is `admin`, and the image carries no HTTP client to run the check from
        # inside the container. So the probe is the one the product's own chart
        # gives a gateway reading its configuration from etcd: a TCP connection
        # to the proxy port, with that chart's timing. The chart declares no
        # liveness probe, and none is declared here.
        health:
          ready:
            tcp: {{ .infra.http_port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: config
            path: /usr/local/apisix/conf/config.yaml
            subPath: config.yaml
    volumes:
      config:
        configmap:
          source: "{{ .context.instance_id }}-config"
    services:
      default:
        type: ClusterIP
        ports:
          http: {{ .infra.http_port }}
