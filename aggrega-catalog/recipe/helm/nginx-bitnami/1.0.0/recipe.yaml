apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: nginx-bitnami
  version: 1.0.0
  description: >
    NGINX reverse-proxy gateway via the Bitnami NGINX Helm chart
    (bitnami/nginx). The upstream host and port resolved from the `upstream`
    uses-edge arrive on the injection context and are rendered into the chart's
    serverBlock as the proxy_pass target, so the chart's NGINX forwards matching
    requests to that upstream. TLS is disabled by default for a plain HTTP
    reverse proxy; supply a certificate secret through infra.overrides to enable
    it. The chart floats its image tag at `latest`, so the Recipe pins the NGINX
    image by digest for reproducible renders. Default chart version in
    source.version; override via infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/gateway/nginx:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/nginx
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"25.0.13\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "http"

  # This Recipe reads from infra.overrides:
  #   image        - map[string]string (chart image.* fields; overrides the digest pin)
  #   service_type - string (chart service.type)
  #   requests     - { cpu: string, memory: string } (resource requests)
  #   nodeSelector - map[string]string
  #   tolerations  - []object
  #   tls          - { existingSecret: string } (enables chart TLS from an existing secret)
  valuesMapping: |
    ## ── Image pin ──────────────────────────────────────────────
    ## The chart floats image.tag at `latest`; pin by digest for a
    ## reproducible render. Override the whole block via infra.overrides.image.
    {{- if and .infra.overrides .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      digest: "sha256:d3264032c265c1424b25e5a87c8394b71d651f25cb5007134e0ed0c75922f66a"
    {{- end }}

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      http: {{ .infra.port }}
    service:
      ports:
        http: {{ .infra.port }}
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- end }}

    ## ── Reverse-proxy server block (injected upstream) ─────────
    ## The upstream host:port resolved from the `upstream` uses-edge is written
    ## into the chart's serverBlock as the proxy_pass target.
    serverBlock: |-
      server {
        listen 0.0.0.0:{{ .infra.port }};
        location {{ .values.upstream_path }} {
          proxy_pass http://{{ .context.inject.env.NGINX_UPSTREAM_HOST }}:{{ .context.inject.env.NGINX_UPSTREAM_PORT }};
        }
      }

    ## ── TLS (off by default; opt-in via an existing certificate secret) ──
    {{- if and .infra.overrides .infra.overrides.tls .infra.overrides.tls.existingSecret }}
    tls:
      enabled: true
      autoGenerated: false
      existingSecret: "{{ .infra.overrides.tls.existingSecret }}"
    {{- else }}
    tls:
      enabled: false
    {{- end }}

    ## ── Resources ──────────────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/nginx
      version: 25.0.13
      digest: sha256:a2057cbd959df9a0caaaf2d792facddab8569a2831b2459fe0c1e06e28258540
      manifestDigest: sha256:4391bbf6720e13f62dfcd4d3d64e408edfcddc5b4962d22dbb6ef56518963c89
