apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: adminer
  version: 1.0.0
  description: >
    Adminer on Kubernetes, rendered offline as plain manifests by the helm
    provider's Workload synthesis. The Workload becomes a Deployment and a
    NodePort Service so the UI is reachable. The database host resolved from
    the `databases` uses-edge arrives on .context.inject.env and renders as
    ADMINER_DEFAULT_SERVER.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: helm
  implements: core/devtool/adminer:1.0.0

  # provides.host is the name of the Service that serves the UI: the helm
  # provider names the synthesized Service "<rendered_name>-<service-key>",
  # here "<rendered_name>-default". The image serves Adminer on 8080, and
  # nothing here moves that listener, so the container port and both probes
  # stay on 8080 whatever port an operator sets. infra.port is the Service's
  # port, which targets the container port by its name, so provides.port, the
  # port an in-cluster consumer reaches the Service on, is infra.port.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ optional .infra `port` 8080 }}"

  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: "adminer:4"
        variables:
          ADMINER_DESIGN: "{{ .values.design }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v | replace "\\" "\\\\" | replace "\"" "\\\"" }}"
          {{- end }}
        ports:
          http: 8080
        # Adminer documents no health endpoint, so both probes open a TCP
        # connection to the port the image serves, which the Service targets.
        # No start-up time is documented; the liveness probe waits 10 s before
        # its first check.
        health:
          ready:
            tcp: 8080
          live:
            tcp: 8080
            initialDelaySeconds: 10
    services:
      default:
        type: NodePort
        ports:
          http: {{ optional .infra `port` 8080 }}
