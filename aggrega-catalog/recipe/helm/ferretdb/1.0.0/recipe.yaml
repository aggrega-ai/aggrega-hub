apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: ferretdb
  version: 1.0.0
  license: Apache-2.0
  description: >
    A MongoDB-wire-compatible document-database proxy on Kubernetes via the helm
    provider's Workload synthesis. The proxy process holds no local state, so it
    renders a stateless Deployment plus a ClusterIP Service on the wire port. The
    PostgreSQL backend identity resolved from the `backend` uses-edge (host,
    port, user, database) arrives on .context.inject.env and is composed into
    the proxy's PostgreSQL connection URL; the URL is rendered password-free and
    the password is supplied separately on the standard libpq PGPASSWORD
    environment variable, which the driver merges into the connection. provides.host
    is the bare, self-contained in-cluster service name of the synthesized
    Service — it carries no namespace, so the recipe is independent of where it
    is deployed. A consumer in another namespace qualifies the host with the
    target namespace on its own side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/ferretdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "mongodb"
  workload: |
    {{- /* The alias of the `backend` connection carrying a credential, or empty. */ -}}
    {{- $backendCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}
    {{- $backendCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    # A wire proxy holds no durable state, so the default stateless form (a
    # Deployment on the helm provider) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "ghcr.io/ferretdb/ferretdb:{{ .infra.engine_version }}"
        # The backend identity resolved from the `backend` uses-edge arrives on
        # the inject pipe (.context.inject.env) and is composed into the
        # PostgreSQL connection URL. The URL is rendered password-free; the
        # backend password is delivered separately on PGPASSWORD, wired through
        # the optional credential on the `backend` connection (env secretKeyRef
        # when attached, inline development default when unattached).
        #
        # FERRETDB_DEBUG_ADDR binds the proxy's HTTP handlers, which serve its
        # readiness and liveness probes, on every interface. The binary's own
        # default binds them to the loopback address, which a probe sent to the
        # pod cannot reach; setting it here keeps the probes below working
        # whatever default an image of another version carries.
        variables:
          FERRETDB_LISTEN_ADDR: ":{{ .infra.port }}"
          FERRETDB_DEBUG_ADDR: ":8088"
          FERRETDB_POSTGRESQL_URL: "postgres://{{ .context.inject.env.FERRETDB_PG_USER }}@{{ .context.inject.env.FERRETDB_PG_HOST }}:{{ .context.inject.env.FERRETDB_PG_PORT }}/{{ .context.inject.env.FERRETDB_PG_DB }}"
    {{- if not $backendCredential }}
          PGPASSWORD: apppass
    {{- end }}
    {{- with $backendCredential }}
        attachments:
          PGPASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
        # FerretDB serves /debug/readyz — a MongoDB-protocol ping, which also
        # proves the PostgreSQL connection and the DocumentDB extension — and
        # /debug/livez — ready to accept client connections, the PostgreSQL
        # connection unchecked — on its HTTP handler port. An http probe is sent
        # to the container port whose name sorts first, so the handler port is
        # declared as `debug`, which sorts before `tcp`; the Service keeps
        # forwarding to the wire port it names and publishes no handler port. No
        # start-up time is documented; the liveness probe waits 10 s before its
        # first check.
        ports:
          debug: 8088
          tcp: {{ .infra.port }}
        health:
          ready:
            http: /debug/readyz
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            http: /debug/livez
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
