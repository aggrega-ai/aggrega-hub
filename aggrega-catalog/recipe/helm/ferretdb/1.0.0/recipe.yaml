apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: ferretdb
  version: 1.0.0
  license: Apache-2.0
  description: >
    A MongoDB-wire-compatible document-database proxy on Kubernetes via the helm
    provider's Workload synthesis. The proxy process holds no local state, so it
    renders a stateless Deployment plus a ClusterIP Service on the wire port. The
    PostgreSQL backend identity resolved from the `backend` uses-edge (host,
    port, user, database) arrives on .context.inject.env and is composed into
    the proxy's PostgreSQL connection URL; the URL is rendered password-free and
    the password is supplied separately on the standard libpq PGPASSWORD
    environment variable, which the driver merges into the connection. provides.host
    is the bare, self-contained in-cluster service name of the synthesized
    Service — it carries no namespace, so the recipe is independent of where it
    is deployed. A consumer in another namespace qualifies the host with the
    target namespace on its own side (caller-side routing).

    FerretDB's debug listener, port 8088, checks no caller and serves
    /debug/pprof, /debug/vars, /debug/archive and /debug/graphs beside its
    metrics at /debug/metrics. While `values.metrics_enabled` is false the
    Recipe binds it to the pod's loopback address, which no other pod reaches,
    and provides.metrics_endpoint is empty. True, it binds it on every
    interface of the pod, its port joins the ClusterIP Service, and
    provides.metrics_endpoint publishes its /debug/metrics there, so every
    in-cluster caller that reaches the pod reaches the whole listener. Neither
    probe uses it: readiness runs `ferretdb ping` inside the container, and
    liveness checks that the wire port accepts connections.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/ferretdb:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  #
  # metrics_endpoint is the address FerretDB serves its own metrics at while
  # values.metrics_enabled is true: /debug/metrics on its debug listener, port
  # 8088, of the same ClusterIP Service, which carries that port only then. It
  # is empty while the value is false, when the listener is on the pod's
  # loopback address.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    protocol: "mongodb"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-default:8088/debug/metrics{{ end }}"
  workload: |
    {{- /* The alias of the `backend` connection carrying a credential, or empty. */ -}}
    {{- $backendCredential := "" -}}
    {{- range $alias, $edge := .context.uses -}}
    {{- if and (eq $edge.socket "backend") (hasKey (default dict $edge.features) "credential") -}}
    {{- $backendCredential = $alias -}}
    {{- end -}}
    {{- end -}}
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "FERRETDB_PG_HOST" "host" "FERRETDB_PG_PORT" "port" "FERRETDB_PG_USER" "user" "FERRETDB_PG_DB" "database") -}}
    {{- $required := list "backend" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/datastore/ferretdb %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # A wire proxy holds no durable state, so the default stateless form (a
    # Deployment on the helm provider) is correct — no form: stateful, no
    # persistentTemplate volume, no PVC.
    replicas: 1
    containers:
      main:
        image: "ghcr.io/ferretdb/ferretdb:{{ .infra.engine_version }}"
        # The backend identity resolved from the `backend` uses-edge arrives on
        # the inject pipe (.context.inject.env) and is composed into the
        # PostgreSQL connection URL. The URL is rendered password-free; the
        # backend password is delivered separately on PGPASSWORD, wired through
        # the optional credential on the `backend` connection (env secretKeyRef
        # when attached, inline development default when unattached).
        #
        # FERRETDB_DEBUG_ADDR places FerretDB's debug listener, port 8088. It
        # serves the metrics at /debug/metrics and, checking no caller,
        # /debug/pprof, which takes a CPU profile or an execution trace on
        # request, /debug/vars, /debug/archive and /debug/graphs. The image
        # sets the variable to every interface, so the Recipe always writes it:
        # the pod's loopback address while values.metrics_enabled is false,
        # where no other pod reaches the listener, and every interface while it
        # is true, so the published metrics address reaches it — and with it
        # every caller that reaches the pod's address. No probe below uses it.
        variables:
          FERRETDB_LISTEN_ADDR: ":{{ .infra.port }}"
          FERRETDB_DEBUG_ADDR: "{{ if .values.metrics_enabled }}:8088{{ else }}127.0.0.1:8088{{ end }}"
          FERRETDB_POSTGRESQL_URL: "postgres://{{ $env.FERRETDB_PG_USER }}@{{ $env.FERRETDB_PG_HOST }}:{{ $env.FERRETDB_PG_PORT }}/{{ $env.FERRETDB_PG_DB }}"
    {{- if not $backendCredential }}
          PGPASSWORD: apppass
    {{- end }}
    {{- with $backendCredential }}
        attachments:
          PGPASSWORD:
            connection: "{{ . }}"
            from: credential
            as: env
    {{- end }}
        # Readiness runs `ferretdb ping` inside the container, the command the
        # image's own healthcheck runs and which FerretDB documents as behaving
        # like its readiness probe: a MongoDB-protocol ping to the wire port,
        # read from FERRETDB_LISTEN_ADDR, which also proves the PostgreSQL
        # connection and the DocumentDB extension. The image carries no shell,
        # curl or nc, so the probe is the image's own binary. Liveness checks
        # that the wire port accepts connections, which is what FerretDB's own
        # liveness probe reports — ready to accept client connections, the
        # PostgreSQL connection unchecked — so a backend outage takes the proxy
        # out of its Service without restarting it. The debug port is declared
        # only while values.metrics_enabled is true, when the listener is bound
        # where a caller reaches it, and the Service then forwards it under the
        # same name `debug`, so the published metrics address reaches it. No
        # start-up time is documented; the liveness probe waits 10 s before its
        # first check.
        ports:
    {{- if .values.metrics_enabled }}
          debug: 8088
    {{- end }}
          tcp: {{ .infra.port }}
        health:
          ready:
            exec:
              - /ferretdb
              - ping
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            tcp: {{ .infra.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
    {{- if .values.metrics_enabled }}
          debug: 8088
    {{- end }}
