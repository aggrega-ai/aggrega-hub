apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: keycloak-chart
  version: 1.0.0
  license: Apache-2.0
  description: >
    Keycloak, a database-backed identity and access-management server, on
    Kubernetes via the codecentric Keycloak.X Helm chart, served from that
    project's HTTPS chart repository. What it encodes that a hand-assembled
    workload does not is the cluster-forming configuration: a StatefulSet with
    ordered pod management behind a headless Service, the database-backed cache
    stack the server replicates sessions over, and probes aimed at the server's
    own management endpoint. The chart's Ingress, Route, autoscaler, network
    policy and monitoring resources are left switched off, and the server image
    and the chart version are pinned.

    Reach for this realization where a chart repository is reachable at build
    time and the server will be run as more than one replica; reach for
    `keycloak`, the workload-synthesis realization, where the build must
    complete with nothing fetched.

    With `infra.external_base_url` set, the server's hostname is that full URL,
    delivered through the chart's `extraEnv`, so the issuer and every address
    the server advertises follow it; unset, the server takes its address from
    each incoming request. The chart serves the server under the path `/auth`,
    so an ingress in front of it maps the address's path onto that one.

    The chart serves the server's metrics, at /auth/metrics on the management
    port its console Service carries, whatever `values.metrics_enabled` says;
    that port checks no caller. True publishes the address as
    provides.metrics_endpoint; false leaves that key empty.

    That Service, and the management port with it, stays inside the cluster
    whatever `infra.overrides.service_type` says; LoadBalancer or NodePort
    publishes the console alone on `<rendered_name>-external`.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/keycloak:1.0.0

  source:
    kind: helm-https-chart
    url: https://codecentric.github.io/helm-charts
    chart: keycloakx
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"7.3.2\" }}"

  # provides.host is the name of the Service carrying the account console, the
  # token endpoints and the admin API, which is what the Component's provides
  # contract promises.
  #
  # 🔴 It is NOT the bare rendered name. The valuesMapping below pins the chart's
  # fullnameOverride to the rendered name, the release name the helm provider
  # gives the chart, which spells the Component's name in the alphabet a
  # Kubernetes name allows, and the chart then suffixes that name per resource:
  # the console Service is "<rendered_name>-http" and the Service the server's
  # own members find each other through is "<rendered_name>-headless". Nothing is
  # named by the bare pinned name except the StatefulSet and the ServiceAccount,
  # so publishing the bare rendered name would publish an address no Service
  # answers to, and publishing the headless one would publish the members'
  # rendezvous point rather than the endpoint a consumer redeems tokens against.
  # Both suffixes were read from a render of the chart, not assumed.
  #
  # port follows the Service port the operator set; the server process itself
  # always listens on the chart's fixed 8080 and the Service forwards to it.
  #
  # provides.host is the bare, self-contained in-cluster Service name — it
  # carries no namespace, so the Recipe is independent of where it is deployed.
  # A same-namespace consumer reaches the console under this name directly; a
  # consumer in another namespace qualifies the host with the target namespace
  # on its own side (caller-side routing).
  #
  # It names that in-cluster Service whatever infra.overrides.service_type
  # says. The "<rendered_name>-external" Service this Recipe emits for an
  # exposed console is for clients outside the cluster, and is not published.
  #
  # metrics_endpoint is where the chart serves the server's own metrics, while
  # values.metrics_enabled is true: /metrics under the path the chart serves the
  # server at, /auth, which this Recipe leaves at the chart's default, on the
  # management port 9000 the chart writes as a literal into the same console
  # Service provides.host names. The port is written as that literal too; the
  # halt on infra.management_port below keeps the value from saying otherwise.
  # It is empty while the value is false, although the chart keeps its metrics
  # on and that port on the Service either way. It is spelled out in full on
  # purpose: a provides entry cannot read another.
  provides:
    host: "{{ .context.rendered_name }}-http"
    port: "{{ .infra.http_port }}"
    protocol: "http"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}-http:9000/auth/metrics{{ end }}"

  # The server reads a file in its import directory as a realm only when the
  # file is named "<realm>-realm.json", so an entry named any other way would be
  # mounted and never imported. Halt on it here, where the fix is renaming one
  # key in the Aggregate.
  #
  # infra.overrides.service_type says how the console is exposed, and this
  # Recipe acts on three values only: ClusterIP, LoadBalancer and NodePort.
  # Any other would otherwise be dropped without a word, so it halts here,
  # where the fix is one value in the Release. A number written there, 0
  # included, halts too: an assertion reads a 0 as empty, so the key's presence
  # is tested.
  assertions:
    realm_import_file_names: >-
      {{- range $name, $_ := optional .values "realm_imports" dict -}}
      {{- if not (hasSuffix "-realm.json" $name) -}}
      {{- fail (printf "values.realm_imports entry %q is not named <realm>-realm.json, so the server would never import it; name each entry after the realm it defines, for example demo-realm.json for the realm demo" $name) -}}
      {{- end -}}
      {{- end -}}
    service_type_accepted: >-
      {{- $o := optional .infra "overrides" dict | default dict -}}
      {{- $raw := optional $o "service_type" "" -}}
      {{- $type := "" -}}
      {{- if or $raw (and (hasKey $o "service_type") (has (kindOf $raw) (list "int64" "float64"))) }}{{ $type = toString $raw }}{{ end -}}
      {{- if and $type (not (has $type (list "ClusterIP" "LoadBalancer" "NodePort"))) -}}
      {{- fail (printf "infra.overrides.service_type is %q, but this realization exposes the console as ClusterIP, LoadBalancer or NodePort only; set one of those, or leave it unset for ClusterIP" $type) -}}
      {{- end -}}

  # The realms the server imports on startup, one file per values.realm_imports
  # entry. The chart renders no ConfigMap of its own, so this Recipe emits it
  # beside the chart, and the chart's extraVolumes and extraVolumeMounts below
  # mount it whole at the server's import directory. Presence-guarded on the
  # value: unset, the entry renders empty and no ConfigMap is emitted. It is
  # named from the same rendered name as the chart's own objects, and the value
  # mapping below mounts it by that name.
  #
  # The console, exposed outside the cluster without the management port. The
  # chart's console Service always carries that port, which checks no caller,
  # and no chart value takes it off, so that Service stays ClusterIP; with
  # infra.overrides.service_type LoadBalancer or NodePort this Recipe emits a
  # second Service of that type carrying the console's http port alone — the
  # port and target the chart's console Service gives it — and nothing else.
  # It selects the server's pods by the chart's own selector labels: the
  # chart's name, keycloakx, since this Recipe sets no nameOverride, and the
  # release name, which is the rendered name. Both were read from a render of
  # the chart, not assumed. It is named from the rendered name as the chart's
  # objects are, and placed in the namespace the chart is rendered against:
  # the one the Release, or else the Aggregate, declares through the aggrega.ai/namespace annotation,
  # or `default` where it declares none. The helm provider places no artifact
  # in a namespace itself, so the Service writes its own. With ClusterIP, or
  # no override, nothing is emitted.
  artifacts:
    realm-import-configmap.yaml: |
      {{- if .values.realm_imports -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-realm-import
      data:
      {{- range $name, $content := .values.realm_imports }}
        {{ $name }}: |
      {{ $content | trimSuffix "\n" | indent 4 }}
      {{- end }}
      {{- end }}
    console-external-service.yaml: |
      {{- $type := optional (optional .infra "overrides" dict | default dict) "service_type" "" | default "" | toString -}}
      {{- if has $type (list "LoadBalancer" "NodePort") -}}
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .context.rendered_name }}-external
        namespace: "{{ optional (optional (default dict .context.annotations) "release" dict) "aggrega.ai/namespace" (optional (optional (default dict .context.annotations) "aggregate" dict) "aggrega.ai/namespace" "") | default "default" }}"
      spec:
        type: {{ $type }}
        ports:
          - name: http
            port: {{ .infra.http_port }}
            targetPort: http
            protocol: TCP
        selector:
          app.kubernetes.io/name: keycloakx
          app.kubernetes.io/instance: {{ .context.rendered_name }}
      {{- end }}

  # This Recipe reads from infra.overrides:
  #   image        - map[string]string (image.* fields; overrides the tag pin)
  #   service_type - string (ClusterIP, LoadBalancer or NodePort, default
  #                  ClusterIP; how the console is exposed. The chart's console
  #                  Service stays ClusterIP whatever it says; LoadBalancer or
  #                  NodePort adds <rendered_name>-external, of that type,
  #                  carrying the console port alone. Any other value halts)
  #   requests     - { cpu: string, memory: string } (server resource requests)
  #   nodeSelector - map[string]string (pod scheduling)
  #   tolerations  - []object (pod scheduling)
  #
  # The chart is configured for the shape this Component describes: a server
  # whose realms, clients and users live in the PostgreSQL backend wired on the
  # `backend` uses-socket, with the chart's Ingress, OpenShift Route, HTTPRoute,
  # autoscaler, network policy and Prometheus-operator resources all left
  # switched off, because the Component describes none of them. Under this
  # configuration the chart renders a StatefulSet for the server, a
  # ServiceAccount, a ClusterIP Service carrying the account console and the
  # token endpoints, and a headless Service the server's own members find each
  # other through. The cluster-forming configuration it encodes also covers the
  # proxy header mode the server trusts when it sits behind one, and liveness,
  # readiness and startup probes aimed at its management endpoint. The server
  # image is pinned to a resolvable release tag for reproducible renders.
  #
  # With `values.realm_imports` set, each entry becomes a file in a ConfigMap
  # this Recipe emits beside the chart, mounted at the server's import directory
  # through the chart's `extraVolumes` and `extraVolumeMounts`, and the chart's
  # `args` start the server with its realm import switched on; unset, none of
  # those values is set and no ConfigMap is emitted.
  #
  # The chart switches the server's metrics on by default (its `metrics.enabled`)
  # and its console Service always carries the management port they are served
  # on. With `values.metrics_enabled` true the mapping writes `metrics.enabled:
  # true` out, so a chart version moving that default cannot leave the published
  # address answering nothing. False writes nothing and leaves the chart's
  # default standing, rather than switching the metrics off: the chart renders
  # its readiness probe only while its metrics are on, so switching them off
  # would drop the probe with them.
  valuesMapping: |
    {{- /*
      The connection variables this Recipe reads off the inject pipe, under the
      socket whose edge delivers them, each beside the provides key the edge's
      inject block names it from. The pipe is read as a map, and every read of
      these variables below goes through it, so a variable nothing delivered is
      told apart from one delivered empty: an edge on one of these sockets
      leaving any of its variables missing halts the build, naming the edge, the
      variables and the inject block to write, rather than rendering a
      connection setting with an empty value. A socket in $required is read
      whether or not anything is wired to it, so leaving it empty halts too.
    */ -}}
    {{- $env := optional (default dict .context.inject) "env" dict -}}
    {{- $reads := dict "backend" (dict "KC_DB_URL_HOST" "host" "KC_DB_URL_PORT" "port" "KC_DB_URL_DATABASE" "database" "KC_DB_USERNAME" "user") -}}
    {{- $required := list "backend" -}}
    {{- $gaps := list }}{{ $wired := list -}}
    {{- range $alias, $edge := .context.uses }}{{ with get $reads $edge.socket -}}
    {{- $wired = append $wired $edge.socket }}{{ $missing := list }}{{ $shape := list -}}
    {{- range $var, $from := . }}{{ if not (hasKey $env $var) }}{{ $missing = append $missing $var }}{{ end }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- if $missing }}{{ $gaps = append $gaps (printf "the edge %q on its %s socket delivers no %s, so give that edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $alias $edge.socket (join " or " $missing) (join ", " $shape)) }}{{ end -}}
    {{- end }}{{ end -}}
    {{- range $socket := $required }}{{ if not (has $socket $wired) -}}
    {{- $vars := list }}{{ $shape := list }}{{ range $var, $from := get $reads $socket }}{{ $vars = append $vars $var }}{{ $shape = append $shape (printf "{ in: %s, from: %s }" $var $from) }}{{ end -}}
    {{- $gaps = append $gaps (printf "nothing is wired to its %s socket to deliver %s, so wire one and give its edge an inject block naming each from its target's provides — inject: { env: [ %s ] }" $socket (join " and " $vars) (join ", " $shape)) -}}
    {{- end }}{{ end -}}
    {{- if $gaps }}{{ fail (printf "core/security/keycloak %q composes its connection settings from variables its edges deliver on its inject pipe, but %s" .context.instance_id (join "; and " $gaps)) }}{{ end -}}
    ## ── The management port this chart cannot move ─────────────
    ## Keycloak serves health and metrics on a management port the chart writes
    ## as a literal into both the container and the console Service, so this
    ## realization has no way to honor a value moved off it. Halt rather than
    ## render a port the operator did not ask for and never find out.
    {{- if ne (int .infra.management_port) 9000 -}}
    {{- fail "the Keycloak chart serves health and metrics on the server's fixed management port 9000 and this realization cannot move it; leave infra.management_port at its default on this realization" -}}
    {{- end -}}

    ## ── The configuration backend edge ─────────────────────────
    ## The server keeps its realms, clients and users here. The edge is required,
    ## so it is always resolved by the time this template runs. Its host, port,
    ## user and database arrive on the inject pipe and are read above; the edge
    ## itself is read for the credential it carries.
    {{- $backend := dict }}
    {{- range $alias, $edge := .context.uses }}
      {{- if eq $edge.socket "backend" }}
        {{- $backend = $edge }}
      {{- end }}
    {{- end }}

    ## ── Pin the chart's resource names to the rendered name ────
    ## Names the console Service "<rendered_name>-http", matching provides.host,
    ## and the members' headless Service "<rendered_name>-headless". Read the
    ## comment above provides for why the published name carries a suffix.
    fullnameOverride: "{{ .context.rendered_name }}"

    ## ── Server image pin ───────────────────────────────────────
    ## The chart's own default tag tracks whatever the chart's application
    ## version becomes, which makes the render move whenever the chart moves;
    ## pin it explicitly instead. The repository is the chart's own default, so
    ## the image this realization runs is the one its chart is tested against,
    ## and it is why the Component's engine_version says the chart-backed
    ## realization pins its own tag. Override the whole block via
    ## infra.overrides.image.
    image:
      {{- if and .infra.overrides .infra.overrides.image }}
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
      {{- else }}
      repository: quay.io/keycloak/keycloak
      tag: "26.7.4"
      {{- end }}

    ## ── Console and token-endpoint Service ─────────────────────
    ## infra.http_port sets the Service port. The server process listens on the
    ## chart's fixed 8080 and the Service forwards to it, so an operator moving
    ## the port moves the published address and not the listener. The chart also
    ## offers an HTTPS Service port; the Component publishes `http` and no TLS
    ## material is configured here, so that port is switched off rather than left
    ## advertising a listener the server does not serve.
    ##
    ## 🔴 Switching it off is spelled as a zero rather than as an empty value.
    ## The chart types this key as an integer in its own value schema, so an
    ## empty string is refused outright; and a null is dropped when this overlay
    ## is merged over the chart's defaults, which leaves the chart's own 8443
    ## standing. A zero passes the schema and reads as absent to the chart's own
    ## test on the key. Established by rendering all three.
    ##
    ## The Service is always ClusterIP, whatever infra.overrides.service_type
    ## says: the chart writes the management port into it as well, so a type
    ## exposing it would expose that port too. An exposed console is the
    ## "<rendered_name>-external" Service this Recipe emits beside the chart.
    service:
      type: ClusterIP
      httpPort: {{ .infra.http_port }}
      httpsPort: 0
    {{- if .values.metrics_enabled }}

    ## ── The server's own metrics ───────────────────────────────
    ## On the management port the console Service carries, at /auth/metrics.
    metrics:
      enabled: true
    {{- end }}

    ## ── Backend connection ─────────────────────────────────────
    ## Composed from the `backend` edge's host, port, database and user, which
    ## arrive on the inject pipe under the variables the workload-synthesis
    ## realization reads too. The password is the one place the two credential
    ## shapes differ: with a credential on that connection, the chart is
    ## pointed at the existing secret BY NAME, so the material
    ## never appears in the rendered artifact; with none, the Component declares
    ## the slot optional, so an inline development default keeps the render
    ## working exactly as the workload-synthesis realization does.
    database:
      vendor: postgres
      hostname: "{{ $env.KC_DB_URL_HOST }}"
      port: {{ $env.KC_DB_URL_PORT }}
      database: "{{ $env.KC_DB_URL_DATABASE }}"
      username: "{{ $env.KC_DB_USERNAME }}"
      {{- if hasKey (default dict $backend.features) "credential" }}
      existingSecret: "{{ $backend.features.credential.provides.name }}"
      existingSecretKey: "{{ $backend.features.credential.provides.key }}"
      {{- else }}
      password: "apppass"
      {{- end }}

    ## ── Bootstrap admin account and hostname resolution ────────
    ## The chart carries no value of its own for either, so both are delivered
    ## through the extension point it does declare for additional environment.
    ## The admin account is seeded on first startup from the admin_user value and
    ## the optional `admin_password` credential slot — bound by name when
    ## attached, an inline development default when not, the same two shapes the
    ## workload-synthesis realization offers. While infra.external_base_url is
    ## unset, hostname resolution is left to the incoming request, so the server
    ## is self-contained with no real hostname configured, which is what the
    ## workload-synthesis realization does too. Set, KC_HOSTNAME carries it as a
    ## full URL — scheme, host, port and path — so the issuer, the discovery
    ## document and every link the server writes use that address rather than
    ## the request's, and the server ignores KC_HOSTNAME_STRICT whenever a
    ## hostname is configured.
    extraEnv: |
      - name: KC_HOSTNAME_STRICT
        value: "false"
      {{- with .infra.external_base_url }}
      - name: KC_HOSTNAME
        value: "{{ . }}"
      {{- end }}
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: "{{ .values.admin_user }}"
      {{- if hasKey (default dict .features) "admin_password" }}
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: "{{ .features.admin_password.provides.name }}"
            key: "{{ .features.admin_password.provides.key }}"
      {{- else }}
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: "admin"
      {{- end }}

    ## ── Server resources ───────────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Realm import on startup ────────────────────────────────
    ## Set only with values.realm_imports. extraVolumes and extraVolumeMounts
    ## mount the ConfigMap this Recipe emits at the server's import directory,
    ## and args starts the server with --import-realm, which imports every realm
    ## file there and skips a realm that already exists. The chart starts its
    ## pods one at a time, and a server does not report ready until its import
    ## has finished, so the first replica creates a realm and the rest find it
    ## already there.
    {{- if .values.realm_imports }}
    args:
      - start
      - --import-realm
    extraVolumes: |
      - name: realm-import
        configMap:
          name: "{{ .context.rendered_name }}-realm-import"
    extraVolumeMounts: |
      - name: realm-import
        mountPath: /opt/keycloak/data/import
        readOnly: true
    {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}
