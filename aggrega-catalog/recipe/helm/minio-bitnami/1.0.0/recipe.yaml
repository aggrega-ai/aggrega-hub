apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: minio-bitnami
  version: 1.0.0
  description: >
    MinIO S3-compatible object-storage server via the Bitnami MinIO Helm chart
    (bitnami/minio). MinIO stores objects on disk, so persistence is enabled and
    the data volume is sized from infra.storage. The chart is pinned to a single
    standalone server: mode is standalone and the separate MinIO Console
    application is disabled, so the chart renders exactly one workload of each
    kind. The root account is always present: its username is a developer value
    and its password is wired through the component's optional `root_password`
    slot. When a credential is attached its value arrives on the env pipe and is
    set as the chart's auth.rootPassword; when none is attached the Recipe
    supplies a deterministic development default, because the chart would
    otherwise generate a fresh random root password on every render and break
    deterministic output. The chart publishes a resolvable image tag for this
    appVersion; the Recipe pins that tag explicitly for a reproducible render.
    Default chart version in source.version; override via infra.source_version.
    The packaged MinIO server is AGPL-3.0.
  license: AGPL-3.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/storage/minio:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/minio
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"17.0.21\" }}"

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "s3"

  # This Recipe reads from infra.overrides:
  #   image         - map[string]string (chart image.* fields; overrides the tag pin)
  #   service_type  - string (chart service.type)
  #   requests      - { cpu: string, memory: string } (resource requests)
  #   storage_class - string (persistence storageClass for the data PVC)
  #   nodeSelector  - map[string]string
  #   tolerations   - []object
  valuesMapping: |
    ## ── Topology (completeness fence) ──────────────────────────
    ## Pin a single standalone server and disable the MinIO Console.
    ## The Console is a second, distinct application (its own Deployment,
    ## Service, NetworkPolicy and PodDisruptionBudget); leaving it enabled
    ## makes the chart render two workloads of several kinds. Standalone +
    ## console-disabled renders exactly one resource of every kind.
    mode: standalone
    console:
      enabled: false

    ## ── Image pin ──────────────────────────────────────────────
    ## The chart publishes a resolvable image tag for this appVersion;
    ## pin the same tag explicitly for a reproducible render. Override
    ## the whole block via infra.overrides.image.
    {{- if and .infra.overrides .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      registry: docker.io
      repository: bitnami/minio
      tag: "2025.7.23-debian-12-r3"
    {{- end }}

    ## ── Root credentials (optional credential slot) ────────────
    ## The MinIO root account is always present. The username is a developer
    ## value. When the optional `root_password` slot is filled its value
    ## arrives on the inject pipe and sets the root password; when unset the
    ## Recipe supplies a deterministic development default (the chart would
    ## otherwise generate a fresh random password on every render, which is
    ## non-deterministic).
    auth:
      rootUser: "{{ .values.root_user }}"
      {{- if and .context.inject.env .context.inject.env.MINIO_ROOT_PASSWORD }}
      rootPassword: "{{ .context.inject.env.MINIO_ROOT_PASSWORD }}"
      {{- else }}
      rootPassword: "dev-minio-root-change-me"
      {{- end }}

    ## ── Ports ──────────────────────────────────────────────────
    containerPorts:
      api: {{ .infra.port }}

    ## ── Resources ──────────────────────────────────────────────
    ## A concrete resources block takes precedence over the chart's
    ## named preset; clear the preset so only these limits apply.
    resourcesPreset: ""
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Scheduling overrides ───────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

    ## ── Service ────────────────────────────────────────────────
    service:
      {{- if and .infra.overrides .infra.overrides.service_type }}
      type: "{{ .infra.overrides.service_type }}"
      {{- else }}
      type: ClusterIP
      {{- end }}
      ports:
        api: {{ .infra.port }}

    ## ── Persistence (MinIO object data) ────────────────────────
    persistence:
      enabled: true
      size: "{{ .infra.storage.size }}"
      {{- if and .infra.overrides .infra.overrides.storage_class }}
      storageClass: "{{ .infra.overrides.storage_class }}"
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/minio
      version: 17.0.21
      digest: sha256:0a82daf088c8971cc5c727abbc68798d64283fef702ccd58f7bd499ceeda6a09
      manifestDigest: sha256:f651556c9adf011d17e3e1646079f34906ecce43aaf73deeafa08d7a25872db4
