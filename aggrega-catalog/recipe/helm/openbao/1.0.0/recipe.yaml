apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: openbao
  version: 1.0.0
  license: MPL-2.0
  description: >
    OpenBao secrets-management server on Kubernetes via the official OpenBao
    Helm chart (openbao/openbao). The chart is configured for a lean,
    single-workload deployment: the agent injector is disabled, the server runs
    in standalone mode with a single replica, and its state is kept in the
    built-in file storage backend on a persistent volume. Under this
    configuration the chart renders a StatefulSet for the server, a ConfigMap
    carrying the server configuration, the main and internal (headless)
    Services, a ServiceAccount, a ClusterRoleBinding, and the chart's own test
    Pod, marked as a helm test hook. OpenBao is initialized
    and unsealed at runtime inside the cluster, so no credential is wired at
    render time and no secret is materialized. With `infra.external_base_url`
    set, the server advertises it as its API address through the chart's
    `server.ha.apiAddr`, which the chart reads in every mode; unset, the chart
    advertises the pod's own address. The server image is pinned to a
    resolvable release tag for reproducible renders. Default chart version in
    source.version; override via infra.source_version. provides.host is the
    bare, self-contained in-cluster Service name — it carries no namespace, so
    the recipe is independent of where it is deployed; a consumer in another
    namespace qualifies the host with the target namespace on its own side
    (caller-side routing). OpenBao is distributed under the MPL-2.0 license.

    With `values.metrics_enabled` true the server configuration gains a
    telemetry stanza turning on its Prometheus metrics, served at
    /v1/sys/metrics on the API port to a token, and provides.metrics_endpoint
    publishes the address; false writes nothing and leaves that key empty.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/openbao:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://ghcr.io/openbao/charts/openbao
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"0.28.4\" }}"

  # provides.host names the main OpenBao Service. The valuesMapping below pins
  # the chart's fullnameOverride to the rendered name, the release name the helm
  # provider gives the chart, which spells the Component's name in the alphabet
  # a Kubernetes name allows, so the main Service is named exactly
  # "<rendered_name>"; the headless service the StatefulSet uses for peer
  # discovery is "<rendered_name>-internal". A same-namespace consumer reaches
  # the API under this name directly; a cross-namespace consumer qualifies it
  # caller-side. Port 8200 is the fixed
  # OpenBao API port. The lean render terminates TLS outside the cluster and
  # serves the API over plain HTTP in-cluster, so protocol is "http".
  #
  # metrics_endpoint is the address OpenBao serves its metrics at while
  # values.metrics_enabled is true, when the configuration below carries a
  # telemetry stanza: /v1/sys/metrics on the same Service and port, without the
  # format=prometheus parameter, which the scraper sends. Empty while the value
  # is false. metrics_credential_required follows it, true exactly while there
  # is an address to scrape, since OpenBao answers its metrics only to a token.
  provides:
    host: "{{ .context.rendered_name }}"
    port: 8200
    protocol: "http"
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.rendered_name }}:8200/v1/sys/metrics{{ end }}"
    metrics_credential_required: "{{ if .values.metrics_enabled }}true{{ else }}false{{ end }}"

  # This Recipe reads from infra.overrides:
  #   image         - map[string]string (server.image.* fields; overrides the tag pin)
  #   requests      - { cpu: string, memory: string } (server resource requests)
  #   storage_class - string (server.dataStorage.storageClass for the data PVC)
  #   nodeSelector  - map[string]string (server pod scheduling)
  #   tolerations   - []object (server pod scheduling)
  #
  # While values.metrics_enabled is true the server configuration below gains a
  # telemetry stanza, which turns on the server's Prometheus metrics: the server
  # collects them only when one is present. It carries the product's own
  # retention of 24 hours and leaves gauge names unprefixed by the host name, as
  # OpenBao recommends for Prometheus. The metrics are served on the API
  # listener, to a token, so no port is added. While it is false nothing is
  # written, and the chart's values are what they are without the value.
  valuesMapping: |
    ## ── Agent injector ─────────────────────────────────────────
    ## Disabled for a lean single-workload secrets server; the sidecar
    ## injector and its webhook are not part of this deployment.
    injector:
      enabled: false

    ## ── Pin the chart's resource names to the rendered name ────
    ## Names the main Service exactly "<rendered_name>", matching provides.host.
    fullnameOverride: "{{ .context.rendered_name }}"

    server:
      ## ── Server image pin ─────────────────────────────────────
      ## The chart defaults the tag to its appVersion; pin explicitly for a
      ## reproducible render. Override the whole block via infra.overrides.image.
      image:
        {{- if and .infra.overrides .infra.overrides.image }}
        {{- range $k, $v := .infra.overrides.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
        {{- else }}
        registry: quay.io
        repository: openbao/openbao
        tag: "2.5.5"
        {{- end }}

      ## ── Standalone mode + file storage backend ───────────────
      ## Single-replica standalone server keeping its encrypted state in the
      ## built-in file backend on the mounted data volume. The developer's
      ## ui_enabled value gates the built-in web UI. OpenBao listens for the
      ## API on 8200 and for cluster traffic on 8201; TLS is terminated
      ## outside the cluster, so the in-cluster listener is plain HTTP.
      standalone:
        enabled: true
        config: |
          ui = {{ .values.ui_enabled }}

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "file" {
            path = "/openbao/data"
          }
          {{- if .values.metrics_enabled }}

          telemetry {
            prometheus_retention_time = "24h"
            disable_hostname = true
          }
          {{- end }}

      ## High-availability multi-node mode is not modelled by this Recipe.
      ##
      ## ── The address the server advertises as its API address ─
      ## The chart always hands the server BAO_API_ADDR, which the server takes
      ## over any api_addr in its configuration: ha.apiAddr when set, the pod's
      ## own address when not. The chart reads ha.apiAddr in every mode, not
      ## only in the high-availability one, so infra.external_base_url is
      ## delivered there; unset, it is left to the chart's pod address.
      ha:
        enabled: false
        {{- with .infra.external_base_url }}
        apiAddr: "{{ . }}"
        {{- end }}

      ## ── Data volume (file storage backend) ───────────────────
      ## The StatefulSet mounts a PersistentVolumeClaim at /openbao/data where
      ## the file backend keeps the server's encrypted state.
      dataStorage:
        enabled: true
        size: "{{ .infra.storage.size }}"
        {{- if and .infra.overrides .infra.overrides.storage_class }}
        storageClass: "{{ .infra.overrides.storage_class }}"
        {{- end }}

      ## ── Server resources ─────────────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      ## ── Scheduling overrides ─────────────────────────────────
      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}
