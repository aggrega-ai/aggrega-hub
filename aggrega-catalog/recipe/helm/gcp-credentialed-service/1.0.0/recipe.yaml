apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: gcp-credentialed-service
  version: "1.0.0"
  description: >
    Runs the service on Kubernetes via the helm provider's Workload synthesis and
    delivers its Google Cloud credential as a mounted file. The `gcp_key` secret
    slot mounts as a read-only file under /var/secrets/google — the whole Secret
    mounts as a directory, so the credential's file name is the Secret's data key
    — and GOOGLE_APPLICATION_CREDENTIALS points at that file, the path the Google
    client libraries read the service-account key from. The credential path is
    derived from the slot's published data key, so it tracks whatever key the
    attached secret publishes.
spec:
  capability: helm
  implements: example/compute/gcp-credentialed-service:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: "{{ optional .infra `image` `google/cloud-sdk:slim` }}"
        variables:
          GOOGLE_APPLICATION_CREDENTIALS: "/var/secrets/google/{{ .features.gcp_key.provides.key }}"
        attachments:
          gcp-service-account-key:
            from: gcp_key
            as: file
            path: /var/secrets/google
