apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres
  version: 1.0.0
  description: >
    PostgreSQL on Kubernetes via the helm provider's Workload synthesis
    (Deployment + ClusterIP Service). provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no
    namespace, so the recipe is independent of where it is deployed. A consumer
    in another namespace qualifies the host with the target namespace on its own
    side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  provider: helm
  implements: core/datastore/postgres:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "{{ .infra.port }}"
    protocol: "postgres"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: postgres:{{ .infra.engine_version }}
        # POSTGRES_USER / POSTGRES_DB are developer values (configurable, with
        # defaults matching the historical inline values). POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when a credential
        # is attached it renders as an env secretKeyRef; with none attached the
        # Recipe falls back to an inline development default. POSTGRES_INITDB_ARGS
        # is emitted only when encoding/locale are set.
        variables:
          POSTGRES_USER: {{ .values.user }}
    {{- if not (hasKey (default dict .secrets) "password") }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: {{ .values.database }}
    {{- if or .values.encoding .values.locale }}
          POSTGRES_INITDB_ARGS: "{{ with .values.encoding }}--encoding={{ . }}{{ end }}{{ with .values.locale }} --locale={{ . }}{{ end }}"
    {{- end }}
    {{- if hasKey (default dict .secrets) "password" }}
        secrets:
          POSTGRES_PASSWORD:
            from: password
            as: env
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        resources:
          requests:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
          limits:
            cpu: {{ .infra.compute.cpu }}
            memory: {{ .infra.compute.memory }}
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    volumes:
      data:
        persistentTemplate:
          size: {{ .infra.storage.size }}
          class: {{ .infra.storage.type }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
