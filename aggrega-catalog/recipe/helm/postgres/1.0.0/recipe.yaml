apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: postgres
  version: 1.0.0
  description: >
    PostgreSQL on Kubernetes via the helm provider's Workload synthesis
    (Deployment + ClusterIP Service). provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no
    namespace, so the recipe is independent of where it is deployed. A consumer
    in another namespace qualifies the host with the target namespace on its own
    side (caller-side routing).
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  provider: helm
  implements: core/datastore/postgres:1.0.0
  # provides.host is the bare Service name "<instance_id>-default" — the helm
  # provider names the synthesized ClusterIP Service "<instance_id>-<service-key>"
  # (here "<instance_id>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  provides:
    host: "{{ .context.instance_id }}-default"
    port: "5432"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: postgres:16
        # Demo-only credentials so the stack runs out of the box. A real
        # deployment supplies these via the credential subsystem, not inline.
        variables:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          tcp: 5432
    services:
      default:
        type: ClusterIP
        ports:
          tcp: 5432
