apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: postgres
  version: 1.0.0
  description: >
    PostgreSQL on Kubernetes via the helm provider's Workload synthesis
    (Deployment + ClusterIP Service). provides.host is the bare, self-contained
    in-cluster service name of the synthesized Service — it carries no
    namespace, so the recipe is independent of where it is deployed. A consumer
    in another namespace qualifies the host with the target namespace on its own
    side (caller-side routing). Reach for this realization where no PostgreSQL
    control plane runs in the target cluster: it needs no controller installed
    and no chart repository, so it builds with nothing fetched. Reach for the
    controller-driven recipe where that control plane is already in place, and
    for the reference recipe where the server already exists outside the
    deployment.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/postgres:1.0.0
  # This Recipe reads no infra.overrides keys.
  #
  # provides.host is the bare Service name "<rendered_name>-default" — the helm
  # provider names the synthesized ClusterIP Service "<rendered_name>-<service-key>"
  # (here "<rendered_name>-default"), with no namespace segment. A same-namespace
  # consumer reaches it under this name directly; a cross-namespace consumer
  # qualifies it with the target namespace caller-side.
  #
  # The metrics keys are published empty: the server runs alone in its pod,
  # with no exporter beside it, and PostgreSQL serves no metrics of its own.
  provides:
    host: "{{ .context.rendered_name }}-default"
    port: "{{ .infra.port }}"
    user: "{{ .values.user }}"
    database: "{{ .values.database }}"
    protocol: "postgres"
    metrics_pod_selector: ""
    metrics_pod_port: ""
    metrics_path: ""
  # An attached application-user credential is a request for an application login
  # role, and a role cannot be created without a name. values.app_user carries
  # that name and the Component declares a default for it, so an ordinary
  # Aggregate never has to set it — but one that sets it to an empty string has
  # asked for a role it has not named. The build halts here, where the fix is one
  # line in the Aggregate, rather than
  # emitting an initialization script carrying an empty role identifier that fails
  # when the database first starts. It halts only on that combination: with no
  # credential attached no application role is requested at all, and a named role
  # renders exactly what was asked for.
  assertions:
    app_role_name_supplied: >-
      {{- if and (hasKey (default dict .features) "app_user_password") (not (optional .values "app_user" "")) -}}
      {{- fail "an application-user credential is attached to the app_user_password slot, so the database is asked to create a non-superuser application login role, but values.app_user carries no name for that role: set values.app_user to the name the application signs in with, or remove the app_user_password attachment if no separate application role is wanted" -}}
      {{- end -}}
    # infra.credentials chooses who owns the database's credentials on the
    # controller-driven realization, and infra.credentials_secret names the
    # Kubernetes Secret it reads them from. This realization takes the database
    # password from the credential attached to the password slot, which renders
    # as a secretKeyRef — an existing Kubernetes Secret is attached there as
    # core/referenced-secret bound to helm/k8s-existing-secret — and reads
    # neither key, so supplied, or any Secret name, would reach no byte of the
    # output while the build reads as if it had chosen who owns the password.
    # Refused here by name: infra.credentials other than generated, and any
    # infra.credentials_secret. Not read: both, while they hold the Component's
    # defaults, generated and empty.
    infra_credentials: >-
      {{- if ne (toString .infra.credentials) "generated" -}}
      {{- fail (printf "infra.credentials is %q, which chooses who owns the database's credentials on the controller-driven realization, and this realization takes the database password from the credential attached to the password slot, which names an existing Kubernetes Secret when that is core/referenced-secret bound to helm/k8s-existing-secret: remove infra.credentials from the Release" (toString .infra.credentials)) -}}
      {{- end -}}
      {{- with .infra.credentials_secret -}}
      {{- fail (printf "infra.credentials_secret is %q, which names the Kubernetes Secret the controller-driven realization reads the database owner's credentials from, and this realization reads no Secret by that name, taking the database password from the credential attached to the password slot, which names an existing Kubernetes Secret when that is core/referenced-secret bound to helm/k8s-existing-secret: remove infra.credentials_secret from the Release" .) -}}
      {{- end -}}
  # Two ConfigMaps carry the developer's bootstrap scripts and custom server
  # configuration for the synthesized container. They are kept separate because
  # each mounts whole into a different container path, and each is
  # presence-guarded independently: an entry renders empty — and is therefore
  # skipped, emitting no file — when its source value is unset. An Aggregate that
  # sets neither value emits no ConfigMap at all, byte-identical to one with no
  # ConfigMap. init_scripts keys become files under /docker-entrypoint-initdb.d;
  # custom_config becomes a postgresql.conf the container's config_file argument
  # points at. When an application-user credential is attached (the optional
  # app_user_password slot), the initdb ConfigMap also carries a role-creation
  # script (00-aggrega-app-role.sh) that runs first on initialization and creates
  # a non-superuser login role named by values.app_user, reading its password from
  # the APP_USER_PASSWORD env the slot delivers as a secretKeyRef; the role name is
  # a render-time value while the password stays a runtime env, so it never renders
  # into the manifest. That script is guarded on the attachment AND a non-empty
  # values.app_user, so it cannot render a role with no name; attaching
  # the slot while leaving the name empty halts instead, per the assertion
  # above. The initdb ConfigMap and its mount are presence-guarded on
  # init_scripts OR the app-user slot, so with neither supplied no ConfigMap is
  # emitted and the render is byte-identical.
  artifacts:
    initdb-configmap.yaml: |
      {{- if or .values.init_scripts (hasKey (default dict .features) "app_user_password") -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-initdb
      data:
      {{- range $name, $content := .values.init_scripts }}
        {{ $name }}: |
      {{ $content | indent 4 }}
      {{- end }}
      {{- if and (hasKey (default dict .features) "app_user_password") .values.app_user }}
        00-aggrega-app-role.sh: |
          #!/bin/sh
          set -e
          psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
          CREATE ROLE "{{ .values.app_user }}" WITH LOGIN PASSWORD '$APP_USER_PASSWORD';
          GRANT ALL PRIVILEGES ON DATABASE "{{ .values.database }}" TO "{{ .values.app_user }}";
          GRANT ALL ON SCHEMA public TO "{{ .values.app_user }}";
          EOSQL
      {{- end }}
      {{- end }}
    config-configmap.yaml: |
      {{- if .values.custom_config -}}
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.rendered_name }}-config
      data:
        postgresql.conf: |
      {{ .values.custom_config | indent 4 }}
      {{- end }}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    # form: stateful selects a StatefulSet on the helm provider; the
    # persistentTemplate volume below is a companion of this form.
    form: stateful
    replicas: 1
    containers:
      main:
        image: "postgres:{{ .infra.engine_version }}"
    {{- if .values.custom_config }}
        # custom_config renders a postgresql.conf mounted at /etc/postgresql; the
        # config_file argument makes the server read it. Settings the file omits
        # keep their built-in defaults, so a fragment is enough.
        #
        # The server arguments are supplied as args rather than as a command, so
        # the image's own startup script still runs: it is what creates the
        # database on an empty data directory, reads the POSTGRES_* variables
        # below, and runs the bootstrap files under /docker-entrypoint-initdb.d.
        # It passes these arguments through to the server, which is where
        # config_file selects the mounted configuration file.
        args:
          - postgres
          - -c
          - "config_file=/etc/postgresql/postgresql.conf"
    {{- end }}
        # POSTGRES_USER / POSTGRES_DB are developer values (configurable, with
        # defaults appuser and appdb). POSTGRES_PASSWORD is
        # wired through the optional `password` credential slot: when a credential
        # is attached it renders as an env secretKeyRef; with none attached the
        # Recipe falls back to an inline development default. POSTGRES_INITDB_ARGS
        # is emitted only when encoding/locale are set. APP_USER_PASSWORD renders
        # as an env secretKeyRef only when the optional app_user_password slot is
        # attached; the role-creation init script reads it to set the application
        # role's password.
        variables:
          POSTGRES_USER: "{{ .values.user }}"
    {{- if not (hasKey (default dict .features) "password") }}
          POSTGRES_PASSWORD: apppass
    {{- end }}
          POSTGRES_DB: "{{ .values.database }}"
    {{- if or .values.encoding .values.locale }}
          POSTGRES_INITDB_ARGS: "{{ with .values.encoding }}--encoding={{ . }}{{ end }}{{ with .values.locale }} --locale={{ . }}{{ end }}"
    {{- end }}
    {{- if or (hasKey (default dict .features) "password") (hasKey (default dict .features) "app_user_password") }}
        attachments:
    {{- if hasKey (default dict .features) "password" }}
          POSTGRES_PASSWORD:
            from: password
            as: env
    {{- end }}
    {{- if hasKey (default dict .features) "app_user_password" }}
          APP_USER_PASSWORD:
            from: app_user_password
            as: env
    {{- end }}
    {{- end }}
        ports:
          tcp: {{ .infra.port }}
        # Both probes run the image's own pg_isready, which PostgreSQL documents
        # as the check of whether a server is accepting connections. Readiness
        # asks over TCP on the port the Service targets; liveness asks over the
        # server's local socket. While a new database is initialized the image
        # runs a temporary server that listens on its socket only, so the pod is
        # reported ready only once the server accepts network connections, and a
        # first start is not restarted while initialization is still running.
        # The configured user and database are named so that a probe is not
        # logged as a failed connection attempt. No start-up time is documented:
        # the liveness probe waits 30 s and allows six misses 10 s apart, to cover
        # initialization and the bootstrap scripts.
        health:
          ready:
            exec:
              - pg_isready
              - "--host=127.0.0.1"
              - "--port={{ .infra.port }}"
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            periodSeconds: 10
            timeoutSeconds: 5
          live:
            exec:
              - pg_isready
              - "--username={{ .values.user }}"
              - "--dbname={{ .values.database }}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        resources:
          requests:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
          limits:
            cpu: "{{ .infra.compute.cpu }}"
            memory: "{{ .infra.compute.memory }}"
        volumeMounts:
          - name: data
            path: /var/lib/postgresql/data
    {{- if or .values.init_scripts (hasKey (default dict .features) "app_user_password") }}
          - name: initdb
            path: /docker-entrypoint-initdb.d
    {{- end }}
    {{- if .values.custom_config }}
          - name: pgconf
            path: /etc/postgresql
    {{- end }}
    volumes:
      data:
        persistentTemplate:
          size: "{{ .infra.storage.size }}"
          class: "{{ .infra.storage.type }}"
    {{- if or .values.init_scripts (hasKey (default dict .features) "app_user_password") }}
      initdb:
        configmap:
          source: "{{ .context.rendered_name }}-initdb"
    {{- end }}
    {{- if .values.custom_config }}
      pgconf:
        configmap:
          source: "{{ .context.rendered_name }}-config"
    {{- end }}
    services:
      default:
        type: ClusterIP
        ports:
          tcp: {{ .infra.port }}
      headless:
        type: Headless
        ports:
          tcp: {{ .infra.port }}
