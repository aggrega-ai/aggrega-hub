apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: mysql-bitnami
  version: 1.0.0
  description: >
    MySQL via Bitnami Helm chart (bitnami/mysql).
    Default chart version in source.version: Override via infra.source_version.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  target: helm
  implements: core/datastore/mysql:1.0.0

  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/mysql
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"14.0.3\" }}"

  locals:
    primary_compute: "mysql"
    # Black-Box: the credential filling the root_password slot generates a
    # K8s Secret and publishes its name. The Bitnami chart reads that name
    # via auth.existingSecret below — the recipe references the producer's
    # published name rather than re-deriving it, so the two never drift.

  provides:
    host: "{{ .context.instance_id }}"
    port: "{{ .infra.port }}"
    protocol: "mysql"

  valuesMapping: |
    ## ── Image overrides ────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.image }}
    image:
      {{- range $k, $v := .infra.overrides.image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- end }}
    {{- if .infra.overrides.volume_permissions_image }}
    volumePermissions:
      image:
        {{- range $k, $v := .infra.overrides.volume_permissions_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
    {{- end }}
    {{- if .infra.overrides.global_storage_class }}
    global:
      storageClass: "{{ .infra.overrides.global_storage_class }}"
    {{- end }}
    {{- end }}

    ## ── Authentication (Black-Box) ─────────────────────────────
    auth:
      database: "{{ .values.database }}"
      {{- if hasKey (default dict (default dict (default dict .secrets).root_password).provides) "name" }}
      existingSecret: "{{ .secrets.root_password.provides.name }}"
      {{- end }}
      {{- if .values.user }}
      username: "{{ .values.user }}"
      usePasswordFiles: true
      {{- end }}

    ## ── Primary ────────────────────────────────────────────────
    primary:
      {{- if .values.custom_config }}
      configuration: |-
        {{ .values.custom_config | nindent 8 }}
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if .infra.overrides }}
        {{- if .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}
        {{- end }}

      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
        accessModes:
          - ReadWriteOnce

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- if .infra.overrides.affinity }}
      affinity: {{ toJson .infra.overrides.affinity }}
      {{- end }}
      {{- if .infra.overrides.service_type }}
      service:
        type: "{{ .infra.overrides.service_type }}"
      {{- end }}
      {{- end }}

    ## ── Init scripts ───────────────────────────────────────────
    {{- if .values.init_scripts }}
    initdbScripts:
      {{- range $name, $sql := .values.init_scripts }}
      {{ $name }}: |
        {{ $sql | nindent 8 }}
      {{- end }}
    {{- end }}

    ## ── Secondary (HA) ─────────────────────────────────────────
    secondary:
      {{- if and .infra.ha.enabled (gt (int .infra.ha.read_replicas) 0) }}
      replicaCount: {{ .infra.ha.read_replicas }}
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
      persistence:
        enabled: true
        size: "{{ .infra.storage.size }}"
        storageClass: "{{ .infra.storage.type }}"
      {{- else }}
      replicaCount: 0
      {{- end }}

    ## ── Metrics ────────────────────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.metrics }}
    metrics:
      enabled: true
      {{- if .infra.overrides.metrics.image }}
      image:
        {{- range $k, $v := .infra.overrides.metrics.image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/mysql
      version: 14.0.3
      digest: sha256:fc7c297ce7e2953190e313d4afc4f3093a9f8d47e82d15e6c933982c0d0b8ac2
      manifestDigest: sha256:2bbaf66e43dad7edce1eb563e19bcabd83eb8c8f79549505ad1c48e3a0cbfbba
