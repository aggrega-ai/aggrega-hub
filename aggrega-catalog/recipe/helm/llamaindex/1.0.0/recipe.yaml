apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: llamaindex
  version: 1.0.0
  description: >
    A LlamaIndex agent application on Kubernetes, rendered offline as plain manifests
    by the helm provider's Workload synthesis. The Workload becomes a Deployment
    running the operator-supplied application image. The model endpoint published
    by the component wired into the `model` socket is injected as OPENAI_BASE_URL,
    the environment variable the OpenAI-compatible client SDK reads; an attached
    model API key is delivered as OPENAI_API_KEY via a secretKeyRef.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/llamaindex:1.0.0
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: stateless
    replicas: 1
    containers:
      main:
        image: "{{ .infra.image }}"
        # The model endpoint arrives on the `model` uses-edge, addressed by the
        # developer-chosen alias; the recipe ranges the outbound edges and matches
        # on the socket name, then reads the model recipe's published endpoint and
        # model name. The client SDK reads the base URL and the API key from the
        # environment, never the model name — that one is delivered for the
        # application's own code to read. An env-delivered model name is therefore
        # right here, where the application is the configuration surface and no
        # flow definition competes with it, and inert on a visual platform, whose
        # own flow node carries the model.
        variables:
    {{- range $alias, $edge := .context.uses }}
    {{- if eq $edge.socket "model" }}
          OPENAI_BASE_URL: "{{ $edge.provides.endpoint }}"
          OPENAI_MODEL: "{{ $edge.provides.model }}"
    {{- end }}
    {{- end }}
        # An attached model API key is delivered as OPENAI_API_KEY via a
        # secretKeyRef; the key value never renders into the manifest. Unattached,
        # no key env is emitted.
    {{- if hasKey (default dict .features) "model_api_key" }}
        attachments:
          OPENAI_API_KEY:
            from: model_api_key
            as: env
    {{- end }}
