apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: mariadb-operator
  version: 1.0.0
  license: MIT
  description: >
    Installs the mariadb-operator control plane as an explicit component: a
    ServiceAccount, the namespaced Role and cluster RBAC the controller needs to
    reconcile MariaDB custom resources, the configuration the controller reads at
    startup, and the controller Deployment on the upstream image. Emitting the
    control plane as a first-class component lets a controller-driven MariaDB ship
    its runtime prerequisite alongside the MariaDB custom resource it emits (the
    bundled-deploy prerequisite mode), so the custom resource and the controller
    that reconciles it are deployed together. This is a minimal control-plane
    bootstrap. It installs no custom-resource definitions, no certificate
    controller and no admission webhook, so reach for it only where the
    definitions are already installed in the cluster and the build must fetch
    nothing; for a full install reach for `mariadb-operator-chart`, which renders
    the project's own chart with all three.

    The controller serves its own metrics at /metrics on port 8080, which checks
    no caller. With `values.metrics_enabled` true a ClusterIP Service,
    `<instance>-metrics` in infra.namespace, carries that port and
    provides.metrics_endpoint publishes its address with the namespace; false,
    that key is empty and no Service is rendered.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/datastore/mariadb-operator:1.0.0
  # metrics_endpoint is the address the controller serves its own metrics at
  # while values.metrics_enabled is true: /metrics on port 8080 of the ClusterIP
  # Service rendered after the Deployment, in the same file. Every object here
  # lives in infra.namespace rather than the Release's, so the host carries that
  # namespace and resolves from a Prometheus server in any other. It is spelled
  # out in full on purpose: a provides entry cannot read another.
  provides:
    metrics_endpoint: "{{ if .values.metrics_enabled }}http://{{ .context.instance_id }}-metrics.{{ .infra.namespace }}:8080/metrics{{ end }}"
  # This Recipe reads no infra.overrides keys.
  #
  # The controller applies its own spec defaults inside its reconcile loop rather
  # than through a mutating admission webhook — the only admission configuration
  # the project declares is a validating one — so a MariaDB custom resource is
  # defaulted normally under this bootstrap even though no webhook is emitted. What
  # the absent webhook costs is the immutability validation on fields that may not
  # change after creation, not the defaulting.
  #
  # The cluster RBAC below is the project's own control-plane role, transcribed rule
  # for rule from its published install manifest rather than narrowed: the
  # controller reconciles a database out of all of these, and a role guessed smaller
  # renders cleanly and then fails at the first object it cannot create. The
  # namespaced Role beside it carries the leader-election lease and the controller's
  # own configuration, which are namespace-scoped rather than cluster-scoped.
  #
  # The controller's probes open a connection to its metrics port. As this Recipe
  # runs it — its webhook server off, which is the controller's own default — the
  # controller registers no health or readiness check, so the probe address it
  # binds answers neither path, and the project's own chart gives this Deployment
  # no probe either. Its serving port is the metrics listener the args bind on
  # 8080, which it starts first, whether or not it holds leadership.
  artifacts:
    serviceaccount.yaml: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
    configmap.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-env
        namespace: {{ .infra.namespace }}
      data:
        MARIADB_OPERATOR_IMAGE: "{{ .infra.image }}"
        MARIADB_GALERA_LIB_PATH: "/usr/lib/galera/libgalera_smm.so"
        MARIADB_DEFAULT_VERSION: "12.3"
        RELATED_IMAGE_MARIADB: "mariadb:12.3.3"
        RELATED_IMAGE_MARIADB_NAME: "mariadb"
        RELATED_IMAGE_MAXSCALE: "mariadb/maxscale:23.08.13-2"
        RELATED_IMAGE_EXPORTER: "prom/mysqld-exporter:v0.15.1"
        RELATED_IMAGE_EXPORTER_MAXSCALE: "mariadb/maxscale-prometheus-exporter-ubi:v0.0.1"
    role.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
        - apiGroups: ["coordination.k8s.io"]
          resources: ["leases"]
          verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]
    rolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    clusterrole.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: {{ .context.instance_id }}
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["create", "delete", "get", "list", "patch", "watch"]
        - apiGroups: [""]
          resources: ["events", "secrets", "serviceaccounts", "services"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["create", "delete", "deletecollection", "list", "patch", "watch"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["delete", "get", "list", "patch", "watch"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["apps"]
          resources: ["statefulsets"]
          verbs: ["create", "delete", "get", "list", "patch", "watch"]
        - apiGroups: ["authentication.k8s.io"]
          resources: ["tokenreviews"]
          verbs: ["create"]
        - apiGroups: ["authorization.k8s.io"]
          resources: ["subjectaccessreviews"]
          verbs: ["create"]
        - apiGroups: ["batch"]
          resources: ["cronjobs"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["create", "delete", "get", "list", "patch", "watch"]
        - apiGroups: ["cert-manager.io"]
          resources: ["certificates"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices", "endpointslices/restricted"]
          verbs: ["create", "get", "list", "patch", "watch"]
        - apiGroups: ["events.k8s.io"]
          resources: ["events"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["backups", "connections", "databases", "externalmariadbs", "grants", "mariadbs", "maxscales", "physicalbackups", "restores", "sqljobs", "users"]
          verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["backups/finalizers", "connections/finalizers", "databases/finalizers", "externalmariadbs/finalizers", "grants/finalizers", "mariadbs/finalizers", "maxscales/finalizers", "physicalbackups/finalizers", "restores/finalizers", "sqljobs/finalizers", "users/finalizers"]
          verbs: ["update"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["backups/status", "connections/status", "databases/status", "externalmariadbs/status", "grants/status", "mariadbs/status", "maxscales/status", "physicalbackups/status", "pointintimerecoveries/status", "restores/status", "sqljobs/status", "users/status"]
          verbs: ["get", "patch", "update"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["maxscale"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["k8s.mariadb.com"]
          resources: ["pointintimerecoveries"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["servicemonitors"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["policy"]
          resources: ["poddisruptionbudgets"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["clusterrolebindings", "rolebindings", "roles"]
          verbs: ["create", "list", "patch", "watch"]
        - apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshots"]
          verbs: ["create", "delete", "get", "list", "patch", "watch"]
    clusterrolebinding.yaml: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: {{ .context.instance_id }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: {{ .context.instance_id }}
      subjects:
        - kind: ServiceAccount
          name: {{ .context.instance_id }}
          namespace: {{ .infra.namespace }}
    # The metrics listener the arguments bind on 8080 is plain HTTP on every
    # address of the pod, with /metrics its only route. While
    # values.metrics_enabled is true a ClusterIP Service follows the Deployment
    # in this file, selecting its pod and reaching the port by number, which a
    # Service does whether or not the container declares it. Like every object
    # here it is named after the component instance, with -metrics appended.
    # While the value is false the file is the Deployment alone.
    deployment.yaml: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .context.instance_id }}
        namespace: {{ .infra.namespace }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: {{ .context.instance_id }}
        template:
          metadata:
            labels:
              app.kubernetes.io/name: {{ .context.instance_id }}
          spec:
            serviceAccountName: {{ .context.instance_id }}
            containers:
              - name: controller
                image: {{ .infra.image }}
                args:
                  - --metrics-addr=:8080
                  - --log-level=INFO
                readinessProbe:
                  tcpSocket:
                    port: 8080
                livenessProbe:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 10
                envFrom:
                  - configMapRef:
                      name: {{ .context.instance_id }}-env
                env:
                  - name: CLUSTER_NAME
                    value: cluster.local
                  - name: MARIADB_OPERATOR_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.serviceAccountName
                  - name: MARIADB_OPERATOR_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: MARIADB_OPERATOR_SA_PATH
                    value: /var/run/secrets/kubernetes.io/serviceaccount/token
      {{- if .values.metrics_enabled }}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}-metrics
        namespace: {{ .infra.namespace }}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/name: {{ .context.instance_id }}
        ports:
          - name: metrics
            port: 8080
            targetPort: 8080
      {{- end }}
