apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: lindy
  version: 1.0.0
  description: >
    A Lindy assistant on Lindy's managed platform as a reference realization, so
    no compute runs in-cluster. The helm provider emits an ExternalName Service
    that maps an in-cluster DNS name onto the operator-supplied platform
    endpoint. provides.endpoint is that host and provides.lindy_id is the
    developer-selected assistant. No credential is delivered by this recipe: a
    consumer that needs one declares it as `credential` on the socket that
    reaches this endpoint and delivers it from its own container, because the
    environment-variable name belongs to the consumer.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-agent/lindy:1.0.0
  # The endpoint is sourced from infra.endpoint and single-sourced into both
  # provides and the workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    lindy_id: "{{ .values.lindy_id }}"
  assertions:
    # The host the platform is reached at is the operator's to state, and it
    # may be a gateway or proxy in front of the platform rather than the
    # platform itself, so the catalog holds no default address: the Release
    # names it.
    endpoint_supplied: >-
      {{- if not (optional .infra "endpoint" "") -}}
      {{- fail "this realization reaches Lindy's platform, or a gateway or proxy an operator puts in front of it, so the Release supplies the address and the catalog holds no default: set infra.endpoint in the Release to the base URL of the platform's API, or of the gateway or proxy that reaches it" -}}
      {{- end -}}
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
