apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: sealed-secrets
  version: 1.0.0
  license: Apache-2.0
  description: >
    sealed-secrets controller via the official sealed-secrets Helm chart, served
    from an HTTPS chart repository. The chart deploys the controller that decrypts
    SealedSecret custom resources into native Kubernetes Secrets, together with
    its RBAC, its Services, and a ServiceAccount. The controller's own metrics,
    in the Prometheus format at /metrics on port 8081 of the chart's metrics
    Service, are published as provides.metrics_endpoint, the one address this
    component publishes. The SealedSecret custom resource
    definition ships in the chart's Helm-native CRD directory, so it installs with
    the release unconditionally. The controller generates its sealing keypair in
    the cluster at runtime, so no key material is produced at render time. This
    Recipe pins the controller container image to an explicit release tag for
    reproducible renders. Default chart version in source.version; override via
    infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/sealed-secrets:1.0.0

  source:
    kind: helm-https-chart
    url: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"2.19.1\" }}"

  # metrics_endpoint is the address the controller serves its own metrics at,
  # in the Prometheus format: /metrics on its metrics listener, port 8081,
  # always on and asking no credential. The chart renders a Service for that
  # port whenever it renders the controller, named after the chart's full name
  # with "-metrics" appended, in the release namespace — the namespace the
  # Release places this component in.
  #
  # This Recipe pins no name, so the full name is the chart's own, and the
  # address writes the chart's naming rule out exactly as the chart applies it
  # at this version: the release name, which is the rendered name, where it
  # already contains the chart's name, sealed-secrets; otherwise the rendered
  # name followed by "-sealed-secrets"; either cut to 63 characters with no
  # trailing dash. An instance named sealed-secrets therefore publishes
  # http://sealed-secrets-metrics:8081/metrics. The rule is repeated here
  # because the chart applies it inside its own templates, where nothing this
  # Recipe publishes can read it; a chart picked through infra.source_version
  # that names its Services otherwise leaves this address behind.
  #
  # The host carries no namespace: the chart places the Service in the
  # namespace the Release places this component in, so a consumer in that
  # namespace reaches it by this name and one in another qualifies it on its
  # own side.
  provides:
    metrics_endpoint: '{{ $fullname := .context.rendered_name }}{{ if not (contains "sealed-secrets" $fullname) }}{{ $fullname = printf "%s-sealed-secrets" $fullname }}{{ end }}http://{{ $fullname | trunc 63 | trimSuffix "-" }}-metrics:8081/metrics'

  # This Recipe reads from infra.overrides:
  #   controller_image - map[string]string (image.* fields; overrides the tag pin)
  #   requests         - { cpu: string, memory: string } (controller resource requests)
  #   nodeSelector     - map[string]string
  #   tolerations      - []object
  valuesMapping: |
    ## ── Controller image pin ───────────────────────────────────
    ## The controller decrypts SealedSecret resources into Kubernetes Secrets.
    ## Pin the image explicitly for a reproducible render. Override the whole
    ## image block via infra.overrides.controller_image.
    {{- if and .infra.overrides .infra.overrides.controller_image }}
    image:
      {{- range $k, $v := .infra.overrides.controller_image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      registry: docker.io
      repository: bitnami/sealed-secrets-controller
      tag: "0.38.4"
    {{- end }}

    ## ── Controller resources ───────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Controller scheduling ──────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}
