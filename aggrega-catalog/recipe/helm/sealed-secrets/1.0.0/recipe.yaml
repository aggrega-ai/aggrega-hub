apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: sealed-secrets
  version: 1.0.0
  license: Apache-2.0
  description: >
    sealed-secrets controller via the official sealed-secrets Helm chart, served
    from an HTTPS chart repository. The chart deploys the controller that decrypts
    SealedSecret custom resources into native Kubernetes Secrets, together with
    its RBAC, its Services, and a ServiceAccount. The SealedSecret custom resource
    definition ships in the chart's Helm-native CRD directory, so it installs with
    the release unconditionally. The controller generates its sealing keypair in
    the cluster at runtime, so no key material is produced at render time. This
    Recipe pins the controller container image to an explicit release tag for
    reproducible renders. Default chart version in source.version; override via
    infra.source_version.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/security/sealed-secrets:1.0.0

  source:
    kind: helm-https-chart
    url: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"2.19.1\" }}"

  # This Recipe reads from infra.overrides:
  #   controller_image - map[string]string (image.* fields; overrides the tag pin)
  #   requests         - { cpu: string, memory: string } (controller resource requests)
  #   nodeSelector     - map[string]string
  #   tolerations      - []object
  valuesMapping: |
    ## ── Controller image pin ───────────────────────────────────
    ## The controller decrypts SealedSecret resources into Kubernetes Secrets.
    ## Pin the image explicitly for a reproducible render. Override the whole
    ## image block via infra.overrides.controller_image.
    {{- if and .infra.overrides .infra.overrides.controller_image }}
    image:
      {{- range $k, $v := .infra.overrides.controller_image }}
      {{ $k }}: "{{ $v }}"
      {{- end }}
    {{- else }}
    image:
      registry: docker.io
      repository: bitnami/sealed-secrets-controller
      tag: "0.38.4"
    {{- end }}

    ## ── Controller resources ───────────────────────────────────
    resources:
      limits:
        cpu: "{{ .infra.compute.cpu }}"
        memory: "{{ .infra.compute.memory }}"
      {{- if and .infra.overrides .infra.overrides.requests }}
      requests:
        cpu: "{{ .infra.overrides.requests.cpu }}"
        memory: "{{ .infra.overrides.requests.memory }}"
      {{- end }}

    ## ── Controller scheduling ──────────────────────────────────
    {{- if .infra.overrides }}
    {{- if .infra.overrides.nodeSelector }}
    nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
    {{- end }}
    {{- if .infra.overrides.tolerations }}
    tolerations: {{ toJson .infra.overrides.tolerations }}
    {{- end }}
    {{- end }}

  sourceDigests:
    - kind: helm-https-chart
      url: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      version: 2.19.1
      digest: sha256:f2a3aa61638f1e23ef963be311e8d5ea75878d8e01ae3846285965b6dd985337
