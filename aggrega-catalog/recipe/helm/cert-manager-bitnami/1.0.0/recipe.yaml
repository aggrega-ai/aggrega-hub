apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: cert-manager-bitnami
  version: 1.0.0
  description: >
    cert-manager TLS-certificate lifecycle controller via the Bitnami cert-manager Helm chart (bitnami/cert-manager). The chart deploys the controller that reconciles Certificate and Issuer resources, a webhook that validates and defaults cert-manager's custom resources, and a CA injector that wires the webhook's CA bundle into the cluster, together with their RBAC, the webhook Service, and the admission-webhook configurations. When the Component's install_crds value is on, the chart also installs the cert-manager CustomResourceDefinitions. The chart pins its container images to resolvable release tags, which this Recipe re-pins explicitly for reproducible renders. Default chart version in source.version; override via infra.source_version. This chart-wrap depends on upstream Bitnami-distributed images whose free public distribution is being discontinued; it is retained meanwhile and a replacement is planned.

  license: Apache-2.0
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  target: helm
  implements: core/security/cert-manager:1.0.0
  source:
    kind: helm-oci-chart
    url: oci://registry-1.docker.io/bitnamicharts/cert-manager
    # Default chart version. Override via infra.source_version.
    version: "{{ optional .infra `source_version` \"1.5.14\" }}"
  # This Recipe reads from infra.overrides:
  #   controller_image - map[string]string (controller.image.* fields; overrides the tag pin)
  #   acmesolver_image - map[string]string (controller.acmesolver.image.* fields; overrides the tag pin)
  #   webhook_image    - map[string]string (webhook.image.* fields; overrides the tag pin)
  #   cainjector_image - map[string]string (cainjector.image.* fields; overrides the tag pin)
  #   requests         - { cpu: string, memory: string } (resource requests, applied to every workload)
  #   log_level        - integer (logLevel; controller verbosity)
  #   cluster_resource_namespace - string (clusterResourceNamespace; where ClusterIssuer credentials are read)
  #   nodeSelector     - map[string]string (applied to every workload)
  #   tolerations      - []object (applied to every workload)
  valuesMapping: |
    ## ── CRD installation (Developer intent) ────────────────────
    ## Installs the cert-manager custom resource definitions with the
    ## release when on. Turn off when the CRDs are managed out of band.
    installCRDs: {{ .values.install_crds }}

    ## ── Cluster-wide controller settings ───────────────────────
    {{- if and .infra.overrides (hasKey .infra.overrides "log_level") }}
    logLevel: {{ .infra.overrides.log_level }}
    {{- end }}
    {{- if and .infra.overrides .infra.overrides.cluster_resource_namespace }}
    clusterResourceNamespace: "{{ .infra.overrides.cluster_resource_namespace }}"
    {{- end }}

    ## ── Controller ─────────────────────────────────────────────
    ## The controller reconciles Certificate and Issuer resources. The chart
    ## ships resolvable release tags; pin explicitly for a reproducible render.
    ## Override the whole image block via infra.overrides.controller_image.
    controller:
      {{- if and .infra.overrides .infra.overrides.controller_image }}
      image:
        {{- range $k, $v := .infra.overrides.controller_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/cert-manager
        tag: "1.18.2-debian-12-r5"
      {{- end }}

      ## ── ACME solver image ────────────────────────────────────
      ## The controller launches this image to solve ACME HTTP-01 challenges.
      acmesolver:
        {{- if and .infra.overrides .infra.overrides.acmesolver_image }}
        image:
          {{- range $k, $v := .infra.overrides.acmesolver_image }}
          {{ $k }}: "{{ $v }}"
          {{- end }}
        {{- else }}
        image:
          registry: docker.io
          repository: bitnami/acmesolver
          tag: "1.18.2-debian-12-r5"
        {{- end }}

      ## ── Controller resources ─────────────────────────────────
      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      ## ── Scheduling overrides ─────────────────────────────────
      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── Webhook ────────────────────────────────────────────────
    ## Validates and defaults cert-manager's custom resources.
    webhook:
      {{- if and .infra.overrides .infra.overrides.webhook_image }}
      image:
        {{- range $k, $v := .infra.overrides.webhook_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/cert-manager-webhook
        tag: "1.18.2-debian-12-r5"
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

    ## ── CA injector ────────────────────────────────────────────
    ## Injects the webhook's CA bundle into the admission configurations.
    cainjector:
      {{- if and .infra.overrides .infra.overrides.cainjector_image }}
      image:
        {{- range $k, $v := .infra.overrides.cainjector_image }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- else }}
      image:
        registry: docker.io
        repository: bitnami/cainjector
        tag: "1.18.2-debian-12-r5"
      {{- end }}

      resources:
        limits:
          cpu: "{{ .infra.compute.cpu }}"
          memory: "{{ .infra.compute.memory }}"
        {{- if and .infra.overrides .infra.overrides.requests }}
        requests:
          cpu: "{{ .infra.overrides.requests.cpu }}"
          memory: "{{ .infra.overrides.requests.memory }}"
        {{- end }}

      {{- if .infra.overrides }}
      {{- if .infra.overrides.nodeSelector }}
      nodeSelector: {{ toJson .infra.overrides.nodeSelector }}
      {{- end }}
      {{- if .infra.overrides.tolerations }}
      tolerations: {{ toJson .infra.overrides.tolerations }}
      {{- end }}
      {{- end }}

  sourceDigests:
    - kind: helm-oci-chart
      url: oci://registry-1.docker.io/bitnamicharts/cert-manager
      version: 1.5.14
      digest: sha256:fbf0b36cb7dac6c7506f0a78d6b9a50a1b89217b4568adc056cf26cbc6de863e
      manifestDigest: sha256:742c30a910d1cb27c4397b8a6187bd9b6fa2104a7da2734efd15a37a92dd4ef8
