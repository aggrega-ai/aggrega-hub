apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: datastore-query-knative
  version: 1.0.0
  license: Apache-2.0
  description: >
    The datastore-query tool realized as a Knative Service the Knative Serving
    control plane reconciles. The recipe emits a single Service custom
    resource; the control plane turns it into a revision, admits an inbound
    call while that revision runs no replicas, and sets the replica count from
    the concurrency it observes, so the tool occupies no compute between the
    calls that invoke it. The replica floor and ceiling carry through as the
    revision's own scaling bounds. The store the tool queries arrives on the
    tool's datastore socket, and the recipe delivers that store's host and
    port — and the user and database name where the store publishes them —
    into the container alongside the developer's dialect, so the running tool
    addresses the store the topology resolved rather than one named in its own
    configuration. provides is the addressable name the control plane gives the
    Service. The Knative Serving control plane is a runtime prerequisite: the
    build halts unless the operator affirms it is installed
    (infra.control_plane_present), so no custom resource is emitted into a
    cluster that cannot reconcile it.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-tool/datastore-query:1.0.0
  # A Knative Service is addressable in its own namespace under the Service's
  # own name, on port 80, and the control plane routes from there to the
  # revision's container port. provides.host is therefore that bare in-cluster
  # name with no namespace segment, so the recipe is independent of where it is
  # deployed; a consumer in another namespace qualifies it on its own side
  # (caller-side routing). provides.port is 80 rather than infra.port because
  # 80 is what a caller connects to — infra.port is where the container listens
  # behind the control plane's routing, and only the container spec below reads
  # it.
  provides:
    host: "{{ .context.instance_id }}"
    port: "80"
    endpoint: "http://{{ .context.instance_id }}"
    protocol: "http"
  assertions:
    # The Knative Serving control plane must exist in the target cluster before
    # a Serving custom resource can reconcile. The compiler cannot inspect
    # cluster state, so the prerequisite is declared: an operator affirms it in
    # the Release, and an unaffirmed build halts here rather than emitting an
    # orphan custom resource.
    knative_control_plane_prerequisite: >-
      {{- if not .infra.control_plane_present -}}
      {{- fail "the Knative Serving control plane must be installed in the target cluster before this realization emits its Knative Service; once Knative Serving is present, affirm the prerequisite by setting infra.control_plane_present to true in the Release" -}}
      {{- end -}}
    # This component wraps no upstream product, so it holds no default image to
    # fall back to: the Release names the one it runs.
    image_supplied: >-
      {{- if not (optional .infra "image" "") -}}
      {{- fail "this realization runs an image the Release supplies, because the tool component packages no upstream product and therefore holds no default: set infra.image to the container image serving the tool in the Release" -}}
      {{- end -}}
    compute_group_complete: >-
      {{- if not (optional (default dict .infra.compute) "cpu" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.cpu empty, so the rendered revision would carry no CPU request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
      {{- if not (optional (default dict .infra.compute) "memory" "") -}}
      {{- fail "this Release sets part of infra.compute on the tool but leaves compute.memory empty, so the rendered revision would carry no memory request or limit: set both compute.cpu and compute.memory together, or remove the compute block entirely to take the component's defaults" -}}
      {{- end -}}
  # This Recipe reads from infra.overrides:
  #   annotations - map[string]string (added to the revision template's annotations)
  #
  # The key exists because the control plane reads its per-revision switches
  # from the revision's annotations, and which switches an installation offers
  # belongs to the installed control-plane version rather than to this catalog.
  # The two scaling bounds are not among them: they come from infra.min_replicas
  # and infra.max_replicas, first-class keys on the component's own surface.
  #
  # The tool's own values and the store's coordinates are both delivered to the
  # container as environment variables. The image is the Release's, so no
  # upstream documentation names a spelling for them; the recipe delivers each
  # under a stable name for the application's own code to read. The optional
  # values are emitted only when they are present, so an unset value renders no
  # variable rather than an empty one.
  #
  # The store's coordinates are read off the datastore socket's own edge rather
  # than from a value on the tool, which is what makes the destination the
  # topology's to decide: the edge is found by matching the socket name the
  # component declares, so the alias the developer chose for the connection
  # does not reach this template. Host and port are the pair every store in the
  # category publishes; protocol, user and database are published by some of
  # them and are emitted only where they are, so a store that names no login
  # role delivers no user variable rather than an empty one. The tool queries
  # one store, so one store is delivered: several edges on that socket would
  # each deliver a store under the same variable names, leaving undefined which
  # one the tool queries, so the template halts and names the socket rather
  # than emitting an artifact whose behaviour the author did not choose.
  artifacts:
    service.yaml: |
      {{- $wired := list -}}
      {{- range $alias, $edge := .context.uses -}}
      {{- if eq $edge.socket "target_datastore" -}}
      {{- $wired = append $wired $alias -}}
      {{- end -}}
      {{- end -}}
      {{- if gt (len $wired) 1 -}}
      {{- fail "this tool queries one store, and this deployment wires several onto its target_datastore socket: leave one edge on target_datastore, and declare a second datastore-query component for a second store" -}}
      {{- end -}}
      apiVersion: serving.knative.dev/v1
      kind: Service
      metadata:
        name: {{ .context.instance_id }}
      spec:
        template:
          metadata:
            annotations:
              autoscaling.knative.dev/min-scale: "{{ .infra.min_replicas }}"
              autoscaling.knative.dev/max-scale: "{{ .infra.max_replicas }}"
              {{- if and .infra.overrides .infra.overrides.annotations }}
              {{- range $k, $v := .infra.overrides.annotations }}
              {{ $k }}: "{{ $v }}"
              {{- end }}
              {{- end }}
          spec:
            containers:
              - image: "{{ .infra.image }}"
                ports:
                  - containerPort: {{ .infra.port }}
                env:
                  - name: QUERY_TOOL_DIALECT
                    value: "{{ .values.dialect }}"
                  - name: QUERY_TOOL_SIDE_EFFECTS
                    value: "{{ .values.side_effects }}"
                  - name: QUERY_TOOL_TIMEOUT_SECONDS
                    value: "{{ .values.timeout_seconds }}"
                  {{- with .values.llm_description_override }}
                  - name: QUERY_TOOL_DESCRIPTION
                    value: "{{ . }}"
                  {{- end }}
                  {{- range $alias, $edge := .context.uses }}
                  {{- if eq $edge.socket "target_datastore" }}
                  - name: QUERY_TOOL_STORE_HOST
                    value: "{{ $edge.provides.host }}"
                  - name: QUERY_TOOL_STORE_PORT
                    value: "{{ $edge.provides.port }}"
                  {{- with (optional $edge.provides "protocol" "") }}
                  - name: QUERY_TOOL_STORE_PROTOCOL
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional $edge.provides "user" "") }}
                  - name: QUERY_TOOL_STORE_USER
                    value: "{{ . }}"
                  {{- end }}
                  {{- with (optional $edge.provides "database" "") }}
                  - name: QUERY_TOOL_STORE_DATABASE
                    value: "{{ . }}"
                  {{- end }}
                  {{- end }}
                  {{- end }}
                resources:
                  requests:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
                  limits:
                    cpu: "{{ .infra.compute.cpu }}"
                    memory: "{{ .infra.compute.memory }}"
