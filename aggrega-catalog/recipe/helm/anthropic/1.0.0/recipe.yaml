apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: anthropic
  version: 1.0.0
  description: >
    Anthropic's managed Claude API as a reference realization: no compute runs
    in-cluster. The helm engine emits an ExternalName Service that maps an
    in-cluster DNS name onto the managed endpoint, and the api_key credential is
    carried to consumers as an environment variable. provides.endpoint is the
    managed API host and provides.model is the developer-selected model string.
  maintainers:
    - name: Massimiliano Ferrero
      email: m.ferrero@cognitio.it
spec:
  capability: helm
  implements: core/ai-model/anthropic:1.0.0
  # The endpoint is sourced from infra.endpoint (a fixed-host default the operator
  # may repoint at a gateway) and single-sourced into both provides and the
  # workload below.
  provides:
    endpoint: "{{ .infra.endpoint }}"
    model: "{{ .values.model }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    form: reference
    endpoint: "{{ .infra.endpoint }}"
    port: 443
    credential:
      from: api_key
      env: ANTHROPIC_API_KEY
