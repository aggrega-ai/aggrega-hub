apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm-chart
  version: "1.0.0"
spec:
  # plugin names the Plugin entity providing this provider's Wasm rendering
  # engine, as a bare catalog identity (name:version). It resolves to the
  # helm-chart-renderer Plugin entity, whose own plugin field pins the content-
  # addressed Wasm artifact. That plugin advertises both render_node and
  # assemble_boundary, so the hybrid dispatch routes this provider through the
  # wasmengine assembler adapter — per-node sub-chart render AND per-dispatch-
  # group umbrella assembly run in Wasm.
  plugin: helm-chart-renderer:1.0.0
  # workloadSchema: intentionally ABSENT. The helm-chart provider does NOT
  # support Workload synthesis — it produces an umbrella chart scaffold,
  # not rendered K8s manifests. Recipes targeting helm-chart must use
  # sourced mode (source + valuesMapping) or artifacts mode.
