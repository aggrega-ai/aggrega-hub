apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: cloudformation
  version: "1.0.0"
spec:
  # CloudFormation provider: sourced mode only. The Recipe provides a
  # template source; valuesMapping output becomes stack parameters.
  # baseSchema is open by design — every CloudFormation template declares
  # its own parameter surface; the values dict carries whatever the
  # consumer Recipe binds. Authored as JSON Schema 2020-12.
  baseSchema: |
    type: object
    additionalProperties: true
  # workloadSchema: ABSENT. Workload synthesis not supported — AWS compute
  # targets are heterogeneous (EC2, ECS, Lambda, App Runner, App Service,
  # etc.); a single schema cannot cover them cleanly.
