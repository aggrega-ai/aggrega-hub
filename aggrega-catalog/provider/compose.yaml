apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: compose
  version: "1.0.0"
spec:
  # baseSchema validates Recipe valuesMapping output for sourced compose
  # files (spec.source pointing at a compose template + valuesMapping).
  # Authored as JSON Schema 2020-12 (compact-form YAML accepted).
  baseSchema: |
    type: object
    properties:
      image: { type: string }
      replicas: { type: integer, default: 1 }
      ports:
        type: array
        items: { type: string }
      environment:
        type: object
        additionalProperties:
          oneOf:
            - { type: string }
            - { type: integer }
    additionalProperties: true
  # workloadSchema: compose supports Workload synthesis. Today the field
  # acts as a presence flag (non-empty = Workload synthesis supported);
  # the body is a placeholder JSON Schema that becomes executable input
  # to Wasm translators in a future iteration.
  #
  # Compose synthesis rules:
  #   - Each Workload → one service entry in docker-compose.yaml
  #   - containers → compose service (multi-container → sidecars via
  #     additional services sharing network namespace)
  #   - volumes.*.persistent → named volume + service mount
  #   - volumes.*.configmap / .secret → bind mount of rendered file
  #   - services (K8s) → exposed ports on the compose service
  #   - replicas → deploy.replicas (swarm mode) or ignored in plain compose
  #   - probes → healthcheck block (http/tcp mapped to curl/nc, exec direct)
  workloadSchema: |
    type: object
    additionalProperties: true
