apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm-chart
  version: "1.0.0"
spec:
  # baseSchema validates Recipe valuesMapping output. The helm-chart provider
  # emits an umbrella Helm chart with one sub-chart per component (alias =
  # instance_id) whose templates consume this dict shape. Authored as JSON
  # Schema 2020-12 (compact-form YAML accepted).
  baseSchema: |
    type: object
    properties:
      image: { type: string }
      replicas: { type: integer, default: 1 }
      ports:
        type: array
        items: { type: string }
      environment:
        type: object
        additionalProperties:
          oneOf:
            - { type: string }
            - { type: integer }
    additionalProperties: true
  # workloadSchema: intentionally ABSENT. The helm-chart provider does NOT
  # support Workload synthesis — it produces an umbrella chart scaffold,
  # not rendered K8s manifests. Recipes targeting helm-chart must use
  # sourced mode (source + valuesMapping) or artifacts mode.
