apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: terraform
  version: "1.0.0"
spec:
  # Terraform provider: sourced mode only. The Recipe provides a source
  # pointing at a Terraform module; valuesMapping output becomes tfvars.
  # baseSchema is open by design — every Terraform module declares its
  # own variable surface; the values dict carries whatever the consumer
  # Recipe binds. Authored as JSON Schema 2020-12.
  baseSchema: |
    type: object
    additionalProperties: true
  # workloadSchema: ABSENT. Workload synthesis not supported — the target
  # surface (cloud resources) is too heterogeneous for a single schema to
  # cover. (Workload synthesis is a future iteration; today's contract
  # accepts only sourced and artifacts inputs.)
