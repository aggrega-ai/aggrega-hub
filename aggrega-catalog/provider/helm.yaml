apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm
  version: "1.0.0"
spec:
  # baseSchema validates Recipe valuesMapping output when the Recipe uses
  # a sourced Helm chart (spec.source + spec.valuesMapping).
  baseSchema: |
    {
      image?: string
      replicas?: int | *1
      ports?: [...string]
      environment?: {[string]: string | int}
    }
  # workloadSchema documents how the aggrega.ai/v1alpha1 Workload kind
  # translates to this provider's native output. Documentation-only today;
  # becomes executable input to Wasm translators in a future iteration.
  #
  # Helm synthesis rules:
  #   - 1 Deployment (or StatefulSet if any volume uses persistentTemplate)
  #   - 1 Service per entry in workload.services
  #   - 1 PVC per workload.volumes.*.persistent entry
  #   - ConfigMap/Secret volumes render as volume refs (source must exist)
  #   - replicas, scheduling, podSecurityContext, serviceAccount flow to
  #     the Deployment/StatefulSet spec directly
  #   - containers.*.secrets with as:env → envFrom; as:file → volume+mount
  workloadSchema: |
    // See specs/cue/workload.cue for the Workload kind surface.
    // This provider supports the full Workload grammar.
    #WorkloadSupported: true
