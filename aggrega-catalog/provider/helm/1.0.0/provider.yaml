apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm
  version: "1.0.0"
spec:
  # workloadSchema documents how the aggrega.ai/v1alpha1 Workload kind
  # translates to this provider's native output. Today the field acts as
  # a presence flag (non-empty = Workload synthesis supported); the body
  # is a placeholder JSON Schema that becomes executable input to Wasm
  # translators in a future iteration.
  #
  # Helm synthesis rules:
  #   - 1 Deployment (or StatefulSet if any volume uses persistentTemplate)
  #   - 1 Service per entry in workload.services
  #   - 1 PVC per workload.volumes.*.persistent entry
  #   - ConfigMap/Secret volumes render as volume refs (source must exist)
  #   - replicas, scheduling, podSecurityContext, serviceAccount flow to
  #     the Deployment/StatefulSet spec directly
  #   - containers.*.secrets with as:env → envFrom; as:file → volume+mount
  workloadSchema: |
    type: object
    additionalProperties: true
